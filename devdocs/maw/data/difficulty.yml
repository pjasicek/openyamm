# ---------------------------------------------------------------------------------------------------------------
# Spawn density: what AdjustMonsterDensity really does to MapStats Mon{1..3}{Low,Hi,Dif} on BeforeLoadMap
# (zzMaw-Monsters.lua:797-926). bonus = density.hi - 3. Blocks run in this order and later ones overwrite.
# ---------------------------------------------------------------------------------------------------------------
density_rules:
  - {when: "BolsterAmount <= 100", action: "restore Low/Hi from the backup (Dif is never restored)"}
  - when: "BolsterAmount == 150 or 200"
    action: "Low = max(backup Low, 1); Hi = backup Hi + 1, only for slots whose CURRENT Hi <= 3"
  - when: "BolsterAmount == 300"
    action: >-
      slots with backup Hi > 1: Low = max(backup Low, 2), Hi = backup Hi + 1;
      every slot: Dif = min(backup Dif + 1, 5)
  - when: "Mode == 2 (Doom, Insanity, Madness)"
    action: >-
      slots with backup Hi > 1: Low = max(backup Low, 2), Hi = backup Hi + 2;
      every slot: Dif = min(backup Dif + 1, 5)
  - when: insanityMode
    action: "if backup Mon1Hi > 1: all three Low = max(backup Low, 3)"
  - when: madnessMode
    action: "slots with backup Hi > 1: Low = max(backup Low, 3), Hi = backup Hi + 3"
  - {when: always, action: "map 96 (Hall under the Hill): Monster2Pic Will O Wisp, Monster3Pic Unicorn, Mon3 1-3"}
  - {when: "dimension map", action: "Hi = round(Hi x (1 + (Power x nAff + 20 x nAff) / 300))"}
  - {when: always, action: "Low = min(Low, Hi)"}
# Randomizer games skip the rules above and bake an older, denser table into the shuffle list once
# (General/zzzzMalekith-Randomizer.lua:211-375): Hard Hi+1 (if Hi <= 3); Hell Low 1->2 and Hi+1; Nightmare Hi+3, Dif+1;
# Doom Hi+4, Dif+1; Insanity all Low = 3; Madness Low = 5, Hi+6; then Doom-and-up thin out high-level families
# (divisor 18 Doom, 14 Insanity, 10 Madness on the family's B level). exp_mult still assumes the standard table.

# ---------------------------------------------------------------------------------------------------------------
# Flags and thresholds keyed on the same switches. "from" lists the first index at which the rule is on.
# ---------------------------------------------------------------------------------------------------------------
rules:
  bosses:
    enabled: "BolsterAmount >= 100 (index 3+; Easy/Normal have none)"         # zzMaw-Monsters.lua:2876
    count: "ceil((Map.Monsters.Count - 30) / 150); /60 when Mode == 2"        # :2897-2900
    special_chance_mult: {default: 1, doom: 2, insanity: 3, madness: 3}         # :3024-3026
    seeded_affixes_and_pity: "madness only (needs madnessMode and insanityMode)"   # :3030, :3115-3121
  monster_item_drop_percent_mult: {6: 0.75, 7: 0.5, 8: 0.5, 9: 0.5}           # zzMaw-Items.lua:243-247
  # zzMaw-Items.lua:552-561
  enchant_extra_power: {default: 1, true_nightmare: 1.05, doom: 1.1, insanity: 1.2, madness: 1.2}
  item_level_requirement_offset: {6: -6, 7: -9, 8: -12, 9: -12}               # zzMaw-Items.lua:4362-4370
  attacking_cancels_fly:   # Modules/MawCore/Damage.lua:317-329, flyAllowedMaps in zzMaw-Spells.lua:1018
    from: 4
    also: austerity
    except_maps: [elema.odm, elemf.odm, elemw.odm, out12.odm, outa1.odm, outa2.odm, outa3.odm, outb2.odm,
                  outb3.odm, out05.odm, out07.odm]
  melee_monsters_gain_ranged_attack:
    # zzMaw-Monsters.lua:633-658
    when: "outdoors, BolsterAmount >= 200 (index 5+), not a starting map; or any bounty map"
    starting_maps: [out01.odm, out02.odm, 7out01.odm, 7out02.odm, oute3.odm, outd3.odm]
  saving_costs_food:   # zzMaw-Monsters.lua:2140-2170
    from: 6
    food: {outdoors: 0, outdoors_enemies_near: 3, indoors: 2, indoors_enemies_near: 10}
    free_when: "map completed, or SaveKind 1"
  lloyd_and_town_portal_blocked_near_enemies: {from: 6}                       # zzMaw-Monsters.lua:2190-2203
  respawn_on_exit:
    from: 6                                                                    # zzMaw-Monsters.lua:2228-2263
    indoors_only: true
    safe_after_kill_ratio: 0.65                                                # :2785 (BolsterAmount >= 300)
    revived: "NameId = Id + 300 ('Resurrected <name>'), full HP, Exp / 4"
  death_below_negative_full_hp:   # Modules/MawCore/Damage.lua:1907-1932
    from: 6
    dead_below: "-1 x FullHP"
    eradicated_below: "-2 x FullHP"
    insanity_disintegrate_below: "-10 x FullHP (party > 1, MAWSettings enableDisintegrate)"
  doom_on_hit_conditions:
    from: 7                                                                    # zzMaw-Monsters.lua:3691-3740
    chance: "sqrt(mon.Level) x 2 %"
    unlocked_by_level:
      0: [Poison1, Poison2, Poison3, Weak, Fear]
      15: [Curse]
      20: [Disease1, Disease2, Disease3]
      30: [Paralysis]
      40: [Insanity]
      50: [Stone]
      60: [Sleep, Unconscious]
      70: [Aging]
      80: [SpellDrain]
      90: [Death]
      100: [Eradication]
  diseases_below_level_20_become_poisons: {from: 1}                           # zzMaw-Monsters.lua:3741-3747
  turn_based_move_limit: {from: 7, also: austerity, units_per_phase: 370}      # zzMaw-Monsters.lua:3664-3679
  map_completion_kill_count_mult: {6: 0.67, 7: 0.5, 8: 0.4, 9: 0.4}           # zzMaw-Monsters.lua:2716-2725
  # zzMaw-Monsters.lua:2622-2625
  map_completion_required_ratio: "0.99 ^ floor(n / 100); insanity without a respawn record: 1.0"
  no_map_refill: {outdoor_list_always: true, all_maps_from: 8}                 # zzMaw-Maps.lua:73-85
  dungeon_reset_allowed: {until: 7}                                            # zzMaw-Maps.lua:183-188
  resurrected_monsters_give_exp: {until: 7}                                    # zzzMaw_Experience.lua:172-176
  arena_and_bounty_kills_give_exp: {until: 8}                                  # zzzMaw_Experience.lua:162-167
  crit_diminishing_cap: {default: 2000, madness: 3000}                          # Formulas.lua:165-167
  learning_thresholds:
    normal: [4, 7, 10]                  # free progression, indices 1-6, and every non-horizontal skill
    horizontal_progression: [6, 12, 20] # indices 1-6 with freeProgression off
    7: [6, 12, 20]
    8: [8, 16, 25]
    9: [10, 24, 40]
  mastery_thresholds: {default: [0, 4, 7, 10], 8: [0, 8, 16, 25], 9: [0, 10, 24, 40]}
  model_promotion_level: {default: 210, 9: 330}   # Estimates.lua:248, 303
