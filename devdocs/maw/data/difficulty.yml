# draft extracted from MAW ef23ee17
# Every per-difficulty number and flag MAW uses on the monster side (plus the few player-side rules that are
# gated on the same difficulty switch). Paths are relative to Maw-Mod-MMMerge/Scripts/.
# A proposed OpenYAMM ruleset would read this instead of MAW's scattered globals; see devdocs/maw/BALANCE_MODEL.md.
format: 1
source: {repo: Maw-Mod-MMMerge, commit: ef23ee17}

# ---------------------------------------------------------------------------------------------------------------
# How a game ends up at a difficulty index
# ---------------------------------------------------------------------------------------------------------------
selection:
  # ESC -> Controls -> Extra Settings: MMMerge's "bolstering power" slider, reused
  # (General/MenuExtraSettings.lua:308-317)
  bolster_slider: {min: 0, max: 250, step: 50, default: 50}
  bolster_labels: {0: Easy, 50: Normal, 100: MAW, 150: Hard, 200: Hell, 250: "Nightmare (prompt)"}
  # 250 opens a typed yes/no question; "yes" sets vars.trueNightmare and BolsterAmount 300 for the rest of the game,
  # anything else reverts to 200 (General/zzMaw-Monsters.lua:2799-2840).
  nightmare_prompt: {slider_value: 250, accept: 300, decline: 200, irreversible: true}
  # Not a multiple of 50 -> forced to 100 (zzMaw-Monsters.lua:799-801), so bolster 70 (index 2) is unreachable.
  invalid_bolster_becomes: 100
  # Re-applied on every map load and every settings close (zzMaw-Monsters.lua:355-399):
  forced_bolster: {true_nightmare: 300, doom_or_higher: 600}
  # Party-creation "Mode" spinner (MenuExtraSettings.lua:232-302), frozen at BeforeNewGameAutosave.
  game_modes:
    normal: {menu_value: 0}
    doom: {menu_value: 2, sets: {Mode: 2}}
    road_to_insanity: {menu_value: 4, sets: {Mode: 2, insanityMode: true}}
    beyond_madness:
      menu_value: 6
      sets: {Mode: 2, insanityMode: true, madnessMode: true, freeProgression: false}
      on_first_load: "every roster character set to level 1, 0 experience, 0 skill points, every learned skill to 1"
    austerity: {menu_value: 8, sets: {Mode: 8, AusterityMode: true}}
  # Doom, Insanity and Madness only (vars.DoomPartyNeedInit, MenuExtraSettings.lua:262-291):
  new_game_bonus:
    modes: [doom, road_to_insanity, beyond_madness]
    gold_set_to: 5000
    exp_per_member: "10000 / PartyCount"
  # GetDifficulty(), General/zzMaw-Stats.lua:1507-1530. First match wins.
  index_rules:
    - {index: 9, when: madnessMode}
    - {index: 8, when: insanityMode}
    - {index: 7, when: "Mode == 2"}
    - {index: 6, when: "BolsterAmount >= 300"}
    - {index: 5, when: "BolsterAmount >= 200"}
    - {index: 4, when: "BolsterAmount >= 150"}
    - {index: 3, when: "BolsterAmount >= 100"}
    - {index: 2, when: "BolsterAmount >= 70"}
    - {index: 1, when: otherwise}
  # Austerity is not an index: it is a flag that combines with indices 1-6 (it cannot be combined with Doom+).

# ---------------------------------------------------------------------------------------------------------------
# Per-index numbers. Keys:
#   monster_hp_hits        hitToKillMonster: monster HP = expected player power x this (Estimates.lua:679)
#   monster_hp_hits_aust   hitToKillMonsterAusterity (Estimates.lua:680)
#   player_hits_to_die     hitToKill: monster damage = expected player vitality / this (Estimates.lua:459)
#   player_hits_aust       hitToKillAusterity (Estimates.lua:460)
#   density                monsterDensity {low, hi} (zzMaw-Monsters.lua:771-781); applied rule in density_rules
#   exp_mult               GetMonsterExpMult = sqrt(mean(index 3) / mean(index)), mean = (low+hi)/2 (:788-795)
#   model_drop_density     DROPS_DENSITY_BY_DIFFICULTY, the balance model's loot-seen factor (Estimates.lua:192-202)
#   rarity_weight_mult     rarityDifficultyMult (zzMaw-Items.lua:604-614)
#   rarity_band_mult       rarityBandMult {epic, rare, uncommon} (zzMaw-Items.lua:655-665)
#   cc_cost_mult           getCCDiffMult (zzMaw-Spells.lua:1352-1364); x2.5 more under Austerity
#   learning_thresholds    expert/master/GM skill needed to LEARN (zzMAW-Skills.lua:215-233) for horizontal skills
#   mastery_thresholds     masteryThresholds() used by gradual mastery values and the model (zzMaw-Stats.lua:1497-1505)
# ---------------------------------------------------------------------------------------------------------------
