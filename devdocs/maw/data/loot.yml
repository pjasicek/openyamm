level_requirement_by_drop_level:
  # GetLevelRquirement (zzMaw-Items.lua:4350, MAW 8967ae88) for stored drop level D and ladder rung r: WearLevel =
  # min(L - (10 + 0.09 L), 0.8 D) with L = D + TierLevels, TierLevels = (r-1)*3.
  # night = -6 (Game.BolsterAmount >= 300); night_doom = -6 and -3 (vars.Mode == 2); Road to Insanity /
