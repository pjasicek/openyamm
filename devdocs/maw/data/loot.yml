# draft extracted from MAW ef23ee17
#
# MAW (Might and Magic Merge mod, /home/pjasicek/github/Maw-Mod-MMMerge) loot and item rules as data, for a future
# OpenYAMM "maw" ruleset. Every value is copied from the code; `source:` gives the file:line (paths relative to the
# MAW Scripts/ folder). Nothing here is read by the engine yet. Field names are proposals.
#
# Conventions used below:
#   rarity ids   Common=1 Uncommon=2 Rare=3 Epic=4 Ancient=5 Primordial=6 Legendary=7 Celestial=8
#                (const.Rarity, zzMaw-Items.lua:574-583)
#   difficulty   GetDifficulty() (zzMaw-Stats.lua:1507-1530): 1 bolster<70 (Easy), 2 bolster 70 (Normal),
#                3 bolster 100 (MAW), 4 bolster 150 (Hard), 5 bolster 200 (Hell), 6 bolster >=300 (Nightmare),
#                7 Doom (vars.Mode==2), 8 Road to Insanity (vars.insanityMode), 9 Beyond Madness (vars.madnessMode).
#                Checked in the order 9, 8, 7, then bolster.
#   equip_stat   ItemsTxt EquipStat: 0 1H weapon (incl. Weapon1or2 spears), 1 2H weapon, 2 missile, 3 body armour,
#                4 shield, 5 helm, 6 belt, 7 cloak, 8 gauntlets, 9 boots, 10 ring, 11 amulet, 12 wand.
#                Halberds 46-50, 507, 838-840, 1638-1640 are forced to 1 at init (zzMaw-Items.lua:1412-1415).
#   item power   the MaxCharges byte ("Item Bonus Power"); item level = 5 x power (ItemLevel.lua:5).
#   enchant ids  standard (base) enchant types 1-24 = STDITEMS rows: 1 Might 2 Intellect 3 Personality 4 Endurance
#                5 Accuracy 6 Speed 7 Luck 8 HP 9 SP 10 AC 11-16 Fire/Air/Water/Earth/Mind/Body resistance,
#                17 Alchemy 18 Repair (STDITEMS says Stealing; MAW maps 18 to Repair, zzMaw-Items.lua:2642-2651)
#                19 Disarm 20 ID Item 21 ID Monster 22 Armsmaster 23 Dodge 24 Unarmed.

loot_tier:
  description: >-
    The master number of a drop. Drives rarity bands, upgrade multipliers and enchant strength.
  formula: >-
    lootTier = grade + floor(dropLevel / tier_levels) + enchantTierBonus + boss + omnipotent
    + (1 with probability (dropLevel mod 15) / 15)
  tier_levels: 15                                 # TIER_LEVELS, zzMaw-Items.lua:889; GetTier :891-893
  grade: "t.Strength, the engine treasure level 1..6 (7 is clamped to 6 in events.GenerateItem, :27-29)"
  boss_bonus: 1                                   # :1135-1137
  omnipotent_bonus: 1                             # :1138-1140
  enchant_tier_bonus:                             # GetEnchantTierBonus, :563-572
    dimension_map: "floor(max((mapAffixes.Power - 30 + 2) / 2, 0))"
    arena_d42: 20                                 # Map.Name == "d42.blv"
  source: "General/zzMaw-Items.lua:1129-1143"
  drop_level:                                     # what "dropLevel" is, per source of the item
    corpse: >-
      getMonsterLevel(mon): totalLevel[Id] (bolstered) / uniqueMonsterLevel / bossData level
      (zzMaw-Monsters.lua:1884-1895)
    chest_or_ground: "MawMapDropLevel() (zzMaw-Monsters.lua:1926-1935)"
    shop: "getTotalLevel() * 0.75 (SHOP_LEVEL_SHARE, zzMaw-Items.lua:502, :1109-1111)"
    map_drop_level: >-
      median native monster level of the map (totalLevel of currentMapMonsters[ceil(n/2)]) when the monster table is
      built for this map; else staticMapDropLevel (zzMaw-Monsters.lua:1897-1924) = ItemLevel.ForDrop(nil, P, M) =
      P*7/8 + M/8 with: map declares monsters (mapLevels.Low ~= 0): P = Low+Mid+High (the SUM), M = 0;
      horizontal progression: P = getPartyLevel(4)*0.75, M = Low+Mid+High; free progression: P = getPartyLevel()
      + reset bonus + min((MMLVL[world] + reset bonus)/2, 54), M = 0 (reset bonus = 20 per dungeon reset);
      Beyond Madness: P = madnessMapLevels[name] or ((Low+Mid+High)/3)^1.5, M = 0; dimension map:
      P = mapAffixes.Power*10 + 20.
    stored: "bits 9-19 of BonusExpireTime (0-2047), SetStoredDropLevel at generation (:1127)"
    legacy_reconstruction: >-
      GetItemDropLevel (:531-547): stored value if > 0, else MaxCharges*5 after undoing rarity inflation:
      Primordial floor(min(c/1.2, c-4)), Ancient floor(min(c/1.1, c-2)).

rarity:
  band_roll:                                      # GetEnchantChance / GetEnchantBands, :624-653
    thresholds:                                   # percent; threshold = min(Base + PerTier*lootTier, Cap)
      epic:     {base: 5,   per_tier: 0.75, cap: 20}
      rare:     {base: 20,  per_tier: 2,    cap: 60}
      uncommon: {base: 60,  per_tier: 1,    cap: 80}
      common:   {base: 100, per_tier: 0,    cap: 100}
    band_widths: "Epic = E, Rare = R-E, Uncommon = U-R, Common = 100-U, each x band_mult, renormalised to 100"
    band_mult_by_difficulty:                      # rarityBandMult, :655-665 (missing entries = 1)
      1: {epic: 1, rare: 1, uncommon: 1}
      2: {epic: 1, rare: 1, uncommon: 1}
      3: {epic: 1, rare: 1, uncommon: 1}
      4: {epic: 1.5, rare: 1.4, uncommon: 1.4}
      5: {epic: 2,   rare: 1.8, uncommon: 1.6}
      6: {epic: 2.5, rare: 2.2, uncommon: 1.8}
      7: {epic: 3,   rare: 2.6, uncommon: 2}
      8: {epic: 4,   rare: 3,   uncommon: 2.2}
      9: {epic: 5.5, rare: 3.4, uncommon: 2.4}
    roll: "one uniform roll in [0,100), walked Epic -> Rare -> Uncommon -> Common (:1144-1159)"
    boss_roll_divisor: 4                          # BOSS_ROLL_DIVISOR, :601; roll = random()/4 for bosses
  upgrade_cascade:                                # RollItemRarity, :782-820; only when the band roll gave Epic
    order: [celestial, legendary, primordial, ancient]   # first success wins
    base_chance: {celestial: 0.002, legendary: 0.03, primordial: 0.04, ancient: 0.12}   # rarityUpgradeChance :585
    chance: "pity_chance(base, counter) * mult (Ancient has no pity counter)"
    mult: >-
      rarityDifficultyMult[d] * min(60 + lootTier, 80)/80 * sqrt(lootMultiplier) * (2 if boss)
      * (1 + (mapPower*nAffixes + 20*nAffixes)/400 on dimension maps)   (GetRarityMultiplier :757-780)
    difficulty_mult: {1: 1, 2: 1, 3: 1, 4: 1.1, 5: 1.2, 6: 1.4, 7: 1.6, 8: 1.8, 9: 2}   # :604-614
    boss_mult: 2                                  # BOSS_RARITY_MULT, :602
    loot_multiplier: "LootContext.multiplier: never set by any caller, always 1 (dead parameter)"
    pity:
      function: "pity_chance(c, n) = 1 if c >= 1 else c ^ (1.38 - c*n*0.5)"   # :4467-4478
      exponent: 1.38
      counters: {primordial: vars.primordialPityCounter, legendary: vars.legendaryPityCounter,
                 celestial: vars.celestialPityCounter}
      reset: "set to 0 when that rarity is rolled"
      growth: >-
        after the cascade every rarity above the result that was not blocked gains +mult (:810-818);
        blocked = shop and no redirect, or noLegendary and rarity >= Legendary
    no_legendary: "Austerity mode or a shop: Legendary and Celestial base chance 0 (:1160)"
    shop_redirect:                                # shopRarityRedirect, :592-597
      celestial: blocked
      legendary: blocked
      primordial: blocked
      ancient: "rolls at the Primordial base chance 0.04, no pity"
    omnipotent: "forces Celestial after the cascade (:1164-1166)"
  analytic_distribution: "GetRarityDistribution (:835-851); not repeated here, see RANDOMS.md"
  stored_as: >-
    not stored; derived by MawItemRarity (:691-715): celestial bit > legendary affix > tier bits (2 Primordial,
    1 Ancient) > enchant count (3 Epic, 2 Rare, 1 Uncommon, 0 Common)

enchants:
  count_by_rarity: {common: 0, uncommon: 1, rare: 2, epic: 3, ancient: 3, primordial: 3, legendary: 3,
                    celestial: 3}               # enchantCountByRarity, :676-685
  slots:
    base_enchant_1: "rarity >= Uncommon (:1171-1183)"
    base_enchant_2: "rarity >= Rare (:1185-1195); stored in Charges bits (enc2), type 0-63, strength 0-65535"
    special_enchant: "rarity >= Epic and EquipStat < 12 (:1206-1223)"
    promote: "if enchant 1 is empty and enchant 2 exists, enchant 2 moves to slot 1 (:1197-1200)"
  type_roll:                                      # RollEnchantType, :880-887
    rings: "uniform 1..16 (EquipStat 10, the six resistances included)"
    other_slots: "uniform 1..10"
    second_enchant: "excludes the first enchant's type"
    skill_enchant:
      chance: 0.1                                 # math.random(1,10)==10, first enchant only (:1174-1182)
      types: "uniform 17..24, replaces the type, keeps the rolled strength"
      swaps:
        - "Dodge (23) on Chain or Plate body armour (Skill 10/11) becomes Armsmaster (22)"
        - "Unarmed (24) on weapons with Skill 1..7 becomes Armsmaster (22); staves (Skill 0) keep Unarmed"
      second_enchant_skill: "disabled (commented out, :1189-1194)"
    resistance_cleanup:
      - "enchant 1 resistance (11-16) on a non-ring is re-rolled to 1..10 (:1304-1306; unreachable, see notes)"
      - "enchant 2 resistance is always re-rolled to 1..10, rings included (:1307-1310)"
    duplicate_cleanup: >-
      if enchant 1 and enchant 2 have the same type (both <= 16), enchant 1 is re-rolled in 1..10 (or 11..16 if it
      was a resistance) until different (:1312-1322)
    per_slot_weights: "none: uniform. equipSlotWeights (:4375-4388) is defined but never read"
    stditems_slot_chances: "ignored; MAW never uses the STDITEMS per-slot columns"
  strength:
    encStrUp:                                     # :444-458
      normal: "1 + 2*tier for tier <= 12; 25 + min((tier-12)*3, 75) above (max 100 at tier 37)"
      austerity: "tier + 2 for tier <= 30; 32 + (tier-30)*2 above (no cap)"
    roll: >-
      rarities with a range entry (Legendary, Ancient, Primordial, Celestial):
      round(ceil(encStrUp(lootTier)*diffPower) * random(Min, Max) / 20);
      Common..Epic: ceil(round(encStrUp(lootTier) * random(8, 20) / 20) * diffPower)   (rollEnchantStrength :466-475)
    ranges_per_20:                                # enchantStrengthRange / ENCHANT_STRENGTH_DEFAULT, :667-674
      common_to_epic: [8, 20]                     # 40-100 %
      legendary: [16, 20]                         # 80-100 %
      ancient: [20, 25]                           # 100-125 %
      primordial: [25, 25]                        # 125 %
      celestial: [25, 25]
    divisor: 20
    both_base_enchants_roll_independently: true   # enc2 rolls its own strength (:1186)
    sync: "if |enc2 - enc1| <= 1 after slot multiplier, enc2 = enc1 (:1296-1299)"
    primordial_max: "round(ceil(encStrUpNormal(inf)*diffPower) * 25/20) = 125 at diffPower 1 (:477-480)"
  difficulty_power:                               # GetDifficultyExtraPower, :552-561; first match wins
    insanity_or_madness: 1.2                      # vars.insanityMode (also set in Beyond Madness)
    doom: 1.1                                     # vars.Mode == 2
    true_nightmare: 1.05                          # vars.trueNightmare
    default: 1
  skill_enchant_transform: >-
    ceil(max(sqrt(x), x/10)) applied to enchant 1 before the slot multiplier (:1256-1258, Formulas.lua:21-23)
  slot_multiplier:                                # slotMult, :1405; applied to both base enchants at generation
    by_equip_stat: {0: 1, 1: 2, 2: 1.25, 3: 1.5, 4: 1, 5: 1.25, 6: 1, 7: 1, 8: 1.25, 9: 1.25, 10: 0.75, 11: 1}
    rounding: "enchant 1 ceil(s*mult); enchant 2 s*mult clamped to 65535 and floored by the encoder (:1260-1266)"
    two_handed_axes: "items with Skill 3 and EquipStat 1 count as EquipStat 1 (GetItemEquipStat :4390-4404)"
    no_ac_helm: >-
      GetSlotMult (:4407-4425) adds x1.5 for helms with Mod2 == 0 (hats, crowns); it is applied on READ
      (collectEnchant :2728-2730, tooltip Tooltip.lua:261-263, 282-284), not at generation
  read_transforms:                                # applied when stats are computed, not stored
    hp_sp: "round(p * (1 + min(p/50/slotMult, 5)))  (Formulas.vitalityEnchantPower, Formulas.lua:25-30; :2724-2726)"
    resistance: >-
      enchant 1: p + 10; enchant 2: p (no +10); rings: value*100/200 (half); the result is kept as the max per
      element over all items (vars.normalEnchantResistance, :2743-2750) and applied as damage x 1/(1 + r/100)
      (Formulas.enchantResistanceDamageTaken); legendary 16 multiplies it by 1.5 (zzMaw-Stats.lua:1120-1123)
    skill: >-
      only from enchant 1; added to the skill (slot skill+50); for skills 0-38 the total (base + items) is capped
      at 2x the base skill level, so an untrained skill (0) gets nothing from items (:2605-2611)
    dragon_race: "all item stats 1-16 and slots 82/83 x3 for Dragon portraits (applyDragonMult :3003-3015)"
    legendary_12_echo: >-
      Might/Accuracy enchants add 40% to Int and Pers; Int/Pers enchants add 40% to Might and Acc (:2733-2742)
  special_enchant_pick: "see special_enchants.yml (pools by grade, melee/caster swap, legendary 19 swap)"

item_power:
  field: "MaxCharges (u8); item level = 5 * power"
  power_for_level: "min(floor(max(level, 0)/5), 100)  (ItemLevel.PowerFor, ItemLevel.lua:18-21)"
  power_cap: 100                                  # POWER_CAP: the damage model never reads more
  hard_cap: 255                                   # POWER_HARD_CAP (u8); GetMaxItemCharges / GetItemChargesCap
  roll:                                           # rollTierCharges, zzMaw-Items.lua:512-525; c = PowerFor(dropLevel)
    common_to_epic: "round(c * random(12, 20)/20)"
    legendary: "round(c * random(16, 20)/20)"
    ancient: "max(round(c * random(20, 24)/20), c + 2)"
    primordial: "max(round(c * 1.2), c + 4)"
    celestial: "max(round(c * 1.2), c + 4)"
    cap: 255
  every_drop_rolls: true                          # :1168-1169, after rarity is known
  doom_start_items: >-
    starting enchantable items with MaxCharges 0 get 2 (4 in insanity), item 2020 excluded (:4537-4552)
  new_game_reset: >-
    MaxCharges, Charges and BonusExpireTime of starting inventory zeroed; Bonus > 24 cleared (:2421-2441)
  moon_cloak: "items 1349 and 1350 have MaxCharges forced to 0 on every stat refresh (:3397-3400)"
  what_it_drives:
    - "weapon damage (weapon_damage model below, capped at power 100)"
    - "armour AC (armour_ac model below, NOT capped at 100)"
    - "special-enchant scaling (chargesStatMult, school and meditation skill, damage specials)"
    - "attack speed of weapons (attack_speed below)"
    - "value (value below)"
    - "level requirement only through the legacy reconstruction (stored drop level is used when present)"

weapon_damage:
  description: >-
    Base weapon damage ignores the table's dice sides and Mod2. Only the dice COUNT is read from ITEMS.txt.
    Artifacts use ladder rung 6, the party total level as item level, and their base multiplier.
  model:                                          # getWeaponDamageForLevel, Modules/MawCore/Estimates.lua:98-139
    base_dice_damage: 8                           # WEAPON_BASE_DICE_DAMAGE
    tier_flat_damage: 16                          # WEAPON_TIER_FLAT_DAMAGE
    flat_per_power: 2                             # WEAPON_FLAT_PER_POWER (even points)
    dice_per_power: 2                             # WEAPON_DICE_PER_POWER (odd points)
    power: "min(PowerFor(itemLevel), 255) -> effectively min(floor(level/5), 100)"
    flat_power: "floor(power/2)"
    dice_budget: "8*2 + 2*2*(power - flatPower)"
    flat: "16*(rung-1)/5 + 2*flatPower"
    one_handed: "dice budget and flat halved (everything except EquipStat 1 and two-handed axes)"
    rows: >-
      GetWeaponDamageRows (zzMaw-Items.lua:4585-4593): attack/flat bonus = flat; sides = dice budget / dice count;
      both x artifact base multiplier x cube quality (1 + q/100)
    shown_range: >-
      GetWeaponDamageMinMax (:4598-4603): bonus = round(flat), sides = round(sides), min = count + bonus,
      max = count*sides + bonus; the tooltip prints "Attack: +bonus  Damage: min-max"
    skill_multiplier: "added later in addWeaponRows (:2812-2947): x(1 + skill*skillDamage[skill]/100), see COMBAT.md"
  ladder:                                         # ItemLevel.LadderTier, ItemLevel.lua:23-52
    description: >-
      Contiguous runs of the same NotIdentifiedName in ItemsTxt form a family. Member k of a run of n+1 sits on rung
      1 + k/n*5 (1..6); a family with one member sits on 3.5. Item 67 is renamed "Mace" and 804 "Longsword" before
      the ladder is built (zzMaw-Items.lua:406-407).
    tier_levels: "TierLevels = (rung-1)*3 extra levels for the level requirement (ItemLevel.lua:54-59)"
  init_rewrites:            # zzMaw-Items.lua:1410-1436; they change the table text only, not MAW damage
    weapons: >-
      ids 1-83, 803-865, 1603-1665: Mod1DiceSides = ceil(goal*2/diceCount), Mod2 = round(flat) with goal 8 and
      flat = tier flat, both halved unless the unidentified name is Two-Handed Axe/Sword/Halberd or Skill 0
    shields: "Skill 8 items outside those ranges: Mod2 = Mod2*2 + Mod1DiceCount"
    halberds_two_handed: [46, 47, 48, 49, 50, 507, 838, 839, 840, 1638, 1639, 1640]

armour_ac:
  formula: >-
    AC = (Mod1DiceCount + Mod2) + round(referenceAC * MaxCharges/40), only when MaxCharges > 0, x cube quality,
    x1.5 with legendary 28 (collectArmorAC, zzMaw-Items.lua:2692-2717; Formulas.chargesArmorAC Formulas.lua:291-294)
  reference_ac: >-
    Mod2 + Mod1DiceCount of the LAST item in the contiguous NotIdentifiedName run (the top rung), computed after the
    shield doubling (:2614-2640)
  applies_to: "Skill 8-11 (shield, leather, chain, plate) and Skill 40 (misc) with EquipStat != 12"
  artifacts: "AC = ac + round(referenceAC * PowerFor(partyTotalLevel)/40), then ceil(x baseStatMultiplier)"
  not_capped: "MaxCharges is used directly: Primordial drops (120) and crafted items keep growing past power 100"
  skill_scaling: "armour/shield skill multiplies the summed item AC (addArmorSkillAC :2963-3000), see COMBAT.md"

attack_speed:
  base_recovery: {dagger: 60, sword: 80, mace: 100, bow: 100, staff: 120, spear: 120, axe: 140, blaster: 40}
  source: "General/zzMAW-Skills.lua:25-35"
  item_recovery: >-
    round10(base * (0.75 + min(itemLevel, 600)/500)); EquipStat 1 then round10(x*1.25)
    (getItemRecovery, zzMAW-Skills.lua:424-440). Axes (Skill 3) use the axe row. Clubs (Skill 39) and other
    skills: 100, no level scaling. round10(v) = round(v/10)*10.
  item_level_cap: 600                             # ITEM_RECOVERY_LEVEL_CAP
  damage_compensation: >-
    final delay = base * speed multipliers; melee/ranged damage multiplier = totalSpeed/speedBefore, i.e.
    base/100, so a slow weapon hits proportionally harder (zzMAW-Skills.lua:596-608). Dual wield averages the bases.
  swiftness_specials: >-
    41 Darkness and 59 Swift: swiftness +0.3 on a 2H weapon or bow, +0.15 per one-handed weapon, added up;
    attack delay is divided by the sum (zzMAW-Skills.lua:448, :463-465, :492-498, :567)
  tooltip: "Attack Speed: <recovery/100> appended to the type line (Tooltip.lua:716-723)"

level_requirement:
  formula: >-
    L = storedDropLevel + TierLevels(rung); req = L - (10 + 0.09*L); -6 if bolster >= 300; -3 Doom (vars.Mode==2);
    -3 insanity; floor; min 1 (GetLevelRquirement zzMaw-Items.lua:4351-4373, ItemLevel.WearLevel ItemLevel.lua:70-75)
  guard_margin: 10
  margin_per_level: 0.09
  exceptions:
    non_equipment: "EquipStat > 11: 0"
    celestial: 1
    artifacts: "none: CanWearItem only checks IsEnchantableItem (base items)"
  enforced: "events.CanWearItem (:4130-4142) against the wearer's LevelBase (not LevelBonus)"
  doom_unidentified: "Doom: unidentified items cannot be worn (:4132-4134)"
  also_required_by: "gems and Pandora's Cube (crafting, see CRAFTING.md)"

celestial:
  definition: "Primordial tier + legendary affix + celestial bit (:1228-1254)"
  rescale_on_read: >-
    updateCelestialItem (:1622-1661): lvl = min(wearer LevelBase, 1.2*getTotalLevel()); tier = lvl/11 + 5
    (madness: min(lvl, 500)/11 + 5); strength = math.round(ceil(encStrUp(tier)*diffPower) * mult * slotMult),
    mult 1.25 when the item is Primordial (always true for a rolled Celestial); enchant 1 = strength (skill
    enchants round(strength/10)); enchant 2 = min(strength, 65535); MaxCharges = GetPrimordialCharges(lvl)
  writes_the_item: "yes: called from itemStats and the tooltip, so the stored fields change (do not copy)"
  tooltip_cap_text: "scales to level 600 (1000 in madness) (Tooltip.lua:706-711)"
  level_requirement: 1

boss_rules:
  boss_definition: "NameId > 220 (and <= 300) or NameId == 160 (zzMaw-Items.lua:268); seeding uses 220..299 (:166)"
  drop_chance: 100
  broodling_variants: {strong: 30, mid: 10, weak: 4}   # Id % 3 == 0 / 2 / 1, PlaceMon skill "Broodling" (:270-279)
  grade: "lvl/20 + 2, fraction rolled as a chance, clamped 2..6; lvl = max(base level, map Low) or uniqueMonsterLevel"
  loot_tier_bonus: 1
  band_roll_divisor: 4
  rarity_mult: 2
  special_pool_max_grade: 6                       # non-bosses stop at 5 (:1209)
  non_enchantable_drop: "re-rolled with Item:Randomize(t.Strength, 0) through the same handler (:978-986)"
  omnipotent: {loot_tier_bonus: 1, forced_rarity: celestial}   # PlaceMon skill "Omnipotent" (:295-298)
  resurrected: "NameId > 300: drop % / 4 (rounded), gold dice sides / 4 (min 1) (:265-267)"
  chest_artifacts: >-
    chest items in mawArtifacts with MaxCharges 0, ItemsTxt Value >= 20000 and BonusStrength 0 are re-rolled as
    boss loot at strength 6 every AfterLoadMap (:4523-4536); mawArtifactsKeep is entirely commented out
    (:4489-4521), so quest artifacts in chests are replaced too

monster_drops:
  source: "events.PickCorpse, zzMaw-Items.lua:161-327"
  variant_tier: "Id % 3: 1 weak (tier 1), 2 mid (tier 2), 0 strong (tier 3)"
  regular:                                        # Item == 0 and not a boss (:231-261)
    drop_percent: "ceil(sqrt(mon.Level) * (1 + tier) * 0.5 + min(origPercent, 50) * 0.3)"
    doom: "x0.5 (rounded)"
    bolster_300: "x0.75 (rounded); not combined with Doom (elseif)"
    grade: >-
      itemTier = (max(base level of the mid variant, mapLevels.Low) + 10*tier)/20, fraction rolled as a chance,
      floor, clamp 1..6 -> TreasureItemLevel; if itemTier <= 0 the drop % is multiplied by 2^(itemTier-1)
    any_type_chance: 0.7                          # TreasureItemType = 0 (any item kind)
  monster_level_for_loot: "getMonsterLevel(mon) (LootContext.set, :304-308)"

gold:
  monster_dice:                                   # :210-228
    target: "(bolsterLevel2 + lvl) * 7.5; x0.5 weak, x2 strong; lvl = BLevel[Id] or mon.Level"
    rule: >-
      only when the monster already had gold and target > current average: DiceCount = DiceSides = min(sqrt(target),
      255)
  chest_gold:                                     # once per map, mapvars.chestGoldFix (:903-928)
    item_ids: [187, 188, 189, 197, 198, 199, 999, 1000, 1001, 1799, 1800, 1801]
    amount: "10 * (mapLevel + bolsterLevel) * {1, 2, 4} * (0.66 + random()*0.66)"
    map_level: "(Low + Mid + High)/3 of mapLevels"
    bolster_level: "madnessMapLevels[name] in madness; mapAffixes.Power*10 + 20 on dimension maps"
    size_by_id: "(index in the list - 1) % 3 + 1 -> 1, 2, 3 where 3 counts as 4"
  loot_filter_gold: "0.4 x item value (see loot_filter)"

value:
  source: "getItemValue, zzMaw-Items.lua:1920-2009 (events.CalcItemValue :1897-1918)"
  applies_to: "enchantable base items; reagents, skill books 971-979 and shop crafting prices have own rules"
  formula:
    base: "ItemsTxt.Value"
    enchant_1: >-
      BonusStrength*100; HP/SP (8, 9): 5*(sqrt(2*s + 100) - 10)*100; AC (10): x2; skills (17-24): s^2*100
    enchant_2: >-
      s*100; HP/SP: 5*(sqrt(2*(s*100) + 100) - 10) (no *100, and fed the already multiplied value: bug); AC: x2;
      no skill branch
    power_mult: "MaxCharges/20"
    base_price_bonus: "ItemsTxt.Value * MaxCharges/20"
    special: >-
      v = SPCITEMS Value (x MaxCharges/20 when the special has a bonusEffects entry); v < 11 -> basePriceBonus *= v
      (and x2.5 more when v == 10); else basePriceBonus += v. Only when 0 < Bonus2 <= SpcItemsTxt.high and the
      item carries rarity data or BonusExpireTime < Game.Time
    total: "Value + basePriceBonus + enchant_1 + enchant_2; x2.5 with a legendary affix"
  shop_buy: >-
    HouseScreen 2 or 95: value^(1 + 0.08*count), count = enchants present + max(ancient tier, 2) when the item has
    an ancient tier (Ancient counts as 2, Primordial 2)
  elsewhere: "value * 0.4 (sell price base, loot filter, tooltip Value)"
  rounding: {above_200000: 1000, above_50000: 500, above_1000: 100, above_100: 10}
  reagents: "value = round(base*((Bonus*0.75)/20 + 1) + Bonus*0.75)*10, shown as 'Power: N' (:1901-1905)"
  skill_books_971_979: "value of the contained book ItemsTxt[BonusStrength].Value (:1909-1911)"

shops:
  stock_generation: "same ItemGenerated path; dropLevel = getTotalLevel()*0.75; no artifact substitution (:1007)"
  rarity: >-
    no Legendary/Celestial/Primordial; Ancient at the Primordial base 0.04 without pity; shop Ancient priced as tier 2
  crafting_materials:                             # :1036-1095, misc shops (house id <= 110), not in Austerity
    trigger: "stock item with EquipStat >= 12 at 30 % chance, or EquipStat 19 always"
    special_item_chance: "min((PartyGold/20000000)^0.7, 1)"
    special_item_weights: {1061: 7, 1062: 7, 1063: 15, 1064: 2, 1065: 5, 1066: 7, 1067: 3, 1070: 15}
    gem_fallback: >-
      1041 + min(floor(getPartyLevel(4)/25) (+2 at 5 %, +1 at 25 %), 15)  (GEM_DROP_MAX_TIER 16, zzAlchemy.lua:713)
  reroll:                                         # refreshItems, :3922-3984; key R (82) in HouseScreen 2/95
    houses: "house id < 110 (isRedone remap +2 above 35 and +2 above 75)"
    party_level: "getPartyLevel(4) - min(MMLVL[world]/2, 54)"
    strength: "min(floor(MMLVL[world]/18) + 2, 5)"
    cost: "(floor(partyLevel/15) + strength)^2 * 250 gold; nothing happens if the party cannot pay"
    per_slot: >-
      12 slots; before each slot, if random(1,18) < MMLVL[world] % 18 then strength = min(strength+1, 5)
      (cumulative across slots); armour/shield slots Randomize(strength, random of const.ItemType {31 Leather,
      32 Chain, 33 Plate, 34 Shield_, 5 Shield}) (shopArmors :3929), other slots
      Randomize(strength, random of vars.shopType[house]); every rerolled item is identified
    shop_kinds: >-
      vars.shopType[house] = distinct EquipStat+1 of current stock except armour, shield, EquipStat 19 (:3999-4046)
    stale_message: "'Press R to refresh new items (20000 gold)' shown on every shop open; the price is wrong (:4012)"
  merchant_overflow_fix: >-
    any member with Merchant > 15 or mastery >= GM: House.Val = 1 and merchant skill result 100 (:3992-4010)
  doom_services: "identify price IdRepSt^2, repair House.Val 5 (:4188-4202)"
  spell_books: >-
    MM7/MM8 tiers 1-11: 100, 200, 300, 500, 1000, 2000, 4000, 6000, 8000, 10000, 15000; MM6 tiers 1-13: 100, 200,
    300, 300, 500, 500, 1000, 2000, 4000, 6000, 8000, 10000, 15000; items 477-498 x2; selected books 20000-100000;
    insanity shops x5 (tiers 5-7), x10 (8-10), x20 (11) (:2194-2325)
  crafting_buy_prices: {1041: 1000, 1042: 2000, 1043: 4000, 1044: 7000, 1045: 12000, 1046: 20000, 1047: 30000,
    1048: 40000, 1049: 50000, 1050: 60000, 1051: 80000, 1052: 100000, 1053: 120000, 1054: 140000, 1055: 160000,
    1056: 180000, 1057: 200000, 1058: 230000, 1059: 260000, 1060: 300000, 1061: 1250000, 1062: 750000,
    1063: 325000, 1064: 6668999, 1065: 2000000, 1066: 1000000, 1067: 3000000, 1070: 250000}   # reagentPrices :2011
  crafting_base_values: >-
    gem tier i: i*1000; 1061 30000, 1062 20000, 1063 15000, 1064 100000, 1065 60000, 1066 25000, 1067 80000, 1068
    200000 (:2233-2243)
  special_items:                                  # Modules/MawCore/SpecialItems.lua
    always_identify_and_repair: true
    sell_when: "ItemsTxt Value > 0, and for Material 3 or quest-bound items only after the quest is done"
    quest_bound: {516: "QBit 128", 539: "QBits 1540/1541", 540: "QBits 1543/1544", 541: "QBit 1545 or award 29",
                  1342: "QBits 1564/1565", 1344: "QBits 1586-1589", 2118: "award 79", 2119: "award 57"}
    prices_for_zero_value: {516: 20000, 539: 20000, 540: 20000, 541: 20000, 1439: 2500, 2118: 2500, 2119: 2500,
                            2199: 2500}
    sell_once: "516, 539 (seer bit 199), 540 (200), 541 (201), 1439, 2118, 2119, 2199; the seer bit is cleared on sale"

loot_filter:
  setting: >-
    MAW SETTINGS 'Loot Filter': OFF, Common, Uncom., Rare, Epic, Ancient, Primordial (zz_Maw-initialize.lua:569)
  item_power: "1 + number of enchants (1..4); Ancient 5, Primordial 6, Legendary 7, Celestial 8 (:1324-1343)"
  threshold: "filter index (Common 1 .. Primordial 6, OFF 0); an item with power <= index is filtered"
  monster_drops: >-
    only drops from a corpse (lootFromMonster): the item is deleted (Number = 0) and getItemValue(it)*0.4 gold is
    added next tick with "You found N gold! (<tier> <unidentified name> filtered)" (:1345-1364)
  chests: >-
    once per map (mapvars.lootFiltered, :930-970): filtered base items become gold items
    {1799, 999, 187, 1800, 1000, 188, 1801, 1001, 189}[min(power*2 - random(0,1), 9)] holding the 0.4x value
  never_filtered: "Legendary and Celestial (no setting reaches 7)"

other_loot_hooks:
  ground_and_chest_potions: >-
    potions 264-289 in chests and on the ground become a random 252-263 on LoadMap (:4450-4465)
  isRedone_chests: >-
    when the 'Redone' map pack is present: chest and ground base items with MaxCharges 0 are Randomize(clamp(
    floor(mapLevel/20) + 1, 2, 6), EquipStat+1) once per map (:4321-4348)
  reagents: "reagent drops get Bonus = round(min(dropLevel, totalLevel)/3), /8 in Austerity (:1115-1123)"
  artifact_substitution: "0.5 % with pity; see artifacts.yml"
  telepathy: "CastTelepathy sets the same seeds, so it previews the real drop (:329-356)"

seeding:
  save_seed: "vars.seed = os.time() on first use"
  monster_seed: >-
    per map: mapSeed = vars.seed + sum(byte(name,i)*i*13) + MapStatsIndex*47; monster i: Game.RandSeed advanced
    from mapSeed + i*97 by 50 + (i % 20) Rand() calls (:357-403); the advanced seed is stored back after looting
    (:319-325)
  insanity_seed: "per monster type: start vars.seed + Id*1009, LCG a=1664525 c=1013904223 m=2^32 per kill (:33-61)"
  boss_seed: >-
    abs(vars.seed + sum(byte*i*31) + MapStatsIndex*97 + index*1337 + Id*2003 + BossSeed[index]) % 2147483647 (:64-91)
  per_item_number: >-
    vars.SeedList[0..2500] = i*1e9 + random(0, 999999999); math.randomseed(SeedList[id]) per generated item, then
    replaced (:987-996)

