  - grant_item: {item_id: 103, roll_level: 100, seed: 12, equip: off_hand}
  - grant_item: {item_id: 98, roll_level: 100, seed: 13, equip: armor}
  - console: {line: "ruleset banks 0 60 0 0"}
  - load_map: {map: out02.odm}
  - console: {line: "ruleset mapmonsters /tmp/maw_solo_validation/val_mapmonsters.tsv"}
  - console: {line: "actor kill 200000"}
  - console: {line: "hp full"}
  - console: {line: "player sheet"}
  - console: {line: "hp show"}
  - spawn_actor: {monster_id: 87, near_party: true}
  - party_attack: {actor_index: last, count: 300, report: true}
  - console: {line: "actor kill 200000"}
  - spawn_actor: {monster_id: 86, near_party: true, count: 1}
