      start_map: out02.odm
      ruleset: {id: maw, difficulty: nightmare, progression: free}
      party:
        gold: 0
        food: 50
        members:
          - name: Lone
            class: Champion
            level: 100
            might: 60
            intellect: 15
            personality: 15
            endurance: 60
            accuracy: 50
            speed: 50
            luck: 30
            skills:
              - {name: Sword, level: 30, mastery: 4}
              - {name: Shield, level: 25, mastery: 4}
              - {name: PlateArmor, level: 25, mastery: 4}
              - {name: Armsmaster, level: 30, mastery: 4}
              - {name: Bodybuilding, level: 20, mastery: 4}
