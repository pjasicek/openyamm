# MAW's starters are the start area and its first dungeons (out01+d05, 7out01+7d28+7d06+7d29, oute3+6d01+6d02):
# horizontal progression keeps them at the free-progression level instead of about 2.5x the band.
horizontal_starter_maps: [bootcamp.blv, isleofashes.blv, beethoven.blv, anskramkeep.blv]

# Beyond Madness: M = round(500 (position / 34)^1.2) along the route below (MAW's formula, data/map_levels.yml),
# the two starting maps at 4. Cities (no monsters), Dungeon of Secrets, Hall of the Gods and The Arena are left out
# (they fall back to the horizontal rules with the party bolster). Route: act 1, the early clans, the clans' other
# regions with their side dungeons, the late side dungeons, the war, the finale.
