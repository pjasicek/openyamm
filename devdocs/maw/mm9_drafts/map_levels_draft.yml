# DRAFT: MAW monster level bands for the 44 MM9 (Chedian) maps, in rulesets/maw/data/map_levels.yml's format.
# Not installed. Scale: MAW's own MM6-MM8 bands (start 3-6, early regions 10-20, middle 20-45, late 45-70, last
# dungeons 80-100), with MM9's acts placed on the MAW bands of the MM7 stage the MM9 balance equates them with
# (devdocs/mm9_rework/BALANCE_PLAN.md section 1: acts at party levels 6/17/33/51/64 against MM7's 6/21/37/54/68).
# Natives = B rows of the map_stats encounter pictures (columns Mon1-3 Pic), sorted by B level into low/mid/high;
# other families are pulled halfway into [low, high]. Each comment: standard act, MM9 original level range
# (INVENTORY.md), natives -> slots, and the resulting B levels 'free / horizontal' for a party with no banks
# (simulated from resolveMawMonsterLevels; * = native). Cities have no encounter pictures, so the Progress tab skips
# them; their band only sets the loot/drop fallback and any scripted spawns.

bands:
