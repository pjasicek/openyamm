# MU-6 dungeon graph, a review file for phase 5 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
# `mix` is the placed monster list by row (level, count); kill XP per member = sum of L(L+10) x count / 4 (MAPS §0).
# DD-10C's Act V update (lane A8, session 11, 2026-11-21). The layout is the Act III graph
# (`act3_graphs/dd10c.graph.yml`) as approved by D-27 (`act3_a8_decisions_b.md`: "layout as drawn; moves to Act V at
# D6's lower band, D6's own families, 20 monsters, treasure 5") and as BUILT in scratch (`briefs/dd10c/L4/NOTES.md`,
# `output/studio_cal/dd10c/`: 6 sectors, 10.94 M units², 3 doors, 1 chest, audit 0/0). This file changes only what
# phase 5 adds: the monsters on gen.py's 20 marked spots, the live exit to D6's north adit, the map row's Act V
# numbers, and the roach nest's story now that D-27 took the roaches out. The geometry is not redrawn.
# Source: dark maze0039 Gemstone Mines (one 32 x 32 map with four gem quarters; text aaze0039).
