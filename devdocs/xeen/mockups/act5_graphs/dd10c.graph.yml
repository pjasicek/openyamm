open_questions:
  - q: "The mix on gen.py's 20 spots (14 commoner 'a', 6 heavier 'b'). MAPS §0 names Floating Eye, Terrible Eye and Patrol; gen.py has two slots (a, b)."
    options: ["(a) a = Floating Eye 40 (14); b = Terrible Eye 50 (4: cavern 2, grotto 1, nest 1) and Patrol 50 (2: the lava gallery and the collapse, the drifts nearest the adit): 11.50k, 0.0 %. gen.py gains a third slot 'c' for the two Patrol spots (two lines)",
