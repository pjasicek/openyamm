role: "Q-D17 The Chalice of Protection: the voice ('Wht d y sk?', answer 'Chlc', q-d17.voice) opens the chalice room (q-d17.chalice). Dark route: swear the Voweless oath at the order's plaque (q-d17.oath, oath_again): the Chalice goes back to the knights, two Energy Disks, Cavaliers to Black Knights and Crusaders to Villains. Light route: the Chalice to Bosco (DD-25). After M30 the roof trapdoor leads one way up to D7 (d7.roof_dd08, D-58)"
