lines:
  - {text: "Exit the Knight's Tower?", ref: "dark/aaze0069:0", where: "room:gatehouse (the exit preset's meaning, D-24)"}
  - {text: "A plaque reads: \"In honor of the Grand Order of Voweless Knights\"", ref: "dark/aaze0069:2", where: "room:hall_of_arms (the founder's statue, hover) and room:chapter_hall (the oath plaque, via q-d17.oath's fail_text)"}
  - {text: "Where to? / The mirror does not respond.", ref: "dark/aaze0069:3, :5", where: "room:west_gallery (the dead mirror)"}
  - {text: "The book is blank but for one page with the letters: \"Lt slpng dgs l\" So say the Voweless Knights. / A blank line underneath awaits your answer. / The book slams shut in disgust...your answer must have been wrong.", ref: "dark/aaze0069:8, :18, :10 (and :11; aaze0070:2, :5; aaze0071:2, :5, :7)", where: "the seven lecterns"}
  - {text: "A note under the pillow reads: In life, to appreciate the highs one must experience the lows.", ref: "dark/aaze0069:15", where: room:dormitory0}
  - {text: "A disembodied voice thunders through your brain, \"What do you seek?\"", ref: "dark/aaze0072:2", where: "room:antechamber (before the prompt)"}
  - {text: "That's not why you are here! Study your lessons.", ref: "dark/aaze0072:7", where: "room:antechamber (any answer but Chlc or Chalice)"}
  - {text: "Very Good! Lv Lng nd prspr!", ref: "dark/aaze0072:5", where: "room:antechamber (proposed to A3 for q-d17.voice's text)"}
  - {text: "Emotion Throne / Euphoria Throne / Throne of the Dunce / You feel depressed. ... You feel euphoric! (rescaled) / You're not worthy!", ref: "dark/aaze0072:8-12, :21-25", where: room:thrones}
  - {text: "You find a note under the pillow that reads: Cliff Notes Lesson 1: EEEIOIE ... Lesson 7: IIEEEOEEEOUIE", ref: "dark/aaze0072:14-20", where: "room:east_dorm (1-4), room:west_dorm (5-7)"}
  - {text: "The Voweless knights leave vowels out of their writings. Their questions never change from year to year, so here is a compilation of the answers ...", ref: "dark/aaze0037:5", where: "not in this map: Librarian Ormond's bound compilation, Castleview (D1; A3/A4)"}
open_questions:
  - q: "Count and split of the group. MAPS: DD-08 + DD-21 60 monsters at 40-62, Sandro 65, 39.6k; DD-08 is M (45-75)."
    options: ["(a) 45 at M's floor: 33 Slayer Knights, 12 Death Knights, 31.14k; DD-21 about 15 + Sandro and about 10k: the group about 60 + Sandro and 41.1k (+3.9 %)",
              "(b) 50 (five more Slayers on L1-L2): 34.24k, the group 44.2k (+11.7 %)",
              "(c) 40 (under M's floor, a NOTES exception): 28.05k, the group 38.05k (-3.9 %)"]
    recommend: "(a)"
    depends: "A2 (Act V recount); DD-21's graph (its share)"
  - q: "The source's Doom Knight 75 among the thrones (the dark knights' C tier, over the band 40-62)."
    options: ["(a) not placed: a Death Knight 55 in his place (D-4: no monster over the band); Doom Knights stay FD-04's",
              "(b) one Doom Knight 75 in the Hall of Thrones: +0.70k (31.84k, group +5.7 %), over the band",
              "(c) a named knight-commander boss row at 62 (A2, hp_x 3, a skin by S)"]
    recommend: "(a)"
    depends: "A2"
  - q: "One family only. The source has nothing but knights; 45 knights in two tiers may read alike."
    options: ["(a) knights only, as the source and MAPS's 'Slayer, Death and Doom Knights'; the floors differ by their rooms and the Death Knights' share rising (0, 3, 4, 5)",
              "(b) four Onyx Sentries 62 (11585) as 'animated armour' on the armoury stands in place of four Slayers (+1.99k)"]
    recommend: "(a)"
    depends: "A2 (where), S"
  - q: "The seven proverb books (source: +500,000 experience each, per character)."
    options: ["(a) once per book for the party (map qbits 117641-117647): 1,000 experience per member, 7k for all seven; the answer is the whole proverb or its vowels in order",
              "(b) the same, once per character (seven player bits, A3)",
              "(c) +1 to a different statistic per book, once per character (+7 in all)",
              "(d) lore only, no reward"]
    recommend: "(a)"
    depends: "A3 (texts, ORIGINAL_LINES rows), A2 (Act V ledger)"
  - q: "The thrones (source: four Emotion Thrones give a condition each, then the Euphoria Throne gives +2 levels and +5 to all seven statistics)."
    options: ["(a) the four lows give Weak, Drunk, Afraid and Insane to the party (cured as usual) and set map variables; the Euphoria Throne with all four set gives +1 to all seven statistics once per character (player bit) and clears them; the Throne of the Dunce 50 damage",
              "(b) as (a) with +2 to all seven (XD-08's juices give +14)",
              "(c) dressing only: the lines and the conditions, no reward"]
    recommend: "(a)"
    depends: "A3 (player bit, texts), A2 (Act V ledger)"
  - q: "The voice's answers. A3's hooks take 'Chlc' (Bosco says it); the source took the vowels 'aie', answered the plain word 'Chalice' with 'Have you learned nothing...' and anything else with 'Study your lessons.'"
    options: ["(a) 'Chlc' calls voice; 'Chalice' calls voice_wrong; anything else gets aaze0072:7 (map-local)",
              "(b) as (a) and 'aie' also calls voice (the source's answer, the books' vowel form)",
              "(c) 'Chlc' calls voice, everything else voice_wrong"]
    recommend: "(a)"
    depends: "A3 (the map-local line; q-d17.voice text could use aaze0072:5)"
  - q: "The knights and the oath. q-d17.oath's text says 'The knights come out of the walls ... hand you two humming disks'; by then most knights are dead, and the dark knights row is also FD-04's."
    options: ["(a) DD-08's placed knights and its rest encounters in their own faction xeen_voweless_knights: hostile, friendly from oath (113344) on (the D-37 pattern of a faction changed by a qbit); four hidden peaceful 'Voweless Knight' figures (a placed-only row, uncounted) in the chapter hall's niches shown by the oath and on every later load",
              "(b) the four figures only; the faction stays hostile",
              "(c) neither: the text alone"]
    recommend: "(a)"
    depends: "A2 (the faction and the peaceful row: the characters block is full at 11923, an id from A2), S (the figures' skin: the mm6_kni dark tiers with a white tabard)"
  - q: "The stair core. The source's stairs alternate so each floor is crossed."
    options: ["(a) a split core: the great stair L1-L2 and the Stair of Silence L3-L4, with the west and east wall stairs between L2 and L3 (a loop; the critical path crosses L2 and L3)",
              "(b) one continuous core stair through all four floors (the wall stairs as a second way): faster, most fights skippable"]
    recommend: "(a)"
    depends: "A8 at L1"
  - q: "The source's two Energy Discs on L4's walls."
    options: ["(a) not placed: the tower's two disks are the quest's (Bosco's or the knights', M18's 'the four towers, 2 each'); the brackets in the chalice room stay empty",
              "(b) two loose disks as finds (the count before Act VI rises by two)"]
    recommend: "(a)"
    depends: "A3 (disk ledger)"
  - q: "Rest encounters."
    options: ["(a) 10 % from the Slayer and Death Knights (D-39), friendly after the oath under 7 (a)", "(b) 0"]
    recommend: "(a)"
    depends: "A2"
