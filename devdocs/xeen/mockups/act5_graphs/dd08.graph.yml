# MU-6 dungeon graph, a review file for phase 5 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
# `mix` is the placed monster list by row (level, count); kill XP per member = sum of L(L+10) x count / 4 (MAPS §0).
# The source's Northern Tower (dark maze0069-0072, four 16 x 16 levels round a central cell; text aaze0069-0072): the
# Voweless Knights' tower. Seven books show a proverb with its vowels taken out and ask for the answer (+500,000
# experience each); armour, helms and shields hang on the walls; on L1 a founder's statue with the order's plaque, a
# dead mirror and a pillow note ("to appreciate the highs one must experience the lows"); on L4 a voice asks "What do
# you seek?", the chalice behind it, four Emotion Thrones round the Euphoria Throne, the Throne of the Dunce, seven
# beds with the "Cliff Notes" (the books' vowel answers) and the trapdoor to the Skyroads. The stairs alternate
# (L1-L2 at the south, L2-L3 at the north, L3-L4 at the south), so every floor is crossed. Monsters: Slayer Knights
# and Death Knights (23 and 11) and one Doom Knight among the thrones.
# Ours: ONE BLV, four floors stacked round a central stair core (WORLD_DESIGN §6), 448 apart (0, 448, 896, 1344).
# The core's great stair joins L1-L2 and its upper flight (the Stair of Silence) L3-L4; between L2 and L3 the climb
# goes round through two stairs in the thickness of the west and east walls (the source's alternation, a loop).
