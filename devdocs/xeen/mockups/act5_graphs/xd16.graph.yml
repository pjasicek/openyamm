# MU-6 dungeon graph, a review file for phase 5 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
# `mix` is the placed monster list by row (level, count); kill XP per member = sum of L(L+10) x count / 4 (MAPS §0).
# The source's Volcano Cave (xeen maze0046-0048, three 16 x 16 levels; text aaze0046-0048): level 1 holds the demon
# skull (0,15) and the devil skull (9,9), three demons or three devils by each, the six chests of the south-east
# corner of which five explode (13-15, 14-15) and one more chest (15,11), the way in (6,1) and the stair down (12,0);
# level 2 four wall switches round one cell (11-13, 11-13) that each move a wall on the way south, the stair down
# (3,0); level 3 the central lava chamber with the way to Shangri-La at (9,10), which reads the two skull flags.
# 25 demons and devils in all. Ours is one BLV of three floors going down into Mount Firestone from the mouth at its
# west foot (X7 thing:xd16_mouth).
format: mu6-0
map: XD-16
key: xd16
name: Volcano Cave
stands_on: X7 Mount Firestone (the cave mouth at the mountain's west foot, between the demon and devil idols)
class: M
band: "M: 20-45 sectors, 30-90 M units², 45-75 monsters, 3-7 chests, 6-16 doors (MAPS §0: 40 monsters for XD-16; open question 1)"
size: "24 review rooms, about 30 sectors (the fire lake and the magma heart three each, the lever hall and the glass caves two); floor 0 about 4,200 x 3,600, floor -1 about 3,600 x 2,800, floor -2 about 4,000 x 3,200: about 38 M units² with the lava; 7 doors (the vault door, the demon shrine's iron door, the four gate slabs, the way's rock)"
party: [48, 52]
monsters:
  levels: [42, 58]
  boss: null
  count: 40
  groups: [2, 3]
  families:
    - "Demons (11630): Demon 42 (20), Devil 50 (14), Screamer 58 (6): the source's demons and devils ('where: Volcano Cave'), the Screamers kept for the lower floors. No boss (MAPS §0); the two skulls' guards are three demons and three devils, as in the source"
  mix:
    - {row: Demon, id: 11630, level: 42, count: 20}
    - {row: Devil, id: 11631, level: 50, count: 14}
    - {row: Screamer, id: 11632, level: 58, count: 6}
  kill_xp: "27.34k per member (109,344 / 4)"
  kill_xp_target: "26.6k (MAPS §0, 40 monsters): +2.8 % (open question 1)"
  by_floor: "floor 0: 18 (Demon 12, Devil 6); floor -1: 12 (Demon 6, Devil 5, Screamer 1); floor -2: 10 (Demon 2, Devil 3, Screamer 5)"
treasure: {level: 5}
role: "Q-C26 Shangri-La: smash the demon skull and the devil skull (q-c26.demon_skull, q-c26.devil_skull; 5,000 each, the source's 250,000 MM6-MM8 sized by A3); the second sets q-c26.done and the way at the bottom of the cave opens into Shangri-La (q-c26.way, XD-17)"
role_short: "Q-C26, the two skulls, the way to Shangri-La"
set_piece: "The fire lake: a tall cavern round a lake of lava lit from below, the devil skull on its black altar on an island in the middle, reached by a causeway of cooled crust; the demon skull in its shrine beyond. Below, the magma heart: the lava pool at the root of the mountain, a ring ledge round it, and in the last cave beyond it a wall of bare rock, hot to the touch, that grinds open when both skulls are broken"
sounds: "the shipped lava bubbling and fire roar placed at the lake and the heart; a rock grinding for the way (shipped stone door); the skulls' breaking from A3's texts (shipped crack and scream, AU optional); music 7 (maps.yml)"
textures:
  family: "Caves (dungeon_families, D-45): MM7 Thunderfist 7d07's dark brown-black rock c2b on walls and roofs, cfb1 floors, DIRT and 7dirttyl for the ash floors, 7d07's Lava on the lake, the heart and the river (`floors: lava`: it burns), Ch1b1 and cwb1 for the shrines' worked stone, 7solid01 and t5d1 for the slabs and doors, trim9_32 on the altars"
  cap: 45
  planned: 16
  new: 1
  new_list: "xvskull: the black altar's carved face (demon on one, devil mirrored on the other: one picture, fitted once per altar face); optional, the altars can be bare Ch1b1"
  distinct_from: "DD-23 Gargoyle Lair (Darkside, the same 7d07 rock and snow, no lava: D-45 says XD-16 is 'lava, and the same dark rock on the other face'); XD-03 Deep Mine (7d34 dwarf rock and 6d18 forge lava, soot brick); XD-18 Dragon Cave (X7, MM8 d17)"
