     what: "q-c26.demon_skull (112520): the source's question at the altar (aaze0046:0), Yes calls the hook (5,000, A3's text); the skull's destructible breaks and stays broken (shown broken on every later load by the bit). Sets done if the devil skull is already broken.", opens: [], draw: false}
  - {id: state:devil_skull, kind: qbit, where: room:devil_isle,
     what: "q-c26.devil_skull (112521): the same at the island's altar (aaze0046:1).", opens: [], draw: false}
