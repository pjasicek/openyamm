open_questions:
  - q: "Count and mix. MAPS §0 gives XD-16 40 monsters at 42-58 and 26.6k; the M band's floor is 45. The source has demons and devils only (25)."
    options: ["(a) 40 of the demons family: Demon 42 x 20, Devil 50 x 14, Screamer 58 x 6: 27.34k, +2.8 %; one NOTES exception for the M floor (as DD-07's 30, D-39)",
              "(b) 45 (five more Demons on floor 0): 30.07k, +13 %",
              "(c) 36 demons and 4 Lava Golems 55 (11593, X7's) in the lava rooms: 28.73k, +8 %"]
    recommend: "(a): the source's families, inside 10 %, MAPS's count"
    depends: "A2's Act V recount"
  - q: "The exploding chests (the source's five of six in the south-east corner, 250 damage each, nothing inside)."
    options: ["(a) five trap chests and one real T5 chest on the dais; the traps show a faint ember glow and smoke (a pulsing light under each) so a careful party can tell; a burst does fire damage 50 on each member once ('The chest explodes!'), then 'The chest is empty.'",
              "(b) the same with no tell: the source's gamble",
              "(c) six ordinary chests with the engine's chest traps (high trap level) and loot"]
    recommend: "(a): the source's joke kept, readable, and never a guess the game does not answer"
    depends: "nothing (event damage and map qbits exist)"
  - q: "The gate stones (the source's four wall switches round one cell on level 2, each moving a wall on the way south)."
    options: ["(a) four lever stones round a pillar in the lever hall, each with hover text naming its slab, each lowering one of four slabs in a row across the gate run; one-way (D-43)",
              "(b) one lever, one slab",
              "(c) no gates: the gate run open"]
    recommend: "(a): the source's puzzle at its plainest; four of the map's seven doors"
    depends: "nothing"
  - q: "The way into Shangri-La (A3: 'a door or a lava bridge, A7's choice')."
    options: ["(a) a rock slab at the last cave's end that stands open whenever q-c26.done is set (the map's load event; the skulls are two floors up, so it is open when the party comes down); a short cool passage beyond, its end calling q-c26.way and moving the party to XD-17's entrance:xd16_way; XD-17's way back arrives at entrance:xd17_way",
              "(b) a bridge of cooled crust that rises out of the heart's pool on done (a lift), to a ledge exit",
              "(c) no door: the exit at the bare wall, the hook's fail text until done"]
    recommend: "(a): A3's 'rock grinds on rock'; doors and exits that exist"
    depends: "A5's XD-17 (entrance:xd16_way and its way back)"
