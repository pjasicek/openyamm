# MU-6 dungeon graph, a review file for phase 5 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
# DD-25 is a TOWN BLV, not a dungeon: 0 monsters, no kill XP, no chests, no rest encounters. Its graph is the walking
# lines between the map door, the six house doors (A4's source/towns/dd25.yml, 4701-4706) and the King's hall. The six
# `house:` boxes are house screens (a clicked door face opens the MM6-MM8 house dialog), not walk-in rooms: no geometry
# behind them.
# The source has no hall: Bosco the Dwarf King stands on the Desert of Doom itself (dark maze0013, cell (1,8), his
# lines aaze0013:13-17: the seer, the Chalice of Protection, "I dub thee royal taste tester", "My halls will always be
# open to you"). WORLD_DESIGN §5.2 gives him a small dwarf hall dug into the D5 highlands (smith, tavern, Earth guild,
# 2 residences + the King). Ours: ONE BLV, the shipped precedent is MM7's Stone City 7d24, whose town quarter (the
# octagonal hall with its timber house fronts, the King's throne room behind; sectors 4, 5, 11, 12, 15, 27-29, 31-34)
# holds 9 services, 8 residences and the Throne Room (an EnterHouse inside a walk-in hall) in 12 sectors and about
# 14 M units². Six doors want about half of that plus the walk-in throne hall.
# Frame: x east, y north, z 0 = the gate's sill (D5's 2688); the gate in the east wall (D5's door faces east), the
# hall running west into the crag. The throne hall stands 128 up (steps), the Deep Guild 384 down (one stair).
format: mu6-0
