treasure: {level: 0}
role: "Q-D17 The Chalice of Protection: Bosco (5401) in the King's Hall (house 4704, a residence so his A3 topics show) gives the Northern Tower's key (113341, started 113340) and takes the Chalice (12525) back (done 113343: 'I dub thee royal taste testers', two Energy Disks, 5,000 gold, award 457). Services: Bosco's Forge (W, quality 4, axes and maces), the Alehall (tavern), the Deep Guild of Earth; teachers Axe, Chain, Earth Magic and Repair Item Grandmaster"
role_short: "Q-D17 (Bosco), 3 services, 4 Grandmasters"
set_piece: "The throne hall: Bosco's empty throne on a three-step dais under his banner (xdbosban, once per face), the long tasting table along the north wall with a row of cups and the taster's stool, braziers standing on the floor; the King's Hall door (house 4704) behind the dais. The great hall's round hearth (a dressing set piece the walking lines pass either side of) is the town's square"
sounds: "music 31 (maps.yml); shipped indoor bed (stone hall hum); a shipped anvil ring looped low at the forge bay; the Alehall's murmur at its door (shipped tavern crowd, quiet); AU optional: distant hammering under the hall"
