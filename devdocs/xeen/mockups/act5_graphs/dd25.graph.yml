size: "14 review boxes: 8 rooms (about 12 sectors: the great hall, the smiths' gallery and the throne hall two each, the guild stair one) and 6 house screens (no geometry). Floor about 9.9 M units² (great hall 2,048 x 1,536; throne hall 1,536 x 1,280; Deep Guild hall 1,280 x 1,024; gallery 2,048 x 512; the rest small). 8 doors: the gate and the throne hall's doors as two-leaf pairs (4 leaves), 6 house doors (clicked faces with one door picture each, no movers)"
