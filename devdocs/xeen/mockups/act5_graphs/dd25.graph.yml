lines:
  - {text: "Bosco / The Dwarf King", ref: "dark/aaze0013:13", where: "house:kings_hall (his name and title on the house screen; A4's title 'Dwarf King')"}
  - {text: "Recently, my tribal seer told me I will die by imbibing a poison drink. ... I do have the key to the tower, which I'll give you. If you bring me the Chalice, I will reward you well.", ref: "dark/aaze0013:14", where: "house:kings_hall (A3's opening Chalice topic, adapted; A4's greeting 'A seer says ...', close)"}
  - {text: "Please get the Chalice. I live in fear for my life.", ref: "dark/aaze0013:15", where: "house:kings_hall (A3's started state, verbatim start)"}
  - {text: "Oh, thank the Gods! You have the Chalice. For saving my life, I dub thee royal taste tester and give you this treasure.", ref: "dark/aaze0013:16", where: "house:kings_hall (A3's hand-in; MAPS D5's original line; the +1,000,000 experience rescaled to A3's 14,000)"}
  - {text: "Ah, the taste testers! Please, please, sit down and drink with me for awhile! My halls will always be open to you.", ref: "dark/aaze0013:17", where: "house:kings_hall after q-d17.done (proposed, open question 5)"}
open_questions:
  - q: "Size of a town BLV with six doors (no precedent in the graphs). MAPS 'small BLV'; WORLD_DESIGN §5.2 3 services and 2 residences + the King; Stone City's town quarter 12 sectors, about 14 M units² for 18 doors."
    options: ["(a) about 12 sectors, about 9.9 M units², 8 doors (gate and throne hall two-leaf, 6 house doors), one loop, a walk-in throne hall and the guild one stair down: inside S's figures",
              "(b) Stone City's octagon alone: one great hall with all six house fronts round it, about 6 sectors and 6 M units², no walk-in throne hall, no loop",
              "(c) about 18 sectors and 15 M units², with four more closed dwarf house fronts ('Nobody answers.') to reach TOWN_FEEL 5c's 6 residences"]
    recommend: "(a)"
    depends: "A4 (towns.py residences: WORLD_DESIGN's 2 plus the King's Hall), A8 at L1"
  - q: "The King's Hall: walk-in or a house front?"
    options: ["(a) a walk-in throne hall (the set piece) with the house door door:kings_hall behind the dais: Stone City's Throne Room pattern (EnterHouse 216 bound inside its walk-in hall); the throne stands empty, Bosco is in the house screen",
              "(b) a house front on the great hall like the other five (two sectors fewer, no set piece)",
              "(c) as (a), plus Bosco as a placed talking actor on the throne (monsters[].npc 5401; a peaceful placed-only row and a dwarf king body from A2 and S)"]
    recommend: "(a)"
    depends: "A4 (the door id stays door:kings_hall), A2/S only under (c)"
  - q: "Townsfolk. A town reads empty without people; Xeen has no peaceful dwarf row (the characters block is full at 11923)."
    options: ["(a) eight peaceful dwarves standing, uncounted: two gate guards and two throne guards on the engine's Dwarf A rows (MM7's allied dwarves), four townsfolk on the engine's Peasant Dwarf rows; none on a walking line",
              "(b) the four guards only",
              "(c) none: the house screens are the people"]
    recommend: "(a)"
    depends: "A2 (rows or stand-ins and their faction: friendly), A4 (street townsfolk are its placement)"
  - q: "Texture family. The dwarf families are taken: XD-02 6d05/6d09, XD-03 7d34/6d18, XD-09 7d24's rock hub."
    options: ["(a) MM7 Stone City 7d24's town quarter: its dressed cwb, trim1_32 frieze and the timber house fronts (hdr1b, hdm2b, hdp1b, hhm1rf) that no Xeen map uses; the other face from XD-09 and an act apart; 24 of 30, 1 new",
              "(b) MM8 Dark Dwarf Compound d41 (grey and black stone under plank ceilings, unused in Xeen) with 7d24's house fronts for the six doors (two sources)",
              "(c) MM6 Snergle's Iron Mines 6d09: the same kin as XD-02's halls (carved d7 friezes, d7dor doors)"]
    recommend: "(a)"
    depends: "A6 (dungeon_families: add DD-25; register xdbosban)"
  - q: "Bosco's fifth source line, aaze0013:17 ('Ah, the taste testers! ... My halls will always be open to you.'), unused by A3 and A4."
    options: ["(a) his greeting once q-d17.done is set (A4's greeting by qbit, if the format has one; else (b))",
              "(b) the first sentence of the Chalice topic's done state, before A3's 'I drink from it every morning.'",
              "(c) not used"]
    recommend: "(a)"
    depends: "A3, A4"
  - q: "The Chalice after the hand-in."
    options: ["(a) a stage by qbit: from q-d17.done a shipped goblet decoration on the tasting table (load event)",
              "(b) nothing in the map"]
    recommend: "(a)"
    depends: "A8 at L3 (a shipped goblet), S only if none fits"
  - q: "The hall after the Voweless oath (q-d17.oath: Bosco's topic says 'Get out.')."
    options: ["(a) no change in the map: the King's Hall still opens, his topic carries it; the services stay open",
              "(b) the throne hall's doors refuse from oath on ('The guards cross their axes. The King will not see you.'), a condition on the two leaves"]
    recommend: "(a)"
    depends: "A3"
  - q: "The great hall's well (TOWN_FEEL §7: 0-3 boon wells in town; D5 already holds the Fountain of Might and the Last Water)."
    options: ["(a) a plain well, no boon: 'Cold and clean. The King had it tasted this morning.' (new line)",
              "(b) no well: the hearth only",
              "(c) a boon well, +5 Earth resistance once per character (a player bit)"]
    recommend: "(a)"
    depends: "A3 (the line)"
