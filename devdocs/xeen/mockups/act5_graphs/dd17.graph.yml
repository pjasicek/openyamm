lines:
  - {text: "Exit Castle Alamar?", ref: "dark/aaze0049:0", where: "room:gatehall (the exit preset's meaning, D-24)"}
  - {text: "The statue speaks as you approach: I am the statue dedicated to honoring Alamar's efforts to protect Terra from interference from the Ancients. ... / ... Alamar's skillful rulership ... / ... Alamar's glorious vengeance against the Ancients ...", ref: "dark/aaze0049:2-4", where: "the three propaganda statues, one per floor (hall_order, north_walk, west_hall), shortened by A3"}
  - {text: "I am the statue dedicated to honoring Alamar's true name. It is: kdkiendlshj**:and dugli (crackle)...", ref: "dark/aaze0049:5", where: "room:island, the crackling statue (verbatim)"}
  - {text: "The Head speaks: \"Fire power field operational.\" (Air, Water, Earth)", ref: "dark/aaze0049:6-10", where: "the four Lava Heads (hover 'Lava Head')"}
  - {text: "Fire Time / Air Time / Earth Time / Water Time. The sundial reads N. Turn?", ref: "dark/aaze0050:1-16", where: "the four sundials (Xeen.alamarSundial)"}
  - {text: "The time is not right. Access denied! / The time is right. What is Alamar's true name? / Access approved! / Wrong! Access denied!", ref: "dark/aaze0050:17-21", where: "the true-name gate (m33 texts)"}
  - {text: "Access to the upper floor is denied!", ref: "dark/aaze0050:0", where: "the lift before gate_open, from either end"}
  - {text: "XEEN Power Juice / +5 levels (permanent).", ref: "dark/aaze0051:0-1", where: "room:juice; the label kept, the effect rescaled (DECIDE 9)"}
  - {text: "A voice bellows, \"Come to ME!\"", ref: "dark/aaze0051:2", where: "room:west_hall, a step plate once"}
  - {text: "Command Central", ref: "dark/aaze0051:3", where: "Command Central's door hover"}
  - {text: "You Fools!", ref: "dark/aaze0051:4", where: "not placed: the source's line without the box; the refusal is A3's voiced line (D-38)"}
open_questions:
  - q: "1. Conveyor halls. No floor-current word exists (devdocs/map_studio PLAN §4 lists conveyors as a mechanism still to add; none in the studio)."
    options: ["(a) a one-way ride: a step plate at the belt's mouth ('The floor lurches and carries you along.') moves the party in-map to the belt's far end (evt.MoveToMap within the map, facing along the belt, the rumble loop); a plate at the far end carries anyone walking back up the belt forward again; the bolted maintenance doors (opened from the Head side) close each loop",
              "(b) the source's cell-by-cell carry: a chain of plates about 512 apart, each moving the party on to the next (maze0049's TeleportAndContinue chains); reads as being carried, but many events and camera snaps",
              "(c) A1 adds a floor-current word (a sector floor that pushes the party along a direction)"]
    recommend: "(a): existing words only; the source's point (carried one way into the Head's room) kept"
    depends: "A1 only for (c); A1 confirms an in-map MoveToMap from a step plate keeps the facing given"
  - q: "2. The energy fields (MAPS 'energy fields (shields)')."
    options: ["(a) four xafield leaves (translucent ~0.5, D-51) close the four sundial alcoves on L2; each drops when its Lava Head on L1 is shut down (its question, one-way, D-43; qbits 117601-117604, stages by qbit, also on load). The Heads' own lines ('Fire power field operational.') say what they power",
              "(b) the fields close the four Head rooms instead (no L1-to-L2 chain; the dials open at once)",
              "(c) as (a), and the robots also carry monster energy shields (a new world shields.yml) while their wing's Head stands: needs an A1 word to drop shields by qbit"]
    recommend: "(a)"
    depends: "A3 (the Heads' question and 'offline' line); A1 only for (c)"
  - q: "3. The rings and bridges (the source: each dial sets which of its ring's 12 cells is solid; at nine the four solid cells line up on the west)."
    options: ["(a) one bridge slab per ring on the west line, a two-state slab (door) that stands level only while its dial reads nine (A3's helper also sets map qbits 117611-117614 per dial, the slabs as stages by qbit); the four ring lips lit in their elements' colours; a fall into a chasm drops 640 to the sump",
              "(b) the source's clock: 12 slabs per ring, the one at the reading's hour standing (48 slabs)",
              "(c) no rings: the gate alone checks the dials"]
    recommend: "(a): the puzzle reads in the room (a slab rises at nine) and Atlas says why nine"
    depends: "A3 (the helper's per-dial qbits); A1 confirms a horizontal floor slab can be a two-state door"
  - q: "4. The castle after m33.done, and D-58's two-way hatch into a castle that self-destructs (Q-D26 is level 60, after m30.done; M33 is 53, so most parties open the hatch after the castle is gone)."
    options: ["(a) DD-17 is entered only before m33.done: D6's gate is rubble with FD-01's stair (D-49); the hatch works both ways while the castle stands, its arrival also calls m33.arrival (no box: back up to D7's entrance:dd17_roof); after m33.done D7's hatch stays shut with a new line ('Below the hatch: smoke, and a long fall onto rubble. Castle Alamar is gone.'); the roof key is then a hoard trophy",
              "(b) after m33.done D7's hatch leads down into FD-01 Alamar Depths (a second FD-01 entrance; the phase-6 lane decides its spot)",
              "(c) DD-17 keeps a ruin stage after m33.done (monsters hidden, rubble blocks the L1 and L2 ways, the hatch reaches a wrecked L3 only)"]
    recommend: "(a); (b) is the better use of Q-D26's key if FD-01's lane takes it"
    depends: "A3 (q-d26.hatch reads m33.done; the D7 line; m33.arrival 'where' adds the hatch), A6 (D7), the FD-01 lane for (b), orchestrator (D-58 D-5 amended)"
  - q: "5. What Sheltem is. There is no Sheltem row; the source has no fight (its Command Central ends the Darkside game)."
    options: ["(a) a placed peaceful character row 'Sheltem' (11924, A2), hidden until the cinematic shows him on the throne, immobile, unkillable, not counted, its own look (S: a tall robed figure in teal and silver with a faceless glowing hood on an existing caster body); Corak 11912 placed hidden and shown stepping out of the box",
              "(b) the cinematic only: no figures; a light and the voices on the throne",
              "(c) a boss fight (a Sheltem row in the robots' or a new family)"]
    recommend: "(a): the voiced lines need someone to look at; (c) breaks M33 (Corak fights him)"
    depends: "A2 (row 11924), S (the look), A1 (hidden placed actors shown by an event, as D-47)"
  - q: "6. How the confrontation starts (A3's hook says 'as the party comes into his presence')."
    options: ["(a) Command Central is free to walk; a plate on the dais's first step asks 'Before the throne. Open the Soul Box?' and Yes calls m33.sheltem; the strongroom and every chest stay reachable before it", "(b) the hook on entering the room, no question"]
    recommend: "(a), as D-47's scepter 'asks first': the map is gone afterwards"
    depends: "A3 (the hook's 'where' and the question line)"
  - q: "7. Where the cinematic sets the party down."
    options: ["(a) D6's installed entrance:dd17_gate (the same point as the refusal and FD-01's stair), facing south away from the ruin", "(b) a new D6 point about 1,024 further down the approach ramp (entrance:dd17_escape), facing north so the ruin is in view"]
    recommend: "(a): no D6 change"
    depends: "A1 (a leave after evt.PlayCinematic, as XD-19's D-47 item), A6 for (b)"
  - q: "8. The trapdoor deck (the source's chequer of FallToMap cells to four L1 points)."
    options: ["(a) six hatched plates (lifts `trap`) among teal plates drop through the dial hall's chasm to the sump (1,280, fall damage); the hatched plate by the lift head has the hover 'A plate seamed like a hatch.'; a plain zig-zag crosses",
              "(b) the trapdoors drop only to a ledge in the dial hall (640)", "(c) a plain deck"]
    recommend: "(a): the seams are the answer; the fall costs hit points and a climb, not progress"
    depends: "A1 confirms a `trap` lift may drop through two floors of open air"
  - q: "9. The XEEN Power Juice (the source's +5 levels, permanent)."
    options: ["(a) 2,500 experience once per character (DD-12's Soul Waters, D-42 Q5)", "(b) +2 Might once per character (D-4)", "(c) dropped; the dispenser is dressing"]
    recommend: "(a)"
    depends: "A3 (player bits, texts), A2 (Act V ledger)"
  - q: "10. Monsters: 70 at 68.85k (+1.4 %)."
    options: ["(a) as drawn: robots 56 (Patrol 30, Annihilator 20, Autobot 6), the eight Head elementals, six Gamma Gazers",
              "(b) robots only (Patrol 34, Annihilator 28, Autobot 8: 69.50k, +2.4 %)"]
    recommend: "(a): the elementals tie the Heads to the dials, the Gazers to the castle door's line"
    depends: "A2 (Castle Alamar in the elementals' and eyes' `where`, Act V recount)"
  - q: "11. Rest encounters."
    options: ["(a) 10 % from the robots, one slot (A2 picks the Dif; at Dif 5 about 40 % Autobots, as D-46)", "(b) 0"]
    recommend: "(a)"
    depends: "A2"
