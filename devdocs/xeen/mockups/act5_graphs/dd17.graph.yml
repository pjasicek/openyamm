# MU-6 dungeon graph, a review file for phase 5 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
# `mix` is the placed monster list by row (level, count); kill XP per member = sum of L(L+10) x count / 4 (MAPS §0).
# The source's Castle Alamar Levels 1-3 (dark maze0049-0051, aaze0049-0051) as one BLV of three floors, 640 apart
# (0, 640, 1280), in the castle's own frame (x east, y north, the gate on the south wall at y -3584). L1 holds the
# gate, the Hall of Order and the source's four conveyor spirals (maze0049's TeleportAndContinue chains) ending at the
# four Lava Heads ("Fire power field operational.", aaze0049:6-10); L2 the source's four sundials at the outer corners
# and its four ring chasms round the true-name gate (maze0050: each dial sets which cell of its ring is solid; at nine
# the four line up on the west); L3 the source's chequer deck of trapdoors (maze0051's FallToMap cells), Command
# Central and the hatch to the Skyroads (maze0051 (4,8) -> Skyroad A1). Maze 52 (Castle Alamar Dungeon) is FD-01, not
# this map. Four set pieces: the conveyor works, the dial hall, the trapdoor deck, Command Central.
format: mu6-0
map: DD-17
key: dd17
name: Castle Alamar
stands_on: "D6 The Forbidden Zone (the fortress of teal Ancient steel on its mesa, ringed by the lava moat, D-49)"
class: L
band: "L: 50-75 sectors, 120-200 M units², four set pieces, §0's 70 monsters (no boss row), doors up to 25"
size: "45 review rooms, about 66 sectors (the Hall of Order, the dial hall and the deck four each; the four belts two each; Command Central three); castle about 7,168 x 7,168; floor 0 about 62, floor 1 about 50, floor 2 about 34 M units²: about 146 M units²; 24 doors (four of them xafield leaves; the inner gate, the stair hall's doors, the true-name gate and Command Central's doors as two-leaf pairs) plus four bridge slabs"
