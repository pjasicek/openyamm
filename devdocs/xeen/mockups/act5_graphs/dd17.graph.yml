treasure: {level: 5, hoard: 6}
role: "M33 Castle Alamar: the arrival without the Soul Box throws the party out (m33.arrival, Sheltem's voice the first time); four Lava Heads on L1 hold four energy fields over the L2 sundials; the four sundials to nine (Xeen.alamarSundial, m33.sundial_nine) raise the four bridges to the true-name gate; the gate asks Alamar's true name, Sheltem (m33.true_name_gate; the answer is Olympus's plaque, m31.true_name_plaque, and the Pharaoh's M28 line); the lift to L3, the trapdoor deck, Command Central: Corak out of the box confronts Sheltem (m33.sheltem, voiced), the self-destruct cinematic, the Cube of Power, out to D6. Q-D26's hatch on L3 to D7's roof (q-d26.alamar_hatch)"
role_short: "M33, Sheltem, the Cube of Power"
set_piece: "Four: the conveyor works (four belt halls on L1 that carry the party one way to four Lava Heads, each guarded by two elementals of its element; shutting a Head down drops its field on L2); the dial hall (four ring chasms round an island under the deck, a bridge slab per ring that rises only while its corner sundial reads nine, the crackling true-name statue and the gate on the island); the trapdoor deck (L3's chequer of teal and hatched plates over the dial hall's chasm: the hatched ones drop through to the sump); Command Central (Sheltem's throne on a dais under the castle's screens: the Soul Box, Corak, the self-destruct)"
sounds: "AU requests: the belts' rumble loop (one placed sound per belt), a Lava Head hum per element (stops when shut down), the field crackle (xafield, stops when a field drops), a sundial's clank per turn and a slab's grind, the gate's two chimes (approved, denied), the trapdoor clang, the self-destruct klaxon and the castle's groan for the cinematic; D-38 voices xeen_vo_sheltem_refusal (m33.arrival fail, first time only, refused_once) and xeen_vo_sheltem_corak (m33.sheltem, the three lines); music 50 (maps.yml)"
textures:
  family: "Ancient: MM6 Control Center sci-fi.blv, the main sw set (dungeon_families pods: 'DD-17 Castle Alamar, FD-01 Alamar Depths: mm6/sci-fi.blv via the ancient kit (main sw set)'; ancient.yml per_site DD-17): swll4dk main walls, swll5dk, swall1-5, swfloor2b and swflora floors, swceilf ceilings, swr2dk/swr4dk belt beds and rollers in the conveyor halls, swgirder and swaled pillars, swhorzad trims, trekscrn and swor2 consoles in Command Central, swdoora/swdoorb leaves (the inner gate, the stair hall's and Command Central's as two-leaf pairs, D-49's gate family); xafield (translucent 0.5, D-51) for the four fields; xaenergy panels behind the Lava Heads and on the sundial plinths; xahull only where the outer shell shows (the hatch's shaft)"
  cap: 70
  planned: 36
  new: 5
  new_list: "proposed names, A6 decides: xalavahd and xalavahdx (a Lava Head's face in a xaenergy panel, lit and dark; one per Head, once per face, the element shown by its light colour), xasundial (a sundial face for the four plinths, once per face), xaglyph (the true-name gate's round glyph bulkhead in the sw palette; Hesper's htbulk is the fallback, counted as new), xatrapplt (a teal deck plate seamed like a hatch, for the trapdoors; a shipped sw grate if one reads as a hatch)"
  distinct_from: "DD-22 Sheltem's Pod (the sw set with red accents swrdk2, swared, swfloor5a), FD-01 Alamar Depths (the sw set darker, swll5dk, swankdk, with xahullbn), DD-16 Corak's Pod (MM7 Lincoln 7d23), XD-19 Castle Xeen (MM8 d35 black stone and gold with the kit's machines), DD-15's lower Ancient levels (sandstone pyramid with sw rooms): Alamar is the bright teal sw set throughout, green grids lit, fields everywhere"
