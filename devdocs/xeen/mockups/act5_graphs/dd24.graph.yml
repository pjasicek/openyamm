# MU-6 dungeon graph, a review file for phase 5 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
# `mix` is the placed monster list by row (level, count); kill XP per member = sum of L(L+10) x count / 4 (MAPS §0).
# No source maze: Darkside D1 (outdoors) has Gurodel's giants, the bloody throne at (10,5) ("You search the bloody
# throne and find two energy disks.", dark/aaze0013:34) and giant lairs to destroy (:7-8). Ours is Gurodel's hall in
# D5's highlands behind his hold (A3's Q-D16): two floors for giants, the bloody throne at the top of the Great Stair
# ("The People will be waiting on the stair."). Giants assumed about 310 drawn (MM8 cyclops model 2.4 x 127.5),
# descriptor body 185 high, radius 100 (60 by D-32); openings 384 wide x 512 high, halls 768-1,024 high.
format: mu6-0
map: DD-24
key: dd24
name: Giants' Hall
stands_on: D5 Desert of Doom (the highlands, Gurodel's hold)
class: S
band: "S: at most 15 sectors and 20 M units², 15-30 monsters, 0-3 chests, 3-8 doors"
size: "11 review rooms, about 14 sectors (the longhall two, the throne hall two); about 3,600 x 2,400 on two floors 1,024 apart, about 16 M units² (giant scale); 6 doors (two of them hinged pairs)"
party: [45, 47]
monsters:
  levels: [36, 62]
  boss: null
  count: 30
  groups: [1, 3]
  families:
    - "Giants (11080 block): the People of Gurodel's household as their own rows in their own faction (D-25; A2, open question 1): Cyclops 36 (9, servants and rock-throwers), Giant 50 (17), Elder Giant 62 (4, the throne guard)"
  mix:
    - {row: "Cyclops (People's tier, A2: e.g. 11083)", id: 11083, level: 36, count: 9}
    - {row: "Giant (People's tier, A2: e.g. 11084)", id: 11084, level: 50, count: 17}
    - {row: "Elder Giant (People's tier, A2: e.g. 11085)", id: 11085, level: 62, count: 4}
  kill_xp: "20.94k per member (83,760 / 4)"
  kill_xp_target: "the group DD-16+24 is 45 monsters and 26.7k; with DD-16's 7 (4.79k) the group is 37 and 25.73k, -3.6 %"
treasure: {level: 5}
role: "Q-D16 Gurodel's Giants, the war route: the bloody throne holds two Energy Disks (q-d16.throne, 14,000); at peace the hall is open and its People friendly"
role_short: "Q-D16, the bloody throne"
set_piece: "The bloody throne: a throne of black wood big enough for four, stained dark, at the head of a hall lit through a smoke hole in the roof, up the Great Stair where 'the People will be waiting'"
sounds: "the shipped fire crackle at the longhall's trench and the throne's braziers; wind at the smoke hole; no Xeen sound needed"
textures:
  family: "No family assigned (A6): proposed MM8 Cyclops Larder d14 (open question 3): gcav1wal brown cave rock, gcst1bs1 sandstone block, gcst2flr and gston1fl floors, gcst2cel and gkp1ceil (planks) ceilings, trim9_32, t1beds/t1cabs furnishing; its lava left out"
  cap: 30
  planned: 16
  new: 2
  distinct_from: "DD-23 Gargoyle Lair (7d07 dark c2b rock), XD-23/DD-11 (troll families d13/d43), XD-27 Ogre Lair (d08, shares gcav1wal on the other face), DD-25 Bosco's dwarf hall on the same D5 (A4/A8's choice)"
floors:
  - {floor: 1, name: "The throne floor", height: 1024}
  - {floor: 0, name: "The hall floor", height: 0}
spaces:
  # floor 0 (z 0 = D5's door sill)
  - {id: room:threshold, name: Threshold, kind: hall, size: M, floor: 0, at: [1, 0], monsters: 0,
     purpose: "The arrival (entrance:d5_hold): inside the great doors (hinged pair, 384 x 512), a porch of rough rock 768 high. Quiet (D-11.3). At war, once: 'We recognize you as enemies!  Prepare to defend yourselves!' (aaze0013:33)."}
  - {id: room:longhall, name: Longhall, kind: hall, size: L, floor: 0, at: [2, 0], monsters: 7,
     population: [{row: Cyclops, level: 36, count: 3}, {row: Giant, level: 50, count: 4}],
     purpose: "The feast hall, 2,048 x 1,024, 1,024 high: tables of whole trunks, a fire trench in the floor, the People's law stone (aaze0013:26, close). Hub: the stair at its head, the side halls off it."}
  - {id: room:larder, name: Larder, kind: room, size: M, floor: 0, at: [2, 1], chest: 5, monsters: 2,
     population: [{row: Cyclops, level: 36, count: 2}],
     purpose: "A dead end with a chest: iguanasaurus haunches on hooks, barrels, a meat chest."}
  - {id: room:sleeping, name: Sleeping hall, kind: hall, size: M, floor: 0, at: [3, 1], monsters: 5,
     population: [{row: Cyclops, level: 36, count: 1}, {row: Giant, level: 50, count: 4}],
     purpose: "Heaps of furs by the walls, a hearth; the off-watch sleeping."}
  - {id: room:boulder_store, name: Boulder store, kind: cave, size: S, floor: 0, at: [4, 1], monsters: 2,
     population: [{row: Cyclops, level: 36, count: 2}],
     purpose: "The throwing rocks piled by the walls; behind them the low crack (the little ones' way up)."}
  - {id: room:crack, name: The little ones' crack, kind: corridor, size: S, floor: 0, at: [5, 1], monsters: 0,
     purpose: "A natural crack 128 wide, 256 high, climbing to the trophy gallery: too low for the giants if A2 sets their body height to about 300 (open question 5); a refuge and the loop."}
  - {id: room:great_stair, name: The Great Stair, kind: stair, size: L, floor: 0, at: [3, 0], monsters: 3,
     population: [{row: Giant, level: 50, count: 2}, {row: Cyclops, level: 36, count: 1}],
     purpose: "A straight flight 640 wide with landings, giant steps of 96 (the party's step is 128), 1,024 of headroom: 'The People will be waiting on the stair.'"}
  # floor 1 (z 1,024)
  - {id: room:landing, name: Upper landing, kind: room, size: M, floor: 1, at: [3, 0], monsters: 2,
     population: [{row: Giant, level: 50, count: 2}],
     purpose: "The stair head before the throne hall's double doors (hinged pair)."}
  - {id: room:trophies, name: Trophy gallery, kind: corridor, size: M, floor: 1, at: [5, 0], monsters: 3,
     population: [{row: Elder Giant, level: 62, count: 1}, {row: Giant, level: 50, count: 2}],
     purpose: "Skulls of iguanasaurs, griffin wings, a dwarf gate hung as a shield; the crack comes out behind it; a side door into the throne hall."}
  - {id: room:throne_hall, name: The bloody throne, kind: hall, size: L, floor: 1, at: [4, 0], set_piece: true, goal: true, monsters: 5,
     population: [{row: Elder Giant, level: 62, count: 2}, {row: Giant, level: 50, count: 3}],
     purpose: "1,536 x 1,280 under a roof 1,024 high with a smoke hole (sky: true faces at least 1,280 above the floor, D5's Darkside day preset). The bloody throne (q-d16.throne): at war two Energy Disks and 14,000; before, A3's refusal."}
  - {id: room:treasury, name: Gurodel's hoard, kind: room, size: S, floor: 1, at: [4, 1], chest: 5, monsters: 1,
     population: [{row: Elder Giant, level: 62, count: 1}],
     purpose: "Behind the throne: a dead end with the hoard chest; at peace it refuses ('Gurodel would notice.', DD-13's strongbox pattern)."}
links:
  - {id: link:thr_long, from: room:threshold, to: room:longhall, kind: open}
  - {id: link:long_larder, from: room:longhall, to: room:larder, kind: door}
  - {id: link:long_sleep, from: room:longhall, to: room:sleeping, kind: open}
  - {id: link:sleep_boulder, from: room:sleeping, to: room:boulder_store, kind: open}
  - {id: link:boulder_crack, from: room:boulder_store, to: room:crack, kind: open, label: "Low crack"}
  - {id: link:crack_trophies, from: room:crack, to: room:trophies, kind: stair, label: "Climb"}
  - {id: link:long_stair, from: room:longhall, to: room:great_stair, kind: open}
  - {id: link:stair_landing, from: room:great_stair, to: room:landing, kind: stair, label: "Great Stair"}
  - {id: link:landing_throne, from: room:landing, to: room:throne_hall, kind: door, label: "Double doors"}
  - {id: link:throne_trophies, from: room:throne_hall, to: room:trophies, kind: door}
  - {id: link:landing_trophies, from: room:landing, to: room:trophies, kind: open}
  - {id: link:throne_treasury, from: room:throne_hall, to: room:treasury, kind: door}
states:
  - {id: state:peace, kind: qbit, where: "D5, Gurodel at his hold",
     what: "Before war (or with q-d16.friends) the People's rows are friendly (A2's faction, friendly at load): the hall walkable, the throne refuses (A3's fail_text), the hoard chest refuses.", opens: [], draw: false}
  - {id: state:war, kind: qbit, where: "D5, Gurodel ('Your hall'), or Q-D12",
     what: "q-d16.war, q-d12.hostile or q-d12.camp_burned: the People long-hostile (A2's relations); the threshold's line once per war (map qbit 118090).", opens: [], draw: false}
  - {id: state:struck, kind: qbit, where: room:longhall,
     what: "At peace a blow at one of the People turns the hall (D-37's timer pattern): map qbit 118091, then A3's proposed hook q-d16.hall_attacked sets q-d16.war.", opens: [], draw: false}
  - {id: state:throne, kind: qbit, where: room:throne_hall,
     what: "q-d16.throne (requires war): two Energy Disks, 14,000, throne_searched; then 'Nothing left on it but the blood.'", opens: [], draw: false}
exits:
  - {id: exit:d5_hold, space: room:threshold, at: [0, 0], kind: both, label: "D5: the great doors",
     arrival: "entrance:d5_hold: in the threshold about 384 inside the leaves, facing into the hall",
     neighbour: "D5 (A6, not built): the hall's great doors (two leaves, 384 x 512) in the hillside behind Gurodel's fire at his hold; out by the exit preset to D5 about 512 before the doors, facing away, clear of Gurodel's spot"}
hooks:
  - {hook: q-d16.throne, space: room:throne_hall, how: "the bloody throne (clicked; once; requires war)"}
  - {hook: "q-d16.hall_attacked (proposed, A3)", space: room:longhall, how: "the map timer after a People giant is struck at peace"}
critical_path: [room:threshold, room:longhall, room:great_stair, room:landing, room:throne_hall]
return_path: [room:throne_hall, room:trophies, room:crack, room:boulder_store, room:sleeping, room:longhall, room:threshold]
loops:
  - {id: loop:crack, spaces: [room:longhall, room:sleeping, room:boulder_store, room:crack, room:trophies, room:landing, room:great_stair],
     notes: "Up the Great Stair or up the little ones' crack."}
  - {id: loop:throne, spaces: [room:landing, room:throne_hall, room:trophies], notes: "Into the throne hall by its double doors or the gallery's side door."}
lines:
  - {text: "You search the bloody throne and find two energy disks.", ref: "dark/aaze0013:34", where: "room:throne_hall (A3's q-d16.throne)"}
  - {text: "We recognize you as enemies!  Prepare to defend yourselves!", ref: "dark/aaze0013:33", where: "room:threshold (step message, once per war)"}
  - {text: "Though he denies it, Alamar's plans will ultimately destroy all creatures on Darkside.  No sane people could support a tyrant with plans such as his.", ref: "dark/aaze0013:26 (close)", where: "room:longhall (the law stone)"}
  - {text: "Greetings, little ones.", ref: "dark/aaze0013:19", where: "D5, Gurodel (A4); not placed here"}
open_questions:
  - q: "The hall at peace."
    options: ["(a) open: the People are their own rows (Cyclops/Giant/Elder tiers in faction xeen_giants_people, friendly at load, long-hostile on q-d16.war, q-d12.hostile, q-d12.camp_burned; D-25); Gurodel stays on D5 at his hold; the throne and the hoard refuse at peace; a blow turns the hall (q-d16.hall_attacked)",
              "(b) shut at peace: the great doors barred from inside until war; the ordinary giant rows",
              "(c) Gurodel inside on his throne (his talk moves from D5; at war a Giant King boss row over the band)"]
    recommend: "(a): DD-13's peace/war pattern; no new boss"
    depends: "A2 (rows, faction, relations), A3 (hook), A4 (nothing)"
  - q: "Levels and count. Giants are 36/50/62 against the band's 38-58; S holds at most 30."
    options: ["(a) Giant-heavy: Cyclops 36 x9, Giant 50 x17, Elder 62 x4 = 20.94k; the group 37 and 25.73k (-3.6 %); MAPS's DD-24 row 38-58 -> 36-62",
              "(b) capped: Giant 50 x30 = 22.5k; the group 27.29k (+2.2 %), inside 38-58",
              "(c) 38 in the hall to reach 45: over S and about +12 % XP"]
    recommend: "(a)"
    depends: "A2 (Act V recount), orchestrator (MAPS row)"
  - q: "Texture family (none assigned)."
    options: ["(a) MM8 Cyclops Larder d14: the cyclopes' own home (our giants wear MM8's cyclops): brown cave rock, sandstone block, plank ceilings, lava cut out; 2 new (one giant door wing xdgiantd, the throne's stained black wood xdthrone)",
              "(b) MM8 Barbarian Fortress d25: dirt, sandstone, timber; shares gtrlwal1/gtrlflr with XD-23's d13",
              "(c) MM7 Stone City 7d24: dressed dwarf stone, XD-09's hub"]
    recommend: "(a)"
    depends: "A6 (dungeon_families line, the two new textures)"
  - q: "Rest encounters."
    options: ["(a) 0: the hall's only rows are the People, peaceful at peace (D-39: no peaceful row in rests)", "(b) 10 % at war only (needs a qbit-switched encounter: A1)"]
    recommend: "(a)"
    depends: "A2"
  - q: "Giant body height. The descriptor body is 185 high (under the party's 160 + headroom); the drawn model about 310."
    options: ["(a) A2 sets height ~300 on the giant rows so the 256-high crack keeps them out and ceilings read right", "(b) leave 185: the crack is only a second way, giants follow"]
    recommend: "(a)"
    depends: "A2"
