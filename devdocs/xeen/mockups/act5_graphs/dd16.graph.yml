# MU-6 dungeon graph, a review file for phase 5 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
# `mix` is the placed monster list by row (level, count); kill XP per member = sum of L(L+10) x count / 4 (MAPS §0).
# The source's Escape Pod 1 (dark maze0087 + 0163, 32 x 16; text aaze0087): a narrow bow with the stasis field and its
# consoles, a midship corridor of six couches, the gun consoles at the waist, the round main hull with the hatch, the
# main power console and two alien devices at the stern. No monsters in the source. Ours lies nose-up, half sunk in
# D6's lava (MAPS): the hatch midship, the bow raised, the stern sunk and breached; the bridge door needs main power.
format: mu6-0
map: DD-16
key: dd16
name: Corak's Pod
stands_on: D6 The Forbidden Zone (the lava lake, Escape Pod 1)
class: S
band: "S: at most 15 sectors and 20 M units², 15-30 monsters, 0-3 chests, 3-8 doors (MAPS: 'few' monsters in the pod)"
size: "9 review rooms, about 11 sectors (the main deck two, the engine room two); hull about 3,200 x 1,400 on three decks (bow +256, midship 0, stern -384), about 8 M units²; 5 doors"
party: [45, 47]
monsters:
  levels: [40, 55]
  boss: null
  count: 7
  groups: [1, 2]
  families:
    - "Eyes (11570): Floating Eye 40 (3), Terrible Eye 50 (2): D6's gamma gazers, drifted in over the lava through the stern breach"
    - "Elementals (11620): Lesser Elemental 55 (2), fire, risen out of the lava into the breached engine room: MAPS's 'lava dwellers' (A2 has no lava-dweller row)"
  mix:
    - {row: Floating Eye, id: 11570, level: 40, count: 3}
    - {row: Terrible Eye, id: 11571, level: 50, count: 2}
    - {row: Lesser Elemental, id: 11620, level: 55, count: 2}
  kill_xp: "4.79k per member (19,150 / 4)"
  kill_xp_target: "the group DD-16+24 is 45 monsters and 26.7k; with DD-24's 30 (20.94k) the group is 37 monsters and 25.73k, -3.6 % (open question 1)"
treasure: {level: 5}
role: "Story M29 (logs, console, the stasis field: 'where no man has gone before' wakes Corak) and M32 (Corak takes the Soul Box and leaves with the party)"
role_short: "M29, M32: Corak"
set_piece: "The bridge: a tilted cockpit of dark hull steel and green light strips, the stasis field a column of pale light with a tall figure hanging in it, the main console beside it showing the phrase in plain words"
sounds: "shipped MM7 Lincoln hums as the bed; the stasis field's hum and a power-up whine at the main power console (AU, optional); lava bubbling placed at the breach"
textures:
  family: "Pods: MM7 The Lincoln 7d23 (A6's assign): a3b, a2b, a2d, a3bs walls, sfw7b and sfw1a floors, sfw7a and a2j ceilings, sfw2, sfw3, sfw1b trim, a2c doors, a1b pillars, sfpnlon/sfpnloff consoles; the ancient kit's xahullbn on the hatch's outer face and the breach's torn plates, xafield for the stasis field; MM8 lavtyl (the lava liquid) in the breach"
  cap: 30
  planned: 17
  new: 0
  distinct_from: "DD-22 Sheltem's Pod (MM6 sci-fi sw set, red accents) and DD-17 Castle Alamar (sw set): the Lincoln's grey hull and green strips only here"
floors:
  - {floor: 1, name: "The bow (raised)", height: 256}
  - {floor: 0, name: "Midship (the hatch)", height: 0}
  - {floor: -1, name: "The sunk stern", height: -384}
spaces:
  # floor 1, the bow
  - {id: room:couches, name: Couch row, kind: corridor, size: M, floor: 1, at: [2, 0], monsters: 2,
     population: [{row: Terrible Eye, level: 50, count: 1}, {row: Floating Eye, level: 40, count: 1}],
     purpose: "The midship corridor tilted up to the bow: six empty acceleration couches (the source's six objects), harness straps hanging; the blast door to the bridge at its top."}
  - {id: room:bridge, name: The bridge, kind: hall, size: M, floor: 1, at: [3, 0], set_piece: true, goal: true, monsters: 0,
     purpose: "The stasis field (m29.stasis, the map's prompt 'To boldly go...'), the main console (m29.console: the phrase in plain words), the two log computers (m29.log1, m29.log2) and a third with the source's log entries (open question 3). After m29.done the field is off and Corak stands by his console (m32: he talks from the console, evt.SpeakNPC(5513))."}
  # floor 0, midship
  - {id: room:airlock, name: Hatch airlock, kind: room, size: S, floor: 0, at: [1, 0], monsters: 0,
     purpose: "The arrival (entrance:d6_hatch): the hatch's inner face, warning stripes, the inner door ahead. Quiet (D-11.3). The exit preset ('Exit Escape Pod 1?', aaze0087:6)."}
  - {id: room:main_deck, name: Main deck, kind: hall, size: M, floor: 0, at: [2, 0], monsters: 2,
     population: [{row: Floating Eye, level: 40, count: 2}],
     purpose: "The round main hull: the hub. The scanning console's X.E.E.N. readout (aaze0087:22). Up the tilted corridor to the bow, down the slope to the stern, the gun deck to one side."}
  - {id: room:gun_deck, name: Gun deck, kind: room, size: S, floor: 0, at: [4, 0], chest: 5, monsters: 0,
     purpose: "Phaser and photon controls, both disarmed ('Fire anyway?' yes: 'Nothing happens.'); the weapons locker (the chest). The service crawlway's hatch in the floor."}
  # floor -1, the sunk stern
  - {id: room:stern_slope, name: Stern slope, kind: corridor, size: S, floor: -1, at: [2, 0], monsters: 1,
     population: [{row: Terrible Eye, level: 50, count: 1}],
     purpose: "A corridor sloping down into the heat, the deck plates warm, red light from below."}
  - {id: room:engine_room, name: Engine room, kind: hall, size: M, floor: -1, at: [3, 0], chest: 5, monsters: 2,
     population: [{row: Lesser Elemental, level: 55, count: 2}],
     purpose: "The breached stern: the hull torn open onto the lava (lava liquid behind a lip, never walked; torn xahullbn plates), two fire elementals risen through it. The Main Power Console ('Acivate?', aaze0087:7): yes, the power-up and the bridge's blast door opens (state:power). A stores locker (the chest)."}
  - {id: room:device_bay, name: Device bay, kind: room, size: S, floor: -1, at: [3, 1], monsters: 0,
     purpose: "A dead end with a find: the two 'strange energy devices' (aaze0087:8), the source's alien device, rescaled (open question 2); used: 'The strange alien device seems to be dormant.' (:5)."}
  - {id: room:crawlway, name: Service crawlway, kind: shaft, size: S, floor: -1, at: [4, 0], monsters: 0,
     purpose: "A ladder shaft and crawlway from the engine room up to the gun deck's floor hatch: the loop."}
links:
  - {id: link:airlock_deck, from: room:airlock, to: room:main_deck, kind: door, label: "Inner door"}
  - {id: link:deck_couches, from: room:main_deck, to: room:couches, kind: stair, label: "Tilted corridor up"}
  - {id: link:couches_bridge, from: room:couches, to: room:bridge, kind: locked, label: "Blast door", opened_by: state:power}
  - {id: link:deck_gun, from: room:main_deck, to: room:gun_deck, kind: door}
  - {id: link:deck_slope, from: room:main_deck, to: room:stern_slope, kind: stair, label: "Slope down"}
  - {id: link:slope_engine, from: room:stern_slope, to: room:engine_room, kind: door}
  - {id: link:engine_device, from: room:engine_room, to: room:device_bay, kind: door}
  - {id: link:engine_crawl, from: room:engine_room, to: room:crawlway, kind: open}
  - {id: link:crawl_gun, from: room:crawlway, to: room:gun_deck, kind: stair, label: "Ladder"}
states:
  - {id: state:hatch, kind: qbit, where: "D6, the pod's hatch",
     what: "m29.pod_door (D6's, A6): shut until m28.lava_cooled; this map holds the arrival.", opens: [], draw: false}
  - {id: state:power, kind: lever, where: room:engine_room,
     what: "The Main Power Console: 'Main Power Console. Acivate?' yes: the power-up sound, map qbit 118080 (power_on), the bridge's blast door opens and stays open on every later load. Before: the blast door's click says 'The bridge door is sealed. No power.' (its own answer-giver).",
     opens: [link:couches_bridge]}
  - {id: state:stasis, kind: password, where: room:bridge,
     what: "The field's prompt 'To boldly go...' (m29.stasis): 'where no man has gone before', with or without punctuation, sets m29.stasis_off and m29.done; any other answer m29.stasis_wrong. The answer is on the main console beside it (m29.console).",
     opens: [], draw: false}
  - {id: state:corak, kind: stage, where: room:bridge,
     what: "On load: before m29.done the field (xafield column, pulsing light) and the hanging figure; from m29.done the field off and Corak shown by his console (a peaceful placed-only row, open question 4), the console's click evt.SpeakNPC(5513); from m32.done Corak hidden (move_npc to house 0) and the console reads 'Stasis field deactivated.' (aaze0087:24).",
     opens: [], draw: false}
  - {id: state:device, kind: award, where: room:device_bay,
     what: "The alien device once per character by a player bit (A3; open question 2).", opens: [], draw: false}
exits:
  - {id: exit:d6_hatch, space: room:airlock, at: [0, 0], kind: both, label: "D6: the pod's hatch",
     arrival: "entrance:d6_hatch: in the airlock about 192 inside the hatch, facing into the pod (toward the inner door)",
     neighbour: "D6 (A6, not built): Escape Pod 1's hatch on the cooled black crust of the lava lake (the source's B2 (3,8)), the hull half sunk nose-up; m29.pod_door then the entrance preset; out by the exit preset ('Exit Escape Pod 1?', aaze0087:6) to D6 on the cooled crust about 384 before the hatch, facing away from it"}
hooks:
  - {hook: m29.pod_door, space: "D6 (A6)", how: "the hatch; listed for the pair, not placed here"}
  - {hook: m29.log1, space: room:bridge, how: "the first log computer (clicked)"}
  - {hook: m29.log2, space: room:bridge, how: "the second log computer (clicked)"}
  - {hook: m29.console, space: room:bridge, how: "the main console beside the field (clicked): the phrase in plain words"}
  - {hook: m29.stasis, space: room:bridge, how: "the field's text prompt, the right answer (once)"}
  - {hook: m29.stasis_wrong, space: room:bridge, how: "the field's text prompt, any other answer"}
  - {hook: "m32 (npc 5513: Soul Box, voiced xeen_vo_corak_soulbox; Sheltem)", space: room:bridge, how: "Corak's console, evt.SpeakNPC(5513), from m29.done until m32.done"}
critical_path: [room:airlock, room:main_deck, room:stern_slope, room:engine_room, room:stern_slope, room:main_deck, room:couches, room:bridge]
return_path: [room:bridge, room:couches, room:main_deck, room:airlock]
loops:
  - {id: loop:crawl, spaces: [room:main_deck, room:stern_slope, room:engine_room, room:crawlway, room:gun_deck],
     notes: "Down the slope to the engines, up the service crawlway to the gun deck and back to the main deck (or the other way)."}
lines:
  - {text: "A strange energy field surrounds a figure suspended within it.", ref: "dark/aaze0087:0", where: "room:bridge (the field's hover/click before the prompt)"}
  - {text: "Exit Escape Pod 1?", ref: "dark/aaze0087:6", where: "room:airlock (the exit preset's meaning, D-24)"}
  - {text: "Main Power Console.  Acivate?", ref: "dark/aaze0087:7", where: "room:engine_room"}
  - {text: "Strange energy device / The strange alien device seems to be dormant. / Your statistics have all been raised ... (rescaled)", ref: "dark/aaze0087:8, :5, :10", where: room:device_bay}
  - {text: "Phaser Control.  A status indicator on the weapon shows it to be disarmed.  Fire anyway? / Photon Control ... / Nothing happens.", ref: "dark/aaze0087:11, :12, :9", where: room:gun_deck}
  - {text: "Scanning Console ... X.E.E.N. (Xylonite Experimental Expansion Nacelle) Starseed Project ...", ref: "dark/aaze0087:22", where: room:main_deck}
  - {text: "Log Computer ... Log Entry 1-15", ref: "dark/aaze0087:13, :25-31", where: "room:bridge, the third log computer (open question 3)"}
  - {text: "Stasis field deactivated.", ref: "dark/aaze0087:24", where: "room:bridge (the console after m32.done)"}
open_questions:
  - q: "Count. The group DD-16+24 is 45 monsters and 26.7k; MAPS says 'few' in the pod; DD-24 is S (at most 30)."
    options: ["(a) 7 in the pod (3 Floating Eyes, 2 Terrible Eyes, 2 Lesser Elementals): 4.79k; DD-24 30: the group 37 monsters and 25.73k, -3.6 % (count -18 %, XP inside 10 %)",
              "(b) 15 in the pod (the S floor, more eyes): about 9.8k; the group 45 and about 30.7k (+15 %)",
              "(c) none: an empty pod, all fighting in DD-24 (over its S band)"]
    recommend: "(a), with a NOTES exception line (S below 15 monsters, MAPS's 'few')"
    depends: "A2 (Act V recount)"
  - q: "The alien device ('all stats to at least 50, +50 years of age')."
    options: ["(a) +1 to every statistic and five years of age, once per character (a player bit), DD-09's barrel pattern (D-27) with the source's age joke kept larger",
              "(b) exactly DD-09's barrel: +1 all, one year",
              "(c) dressing only: both devices dormant"]
    recommend: "(a)"
    depends: "A3 (player bit, text), A2 (Act V values), A1 only if an event cannot add age (D-27)"
  - q: "The pod logs (MAPS: 'DD-16, DD-22: the pod logs'). A3's log1/log2 are short; the source's computer holds entries 1-15 (CRON, VARN, Terra)."
    options: ["(a) a third log computer paging the source's entries, abridged by A3 into about five pages (a map variable steps the page)", "(b) A3's two logs only"]
    recommend: "(a)"
    depends: "A3 (ORIGINAL_LINES rows, abridged)"
  - q: "Corak's body. He talks by evt.SpeakNPC(5513) from his console; something must stand there."
    options: ["(a) a peaceful placed-only row 'Corak' (A2, NoArena, not counted; a tall guardian look from S, stand-in until made), shown on m29.done, hidden on m32.done", "(b) a decoration figure only (no actor)"]
    recommend: "(a)"
    depends: "A2 (row), S (look)"
  - q: "Rest encounters."
    options: ["(a) 10 % from the eyes (the map's hostile rows), D-39's rule", "(b) 0"]
    recommend: "(a)"
    depends: "A2"
