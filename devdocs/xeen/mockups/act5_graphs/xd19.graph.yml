# MU-6 dungeon graph, a review file for phase 5 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
# `mix` is the placed monster list by row (level, count); kill XP per member = sum of L(L+10) x count / 4 (MAPS §0).
# The source's Xeen's Castle (xeen maze0075-0078, four levels) as one BLV of four floors, 640 apart (0, 640, 1280,
# 1920). L1 holds the gate, the great hall and two generators (the source's cold and poison, at the north corners);
# the corner towers climb to their tops, where the other two generators sit (the source's fire and electricity on L4);
# the keep holds the guard foundry (L2), the barrier hall (L3) and the crown (L4): the aviary, the throne and the Sixth
# Mirror. Four set pieces: the foundry, the barrier hall, the aviary, the throne room.
format: mu6-0
map: XD-19
key: xd19
name: Castle Xeen
stands_on: X9 Clouds of Xeen (the castle on the clouds, behind Slick's carnival)
class: L
band: "L: 50-75 sectors, 120-200 M units², four set pieces, §0's 70 monsters plus the bosses, doors up to 25"
size: "37 review rooms, about 62 sectors (the great hall, the foundry and the aviary four each, the barrier hall and the throne room three); outer castle about 7,168 x 6,656; floor 0 about 42, floor 1 about 28, floor 2 about 30, floor 3 about 30 M units²: about 130 M units²; 21 doors (gate, great-hall north doors and throne doors as two-leaf pairs)"
party: [47, 50]
monsters:
  levels: [42, 70]
  boss: "Xeen's Pet 75, Lord Xeen 85"
  count: 70
  groups: [2, 3]
  families:
    - "Magic constructs (11600): Xeen's Guard 60 (11603, D-19's own model xeen_guard before placement): the castle's own soldiers, the source's only monster; 4 of the 14 wait hidden in the guard bays and are released by the guard-making machines"
    - "Demons (11630): Demon 42, Devil 50, Screamer 58: Lord Xeen's household (he is the family's boss row)"
    - "Elementals (11620): two per generator hall (fire 11620; air, water, earth as three new 55 tiers requested, DECIDE 4), two Greater Elementals 70 as the barrier's wardens"
    - "Bosses (not in the 70): Xeen's Pet 75 (11644) in the aviary, Lord Xeen 85 (11634) on his throne"
    - "Magic constructs A-C (Flying Feet 18, Guardian 24, Carnage Hand 35) are under the band: none placed (DECIDE 5)"
  mix:
    - {row: Demon, id: 11630, level: 42, count: 28}
    - {row: Devil, id: 11631, level: 50, count: 14}
    - {row: Screamer, id: 11632, level: 58, count: 4}
    - {row: "Xeen's Guard", id: 11603, level: 60, count: 14}
    - {row: Lesser Elemental (fire), id: 11620, level: 55, count: 2}
    - {row: Lesser Air Elemental, id: "11624 (requested from A2)", level: 55, count: 2}
    - {row: Lesser Water Elemental, id: "11625 (requested from A2)", level: 55, count: 2}
    - {row: Lesser Earth Elemental, id: "11626 (requested from A2)", level: 55, count: 2}
    - {row: Greater Elemental, id: 11622, level: 70, count: 2}
  bosses:
    - {row: "Xeen's Pet", id: 11644, level: 75, count: 1}
    - {row: Lord Xeen, id: 11634, level: 85, count: 1}
  kill_xp: "54.38k per member for the 70 (217,528 / 4); with the two bosses 57.99k (231,978 / 4); 50.18k if the four bay guards are never released"
  kill_xp_target: "53.3k (MAPS §0 row, the 70): +2.0 %; with the bosses +8.8 % (MAPS: L carries the 70 'plus their bosses')"
treasure: {level: 5, hoard: 6}
role: "M35 Castle Xeen: the four generators (m35.gen_fire, gen_air, gen_earth, gen_water) put out the barrier's pylons; the barrier (m35.barrier) falls; Xeen's Pet (m35.pet); Lord Xeen's first sight (m35.lord_xeen_sight, voiced) and death (m35.lord_xeen, voiced, only the Xeen Slayer Sword harms him); the scepter at the throne (m35.scepter): the Sixth Mirror shatters (cinematic)"
role_short: "M35, Lord Xeen, the Sixth Mirror"
set_piece: "Four: the guard foundry (two guard-making machines stamping out Xeen's Guards into sealed bays); the barrier hall (four element pylons fed by conduits from the four generators, holding one field before the crown stair); the aviary under open sky (Xeen's Pet on its roost, held in by low arches, D-32); the throne room (Lord Xeen on a black dais, the Sixth Mirror behind him in a force field)"
sounds: "AU requests: a generator hum per element (placed sound, stops on destruction), the machines' stamping loop, the barrier's crackle, the mirror's shatter and the castle's groan for the cinematic; D-38 voices xeen_vo_lord_xeen_sight (63030) and xeen_vo_lord_xeen_death (63031) from the hooks; music 22 (maps.yml)"
textures:
  family: "Castles: MM8 Escaton's Palace d35 (dungeon_families castles: 'XD-19 Castle Xeen (X9): mm8/d35.blv + ancient kit'): gnecwal4, gnecwal1 black stone, gnecflr, gtrlflr and gnecclg2, tws1fa gold friezes, tws1f pillars, gnecdr1l/gnecdr1r door leaves (two-leaf pairs). The machines in the ancient kit (ancient.yml per_site: 'sw panels with xaenergy, barriers xafield'): swll4dk, swll5dk panels, gn_mtl frames, xaenergy conduits, xafield for the barrier and the mirror's force field. Open sky (sky: true, preset xeencloud) over the wall walks and the aviary, sky faces at least 1,280 above the floor"
  cap: 70
  planned: 38
  new: 7
  new_list: "proposed names, A6 decides: four generator cores (fire, air, water, earth: xaenergy's panel with an element-coloured core), Lord Xeen's sigil banner (one-off), the Sixth Mirror (one-off, silvered glass in a black-and-gold frame), the shattered frame (after the cinematic)"
  distinct_from: "XD-12 Darzog's Tower (d03 + 7d14) and the white royal castles (7d09); DD-17 Castle Alamar (the sw set throughout): Castle Xeen is black stone and gold with Ancient machines inset"
