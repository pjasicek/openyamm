open_questions:
  - q: "1. Guard-making machines."
    options: ["(a) two destructible machines in the foundry; while either stands a 45 s timer shows one hidden placed guard from the bays (pool 4, counted at load, DD-14's hidden-actor word) and sets it on the party; both destroyed stop it and open the bays",
              "(b) evt.SummonMonstersById on the timer while they stand (unbounded count; capped by a map var)",
              "(c) flavour only: machines are dressing, a group of guards stands by each"]
    recommend: "(a): a fixed count, the source's 'destroy it and the guards stop'"
    depends: "A1 only if a hidden actor cannot be shown by a timer event"
  - q: "2. How a generator is destroyed (which source generator is which: cold -> water, poison -> earth on floor 0; fire -> fire, electricity -> air in the tower tops)."
    options: ["(a) the source's question 'X Generator. Destroy?' damages the destructible to 0 by event; blows and spells also break it; one on_destroyed calls the hook", "(b) blows and spells only"]
    recommend: "(a)"
    depends: "A3 (the four 'where' texts)"
  - q: "3. The barrier."
    options: ["(a) one field before the crown stair, held by four pylons that go dark one by one (A3's single m35.barrier)", "(b) four fields in series, each dropped by its own generator"]
    recommend: "(a)"
    depends: "—"
  - q: "4. The generators' elemental guards: the elementals family has fire tiers only."
    options: ["(a) three new Lesser tiers at 55 (11624 Air, 11625 Water, 11626 Earth) with MM6's elemental looks", "(b) fire Lesser Elementals in all four halls", "(c) demons instead in the three non-fire halls"]
    recommend: "(a)"
    depends: "A2 (rows), S (bindings: MM6 air, water, earth elementals)"
  - q: "5. Magic constructs A-C (18, 24, 35) under the 42-70 band."
    options: ["(a) none placed", "(b) four Carnage Hands 35 in the foundry as half-made work"]
    recommend: "(a)"
    depends: "—"
  - q: "6. Lord Xeen harmed only by the Xeen Slayer Sword (E11). onDamaged observes and cannot cancel damage (ACTOR_SCRIPTING_INVESTIGATION, Limitations)."
    options: ["(a) A1 adds a shared damage hook (a behaviour onDamage that returns the amount, given the attacker's weapon and whether it is a spell); his behaviour zeroes all but melee from the sword; the map binds it on load (evt.SetActorBehavior)",
              "(b) a row field (harmed_only_by: <item id>) read by the damage code",
              "(c) no immunity: D-2.3's slaying: Demon only"]
    recommend: "(a) or (b), A1's choice; (c) loses the story's point"
    depends: "A1 (engine), A2 (row field if (b)); the sword must be an undroppable quest item (A2)"
  - q: "7. First sight of Lord Xeen."
    options: ["(a) a step plate across the throne doors' sill (inside the leaves, the throne straight ahead 2,000 away and lit); he and his guards immobile until 4 s after the line; his onDamaged also calls the hook if it has not run", "(b) the doors' click event"]
    recommend: "(a)"
    depends: "—"
  - q: "8. After the scepter (no map-collapse word)."
    options: ["(a) the cinematic (mirror shatters, camera shake, falling dust, aaze0078:4 subtitles) ends with a direct leave to X9's gate return point; X9 shows the castle gone by a stage on m35.done and the gate reads aaze0027:44; XD-19 is not entered again",
              "(b) the mirror shatters and the castle stays; the party walks out",
              "(c) the source: the party is set down in Vertigo (X1)"]
    recommend: "(a), with the treasury open from Lord Xeen's death so nothing is lost before the party chooses to take the scepter"
    depends: "A5 (X9 stage and gate line), A1 (a leave after a cinematic)"
  - q: "9. Experience for the machines and generators (the source's +200,000 each)."
    options: ["(a) none: the scepter's 35,000 carries M35", "(b) 2,500 per member per generator and machine (15,000 in all)"]
    recommend: "(a)"
    depends: "A3"
  - q: "10. Count: 70 at 54.38k (+2 %), with the two bosses 57.99k (+8.8 %)."
    options: ["(a) as drawn", "(b) four Demons fewer (66 + bosses, about +6.7 %)"]
    recommend: "(a): MAPS's L line puts the bosses on top of the 70"
    depends: "A2 (Act V recount)"
