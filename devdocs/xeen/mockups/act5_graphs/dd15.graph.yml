# MU-6 dungeon graph, a review file for phase 5 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
# `mix` is the placed monster list by row (level, count); kill XP per member = sum of L(L+10) x count / 4 (MAPS §0).
# The source's Great Pyramid (dark maze0083-0086, four levels, each a quadrant of 32 x 32 shrinking to 8 x 8; text
# aaze0083-0086): L1 "the Royal Pyramid" for visitors (Reception, Overseer's Office, Visitor's Atrium, Information,
# five talking statues, six torch levers, eight number niches 3-10); L2 four verse statues and the registry lock
# (NCC-1701); L3 a teleport maze; L4 the Dragon Pharaoh's apartments (his throne, the Brew of Pure Power, an ornate bed,
# a tapestry, a combination wall safe, the Prime Directive book, a button to Skyroad D2). One BLV of four stepped
# floors, 768 apart (0, 768, 1536, 2304), each smaller than the one below, as the source's. Lane A8, session 10.
format: mu6-0
map: DD-15
key: dd15
name: Great Pyramid
stands_on: D5 Desert of Doom (the Great Pyramid, 12 x 12 cells and 3,600 high in VARN stone; its green door on the north face)
class: L
band: "L: 50-75 sectors, 120-200 M units², four set pieces only, §0's 70 monsters, doors up to 25"
size: "35 review rooms, about 58 sectors (the atrium four, the processional and the pad hall three each, the throne hall three); floors 10,240, 8,192, 6,144 and 4,096 square (the inside is independent of the outside, D-49 Q6): about 62 + 40 + 24 + 12 = 138 M units²; 21 doors (the green doors, the stair door, the antechamber and throne-hall doors as two-leaf pairs)"
party: [44, 47]
monsters:
  levels: [42, 65]
  boss: null
  count: 70
  groups: [2, 3]
  families:
    - "Pyramid mummies (11270): Tomb Mummy 42, Pyramid Guard 52, Royal Mummy 65, and Ghost Mummy 62 (tier D, D-57) in the Ancient pad maze: the family's `where` names the Great Pyramid; the source's L1 had 40 placed (two kinds)"
    - "No boss: MAPS §0 names none; the Pharaoh is the peaceful placed-only row 11919 (D-56), not counted"
  mix:
    - {row: Tomb Mummy, id: 11270, level: 42, count: 34}
    - {row: Pyramid Guard, id: 11271, level: 52, count: 24}
    - {row: Ghost Mummy, id: 11273, level: 62, count: 6}
    - {row: Royal Mummy, id: 11272, level: 65, count: 6}
  kill_xp: "51.92k per member (207,666 / 4)"
  kill_xp_target: "MAPS §0 DD-15: 70 monsters at 42-65, 50.4k: +3.0 %"
  per_floor: "L1 30 (Tomb 20, Guard 10; eight of the Tombs hidden in the torch chapels' niches until their torch is lit), L2 20 (Tomb 10, Guard 8, Ghost 2), L3 12 (Tomb 4, Guard 4, Ghost 4), L4 8 (Royal 6, Guard 2)"
treasure: {level: 5}
role: "Story M28 (the Dragon Pharaoh takes his orb; Alamar is Sheltem; the lava round Corak's pod cools), M30 (the Chosen Ones: the Pass to Olympus) and M36 (the finale's errands); D-58's sky door to D7 after m30.done"
role_short: "M28, M30, M36: the Dragon Pharaoh"
set_piece: "Four: the Visitor's Atrium (the torch court and the stair door), the processional of the four verse statues ending at the registry door, the Ancient pad hall (L3), the Pharaoh's throne hall under the apex"
sounds: "MM6 Tomb of VARN beds (`pan: false`, D-48); fire on each lit torch (placed, shown with the torch); a teleport whoosh on every pad; the Brew of Pure Power bubbling by the throne; wind at the sky door"
music: 46
textures:
  family: "Pyramids: MM6 Tomb of VARN pyramid.blv (A6's assign: 'DD-15 Great Pyramid (D5): mm6/pyramid.blv, its lower Ancient levels in the ancient kit (sw set) to read apart'): egybigb/egybiga block walls, egywla/egywld hieroglyph walls, egyflore/egyflorc floors, egyceila/egyceilb carved ceilings, egytrma/egytrmc trims, egywlj and egycol32 pillars, egydrlgl/egydrlgr great doors (two leaves), egydrsml/egydrsmr doors, egyswbof/egyswbon the torch levers (off/on), egymeda/egymedb medallions; A6's xdpyrdor on the inside of the green doors and the stair door; xngold5 gilding in the throne hall; the ancient kit (sw set: swll4dk, swfloor2b, swceilf, swaled, trekscrn, xafield) on L3's pad hall, the cells and the sky-door corridor"
  cap: 70
  planned: 40
  new: 1
  new_names: "xdregplq: the brass registry plaque (sign, 128 x 64, 'REGISTRY NCC-1701'), placed once"
  distinct_from: "XD-15 The Sphinx and FD-02 Southern Sphinx use the same VARN set (upper half; FD-02 the other half): DD-15 reads apart by the green stone and gold, the ancient sw kit on L3 and L4's sky corridor, and the torch levers; DD-16/DD-22 pods and DD-17 Alamar are sw/Lincoln throughout"
