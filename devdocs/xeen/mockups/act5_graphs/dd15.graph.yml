     purpose: "Pad 4: the right way. Two Pyramid Guards; a second pad onward to the far cell."}
  - {id: room:cell_e, name: Far cell, kind: room, size: S, floor: 2, at: [5, 0], monsters: 2,
     population: [{row: Tomb Mummy, level: 42, count: 2}],
     purpose: "Reached only by the bird cell's second pad: the apex stair's door, a pad back to the hall."}
  # L2, the registry level
  - {id: room:landing, name: Stair head, kind: stair, size: S, floor: 1, at: [4, 2], monsters: 0,
