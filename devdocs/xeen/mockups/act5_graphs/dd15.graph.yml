  - {id: room:sky_corridor, name: Sky door, kind: corridor, size: S, floor: 3, at: [6, 0], monsters: 0,
     purpose: "Behind the throne: a short Ancient corridor (sw kit) to a door in the pyramid's face near the apex: 'Access Denied!' (aaze0086:5) before m30.done; after it the sky door both ways to D7 (d7.sky_door_dd15, D-58). Sealed with that line until D7 installs. Quiet (a map door)."}
  # L3, the Ancient pad maze
  - {id: room:maze_landing, name: Maze landing, kind: stair, size: S, floor: 2, at: [4, 2], monsters: 0,
     purpose: "The top of the registry stair. The first pad's line (m28.maze) on the first arrival."}
  - {id: room:pad_hall, name: Pad hall, kind: hall, size: L, floor: 2, at: [4, 1], set_piece: true, monsters: 4,
     population: [{row: Ghost Mummy, level: 62, count: 2}, {row: Tomb Mummy, level: 42, count: 2}],
     purpose: "A square hall of Ancient steel under a ceiling of small lights: five glyph pads in the floor, each a step plate moving the party (in-map, `{direct = true}`) to one cell; every cell has a pad back. The Ghost Mummies drift through the hall."}
  - {id: room:cell_a, name: Cell of the sun, kind: room, size: S, floor: 2, at: [3, 1], chest: 5, monsters: 0,
     purpose: "Pad 1: a sealed cell with a chest."}
  - {id: room:cell_b, name: Cell of the eye, kind: room, size: S, floor: 2, at: [5, 2], monsters: 2,
     population: [{row: Ghost Mummy, level: 62, count: 2}],
     purpose: "Pad 2: two Ghost Mummies; a dead end with a find on the wall: the Overseer's lost map of the pads ('Sun, eye, scarab: dead ends. The bird, then the second bird.'), the maze's answer-giver."}
  - {id: room:cell_c, name: Cell of the scarab, kind: room, size: S, floor: 2, at: [5, 1], monsters: 2,
