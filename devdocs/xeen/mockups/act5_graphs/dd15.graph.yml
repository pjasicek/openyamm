  - {id: room:stair_foot, name: Grand stair, kind: stair, size: M, floor: 0, at: [4, 1], monsters: 0,
     purpose: "Behind the stair door, across the south gallery from the atrium: the grand stair up to L2, the Pharaoh's lift beside it."}
  - {id: room:lift_foot, name: "Pharaoh's lift", kind: stair, size: S, floor: 0, at: [6, 1], monsters: 0,
