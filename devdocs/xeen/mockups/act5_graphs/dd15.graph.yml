states:
  - {id: state:torches, kind: lever, where: "room:chapel_ne, room:chapel_nw, room:chapel_sw, room:chapel_se",
     what: "Four torch levers, two-state (map qbits 117561-117564, one per torch): pulling an unlit one lights it (fire shown, the atrium's matching brazier lit, its two niche mummies shown and hostile); a lit one says 'The lever is stuck.' (aaze0083:39). The fourth calls m28.torches (qbit 111561) and the stair door opens and stays open on every later load.",
     opens: [link:atrium_stair]}
  - {id: state:numbers, kind: puzzle, where: room:number_hall,
     what: "Eight niches, each a text prompt ('I'm the smallest. What's my number?' 3 or Three ... 'I'm the largest.' 10 or Ten; aaze0083:13-38); a right answer 'Correct!' and a map qbit (117565-117572), a wrong one 'Wrong!' (aaze0083:16-17). All eight: map qbit 117573, the vault door opens. Answer-givers: the two rule statues (eight in a row, total 52: three to ten) and the Overseer's note.",
     opens: [link:overseer_vault]}
  - {id: state:registry, kind: password, where: room:registry,
     what: "The prompt 'Registry?' (the source's 'Starfleet Registry Number NCC'): 1701 or NCC-1701 calls m28.registry_lock (qbit 111562), the door slides open and stays open; any other 'Incorrect!'. The plaque beside it says the answer plainly (m28.registry_plaque); the four statues' verses stay as the source's flavour.",
     opens: [link:registry_stair]}
  - {id: state:m28, kind: qbit, where: room:throne_hall, draw: false,
     what: "m28.done (111563), set by the Pharaoh's topic 'The orb': from then on the Pharaoh's lift runs both ways between the grand stair and the antechamber (open question 4), so the M30 and M36 visits skip the climb.",
     opens: [link:lift]}
  - {id: state:m30, kind: qbit, where: room:throne_hall,
     what: "m30.done (111600), set by the Pharaoh's topic 'Chosen Ones': the sky door opens both ways (d7.sky_door_dd15, D-58); before it 'Access Denied!' (aaze0086:5). Sealed until D7 installs.",
     opens: [], draw: false}
  - {id: state:button, kind: lever, where: room:bedchamber,
     what: "A carved button in the bedchamber's wall (the source's L4 button): the secret door to the sky corridor opens one-way from the bedchamber side and stays open (map qbit 117575).",
     opens: [link:bed_sky]}
  - {id: state:safe, kind: puzzle, where: room:bedchamber,
     what: "The wall safe: three prompts in the source's wording ('Enter Combination. ... Left?' / 'Right?' / 'Left?'), answers 20, 30, 1 (aaze0086:20-29); right: the chest opens (map qbit 117574); wrong: 'No Luck.' (aaze0086:19). The tapestry's click shows the numbers woven into its border (open question 7).",
     opens: [], draw: false}
  - {id: state:maze, kind: stage, where: room:pad_hall,
     what: "No gate: the pads are step plates (in-map moves, `{direct = true}`), every cell has a pad back; m28.maze on the first arrival in the hall (once per save, map qbit 117576).",
     opens: [], draw: false}
