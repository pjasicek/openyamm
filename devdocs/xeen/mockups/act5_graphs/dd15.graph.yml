  - {id: room:overseer, name: "Overseer's Office", kind: room, size: S, floor: 0, at: [4, 2], monsters: 0,
     purpose: "Off the south-east chapel (the door sign 'Overseer's Office', aaze0083:2): a desk and a note (the eight numbers' answer-giver: 'Three to ten. Every year I forget. -- the Overseer'); the vault door, opened by the number hall (open question 3)."}
  - {id: room:vault, name: "Overseer's vault", kind: room, size: S, floor: 0, at: [5, 2], chest: 5, monsters: 0,
     purpose: "A dead end with the chest (T5) and the visitors' fees (gold)."}
  - {id: room:chapel_sw, name: South-west chapel, kind: room, size: S, floor: 0, at: [3, 0], monsters: 3,
     population: [{row: Tomb Mummy, level: 42, count: 2}, {row: Pyramid Guard, level: 52, count: 1}],
     purpose: "Torch 3; two hidden Tomb Mummies wake when it is lit; a Pyramid Guard keeps it."}
  - {id: room:south_gallery, name: South gallery, kind: corridor, size: L, floor: 0, at: [3, 1], monsters: 4,
     population: [{row: Tomb Mummy, level: 42, count: 1}, {row: Pyramid Guard, level: 52, count: 3}],
     purpose: "The ring's south side behind the atrium: the atrium's south door on one side, the stair door (locked until the four torches burn) on the other."}
  - {id: room:chapel_se, name: South-east chapel, kind: room, size: S, floor: 0, at: [3, 2], monsters: 3,
     population: [{row: Tomb Mummy, level: 42, count: 2}, {row: Pyramid Guard, level: 52, count: 1}],
     purpose: "Torch 4; two hidden Tomb Mummies wake when it is lit; a Pyramid Guard keeps it."}
  - {id: room:number_hall, name: Number hall, kind: hall, size: M, floor: 0, at: [2, 2], monsters: 4,
     population: [{row: Tomb Mummy, level: 42, count: 2}, {row: Pyramid Guard, level: 52, count: 2}],
     purpose: "The ring's east side: eight niches in a row, each asking its riddle ('I'm the smallest. What's my number?' ... aaze0083:13-38); two statues give the rule ('Enter the eight numbers to pass the test / They are in a row, so do your best.' and 'They total fifty-two / the rest is up to you.', aaze0083:9-10). All eight right open the Overseer's vault."}
