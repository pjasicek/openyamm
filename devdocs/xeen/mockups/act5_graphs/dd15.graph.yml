lines:
  - {text: "Exit the Great Pyramid?", ref: "dark/aaze0083:0", where: "room:entry (the exit preset's meaning, D-24)"}
  - {text: "The statue speaks as you approach it: Welcome to the Royal Pyramid! The Dragon Pharoah is currently indisposed, but a staff member will be with you shortly ...", ref: "dark/aaze0083:6", where: "room:entry (the welcome statue; the source's spelling 'Pharoah' kept in quotes)"}
  - {text: "Don't forget to light six torches before trying the stairs.", ref: "dark/aaze0083:7", where: "room:atrium (four for six, to match m28's four torches)"}
  - {text: "Built during the Creation, the Royal Dragon Pyramid has stood the test of time ...", ref: "dark/aaze0083:8", where: room:reception}
  - {text: "Enter the eight numbers to pass the test / They are in a row, so do your best. -- They total fifty-two / the rest is up to you.", ref: "dark/aaze0083:9-10", where: room:number_hall}
  - {text: "I'm the smallest. What's my number? ... I'm the largest. What's my number? / Wrong! / Correct!", ref: "dark/aaze0083:13-38, :16-17", where: "room:number_hall (the eight niches)"}
  - {text: "Access denied! / The lever is stuck.", ref: "dark/aaze0083:12, :39", where: "room:atrium (the stair door before the torches), the torch chapels (a lit torch)"}
  - {text: "1 - Total the dates is all you do / Then minus the number thirty-two ... 4 - Type in the passcode you now should know / To quickly get from this level below", ref: "dark/aaze0084:1-4", where: "room:processional (the four statues)"}
  - {text: "Incorrect!", ref: "dark/aaze0084:7", where: room:registry}
  - {text: "As you approach the Brew of Pure Power, the Dragon Pharaoh says, \"Get away from that! You'll hurt yourself!\"", ref: "dark/aaze0086:0", where: room:throne_hall}
  - {text: "Nothing here. / Enter Combination. You think it's ... Left? / No Luck.", ref: "dark/aaze0086:3, :20-29, :19", where: room:bedchamber}
  - {text: "The book is blank but for a single page in the middle that reads: Prime Directive: Obey the Ancients, Secondary Directive: Protect Xeen, Tertiary Directive: Complete the Destiny of Xeen. (the +1,000,000 experience dropped) / You learn nothing new from reading the book again.", ref: "dark/aaze0086:30-31", where: "room:antechamber (MAPS's original line for DD-15; open question 8)"}
  - {text: "Access Denied!", ref: "dark/aaze0086:5", where: "room:sky_corridor (before m30.done)"}
open_questions:
  - q: "Count and mix (MAPS §0: 70 at 42-65, 50.4k; the source's L1 held 40 of two kinds; the Darkside dragons' row names the Great Pyramid too)."
    options: ["(a) 70 Pyramid mummies: Tomb 42 x 34, Guard 52 x 24, Ghost 62 x 6 (L3 and L2), Royal 65 x 6 (L4): 51.92k (+3.0 %)",
              "(b) (a) plus two Cloud Dragons 70 (11650) as an optional pair in a dragon gallery off L2's cloister (over the band, D-1.2's optional rule): 54.72k (+8.6 %)",
              "(c) 70 with ten Royal Mummies (L3 and L4 heavier): about 53.9k (+7 %)"]
    recommend: "(a)"
    depends: "A2 (Act V recount; row 9168's slot)"
  - q: "The torches (A3's m28 says four; the source has six levers that also bring monsters)."
    options: ["(a) four torch levers in the four corner chapels round the atrium, the plaque by the first (nearest the door); each lit torch also lights its brazier in the atrium and wakes two Tomb Mummies hidden in the chapel's niches (hidden placed actors shown by the lever's event, DD-14's word); the fourth opens the stair door",
              "(b) four torches, no waking mummies (the eight Tombs placed openly instead)",
              "(c) the source's six torches (A3's hook text and plaque change)"]
    recommend: "(a)"
    depends: "A3 (only for c); nothing in the engine"
  - q: "The number lock (the source's eight niches 3-10 on L1; QUESTS lists 'a number lock', which A3's m28 reads as L2's registry)."
    options: ["(a) kept on L1 as an optional puzzle opening the Overseer's vault (a T5 chest and the visitors' fees); answer-givers: the two rule statues (eight in a row, total 52) and the Overseer's note ('Three to ten')",
              "(b) on the critical path: the stair door needs the torches and the eight numbers (the source's order)",
              "(c) dropped (the niches as flavour)"]
    recommend: "(a)"
    depends: "A3 (the note's text and the niches' lines as map-local lines)"
  - q: "The return visits. M30 and M36 bring the party back to the Pharaoh twice; the climb is four floors and a pad maze."
    options: ["(a) the Pharaoh's lift: from m28.done a two-stop lift beside the grand stair runs both ways to the antechamber (a quiet way up; the torches and registry stay open by their qbits anyway)",
              "(b) no lift; after m28.done the pad hall's first pad leads straight to the far cell",
              "(c) nothing: the party climbs each time (cleared floors stay cleared: the map does not refill)"]
    recommend: "(a)"
    depends: "nothing (lifts and qbit gates exist)"
  - q: "The pyramid's wardens after M28 (the Pharaoh is the party's ally; his pyramid's mummies are hostile, as in the source)."
    options: ["(a) they stay hostile (the pyramid's old wardens, mindless); the map does not refill, so a cleared pyramid stays quiet, and the lift (4) skips it",
              "(b) a pyramid faction that turns peaceful on m28.done (relations by qbit, as DD-20's coven)"]
    recommend: "(a)"
    depends: "A2 (b only)"
  - q: "The Brew of Pure Power (the source: the Pharaoh warns 'Get away from that! You'll hurt yourself!'; the vat's event is unclear)."
    options: ["(a) the warning only (a set piece: the vat bubbles and glows by the dais)",
              "(b) the warning on the first click; a second click drinks: fire damage to the clicking member, 'He did warn you.'",
              "(c) a reward once per character (+2 to one statistic, D-4 size)"]
    recommend: "(a)"
    depends: "A3 (b or c: the lines)"
  - q: "The wall safe (the source's combination 20-30-1; its event was never finished: 'Need to finish the wall safe event!!!', aaze0086:10)."
    options: ["(a) a T5 chest behind the three Left/Right prompts (20, 30, 1), the numbers woven into the tapestry's border (its click shows them): the map's best chest",
              "(b) a plain locked chest (lock 12, as D5's L/T)",
              "(c) no safe"]
    recommend: "(a)"
    depends: "A3 (the tapestry's line)"
  - q: "The Prime Directive book's text (MAPS: 'The Prime Directive book at the top' is DD-15's original line; A3's m28.prime_directive has a new text: 'No guardian shall interfere with the world it guards.')."
    options: ["(a) the source's three directives (aaze0086:30) without the +1,000,000 experience; A3 changes the hook's text",
              "(b) A3's text as it stands"]
    recommend: "(a)"
    depends: "A3"
  - q: "Where the sky door is (D-58: the Pyramid's sky door both ways after m30.done)."
    options: ["(a) behind the throne on L4: a short Ancient corridor to a door in the pyramid's face near the apex (the source's L4 button leads to Skyroad D2); 'Access Denied!' before m30.done",
              "(b) a pad in the L3 maze"]
    recommend: "(a)"
    depends: "A6 (D7's entrance:dd15_sky and its height against the pyramid's apex at 3,600)"
  - q: "Rest encounters."
    options: ["(a) 10 % from the Pyramid mummies (D-39), none in the throne hall's rooms", "(b) 0"]
    recommend: "(a)"
    depends: "A2 (row 9168)"
