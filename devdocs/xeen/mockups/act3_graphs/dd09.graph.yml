role_short: "Q-D10, disks"
set_piece: "A temple grown inside the great tree: root alcoves that take a gem and give a disk, limb alcoves that wake Barkman, Shaalth's hall with the princess in a cage of roots, the Disciples' chapel of dials and two waters, four fountains in the crown"
