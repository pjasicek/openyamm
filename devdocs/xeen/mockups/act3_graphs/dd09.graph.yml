lines:
  - {text: "A voice bellows: 'Feed the roots and the tree shall bear fruit! Feed the limbs and suffer the wrath of BARKMAN!'", ref: "dark/aaze0077:0", where: "room:first_hall (A3's q-d10.voice)"}
  - {text: "Feed me! Give gem?", ref: "dark/aaze0077:14", where: "the root and limb alcoves (A3)"}
  - {text: "The book seems to be a lengthy diary of Barkman's life ... 4/8/400: SQUEEZED branch feeders today.", ref: "dark/aaze0077:19", where: room:barkman}
  - {text: "The life force of the BARKMAN binds the lid of the chest shut, making it impossible to open.", ref: "dark/aaze0077:21", where: room:barkman}
  - {text: "Disciples of Bark ONLY!", ref: "dark/aaze0076:0", where: room:ascension}
  - {text: "Only a scrap of the original text remains legible: ...set the Western dials to 1, Northern to 2, and Eastern to 3. To join the Way of Bark, pull lever and drink.", ref: "dark/aaze0076:2", where: room:ascension}
  - {text: "You are hereby dubbed a Disciple of Bark!", ref: "dark/aaze0076:7", where: room:ascension}
  - {text: "Other beings say that we Orcs just aren't civilized. I now invite you in for a cup of tea to debate on this issue.", ref: "dark/aaze0075:17", where: room:shaman}
  - {text: "The Orc Shaman tells lies, and his tea is poisonous. Watch yourself.", ref: "dark/aaze0075:11", where: "room:cells (Alicia)"}
  - {text: "Thank you for rescuing me from these foul orcs. Remember, Orcs can't jump.", ref: "dark/aaze0073:3", where: "room:pens (Nathan)"}
  - {text: "Take ye then the Bark of the Tree, and sprinkle it with ash. The ash symbolizes the Yak, the Bark the Moo.", ref: "dark/aaze0073:26", where: "room:chapel (Morning Ceremonies)"}
open_questions:
  - "Potions. The source has two alcove flasks (red +5 Might, blue +5 Personality) and a second room of seven coloured potions, which repeats XD-08's seven tomb juices. Proposed: the red and blue only, +2 once per character; the seven left out."
  - "The black barrels ('Your statistics have improved, but you have suffered a little magical aging.'). (a) One barrel in the sap store: +1 to all seven stats once per character and one year of age (aging exists; the Jewel of Ages' AgingImmunity flag, D-2.4, protects); (b) leave it out. Proposed (a)."
  - "The Disciples' chapel: four-position dials are map variables changed by a click ('Dial reads 1. Turn?'), not movers (D-4's two-state rule is about moving geometry). The Dark Water kills in the source. Proposed: Dark Water poisons and hurts (no death); the Book of Ascension on the lectern gives the setting plainly; the reward is the vault (T3) and an award 'Disciple of Bark' (A3), no stat. Or drop the chapel?"
  - "Four caged prisoners (Nathan, Sky, Snog, Alicia; +25,000 experience each in the source). Proposed: keep them as peaceful actors freed by the pen lever, 500 XP each by an A3 hook (q-d10.prisoners), their lines as hints (Nathan's 'Orcs can't jump', Alicia's warning about the tea); hidden on the next entry. Or two prisoners only?"
  - "The shaman's tea: a clicked kettle in the tea room ('Drink?' then Poisoned), no NPC. Proposed."
  - "Barkman: optional at 60, hidden in his hollow and shown (show_actors, D-18's word) when a limb alcove takes a gem; the guard is a map variable. His bound chest (hoard 4) opens on his death. Confirm, and that his XP counts with a later act (D-1.2)."
  - "Monsters: orcs (the source's occupiers) and arachnoids in the roots and limbs. Wolves (D2's Dark Wolf 16) instead of arachnoids would tie the temple to the forest outside. Proposed: arachnoids (webs read well in a hollow tree)."
