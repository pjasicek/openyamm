open_questions:
  - "Monsters by stage and act. MAPS gives DD-03 55 monsters at 28-48 in Act IV, but stages 1-2 are Act III (M19 at level 24). Proposed: stage 1 Tomb Guard 26 and Ghost Rider 27 (just under the band's 28), stage 2 adds four Tomb Terrors 40, stages 3-4 to 45; 24 monsters in Act III (about 6.8k per member), 31 in Act IV (about 14.7k), A2 to split the count as for XD-13 (D-4). Or every stage at 28-48?"
  - "Who is in a castle that was out of phase: spirits in the shimmering wings (stages 1-2 and the attic), the imprisoned liches and bone dragons in the dungeon, Count Blackfang's vampires in the Queen's rooms at stage 4 (they came for her crown). Agreed?"
  - "The five liches (T2-A): A3 calls them 'power liches'; A2's Power Lich is a level-75 boss row. Proposed: five plain Liches 35 with the source's names on their corpses (Vexor the Black, Clemon the Dead, and three of the list), and a hook t2-a.liches that the map calls when the cell block's group is dead (A3 lists liches_slain as the map's kill count but has no hook for it)."
  - "The safes. m19.safes (stage 1, two disks, the main path) are 'thievery safes': proposed as trapped, locked chests any party can open (no skill gate on the main path). The source's other ground-floor safes with guessed combinations are left out. Two optional 'tougher safes' (armory, dungeon vault) open to 10-11-12 at a combination prompt; Guido's greeting gives the numbers, so the prompt is answerable from stage 3. Agreed?"
  - "A4's house 4501 'The Empty Throne' and A3's safes 'in the throne room' clash if the throne room is a house screen. Proposed: the throne room is a walkable hall; the throne itself is the house's door (a thing, as A4's mirror 4512), opening the house screen of Gem and Errol and, after M27, the Queen."
  - "Shimmering walls: one new texture (a pale-violet phase wall, Kalindra's colours) on the door leaves that close each stage's parts, or XD-25's xufield (the field of light) reused? Proposed: one new, so the two read apart."
  - "Scraps 70: optional, behind a kennel portcullis opened by a lever in Maximum Security, at the foot of a stair lower than his body (D-32; XD-07's caged dragon, D-4); his XP counted with a later act (D-1.2). Confirm."
  - "The stable yard (stage 4) holds A4's stables 4510 with the arrival kalindra_stables and the castle's mirror 4512: an open-sky yard (D-22.6's open_sky words) inside the castle BLV. D1 then needs no stable building at the castle. Agreed?"
  - "James the Spy's source line (Prince Roland in Alamar's 'base') is left out: it belongs to A3's story order (M21, M35). Confirm."
