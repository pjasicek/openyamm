  - {id: link:mouth_bone, from: room:mouth, to: room:bone_hall, kind: open}
  - {id: link:mouth_larder, from: room:mouth, to: room:larder, kind: door, label: hide flap}
  - {id: link:bone_sleeping, from: room:bone_hall, to: room:sleeping, kind: stair, label: tunnel down}
  - {id: link:larder_spring, from: room:larder, to: room:spring, kind: stair, label: crawlway}
  - {id: link:sleeping_spring, from: room:sleeping, to: room:spring, kind: open}
  - {id: link:sleeping_rocks, from: room:sleeping, to: room:rock_pile, kind: open}
  - {id: link:spring_guard, from: room:spring, to: room:guard_tunnel, kind: stair, label: slope down}
  - {id: link:guard_nursery, from: room:guard_tunnel, to: room:nursery, kind: door, label: hide curtain}
  - {id: link:guard_hearth, from: room:guard_tunnel, to: room:hearth, kind: door, label: hide curtain}
  - {id: link:hearth_chimney, from: room:hearth, to: room:chimney, kind: one_way, label: "chimney: lair burnt",
     opened_by: state:burn, notes: "The hide plug burns away; root handholds (a climbable ladder) up to the mound's crown. Climb only; from above it is a smoke hole."}
states:
  - {id: state:matron, kind: kill, where: room:hearth, what: "The Troll Matron's death (a kill timer, as XD-05's drums): the hearth's click then asks 'Destroy the lair?'; before it, the trolls' fire only.", opens: [], draw: false}
  - {id: state:burn, kind: qbit, where: room:hearth, what: "Yes at the hearth: q-c15.lair sets lair_burnt (112301). Its event breaks the warren's destructibles (beds, hide curtains, bark piles: evt.DamageDestructible), sets a grey smoke mist (evt.SetMist) that a timer thickens for a minute, and opens the chimney.",
     opens: [link:hearth_chimney]}
exits:
  - {id: exit:x5_mouth, space: room:mouth, at: [0, 0], kind: both, label: "X5: the warren's mouth",
     neighbour: "The barrow mound's mouth in the Troll Forest (X5 thing:warren, cells about [65.5, 94.5]); the exit arrives 400 in front of the mouth, facing away"}
  - {id: exit:x5_crown, space: room:chimney, at: [4, 0], kind: out, label: "X5: the mound's crown",
     neighbour: "X5, on the mound's top beside the smoke holes (explicit coordinates; one way out)"}
critical_path: [room:mouth, room:bone_hall, room:sleeping, room:spring, room:guard_tunnel, room:hearth]
return_path: [room:hearth, room:chimney]
loops:
  - {id: loop:upper, spaces: [room:mouth, room:bone_hall, room:sleeping, room:spring, room:larder], notes: "Down the tunnel or down the larder's crawlway."}
  - {id: loop:chimney, spaces: [room:mouth, room:bone_hall, room:sleeping, room:spring, room:guard_tunnel, room:hearth, room:chimney], notes: "Out up the chimney once the lair burns, back in at the mouth over X5."}
lines:
  - {text: "The stench of this cave tells you that Trolls have been living in it. It is filled with things that Trolls find valuable: Bones, straw beds, fist-sized rocks and hides. Destroy the lair?", ref: "aaze0008:2", where: "room:hearth (the burn question, after the Matron); its first sentence as the step message in room:mouth"}
  - {text: "You burn everything you can, and what you cannot burn you throw outside.", ref: "aaze0008:3", where: room:hearth}
  - {text: "They gnaw on our bark to sharpen their teeth in a most uncivilized fashion. Friends don't gnaw on friend's bark.", ref: "aaze0007:6", where: "X5, Thickbark (the giver); the gnawed bark in room:bone_hall"}
  - {text: "Thank you for killing the trolls, civilized ones.", ref: "aaze0007:8", where: "X5, Thickbark"}
open_questions:
  - "The Troll Matron has no row: a boss in the Trolls' block (11074, 'Troll Matron', 32, look B, frenzy below half health like Hobstadt), or a Troll Guard 28 placed as her with no row?"
  - "The burn: two lines exist, the source's 'You burn everything you can, and what you cannot burn you throw outside.' and A3's hook text ('The bedding and the gnawed bark catch at once ...'). Show the source's first, then A3's? Proposed both, in that order."
  - "Smoke: a grey evt.SetMist thickened by a timer for about a minute, no damage. Or a timer that hurts the party a little each few seconds until it leaves the deep, to push it up the chimney?"
  - "The chimney exit lands on X5 by explicit coordinates (a one-way out, as XD-10's second mouth needs). Keep it, or leave the warren only by its mouth?"
  - "X5's mouth reads 'choked with bones and frozen hides from within'. Its click with the map built: 'You drag the frozen hides aside.' and in (proposed), or a barricade destructible just inside?"
