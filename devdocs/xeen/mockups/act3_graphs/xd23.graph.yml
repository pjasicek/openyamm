# MU-6 dungeon graph, a review file for gate G1 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
# Staged once: q-c15.lair_burnt (112301) swaps the warren to its burnt state on every later load.
format: mu6-0
map: XD-23
key: xd23
name: Troll Warren
stands_on: X5 Winterkill Tundra (the Troll Forest)
class: S
band: "S: at most 15 sectors and 20 M units², 15-30 monsters, 0-3 chests, 3-8 doors"
party: [25, 29]
monsters:
  levels: [18, 28]
  boss: Troll Matron 32
  count: 28
  groups: [2, 3]
  families:
    - "Trolls A-B: Troll 18 (20), Troll Guard 28 (7); Ice Troll 38 left out (over the band)"
    - "The Troll Matron 32: no row yet (open question; A2's boss slot 11074 beside Hobstadt's 11073)"
treasure: {level: 3, hoard: 4}
role: "Q-C15 Troll Problem (Thickbark): the Matron's death, then her hearth burnt, sets q-c15.lair_burnt"
role_short: "Q-C15"
set_piece: "Burn the warren from inside: the Matron's hearth hall, her bedding and the gnawed bark go up, smoke fills the tunnels and draws up the chimney the fire unplugs"
stages:
  - {id: stage:0, qbit: null, quest: Q-C15, what: "The warren as found: straw beds, hide curtains, bark piles, the trolls."}
  - {id: stage:1, qbit: q-c15.lair_burnt, quest: Q-C15, what: "Burnt: charred faces shown and beds, curtains and bark piles gone (destructibles left broken), smoke mist cleared, no trolls placed."}
floors:
  - {floor: 0, name: "Under the mound", height: 0}
  - {floor: -1, name: "Sleeping tunnels", height: -512}
  - {floor: -2, name: "The Matron's hearth", height: -1024}
spaces:
  # floor 0
  - {id: room:mouth, name: Warren mouth, kind: cave, size: S, floor: 0, at: [1, 0], monsters: 2,
     population: [{family: Trolls, count: 2, strength: light, rank: a}],
     purpose: "Inside the barricade of bones and frozen hides the party pulled aside; the stench."}
  - {id: room:bone_hall, name: Gnawing hall, kind: cave, size: M, floor: 0, at: [2, 0], monsters: 4,
     population: [{family: Trolls, count: 4, strength: pack, rank: a}],
     purpose: "Strips of gnawed bark everywhere (Thickbark's complaint), bones, a tunnel down."}
  - {id: room:larder, name: Larder, kind: cave, size: M, floor: 0, at: [1, 1], monsters: 3,
     population: [{family: Trolls, count: 3, strength: pack, rank: a}],
     purpose: "Frozen carcasses on hooks behind a hide flap; a crawlway down to the spring."}
  - {id: room:chimney, name: Smoke chimney, kind: shaft, size: S, floor: 0, at: [3, 0], monsters: 0,
     purpose: "The top of the hearth's chimney, a hole in the mound's crown; roots for handholds."}
  # floor -1
  - {id: room:spring, name: Cold spring, kind: cave, size: M, floor: -1, at: [1, 0], monsters: 3,
     population: [{family: Trolls, count: 2, strength: light, rank: a}, {family: Trolls, count: 1, strength: heavy, rank: b}],
     purpose: "A meltwater pool where the trolls lick their wounds; the way down to the deep."}
  - {id: room:sleeping, name: Sleeping hollows, kind: cave, size: L, floor: -1, at: [2, 0], monsters: 5,
     population: [{family: Trolls, count: 5, strength: pack, rank: a}],
     purpose: "Straw beds in scooped hollows (destructibles that burn); hides hung for warmth."}
  - {id: room:rock_pile, name: Rock store, kind: cave, size: S, floor: -1, at: [4, 0], chest: 3, monsters: 1,
     population: [{family: Trolls, count: 1, strength: heavy, rank: b}],
     purpose: "What trolls find valuable: fist-sized rocks, hides, bones, and a dead hunter's pack among them."}
  # floor -2
  - {id: room:nursery, name: Whelping den, kind: cave, size: M, floor: -2, at: [1, 0], chest: 3, monsters: 4,
     population: [{family: Trolls, count: 4, strength: pack, rank: a}],
     purpose: "Young trolls in a nest of rags; a heap of shiny things they play with (a chest)."}
  - {id: room:guard_tunnel, name: Guard tunnel, kind: corridor, size: M, floor: -2, at: [2, 0], monsters: 3,
     population: [{family: Trolls, count: 3, strength: heavy, rank: b}],
     purpose: "The Matron's guards; hide curtains across the tunnel to her hearth and the den."}
  - {id: room:hearth, name: "The Matron's hearth", kind: cave, size: L, floor: -2, at: [3, 0], set_piece: true, boss: true, goal: true,
