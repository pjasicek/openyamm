  - {id: link:foot_ossuary, from: room:stair_foot, to: room:ossuary, kind: open}
  - {id: link:foot_niches, from: room:stair_foot, to: room:niches, kind: open}
  - {id: link:ossuary_chapel, from: room:ossuary, to: room:chapel, kind: door}
  - {id: link:niches_chapel, from: room:niches, to: room:chapel, kind: open}
  - {id: link:chapel_sexton, from: room:chapel, to: room:sexton, kind: door}
  - {id: link:chapel_cataw, from: room:chapel, to: room:cata_w, kind: stair}
  - {id: link:cataw_gallery, from: room:cata_w, to: room:gallery, kind: open}
  - {id: link:gallery_catae, from: room:gallery, to: room:cata_e, kind: open}
  - {id: link:catae_feast, from: room:cata_e, to: room:feast_hall, kind: door}
  - {id: link:feast_cataw, from: room:feast_hall, to: room:cata_w, kind: door}
  - {id: link:gallery_vstair, from: room:gallery, to: room:vault_stair, kind: stair}
  - {id: link:vault_door, from: room:vault_stair, to: room:draco_vault, kind: door, label: "iron door: night only",
