# MU-6 dungeon graph, a review file for gate G1 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
format: mu6-0
map: XD-24
key: xd24
name: Nightshadow Crypt
stands_on: X3 Lifeforce Lagoon (under Nightshadow's square)
class: S
band: "S: at most 15 sectors and 20 M units², 15-30 monsters, 0-3 chests, 3-8 doors"
party: [25, 29]
monsters:
  levels: [32, 40]
  boss: Count Draco 45
  count: 22
  groups: [2, 3]
  families:
    - "Vampires A-B: Gnome Vampire 32 (16, the source town's), Vampire 40 (5, the Count's household)"
    - "Count Draco 45 (A2's boss row 11293, blink on hit)"
treasure: {level: 3, hoard: 4}
role: "Q-C7 The Count of Nightshadow: Count Draco's death sets q-c7.done (Nightshadow liberated; Du Monay's Nosferatu)"
role_short: "Q-C7, Nosferatu"
set_piece: "Draco's resting vault: his great sarcophagus on a dais under a ribbed vault, open only by night; the gallery of his portraits on the way"
floors:
  - {floor: 0, name: "Under the square", height: 0}
  - {floor: -1, name: "Catacombs", height: -640}
  - {floor: -2, name: "The Count's vault", height: -1280}
spaces:
  # floor 0: the town's crypt under the square
  - {id: room:stair_foot, name: Coffin stair foot, kind: stair, size: S, floor: 0, at: [1, 0], monsters: 0,
     purpose: "The foot of the stair from Draco's coffin on the square; old earth, candle stubs. No monsters (D-11.3)."}
  - {id: room:ossuary, name: Town ossuary, kind: room, size: M, floor: 0, at: [2, 0], monsters: 4,
     population: [{family: Vampires, count: 4, strength: pack, rank: a}],
     purpose: "Nightshadow's dead, skulls stacked to the vault; gnome vampires sleeping among the bones."}
  - {id: room:niches, name: Gnome niches, kind: corridor, size: M, floor: 0, at: [2, 1], monsters: 5,
     population: [{family: Vampires, count: 5, strength: pack, rank: a}],
     purpose: "Rows of small coffins in wall niches, lids ajar: 'The coffin is empty.' Their owners are up."}
  - {id: room:chapel, name: Night chapel, kind: hall, size: M, floor: 0, at: [3, 0], monsters: 3,
     population: [{family: Vampires, count: 3, strength: light, rank: a}],
     purpose: "The town's burial chapel turned to the moon: a black altar, a moon window painted on the wall; the stair down."}
  - {id: room:sexton, name: "Sexton's room", kind: room, size: S, floor: 0, at: [4, 0], chest: 3, monsters: 0,
     purpose: "The old sexton's bed and his lockbox of burial fees, untouched since he was bitten."}
  # floor -1
  - {id: room:cata_w, name: West catacomb, kind: corridor, size: M, floor: -1, at: [2, 0], monsters: 2,
     population: [{family: Vampires, count: 2, strength: light, rank: a}],
     purpose: "Loculi three high; the chapel stair arrives here."}
  - {id: room:gallery, name: "Draco's gallery", kind: hall, size: M, floor: -1, at: [3, 0], set_piece: true, monsters: 1,
     population: [{family: Vampires, count: 1, strength: heavy, rank: b}],
     purpose: "Portraits of the Count down the centuries, the same face in every one; the vault stair at its end."}
  - {id: room:cata_e, name: East catacomb, kind: corridor, size: M, floor: -1, at: [4, 0], monsters: 2,
     population: [{family: Vampires, count: 2, strength: light, rank: a}],
     purpose: "Older loculi, collapsed in places; a draught from the feast hall."}
  - {id: room:feast_hall, name: "The Count's feast hall", kind: hall, size: M, floor: -1, at: [3, 1], chest: 3, monsters: 2,
     population: [{family: Vampires, count: 2, strength: heavy, rank: b}],
     purpose: "A long table laid for guests who never left; silver plate in a chest at the head of the table."}
  # floor -2
  - {id: room:draco_vault, name: "Draco's resting vault", kind: hall, size: L, floor: -2, at: [1, 0], set_piece: true, boss: true, goal: true,
