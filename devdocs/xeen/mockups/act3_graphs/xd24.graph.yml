  - {id: link:private_stair, from: room:draco_vault, to: room:stair_foot, kind: one_way, label: "the Count's stair",
     opened_by: state:draco, notes: "A secret stair behind the dais up to the stair foot; it opens from below when Draco dies (the way back)."}
states:
  - {id: state:coffin, kind: qbit, where: "X3, Draco's coffin on the square (q-c7.coffin)", what: "The three sundials at nine (q-c7.dials_set) and night: the coffin's lid slides aside on a stair down (q-c7.coffin_opened, 112143). It stays open after.", opens: []}
  - {id: state:night, kind: puzzle, where: room:vault_stair, what: "Time of day: the vault's iron door opens only by night (Xeen.isNight). By day: 'The lid refuses to budge. A symbol etched on the surface of the lid flashes pale blue whenever you try to move it.'",
     opens: [link:vault_door], draw: false}
  - {id: state:draco, kind: kill, where: room:draco_vault, what: "Count Draco's death (a kill timer): q-c7.draco sets q-c7.done (112141); the Count's stair behind the dais opens.",
     opens: [link:private_stair]}
exits:
  - {id: exit:x3_coffin, space: room:stair_foot, at: [0, 0], kind: both, label: "X3: Draco's coffin",
     neighbour: "Draco's coffin on Nightshadow's square (X3 thing:coffin_open, face 17664, -4608, 992); the crypt's exit arrives at (17664, -5120, 992) facing south (1536)"}
critical_path: [room:stair_foot, room:ossuary, room:chapel, room:cata_w, room:gallery, room:vault_stair, room:draco_vault]
return_path: [room:draco_vault, room:stair_foot]
loops:
  - {id: loop:square, spaces: [room:stair_foot, room:ossuary, room:chapel, room:niches], notes: "Round the town's crypt: ossuary or niches to the chapel."}
  - {id: loop:catacombs, spaces: [room:cata_w, room:gallery, room:cata_e, room:feast_hall], notes: "Round the catacombs through the feast hall."}
  - {id: loop:count_stair, spaces: [room:stair_foot, room:chapel, room:cata_w, room:gallery, room:vault_stair, room:draco_vault], notes: "Down through the crypt, back up the Count's own stair once he is dead."}
lines:
  - {text: "The coffin is empty", ref: "aaze0029:3", where: room:niches}
  - {text: "Only at night can you put up a fight.", ref: "aaze0029:6", where: "room:vault_stair, cut over the iron door"}
  - {text: "The lid refuses to budge. A symbol etched on the surface of the lid flashes pale blue whenever you try to move it.", ref: "aaze0029:24", where: "room:vault_stair, the iron door by day (as the coffin on X3)"}
  - {text: "Open his coffin and bid him farewell; only then can you use the magic of the well.", ref: "aaze0029:8", where: "room:draco_vault, on the sarcophagus's foot (the rhyme's second half; X3 has the board)"}
open_questions:
  - "Night inside: X3's coffin stays open after its first night (q-c7.coffin is once), so the party can walk in by day. Repeat the night gate on the vault's iron door (proposed, the source's 'Only at night can you put up a fight' stays true; resting in the gallery waits for 21:00), or fight Draco at any hour?"
  - "Kill XP: 16 Gnome Vampires 32, 5 Vampires 40 and Draco 45 at L(L+10) are about 8.5k per member, half of MAPS's 17.9k for the three dungeons; with XD-22 (6.2k) and XD-23 (4.7k) the three come to about 19.4k (+8 %, 77 monsters for 84). Accept, or swap the five Vampires 40 for Gnome Vampires (about 7.7k)?"
  - "Gnome Vampires (32) are over the party's 25-29 on arrival, as MAPS's 30-40 band says. Keep, or open with Night bats (Beholder Bat 20, the town's) in the ossuary and niches?"
  - "The Count's stair (one-way up to the stair foot) needs the party to arrive beside the coffin's stair: no new exit, the same arrival. Agreed?"
