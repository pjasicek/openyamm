  - {id: state:alibaba, kind: password, where: room:alibaba,
     what: "'Ali Baba Chest. What's the password?': open sesame or opensesame (q-d19.ali_baba). Answer-giver: the guild memo on the ground floor.",
     opens: [], draw: false}
  - {id: state:strong_key, kind: item, where: room:fence,
