     purpose: "Desks, scales, sacks of coin; the ledger on the big desk (q-d19.ledger); the Master Thief (NPC 5109) in a high chair: 'You got past the gongs and the chest. Impressive.'"}
  - {id: room:landing4, name: Top landing, kind: stair, size: S, floor: 3, at: [2, 1], monsters: 0,
     purpose: "The third stair arrives here under the slate cone's beams."}
  - {id: room:library, name: "Thieves' library", kind: room, size: M, floor: 3, at: [3, 1], monsters: 2,
     population: [{family: Outlaws, count: 1, strength: light, rank: b}, {family: Outlaws, count: 1, strength: light, rank: c}],
     purpose: "Two books on a lectern: the Manual of Master Thievery and the Prince Book ('For the eyes of the prince only!'), and shelves of other people's diaries."}
  # floor 2
  - {id: room:gong3, name: Third gong, kind: room, size: M, floor: 2, at: [2, 0], set_piece: true, monsters: 3,
