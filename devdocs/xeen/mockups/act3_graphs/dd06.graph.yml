# MU-6 dungeon graph, a review file for gate G1 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
# The source's four-storey tower as one BLV (WORLD_DESIGN §6): four floors stacked, each floor's stair up behind a
# gong door, the stairs alternating sides so every floor is crossed; the thieves' getaway chute is the quick way down.
format: mu6-0
map: DD-06
key: dd06
name: Southern Tower
stands_on: D2 Sprite Forest and Ogre Pass
class: M
band: "M: 20-45 sectors, 30-90 M units², 45-75 monsters, 3-7 chests, 6-16 doors"
party: [22, 26]
monsters:
  levels: [12, 30]
  boss: null
  count: 45
  groups: [2, 3]
  families:
    - "Outlaws A-C: Rogue 12 (6, the ground floor's lookouts), Thief 18 (26), Master Thief 30 (9, four of them the Master Thief's peaceful bodyguards)"
    - "Wolves and cats A-B: Dark Wolf 16 (2), Sabertooth 22 (2), the guild's hounds"
    - "The Master Thief: talking actor NPC 5109 (Q-D19); fights if attacked (a boss row is an open question)"
treasure: {level: 3, hoard: 4}
role: "Q-D19 The Southern Tower: the thieves' ledger (Luna's statuettes, Thaddeus's jewel), the Ali Baba chest (the Eastern Tower key, Q-D18), 2 Energy Disks (M18), the Master Thief's inner circle (Assassin, Sniper)"
role_short: "Q-D19, Assassin/Sniper"
set_piece: "Three bronze gongs, one at each floor's stair door ('Ring gong how many times?'); the Ali Baba chest ('What's the password?'); the counting room where the Master Thief sits behind his ledger"
floors:
  - {floor: 3, name: "The inner circle", height: 1920}
  - {floor: 2, name: "The practice floor", height: 1280}
  - {floor: 1, name: "The den", height: 640}
  - {floor: 0, name: "The front", height: 0}
