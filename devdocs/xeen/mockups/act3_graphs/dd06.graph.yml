open_questions:
  - "The Master Thief fights if attacked: a boss row in the Outlaws block (11114, 'The Master Thief', level 30, hp x3), or his talking actor on the Master Thief tier row (30)? Proposed a boss row (A2)."
  - "His four bodyguards peaceful until he is attacked (as Hobstadt's court), or hostile, so the party fights into the counting room and then talks?"
  - "Rogue 12 is under DD-06's band of 14: six as light filler on the ground floor (as D-4 did with Mad Fools), or Thieves 18 instead?"
  - "Manual of Master Thievery (source +500,000 experience): a lore book with a one-time 1,500 experience per reader, or a lore book only?"
  - "Prince Book (source +5 levels, behind the Clouds 'Prince of Thieves' title): readable only by a member who sat on the Sphinx's Prince of Thieves throne (Q-C9 player bit 11292, XD-15, Act IV), +2 Luck once; others read 'For the eyes of the prince only!'. Keep, or a lore book only?"
  - "The source's L1 mirror ('The mirror does not respond.'): left out (this world's mirrors are in towns), or one of the Darkside mirrors after M26?"
