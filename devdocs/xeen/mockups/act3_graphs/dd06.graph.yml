     what: "'Ring gong how many times?': 3 or three (q-d19.gongs) opens the stair door. Answer-giver: the guild memo beside this gong. A wrong answer: 'The gong booms, and the echo dies away.'",
     opens: [link:gong1_up], draw: false}
  - {id: state:gong2, kind: password, where: room:gong2, what: "The second gong, the same answer; opens the stair door to the third floor.",
