     purpose: "A bed with velvet hangings ('Bed', 'Nothing here.'); under it the Master Thief's own strongbox, the tower's hoard (tier 4)."}
  - {id: room:getaway, name: Getaway hatch, kind: shaft, size: S, floor: 3, at: [0, 1], monsters: 0,
     purpose: "A trapdoor in the floor over a polished chute down the tower's inside wall: the thieves' way out when the door is watched."}
  - {id: room:counting, name: Counting room, kind: room, size: L, floor: 3, at: [1, 1], set_piece: true, goal: true, monsters: 4,
