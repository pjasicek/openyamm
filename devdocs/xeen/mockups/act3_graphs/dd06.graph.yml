  - {id: room:practice, name: Practice hall, kind: hall, size: L, floor: 2, at: [3, 0], monsters: 5,
     population: [{family: Outlaws, count: 3, strength: pack, rank: b}, {family: Outlaws, count: 2, strength: light, rank: c}],
     purpose: "Where thieves train: dummies hung with bells for pickpockets, a row of practice locks, straw targets for knife throwers and marksmen."}
  - {id: room:strongroom, name: Strongroom, kind: room, size: S, floor: 2, at: [5, 0], goal: true, chest: 3, monsters: 0,
