  - {id: room:gong2, name: Second gong, kind: room, size: M, floor: 1, at: [4, 0], set_piece: true, monsters: 3,
     population: [{family: Outlaws, count: 3, strength: light, rank: b}],
     purpose: "The second gong at the stair door up."}
  - {id: room:landing2, name: Second-floor landing, kind: stair, size: S, floor: 1, at: [2, 1], monsters: 0,
     purpose: "The first stair arrives here, on the west side."}
  - {id: room:mess, name: Mess hall, kind: hall, size: M, floor: 1, at: [3, 1], monsters: 5,
     population: [{family: Outlaws, count: 5, strength: pack, rank: b}],
     purpose: "Long tables, dice, a stew pot; thieves at dinner."}
  - {id: room:fence, name: "Fence's room", kind: room, size: M, floor: 1, at: [4, 1], chest: 3, monsters: 3,
     population: [{family: Outlaws, count: 2, strength: light, rank: b}, {family: Outlaws, count: 1, strength: light, rank: c}],
     purpose: "Where the loot is sorted and tagged; the fence's lockbox (the chest) holds the Strongroom key."}
  - {id: room:alibaba, name: Treasury, kind: room, size: S, floor: 1, at: [5, 1], set_piece: true, goal: true, chest: 3, monsters: 0,
     purpose: "One great iron-bound chest on a dais: 'Ali Baba Chest. What's the password?' Inside, its treasure, the Eastern Tower's key and a receipt: 'Paid in full. One jewel.' (q-d19.ali_baba)"}
  # floor 0
  - {id: room:door_hall, name: Entrance hall, kind: room, size: M, floor: 0, at: [0, 0], monsters: 0,
     purpose: "Inside the iron-bound door (NO THIEVES on its brass plate outside). A straw heap in the corner where the getaway chute ends."}
  - {id: room:guardroom, name: "Lookouts' room", kind: room, size: M, floor: 0, at: [1, 0], monsters: 4,
     population: [{family: Outlaws, count: 2, strength: light, rank: a}, {family: Outlaws, count: 2, strength: light, rank: b}],
     purpose: "Arrow slits on the clearing, a bell rope, a card game left in the middle."}
  - {id: room:gong1, name: First gong, kind: room, size: M, floor: 0, at: [2, 0], set_piece: true, monsters: 2,
     population: [{family: Outlaws, count: 2, strength: light, rank: a}],
     purpose: "A bronze gong on a frame by the stair door, and the guild memo pinned beside it: ring each gong three times; the chest's word is 'open sesame'; do NOT write this down (q-d19.guild_memo)."}
  - {id: room:tapestry, name: Tapestry hall, kind: hall, size: M, floor: 0, at: [1, 1], monsters: 3,
     population: [{family: Outlaws, count: 2, strength: light, rank: a}, {family: Outlaws, count: 1, strength: light, rank: b}],
     purpose: "A long tapestry of a Mok procession, left from the tower's priests; a button behind it ('Click.')."}
  - {id: room:kennel, name: Kennel, kind: room, size: M, floor: 0, at: [2, 1], monsters: 4,
