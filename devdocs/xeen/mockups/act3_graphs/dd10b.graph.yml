     what: "Each vein gives one rock once (a map variable per vein); the God of Minerals' refill (DD-10B) resets them (open question 2).", opens: [], draw: false}
  - {id: state:refill, kind: qbit, where: room:b_god, what: "q-d7.god_of_minerals: 10,000 gold, refill_paid.", opens: [], draw: false}
exits:
  - {id: 'exit:d2_adit', space: 'room:b_adit', at: [0, 1], kind: both, label: 'D2: east adit', neighbour: 'D2 entrance:dd10b_adit (34, 31) facing south, in the Gemstone foothills'}
hooks:
  - {hook: q-d7.sapphire_veins, space: 'room:b_sapphire', how: each of five veins}
  - {hook: q-d7.god_of_minerals, space: 'room:b_god', how: the God's face (click)}
critical_path: [room:b_adit, room:b_upper, room:b_sapphire, room:b_throne, room:b_god]
return_path: [room:b_god, room:b_flooded, room:b_ramp, room:b_upper, room:b_adit]
loops:
  - {id: 'loop:b', spaces: ['room:b_upper', 'room:b_sapphire', 'room:b_throne', 'room:b_god', 'room:b_flooded', 'room:b_ramp'], notes: 'East: down by the ramp, up by the throne''s stair.'}
lines:
  - {text: 'Exit the Gemstone Mines?', ref: 'dark/aaze0039:0', where: 'each adit (the exit preset''s meaning, D-24)'}
  - {text: Diamond vein / Ruby vein / Emerald vein / Sapphire vein, ref: 'dark/aaze0039:1-4', where: the veins (hover)}
  - {text: You've got all this vein has to offer., ref: 'dark/aaze0039:10', where: a picked vein}
  - {text: A gem exploded!, ref: 'dark/aaze0039:11', where: 'the false veins (B, C)'}
  - {text: Gem maker's throne, ref: 'dark/aaze0039:8', where: 'room:b_throne'}
  - {text: 'I am the god of these mountains. If you give me ... of your gold pieces, I will use them to replenish the gems inside the mountains.', ref: 'dark/aaze0039:16', where: 'room:b_god (A3''s text, the price rescaled to 10,000)'}
open_questions:
  - "q-d7 has one refill bit for three pockets, cleared by the first pocket that refills, and each vein hook gives five rocks at once. Proposed: five veins per gem, one rock each (a map variable per vein); the God sets three bits (refill_a, refill_b, refill_c, A3) and each pocket's veins refill and clear their own. Requests to A3."
  - "False veins and exploding bones: one false vein each in B and C ('A gem exploded!', some fire damage) and one bone heap in A ('The bones explode!'). Or only the crumbling bones (no traps)?"
  - "The Gem maker's throne: a flavour click ('The throne hums. It was not made for you.') or a once-per-character gift (+2 Luck, a gem)? Proposed: flavour; the God is the pocket's device."
  - "Rock golems: the Sand Golem row (11590 A, 22) stands in for the mines' golems. A2 to give the mines a renamed tier ('Rock Golem 22') or keep the name?"
