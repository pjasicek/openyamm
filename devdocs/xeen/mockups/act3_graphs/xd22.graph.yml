lines:
  - {text: "You have dishonored the Ninjas by entering the Pagoda. They surely will not return to reclaim it.", ref: "aaze0003:5", where: "room:master_hall (q-c4.clan_master)"}
  - {text: "I am a peace loving old monk driven from my sacred home. I used to live in the Pagoda due south from here until the Evil Ninja clan drove me out.", ref: "aaze0003:15", where: "X5, Kai Wu (the giver); echoed by his broom and bell in room:porch"}
  - {text: "There are still Ninja in my Pagoda. I cannot go home until they are gone.", ref: "aaze0003:16", where: "X5, Kai Wu"}
  - {text: "You have destroyed the Ninja Clan that drove me from my sacred home. I am eternally grateful. As payment for your services, please let me fill your packs with food.", ref: "aaze0003:17", where: "X5, Kai Wu"}
open_questions:
  - "The clan master has no monster row. A boss in the Ninjas' block (11123, 'Clan Master', 42, look C, blink on hit like Draco), or the Ninja Master 40 placed as the boss with no row of its own?"
  - "Shinobu's survivors are Ninjas, hostile by default. A peaceful placed-only tier (Ninjas D 'Clan Survivor', party friendly, as the King's Guard), or Shinobu alone in the cellar?"
  - "Inside and outside: X5's pagoda is 1,536 × 1,024 at the ground storey, narrowing to 832 × 320 at the top; fights with five ninjas need more. Twice the outside in plan (the shipped way: nobody measures), or keep the outside's size with fewer, smaller rooms per storey?"
  - "Paper screens: indoor destructibles with a translucent paper texture lit from behind (one new texture). Check that a destructible face can be translucent and that monsters wait behind an unbroken screen."
  - "Ninjas' shuriken (attack2 Arrow, 30 %) at party 25-29 in narrow storeys: keep, or drop attack2 for the Ninja tier inside?"
