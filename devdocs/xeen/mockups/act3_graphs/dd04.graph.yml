  - {id: loop:court, spaces: [room:plunder, room:waiting, room:court, room:larder, room:cellar], notes: "Round the court through the cellar and the servants' hatch."}
  - {id: loop:army, spaces: [room:burrow, room:bolt_hole, room:barracks, room:sap, room:larder, room:cellar, room:plunder], notes: "Down through the army, up into the larder."}
lines:
  - {text: "I am Gettlewaithe, Imperator Primus of the Gremlins! Give me one good reason why I should not command my mighty army to cut your grotesque human heads from your shoulders and hang your eviscerated corpses above my throne for the entertainment of my subjects!", ref: "dark/aaze0029:83", where: "room:court, the first step before the throne (open question 3)"}
  - {text: "Excellent. Your display of respect has earned you your lives. What have you come to petition me for?", ref: "dark/aaze0029:87", where: "Gettlewaithe, 'We come in peace' (A3)"}
  - {text: "The answer is no! You will now suffer the consequences of your audacity. Guards!", ref: "dark/aaze0029:93", where: "Gettlewaithe, 'The Mayor's demand' (A3)"}
  - {text: "Well, um, perhaps I can do something about those naughty, naughty pranksters. We can still talk about this like rational beings, can't we?", ref: "dark/aaze0029:95", where: "Gettlewaithe after the guards (A3)"}
  - {text: "I am always at your service, sir.", ref: "dark/aaze0029:98", where: "Gettlewaithe after the court is won (A3)"}
open_questions:
  - "The court guards are Gremlin Guards 22, the family's C tier, over the band's 20; they are the quest's one set fight beside a boss of 24. Keep (proposed), or make them Saboteurs 18?"
  - "Must a party that comes to talk fight its way in? A3: 'the gremlins elsewhere are hostile anyway'. (a) All hostile (as A3 wrote; the party reaches the throne through 13 gremlins); (b) the burrow, hall of pranks and waiting room peaceful until court_hostile, the cellar, larder and the army below always hostile (proposed: the court is a dialogue first, as in the source where it sat in town; kill XP on the peaceful route drops by about half); (c) all peaceful until court_hostile. The relation after court_peace stays A2's (q-d1 notes)."
  - "Gettlewaithe's challenge (aaze0029:83), the line MAPS names for DD-04, is in neither A3's topics nor A4's greeting. Proposed: a one-time step message at the foot of the throne (once per visit until court_won), before the topics; A3 to own the text."
  - "Textures: no Darkside family covers a burrow court. Proposed: Castleview's grey castle stone for the court and the cellar (the court is in the wall's footings), MM7 Tularean Caves 7d08 earth for the burrows, one new picture (the Mayor with a moustache). Or A6 names a family."
  - "The sappers' tunnel stops at water short of the sewer (no link to DD-01). Proposed as drawn; a real link into DD-01 would add an exit and arrival pair for little play."
