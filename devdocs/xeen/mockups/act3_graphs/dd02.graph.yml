lines:
  - {text: "Exit Ellinger's Tower?", ref: "dark/aaze0053:0", where: room:entry}
  - {text: "Where to? / Destination Unknown / The mirror does not respond.", ref: "dark/aaze0053:1-2, :11", where: "room:entry, the dead mirror"}
  - {text: "Intruders, answer the following question or be destroyed!", ref: "dark/aaze0053:3", where: "room:question (A3's m17.question)"}
  - {text: "Tapestry / Click / Nothing happens", ref: "dark/aaze0054:0-2", where: "room:tapestry1, room:tapestries"}
  - {text: "Book of Fire / Book of Electricity (+5 Fire, +5 Air resistance; the source's +20 rescaled) / You learn nothing more from the book.", ref: "dark/aaze0054:5-8, :11", where: room:library}
  - {text: "Who do you seek? / You may pass! / Begone!", ref: "dark/aaze0056:2, :3, :0", where: "room:pass_door (A3)"}
  - {text: "Boots of Paradise, by Ellinger J. Hofenhager. 'Ah, lovely boots! Sweet leather foot holders, hard iron hobnail, how I adore thee!'", ref: "dark/aaze0056:9", where: "room:study (A3)"}
  - {text: "Book of Sorcerer's Knowledge: 'Reading the book improves your mind.' / '... the pages begin to swim before your eyes and your head begins to ache.'", ref: "dark/aaze0056:4-7", where: room:study}
open_questions:
  - "Book of Sorcerer's Knowledge: the source gives +25 Intellect or, to the wrong reader, pain. Proposed: +2 Intellect once per character for a reader with Intellect 20 or more; below that the source's headache (some damage, 'you put it back on the shelf') and nothing else. Or +2 for anyone, no harm?"
  - "Monsters: the source names beholder bats; the rest are ours. Proposed: Ellinger's wards as Flying Feet and two Guardians (the Act II constructs at their low tiers), gargoyle statues that wake, and bats. Alternative: bats and gargoyles only."
  - "D1 has the tower as a round building in the north-east quarter with no height. The graph has five storeys (ground, gauntlet, library, tapestry floor, study), about 2,300 high inside; MM interiors may be larger than the outside, but the outside should read as five storeys with windows and a slate cone. Request A6 (D1)."
  - "The dead mirror in the entry hall ('Destination Unknown'): (a) flavour only (proposed); (b) a Darkside mirror stop that wakes with Kalindra's stage 4 (A4's mirror network)."
  - "The lift (D-9.2): one cage in a closed shaft from the ground floor to the study, no stops between, so the gauntlet is not bypassed before M17. Confirm no stops on floors 1-3."
