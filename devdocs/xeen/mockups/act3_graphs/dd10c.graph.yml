  - {text: 'Exit the Gemstone Mines?', ref: 'dark/aaze0039:0', where: 'each adit (the exit preset''s meaning, D-24)'}
  - {text: Diamond vein / Ruby vein / Emerald vein / Sapphire vein, ref: 'dark/aaze0039:1-4', where: the veins (hover)}
  - {text: You've got all this vein has to offer., ref: 'dark/aaze0039:10', where: a picked vein}
  - {text: A gem exploded!, ref: 'dark/aaze0039:11', where: 'the false veins (B, C)'}
open_questions:
  - "DD-10C stands on D6 (Act V, party 48-51) with Act III's band. (a) Keep it on D6 and raise the north pocket to D6's lower band (about 38-50), so diamonds (Hector's best gear, 10 gems) are Act V gear and the 20 monsters move from the Act III group to Act V (A2's recount) (proposed: the source put the diamond mine in the Forbidden Zone); (b) move the north pocket's adit to D1's mine hills by the D6 road (A6), Act III as planned; (c) a D6 adit right at the end of D1's mountain road, Act III monsters, the party walking a few hundred units of D6."
  - "q-d7 has one refill bit for three pockets, cleared by the first pocket that refills, and each vein hook gives five rocks at once. Proposed: five veins per gem, one rock each (a map variable per vein); the God sets three bits (refill_a, refill_b, refill_c, A3) and each pocket's veins refill and clear their own. Requests to A3."
  - "False veins and exploding bones: one false vein each in B and C ('A gem exploded!', some fire damage) and one bone heap in A ('The bones explode!'). Or only the crumbling bones (no traps)?"
  - "Rock golems: the Sand Golem row (11590 A, 22) stands in for the mines' golems. A2 to give the mines a renamed tier ('Rock Golem 22') or keep the name?"
  - "Textures: proposed MM7 Nighon Tunnels 7d35 for all three pockets (Darkside rock, not XD-02's red Snergle rock) plus four vein textures (one per gem). A6 to confirm or name another family."
