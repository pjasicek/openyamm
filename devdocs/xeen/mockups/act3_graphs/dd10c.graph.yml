  - {id: room:c_lava, name: Lava gallery, kind: cave, size: M, floor: 2, at: [1, 0], monsters: 4,
     population: [{row: Lava Roach, level: 26, count: 4}], purpose: "A drift along a seam of cooling lava; heat shimmer."}
  - {id: room:c_diamond, name: Diamond cavern, kind: cave, size: L, floor: 2, at: [2, 0], set_piece: true, goal: true, monsters: 6,
