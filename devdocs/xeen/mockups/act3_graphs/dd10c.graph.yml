  count: 20
  groups: [2, 3]
  families:
    - "Giant crawlers (11360): Lava Roach 26 (8)"
    - "Elemental golems (11590): Sand Golem 22 (6)"
    - "Arachnoids (11330): Arachnoid Queen 24 (6) (Act III numbers; open question 1)"
  mix:
    - {row: Lava Roach, id: 11362, level: 26, count: 8}
    - {row: Sand Golem, id: 11590, level: 22, count: 6}
