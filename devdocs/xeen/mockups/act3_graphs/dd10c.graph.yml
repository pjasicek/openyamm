# MU-6 dungeon graph, a review file for phase 3 (not a brief). See dd01.graph.yml's header. One of the three
# Gemstone Mines pockets (DD-10A, B, C), each its own map; the open questions shared by the three are repeated.
format: mu6-0
map: DD-10C
key: dd10c
name: "Gemstone Mines, north pocket"
stands_on: D6 The Forbidden Zone
class: S
band: "S: 6-15 sectors, 7-20 M units², 15-30 monsters, 0-3 chests, 3-8 doors (at most 15 sectors and 20 M units²)"
party: [23, 27]
