open_questions:
  - "Five shafts against D1's one hatch. D1's plan has one door (the square's hatch, 66, 57). (a) One working shaft, the other four ladders up to grates bolted from above, each foot with its own find (proposed); (b) A6 adds four more working grates on D1 (four more arrivals, D1 and DD-01, and more town-buffer work); (c) a single shaft and no others. Separately, the outfall: a one-way grate to the mill gorge, opened from inside, needs one point on D1 (A6). Recommendation: (a) plus the outfall."
  - "Rat rows. A2's names collide: rats B is 'Rooka 6', sewer_stalkers A 'Rooka 18', the boss 'Rooka the Rat Queen'; rats C and sewer_stalkers B are both 'Sewer Stalker'. A sewer whose commonest monster is a Bat Queen reads wrong. Proposed: A2 renames rats B/C (Sewer Rat 3, Plague Rat 6, Giant Rat 9) and adds a Darkside tier, 'Sewer Rat' 10-12, to replace most of the 21 Bat Queens (kill XP unchanged within 5 %)."
  - "Rooka the Rat Queen is level 24 against a band of 10-20 (the boss after the comma, as MAPS allows for Gettlewaithe 24). Keep at 24 (proposed), or 20?"
  - "Felix the Tinker taught 'Direction Sense' (no MM6-8 skill). (a) A flavour NPC at his tunnel's end, his line kept as a joke, no skill (proposed; A4 adds one NPC); (b) drop him and rename the tunnel."
  - "The sluice as a two-state lever with the culvert's water as a sinking door mover (XD-10's built word), or a plain grate opened by the lever (cheaper, no water)? Proposed: the water, so the 'drain it' reads."
