open_questions:
  - "DD-18 has no quest: no A3 hook names it, and MAPS's role 'Q-D14' belongs to DD-19. It still carries 50 monsters and 14.6k of Act III's kill XP. (a) An optional dungeon (gym, tunnel, treasure 3), MAPS's role corrected (proposed); (b) A3 gives it a reason (a side quest, a disk, a lost item) so Act III's numbers are reached on the played path; (c) shrink it to S."
  - "Barticus' gym. A4 made house 4607 'Barticus' Gym' Sandcaster's training house in town (cap 80); the source's gym is in the sewer, a paid room with two brews (+10 Endurance, +10 Might). Proposed: training stays in town; the sewer room is the gym's 'members' room' under A6's sign: pay once (5,000, the source's 50,000 rescaled), then each character may drink the Vitamin Brew (+2 Endurance) and the Protein Brew (+2 Might) once. A3 owns the texts and price."
  - "The long tunnel reaches D5 (Act V, party 42-45) from an Act III dungeon. (a) Both ways open: an early way into Act V's desert, a trap like X7 (D-1.2); (b) the grate is bolted on the desert side: from the sewer 'Sand blows through the bars. The bolt is on the other side.'; from D5 it opens later and becomes a shortcut back to Sandcaster (proposed); (c) sealed by a rockfall until Act V."
  - "Monsters: sewer stalkers, the cobras of Venom Pond and D3's mantis ants. Or hell hornets in the tunnel (D3's Aging Forest family, 35-50)? Proposed as listed."
