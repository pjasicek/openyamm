lines:
  - {text: "A plaque at the base of the statue reads:  Solve the wood, it's like a tree Cut the branches and return to me Next is stone, it's full of blocks Push them around, expose six rocks Last is iron, there is a key Set the tumblers and you'll be free.", ref: "aaze0081:0", where: room:hub}
  - {text: "A plaque at the base of the statue reads: Home of the Wood / Stone / Iron / Diamond", ref: "aaze0081:2-5", where: "room:hub, its four doors"}
  - {text: "Stone Block - Glowing Rock", ref: "aaze0081:12", where: room:quarry}
  - {text: "Written on a plaque: All is set, it is plain to see Master of Golems I now dub thee.", ref: "aaze0081:1", where: room:diamond_vault}
  - {text: "King's Megacredit!", ref: "aaze0081:11", where: room:diamond_vault}
  - {text: "Exit Golem Dungeon?", ref: "aaze0081:10", where: room:entry}
open_questions:
  - "The source gives +1 level for Master of Golems; the rules forbid +levels. Proposed: the title as a party award plus quest experience (A3)."
  - "Kill XP with 23 wood, 14 stone, 7 iron and the Diamond Golem is about 10.8k per member, 12 % over MAPS's 9.6k (inside the 15 % rule). Trim iron golems to 5 if A2 wants the number."
  - "The block field as a sliding puzzle (blocks move only into an empty neighbour slot) needs one mover per block and slot pair. Simpler fallback: every block slides aside when pushed and six of nine hide rocks (a search, not a puzzle). Which?"
  - "The branches as indoor destructibles (`destructibles`, exists) and the tumblers as two-way levers whose bolts are seen: both with existing words. Confirm."
  - "XD-09 stands on X5, set for party 24-28, while the dungeon is 16-18: the party walks through a harder map to reach it. Keep the door near X5's east edge (by X3) and out of the cyclops corner."
