  - {id: link:cache_n, from: room:mirage_cache, to: room:north_mouth, kind: secret, label: mirage}
  - {id: link:frost_skulls, from: room:frost_cavern, to: room:skulls_1, kind: open}
  - {id: link:frost_sluice, from: room:frost_cavern, to: room:sluice, kind: door}
  - {id: link:mirage_ledge, from: room:mirage_hall, to: room:ledge, kind: stair}
  - {id: link:ledge_maze, from: room:ledge, to: room:mirror_maze, kind: open}
  - {id: link:maze_post, from: room:mirror_maze, to: room:guard_post, kind: open}
  - {id: link:post_echo, from: room:guard_post, to: room:echo_cave, kind: open}
  - {id: link:maze_skulls, from: room:mirror_maze, to: room:skulls_2, kind: secret, label: mirage}
  - {id: link:ledge_drowned, from: room:ledge, to: room:drowned, kind: open, label: "plug pulled", opened_by: state:plug,
