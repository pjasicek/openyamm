  - {id: link:n_icicle, from: room:north_mouth, to: room:icicle_hall, kind: open}
  - {id: link:icicle_mirage, from: room:icicle_hall, to: room:mirage_hall, kind: open}
  - {id: link:mirage_frost, from: room:mirage_hall, to: room:frost_cavern, kind: open}
  - {id: link:frost_s, from: room:frost_cavern, to: room:south_mouth, kind: open}
  - {id: link:icicle_false, from: room:icicle_hall, to: room:false_passage, kind: open}
