# MU-6 dungeon graph, a review file for gate G1 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
format: mu6-0
map: XD-10
key: xd10
name: Cave of Illusion
stands_on: X5 Winterkill Tundra
class: M
band: "M: 20-45 sectors, 30-90 M units², 45-75 monsters, 3-7 chests, 6-16 doors"
party: [17, 19]
monsters:
  levels: [18, 28]
  boss: null
  count: 50
  groups: [2, 3]
  families:
    - "Magic constructs A-B: Flying Feet 18, Guardian 24 (the source's Guardians)"
    - "Elemental golems B: Water Golem 28 (the source's; in the flooded and drained parts)"
treasure: {level: 3, hoard: 3}
role: "Story M12: a talking skull sells the Enchanted Key to the Tower of High Magic (gems)"
role_short: "Story M12"
set_piece: "Mirage walls that dissolve at a touch; a phantom safe; the bronze plug that drains the cave and lays bare its lower levels; talking skulls that sell stats and the key for gems"
floors:
  - {floor: 0, name: "Upper caves", height: 0}
  - {floor: -1, name: "Drowned galleries", height: -640}
  - {floor: -2, name: "Reservoir bed", height: -1280}
spaces:
  # floor 0
  - {id: room:north_mouth, name: North mouth, kind: cave, size: S, floor: 0, at: [1, 0], monsters: 2,
     population: [{family: Magic constructs, count: 2, strength: light, rank: a}],
     purpose: "Ice at the lip; the cave's breath is warm and wet."}
  - {id: room:icicle_hall, name: Icicle hall, kind: cave, size: M, floor: 0, at: [2, 0], monsters: 4,
     population: [{family: Magic constructs, count: 4, strength: pack, rank: a}],
     purpose: "Hanging ice; a side passage that ends in a safe."}
  - {id: room:mirage_hall, name: Hall of Mirages, kind: cave, size: L, floor: 0, at: [3, 0], set_piece: true, monsters: 5,
     population: [{family: Magic constructs, count: 5, strength: pack, rank: b}],
     purpose: "Walls that shimmer like heat; two of them are mirages ('The mirage dissipates with your touch.'); the stair down to the ledge."}
  - {id: room:frost_cavern, name: Frost cavern, kind: cave, size: M, floor: 0, at: [4, 0], monsters: 4,
     population: [{family: Magic constructs, count: 4, strength: pack, rank: b}],
     purpose: "Between the hall and the south mouth; the sluice door."}
  - {id: room:south_mouth, name: South mouth, kind: cave, size: S, floor: 0, at: [5, 0], monsters: 2,
     population: [{family: Magic constructs, count: 2, strength: light, rank: a}],
     purpose: "Out into the Troll Forest."}
  - {id: room:mirage_cache, name: Behind the mirage, kind: cave, size: S, floor: 0, at: [1, 1], chest: 3, monsters: 0,
     purpose: "The real treasure behind the phantom safe's wall; a Potion of Might among it (for the plug)."}
  - {id: room:false_passage, name: Phantom safe, kind: cave, size: M, floor: 0, at: [2, 1], monsters: 2,
     population: [{family: Magic constructs, count: 2, strength: light, rank: a}],
     purpose: "A safe at the end: 'Your hand passes through the safe as though it were not there.' The wall behind it is a mirage."}
  - {id: room:skulls_1, name: Skull alcoves, kind: cave, size: S, floor: 0, at: [4, 1], monsters: 0,
     purpose: "Talking skulls: +2 to a stat for 10 gems each."}
  - {id: room:sluice, name: Sluice, kind: room, size: M, floor: 0, at: [5, 1], set_piece: true, monsters: 3,
     population: [{family: Magic constructs, count: 3, strength: heavy, rank: b}],
     purpose: "A great bronze plug on a chain over the lower water. Pull it (Might): the water drains, the lower caves open."}
  # floor -1
  - {id: room:drowned, name: Drowned gallery, kind: cave, size: L, floor: -1, at: [2, 0], monsters: 4,
     population: [{family: Elemental golems, count: 4, strength: heavy, rank: b}],
     purpose: "Water to the roof until the plug is pulled; then a wet gallery, water golems left in its pools."}
  - {id: room:ledge, name: Ledge over the water, kind: corridor, size: M, floor: -1, at: [3, 0], monsters: 0,
     purpose: "Overlook: the flooded reservoir below and, once drained, its floor, a wreck and a grotto."}
  - {id: room:mirror_maze, name: Mirror maze, kind: cave, size: M, floor: -1, at: [4, 0], set_piece: true, monsters: 5,
     population: [{family: Magic constructs, count: 5, strength: pack, rank: b}],
     purpose: "Ice walls that show the party themselves; one is a mirage."}
  - {id: room:guard_post, name: Guardian post, kind: cave, size: M, floor: -1, at: [5, 0], chest: 3, monsters: 5,
     population: [{family: Magic constructs, count: 5, strength: heavy, rank: b}],
     purpose: "Guardians round a chest."}
  - {id: room:echo_cave, name: Echo cave, kind: cave, size: S, floor: -1, at: [6, 0], monsters: 2,
     population: [{family: Magic constructs, count: 2, strength: light, rank: a}],
     purpose: "The cave answers in the party's own voices; a cache of gems (for the skulls)."}
  - {id: room:skulls_2, name: Deep skull alcoves, kind: cave, size: S, floor: -1, at: [4, 1], monsters: 0,
     purpose: "Behind the maze's mirage: skulls selling +3 for 20 gems and +5 for 50."}
  # floor -2
  - {id: room:sump, name: Sump, kind: cave, size: M, floor: -2, at: [1, 0], monsters: 3,
     population: [{family: Elemental golems, count: 3, strength: pack, rank: b}],
     purpose: "Where the water went: a roaring hole and the last water golems."}
  - {id: room:wreck, name: Sunken boat, kind: room, size: S, floor: -2, at: [2, 0], chest: 3, monsters: 2,
     population: [{family: Elemental golems, count: 2, strength: light, rank: b}],
     purpose: "A boat on the drained floor, its strongbox intact."}
  - {id: room:reservoir, name: Reservoir bed, kind: cave, size: L, floor: -2, at: [3, 0], set_piece: true, monsters: 5,
     population: [{family: Elemental golems, count: 5, strength: pack, rank: b}],
     purpose: "The drained floor: weed, shells, stranded water golems."}
  - {id: room:grotto, name: Grotto of the great skull, kind: cave, size: M, floor: -2, at: [4, 0], goal: true, monsters: 0,
     purpose: "The great skull: the key to the Tower of High Magic for gems (M12); +5 to Endurance, Accuracy or Might for 200."}
  - {id: room:phantom_vault, name: Phantom vault, kind: cave, size: S, floor: -2, at: [5, 0], chest: 3, monsters: 2,
     population: [{family: Elemental golems, count: 2, strength: heavy, rank: b}],
     purpose: "Behind a mirage in the grotto: the cave's hoard."}
