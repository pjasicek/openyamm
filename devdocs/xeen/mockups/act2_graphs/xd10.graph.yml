  - {id: link:grotto_vault, from: room:grotto, to: room:phantom_vault, kind: secret, label: mirage}
states:
  - {id: state:plug, kind: lever, where: room:sluice,
     what: "Pull the plug: wants Might ('You aren't strong enough to pull the plug.'); the water falls over a few seconds, seen from the ledge. A Potion of Might lies behind the mirage near the north mouth.",
     opens: [link:ledge_drowned, link:ledge_reservoir, link:drowned_wreck], draw: false}
  - {id: state:enchanted_key, kind: item, where: room:grotto, what: "The great skull sells the Enchanted Key for gems (E13); it opens the Tower of High Magic (XD-11) on X3.", opens: []}
