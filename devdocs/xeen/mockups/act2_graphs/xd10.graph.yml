  - {id: exit:x5_north, space: room:north_mouth, at: [0, 0], kind: both, label: "X5: Ogre Hills, north mouth",
     neighbour: "Cave mouth on X5 by the frozen lake in the Ogre Hills (source B3 0,2)"}
  - {id: exit:x5_south, space: room:south_mouth, at: [6, 0], kind: both, label: "X5: Troll Forest, south mouth",
     neighbour: "Cave mouth on X5 in the Troll Forest (source B4 2,15)"}
critical_path: [room:north_mouth, room:icicle_hall, room:mirage_hall, room:frost_cavern, room:sluice, room:frost_cavern, room:mirage_hall,
  room:ledge, room:reservoir, room:grotto]
return_path: [room:grotto, room:reservoir, room:wreck, room:drowned, room:ledge, room:mirage_hall, room:frost_cavern, room:south_mouth]
loops:
  - {id: loop:mirages, spaces: [room:north_mouth, room:icicle_hall, room:false_passage, room:mirage_cache], notes: "Through the phantom safe's wall and back to the mouth: two mirages."}
  - {id: loop:drained, spaces: [room:ledge, room:reservoir, room:wreck, room:drowned], notes: "Down the steps, up through the drowned gallery; closed until the plug is pulled."}
  - {id: loop:through, spaces: [room:north_mouth, room:icicle_hall, room:mirage_hall, room:frost_cavern, room:south_mouth], notes: "In at one mouth, out at the other, back over X5."}
lines:
  - {text: "The mirage dissipates with your touch.", ref: "aaze0042:24", where: "every mirage wall"}
  - {text: "Your hand passes through the safe as though it were not there.", ref: "aaze0042:72", where: room:false_passage}
  - {text: "You aren't strong enough to pull the plug.", ref: "aaze0042:23", where: room:sluice}
  - {text: "\"For 10 gems I'll increase your luck,\" the skull says.", ref: "aaze0042:26", where: room:skulls_1}
  - {text: "\"For 300 gems I'll give you a key, the skull says.", ref: "aaze0045:48", where: room:grotto}
  - {text: "The skull gives you the key to the tower of High Magic.", ref: "aaze0045:54", where: room:grotto}
  - {text: "Leave the Cave of Illusion?", ref: "aaze0042:49", where: "both mouths"}
open_questions:
  - "Mirage walls: default with existing words, a wall-textured door that sinks at once when clicked, with the line. The walk-through kind (translucent faces, no collision; PLAN_YAML_NEEDS) needs a new studio and engine word. Which?"
  - "Draining: a water face lowered as a mover, with the flooded passages closed until it is down. Check the engine draws and collides an indoor water face that moves; fallback: a qbit swap of two face sets (full, drained) with a fade."
  - "The plug's Might check: the source wants Might 50. Proposed: one member's Might at least 30, or a Potion of Might (placed in the cave)."
  - "Gem prices (source: 10, 20, 50, 200 gems; the key 300) and the stat rises (+2, +3, +5; source +10 at 200 gems) are A2's. Gem payment needs E13."
  - "Which mouth is the arrival? Proposed north (Ogre Hills); either works, the plug and the grotto are central."
  - "XD-10 stands on X5, set for party 24-28; the dungeon is 17-19. As XD-09: keep both mouths near X5's east edge."
