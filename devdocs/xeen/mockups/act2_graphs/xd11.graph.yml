open_questions:
  - "Brews: the source gives +10 to a resistance permanently per brew (six brews). Proposed +5 once per character; A2 sets it."
  - "The Art of Magic teaches Prestidigitation, which MMerge has no skill for. Replace with a skill the ruleset has (e.g. Identify Item to Expert), or a readable only?"
  - "Carnage Hand (35) is over the band's 32 and stays for Darzog's Tower; Sorceress 30 is the top tier here. Agreed?"
  - "The lift core: one tall lift with four stops whose gates open from the floor side. Check the studio's lift can stop at more than two heights; fallback: three short lifts stacked."
  - "The source's L4 Fire Dragon is left out (over the band). Agreed?"
