lines:
  - {text: "A plaque at the base of the statue reads: Welcome to the Tomb of a Thousand Terrors. Insanity is our fame, undead is our game.", ref: "aaze0080:0", where: room:welcome}
  - {text: "Manacles / Cage / Iron Maiden / Stocks", ref: "aaze0080:11-13,25", where: "room:gallery and its rooms"}
  - {text: "The coffin is empty.", ref: "aaze0080:1", where: room:west_mourning}
  - {text: "You are not strong enough to open the coffin.", ref: "aaze0080:10", where: room:coffin_vault}
  - {text: "King's Megacredit!", ref: "aaze0080:26", where: room:coffin_vault}
  - {text: "Red Tomb Juice ... White Tomb Juice / The liquid is powerless.", ref: "aaze0080:2-9", where: room:embalming}
  - {text: "Leave the Tomb of a Thousand Terrors?", ref: "aaze0080:24", where: room:door}
open_questions:
  - "The tomb is named for its Tomb Terrors, but the Spirits' C tier (Tomb Terror) is 40, over the band's 30. Leave them out, or place one at the hoard as an optional strong guard?"
  - "Tomb juices: the source gives +5 permanent per colour (seven stats). Proposed +2 once per character, as XD-02's pools; A2 sets it."
  - "Megacredits: proposed 5 here (Yak 6 + Tomb 5 + Golem 5 = 16 for the 15 needed). The source has 8. A3's call."
  - "The cage as a lift (a moving cage with the party inside): the studio has lifts; check a lift can carry a cage model that rides with it."
