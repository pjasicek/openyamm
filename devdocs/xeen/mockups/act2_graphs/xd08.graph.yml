    - "Rotting dead C: Grave Ghoul 18"
    - "Spirits A-B: Polter-Fool 18, Tomb Guard 26"
    - "Tomb Terror 40 only if the user wants one at the hoard (open question)"
treasure: {level: 2, hoard: 3}
role: "Story M10: five King's Megacredits (proposed; the source holds 8)"
role_short: "Story M10"
set_piece: "Torture devices that work: the manacles raise a portcullis, the iron maiden is a secret stair, the hanging cage is a lift; seven coloured tomb juices"
