lines:
  - {text: "Woodpile / Rubble / Bones", ref: "aaze0072:1,3,5", where: room:great_hall}
  - {text: "You find a message that reads: \"la\".", ref: "aaze0073:1", where: room:great_hall}
  - {text: "Food.  Fill pack?", ref: "aaze0073:0", where: room:pantry}
  - {text: "A plaque at the base of the statue reads: Built in honor of Great Adventurers.", ref: "aaze0073:3", where: room:statue_court}
  - {text: "A short distance down the stairs you find the way blocked with rubble. You are unable to continue down, so you come back up.", ref: "aaze0073:7", where: room:dungeon_stair}
  - {text: "YOUR well / Even your well's water is cool and refreshing.", ref: "aaze0073:8,9", where: room:statue_court}
  - {text: "You find a note which reads:  \"to\". / \"ry\".", ref: "aaze0074:0,1", where: "room:cellar, room:old_lab"}
  - {text: "What is the password? / Incorrect!", ref: "aaze0073:15,16", where: room:vault_door}
  - {text: "The pedestal is cool to the touch.", ref: "aaze0073:12", where: room:sword_vault}
open_questions:
  - "Stage 3 comes after M21 (Darzog's Tower, party about 33-36), but MAPS sets XD-13 at 14-16 with monsters 16-24. The cellar and vault would be trivial then. Raise the stage-3 groups to the Act IV band (about 30-45), or make the dungeon a quiet walk to the sword?"
  - "The password's answer-givers: the five syllable notes (two only reachable at stage 3) and Elona in Shangri-La, which the party reaches in Act V, after M23. Add Crodo saying the word when freed (M21)? Proposed yes."
  - "Should the syllable notes be numbered (1 la ... 5 ry) so their order is plain?"
  - "The keep's services as house doors inside a BLV (smithy, training, temple, bank): check the engine opens houses from BLV doors (MM7's castle does); otherwise they move outdoors on X3."
  - "YOUR well: the source's +20 AC; proposed a day-long AC buff of MM6-8 size, set by A2."
