lines:
  - {text: "Only Crusaders are allowed to enter Castle Burlock.", ref: "aaze0014:8", where: room:gatehouse}
  - {text: "The plaque reads:  Don't worry, be happy.", ref: "aaze0064:8", where: room:great_hall}
  - {text: "The plaque reads:  Prince Roland's ceremonial armor.", ref: "aaze0064:7", where: room:armour_gallery}
  - {text: "NO MIRROR?!?  Get out of my sight!", ref: "aaze0064:13", where: room:throne_room}
  - {text: "The plaque reads: Peasant's choice award--Best Ruler of the Year (597)", ref: "aaze0065:0", where: room:west_gallery}
  - {text: "The plaque reads: Speak softly, but carry a large magic sword.", ref: "aaze0065:3", where: room:west_gallery}
  - {text: "You teleported into the air outside the tower!", ref: "aaze0065:7", where: room:old_throne}
  - {text: "Don't look so disappointed.  I'm not a damsel in distress, but there is a quest you could perform for me.", ref: "aaze0066:0", where: room:roxanne_parlour}
  - {text: "The plaque reads:  Remember, eat less and think thin.", ref: "aaze0066:6", where: room:roxanne_parlour}
  - {text: "The water refreshes you.", ref: "aaze0064:29", where: room:well_court}
  - {text: "Black Liquid / + 10 Might (Permanent)", ref: "aaze0063:3,5", where: room:frozen_cistern, notes: "Rescaled to +2."}
open_questions:
  - "Who fights in a friendly castle? Proposal: the court is peaceful (King's Guard 40 friendly); the 50 hostiles are the court's mad fools and roosting gargoyles in the abandoned west tower, and the ice trolls loose in the dungeon."
  - "Mad Fool is level 8, under the band's 10; keep it as light filler or give Madmen a tier at 12?"
  - "Ice Troll at 18 (the Trolls A row renamed for this map) or a row of its own? MONSTERS lists the Ice Troll as a troll tier."
  - "The caged Fire Dragon (75) at party 12-14: optional behind a lever with a warning, like X2's lake dragons. Keep it, or make the cage a sight only?"
  - "The old throne throws the party into the air over X4 (the source). Or into X8 Cloudreach?"
  - "Black Liquid +10 Might in the source; proposed +2 once per character (as XD-02's pools)."
