# MU-6 dungeon graph, a review file for phase 6 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
# `mix` is the placed monster list by row (level, count); kill XP per member = sum of L(L+10) x count / 4 (MAPS §0).
# The source: dark mazes 117-120 "Dragon Tower Level 1-4" (text dark/aazex117-120; their monsters read xeen.mon:
# Acid, Fire and Frost Dragons and the Dragon King) and 121-124 "Dungeon of Death Level 1-4" (aazex121-124; each
# level 32 x 32 with mazes 165-176). The tower: Alister the druid on L1 wants a Dragon Egg (:117:1-3); beds, bones with
# two dead adventurers' notes on L2 (the druid is a fraud; "the secret of the dragon has something to do with forever,
# or really, really big", 118:3-4); on L3 the egg's floor, a +40 Endurance potion and two more notes (crystal balls;
# "The eye of the Dragon holds the Silver Key Card", 119:2-6); on L4 the Tome of Great Experience (120:2-4); the roof
# to the Dragon Clouds (map 128: the Eye's riddle INFINITY, the runes IN/FI/NI/TY). The Dungeon of Death (Sandro's
# old home): L1 a walk-in crossword of 89 Xeen clues that gates the descent (121:1-2, :11-188); L2 Welcome, Ballroom,
# two Game Rooms, Do Not Disturb, coffins, the Throne of the Dead, the Master's Throne, four Shrines of Evil, four
# dials, Sandro's note (122:0-25); L3 four gongs and a lever ("Ring the four gongs and then pull the lever. Touch any
# treasure and you'll have to start over!"), a fountain (123:0-5); L4 the Lord Xeen Machine, four core terminals, the
# main terminal, maintenance papers, the control room (124:0-13). Ours: one BLV, the tower's four floors above X7's
# crag top and the Dungeon of Death's three below it, joined by Sandro's door in the gate hall's floor (Q-F2's key,
# item 12354). Dragons (cloud rows 487 high, radius 238; dark rows 500 high; Fly Y) stay on their floors by low
# openings (D-32: 288 or less); liches 180, knights 152, Autobots 228 tall.
format: mu6-0
map: FD-04
key: fd04
name: Dragon Tower and the Dungeon of Death
stands_on: X7 Mount Firestone (the tower on its crag at the rim)
class: M
band: "M: 20-45 sectors, 30-90 M units², 45-75 monsters, 3-7 chests, 6-16 doors (MAPS §0: 60 at 65-100, groups 1-3, 96.8k)"
size: "32 review rooms, about 42 sectors (the ring hall, the nest, the high hall, the crown, the crossword, the ballroom and the machine hall two each); the tower's four round floors about 3,072 across (z 0 to 3,840, 1,280 apart: larger than X7's 1,024 shell, DECIDE 8), the dungeon's three floors about 4,600 x 3,200, 3,600 x 2,400 and 2,560 x 1,536 (z -1,024 to -2,560): about 58 M units²; 11 doors (the gate's inner leaves, the dormitory, the crown's low door, the tome room, the Wyrm's Hall's house door, Sandro's door, the descent's gate, the welcome hall's two leaves, Do Not Disturb, the iron shutter, the control room)"
