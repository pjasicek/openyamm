  - {hook: "q-f1.note_eye (proposed)", space: room:dead_adventurer, how: "the bones (aazex119:5-6)"}
  - {hook: "q-f1.endurance (proposed)", space: room:dead_adventurer, how: "the potion: +2 Endurance once per character (player bit)"}
