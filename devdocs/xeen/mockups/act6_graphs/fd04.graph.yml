treasure: {level: 6}
role: "Optional finale. Q-F1 Alister and the Dragon Egg (the tower): Alister the druid in the gate hall wants the egg from the nest on floor 2; two dead adventurers' notes say he is a fraud and hint the Eye's answer; the roof stair to X9's Dragon Clouds, where the Eye of the Dragon's riddle (INFINITY, the runes IN/FI/NI/TY) pays an artifact (A5's X9, A3's Q-F1). Q-F2 The Dungeon of Death (the lower half): Sandro's key (Q-D23, item 12354) opens his door; the crossword, the four Shrines of Evil, the gongs, and the Lord Xeen Machine to destroy. Ashkaroth the Eldest Wyrm (house 4853) under the roof, flavour only (D-5.2)"
role_short: "Q-F1 the egg and the roof; Q-F2 the Lord Xeen Machine"
set_piece: "Four. The nest (tower floor 2): a round hall 1,152 high round a bowl of black rock where the eggs lie, Fire and Frost Dragons over it. The crown (floor 3): the top hall under the cone roof, the Energy Dragon before the roof stair, light falling from the cone's vent. The crossword (dungeon floor -1): a hall floored with a grid of pale and black tiles, the clues on plaques round the walls, solved words lighting up across the floor. The Lord Xeen Machine (floor -3): a round hall round a black and brass engine fed by four elemental cores, a terminal at each core"
sounds: "the dragons' and liches' own monster sounds (xeen_energydragon for the crown); four gongs (a shipped gong); the machine's hum and its breaking (a shipped engine loop and explosion, camera shake); a chime and a buzz for the crossword's Correct!/Wrong! (shipped); the fountain's water; music 13 (maps.yml)"
textures:
  family: "None assigned (A6's towers.yml and dungeon_families.yml have none for FD-04): DECIDE 7. Proposed, one shipped family per area: the tower in MM6 Hall of the Fire Lord 6d04 (unused in Xeen; black volcanic block of the same vlc kit as X7's shell vlcwl3a: vlcwl2, vlcwl2b, vlcwl4, vlcwl4b walls, vlcflore, vlcflord, vlcflorc floors, vlctrm4, vlctrm6, vlctrm8 trims, vlcdora, vlcdorb doors); Sandro's halls and the crossword in MM8 Necromancers' Guild d19 (gnecwal1, gnecwal2, gnecwal3, gnecflr, gnecstpf, gnecstpt, gnecclg2, gn_mtl03, tws1h, tws1f, t1books1, t1beds2, trim9_32); the machine floor in MM6 Control Center sci-fi.blv (swll4dk, swll5dk, swfloor2b, swceilf, swr2dk, swdoora, swgirder, trekscrn), the four cores in XD-19's four new core textures (D-51 3(c), shared, not new here)"
  cap: 45
  planned: 36
  new: 2
  new_list: "xfgrid (the crossword's floor tile, pale and black squares), xfword (a glowing tile strip shown over a solved word, one picture for all twelve)"
  distinct_from: "XD-18 Dragon Cave (X7, d17 rock and d16 worked rooms); XD-16 Volcano Cave (X7, 7d07); XD-09's iron level (X5, 6d18's vlcwl3a and vlcwl1: the same vlc kit, another map and face, 6d04's own vlcwl2/vlcwl4 tiles); FD-03 Darkstone Tower (X5, d29, whose shipped faces include gnecwal1 and gn_mtl03 but whose A6 set does not); DD-17, FD-01 and DD-22 (D6, the sci-fi set: Darkside, here only the machine floor)"
