  - {id: exit:x7_gate, space: room:gate_hall, at: [0, 0], kind: both, label: "X7: the Dragon Tower's gate",
     arrival: "entrance:x7_gate: in the gate hall about 256 inside the two leaves, facing north (512) into the tower",
     neighbour: "X7 thing:fd04_gate (door:fd04) at [29, 31.62], gate (-17920, 16578, 2600), two leaves 384 x 448 facing south on the crag top (DECIDE 2: the key); out by the exit preset ('Exit Dragon Tower?', aazex117:4, as the window's meaning, D-24) to X7's entrance:fd04_door (29, 32) = (-17920, 16384, 2592) facing south (1536)"}
  - {id: exit:x9_roof, space: room:roof_stair, at: [5, 0], kind: both, floor: 3, label: "X9: the Dragon Clouds",
     arrival: "entrance:x9_clouds: on the roof stair's top step under the hatch, facing down the stair toward the crown's low door",
     neighbour: "X9's entrance:fd04_roof on the Dragon Clouds (plan.yml (20864, 18304), floor 2,048, facing south; objects.yml marks it at [20352, 17280]: A5 confirms one): the roof hatch is the exit preset there (roof:fd04 in X9's project.yml, sealed until FD-04 exists). X9's way back: a stair down in the dragon-head rock ('Descend into Dragon Tower?', dark/aazex128:0) to this map's entrance:x9_clouds"}
