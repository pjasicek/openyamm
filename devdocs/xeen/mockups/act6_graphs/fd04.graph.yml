lines:
  - {text: "Alister the Druid; \"Ah, brave adventurers, perhaps you can help me.  I need a dragon egg ...\"", ref: "dark/aazex117:0-3 (the +1,000,000 experience dropped)", where: "room:gate_hall (Alister; A3's Q-F1 topics)"}
  - {text: "Exit Dragon Tower?", ref: "dark/aazex117:4", where: "exit:x7_gate (the exit preset's meaning, D-24)"}
  - {text: "I don't trust that druid guy. ... / I think the secret of the dragon has something to do with forever, or really, really big...", ref: "dark/aazex118:3-4", where: "room:bone_alcove"}
  - {text: "You have to be pretty smart to survive a look in one of the crystal balls on the Dragon Cloud. / The eye of the Dragon holds the Silver Key Card.", ref: "dark/aazex119:5-6", where: "room:dead_adventurer"}
  - {text: "Potion; +40 end. perm", ref: "dark/aazex119:2-3 (rescaled to +2, D-4)", where: "room:dead_adventurer"}
  - {text: "Tome of Great Experience; You learn nothing new from the Tome", ref: "dark/aazex120:2-4 (the +10,000,000 dropped)", where: "room:tome_room"}
  - {text: "Sorry, the crossword puzzle is not done yet.  You may not descend!", ref: "dark/aazex121:1", where: "room:descent"}
  - {text: "Wrong! / Correct!", ref: "dark/aazex121:7-8", where: "room:crossword (the plaques)"}
  - {text: "1 Across: King's Staff ... 77 Down: He had a pet dragon", ref: "dark/aazex121:11-188 (twelve of the 89 kept, DECIDE 4)", where: "room:crossword"}
  - {text: "Welcome; Ballroom; Game Room; Do Not Disturb; Coffin", ref: "dark/aazex122:0-5", where: "the signs and hovers of floor -2"}
  - {text: "Shrine of Minor/Lesser/Great/Ultimate Evil.  Destroy?; You destroy the shrine, which destroys this dungeon, taking you with it.", ref: "dark/aazex122:11-18 (the experience dropped; A3's sums)", where: "room:shrines_north, room:shrines_south"}
  - {text: "Gone to Necropolis, will return soon. ... (signed) Sandro", ref: "dark/aazex122:24", where: "room:throne_dead"}
  - {text: "A voice Booms: Ring the four gongs and then pull the lever. Touch any treasure and you'll have to start over!", ref: "dark/aazex123:3 (with :0-2)", where: "room:gong_hall"}
  - {text: "Ahh, refreshing!", ref: "dark/aazex123:5", where: "room:fountain"}
  - {text: "Lord Xeen Machine. Destroy?", ref: "dark/aazex124:0 (the +5,000,000 dropped, :9)", where: "room:machine"}
  - {text: "Fire / Water / Air / Earth Core Operational", ref: "dark/aazex124:3-6", where: "room:machine (the four terminals)"}
  - {text: "You find some papers that tell of the World of Xeen maintenance schedules...", ref: "dark/aazex124:2", where: "room:maintenance"}
  - {text: "You are a Goober! / You are a SUPER Goober!", ref: "dark/aazex124:10-11", where: "room:control_room (the main terminal)"}
open_questions:
  - q: "1. Count and mix. MAPS §0: 60 at 65-100, groups 1-3, 96.8k."
    options: ["(a) the tower 26 dragons (Acid 66 x 6, Fire 75 x 8, Frost 85 x 6, Phase 90 x 5, the Energy Dragon 100), the dungeon 34 (Lich Lord 65 x 10, Power Lich 75 x 6, Skeletal Lich 85 x 8, Doom Knight 75 x 4, Autobot 75 x 6): 100.22k (+3.5 %)",
              "(b) as (a) with the source's Screamers as a new demons tier D (11635 'Screamer', 80, own recolour skin; a shared display name, D-42/D-47) for four Lich Lords (the welcome hall and the north shrines): 102.55k (+5.9 %)",
              "(c) the tower with the Dragon Clouds' rows only (Cloud 70, Green 80, Phase 90, Energy 100) so the two X7 dragon maps share no tier: about the same XP"]
    recommend: "(a): only rows in the band, the source's families, inside 10 %"
    depends: "A2 (the Act VI recount; FD-04 added to the dark dragons', liches' and robots' `where`)"
  - q: "2. The tower's door. The source's key came from Castle Alamar's dungeon (FD-01); our quests give none."
    options: ["(a) a new item 'Key to the Dragon Tower' in FD-01 Alamar Depths (A8, the source's place, M39 on the main path), X7's door:fd04 needing it (A5's door; A3's hook with a refusal naming the key): FD-04 then opens after M39, as in the source",
              "(b) no key: X7's door opens with a question ('The Dragon Tower. Enter?'), the levels on the north of X7 being the only gate",
              "(c) the key in XD-18's King's hoard: FD-04 after the hardest optional dungeon"]
    recommend: "(a): keeps the finale's order without a new gate of our own; (b) if A8 cannot place it"
    depends: "A8 (FD-01), A2 (item), A3 (hook), A5 (X7's door)"
  - q: "3. The join between the halves (Sandro's key, Q-D23)."
    options: ["(a) a black iron door in the gate hall's cellar well over the stair down: q-f2.door with item 12354 opens it for good (118130), the key kept; without, a refusal naming Sandro's key; always opens from below",
              "(b) the same door, the key taken"]
    recommend: "(a)"
    depends: "A3 (q-f2.door)"
  - q: "4. The crossword (the source's 89 clues, '+5 Level Perm', gating the descent)."
    options: ["(a) twelve clues whose answers the main path names, the source's wording: 1 Across King's Staff (Scepter), 5 Across Count Blackfang (Vampire), 6 Across Imprisoned Queen (Kalindra), 13 Across Freed from spaceship (Corak), 21 Across Castle beyond the Forbidden Zone (Alamar), 24 Across City of the undead (Necropolis), 40 Across City of sorcerers (Sandcaster), 42 Down Tower located in Troll Forest (Darkstone), 44 Down Ellinger's Tower is located here (Castleview), 47 Down You need an amulet to gain entry (Sphinx), 76 Down Way of transportation in the Land of Xeen (Mirror), 77 Down He had a pet dragon (Xeen); each a step plate and prompt; all twelve open the descent and pay fixed experience (A3)",
              "(b) the same twelve, optional: the descent open, the crossword a reward only",
              "(c) dropped: a plain hall"]
    recommend: "(a): the source's gate, every answer a name the story has said"
    depends: "A3 (the prompts, answers with spelling variants, the reward)"
  - q: "5. The Shrine of Ultimate Evil ('You destroy the shrine, which destroys this dungeon, taking you with it.')."
    options: ["(a) a tell in its question (A3, for example 'Shrine of Ultimate Evil. The walls seem to lean on it. Destroy?'); Yes: camera shake, falling dust, fire damage about 20 % of each member's hit points (never lethal to a healthy party), and {exit: x7} to entrance:fd04_door with the source's line; the shrine stays broken (118148), no experience; the dungeon is still there",
              "(b) it refuses ('It will not break.'): dressing",
              "(c) the source's: the party dies"]
    recommend: "(a): the joke kept, a real choice that ends the visit asks first (D-24), never lethal"
    depends: "A3 (the hook and lines)"
  - q: "6. Alister and the egg (A3's Q-F1)."
    options: ["(a) the source's: he takes the egg, pays fixed experience (A3's budget, not 1,000,000), 'Now I'll just drink this egg potion and...'; on the next load he is gone (118147) and a small lizard sits in his alcove (a decoration shown); the notes only warn",
              "(b) he drinks it and becomes a Fire Dragon on the spot (a hidden placed dragon shown; 6,375 more kill XP)",
              "(c) the egg can also go back to the nest for a reward"]
    recommend: "(a)"
    depends: "A3 (Q-F1), A2 (the Dragon Egg item, Alister's peaceful row), A4 (Alister's NPC id)"
  - q: "7. Texture families (none assigned)."
    options: ["(a) the tower in MM6 Hall of the Fire Lord 6d04 (the black vlc block of X7's shell, unused in Xeen); Sandro's halls and the crossword in MM8 Necromancers' Guild d19; the machine floor in MM6 Control Center sci-fi.blv with XD-19's four core textures; two new (xfgrid, xfword): about 36 of 45",
              "(b) the tower in MM7 The Dragon's Lair 7d28 (t2bs, cfb1: thin), the halls in MM6 Castle Darkmoor cd2 (the d2 kit of XD-08 and DD-21)",
              "(c) the ballroom and game rooms in MM7 The Haunted Mansion 7d37 as their own area, d19 elsewhere"]
    recommend: "(a)"
    depends: "A6 (the dungeon_families and towers lines; xfgrid and xfword registered)"
  - q: "8. The tower's inside and the dragons' room (D-32)."
    options: ["(a) the inside larger than X7's shell (1,024 across, 2,048 high): round floors about 3,072 across, 1,280 apart, halls 1,152 high (the crown 2,048), as DD-07's and XD-14's interiors (D-39 Q6); every way between halls and the spiral stair is 256 x 288, so each floor keeps its dragons; a headless check that a dragon stays on its floor",
              "(b) a shell-sized tower: no dragon fits"]
    recommend: "(a)"
    depends: "nothing"
  - q: "9. Looks. The Energy Dragon (11653) wears the dark dragons' m492 skin; Lich Lord, Power Lich, Skeletal Lich and Sandro all wear lch_c; Power and Skeletal Lich are A2 boss rows."
    options: ["(a) own recolour skins for the Energy Dragon (for example violet-white on m492), the Power Lich and the Skeletal Lich (bone-white robes); A2 moves 11284 and 11285 from bosses to ordinary tiers D and E (several of each placed), no Meshy",
              "(b) keep the shared skins"]
    recommend: "(a): D-39/D-47's own skin per boss, and three lich tiers that read apart in one hall"
    depends: "A2, S"
  - q: "10. Rest encounters (map 9182)."
    options: ["(a) 0: two halves of different families, Alister a peaceful row, and the liches' slot rolls Lich 35 and Greater Lich 50 under the band at low Dif (D-33/D-34)", "(b) 10 % from the cloud dragons at Dif 5"]
    recommend: "(a)"
    depends: "A2's row 9182"
  - q: "11. Rewards at MM6-MM8 size (D-4)."
    options: ["(a) +2 Endurance once per character (the source's +40); the Tome, the crossword (+5 levels), the three shrines (1M/2M/5M) and the machine (5M) as fixed experience inside A3's optional budget; the source's numbers stay in the ledger",
              "(b) drop the Tome and the shrines' experience"]
    recommend: "(a)"
    depends: "A3, A2 (the Act VI ledgers)"
  - q: "12. The main terminal ('Main Terminal Enter Code', then 'You are a Goober!' and 'SUPER Goober!'; no code exists)."
    options: ["(a) no prompt: the click shows 'Main Terminal. ACCESS DENIED.' and the Goober line, the second click on the SUPER Goober; nothing suggests a code to look for",
              "(b) the source's prompt with any answer wrong"]
    recommend: "(a): no riddle the game does not answer"
    depends: "A3 (lines)"
  - q: "13. The vampires (the source's five Vampire Kings behind Do Not Disturb, Sandro's note: leave them alone)."
    options: ["(a) the coffins stay shut (the source's 'too heavy' line) and the vampires never wake: flavour and a chest",
              "(b) a new vampires tier E (11296 'Vampire King', 90, own skin) x 2 that wake when the crypt's chest is opened, two Lich Lords fewer elsewhere: about +2.1k"]
    recommend: "(a): no new row for a joke the note already tells"
    depends: "A2 for (b)"
