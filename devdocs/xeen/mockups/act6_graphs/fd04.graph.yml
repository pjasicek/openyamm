states:
  - {id: state:sandro_key, kind: item, where: room:gate_hall,
     what: "Sandro's Key to the Dungeon of Death (item 12354, Q-D23's release in DD-21). The black iron door in the cellar well calls q-f2.door: with the key it opens for good (map qbit 118130; the key is kept); without it, a clear refusal naming the key (A3's fail_text, for example 'A black iron door with Sandro's mark, a skull with a keyhole for an eye. It answers only to his key.'). From below it always opens.",
     opens: [link:gate_crossword], draw: false}
  - {id: state:crossword, kind: puzzle, where: room:crossword,
     what: "Twelve clue plaques (map qbits 118131-118142, one per word): each asks its clue (a text prompt); the right answer lights the word ('Correct!'), a wrong one 'Wrong!'. All twelve set 118143: the descent's gate opens and stays open (DECIDE 4).",
     opens: [link:crossword_descent]}
  - {id: state:gongs, kind: puzzle, where: room:gong_hall,
     what: "Four gongs (map variables, rung or not); the lever with all four rung raises the iron shutter for good (map qbit 118144). Opening the hall's chest while the shutter is down clears the gongs ('The gongs fall silent.', A3's line), the source's rule told by the voice at the lever (aazex123:3).",
     opens: [link:gongs_maint]}
  - {id: state:machine, kind: qbit, where: room:machine,
     what: "q-f2.machine (A3, proposed): the machine's on_destroyed sets Q-F2's done; map qbit 118145 draws the machine broken and the cores dark on every later load. Gates nothing.",
     opens: [], draw: false}
  - {id: state:egg, kind: qbit, where: room:nest,
     what: "q-f1.egg (A3, proposed): the Dragon Egg item (A2) from the nest's bowl, once (map qbit 118146: two eggs shown after). Alister's topic takes it (q-f1.alister); Alister is hidden on later loads once paid (118147).",
     opens: [], draw: false}
