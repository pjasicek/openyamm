treasure: {level: 6}
role: "M41 Darkstone Tower: the gongs (m41.gong_voice) raise the ground to each next storey; on the top storey the Onyx Golem guards the foot of the roof stair, where the invisible seal (m41.seal) takes the Chime of Opening (seal_broken 111820, 27,000) and opens the stair to the Clouds of the Ancients (P5, M42)"
role_short: "M41, the gongs, the seal"
set_piece: "Two. The gong well: on each storey a round rotunda round an open well that runs from the ground storey to the top, a bronze gong on its wall; rung, the voice booms and with a grinding the missing landing of the next flight rises out of the dark, and from L1 the raised landings are seen stacked up the well. The seal: on the top storey the roof stair's foot under a shaft of cloud light, the air in its doorway rippling like heat; the Chime's note cracks it across like ice"
sounds: "the dungeon hum bed (D-48, pan false); the gong (shipped gong, as XD-03/DD-06's xngong panels); the ground's grinding rise (shipped stone door); wind and cloud light at the roof stair (shipped wind); the seal's crack (shipped glass, AU optional); music 43 (maps.yml)"
textures:
  family: "Towers: MM8 Castle of Fire d29 (A6's towers.yml and dungeon_families: 'FD-03 Darkstone Tower (X5): mm8/d29.blv'): gston1wl and gtrlwal1 walls (gtrlwal1 is the tower's outside too), gkp2ceil and gcav1flr floors, gston1fl and gcst2cel ceilings, gcstdoor leaves, gkp4-bs trim; d29's lava left out (no lava in the tower); X5's hkm3b skull frieze once round the door hall (the outside's band brought in); XD-03's xngong for the three gong panels (a reused world texture)"
  cap: 45
  planned: 18
  new: 3
  new_list: "xdplaque (a bronze letter plaque, one picture for the twelve plaques, the letters in the click's text), xdhead (a carved speaking head, one picture for L4's four), xdseal (the seal's ripple on a translucent leaf); proposed names, A6 decides"
  distinct_from: "DD-24 Giants' Hall (d14: shares the ceilings gston1fl and gcst2cel; FD-03 reads apart by the black ashlar walls), XD-23 Troll Warren (X5, d13: shares gtrlwal1; FD-03 has no cave rock), DD-06 Southern Tower (gongs open stair doors: FD-03's gongs raise the ground instead)"
