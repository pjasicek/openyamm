# MU-6 dungeon graph, a review file for phase 6 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
# `mix` is the placed monster list by row (level, count); kill XP per member = sum of L(L+10) x count / 4 (MAPS §0).
# The source's Darkstone Tower (dark mazes 113-116, four 16 x 16 levels; text dark/aazex113-116): on every level a
# central gong ((7,9) and (7,7) on L1, (7,9) on L2, two on L3) whose ringing summons onyx golems, and at the stair
# (7,12) or (7,4) the voice 'No Sound No Ground!': the way up is there only after the gong; four plaques at
# (4,6), (4,10), (10,10), (10,6) whose letter rows, read down the columns, spell New World Computing's messages
# (L1 "NEW WORLD THANKS YOU FOR PLAYING MIGHT AND MAGIC", L2 "SO END THE SAGA OF CORAK AND SHELTEM!", L3 "1994 BEGINS
# THE NEXT MIGHT AND MAGIC SAGA!", L4's four speaking heads "TYPE "COMPUTER" ON LEVEL 4 OF THE DUNGEON OF DEATH. SEE YA
# SOON!"); on L4 the skull's riddle (120, dropped by A3) guarding the Gold ID Card behind 'A force repels you.', and
# at (7,4) the invisible seal before the way to the Clouds of the Ancients (map 129). Monsters (XEEN_SYSTEMS): onyx
# golems only, L1 x6, L3 x10, L4 x6 + 1. Ours is one BLV of four storeys 768 apart in a round tower of radius 2,048
# (the interior is larger than X5's shell of radius 544, as XD-14's and DD-07's, D-39 Q6/Q7), a roof stair to P5.
