states:
  - {id: state:gong1, kind: lever, where: room:l1_gong,
     what: "The L1 gong (click): m41.gong_voice ('A voice booms: \"No Sound No Ground!\"'), the two hidden Sentries shown, the south ground rises 640 into the flight (map qbit 118120). With 118120 set the ground is up on every load (D-56: the floors stay raised; a qbit, not a map variable, so it outlives a rebuild of the map). A second ring: the voice only.",
     opens: [link:l1_up]}
  - {id: state:gong2, kind: lever, where: room:l2_gong,
     what: "The L2 gong: the same (118121), the north ground.", opens: [link:l2_up]}
  - {id: state:gong3, kind: lever, where: room:l3_gong,
     what: "The twin gongs: each lifts the south ground 320 (118122 west, 118123 east); both rung, it is up. On load each half by its own bit.", opens: [link:l3_up]}
  - {id: state:onyx, kind: kill, where: room:skull_hall,
     what: "The Onyx Golem's death (the map's death event for his actor): the vault's field leaf opens (map qbit 118124, open on every load).", opens: [link:skull_vault]}
  - {id: state:seal, kind: item, where: room:seal,
     what: "m41.seal: needs the Chime of Opening 12373 (Picard's, m40); takes it, sets seal_broken 111820, 27,000; the leaf opens in the same visit and on every load with the bit (A3's text and else text).",
     opens: [link:seal_stair]}
  - {id: state:plaques, kind: map_var, where: room:l1_west,
     what: "Each storey's four plaques (L4: the heads): every click gives its row (the source's text); the fourth read on a storey (map variables, one per plaque) adds one line reading the columns down (DECIDE 4).", opens: [], draw: false}
