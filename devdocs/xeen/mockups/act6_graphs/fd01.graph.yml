open_questions:
  - q: "Count and mix. D-57 Q7: FD-01 34 at 36.93k (room 30.1k-43.7k, the FD-01 + FD-02 row 68.0k +-10 %). The source placed Annihilator x17 and Autobot x6 (23). In the band 55-80 the robots have only Annihilator 62 and Autobot 75 (Patrol 50 is under it), so 34 robots cannot come under 37.94k."
    options: ["(a) Annihilator 62 (11611) x28 and Autobot 75 (11612) x6, 34: 40.81k, row 71.88k (+5.7 %); the source's six Autobots",
              "(b) Annihilator x31 and Autobot x3, 34: 39.38k, row 70.45k (+3.6 %)",
              "(c) Annihilator x25 and Autobot x6, 31: 37.46k, row 68.53k (+0.8 %); the row's 60 becomes 57"]
    recommend: "(a)"
    depends: "A2 (Act VI recount; FD-01 in the robots' where)"
  - q: "The skull doors. The source has two (Silver and Gold I.D.); our quests have no I.D. cards (FD-03 dropped the Gold one, D-57 Q18). A3's m39.yml has one skull door on the Cube."
    options: ["(a) one skull door (A3's m39.skull_door, the Cube) before the stasis lift; the Silver skull's place is a plain warden's door",
              "(b) two skull doors, both calling m39.skull_door (the same hook twice, each door its own map qbit)"]
    recommend: "(a)"
    depends: "A3 (skull_door's where)"
  - q: "Prince Roland in the coffin. The source shows a coffin and a portrait talk."
    options: ["(a) no figure: the coffin under a stasis field leaf (xafield); the field drops on m39.roland and the coffin lies open and empty; Roland exists only in the text (no row, no body)",
              "(b) an upright stasis tube with Roland standing in it: a peaceful placed-only unkillable row (A2, characters block), a body (S, a shipped noble figure with his portrait's colours), hidden after the talk by a load event on m39.done (D-57 Q27's pattern)"]
