role: "M39 Prince Roland (A3's m39.yml): the Cube opens D6's stair (m39.depths_door); Alamar's statue boasts in the first hall (m39.statue); the plaque in the Hall of Nine (m39.plaque_nine); the two levers open the west maze and its far end; the Key to the Dragon Tower in the key vault (q-f1.tower_key, D-57 Q23); the Darkstone key chest in the warden's room (m39.darkstone_key); the skull door reads the Cube (m39.skull_door); Roland's stasis coffin a lift below (m39.roland: the Amulet of the Southern Sphinx, the award, 40,000). Q-D26: D7's hatch down the rubble shaft"
