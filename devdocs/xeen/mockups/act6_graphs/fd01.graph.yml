# MU-6 dungeon graph, a review file for phase 6 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
# `mix` is the placed monster list by row (level, count); kill XP per member = sum of L(L+10) x count / 4 (MAPS §0).
# Lane A8, session 16 (2026-11-21), from D-57 Q7 (FD-01 + FD-02 = 60 monsters at 55-80, 68.0k; FD-02 took 26 at
# 31.07k, so FD-01 plans 34 at 36.93k, room 30.1k-43.7k inside the row's +-10 %) and D-61 Q14 (D7's hatch leads into
# FD-01 after m33.done).
# The source's Castle Alamar Dungeon (dark maze0052, text aaze0052; entered by the stair at (15,1) from Castle Alamar
# Level 1's (15,1), maze0049): a 16 x 16 maze read with output/studio_cal/fd01/tools/ascii_maze.py and regions.py.
#   - The way in (15,1) and a long C of corridors round the west half: the south corridor y0 (a door at x11/12), the
#     west corridor x0 (a door at y6/7), the north corridor y15 (a door at x6/7), the corridor x9 down to the hall of
#     the plaque "Nine is the time." (8,8) and the lever hall (6,5)-(8,5).
#   - The west lever (6,5) opens the wall at (4,5) into the west maze: a two-row workshop (y2-3, x2-10), a working
#     travel pyramid at (2,2) (DoTownEvent 12), an empty box (11,2), the corridor x2 north to a block of halls (x2-7,
#     y9-13) with Alamar's boasting statue (3,11) and the plaque FEWAEEFFWAEF... (5,12).
#   - The east lever (8,5) opens (10,5), the maze's far end, into the east wing: the Key to Dragon Tower in a box (13,3),
#     the Silver I.D. skull (15,5) that opens (13,6)-(13,8) into a room with the Key to Darkstone Tower (11,9), the Gold
#     I.D. skull (15,9) that opens (13,10)-(13,12) into the last room: two Power Juice boxes and Prince Roland's stasis
#     coffin (13,15) (aaze0052:9, the Amulet of the Southern Sphinx).
#   - Five "XEEN Power Juice" boxes (+5 levels each; (15,13), (11,13), (10,15), (10,11), (10,7)).
#   - Monsters (the .mob file): Annihilator x17 and Autobot x6, 13 in the C and the plaque hall, 10 in the west maze,
#     none in the east wing. A tree: no loop.
# Ours keeps the plan (the C round the west maze, the two levers, the east wing with both keys, the skull door, Roland
# at the bottom) as the castle's undercroft after the self-destruct, one main level and the stasis vault a lift below.
# Two ways in: D6's stair under the ruined gatehouse (m39.depths_door, the Cube) and D7's roof hatch down a rubble shaft
# (D-61 Q14, after m33.done, opened by Q-D26's key).
