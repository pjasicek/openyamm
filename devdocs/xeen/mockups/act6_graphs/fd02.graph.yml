# MU-6 dungeon graph, a review file for phase 6 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
# `mix` is the placed monster list by row (level, count); kill XP per member = sum of L(L+10) x count / 4 (MAPS §0).
# The source's Southern Sphinx (dark mazes 125-127, three 16 x 16 levels; text dark/aazex125-127): level 1 the way in
# (7,5), two Preservation Rooms (4,5) and (10,5), sarcophagi that need Might (2,1), (4,1), (10,1), (12,1) and
# (5,14-18) with embalming fluids, the Swinging Death and the Chopping Death (two trap runs, 13 cells each) whose
# toll-keepers sell protection, and the voice at the stair ("What is my name?", Picard); level 2, drawn as the
# sphinx's head, the Home of the Aged: Picard (7,3), the Throne of Legends (7,7), four sarcophagi that release Phase
# Mummies (2,8), (12,8), (4,14), (10,14), four books (3-11,10); level 3 the dragon mummies' halls with the eight rune
# walls (the six lessons P, I, C, A, R, D, "Study the lessons to learn my name.", "Don't feed the dragons."), ten
# alcoves (the Super Dragon Embalmer) and the illusion (6,14). Monsters (XEEN_SYSTEMS): Ghost Mummy x17 (L1), Phase
# Mummy x4 (L2), Dragon Mummy x18 (L3). Ours is one BLV of three storeys inside and under the half-buried sphinx on
# X6's west rim: the body (the source's level 1, with A3's six rune stones in the Preservation Rooms), the head (the
# Home of the Aged) and the crypt under the sand (the dragon mummies). The interior is larger than X6's shell (3,072 x
# 2,048), as XD-14's and DD-07's (D-39 Q6/Q7).
format: mu6-0
map: FD-02
key: fd02
name: Southern Sphinx
stands_on: X6 Desert of the Sphinx (the half-buried sphinx on the west rim, by the sand-fall cove)
class: S
band: "S: at most 15 sectors and 20 M units², 15-30 monsters, 0-3 chests, 3-8 doors"
size: "13 review rooms, 15 sectors (the hall of embalming and the crypt two each); body about 4,600 x 2,300 at z 0/-256, head about 2,800 x 1,000 at z 768, crypt about 3,300 x 1,500 at z -1,280: about 12 M units²; 5 doors (the two Preservation Rooms, the door of the name, the two gallery doors)"
party: [58, 61]
monsters:
  levels: [62, 72]
  boss: null
  count: 26
  groups: [2, 3]
  families:
    - "Pyramid mummies (11270, `where` already names the Southern Sphinx): the source's Ghost Mummy (level 1) and Phase Mummy (level 2) as two new tiers at the band (DECIDE 2): Ghost Mummy 62 (aging), Phase Mummy 72 (drains spell points); MM9 mummy recolours"
    - "Undead dragons (11670): Dragon Mummy 65 (11672), the source's level 3 'Don't feed the dragons.'"
    - "Not placed: Tomb Mummy 42 and Pyramid Guard 52 (under the band 55-75), Royal Mummy 65 (kept as DECIDE 2's option b)"
    - "Peaceful, not counted: Picard the Aged (npc 5704) as a talking placed monster (`monsters[].npc: 5704`) in the Home of the Aged"
  mix:
    - {row: "Ghost Mummy (new tier, A2: e.g. 11273)", id: 11273, level: 62, count: 16}
    - {row: "Phase Mummy (new tier, A2: e.g. 11274)", id: 11274, level: 72, count: 4}
    - {row: Dragon Mummy, id: 11672, level: 65, count: 6}
  peaceful:
    - {row: "Picard the Aged (new peaceful row, A2)", npc: 5704, count: 1, note: "placed-only, move: stand, NoArena, not counted; unkillable by the load event (SetMm9ActorCanReceiveDamage false, D-51/D-56)"}
  kill_xp: "31.07k per member (124,290 / 4)"
  kill_xp_target: "MAPS §0 'FD-01, FD-02: 60 at 55-80, 68.0k' (A8's FD-01 not drawn): FD-02's share by count 26/60 = 29.47k, +5.4 %; A8's FD-01 keeps 34 monsters and 36.93k (an average level of about 61), DECIDE 1"
  by_floor: "body 16 (Ghost Mummy 16); head 4 (Phase Mummy 4); crypt 6 (Dragon Mummy 6)"
treasure: {level: 6}
role: "M40 The Southern Sphinx: the six rune stones (m40.runes) spell PICARD; the voice at the stair ('What is my name?', m40.name_right / name_wrong, name_said 111800) opens the door of the name (m40.stair); Picard the Aged (npc 5704, A3's topics) trades the Chime of Opening for Halon's widget (m40.done 111801, 20,000)"
role_short: "M40, Picard, the Chime of Opening"
set_piece: "Two. The Home of the Aged: a library in the sphinx's head behind the carved face, shelves to the vault, the old man in a very good chair (the source's Throne of Legends) at its far end, light coming in through the two eyes. The crypt of the dragons: a long vault under the sand where six dragon mummies lie in their stalls, the steps' low arch keeping them in"
sounds: "the dungeon hum bed (D-48, pan false); the blades' swish and the chopping thud (shipped trap and door sounds); dragon breathing in the crypt (shipped); the sarcophagus lids (shipped stone door); music 46 (maps.yml)"
textures:
  family: "Pyramids: MM6 Tomb of VARN (pyramid.blv) upper (A6's dungeon_families: 'XD-15 The Sphinx (X6), FD-02 Southern Sphinx'). FD-02 reads apart from XD-15 by the set's other half: egywlh with its ends egywlhle/egywlhre, egywlj, egywalg1, egywalgm and egywld walls over egywla footings, egyflorf and egyflord floors with drifted sand at the doors, egyceila/egyceild, egytrma/egytrmas trims, egydrsmd and the egydrlgl/egydrlgr pair, egymedb over the door of the name, egywlspb for the toll masks; no striped egycol64 columns and no egywle/egywlc (XD-15's marks)"
  cap: 30
  planned: 22
  new: 2
  new_list: "xsshelf (Picard's shelves: scrolls and books in egy niches, the Home of the Aged's walls; one row high, fitted per face), xsrunes (a rune stone's face of strange writing, the same picture on all six; the letter is in the click's text)"
  distinct_from: "XD-15 The Sphinx (X6, the same family: 43 of its pictures, striped columns, egywle/egywlc halls, the riddle disc); DD-15 Great Pyramid (D5, pyramid.blv plus the ancient kit's lower levels)"
floors:
  - {floor: 1, name: "The head: the Home of the Aged", height: 768}
  - {floor: 0, name: "The breast and the body", height: 0}
  - {floor: -1, name: "The crypt under the sand", height: -1280}
spaces:
  # floor 0 (z 0 = X6's sill 1,536 at the breast; the body's halls 256 lower, down the breast steps)
  - {id: room:breast, name: Breast steps, kind: stair, size: S, floor: 0, at: [1, 0], monsters: 0,
     purpose: "The arrival (entrance:x6_door): inside the two leaves on the first of eight broad steps down into the body (256 down), sand drifted on the treads, daylight behind. Quiet (D-11.3)."}
  - {id: room:name_stair, name: Stair of the name, kind: stair, size: S, floor: 0, at: [2, 0], monsters: 0,
     purpose: "From the hall's east end a straight flight of 32 steps of 32 up into the head (z -256 to 768), 384 wide, a rune plaque at its foot: 'Study the lessons to learn my name.' (aazex127:8). On the top landing the voice asks 'What is my name?' (aazex125:16, a text prompt: m40.name_right on Picard, else m40.name_wrong); the door of the name above it, its sign 'Home of the Aged' (aazex125:2), egymedb over the lintel."}
  - {id: room:hall, name: Hall of embalming, kind: hall, size: L, floor: 0, at: [2, 1], monsters: 4,
     population: [{row: Ghost Mummy, level: 62, count: 4}],
     purpose: "The body's long hall, 2,048 x 768, 640 high: embalming tables along the walls (props by the walls), canopic jars in niches; the hub. West the two death runs; east the stair of the name."}
  - {id: room:swinging, name: The Swinging Death, kind: corridor, size: M, floor: 0, at: [3, 0], monsters: 2,
     population: [{row: Ghost Mummy, level: 62, count: 2}],
     purpose: "A run 1,280 x 384 west under four pendulum blades (rotating movers swung by a map timer, the tell in plain sight from 3 m); a step plate under each blade's arc deals about 12 % of a level-59 member's HP once per crossing. A carved mask at the mouth (egywlspb) sells protection (DECIDE 3, aazex125:9, 11-15)."}
  - {id: room:chopping, name: The Chopping Death, kind: corridor, size: M, floor: 0, at: [3, 1], monsters: 2,
     population: [{row: Ghost Mummy, level: 62, count: 2}],
     purpose: "The southern run, the same length: three blades dropping from slots in the ceiling (linear movers on a timer, slots and shadows readable from 3 m), the same plates and damage; its own mask (aazex125:10)."}
  - {id: room:pres_n, name: Preservation Room (north), kind: room, size: M, floor: 0, at: [4, 0], chest: 6, monsters: 3,
     population: [{row: Ghost Mummy, level: 62, count: 3}],
     purpose: "The sign 'Preservation Room' (aazex125:0). Three rune stones by the walls, P, I, C (m40.runes); a great sarcophagus that needs Might (DECIDE 4: 'You are too weak to open the sarcophagus.', aazex125:5), a T6 chest."}
  - {id: room:canopic, name: Canopic chamber, kind: room, size: M, floor: 0, at: [5, 0], monsters: 2,
     population: [{row: Ghost Mummy, level: 62, count: 2}],
     purpose: "The far west end where the two Preservation Rooms meet: shelves of sealed jars; the crypt steps go down under a low arch (384 high) in its floor's west side, a rune plaque by them: 'Don't feed the dragons.' (aazex127:9)."}
  - {id: room:pres_s, name: Preservation Room (south), kind: room, size: M, floor: 0, at: [4, 1], chest: 6, monsters: 3,
     population: [{row: Ghost Mummy, level: 62, count: 3}],
     purpose: "The second 'Preservation Room' (aazex125:1): rune stones A, R, D; the second great sarcophagus (Might, T6). The sixth stone read shows A3's summary (m40.runes)."}
  # floor 1 (z 768): the head, the source's level 2
  - {id: room:home, name: Home of the Aged, kind: hall, size: M, floor: 1, at: [2, 0], set_piece: true, goal: true, monsters: 0,
     purpose: "Set piece: 1,280 x 1,024 under the carved face, shelves to the vault (xsshelf), two bars of light through the eyes, four books on two lecterns by the walls (aazex126:14-17: Picard's adventurers and the cigars). At the far end Picard the Aged (npc 5704, a talking placed monster, peaceful, unkillable) by his very good chair, the source's Throne of Legends (aazex126:10, hover only). A3's topics: the Chime of Opening for the widget (m40.done)."}
  - {id: room:gallery_n, name: North sarcophagus gallery, kind: room, size: S, floor: 1, at: [1, 0], monsters: 2,
     population: [{row: Phase Mummy, level: 72, count: 2}],
     purpose: "A dead end in the nemes' north lappet: two sarcophagi with their lids leaning beside them, the Phase Mummies out of them (the source's (2,8), (4,14)); in the third, empty niche a fixed find (A2: two T6 potions, 'Embalming Fluid' in the source, aazex125:6)."}
  - {id: room:gallery_s, name: South sarcophagus gallery, kind: room, size: S, floor: 1, at: [3, 0], monsters: 2,
     population: [{row: Phase Mummy, level: 72, count: 2}],
     purpose: "The south lappet, the same: two Phase Mummies and a fixed find (A2: a T6 gem)."}
  # floor -1 (z -1,280): the crypt, the source's level 3
  - {id: room:crypt, name: Crypt of the dragons, kind: hall, size: L, floor: -1, at: [5, 0], set_piece: true, monsters: 4,
     population: [{row: Dragon Mummy, level: 65, count: 4}],
     purpose: "Set piece: the steps' foot under the 384-high arch, then a vault 2,304 x 1,536, 1,024 high, ribbed ceiling, four dragon mummies (body about 512 high, radius about 300): the arch keeps them in (D-32, levelRadiusLimit 60). West the stalls."}
  - {id: room:stalls, name: The dragon stalls, kind: hall, size: M, floor: -1, at: [6, 0], chest: 6, monsters: 2,
     population: [{row: Dragon Mummy, level: 65, count: 2}],
     purpose: "Two stalls off the crypt through a wide, high opening (dragons in both); at the end two alcoves 256 high: in one a heap of gold that is an illusion ('It was an illusion! An angry voice booms: \"No one steals from ME!\"', aazex127:14; the heap hidden by its click, no harm), in the other the embalmer's chest (T6; the source's Super Dragon Embalmer and its +5 levels dropped)."}
