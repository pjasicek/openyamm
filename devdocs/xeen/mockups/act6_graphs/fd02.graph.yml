states:
  - {id: state:runes, kind: puzzle, where: room:pres_n,
     what: "Six rune stones, three in each Preservation Room (P, I, C north; A, R, D south). Each click shows its lesson (the source's 'The strange writings seem to give a lesson about the letter \"P\"', aazex127:2-7, A3 request) and sets its map qbit (118110-118115); the sixth calls m40.runes ('The runes you have read, in the order of the halls: P, I, C, A, R, D.'). The answer-giver for the name.", opens: [], draw: false}
  - {id: state:name, kind: password, where: room:name_stair,
     what: "On the top landing (a step plate, every climb until named) and on the door's click: the prompt 'What is my name?' (aazex125:16). PICARD (any case) calls m40.name_right (name_said 111800, '\"Correct, come on up!\"', aazex125:19) and the door opens in the same visit; anything else m40.name_wrong ('\"Wrong.\"', aazex125:18), the door stays shut. With name_said the door is open on every load (m40.stair true).",
     opens: [link:name_home]}
  - {id: state:tolls, kind: map_var, where: room:swinging,
     what: "The two masks' protection (DECIDE 3): paid, the run's blades stop and its plates do nothing (map qbits 118116 swinging, 118117 chopping, kept for good).", opens: [], draw: false}
  - {id: state:illusion, kind: map_var, where: room:stalls,
     what: "The illusion heap clicked once (map qbit 118118): hidden on every later load.", opens: [], draw: false}
  - {id: state:picard, kind: stage, where: room:home,
     what: "Picard 5704 placed from the first load, peaceful, unkillable (load event); A3's topic: the widget gives the Chime (m40.done 111801, 20,000); after done his topic's done-state line.", opens: [], draw: false}
exits:
  - {id: exit:x6_door, space: room:breast, at: [0, 0], kind: both, label: "X6: the Southern Sphinx's breast",
     arrival: "entrance:x6_door: on the first step inside the two leaves, about 256 in, facing west (1024) down into the body",
     neighbour: "X6 door:fd02 (A5, built, listed_only until FD-02 exists): the two leaves (egydrlgl, 160 x 256 each) in the breast's east face of thing:southern_sphinx at cells 34-40, 82-86, ground 1,536; m40.sphinx_door (Roland's amulet 12372). Out by the exit preset ('Exit the Southern Sphinx?', aazex125:3, as the window's meaning, D-24) to X6's entrance:fd02_door (-12800, -10240, 1536) facing east (0); A5 to confirm it stands clear outside the leaves"}
hooks:
  - {hook: m40.runes, space: "room:pres_n, room:pres_s", how: "the sixth rune stone read (three per room)"}
  - {hook: m40.name_right, space: room:name_stair, how: "the prompt's answer PICARD (top landing plate or the door's click)"}
  - {hook: m40.name_wrong, space: room:name_stair, how: "any other answer"}
  - {hook: m40.stair, space: room:name_stair, how: "the door of the name (true opens it; fail text re-asks)"}
  - {hook: "m40 npc 5704 (Picard's topic: Chime of Opening)", space: room:home, how: "the talking monster's click"}
  - {hook: m40.sphinx_door, space: "X6 (A5)", how: "X6's door; listed for the pair, not placed here"}
critical_path: [room:breast, room:hall, room:swinging, room:pres_n, room:canopic, room:pres_s, room:chopping, room:hall, room:name_stair, room:home]
return_path: [room:home, room:name_stair, room:hall, room:breast]
loops:
  - {id: loop:body, spaces: [room:hall, room:swinging, room:pres_n, room:canopic, room:pres_s, room:chopping],
     notes: "Round the body: out by one death run, through both Preservation Rooms and the canopic chamber, back by the other."}
lines:
  - {text: "Exit the Southern Sphinx?", ref: "dark/aazex125:3", where: "exit:x6_door (the exit preset's meaning, D-24)"}
  - {text: "Preservation Room / Home of the Aged", ref: "dark/aazex125:0-2", where: "room:pres_n, room:pres_s, the door of the name (signs)"}
  - {text: "Sarcophagus / You are too weak to open the sarcophagus.", ref: "dark/aazex125:4-5", where: "the two great sarcophagi (DECIDE 4)"}
  - {text: "\"For 2 million gold I can protect you from the Swinging Death.  Will  you pay?\" (and the Chopping Death)", ref: "dark/aazex125:9-10 (sums rescaled, DECIDE 3)", where: "the two masks"}
  - {text: "\"For another million I'll give you a clue.  Will you pay?\" / \"There's one born every minute.\" / \"Well, maybe next time.\" / \"Begone, then!\"", ref: "dark/aazex125:11-14", where: "the masks (DECIDE 3)"}
  - {text: "\"What is my name?\" / \"Wrong\" / \"Correct, come on up!\"", ref: "dark/aazex125:16, 18-19", where: "room:name_stair (A3's m40 hooks)"}
  - {text: "Throne of Legends", ref: "dark/aazex126:10", where: "Picard's chair (hover)"}
  - {text: "The book seems to be an account of one of Picard's favorite adventurers. ... / This book has been hollowed out and used to store old cigars.", ref: "dark/aazex126:13-17", where: "room:home (four books)"}
  - {text: "The strange writings seem to give a lesson about the letter \"P\" (... I, C, A, R, D)", ref: "dark/aazex127:2-7", where: "the six rune stones"}
  - {text: "The strange runes read: \"Study the lessons to learn my name.\" / \"Don't feed the dragons.\"", ref: "dark/aazex127:8-9", where: "the stair of the name's foot; the crypt steps"}
  - {text: "It was an illusion! An angry voice booms: \"No one steals from ME!\"", ref: "dark/aazex127:14", where: "room:stalls (the illusion heap)"}
  - {text: "Embalming Fluid / Super Embalming Fluid / +2,000,000 exper. / Super Dragon Embalmer / +5 levels perm", ref: "dark/aazex125:6-8, aazex127:12-13", where: "ledger only (dropped: no levels, no millions)"}
open_questions:
  - q: "FD-02's share of 'FD-01, FD-02: 60 at 55-80, 68.0k' (A8's FD-01 not drawn)."
    options: ["(a) 26: Ghost Mummy 62 x16, Phase Mummy 72 x4, Dragon Mummy 65 x6 = 31.07k (+5.4 % on a 26/60 share); A8's FD-01 keeps 34 and 36.93k (average level about 61)",
              "(b) 30 (S's top): Ghost 18, Phase 4, Dragon Mummy 8 = 35.74k; FD-01 30 and 32.26k",
              "(c) 20: Ghost 12, Phase 4, Dragon Mummy 4 = 23.95k; FD-01 40 and 44.05k"]
    recommend: "(a): the source's three families in its proportions, inside S, leaving A8 an M-sized 34"
    depends: "A8 (FD-01's graph), A2 (Act VI recount)"
  - q: "Mummy tiers at the band (Tomb Mummy 42 and Pyramid Guard 52 are under 55-75)."
    options: ["(a) two new pyramid_mummies tiers, the source's names: Ghost Mummy 62 (Age) and Phase Mummy 72 (DrainSP), e.g. 11273-11274, MM9 mummy recolours (no Meshy)",
              "(b) existing rows only: Royal Mummy 65 x16, Dragon Mummy 65 x6, Undead Dragon 55 x4 = 30.39k",
              "(c) a capped band: Pyramid Guard 52 placed under the band"]
    recommend: "(a)"
    depends: "A2 (rows), S (two skins)"
  - q: "The toll masks of the Swinging and Chopping Death (the source sells protection for 2 million and throws a refuser into the blades; a further million buys the 'clue' \"There's one born every minute.\")."
    options: ["(a) kept at MM6-MM8 sums: each mask offers that run's protection for 2,000 gold (Yes: the blades stop for good, map qbit; No: \"Begone, then!\", no throw); after paying, a clue for 500 more answers \"There's one born every minute.\" (the joke; the runes are the real answer-giver)",
              "(b) protection only, no paid clue",
              "(c) no masks: the runs are traps with their tells only"]
    recommend: "(a): the source's joke at a price that stings and does not break the economy; never a guess (the blades show)"
    depends: "A3 (lines and sums), A2 (Act VI gold ledger)"
  - q: "The two great sarcophagi (the source's 'too weak')."
    options: ["(a) Might >= 60 on the clicking member, potions and spells counting (XD-15's 40 at levels 31-34, D-39 Q4, scaled to 58-61); a T6 chest each",
              "(b) no check, two plain T6 chests"]
    recommend: "(a)"
    depends: "A2 (the check in the ledger)"
  - q: "Reading apart from XD-15 inside one family."
    options: ["(a) the pyramid set's other half (egywlh/egywlhle/egywlhre, egywlj, egywalg1/egywalgm, egyflorf), no striped columns, drifted sand, 2 new: xsshelf, xsrunes; 24 of 30",
              "(b) all shipped: MM7's bookcase 7t1books for the library (a second family in one room)",
              "(c) as XD-15"]
    recommend: "(a)"
    depends: "A6 (dungeon_families accent line, register two textures)"
  - q: "Picard's chair and the Throne of Legends (aazex126:10; XD-15 already has a throne of legends with two lecterns)."
    options: ["(a) one: his very good chair hovers 'Throne of Legends', no reward",
              "(b) a separate throne with a once-per-character +2 (D-4 size)",
              "(c) the line to the ledger only"]
    recommend: "(a)"
    depends: "A3 (hover text), S (chair decoration)"
  - q: "Rest encounters."
    options: ["(a) 10 % Ghost Mummies (hostile, in band; D-47's rule)", "(b) 0"]
    recommend: "(a)"
    depends: "A2 (row 9180)"
