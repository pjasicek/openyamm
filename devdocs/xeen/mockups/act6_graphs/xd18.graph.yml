lines:
  - {text: "The Dragon Cave smells pretty bad.  Are you sure you wish to enter?", ref: "xeen/aaze0017:0", where: "X7's door (A5)"}
  - {text: "Dragon tax!  2000 gold pieces and 20 gems fly from your packs and into the urn.  Peering inside the urn, you see that your money has vanished.", ref: "xeen/aaze0050:0", where: "ledger: the meaning of Scaldrith's payment (A3's topic text speaks it); the urn on the counter as dressing"}
  - {text: "The urn is empty and powerless.", ref: "xeen/aaze0050:1", where: "room:tax_hall, the urn's click once tax_paid is set"}
  - {text: "Not having enough money to pay the Dragon Tax, you are teleported outside.", ref: "xeen/aaze0050:2", where: "ledger: the meaning of q-c25.inner_door's fail (A3's fail_text)"}
  - {text: "Dragon Lore Volume 1 ... Volume 5; The Art of Taxation", ref: "xeen/aaze0050:5-10", where: "the hovers of the lectern, the four shelves and the ledger stand"}
  - {text: "Loremaster of Worms ... Taxman Emeritus", ref: "xeen/aaze0050:12-16, :18 (the 50,000-500,000 experience dropped; A3's six titles and 2,000 each)", where: "the titles (A3's awards 430-435)"}
  - {text: "The runes are too difficult for your inferior intellect to grasp.", ref: "xeen/aaze0050:3", where: "ledger only: A3's hooks have no Intellect check"}
  - {text: "Exit Dragon Cave?", ref: "xeen/aaze0050:17", where: "exit:x7_mouth (the exit preset's meaning, D-24)"}
open_questions:
  - q: "1. Count and mix. MAPS §0: 40 at 65-100 with the Dragon King 110, 64.6k; M's floor is 45. The source: 17 Fire, 14 Frost, the King."
    options: ["(a) 40 cloud dragons: Acid 66 x 9, Fire 75 x 17, Frost 85 x 14: 66.64k (+3.2 %), 69.94k with the King (+8.3 %); a NOTES exception line for 40 under M's 45 (as XD-16, D-47 Q1)",
