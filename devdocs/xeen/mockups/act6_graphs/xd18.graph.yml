# MU-6 dungeon graph, a review file for phase 6 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
# `mix` is the placed monster list by row (level, count); kill XP per member = sum of L(L+10) x count / 4 (MAPS §0).
# The source's Dragon Cave (xeen maze0050 with mazex130-132: one 32 x 32 level; text aaze0050): the way in at the west
# edge (0,16) ("Exit Dragon Cave?", :17); 15 dragon-tax urns over the southern half (2,000 gold and 20 gems or the
# party is teleported outside, :0-2); 17 Fire Dragons and 14 Frost Dragons; the Dragon King at (29,4) in the south-east;
# Dragon Lore volumes 1-5 and The Art of Taxation at (16,0), (0,31), (31,31), (22,16), (27,0) and (27,1), each behind
# an Intellect check (:3), giving the Loremaster titles and 50,000-500,000 experience (:12-16, :18); 13 chests. Ours
# (D-5.2, Q-C25): one BLV of two floors in the crag at X7's north rim; the Dragon Tax Office stands in the mouth
# before the first dragon (Scaldrith collects the tax once, the inner door throws a party without it out); volume 1 in
# the office's waiting room, volumes 2-5 and the ledger in the library before the Dragon King's door. Dragons are the
# cloud dragons' rows (body 487 high, radius 238; Fly Y): kept in their halls by low openings (D-32: openings of 288 or
# less hold a 487-tall dragon; levelRadiusLimit 60), halls 1,024-2,048 high.
format: mu6-0
map: XD-18
key: xd18
name: Dragon Cave
stands_on: X7 Mount Firestone (the cave in the black crag at the north rim, behind the tax road)
class: M
band: "M: 20-45 sectors, 30-90 M units², 45-75 monsters, 3-7 chests, 6-16 doors (MAPS §0: 40 'few, strong' for XD-18; DECIDE 1)"
size: "25 review rooms, about 33 sectors (the great roost three, the bone hall, the starwell, the library and the King's hall two each); floor 0 about 5,600 x 3,200, floor -1 about 6,400 x 4,400 with the great roost open through both: about 44 M units²; 7 doors (the office's house door, the inner door, the waiting room's door, the library's two pairs of leaves, the King's low pair, the hoard's grate)"
party: [60, 64]
monsters:
  levels: [66, 85]
  boss: "Dragon King 110"
  count: 40
  groups: [1, 2]
  families:
    - "Dragons, Cloudside (11640): Acid Dragon 66 (9, the upper floor), Fire Dragon 75 (17) and Frost Dragon 85 (14): the source's 17 Fire and 14 Frost Dragons, with the family's Acid tier as the young ones near the mouth. No Water Dragon (60 is under the band 65-100; they are X2's lake dragons, D-54). The Dragon King (11645, 110) is the family's boss row"
  mix:
    - {row: Acid Dragon, id: 11641, level: 66, count: 9}
    - {row: Fire Dragon, id: 11642, level: 75, count: 17}
    - {row: Frost Dragon, id: 11643, level: 85, count: 14}
  bosses:
    - {row: Dragon King, id: 11645, level: 110, count: 1}
  kill_xp: "66.64k per member for the 40 (266,569 / 4); with the Dragon King 69.94k (279,769 / 4)"
  kill_xp_target: "64.6k (MAPS §0, 40 monsters): +3.2 %; with the King +8.3 % (DECIDE 1)"
  by_floor: "floor 0: 12 (Acid 9, Fire 3); floor -1: 28 (Fire 14, Frost 14) and the Dragon King"
treasure: {level: 6}
role: "Q-C25 The Dragon Tax (optional): pay Scaldrith at the Dragon Tax Office in the mouth (tax_paid 112500) or be thrown out by the inner door (q-c25.inner_door); Dragon Lore volume 1 on the waiting room's lectern (q-c25.volume1; with it a Dragon takes the Great Wyrm promotion from Scaldrith); volumes 2-5 and The Art of Taxation in the library beyond the dragons (q-c25.volume2-5, taxation: six Loremaster titles). Scaldrith teaches the Dragon Grandmaster (A4, D-5.2). The Dragon King is the map's optional boss"
role_short: "Q-C25: the tax, Dragon Lore, the Dragon King"
set_piece: "Three. The great roost: a cavern 2,048 high under the crag, open through both floors, the upper floor's ledge along its wall, Fire and Frost Dragons wheeling in it. The starwell: a cold hall whose north wall breaks onto the void at the world's rim, a slot of stars 640 above the floor, frost on the rock. The library of Dragon Lore and the Dragon King's hall behind it: worked stone shelves cut for claws, then the King on a dais of heaped gold under a 1,536 roof"
sounds: "the dragons' own monster sounds (xeen_dragonking for the King); a cold wind placed at the starwell (shipped wind loop); the urn's clink at the counter (shipped coin); music 13 (maps.yml)"
textures:
  family: "Caves (dungeon_families: 'XD-18 Dragon Cave: MM8 Dragon Cave d17'): d17's rock is three textures, measured on the shipped BLV: t68a02b (1,210 faces: walls, roofs, floors), t68a02a (264: worn floors, the dragon roads), solid01 (slabs). The office, the waiting room, the library and the King's door as one worked area in MM8 Dragon Hunter's Camp d16 (gtrlwal3 walls, gtrlflr and tfb11 floors, gtrlrf2 and gtrlrf3 roofs, gtrltrm2 trim, t1books1 shelves, hhr1p beams, trim9_32); the steam pools' water mm8/wtrtyl (DECIDE 6)"
  cap: 45
  planned: 15
  new: 1
  new_list: "xdhoard: heaped gold, gems and bones, for the King's dais and the hoard's floor (one picture, tiled); optional, the dais can be bare t68a02a with chests"
  distinct_from: "XD-10 Cave of Illusion (X5, built: MM8 d33, the same t68a02b rock with t68a03b and t09 ashlar, ice at its mouths): XD-18 adds the d16 worked rooms, scorched floors and the hoard, and is two face-maps away; XD-16 Volcano Cave (X7, 7d07 c2b and lava); FD-04 Dragon Tower (X7, DECIDE in fd04.graph.yml)"
floors:
  - {floor: 0, name: "Mouth and upper halls (sill 2,150)", height: 0}
  - {floor: -1, name: "The deep roosts", height: -1024}
spaces:
  # floor 0 (z 0 = X7's mouth floor 2,150)
  - {id: room:mouth, name: Cave mouth, kind: cave, size: M, floor: 0, at: [1, 0], monsters: 0,
     purpose: "The arrival (entrance:x7_mouth): X7's 768 x 640 mouth, scorched rock and gnawed bones, daylight behind. Ahead the office's stone front fills the cave: a counter window and a brass urn on its sill. Quiet (D-11.3)."}
  - {id: room:tax_hall, name: Tax office hall, kind: room, size: M, floor: 0, at: [2, 0], monsters: 0,
     purpose: "D-5.2: the Dragon Tax Office's public hall in d16's timber and stone, 384 high: the office door (door:tax_office, house 4852: Scaldrith, the tax, the Great Wyrm promotion, the Dragon Grandmaster), the urn on the counter, benches by the walls, the inner door in the north wall. Quiet."}
  - {id: room:waiting_room, name: Waiting room, kind: room, size: S, floor: 0, at: [2, 1], goal: true, monsters: 0,
     purpose: "Off the hall behind a door: benches, a lamp on the wall, a lectern with Dragon Lore, volume 1 (q-c25.volume1; hover 'Dragon Lore Volume 1', aaze0050:5). A dead end with a goal. Quiet."}
  - {id: room:scorch_passage, name: Scorched passage, kind: corridor, size: S, floor: 0, at: [3, 0], monsters: 0,
     purpose: "Behind the inner door: a low passage (256 wide, 288 high) of d17 rock blackened by breath, claw marks at shoulder height. Its far opening is the first low opening of D-32: the bone hall's dragons cannot follow into the office. Quiet."}
  - {id: room:bone_hall, name: Bone hall, kind: hall, size: L, floor: 0, at: [4, 0], monsters: 2,
     population: [{row: Acid Dragon, level: 66, count: 2}],
     purpose: "The first dragons: a hall 2,048 x 1,536, 1,280 high, floored with gnawed bones and broken armour (the taxpayers who argued). Its four ways out are low openings (288) except the dragon road up to the roost ledge (768 high), so the pair stays in the hall or on the ledge."}
  - {id: room:acid_hollows, name: Acid hollows, kind: cave, size: M, floor: 0, at: [4, 1], monsters: 3,
     population: [{row: Acid Dragon, level: 66, count: 3}],
     purpose: "Hollows eaten into the rock, green-stained, 1,024 high; three young Acid Dragons (a pair and one). Ways out: low crawls to the last taxpayer and the sulphur vents."}
  - {id: room:last_taxpayer, name: The last taxpayer, kind: cave, size: S, floor: 0, at: [3, 1], chest: 6, monsters: 0,
     purpose: "A dead end with a chest: a knight's remains in good armour, his strongbox and, pinned under it, a receipt from the tax office (A3's line, for example 'Paid in full. Receipt no. 4,118.'). The other half of X7's knight on the tax road."}
  - {id: room:sulphur_vents, name: Sulphur vents, kind: cave, size: M, floor: 0, at: [5, 1], monsters: 2,
     population: [{row: Acid Dragon, level: 66, count: 2}],
     purpose: "Yellow-crusted vents hissing along the floor (dressing, no damage), 1,024 high; to the stair head by a low opening (the floor-0 loop)."}
  - {id: room:roost_ledge, name: Roost ledge, kind: corridor, size: M, floor: 0, at: [5, 0], monsters: 2,
     population: [{row: Acid Dragon, level: 66, count: 2}],
     purpose: "A ledge 384 wide along the great roost's upper wall, a rock lip 128 high on its edge (no fall): the first look down 1,024 into the roost and its Fire Dragons. Inside the roost's volume, so its pair and the roost's flyers can meet here."}
  - {id: room:fire_crossing, name: Fire crossing, kind: cave, size: M, floor: 0, at: [6, 0], monsters: 2,
     population: [{row: Fire Dragon, level: 75, count: 2}],
     purpose: "A cave 1,024 high where the roost's warm air rises through cracks; a Fire Dragon pair. Low openings to the egg cave and the stair head."}
  - {id: room:egg_cave, name: Egg cave, kind: cave, size: S, floor: 0, at: [7, 0], chest: 6, monsters: 1,
     population: [{row: Fire Dragon, level: 75, count: 1}],
     purpose: "A warm dead end, 896 high: three great eggs in a scraped hollow (decorations, no click), the mother on guard, a chest of her hoard by the wall."}
  - {id: room:stair_head, name: Stair head, kind: stair, size: S, floor: 0, at: [6, 1], monsters: 0,
     purpose: "Rough steps down in a low tunnel (288 high: no dragon uses it, so the two floors keep their own dragons). Walked (D-47)."}
  # floor -1 (z -1,024)
  - {id: room:stair_foot, name: Stair foot, kind: stair, size: S, floor: -1, at: [6, 0], monsters: 0,
     purpose: "The steps' foot; low openings west into the great roost and south to the steaming pools."}
  - {id: room:great_roost, name: The great roost, kind: hall, size: L, floor: -1, at: [5, 0], set_piece: true, monsters: 6,
     population: [{row: Fire Dragon, level: 75, count: 4}, {row: Frost Dragon, level: 85, count: 2}],
     purpose: "Set piece: a cavern 3,072 x 2,560 and 2,048 high (to z +1,024), the floor-0 ledge along its north wall, the floor strewn with scales. Three pairs wheel in it. The party enters by low openings (stair foot, old roost); the dragon roads west to the ember gallery and south-west to the starwell are 768 high, so the roost's dragons range into those two halls and no further."}
  - {id: room:steam_pools, name: Steaming pools, kind: cave, size: M, floor: -1, at: [6, 1], monsters: 3,
     population: [{row: Fire Dragon, level: 75, count: 3}],
     purpose: "Hot pools (mm8/wtrtyl, steam as fog; not lava, no damage) in a cave 1,024 high; three Fire Dragons bathing (a pair and one)."}
  - {id: room:east_den, name: East den, kind: cave, size: M, floor: -1, at: [7, 1], chest: 6, monsters: 2,
     population: [{row: Fire Dragon, level: 75, count: 2}],
     purpose: "A dead end with a chest: a den 1,024 high off the pools, its pair asleep on a scatter of coins; low opening only."}
  - {id: room:old_roost, name: Old roost, kind: cave, size: M, floor: -1, at: [5, 1], monsters: 3,
     population: [{row: Fire Dragon, level: 75, count: 3}],
     purpose: "An older roost 1,280 high, its floor worn smooth (t68a02a); low openings to the pools and into the great roost (the floor -1 east loop)."}
  - {id: room:ember_gallery, name: Ember gallery, kind: corridor, size: M, floor: -1, at: [4, 0], monsters: 2,
     population: [{row: Fire Dragon, level: 75, count: 2}],
     purpose: "A dragon road 768 wide and high from the roost to the library's east doors, embers in the cracks; a Fire pair. The library's doors are low (288), so nothing big follows inside."}
  - {id: room:starwell, name: The starwell, kind: hall, size: L, floor: -1, at: [4, 1], set_piece: true, monsters: 3,
     population: [{row: Frost Dragon, level: 85, count: 3}],
     purpose: "Set piece: a cold hall 2,560 x 2,048, 1,536 high, whose north wall breaks open onto the void beyond X7's rim: a slot of stars 2,048 wide whose sill is 640 above the floor (no one walks out; `sky: true` on the slot, X7's fair preset), frost on the rock round it, a wind sound. Three Frost Dragons. The dragon road from the roost (768); low openings west to the frost den."}
  - {id: room:frost_den, name: Frost den, kind: cave, size: M, floor: -1, at: [3, 1], monsters: 2,
     population: [{row: Frost Dragon, level: 85, count: 2}],
     purpose: "Rime-white rock, 1,024 high, a Frost pair; low openings to the rime cave and to the library's west doors (the library loop)."}
  - {id: room:rime_cave, name: Rime cave, kind: cave, size: S, floor: -1, at: [2, 1], chest: 6, monsters: 3,
     population: [{row: Frost Dragon, level: 85, count: 3}],
     purpose: "A dead end with a chest: icicles from a 1,024 roof, a frozen hoard under the ice (the chest), three Frost Dragons (a pair and one)."}
  - {id: room:library, name: Library of Dragon Lore, kind: hall, size: L, floor: -1, at: [3, 0], set_piece: true, goal: true, monsters: 2,
     population: [{row: Frost Dragon, level: 85, count: 2}],
     purpose: "Set piece and goal: a worked hall (d16) 2,048 x 1,536, 1,280 high, shelves cut into the rock at claw height, books the size of doors, two Frost Dragons reading by the lamps. Shelves 2, 3 and 4 (q-c25.volume2-4; hovers 'Dragon Lore Volume 2-4', aaze0050:6-8) and the ledger stand with The Art of Taxation (q-c25.taxation, aaze0050:10). Two pairs of leaves (east and west, each 384 x 288: low, D-32); the two dragons live in the hall."}
  - {id: room:kings_door, name: "The King's door", kind: room, size: S, floor: -1, at: [2, 0], goal: true, monsters: 0,
     purpose: "An antechamber off the library's far end: shelf 5 beside the King's door (q-c25.volume5, A3: 'by the Dragon King's door'; hover aaze0050:9). The King's door: two bronze leaves 512 wide and only 288 high (D-32 keeps the King in)."}
  - {id: room:throne, name: "The Dragon King's hall", kind: hall, size: L, floor: -1, at: [1, 0], boss: true, boss_label: "King 110", monsters: 2,
     population: [{row: Frost Dragon, level: 85, count: 2}],
     purpose: "The boss: a hall 2,560 x 2,048, 1,536 high, the Dragon King (11645, 110, his own skin, DECIDE 3) on a dais of heaped gold (xdhoard) with two Frost Dragons at its feet. The only openings are the King's low door and the hoard's grate behind the dais, which opens at his death."}
  - {id: room:hoard, name: "The King's hoard", kind: cave, size: S, floor: -1, at: [0, 0], chest: 6, monsters: 0,
     purpose: "Behind the dais: the hoard cave, gold to the knees (xdhoard), the King's chest. A dead end with the chest, reached when the grate drops at the King's death."}
