states:
  - {id: state:tax_paid, kind: qbit, where: room:tax_hall,
     what: "q-c25.tax_paid (112500), set by Scaldrith's topic 'The tax' behind the office door (2,000 gold and 20 gems). The inner door's click calls q-c25.inner_door: with tax_paid it opens and stays open (map qbit 118100, drawn open on every later load); without it the hook's fail_text ('\"Tax first,\" says the door, in Scaldrith's voice. The floor tilts, and you are outside on the mountain.') and {exit: x7} to X7's entrance:xd18_mouth, the source's ejection (aaze0050:2). From the inside the door always opens.",
     opens: [link:hall_scorch]}
  - {id: state:king, kind: kill, where: room:throne,
     what: "The Dragon King's death event sets map qbit 118101 and drops the hoard's grate (a door moved by the event); on every later load the grate stands open.",
     opens: [link:throne_hoard]}
  - {id: state:lore, kind: qbit, where: room:library,
     what: "q-c25.volume1-5 (112501-112505) and taxation (112506), A3's: each shelf once per party with a title and 2,000 experience; the ledger stand needs all five ('Read the Lore first. Then we'll talk money.'). Gates nothing in the map.",
     opens: [], draw: false}
