set_piece: "The tribble door and the offering vault: a bronze two-leaf door in the cistern's east wall under a marble lintel, a grille mouth in the wall above it from which the voice asks 'What's the password?'; behind it the undercroft where the temples' offerings wash down through the gods' drains: coins in the silt, gilded cups and a toppled gilt statue, a T6 chest on a ledge"
