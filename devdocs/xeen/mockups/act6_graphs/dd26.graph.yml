open_questions:
  - q: "Count and mix. D-62: 20 monsters at 13.0k-19.6k (DD-22 17.20k; the row 33.5k ±10 %). The source sewer placed none; no family has a sewer tier in 48-65 (sewer stalkers end at 35, oozes and rats are low)."
    options: ["(a) water elementals: Lesser Water Elemental 55 (11625) x16, Water Elemental 62 (11710) x4: 18.76k, group 35.96k (+7.3 %); existing rows and bodies, one faction",
              "(b) Lesser Water Elemental 55 x14 and DD-14's grounded cistern Octopod 50 (11473, placed only, immobile) x6 in the cistern: 17.01k, group 34.21k (+2.1 %); two factions side by side (a hostility check)",
              "(c) a new sewer-stalker tier D 'Sewer Lord' 50 (placed only, the ratman body with a new recolour, no mesh) x14 and Water Elemental 62 x6: 17.20k, group 34.40k (+2.7 %); A2 row and S skin"]
    recommend: "(a)"
    depends: "A2 (Act VI recount; DD-26 added to the rows' where); S only under (c)"
  - q: "Cyrano Jones. The source has him behind the 'Pets Unlimited' door, talking, with his bed."
    options: ["(a) a walk-in den with his counter as a house door: A4 adds 'Pets Unlimited' (a house from D7's block 4801-4850, Cyrano an npc from 5601-5700, a residence or a shop of one item) and A3 his topics (the sale, the TRIBBLES line to an owner); no row, no body",
              "(b) Cyrano as a placed talking actor (monsters[].npc) in the den: a peaceful placed-only row from A2 and a body from S (a shipped merchant)",
              "(c) a house front only on the conduit, no walk-in den (the bed find moves to a drain)"]
    recommend: "(a)"
    depends: "A4 (house and npc ids), A3 (topics), S only under (b)"
  - q: "The tribble's price and use. items.yml has the Tribble (12362, value 5,000, 'A useless and expensive pet. It purrs.'). The source asks 100,000 gold, and only an owner hears the TRIBBLES line."
    options: ["(a) 10,000 gold (the source's joke price at MM6-MM8 scale for Act VI); owning it, Cyrano says the TRIBBLES line; the drains alone also give the word (four pieces in order); the tribble does nothing else",
              "(b) 100,000 gold as the source",
              "(c) as (a), and a carried tribble also opens the door without the word ('what doors they can open')"]
    recommend: "(a)"
    depends: "A3 (Q-D28's file, the sale), A2 (the item's ledger)"
  - q: "What the tribble door guards. The source opens a wall onto a short passage."
    options: ["(a) the offering vault: the set piece and a T6 chest, a dead end with the goal",
              "(b) a short cut from the cistern back to the stair (no chest; the map's chests then 1)"]
    recommend: "(a)"
    depends: "A2 (treasure count)"
  - q: "Q-D28's experience. QUESTS gives the pet as the reward; A2's Act VI quest XP line is not drawn yet."
    options: ["(a) none: the joke pet and the vault are the reward (as D-62's general rule for Act V)",
              "(b) a small sum on the door's first opening (A3, A2's Act VI ledger)"]
    recommend: "(a)"
    depends: "A2, A3"
  - q: "Rest encounters (D-39, D-61). The placed mix is water elementals; tier D never rolls."
    options: ["(a) 10 % from the water elementals at Dif 0 (Water Elemental 62 only, in the band; the 55s are the elementals family's placed-only tier F)",
              "(b) 0"]
    recommend: "(a)"
    depends: "A2 (the map row 9178)"
  - q: "Textures. A6's assign: d01 as XD-21 (another face) with the t3s2 marble shafts; the vault from the temples family."
    options: ["(a) as assigned, about 20 of 30, 0 new; the tribble door a shipped bronze pair",
              "(b) as (a) plus 1 new: a bronze relief for the tribble door's leaves (a small furry ball with a smug face, once per leaf)"]
    recommend: "(a)"
    depends: "A6 (the assign, the count)"
