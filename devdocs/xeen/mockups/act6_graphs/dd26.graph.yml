# MU-6 dungeon graph, a review file for phase 6 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
# `mix` is the placed monster list by row (level, count); kill XP per member = sum of L(L+10) x count / 4 (MAPS §0).
# Lane A8, session 13 (2026-11-21), from D-62 (DD-22 + DD-26 = 40 monsters at 48-65, 33.5k; DD-22 took 20 at 17.20k, so
# DD-26 takes 20 at 13.0k-19.6k).
# The source's Olympus Sewer (dark maze0038, text aaze0038; entered from Olympus maze0037 by four grates, "Descend into
# the sewer?", aaze0037:1): a ring of water channels with walkways round a closed central room, Cyrano Jones the
# Salesman behind the "Pets Unlimited" door with his bed, four drains each holding a piece of a note (TR, IB, BL, ES),
# the "Search the drains." and "Cyrano sells the password." lines, and a door whose voice asks "What's the password?"
# (tribbles; "Wrong! You may not pass!" / "Correct! You may pass."). Cyrano sells a tribble for 100,000 gold; to an
# owner he says "You know TRIBBLES are great companions but you'll be surprised what doors they can open for you!".
# The source placed no monsters. Ours keeps the plan (the ring round Cyrano's den, the four drains, the tribble door)
# as one level of marble-lined channels under D7's Olympus, with one stair up to D7's marble grate (D-58: both ways).
format: mu6-0
