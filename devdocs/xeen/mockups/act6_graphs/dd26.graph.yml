  family: "A6's assign (dungeon_families sewers): MM7 Erathian Sewers d01 as XD-21 (another face: XD-21 its brick culverts, DD-26 its stone channels and grates) with the town shafts in the royal kit's t3s2 marble (t3s2b, t3s2b1): the stair, the conduit's walls and the tribble door's surround in marble; d01's stone channels, grates and water elsewhere; the offering vault in MM8 Temple of the Sun's gtempw1/gtempflr marble with gold trim (A6's temples family, 'an Olympus shrine'); the tribble door a shipped bronze two-leaf pair"
  cap: 30
  planned: 20
  new: 0
  new_names: []
  distinct_from: "XD-21 Robbers' Den (d01's brick and plank face), DD-21 Necropolis Sewer (MM6 sewer.blv grey stone and 6d14), DD-01/DD-18/DD-20 (6d03, 6d08, 7d17): DD-26 is the only marble sewer"
