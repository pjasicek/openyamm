     purpose: "The east range: shelves of genealogy and sermons against garlic; a find (The Blackfang Lineage, readable: the four names of the crypt's coffins)."}
  - {id: room:keep_hall2, name: "The keep's upper hall", kind: hall, size: L, floor: 1, at: [3, 2], monsters: 4,
