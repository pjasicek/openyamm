# MU-6 dungeon graph, a review file for phase 4 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
# `mix` is the placed monster list by row (level, count); kill XP per member = sum of L(L+10) x count / 4 (MAPS §0).
# The source's three castle levels and dungeon (dark maze0045-0048, texts aaze0045-0048) as one BLV of four floors.
# The source enters at its level 1 (Ambrose's griffin, F1 (9,11) -> maze0045 (7,8)) and keeps the Count on its top
# level; A3's M27 turns this into a descent: the griffin lands on the walls (L1, the top), the party fights down
# through L2 to the Count's hall on L3 (the castle's ground floor on the crag top), and his death opens the stair
# to the dungeon, where the Queen is. Floors are named as A3's hooks name them (L1 walls, L2, L3, dungeon).
# BLV frame: x east, y north, z up; z 0 is L3's floor. The courtyard is open to the sky, x -1024..1024,
# y -768..768; four ranges 768 deep round it (outer face x +-1792, y +-1536), towers at the four corners, the keep
# the north range rising a storey above the walls. The wall walk (L1) is the ranges' roof at z 1280.
# On D4 the castle has no door: the gatehouse at the crag's foot never opens (m25.blackfang_gate).
format: mu6-0
map: DD-14
key: dd14
name: Castle Blackfang
stands_on: D4 Lakeside and Blackfang (the black crag on the north shore)
class: M (large)
band: "M: 20-45 sectors, 30-90 M units², 45-75 monsters, 3-7 chests, 6-16 doors; large: 70 monsters, 40-45 sectors"
party: [39, 42]
monsters:
  levels: [38, 58]
  boss: "Count Blackfang 70"
  count: 70
  groups: [2, 4]
  families:
    - "Vampires (11290), DD-03's Act IV rows: Vampire 40 (39), Vampire Lord 50 (10), the Count's three Royal Vampires 58 (a row A2 adds, open question 2) and Count Blackfang 70. The source's family (XEEN_SYSTEMS D57 Vampire, D58 Vampire Lord, D79 Royal Vampire, D80 Ct. Blackfang, all 'C.Blackfang 1-3'). Gnome Vampire 32 is under the band and not used."
    - "Gargoyles of Magic Mountain (11550): Gargoyle Sentinel 38 (10), Gargoyle Overlord 45 (2), on the open wall walks and the courtyard's plinths: the walls are the gargoyles', the vampires keep indoors (open question 3). D4's own family."
    - "Octopods (11470): Octopod 50 (5) in the black cistern under the dungeon: the source puts five octopods in Blackfang's dungeon (XEEN_SYSTEMS D41, 'C.Blackfang Dungeon x5'); stationary in deep water (open question 4)."
    - "Sleepers: 5 of the 70 lie in coffins, placed hidden and shown when their coffin is opened (D-18's pattern; counted at load): 3 Vampires in the sleeping hall, 2 Vampire Lords in the family crypt."
    - "By floor: L1 17, L2 20, L3 19, dungeon 14; the landing quiet (D-11.3)."
    - "Talking, not counted: Queen Kalindra (5001) in her cell; Ambrose (5512) by his griffin on the landing under open question 1's (a)."
  mix:
    - {row: Gargoyle Sentinel, id: 11551, level: 38, count: 10}
    - {row: Gargoyle Overlord, id: 11552, level: 45, count: 2}
    - {row: Vampire, id: 11291, level: 40, count: 39}
    - {row: Vampire Lord, id: 11292, level: 50, count: 10}
    - {row: Royal Vampire, id: "11295 (new, A2)", level: 58, count: 3}
    - {row: Octopod, id: 11470, level: 50, count: 5}
    - {row: Count Blackfang, id: 11294, level: 70, count: 1}
  kill_xp: "40.91k per member (163,622 / 4): 10 x 1,824 + 2 x 2,475 + 39 x 2,000 + 10 x 3,000 + 3 x 3,944 + 5 x 3,000 + 5,600"
  kill_xp_target: "39.2k (MAPS §0, DD-14's row): +4.4 %"
treasure: {level: 4, hoard: 5}
role: "Story M27 (the griffin lands the party on the walls; Count Blackfang on L3 bars the way down; the Queen in the dungeon gives 3-31-62; the crown from DD-03's safe cures her; Ambrose flies everyone out); M25's flight ends here"
role_short: "Story M27"
set_piece: "A black castle on a crag in a storm of bats, entered from the sky: the griffin's landing on the south wall, coffins in rows along the wall walk, a sleeping hall of coffins whose lids open, the Blackfangs' family crypt behind the Count's hall, and under it all a pillared dungeon where the Queen of the Darkside, made a vampire, waits in a cell she will not leave"
textures:
  family: "Halls in MM7 Castle Navan 7d32 (dungeon_families castles, A6's assignment for DD-14: ceb1sa, twb2, cwb1 walls; t3s2fl1, cfb1 floors; t5s1c2 ceilings; ceb1el, ceb1re trim; cwb pillars); the crypt, the sleeping hall's coffin niches, the dungeon and the cistern in MM7 Zokarr's Tomb 7d13 (crypts: twb2, 7tws2, twb1, 7tfb1, cfb1, tfb2, t5d1, 7twb2vr, 7twb2vl, 7wtrtyl); the wall walks, parapets and tower tops in D4's towers kit to match the outside (hkm3 slate-blue under the skull frieze, hkm2 black rubble, hkm3elw, xtslate cone soffits); double doors DD-03's arched oak pair chb1dl/chb1dr, single iron doors t5d1"
  cap: 45
  planned: 33
  new: 1
  new_names:
    - "xbfcrest: Blackfang's arms (a black bat with one red fang on slate grey, D-3.1's pattern), placed once over the Count's throne and once on the great hall's end wall; the banners keep shipped cloth"
floors:
  - {floor: 2, name: "L1: the walls, open sky (z 1280)", height: 1280}
  - {floor: 1, name: "L2: the upper floor (z 640)", height: 640}
  - {floor: 0, name: "L3: ground floor, courtyard (z 0)", height: 0}
  - {floor: -1, name: "The dungeon (z -640)", height: -640}
spaces:
  # floor 2, L1: the wall walk on the ranges' roofs, four tower tops and the keep's top chamber (z 1280)
  - {id: room:landing, name: "Griffin's landing", kind: hall, size: M, floor: 2, at: [2, 2], set_piece: true, monsters: 0,
     purpose: "The south wall walk's middle stretch, 768 wide between a crenellated outer parapet over the lake and a low inner parapet over the courtyard, open sky (open_sky, DD-03's yard route): the arrival (entrance:griffin_walls) and m27.landing's text. Coffins in rows against the outer parapet, lids ajar ('Coffin' / 'The coffin is empty.'), leaving 384 clear down the middle. Bones with the dead adventurer's notes (aaze0045:5: 'Coffins contain treasure and vampires. Floor traps are regularly spaced ... The Count's magic keeps us from descending.'). Under open question 1 (a), Ambrose and his griffin wait here ('Are you ready to leave this awful place, friends?'). The courtyard stair's head in the inner parapet."}
  - {id: room:sw_tower, name: South-west tower, kind: room, size: M, floor: 2, at: [0, 2], monsters: 2,
     population: [{row: Vampire, level: 40, count: 2}],
     purpose: "The tower's top storey under its cone (round, radius 448), shutters closed. The first fight. A spiral stair down to L2. Bones by the wall with the second adventurer's diary (aaze0045:4: '... we must remain inside the castle 'til nightfall ...'), a find."}
  - {id: room:west_walk, name: West wall walk, kind: corridor, size: M, floor: 2, at: [0, 1], monsters: 3,
     population: [{row: Gargoyle Sentinel, level: 38, count: 3}],
     purpose: "Open walk, 512 wide; the gargoyles crouch on the merlons and wake as the party passes. Torches in brackets on the towers' walls at each end."}
  - {id: room:nw_tower, name: North-west tower, kind: room, size: M, floor: 2, at: [1, 1], monsters: 2,
     population: [{row: Vampire, level: 40, count: 2}],
     purpose: "A bronze gong on a frame by the wall (aaze0045:6-7: 'Gong' / 'You hear a rumbling in the distance.'): sounding it slides open the panel into the Count's study on L2 (two-state, stays open)."}
  - {id: room:north_walk, name: North wall walk, kind: corridor, size: M, floor: 2, at: [2, 1], monsters: 3,
     population: [{row: Gargoyle Sentinel, level: 38, count: 2}, {row: Gargoyle Overlord, level: 45, count: 1}],
     purpose: "Along the foot of the keep's top storey, which rises another 640 over the walk; the keep's iron-bound door in its south face."}
  - {id: room:keep_top, name: "The bat roost", kind: room, size: M, floor: 2, at: [2, 0], chest: 4, monsters: 2,
     population: [{row: Vampire, level: 40, count: 2}],
     purpose: "The keep's top chamber under open rafters and louvres, the storm's bats hanging from the beams (they boil out through the louvres as the party enters: sound, a particle burst, no monsters). A strongbox under the droppings (T4). In the roof, a trapdoor (open question 7)."}
  - {id: room:ne_tower, name: North-east tower, kind: room, size: M, floor: 2, at: [3, 1], monsters: 2,
     population: [{row: Vampire, level: 40, count: 2}],
     purpose: "Shuttered top storey; two coffins by the wall (one find, one empty)."}
  - {id: room:east_walk, name: East wall walk, kind: corridor, size: M, floor: 2, at: [4, 1], monsters: 3,
     population: [{row: Gargoyle Sentinel, level: 38, count: 2}, {row: Gargoyle Overlord, level: 45, count: 1}],
     purpose: "The trapped walk: every second flagstone down its length is a pressure plate in a darker slab, fire from the merlons' slits (about a tenth of a band-level member's HP per plate; the notes on the landing are the answer-giver: 'Floor traps are regularly spaced'). The plates leave a clear line along the inner parapet."}
  - {id: room:se_tower, name: South-east tower, kind: room, size: M, floor: 2, at: [4, 2], monsters: 0,
     purpose: "A quiet top storey with a coffin of loot (a find: gold and a ring); a spiral stair down to L2's chapel corner."}
  # floor 1, L2: the upper floor of the four ranges and the keep's middle storey (z 640)
  - {id: room:sw_stair2, name: South-west stair, kind: stair, size: S, floor: 1, at: [0, 0], monsters: 0,
     purpose: "The south-west tower's stair foot on L2."}
  - {id: room:south_gallery, name: Long gallery, kind: hall, size: L, floor: 1, at: [1, 0], monsters: 3,
     population: [{row: Vampire, level: 40, count: 3}],
     purpose: "The south range's gallery, windows on the courtyard; portraits of four centuries of Blackfangs, every one painted with no reflection in the mirror behind it. Wall sconces between the frames."}
  - {id: room:chapel2, name: The black chapel, kind: hall, size: M, floor: 1, at: [3, 0], monsters: 4,
     population: [{row: Vampire, level: 40, count: 2}, {row: Vampire Lord, level: 50, count: 2}],
     purpose: "A household chapel turned round: the altar against the west wall, its cloth embroidered with a bat. Candelabra on floor stands either side of the altar, clear of the aisle. Double doors (chb1dl/chb1dr) from the gallery."}
  - {id: room:se_stair2, name: South-east stair, kind: stair, size: S, floor: 1, at: [4, 0], monsters: 0,
     purpose: "The south-east tower's stair foot on L2, between the chapel and the library."}
