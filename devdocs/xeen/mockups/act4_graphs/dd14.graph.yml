     purpose: "A black throne on a dais under xbfcrest; candelabra on floor stands either side of it, a chandelier from the ceiling. The Count and his three Royal Vampires (one group). His death calls m27.blackfang: 'every coffin lid in the castle slams shut at once', and the bar on the dungeon stair lifts. Doors to the crypt and the dungeon stair behind the dais."}
