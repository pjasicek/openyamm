     what: "Count Blackfang's death: m27.blackfang (once) sets blackfang_slain (111540), shows its text, and the dungeon stair's bar lifts (a two-state leaf; on later loads the map opens it from the qbit). Before it the bar's click calls m27.dungeon_stair, which refuses (open question 6).",
     opens: [link:dstair_down]}
  - {id: state:yard_gate, kind: lever, where: room:courtyard,
     what: "The bar of the courtyard stair's gate, on the courtyard side: lifted from below, the gate opens and stays open (two-state). From the stair: 'The gate is barred on the courtyard side.' The short way back up to the landing.",
     opens: [link:yard_stair]}
  - {id: state:hatch, kind: lever, where: room:shaft,
     what: "The trapdoor's bolt at the ladder's top, drawn from the shaft (two-state, stays open). From the cellar: 'A trapdoor in the floor, bolted from below.' The way out of the dungeon without the Count's hall, and the short way back to the Queen.",
     opens: [link:hatch]}
  - {id: state:coffins, kind: map_var, where: "room:coffin_dorm, room:crypt, the landing's and the towers' coffins",
     what: "Each coffin a map variable: a sleeper's coffin shows its hidden vampire on the first click (show_actors, D-18; counted at load), then gives its find; the others give their find or 'The coffin is empty.' (aaze0047:2).",
     opens: [], draw: false}
  - {id: state:queen, kind: qbit, where: room:queen_cell,
     what: "queen_found (111543) from her first topic (3-31-62, autonote 4127); crown (111541) at DD-03's safe; done (111542) when she takes the crown: the map hides her and calls m27.ambrose_return.",
     opens: [], draw: false}
exits:
  - {id: exit:griffin_walls, space: room:landing, at: [3, 3], kind: both, label: "Ambrose's griffin (D6 in, D4 under Q1)",
     arrival: "entrance:griffin_walls at (0, -1152, 1280) in this map's frame: the middle of the south wall walk, facing north (512) over the inner parapet: the courtyard below, the keep beyond. Fixed at L1 within the landing's open middle, clear of the coffins",
     neighbour: "In: D6's Griffin Pass, Ambrose's 'Fly to Blackfang' (m25.flight; A6's event moves the party here; the hook's text shows on arrival). Out, under open question 1 (a): Ambrose on the landing, 'Are you ready to leave this awful place, friends?' (aaze0045:1), a real choice (D-24), sets the party down on D4 beside the sealed gatehouse (A6's entrance:dd14_griffin, proposed at cell (76, 54) on the north-shore track west of the gate, facing west 1024); and after m25.done D4's gate offers the flight back in ('Would you like my griffin to fly you inside?', aaze0021:9) to entrance:griffin_walls"}
  - {id: exit:d1_home, space: room:queen_cell, at: [0, 2], kind: out, label: "With the Queen: D1, Kalindra's gate",
     arrival: "none in this map (one-way out)",
     neighbour: "m27.ambrose_return after done: the hook's text ('At nightfall Ambrose's griffin lands in the courtyard ...'), then the party moves to D1's kalindra_gate (D-26's arrival at the castle's gate, (47, 70)); the Queen moves to house 4501 by A3's move_npc"}
  - {id: exit:d7_roof, space: room:keep_top, at: [3, 0], kind: both, label: "Roof trapdoor (D7, phase 6)",
     arrival: "entrance:d7_roof under the trapdoor in the bat roost, if the D7 lane wires it",
     neighbour: "The source's Skyroad F1 (9, 11) 'Descend to Castle Blackfang?' (aazex109:5) <-> maze0047 (15, 0). Act IV: bolted, 'A trapdoor in the roof, bolted from above. Wind howls over it.' Open question 7"}
hooks:
  - {hook: m25.flight, space: room:landing, how: "D6's (A6): this map holds its arrival, entrance:griffin_walls; the hook's text shows on arrival"}
  - {hook: m27.landing, space: room:landing, how: "the first arrival's text (a map variable, once): 'Castle Blackfang's battlements. Coffins stand in rows along the wall walk ...'"}
  - {hook: m27.blackfang, space: room:throne, how: "Count Blackfang's death (his group's death event, once): sets blackfang_slain, lifts the dungeon stair's bar"}
  - {hook: m27.dungeon_stair, space: room:dstair, how: "the bar's click and a step plate before it: refuses until blackfang_slain (fail_text, open question 6)"}
  - {hook: m27.queen_cell, space: room:queen_cell, how: "the placed Queen (5001) talks until done; on load and on done the map hides her"}
  - {hook: m27.ambrose_return, space: room:queen_cell, how: "after done: the text, then the move to D1's kalindra_gate (called from the crown topic's do, a request to A3; fallback a step in the cell's doorway that reads done)"}
  - {hook: "m25.blackfang_gate, m25.bat_storm", space: "D4 (A6), not this map", how: "the sealed gatehouse and the storm over the crag; listed so the set is whole"}
critical_path: [room:landing, room:sw_tower, room:sw_stair2, room:coffin_dorm, room:countess, room:keep_hall2,
  room:stair_hall3, room:throne, room:dstair, room:dstair_foot, room:undercroft, room:cells, room:queen_cell]
return_path: [room:queen_cell, room:cells, room:shaft, room:cellar, room:kitchen, room:courtyard, room:landing]
loops:
  - {id: loop:walls, spaces: [room:landing, room:sw_tower, room:west_walk, room:nw_tower, room:north_walk, room:ne_tower, room:east_walk, room:se_tower],
     notes: "The wall walk round the courtyard."}
  - {id: loop:upper, spaces: [room:sw_stair2, room:south_gallery, room:chapel2, room:se_stair2, room:library, room:keep_hall2, room:countess, room:coffin_dorm],
     notes: "L2's ranges round the courtyard."}
  - {id: loop:towers, spaces: [room:sw_tower, room:sw_stair2, room:south_gallery, room:chapel2, room:se_stair2, room:se_tower, room:landing],
     notes: "Down one corner tower, up the other."}
  - {id: loop:ground, spaces: [room:courtyard, room:stair_hall3, room:throne, room:great_hall],
     notes: "The keep door and the great hall's doors both lead to the Count."}
  - {id: loop:stairs, spaces: [room:keep_hall2, room:stair_hall3, room:courtyard, room:kitchen, room:countess],
     notes: "The grand stair and the back stair."}
  - {id: loop:dungeon, spaces: [room:dstair_foot, room:question, room:cells, room:undercroft],
     notes: "Through the question room or the undercroft."}
  - {id: loop:out, spaces: [room:cells, room:shaft, room:cellar, room:kitchen, room:courtyard, room:great_hall, room:throne, room:dstair, room:dstair_foot, room:undercroft],
     notes: "Once the trapdoor is unbolted from below: the ladder closes the dungeon onto the ground floor."}
lines:
  - {text: "Are you ready to leave this awful place, friends?", ref: "dark/aaze0045:1", where: "Ambrose on the landing (open question 1 (a))"}
  - {text: "...entering the black castle today. The Queen is captive somewhere within its walls, and we must remain inside the castle 'til nightfall or she would surely die once we brought her into the light. ...", ref: "dark/aaze0045:4", where: "room:sw_tower, the bones (a find)"}
  - {text: "Coffins contain treasure and vampires. / Floor traps are regularly spaced. Remember to get Sorcerer to Jump us over them. / The Count's magic keeps us from descending. Be sure to kill him when we get a chance.", ref: "dark/aaze0045:5", where: "room:landing, the bones (the traps' and the stair's answer-giver)"}
  - {text: "Gong / You hear a rumbling in the distance.", ref: "dark/aaze0045:6-7", where: room:nw_tower}
  - {text: "Coffin / The coffin is empty.", ref: "dark/aaze0046:0, aaze0047:1-2", where: "every coffin"}
  - {text: "A force like wind pushes you back, lightly at first, but gaining strength as you put more effort into advancing. You are unable to descend.", ref: "dark/aaze0047:0", where: "room:dstair before the Count's death (open question 6)"}
  - {text: "1/9/753: Kloikus Thunbeard the Round came to a bad end today. He was struggling up a ladder in his ridiculous armor when one of those vampires grabbed for his ankles through a hole in the wall. ...", ref: "dark/aaze0047:4", where: "room:shaft, the bones at the ladder's foot"}
  - {text: "You find a diary in the bones, but it has mostly been devoured by rats. None of what remains is legible.", ref: "dark/aaze0047:5", where: room:shaft}
  - {text: "Dutchess Blackfang / Countess Blackfang / Count Blackfang / Lady Blackfang", ref: "dark/aaze0047:6-9", where: "room:crypt, the four coffins' hover names"}
  - {text: "Thank you for trying to rescue me, but I cannot leave this castle ever, as I am now a vampire. / ... It is 3 31 62. / Thank you for bringing me my crown. ... Here is the key to the pyramid ...", ref: "dark/aaze0048:1-3", where: "the Queen; A3's m27 topic is the adapted wording"}
  - {text: "There seems to be no way in. / Hello again, Adventurers. Would you like my griffin to fly you inside?", ref: "dark/aaze0021:3, :9", where: "D4's sealed gate (A6, A3), before and after M25 under open question 1 (a)"}
open_questions:
  - q: "The way out between the Queen and the crown. M27 needs two visits: the Queen gives 3-31-62 (queen_found), the crown is in DD-03's safe (which needs queen_found), then back to her. A3's m25.flight text has Ambrose wave and leave, and D4's gate never opens, so the castle has no way out but spells."
    options: ["(a) the source's way: Ambrose waits on the landing with his griffin ('Are you ready to leave this awful place, friends?', aaze0045:1; maze0045 (7,8) -> F1 (9,11)) and sets the party down on D4 beside the sealed gatehouse; after m25.done D4's gate offers the flight back in ('Would you like my griffin to fly you inside?', aaze0021:9; F1 (9,11) -> maze0045 (7,8)). The gate itself never opens",
              "(b) a postern: a long stair from the dungeon down through the crag to the inside of D4's gatehouse, its bar lifted from inside after the Count's death, then the exit preset both ways (the gate opens from inside only)",
              "(c) no way out but Town Portal, Lloyd's Beacon and the mirrors"]
    recommend: "(a): it is the source's own loop, keeps Blackfang a griffin-only castle (WORLD_DESIGN 3.4, D-36.1) and needs no new geometry on either map; A3 changes m25.flight's text ('Ambrose sets his griffin down on the walls and waits.') and adds a hook for D4's flight in; A4 shows Ambrose here (5512 placed hidden, shown on m25.done) or the map uses an event on the griffin; A6 adds the set-down point and the gate's second state"
    depends: "the landing's exit, D4's gate event and point (A6), m25's texts and a new hook (A3), Ambrose's placement (A4)"
  - q: "The band's top. MAPS gives 36-58; A2's vampires stop at Vampire Lord 50."
    options: ["(a) a new tier Royal Vampire 58 (11295, look C, Curse; the source's D79, Blackfang only): the Count's three guards, 40.91k (+4.4 %)",
              "(b) three more Vampire Lords 50 as his guards: 40.20k (+2.6 %), the band's top 50"]
    recommend: "(a): the source's elite tier, and the boss fight needs more than his own rank-and-file"
    depends: "the throne room's group; A2's row"
  - q: "A second family. The source holds only vampires (and the dungeon's octopods); 51 vampires in one castle read alike."
    options: ["(a) D4's gargoyles on the open walks and the courtyard's plinths: Gargoyle Sentinel 38 (10), Gargoyle Overlord 45 (2); the vampires keep indoors, the gargoyles keep the sky side",
              "(b) vampires only (12 more Vampires 40: 40.61k, +3.6 %)"]
    recommend: "(a): stone on the battlements against the storm of bats reads at once, and it gives the walls a reason to be dangerous in daylight"
    depends: "L1's and the courtyard's populations"
  - q: "The octopods. The source puts five in Blackfang's dungeon; A2's rows are lake swimmers (MM9's swimmer AI, D-36.2), and A1's water facts are for outdoor maps."
    options: ["(a) five Octopods 50 placed stationary ('stand') in the cistern's deep water, reach over the ledge, hold radius 0; nothing more from A1",
              "(b) swimmers in the cistern if A1's water facts work indoors (A1 checks)",
              "(c) five Vampire Lords 50 in their place, the cistern a dry vault"]
    recommend: "(a), D-36.2's own fallback for the lake; (b) later if A1's facts cover BLV water"
    depends: "the cistern; A1 (only for (b))"
  - q: "The sleepers after the Count's death. A3's m27.blackfang says every coffin lid slams shut."
    options: ["(a) flavour only: an unopened sleeper's coffin still lets its vampire rise when opened; the count stays 70",
              "(b) unopened sleepers stay sealed for good (never shown); their coffins give only the find"]
    recommend: "(a): one rule for every coffin, and the critical path reaches the Count only after the sleeping hall anyway"
    depends: "the coffins' events"
  - q: "The dungeon stair's refusal. A3's fail_text 'The stair is barred with black iron. Somewhere above, the Count laughs.' puts him above, but his hall is on the same floor, beside the stair."
    options: ["(a) the source's line on the step before the bar: 'A force like wind pushes you back, lightly at first, but gaining strength as you put more effort into advancing. You are unable to descend.' (aaze0047:0); the bar a plain iron leaf",
              "(b) A3's text with 'Somewhere in the castle, the Count laughs.'"]
    recommend: "(a): the landing's notes ('The Count's magic keeps us from descending') are then its answer-giver"
    depends: "m27.dungeon_stair's fail_text (A3)"
  - q: "The keep's roof. In the source maze0047's corner stair leads up to Skyroad F1 (D7), which offers 'Descend to Castle Blackfang?'."
    options: ["(a) a trapdoor in the bat roost's roof drawn now, bolted ('A trapdoor in the roof, bolted from above. Wind howls over it.'), for the D7 lane to wire in phase 6",
              "(b) none; D7 lands elsewhere"]
    recommend: "(a): costs one leaf now and spares a later rebuild; D7 decides whether to use it"
    depends: "the bat roost; D7's plan (phase 6)"
