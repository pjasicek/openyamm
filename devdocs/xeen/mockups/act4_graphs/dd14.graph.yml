  - {id: room:queen_cell, name: "The Queen's cell", kind: room, size: S, floor: -1, at: [0, 1], set_piece: true, goal: true, monsters: 0,
     purpose: "A cell whose grille door stands open; she will not come out. Queen Kalindra (5001, a talking actor, stand) in a dark gown, the m27 topic 'The crown' (m27.queen_cell): the combination 3-31-62 (queen_found, autonote 4127), then, given the crown, the Pyramid key and done; on done the map hides her and Ambrose's griffin takes the party to D1 (m27.ambrose_return). No light inside the cell; a torch outside its door."}
  - {id: room:undercroft, name: Pillared undercroft, kind: hall, size: L, floor: -1, at: [2, 1], monsters: 5,
     population: [{row: Vampire, level: 40, count: 3}, {row: Vampire Lord, level: 50, count: 2}],
     purpose: "The source's dungeon hall: twelve square pillars in four rows of three under a low vault (cwb), aisles 384 wide between them. Wall torches on the outer walls only."}
  - {id: room:cistern, name: The black cistern, kind: cave, size: L, floor: -1, at: [3, 1], chest: 4, monsters: 5,
     population: [{row: Octopod, level: 50, count: 5, note: "two groups, stationary in the deep water (open question 4)"}],
     purpose: "The castle's rain cistern, a rough vault of black water (7wtrtyl, 384 deep) under a ledge 256 wide round three sides; the Count keeps lake octopods in it. A chest on the far ledge (T4), past the pool."}
