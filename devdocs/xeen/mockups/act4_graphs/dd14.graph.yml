     purpose: "Bedchamber and dressing room, no mirror anywhere; a jewel box on the dressing table (a find). The servants' back stair down to the kitchen in its corner."}
  - {id: room:coffin_dorm, name: Sleeping hall, kind: hall, size: M, floor: 1, at: [0, 1], set_piece: true, monsters: 5,
