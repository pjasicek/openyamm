# MU-6 dungeon graph, a review file for phase 4 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
# `mix` is the placed monster list by row (level, count); kill XP per member = sum of L(L+10) x count / 4 (MAPS §0).
# The source has no Gargoyle Lair map: Darkside F1 asks "Do you wish to destroy the Gargoyle Lair?" at a spot on the
# map (dark/aaze0021:6-7). Ours is a small cave in Magic Mountain's eastern crags (D4, A6's entrance:dd23_lair at
# (46, 42)): a climb from the mouth to the roost under a crack of sky, the gargoyles' nest of stolen shiny things beside
# it (Q-D15: Caleb's magnifying glass).
format: mu6-0
map: DD-23
key: dd23
name: Gargoyle Lair
stands_on: D4 Lakeside and Blackfang (Magic Mountain's eastern crags)
class: S
band: "S: at most 15 sectors and 20 M units², 15-30 monsters, 0-3 chests, 3-8 doors"
size: "8 review rooms, about 11 sectors (the roost two, the perch hall two); about 2,400 x 1,800 on two levels 640 apart, about 13 M units²; 0 doors (a natural cave, the mouth open as D4 has it: open question 4)"
party: [35, 39]
monsters:
  levels: [30, 45]
  boss: null
  count: 15
  groups: [2, 3]
  families:
    - "Gargoyles of Magic Mountain (11550): Mountain Gargoyle 30 (12), Gargoyle Sentinel 38 (2), Gargoyle Overlord 45 (1, the roost's elder): D4's own gargoyles (30/38/45, A6's Dif 2), the same rows as on the mountain outside"
  mix:
    - {row: Mountain Gargoyle, id: 11550, level: 30, count: 12}
    - {row: Gargoyle Sentinel, id: 11551, level: 38, count: 2}
    - {row: Gargoyle Overlord, id: 11552, level: 45, count: 1}
  kill_xp: "5.13k per member (20,523 / 4)"
  kill_xp_target: "the group DD-05+20+23 is 100 monsters and 30.5k; A8's DD-05 (45, 14.29k) and DD-20 (45, 13.42k) with DD-23's 15 (the S floor, as A8 assumed) make 105 monsters and 32.84k, +8 %"
treasure: {level: 4}
role: "Q-D15 Caleb's Magnifying Glass: destroy the roost (q-d15.roost, the source's question) and take the glass from the nest beside it (q-d15.glass); Caleb at the Crossroads (D3) pays 5,000 and an item"
role_short: "Q-D15, Caleb's glass"
set_piece: "The roost: a tall cave under a crack of sky where the gargoyles sit on roosting rocks worn smooth, snow sifting down the crack onto the droppings; 'Do you wish to destroy the Gargoyle Lair?' and the rocks pounded to powder"
sounds: "none of Xeen's own: the shipped whistling wind placed under the sky crack and at the mouth"
textures:
  family: "Caves (dungeon_families mines): MM7 Thunderfist 7d07's grey mountain rock on walls, floors and roofs, MM6 straw on the nest (as XD-26), D4's snow on the floor under the sky crack; one family for the whole cave (open question 3)"
  cap: 30
  planned: 12
  new: 0
  distinct_from: "XD-26 Gargoyle Eyrie (Cloudside, MM7's dragon cave 7d36 brown rock, a vertical shaft of ledges): DD-23 is grey, snowy and short, one climb to one roost"
floors:
  - {floor: 1, name: "The roost level", height: 640}
  - {floor: 0, name: "The mouth level", height: 0}
spaces:
  # floor 0 (z 0 = D4's mouth at about 2,700)
  - {id: room:mouth, name: Cave mouth, kind: cave, size: S, floor: 0, at: [1, 0], monsters: 0,
     purpose: "The arrival (entrance:d4_mouth): the mouth white with droppings, daylight behind, the cave bending up and in. Quiet (D-11.3)."}
  - {id: room:guano_slope, name: Guano slope, kind: corridor, size: M, floor: 0, at: [2, 0], monsters: 3,
     population: [{row: Mountain Gargoyle, level: 30, count: 3}],
     purpose: "A rising passage slick with droppings, scratched by claws; gargoyles that heard the party come down from the dark."}
  - {id: room:bone_ledge, name: Bone ledge, kind: cave, size: S, floor: 0, at: [2, 1], chest: 4, monsters: 1,
     population: [{row: Mountain Gargoyle, level: 30, count: 1}],
     purpose: "A dead end with a chest: a side cleft where a climber died; his bones, rope and pack (the chest)."}
  - {id: room:perch_hall, name: Perch hall, kind: hall, size: M, floor: 0, at: [3, 0], monsters: 3,
     population: [{row: Mountain Gargoyle, level: 30, count: 2}, {row: Gargoyle Sentinel, level: 38, count: 1}],
     purpose: "A high cave with ledges round its walls where the young ones sit; a ramp of broken rock climbs one wall to the upper perches."}
  - {id: room:still_gallery, name: Still gallery, kind: cave, size: M, floor: 0, at: [4, 0], monsters: 3,
     population: [{row: Mountain Gargoyle, level: 30, count: 3}],
     purpose: "Weathered rock pillars like statues, three of them gargoyles that do not move until the party is among them ('Something up there is watching, very still.'); rock steps up to the roost at its end."}
  # floor 1 (z 640)
  - {id: room:upper_perches, name: Upper perches, kind: corridor, size: M, floor: 1, at: [3, 0], monsters: 1,
     population: [{row: Mountain Gargoyle, level: 30, count: 1}],
     purpose: "The top of the ramp: a ledge walk over the perch hall to the roost."}
  - {id: room:roost, name: The roost, kind: hall, size: L, floor: 1, at: [4, 0], set_piece: true, goal: true, monsters: 4,
     population: [{row: Gargoyle Overlord, level: 45, count: 1}, {row: Gargoyle Sentinel, level: 38, count: 1}, {row: Mountain Gargoyle, level: 30, count: 2}],
     purpose: "A tall cave under a crack of sky (sky: true faces, D4's Darkside sky), snow sifting onto the droppings; the roosting rocks, worn smooth, in a ring (indoor destructibles). Clicked: 'Do you wish to destroy the Gargoyle Lair?' Yes: the rocks break (the map's DamageDestructible), q-d15.roost. The elder sits on the highest rock."}
  - {id: room:nest, name: Nest of shiny things, kind: room, size: S, floor: 1, at: [5, 0], goal: true, chest: 4, monsters: 0,
     purpose: "A hollow behind the roost lined with straw: spoons, buckles, broken mirrors, a lady's comb (the chest), and Caleb's glass in the middle (q-d15.glass)."}
links:
  - {id: link:mouth_slope, from: room:mouth, to: room:guano_slope, kind: open}
  - {id: link:slope_bones, from: room:guano_slope, to: room:bone_ledge, kind: open}
  - {id: link:slope_perch, from: room:guano_slope, to: room:perch_hall, kind: open}
  - {id: link:perch_still, from: room:perch_hall, to: room:still_gallery, kind: open}
  - {id: link:perch_up, from: room:perch_hall, to: room:upper_perches, kind: stair, label: "Rock ramp"}
  - {id: link:still_up, from: room:still_gallery, to: room:roost, kind: stair, label: "Rock steps"}
  - {id: link:upper_roost, from: room:upper_perches, to: room:roost, kind: open}
  - {id: link:roost_nest, from: room:roost, to: room:nest, kind: open}
states:
  - {id: state:roost, kind: qbit, where: room:roost,
     what: "The map's question 'Do you wish to destroy the Gargoyle Lair?' (dark/aaze0021:6) at the roosting rocks: yes breaks the rocks (destructibles; they stay broken) and calls q-d15.roost (lair_destroyed 113301, once; the source's +100,000 experience is Caleb's 5,000). Again: A3's else_text. No gate opens.", opens: [], draw: false}
  - {id: state:glass, kind: item, where: room:nest,
     what: "q-d15.glass: the nest's click gives Caleb's Magnifying Glass (12352) and sets glass_found (113302), once; then 'Spoons, buckles, broken mirrors.'", opens: [], draw: false}
exits:
  - {id: exit:d4_mouth, space: room:mouth, at: [0, 0], kind: both, label: "D4: the lair's cave mouth",
     arrival: "entrance:d4_mouth: about 256 inside the mouth, facing north (512) up the cave",
     neighbour: "D4 entrance:dd23_lair (door:dd23) at (46, 42) = about (-9216, 11264, 2700), an open cave mouth facing south under the gargoyles' perches (q-d15.lair_door's line on approach, then the entrance preset); out by the exit preset to D4 (-9216, 10752, ~2700, the ground in front of the mouth) facing south (1536), at the goat path's end"}
hooks:
  - {hook: q-d15.lair_door, space: "D4 (A6)", how: "the line on approach to the mouth; listed for the pair, not placed here"}
  - {hook: q-d15.roost, space: room:roost, how: "the 'yes' of the map's question at the roosting rocks (once)"}
  - {hook: q-d15.glass, space: room:nest, how: "the nest (clicked; once: the glass)"}
critical_path: [room:mouth, room:guano_slope, room:perch_hall, room:upper_perches, room:roost, room:nest]
return_path: [room:nest, room:roost, room:still_gallery, room:perch_hall, room:guano_slope, room:mouth]
loops:
  - {id: loop:climb, spaces: [room:perch_hall, room:upper_perches, room:roost, room:still_gallery],
     notes: "Up by the ramp and the ledge walk, down by the rock steps and the still gallery (or the other way)."}
lines:
  - {text: "Do you wish to destroy the Gargoyle Lair?", ref: "dark/aaze0021:6", where: "room:roost (the map's question)"}
  - {text: "With great effort, you pound roosting rocks to powder and scatter the dust to the wind.", ref: "dark/aaze0021:7 (experience dropped)", where: "room:roost (A3's q-d15.roost)"}
  - {text: "Gargoyles like shiny things.", ref: "dark/aaze0019 (Caleb, A3's paraphrase in q-d15)", where: "room:nest (the reason for the nest; Caleb says it in town)"}
open_questions:
  - q: "Count and kill XP. The group DD-05+20+23 is 100 monsters and 30.5k; A8 put DD-05 (14.29k) and DD-20 (13.42k) at the M floor of 45 each and assumed DD-23 at 15."
    options: ["(a) 15 monsters (the S floor, as A8 assumed for DD-20's arithmetic): 5.13k; the group 105 monsters and 32.84k, +8 %",
              "(b) 18 (three more Mountain Gargoyles and a Sentinel on the perches): 6.19k; the group 108 and 33.9k, +11 %"]
    recommend: "(a): the group stays inside 10 %; the roost still holds four"
    depends: "A2's Act IV recount"
  - q: "The roost's elder. MAPS gives DD-23 no boss and 24-40; D4's gargoyle family's top tier is the Gargoyle Overlord 45 (the group's band is 24-45)."
    options: ["(a) one Gargoyle Overlord 45 on the highest rock, an ordinary tier (no boss row)", "(b) a Gargoyle Sentinel 38 instead (inside 24-40, 5.9k)", "(c) a boss row 'Roost Mother' (A2)"]
    recommend: "(a): the roost wants one big one; no new row"
    depends: "nothing (the row exists)"
  - q: "Textures: a second gargoyle cave must not look like XD-26's brown dragon-cave rock (7d36)."
    options: ["(a) MM7 Thunderfist 7d07's grey mountain rock (dungeon_families mines; listed for XD-16/18 on Cloudside, not yet built) with D4's snow under the crack", "(b) XD-26's 7d36 (cheapest)"]
    recommend: "(a)"
    depends: "A6 (dungeon_families assignment line for DD-23)"
  - q: "Doors. The S band says 3-8 doors; D4 builds the mouth as an open cave mouth with no leaves (A6, plan.yml)."
    options: ["(a) no doors: a natural cave, the band's doors are for built dungeons (as XD-26's caves)", "(b) a wicker screen of sticks before the nest (a door) and a rockfall slab on the bone ledge (a door)"]
    recommend: "(a)"
    depends: "nothing"
  - q: "After the roost is destroyed. The source only gives experience."
    options: ["(a) the rocks stay broken (destructible state, kept by the map), the gargoyles that are left stay (no stage)", "(b) a stage on q-d15.lair_destroyed: the cave's remaining gargoyles hidden on the next load and D4's gargoyle markers near the mouth thinned (A6)"]
    recommend: "(a): one quest, one map, no stage words needed"
    depends: "nothing"
