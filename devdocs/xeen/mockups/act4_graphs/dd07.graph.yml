     arrival: "entrance:d3_door: in the door hall about 256 inside the door at the stair's foot, facing east (0), into the tower",
     neighbour: "D3 thing:eastern_tower door (hkm1d, one leaf; q-d18.tower_door) on the knoll at (97, 46) = (16896, 9216, 1952), facing west; out by the exit preset ('Exit the Great Eastern Tower?', dark/aaze0065:0) to D3 (16384, 9216, 1952) facing west (1024), on the knoll in front of the door"}
