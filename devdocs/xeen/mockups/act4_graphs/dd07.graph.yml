states:
  - {id: state:tower_door, kind: item, where: "D3, the tower's west door",
     what: "q-d18.tower_door: the Key to the Eastern Tower (12340, from Q-D19's Ali Baba chest in DD-06) opens D3's door (A5's event; sets q-d18.started, the tower autonote). This map holds the arrival.", opens: [], draw: false}
  - {id: state:pylon_w, kind: puzzle, where: room:conjury,
     what: "The two ward pylons (indoor destructibles, west in the conjury, east in the scrying room): each broken pylon's beam goes out; when both are broken the door of light fades (a door leaf with a translucent light texture, XD-04's ward and XD-25's door of light) and stays open. Hover: 'Ward pylon'. The vault door's click before: 'A wall of light hums in the doorway. Two beams feed it, from the west and from the east.'",
     opens: [link:ward]}
  - {id: state:pylon_e, kind: puzzle, where: room:scrying, what: "The east pylon (as state:pylon_w).", opens: [link:ward]}
  - {id: state:disc_lever, kind: lever, where: room:disc_top,
     what: "The floating disc (a two-state lift in the well, L4 and L1 only, no stops between, as DD-02's): it rests at L4 at load; the lever on L4 sends it down with the party; after that the call lever at the well's foot brings it either way (a map variable). Before, the foot's lever: 'The disc does not answer from below.'",
     opens: [link:disc], draw: false}
  - {id: state:letter, kind: item, where: room:study,
     what: "q-d18.letter: Ellinger's sealed letter (12361) and the letter autonote; Nasir in Sandcaster reads it (the Archmage promotion).", opens: [], draw: false}
