  - {hook: q-d18.tower_door, space: "D3 (A5)", how: "the tower's door; listed for the pair, not placed here"}
  - {hook: q-d18.jewel, space: room:vault, how: "the stand (clicked; once: the Jewel of Ages 12527; else 'An empty stand.')"}
  - {hook: q-d18.l3_disks, space: room:alcoves, how: "the experiment (clicked; once: 2 Energy Disks by map_gives)"}
  - {hook: q-d18.letter, space: room:study, how: "the desk (clicked; once: Ellinger's letter and autonote 4581)"}
  - {hook: q-d20.griffin, space: room:cabinet, how: "the last glass case (clicked; once: the Golden Griffin 12351)"}
