# MU-6 dungeon graph, a review file for phase 4 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
# `mix` is the placed monster list by row (level, count); kill XP per member = sum of L(L+10) x count / 4 (MAPS §0).
# The source's Great Eastern Tower (dark maze0065-0068, four levels) as one BLV of four floors, 640 apart (L1 0, L2 640,
# L3 1280, L4 1920). Unlike its twin DD-05 (entered at the top, two stairs per pair of floors), the party enters at the
# foot (D3's west door, Q-D19's key) and climbs one spiral stair round an open well that rises through all four floors
# to the cone; the mages float across the well. The floating disc in the well is the way back down from L4.
format: mu6-0
map: DD-07
key: dd07
name: Eastern Tower
stands_on: D3 Sandcaster and the Aging Forest (the knoll by the east rim)
class: M
band: "M: 20-45 sectors, 30-90 M units², 45-75 monsters, 3-7 chests, 6-16 doors (D-9.3: about 30 monsters, under the M floor)"
size: "21 review rooms, about 25 sectors (each floor's ring gallery two); four floors of about 2,800 across round a well of about 900, about 30 M units²; 10 doors"
party: [36, 40]
monsters:
  levels: [28, 45]
  boss: null
  count: 30
  groups: [2, 3]
  families:
    - "Floating mages (11200): Floating Adept 28 (15, a D tier A2 adds, 11203 proposed), Floating Magus 38 (9, an E tier, 11204 proposed), Mystic Mage 45 (4): the tower's mages; the family's own tiers start at 45 (Magic Mage 55, Mega Mage 70 are over the band 28-48)"
    - "Eyes (11570): Floating Eye 40 (2): the mages' bound eyes, for the source's single Gamma Gazer (65, over the band)"
  mix:
    - {row: Floating Adept, id: "11203 (requested from A2)", level: 28, count: 15}
    - {row: Floating Magus, id: "11204 (requested from A2)", level: 38, count: 9}
    - {row: Mystic Mage, id: 11200, level: 45, count: 4}
    - {row: Floating Eye, id: 11570, level: 40, count: 2}
  kill_xp: "11.57k per member (46,276 / 4)"
  kill_xp_target: "11.2k (MAPS §0 after D-9.3: 30 monsters at 28-48), +3 %"
treasure: {level: 4}
role: "Q-D18 The Jewel of Ages (the vault on L3: q-d18.jewel; 2 Energy Disks in the alcoves beside it: q-d18.l3_disks, M18; Ellinger's letter in the top floor's study: q-d18.letter, the Archmage promotion through Nasir); Q-D20: the Golden Griffin in the curio cabinet on L2 (q-d20.griffin)"
role_short: "Q-D18, Archmage; Q-D20's Griffin"
set_piece: "The levitation well: an open shaft from the ground floor to the slate cone with a ring gallery round it on every floor, the mages floating across it, a pale light falling from the cone; the floating disc that rides it from L4 to the door hall once its lever is pulled"
sounds: "xeen_amb_tower (62802) as the bed (AUDIO: 'the towers of Mok'), two placed in the well; xeen_lift (62509) for the disc; xeen_spring_drink (62512) at L4's Fountain of Minimal Abilities"
textures:
  family: "Towers of Mok: MM8 Castle of Air d27 (gston1wl walls over gstntilev skirting, gston1fl, gstn1cl, gcstflor in the galleries, gcstdoor) as DD-05, DD-06 and DD-08 (dungeon_families towers: 'one family; accents per tower'). DD-07's accent: the mages' laboratory and study on L4 in MM7 School of Sorcery 7d14 (open question 6); the vault's ward a door leaf with XD-04's light texture; the dead mirror D-37's xkmirror"
  cap: 45
  planned: 26
  new: 0
  distinct_from: "DD-05 Western Tower (A8): its accent is d22's pale marble chapel, it is entered at the top, its stairs come in pairs; DD-07 has the central well, the floating disc, the vault's ward, the Griffin and the Jewel"
floors:
  - {floor: 3, name: "L4: under the cone", height: 1920}
  - {floor: 2, name: "L3: the vault floor", height: 1280}
  - {floor: 1, name: "L2: the curio floor", height: 640}
  - {floor: 0, name: "L1: ground floor", height: 0}
spaces:
  # floor 3, L4 (z 1920; the well rises into the cone, about 2,900)
  - {id: room:disc_top, name: The disc's landing, kind: shaft, size: S, floor: 3, at: [0, 0], monsters: 0,
     purpose: "A railed opening in L4's gallery over the well where the floating disc (a lift) rests at load; the disc's lever on the rail post: 'Down?' sends it with the party to the door hall. Built into room:ring4 (D-45 (3)): an opening in the top gallery's east rail, not a room of its own."}
  - {id: room:ring4, name: Gallery under the cone, kind: corridor, size: M, floor: 3, at: [1, 0], monsters: 3,
     population: [{row: Floating Magus, level: 38, count: 2}, {row: Floating Adept, level: 28, count: 1}],
     purpose: "The top gallery round the well under the cone's rafters; two of the mages float over the void. The chandelier hangs from the cone's ring beam over the well."}
  - {id: room:stair4, name: Top landing, kind: stair, size: S, floor: 3, at: [1, 1], monsters: 0,
     purpose: "The spiral stair's last landing; doors to the gallery and the study."}
  - {id: room:lab, name: "The laboratory", kind: hall, size: M, floor: 3, at: [2, 0], monsters: 1,
     population: [{row: Mystic Mage, level: 45, count: 1}],
     purpose: "Benches of glass and brass, the Bubbling Vat, the Fountain of Minimal Abilities ('Your statistics have increased!', +1 to every statistic once per character) and the Fountain of Life (heals, any time). Floor braziers under the retorts."}
  - {id: room:study, name: "The Archmagus's study", kind: room, size: M, floor: 3, at: [2, 1], goal: true, chest: 4, monsters: 3,
     population: [{row: Mystic Mage, level: 45, count: 2}, {row: Floating Eye, level: 40, count: 1}],
     purpose: "The tower master's study: on the desk Ellinger's sealed letter 'To the Guildmaster of Sandcaster' (q-d18.letter); two lecterns, the Book of Fantastic Knowledge (+2 Intellect once per character) and the Book of Great Power ('A magic aura around the book pushes you back.'); the master's chest; his bound eye floats by the window."}
  # floor 2, L3 (z 1280)
  - {id: room:stair3, name: Third landing, kind: stair, size: S, floor: 2, at: [1, 0], monsters: 0,
     purpose: "The spiral stair's L3 landing."}
  - {id: room:ring3, name: Third gallery, kind: corridor, size: M, floor: 2, at: [2, 0], monsters: 2,
     population: [{row: Floating Eye, level: 40, count: 1}, {row: Floating Adept, level: 28, count: 1}],
     purpose: "The gallery round the well; the vault's door of light on its east side, humming."}
  - {id: room:conjury, name: Conjury, kind: room, size: M, floor: 2, at: [2, 1], monsters: 3,
     population: [{row: Floating Magus, level: 38, count: 2}, {row: Floating Adept, level: 28, count: 1}],
     purpose: "A summoning room with a chalk circle; the west ward pylon, a crystal on a pillar feeding a beam to the vault (an indoor destructible: break it, its beam goes out). A passage in the wall to the scrying room."}
  - {id: room:scrying, name: Scrying room, kind: room, size: M, floor: 2, at: [3, 1], monsters: 3,
     population: [{row: Floating Magus, level: 38, count: 2}, {row: Floating Adept, level: 28, count: 1}],
     purpose: "Crystal balls on stands round a black pool; the east ward pylon (destructible)."}
  - {id: room:vault, name: "The mages' vault", kind: room, size: M, floor: 2, at: [3, 0], goal: true, monsters: 1,
     population: [{row: Mystic Mage, level: 45, count: 1}],
     purpose: "Behind the door of light (it fades when both pylons are broken): the Jewel of Ages on a stand of black glass (q-d18.jewel); the vault's keeper."}
  - {id: room:alcoves, name: Disk alcoves, kind: room, size: S, floor: 2, at: [4, 0], goal: true, monsters: 0,
     purpose: "Alcoves off the vault with a mage's experiment of wires and two Energy Disks in it (q-d18.l3_disks: 'Disc.'); then 'Loose wires where the disks were.'"}
  # floor 1, L2 (z 640)
  - {id: room:stair2, name: Second landing, kind: stair, size: S, floor: 1, at: [1, 0], monsters: 0,
     purpose: "The spiral stair's L2 landing."}
  - {id: room:ring2, name: Second gallery, kind: corridor, size: M, floor: 1, at: [2, 0], monsters: 3,
     population: [{row: Floating Adept, level: 28, count: 2}, {row: Floating Magus, level: 38, count: 1}],
     purpose: "The gallery round the well; mages float out over the void to cast from the far side."}
  - {id: room:cabinet, name: Cabinet of curiosities, kind: room, size: M, floor: 1, at: [3, 0], goal: true, monsters: 2,
     population: [{row: Floating Magus, level: 38, count: 2}],
     purpose: "Glass cases of labelled oddities; in the last the Golden Griffin ('Griffin, gold. Thaumic value: none. Bought anyway.', q-d20.griffin)."}
  - {id: room:dormitory, name: "Mages' dormitory", kind: room, size: M, floor: 1, at: [3, 1], chest: 4, monsters: 2,
     population: [{row: Floating Adept, level: 28, count: 2}],
     purpose: "Narrow beds and robes on pegs; the mages' chest."}
  - {id: room:mirror, name: Mirror room, kind: room, size: S, floor: 1, at: [2, 1], monsters: 0,
     purpose: "A tall dead mirror in a carved frame (xkmirror): 'The mirror does not respond.' Between the dormitory and the landing."}
  # floor 0, L1 (z 0 = D3's knoll at 1,952)
  - {id: room:well_foot, name: Foot of the well, kind: shaft, size: M, floor: 0, at: [0, 0], set_piece: true, monsters: 3,
     population: [{row: Floating Adept, level: 28, count: 3}],
     purpose: "The bottom of the well: a round floor inlaid with a star, the shaft of light from the cone four floors up, the disc's empty socket (its call lever works once the disc has been sent down from L4); three adepts float in the light."}
  - {id: room:door_hall, name: Door hall, kind: room, size: S, floor: 0, at: [1, 1], monsters: 0,
     purpose: "The arrival (entrance:d3_door) inside the west door, at the foot of the spiral stair. Quiet (D-11.3). Wall sconces."}
  - {id: room:ring1, name: East gallery, kind: corridor, size: M, floor: 0, at: [2, 0], monsters: 2,
     population: [{row: Floating Adept, level: 28, count: 2}],
     purpose: "The ground floor's gallery round the well's east side."}
  - {id: room:commons, name: "Mages' commons", kind: room, size: M, floor: 0, at: [2, 1], monsters: 2,
     population: [{row: Floating Adept, level: 28, count: 2}],
     purpose: "A refectory and reading room: a long table beside the line between its doors, lore books on shelves."}
  - {id: room:store, name: Store room, kind: room, size: S, floor: 0, at: [3, 0], chest: 4, monsters: 0,
     purpose: "A dead end with a chest: reagents in jars and sacks in clumps (a storeroom)."}
