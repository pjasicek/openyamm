  - {id: loop:l2, spaces: [room:stair2, room:ring2, room:cabinet, room:dormitory, room:mirror], notes: "Round L2: the gallery, the cabinet, the dormitory, the mirror room."}
  - {id: loop:l3, spaces: [room:ring3, room:conjury, room:scrying], notes: "The two pylon rooms joined by the passage in the wall."}
