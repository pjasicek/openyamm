     notes: "Up the spiral stair, down on the floating disc once its lever is pulled."}
lines:
  - {text: "Exit the Great Eastern Tower?", ref: "dark/aaze0065:0", where: "room:door_hall (the exit preset's meaning, D-24)"}
  - {text: "The mirror does not respond. / Where to? / Destination Unknown", ref: "dark/aaze0066:1-3", where: "room:mirror (flavour only: 'The mirror does not respond.')"}
  - {text: "Jewel / Disc / Nothing here.", ref: "dark/aaze0067:0-2", where: "room:vault (hover 'Jewel'), room:alcoves ('Disc'), the beds and shelves' finds"}
  - {text: "Bubbling Vat / Fountain of Minimal Abilities / Your statistics have increased! / The water is cool and refreshing. / Fountain of Life", ref: "dark/aaze0068:0-4", where: room:lab}
  - {text: "Book of Fantastic Knowledge / Your intellect is already fantastic! / A magic aura around the book pushes you back. / +50 Intellect (permanent) -> +2", ref: "dark/aaze0068:5-8", where: room:study}
  - {text: "Book of Great Power / ... the cost is dear ... / You gain no more power from the book.", ref: "dark/aaze0068:9-11", where: "room:study (the book refuses: aaze0068:7)"}
  - {text: "The bittersweet water runs down your throat.  The effect is instantaneous, you age 50 years! +1 Level (permanent).", ref: "dark/aaze0068:12", where: "room:lab, the Bubbling Vat (open question 4)"}
open_questions:
  - q: "Rows. D-9.3 keeps the tower's floating mages at 28-48, but A2's floating mages start at 45 (Mystic 45, Magic 55, Mega 70) and the source's Gamma Gazer is 65."
    options: ["(a) two lower floating-mage tiers from A2: D 'Floating Adept' 28 (11203, Mystic look, Fire Bolt E), E 'Floating Magus' 38 (11204, Lightning Bolt M); Mystic Mage 45 on top; two Floating Eyes 40 (eyes A) for the Gamma Gazer: 11.57k, +3 %",
              "(b) no new rows: Sandcaster's Sorceresses 30 and Enchantresses 40 as the tower's lower ranks with the Mystic Mages (walking, not floating), 11.4k",
              "(c) the family as it is: 30 Mystic Mages 45 (18.6k, +66 %)"]
    recommend: "(a): the floating is the tower's character (MAPS: 'Floating mages'); the eyes replace the Gazer at the band"
    depends: "A2 (rows, fly Y on the whole floating-mage family so they hold over the well), A2's Act IV recount"
  - q: "Count against class. MAPS keeps DD-07 an M dungeon (four floors) and D-9.3 gives it about 30 monsters, under the M floor of 45."
    options: ["(a) M by size (21 rooms, about 25 sectors) with D-9.3's 30: a sparse tower of strong casters", "(b) 45 at the M floor (about 17.4k, +55 % on its row)", "(c) re-class S (not possible: four floors and a well need about 25 sectors)"]
    recommend: "(a)"
    depends: "nothing (D-9.3 stands)"
  - q: "L4's gifts. The source's Fountain of Minimal Abilities gives +10 to all stats; the Book of Fantastic Knowledge +50 Intellect; the Book of Great Power +5 levels for every secondary skill; the vat's water +1 level for 50 years. Rule: MM6-MM8 sizes, no levels."
    options: ["(a) the fountain +1 to every statistic once per character (DD-09's barrel size, D-27); the Book of Fantastic Knowledge +2 Intellect once per character ('Your intellect is already fantastic!' after); the Book of Great Power refuses everyone ('A magic aura around the book pushes you back.'); the vat a dressing with a hover name only; the Fountain of Life heals",
              "(b) as (a) and the vat ages ten years for +2 Endurance (a gamble, Thaddeus's fountain below the knoll takes the years back)",
              "(c) the fountain +2 to one statistic of the member's choice"]
    recommend: "(a); 2 player bits (fountain, book) from A3"
    depends: "A3 (two player bits, lines), A2 (Act IV values)"
  - q: "The vault's lock. A3's hooks put the jewel 'in the mages' vault'; the source's vault is open. Every locked door needs its key placed and named."
    options: ["(a) a door of light fed by two pylons (destructibles) in the two rooms either side: break both and it fades (no key; the vault door's click says so)",
              "(b) a key on the Mystic Mage in the study (L4), so the vault is opened on the way down",
              "(c) an open vault"]
    recommend: "(a): the pylons give L3 its errand and its loop; nothing to carry"
    depends: "A1's destructibles word (exists, INDOOR_DESTRUCTIBLES); the light texture (XD-04's)"
  - q: "The dead mirror on L2 ('Where to?' / 'Destination Unknown'). D-25 left DD-06's mirror out; D-37 made xkmirror for DD-02's dead mirror."
    options: ["(a) a dead mirror as flavour with xkmirror: 'The mirror does not respond.'", "(b) left out (the mirror room becomes a linen room)"]
    recommend: "(a)"
    depends: "nothing"
  - q: "The accent. dungeon_families gives the four Towers of Mok one family (d27) with an accent per tower; DD-05 took MM8 Temple of the Sun d22 for its chapel."
    options: ["(a) MM7 School of Sorcery 7d14 for L4's laboratory and study (XD-12 Darzog's Tower uses it on Cloudside)", "(b) MM6 Agar's Laboratory 6d19 (DD-02 Ellinger's, on the same face)", "(c) no accent: d27 throughout"]
    recommend: "(a): a mage's laboratory, on the other face from XD-12"
    depends: "A6 (dungeon_families assignment line for DD-07)"
  - q: "Inside against outside. D3's tower (A5) stands on its knoll in three tiers under a slate cone; the interior is four floors of about 2,800 across round a well."
    options: ["(a) the interior larger than the shell, as DD-02, DD-05 and DD-06", "(b) A5 widens the tower"]
    recommend: "(a)"
    depends: "nothing on D3"
