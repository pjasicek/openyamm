open_questions:
  - q: "The thrones' size. A3's q-c9 gives +5 to a statistic per throne (the source's titles 'at small MM6-MM8 size'); the rule for permanent rewards is pools +2, brews +5 (to resistances), no levels."
    options: ["(a) +2 per throne, once per character (four thrones: +2 Might, Personality, Accuracy, Endurance), A3 edits the four texts",
              "(b) +5 as A3 wrote: a quest's reward behind the riddle, bigger than a pool",
              "(c) +3"]
    recommend: "(a): the rule's size; the Sphinx's prize is four of them in one place plus the award"
    depends: "A3 (four hook texts), A2 (Act IV values)"
  - q: "The hieroglyph clues. A3's hook holds all five clues in one text; the source puts one clue per wall (and needs Linguist, gone)."
    options: ["(a) five walls, one clue each as map-local lines (the drop cell the first, the west hall the second, the east hall the third and fourth, the library the fifth), every party can read them; A3's whole text on the library's end wall as the scribes' summary",
              "(b) one wall with A3's whole text, in the drop cell"]
    recommend: "(a): the dungeon is the puzzle's answer-giver, as the source; the drop cell holds the first clue so a party that fell starts reading at once"
    depends: "A3 (ORIGINAL_LINES: the five lines as map-local signs)"
  - q: "The spell books. The source teaches Divine Intervention and Starburst in the head, Teleport and Item to Gold in the dungeon; MM7's spells have Divine Intervention and Starburst (Light), neither Teleport nor Item to Gold."
    options: ["(a) spellbook items on lecterns: Starburst and Divine Intervention in the head; in the dungeon Town Portal for 'Teleport' and Lloyd's Beacon for 'Item to Gold'",
              "(b) as (a) with the dungeon's two dropped (gems instead)",
              "(c) none: the books as readable lore only"]
    recommend: "(b): the two Light books keep their source names; the dungeon's library keeps a gem cache and its chest"
    depends: "A2 (fixed items in Act IV), the lecterns' events"
  - q: "The sarcophagus' Might check. XD-08 used Might 30 for a party of 15-17 (D-4)."
    options: ["(a) Might 40 on the clicking member, potions and spells counting; the gallery's chest is the sarcophagus", "(b) no check"]
    recommend: "(a), with a fixed Might potion in the haunch vault's chest"
    depends: "A2 (the fixed potion)"
  - q: "The drop. A wrong name 'drops the party into the hieroglyph dungeon'. The disc is a door leaf that sinks (two-state) while the party is moved inside the map to the drop cell (MoveTo with fall damage), then rises."
    options: ["(a) the disc sinks, the party is moved to the drop cell, the disc rises after 2 s (no hole left open)", "(b) only the move, no visible disc"]
    recommend: "(a)"
    depends: "A1 only if an in-map move after a door event is lost (XD-12's falls already move the party)"
  - q: "Monster levels. MAPS's dungeon table says XD-15 28-45; its §0 row (the group) says 22-45. The Sand Golems (22) and Stone Golems (26) are under 28."
    options: ["(a) §0's 22-45 for both maps (X6's own Sand Golems, the source's 'Stone and Earth Golems'), MAPS's dungeon row corrected", "(b) 28-45: Water Golems 28 for the Sand Golems and more mummies (about +3k)"]
    recommend: "(a)"
    depends: "MAPS (the orchestrator)"
