# MU-6 dungeon graph, a review file for phase 4 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
# `mix` is the placed monster list by row (level, count); kill XP per member = sum of L(L+10) x count / 4 (MAPS §0).
# The source's Sphinx (xeen maze0082 body, 0083 head, 0084 dungeon) as one BLV (MAPS): the body at the door's level,
# the head above it up the throat stair, the hieroglyph dungeon below. The name riddle is in the head; a wrong name
# drops the party into the dungeon, whose stair climbs back to the body. GOLUX opens the four thrones.
format: mu6-0
map: XD-15
key: xd15
name: The Sphinx
stands_on: X6 Desert of the Sphinx (the Northern Sphinx)
class: M
band: "M: 20-45 sectors, 30-90 M units², 45-75 monsters, 3-7 chests, 6-16 doors"
size: "21 review rooms, about 26 sectors (the belly hall three, the paw hall and the riddle chamber two each); body about 3,000 x 4,000, head 2,000 x 1,800, dungeon 2,800 x 2,000: about 40 M units²; 9 doors"
party: [31, 34]
monsters:
  levels: [22, 42]
  boss: null
  count: 45
  groups: [2, 3]
  families:
    - "Elemental golems (11590): Sand Golem 22 (16), X6's ruin golems, in the dungeon and the paws (the source's 'Earth Golems')"
    - "Material golems (11580): Stone Golem 26 (18), Iron Golem 40 (4): the Sphinx's own guardians, Iron in the belly hall and at the riddle"
    - "Pyramid mummies (11270): Tomb Mummy 42 (7) in the sarcophagus galleries, the lappets and the dungeon's library (the family's 'where' gains the Northern Sphinx)"
  mix:
    - {row: Sand Golem, id: 11590, level: 22, count: 16}
    - {row: Stone Golem, id: 11581, level: 26, count: 18}
    - {row: Iron Golem, id: 11582, level: 40, count: 4}
    - {row: Tomb Mummy, id: 11270, level: 42, count: 7}
  kill_xp: "12.85k per member (51,400 / 4)"
  kill_xp_target: "12.65k (half of the XD-14+15 group's 25.3k); with XD-14's 14.00k the group is 26.85k, +6 %"
treasure: {level: 4}
role: "Q-C9 The Sphinx: the door opens to Arie's amulet (X6's q-c9.door); the head asks its name (GOLUX: q-c9.name_right, award 'Named the Sphinx', 6,000; wrong: the drop); the four thrones once per character (player bits 11300-11303); the source's spell books"
role_short: "Q-C9, the thrones"
set_piece: "The riddle chamber inside the head: the back of the stone face, two hieroglyph plaques, a voice that booms 'What is my name?' and the floor that agrees with it when the answer is wrong; below, the belly hall's three sealed throne doors"
sounds: "xeen_sphinx_stir (62506) when GOLUX is named (the throne doors open) and when the floor drops; the shipped humming as the dungeon bed"
textures:
  family: "Temples: MM6 Tomb of VARN (pyramid.blv) upper levels everywhere (dungeon_families temples: 'XD-15 The Sphinx (X6), FD-02 Southern Sphinx: mm6/pyramid.blv upper (egy walls, carved ceilings)'): egybigb, egybiga block walls, egywla and egywld hieroglyph walls for the plaques and the dungeon, carved ceilings; the thrones' rooms with egycol64 striped columns (X6's nemes stone)"
  cap: 45
  planned: 26
  new: 0
  distinct_from: "FD-02 Southern Sphinx (phase 6, same family): FD-02 takes the darker lower egy set; DD-15 Great Pyramid (A8) its lower Ancient levels in the ancient kit"
floors:
  - {floor: 1, name: "The head", height: 1280}
  - {floor: 0, name: "The body", height: 0}
  - {floor: -1, name: "The hieroglyph dungeon", height: -640}
spaces:
  # floor 0, the body (z 0 = X6's sill at 1,408)
  - {id: room:breast_gate, name: Breast gate, kind: room, size: S, floor: 0, at: [1, 0], monsters: 0,
     purpose: "The arrival (entrance:x6_paws): inside the breast between the paws, the two leaves behind; a step up into the paw hall. Quiet (D-11.3)."}
  - {id: room:paw_hall, name: Hall of the paws, kind: hall, size: M, floor: 0, at: [2, 0], monsters: 4,
     population: [{row: Sand Golem, level: 22, count: 3}, {row: Stone Golem, level: 26, count: 1}],
     purpose: "Under the chest: two rows of columns, the throat stair rising at the front, the flank galleries leaving left and right. Floor braziers between the columns."}
  - {id: room:throat_stair, name: Throat stair, kind: stair, size: S, floor: 0, at: [3, 0], monsters: 0,
     purpose: "A straight stair in the throat up to the neck landing in the head ('Stairs up.  Take them?' as a sign)."}
  - {id: room:gallery_w, name: West sarcophagus gallery, kind: corridor, size: M, floor: 0, at: [1, 1], chest: 4, monsters: 4,
     population: [{row: Tomb Mummy, level: 42, count: 2}, {row: Sand Golem, level: 22, count: 2}],
     purpose: "Along the west flank: sarcophagi in niches, their sleepers up and about. The great sarcophagus at the middle is the chest: 'You aren't strong enough to open the sarcophagus.' below Might 40 on the clicking member (potions counting)."}
  - {id: room:gallery_e, name: East sarcophagus gallery, kind: corridor, size: M, floor: 0, at: [3, 1], monsters: 4,
     population: [{row: Tomb Mummy, level: 42, count: 2}, {row: Sand Golem, level: 22, count: 2}],
     purpose: "Along the east flank, the same niches: 'There is nothing in the sarcophagus.' in each, and a cache of gems in the last one (a find)."}
  - {id: room:belly_hall, name: The belly hall, kind: hall, size: L, floor: 0, at: [2, 2], set_piece: true, monsters: 6,
     population: [{row: Stone Golem, level: 26, count: 5}, {row: Iron Golem, level: 40, count: 1}],
     purpose: "Under the vaulted back: a long hall of striped columns; on its sides three sealed throne doors carved with a crown, a veil and a mask (they open when the Sphinx is named). The golems stand as statues until the party is close."}
  - {id: room:king_throne, name: "King's throne", kind: room, size: M, floor: 0, at: [1, 2], goal: true, monsters: 0,
     purpose: "Behind the crown door: the King's throne on a dais (q-c9.throne_king: +Might once per character)."}
  - {id: room:queen_throne, name: "Queen's throne", kind: room, size: M, floor: 0, at: [3, 2], goal: true, monsters: 0,
     purpose: "Behind the veil door: the Queen's throne (q-c9.throne_queen: +Personality). One wall panel is cracked and loose (hover 'Loose panel')."}
  - {id: room:thieves_throne, name: "Thieves' throne", kind: room, size: S, floor: 0, at: [4, 2], goal: true, monsters: 0,
     purpose: "Behind the loose panel (a secret door: click it): the Prince of Thieves' throne in a closet (q-c9.throne_thieves: +Accuracy; player bit 11302, which DD-06's Prince Book reads)."}
  - {id: room:haunch_vault, name: Vault of the haunches, kind: room, size: M, floor: 0, at: [2, 3], chest: 4, monsters: 4,
     population: [{row: Stone Golem, level: 26, count: 3}, {row: Iron Golem, level: 40, count: 1}],
     purpose: "In the haunches at the back: grave goods on shelves and the vault's chest; the dungeon stair goes down beside it."}
  - {id: room:dungeon_stair, name: Dungeon stair, kind: stair, size: S, floor: 0, at: [1, 3], monsters: 0,
     purpose: "Steps down from the vault into the hieroglyph dungeon ('Stairs down.  Take them?' as a sign): the dungeon is open without the drop."}
  # floor 1, the head (z 1280)
  - {id: room:neck_landing, name: Neck landing, kind: room, size: S, floor: 1, at: [3, 1], monsters: 3,
     population: [{row: Stone Golem, level: 26, count: 3}],
     purpose: "The top of the throat stair; passages left and right into the lappets."}
  - {id: room:west_lappet, name: West lappet, kind: room, size: S, floor: 1, at: [4, 0], chest: 4, monsters: 2,
     population: [{row: Tomb Mummy, level: 42, count: 1}, {row: Stone Golem, level: 26, count: 1}],
     purpose: "Inside the striped lappet that falls before the west shoulder: a priest's chest; a slit window over the desert."}
  - {id: room:east_lappet, name: East lappet, kind: room, size: S, floor: 1, at: [4, 1], monsters: 2,
     population: [{row: Stone Golem, level: 26, count: 2}],
     purpose: "The east lappet: an offering niche with gems in it ('Gems', a find)."}
  - {id: room:riddle, name: The riddle chamber, kind: hall, size: M, floor: 1, at: [5, 1], set_piece: true, goal: true, monsters: 2,
     population: [{row: Iron Golem, level: 40, count: 2}],
     purpose: "Behind the face: the eyes' slits let in two bars of light; two hieroglyph plaques ('You're looking for my name, it's five letters long.' / 'I think you'll like my name. Try not to get it wrong.'); stepping on the floor's sun disc: 'What is my name?' (q-c9.riddle). GOLUX: the Sphinx stirs, the throne doors open (q-c9.name_right). Anything else: the disc drops (q-c9.name_wrong). Two iron guardians flank the disc."}
  - {id: room:legend_throne, name: Throne of legends, kind: room, size: M, floor: 1, at: [5, 0], goal: true, monsters: 0,
     purpose: "In the nemes' crown, behind a door that opens with the name: the throne of legends (q-c9.throne_legend: +Endurance) and two lecterns, the Book of the Heavens and the Book of the Sun (spellbooks)."}
  # floor -1, the hieroglyph dungeon (z -640)
  - {id: room:stair_foot, name: Stair foot, kind: room, size: S, floor: -1, at: [1, 0], monsters: 2,
     population: [{row: Sand Golem, level: 22, count: 2}],
     purpose: "The foot of the dungeon stair: a painted procession of animal-headed figures on the walls (pictures only, no clue)."}
  - {id: room:glyph_w, name: West hieroglyph hall, kind: corridor, size: M, floor: -1, at: [2, 0], monsters: 4,
     population: [{row: Sand Golem, level: 22, count: 3}, {row: Tomb Mummy, level: 42, count: 1}],
     purpose: "A low hall of hieroglyph walls, one of them a clue ('My second is in mole but not in mule.'); sand drifted in from the cracks."}
  - {id: room:glyph_e, name: East hieroglyph hall, kind: corridor, size: M, floor: -1, at: [3, 0], monsters: 3,
     population: [{row: Sand Golem, level: 22, count: 2}, {row: Stone Golem, level: 26, count: 1}],
     purpose: "Two more clue walls ('My third is in lich but not in stitch.', 'My fourth is in guard but not in Girard.'); the door of the drop cell at its end."}
  - {id: room:library, name: "Scribes' library", kind: room, size: M, floor: -1, at: [2, 1], chest: 4, monsters: 5,
     population: [{row: Sand Golem, level: 22, count: 2}, {row: Stone Golem, level: 26, count: 2}, {row: Tomb Mummy, level: 42, count: 1}],
     purpose: "Shelves of clay tablets: the Book of Teleport and the Book of Alchemy on a lectern (spellbooks, questions 3), a scribe's chest; the fifth clue on the end wall ('My fifth is in XEEN but not in Queen.')."}
  - {id: room:drop_cell, name: Drop cell, kind: cave, size: S, floor: -1, at: [5, 0], monsters: 0,
     purpose: "Where the wrong name lands the party (fall damage only): a sand heap under a shaft that has closed; the first clue on the wall ('My first is in giant but not in defiant.'); a door that opens from inside."}
