     boss_label: "Lord 55", monsters: 1,
     population: [{row: Minotaur Lord, level: 55, count: 1}],
     purpose: "Behind the lever-worked door (hover 'Minotaur's Private Reserve', aaze0081:3): the hoard chest, casks in pairs by the walls, and the second Soul Waters in a wall niche (aaze0081:4-6: experience once per member, the larger draught; open question 5). Its keeper, a Minotaur Lord."}
  - {id: room:gate_hall4, name: Fourth gate, kind: hall, size: M, floor: -3, at: [3, 0], monsters: 0,
     purpose: "The double gate to the stair asks m24.gate4."}
  - {id: room:stair4, name: Stair, kind: stair, size: S, floor: -3, at: [2, 0], monsters: 0, purpose: "Behind the fourth gate, down to L5."}
