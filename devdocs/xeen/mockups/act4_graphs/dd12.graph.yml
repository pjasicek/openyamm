states:
  - {id: state:key, kind: item, where: "D4, the ruined tower's door",
     what: "Megan's lost_souls_key (12344, M20) opens D4's double door (A6's door:dd12, condition item; D-12.1: the Isle's only gate).", opens: [], draw: false}
  - {id: state:gate1, kind: password, where: room:entry,
     what: "m24.gate1 'Will you find what you came for?': Yes calls m24.gate_open and the gate's two leaves swing apart (two-state, stays open); No calls m24.gate_shut, the gate stays shut and asks again on the next click. The carving is the answer-giver (m24.arrival).",
     opens: [link:entry_gallery]}
  - {id: state:hourglasses, kind: map_var, where: "room:store_a, store_b, store_c, store_d",
