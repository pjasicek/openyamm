     population: [{row: Gorgon, level: 45, count: 2}],
     purpose: "The stair's foot and the Soul Maze's mouth: four statues of one tall figure, one verse each (aaze0082:18-22: 'This dungeon stand as tribute to me / my name in walls for all to see', 'The Soul Maze inside is dark, dreary, and vast / The name found within is the clue to my past', ...). Braziers stand on the floor between them, clear of the maze's mouth."}
  - {id: room:maze_w, name: "Soul Maze, west", kind: corridor, size: L, floor: -4, at: [3, 0], set_piece: true, monsters: 3,
     population: [{row: Minotaur, level: 38, count: 2}, {row: Gorgon, level: 45, count: 1}],
     purpose: "The labyrinth's west half: corridors 256 wide, ceilings 384, dark (a torch at each turn, few), its walls tracing the letters S, H, E on the automap (open question 3)."}
  - {id: room:maze_heart, name: Heart of the maze, kind: room, size: M, floor: -4, at: [3, 1], set_piece: true, goal: true, boss: true,
     boss_label: "Minotaur Lord 55", monsters: 1,
     population: [{row: Minotaur Lord, level: 55, count: 1}],
     purpose: "In the middle letter, the L, where the corridors of both halves end: the horned throne (geometry: a black stone seat with two horn spurs on a dais; hover 'Horned throne'), q-d25.throne and q-d25.throne_again. Two braziers on the floor either side of the dais. A Minotaur Lord keeps it."}
  - {id: room:maze_e, name: "Soul Maze, east", kind: corridor, size: L, floor: -4, at: [4, 0], set_piece: true, monsters: 3,
     population: [{row: Minotaur, level: 38, count: 2}, {row: Gorgon, level: 45, count: 1}],
     purpose: "The east half: the letters T, E, M; its far end opens on the fifth gate's hall."}
  - {id: room:maze_dead, name: Maze dead end, kind: room, size: S, floor: -4, at: [4, 1], chest: 4, monsters: 0,
     purpose: "Behind an illusory wall in the east half ('An illusion!', aaze0082:23): a lost adventurer's camp, bones and a chest."}
  - {id: room:gate_hall5, name: Fifth gate, kind: hall, size: M, floor: -4, at: [5, 0], monsters: 1,
     population: [{row: Minotaur Lord, level: 55, count: 1}],
     purpose: "A Minotaur Lord before the double gate; the gate asks m24.gate5."}
  - {id: room:aviary, name: The aviary, kind: hall, size: M, floor: -4, at: [6, 0], set_piece: true, goal: true, monsters: 0,
     purpose: "Eight wall alcoves with cages (xwcage), a hanging lamp in each alcove's head: six stat birds ('Lark of Luck. Set it free?' ... aaze0082:2-13: +2 to that stat for every member, once each; open question 4), the Parrot of Prophecy (its verse, aaze0082:16-17) and, last, the Songbird of Serenity (m24.songbird). Empty alcoves 'Nothing here.' The lift's lower stop in the north wall."}
