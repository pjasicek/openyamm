# MU-6 dungeon graph, a review file for phase 4 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
# `mix` is the placed monster list by row (level, count); kill XP per member = sum of L(L+10) x count / 4 (MAPS §0).
# The source's five-level dungeon under the Isle of Lost Souls (dark maze0078, 0079, 0080, 0081, 0082 in floor order;
# texts aaze0078-0082) as one BLV of five floors going down from the ruined tower's base. Each floor has a gate that
# asks a cheerful question (A3's m24.gate1-5: yes opens it); each floor keeps the source's own puzzle (hourglasses,
# levers, dials and the Soul Waters, the lever riddle and the Minotaur's Private Reserve, the Soul Maze and the birds).
# BLV frame: x east, y north, z up; z 0 is L1's floor (the tower's base); the entrance hall is round, radius 512,
# centred on (0, 0); its double door is in the south wall at y -512.
format: mu6-0
map: DD-12
key: dd12
name: Dungeon of Lost Souls
stands_on: D4 Lakeside and Blackfang (the Isle of Lost Souls)
class: M
band: "M: 20-45 sectors, 30-90 M units², 45-75 monsters, 3-7 chests, 6-16 doors"
party: [37, 39]
monsters:
  levels: [38, 55]
  count: 45
  groups: [2, 3]
  families:
    - "Minotaurs and gorgons (11090): Minotaur 38 (30), Gorgon 45 (12), Minotaur Lord 55 (3): the source's only family (XEEN_SYSTEMS: D37 Minotaur, D38 Gorgon in Lost Souls 1-5) and MM7's Maze (d02, the family's textures); in our story the coven's rejects (q-d22's prisoner: 'the rejects end up on the Isle of Lost Souls'; Widow Marsh's 'a girl with my eyes')"
    - "Strongest at the bottom, as the source (gorgons mostly on L3-L5): L1 8, L2 9, L3 9, L4 9, L5 10; the entrance hall (the arrival, D-11.3) and the third and fourth gate halls quiet"
    - "MAPS's band 35-55: the family's A tier is 38; no row under it is needed (open question 1)"
  mix:
    - {row: Minotaur, id: 11090, level: 38, count: 30}
    - {row: Gorgon, id: 11091, level: 45, count: 12}
    - {row: Minotaur Lord, id: 11092, level: 55, count: 3}
  kill_xp: "23.79k per member (95,145 / 4): 30 x 1,824 + 12 x 2,475 + 3 x 3,575"
  kill_xp_target: "23.5k (MAPS §0, DD-12's own row): +1.2 %"
treasure: {level: 4, hoard: 5}
role: "Story M24 (the carving, five yes-gates, the Songbird of Serenity on L5; M20's lost_souls_key opens D4's door, D-12.1); Q-D25 The Minotaur's Labyrinth (the horned throne at the Soul Maze's heart: Minotaur -> Minotaur Lord)"
role_short: "Story M24, Minotaur Lord"
set_piece: "Five floors down from a ruined tower, each closed by a gate that asks a cheerful question; at the bottom the Soul Maze, whose walls spell its maker's name, with the horned throne at its heart, and beyond the fifth gate the aviary of magic birds, the Songbird of Serenity in the last cage"
textures:
  family: "The Maze: MM7 d02 (dungeon_families temples, A6's assignment for DD-12: eswamp, cwb1 walls, cwb, cfb1 floors, ceb1sa, t5s1c ceilings, c1d1 doors, trim12_32) on all five floors; the entrance hall in D4's towers kit to match the ruined tower outside (mm7 hkm2b, hkm2bw, hkm2d black rubble); the Soul Waters in mm7/7wtrtyl; the bird cages and cell bars in XD-04's xwcage (reuse)"
  cap: 45
  planned: 22
  new: 3
  new_names:
    - "xlsplaque: the carved plaque over the first gate, NEVER UNDERESTIMATE THE POWER OF POSITIVE THINKING (aaze0078:12), a sign placed once, in cwb1's grey stone"
    - "xlsgate: one wing of a 'think positive' gate (dark iron bars over a bronze half-sun with a smiling half-face), mirrored on the other leaf so the two leaves make one smiling sun; the five gates' leaves"
    - "xlsglass: an hourglass in a wall niche, once per face (L1's four hourglasses; flipped by event, the picture unchanged)"
floors:
  - {floor: 0, name: "L1: tower base, storage", height: 0}
  - {floor: -1, name: "L2: the cells", height: -640}
  - {floor: -2, name: "L3: Soul Waters", height: -1280}
  - {floor: -3, name: "L4: the Reserve", height: -1920}
  - {floor: -4, name: "L5: maze, aviary", height: -2560}
spaces:
  # floor 0, L1 (z 0)
  - {id: room:entry, name: Entrance hall, kind: hall, size: M, floor: 0, at: [0, 0], set_piece: true, monsters: 0,
     purpose: "The ruined tower's base, round (radius 512), D4's hkm2 black rubble; the roof broken open to the Darkside sky (open_sky, DD-03's stable-yard route) over the middle, a wall torch either side of the door. The arrival (entrance:d4_isle) just inside the double door on the south. On the north wall the first gate under the carved plaque (xlsplaque): m24.arrival on the first entry and on the plaque's click; the gate asks m24.gate1."}
  - {id: room:gallery1, name: Hall of storage, kind: hall, size: L, floor: 0, at: [1, 0], monsters: 3,
     population: [{row: Minotaur, level: 38, count: 3}],
     purpose: "A long hall cut into the knoll's rock (d02's grey brick), four doors marked 'Minotaur Storage' (aaze0078:0-5, the doors' hover). Wall torches between the doors."}
  - {id: room:vault1, name: Hourglass vault, kind: room, size: S, floor: 0, at: [1, 1], chest: 4, monsters: 0,
     purpose: "Behind a panel in the hall's west end that grinds open when all four hourglasses are flipped: the minotaurs' strongbox (a chest)."}
  - {id: room:store_a, name: "Minotaur Storage (north-west)", kind: room, size: M, floor: 0, at: [2, 0], monsters: 3, store: true,
     population: [{row: Minotaur, level: 38, count: 3}],
     purpose: "A storeroom (store: true): crates and sacks in clumps along the walls, clear of the line between its two doors. An hourglass in a wall niche (xlsglass): 'Flip the Hour Glass over?' (aaze0078:6)."}
  - {id: room:store_b, name: "Minotaur Storage (north-east)", kind: room, size: M, floor: 0, at: [3, 0], monsters: 0, store: true,
     purpose: "Barrels in pairs and racks of salted meat; an hourglass niche. The door on to the stair head."}
  - {id: room:store_c, name: "Minotaur Storage (south-west)", kind: room, size: M, floor: 0, at: [2, 1], monsters: 2, store: true,
     population: [{row: Minotaur, level: 38, count: 2}],
     purpose: "Bales of straw and fodder in the corners; an hourglass niche."}
  - {id: room:store_d, name: "Minotaur Storage (south-east)", kind: room, size: M, floor: 0, at: [3, 1], monsters: 0, store: true,
     purpose: "Bones in a heap (a find: 'Bones' then 'Nothing here.'), a broken cart by the wall; an hourglass niche."}
  - {id: room:stair1, name: Stair head, kind: stair, size: S, floor: 0, at: [4, 0], monsters: 0,
     purpose: "The stair down to L2; no gate here (the first gate is the entrance's). A door on to the lift head."}
  - {id: room:lift_head, name: Lift head, kind: stair, size: S, floor: 0, at: [6, 0], monsters: 0,
     purpose: "The upper stop of the aviary's lift: an iron cage at the top of a closed shaft (no openings on L2-L4). Before the Songbird is freed: 'The cage does not move. Far below, something sings.'"}
  # floor -1, L2 (z -640)
  - {id: room:statue_hall2, name: Hall of the statue, kind: hall, size: M, floor: -1, at: [4, 0], set_piece: true, monsters: 3,
     population: [{row: Minotaur, level: 38, count: 3}],
     purpose: "The stair's foot. A statue that speaks as you approach (aaze0079:1: 'All of the lost souls in this dungeon have become lost because they did not think positively ...'). The fourth lever by its plinth: 'The lever is stuck.' (aaze0079:9)."}
  - {id: room:north_walk2, name: North walk, kind: corridor, size: M, floor: -1, at: [3, 0], monsters: 2,
     population: [{row: Minotaur, level: 38, count: 2}],
     purpose: "A wall lever ('Pull lever?', aaze0079:2): raises the bars of the first cell."}
  - {id: room:south_walk2, name: South walk, kind: corridor, size: M, floor: -1, at: [3, 1], monsters: 0,
     purpose: "A second wall lever: the second cell's bars. The cells open off it."}
  - {id: room:cells2, name: "Cells of the lost", kind: room, size: M, floor: -1, at: [4, 1], chest: 4, monsters: 2,
     population: [{row: Gorgon, level: 45, count: 2}],
     purpose: "A row of three barred cells (xwcage bars on door movers, each raised by its lever, two-state). In the first two the bones of adventurers who answered No (a find each: 'Bones'); in the third, behind the gate hall's lever, a chest. Two gorgons pace the row."}
  - {id: room:gate_hall2, name: Second gate, kind: hall, size: M, floor: -1, at: [2, 0], monsters: 2,
     population: [{row: Minotaur, level: 38, count: 2}],
     purpose: "The third working lever on the wall beside the gate (the third cell). The double gate to the stair asks m24.gate2."}
  - {id: room:stair2, name: Stair, kind: stair, size: S, floor: -1, at: [1, 0], monsters: 0, purpose: "Behind the second gate, down to L3."}
  # floor -2, L3 (z -1280)
  - {id: room:pool3, name: Stagnant pool, kind: hall, size: M, floor: -2, at: [1, 0], monsters: 3,
     population: [{row: Minotaur, level: 38, count: 3}],
     purpose: "The stair's foot opens on a sunken pool: 'The water is stagnant' (aaze0080:0). Wall torches."}
  - {id: room:dials3, name: Gallery of dials, kind: corridor, size: M, floor: -2, at: [2, 0], set_piece: true, monsters: 3,
     population: [{row: Minotaur, level: 38, count: 3}],
     purpose: "Four dials in wall niches ('The dial is set at N. Turn?', 1 to 4 and round, map variables, aaze0080:6-9) and a statue: 'Turn all dials up, pull lever & drink the souls of adventurers past!' (aaze0080:3-4)."}
  - {id: room:soul3, name: Soul Waters, kind: room, size: M, floor: -2, at: [3, 0], set_piece: true, goal: true, monsters: 0,
     purpose: "A wall fountain ('Soul Waters', aaze0080:1) and its lever ('Lever'; 'The lever is stuck.' until all four dials read 4). Dials up and lever pulled: the waters run; each member drinking gains experience once (the source's '+654,321', rescaled: open question 5), then 'Refreshing.' (aaze0080:19)."}
  - {id: room:flooded3, name: Flooded walk, kind: corridor, size: M, floor: -2, at: [2, 1], monsters: 3,
     population: [{row: Gorgon, level: 45, count: 3}],
     purpose: "A shin-deep walk round the pool's south side (a floor of 7wtrtyl over a raised walkway at the walls); the gorgons wait in it."}
  - {id: room:negative3, name: Negative Soul Waters, kind: room, size: M, floor: -2, at: [3, 1], chest: 4, monsters: 0,
     purpose: "A second fountain, black water ('Negative Soul Waters', aaze0080:10): drinking takes about a tenth of the member's HP and SP, never kills ('You feel emptier.'). A chest by the wall. A door to the gate hall."}
  - {id: room:gate_hall3, name: Third gate, kind: hall, size: M, floor: -2, at: [4, 0], monsters: 0,
     purpose: "The double gate to the stair asks m24.gate3."}
  - {id: room:stair3, name: Stair, kind: stair, size: S, floor: -2, at: [5, 0], monsters: 0, purpose: "Behind the third gate, down to L4."}
