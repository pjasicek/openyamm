     opens: [], draw: false}
  - {id: state:gate3, kind: password, where: room:gate_hall3, what: "m24.gate3 'Will tomorrow be better than today?'", opens: [link:gate3]}
  - {id: state:riddle, kind: lever, where: room:levers4,
