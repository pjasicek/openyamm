     purpose: "The stair's foot. A statue on a plinth with a plaque (aaze0081:1-2): 'Start from the North and go to the South; third from the top and far to the East pull the lever you suspected least.'"}
  - {id: room:barracks4, name: Minotaurs' barracks, kind: room, size: M, floor: -3, at: [5, 1], monsters: 1,
