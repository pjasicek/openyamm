exits:
  - {id: exit:d4_isle, space: room:entry, at: [0, 1], kind: both, label: "D4: the ruined tower's door",
     arrival: "entrance:d4_isle at (0, -352, 0) in this map's frame: the entrance hall a step inside the double door (the door in the south wall at y -512), facing north (MoveToMap 512), the carved first gate ahead",
     neighbour: "D4 entrance:dd12_door (cell 72, 67) facing south, A6's door:dd12 (two leaves hkm2d1/hkm2d2, condition lost_souls_key; 'Enter the Isle of Lost Souls Dungeon?', aaze0022:0, as its meaning). The inside face of the same double door is the exit preset (D-24): out to the Isle a step south of the tower's door, facing south (1536) down the path to the jetty (72, 73) and the ferry back (poi:isle_boat, house 4667)"}
hooks:
  - {hook: m24.arrival, space: room:entry, how: "the first entry's message (a map variable) and the carved plaque's click over the first gate"}
  - {hook: m24.gate1, space: room:entry, how: "the first gate's click: A3's yes/no question"}
  - {hook: m24.gate2, space: room:gate_hall2, how: "the second gate (same)"}
  - {hook: m24.gate3, space: room:gate_hall3, how: "the third gate (same)"}
  - {hook: m24.gate4, space: room:gate_hall4, how: "the fourth gate (same)"}
  - {hook: m24.gate5, space: room:gate_hall5, how: "the fifth gate (same)"}
  - {hook: m24.gate_open, space: "every gate hall", how: "Yes: the map opens that gate's two leaves (its door state, kept)"}
  - {hook: m24.gate_shut, space: "every gate hall", how: "No: the gate stays shut and asks again on the next click; no monster wave (open question 6)"}
  - {hook: m24.songbird, space: room:aviary, how: "the last cage's click (once; sets bird_freed, gives the Songbird 12526; else 'An empty cage, door open.')"}
  - {hook: q-d25.throne, space: room:maze_heart, how: "the horned throne's click (once: 3,000 XP, the party's Minotaurs promoted)"}
  - {hook: q-d25.throne_again, space: room:maze_heart, how: "every later click, called when q-d25.throne returns false"}
critical_path: [room:entry, room:gallery1, room:store_a, room:store_b, room:stair1, room:statue_hall2, room:north_walk2,
  room:gate_hall2, room:stair2, room:pool3, room:dials3, room:soul3, room:gate_hall3, room:stair3, room:plaque4,
  room:levers4, room:gate_hall4, room:stair4, room:statues5, room:maze_w, room:maze_e, room:gate_hall5, room:aviary]
return_path: [room:aviary, room:lift_head, room:stair1, room:store_d, room:store_c, room:gallery1, room:entry]
loops:
  - {id: loop:storage, spaces: [room:gallery1, room:store_a, room:store_b, room:stair1, room:store_d, room:store_c],
     notes: "Two ways through Minotaur Storage to the stair head."}
  - {id: loop:cells, spaces: [room:statue_hall2, room:north_walk2, room:gate_hall2, room:south_walk2],
     notes: "North and south walks round the cell block to the second gate."}
  - {id: loop:waters, spaces: [room:pool3, room:dials3, room:soul3, room:gate_hall3, room:negative3, room:flooded3],
     notes: "The dry way by the dials and the Soul Waters, the wet way by the Negative Soul Waters."}
  - {id: loop:barracks, spaces: [room:plaque4, room:levers4, room:barracks4], notes: "Through the barracks or straight into the lever hall."}
  - {id: loop:maze, spaces: [room:maze_w, room:maze_heart, room:maze_e], notes: "The two halves meet directly and again at the heart."}
  - {id: loop:lift, spaces: [room:aviary, room:lift_head, room:stair1], notes: "After the Songbird the lift closes the whole descent into a ring (the way out)."}
lines:
  - {text: "A plaque reads: Welcome to the Dungeon of Lost Souls. Never underestimate the power of positive thinking.", ref: "dark/aaze0078:12", where: "room:entry, the carved plaque over gate 1 (A3's m24.arrival wording)"}
  - {text: "Minotaur Storage / Flip the Hour Glass over?", ref: "dark/aaze0078:0-6", where: "L1's storeroom doors and hourglasses"}
  - {text: "All of the lost souls in this dungeon have become lost because they did not think positively. If you wish to stay found...Think Positive!", ref: "dark/aaze0079:1", where: room:statue_hall2}
  - {text: "Pull lever? / The lever is stuck.", ref: "dark/aaze0079:2, :9", where: "L2's levers, L3's lever before the dials, L4's eleven wrong levers"}
  - {text: "The water is stagnant / Soul Waters / Refreshing. / Negative Soul Waters", ref: "dark/aaze0080:0-1, :10, :19", where: "room:pool3, room:soul3, room:negative3"}
  - {text: "Turn all dials up, pull lever & drink the souls of adventurerers past! / The dial is set at 1. Turn?", ref: "dark/aaze0080:4, :6-9", where: room:dials3}
  - {text: "Start from the North and go to the South; third from the top and far to the East pull the lever you suspected least.", ref: "dark/aaze0081:2", where: room:plaque4}
  - {text: "Minotaur's Private Reserve / Soul Waters / Refreshing", ref: "dark/aaze0081:3-5", where: room:reserve4}
  - {text: "This dungeon stand as tribute to me / my name in walls for all to see / The Soul Maze inside is dark, dreary, and vast / The name found within is the clue to my past / Long have I traveled through deep, dark space / Only to land and take over this place / I am saying this now for all to hear / None from this world shall I ever fear", ref: "dark/aaze0082:18-22", where: room:statues5}
  - {text: "An illusion!", ref: "dark/aaze0082:23", where: "the maze's illusory wall"}
  - {text: "Lark of Luck. Set it free? / In gratitude for setting it free, the bird flutters around the party and sings its magic song. +6 Luck (permanent). -> +2 (D-4); likewise the Eagle of Endurance, Sparrow of Speed, Parakeet of Personality, Magpie of Might, Albatross of Accuracy", ref: "dark/aaze0082:2-13", where: room:aviary}
  - {text: "Parrot of Prophecy. Set it free? / His nights were filled with evil dreams / His days were spent in wicked schemes / You must destroy that wicked fiend / Before he controls all of XEEN", ref: "dark/aaze0082:16-17", where: room:aviary}
  - {text: "How could you be so negative? Begone!", ref: "dark/aaze0078:11, aaze0080:17, aaze0081:14", where: "the ledger only (the source's No at a gate); A3's m24.gate_shut text is used"}
open_questions:
  - q: "Monster families. The source has only minotaurs and gorgons (XEEN_SYSTEMS D37, D38), and MM7's Maze, the textures' family, is a minotaur maze too."
    options: ["(a) the minotaur family only: Minotaur 38 (30), Gorgon 45 (12), Minotaur Lord 55 (3), 23.79k (+1.2 %); the coven's rejects in our story",
              "(b) a second, ghostly family for the 'lost souls': 6 Tomb Terrors 40 (spirits 11262) on L2-L3 in place of 6 Minotaurs (23.98k, +2 %), or a new spirits tier 'Lost Soul' 40 (A2)"]
    recommend: "(a): the gorgons' bronze tier and Stone touch already read apart from the minotaurs, and the band's 35 needs no row under the A tier"
    depends: "the mix and every room's population; A2's Act IV count"
  - q: "The way back from L5. Five floors up again after the Songbird is a long walk with nothing left to do."
    options: ["(a) a two-stop lift (D-9.2, DD-02's lift) from the aviary to L1's lift head beside the stair head, in a closed shaft (no openings on L2-L4), running only after m24.bird_freed; the map reads the qbit, no new hook",
              "(b) walk back (the gates stay open)",
              "(c) the exit preset in the aviary to a second door on the Isle (A6 adds a point; a stair up through the rock, bolted on the Isle side)"]
    recommend: "(a): one shaft, no new outdoor door, and it cannot skip a gate on the way down"
    depends: "the aviary's north wall, L1's lift head; state:bird"
  - q: "The Soul Maze's letters. In the source the maze's walls spell its maker's true name, SHELTEM (the statues: 'my name in walls for all to see'). M31's plaque and M28 already give the name for M33's gate."
    options: ["(a) the maze's corridors trace S-H-E-L-T-E-M across L5, read on the automap; the horned throne in the L's corner, where both halves end; about 14 M units² of corridor, 6-8 sectors",
              "(b) a plain labyrinth; the statues' verses stay as flavour"]
    recommend: "(a): it is the labyrinth's identity in the source and a third, optional answer-giver for M33; the name alone spoils nothing before M28"
    depends: "L5's plan and its sector count (the map stays under 45); A8's L1 checks that the automap shows the letters"
  - q: "The birds. The source frees six stat birds (+6 to one stat each, the whole party), the Parrot of Prophecy and the Songbird."
    options: ["(a) all six stat birds at D-4's size: +2 to that stat for every member present, each bird once (a map variable; 'Nothing here.' after), +12 stat points per member in all",
              "(b) three stat birds (Might, Endurance, Accuracy), the other three cages empty",
              "(c) the stat birds as flavour (no stat)"]
    recommend: "(a): the floor's reward for the deepest walk; A2 records the +12 in the Act IV ledger"
    depends: "the aviary's events; A2 (permanent stats record)"
  - q: "The Soul Waters. The source gives '+654,321' (L3) and '+7,654,321' experience (L4)."
    options: ["(a) experience once per drinking member (player bits by A3, as DD-06's Manual of Master Thievery, D-25 Q11): L3 1,000, L4 2,000, 3k per member in the Act IV ledger",
              "(b) +5 to a resistance each instead (D-4's fountains)",
              "(c) 'Refreshing.' only"]
    recommend: "(a): the source's joke kept as a small, real reward for the dials and the riddle"
    depends: "A3 (two player bits, texts), A2 (Act IV ledger), the two fountains' events"
  - q: "A No at a gate. A3's m24.gate_shut leaves it to A8 whether a gloomy wave of the floor's monsters comes."
    options: ["(a) the gate stays shut and asks again on the next click; no wave (D-25 Q13's gong)",
              "(b) a hidden group of 2 shown on the first No per floor, not counted",
              "(c) the source's 'Begone!': the party put back in the entrance hall"]
    recommend: "(a): the joke is the question, not a fight; the count stays 45"
    depends: "the gates' events; the playtest (No, then Yes, on gate 1)"
