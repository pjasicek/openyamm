lines:
  - {text: "How dare you speak to me? You can learn to show respect to your betters on your own, or I can teach it to you.", ref: "dark/aaze0031:51", where: "room:common (Blastem the Wizard, aaze0031:50)"}
  - {text: "1) I think we're ready for that lesson right now. 2) Sorry, sir. Won't happen again. Do you need your boots licked?", ref: "dark/aaze0031:110", where: "room:common, Blastem's two answers"}
  - {text: "It's always a pleasure to be able to converse with other beings as intelligent as I.", ref: "dark/aaze0031:112", where: "room:common, after the humble answer"}
  - {text: "Begone, children, lest I blast you to ash and scatter you to the winds.", ref: "dark/aaze0031:37 (Wrathmont the Chaotic's line, given to Xenoc)", where: "room:bridge, the bolted door while Xenoc lives"}
  - {text: "Ambush!", ref: "dark/aaze0031:56", where: "room:quarters_w, the chest"}
  - {text: "Orange Potion: +10 Intellect (permanent). / Purple Potion: +10 Speed (permanent). (+2 each, D-4)", ref: "dark/aaze0031:57-60", where: room:alcoves}
  - {text: "Alcove / Bed / Nothing here.", ref: "dark/aaze0031:55, :52, :53", where: "room:alcoves, room:quarters_w, room:quarters_e"}
  - {text: "+2000 spell points.", ref: "dark/aaze0031:61", where: "room:common, the font"}
  - {text: "Sorceress HQ / Mirage Guild / Guild Quarters / Guild Common / Weights and Measures", ref: "dark/aaze0031:82, :95, :89, :100, :98", where: "the halls' and rooms' hover names"}
open_questions:
  - "Morgana's level: A2's row 11183 is 65, over MAPS's '32-55, Xenoc 60'. Proposed: keep 65 (she is the harder of the two, a required kill at quest level 39 for a party of 38-41) and MAPS writes '32-55, Xenoc 60, Morgana 65' (24.9k, +4.5 %). Or lower her to 60 (24.7k, +3.8 %). Depends: A2 (row or MAPS), A3 (nothing)."
  - "Monsters: the source's quarter held only casters (about 47). Proposed: wizards and sorceresses (36-55) with the guilds' conjured Carnage Hands (35) as servants and four Iron Golems (40) in the vault, so not every fight is a caster duel. Or casters only, which needs the Sorceress 30 (under the band) or more Grand Sorceresses 55 (over the XP target); or Gargoyle Sentinels 38 in the court's statue niches instead of the golems. Depends: A2's recount."
  - "The guild court under open sky (D-22.6's `sky`/`open_sky` with the Darkside preset), its facades in the town's hc stone so the gate opens onto what the quarter promised (proposed); or a roofed court hall (no sky, cheaper). Depends: A8's L1, A1 only if open sky indoors is not yet available in BLVs on Darkside."
  - "D3 has the guild gate in the city's outer north wall (the quarter's north edge is the city's), so on D3 nothing stands behind it. Proposed: A5 adds, north of the wall between x 40 and 47 (if the dunes there are clear), a walled guild precinct: two pink hc hall roofs (two storeys, gabled) and the bridge's roof showing over a court wall, so the inside's court and twin halls read from the valley. Or no change (MM interiors may be larger than the outside; the gate then reads as leading into the hill). Depends: A5 (D3 L4 edit), nothing in DD-19."
