# MU-6 dungeon graph, a review file for phase 4 (not a brief), lane A8 session 6. Format as act3_graphs/dd01.graph.yml.
# The wizard quarter behind Sandcaster's guild gate: an open-sky guild court between Xenoc's Mirage Guild (west) and
# Morgana's Sorceress HQ (east), each two storeys, a covered bridge between their upper floors, and the guilds'
# quarters, commons and vault in the undercroft below the court.
