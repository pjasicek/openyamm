# MU-6 dungeon graph, a review file for phase 4 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
# `mix` is the placed monster list by row (level, count); kill XP per member = sum of L(L+10) x count / 4 (MAPS §0).
# The source's four-level round tower (dark maze0057-0060) as one BLV. The party enters at the TOP by the heretics'
# rope (D-9.3) and fights down: each pair of floors is joined by two stairs in different places (the source's
# (7,9)/(10,6) and (8,8)/(11,8) pairs), so every floor is crossed and every pair of floors closes a loop.
format: mu6-0
map: DD-05
key: dd05
name: Western Tower of Mok
stands_on: D1 Castleview Vale
class: M
band: "M: 20-45 sectors, 30-90 M units², 45-75 monsters, 3-7 chests, 6-16 doors"
party: [35, 39]
monsters:
  levels: [25, 45]
  boss: "Cult Leader 45"
  count: 45
  groups: [2, 3]
  families:
    - "Heretics (11220): Mok Heretic 25 (22), Heretic Priest 35 (11), Heretic Lord 45 (3): the mutinous priesthood, strongest at the top as in the source (L1 2, L2 7, L3 9, L4 12 clerics)"
    - "Cult Leader 45: a heretics boss row A2 adds (11223 proposed; the source's D68 at 55 is over the band), the Leader's group of five in the chapel"
    - "Material golems (11580): Stone Golem 26 (5), Iron Golem 40 (3): Mok's own guardians, set by the heretics on the warded front door and the fountains (ours; open question 2)"
    - "Humble and Pious, penitent clerics: peaceful, not counted (a peaceful row each family's D tier, 11224 proposed; open question 4)"
  mix:
    - {row: Mok Heretic, id: 11220, level: 25, count: 22}
    - {row: Heretic Priest, id: 11221, level: 35, count: 11}
    - {row: Heretic Lord, id: 11222, level: 45, count: 3}
    - {row: Cult Leader, id: "11223 (requested from A2)", level: 45, count: 1}
    - {row: Stone Golem, id: 11581, level: 26, count: 5}
    - {row: Iron Golem, id: 11582, level: 40, count: 3}
  peaceful:
    - {row: Penitent Cleric, id: "11224 (requested from A2)", level: 25, count: 2, note: "Humble (L2), Pious (L3); not counted"}
  kill_xp: "14.29k per member (57,155 / 4)"
  kill_xp_target: "13.7k (DD-05's share of the group DD-05+20+23, 30.5k, by its 45 of 100 monsters); a third would be 10.2k"
treasure: {level: 4, hoard: 5}
role: "Q-D6 The Heretics of Mok (the rope, the Cult Leader, the key on the altar, Humble and Pious, the L1 alcoves' 2 Energy Disks for M18, the front door let open for Dreyfus); Dreyfus then promotes Crusader -> Hero and Priest -> Priest of Light in town. Q-D20: the Pegasus statuette on L1"
role_short: "Q-D6, Hero / Priest of Light"
set_piece: "The heretics' altar under the tower's slate cone: pale marble and a gold-blue mosaic, a defaced sun of Mok, the key under a heretical candle; reached from the hoist room where the heretics haul their bread up a rope"
textures:
  family: "Towers of Mok: MM8 Castle of Air d27 (gston1wl walls over gstntilev skirting, gston1fl, gstn1cl, gstn1bot, gcstflor in the stair halls, gcstdoor) as DD-06 and the other Mok towers (dungeon_families towers); DD-05's accent is the heretics' chapel and vestry in MM8 Temple of the Sun d22 (gtempw1-3, gtempflr, gtemprf, gtempe2l/r, gtempdor1; dungeon_families temples: 'DD-05 heretics' altar'); the windows of L3-L4 and the hoist window in the towers kit"
  cap: 45
  planned: 24
  new: 1
  new_names: ["xmoktap: a Mok tapestry (the sun with an open eye) with the heretics' sign daubed over it, once per face, on the tapestry walk; the button behind one (aaze0060:0-2)"]
  distinct_from: "DD-06 (same d27 family, gongs and thieves' stores, no d22) and DD-07 Eastern Tower (A7, its twin in Act IV: its own accent, the mages' rooms; it keeps the Griffin, DD-05 the Pegasus)"
floors:
  - {floor: 3, name: "L4: the heretics' floor", height: 1920}
  - {floor: 2, name: "L3: Pious's floor", height: 1280}
  - {floor: 1, name: "L2: Humble's floor", height: 640}
  - {floor: 0, name: "L1: ground floor", height: 0}
spaces:
  # floor 3, L4 (z 1920; the chapel rises into the cone, ceiling about 2,900)
  - {id: room:hoist, name: Hoist room, kind: room, size: S, floor: 3, at: [1, 0], monsters: 0, store: true,
     purpose: "The arrival (entrance:d1_rope): the open window on the north wall where the heretics' rope ends, sill about 2,000, head 2,240 (the rope's top on D1). A windlass on a beam by the window, sacks of bread and crates of candles in clumps along the walls (a storeroom: store: true), none on the window-to-door line. Quiet (D-11.3). One wall lamp beside the door."}
  - {id: room:bone_gallery, name: Bone gallery, kind: corridor, size: M, floor: 3, at: [2, 0], monsters: 3,
     population: [{row: Mok Heretic, level: 25, count: 2}, {row: Heretic Priest, level: 35, count: 1}],
     purpose: "A curved gallery inside the outer wall, wall sconces between the windows. Three heaps of bones in its bays, what is left of the priests who stayed loyal ('Bones', a find each; then 'Nothing here.')."}
  - {id: room:north_cells, name: "Heretics' cells", kind: room, size: M, floor: 3, at: [1, 1], monsters: 2,
     population: [{row: Heretic Priest, level: 35, count: 2}],
     purpose: "Sleeping cells off a short passage; two beds with something under the blanket ('Bed', a find each; then 'Nothing here.'). A lamp on each cell's wall."}
  - {id: room:chapel, name: "The heretics' altar", kind: hall, size: L, floor: 3, at: [3, 0], set_piece: true, boss: true,
     boss_label: "Cult Leader 45", goal: true, monsters: 5,
     population: [{row: Cult Leader, level: 45, role: boss, count: 1}, {row: Heretic Lord, level: 45, count: 2}, {row: Heretic Priest, level: 35, count: 2}],
     purpose: "Behind double doors (two leaves, d22's gtempdor1 at their width): pale marble and a gold-blue mosaic under the open cone, the sun of Mok on the east wall daubed over. The Cult Leader preaches at the altar (q-d6.cult_leader on his death); on the altar under a heretical candle the key (q-d6.tower_key). A chandelier on chains from the cone's ring beam over the nave, two braziers standing either side of the altar, clear of the aisle."}
  - {id: room:vestry, name: Vestry, kind: room, size: S, floor: 3, at: [3, 1], chest: 5, monsters: 0,
     purpose: "Behind the altar: vestments on pegs, the Cult Leader's chest (the hoard). A door to the chapel; a panel to the tapestry walk that slides only from that side."}
  - {id: room:tapestry_walk, name: Tapestry walk, kind: corridor, size: S, floor: 3, at: [2, 1], monsters: 0,
     purpose: "Three hangings of Mok's sun with the heretics' sign daubed over them (xmoktap, once per face). Behind the middle one a button: 'Click', a panel slides into the vestry; the other two 'Nothing here.' (the source's L4 tapestry, aaze0060:0-2)."}
  - {id: room:altar_stair, name: Altar stair, kind: stair, size: S, floor: 3, at: [4, 0], monsters: 0,
     purpose: "The priests' stair from behind the chapel down to L3's cloister (the source's (7,9))."}
  - {id: room:tower_stair, name: Tower stair, kind: stair, size: S, floor: 3, at: [0, 1], monsters: 0,
     purpose: "The stair in the wall from the cells down to L3's south landing (the source's (10,6))."}
  # floor 2, L3 (z 1280)
  - {id: room:cloister3, name: Cloister, kind: corridor, size: M, floor: 2, at: [4, 0], monsters: 4,
     population: [{row: Heretic Priest, level: 35, count: 2}, {row: Mok Heretic, level: 25, count: 2}],
     purpose: "A ring walk round the stair core, windows on the outer side, wall sconces on the inner."}
  - {id: room:pious, name: "Pious's cell", kind: room, size: S, floor: 2, at: [4, 1], goal: true, monsters: 0,
     purpose: "Behind a door off the cloister, so no fight outside reaches him: Pious the Cleric by his bed begs ('Oh, please don't kill me! ...' 'Slay him anyway?'). No: q-d6.pious, 'Thank you for sparing my life. I shall be going now.', he is gone; yes: the source's kill line and the bed's 'lifeless body' line (aaze0059:5-10)."}
  - {id: room:fountains3, name: "Fountains of cold and venom", kind: room, size: M, floor: 2, at: [3, 0], monsters: 3,
     population: [{row: Heretic Priest, level: 35, count: 2}, {row: Mok Heretic, level: 25, count: 1}],
     purpose: "Two wall fountains in niches, a sconce either side of each: 'The water is cool and refreshing.' +5 Water and +5 Body resistance, once per character (the source's +10 Cold, +10 Poison, D-4)."}
  - {id: room:dorm3, name: Upper dormitory, kind: room, size: M, floor: 2, at: [2, 0], chest: 4, monsters: 3,
     population: [{row: Heretic Priest, level: 35, count: 2}, {row: Mok Heretic, level: 25, count: 1}],
     purpose: "Beds along the walls ('Bed', one find), a locked chest at the foot of the senior priest's bed. Wall lamps."}
  - {id: room:south_landing3, name: South landing, kind: room, size: S, floor: 2, at: [1, 1], monsters: 2,
     population: [{row: Mok Heretic, level: 25, count: 2}],
     purpose: "The foot of the tower stair from L4 and the head of the outer stair to L2; open to the dormitory."}
  - {id: room:west_stair3, name: West stair, kind: stair, size: S, floor: 2, at: [1, 0], monsters: 0,
