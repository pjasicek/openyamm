     purpose: "Inside the front door (single leaf, gcstdoor on the inside, matching D1's 110-wide hkm3dr): the heretics' wards glow on it. A Heretic Lord keeps it with three of Mok's iron guardians. The door: q-d6.front_door (needs the key; sets tower_opened, 'The key turns and the heretics' wards on the door die with a small, sulky pop.'); without the key 'Locked, and warded from both sides. The key is upstairs, with the heretics.' Then the exit preset (D-24)."}
  - {id: room:guardians, name: "Guardians' gallery", kind: hall, size: M, floor: 0, at: [2, 1], chest: 4, monsters: 3,
     population: [{row: Stone Golem, level: 26, count: 3}],
     purpose: "Mok's stone guardians in their niches, three of them awake; the old temple's offering chest at the end (the heretics never found the key; locked and trapped)."}
