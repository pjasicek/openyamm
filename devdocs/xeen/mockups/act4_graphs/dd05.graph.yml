     purpose: "The foot of the outer stair: a hearth on the wall (a set piece), a table along the opposite wall, barrels in pairs and sacks in the corners (with the bread hauled up the rope; a store), a chest in the larder corner. A lamp over the hearth hangs from the ceiling."}
  - {id: room:refectory, name: Refectory, kind: hall, size: M, floor: 1, at: [2, 0], monsters: 4,
     population: [{row: Mok Heretic, level: 25, count: 4}],
     purpose: "One long table and its benches along the hall's axis, beside the walking line between the doors, not on it. Two lamps hang from the ceiling over the table."}
  - {id: room:fountains2, name: "Fountains of fire and lightning", kind: room, size: M, floor: 1, at: [3, 0], monsters: 2,
     population: [{row: Stone Golem, level: 26, count: 2}],
     purpose: "Two wall fountains in niches: +5 Fire and +5 Air resistance, once per character (the source's +10 Fire, +10 Electrical, D-4). Two of Mok's stone guardians stand in the corners and wake."}
  - {id: room:dorm2, name: Lower dormitory, kind: room, size: M, floor: 1, at: [4, 0], monsters: 2,
     population: [{row: Mok Heretic, level: 25, count: 2}],
     purpose: "Beds; under one mattress a purse ('Bed', a find; the source's (7,4) gold)."}
  - {id: room:humble, name: "Humble's cell", kind: room, size: S, floor: 1, at: [4, 1], goal: true, monsters: 0,
