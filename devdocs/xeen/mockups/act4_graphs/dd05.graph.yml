  - {id: room:east_stair2, name: East stair, kind: stair, size: S, floor: 1, at: [5, 0], monsters: 0,
     purpose: "From the dormitory down to L1's stair hall (the source's (10,6))."}
  - {id: room:south_stair2, name: South stair, kind: stair, size: S, floor: 1, at: [3, 1], monsters: 0,
     purpose: "From the fountain room down to L1's dormitory (the source's (7,9))."}
  # floor 0, L1 (z 0; windowless)
  - {id: room:stair_hall1, name: Stair hall, kind: hall, size: M, floor: 0, at: [5, 0], monsters: 2,
     population: [{row: Mok Heretic, level: 25, count: 2}],
     purpose: "The foot of the east stair; gcstflor cobbles, a wall lamp each side."}
  - {id: room:alcoves, name: Hall of alcoves, kind: hall, size: M, floor: 0, at: [4, 0], set_piece: true, goal: true, monsters: 2,
     population: [{row: Mok Heretic, level: 25, count: 2}],
     purpose: "Round the stair core three alcoves in the walls (west, south, east, as the source's (6,8), (7,7), (8,8)): west and east each a disc ('Disc'): the first clicked calls q-d6.l1_alcoves (2 Energy Disks, M18), both then 'The alcove is empty.'; south the Pegasus statuette ('Statuette': q-d20.pegasus). A lamp above each alcove on the wall."}
  - {id: room:dorm1, name: "Novices' dormitory", kind: room, size: M, floor: 0, at: [3, 0], monsters: 2,
     population: [{row: Mok Heretic, level: 25, count: 2}],
     purpose: "The foot of the south stair; beds ('Bed', two finds, the source's (3,8), (7,4)) along the walls, clear of the line from the alcoves to the door hall. Wall lamps."}
  - {id: room:mirror_hall, name: Mirror hall, kind: room, size: M, floor: 0, at: [3, 1], monsters: 0,
     purpose: "On the north wall a dead mirror (the source's (7,12)): flavour only, as DD-02's (D-26): 'The mirror does not respond.'"}
  - {id: room:door_hall, name: Hall of the warded door, kind: hall, size: M, floor: 0, at: [2, 0], monsters: 4,
