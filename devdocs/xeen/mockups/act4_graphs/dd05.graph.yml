open_questions:
  - q: "Count and kill XP. MAPS's row is a group: DD-05, DD-20 (M) and DD-23 (S), 100 monsters, 30.5k. A third would be 33 monsters and 10.2k, under the M band's floor of 45 (the source tower holds 30)."
    options: ["(a) DD-05 at the M floor, 45 monsters, 14.29k (its share by count, 13.7k, +4 %); with DD-20 at 45 and DD-23 at 15-20 the group comes to 105-110 monsters and about 32-34k (+5-10 %), A2 recounts Act IV",
              "(b) 33 monsters and ~10.2k, under the M band (the source's density), the group unchanged",
              "(c) DD-05 as S: not possible, four floors and two stairs per pair need about 29 sectors"]
    recommend: "(a)"
    depends: "the mix and every room's population; DD-20's and DD-23's shares (A8, A7); A2's Act IV recount"
  - q: "A second family. The source has only Mok's clerics (Cleric of Mok, Mok Heretic, the Cult Leader)."
    options: ["(a) Mok's own guardians as Material golems: Stone Golem 26 (5) at the fountains and in their gallery, Iron Golem 40 (3) on the warded door, set there by the heretics",
              "(b) heretics only: 45 heretics (e.g. 27/14/3 + the Leader), 13.9k"]
    recommend: "(a): the door hall and the guardians' gallery read apart from the clerics' floors, and the golems explain the 'warded' door"
    depends: "mix, L1 and L2 populations; golem heights (Iron Golem under the door hall's ceiling; D-32 radius 60 only)"
  - q: "The Cult Leader's row. A2 has no row; the source's Cult Leader is level 55, over the group's band 24-45."
    options: ["(a) a heretics boss row 11223 'Cult Leader' at 45 (look C, hp_x 3, Psychic Shock and Harm), counted here",
              "(b) at 55 as the source, counted in a later act (D-1.2)"]
    recommend: "(a): the quest's kill must be in reach of a party of 35-39 that arrives on his floor"
    depends: "A2 (row), q-d6.cult_leader (his actor group), the chapel's fight"
  - q: "Humble and Pious. A3: 'peaceful talkers until the map's question'; A7's rule (D-25): a peaceful group is its own monster row in its own faction."
    options: ["(a) one peaceful row 11224 'Penitent Cleric' (heretics D, level 25, own faction), the two placed in cells behind doors; clicking either runs the map's question; both answers hide him (no XP), the bed's text by a map variable",
              "(b) no actor: the cleric is only the bed's event (the source's way), no figure"]
    recommend: "(a), cells behind doors so no fireball outside turns them"
    depends: "A2 (row, faction), the cells' doors, the playtest (no / yes for each)"
  - q: "The two discs. A3's q-d6.l1_alcoves gives both Energy Disks once; the source has one disc per alcove."
    options: ["(a) the first disc alcove clicked calls the hook (2 disks), both discs' pictures cleared, both then 'The alcove is empty.'",
              "(b) A3 splits the hook into two (one disk each)"]
    recommend: "(a), no change to A3's file"
    depends: "the alcoves' events"
  - q: "Inside against outside. D1's tower is 1,280 across (radius 640; base 1,280 high without windows, the storeys to 2,688, a cone). M needs 30 M units²: four floors of about 2,900 across, 2.3 times the outside."
    options: ["(a) keep the outside: an interior larger than its shell, as DD-02 (31 M) and DD-06 (44 M)",
              "(b) A6 widens the tower to radius ~900 (inside 1.6 times)",
              "(c) a cellar under L1 for the area (not in the source)"]
    recommend: "(a)"
    depends: "the L2 floor plan's extents; A6 only if (b)"
