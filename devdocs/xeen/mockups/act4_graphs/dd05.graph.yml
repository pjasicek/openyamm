hooks:
  - {hook: q-d6.tower_rope, space: room:hoist, how: "D1's event (A6); this map holds its arrival, entrance:d1_rope"}
  - {hook: q-d6.cult_leader, space: room:chapel, how: "the Cult Leader's group's death (his own actor group; a death event)"}
  - {hook: q-d6.tower_key, space: room:chapel, how: "the altar (clicked; once; else 'The altar is bare.')"}
  - {hook: q-d6.pious, space: room:pious, how: "the 'no' answer to 'Slay him anyway?' (once)"}
  - {hook: q-d6.humble, space: room:humble, how: "the 'no' answer to 'Slay him anyway?' (once)"}
  - {hook: q-d6.l1_alcoves, space: room:alcoves, how: "the first of the two disc alcoves clicked (once: 2 Energy Disks); both then 'The alcove is empty.'"}
  - {hook: q-d20.pegasus, space: room:alcoves, how: "the statuette alcove, south (once: the Golden Pegasus 12349)"}
  - {hook: q-d6.front_door, space: room:door_hall, how: "the front door's inner face (needs west_tower_key; once; sets tower_opened and the `door` autonote)"}
  - {hook: q-d6.front_door_outside, space: "D1 (A6)", how: "the same door from outside; listed for the pair, not placed here"}
