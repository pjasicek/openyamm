states:
  - {id: state:rope, kind: qbit, where: "D1, the rope on the north wall",
     what: "q-d6.tower_rope (rope_climbed): D1's question 'A rope hangs from a window near the tower's top. Climb?', yes moves the party to entrance:d1_rope in the hoist room.", opens: [], draw: false}
  - {id: state:tapestry, kind: puzzle, where: room:tapestry_walk,
     what: "The button behind the middle tapestry: 'Click', the panel into the vestry slides (two-state, stays open).", opens: [link:tap_vestry]}
