     what: "The key on the altar (q-d6.tower_key, west_tower_key 12338): opens the front door from inside (q-d6.front_door) or from outside on D1 (q-d6.front_door_outside); sets tower_opened.", opens: [], draw: false}
  - {id: state:clerics, kind: password, where: "room:pious, room:humble",
     what: "Each cleric's question 'Slay him anyway?': no sets pious_spared / humble_spared and hides him; yes the kill line; either way the bed's line changes (a map variable).", opens: [], draw: false}
