  - {id: loop:halves, spaces: [room:coven_hall, room:gaol, room:cells, room:slop_pit, room:cross, room:cistern, room:store, room:dormitory],
     notes: "Coven and sewer by the cells' drain door and by the store's hatch, once its bolt is drawn from above."}
  - {id: loop:witches, spaces: [room:witches_walk, room:antechamber, room:head_witch, room:brewery],
     notes: "To the Head Witch through her wardens or through the brewery and her private door."}
  - {id: loop:outfall, spaces: [room:cross, room:warren, room:outfall, room:jetty_shaft, room:east_drain],
     notes: "The cross to the lake by the warren or by the east drain past the jetty shaft."}
lines:
  - {text: "Cage / Nothing here.", ref: "dark/aaze0033:22-23", where: "room:cells (the four cages)"}
  - {text: "Thanks for getting me out of there. ... The witches capture people and turn them into monsters. Then they ship the good ones to Castle Blackfang to act as guards. The rejects end up on the Isle of Lost Souls.", ref: "dark/aaze0033:24 (A3's paraphrase, experience dropped)", where: "room:cells, cage 1 Camilla (q-d22.camilla)"}
  - {text: "Oh, thank you for rescuing me! The witches were going to use me for spare parts in their potions.", ref: "dark/aaze0033:27", where: "room:cells, cage 2 Aretha (q-d22.aretha)"}
  - {text: "(yawn) Thank you for saving me from my hideous fate. I am forever in your debt. I'll be going now. See you.", ref: "dark/aaze0033:28 (the source's last prisoner line)", where: "room:cells, cage 3 Isabella (q-d22.isabella)"}
  - {text: "Thank you for saving me. I'm tired of adventuring and I'm going home, but ... the dragon statuette is in the sewer below us. The witches caught me just as I was reaching for it.", ref: "dark/aaze0033:25", where: "room:cells, cage 4 Rhett (q-d22.rhett)"}
  - {text: "My saviors! ... The witches were going to turn me into a monster when I failed the initiation test. ... It is in a chest in her room in the Northwestern corner of the town.", ref: "dark/aaze0033:26", where: "Naomi, the fifth prisoner, on D4 (A3's topics: 'the north-west corner of the coven', placed here as room:head_witch)"}
  - {text: "Cauldron / +25 Personality / +25 Endurance / +25 Speed (permanent) -> +2 each, once per character (D-4)", ref: "dark/aaze0033:29-32", where: room:brewery}
  - {text: "A bodiless voice murmurs: \"You are the most beautiful one of all.\"", ref: "dark/aaze0033:9", where: "room:head_witch (her mirror)"}
  - {text: "Bed / Nothing here. / Shelf", ref: "dark/aaze0033:15-16, :11", where: "room:dormitory, room:head_witch (beds), room:store (shelf)"}
  - {text: "Sewer Drain", ref: "dark/aaze0034:2", where: "the bolted street grates: room:main_drain, room:hideout"}
  - {text: "Bones / You find the last surviving page of this dead man's journal. It reads: ...still haven't a clue where that statuette is. The sewer is infested with sewer monsters, and they seem to come out of nowhere. Got to watch my back.", ref: "dark/aaze0034:6-7", where: "room:niche (the bones two steps short of the Dragon)"}
  - {text: "You find the last surviving page of this dead man's journal. It reads: ...witches won't find me under here. Maybe I can use one of the other exits from the sewer to pop up in the town and be gone before anyone can find me. ...", ref: "dark/aaze0034:8", where: room:hideout}
  - {text: "Alcove / Nothing here.", ref: "dark/aaze0034:0-1", where: "room:niche (hover 'Alcove'; A3's else_text 'The niche is empty.' after the hook)"}
  - {text: "Knowing how to pray properly can sure come in handy when the going gets tough. I can teach you for 10,000 gold.", ref: "dark/aaze0034:3-5", where: "room:pump_room only if open question 5 keeps Joseph; else the ORIGINAL_LINES ledger"}
  - {text: "My first is in water ... What am I? / Wrong! Begone fools! / Correct! As a reward, I give you free membership to the guild.", ref: "dark/aaze0033:4-8", where: "D4's Guild door (A3, A6); listed as the context of the two arrivals"}
open_questions:
  - q: "Count and kill XP. MAPS's row is a group: DD-05, DD-20 (M) and DD-23 (S), 100 monsters, 30.5k. DD-05's graph took 45 and 14.29k; a third for DD-20 would be 33 monsters and ~10k, under the M floor of 45."
    options: ["(a) DD-20 at the M floor, 45 monsters, 13.42k (its share by count 13.7k, -2 %); with DD-23 at its S floor (15, ~5.3k, A7's) the group is 105 monsters and ~33.0k (+8 %, inside the ±10 %); A2 recounts Act IV",
              "(b) DD-20 at ~33 monsters (~10k) so the group stays at 30.5k: under the M band (the coven's 18 witches alone are the source's town)"]
    recommend: "(a)"
    depends: "the mix and every room's population; DD-23's count (A7); A2's Act IV recount"
  - q: "The Head Witch's row. A2 has none for the coven; the witches' Head Witch 11163 is Cloudside's level-20 boss; the source's Coven Leader is level 60, over the band."
    options: ["(a) a coven boss row 11173 'Head Witch' at 45 (look C, the Coven Mother's; hp_x 3; DrainSP as the source's leader; Mind Blast), her own group, counted here (rows may share a name, as the two Gremlin rows do)",
              "(b) 'Coven Leader' at 60 as the source, counted in a later act (D-1.2)"]
    recommend: "(a): the quest kill must be in reach of a party of 35-39, and A3's texts call her the Head Witch"
    depends: "A2 (row), q-d22.head_witch (her actor group), her room's fight"
  - q: "The four prisoners as figures. A3's hooks need no NPC ids (the cage's click is the event)."
    options: ["(a) four named peaceful rows in 11900-11999 as DD-09's prisoners (Camilla, Aretha, Isabella, Rhett; peasant stand-ins, immobile, friendly), one in each cage, hidden by its freed bit on load and right after its hook; clicking the cage (not the actor) runs the hook",
              "(b) no actors: empty cages with the source's events only"]
    recommend: "(a): the set piece is people in cages, and DD-09 set the pattern (D-27)"
    depends: "A2 (four rows), the cages' size (an actor behind a barred door leaf), the playtest (each cage once, hidden after reload)"
  - q: "The Guild's one door and two destinations. D4's plan has one door (doors: 1) that is both house 4651 and door:dd20_guild; after the right answer the party must be able to reach both the guild's shop and the back stair."
    options: ["(a) one door: once riddle_answered the double door asks a real choice ('The guild' / 'Down the back stair'; D-24 allows question + leave for a real choice), no new D4 geometry",
              "(b) a second, single-leaf cellar door on the Guild's back (west) wall, door:dd20_back, open once riddle_answered ('A cellar door. The front door asks first.' before), its return point outside it; the double door stays the house with the riddle and the trapdoor"]
    recommend: "(b): one door per destination, as MM6-MM8 towns do, and the stair comes up under the Guild's back room; no POI change (within 400 of the Guild)"
    depends: "A6 (D4's door and return point), A3 (guild_right's text names the back stair); the arrival inside is the same either way"
  - q: "Joseph the Prayermaster (the source's sewer teacher, aaze0034:3-5: Prayer Master is MM6-MM8's Meditation; teachers_plan has no Meditation in Lakeside)."
    options: ["(a) left out; his line goes to the ORIGINAL_LINES ledger; the pump room keeps its chest",
              "(b) A4 adds him as a Meditation teacher in the dry pump room (a fourth Meditation place, Act IV)",
              "(c) a flavour talking actor with his line, teaching nothing (as DD-01's Felix)"]
    recommend: "(a): teachers stay A4's plan; the sewer has its two dead men for flavour"
    depends: "the pump room's purpose; A4 (only for b or c)"
  - q: "The three brewing cauldrons (the source's +25 Personality, Endurance, Speed, permanent)."
    options: ["(a) +2 each once per character (D-4), three player bits (A3) and A2's record, apart from the initiation cauldron and D4's reed cauldron",
              "(b) leave them as dressing (the coven already has the promotion and D4 has its cauldron)"]
    recommend: "(a): one permanent-effect device fits an M dungeon, and the source has them"
    depends: "A3 (three bits, texts), A2 (the Act IV stat record)"
  - q: "The cross's ambush. The journal says the stalkers 'come out of nowhere'; the source spawns them at four points."
    options: ["(a) five of the cross's eight placed hidden and shown on the first step (D-18's method), counted at load",
              "(b) all eight visible"]
    recommend: "(a)"
    depends: "the cross's population; a playtest step (hidden before, shown after, kept after reload)"
