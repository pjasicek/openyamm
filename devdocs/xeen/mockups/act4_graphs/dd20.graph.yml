states:
  - {id: state:riddle, kind: qbit, where: "D4, the Guild's door",
     what: "q-d22.riddle_answered (113442): the right answer opens the way to the back stair (entrance:d4_guild); a wrong one moves the party to entrance:d4_trapdoor (q-d22.guild_wrong). Both D4's (A6, A3).", opens: [], draw: false}
  - {id: state:joined, kind: qbit, where: room:coven_hall,
     what: "The initiation cauldron, 'Drink?' (q-d22.initiation; needs riddle_answered and the Head Witch alive): sets joined (113449), the Warlock promotion for Great Druids; the coven turns friendly (A2's relation) until head_witch_slain, which turns it hostile again.", opens: [], draw: false}
  - {id: state:head_witch, kind: kill, where: room:head_witch,
     what: "The Head Witch's group's death: q-d22.head_witch (head_witch_slain 113447); on D4 Naomi's stocks open and the two coven camps hide on load (D-36 (3)).", opens: [], draw: false}
  - {id: state:pass, kind: item, where: room:head_witch,
     what: "Her chest: q-d22.witch_chest (needs joined or head_witch_slain; else 'The Head Witch's chest. The Head Witch is standing next to it.'): the Necropolis pass 12336, pass_found.", opens: [], draw: false}
  - {id: state:cages, kind: qbit, where: room:cells,
     what: "Each cage's click runs its hook once (camilla_freed .. rhett_freed, 500 XP each): the barred front opens (two-state, stays open), the prisoner's line, the prisoner hidden then and on every later load.", opens: [], draw: false}
  - {id: state:hatch, kind: lever, where: room:store,
     what: "The store's hatch bolt: 'Draw the bolt?' from above (two-state, stays drawn; a map variable); from below 'The hatch is bolted from above.' Opens the second way between the halves.", opens: [link:store_cistern]}
