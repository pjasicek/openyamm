# MU-6 dungeon graph, a review file for phase 4 (not a brief). Vocabulary follows Map Studio's plan.yml where it
# fits (spaces, links, kind, size, floor, population, entrances); `at` is the review picture's grid cell only.
# `mix` is the placed monster list by row (level, count); kill XP per member = sum of L(L+10) x count / 4 (MAPS §0).
# The source's Lakeside town (dark maze0033: the coven, its five prisoners, the cauldrons) and Lakeside Sewer
# (maze0034: the sewer stalkers, the statuette, the two dead men's journals) as one BLV under D4's Lakeside: the
# coven under the Guild (4651), its cells half a storey lower, and the sewer below both, running east under the square
# to the shaft by the jetty. Three ways in: the Guild's back stair (right answer), the trapdoor (wrong answer, D4's
# q-d22.guild_wrong), the jetty shaft (D-36 (4)). Either half leads to the other, so the riddle bars nothing.
#
# Map frame (for the arrivals): x east, y north as D4; origin under the centre of the Guild's footprint (D4 cell
# (63.5, 87)); z 0 is the coven's floor, about 640 under D4's square; the cells at -256, the sewer at -512. Facing in
# MM units (0 east, 512 north, 1024 west, 1536 south). D4's jetty shaft (69, 83) lies at (+2,816, +2,048) here.
format: mu6-0
map: DD-20
key: dd20
name: Lakeside Coven and Sewer
stands_on: D4 Lakeside and Blackfang
class: M
band: "M: 20-45 sectors, 30-90 M units², 45-75 monsters, 3-7 chests, 6-16 doors"
party: [35, 39]
monsters:
  levels: [25, 45]
  boss: "Head Witch 45"
  count: 45
  groups: [2, 3]
  families:
    - "Coven (11170): Witch 32 (13), Coven Witch 40 (4): the coven at home, the source's 18 witches of Lakeside (D62 x18); peaceful to members (joined 113449) until the Head Witch dies (A2's relations). The Coven Mother 50 is over the band and stays on D4"
    - "Head Witch 45: a coven boss row A2 adds (11173 proposed; the source's Coven Leader D63 is level 60, over the band), her own group of three in her room"
    - "Sewer stalkers (11400): Sewer Stalker 25 (24), Stalker Matriarch 35 (3): the source's Lakeside Sewer stalkers (D4 x11); five of them a hidden group at the drain cross that climbs out of the side drains (the journal's 'they seem to come out of nowhere', D-18's method)"
    - "The four caged prisoners: peaceful named rows A2 adds in 11900-11999 (Camilla, Aretha, Isabella, Rhett), not counted (open question 3)"
  mix:
    - {row: Witch, id: 11170, level: 32, count: 13}
    - {row: Coven Witch, id: 11171, level: 40, count: 4}
    - {row: Head Witch, id: "11173 (requested from A2)", level: 45, count: 1}
    - {row: Sewer Stalker, id: 11401, level: 25, count: 24}
    - {row: Stalker Matriarch, id: 11402, level: 35, count: 3}
  peaceful:
    - {row: "Camilla the Captured, Aretha the Helpless, Isabella the Victim, Rhett the Wimp", id: "11906-11909 (requested from A2, the next free named rows)", level: 15, count: 4, note: "one in each cage, hidden once freed; not counted"}
  kill_xp: "13.42k per member (53,672 / 4); on the joined route the 18 witches are not fought: 6.43k"
  kill_xp_target: "13.7k (DD-20's share of the group DD-05+20+23, 30.5k, by its 45 of 100 monsters): -2 %. With DD-05 at 14.29k and DD-23 assumed at its S floor (15 monsters, about 5.3k) the group is 105 monsters and about 33.0k (+8 %)"
treasure: {level: 4, hoard: 5}
role: "Q-D22 The Coven: the four cages (Camilla, Aretha, Isabella, Rhett; Naomi, the fifth, is in the stocks on D4's square and goes free when the Head Witch dies), the Head Witch and her chest (the Necropolis pass); or join at the initiation cauldron (Great Druid -> Warlock, Dark). Q-D20: the Golden Dragon in a sewer niche"
role_short: "Q-D22, Warlock; Q-D20's Dragon"
set_piece: "The coven's hall under the Guild with the initiation cauldron at the stair's foot ('Drink?'); the cells' row of four cages half a storey down, the last cage at the drain door into the sewer; under them the tide-wet sewer to the lake's outfall, where the Golden Dragon sits in a niche over the pool with a dead man's bones two steps short of it"
textures:
  family: "Sewer: MM7 The Tidewater Caverns 7d17 (dungeon_families sewers, assigned to DD-20: c2b walls and ceilings, cfb1 wet floors, 7trimd plank walks, 7trimda and trim9_32a trims, td1 doors, 7wtrtyl water). Coven: MM7 Temple of the Moon 7d06 dressed stone (the same assignment's accent: 7tws2 under its frieze, tws2b ram-skull frieze in the Head Witch's room, 7tfb11 dark flags, twb2 block ceilings, twb1 slab doors, tfb2 reveals, the dark brick 'wall' in the store, tws1a sigil, the Moon seal t1d1a-d as the witches' walk double doors). The Guild's back stair in D4's t09 ashlar (the Guild's outside, A6's town kit), 2 textures. The cells in 7d17's wet rock with a shipped bar texture for the cage fronts (A6 picks)"
  cap: 45
  planned: 27
  new: 0
  reuse: "xkmirror (A6's silvered glass, D-37 (2)) on the Head Witch's mirror"
  distinct_from: "XD-04 Witch Tower (Cloudside, Act I: 7d06 over 7d12's laboratory, the seal laid in the floor as the witch-mark circle): DD-20 has no 7d12, its seal is a pair of doors, its lower half is 7d17's wet rock and plank walks; DD-01 and DD-18 sewers (6d03, 6d08), DD-21 (sewer.blv)"
floors:
  - {floor: 2, name: "The coven, under the Guild", height: 0}
  - {floor: 1, name: "The cells", height: -256}
  - {floor: 0, name: "The sewer", height: -512}
spaces:
  # floor 2, the coven (z 0, under the Guild and the square's west side)
  - {id: room:guild_stair, name: "Guild's back stair", kind: stair, size: S, floor: 2, at: [1, 0], monsters: 0,
     purpose: "The arrival from the Guild (entrance:d4_guild at the foot, (-640, 640, 0), facing north 512): a straight stair in D4's t09 ashlar from under the Guild's back room (top landing about (-640, -512, 640)) down northward into the coven hall. The exit preset at the top landing. A wall lamp at the foot. Quiet."}
  - {id: room:coven_hall, name: "Coven hall", kind: hall, size: L, floor: 2, at: [2, 0], set_piece: true, goal: true, monsters: 2,
     population: [{row: Witch, level: 32, count: 2, notes: "at the hall's north end by the double doors, about 1,500 from the stair's foot"}],
     purpose: "Dressed 7d06 stone, block ceilings. The initiation cauldron stands two steps east of the stair's foot on a low hearth, beside the walking line from the stair to the double doors, not on it (a set piece): 'Initiation cauldron', 'Drink?' (q-d22.initiation). A party that answered the riddle can drink before any witch reaches it. An iron lamp hangs from the ceiling over the cauldron; two braziers stand by the north wall either side of the double doors."}
  - {id: room:witches_walk, name: "Witches' walk", kind: corridor, size: M, floor: 2, at: [3, 0], monsters: 3,
     population: [{row: Witch, level: 32, count: 2}, {row: Coven Witch, level: 40, count: 1}],
     purpose: "Behind the hall's double doors (two leaves, the Moon seal t1d1a-d, opening apart): a vaulted walk north-west towards the Head Witch, wall sconces between broom racks (racks against the walls)."}
  - {id: room:antechamber, name: Antechamber, kind: room, size: S, floor: 2, at: [4, 0], monsters: 2,
     population: [{row: Coven Witch, level: 40, count: 2}],
     purpose: "Her door-wardens. A bench along one wall; a sconce either side of her door."}
  - {id: room:head_witch, name: "Head Witch's room", kind: room, size: M, floor: 2, at: [5, 0], boss: true, boss_label: "Head Witch 45", goal: true, chest: 5, monsters: 3,
     population: [{row: Head Witch, level: 45, role: boss, count: 1}, {row: Coven Witch, level: 40, count: 1}, {row: Witch, level: 32, count: 1}],
     purpose: "The coven's north-west corner (about (-2,560, 3,072)), as Naomi and the autonote say, above the cells. The ram-skull frieze tws2b; her bed (a find, 'Bed'); her chest at its foot (the hoard; q-d22.witch_chest: the Necropolis pass, members may open it, else over her body); her mirror on the wall (xkmirror): 'A bodiless voice murmurs: \"You are the most beautiful one of all.\"'. Her death: q-d22.head_witch (her own group). Candles on her dresser, a wall lamp by the mirror. Her private door to the brewery."}
  - {id: room:brewery, name: Brewery, kind: room, size: M, floor: 2, at: [4, 1], monsters: 3,
     population: [{row: Witch, level: 32, count: 3}],
     purpose: "The coven's three brewing cauldrons in a row along the west wall on their hearths, out of the line between the doors: 'Cauldron', each +2 to one stat once per character (Personality, Endurance, Speed: the source's +25s, D-4). Ladles and jars on shelves. A lamp over each hearth on the wall. Doors to the walk and, private, to the Head Witch's room."}
  - {id: room:dormitory, name: "Witches' dormitory", kind: room, size: M, floor: 2, at: [1, 1], chest: 4, monsters: 3,
     population: [{row: Witch, level: 32, count: 3}],
     purpose: "Beds along the walls ('Bed', one find; the others 'Nothing here.'), a locked chest at the senior witch's bed. Wall lamps. A door to the store."}
  - {id: room:store, name: "Coven store", kind: room, size: S, floor: 2, at: [1, 2], store: true, monsters: 0,
     purpose: "A storeroom (store: true) in dark brick: jars, sacks of herbs, crates and a barrel pair along the walls; 'Shelf' (a find, the source's aaze0033:11). In the floor's corner, clear of the door, a hatch to the cistern below, bolted from this side (state:hatch). A wall lamp."}
  - {id: room:gaol, name: "Gaoler's room", kind: room, size: S, floor: 2, at: [2, 1], chest: 4, monsters: 2,
     population: [{row: Witch, level: 32, count: 2}],
     purpose: "Off the hall's east side, at the head of a short stair down to the cells: the gaolers' table along a wall, a chest of the prisoners' confiscated things (locked). A wall lamp."}
  # floor 1, the cells (z -256, half a storey under the coven, under the Head Witch's floor)
  - {id: room:cells, name: "The cells", kind: corridor, size: M, floor: 1, at: [3, 0], set_piece: true, goal: true, monsters: 0,
     purpose: "A wet 7d17 rock corridor running south-east, four cages on its north side, their barred fronts doors that swing open on the hook: 1 Camilla (q-d22.camilla), 2 Aretha (q-d22.aretha), 3 Isabella asleep on her straw (q-d22.isabella, '(yawn)'), 4 Rhett at the sewer end (q-d22.rhett, who points at the Dragon). Each 'Cage', its line, the prisoner hidden; then 'Nothing here.' At the far end the drain door: iron, unbolted, where the witches tip their slops down a stair into the sewer. Lanterns on the wall opposite the cages."}
  # floor 0, the sewer (z -512, running east under the square to the jetty)
  - {id: room:sump, name: "Trapdoor sump", kind: room, size: S, floor: 0, at: [0, 1], monsters: 0,
     purpose: "The arrival of a wrong answer (entrance:d4_trapdoor, (1,280, 0, -512), facing east 0): under the square in front of the Guild's door, a shut trapdoor in the ceiling ('The trapdoor is shut fast above you.'). Ankle-deep water; 'Bones' of earlier wrong answers, one with a purse (a find; then 'Nothing here.'). Dark: only the light round the trapdoor's edges (a ceiling light, faint). Quiet."}
  - {id: room:main_drain, name: Main drain, kind: corridor, size: M, floor: 0, at: [1, 1], monsters: 3,
     population: [{row: Sewer Stalker, level: 25, count: 3}],
     purpose: "East under the square: a channel of slow water between two plank walks (7trimd). A 'Sewer Drain' street grate overhead, bolted from above ('A street grate, bolted from above. Boots go past.'), its daylight a ceiling light. The door to the pump room."}
  - {id: room:pump_room, name: Old pump room, kind: room, size: S, floor: 0, at: [1, 2], chest: 4, monsters: 0,
     purpose: "Dry, behind a door (td1): the town's broken pump, a chest left by whoever last hid here. Joseph the Prayermaster's room if open question 5 keeps him. A wall lantern."}
  - {id: room:cross, name: Drain cross, kind: hall, size: M, floor: 0, at: [2, 1], monsters: 8,
     population: [{row: Sewer Stalker, level: 25, count: 3}, {row: Sewer Stalker, level: 25, count: 4, hidden: true}, {row: Stalker Matriarch, level: 35, count: 1, hidden: true}],
     purpose: "Five drains meet under the square, four side drains in the walls (the source's four spawn points, maze0034 (6,7), (6,9), (8,9), (10,8)). Three stalkers in sight; five more placed hidden in their own group and shown the first time the party steps onto the cross ('Things climb out of the side drains.'; D-18's method: a map variable guard, once, kept after reload). A grate light from the street above."}
  - {id: room:cistern, name: Cistern, kind: hall, size: M, floor: 0, at: [1, 0], monsters: 2,
     population: [{row: Sewer Stalker, level: 25, count: 2}],
     purpose: "The old cistern under the coven: pillars in still water, a stone stair along the wall up to the store's hatch ('The hatch is bolted from above.' until the store's bolt is drawn). Dark."}
  - {id: room:hideout, name: "Dead man's hideout", kind: room, size: S, floor: 0, at: [2, 0], monsters: 0,
     purpose: "A dead end under a second street grate ('Sewer Drain', bolted from above). 'Bones' of a man who hid from the witches: his journal's last page (aaze0034:8, '...witches won't find me under here. Maybe I can use one of the other exits...') and his pack (a find). His grate's daylight is the room's light."}
  - {id: room:slop_pit, name: Slop pit, kind: room, size: S, floor: 0, at: [3, 0], monsters: 2,
     population: [{row: Sewer Stalker, level: 25, count: 2}],
     purpose: "The foot of the drain stair from the cells: where the coven's slops land. Two stalkers feeding. The way up for a party that fell through the trapdoor."}
  - {id: room:warren, name: Stalker warren, kind: cave, size: M, floor: 0, at: [3, 1], chest: 4, monsters: 5,
     population: [{row: Sewer Stalker, level: 25, count: 4}, {row: Stalker Matriarch, level: 35, count: 1}],
     purpose: "A collapsed side vault the stalkers nest in; a chest half-sunk in their midden (things washed down the drains)."}
  - {id: room:outfall, name: "Lake outfall", kind: cave, size: L, floor: 0, at: [4, 1], set_piece: true, monsters: 5,
     population: [{row: Sewer Stalker, level: 25, count: 4}, {row: Stalker Matriarch, level: 35, count: 1}],
     purpose: "Under the jetty's root (about (3,600, 3,000)): the drains fall into a tidal pool (7wtrtyl) whose barred mouth opens to the lake; octopod arms slide past the bars ('The lake, beyond the bars. Something with too many arms is listening.'). Plank walks (7trimd) round the pool; pale lake light through the bars. A narrow ledge leads off the far walk to the niche."}
  - {id: room:niche, name: "The Dragon's niche", kind: room, size: S, floor: 0, at: [5, 1], goal: true, monsters: 0,
     purpose: "A ledge over the pool, out of sight of the walks: a dead adventurer's 'Bones' two steps short of the niche (his journal page, aaze0034:7, '...still haven't a clue where that statuette is...'), then the 'Alcove' with the Golden Dragon (q-d20.dragon; then 'The niche is empty.'). A wall lantern the dead man left burning, long out (no light; the pool's light reaches it)."}
  - {id: room:jetty_shaft, name: Jetty shaft, kind: shaft, size: S, floor: 0, at: [4, 2], monsters: 0,
     purpose: "The arrival from the jetty (entrance:d4_shaft, (2,816, 2,048, -512), facing west 1024): the ladder's foot in a niche in the east wall; up it the exit preset to D4's grate at the jetty's foot (69, 83). A lantern on a hook by the ladder. Quiet; the outfall north, the east drain west."}
  - {id: room:east_drain, name: East drain, kind: corridor, size: M, floor: 0, at: [2, 2], monsters: 2,
     population: [{row: Sewer Stalker, level: 25, count: 2}],
     purpose: "From the cross east to the jetty shaft under the waterfront houses; a plank walk beside the channel."}
