    preset: chest
    source: chest:gift
    notes: "The wedding gift: unseen in the cloud until state:wedding raises it."
  - id: evt:disc
    preset: script
    source: platform:disc
    title: A cloud-stone disc
    condition: {lua: "XeenQuests.hook(\"m42.disc\")"}
    effects:
      - teleport:
          to: [4608, -3968, 0]
          direction: 90
    notes: "D-56 7: A3's m42.disc line, then to entrance:fd03_roof inside the map, facing north."
  - id: evt:fall_check
    preset: script
    trigger: timer
    every: 1
    lua: |-
      local x, y, z = evt.GetPartyPosition()
      if z > -1000 then return end
      Xeen.skyFallTo("p5")
    notes: "set:fall: a party under -1,000 has fallen off the clouds; A3's Xeen.skyFallTo('p5') sets it down on X5's entrance:p5_fall on Darkstone's rock, with falling damage (D-56 Q3)."
  - id: evt:fall_floor
    preset: script
    source: room:air
    trigger: step
    lua: |-
      local x, y, z = evt.GetPartyPosition()
      Xeen.skyFallTo("p5")
    notes: "The safety floor at -6,000: a fall the one-second check missed lands the same way."
  - id: evt:figures_load
    preset: script
    trigger: load
    lua: |-
      evt.SetMm9ActorCanReceiveDamage(ActorIndex("monster:pharaoh"), false)
      evt.SetMm9ActorCanReceiveDamage(ActorIndex("monster:roland"), false)
      evt.SetMm9ActorCanReceiveDamage(ActorIndex("monster:kalindra"), false)
    notes: "The three figures are unkillable (D-56 3; as D-51 and D-52)."
  - id: evt:hands_filled
    preset: script
    trigger: call
    effects:
      - show: deco:cube
      - show: deco:scepter
    notes: "The cinematic's first cue: the Cube and the Scepter in the hands."
  - id: evt:observatory
    preset: script
    source: platform:observatory_door
    title: Observatory
    effects:
