    notes: "The stair house's door: down into FD-03's entrance:p5_stair, meaning 'Descend into Darkstone Tower?' (aazex129:14)."
  - id: evt:wedding_hide
    preset: script
    trigger: load
    condition: {not: {qbit: m42_done}}
    effects:
      - hide: platform:pavilion_post1
      - passable: platform:pavilion_post1
      - hide: platform:pavilion_post2
      - passable: platform:pavilion_post2
      - hide: platform:pavilion_post3
      - passable: platform:pavilion_post3
      - hide: platform:pavilion_post4
      - passable: platform:pavilion_post4
      - hide: platform:pavilion_roof
      - passable: platform:pavilion_roof
      - hide: platform:pavilion_back
      - passable: platform:pavilion_back
      - hide: platform:pavilion_west
      - passable: platform:pavilion_west
      - hide: platform:pavilion_east
      - passable: platform:pavilion_east
      - hide: platform:disc
      - passable: platform:disc
    notes: Before m42.done the pavilion and the disc are not there (hidden and passable).
  - id: evt:wedding_load
    preset: script
    trigger: load
    condition: {qbit: m42_done}
    effects:
      - show: platform:pavilion_post1
      - solid: platform:pavilion_post1
      - show: platform:pavilion_post2
      - solid: platform:pavilion_post2
      - show: platform:pavilion_post3
      - solid: platform:pavilion_post3
      - show: platform:pavilion_post4
      - solid: platform:pavilion_post4
      - show: platform:pavilion_roof
      - show: platform:pavilion_back
      - solid: platform:pavilion_back
      - show: platform:pavilion_west
      - solid: platform:pavilion_west
      - show: platform:pavilion_east
      - solid: platform:pavilion_east
      - show: platform:disc
      - solid: platform:disc
      - show_actors: 51
      - show: deco:cube
      - show: deco:scepter
      - show: deco:cake
      - show: chest:gift
    notes: "state:wedding on every visit after m42.done (D-56 5): the same as the cinematic's cue."
  - id: evt:wedding_show
    preset: script
    trigger: call
    effects:
      - show: platform:pavilion_post1
      - solid: platform:pavilion_post1
      - show: platform:pavilion_post2
      - solid: platform:pavilion_post2
      - show: platform:pavilion_post3
      - solid: platform:pavilion_post3
      - show: platform:pavilion_post4
      - solid: platform:pavilion_post4
