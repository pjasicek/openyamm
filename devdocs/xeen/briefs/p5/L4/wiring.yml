      - show: platform:pavilion_west
      - solid: platform:pavilion_west
      - show: platform:pavilion_east
      - solid: platform:pavilion_east
      - show: platform:disc
      - solid: platform:disc
      - show_actors: 51
      - show: deco:cube
      - show: deco:scepter
      - show: deco:cake
      - show: chest:gift
    notes: "The cinematic's cue at the fade (a gameplay step: it runs also on a skip)."
cinematics:
  - id: cinematic:unification
    skippable: true
    shots:
      - {seconds: 8, at: [0, -1884, 872], look_at: [0, -184, 812], fov: 60, easing: smooth, keys: [{seconds: 8, at: [0, -1484, 812], look_at: [0, -184, 832]}]}
      - {seconds: 10, at: [0, -2184, 1212], look_at: [0, 0, 712], fov: 70, easing: smooth, keys: [{seconds: 10, at: [600, -6400, 3200], look_at: [0, 0, 512]}]}
      - {seconds: 6, at: [600, -6400, 3200], look_at: [0, 0, 512], fov: 70, easing: smooth, keys: [{seconds: 6, at: [300, -3000, 5600], look_at: [0, 2000, 6000]}]}
      - {seconds: 8, at: [700, -540, 932], look_at: [0, 960, 712], fov: 60, easing: smooth, keys: [{seconds: 8, at: [300, -240, 812], look_at: [0, 960, 692]}]}
      - {seconds: 3, party: true}
    cues:
      - {at: 0, fade: in, seconds: 1}
      - {at: 0.5, event: evt:hands_filled}
      - {at: 1.5, sound: xeen_vo_pharaoh_unification}
      - {at: 1.5, subtitle: "The Dragon Pharaoh: \"Let the two faces of Xeen be one world again.\"", seconds: 5}
      - {at: 9.5, sound: xeen_chime_1}
      - {at: 11.5, sound: xeen_chime_2}
      - {at: 13.5, sound: xeen_chime_3}
      - {at: 15.5, sound: xeen_chime_4}
      - {at: 19.5, fade: out, color: [255, 255, 255], seconds: 2.5}
      - {at: 22.5, event: evt:wedding_show}
      - {at: 24, fade: in, color: [255, 255, 255], seconds: 2}
      - {at: 24.5, sound: xeen_wedding_fanfare}
      - {at: 25, seconds: 1.5, monster: monster:pharaoh, action: face, look_at: [0, 960, 632]}
    notes: "D-56 5: the ending, about 35 s, played by A3's m42.shrine (evt.PlayCinematic('unification', 42149)). The fade into the sky and back on the pavilion is white (FADE_COLOUR); the first fade in is from black. AU's chimes (9.5-15.5 s) and wedding fanfare (24.5 s)."
