format: 0
level: L1
pitch: "The cloud above Darkstone Tower, the last place in the world. One road of cloud leaves the tower's black crown and goes the long way round: a ring past Rest Stop huts, an observatory that is closed and billboards naming New World Computing's games, with the Pharaoh's shrine in sight across the sky the whole way, until a causeway turns in to it. There the Dragon Pharaoh waits with his two stone hands held up for the Cube and the Scepter; after the ceremony, a wedding pavilion."
purpose: "Act VI's finale (M42, party 61-65): the walk, the Pharaoh's note, the shrine and the ending cinematic (evt.PlayCinematic), Roland and Kalindra's wedding, the completion certificate. Reached by FD-03's roof stair after M41's seal; left down the stair house, by falling (to X5) or by spell."
mood: "Bright, quiet and a little solemn; a highway in the sky with rest stops and billboards. The world winks one last time; nothing attacks."
