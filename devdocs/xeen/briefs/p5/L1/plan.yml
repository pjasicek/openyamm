notes: "MU-3 for the phase 6 review (A5 sub-agent, 2026-11-21), D-56 applied (A5, sixteenth session). Room 26 x 26 cells (13,312 a side). Board: output/studio_cal/p5/mockups/board_p5.png; tools output/studio_cal/p5/tools/ (run.sh). Source: the Clouds of the Ancients, MM5 maze 129 with x181-x183 (dark/aazex129). D-56: the Pharaoh, Roland and the wedding Kalindra (a new row keeping npc 5001) are peaceful, placed-only, uncounted, NoArena figures, made unkillable by the map's load event (SetMm9ActorCanReceiveDamage(false), as D-51 and D-52); Dungeon M with at most 13 new textures; falls tested in D-54's shape (change 10)."
