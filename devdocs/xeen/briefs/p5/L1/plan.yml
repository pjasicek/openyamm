set_pieces:
  - id: set:fall
    kind: scripted
    spaces: [void:sky]
    rule: "As X8 and X9: a one-second check moves a party below z -1,000 (and the room's safety floor at -6,000) through A3's Xeen.skyFall to X5, on Darkstone's rock (-4608, 2304), ground 1500, facing the tower door (question 3)."
  - id: set:long_road
    kind: vista
    spaces: [room:crown, room:rest_east, room:ne_turn, room:observatory, room:nw_turn, room:rest_west, room:sw_turn, room:rest_south, room:shrine]
    rule: "The long way round: 29,137 along the road from the arrival to the dais (about 76 s walking, 38 s running), the shrine in sight across the sky the whole way. The road climbs 448 round the ring. The crown and the last Rest Stop are 1,445 apart and 448 apart in height: no short cut."
  - id: set:unification
    kind: scripted
    spaces: [room:shrine]
    rule: "D-56 change 5, in this order: the shrine's click (A3's m42.shrine) takes the Cube and the Scepter, sets m42.done, gives the award and the 40,000 experience and starts the cinematic `unification` (xeen_p5.cinematics.yml, A5 at L4) through evt.PlayCinematic; skippable, about 35 s; every gameplay step is an `event` cue, so a skip runs them too: (1) close on the dais, an event cue shows the Cube and the Scepter in the hands, the Pharaoh's voiced line from the cue only (D-38 xeen_vo_pharaoh_unification: 'Let the two faces of Xeen be one world again.'); (2) a rising pull-back over the ring, four far chimes (the sleepers answer); (3) up into the sky and a fade to white (A1's fade colour; black if A1 declines, final), during which an event cue shows state:wedding; (4) fade in on the pavilion, Roland and Kalindra under it, the Pharaoh turning to them with his book; a subtitle; (5) the party's view. When the cinematic ends (played or skipped) the done event shows the hook's narrative text once; when that window closes, the completion certificate (A4's world.yml `completion`) follows, never during the cinematic (A1)."
