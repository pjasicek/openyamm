    behaviour: "Billboards on the road's outer shoulder, each naming one New World Computing game, the source's sign texts (aazex129:1-10), clicked or hovered: 'New World Computing', 'King's Bounty', 'Inherit the Earth', 'Empire Deluxe', 'Spaceward Ho!', 'Planets Edge', 'Vegas Games', 'Tunnels and Trolls', 'Nuclear War', 'Might and Magic'. In walking order; 'Might and Magic' last, beside the causeway's head (the source's (12,17)). Question 8 decides lettered faces."
    notes: "New World Computing at (2944, -3712) facing e, 1,361 along; King's Bounty at (4224, -2176) facing w, 2,257 along; Inherit the Earth at (4224, 1792) facing w, 6,225 along; Empire Deluxe at (4288, 4288) facing sw, 8,017 along; Spaceward Ho! at (2304, 4224) facing s, 9,297 along; Planets Edge at (-2304, 4224) facing s, 13,905 along; Vegas Games at (-4288, 4288) facing se, 15,185 along; Tunnels and Trolls at (-4288, -4288) facing ne, 22,353 along; Nuclear War at (-2304, -4224) facing n, 23,633 along; Might and Magic at (-640, -1408) facing e, 28,113 along"
