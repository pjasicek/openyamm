    effects: ["Shown live by the cinematic's event cue at the fade, and on every load after (the wedding load event on m42.done).", The shrine's click gives m42's else_text ('somebody has left cake').]
    notes: "The pavilion is a structure hidden until then; the couple are placed peaceful figures, the Cube and the Scepter the installed item models as scaled decorations (D-56 changes 3, 4, 7)."
atmosphere: "Sky xeencloud (xeen_cloud_sea, below_horizon: sky, high sun, X9's daylight block), question 9; no weather; wind; music 15 (MM8 Plane Between Planes). No Fly (no BLV casts it). No lighting bake (open air)."
