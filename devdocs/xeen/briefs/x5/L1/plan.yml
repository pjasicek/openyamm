format: 0
level: L1
pitch: "The white south-west of Cloudside. A frozen mere lies at the tundra's heart with a black tower on a rock in the ice; the ghost town Winterkill huddles on its north-west shore, a stone's throw from the world's edge. North the wind-scoured steppe of the barbarians; on a crag above it Kai Wu's monastery. South the Troll Forest's snowy firs. In the south-west corner the Land of the Giants rises to crags, and a glacier slides off the end of the world into the stars. In the east, by the Lifeforce Lagoon, the Frostspine walls off a gentler pocket, the Ogre Hills and the Lagoon Marches, where the Golem Dungeon and the Cave of Illusion open."
purpose: "Two ages on one map. The east pocket (party 16-19, Act II) holds XD-09 and XD-10 for M10 and M12, with Halon, a well, a hot spring and Act II monsters. West of the Frostspine is the wilderness of Act III (party 24-28): Winterkill and its ghosts (Q-C6), the Ninja Pagoda (Q-C4), the Troll Warren (Q-C15), the Holy Book (Q-C18), Glom's cyclops outpost, the Winter Druid (Q-C1), the Earth Reflector, and the sealed Darkstone Tower for the finale."
mood: "Cold, bright and quiet; snow light under a low overcast. Winterkill dead still. The pocket softer: running water, sedge, smoke from Halon's chimney."
datum: water:rim_sea
