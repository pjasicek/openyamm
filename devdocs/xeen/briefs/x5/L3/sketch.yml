events:
  - id: evt:wave1_laid
    trigger: timer
    every: 5
    condition: {kills: {group: 40}}
    effects:
      - qbit: wave1_laid
      - text: The last of the Spirit Bones falls apart in the snow.
    once: true
    notes: "Q-C6: the first wave laid (112122)."
  - id: evt:wave2_show
    trigger: timer
    every: 3
    condition: {qbit: reported1}
    effects:
      - show_actors: 41
    once: true
    notes: "Q-C6: Randon heard of the first wave: the Polter-Fools come."
  - id: evt:wave2_laid
    trigger: timer
    every: 5
    condition: {all: [{qbit: reported1}, {kills: {group: 41}}]}
    effects:
      - qbit: wave2_laid
      - text: The Polter-Fools are gone. The town is very quiet.
    once: true
  - id: evt:wave3_show
    trigger: timer
    every: 3
    condition: {qbit: reported2}
    effects:
      - show_actors: 42
    once: true
    notes: "Q-C6: the Ghost Riders come."
  - id: evt:wave3_laid
    trigger: timer
    every: 5
    condition: {all: [{qbit: reported2}, {kills: {group: 42}}]}
    effects:
      - qbit: wave3_laid
      - text: The last ghost rides off into the snow and does not come back.
    once: true
  - id: evt:townsfolk
    trigger: timer
    every: 3
    condition: {qbit: winterkill_liberated}
    effects:
      - show_actors: 50
    once: true
    notes: "Winterkill liberated: the townsfolk come back."
  - id: evt:randon_load
    trigger: load
    effects:
      - lua: "evt.SetMm9ActorCanReceiveDamage(120, false)"
    notes: "D-87.1: Mayor Randon (actor 120, npc 4502) stands in the haunted square and takes no damage, as Corak (D-51): no stray hit or Fireball kills him or turns him hostile."
  - id: evt:outpost_burnt
    trigger: load
    condition: {lua: "Xeen.isSet(\"q-c16.outpost_burnt\")"}
    effects:
      - hide: thing:outpost_tent
      - hide: thing:outpost_tent2
      - hide: thing:outpost_fire
      - hide: thing:outpost_bones_1
      - hide: thing:outpost_bones_2
      - hide: thing:outpost_bones_3
      - show: thing:outpost_char_1
      - show: thing:outpost_char_2
      - show: thing:outpost_char_3
      - show: thing:outpost_char_4
      - show: thing:outpost_char_5
    notes: "Q-C16: the outpost stays burnt (A6 s27)."
  - id: evt:rim_fall
