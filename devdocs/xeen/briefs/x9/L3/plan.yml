format: 0
level: L3
pitch: "Lord Xeen's own clouds over Lake Darzog. A long southern cloud where Darzog's Tower's cloud stair comes up, four rhyming statues and two roc nests on it; an open gap that a sign crosses in two words ('Xeen--9N.'); and the rising cloud of Xeendom beyond: Slick's carnival on a paved plaza, Castle Xeen black and gold at the top of the road, the rocs' aviary on its high cloud to the east. Down both sides, lone clouds and rope bridges with offering statues. High above the aviary, out of reach, the Dragon Clouds."
purpose: "Act V's sky map (party 46-48): M34 (Slick's four stat games and the cupie doll that opens Castle Xeen's gate) and the way into XD-19 (M35). Reached one way up from XD-12's roof after M21; left by falling (to X2) or through the castle. Later Q-F1's Dragon Clouds, a sealed island."
mood: "Bright, airy and vertiginous; a cheerful carnival at an evil lord's gate. The world winks; the rocs do not."
datum: room:stair_head
