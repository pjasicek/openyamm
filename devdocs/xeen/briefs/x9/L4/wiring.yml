    notes: "A3's x9.sign_danger (the source's line, xeen/aaze0027)."
  - id: evt:fall_check
    preset: script
    trigger: timer
    every: 1
    lua: |-
      local x, y, z = evt.GetPartyPosition()
      if z > -1000 then return end
      Xeen.skyFallTo("x9")
    notes: "set:fall: a party under -1,000 has fallen off the clouds; A3's Xeen.skyFallTo('x9') sets it down on X2's Darzog island at entrance:x9_fall with falling damage."
  - id: evt:fall_floor
    preset: script
    source: room:air
    trigger: step
    lua: |-
      local x, y, z = evt.GetPartyPosition()
      Xeen.skyFallTo("x9")
    notes: "The safety floor at -6,000: a fall the one-second check missed lands the same way."
  - id: evt:fd04_door
    preset: script
    source: platform:fd04_door
    title: Dragon Tower
    effects:
      - exit: door:fd04
    notes: "The way down in the dragon-head rock: the exit preset's leave (its meaning 'Descend into Dragon Tower?', dark/aazex128:0) to FD-04's entrance:x9_clouds."
  - id: evt:gate_l
    preset: script
    source: platform:gate_leaf_l
    title: Castle Xeen
    condition: {not: {qbit: m35_done}}
    effects:
      - lua: "if not XeenQuests.hook(\"m34.gate\") then return end"
      - exit: door:xd19
    else_effects:
      - lua: "XeenQuests.hook(\"x9.castle_gone\")"
    notes: "Castle Xeen's gate (link:gate): A3's m34.gate, then the exit preset's leave into XD-19's entrance:x9_gate."
