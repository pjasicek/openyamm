    preset: script
    trigger: timer
    every: 1
    once: true
    effects:
      - lua: "XeenQuests.hook(\"x9.arrival\")"
    notes: "First arrival: A3's x9.arrival line (a one-second timer, once: a load event's window is not shown)."
