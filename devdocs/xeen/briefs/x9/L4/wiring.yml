      - passable: platform:gate_leaf_l
      - hide: platform:gate_leaf_r
      - passable: platform:gate_leaf_r
    notes: "state:castle_gone (D-47 Q14): on m35.done the shell (walls, frieze, lintel, towers, keep, leaves) is hidden and passable; its cloud stays; link:gate is sealed."
  - id: evt:castle_spot
    preset: script
    source: platform:gate_threshold
    trigger: step
    condition: {qbit: m35_done}
    effects:
      - lua: "XeenQuests.hook(\"x9.castle_gone\")"
    notes: After m35.done the gate's spot reads 'The great Castle Xeen recently stood here.' (aaze0027:44).
