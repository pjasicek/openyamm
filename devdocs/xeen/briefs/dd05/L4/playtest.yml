        local s = tostring(status())
        if not string.find(s, [[+5 Water resistance]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "close()"}
  - lua_event: {source: "if not IsAtLeast(WaterResistance, 15) or IsAtLeast(WaterResistance, 16) then error('member 2 Water resistance is not 15') end"}
  - press_action: {action: select_member, member_index: 0}
  - walk_to: {x: 400, y: 0, z: 1280, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - lua_event: {source: "SetValue(BodyResistance, 10)"}
  - play_lua: {source: "click(38); wait(0.5)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
