# Playtest of the Western Tower of Mok (DD-05, L4): the critical path from the rope window to the front door through
# every mechanism, the boss and the hooks. A level-37 party arrives by D1's rope in the hoist room (the arrival
# window), crosses the bone gallery (a heap of bones: a find, then "Nothing here."), opens the chapel's double doors:
# the Cult Leader dies (q-d6.cult_leader), the key lies on the altar (a ground item, D-90: picked up).
# Through the cells (a bed's find) to the tapestry walk: the west tapestry "Nothing here.", the middle one's button
# slides the panel into the vestry; the vestry's chest; the vestry's door into the chapel; down the altar stair.
# L3: the cloister; Pious's cell: a save, No (q-d6.pious: pious_spared, he is gone), a load, Yes (the source's kill
# line, pious_slain, he is gone), the bed's line; the cold fountain (+5 Water to member 1 once, the refusal, then +5
# to member 2) and the venom fountain once and its refusal; the dormitory's chest; down the west stair. L2: the
# refectory, the fountains of fire and lightning (once each, then the refusal), the lower dormitory's purse, Humble's
# cell entered on foot: a save, Yes (humble_slain), a load, No (q-d6.humble). Down the east stair. L1: the alcoves: the
# west disc gives both Energy Disks (q-d6.l1_alcoves), the east says "The alcove is empty.", the Golden
# Pegasus on the north ledge (a ground item, D-90: picked up); the dead mirror; the door hall: the front door with the key (q-d6.front_door,
# tower_opened); a save and a load on the way keep the alcoves empty. Numbers are ids.lock.yml's (events, doors).
# Run with --world xeen --map xeen_dd05.blv (output/studio_cal/dd05/four.sh).
id: xeen.dd05.l4.walk
title: Western Tower of Mok (DD-05 L4), the rope to the front door
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_dd05.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 37, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 37, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 37, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 37, skills: [], equipment: {}}
  - assert: {map: xeen_dd05.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - advance_runtime: {seconds: 3, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "THE WESTERN TOWER OF MOK"}}
  - play_lua: {source: "close(); wait(0.5); if not qbit(117360) then error('arrived_once not set') end"}
  - assert: {party_position: {x: 1376, y: 1472, radius: 64, z_min: 1912, z_max: 1928}}
  # L4: the hoist room's door, the bone gallery.
  - walk_to: {x: 1120, y: 1376, z: 1920, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "open_door(27, 6)"}
  - walk_to: {x: 700, y: 1376, z: 1920, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: 560, y: 1560, z: 1920, radius: 64, timeout_seconds: 20, clear_hostiles: 2500, close_dialogs: true}
  - play_lua:
      source: |
        local before = gold()
        status()
        click(14); wait(0.5)
        if gold() ~= before + 300 then error("the bones gave " .. (gold() - before) .. " gold") end
        status()
        click(14); wait(0.5)
        local seen = status()
        if not string.find(seen, "Nothing here.", 1, true) then error("the bones again said: " .. seen) end
  # The chapel: the double doors, the Cult Leader and his group, the key on the altar.
  - walk_to: {x: 480, y: 1216, z: 1920, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "if door_state(1) ~= 'closed' then error('the chapel doors do not start shut') end; open_door(23, 1); if door_state(2) ~= 'open' then error('the second leaf did not open: ' .. door_state(2)) end"}
  - walk_to: {x: 0, y: 1216, z: 1920, radius: 64, timeout_seconds: 30, clear_hostiles: 3500, close_dialogs: true}
  - clear_hostiles: {radius: 4000}
  - play_lua: {source: "wait(3); if not qbit(113123) then error('leader_slain not set after the Cult Leader died') end"}
  - walk_to: {x: -1216, y: 1216, z: 1920, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  # D-90 (2026-11-22): the key lies on the altar as a ground item.
  - play_lua: {source: "if ground_items(12338) ~= 1 then error('the key is not on the altar') end"}
  # from the altar's south side, clear of the Cult Leader's body
  - walk_to: {x: -1472, y: 950, z: 1920, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - pick_up: {item_id: 12338}
  - play_lua: {source: "if held() ~= 0 then stow() end; if item_count(12338) ~= 1 then error('no key from the altar') end"}
  # Back out to the gallery and down its south end into the cells (a bed's find).
  - walk_to: {x: 480, y: 1216, z: 1920, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 672, y: 200, z: 1920, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - walk_to: {x: 672, y: -500, z: 1920, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: 1632, y: -1200, z: 1920, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua:
      source: |
        local before = gold()
        click(12); wait(0.5)
        if gold() ~= before + 600 then error("the cells' bed gave " .. (gold() - before) .. " gold") end
        status()
        click(12); wait(0.5)
        local seen = status()
        if not string.find(seen, "Nothing here.", 1, true) then error("the bed again said: " .. seen) end
  # The tapestry walk: the west tapestry; the button behind the middle one slides the panel into the vestry.
  - walk_to: {x: 672, y: -416, z: 1920, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 200, y: -416, z: 1920, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -400, y: -300, z: 1920, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua:
      source: |
        status()
        click(52); wait(0.5)
        local seen = status()
        if not string.find(seen, "Nothing here.", 1, true) then error("the west tapestry said: " .. seen) end
        if door_state(12) ~= "closed" then error("the vestry panel does not start shut") end
        status()
        click(53); wait(4)
        seen = status()
        if not string.find(seen, "Click", 1, true) then error("the middle tapestry said: " .. seen) end
        if door_state(12) ~= "open" then error("the button did not slide the panel: " .. door_state(12)) end
  - walk_to: {x: -700, y: -384, z: 1920, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1088, y: -384, z: 1920, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1088, y: -480, z: 1920, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "loot_chest(20)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - play_lua: {source: "close()"}
  # The vestry's door into the chapel; down the altar stair.
  - walk_to: {x: -1088, y: 520, z: 1920, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "open_door(33, 13)"}
  - walk_to: {x: -1088, y: 860, z: 1920, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1568, y: 800, z: 1920, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1568, y: 500, z: 1920, z_tolerance: 120, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1568, y: -560, z: 1280, z_tolerance: 120, radius: 64, timeout_seconds: 40, close_dialogs: true}
  # L3: the cloister; Pious's cell, No then (after a load) Yes.
