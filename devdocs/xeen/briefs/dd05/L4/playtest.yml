  - clear_hostiles: {radius: 4000}
  - walk_to: {x: 0, y: -1000, z: 1280, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - play_lua: {source: "open_door(31, 10)"}
  - assert: {actor_visible: {actor_index: 40, monster_id: 11911, hidden: false}}
  - assert: {actor_count: {monster_id: 11911, hostile: false, min: 1, max: 1}}
  - save_game: {name: dd05_pious}
  - execute_event: {id: 48}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Slay him anyway?"}}
  - answer_input: {text: "No"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Thank you for sparing my life."}}
  - play_lua: {source: "close(); wait(0.5); if not qbit(113128) then error('pious_spared not set') end; if qbit(117362) then error('pious_slain set by No') end"}
  - assert: {actor_visible: {actor_index: 40, monster_id: 11911, hidden: true}}
  - load_game: {name: dd05_pious}
  - advance_runtime: {seconds: 1}
  - play_lua: {source: "close(); if qbit(113128) then error('the load kept pious_spared') end"}
  - assert: {actor_visible: {actor_index: 40, monster_id: 11911, hidden: false}}
  - walk_to: {x: 0, y: -1450, z: 1280, radius: 64, timeout_seconds: 20, close_dialogs: false, expect: dialog}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Slay him anyway?"}}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "The screams of the unarmed cleric"}}
  - play_lua:
      source: |
        close(); wait(0.5)
        if not qbit(117362) then error("pious_slain not set") end
        if qbit(113128) then error("pious_spared set by Yes") end
        status()
        click(49); wait(0.5)
        local seen = status()
        if not string.find(seen, "lifeless body", 1, true) then error("Pious's bed said: " .. seen) end
  - assert: {actor_visible: {actor_index: 40, monster_id: 11911, hidden: true}}
  # The fountains of cold and venom: once per character (A3's hooks decide).
  - walk_to: {x: 0, y: -1000, z: 1280, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 0, y: -300, z: 1280, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: -400, y: 0, z: 1280, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - press_action: {action: select_member, member_index: 0}
  - lua_event: {source: "SetValue(WaterResistance, 10)"}
  - play_lua: {source: "click(40); wait(0.5)"}
