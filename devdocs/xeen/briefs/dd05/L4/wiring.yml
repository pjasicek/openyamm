notes: "DD-05's events (gen.py): Q-D6's hooks (the key, the Cult Leader, Humble and Pious, the alcoves, the front door, the four fountains), Q-D20's Pegasus, the tapestry button, the finds in the beds and the bones, the dead mirror, the two exits to D1, the doors and chests."
