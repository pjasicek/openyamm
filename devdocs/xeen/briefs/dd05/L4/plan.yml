format: 0
level: L3
pitch: "Heretics in Mok's priesthood threw Dreyfus out of his Western Tower and warded its door. They still haul their bread up a rope to a window near the top, so the party climbs in at the top and fights down four floors: the heretics' chapel and its Cult Leader with the key, the floors of the two penitent clerics Pious and Humble, fountains that toughen the skin, and on the ground floor the alcoves with two Energy Disks and Luna's Pegasus, Mok's iron guardians at the warded door, and the door itself opened from inside."
purpose: "Q-D6 The Heretics of Mok (D1, Dreyfus): the Cult Leader, the key, the front door; Humble and Pious spared or not; M18's two Energy Disks; Q-D20's Pegasus statuette. Party 35-39; band 25-45; 45 monsters; treasure 4, the vestry 5. About 30 minutes."
mood: "A cold green-grey tower of the Mok order, lamplit; the heretics' pale chapel under the cone; wind at the rope window."
datum: arrival
