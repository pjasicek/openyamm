    preset: script
    source: deco:kettle
    title: Kettle
    lua: |-
      if continueStep == 2 then
          XeenQuests.hook("q-d10.kettle_drunk")
          evt.ForPlayer(Players.Current)
          SetValue(PoisonedGreen, 1)
          return
      end
      if continueStep ~= nil then
