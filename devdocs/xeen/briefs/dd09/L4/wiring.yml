  - id: evt:pen_lever
    preset: switch
    source: switch:pen_lever
    title: Lever
    toggles: [mover:gate_nathan, mover:gate_sky, mover:gate_snog, mover:gate_alicia]
    effects:
      - lua: |-
          if IsAtLeast(MapVar(pens_open), 1) then
              SetValue(MapVar(pens_open), 0)
          else
              SetValue(MapVar(pens_open), 1)
              SetQBit(QBit(117121))
          end
          evt.StatusText("You hear a rumbling in the distance.")
    notes: "poi:pen_lever (D-27): two states, the four cages open and shut together; 'You hear a rumbling in the distance.' (dark/aaze0073:15). The first opening sets prisoners_freed (117121)."
  - id: evt:prisoner_alicia
    preset: script
    source: mover:gate_alicia
    title: Alicia the Just
    lua: |-
      if IsAtLeast(MapVar(prisoners_gone), 1) then
          evt.StatusText("The cage is empty.")
          return
      end
      if not IsAtLeast(MapVar(pens_open), 1) then
          evt.StatusText("Locked. A lever somewhere in the temple works these cages.")
          return
      end
      evt.SpeakNPC(5114)
    notes: "poi:prisoners: NPC 5114 talks through the opened cage (A3's topic: thanks, 500 XP once). Words needed: an indoor monster with an npc id."
