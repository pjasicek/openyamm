format: 0
variables: [voice_heard, limb_1_fed, limb_2_fed, limb_3_fed, barkman_woken, barkman_shown, cage_moved, sheewana_hidden, pens_open, prisoners_gone, dial_west, dial_north, dial_east, lever_pulled, in_visit]
events:
  - id: evt:arrive
    preset: script
    trigger: timer
    every: 1
    condition: {not: {qbit: arrived_once}}
    once: true
    effects:
      - message: "THE TEMPLE OF BARK. The round door shuts behind you on the bark glade. Inside the great tree the air is warm and smells of sap and orc. Shaalth's orcs hold the old temple, and somewhere in it Princess Sheewana, the sprites' sister. This door is the way back out."
      - qbit: arrived_once
    notes: "Say why the party is here (Q-D10: Sheewana), on the first arrival only (arrived_once 117120)."
  - id: evt:asc_lever
    preset: switch
    source: switch:asc_lever
    title: Lever
    effects:
      - lua: |-
          if (IsAtLeast(MapVar(dial_west), 0) and not IsAtLeast(MapVar(dial_west), 1)) and (IsAtLeast(MapVar(dial_north), 1) and not IsAtLeast(MapVar(dial_north), 2)) and (IsAtLeast(MapVar(dial_east), 2) and not IsAtLeast(MapVar(dial_east), 3)) then
              SetValue(MapVar(lever_pulled), 1)
              evt.SimpleMessage("The lever clicks home. In the Crystal Water's basin the scum parts and the water runs clear.")
          else
              SetValue(MapVar(lever_pulled), 0)
              evt.StatusText("Nothing happens.")
          end
    notes: "poi:asc_lever: with the dials at west 1, north 2, east 3 the Crystal Water clears (lever_pulled); otherwise 'Nothing happens.' (D-27)."
  - id: evt:barkman_wakes
    preset: script
    trigger: timer
    every: 1
    condition: {map_var: barkman_woken, not: {map_var: barkman_shown}}
    effects:
      - show_actors: 30
      - set:
          var:
            map_var: barkman_shown
          value: 1
    notes: "D-27: Barkman (group 30) shows the first time a limb alcove takes a gem and stays shown (his state is saved with the map); a refill resets him hidden with the variables."
  - id: evt:black_barrel
    preset: script
    source: deco:black_barrel
    question: {ask: "Drink (Yes/No)?", answers: [Yes, Y], message: "The barrel is filled with a strange black sludge. A note on the inside of the lid reads, \"Danger: Unpredictable Effects.\" Drink?"}
    title: Black barrel
    condition: {not: {player_bit: 11317}}
    lua: |-
      evt.ForPlayer(Players.Current)
      for _, stat in ipairs({BaseMight, BaseIntellect, BasePersonality, BaseEndurance, BaseSpeed, BaseAccuracy, BaseLuck}) do
          AddValue(stat, 1)
      end
      AddValue(Age, 1)
      SetPlayerBit(PlayerBit(11317))
      evt.SimpleMessage("Your statistics have improved, but you have suffered a little magical aging.")
    else_effects:
      - text: The black sludge has done all it will do to you.
    notes: "poi:black_barrel (D-27; dark/aaze0074:4-9): once per character (player bit 11317): +1 to all seven stats and one year of age (the event age variable; an AgingImmunity item, the Jewel of Ages, protects, D-2.4)."
  - id: evt:blue_flask
    preset: script
    source: deco:blue_flask
    title: Blue flask
    lua: |-
      if IsPlayerBitSet(PlayerBit(11316)) then
          evt.StatusText("The flask is empty for you.")
          return
      end
      evt.ForPlayer(Players.Current)
      AddValue(BasePersonality, 2)
      SetPlayerBit(PlayerBit(11316))
      evt.StatusText("+2 Personality (permanent).")
    notes: "poi:flasks: Blue Potion (dark/aaze0073:10-11, rescaled to +2), once per character (player bit 11316)."
  - id: evt:book_ascension
    preset: script
    source: platform:lectern
    title: Book of Ascension
    lua: "XeenQuests.hook(\"q-d10.book_of_ascension\")"
    notes: "poi:book_ascension: A3's text (dark/aaze0076:2, naming the Crystal Water, D-27)."
  - id: evt:book_ceremonies
    preset: script
    source: panel:book_ceremonies
    title: Morning Ceremonies
    effects:
      - message: "Morning Ceremonies. Take ye then the Bark of the Tree, and sprinkle it with ash. The ash symbolizes the Yak, the Bark the Moo. March ye the congregation in a circle about the Tree, directing the half of them to chant \"Yak\" and the other half \"Moo\". ... The Morning Ceremonies are complete. Break for breakfast, then repeat before lunch."
    notes: poi:books (dark/aaze0073:24-30).
  - id: evt:book_history
    preset: script
    source: panel:book_history
    title: History of Bark
    effects:
      - message: "History of Bark. Ages past, before the time when men walked the Earth, there was Bark. From Bark did all good things come; Bark's roots drew water from the Earth, Bark's leaves drew sustenance from the sun, Bark's branches held the sky above the ground, lest the sky fall and crush the world beneath it."
    notes: poi:books (dark/aaze0073:24-30).
  - id: evt:book_sap
    preset: script
    source: panel:book_sap
    title: Book of Sap
    effects:
      - message: "Book of Sap. The Sap of Bark runs with power. Store the Sap with care, and add the Holy Bark of Yak on the spring equinox to the Sap to make it potent. The Sap will make Holy Potions that improve the health and character of the drinker. The Holy Potions must be reserved for the disciples of Bark, for Bark requires Her Clerics to be strong of limb and mind."
    notes: poi:books (dark/aaze0073:24-30).
  - id: evt:cabinet
    preset: text
    source: panel:cabinet
    title: Cabinet
    text: Nothing here.
    window: false
    notes: dark/aaze0075:1.
  - id: evt:cage
    preset: script
    source: mover:cage_sheewana
    title: Cage
    lua: |-
      if IsQBitSet(QBit(113206)) then
          XeenQuests.hook("q-d10.cage")
          return
      end
      if IsQBitSet(QBit(113205)) then
          evt.SpeakNPC(5107)
          return
      end
      XeenQuests.hook("q-d10.cage")
    notes: "goal:sheewana: A3's q-d10.cage (needs shaalth_slain; its fail and else texts); once open, Princess Sheewana talks (NPC 5107, topic Home). Words needed: an indoor monster with an npc id."
  - id: evt:cage_opens
    preset: switch
    trigger: timer
    every: 1
    condition: {qbit: cage_opened, not: {map_var: cage_moved}}
    opens: [mover:cage_sheewana]
    effects:
      - set:
          var:
            map_var: cage_moved
          value: 1
    notes: The cage's gate lifts once q-d10.cage has set cage_opened (113205).
  - id: evt:chest_barkman
    preset: chest
    source: chest:barkman
    title: Chest
    condition: {kills: {monster: monster:barkman}}
    locked_text: "The life force of the BARKMAN binds the lid of the chest shut, making it impossible to open."
    notes: "Barkman's chest (hoard 4): his life force binds it shut until he is dead (dark/aaze0077:21)."
