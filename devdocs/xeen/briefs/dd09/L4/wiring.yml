  - id: evt:crystal_water
    preset: script
    source: platform:crystal_water
    title: Crystal Water
    lua: |-
      if IsQBitSet(QBit(113216)) then
          XeenQuests.hook("q-d10.crystal_water")
          return
      end
      if not IsAtLeast(MapVar(lever_pulled), 1) then
          evt.StatusText("The water is stagnant.")
          return
      end
      XeenQuests.hook("q-d10.crystal_water")
    notes: "poi:crystal_water: before the lever 'The water is stagnant.' (dark/aaze0076:9); after it A3's once-hook q-d10.crystal_water (disciples 113216, award 418 for every member); then its else text. The vault's door reads disciples."
  - id: evt:danger
    preset: text
    source: panel:danger
    title: Sign
    text: "Danger: Unpredictable Effects."
    window: false
    notes: The black barrel's sign (dark/aaze0074:7).
  - id: evt:dark_water
    preset: script
    source: platform:dark_water
    title: Dark Water
    lua: |-
      XeenQuests.hook("q-d10.dark_water")
      evt.ForPlayer(Players.Current)
      local now, step = 0, 4096
      while step >= 1 do
          if IsAtLeast(CurrentHealth, now + step) then now = now + step end
          step = math.floor(step / 2)
      end
      SetValue(PoisonedGreen, 1)
      local hurt = math.floor(now / 10)
      if hurt > 0 and now - hurt >= 1 then SubtractValue(CurrentHealth, hurt) end
    notes: "poi:dark_water (D-27): A3's q-d10.dark_water; the drinker is poisoned and loses about a tenth of the hit points, never the last 10."
  - id: evt:dial_east
    preset: script
    source: panel:dial_east
    title: Dial
    lua: |-
      if continueStep == 2 then
          if IsAtLeast(MapVar(dial_east), 3) then SetValue(MapVar(dial_east), 0) else AddValue(MapVar(dial_east), 1) end
          SetValue(MapVar(lever_pulled), 0)
          local m = 1
          for v = 1, 3 do if IsAtLeast(MapVar(dial_east), v) then m = v + 1 end end
          evt.StatusText("The dial grinds round. It reads " .. m .. ".")
          return
      end
      if continueStep ~= nil then
          return
      end
      local n = 1
      for v = 1, 3 do if IsAtLeast(MapVar(dial_east), v) then n = v + 1 end end
      evt.SetMessage("Dial reads " .. n .. ". Turn?")
      evt.AskQuestion(eventId, 1, 0, 2, "Turn (Yes/No)?", {"Yes", "Y", "yes", "y"})
    notes: "poi:dials (D-27): 'Dial reads N. Turn?' (dark/aaze0076:10-13); a map variable 0-3 shows 1-4; turning a dial undoes the lever."
