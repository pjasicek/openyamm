    notes: poi:ledger (dark/aaze0073:19-20).
  - id: evt:limb_1
    preset: script
    source: panel:limb_1
    question: {ask: "Give gem (Yes/No)?", answers: [Yes, Y], message: "Feed me! Give gem?"}
    title: Limb alcove
    condition: {not: {map_var: limb_1_fed}}
    lua: |-
      if Xeen.payGems(1) then
          SetValue(MapVar(limb_1_fed), 1)
          SetValue(MapVar(barkman_woken), 1)
          XeenQuests.hook("q-d10.limb_alcoves")
      else
          evt.StatusText("You have no gem. The limb creaks, unfed.")
      end
    else_effects:
      - text: The limb alcove is fed. Something in the trunk is still awake.
    notes: "poi:limb_alcoves: one gem each (the map takes it), A3's q-d10.limb_alcoves for the words; the first gem wakes Barkman (barkman_woken)."
