format: 0
level: L3
pitch: "A temple grown inside the great tree of Sprite Forest, taken by Shaalth's orcs. The trunk's round door opens on a hall of bark where a voice warns: feed the roots, not the limbs. Down among the roots two alcoves take a gem each for an Energy Disk; the orcs keep prisoners in the pens beside their sap store and its black barrel. Up the ring stair the old sanctuary is Shaalth's hall, Princess Sheewana caged in its corner; past the shaman's tea (poisoned) lies the Disciples' chapel of dials and two waters, and their vault. Above, the limbs: alcoves that wake Barkman, the fruit rooms and the crown's four fountains."
purpose: "Side quest Q-D10 (QUESTS.md): free Princess Sheewana from Shaalth's orcs (q-d10.shaalth at his death, q-d10.cage, her topic Home); M18: two Energy Disks from the root alcoves (q-d10.root_west, root_east). Class M, party 22-26, monsters 14-30, Shaalth 30, Barkman 60 optional."
mood: "Living wood: bark walls and heartwood floors in the trunk, the old temple's green stone under ivy in its chapels, damp earth and roots below, leaves and daylight in the crown; orc squalor over all of it."
