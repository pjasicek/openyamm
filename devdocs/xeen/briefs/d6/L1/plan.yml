    kind: device
    behaviour: "A genie's lamp on a basalt pinnacle between the moat and the north rim: a wish choice; greed is punished (the source's three B2 genies, moved)."
    reached_by: off_road
  - id: poi:griffin_nest
    space: zone:east_peaks
    kind: chest
    behaviour: "A griffin's nest on a crag east of the pass, a dead courier's satchel among the bones (a chest)."
  - id: poi:mine_mouths
    space: zone:south_peaks
    count: 2
    kind: dressing
    behaviour: "Two boarded mine mouths of the Forbidden Zone mines beside DD-10C's adit (the source's other mines; dressing, no click)."
  - id: poi:mirror
    space: zone:np_square
    kind: story_device
    behaviour: "The Mirror of Necropolis (4756): the Darkside mirror network (Kalindra's stage 4, A3's helper)."
  - id: poi:obelisk
    space: zone:obelisk_knoll
    kind: obelisk
    behaviour: "obelisks.d6: the sixth of six words, PYRAMID (autonote dark_6, 115055)."
    rule: native:obelisk
    notes: "On Obelisk Knoll by the west rim (A3's autonote: \"Obelisk in the Forbidden Zone\"), the Slag Run's lava fall below, Alamar's plateau in view."
  - id: poi:pilgrim_cart
    space: zone:bone_road
    kind: chest
    behaviour: "A pilgrim's coffin-cart abandoned on the Bone Road: turned back at the gate without a pass (a chest)."
  - id: poi:prospector
    space: zone:south_peaks
    kind: chest
    behaviour: "A prospector dead at the boarded mine mouths, his pack of tools and stones (a chest)."
  - id: poi:skull
    space: zone:np_square
    kind: story_device
    behaviour: "A skull on the mirror's plinth tells the story of the two necromancers (the source's long tale, A3's text) when clicked. One spot with the mirror."
  - id: poi:spring_pilgrim
    space: zone:hot_spring
    kind: chest
    behaviour: "A burned pilgrim's pack by the hot spring, who came for the waters across the waste (a chest)."
  - id: poi:travel_pyramid
    space: zone:alamar_approach
    kind: device
    behaviour: "A small Ancient travel pyramid beside the Alamar road outside the moat's mouth (D-50 Q9): Xeen.travelPyramid(\"alamar_gate\") on click (to XD-17 Shangri-La once m30.done, else \"The moons are not aligned.\"); its arrival is entrance:xd17_pyramid, no spawn marker within 2,000."
  - id: poi:warding_well
    space: zone:ancient_field
    kind: well
    behaviour: "The Well of Warding (the source's +100 all resistances, B1(14,13)): +20 Fire, Air, Water and Earth resistance until rest, once a day (rescaled, as D1's prayer shrine)."
    uses: {times: 1, per: character, reset: daily}
  - id: poi:zone_sign
    space: zone:pass_east
    kind: signpost
    behaviour: "The source's sign at the border pass: \"The Forbidden Zone.\" (B2(15,15)) verbatim, with A3's warning line under it (d6.zone_sign, D-49 change 9)."
landmarks:
  - id: landmark:alamar
    space: zone:alamar_plateau
    what: "Castle Alamar on its basalt mesa in the lava moat: dark teal steel and black stone, square towers, every window lit, cyan energy fields between its pylons; after M33 a smoking ruin"
    seen_from: [zone:griffin_pass, zone:ash_fork_flats, zone:pod_lake_shore, zone:west_waste, zone:ancient_field, zone:ash_waste]
  - id: landmark:broken_pyramid
    space: zone:east_peaks
    what: "A broken travel pyramid in a high valley, its capstone fallen (the source's B2 pyramid; the hoard is D5's); no click"
    seen_from: [zone:east_peaks, zone:griffin_pass]
  - id: landmark:cinder_cone
    space: zone:west_waste
    what: "A cinder cone with a smoking vent beside the Alamar road, the cinder plains' one height (no click)"
