format: 0
level: L1
pitch: "Darkside's north-west corner, where the world ends north and west. A volcanic waste of grey ash and black basalt, cracked by lava, with the metal of something Ancient surfacing through the rock. In its middle Castle Alamar stands on a mesa in a moat of lava, every window lit, energy fields humming between its pylons; its lava spills over the rims into the stars and down a burning channel into a lake where Corak's escape pod stands nose-up, glowing. Sheltem's pod lies cold in the Ancient field to the north. East under the ridge, the walled Necropolis keeps its dead and its gate; south, the long mountain road from Castleview tops Griffin Pass, where Ambrose waits with a griffin. Ash falls."
purpose: "Act V's trap and endgame map (party 48-51): Ambrose's flight to Blackfang (M25), Corak's pod (M29, M32), Castle Alamar and Sheltem (M33, DD-17), Necropolis and Sandro (Q-D23, DD-21; the pass from Q-D22), the north diamonds (Q-D7, DD-10C), the sixth obelisk; in phase 6 Sheltem's pod (DD-22) and the Alamar Depths under the ruin (M39, FD-01)."
mood: "Ash drifting through the amber light, the red underglow of lava on low cloud; the hiss and crack of crust; Alamar's hum and its lit windows watching; silence and bone-white lamps in Necropolis; wind on the pass."
datum: water:rim_sea
