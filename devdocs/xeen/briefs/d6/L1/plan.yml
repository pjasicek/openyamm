states:
  - id: state:alamar_ruin
    condition: {qbit: alamar_destroyed}
    effects: ["Castle Alamar a smoking ruin; the energy fields dark; the stair to FD-01 in the gatehouse.", Darkside's sun whole again (Xeen.DarksideSkies reads m33.done).]
  - id: state:gate_shut
    condition: {not: {item: necropolis_pass}}
    locks: [building:np_guild, building:np_temple, building:np_market, building:np_embalmer, building:np_tavern, building:np_houses]
    atmosphere: "Necropolis's gate shut to the passless: the dead on the walls watch the road."
    notes: "The houses are open from inside; only the gate checks the pass (A4's d6.yml). Town Portal and the mirror land inside the gate."
  - id: state:lava_cooled
    condition: {qbit: lava_cooled}
    effects: ["The lava round Corak's hatch black and cool; the hatch opens."]
landform:
  relief: "The southern border's peaks (2,800-3,800) along y 94-104 with Griffin Pass (2,450) at x 64, falling south to D1's border row (1,100-1,700) and north to the ash flats (1,650-1,900); Corak's lava lake (1,450) south-east of the middle; Alamar's mesa (to 2,300) in its lava moat (1,550) north-west of it; the volcanic waste (1,550-2,100) to the north and west rims; the Ancient field (1,700-2,600) rising north-east to the D5 ridge (to 3,300); Necropolis on a terrace (1,650) under the east ridge; the border pass to D5 at 1,700. Inside the playable box the land spans about 1,100-3,800 (D1's spring pool 832 at the border)."
  height_range: [1100, 3800]
  water: "No water: lava only (lavtyl, D-40): Corak's lake (about 230 cells), Alamar's moat (about 190), the Burning Channel, the Slag Run and the Northern Lava Falls (about 40 cells)."
  water_share: 0.07
  caps:
    - {kind: ash, share: 0.35, where: "the waste, the cinder plains and the flats"}
    - {kind: bare rock, share: 0.25, where: "the peaks, the east ridge, the mesa, the rim cliffs"}
    - {kind: lava crust, share: 0.08, where: round the lava}
  rim: {notes: "The world rim along the whole north (y 24) and west (x 24): a cliff of 1,500-2,000 down to the stars; lava falls over the north rim at x 44 and the west rim at y 51. South (D1) and east (D5) the land runs to the map edge; the roads run out to it."}
atmosphere: "Sky xeendark1 (xeen_darkside_day; A3's Lua sets xeendark3 for Act V until M33, then xeendark1); ash fall on 40 % of days (atmosphere.yml `ash`, A1's word, D-40 (9) 'also D6'); music 11 (A2). The hiss and crack of lava near the lake and the moat; Alamar's low hum; wind on the pass; silence in Necropolis."
