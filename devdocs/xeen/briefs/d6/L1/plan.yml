sightlines:
  - id: view:arrival
    from: zone:griffin_pass
    to: [landmark:alamar, landmark:corak_pod, landmark:north_falls]
    what: "Arrival from D1: the long mountain road tops Griffin Pass and the Forbidden Zone opens below: ash plains falling north, the red glow of Corak's lake right of centre with the pod standing in it, Castle Alamar far north on its mesa ringed by lava, the Ancient field's metal glinting to the right, the lava falls smoking at the rim, ash in the air; Ambrose's camp and griffin at the left."
  - id: view:signature
    from: zone:bone_road
    to: [landmark:corak_pod, landmark:alamar]
    what: "The signature view from the Necropolis road on the lake's south-east shore: Corak's pod nose-up in the glowing lava lake, its hatch on the crust nearest, and beyond it across the moat Castle Alamar's lit walls and cyan energy fields, under the amber day band with ash in the air (WORLD_DESIGN 4: the crashed pods' lava glow)."
set_pieces:
  - id: set:alamar
    kind: scripted
    spaces: [zone:alamar_plateau, zone:alamar_approach]
    rule: "Castle Alamar's outside has two states: whole (every window lit, the energy fields up, the gate's m33.castle_door) until m33.done; then a ruin (model groups swapped: buckled plates, fallen towers, smoke, the fields dark), the gate rubble with the stair to FD-01 in its floor (m39.depths_door), the robots hidden on load after m33.done (m33.robots_gone, D-49 change 7; no refill rule)."
    states: [whole, ruin]
  - id: set:pod_lava
    kind: scripted
    spaces: [zone:pod_crust]
    rule: "The lava round Corak's hatch: hot until m28.lava_cooled (111564), the hatch's fail line; then the lava there is black crust (a basalt face swapped in, the lava's damage off), the hatch opens (m29.pod_door)."
    states: [hot, cooled]
  - id: set:sheltem_pod
    kind: scripted
    spaces: [zone:ancient_field]
    rule: "Sheltem's pod sealed with a line (\"The hatch is fused shut, and something inside is listening.\", A3) until DD-22 exists (phase 6)."
    states: [sealed, open]
