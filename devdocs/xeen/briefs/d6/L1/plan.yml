  - id: town:necropolis
    name: Necropolis
    kind: town
    where: "the east, on a terrace under the east ridge: 18 x 16 cells inside its walls, one gate in the north wall"
    floor: 1650
    purpose: "The city of the dead (WORLD_DESIGN 5.2; A4's d6.yml 4751-4762): a walled necropolis the living enter with a pass (item 12336 from the Head Witch's chest, Q-D22); the gate turns the passless away (A3's hook, A6's event). Inside every house is open: the Dark guild, the Temple of the Dead, the Grave Market, the Embalmer, the Warm Barrel, the mirror, six residences of tombs and mausoleums, DD-21's crypt stair. The map's lines: the Books of the Dead, the barrel \"Food for the dead, keep warm.\", the skull's story."
    safe: true
    keep_clear: [spawns]
    theme: "darkside_town kit in its darkest grade: t09 grey ashlar under xlslate for the guild, the temple and the walls (about 700 high, square towers, battlements, a gatehouse); tombs and mausoleums of MM7 Zokarr's Tomb stone (twb1, twb2, 7tws2) with iron doors, the crypt doors in two leaves (gkp103a / gkp103b); MU-2 D6 ground: road_flagstone in the lanes, mud_cracked (grey) in the yards; black dead trees (MM8 dedltree), bone-white lamps lit all day."
    density: medium
    buildings:
      - {id: building:np_guild, type: house, service: Necropolis Guild, count: 1, doors: 1, footprint_cells: [[3, 3]], notes: "4751: the Dark guild (hours 21-6). Two storeys of t09 ashlar, one window per storey and bay, its door a carved double door as two leaves (double doors)."}
      - {id: building:np_temple, type: house, service: Temple of the Dead, count: 1, doors: 1, footprint_cells: [[4, 3]], notes: "4752: resurrection, cheaper Raise Dead (price 0.7). A domed hall at the square's south side, its bronze doors in two leaves."}
      - {id: building:np_market, type: house, service: The Grave Market, count: 1, doors: 1, footprint_cells: [[3, 2]], notes: "4753: the black-market magic shop (hours 21-6)."}
      - {id: building:np_embalmer, type: house, service: The Embalmer, count: 1, doors: 1, footprint_cells: [[2, 2]], notes: "4754: the alchemist."}
      - {id: building:np_tavern, type: house, service: The Warm Barrel, count: 1, doors: 1, footprint_cells: [[3, 3]], notes: "4755: the tavern for the dead (packs to 30, D-29). The barrel by its wall: \"Food for the dead, keep warm.\" (one spot with the door)."}
      - {id: building:np_houses, type: house, service: residence, count: 6, doors: 1, footprint_cells: [[3, 3], [3, 2], [2, 2], [2, 2], [2, 2], [2, 2]], notes: "4757-4762 in index order: the Necromancers' House (Master Morbius, Q-D23), Count Velkor's Crypt (Vampire GM), the Quiet Tomb (Lady Vex, Dagger GM), the Trapsmith's Vault (Old Bones, Disarm Trap GM), the Gravedigger's (Digby), the Weeping Mausoleum (the Weeping Lady). Tombs with iron doors, one door each."}
