notes: "MU-3 for the phase 5 review (A6, 2026-11-20). Source geography: Darkside A1 (Castle Alamar, the waste and lava, the +2,500 HP waters), A2 (the southern border, the mines, the archer camp), B1 (Griffin Pass, Sheltem's pod, the +100 resistances well), B2 (Necropolis's gate, Corak's pod in lava, the genies, the broken pyramid, the Forbidden Zone sign) (MM5_DARKSIDE_CONTENT 4), moved where the edges and the hooks need: Griffin Pass to the top of D1's mountain road (A3/A4's 'south edge'). Written by level_generation/xeen_art/phase5/d6_brief.py; board level_generation/xeen_art/phase5/d6/board_d6.png. totals.points_of_interest is the render's census (measure.json)."
