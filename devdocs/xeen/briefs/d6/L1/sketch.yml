  - {id: view:signature, at: [82, 72], height: 180, look: [61, 58], purpose: "MU-4 signature view (about 60 degrees): from the lake's east shore by the Necropolis road, looking north-west: Corak's escape pod nose-up in the glowing lava lake left of centre, its hatch on the crust nearest, and beyond the lake and the moat Castle Alamar's lit walls and energy fields on their mesa right of centre, under the amber day band with ash falling."}
