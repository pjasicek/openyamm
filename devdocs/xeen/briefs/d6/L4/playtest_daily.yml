- console:
    line: lua local out = '' for p = 0, 3 do evt.ForPlayer(p) for _, st in ipairs({FireResistanceBonus, AirResistanceBonus, WaterResistanceBonus, EarthResistanceBonus}) do local v = 0 while v < 255 and
      IsAtLeast(st, v + 1) do v = v + 1 end out = out .. v .. '/' end out = out .. ' ' end evt.StatusText('stats ' .. out)
    expect_contains: Lua ran.
- play_lua:
    source: 'local s = string.match(status(), "stats ([%d/ ]+)") if s == nil then error("no stats line") end remember("s1_0", s) log("s1_0: " .. s)'
- note: 'The Well of Warding (event 100): every member +20'
- execute_event:
    id: 100
- advance_runtime:
    seconds: 0.5
- play_lua:
    source: 'local s = status() if not string.find(s, "+20 Fire, Air, Water and Earth resistance until you rest.", 1, true) then error("want +20 Fire, Air, Water and Earth resistance until you rest., status:
      " .. s) end'
- note: 'The Well of Warding again the same day: the refusal line only'
- execute_event:
    id: 100
- advance_runtime:
    seconds: 0.5
- play_lua:
    source: 'local s = status() if not string.find(s, "The well is dry today.", 1, true) then error("want The well is dry today., status: " .. s) end'
- console:
    line: lua local out = '' for p = 0, 3 do evt.ForPlayer(p) for _, st in ipairs({FireResistanceBonus, AirResistanceBonus, WaterResistanceBonus, EarthResistanceBonus}) do local v = 0 while v < 255 and
      IsAtLeast(st, v + 1) do v = v + 1 end out = out .. v .. '/' end out = out .. ' ' end evt.StatusText('stats ' .. out)
    expect_contains: Lua ran.
- play_lua:
    source: 'local s = string.match(status(), "stats ([%d/ ]+)") if s == nil then error("no stats line") end remember("s1_1", s) log("s1_1: " .. s)'
- play_lua:
    source: 'local function parse(s) local m = {} for g in string.gmatch(s, "[%d/]+") do local r = {} for v in string.gmatch(g, "%d+") do r[#r + 1] = tonumber(v) end m[#m + 1] = r end return m end local
      a, b = parse(recall("s1_0")), parse(recall("s1_1")) local names = {"FireResistanceBonus", "AirResistanceBonus", "WaterResistanceBonus", "EarthResistanceBonus"} local bad = "" for m = 1, 4 do for k
      = 1, #names do if b[m][k] - a[m][k] ~= 20 then bad = bad .. " member " .. (m - 1) .. " " .. names[k] .. " " .. a[m][k] .. "->" .. b[m][k] end end end if bad ~= "" then error("The Well of Warding today
      (want +20):" .. bad) end log("The Well of Warding today: +20 for every member")'
