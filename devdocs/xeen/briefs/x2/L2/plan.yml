format: 0
level: L2
pitch: "The hub of Cloudside. Rivercity spans the Great River: two terraced halves over stone quays, joined by a great arched bridge, a busy, crooked, crime-ridden town with every service, the boat and the skill row; the robbers keep their den under the bridge. West lies Lake Darzog, its wooded island crowned by the sealed dark tower of the King's vanished sorcerer, three dragons circling it. North is farmland where evil rangers camp; north-west the ogres hold the river crossings. South the fairy woods, where crazed sprites attack anyone, darken toward the Temple of Yak and the world rim."
purpose: "Act II hub (party 7 to 11): full services, four dungeon doors (XD-21, XD-27, XD-06, XD-12), the road from Vertigo, Medin, Barok, Danulf, Tito, Ligono and Nystor's errands."
mood: "River light and bustle in town; open fields north; green and then gloomy woods south; the tower menacing."
datum: water:sky
