landform:
  notes: "A plateau at about 1,024 cut by the Great River (576) through the middle west to east, its banks at 640; Lake Darzog in the west with a wooded island at 768; hills to about 2,000 in the north-west with the north river's gorge; rolling woods south ending in a cliff of 900 at the world rim (y 104)."
atmosphere: "Fair to cloudy sky by the world's chances; Erathia's music (32) as a stand-in."
