notes: "X2 Rivercity and Lake Darzog, the Cloudside hub, a new map with no original (devdocs/xeen/MAPS.md). Built and played as an MM7 map (world: mm7) until worlds/xeen exists, as X1 is. Stand-ins: slot 1 Killer sprites is MM7's Will o' Wisp family (Dancing Light 15; the dark south end's Wisps 23), slot 2 Evil rangers the Archer family (Archer 9, the camps' Bowmen 19), slot 3 Ogres the Ogre family at tier 2 (Ogre Raider 20; the lair's Ogre Chieftain 28); the three lake dragons are Young Dragons (60). Houses open Steadwick's (Erathia, MM7) house rows and Erathia's residence rows under Rivercity's names; the Skeleton Key is MM7's William's Tower Key 1461 (Xeen item 12100 planned). Written by output/studio_cal/x2/tools/gen.py."
