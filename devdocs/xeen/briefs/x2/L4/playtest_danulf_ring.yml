# Danulf's ring after D-85 (A5, 2026-11-21, hand-written): a fresh load, an Act II party (level 9) set down at the
# ring with no clear; nobody gains a condition in the first 5 s (no sprite marker within 5,888 of Danulf), and Danulf
# (actor 51, NPC 4154) talks. Before D-85 the party was cursed and stoned within 2-16 s (A3-promo, probe 03).
id: xeen.x2.l4.danulf_ring
title: 'X2 Danulf''s ring: no sprite reaches the party in the first 5 s, and Danulf talks (D-85)'
