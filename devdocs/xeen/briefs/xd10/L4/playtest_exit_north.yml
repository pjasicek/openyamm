# The north mouth's way out to X5 (XD-10, L4): from just inside the mouth the party clicks the daylight in its north
# wall ("Leave the Cave of Illusion?", aaze0042:49), takes OK and arrives on X5 (xeen_x5.odm, A6) at (16640, 9987,
# 1408) facing south, before the mouth by the frozen lake. Run with --world xeen --map xeen_xd10.blv.
id: xeen.xd10.l4.exit_north
title: Cave of Illusion (XD-10 L4), out of the north mouth to X5
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_xd10.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 18, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 18, skills: [], equipment: {}}
  - assert: {map: xeen_xd10.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - advance_runtime: {seconds: 2, present_dialogs: true}
  - play_lua: {source: "close(); clear_hostiles(3000)"}
  - walk_to: {x: 0, y: 9850, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - execute_event: {id: 9}
  - assert: {dialog: {text_contains: "Cave of Illusion"}}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.0, follow_map_move: true}
  - assert: {map: xeen_x5.odm}
  - assert: {party_position: {x: 16640, y: 9987, radius: 128, z_min: 1300, z_max: 1520}}
