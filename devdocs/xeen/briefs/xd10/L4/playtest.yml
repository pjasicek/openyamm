# Playtest of the Cave of Illusion (XD-10, L4): the critical path through every mechanism, the key and back.
# A level-18 party (Might 15 each) arrives in the north mouth (the arrival window: why it is here), touches the
# mouth's west wall (a mirage: it dissipates), loots the cache (the Potion of Might at power 10 into the hand, once per
# game: D-22.2; a second opening gives none), passes the phantom safe (a click:
# the hand passes through) and opens its mirage by a click, crosses the icicle hall, the Hall of Mirages and the frost
# cavern, buys +2 Luck from the upper skull with three granted gems (once: a second click says so), opens the sluice's
# door, is refused by the plug (Might 15), drinks the potion (Might 45), pulls the plug (the water sinks, the
# three sluice gates open, plug_pulled), goes down the ice stair to the ledge, reads the notice, crosses the mirror
# maze, touches its mirage into the deep skulls (no gems yet: the skull says nothing), takes the Guardians' post's
# chest and the echo cave's 15 gems, buys +3 Intellect (5 gems), goes down the steps through their gate onto the
# drained bed (the reservoir's hidden monsters appear), buys the Enchanted Key from the great skull (10 gems: A3's
# hook m12.skull, qbit 111240), then with 10 granted gems takes +5 Endurance from the great skull's three-answer
# question (once per character), touches the grotto's mirage, loots the phantom vault, goes back over the bed to the
# wreck's strongbox and the sump, up the gallery stair through its gate into the drowned gallery and out through its
# gate onto the ledge. Numbers are ids.lock.yml's (events, doors). Run with --world xeen --map xeen_xd10.blv
# (output/studio_cal/xd10/four.sh).
id: xeen.xd10.l4.walk
title: Cave of Illusion (XD-10 L4), the plug, the drained bed and the great skull's key
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_xd10.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 18, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 18, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 18, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 18, skills: [], equipment: {}}
  - assert: {map: xeen_xd10.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - advance_runtime: {seconds: 3, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "THE CAVE OF ILLUSION"}}
  - assert: {dialog: {text_contains: "talking skull sells the key"}}
  - play_lua: {source: "close(); wait(0.5); if not qbit(110641) then error('arrived_once not set') end"}
  # The north mouth's west wall: a mirage, touched (the party walks into it: merge point 13's `touch`).
  - play_lua: {source: "if door_state(4) ~= 'closed' then error('the cache mirage is open at the start') end"}
  - walk_to: {x: -380, y: 9472, z: 0, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1000, y: 9472, z: 0, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "wait(0.5); if door_state(4) ~= 'open' then error('the touched mirage did not open: ' .. door_state(4)) end"}
  - assert: {state_dump_map_var: {index: 2, value: 1}}
  # The cache behind it: the Potion of Might.
  - walk_to: {x: -1100, y: 9472, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  # D-22.2: the first opening puts the Potion of Might (power 10) in the hand, once per game (qbit 110642).
  - play_lua:
      source: |
        if qbit(110642) then error("cache_potion set before the cache was opened") end
        loot_chest(3)
        if held() ~= 240 then error("the cache gave no Potion of Might into the hand: " .. tostring(held())) end
        if not qbit(110642) then error("cache_potion not set") end
        if not stow() then error("the potion fits nobody's pack") end
        if item_count(240) ~= 1 then error("not one Might Boost: " .. item_count(240)) end
        close(); wait(0.5)
        click(3); wait(1)
        if held() ~= 0 then error("a second opening gave " .. tostring(held())) end
        close(); wait(0.5)
        if item_count(240) ~= 1 then error("a second opening gave another Might Boost") end
  # The phantom safe's cave: the safe is not there; its north wall (a mirage) opens to a click.
  - walk_to: {x: -1344, y: 9200, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        status()
        click(18); wait(0.5)
        local seen = status()
        if not string.find(seen, "The mirage dissipates with your touch.", 1, true) then error("no mirage line: " .. seen) end
        if door_state(6) ~= "open" then error("the clicked mirage did not open: " .. door_state(6)) end
  - walk_to: {x: -1344, y: 8400, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1600, y: 7800, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        status()
        click(24); wait(0.5)
        local seen = status()
        if not string.find(seen, "Your hand passes through the safe", 1, true) then error("the safe said: " .. seen) end
  # The icicle hall, the Hall of Mirages, the frost cavern.
  - walk_to: {x: -1100, y: 8064, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 128, y: 7900, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 64, y: 6600, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 256, y: 4500, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - walk_to: {x: 256, y: 3200, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  # The upper skulls: +2 Luck for 3 gems, once per character. The cache's two random rolls may be gems: dropped first,
  # so the gem counts below are the map's own.
  - lua_event:
      source: |
        local gems = {177, 178, 179, 180, 181, 182, 183, 184, 185, 186, 988, 989, 990, 991, 992, 993, 994, 995, 996, 997,
          998, 2056, 2057, 2058, 2059, 2060, 2061, 2062, 2063}
        for _, p in ipairs(PartyMembers()) do
          for _, id in ipairs(gems) do
            while PlayerItemCount(p, id) > 0 do RemovePlayerItem(p, id, 1) end
          end
        end
  - walk_to: {x: -1450, y: 3200, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - grant_item: {item_id: 177, member_index: 0}
  - grant_item: {item_id: 178, member_index: 0}
  - grant_item: {item_id: 179, member_index: 0}
  - lua_event: {source: "SetValue(BaseLuck, 10)"}
  - play_lua: {source: "click(27); wait(0.5)"}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "+2 Luck"}}
  - play_lua: {source: "close(); if item_count(177) + item_count(178) + item_count(179) > 0 then error('the skull took no gems') end"}
  - lua_event: {source: "if not IsAtLeast(BaseLuck, 12) or IsAtLeast(BaseLuck, 13) then error('Luck is not 12') end"}
  - play_lua: {source: "click(27); wait(1)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "had yours"}}
  - play_lua: {source: "close()"}
  # The sluice: the plug refuses Might 15; the Potion of Might; the plug drains the reservoir.
  - walk_to: {x: 1000, y: 3072, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "open_door(30, 8)"}
  - walk_to: {x: 1600, y: 3072, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: 1720, y: 2944, z: 0, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        status()
        click(23); wait(1)
        local seen = status()
        if not string.find(seen, "You aren't strong enough to pull the plug.", 1, true) then error("the plug said: " .. seen) end
        if qbit(110640) then error("the plug was pulled by Might 15") end
  - use_item: {item_id: 240, member_index: 0}
  - play_lua:
      source: |
        local p = party()
        log(p)
        if not string.find(p, "Brokk (might 45,", 1, true) then error("the power-10 potion did not give +30 Might: " .. p) end
        click(23); wait(1)
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "roars away down the"}}
  - play_lua:
      source: |
        close(); wait(7)
        if not qbit(110640) then error("plug_pulled not set") end
        for _, d in ipairs({1, 2, 3, 9, 10}) do
          if door_state(d) ~= "open" then error("the drain left door " .. d .. " " .. door_state(d)) end
        end
        status(); click(23); wait(0.5)
        local seen = status()
        if not string.find(seen, "hangs free", 1, true) then error("the pulled plug said: " .. seen) end
  # Down the ice stair to the ledge; the notice.
  - walk_to: {x: 1000, y: 3072, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1100, y: 6500, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 1344, y: 7200, z: -40, z_tolerance: 120, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2432, y: 7296, z: -400, z_tolerance: 300, radius: 80, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2400, y: 6000, z: -640, z_tolerance: 120, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1950, y: 5056, z: -640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(22); wait(0.5)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "KEEP TEN"}}
  - play_lua: {source: "close()"}
  # The mirror maze; its mirage into the deep skulls (touched); no gems: the skull says nothing.
  - walk_to: {x: 1500, y: 5760, z: -640, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - walk_to: {x: 704, y: 6000, z: -640, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 704, y: 6112, z: -640, radius: 32, timeout_seconds: 10, clear_hostiles: 1500, close_dialogs: true}
  # Walk north into the mirage (merge point 13's touch).
  - movement_segment: {input: forward, seconds: 1.5, start: {map: xeen_xd10.blv, x: 704, y: 6112, z: -640, yaw_degrees: 90, pitch: 0}, expect_stop: {map: xeen_xd10.blv, x: 704, y: 6412, z: -640, yaw_degrees: 90, pitch: 0}, loose_tolerance: true, tolerance_xy: 1000, tolerance_z: 400}
  - play_lua: {source: "wait(0.5); if door_state(5) ~= 'open' then error('the maze mirage did not open: ' .. door_state(5)) end"}
  - walk_to: {x: 640, y: 6750, z: -640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(26); wait(0.5)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "says nothing at all"}}
  - play_lua: {source: "close()"}
  # The Guardians' post and its chest; the echo cave's 15 gems.
  - walk_to: {x: 704, y: 6000, z: -640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -576, y: 5632, z: -640, radius: 64, timeout_seconds: 40, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - walk_to: {x: -576, y: 6150, z: -640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "loot_chest(6)"}
  - lua_event:
      source: |
        local gems = {177, 178, 179, 180, 181, 182, 183, 184, 185, 186, 988, 989, 990, 991, 992, 993, 994, 995, 996, 997,
          998, 2056, 2057, 2058, 2059, 2060, 2061, 2062, 2063}
        for _, p in ipairs(PartyMembers()) do
          for _, id in ipairs(gems) do
            while PlayerItemCount(p, id) > 0 do RemovePlayerItem(p, id, 1) end
          end
        end
  - walk_to: {x: -576, y: 4300, z: -640, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: -576, y: 3850, z: -640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        loot_chest(4)
        local n = 0
        for id = 177, 186 do n = n + item_count(id) end
        if n ~= 15 then error("the echo cave gave " .. n .. " gems") end
  # Back to the deep skulls: +3 Intellect for 5 gems.
  - walk_to: {x: -576, y: 5632, z: -640, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 704, y: 6000, z: -640, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 640, y: 6750, z: -640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - lua_event: {source: "SetValue(BaseIntellect, 10)"}
  - play_lua: {source: "click(26); wait(0.5)"}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "+3 Intellect"}}
  - play_lua: {source: "close()"}
  - lua_event: {source: "if not IsAtLeast(BaseIntellect, 13) or IsAtLeast(BaseIntellect, 14) then error('Intellect is not 13') end"}
  # Down the steps through their gate onto the drained bed: the reservoir's six (hidden under the water until now)
  # appear the first time the party steps onto the bed (D-18 (c), map variable bed_revealed), stand on the bed, are
  # hostile, and stay shown after a save and a reload.
  - console: {line: "actor remaining", expect_contains: "-1280, "}
  - console: {line: "actor remaining", expect_contains: "hidden"}
  - walk_to: {x: 704, y: 6000, z: -640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2240, y: 4200, z: -640, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2240, y: 3000, z: -1000, z_tolerance: 300, radius: 80, timeout_seconds: 30, clear_hostiles: 1200, close_dialogs: true}
  - walk_to: {x: 2600, y: 2496, z: -1280, z_tolerance: 120, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - console: {line: "actor remaining", expect_contains: "hidden"}
  - assert: {state_dump_map_var: {index: 6, value: 0}}
  - walk_to: {x: 3000, y: 2496, z: -1280, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "wait(1)"}
  - assert: {party_position: {x: 3000, y: 2496, radius: 96, z_min: -1300, z_max: -1240}}
  - assert: {state_dump_map_var: {index: 6, value: 1}}
  - console: {line: "actor remaining", expect_not_contains: "hidden"}
  - assert: {actor_count: {monster_id: 11591, hostile: false, max: 0}}
  - assert: {actor_count: {monster_id: 11600, hostile: false, max: 0}}
  - save_game: {name: xd10_bed}
  - load_game: {name: xd10_bed}
  - advance_runtime: {seconds: 1}
  - console: {line: "actor remaining", expect_not_contains: "hidden"}
  - assert: {state_dump_map_var: {index: 6, value: 1}}
  - walk_to: {x: 4032, y: 2496, z: -1280, radius: 64, timeout_seconds: 30, clear_hostiles: 3000, close_dialogs: true}
  - clear_hostiles: {radius: 4000}
  # The grotto: the great skull's key; then the three-answer question (+5 Endurance), once per character.
  - walk_to: {x: 5900, y: 3328, z: -1280, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 6900, y: 3328, z: -1280, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - play_lua: {source: "click(25); wait(0.5)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - play_lua: {source: "local s = tostring(status()); if not string.find(s, [[the key to the Archmage's study]], 1, true) then error('status line: ' .. s) end"}
  - play_lua:
      source: |
        close()
        if not has_item(12306) then error("no Enchanted Key") end
        if not qbit(111240) then error("key_bought not set") end
        local n = 0
        for id = 177, 186 do n = n + item_count(id) end
        if n ~= 0 then error(n .. " gems left after the key") end
  - grant_item: {item_id: 180, member_index: 1}
  - grant_item: {item_id: 180, member_index: 1}
  - grant_item: {item_id: 181, member_index: 1}
  - grant_item: {item_id: 181, member_index: 1}
  - grant_item: {item_id: 182, member_index: 1}
  - grant_item: {item_id: 182, member_index: 1}
  - grant_item: {item_id: 183, member_index: 1}
  - grant_item: {item_id: 183, member_index: 1}
  - grant_item: {item_id: 184, member_index: 1}
  - grant_item: {item_id: 184, member_index: 1}
  - lua_event: {source: "SetValue(BaseEndurance, 10)"}
  - play_lua: {source: "click(25); wait(0.5)"}
  - answer_input: {text: "Endurance"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "+5 Endurance"}}
  - play_lua: {source: "close()"}
  - lua_event: {source: "if not IsAtLeast(BaseEndurance, 15) or IsAtLeast(BaseEndurance, 16) then error('Endurance is not 15') end"}
  - play_lua: {source: "click(25); wait(0.5)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "had yours"}}
  - play_lua: {source: "close(); if not has_item(12306) then error('the key is gone') end"}
  # The grotto's mirage (touched) and the phantom vault's hoard.
  - walk_to: {x: 6784, y: 3800, z: -1280, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 6784, y: 3936, z: -1280, radius: 32, timeout_seconds: 10, clear_hostiles: 1500, close_dialogs: true}
  # Walk north into the mirage (merge point 13's touch).
  - movement_segment: {input: forward, seconds: 1.5, start: {map: xeen_xd10.blv, x: 6784, y: 3936, z: -1280, yaw_degrees: 90, pitch: 0}, expect_stop: {map: xeen_xd10.blv, x: 6784, y: 4236, z: -1280, yaw_degrees: 90, pitch: 0}, loose_tolerance: true, tolerance_xy: 1000, tolerance_z: 400}
  - play_lua: {source: "wait(0.5); if door_state(7) ~= 'open' then error('the grotto mirage did not open: ' .. door_state(7)) end"}
  - walk_to: {x: 6784, y: 4700, z: -1280, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: 6784, y: 4850, z: -1280, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "loot_chest(5)"}
  # Back over the bed to the wreck and the sump; up the gallery stair into the drowned gallery and onto the ledge.
  - walk_to: {x: 6400, y: 3328, z: -1280, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 3100, y: 1792, z: -1280, radius: 64, timeout_seconds: 40, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 2200, y: 1792, z: -1280, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: 2048, y: 1300, z: -1280, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "loot_chest(7)"}
  - walk_to: {x: 700, y: 1536, z: -1280, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: 1408, y: 2100, z: -1280, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1408, y: 3700, z: -640, z_tolerance: 120, radius: 64, timeout_seconds: 40, clear_hostiles: 2000, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - walk_to: {x: 1500, y: 4352, z: -640, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2200, y: 4352, z: -640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - assert: {map: xeen_xd10.blv}
