format: 0
variables: [mirage_safe, mirage_cache, mirage_maze, mirage_vault, bed_revealed]
events:
  - id: evt:arrive
    preset: script
    trigger: timer
    every: 1
    condition: {not: {qbit: arrived_once}}
    once: true
    effects:
      - message: "THE CAVE OF ILLUSION. Warm, wet breath blows out of the ice into your faces. Artemus was plain about it: somewhere deep in this cave a talking skull sells the key to the Tower of High Magic, and skulls take gems, not gold. Mind the walls here: not all of them are there."
      - qbit: arrived_once
    notes: "Say why the party is here (M12: the talking skull's key, for gems), on the first arrival only (arrived_once 110641)."
  - id: evt:bed_walked
    preset: script
    source: room:reservoir
    trigger: step
    condition: {qbit: plug_pulled, not: {map_var: bed_revealed}}
    effects:
      - show_actors: 10
      - set:
          var:
            map_var: bed_revealed
          value: 1
    text: Shapes stir in the silt of the drained bed.
    notes: "D-18 (c): the reservoir's six (placed hidden under the water, group 10, about 1,200 from the steps' and the wreck's ways onto the bed) appear the first time the party steps onto the drained bed, from any side; guarded by the map variable bed_revealed (a refill resets it with the actors)."
  - id: evt:chest_cache
    preset: chest
    source: chest:cache
    title: Chest
    effects:
      - lua: "if not IsQBitSet(QBit(110642)) then SetQBit(QBit(110642)) evt.SetHeldItem(240, {bonus = 10}) evt.StatusText(\"A flask of red draught lies on top.\") end"
    notes: "D-22.2: the Potion of Might at a fixed power 10 (+30 Might: any member reaches the plug's 30), given once per game on the cache's first opening (map qbit cache_potion 110642); the chest holds no random Might Boost."
  - id: evt:chest_gems
    preset: chest
    source: chest:gems
    title: Chest
  - id: evt:chest_hoard
    preset: chest
    source: chest:hoard
    title: Chest
  - id: evt:chest_post
    preset: chest
    source: chest:post
    title: Chest
  - id: evt:chest_wreck
    preset: chest
    source: chest:wreck
    title: Chest
  - id: evt:drained_load
    preset: switch
    trigger: load
    condition: {qbit: plug_pulled}
    opens: [mover:plug, mover:water, door:gate_drowned, door:gate_steps, door:gate_wreck]
    notes: "After a refill the doors and movers start as built: the pulled plug's water stays gone."
  - id: evt:exit_north
    preset: exit
    source: exit:north
    title: Leave the Cave of Illusion
    notes: "'Leave the Cave of Illusion?' (aaze0042:49): to X5 before the north mouth."
  - id: evt:exit_south
    preset: exit
    source: exit:south
    title: Leave the Cave of Illusion
    notes: "'Leave the Cave of Illusion?' (aaze0042:49): to X5's Troll Forest side."
  - id: evt:gate_drowned
    preset: door
    source: door:gate_drowned
    title: Sluice gate
    condition: {qbit: plug_pulled}
    locked_text: The stone sluice gate is shut fast. Water presses against it from the other side.
    action: open
    notes: "The stone sluice gate before the drowned gallery: the plug opens it."
  - id: evt:gate_steps
    preset: door
    source: door:gate_steps
    title: Sluice gate
    condition: {qbit: plug_pulled}
    locked_text: The stone sluice gate is shut fast. Water presses against it from the other side.
    action: open
    notes: "The stone sluice gate before the steps to the reservoir bed: the plug opens it."
  - id: evt:gate_wreck
