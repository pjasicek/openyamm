  - id: evt:notice
    preset: text
    source: panel:notice
    title: Notice
    text: "A board, the words scratched deep: 'THE SKULLS TAKE GEMS, NOT GOLD. THE GREAT ONE AT THE BOTTOM WANTS TEN FOR HIS KEY - KEEP TEN. THE ECHO CAVE PAST THE GUARDIANS' POST KEEPS SOME. THE PLUG IN THE SLUICE LETS THE WATER OUT, IF YOU ARE STRONG.'"
    window: true
    notes: "poi:notice: gems before the great skull (D-1.6), plainly."
  - id: evt:plug
    preset: switch
    source: mover:plug
    title: Bronze plug
    condition: {stat: {name: ActualMight, at_least: 30}, not: {qbit: plug_pulled}}
    opens: [mover:plug, mover:water, door:gate_drowned, door:gate_steps, door:gate_wreck]
    sets: {qbit: plug_pulled}
    effects:
      - lua: "evt.PlaySoundName(\"xeen_reservoir_drain\", 2048, 2944, 0)"
      - message: "You set your feet and heave on the chain. The bronze plug comes up out of its pool with a sucking roar, and through the window the black water of the reservoir begins to sink. The water roars away down the sump; somewhere below, stone gates grind open."
    else_effects:
      - lua: "if IsQBitSet(QBit(110640)) then evt.StatusText(\"The plug hangs free on its chain. Below the window the reservoir lies empty.\") else evt.StatusText(\"You aren't strong enough to pull the plug. A stronger arm, or a potion of Might, might shift it.\", 6) end"
    notes: "poi:plug (D-4 item 3): Might 30 on the pulling member, potions counting (ActualMight); 'You aren't strong enough to pull the plug.' (aaze0042:23) and A3's hint (a stronger arm or a Might potion, 2026-11-22). Pulled once: plug_pulled, the water sinks, the three gates open."
  - id: evt:safe
    preset: text
    source: platform:safe
    title: Safe
    text: Your hand passes through the safe as though it were not there.
    notes: "poi:safe: the phantom safe (aaze0042:72); not a chest."
  - id: evt:skull_great
    preset: script
    source: deco:skull_great
    title: Great skull
    lua: |-
      if not IsQBitSet(QBit(111240)) then
          XeenQuests.hook("m12.skull")
          return
      end
      if IsPlayerBitSet(PlayerBit(11240)) then
          XeenQuests.hook("m12.skull_sold")
          return
      end
      if continueStep ~= nil and continueStep >= 1 and continueStep <= 3 then
          if Xeen.payGems(10) then
              local stat = "Might"
              if continueStep == 1 then
                  AddValue(BaseMight, 5)
              elseif continueStep == 2 then
                  AddValue(BaseEndurance, 5)
                  stat = "Endurance"
              else
                  AddValue(BaseAccuracy, 5)
                  stat = "Accuracy"
              end
              SetPlayerBit(PlayerBit(11240))
              evt.SimpleMessage("The great skull takes ten of your gems and grins wider. +5 " .. stat .. " (permanent).")
          else
              XeenQuests.hook("m12.skull_poor")
          end
          return
      end
      if continueStep ~= nil then
          return
      end
      if Xeen.gemCount() < 10 then
          XeenQuests.hook("m12.skull_poor")
          return
      end
      XeenQuests.hook("m12.skull_grotto")
      AskChoiceWithAnswerSteps(eventId, 5, "Ten gems for +5 to Might, Endurance or Accuracy?", {{Answer = "Might", Step = 1}, {Answer = "Endurance", Step = 2}, {Answer = "Accuracy", Step = 3}})
    notes: "goal:enchanted_key: A3's hook m12.skull (10 gems: the Enchanted Key, qbit 111240, 1,500 XP); after it one question with three answers (D-18's cheaper option): +5 Might, Endurance or Accuracy for 10 gems, once per character (bit 11240)."
