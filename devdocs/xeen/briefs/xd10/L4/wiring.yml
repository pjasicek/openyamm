  - id: evt:mirage_cache
    preset: door
    source: door:mirage_cache
    touch: true
    title: Cave wall
    action: open
    effects:
      - set:
          var:
            map_var: mirage_cache
          value: 1
    text: The mirage dissipates with your touch.
    notes: "A mirage (D-4 item 1): a click or a touch opens it at once. Original line (aaze0042:24)."
  - id: evt:mirage_maze
