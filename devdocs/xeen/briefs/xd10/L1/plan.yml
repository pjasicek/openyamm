format: 0
level: L1
pitch: "A cold cave under the Winterkill Tundra that breathes warm and wet: ice at its two mouths, grey wet rock below, and walls that are not there. A great bronze plug in a brick sluice holds back the reservoir that drowns the lower caves; pulled (by a strong arm, or one helped by the Potion of Might behind the phantom safe's mirage) the water sinks away in a few seconds, seen from the railed ledge and the sluice's window, and the stone sluice gates open on the drowned gallery and the steps to the reservoir bed. At the bottom a great talking skull sells the Enchanted Key to the Tower of High Magic for ten gems; smaller skulls sell stat rises; the echo cave keeps fifteen gems on the way down."
purpose: "Story step M12 (QUESTS.md): the Enchanted Key from the great skull (A3's hook m12.skull: 10 gems, the key 12306, qbit 111240, 1,500 XP). Once-per-character stat rises for gems (D-4 item 4). Class M, party 17-19, monsters 18-28."
mood: "Cold and wet: grey-blue rock, ice and snow at the mouths, dripping water, mirages that ripple like heat haze; the reservoir a black water far below the railing, later a bed of weed and silt."
datum: arrival
