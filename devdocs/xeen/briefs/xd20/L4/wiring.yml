    every: 1
    once: true
    text: "A passage through the cliff. Ahead, the Hall of the War Games, where the Arena Master takes challenges."
    seconds: 6
    notes: The errand on arrival (the build's rule for a new dungeon).
  - id: evt:bones_ne
    preset: text
