format: 0
start:
  room: room:porch
  at: [0, 384]
  facing: 90
  notes: "Inside the temple door from the fairy woods, facing in."
doors:
  - id: door:hidden_cell
    opening: open:dorm_cell
    kind: slide_down
    surface: {texture: t6s1bs, size: [128, 256]}
    secret: true
    notes: "A secret door in the dormitory's west wall: the wall's own brick, flagged secret (it pulses for a perceptive party)."
  - id: door:master_cell
    opening: open:master_cell
    kind: slide_up
    surface: {texture: t5d1, size: [128, 256], scale: 1.5}
  - id: door:master_door
    opening: open:vestry_master
    kind: slide_up
    fold: true
    surface: {texture: t4s1fl, size: [128, 128]}
    back_surface: {texture: t4s1fl, size: [128, 128]}
    tile: true
    notes: "The Master's door at the top of his stair: a plain slab of the sanctum's stone, no ring on the vestry side."
  - id: door:narthex_e
    opening: open:narthex_e
    kind: slide_up
    surface: {texture: t5d1, size: [128, 256], scale: 1.5}
  - id: door:narthex_w
    opening: open:narthex_w
    kind: slide_up
    surface: {texture: t5d1, size: [128, 256], scale: 1.5}
  - id: door:reliquary
    opening: open:reliquary
    kind: slide_up
    fold: true
    surface: {texture: t6s1c, size: [128, 128]}
    tile: true
    notes: "The reliquary's slab behind the altar, carved in the temple's coffer squares so that it reads as a sealed door against the green-black wall; held by the Yak Master's will, it rises when he dies."
  - id: door:sanctum_doors
    opening: open:sanctum_doors
    kind: slide_up
    surface: {texture: t5d1, size: [128, 256], scale: 1.75}
    notes: The sanctum's double door.
  - id: door:treasury_gate
    opening: open:treasury_gate
    kind: slide_up
    surface: {texture: t5d1, size: [128, 256], scale: 1.75}
    notes: The treasury gate behind its two iron bars.
  - id: door:yak_door
    opening: open:yak_door
    kind: slide_up
    surface: {texture: t5d1, size: [128, 256], scale: 2}
    notes: "The temple's inner door, iron-bound (d04's t5d1), folding up into its lintel."
