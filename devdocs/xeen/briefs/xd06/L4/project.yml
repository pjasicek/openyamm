notes: "Xeen design brief, level L4: the Temple of Yak built with the studio's words, a playable map (NOTES.md). Story step M10 (King's Megacredits for Newcastle) and Q-C12 (Mirabeth's Elixir of Restoration): devdocs/xeen/QUESTS.md. The Xeen world has no package, monsters or items yet, so this L4 is built and played as an MM7 map, as XD-01 to XD-05 are: `world: mm7` until worlds/xeen exists. Stand-ins: slot 1 Cultists (Yak Priest 20) is MM7's Moon clerics at tier b (Cleric of the Moon 20), slot 2 Skeletons (16) the Skeleton Warrior family at tier c (Skeleton Lord 14), slot 3 the source's Yak Liches MM7's Lich (A, 20); the Yak Elders (28) MM7's Necromancer (307, 25), the Yak Master (35) Speaker for the Dead (308, 35) with three times his hit points and a name. Items: the Elixir of Restoration 12191 is MM7's Elixir (1431), the King's Megacredit 12192 MM7's Floor Tile with the moon insignia (1438: a round carved disc, the nearest picture to a minted credit). Quest bits 110400-110402 (the map's range 110400-110469). Music: MM7 track 28 (the Temple of the Moon's). door:x2_woods leads to X2 at DOORS.md's final arrival (-1024, -17840, 1053, facing north)."
