format: 0
level: L2
pitch: "An ancient temple of the evil clerics of Yak, backed into a rise at the dark south end of the fairy woods, opened by Mirabeth's Yak Stone. Above, a temple of brick and red torchlight: a narthex, a pillared nave where Yak's idol glowers from its dais, chapels, the clerics' dormitory and refectory, their library and vestry, and behind the idol a treasury gate held by two iron bars whose buttons lie apart. Below, crypts and a bone-house lead to a cave flooded by the Yak Pool, green, bubbling and sickening; three buttons on its shore raise a causeway of stone blocks out of the water, if set right. Beyond it the liches' crypt and the sanctum, where the Yak Master guards the reliquary of the Elixir of Restoration; his own stair climbs back up to the vestry."
purpose: "Story step M10 (King's Megacredits for Newcastle's walls: the first five of the fifteen come from here) and Mirabeth's quest Q-C12 (the Elixir of Restoration). A return visit on X2 at party level 14 to 16, like MM6's Gharik's Forge: clerics, skeletons and liches of levels 14 to 28, the Yak Master 35. Two switch puzzles worked out in the game (the treasury's two bars, the pool's causeway), a pool that sickens, the Elixir. About 30 minutes."
mood: "A cult's house that still works: red torchlight on old brick, the idol's glow, the clerics' beds and books in use. Below, cold rock and bones, then the pool's sick green light and its stench, then the green-black sanctum lit red over the altar. The deeper the party goes, the darker and quieter."
