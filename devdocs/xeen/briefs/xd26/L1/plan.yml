    notes: The high ledge's lip over the shaft.
  - id: link:hoist_high
    from: room:hoist_foot
    to: room:high_ledge
    kind: lift
    condition: {qbit: hoist_winched}
    notes: "hoist: winch. The fence's hoist (D-17): it hangs at the high ledge until the winch in the fence's cache lowers it; then its deck or a call rope at either stop sends it."
  - id: link:ledgee_fence
    from: room:ledge_e
    to: room:fence_cache
    kind: door
    motion: slide
  - id: link:ledgee_hoist
    from: room:ledge_e
    to: room:hoist_foot
    kind: open
  - id: link:ledgelow_ledgew
    from: room:ledge_low
    to: room:ledge_w
    kind: ladder
  - id: link:ledgelow_nests
    from: room:ledge_low
    to: room:low_nests
    kind: open
  - id: link:ledgew_bridge
    from: room:ledge_w
    to: zone:bridge
    kind: open
  - id: link:mouth_shaft
    from: room:mouth
    to: room:shaft_floor
    kind: open
  - id: link:nests_ledgew
    from: room:low_nests
    to: room:ledge_w
    kind: ramp
    notes: By the rock ramp (its own room).
  - id: link:roost_crack
    from: room:roost
    to: room:sky_crack
    kind: open
  - id: link:shaft_ledgelow
    from: room:shaft_floor
    to: room:ledge_low
