  - id: room:ledge_w
    name: West ledge
    kind: room
    size: M
    floor: 1024
    purpose: "Where the climb from below arrives; the rope bridge starts."
    population:
      - {slot: 1, groups: 1, per_marker: [2, 3], levels: [16, 16], notes: About 3 gargoyles (rank a).}
  - id: room:low_nests
    name: Low nests
    kind: room
    size: M
    floor: 512
    purpose: "Young gargoyles; a rock ramp climbs on to the west ledge."
    population:
      - {slot: 1, groups: 1, per_marker: [2, 3], levels: [16, 16], notes: About 3 gargoyles (rank a).}
  - id: room:mouth
    name: Cave mouth
    kind: room
    size: S
    floor: 0
    purpose: "From the bare peaks of the Gargoyle Range; droppings and bones."
    empty: true
  - id: room:rock_ramp
    name: Rock ramp
    kind: corridor
    size: S
    floor: 512
    purpose: The ramp from the low nests up to the west ledge.
    empty: true
  - id: room:roost
    name: Matriarch's roost
    kind: room
    size: L
    floor: 2048
    purpose: "The great nest: the Scarab of Imaging among stolen silver."
    population:
      - {slot: 1, groups: 1, per_marker: [2, 3], levels: [28, 28], notes: About 6 gargoyles (rank c).}
  - id: room:shaft_floor
    name: Shaft floor
    kind: room
    size: L
    floor: 0
    purpose: "The bottom of the vertical cave: every ledge seen from here; gargoyles dive from above."
    population:
      - {slot: 1, groups: 1, per_marker: [2, 3], levels: [16, 16], notes: About 5 gargoyles (rank a).}
  - id: room:sky_crack
