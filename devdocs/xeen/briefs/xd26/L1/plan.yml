    purpose: "Across the open shaft, 1,024 above its floor; step off where the rail is torn and you fall."
    population:
      - {slot: 1, groups: 1, per_marker: [2, 3], levels: [22, 22], notes: About 3 gargoyles (rank b).}
links:
  - id: link:bridge_drop
    from: zone:bridge
    to: room:shaft_floor
