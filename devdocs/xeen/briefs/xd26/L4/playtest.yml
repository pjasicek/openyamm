# Playtest of the Gargoyle Eyrie (XD-26, L4): the cave mouth to the roost and down again by the drops and the fall. A
# level-15 party arrives in the cave mouth (the arrival from X4's door:xd26, the map's start), climbs the ladder from
# the shaft floor to the first ledge (down from its top and up again), takes the ladder to the west ledge and back down,
# goes round by the low nests and the rock ramp, crosses the rope bridge to the east nests, finds the fence's hoist
# hanging at the high ledge (its call rope refuses), opens the fence's door (its tags, its strongbox), turns the winch
# (the hoist comes down; hoist_winched 110880), rides the hoist up, down and up (D-17), sends it down and back with the
# top call rope, then on the high ledge parts the hanging moss to the hidden ledge (the dead climber's pack), climbs the
# roost ladder, takes the Scarab of Imaging from the great nest (A3's hook q-c10.scarab: 12312 once, scarab_found
# 112202; then "The chest is empty."), the roost's hoard, climbs down, drops 512 from the high ledge to the west ledge,
# walks off the bridge where its rail is torn (a fall of 1,024 to the shaft floor) and walks back to the mouth. Numbers
# are ids.lock.yml's (the two exits to X4 are playtest_exit.yml's): events (click), doors (door_state), chest events
# (loot_chest), map variables (state_dump_map_var).
id: xeen.xd26.l4.walk
title: Gargoyle Eyrie (XD-26 L4), the cave mouth to the roost and down by the drop and the fall
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_xd26.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 15, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 15, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 15, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 15, skills: [], equipment: {}}
  - assert: {map: xeen_xd26.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - assert: {party_position: {x: 1344, y: -1000, radius: 64, z_min: -8, z_max: 8}}
  - advance_runtime: {seconds: 3}
  - assert: {state_dump_map_var: {index: 0, value: 1}}
  # Into the shaft; its gargoyles.
  - walk_to: {x: 1344, y: -300, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1344, y: 300, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - assert: {state_dump_map_var: {index: 3, value: 1}}
  # Up the ladder on the shaft's west wall to the first ledge, down from its top and up again.
  - walk_to: {x: 110, y: 448, z: 0, radius: 40, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - climb: {ladder: ledge_low, timeout_seconds: 30}
  - assert: {party_position: {x: -192, y: 448, radius: 100, z_min: 504, z_max: 520}}
  - clear_hostiles: {radius: 4000}  # gargoyles block the ledges at random (orchestrator, MP42)
  - climb: {ladder: ledge_low, down: true, timeout_seconds: 30}
  - assert: {party_position: {x: 100, y: 448, radius: 150, z_min: -8, z_max: 8}}
  - climb: {ladder: ledge_low, timeout_seconds: 30}
  - assert: {party_position: {x: -192, y: 448, radius: 100, z_min: 504, z_max: 520}}
  - walk_to: {x: -400, y: 448, z: 512, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  # The ladder to the west ledge, up and down again.
  - walk_to: {x: -576, y: 800, z: 512, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - climb: {ladder: ledge_w, timeout_seconds: 30}
  - assert: {party_position: {x: -576, y: 1110, radius: 100, z_min: 1016, z_max: 1032}}
  - clear_hostiles: {radius: 4000}  # gargoyles block the ledges at random (orchestrator, MP42)
  - climb: {ladder: ledge_w, down: true, timeout_seconds: 30}
  - assert: {party_position: {x: -576, y: 800, radius: 120, z_min: 504, z_max: 520}}
  # Round by the low nests and the rock ramp.
  - walk_to: {x: -1600, y: 450, z: 512, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: -1600, y: 1300, z: 650, z_tolerance: 120, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1300, y: 1600, z: 950, z_tolerance: 120, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -800, y: 1600, z: 1024, z_tolerance: 20, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  # Across the rope bridge to the east nests.
  - walk_to: {x: -300, y: 1536, z: 1024, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1000, y: 1536, z: 1024, z_tolerance: 30, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2500, y: 1536, z: 1024, z_tolerance: 30, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - assert: {party_position: {x: 2500, y: 1536, radius: 100, z_min: 1016, z_max: 1032}}
  # The hoist hangs at the high ledge: its call rope refuses before the winch.
  - walk_to: {x: 2816, y: 1900, z: 1024, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2700, y: 2290, z: 1024, radius: 40, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "if door_state(5) ~= 'open' then error('the hoist does not start at the high ledge: ' .. door_state(5)) end; click(17); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "Its winch must be in the cave beside you"}}
  - play_lua: {source: "close(); wait(3); if door_state(5) ~= 'open' then error('the hoist moved before the winch') end"}
  - walk_to: {x: 2816, y: 1900, z: 1024, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  # The fence's cache: his guard, his tags, his strongbox, his winch.
  - walk_to: {x: 2950, y: 1344, z: 1024, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "open_door(5, 1)"}
  - walk_to: {x: 3400, y: 1344, z: 1024, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 1500}
  - assert: {state_dump_map_var: {index: 1, value: 1}}
  - walk_to: {x: 3456, y: 1130, z: 1024, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(15); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "gargoyles are hired to steal things for people"}}
  - play_lua: {source: "close()"}
  - walk_to: {x: 3540, y: 1130, z: 1024, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        local g = gold()
        for _ = 1, 3 do
          loot_chest(3)
          if held() ~= 0 then stow() end
          if gold() >= g + 300 then return end
        end
        error("the fence's strongbox held no gold")
  - walk_to: {x: 3600, y: 1560, z: 1024, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(13); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "comes creaking down on its ropes"}}
  - play_lua: {source: "close(); wait(6); if not qbit(110880) then error('hoist_winched not set') end; if door_state(5) ~= 'closed' then error('the winch did not lower the hoist: ' .. door_state(5)) end"}
  - play_lua: {source: "click(13); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "The winch is wound out"}}
  - play_lua: {source: "close()"}
  # The hoist: on its deck, up to the high ledge, down and up again; the top call rope sends it down and back.
  - walk_to: {x: 2816, y: 1900, z: 1024, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2816, y: 2368, z: 1024, radius: 40, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(16); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "The platform creaks on its ropes and moves"}}
  - play_lua: {source: "close(); wait(6)"}
  - assert: {party_position: {x: 2816, y: 2368, radius: 120, z_min: 1500, z_max: 1544}}
  - play_lua: {source: "click(16); wait(1); close(); wait(6)"}
  - assert: {party_position: {x: 2816, y: 2368, radius: 120, z_min: 1016, z_max: 1060}}
  - play_lua: {source: "click(16); wait(1); close(); wait(6)"}
  - assert: {party_position: {x: 2816, y: 2368, radius: 120, z_min: 1500, z_max: 1544}}
  - walk_to: {x: 2500, y: 2368, z: 1536, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "local s = door_state(5); click(18); wait(1); close(); wait(6); if door_state(5) == s then error('the top call rope did not send the hoist: ' .. s) end; click(18); wait(1); close(); wait(6); if door_state(5) ~= s then error('the top call rope did not bring the hoist back: ' .. door_state(5)) end"}
  - clear_hostiles: {radius: 3000}
  # West along the high ledge; the hanging moss and the hidden ledge.
  - walk_to: {x: 1280, y: 2400, z: 1536, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -704, y: 2450, z: 1536, radius: 48, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "open_door(7, 2); wait(1); close()"}
  - walk_to: {x: -704, y: 2950, z: 1536, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -820, y: 3020, z: 1536, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        local g = gold()
        for _ = 1, 3 do
          loot_chest(2)
          if held() ~= 0 then stow() end
          if gold() >= g + 200 then return end
        end
        error("the climber's pack held no gold")
  # Up the roost ladder.
  - walk_to: {x: -704, y: 2450, z: 1536, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1280, y: 2470, z: 1536, radius: 40, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - climb: {ladder: roost, timeout_seconds: 30}
  - assert: {party_position: {x: 1280, y: 2780, radius: 100, z_min: 2040, z_max: 2056}}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: 1280, y: 2950, z: 2048, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - assert: {state_dump_map_var: {index: 2, value: 1}}
  # The great nest: the scarab once (A3's hook), then its else text.
  - play_lua: {source: "click(9); wait(1)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[a jewelled scarab]], 1, true) then error("status line: " .. s) end
  - play_lua:
      source: |
        close()
        if held() ~= 0 then stow() end
        if item_count(12312) ~= 1 then error("no Scarab of Imaging: " .. pack_items()) end
        if not qbit(112202) then error("scarab_found not set") end
  - play_lua: {source: "click(9); wait(1)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[The chest is empty.]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "close(); if held() ~= 0 then stow() end; if item_count(12312) ~= 1 then error('the scarab was given twice') end"}
  # The roost's hoard.
  - walk_to: {x: 1860, y: 3560, z: 2048, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        local g = gold()
        for _ = 1, 3 do
          loot_chest(4)
          if held() ~= 0 then stow() end
          if gold() >= g + 800 then return end
        end
        error("the roost's hoard held no gold")
  # Down the roost ladder; the drop from the high ledge to the west ledge.
  - walk_to: {x: 1280, y: 2800, z: 2048, radius: 40, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 4000}  # gargoyles block the ledges at random (orchestrator, MP42)
  - climb: {ladder: roost, down: true, timeout_seconds: 30}
  - assert: {party_position: {x: 1280, y: 2470, radius: 140, z_min: 1528, z_max: 1544}}
  - walk_to: {x: -576, y: 2300, z: 1536, radius: 40, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - movement_segment:
      input: forward
      seconds: 0.9
      start: {map: xeen_xd26.blv, x: -576, y: 2300, z: 1536, yaw_degrees: 270, pitch: 0}
      expect_stop: {map: xeen_xd26.blv, x: -576, y: 1900, z: 1024, yaw_degrees: 270, pitch: 0}
      loose_tolerance: true
      tolerance_xy: 2000
      tolerance_z: 1000
  - advance_runtime: {seconds: 1.0}
  # On the west ledge, not the shaft floor: its floor rises and falls up to 48 (D-89 cave shape, A7 s29).
  - assert: {party_position: {x: -576, y: 1850, radius: 300, z_min: 976, z_max: 1100}}
  # Off the bridge where the south rail is torn: a fall of 1,024 to the shaft floor.
  - walk_to: {x: 1024, y: 1536, z: 1024, z_tolerance: 30, radius: 48, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - movement_segment:
      input: forward
      seconds: 2.5
      start: {map: xeen_xd26.blv, x: 1024, y: 1536, z: 1024, yaw_degrees: 270, pitch: 0}
      expect_stop: {map: xeen_xd26.blv, x: 1024, y: 1100, z: 0, yaw_degrees: 270, pitch: 0}
      loose_tolerance: true
      tolerance_xy: 2000
      tolerance_z: 1500
  - advance_runtime: {seconds: 1.5}
  - assert: {party_position: {x: 1024, y: 700, radius: 800, z_min: -8, z_max: 8}}
  # Back to the mouth with the scarab.
  - walk_to: {x: 1344, y: 300, z: 0, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1344, y: -900, z: 0, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "if item_count(12312) ~= 1 or not qbit(112202) then error('the scarab or its bit was lost') end"}
