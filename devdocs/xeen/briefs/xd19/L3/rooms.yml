format: 0
themes:
- id: theme:castle
  wall: &id001 {texture: gnecwal1, size: [256, 256]}
  floor: &id016 {texture: gnecflr, size: [128, 128]}
  ceiling: &id002 {texture: gnecclg2, size: &id005 [128, 256]}
  reveal: *id001
  door: &id003 {texture: gnecdr2, size: [128, 256]}
  notes: 'Castle Xeen''s halls: black stone (MM8 gnecwal1) under a gold frieze (gnecwalt, the top row of every wall), gold-veined
    flags (gnecflr), a pale vault (gnecclg2); the robed-figure doors (gnecdr2).'
- id: theme:ward
  wall: *id001
  floor: &id004 {texture: gtrlflr, size: [128, 128]}
  ceiling: *id002
  reveal: *id001
  door: *id003
  notes: 'Wards, galleries and stairs: the same black stone and frieze over black diamond flags (gtrlflr).'
- id: theme:works
  wall: *id001
  floor: &id008 {texture: xahullbn, size: [256, 256]}
  ceiling: *id002
  reveal: *id001
  door: *id003
  notes: 'The machine rooms (the foundry, the generator vaults, the barrier hall): the castle''s stone over riveted Ancient
    plate (xahullbn) underfoot.'
- id: theme:sky
  wall: *id001
  floor: *id004
  ceiling:
    texture: gnecclg2
    size: *id005
    sky: true
  reveal: *id001
  door: *id003
  notes: 'Open to the sky (atmosphere.yml open_sky, X9''s xeen_cloud_sea): the wall walks and the aviary.'
