  - id: evt:machines_down
    preset: script
    trigger: timer
    every: 1
    condition: {all: [{destroyed: destructible:machine_w}, {destroyed: destructible:machine_e}]}
    opens: [door:bays]
    once: true
    effects:
      - show_actors: 41
      - show_actors: 42
      - show_actors: 43
      - show_actors: 44
      - qbit: 118063
      - set:
          var:
            map_var: pool
          value: 4
      - text: "Both machines are still. The bays' shutters roll up, and the last guards step off the line."
    notes: "Both machines destroyed: every guard still hidden is shown, the bays open on the gem find (bays_open 118063); the count stays 70 (D-47 Q7)."
  - id: evt:mirror
    preset: script
    source: panel:mirror
    title: Mirror
    condition: {not: {qbit: 111707}}
    effects:
      - lua: "XeenQuests.hook(\"m35.mirror\")"
    else_effects:
      - text: An empty frame. Silver dust and shards of glass.
    notes: "aaze0078:5 by A3's m35.mirror while the mirror stands; after it shatters, a map-local line."
  - id: evt:mirror_load
    preset: script
    trigger: load
    condition: {qbit: 111707}
    effects:
      - lights_off: light:mirror
      - set_texture:
          of: panel:mirror
          to: xmirror6x
    notes: After the scepter the mirror stays dark and shattered.
  - id: evt:mirror_shatters
    preset: script
    trigger: call
    effects:
      - lights_off: light:mirror
      - set_texture:
          of: panel:mirror
          to: xmirror6x
      - shake:
          strength: 2
          seconds: 3
    notes: "The cinematic's cue: the mirror's light goes out and the mirror becomes its shattered frame (xmirror6x)."
  - id: evt:pet_dead
    preset: script
    trigger: timer
    every: 2
    condition: {kills: {monster: monster:pet}}
    once: true
    effects:
      - lua: "XeenQuests.hook(\"m35.pet\")"
    notes: "Xeen's Pet's death: A3's m35.pet (pet_slain 111705). Opens nothing (D-47)."
  - id: evt:pool_clock
    preset: script
    trigger: timer
    every: 1
    condition: {all: [{map_var: pool_on}, {not: {all: [{destroyed: destructible:machine_w}, {destroyed: destructible:machine_e}]}}, {map_var: {name: pool, below: 4}}]}
    lua: "if IsAtLeast(MapVar(pool_clock), 45) then SetValue(MapVar(pool_clock), 0) if not IsAtLeast(MapVar(pool), 1) then evt.SetMonGroupBit(41, MonsterBits.Invisible, 0) SetValue(MapVar(pool), 1) elseif not IsAtLeast(MapVar(pool), 2) then evt.SetMonGroupBit(42, MonsterBits.Invisible, 0) SetValue(MapVar(pool), 2) elseif not IsAtLeast(MapVar(pool), 3) then evt.SetMonGroupBit(43, MonsterBits.Invisible, 0) SetValue(MapVar(pool), 3) elseif not IsAtLeast(MapVar(pool), 4) then evt.SetMonGroupBit(44, MonsterBits.Invisible, 0) SetValue(MapVar(pool), 4) end evt.StatusText(\"A press thumps. A new guard steps off the line.\", 3) end"
    effects:
      - add:
          var:
            map_var: pool_clock
          value: 1
    notes: "While either machine stands, every 45 s from the first step into the foundry one of the four hidden guards at the chutes is shown (D-18's word for showing a hidden actor: its group's Invisible bit cleared) and, hostile, takes the party on; pool counts them (at most 4)."
