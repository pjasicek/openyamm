format: 0
variables: [pool_on, pool, pool_clock, gems, sight, freed, untouched]
events:
  - id: evt:after_mirror
    preset: script
    trigger: call
    effects:
      - leave: exit:x9_gate
    notes: "D-47 Q14: the cinematic's done event: 'proceed to the nearest exit' - the party is out on X9 before the gate at once (the studio's leave: evt.MoveToMap(..., {direct = true}), merge point 21's confirmation)."
  - id: evt:arrive
    preset: script
    trigger: timer
    every: 1
    once: true
    effects:
      - lua: "XeenQuests.hook(\"m35.arrival\")"
    notes: "A3's m35.arrival (started 111700, once): its line at the first arrival."
  - id: evt:barrier_falls
    preset: script
    trigger: timer
    every: 1
    condition: {all: [{lua: "XeenQuests.can(\"m35.barrier\")"}, {not: {qbit: 118062}}]}
    opens: [door:field]
    once: true
    effects:
      - qbit: 118062
      - lua: "XeenQuests.hook(\"m35.barrier\")"
      - lua: "evt.SetMapVar('AmbientSound1', 2)"
      - lights_off: light:field
      - shake:
          strength: 1
          seconds: 1.5
    notes: "All four pylons dark (A3's m35.barrier reads the four generator bits): the field sinks, the crackle stops, the hook's line once (barrier_down 118062)."
  - id: evt:barrier_load
    preset: script
    trigger: load
    condition: {qbit: 118062}
    opens: [door:field]
    effects:
      - lua: "evt.SetMapVar('AmbientSound1', 2)"
      - lights_off: light:field
    notes: On every later load the field stays down.
  - id: evt:bays_load
    preset: switch
    trigger: load
    condition: {qbit: 118063}
    opens: [door:bays]
    notes: On every later load the shutters stay up.
