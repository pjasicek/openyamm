      - give_item: 183
      - give_item: 183
      - text: "Green gem eyes, a whole tray of spares. You take three emeralds."
    else_effects:
      - text: An empty tray.
    notes: "The guard bays' gem find (graph: 'Green gem eyes'): three Emeralds (183), once."
  - id: evt:gen_air
    preset: script
    source: platform:gen_air
    question: {ask: "Destroy (Yes/No)?", answers: [Yes, Y, yes, y], message: "Air Generator.  Destroy?"}
    title: Air Generator
    condition: {not: {destroyed: destructible:gen_air}}
    effects:
      - destroy: destructible:gen_air
    else_effects:
      - lua: "XeenQuests.hook(\"m35.gen_air\")"
    notes: "The Air Generator (aaze0075:2 (Electricity)): a real choice. Yes breaks the core (its on_destroyed, evt:gen_air_down, does the rest); blows and spells break it too. Broken: A3's else line."
  - id: evt:gen_air_down
    preset: script
    trigger: call
    effects:
      - lua: "XeenQuests.hook(\"m35.gen_air\")"
      - lua: "evt.SetMapVar('AmbientSound2', 2)"
      - lights_off: [light:core_air, light:pylon_air]
      - set_texture:
          of: platform:pylon_air
          to: gnecwal1
    notes: "The air generator's core broken (by the question, a blow or a spell): A3's m35.gen_air (111702), its hum stops, its glow and its pylon's light go out, the pylon goes dark."
