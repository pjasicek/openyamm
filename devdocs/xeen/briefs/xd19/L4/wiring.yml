  - id: evt:lord_damage
    preset: script
    trigger: monster_damage
    actors: [monster:lord_xeen]
    lua: |-
      if not (hook.attack == 'melee' and hook.weaponItemId == 12500) then
          evt.SetHookDamage(0)
          if not IsAtLeast(MapVar(untouched), 1) then
              SetValue(MapVar(untouched), 1)
              XeenQuests.hook("m35.untouchable")
          end
      end
      if not IsQBitSet(QBit(111709)) then
          XeenQuests.hook("m35.lord_xeen_sight")
          SetValue(MapVar(sight), 1)
      end
    notes: "D-47 Q12: every hit on Lord Xeen but melee with the Xeen Slayer Sword (12500) is zeroed; the first zeroed hit of a visit shows A3's m35.untouchable. Q13: a hit before the throne doors' plate runs m35.lord_xeen_sight (its own once bit) and starts the 4 s clock that frees him."
  - id: evt:lord_dead
    preset: script
    trigger: timer
    every: 1
    condition: {kills: {monster: monster:lord_xeen}}
    opens: [door:treasury]
    once: true
    effects:
      - lua: "XeenQuests.hook(\"m35.lord_xeen\")"
    notes: "Lord Xeen's death: A3's m35.lord_xeen (lord_xeen_slain 111706, D-38's voiced line); the treasury opens."
  - id: evt:lord_untouched_leave
    preset: script
    trigger: leave
    effects:
      - set:
          var:
            map_var: untouched
          value: 0
    notes: "m35.untouchable's line once per visit: cleared when the party leaves."
  - id: evt:machine_e
    preset: script
    source: platform:machine_e
    question: {ask: "Destroy (Yes/No)?", answers: [Yes, Y, yes, y], message: "Guard Making Machine.  Destroy?"}
    title: Guard Making Machine
    condition: {not: {destroyed: destructible:machine_e}}
    effects:
      - destroy: destructible:machine_e
    else_effects:
      - text: A broken press. Nothing comes out of it any more.
    notes: "aaze0075:0: a real choice; Yes breaks it (blows and spells too); no experience (D-47 Q15)."
  - id: evt:machine_e_down
    preset: script
    trigger: call
    effects:
      - qbit: 118061
      - lua: "evt.SetMapVar('AmbientSound6', 2)"
      - text: "The machine shudders, jams, and stops stamping."
    notes: "The machine broken: machine_e_down 118061, its stamping stops."
  - id: evt:machine_e_load
