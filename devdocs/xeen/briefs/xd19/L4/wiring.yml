    notes: "The plate inside the throne doors (D-47 Q13): A3's m35.lord_xeen_sight (lord_xeen_seen 111709, D-38's voiced line, once per save); the clock frees Lord Xeen and his guards 4 s after."
  - id: evt:sight_clock
    preset: script
    trigger: timer
    every: 1
    condition: {all: [{map_var: sight}, {not: {map_var: freed}}]}
    lua: "if IsAtLeast(MapVar(sight), 5) then SetValue(MapVar(freed), 1) evt.SetActorImmobile(ActorIndex(\"monster:lord_xeen\"), false) evt.SetActorImmobile(ActorIndex(\"monster:throne_1\"), false) evt.SetActorImmobile(ActorIndex(\"monster:throne_2\"), false) evt.SetActorTarget(ActorIndex(\"monster:lord_xeen\"), \"party\") evt.SetActorTarget(ActorIndex(\"monster:throne_1\"), \"party\") evt.SetActorTarget(ActorIndex(\"monster:throne_2\"), \"party\") end"
    effects:
      - add:
          var:
            map_var: sight
          value: 1
    notes: "4 s after the line, Lord Xeen and his two guards (monster:throne_1, monster:throne_2; ActorIndex, merge point 22) leave their places and go for the party (evt.SetActorImmobile, evt.SetActorTarget)."
  - id: evt:throne
    preset: script
    source: platform:throne
    question: {ask: "Take (Yes/No)?", answers: [Yes, Y, yes, y]}
    title: Throne
    condition: {all: [{not: {qbit: 111707}}, {lua: "XeenQuests.hook(\"m35.scepter_ask\")"}]}
    effects:
      - lua: "XeenQuests.hook(\"m35.scepter\")"
      - cinematic:
          id: cinematic:mirror
          then: evt:after_mirror
    else_effects:
      - lua: "XeenQuests.hook(\"m35.scepter\")"
    notes: "D-47 Q14: after Lord Xeen's death the throne asks first (A3's m35.scepter_ask shows its text, then the question). Yes: A3's m35.scepter (done 111707, award 411, 35,000, the Scepter), then the cinematic. No: nothing. Before his death and after the scepter: m35.scepter's fail and else lines."
  - id: evt:treasury_load
    preset: switch
    trigger: load
    condition: {qbit: 111706}
    opens: [door:treasury]
    notes: On every later load the hoard stays open.
  - id: evt:war_table
    preset: text
    source: platform:war_table
    title: War table
    text: "A map of both faces of Xeen. Darkside armies are pinned along the edge, ready to cross."
    seconds: 5
    notes: "Map-local line (Crodo's warning, M21)."
cinematics:
  - id: cinematic:mirror
