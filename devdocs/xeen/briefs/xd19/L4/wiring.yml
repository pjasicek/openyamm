    trigger: load
    condition: {destroyed: destructible:machine_e}
    effects:
      - lua: "evt.SetMapVar('AmbientSound6', 2)"
    notes: On every later load the broken machine stays silent.
  - id: evt:machine_w
    preset: script
    source: platform:machine_w
    question: {ask: "Destroy (Yes/No)?", answers: [Yes, Y, yes, y], message: "Guard Making Machine.  Destroy?"}
    title: Guard Making Machine
