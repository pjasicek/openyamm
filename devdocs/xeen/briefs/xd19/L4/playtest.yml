# Playtest of Castle Xeen (XD-19, L4; lane A7, agent:xeen-a7-xd19; written by
# output/studio_cal/xd19/tools/gen_tests.py from ids.lock.yml): the critical path. A level-50 party
# (immortal) arrives in the gatehall (entrance:x9_gate): m35.arrival; the great hall,
# the west ward and gallery, the cold vault's Water Generator ('Destroy?' Yes); the stair hall, the
# gravel vault's Earth Generator; the east gallery, up the south-east tower to the Air Generator; the
# barrier hall with three generators down (the field stands); the south-west tower top's Fire
# Generator: the field falls (barrier_down 118062); up the crown stair, the aviary (Xeen's Pet,
# m35.pet), the throne doors' plate (m35.lord_xeen_sight, Lord Xeen freed 4 s later), no damage
# without the Slayer Sword (m35.untouchable once), then his death by the sword (m35.lord_xeen; the
# treasury opens), the mirror (aaze0078:5), the scepter: No; the hoard, a save and load; the scepter: Yes
# (m35.scepter, the cinematic, then out on X9 before the gate: the done event's direct leave).
