format: 0
level: L1
pitch: 'Lord Xeen''s castle on the clouds: black stone and gold with the Ancients'' machines set into it. Four elemental generators,
  two in the lower vaults and two at the tower tops, feed one field before the crown stair; in the keep the guard-making machines
  keep stamping out Xeen''s Guards. Above the field, the aviary under open sky where Xeen''s Pet roosts, then the throne room:
  Lord Xeen on his dais and the Sixth Mirror behind him.'
purpose: 'M35 Castle Xeen: m35.gen_* (four generators), m35.barrier, m35.pet, m35.lord_xeen_sight, m35.lord_xeen, m35.scepter_ask/m35.scepter
  and the mirror''s cinematic. 96 monsters at 42-70 (D-98) plus Xeen''s Pet 75 and Lord Xeen 85; treasure 5 and the hoard
  6.'
mood: Black stone under gold friezes, cold green-blue machine light, the crackle of the field, open sky over the battlements
  and the aviary.
datum: arrival
