pitch: 'A burning cave behind the demon and devil idols at Mount Firestone''s west foot. A tall cavern round a lake of lava
  with the devil skull on its island, the demon skull in a shrine beyond the fissure; below, four lever stones round a black
  pillar lower four slabs across the gate run; at the root of the mountain the magma heart, and beyond it a wall of bare rock
  that grinds open when both skulls are broken: cool air, and the smell of grass.'
