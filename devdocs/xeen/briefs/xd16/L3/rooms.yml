notes: 'XD-16 Volcano Cave at L4: floor 0 (the mouth, the ash gallery, the smoking passage and the vault of chests, the fire
  lake with the devil skull''s island, the fissure, the demon shrine, the cinder run, the stair head), the rough steps down
  to floor -640 (the stair foot, the lever hall, the steam vents, the magma caves and the slag pocket, the gate run''s four
  slabs), the deep stair down to floor -1280 (the obsidian landing, the ember pocket, the glass caves, the ash pits, the magma
  heart, the last cave, the cool passage). x east, y north; the mouth opens west onto X7. Written by output/studio_cal/xd16/tools/gen.py.'
