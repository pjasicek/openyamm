# Playtest of the Volcano Cave (XD-16, L4; lane A7, agent:xeen-a7-xd16; written by
# output/studio_cal/xd16/tools/gen_tests.py from ids.lock.yml): the critical path (D-47's XD-16 playtests). A level-48
# party (immortal) starts in the mouth (entrance:x7_mouth): the arrival line, the way out's window (cancelled); the ash
# gallery and the fire lake; over the causeway to the island: the devil skull's click (D-121; A3's
# q-c26.devil_skull); the rock at the bottom still shut (q-c26.done unset, door closed, its click gives q-c26.way's
# fail line); round the north shore and up the fissure, the shrine's iron door, the demon skull's click (q-c26.done) and
# within two seconds the way's rock open (same visit); a second click on a broken altar gives the splinters line; the
# cinder run to the stair head, down the rough steps; the four lever stones (each slab down, a second click "The lever
# is down."); the gate run, the deep stair, the glass caves, the heart's west ledge, the last cave; through the rock,
# the cool passage's line (q-c26.way) up to its end (playtest_way.yml goes through). Then every window closed
# and a save and load: the rock and the four slabs stay open.
id: xeen.xd16.l4.walk
title: Volcano Cave (XD-16 L4), both skulls, the gate stones and the way
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_xd16.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 48, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 48, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 48, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 48, skills: [], equipment: {}}
  - assert: {map: xeen_xd16.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - assert: {party_position: {x: 256, y: 0, radius: 96, z_min: -8, z_max: 8}}
  - play_lua: {source: "wait(2); local s = tostring(status()); log('arrive: ' .. s); if not string.find(s, 'Heat on your face', 1, true) then error('arrival line: ' .. s) end; close()"}
  # The way out asks (playtest_exit.yml leaves by it); here Cancel stays.
  - walk_to: {x: 128, y: 0, z: 0, radius: 48, timeout_seconds: 40, close_dialogs: true}
  - play_lua: {source: "click(20); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "Do you wish to leave"}}
  - play_lua: {source: "close()"}
  - assert: {map: xeen_xd16.blv}
  # The ash gallery, the fire lake, over the causeway to the devil skull.
  - walk_to: {x: 1920, y: 0, z: 0, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 3328, y: 0, z: 0, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - clear_hostiles: {radius: 3500}
  - walk_to: {x: 4200, y: 0, z: 0, radius: 48, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 4480, y: 0, z: 0, radius: 48, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - play_lua: {source: "click(15); wait(0.5)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[cracks in two]], 1, true) then error("status line: " .. s) end
  - play_lua:
      source: |
        close(); wait(1)
        if not qbit(112521) then error('devil_skull 112521 not set') end
        if qbit(112522) then error('q-c26.done set after one skull') end
        if door_state(7) ~= 'closed' then error('the rock moved after one skull: ' .. door_state(7)) end
  # The rock, clicked after one skull: the fail line of q-c26.way.
  - play_lua: {source: "click(19); wait(0.7)"}
  - assert: {dialog: {active: true, text_contains: "Bare rock, hot to the touch"}}
  - play_lua: {source: "close(); wait(1); if door_state(7) ~= 'closed' then error('the rock opened before done') end"}
  # The broken altar again: the splinters line.
  - play_lua: {source: "click(15); wait(0.7)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[Splinters of black bone]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "close()"}
  # Back over the causeway, the north shore, the fissure, the shrine's iron door.
  - walk_to: {x: 3328, y: 0, z: 0, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 3328, y: 1340, z: 0, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 5568, y: 1340, z: 0, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 5568, y: 2500, z: 0, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - walk_to: {x: 5568, y: 3200, z: 0, radius: 48, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - play_lua: {source: "open_door(17, 1)"}
  - walk_to: {x: 5568, y: 3800, z: 0, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - walk_to: {x: 5696, y: 4160, z: 0, radius: 48, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - play_lua: {source: "click(13); wait(0.5)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[rock grinds on rock]], 1, true) then error("status line: " .. s) end
  - play_lua:
      source: |
        close(); wait(6)
        if not qbit(112520) then error('demon_skull 112520 not set') end
        if not qbit(112522) then error('q-c26.done 112522 not set by the second skull') end
        if not qbit(118054) then error('rock_drawn 118054 not set in the same visit') end
        if door_state(7) ~= 'open' then error('the rock is not open in the same visit: ' .. door_state(7)) end
  # The cinder run back to the stair head; down the rough steps.
  - walk_to: {x: 6464, y: 3150, z: 0, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 6464, y: 900, z: 0, radius: 64, clear_hostiles: 1500, timeout_seconds: 60, close_dialogs: true}
  - walk_to: {x: 6464, y: -1984, z: 0, radius: 64, clear_hostiles: 1500, timeout_seconds: 60, close_dialogs: true}
  - walk_to: {x: 5760, y: -1984, z: 0, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 5760, y: -2700, z: 0, z_tolerance: 40, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 5760, y: -4900, z: -640, z_tolerance: 24, radius: 64, clear_hostiles: 1500, timeout_seconds: 60, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  # The lever hall: the four lever stones round the pillar.
  - walk_to: {x: 4900, y: -5120, z: -640, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - walk_to: {x: 4416, y: -4880, z: -640, radius: 40, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - play_lua: {source: "click(21); wait(0.7)"}
  - assert: {dialog: {active: true, text_contains: "lever stone drops into its socket"}}
  - play_lua:
      source: |
        close(); wait(5)
        if not qbit(118050) then error('slab_1 118050 not set') end
        if door_state(2) ~= 'open' then error('slab 1 not down: ' .. door_state(2)) end
  - play_lua: {source: "click(21); wait(0.7)"}
  - assert: {dialog: {active: true, text_contains: "The lever is down."}}
  - play_lua: {source: "close()"}
  - walk_to: {x: 4680, y: -4880, z: -640, radius: 48, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 4680, y: -5120, z: -640, radius: 40, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - play_lua: {source: "click(22); wait(0.7)"}
  - assert: {dialog: {active: true, text_contains: "lever stone drops into its socket"}}
  - play_lua:
      source: |
        close(); wait(5)
        if not qbit(118051) then error('slab_2 118051 not set') end
        if door_state(3) ~= 'open' then error('slab 2 not down: ' .. door_state(3)) end
  - play_lua: {source: "click(22); wait(0.7)"}
  - assert: {dialog: {active: true, text_contains: "The lever is down."}}
  - play_lua: {source: "close()"}
  - walk_to: {x: 4680, y: -5360, z: -640, radius: 48, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 4416, y: -5360, z: -640, radius: 40, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - play_lua: {source: "click(23); wait(0.7)"}
  - assert: {dialog: {active: true, text_contains: "lever stone drops into its socket"}}
  - play_lua:
      source: |
        close(); wait(5)
        if not qbit(118052) then error('slab_3 118052 not set') end
        if door_state(4) ~= 'open' then error('slab 3 not down: ' .. door_state(4)) end
  - play_lua: {source: "click(23); wait(0.7)"}
  - assert: {dialog: {active: true, text_contains: "The lever is down."}}
  - play_lua: {source: "close()"}
  - walk_to: {x: 4150, y: -5360, z: -640, radius: 48, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 4150, y: -5120, z: -640, radius: 40, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - play_lua: {source: "click(24); wait(0.7)"}
  - assert: {dialog: {active: true, text_contains: "lever stone drops into its socket"}}
  - play_lua:
      source: |
        close(); wait(5)
        if not qbit(118053) then error('slab_4 118053 not set') end
        if door_state(5) ~= 'open' then error('slab 4 not down: ' .. door_state(5)) end
  - play_lua: {source: "click(24); wait(0.7)"}
  - assert: {dialog: {active: true, text_contains: "The lever is down."}}
  - play_lua: {source: "close()"}
  # Down the gate run past the four lowered slabs, the deep stair, the landing.
  - walk_to: {x: 4150, y: -4880, z: -640, radius: 48, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 4416, y: -6000, z: -640, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 4416, y: -6650, z: -640, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 4416, y: -7300, z: -640, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 4416, y: -7940, z: -640, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 4416, y: -8580, z: -640, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 4416, y: -9216, z: -640, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: 4416, y: -9700, z: -640, z_tolerance: 40, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 4416, y: -11900, z: -1280, z_tolerance: 24, radius: 64, clear_hostiles: 1500, timeout_seconds: 60, close_dialogs: true}
  - walk_to: {x: 4416, y: -12032, z: -1280, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  # The glass caves, the heart's west ledge, the last cave.
  - walk_to: {x: 3700, y: -12096, z: -1280, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 2880, y: -12300, z: -1280, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 2880, y: -14144, z: -1280, radius: 64, clear_hostiles: 1500, timeout_seconds: 60, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: 3744, y: -14144, z: -1280, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - clear_hostiles: {radius: 3500}
  - walk_to: {x: 3744, y: -15350, z: -1280, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 4864, y: -15350, z: -1280, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 4864, y: -16300, z: -1280, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 4864, y: -16650, z: -1280, radius: 48, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  # Through the rock: the cool passage's line (q-c26.way); its end leads straight into XD-17 (an indoor map: no
  # leave window), which playtest_way.yml walks; here the party stops short of it.
  - walk_to: {x: 4864, y: -17150, z: -1280, radius: 64, timeout_seconds: 40, close_dialogs: false, expect: dialog}
  - assert: {dialog: {active: true, text_contains: "Beyond the last cave, cool air"}}
  - play_lua: {source: "close()"}
  - walk_to: {x: 4864, y: -18250, z: -1280, radius: 48, timeout_seconds: 40, close_dialogs: true}
  - assert: {map: xeen_xd16.blv}
  # A save and load with every window closed: the rock and the slabs stay open.
  - play_lua: {source: "close(); wait(1); close()"}
  - reload: {}
  - play_lua:
      source: |
        wait(2); close()
        if door_state(7) ~= 'open' then error('the rock after reload: ' .. door_state(7)) end
        for _, d in ipairs({2, 3, 4, 5}) do
          if door_state(d) ~= 'open' then error('slab ' .. d .. ' after reload: ' .. door_state(d)) end
        end
