# Playtest of the Volcano Cave's vault of chests (XD-16, L4; written by output/studio_cal/xd16/tools/gen_tests.py):
# D-47 Q2. A level-48 party (not immortal: the damage is measured) walks to the vault; every member set to 100 HP (under every
# member's maximum); the westmost trap chest bursts ("The chest explodes!", Fire 50 on each member: each then 40-60),
# a second click "The chest is empty." with no more damage; the real chest (third from the west) opens on its loot.
id: xeen.xd16.l4.traps
title: Volcano Cave (XD-16 L4), a trap chest and the real chest
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_xd16.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 48, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 48, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 48, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 48, skills: [], equipment: {}}
  - assert: {map: xeen_xd16.blv}
  - play_lua: {source: "wait(2); close()"}
  - walk_to: {x: 1920, y: 0, z: 0, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 2176, y: 0, z: 0, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 2176, y: -900, z: 0, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - walk_to: {x: 2176, y: -1300, z: 0, radius: 48, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - play_lua: {source: "open_door(18, 6)"}
  - walk_to: {x: 2176, y: -1900, z: 0, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 1760, y: -2150, z: 0, radius: 40, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - clear_hostiles: {radius: 4000}
  - setup_shortcut: {kind: set_member_points, member_index: 0, health: 100}
  - setup_shortcut: {kind: set_member_points, member_index: 1, health: 100}
  - setup_shortcut: {kind: set_member_points, member_index: 2, health: 100}
  - setup_shortcut: {kind: set_member_points, member_index: 3, health: 100}
  - play_lua: {source: "click(5); wait(0.7); local s = status(); if not string.find(s, 'The chest explodes!', 1, true) then error('trap: ' .. s) end; close(); if not qbit(118055) then error('trap_1 118055 not set') end"}
  - assert: {member_points: {member_index: 0, health_min: 40, health_max: 60}}
  - assert: {member_points: {member_index: 1, health_min: 40, health_max: 60}}
  - assert: {member_points: {member_index: 2, health_min: 40, health_max: 60}}
  - assert: {member_points: {member_index: 3, health_min: 40, health_max: 60}}
  - setup_shortcut: {kind: set_member_points, member_index: 0, health: 100}
  - setup_shortcut: {kind: set_member_points, member_index: 1, health: 100}
  - setup_shortcut: {kind: set_member_points, member_index: 2, health: 100}
  - setup_shortcut: {kind: set_member_points, member_index: 3, health: 100}
  - play_lua: {source: "click(5); wait(0.7); local s = status(); if not string.find(s, 'The chest is empty.', 1, true) then error('the burst chest again: ' .. s) end; close()"}
  - assert: {member_points: {member_index: 0, health_min: 100, health_max: 100}}
  - assert: {member_points: {member_index: 1, health_min: 100, health_max: 100}}
  - assert: {member_points: {member_index: 2, health_min: 100, health_max: 100}}
  - assert: {member_points: {member_index: 3, health_min: 100, health_max: 100}}
  - walk_to: {x: 2096, y: -2150, z: 0, radius: 40, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - play_lua: {source: "local g = gold(); loot_chest(10); close(); if held() ~= 0 then stow() end; if gold() < g + 4000 then error('the real chest held no gold') end"}
