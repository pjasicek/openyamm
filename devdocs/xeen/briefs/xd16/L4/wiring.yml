  - id: evt:door_vault
    preset: door
    source: door:vault
    title: Door
  - id: evt:door_way
    preset: door
    source: door:way
    title: Bare rock
    condition: {qbit: way_open}
    action: open
    else_effects:
      - lua: "XeenQuests.hook(\"q-c26.way\")"
    notes: "Before done the rock's click gives q-c26.way's fail text ('Bare rock, hot to the touch. ...'); after it stands open."
  - id: evt:exit_x7
    preset: exit
    source: exit:mouth
    title: Leave the Volcano Cave
    notes: "Out to X7 (installed) at its named arrival entrance:xd16_mouth (512, 9728, 2240) facing west: the game's own leave window (D-24); 'Leave the Volcano Cave?' (aaze0046:5) is its meaning."
  - id: evt:lever_1
    preset: switch
    source: switch:lever_1
    title: First slab
    condition: {not: {qbit: slab_1}}
    opens: [door:slab_1]
    effects:
      - qbit: slab_1
      - lua: "XeenQuests.hook(\"q-c26.lever\")"
    else_effects:
      - lua: "XeenQuests.hook(\"q-c26.lever_down\")"
    notes: "One-way (D-43): lowers the first slab (map qbit 118050); a second click gives 'The lever is down.'"
