  - id: evt:way_end
    preset: exit
    source: exit:way_end
    title: The way to Shangri-La
    notes: "Out to XD-17 (installed, A5) at its named arrival entrance:xd16_way (-1280, -4736, 4) facing north: the game's own leave window (D-24)."
  - id: evt:way_grind
    preset: script
    trigger: timer
    every: 1
    condition: {all: [{qbit: way_open}, {not: {qbit: rock_drawn}}]}
    opens: [door:way]
    effects:
      - qbit: rock_drawn
      - lua: "evt.PlaySoundName(\"6stone door0101\", 4864, -16768, -1100)"
    notes: "The skull that sets q-c26.done grinds the way's rock open within a second in the same visit (the skulls are two floors up); map qbit rock_drawn 118054 marks it drawn."
  - id: evt:way_load
    preset: script
    trigger: load
    condition: {qbit: way_open}
    opens: [door:way]
    effects:
      - qbit: rock_drawn
    notes: With q-c26.done the rock stands open on every load.
