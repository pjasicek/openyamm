format: 0
variables: []
events:
  - id: evt:arrive
    preset: script
    trigger: timer
    every: 1
    once: true
    effects:
      - lua: |-
          local x, y = evt.GetPartyPosition()
          if x >= 0 and x <= 768 and y >= -384 and y <= 384 then
              evt.StatusText("Heat on your face and a red glow far ahead. Behind you, daylight between a demon and a devil of black stone.", 6)
          end
    notes: "Say where the party is (a one-shot timer: the party arrives standing in the mouth). Only in the mouth (room:mouth): a party back from XD-17 arrives in the cool passage, where daylight behind would be wrong."
  - id: evt:chest_ante
    preset: chest
    source: chest:ante
    title: Chest
  - id: evt:chest_ember
    preset: chest
    source: chest:ember
    title: Chest
  - id: evt:chest_slag
    preset: chest
    source: chest:slag
    title: Chest
  - id: evt:chest_trap_1
    preset: script
    source: chest:trap_1
    title: Chest
    condition: {not: {qbit: trap_1}}
    effects:
      - qbit: trap_1
      - lua: "evt.PlaySoundName(\"explosion\", 1760, -2376, 64)"
      - damage:
          amount: 50
          kind: fire
          who: all
      - text: "The chest explodes!"
    else_effects:
      - text: The chest is empty.
    notes: "A trap chest (map qbit 118055): the first opening bursts it, Fire 50 on each member (about 10-15 % of a level-48 member's HP), 'The chest explodes!' (aaze0046:6); after that 'The chest is empty.' (aaze0046:2)."
