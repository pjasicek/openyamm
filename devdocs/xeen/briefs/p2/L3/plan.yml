pitch: "The Plane of Air of Xeen: islands of wind-carved white stone hanging in a sky with no ground under it. Bridges of cloud-stone cross the gaps; the wind sings in a ring of hollow stones. In the south-east the Eye of the Winds, a ring of standing stones where the test of Air waits; from it the Stair of Wind climbs to the Sleeper's Aerie, the highest island, where the Air Sleeper dreams."
