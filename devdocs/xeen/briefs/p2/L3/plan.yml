    spaces: [void:sky]
    rule: "D-58 P2 Q1 (a): a party below z -1,500 (and the room's safety floor) is moved by Xeen.skyFallTo(\"p2\") (A3's SkyFalls key `p2`) to entrance:d7_fall on the Gale Landing in this map, from Xeen.SkyFallHeight (850) above it, with falling damage (D-6.2: a third of HP at most; Feather Fall none). The smallest unbridged gap between islands is 1,801: no jump across."
  - id: set:storm
    kind: trap
    spaces: [room:kite_isle, room:statue, room:stones]
    rule: "The source's nine storm squares: scorched patches on the islands (a small floor face each). Stepping on one: one time in three 50 electrical damage to each member, 'Lightning strikes from a clear sky!' (resistance applies). PressurePlate faces textured `xpascorch`, each calling A3's planes.storm. Cells: at (-1408, -1408); at (256, -1152); at (-1024, 1280); at (1152, 2560); at (-4736, 3072); at (-3456, 4480); at (-640, -896); at (768, 1280); at (-768, 2816). None on the critical path (measured 0 within 384 of the walk; 0 on a link, 0 in the arena)."
  - id: set:test
    kind: boss
    spaces: [room:arena]
    rule: "D-58 C3 (a): the pedestal's 'Accept the test of Air?' (A3's m38.test_air) shows the three guardians, a hidden group until then, rising from the pit at (3968, -3072): 1 Sleeper's Guardian of Air (75), 2 Whirlwind (70). Each guardian's death event calls Xeen.planeTestCheck(\"air\", <the group>); when the three are dead it runs m38.test_air_passed, which sets m38_air_test (111765, P-1) and opens the gate. A party that leaves mid-fight finds the guardians still shown on return; the test is not offered again while they live."
    enabled_by: {map_var: test_accepted}
    gives:
      qbit: m38_air_test
    population:
      - {id: pop:guardians, actors: [{actor: Sleeper's Guardian of Air (11702), count: 1}, {actor: Whirlwind (11701), count: 2}], placed: true, notes: "hidden until the test is accepted, at (3968, -3072)"}
