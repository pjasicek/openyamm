    notes: "The open sky of the Plane of Air: one room from the safety floor at -6,000 to the sky at 4,096, every wall, floor and ceiling face a sky face. The islands hang in it as rough floating rock (ragged rims, tiers and roots under them, crags on the rims, cloud skirts), linked by cloud-stone bridges and the Stair of Wind."
