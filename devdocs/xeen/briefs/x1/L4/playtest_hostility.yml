# Hostility check of X1 Vertigo Meadows (written by output/studio_cal/hostility/gen_hostility_tests.py; devdocs/xeen/ACT2_BUILD.md, "Hostility pass"):
# its foes hostile to the party, its peaceful ones peaceful, its kinds not fighting each other.
id: xeen.x1.l4.hostility
title: 'X1 Vertigo Meadows: foes hostile to the party, no fights among them'
world: mm7
mode: faithful
steps:
- new_game_flow:
    start_map: xeen_x1.odm
- setup_shortcut:
    kind: immortal
    value: true
- note: The map entry events run (the build's evt:studio_relations sets the map's relations).
- advance_runtime:
