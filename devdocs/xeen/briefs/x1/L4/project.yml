notes: "X1 Vertigo Meadows, Xeen's starting outdoor map, a new map with no original (devdocs/xeen/MAPS.md). Built and played as an MM7 map (world: mm7) until worlds/xeen exists, as XD-01 to XD-05 are. Stand-ins: slot 1 Orcs is MM7's Goblin family (Goblin 4), slot 2 Toads the Dragonfly family (MM7 has no toad or snake; the placed snakes are Dragonflies too), slot 3 Skeletons the Skeleton Warrior family, the placed zombies MM7's Ghoul family (Ghast 9); houses open MM7 house rows under Vertigo's names; the Crystal Key is the plain Key 2110 (as XD-04 says). Rebase of 2026-11-20 (A5): 130 hostiles in four encounter areas, 12 chests, about 45 points of interest, at most 800 decorations (CHANGES_FOR_BUILT_MAPS X1-2 to X1-8). Written by output/studio_cal/x1/tools/gen.py."
