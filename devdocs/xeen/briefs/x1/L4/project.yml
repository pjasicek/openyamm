notes: "X1 Vertigo Meadows, Xeen's starting outdoor map, a new map with no original (devdocs/xeen/MAPS.md). Built and played as an MM7 map (world: mm7) until worlds/xeen exists, as XD-01 to XD-05 are. Stand-ins: slot 1 Orcs is MM7's Goblin family (Goblin 4), slot 2 Giant toads and snakes is the Dragonfly family (MM7 has no toad or snake), slot 3 Skeletons and zombies the Skeleton Warrior family; houses open MM7 house rows under Vertigo's names; the Crystal Key is the plain Key 2110 (as XD-04 says). Written by output/studio_cal/x1/tools/gen.py."
