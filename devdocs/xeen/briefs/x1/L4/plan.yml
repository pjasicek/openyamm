format: 0
level: L3
pitch: "Start pocket. A walled river town in green meadows; the east edge is the world rim, where the creek falls off the world. The Witch Tower is visible from town from day one. Orcs hold the northern hills round the dwarves' mines and their own caves; toads and snakes the marsh of Toad Meadow; the dead walk in the south-west forest."
purpose: "The first map: full services, five Act I dungeons, d1 fights, wells and shrines."
mood: "Bright, green and homely; a hint of menace in the hills, the marsh and the dead wood."
datum: water:sky
