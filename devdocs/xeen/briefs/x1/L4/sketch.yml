events:
  - id: evt:gunther_errand
    trigger: timer
    every: 2
    effects:
      - lua: "evt.SimpleMessage(\"Vertigo. A bolt from the sky destroyed Newcastle, and you woke here among its survivors. Mayor Gunther asks your help: slimes and doom bugs plague the town. Joe the Exterminator always turns up just after the pests, and his warehouse on the south bank is locked tight. The notice in the square says more; the Town Hall is on the main street.\")"
    once: true
    notes: "Why the party is here: M1/M2 (QUESTS.md), until the Xeen world's quests exist; once."
