notes: "Xeen design brief, level L2, for a new map (no original to rebuild). Story step M3, first half (devdocs/xeen/QUESTS.md): the Clan King himself is in the Deep Mine (XD-03), reached from here by mine cart. Encounter slots are Xeen families from devdocs/xeen/MONSTERS_AND_ITEMS.md: 1 Mad Dwarves (Mad Dwarf 7), 2 Spiders (5 / 10), 3 Bats (Giant Bat 3 / Bat Queen 10); Tiger Moles (Burrowers, level 9) are placed actors, because a map has only three slots. Monster levels 3 to 10. Provisional ids: map_stats row 9132, qbits 110020-110021, item 12011 (Xeen ranges, devdocs/xeen/PRODUCTION.md); none registered. Lock 1 and trap 1 are Act I values (X1's sheet has 0/1). Neighbour codes are Xeen map codes (X1 Vertigo Meadows, X4 Burlock Savannah, XD-03 Deep Mine)."
