set_pieces:
  - id: set:rich_vein
    kind: ambush
    spaces: [room:stope_floor]
    rule: "Chipping the richest vein on the stope floor sets rich_vein_mined: two tiger moles break out of the rock wall beside it."
    inputs: [chip the rich vein]
    states: [vein whole, vein mined and moles out]
    gives:
      map_var: rich_vein_mined
    population:
      - {actor: Tiger Mole, role: burrower, groups: 2, levels: [9, 9], placed: true, strength: heavy}
  - id: set:rockfall
    kind: trap
    spaces: [room:foot_drift]
    effect: {damage: "2d6 physical, whole party"}
    rule: "Rotten props in the middle of the foot drift: the first time the party passes, rock falls from the roof (physical damage to everyone, about 2d6) and leaves a rubble heap the party walks round. The cart ride avoids it."
    states: [armed, fallen]
  - id: set:stope_reveal
    kind: vista
    spaces: [room:turntable, room:stope_rim, void:stope_void]
    rule: "The gallery from the turntable is low and dark; at its end the roof lifts away and the Open Stope fills the view (sightline:stope_reveal)."
  - id: set:turntable
    kind: puzzle
    spaces: [room:turntable, room:east_line, room:flooded_working]
    rule: "A cart at the turntable goes where the turntable points. Pointing it east sends carts down the east line (the only way to the flooded working); pointing it back to the trestle is needed to ride back to the Top Station."
    inputs: [pull the turntable lever, board the cart]
    states: [trestle (default), east]
    solution: "Pull the lever to east, ride to the flooded working, ride back, pull the lever again for the trestle (or walk the foot drift)."
  - id: set:unchain_deep_cart
    kind: scripted
    spaces: [room:deep_station]
    rule: "The Deep Line cart is chained to its brake wheel ('The chain is locked through the brake'). Using the brake key unlocks it and the key is kept by the brake; the cart then rides down to the Deep Mine, a short ride with a camera shake on the steep stretch."
    inputs: [use the brake key on the brake, board the cart]
    states: [chained, free]
    enabled_by: {item: brake_key, consume: true}
    gives:
      qbit: deep_line_unchained
  - id: set:west_adit_winch
    kind: scripted
    spaces: [room:collapsed_adit]
    rule: "The winch pulls the props and the fall drops away down an ore chute: dust, a roar, a camera shake. The adit is open to X4 for good."
    inputs: [use the winch]
    states: [caved in, open]
    gives:
      qbit: x4_adit_open
mechanisms:
  - {kind: "mine cart ride, trestle line", count: 1, notes: "Top Station to the Turntable over the chasm and back (link:trestle_cart). A cart at each gate; boarding one is a scripted move along the trestle (no horizontal mover exists), about 6 seconds, the camera on the cart. Runs while the turntable points at the trestle."}
  - {kind: "mine cart ride, east line", count: 1, notes: "Turntable to the flooded working's buffer stop and back (link:east_cart), scripted the same way; runs only while the turntable points east (map var turntable_east)."}
  - {kind: Deep Line cart (map exit), count: 1, notes: "The chained cart in the deep station: 'The chain is locked through the brake' until the brake key is used (consumed); then a click rides to XD-03 with a camera shake. The exit face is the Deep Line's mouth in the station's west wall."}
  - {kind: hoist cage (lift), count: 1, notes: "A lift about 192 square on the stope floor against its north-east side, travel 768 (speed 96, about 8 seconds) to the rim's hoist gate; down at first, rides on a click from inside; callable from the rim once ridden (map var hoist_used)."}
  - {kind: turntable lever, count: 1, notes: "Wall switch on the Turntable's south-west wall: toggles turntable_east; the timber disc turns a quarter turn (a rotating mover) and the waiting cart with it."}
  - {kind: winch, count: 1, notes: "Clickable winch in the collapsed adit, once: dust, a roar, camera shake; the fall slides away and the west wall becomes the X4 exit face (qbit x4_adit_open)."}
  - {kind: "plank door, hinged", count: 2, notes: "Top Station to the lamp room and to the foot drift; 192 wide, 256 high, in 128 and 64 walls."}
  - {kind: "iron-bound plank door, hinged", count: 2, notes: "Mess hall to the bunk cut; the tally room's door at the top of its steps."}
  - {kind: "ventilation door, hinged", count: 2, notes: "Across the west line: the landing's west wall and the collapsed adit's east wall; 256 wide."}
  - {kind: carved stone double door, count: 1, notes: "The chapel doors in the Turntable's south side: two leaves of 128 swinging inward, in a 128 wall."}
  - {kind: "secret wall, sinking", count: 1, notes: "The chalk-marked dry-stone wall to the forgotten strongroom, 192 wide, sinks 256; secret face found by perception (difficulty 1)."}
  - {kind: "secret wall, rising", count: 1, notes: "The web wall to the blue grotto: web over a thin rock screen, 256 wide, rises 320; the chapel tablet hints at it."}
  - {kind: gold vein (clickable wall), count: 6, notes: "One-time seams on walls: sorting floor west wall, stope rim outer wall, spiral ramps south-east and south-west outer walls, stope floor north-north-east (the rich vein) and south walls, flooded working east wall. The seam texture turns dull after use."}
  - {kind: coloured pool (clickable), count: 4, notes: "Once per character: red (stope grotto), green (chapel), gold (flooded working), blue (blue grotto); each has a coloured point light."}
  - {kind: readable tablet, count: 1, notes: In the chapel.}
  - {kind: rockfall trap, count: 1, notes: "Floor trigger in the middle of the foot drift's west leg, once: 2d6 physical to the party, camera shake, the rubble heap appears (decorations shown by the event)."}
  - {kind: exit face, count: 2, notes: "The X1 portal (adit mouth's east wall) and the X4 adit (the collapsed adit's west wall, after the winch)."}
  - {kind: chest, count: 5, notes: "Two footlockers (bunk cut), the lamp room chest, the clan strongbox (tally room, brake key), the payroll chest (strongroom). Plus the cocooned corpse in the galleries."}
  - {kind: "cart gate (sill, no mover)", count: 3, notes: "The trestle's two gates and the east line's gate at the Turntable: buffers and bars 96 high that walkers cannot cross; the east line's buffer stop at the flooded working is a fourth."}
