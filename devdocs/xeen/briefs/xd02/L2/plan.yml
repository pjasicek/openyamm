atmosphere: "Music: the cave track (map_stats.music cave) throughout; cave sound environment. No fog, no weather. Placed ambient sounds: water dripping in the flooded working, the grottoes and the stope floor; a low wind rising out of the chasm (heard on the foot drift and at both trestle gates); the hoist cable creaking at the rim. Light falls off with depth: warm lantern light (orange-white, radius about 384) at a steady rhythm in the timbered upper workings, about 2.5 to 3.5 lights per M units²; braziers and lanterns at 2 per M units² in the Turntable, the camp and the chapel; the stope lit only at its rim and ledges (about 0.5 per M units² on the floor), so the pit falls into blackness below the rail; unlit: the chasm, the chutes, the east line, the spider galleries and the strongroom. Each coloured pool carries its own point light (red, green, gold, blue, radius about 512), the only light in its grotto. Sector ambient from 8 at the portal to 31 in the chasm (rooms.yml). 45 lights in all."
diagram: {file: diagram.txt}
totals:
  chests: 5
  coloured_pools: 4
  critical_path_length: 24700
  doors: 9
  fixed_actors: 8
  floor_area_millions: 33.5
  gold_veins: 6
  height_range: 1472
  lights: 45
  lights_unlit_spaces: 4
  loops: 2
  monsters_about: 65
  placeholders: 15
  portals: 57
  rooms: 23
  secret_faces: 2
  sectors: 51
  sketch_rooms: 50
  spawn_points: 22
  traps: 1
notes: "Size M at the top of the band by monsters (about 65 in 50 drawn rooms, 51 sectors) and at its foot by floor (33.5 M units² measured on the L3 sketch; L1's estimate of 48 was more than its own extents add up to, about 36). Monsters are placed unevenly: nothing at the mouth, the Top Station, the chapel or the grottoes; light in the drifts; packs at the Turntable and on the spiral; heavy in the mess hall, the tally room and the spider galleries. Two loops (chasm, stope); the cart lines are written as kind lift (no cart kind) and are scripted rides at build (no horizontal mover). The rooms by class: timbered adits and drifts (lamplit, 2.5-3.5 lights per M units²), halls and the camp (2), the chapel (2), the stope and the deep (0.5-2.5), unlit spaces (7). Two thirds of the rooms are non-orthogonal. Risers are 32 throughout; the lowest ceiling on foot is 384. The four pools give +8 stat points per character in all. Changes made while sketching to scale (L2 and L3 agree): the spiral is about 0.6 of a turn, not 1.5, and steps outward round a straight-sided pit, because a room cannot lie over another; its ramps are rock-cut and only the ledges open onto the pit; the deep station is off the spiral's foot north-west of the pit (was south-west of the floor), so the critical path ends rim, spiral, deep station and the floor is on the way back to the hoist; the spider galleries lie south-west of the pit at -864 and the blue grotto beside them at the same level (was -704); the strongroom floor is -160 (one step); the chutes are vertical shafts; pools are brim-full basins (sunken floors are not drawable); the trestle cannot be walked onto; the stope floor (4.0) and the flooded working (3.7) are XL. Themes (the same ids in rooms.yml) name texture families of the shared MM6-MM8 surface library (level_generation/textures_x4/inventory.json) and engine indoor decorations (assets_dev/engine/models/indoor_decorations.yml); placeholders mark props no model exists for (mine carts, the winch, the hoist head frame, the lamp racks, rails, webs, the tablet). timbered_adit: Timbered adit: red-brown rough rock walls (MM7 cave rock cwb1), packed red earth underfoot (7dirttyl), plank lagging overhead (7trimda), squared timber sets framing every doorway and passage mouth (MM6 beam cbeam5), plank doors (MM8 plank boards bwooda1). red_workings: Red workings: the same red-brown rock (cwb1) on walls and roof, red dirt floor (MM7 dirt); gold veins are walls in the gold-seamed variant of the rock (cwb1gold). deep_rock: Deep rock: dark, coarse rock (MM7 c2b) on walls and roof, the dark cave floor (cfb1); colder and blacker than the red workings above. dwarf_hall: Dwarf hall: dressed stone walls (MM7 cwb), dwarf-cut floor slabs (7tfb1), the raw rock left as the roof (cwb1), plank door frames (7trimd), iron-banded plank doors (MM8 bwoodb1). dwarf_chapel: Dwarf chapel: dwarf block walls (MM7 Stone City 7cdb), dark slab floor (7tfb11), dressed stone roof (cwb), carved stone door leaves (t5d1). drowned_working: Drowned working: red rock (cwb1) over standing water as the floor (MM6 water orwtrlga), plank walkways (7trimda). grotto_pool: Grotto pool: deep rock (c2b) round a floor of shallow water (orwtrlga), coloured by the pool's light."
