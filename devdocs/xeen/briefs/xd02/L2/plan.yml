format: 0
level: L2
pitch: "The Red Dwarves' copper and gold mine in the hills north of Vertigo, taken by the Mad Dwarf Clan. A timbered adit and haul drift lead to the Top Station, where carts run out on a trestle over a black chasm to the Turntable, a round cavern where the rail lines meet. The clan camps in the old mess hall and keeps the brake key of the Deep Line in its tally room. Beyond lies the Open Stope, a vast funnel-shaped pit worked in spiral ledges with rails and gold veins in its walls, bats wheeling in the dark above and spiders in the side galleries; at its bottom the chained Deep Line cart goes down to the Clan King. Four coloured pools, the Red Dwarves' old blessings, lie in a grotto, a chapel, a flooded working and a hidden cave: each strengthens a character once. A caved-in west adit, cleared from inside with a winch, comes out far away on Burlock Savannah."
purpose: "Story step M3, first half: get through the Mad Dwarf Clan's hold to the Deep Line and unchain its cart to the Deep Mine (XD-03). Rewards on the way: four one-time +2 stat pools, gold veins, four chests, and a permanent underground shortcut to X4 for Act II. Monster levels 3 to 10 (bats, spiders, mad dwarves, tiger moles). A party of about level 5 to 8."
mood: "Warm lamplight on timber and red rock near the entrance, colder and darker as the party descends; the Open Stope is the big breath of the map, a cathedral of ledges vanishing into blackness. The dwarves' chapel is the one quiet, holy room."
