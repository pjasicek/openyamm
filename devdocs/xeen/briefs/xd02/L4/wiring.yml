format: 0
variables: [turntable_east, hoist_used, vein_sorting_mined, vein_flooded_mined, vein_rim_mined, vein_se_mined, vein_sw_mined, vein_rich_mined]
events:
  - id: evt:arrive
    preset: script
    trigger: timer
    every: 1
    once: true
    effects:
      - message: "Mayor Gunther of Vertigo sent you here. The Mad Dwarf Clan has taken the Red Dwarves' mine, and their Clan King holds the Deep Mine below it. The way down is the Deep Line cart at the bottom of the Open Stope, past the Turntable; the clan keeps it chained, and the brake key lies in their strongbox in the tally room, in the camp north of the Turntable."
    notes: "Why the party is here (pass 3, the user: 'I don't know the intention of it, what quest was there'): QUESTS.md M3, Gunther's errand, until the Xeen world's quests exist in the game; once, on first entry."
  - id: evt:barrel_empty
    preset: text
    source: deco:mess_hall_65
    title: Barrel
    text: The barrel is empty.
    notes: "Original line (aaze0033 #5), on the mess hall's second barrel beside the note's."
  - id: evt:barrel_note
    preset: text
    source: deco:mess_hall_64
    title: Barrel
    text: "Scribbled on a piece of parchment, a note reads: 1 bottle orc's milk, 2 boxes of Dwarf biscuits, 1 can of split toadsoup, and one everlasting stick of troll jerky."
    window: true
    notes: "Original line (aaze0033 #9, the dwarf mines' shopping list, CHANGES XD02-3): in the camp's provisions barrel in the mess hall, as the original keeps its notes in barrels and crates."
  - id: evt:brake
    preset: switch
    source: platform:brake_wheel
    title: Deep Line brake
    condition: {item: brake_key, consume: true}
    opens: [mover:chain]
    sets: {qbit: deep_line_unchained}
    effects:
      - message: "The clan's brake key opens the padlock. You spin the wheel: the chain drops off the Deep Line cart into the rail bed and the brake comes off. The cart is free: climb in at the buffer stop and it will run down the Deep Line to the Clan King's Deep Mine."
    else_effects:
      - lua: "if IsQBitSet(QBit(110021)) then evt.StatusText(\"The chain lies slack in the rail bed: the cart is free.\") else evt.SimpleMessage(\"The Deep Line cart is chained to this brake wheel, the chain padlocked through it. The padlock wants a heavy iron key: the clan keeps it in the strongbox of their tally room off the mess hall.\") end"
    notes: "set:unchain_deep_cart: the brake key (consumed) frees the cart; the qbit opens the Deep Line exit and the cart (evt:deep_cart). Before: a message window says where the key is; when it is used: a message window says what changed and what to do next (pass 3: the user pressed it and could not tell what it did); after: the chain lies slack."
  - id: evt:chalk_mark
    preset: text
    source: panel:chalk_mark
    title: Chalk mark
    text: "An old Red Dwarf mark in chalk: a strongbox, and an arrow pointing into the wall."
  - id: evt:chest_cocoon
    preset: chest
    source: chest:cocoon
    title: Chest
  - id: evt:chest_footlocker_1
    preset: chest
    source: chest:footlocker_1
    title: Chest
  - id: evt:chest_footlocker_3
    preset: chest
    source: chest:footlocker_3
    title: Chest
  - id: evt:chest_lamp_room
    preset: chest
    source: chest:lamp_room
    title: Chest
  - id: evt:chest_payroll
    preset: chest
    source: chest:payroll
    title: Chest
  - id: evt:chest_strongbox
    preset: chest
    source: chest:strongbox
    title: Chest
    text: "Under the tally slates: the Deep Line's brake key, stamped with a cart wheel."
  - id: evt:clan_sign
    preset: text
    source: panel:clan_sign
    title: Warning sign
    text: "Skulls daubed on a board: MAD DWARF CLAN. DIG ELSEWHERE."
    window: true
  - id: evt:deep_barrel
    preset: text
    source: deco:deep_station_101
    title: Barrel
    text: The barrel is empty.
    notes: "Original line (aaze0033 #5), the keg beside the one with the note."
  - id: evt:deep_cart
    preset: script
    source: platform:deep_cart
    title: Deep Line cart
    condition: {qbit: deep_line_unchained}
    locked_text: "The mine car doesn't move: it is chained to the brake wheel."
    effects:
      - lua: "evt.MoveToMap(8192, 1088, 384, 1024, 0, 0, 5003, 1, \"xeen_xd03.blv\")"
    text: The cart runs down the Deep Line into the dark.
    notes: "goal:unchain_deep_line: the cart itself is the ride down, as the player expects (exits[] sit only on a wall face: gap 6), with the exit face at the cutting's end kept. The Lua copies exit:deep_mine's arrival from project.yml (the exit preset's own line): the Deep Mine's start at the Deep Line's foot (XD-03 room:deep_line). The locked text is the original's (aaze0033 #25, aaze0034 #30: \"The mine car doesn't move.\")."
  - id: evt:deep_note
    preset: text
    source: deco:deep_station_100
    title: Barrel
    text: "Scribbled on a piece of parchment, a note reads: There are many DEEP mines."
    window: true
    notes: "Original line (aaze0034 #14, CHANGES XD02-3) at the Deep Line's head: in the keg by the brake wheel."
  - id: evt:deep_station_arrive
    preset: script
    source: room:deep_station
    trigger: step
    once: true
    effects:
      - lua: "evt.StatusText(\"The Deep Line: the clan's cart stands at the buffer stop, chained to a brake wheel.\", 5)"
    notes: The goal in sight on arrival (pass 3).
  - id: evt:door_bunk
    preset: door
    source: door:bunk
    title: Door
  - id: evt:door_chapel
    preset: door
    source: door:chapel
    title: Carved stone doors
  - id: evt:door_foot_drift
    preset: door
    source: door:foot_drift
    title: Plank door
  - id: evt:door_lamp_room
    preset: door
    source: door:lamp_room
    title: Plank door
  - id: evt:door_tally
    preset: door
    source: door:tally
    title: Door
  - id: evt:door_vent_1
    preset: door
    source: door:vent_1
    title: Ventilation door
  - id: evt:door_vent_2
    preset: door
    source: door:vent_2
    title: Ventilation door
  - id: evt:dwarf_smithy
    preset: script
    source: door:dwarf_smithy
    title: Red Dwarf Smithy
    condition: {qbit: m3_done}
    effects:
      - lua: evt.EnterHouse(4851)
    else_effects:
      - message: "The smithy is barred. Behind the door, someone is sharpening something and swearing at the Mad Clan."
    notes: "The Red Dwarf Smithy (house 4851, A4's source/towns/xd02.yml; TOWNS_FORMAT 1, `opens: m3.done`): once M3 is done (m3.done 111061, A3's m3.yml, hook m3.dwarf_shop) the door opens the house; before, a message window with A4's closed text."
  - id: evt:east_cart
    preset: switch
    source: mover:east_cart
    title: Mine cart
    condition: {map_var: turntable_east}
    locked_text: The points at the Turntable are set for the trestle.
    toggles: [mover:east_cart, door:gate_east, door:gate_landing]
    text: The cart splashes off down the drowned line.
  - id: evt:east_landing
    preset: switch
    source: switch:east_landing
    title: Cart lever
    condition: {map_var: turntable_east}
    locked_text: The points at the Turntable are set for the trestle.
    toggles: [mover:east_cart, door:gate_east, door:gate_landing]
    text: The cart rumbles along the east line.
  - id: evt:east_ride_landing
    preset: switch
    source: switch:east_ride_landing
    title: Cart lever
    condition: {map_var: turntable_east}
    locked_text: The points at the Turntable are set for the trestle.
    toggles: [mover:east_cart, door:gate_east, door:gate_landing]
    text: The cart rumbles along the east line.
    notes: "The riders' lever at the landing's stop (pass 3: every lever used from a cart faces its deck and is within reach at that stop)."
  - id: evt:east_ride_turntable
    preset: switch
    source: switch:east_ride_turntable
    title: Cart lever
    condition: {map_var: turntable_east}
    locked_text: The points at the Turntable are set for the trestle.
    toggles: [mover:east_cart, door:gate_east, door:gate_landing]
    text: The cart splashes off down the drowned line.
    notes: The riders' lever at the Turntable's stop.
  - id: evt:east_turntable
    preset: switch
    source: switch:east_turntable
    title: Cart lever
    condition: {map_var: turntable_east}
    locked_text: The points at the Turntable are set for the trestle.
    toggles: [mover:east_cart, door:gate_east, door:gate_landing]
    text: The cart rumbles along the east line.
  - id: evt:exit_deep
    preset: exit
    source: exit:deep
    title: The Deep Line
    condition: {qbit: deep_line_unchained}
    locked_text: The Deep Line cart is chained to its brake wheel.
    text: The cart runs down the Deep Line into the dark.
  - id: evt:exit_x1
    preset: exit
    source: exit:x1
    title: "Daylight: the hills north of Vertigo"
  - id: evt:exit_x4
    preset: exit
    source: exit:x4
    title: The west adit
    condition: {qbit: x4_adit_open}
    locked_text: Rock fills the adit to the roof. The winch might drag it away.
    notes: Out to X4's red dwarf hills (opened 2026-11-20 once X4 was installed).
  - id: evt:fall_cleared
    preset: script
    trigger: load
    condition: {qbit: x4_adit_open}
    opens: [mover:fall]
    effects:
      - lights_on: light:west_daylight
    notes: "Keeps the adit open on every entry once the winch has been used, also when the map's state was reset (a rebuilt map); the arrival from X4 stands east of the fall's place."
  - id: evt:hoist_cage
    preset: switch
    source: mover:hoist
    title: Hoist cage
    toggles: [mover:hoist, door:hoist_gate]
    sets: {map_var: hoist_used}
    text: The cage jerks and rides up the shaft on its creaking cable.
  - id: evt:hoist_floor
    preset: switch
    source: switch:hoist_floor
    title: Hoist lever
    toggles: [mover:hoist, door:hoist_gate]
    sets: {map_var: hoist_used}
    text: The hoist cable sings.
    notes: "Beside the cage's foot, within reach from inside the cage: it sends the cage up (with whoever stands in it) or calls it down, and takes the hoist's brake off for the rim's lever (pass 3: it refused until the cage had been clicked, and told a rider to 'work its lever')."
  - id: evt:hoist_ride_rim
    preset: switch
    source: switch:hoist_ride_rim
    title: Hoist lever
    toggles: [mover:hoist, door:hoist_gate]
    sets: {map_var: hoist_used}
    text: The cage jerks and sinks down the shaft.
    notes: "The riders' lever at the rim stop (pass 3: a lever used while riding faces the deck and is in reach at that stop)."
  - id: evt:hoist_rim
    preset: switch
    source: switch:hoist_rim
    title: Hoist lever
    condition: {map_var: hoist_used}
    toggles: [mover:hoist, door:hoist_gate]
    else_effects:
      - message: "The bell rings far below; nobody answers. The cage waits on the stope floor, braked: work it once from the floor and its brake comes off."
    text: The hoist cable sings.
  - id: evt:points
    preset: switch
    source: switch:points
    title: Points lever
    condition: {not: {map_var: turntable_east}}
    effects:
      - set:
          var:
            map_var: turntable_east
          value: 1
      - lights_on: light:signal_east
      - lights_off: light:signal_trestle
    else_effects:
      - set:
          var:
            map_var: turntable_east
          value: 0
      - lights_on: light:signal_trestle
      - lights_off: light:signal_east
      - text: "The turntable grinds round: the trestle line is live."
    text: "The turntable grinds round: the east line is live."
    notes: "set:turntable: toggles turntable_east (the trestle by default); the lever's handle is down while the east line is live, and the green lamps show which line is."
  - id: evt:pool_blue
    preset: script
    source: platform:blue_pool
    title: Drink from the blue pool
    condition: {lua: not IsPlayerBitSet(PlayerBit(11024))}
    effects:
      - add:
          var: BaseIntellect
          value: 2
      - lua: SetPlayerBit(PlayerBit(11024))
    else_effects:
      - text: The water tastes of nothing.
    text: "The blue water is sweet and very clear. (+2 Intellect, permanent)"
    notes: "poi:blue_pool: +2 Intellect once for each character (a per-character bit, 11024, set by Lua: no word says a player bit)."
  - id: evt:pool_gold
    preset: script
    source: platform:gold_pool
    title: Drink from the gold pool
    condition: {lua: not IsPlayerBitSet(PlayerBit(11023))}
    effects:
      - add:
          var: BaseAccuracy
          value: 2
      - lua: SetPlayerBit(PlayerBit(11023))
    else_effects:
      - text: The water tastes of nothing.
    text: "The golden water tastes of metal. (+2 Accuracy, permanent)"
    notes: "poi:gold_pool: +2 Accuracy once for each character (a per-character bit, 11023, set by Lua: no word says a player bit)."
  - id: evt:pool_green
    preset: script
    source: platform:green_pool
    title: Drink from the green pool
    condition: {lua: not IsPlayerBitSet(PlayerBit(11022))}
    effects:
      - add:
          var: BaseEndurance
          value: 2
      - lua: SetPlayerBit(PlayerBit(11022))
    else_effects:
      - text: The water tastes of nothing.
    text: "The green water is cold as the deep rock. (+2 Endurance, permanent)"
    notes: "poi:green_pool: +2 Endurance once for each character (a per-character bit, 11022, set by Lua: no word says a player bit)."
  - id: evt:pool_red
    preset: script
    source: platform:red_pool
    title: Drink from the red pool
    condition: {lua: not IsPlayerBitSet(PlayerBit(11021))}
    effects:
      - add:
          var: BaseMight
          value: 2
      - lua: SetPlayerBit(PlayerBit(11021))
    else_effects:
      - text: The water tastes of nothing.
    text: "The red water burns going down. (+2 Might, permanent)"
    notes: "poi:red_pool: +2 Might once for each character (a per-character bit, 11021, set by Lua: no word says a player bit)."
  - id: evt:rockfall
    preset: script
    source: plate:rockfall
    trigger: step
    opens: [mover:rubble]
    once: true
    effects:
      - damage:
          amount: 7
          kind: physical
      - lua: "evt.CameraShake(1.0, 1.2)"
    text: "A cave in! The rotten props give way and rock thunders down."
    notes: "set:rockfall: once; about 2d6 to the whole party (7), the rubble heap left in the drift."
  - id: evt:strongroom_wall
    preset: door
    source: door:strongroom
    title: Dry-stone wall
    action: open
    text: "The old dry-stone wall slumps into the floor: a vault behind it."
  - id: evt:tablet
    preset: script
    source: panel:chapel_tablet
    title: The Red Dwarves' tablet
    effects:
      - message: "Carved in the old runes, the faces smashed above them: RED FOR THE ARM. GREEN FOR THE BACK. GOLD FOR THE EYE. BLUE FOR THE MIND. THE BLUE SLEEPS BEHIND THE SILK."
  - id: evt:tally_enter
    preset: script
    source: room:tally_room
    trigger: step
    once: true
    effects:
      - lua: "evt.StatusText(\"The clan's tally room: its strongbox stands behind the tally table.\", 5)"
    notes: "The key's chest named as the party comes in (pass 3; since the rebase, 2026-11-20, no boss: the Tallymaster is an ordinary guard)."
  - id: evt:trestle_car
    preset: switch
    source: mover:trestle_car
    title: Trestle car
    condition: {not: {map_var: turntable_east}}
    locked_text: The points at the Turntable are set for the east line.
    toggles: [mover:trestle_car, door:gate_station, door:gate_turntable]
    text: The car rolls out over the chasm.
  - id: evt:trestle_ride_station
    preset: switch
    source: switch:trestle_ride_station
    title: Car lever
    condition: {not: {map_var: turntable_east}}
    locked_text: The points at the Turntable are set for the east line.
    toggles: [mover:trestle_car, door:gate_station, door:gate_turntable]
    text: The car rolls out over the chasm.
    notes: "The riders' lever at the Top Station's stop (pass 3, the user: 'how am I supposed to press that lever while being on the moving platform? the lever is from the other side')."
  - id: evt:trestle_ride_turntable
    preset: switch
    source: switch:trestle_ride_turntable
    title: Car lever
    condition: {not: {map_var: turntable_east}}
    locked_text: The points at the Turntable are set for the east line.
    toggles: [mover:trestle_car, door:gate_station, door:gate_turntable]
    text: The car rolls back up the trestle.
    notes: The riders' lever at the Turntable's stop.
  - id: evt:trestle_station
    preset: switch
    source: switch:trestle_station
    title: Car lever
    condition: {not: {map_var: turntable_east}}
    locked_text: The points at the Turntable are set for the east line.
    toggles: [mover:trestle_car, door:gate_station, door:gate_turntable]
    text: The car rumbles along the trestle.
  - id: evt:trestle_turntable
    preset: switch
    source: switch:trestle_turntable
    title: Car lever
    condition: {not: {map_var: turntable_east}}
    locked_text: The points at the Turntable are set for the east line.
    toggles: [mover:trestle_car, door:gate_station, door:gate_turntable]
    text: The car rumbles along the trestle.
  - id: evt:vein_flooded
    preset: switch
    source: switch:vein_flooded
    title: Gold vein
    condition: {not: {map_var: vein_flooded_mined}}
    locked_text: Only bare rock is left where the seam was.
    sets: {map_var: vein_flooded_mined}
    effects:
      - gold: 110
      - lights_off: light:glint_flooded
    text: "A seam of gold above the water line: you chip it out."
  - id: evt:vein_rich
    preset: switch
    source: switch:vein_rich
    title: Rich gold vein
    condition: {not: {map_var: vein_rich_mined}}
    locked_text: Only bare rock is left where the seam was.
    opens: [door:mole_rock]
    sets: {map_var: vein_rich_mined}
    effects:
      - gold: 200
      - lights_off: light:glint_rich
      - lua: "evt.CameraShake(0.7, 1.5)"
    text: "A fat seam of gold - and the rock beside it caves in!"
    notes: "set:rich_vein: the richest seam; the burrow behind it opens and the two tiger moles come out."
  - id: evt:vein_rim
    preset: switch
    source: switch:vein_rim
    title: Gold vein
    condition: {not: {map_var: vein_rim_mined}}
    locked_text: Only bare rock is left where the seam was.
    sets: {map_var: vein_rim_mined}
    effects:
      - gold: 90
      - lights_off: light:glint_rim
    text: "A thin seam of gold over the drop: you chip it out."
  - id: evt:vein_se
    preset: switch
    source: switch:vein_se
    title: Gold vein
    condition: {not: {map_var: vein_se_mined}}
    locked_text: Only bare rock is left where the seam was.
    sets: {map_var: vein_se_mined}
    effects:
      - gold: 110
      - lights_off: light:glint_se
    text: "Gold glints in the ramp wall: you chip out the seam."
  - id: evt:vein_sorting
    preset: switch
    source: switch:vein_sorting
    title: Gold vein
    condition: {not: {map_var: vein_sorting_mined}}
    locked_text: Only bare rock is left where the seam was.
    sets: {map_var: vein_sorting_mined}
    effects:
      - gold: 120
      - lights_off: light:glint_sorting
    text: "A glinting seam of gold: you chip out a handful of nuggets."
  - id: evt:vein_sw
    preset: switch
    source: switch:vein_sw
    title: Gold vein
    condition: {not: {map_var: vein_sw_mined}}
    locked_text: Only bare rock is left where the seam was.
    sets: {map_var: vein_sw_mined}
    effects:
      - gold: 80
      - lights_off: light:glint_sw
    text: "A seam of gold in the ramp wall: you chip it out."
  - id: evt:web_wall
    preset: door
    source: door:web_wall
    title: Thick old web
    action: open
    text: "You cut the web away; the rock screen behind it lifts."
  - id: evt:winch
    preset: switch
    source: platform:winch
    title: Winch
    condition: {not: {qbit: x4_adit_open}}
    opens: [mover:fall]
    effects:
      - qbit: x4_adit_open
      - lights_on: light:west_daylight
      - lua: "evt.CameraShake(1.2, 2.5)"
    else_effects:
      - text: "The winch's rope hangs slack: the fall is gone."
    text: "The props come out and the whole fall slides away: daylight!"
    notes: "set:west_adit_winch: once; the fall goes, the X4 exit opens for good (qbit x4_adit_open)."
notes: "Every mechanism is a preset with conditions and effects. Lua only for what no word says: the pools' per-character bits (IsPlayerBitSet / SetPlayerBit) and the camera shakes (evt.CameraShake); the clan's hostility is objects.yml `relations`."
