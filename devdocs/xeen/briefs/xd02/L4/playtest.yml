        if not string.find(seen, "Rock fills", 1, true) then error("the west adit's exit did not say it was shut: " .. seen) end
        if door_state(19) ~= "closed" then error("the fall does not start in place") end
        click(44); wait(12)
        if door_state(19) ~= "open" then error("the winch did not send the fall away: " .. door_state(19)) end
        if not qbit(110020) then error("the winch did not set x4_adit_open") end
  - assert: {map: xeen_xd02.blv}
  - walk_to: {x: 2600, y: 5184, z: 256, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - assert: {party_position: {x: 2600, y: 5184, radius: 100, z_min: 248, z_max: 264}}
  # The low gallery to the rim, the rim's vein.
  - walk_to: {x: 4500, y: 5184, z: 40, radius: 64, timeout_seconds: 60, clear_hostiles: 800}
  - walk_to: {x: 7300, y: 5184, z: -370, radius: 64, timeout_seconds: 60, clear_hostiles: 800}
  - walk_to: {x: 7900, y: 4650, z: -384, radius: 64, timeout_seconds: 60, clear_hostiles: 800}
