        if gold() ~= before + 110 then error("the flooded working's vein did not pay 110") end
  - walk_to: {x: 12500, y: 1408, z: -616, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 12800, y: 1408, z: -608, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - play_lua:
      source: |
        status()
        click(28); wait(1)
        local seen = status()
        if not string.find(seen, "+2 Accuracy", 1, true) then error("the gold pool did not give Accuracy: " .. seen) end
        click(28); wait(1)
        seen = status()
        if not string.find(seen, "tastes of nothing", 1, true) then error("the gold pool gave twice: " .. seen) end
  # Back along the planks, up the landing, onto the cart and up the line to the Turntable.
  - walk_to: {x: 11744, y: 1408, z: -616, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 10912, y: 1600, z: -616, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 10900, y: 2150, z: -620, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 11000, y: 2800, z: -400, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 10727, y: 2971, z: -384, radius: 32, timeout_seconds: 60, clear_hostiles: 1200}
  - play_lua:
      source: |
        click(17); wait(14)
        if door_state(18) ~= "closed" or door_state(5) ~= "open" or door_state(6) ~= "closed" then error("the east cart did not come back") end
  - assert: {party_position: {x: 9341, y: 4357, radius: 200, z_min: -392, z_max: -372}}
  - walk_to: {x: 8960, y: 4870, z: -384, radius: 48, timeout_seconds: 60, clear_hostiles: 1200}
  - play_lua: {source: "click(26); wait(2)"}
  - assert: {state_dump_map_var: {index: 0, value: 0}}
  # The camp: across the mess hall, up the tally steps, the iron-banded door, the tally room's guards and tallymaster,
  # and the brake key in the clan's strongbox.
  - walk_to: {x: 8512, y: 6450, z: -384, radius: 96, timeout_seconds: 60, clear_hostiles: 900}
  - walk_to: {x: 7360, y: 7000, z: -384, radius: 96, timeout_seconds: 60, clear_hostiles: 500}
  - walk_to: {x: 7050, y: 7200, z: -384, radius: 64, timeout_seconds: 60, clear_hostiles: 400}
  - walk_to: {x: 6680, y: 7200, z: -288, radius: 48, timeout_seconds: 60, clear_hostiles: 200}
  - play_lua:
      source: |
        open_door(14, 13)
        if door_state(13) ~= "open" then error("the tally door did not open") end
  - clear_hostiles: {radius: 900}
  - assert: {actor_count: {monster_id: 229, near: [6000, 7200, 600], max: 0}}
  - walk_to: {x: 5880, y: 7200, z: -288, radius: 64, timeout_seconds: 60, clear_hostiles: 900}
  - play_lua:
      source: |
        log("packs before the strongbox: " .. pack_items())
        loot_chest(8)
        if not has_item(2111) then error("the strongbox did not hold the brake key") end
  # The bunk cut's door.
  - walk_to: {x: 7050, y: 7200, z: -384, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 7328, y: 7420, z: -384, radius: 48, timeout_seconds: 60, clear_hostiles: 1200}
  - play_lua:
      source: |
        open_door(10, 1)
        if door_state(1) ~= "open" then error("the bunk door did not open") end
  - walk_to: {x: 7300, y: 7850, z: -352, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  # The chapel: the carved doors, the tablet and the green pool.
  - walk_to: {x: 7360, y: 7000, z: -384, radius: 96, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 8512, y: 4320, z: -384, radius: 48, timeout_seconds: 60, clear_hostiles: 1200}
  - play_lua:
      source: |
        open_door(11, 2)
        if door_state(2) ~= "open" or door_state(3) ~= "open" then error("the chapel doors did not open") end
  - walk_to: {x: 8512, y: 3700, z: -448, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 8512, y: 2720, z: -448, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - play_lua: {source: "click(33); wait(1); close(); wait(1)"}
  - walk_to: {x: 8512, y: 3420, z: -448, radius: 48, timeout_seconds: 60, clear_hostiles: 1200}
  - play_lua:
      source: |
        status()
        click(29); wait(1)
        local seen = status()
        if not string.find(seen, "+2 Endurance", 1, true) then error("the green pool did not give Endurance: " .. seen) end
        click(29); wait(1)
        seen = status()
        if not string.find(seen, "tastes of nothing", 1, true) then error("the green pool gave twice: " .. seen) end
  # The west line: both ventilation doors, the west adit's fall, the winch.
  - walk_to: {x: 8512, y: 4320, z: -384, radius: 64, timeout_seconds: 60, clear_hostiles: 900}
  - walk_to: {x: 7400, y: 5184, z: -370, radius: 64, timeout_seconds: 60, clear_hostiles: 800}
  - walk_to: {x: 5700, y: 5184, z: -64, radius: 64, timeout_seconds: 60, clear_hostiles: 800}
  - walk_to: {x: 5200, y: 5184, z: -64, radius: 48, timeout_seconds: 60, clear_hostiles: 800}
  - play_lua:
