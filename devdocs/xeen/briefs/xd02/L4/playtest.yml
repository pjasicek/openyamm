  - assert: {state_dump_map_var: {index: 0, value: 1}}
  - walk_to: {x: 9080, y: 4600, z: -384, radius: 48, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 9341, y: 4357, z: -384, radius: 32, timeout_seconds: 60, clear_hostiles: 1200}
  - play_lua:
      source: |
        if door_state(18) ~= "closed" or door_state(5) ~= "open" then error("the east cart does not wait at the Turntable") end
        click(17); wait(14)
        if door_state(18) ~= "open" or door_state(6) ~= "open" then error("the east cart did not run: " .. door_state(18) .. door_state(6)) end
  - assert: {party_position: {x: 10727, y: 2971, radius: 200, z_min: -392, z_max: -372}}
  # The buffer landing, down into the flooded working, along the planks (tiger moles) to the dry hump.
  - walk_to: {x: 11000, y: 2800, z: -400, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 10900, y: 2150, z: -620, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 10912, y: 1600, z: -616, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 11744, y: 1408, z: -616, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 12400, y: 1000, z: -640, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - play_lua:
      source: |
        local before = gold()
