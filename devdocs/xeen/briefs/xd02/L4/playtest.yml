  # On down: the south-west ramp's vein, the west-south-west ledge, the last ramp to the floor.
  - walk_to: {x: 5841, y: 1993, z: -864, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 5530, y: 2202, z: -944, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - play_lua:
      source: |
        local before = gold()
        click(42); wait(1)
