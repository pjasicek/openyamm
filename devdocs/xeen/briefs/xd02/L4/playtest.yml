  - walk_to: {x: 7095, y: 2513, z: -544, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 6886, y: 2202, z: -624, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - play_lua:
