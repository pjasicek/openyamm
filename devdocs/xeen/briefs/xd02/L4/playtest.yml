  - walk_to: {x: 11872, y: 5450, z: -192, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 11800, y: 5420, z: -160, radius: 48, timeout_seconds: 60, clear_hostiles: 1200}
