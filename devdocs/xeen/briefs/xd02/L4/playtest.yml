# Playtest of the Red Dwarf Mines (XD-02, L4): a level-6 party walks in by the adit, reads the clan's warning, takes the
# Torch Light scroll off the lamp rack, chips the sorting floor's vein, finds the strongroom behind the chalk mark and
# loots the payroll chest; rides the trestle car over the chasm to the Turntable, walks back by the foot drift (the
# rockfall comes down behind it once), calls the car back with the station's lever and rides it again; sets the points
# east, sees the trestle car refuse, rides the east cart down the drowned line, crosses the flooded working on its
# planks (tiger moles), chips its vein, drinks the gold pool (twice: once only), rides back and sets the points back;
# fights into the tally room and takes the brake key from the clan's strongbox; reads the chapel's tablet and drinks
# the green pool; walks the west line through both ventilation doors, finds the west adit's exit shut, works the winch
# (the fall goes, x4_adit_open); goes through the low gallery to the rim, chips the rim's vein, walks the spiral of
# ledges and ramps down the Open Stope, chips the south-east ramp's vein, crawls into the spider galleries, cuts the web
# wall and drinks the blue pool, chips the south-west ramp's vein, comes down to the floor, drinks the red pool (Might
# +2, and once only), mines the rich vein (the burrow breaks open: two tiger moles), rides the hoist up to the rim and
# down again (calling it with the rim's bell-pull in between), and at the Deep Line station finds the line shut, frees
# the cart with the brake key and rides down the Deep Line (the exit asks first; the stand-in neighbour is Emerald
# Island).
# Event, door, map-variable and light numbers are ids.lock.yml's. Nothing depends on chance: only the payroll chest
# (fixed amethyst) and the strongbox (fixed key) are looted, after packs are checked for room, and every walk past a
# spawn point clears hostiles near it; the placed tally guards and moles are met and killed by clear_hostiles where a
# player would fight them.
id: xeen.xd02.l4.walk
title: Red Dwarf Mines (XD-02 L4), adit to the Deep Line, every ride, pool and vein
world: mm7
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_xd02.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 6, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 6, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 6, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 6, skills: [], equipment: {}}
  - assert: {map: xeen_xd02.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - assert: {party_position: {x: 14120, y: 3392, radius: 64, z_min: -8, z_max: 8}}
  # The adit mouth: the clan's warning on the west wall.
  - play_lua:
      source: |
        status()
        click(9); wait(1)
        local seen = status()
        if not string.find(seen, "MAD DWARF CLAN", 1, true) then error("the clan's warning did not read: " .. seen) end
  # Down the haul drift (bats round the bend) to the Top Station.
  - walk_to: {x: 13000, y: 3392, z: 0, radius: 96, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 12736, y: 4400, z: -150, radius: 96, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 12400, y: 5000, z: -192, radius: 96, timeout_seconds: 60, clear_hostiles: 1200}
  - assert: {party_position: {x: 12400, y: 5000, radius: 140, z_min: -200, z_max: -184}}
  # The lamp room: its plank door, and the Torch Light scroll on the lamp rack.
  - walk_to: {x: 12288, y: 4830, z: -192, radius: 48, timeout_seconds: 60, clear_hostiles: 1200}
  - play_lua:
      source: |
        open_door(13, 10)
        if door_state(10) ~= "open" then error("the lamp room door did not open: " .. door_state(10)) end
  - walk_to: {x: 12250, y: 4300, z: -192, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - pick_up: {item_id: 300}
  - walk_to: {x: 12288, y: 4830, z: -192, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  # The sorting floor: the vein in the slanted west wall pays once.
  - walk_to: {x: 12600, y: 5900, z: -192, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 12520, y: 6200, z: -192, radius: 48, timeout_seconds: 60, clear_hostiles: 1200}
  - play_lua:
      source: |
        local before = gold()
        click(41); wait(1)
        if gold() ~= before + 120 then error("the sorting floor's vein did not pay 120: " .. before .. " -> " .. gold()) end
        click(41); wait(1)
        if gold() ~= before + 120 then error("the sorting floor's vein paid twice") end
  # The chalk mark, and the dry-stone wall under it, which sinks: the forgotten strongroom and its payroll chest.
  - walk_to: {x: 13440, y: 6157, z: -192, radius: 48, timeout_seconds: 60, clear_hostiles: 1200}
  - play_lua:
      source: |
        status()
        click(2); wait(1)
        local seen = status()
        if not string.find(seen, "strongbox", 1, true) then error("the chalk mark did not read: " .. seen) end
        if door_state(12) ~= "closed" then error("the strongroom wall does not start shut") end
        click(32); wait(5)
        if door_state(12) ~= "open" then error("the strongroom wall did not sink: " .. door_state(12)) end
  - walk_to: {x: 13950, y: 6208, z: -160, radius: 64, timeout_seconds: 60, clear_hostiles: 600}
  - play_lua:
      source: |
        log("packs before the payroll chest: " .. pack_items())
        loot_chest(7)
        if not has_item(181) then error("the payroll chest did not hold its amethyst") end
  # The trestle car: from the loading platform onto the car, and over the chasm to the Turntable.
  - walk_to: {x: 13450, y: 6157, z: -192, radius: 64, timeout_seconds: 60, clear_hostiles: 600}
  - walk_to: {x: 12300, y: 5184, z: -192, radius: 96, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 11800, y: 5184, z: -160, radius: 48, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 11470, y: 5184, z: -160, radius: 32, timeout_seconds: 60, clear_hostiles: 1200}
  - play_lua:
      source: |
        if door_state(22) ~= "closed" or door_state(7) ~= "open" or door_state(8) ~= "closed" then
          error("the car and its gates do not start at the Top Station: " .. door_state(22) .. door_state(7) .. door_state(8))
        end
