        if door_state(14) ~= "open" then error("the first ventilation door did not open") end
  - walk_to: {x: 3600, y: 5184, z: 240, radius: 48, timeout_seconds: 60, clear_hostiles: 1200}
  - play_lua:
      source: |
        open_door(16, 15)
        if door_state(15) ~= "open" then error("the second ventilation door did not open") end
  - walk_to: {x: 3100, y: 5184, z: 256, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - play_lua:
      source: |
        status()
        click(22); wait(1)
