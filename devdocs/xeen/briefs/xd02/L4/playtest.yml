        if door_state(22) ~= "open" or door_state(7) ~= "closed" or door_state(8) ~= "open" then
          error("the car did not run to the Turntable: " .. door_state(22) .. door_state(7) .. door_state(8))
        end
  - assert: {party_position: {x: 9890, y: 5184, radius: 200, z_min: -392, z_max: -372}}
  - walk_to: {x: 9200, y: 5184, z: -384, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - assert: {party_position: {x: 9200, y: 5184, radius: 100, z_min: -392, z_max: -376}}
  # Back round by the foot drift: the rockfall comes down once, behind the party, and leaves its heap.
  - walk_to: {x: 9400, y: 5950, z: -384, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 9900, y: 5984, z: -288, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 10500, y: 5900, z: -192, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - play_lua: {source: "if door_state(21) ~= 'closed' then error('the rubble is not up in the roof') end"}
  - walk_to: {x: 11600, y: 5940, z: -192, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - play_lua: {source: "wait(2); if door_state(21) ~= 'open' then error('the rockfall did not come down: ' .. door_state(21)) end"}
  - assert: {state_dump_map_var: {index: 2, value: 1}}
  - walk_to: {x: 10500, y: 5900, z: -192, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 11600, y: 5940, z: -192, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - assert: {state_dump_map_var: {index: 2, value: 1}}
