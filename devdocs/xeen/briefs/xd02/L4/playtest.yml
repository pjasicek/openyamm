  - walk_to: {x: 5600, y: 3150, z: -1152, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - assert: {party_position: {x: 5600, y: 3150, radius: 100, z_min: -1160, z_max: -1144}}
  # The red pool grotto: Might +2 for the drinker, and only once.
  - walk_to: {x: 6208, y: 3800, z: -1152, radius: 64, timeout_seconds: 60, clear_hostiles: 400}
  - walk_to: {x: 6208, y: 4300, z: -1184, radius: 64, timeout_seconds: 60, clear_hostiles: 300}
  - play_lua:
      source: |
        local function might(text) return tonumber(string.match(text, "might (%d+)")) end
        local before = might(party())
        status()
        click(30); wait(1)
        local seen = status()
        if not string.find(seen, "+2 Might", 1, true) then error("the red pool did not give Might: " .. seen) end
        local after = might(party())
        if after ~= before + 2 then error("the drinker's Might did not rise by 2: " .. before .. " -> " .. after) end
        click(30); wait(1)
        if might(party()) ~= after then error("the red pool gave twice") end
