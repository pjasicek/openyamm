notes: "Xeen design brief, level L4: L3's rooms redrawn with the studio's words of 2026-11-13, surfaces, objects and wiring; a playable map (NOTES.md). Story step M3, first half (devdocs/xeen/QUESTS.md). The Xeen world has no package, monsters or items yet, so this L4 is built and played as an MM7 map: `world: mm7` until worlds/xeen exists (one line to change back), as XD-01 is. Stand-ins: slot 1 Mad Dwarves (Mad Dwarf 7) is MM7's Dwarf family (Dwarven Soldier 10), slot 2 Spiders (5 / 10) is the Spider family (5 / 8 / 12), slot 3 Bats (Giant Bat 3 / Bat Queen 10) the Bat family (3 / 6 / 9); the Tiger Moles (Burrower 9) are Troglodyte Drones (412, level 9); the Tallymaster is a Dwarven Soldier with hp 80 and a name. The brake key 12011 is the plain Key 2111. Quest bits keep their provisional Xeen numbers (110020-110021); the pools' per-character bits are 11021-11024 (provisional). Music is the MM7 cave track 18 for the name cave, which the game refuses. All three neighbours point at Emerald Island until X1, X4 and XD-03 exist."
