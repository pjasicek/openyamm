notes: "The to-scale sketch of XD-02 in whole map units: x east, y north, origin at the map's south-west corner (the map spans about x 1984 to 14336 and y 320 to 8448, 24 by 16 cells); heights from the plan's datum, the arrival (0). Corners are whole units; 45-degree walls run exactly diagonal and the round rooms (the Turntable, the stope) are 16-sided with chamfers on a 5:12 slope, so every pair of joined walls is exactly parallel. Walls between joined rooms are 64 thick unless an opening's notes say otherwise (128 at the plank, iron-bound and carved doors, the secret walls and the trestle gates; 192 at the chasm window; 256 at the galleries' crawl). A plan space is one room except where a ramp, a flight or a level turn must be its own room; the extra rooms name their space (the drift 2, the foot drift 3, the tally and chapel steps, the chutes and bunk niches, the east line 2, the west line 4, the stope gallery, the spiral 10, the Deep Line approach). The open stope is the stope floor room, a pit 1536 high, with the spiral stepping round its outside: five rock-cut ramps (sloped rooms cannot open sideways) alternating with four railed ledges, from the rim (-384) to the spiral's foot (-1152), about 0.6 of a turn. The chasm is a room whose floor is never reached; the trestle is a tall timber-faced platform in it that does not touch its end walls. The cart lines' gates and buffers are 96 sills: walkers cannot enter the lines and the rides are scripted moves (no horizontal mover exists). Every floor change on the critical path and the way back is a ramp, a flight, a 32 step or the hoist (a lift in objects.yml, travel 768, at the stope floor's north-east side under the rim's hoist gate), so the arrival walks to the Deep Line station on foot by the foot drift and returns by the hoist. Platforms stand at least 64 off every wall. Ambient levels: 8 at the portal, 12 to 16 in the lamplit upper workings, the Turntable and the camp, 20 to 26 in the stope, the lines and the deep, 31 in the chasm."
