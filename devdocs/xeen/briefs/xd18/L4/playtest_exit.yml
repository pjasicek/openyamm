# The way out (the exit preset, D-24): from the mouth's daylight to X7's entrance:xd18_mouth (-4096, 16896) facing south
# (A5's named arrival); the leave window's OK pressed; the landing measured (status) and still there 6 s later.
id: xeen.xd18.l4.exit
title: "Dragon Cave (XD-18 L4), out through the mouth to X7"
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_xd18.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 62, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 62, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 62, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 62, skills: [], equipment: {}}
  - assert: {map: xeen_xd18.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - play_lua: {source: "wait(2); close()"}
  - walk_to: {x: 140, y: -3072, z: 0, radius: 48, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - execute_event: {id: 11}
  - assert: {dialog: {active: true, text_contains: "Do you wish to leave"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_x7.odm}
  - play_lua: {source: "log('landing: ' .. status())"}
  - clear_hostiles: {radius: 6000}
  - advance_runtime: {seconds: 6.0}
  - play_lua: {source: "log('landing after 6 s: ' .. status())"}
  - assert: {party_position: {x: -4096, y: 16896, radius: 160, z_min: 2000}}
