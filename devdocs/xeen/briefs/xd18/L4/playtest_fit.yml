# F75 (reviews/PLAYER_FEEDBACK_20261126.md, XD-18 p1 "dragon gets stuck", p2 "they get stuck"): the party (immortal)
# waits 30 s just beyond three of D-32's low openings (288 high; a dragon is 487 high, radius 238) where the dragons see
# it. No dragon of the row comes within 280 of the opening: each is leashed so its body stays 64 clear (gen.py LEASH,
# tools/xeen/check_monster_fit.py). On the map before F75 a dragon pressed into each of them.
id: xeen.xd18.l4.fit
title: "Dragon Cave (XD-18 L4), F75: no dragon stuck in a low opening"
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_xd18.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 62, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 62, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 62, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 62, skills: [], equipment: {}}
  - assert: {map: xeen_xd18.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - play_lua: {source: "wait(2); close()"}
  # p1: the scorched passage's mouth on the bone hall
  - set_pose: {map: xeen_xd18.blv, x: 3800, y: -3072, z: 0, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 30}
  - play_lua: {source: "log('p1 after 30 s: ' .. tostring(status()))"}
  - assert: {actor_count: {monster_id: 11641, near: [3968, -3072, 280], max: 0}}
  # p2: the stair foot by the pools
  - set_pose: {map: xeen_xd18.blv, x: 9447, y: 1347, z: -1024, yaw: 2.929, pitch: 0.0}
  - advance_runtime: {seconds: 30}
  - play_lua: {source: "log('p2 after 30 s: ' .. tostring(status()))"}
  - assert: {actor_count: {monster_id: 11642, near: [8192, 1536, 280], max: 0}}
  - assert: {actor_count: {monster_id: 11642, near: [9312, 1280, 280], max: 0}}
  # roost: the stair foot's opening on the roost
  - set_pose: {map: xeen_xd18.blv, x: 8576, y: 0, z: -1024, yaw: 3.1416, pitch: 0.0}
  - advance_runtime: {seconds: 30}
  - play_lua: {source: "log('roost after 30 s: ' .. tostring(status()))"}
  - assert: {actor_count: {monster_id: 11642, near: [8192, -192, 280], max: 0}}
