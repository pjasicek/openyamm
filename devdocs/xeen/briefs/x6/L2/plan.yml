format: 0
level: L2
pitch: "Cloudside's north-west corner: a hot desert of dunes and red mesas between two edges of the world. Castle Basenji stands on a cliff at the north rim with nothing but stars behind it; the Northern Sphinx lies in the dunes; in the west the sand pours over the rim and streams off into space, past a second sphinx buried to its shoulders. Between them the caravan road crosses the pan to Sphinx Wells, and in the south-east the Barbaric Mountains hide the yard of the Warzone."
purpose: "Act IV's wilderness (party 30-33): Arie and Castle Basenji (Q-C8, XD-14), the Northern Sphinx (Q-C9, XD-15), the Warzone arena and its coach (XD-20, D-8.1), the Summer Druid (Q-C1), Saul (Meditation), the Air Reflector (M37, Act V), the obelisks' hoard before the Sphinx, and the Southern Sphinx sealed until Act VI (M40, FD-02)."
mood: "Glare and heat under a pale clear sky; wind hissing over the dunes, sand blowing off their crests; palms and camels at the wells; the dark castle silent on its cliff; the hush at the rim where the sand falls into the stars."
datum: water:rim_sea
spaces:
