    safe: true
    keep_clear: [spawns]
    theme: "cloudside_town kit, its plain grade: ochre plaster and fieldstone, flat roofs with awnings; MM7 Bracada's palms."
    density: medium
    buildings:
      - {id: building:x6_tavern, type: house, service: The Last Waterskin, count: 1, doors: 1, footprint_cells: [[2.5, 2]], notes: A4 house 4301.}
      - {id: building:x6_stables, type: house, service: Sphinx Wells Caravans, count: 1, doors: 1, footprint_cells: [[2.5, 2]], notes: A4 house 4302.}
      - {id: building:x6_houses, type: house, service: residence, count: 2, doors: 1, footprint_cells: [[1.5, 1], [1, 1]], notes: "A4 houses 4303 The Well Keeper's House (Old Ibb, 4606) and 4304 The Saddle Loft (Tansy, 4607)."}
