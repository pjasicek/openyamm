points_of_interest:
  - id: poi:air_reflector
    space: zone:air_corner
    kind: device
    behaviour: "A3's m37.reflector_air: \"Reflector. Activate?\"; after m36.started it hums and answers the south (8,000 XP once); before, \"A machine of the Ancients, cold and silent.\""
  - id: poi:arie
    space: zone:arie_camp
    kind: npc
    behaviour: "Arie the Apprentice (4608): A3's Q-C8 topics (\"The wizards of Castle Basenji killed my master. His scroll is still in there.\"); after Q-C8, the Sphinx's name."
  - id: poi:bone_field
    space: zone:ruin_fields
    kind: chest
    behaviour: "A dead caravan among the giant bones: its pay chest."
  - id: poi:caravan_cairn
    space: zone:central_pan
    kind: device
    behaviour: "A cairn the caravans add to for luck on the crossing: add a stone, +Luck, temporary, daily."
    uses: {times: 1, per: character, reset: daily}
  - id: poi:caravanserai
    space: zone:ruin_fields
    kind: chest
    behaviour: "The ruined caravanserai, its sand golems round it: the old keeper's strongbox (a chest)."
  - id: poi:cloud_hoard
    space: zone:sphinx_forecourt
    kind: device
    behaviour: "A3's obelisks.cloud_hoard: a mound of sand between the paws; with all seven Cloudside words, an iron box (10,000 gold, two treasure-6 items); else \"Sand, and more sand.\""
  - id: poi:mesa_nest
    space: zone:sphinx_desert
    kind: chest
    behaviour: "A great bird's nest on a mesa top, reached by a crack: glittering things (a chest)."
  - id: poi:oasis_fountain
    space: zone:oasis
    kind: fountain
    behaviour: "The oasis fountain (MAPS X6): +2 Endurance, permanent, once per character."
    uses: {times: 1, per: character, reset: never}
  - id: poi:obelisk
    space: zone:central_pan
    kind: obelisk
    behaviour: "Cloudside's sixth obelisk (A3's obelisks.x6: THE)."
    rule: native:obelisk
    notes: "On the red rock knoll by the Sphinx track; the Sphinx in view."
  - id: poi:prospector_camp
    space: zone:barbaric_mountains
    kind: chest
    behaviour: "A prospector's camp in a high notch, the fire long cold: his strongbox (a chest)."
  - id: poi:rim_pack
    space: zone:west_dunes
    kind: chest
    behaviour: "An explorer's pack at the rim's lip, a rope going over: \"Gone to see where the sand goes.\" (a chest)"
  - id: poi:saul
    space: zone:saul_hermitage
    kind: teacher
    behaviour: "Saul the Hermit (4602): Meditation Master (A4's teachers); \"Sit by the urn. Breathe. The sand will wait.\""
  - id: poi:saul_urn
    space: zone:saul_hermitage
    kind: device
    behaviour: "Saul's urn: \"The urn is full of sand and old coins. Saul says the coins are for the sand.\" (the source's urn took 10,000 gold for Prayermaster; Saul now teaches Meditation by talk)."
  - id: poi:shrine_energy
    space: zone:cliff_foot
    kind: shrine
    behaviour: "The Shrine of Energy (source A1: \"Shrine of Energy. Pray?\"): +5 Air resistance, permanent, once per character (D-4's +5)."
    uses: {times: 1, per: character, reset: never}
  - id: poi:signposts
    spaces: [junction:wells_fork, junction:sphinx_fork, junction:south_fork]
    count: 3
    kind: signpost
    behaviour: "Signposts at the forks: arms only (not POIs by D-20)."
  - id: poi:summer_druid
    space: zone:druid_grove
    kind: npc
    behaviour: "The Summer Druid (4601): A3's Q-C1 (the Last Flower of Summer)."
  - id: poi:sun_stones
    space: zone:south_steppe
    kind: shrine
    behaviour: "A ring of red standing stones the Summer Druid keeps for the solstice: +Fire resistance, temporary, daily (\"The stones are warm long after dark.\")."
    uses: {times: 1, per: character, reset: daily}
  - id: poi:swallowed_wagon
    space: zone:sphinx_desert
    kind: chest
    behaviour: "A wagon half under a dune, a worm's hole beside it: its strongbox (a chest)."
  - id: poi:waters_power
    space: zone:basenji_heights
    kind: fountain
    behaviour: "The Waters of Great Power (source A1): +Hit Points, temporary, daily."
    uses: {times: 1, per: character, reset: daily}
  - id: poi:well_accuracy
    space: zone:south_steppe
    kind: well
    behaviour: "The Well of Accuracy by the steppe road: +Accuracy, temporary, daily."
    uses: {times: 1, per: character, reset: daily}
  - id: poi:wells_well
    space: town:sphinx_wells
    kind: well
    behaviour: "Old Ibb's well: \"The water is cool and refreshing.\" (the source's line; a plain well)."
  - id: poi:werewolf_den
    space: zone:basenji_heights
    kind: chest
    behaviour: "The werewolves' den under the castle's east wall: gnawed bones and a chest of what their victims carried."
