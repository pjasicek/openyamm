  - {id: view:signature, at: [38, 96], height: 200, look: [26, 78], purpose: "MU-4 signature view: from a dune crest in the rim dunes, north-west along the world's west rim: on the left the dunes pour over the edge into the stars, sand streaming off the lip in the wind; ahead right the Southern Sphinx buried to its shoulders; far off on the right Castle Basenji on its cliff over the north rim."}
