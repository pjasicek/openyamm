landform:
  relief: "An open vale at 1,000-1,250 round the town and the river, a low rise for the ghost castle (1,750) and knolls for the pyramid, the Western Tower and the shrine; the mine hills and the Sardaj Horn along the north edge (to 3,600), the Gemstone foothills in the north-east; the river 250 down in its gorge east of the walls."
  height_range: [800, 3600]
  water: "The Vale Water (about 250 cells) from the Sardaj Falls to the south rim; the acid pond."
  water_share: 0.03
  caps:
    - {kind: bare rock, share: 0.08, where: "the north hills' crests, the gorge's walls, Kalindra's south cliff"}
  rim: {notes: "The world rim along the whole west and south (MU-1: D1 is the south-west corner of the Darkside): a cliff of about 1,000 down to the stars; the Vale Water falls over it at x 31. North and east the land runs to the map's edge, the roads out to it."}
atmosphere: "Sky xeendark1 (xeen_darkside_day: amber band, small pale sun; A3's Lua switches to xeendark2/3 at M17/M27); no weather (rare rain, mist in the grove); music 37. Wind in the grass, pigeons and a bell in town, the river's falls faint to the south-west, insects in the grove."
notes: "L3/L4 written by output/studio_cal/d1/tools/gen.py from the approved L1 with D-23, D-5.3, D-9.3. The plan keeps the L1 spaces."
