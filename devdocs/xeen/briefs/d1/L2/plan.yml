set_pieces:
  - id: set:ghost_castle
    kind: scripted
    spaces: [zone:kalindra_rise]
    rule: "Castle Kalindra's exterior shows its stage: stage 0 the whole castle translucent and shimmering (a ghost model), the gate refuses (A3's m19.ghost_castle); stages 1-4 more of it solid (gate and first floor at stage 1). The map swaps model groups by qbit."
    states: [ghost, stage1, stage2, stage3, stage4]
  - id: set:sabotage
    kind: scripted
    spaces: [zone:mill_gorge]
    rule: "The rope bridge cut and the mill burnt until q-d1.court_won; then both mended (BModel groups swapped, A3's q-d1.sabotage)."
    states: [sabotaged, mended]
  - id: set:sardaj
    kind: scripted
    spaces: [zone:sardaj_camp]
    rule: "The Sardaj peaceful until q-d12.hostile or camp_burned; then hostile. Burning the camp leaves ash and poles."
    states: [peaceful, hostile, burned]
