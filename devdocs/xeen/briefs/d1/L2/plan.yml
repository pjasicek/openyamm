format: 0
level: L2
pitch: "The Darkside's hub, under an amber sky and a small pale sun. Castleview, a walled town of grey boulder-stone and slate built low, sits in a bend of the Vale Water with the besiegers' empty trenches round it a gatehouse in its north wall and the small Queen's Gate in its south-west wall; outside the gate the travel pyramid from Vertigo, Joe's stall, Justine's camp and the gremlins' burrow under the wall. North of the town the Dark Grove, whose tallest tree carries a rope up into the sky; beyond it the Western Tower on its knoll by the world's edge and the gemsmiths' row under the mine hills. South-west, Castle Kalindra stands on its rise over the river as a translucent ghost of a castle. The river runs west under it and falls off the end of the world into the stars."
purpose: "Act III's hub (party 18-21): the party's first steps on the Darkside (M14: a pass for the gate, or the gremlins' court), the town's services and Darkside quests (Q-D1 to Q-D4, M15-M17, Q-D7, Q-D8, Q-D12, Q-D20), Castle Kalindra's staged return (M19-M27), and three later ways on: the Western Tower's rope (Act IV, Q-D6), Lucio's Jetty (M30) and the Dark Grove's rope to the Skyroads."
mood: "Dry, amber and a little worn: desaturated greens, slate and grey stone, smoke from a few chimneys, lamps lit by noon. The vale is open and pleasant away from the trenches; the grove dark and webbed; the ghost castle silent and shimmering."
datum: water:rim_sea
