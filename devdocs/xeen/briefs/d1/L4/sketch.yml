  - {id: sound:bed_darkside_10, at: [41, 97.5], sound: xeen_amb_darkside, radius: 15000, inner_radius: 6000, volume: 0.45, pan: false}
  - {id: sound:bed_darkside_11, at: [69, 97.5], sound: xeen_amb_darkside, radius: 15000, inner_radius: 6000, volume: 0.45, pan: false}
  - {id: sound:bed_darkside_12, at: [97, 97.5], sound: xeen_amb_darkside, radius: 15000, inner_radius: 6000, volume: 0.45, pan: false}
  - {id: sound:bed_darkside_2, at: [55, 25], sound: xeen_amb_darkside, radius: 15000, inner_radius: 6000, volume: 0.45, pan: false}
  - {id: sound:bed_darkside_3, at: [83, 25], sound: xeen_amb_darkside, radius: 15000, inner_radius: 6000, volume: 0.45, pan: false}
  - {id: sound:bed_darkside_4, at: [41, 49], sound: xeen_amb_darkside, radius: 15000, inner_radius: 6000, volume: 0.45, pan: false}
  - {id: sound:bed_darkside_5, at: [69, 49], sound: xeen_amb_darkside, radius: 15000, inner_radius: 6000, volume: 0.45, pan: false}
  - {id: sound:bed_darkside_6, at: [97, 49], sound: xeen_amb_darkside, radius: 15000, inner_radius: 6000, volume: 0.45, pan: false}
  - {id: sound:bed_darkside_7, at: [27, 73.5], sound: xeen_amb_darkside, radius: 15000, inner_radius: 6000, volume: 0.45, pan: false}
  - {id: sound:bed_darkside_8, at: [55, 73.5], sound: xeen_amb_darkside, radius: 15000, inner_radius: 6000, volume: 0.45, pan: false}
  - {id: sound:bed_darkside_9, at: [83, 73.5], sound: xeen_amb_darkside, radius: 15000, inner_radius: 6000, volume: 0.45, pan: false}
  - {id: sound:kalindra_shimmer, at: [39, 70], sound: xeen_phase_loop, radius: 3500, inner_radius: 1200, volume: 0.35}
relations:
  - {of: [517, 518, 519], toward: party, relation: friendly}
events:
  - id: evt:sky
    trigger: load
    effects:
      - lua: Xeen.applyDarksideSky()
    notes: Darkside's sky by the sun's stage (A3's helper).
  - id: evt:arrival
    trigger: timer
    every: 2
    effects:
      - lua: "XeenQuests.hook(\"m14.arrival\")"
    once: true
    notes: "M14: the first arrival's text (A3's hook runs once)."
  - id: evt:gates_open
    trigger: load
    condition: {qbit: pass_entered}
    effects:
      - hide: thing:north_gate_outer
      - hide: thing:north_gate_inner
      - hide: thing:queens_gate_outer
      - hide: thing:queens_gate_inner
    notes: "m14.gate_open (A3): after the first entry both gates stand open."
  - id: evt:kalindra_1
    trigger: load
    condition: {lua: "Xeen.stageOf(\"kalindra\") >= 1"}
    else_effects:
      - show: [thing:kalindra_1_ghost, thing:kalindra_gate]
      - hide: [thing:kalindra_1, thing:kalindra_gate_restored]
    effects:
      - hide: [thing:kalindra_1_ghost, thing:kalindra_gate]
      - show: [thing:kalindra_1, thing:kalindra_gate_restored]
    notes: "D-30: Castle Kalindra's stage 1 parts restored (Xeen.stageOf, A3)."
  - id: evt:kalindra_2
    trigger: load
    condition: {lua: "Xeen.stageOf(\"kalindra\") >= 2"}
    else_effects:
      - show: [thing:kalindra_2_ghost]
      - hide: [thing:kalindra_2]
    effects:
      - hide: [thing:kalindra_2_ghost]
      - show: [thing:kalindra_2]
    notes: "D-30: Castle Kalindra's stage 2 parts restored (Xeen.stageOf, A3)."
  - id: evt:kalindra_3
    trigger: load
    condition: {lua: "Xeen.stageOf(\"kalindra\") >= 3"}
    else_effects:
      - show: [thing:kalindra_3_ghost]
      - hide: [thing:kalindra_3]
    effects:
      - hide: [thing:kalindra_3_ghost]
      - show: [thing:kalindra_3]
    notes: "D-30: Castle Kalindra's stage 3 parts restored (Xeen.stageOf, A3)."
  - id: evt:kalindra_4
    trigger: load
    condition: {lua: "Xeen.stageOf(\"kalindra\") >= 4"}
    else_effects:
      - show: [thing:kalindra_4_ghost]
      - hide: [thing:kalindra_4]
      - lua: "evt.SetMapVar(\"AmbientSound13\", 1)"
    effects:
      - hide: [thing:kalindra_4_ghost]
      - show: [thing:kalindra_4]
      - lua: "evt.SetMapVar(\"AmbientSound13\", 2)"
    notes: "D-30: Castle Kalindra's stage 4 parts restored (Xeen.stageOf, A3). Stage 4: the castle wholly in phase, AU's shimmer loop (sound:kalindra_shimmer) off."
  - id: evt:kalindra_phase
    trigger: load
    effects:
      - lua: "local s = Xeen.stageOf(\"kalindra\") if s ~= evt.GetMapVar(\"kalindra_stage_shown\", 0) then evt.SetMapVar(\"kalindra_stage_shown\", s) evt.PlaySoundName(\"xeen_phase_shift\", -12800, -3072, 2550) end"
    notes: "AU (2026-11-20): xeen_phase_shift on the castle hill when the stage shown differs from the last one shown on this map (the named map variable kalindra_stage_shown), not on every load."
  - id: evt:sabotage
    trigger: load
    condition: {qbit: court_won}
    effects:
      - hide: thing:rope_bridge_cut_w
      - hide: thing:rope_bridge_cut_e
      - show: thing:rope_bridge
      - hide: thing:mill_burnt
      - show: thing:mill
    notes: "q-d1.sabotage (A3): the bridge and the mill mended once the court is won."
  - id: evt:sardaj
    trigger: load
    condition: {any: [{qbit: sardaj_hostile}, {qbit: sardaj_camp_burned}]}
    effects:
      - lua: "evt.SetMonGroupBit(60, MonsterBits.Hostile, true)"
    notes: "hook: q-d12.sardaj (A3): the Sardaj hostile on hostile or camp_burned."
  - id: evt:sardaj_war
    trigger: timer
    every: 1
    condition: {all: [{any: [{qbit: sardaj_hostile}, {qbit: sardaj_camp_burned}]}, {not: {map_var: sardaj_turned}}]}
    effects:
      - set:
          var:
            map_var: sardaj_turned
          value: 1
      - lua: "evt.SetMonGroupBit(60, MonsterBits.Hostile, true)"
    notes: "hook: q-d12.sardaj (A3): the Sardaj turn within a second of Yog's Battle! (the dialogue sets the bit); evt:sardaj keeps them hostile on every later load."
