# Written by output/studio_cal/a6/s22/gen_daily.py (A6, D-70 Q2); do not edit by hand.
# Each temporary source: once (every member gains), again the same day (refused, no gain), the next day again.
id: xeen.d1.playtest_daily
title: 'Xeen D1: temporary sources once a day for the party (D-70)'
world: xeen
mode: faithful
tags:
- xeen
- daily
steps:
- new_game_flow:
    start_map: xeen_d1.odm
    party:
      gold: 200
      food: 20
      members:
      - name: Brokk
        class: Knight
        level: 10
        skills: []
        equipment: {}
      - name: Hild
        class: Cleric
        level: 10
        skills: []
        equipment: {}
      - name: Ivar
        class: Archer
        level: 10
        skills: []
        equipment: {}
      - name: Sefa
        class: Sorcerer
        level: 10
        skills: []
        equipment: {}
- setup_shortcut:
    kind: immortal
- assert:
    map: xeen_d1.odm
- advance_runtime:
    seconds: 4
    present_dialogs: true
- play_lua:
    source: for _ = 1, 3 do if not close() then break end end
- press_action:
    action: select_member
    member_index: 0
- console:
    line: lua local out = '' for p = 0, 3 do evt.ForPlayer(p) for _, st in ipairs({LuckBonus}) do local v = 0 while v < 255 and IsAtLeast(st, v + 1) do v = v + 1 end out = out .. v .. '/' end out = out
      .. ' ' end evt.StatusText('stats ' .. out)
    expect_contains: Lua ran.
- play_lua:
    source: 'local s = string.match(status(), "stats ([%d/ ]+)") if s == nil then error("no stats line") end remember("s0_0", s) log("s0_0: " .. s)'
- note: 'A wayside shrine of Mok (event 267): every member +10'
- execute_event:
    id: 267
- advance_runtime:
    seconds: 0.5
- play_lua:
    source: 'local s = status() if not string.find(s, "Mok bless your road. +10 Luck until you rest.", 1, true) then error("want Mok bless your road. +10 Luck until you rest., status: " .. s) end'
- note: 'A wayside shrine of Mok again the same day: the refusal line only'
- execute_event:
    id: 267
- advance_runtime:
    seconds: 0.5
- play_lua:
    source: 'local s = status() if not string.find(s, "The shrine is quiet. Come back tomorrow.", 1, true) then error("want The shrine is quiet. Come back tomorrow., status: " .. s) end'
- console:
    line: lua local out = '' for p = 0, 3 do evt.ForPlayer(p) for _, st in ipairs({LuckBonus}) do local v = 0 while v < 255 and IsAtLeast(st, v + 1) do v = v + 1 end out = out .. v .. '/' end out = out
      .. ' ' end evt.StatusText('stats ' .. out)
