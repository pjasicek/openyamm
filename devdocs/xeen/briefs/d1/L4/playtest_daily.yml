- play_lua:
    source: 'local s = string.match(status(), "stats ([%d/ ]+)") if s == nil then error("no stats line") end remember("s0_1", s) log("s0_1: " .. s)'
- play_lua:
    source: 'local function parse(s) local m = {} for g in string.gmatch(s, "[%d/]+") do local r = {} for v in string.gmatch(g, "%d+") do r[#r + 1] = tonumber(v) end m[#m + 1] = r end return m end local
      a, b = parse(recall("s0_0")), parse(recall("s0_1")) local names = {"LuckBonus"} local bad = "" for m = 1, 4 do for k = 1, #names do if b[m][k] - a[m][k] ~= 10 then bad = bad .. " member " .. (m -
      1) .. " " .. names[k] .. " " .. a[m][k] .. "->" .. b[m][k] end end end if bad ~= "" then error("A wayside shrine of Mok today (want +10):" .. bad) end log("A wayside shrine of Mok today: +10 for every
      member")'
