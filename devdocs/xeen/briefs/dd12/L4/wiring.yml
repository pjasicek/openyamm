    preset: text
    source: deco:alamar_1
    title: Statue
    text: "The statue reads: This dungeon stand as tribute to me, my name in walls for all to see."
    window: true
    notes: aaze0082:18-22.
  - id: evt:alamar_2
    preset: text
    source: deco:alamar_2
    title: Statue
    text: "The statue reads: The Soul Maze inside is dark, dreary, and vast. The name found within is the clue to my past."
    window: true
    notes: aaze0082:18-22.
