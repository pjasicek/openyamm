  - id: evt:gate1
    preset: door
    source: door:gate1
    side: room:entry
    title: Gate
    condition: {qbit: gate1}
    else_effects:
      - lua: |-
          if continueStep == 1 then
              XeenQuests.hook("m24.gate_open")
              SetQBit(QBit(117441))
              return
          end
          if continueStep == 2 then
              XeenQuests.hook("m24.gate_shut")
              return
          end
          if continueStep ~= nil then
              return
          end
          XeenQuests.hook("m24.gate1")
          AskChoiceWithAnswerSteps(eventId, 3, "Will you find what you came for?", {{Answer = "Yes", Step = 1}, {Answer = "No", Step = 2}})
    notes: "m24.gate1 asks 'Will you find what you came for?' (A3's text); Yes: m24.gate_open and the map's gate1 qbit (117441), and evt:gate1_open swings the leaves apart; No: m24.gate_shut, the gate stays shut and asks again (D-42 (6): no wave). Once answered, a plain double door."
  - id: evt:gate1_back
    preset: door
    source: door:gate1
    side: room:gallery1
    title: Gate
    notes: "From beyond, the gate opens by hand."
  - id: evt:gate1_open
    preset: switch
    trigger: timer
    every: 1
    condition: {qbit: gate1}
    opens: [door:gate1]
    once: true
    notes: The gate's leaves swing apart once it was answered Yes (also after a refill).
