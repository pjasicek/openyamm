  - id: evt:cage1
    preset: script
    source: panel:cage1
    title: Lark of Luck
    condition: {not: {map_var: bird_luck}}
    effects:
      - lua: |-
          evt.ForPlayer(Players.All)
          AddValue(BaseLuck, 2)
      - set:
          var:
            map_var: bird_luck
          value: 1
      - text: "Lark of Luck. You set it free. In gratitude, the bird flutters around the party and sings its magic song. +2 Luck (permanent)."
    else_effects:
      - text: "An empty cage, door open."
    notes: "D-42 (4): 'Lark of Luck. Set it free?' (aaze0082:2-13), +2 Luck to every member present, once (map variable bird_luck)."
