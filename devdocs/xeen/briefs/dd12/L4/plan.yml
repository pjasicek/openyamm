format: 0
level: L3
pitch: "Under the ruined tower on the Isle of Lost Souls, five floors go down, each shut by a cheerful gate that asks a question and opens to a glad Yes. The minotaurs the coven threw out keep the storerooms, the cells, the Soul Waters and their Private Reserve; at the bottom the Soul Maze spells its maker's name in its walls, the horned throne at its heart, and beyond the fifth gate the aviary of magic birds with the Songbird of Serenity in the last cage. A lift brings the party back up."
purpose: "Story M24 (the carving, five yes-gates, the Songbird on L5); Q-D25 The Minotaur's Labyrinth (the horned throne); the source's puzzles (hourglasses, cell levers, dials and the Soul Waters, the lever riddle, the birds). Party 37-39; band 35-55; 45 monsters; treasure 4, the Reserve 5. About 40 minutes."
mood: "A ruin open to the failing Darkside sun over grey brick storerooms; dark wet rock below; the ivy-grown Soul Maze, torchlit at its turns; the bright aviary at the bottom."
datum: arrival
