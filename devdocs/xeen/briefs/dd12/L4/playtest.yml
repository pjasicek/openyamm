# Playtest of the Dungeon of Lost Souls (DD-12, L4): the critical path from D4's door to the aviary and the lift back,
# through every mechanism, the hooks and the bosses. A level-37 party arrives in the entrance hall (m24.arrival's
# window, dd12_arrived_once), reads the plaque (m24.arrival again), answers No at the first gate (m24.gate_shut: it
# stays shut, no qbit, no wave) and then Yes (m24.gate_open, the map's gate1 qbit, both leaves open). The lift head
# refuses before the Songbird. L1: the four hourglasses (one turned back and over again) open the vault panel (its
# chest), the bones' find. L2: the speaking statue on arrival, the stuck lever, the three cell levers (bars up), the
# two bone finds and the third cell's chest, the second gate. L3: the stagnant pool, the Soul Waters stagnant and the
# lever stuck before the dials, the four dials to 4, the lever, the waters once per member (m24.soul_waters_l3, 1,000)
# and "Refreshing.", the Negative Soul Waters and their chest, the third gate. L4: the riddle's plaque, a wrong lever
# stuck, the third row's east lever lifts the Reserve's portcullis, the barracks' purse, the Reserve's Lord, hoard and
# Soul Waters (m24.soul_waters_l4, 2,000, then "Refreshing."), the fourth gate. L5: Alamar's verse, the Soul Maze
# letter by letter (M, E, the illusion and the dead end's bones and chest, T, the horned throne in the L:
# q-d25.throne then its else text, E, H, S), the fifth gate, the six stat birds (+2 each, once), the Parrot, the lift
# refused, the Songbird (m24.songbird: bird_freed, the bird 12526); then the lift up to L1, down again, and called up
# from the lift head. A save and a load keep the gates and the Songbird. Numbers are ids.lock.yml's.
# Run with --world xeen --map xeen_dd12.blv (output/studio_cal/dd12/four.sh).
id: xeen.dd12.l4.walk
title: Dungeon of Lost Souls (DD-12 L4), the five gates to the Songbird and the lift back
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_dd12.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 37, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 37, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 37, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 37, skills: [], equipment: {}}
  - assert: {map: xeen_dd12.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - advance_runtime: {seconds: 3, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "NEVER UNDERESTIMATE THE POWER OF POSITIVE THINKING"}}
  - play_lua: {source: "close(); wait(0.5); if not qbit(117440) then error('dd12_arrived_once not set') end"}
  - assert: {party_position: {x: 0, y: -352, radius: 64, z_min: -8, z_max: 8}}
  # The plaque: m24.arrival again.
  - walk_to: {x: 0, y: 300, z: 0, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "click(64); wait(0.5)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Answer gladly and the way opens"}}
  - play_lua: {source: "close(); if door_state(6) ~= 'closed' or door_state(7) ~= 'closed' then error('the first gate does not start shut') end"}
  # Gate 1: No (it stays shut and asks again), then Yes.
  - execute_event: {id: 37}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Will you find what you came for?"}}
  - answer_input: {text: "No"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "The gate sighs, and stays shut."}}
  - play_lua: {source: "close(); wait(2); if qbit(117441) then error('gate1 set by No') end; if door_state(6) ~= 'closed' then error('No opened the gate') end"}
  - execute_event: {id: 37}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Will you find what you came for?"}}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "The gate swings open, cheerfully."}}
  - play_lua: {source: "close(); wait(3); if not qbit(117441) then error('gate1 not set by Yes') end; if door_state(6) ~= 'open' or door_state(7) ~= 'open' then error('the first gate did not open: ' .. door_state(6) .. ' ' .. door_state(7)) end"}
  # The lift head refuses before the Songbird.
  - walk_to: {x: 0, y: 780, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: -1900, y: 780, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -2320, y: 800, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua:
      source: |
        status()
        click(18); wait(1)
        local seen = status()
        if not string.find(seen, "Far below, something sings.", 1, true) then error("the lift head said: " .. seen) end
        if door_state(1) ~= "closed" then error("the cage moved before the Songbird: " .. door_state(1)) end
        if door_state(16) ~= "closed" then error("the top gate opened before the Songbird") end
  # Minotaur Storage: the four hourglasses open the vault panel.
  - walk_to: {x: -1900, y: 780, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 864, y: 900, z: 0, radius: 48, timeout_seconds: 40, clear_hostiles: 2500, close_dialogs: true}
  - play_lua: {source: "open_door(31, 19)"}
  - walk_to: {x: 864, y: 1300, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - play_lua:
      source: |
        status()
        click(52); wait(0.5)
        local seen = status()
        if not string.find(seen, "You turn the hour glass over.", 1, true) then error("glass a said: " .. seen) end
        status()
        click(52); wait(0.5)
        seen = status()
        if not string.find(seen, "You turn the hour glass back.", 1, true) then error("glass a again said: " .. seen) end
        click(52); wait(0.5)
  - walk_to: {x: 1824, y: 1360, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "click(53); wait(0.5)"}
  - walk_to: {x: 2150, y: 1360, z: 0, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "open_door(32, 20)"}
  - walk_to: {x: 2600, y: 1360, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 2600, y: 192, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 1800, y: 192, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "click(55); wait(0.5)"}
  - walk_to: {x: 1700, y: 330, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua:
      source: |
        local before = gold()
        click(8); wait(0.5)
        if gold() ~= before + 350 then error("the bones gave " .. (gold() - before) .. " gold") end
        status()
        click(8); wait(0.5)
        local seen = status()
        if not string.find(seen, "Nothing here.", 1, true) then error("the bones again said: " .. seen) end
        if door_state(22) ~= "closed" then error("the vault panel opened before the fourth glass") end
  - walk_to: {x: 1152, y: 200, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - play_lua: {source: "status(); click(54); wait(7); local seen = status(); if door_state(22) ~= 'open' then error('the vault panel did not open: ' .. door_state(22)) end"}
  - walk_to: {x: 1152, y: 420, z: 0, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "open_door(33, 21)"}
  - walk_to: {x: 1152, y: 780, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -384, y: 780, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -384, y: 1350, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "loot_chest(23)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - play_lua: {source: "close()"}
  # Down to L2: the speaking statue on arrival.
  - walk_to: {x: -384, y: 780, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 1152, y: 780, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 1152, y: 200, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 2608, y: 192, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 2608, y: -200, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 2608, y: -1320, z: -640, z_tolerance: 120, radius: 64, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 2608, y: -1700, z: -640, radius: 64, timeout_seconds: 20, close_dialogs: false, expect: dialog}
  - advance_runtime: {seconds: 1, present_dialogs: true}
