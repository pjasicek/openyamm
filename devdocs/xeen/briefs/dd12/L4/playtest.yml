  - play_lua: {source: "close()"}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: 3000, y: -2304, z: -640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "status(); click(60); wait(0.5); local seen = status(); if not string.find(seen, 'The lever is stuck.', 1, true) then error('the fourth lever said: ' .. seen) end"}
  # The three cell levers.
  - walk_to: {x: 1900, y: -1728, z: -640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 800, y: -1700, z: -640, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - play_lua: {source: "if door_state(3) ~= 'closed' then error('the first cell does not start barred') end; click(57); wait(4); if door_state(3) ~= 'open' then error('lever 1 did not raise the bars: ' .. door_state(3)) end"}
  - walk_to: {x: 300, y: -1728, z: -640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -350, y: -1700, z: -640, radius: 64, timeout_seconds: 20, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - play_lua: {source: "click(59); wait(4); if door_state(5) ~= 'open' then error('lever 3 did not raise the bars: ' .. door_state(5)) end"}
  - walk_to: {x: 300, y: -2368, z: -640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 1600, y: -2300, z: -640, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - play_lua: {source: "click(58); wait(4); if door_state(4) ~= 'open' then error('lever 2 did not raise the bars: ' .. door_state(4)) end"}
  - walk_to: {x: 704, y: -2400, z: -640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 704, y: -2760, z: -640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "local before = gold(); click(6); wait(0.5); if gold() ~= before + 400 then error('cell 1 bones gave ' .. (gold() - before)) end"}
  - walk_to: {x: 1216, y: -2400, z: -640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 1216, y: -2760, z: -640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "status(); click(7); wait(0.5); status(); click(7); wait(0.5); local seen = status(); if not string.find(seen, 'Nothing here.', 1, true) then error('cell 2 bones again said: ' .. seen) end"}
  - walk_to: {x: 1728, y: -2400, z: -640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 1728, y: -2880, z: -640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "loot_chest(19)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - play_lua: {source: "close()"}
  # Gate 2 and down to L3.
  - walk_to: {x: 1728, y: -2400, z: -640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 0, y: -2048, z: -640, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -400, y: -2048, z: -640, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - execute_event: {id: 40}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Is the glass half full?"}}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - play_lua: {source: "close(); wait(3); if not qbit(117442) then error('gate2 not set') end; if door_state(8) ~= 'open' or door_state(9) ~= 'open' then error('the second gate did not open') end"}
  - walk_to: {x: -600, y: -2048, z: -640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1700, y: -2048, z: -1280, z_tolerance: 120, radius: 64, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: -2100, y: -2048, z: -1280, radius: 64, timeout_seconds: 20, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - play_lua: {source: "status(); click(65); wait(0.5); local seen = status(); if not string.find(seen, 'The water is stagnant.', 1, true) then error('the pool said: ' .. seen) end"}
  # L3: the Soul Waters stagnant and the lever stuck before the dials; the dials; the lever; the waters.
  - walk_to: {x: -1900, y: -1600, z: -1280, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -600, y: -1600, z: -1280, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: 768, y: -1400, z: -1280, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua:
      source: |
        status()
        click(82); wait(0.5)
        local seen = status()
        if not string.find(seen, "The water is stagnant.", 1, true) then error("the waters before the lever said: " .. seen) end
        status()
        click(84); wait(0.5)
        seen = status()
        if not string.find(seen, "The lever is stuck.", 1, true) then error("the lever before the dials said: " .. seen) end
  - walk_to: {x: -600, y: -1500, z: -1280, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua:
      source: |
        for n = 26, 29 do
          for k = 1, 3 do
            status(); click(n); wait(0.3)
          end
          local seen = status()
          if not string.find(seen, "It is set at 4.", 1, true) then error("dial " .. n .. " said: " .. seen) end
        end
  - walk_to: {x: 768, y: -1400, z: -1280, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "status(); click(84); wait(0.5); local seen = status(); if not string.find(seen, 'The lever moves!', 1, true) then error('the lever with the dials up said: ' .. seen) end"}
  - press_action: {action: select_member, member_index: 0}
  - play_lua: {source: "click(82); wait(0.5)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[+1,000 experience]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "close(); click(82); wait(0.5)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[Refreshing.]], 1, true) then error("status line: " .. s) end
