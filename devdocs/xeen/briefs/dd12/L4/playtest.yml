  - walk_to: {x: 768, y: -1800, z: -1280, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 1700, y: -2048, z: -1280, radius: 64, timeout_seconds: 20, close_dialogs: true}
