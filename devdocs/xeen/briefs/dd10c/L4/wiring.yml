      - lua: "XeenQuests.hook(\"q-d7.diamond_veins\")"
      - text: You work a diamond rock out of the vein.
    else_effects:
      - text: You've got all this vein has to offer.
    notes: "Diamond vein 3 (dark/aaze0039:1-4 the hover, :10 when spent): one diamond rock (12360, the hook's map_gives), q-d7.diamond_veins sets q-d7.dug (113144); map variable diamond_3."
  - id: evt:diamond_4
    preset: script
    source: panel:diamond_4
    title: Diamond vein
    condition: {not: {map_var: diamond_4}}
    effects:
      - set:
          var:
            map_var: diamond_4
