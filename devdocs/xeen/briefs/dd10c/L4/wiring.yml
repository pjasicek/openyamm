      - give_item: diamond_rock
      - lua: "XeenQuests.hook(\"q-d7.diamond_veins\")"
      - text: You work a diamond rock out of the vein.
    else_effects:
      - text: You've got all this vein has to offer.
    notes: "Diamond vein 4 (dark/aaze0039:1-4 the hover, :10 when spent): one diamond rock (12360, the hook's map_gives), q-d7.diamond_veins sets q-d7.dug (113144); map variable diamond_4."
  - id: evt:diamond_5
    preset: script
    source: panel:diamond_5
    title: Diamond vein
    condition: {not: {map_var: diamond_5}}
    effects:
      - set:
          var:
            map_var: diamond_5
