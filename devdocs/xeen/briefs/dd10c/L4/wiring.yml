    notes: "Diamond vein 2 (dark/aaze0039:1-4 the hover, :10 when spent): one diamond rock (12360, the hook's map_gives), q-d7.diamond_veins sets q-d7.dug (113144); map variable diamond_2."
  - id: evt:diamond_3
    preset: script
