format: 0
variables: [diamond_1, diamond_2, diamond_3, diamond_4, diamond_5, false_vein, in_visit]
events:
  - id: evt:arrive
    preset: script
    trigger: timer
    every: 1
    condition: {not: {qbit: arrived_once}}
    once: true
    effects:
      - message: "THE GEMSTONE MINES, NORTH POCKET. Heat breathes out of the rock, and somewhere ahead lava ticks as it cools. Hector the diamond smith wants five diamond rocks; the veins give one each. Few who come here go back, they say."
      - qbit: arrived_once
    notes: "Why the party is here (Q-D7), on the first arrival only."
  - id: evt:chest_grotto
    preset: chest
    source: chest:grotto
    title: Chest
  - id: evt:diamond_1
    preset: script
    source: panel:diamond_1
    title: Diamond vein
    condition: {not: {map_var: diamond_1}}
    effects:
      - set:
          var:
            map_var: diamond_1
          value: 1
      - give_item: diamond_rock
      - lua: "XeenQuests.hook(\"q-d7.diamond_veins\")"
      - text: You work a diamond rock out of the vein.
    else_effects:
      - text: You've got all this vein has to offer.
    notes: "Diamond vein 1 (dark/aaze0039:1-4 the hover, :10 when spent): one diamond rock (12360, the hook's map_gives), q-d7.diamond_veins sets q-d7.dug (113144); map variable diamond_1."
  - id: evt:diamond_2
    preset: script
    source: panel:diamond_2
    title: Diamond vein
    condition: {not: {map_var: diamond_2}}
    effects:
      - set:
          var:
            map_var: diamond_2
          value: 1
      - give_item: diamond_rock
      - lua: "XeenQuests.hook(\"q-d7.diamond_veins\")"
      - text: You work a diamond rock out of the vein.
    else_effects:
