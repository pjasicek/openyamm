format: 0
level: L1
pitch: "Baron Darzog's black tower on the wooded island in Lake Darzog, sealed since Crodo vanished. A square keep of four floors stands round one great Well open to the sky, where Darzog's lightning crackles from the gate floor to the clouds; every floor looks into it, and the windows and the battlements look out over the lake. Magic dies in this tower: the Baron's ward stills every spell but his own, so the party fights with steel. The gate floor's carnage hands, the forge where the hands are made, the library of his apprentices with its six study books and its cracked trapdoor floors, and at the top Darzog's own hall, where the Baron waits among six clones that wear his face. Behind his portrait sits Crodo. The roof opens on the clouds where Lord Xeen hides."
purpose: "Story step M21 (QUESTS.md): with the Skeleton Key from the Tower of High Magic (M13) the party enters, kills Baron Darzog and his clones and frees Crodo, who tells them that 'Prince Roland' is Lord Xeen, that his hideout is in the clouds above this tower and that only the sword buried under Newcastle can kill him. The roof's cloud stair then leads up to X9, the Clouds of Xeen. Cloudside's first L set piece: monster levels 30 to 48, Darzog 55; a party of about level 33 that leaves at about 36. The six study books give +5 to a stat each, once per character (the source's +20, rescaled)."
mood: "Cold, high and quiet: grey keep stone, blue-white lightning up the Well, the red glow of the forge below the library's candles, the Baron's portraits watching; wind and open sky at the top, the lake far below."
