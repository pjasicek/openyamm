notes: "Size L: about 55 sectors (the 4 floors' double rings of 10-12 rooms, the Well, 4 stair halls, the roof's 4 parts, 4 bands of open air outside the keep, Crodo's cell); floor area inside the L band without the outside band (measured at L4: 150.8 M walked, 483.7 M with the band); about 80 monsters (29 spawn points of 2-3, 8 placed hostiles: Darzog, six clones and the Chief Librarian) in 1.2-1.5 per sector, none in the gate hall, stairs or outside. Floors 768 apart, rooms 640 high (128 floors), the Well 4,224 high and open to the sky. Stairs alternate west and east as two-storey halls with hanging galleries (rooms stack since S7; floor holes since S8), so every floor is crossed; the works gate and the library door make each crossing a task. Chests at Tres 4, Darzog's hoard at 5. Measured against MM7 Castle Gloaming (48 sectors, 175 M, height range 4,920) and Castle Lambent / Clanker's Laboratory (the same three monster families)."
