atmosphere: "Cold and high. Music 22 (Castle Gloaming's) everywhere, environment stone hall. The Well is the brightest place: a column of pulsing blue-white light up its axis (five lights from the rune circle to the roof), braziers round the circle. The gate floor torchlit (ambient 14-16), the works red from the lava (ambient 14), the library candlelit with chandeliers (ambient 16-18), Darzog's floor dark state rooms with candelabra (ambient 18-20). The roof and the outside open to the sky (atmosphere open_sky, preset fair, daylight). No magic anywhere (set:no_magic)."
