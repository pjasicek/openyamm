  - id: evt:works_gate
    preset: script
    source: door:works_gate
    title: Works gate
    condition: {map_var: works_gate_up}
    effects:
      - text: The works gate stands open.
    else_effects:
      - message: "An iron gate bars the way to the east stair. Its chains run off along the walls toward the south: the winch that raises it must be in the assembly hall."
  - id: evt:works_winch
    preset: switch
    source: switch:works_winch
    title: Works gate winch
    opens: [door:works_gate]
    sets: {map_var: works_gate_up}
    text: "Chains rattle: across the works, the gate to the east stair grinds up."
notes: Wiring of XD-12 (written by output/studio_cal/xd12/tools/dress.py).
