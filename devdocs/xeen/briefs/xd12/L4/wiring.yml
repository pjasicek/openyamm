  - id: evt:warning_note
    preset: script
    source: panel:warning_note
    title: A note
    effects:
      - message: "A note, pinned at the head of the stair in a hurried hand: 'MIND THE CRACKED FLAGS. The Master's hatches drop you straight down to the works, and the hands down there are not friendly. Walk round them. -- Wil'"
    window: true
    notes: "poi:warning_note: names the trapdoors' tell before the first one."
