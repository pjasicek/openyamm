format: 0
variables: [works_gate_up, darzog_dead_seen]
events:
  - id: evt:arrive
    preset: script
    trigger: timer
    every: 1
    once: true
    effects:
      - message: "DARZOG'S TOWER. The Skeleton Key turns, and the door that has been sealed since Crodo vanished swings in on cold air. Artemus was right to suspect the Baron: somewhere above, Crodo still lives. And the air itself is wrong. Every spell you reach for dies before it is shaped: Darzog's ward stills all magic in this tower but his own. Here you fight with steel. The stairs climb the west and east halls in turn; the Baron keeps the top floor."
    notes: "The arrival message (the build asks every new dungeon for one); set:no_magic."
  - id: evt:book_accuracy
    preset: script
    source: platform:lectern_accuracy
    title: Book of Accuracy
    condition: {not: {player_bit: 11235}}
    effects:
      - add:
          var: BaseAccuracy
          value: 5
      - player_bit: 11235
      - message: "BOOK OF ACCURACY. One of Darzog's own studies, written for his apprentices; whoever reads it to the end is changed by it. +5 Accuracy (permanent)."
    else_effects:
      - text: You have already learned what the book of accuracy can teach.
    notes: "poi:book_accuracy: +5 Accuracy, once per character (player bit 11235)."
  - id: evt:book_endurance
    preset: script
