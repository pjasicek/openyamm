  - id: evt:cloud_stair
    preset: script
    source: platform:cloud_top
    trigger: step
    condition: {qbit: m21_crodo_freed}
    effects:
      - leave: exit:clouds_of_xeen
    else_effects:
      - text: "The cloud gives under your foot like fog. Something holds it shut: Crodo would know what."
    text: You climb the stair of cloud into the sky.
    notes: "set:cloud_stair: the exit to X9 (a placeholder: X9 is not built; MM7's Celeste stands in)."
  - id: evt:crodo
    preset: script
    source: room:crodo_cell
    trigger: step
    once: true
    effects:
      - message: "CRODO THE OVERSEER, thin and grey, gets up from his stool. 'Thank you for rescuing me from Darzog's clutches. I didn't know that someone else had received my message. Listen: the man at the King's side is not Prince Roland. I struck him with Dancing Blades and saw what he is: Lord Xeen, an undead general who serves a greater master. Xeen's hideout is just above us in the clouds. You will need the sword the adventurers were working on in the dungeon of Newcastle to defeat Lord Xeen; ask Artemus for leave to dig it out. You must make haste. Xeen plans to summon an army from the Darkside to conquer our world.' Darzog's ward is fading from him, slowly: he has strength for one small spell, and he spends it on going home. He touches your hand, says a word, and is gone. The clouds above the roof will bear you now."
      - qbit: m21_crodo_freed
      - hide_actors: 40
      - lua: |-
          evt.ForPlayer(Players.All)
          AddValue(Experience, 35000)
          evt.ForPlayer(Players.Current)
    notes: "goal:crodo and M21's reveal; 35,000 experience each (Act IV's quest rule)."
  - id: evt:crypt
    preset: chest
    source: chest:crypt
    title: Sarcophagus
  - id: evt:darzog_dead
    preset: script
    trigger: timer
    every: 2
    condition: {kills: {monster: monster:darzog}}
    opens: [door:disc_grille]
    once: true
    effects:
      - qbit: m21_darzog_slain
      - shake:
          strength: 0.5
          seconds: 2
      - message: "Baron Darzog falls, and the tower shudders. Somewhere close a binding cracks like ice; in the Well a black grille rises from the landing where his disc waits. His ward on your spells does not lift: it has soaked into the stones."
    notes: "goal:darzog: his death sets m21_darzog_slain; the disc's grille opens (the disc is up)."
  - id: evt:darzog_hall_cue
    preset: text
    source: room:darzog_hall
    trigger: step
    once: true
    text: "Seven figures in the Baron's robes turn as one. 'Which of us,' they ask together, 'will you kill first?'"
    notes: set:darzog.
  - id: evt:darzog_hoard
    preset: chest
    source: chest:darzog_hoard
    title: Chest
  - id: evt:disc
    preset: switch
    source: mover:disc
    title: Darzog's disc
    condition: {qbit: m21_darzog_slain}
    toggles: [mover:disc, door:disc_grille]
    else_effects:
      - message: "A disc of black stone hangs in the Well behind this grille, the Baron's rune glowing on its rim. It answers to Darzog alone while he lives."
    text: The disc hums and glides along the Well.
  - id: evt:disc_call_bottom
    preset: switch
    source: switch:disc_call_bottom
    title: Darzog's disc
    condition: {qbit: m21_darzog_slain}
    toggles: [mover:disc, door:disc_grille]
    else_effects:
      - message: "You press the stone. Far above, at the top of the Well, a rune flares and dies: whatever it calls is bound by its master, up on his own floor."
    text: The disc hums and glides along the Well.
  - id: evt:disc_call_top
    preset: switch
    source: switch:disc_call_top
    title: Call the disc
    condition: {qbit: m21_darzog_slain}
    toggles: [mover:disc, door:disc_grille]
    else_effects:
      - message: "A disc of black stone hangs in the Well behind this grille, the Baron's rune glowing on its rim. It answers to Darzog alone while he lives."
    text: The disc rises up the Well to the landing.
  - id: evt:disc_grille
    preset: script
    source: door:disc_grille
    title: Black grille
    condition: {qbit: m21_darzog_slain}
    effects:
      - text: The grille opens when the disc is here. Step onto the disc and touch it to ride down.
    else_effects:
      - message: "A disc of black stone hangs in the Well behind this grille, the Baron's rune glowing on its rim. It answers to Darzog alone while he lives."
  - id: evt:disc_ride_top
