  - id: evt:journal
    preset: script
    source: platform:journal
    title: Darzog's journal
    effects:
      - message: "DARZOG'S JOURNAL, the last page: '... The old fool Crodo sits behind my own portrait in my bedchamber, where he may admire me while he rots. Let him send his dreams to Newcastle's tinkers; no spell leaves this tower, and no spell enters it but mine. My new master in the clouds is pleased. When the King's precious \"brother\" sits the throne, I shall have Crodo's place at last.'"
    window: true
    notes: "poi:darzog_journal: names the portrait (no spoiler before M21: this is M21)."
  - id: evt:librarian
    preset: chest
    source: chest:librarian
    title: Cabinet
  - id: evt:library_stair
    preset: door
    source: door:library_stair
    title: The library stair door
    condition: {item: library_key}
    action: open
    sets: {qbit: library_door_opened}
    else_effects:
      - message: "Locked. The keyhole is cut as a sorcerer's sigil. The Chief Librarian keeps the key to the upper stair in his cabinet in the great library, south of the Well."
    text: The High Sorcerer's key turns in the carved lock.
  - id: evt:portrait
    preset: door
    source: door:portrait
    side: room:bedchamber
    title: Darzog's portrait
    condition: {qbit: m21_darzog_slain}
    action: open
    else_effects:
      - message: "The Baron in oils, haughty and gaunt. Behind the painted eyes something moves: an old man's face, pressed to the other side, then gone. The frame will not shift while Darzog's spell holds it."
    text: "With Darzog dead, the portrait is only paint and wood. It slides up into the wall on a cell."
    notes: set:crodo.
