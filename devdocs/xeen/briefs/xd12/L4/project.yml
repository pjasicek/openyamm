notes: "Xeen design brief, level L4, for a new map (no original). Story step M21 (devdocs/xeen/QUESTS.md). Size L (MAPS.md section 0 and Dungeons): 50-75 sectors, 120-200 M units squared, about 70-80 monsters plus the boss; monster levels 30 to 48, Darzog 55; Tres 4 (chests at 4, Darzog's hoard at 5). Ids: map_stats 9140, qbits 110500-110599, items 12230-12299 (ACT2_BUILD.md). Built and played as an MM7 map (world mm7) until worlds/xeen exists, as XD-01 to XD-05: slot 1 Magic constructs (Carnage Hand) is MM7's Golem family (Brass Golem 35, Gold Golem 50), slot 2 Wizards MM7's Mage family (Wizard 35, Archmage 50), slot 3 Eyes MM7's Beholder family (Floating Eye 30, Gazer 40): the same three families MM7's Clanker's Laboratory and Castle Lambent use. Darzog is an Air Warlock (420, level 50, lightning) with three times the hit points and his name; his six clones Air Warlocks. Crodo is an MM7 peasant elder (peaceful). Items: the Skeleton Key 12100 (X2's range; X2's door tests MM7's William's Tower Key 1461), the library key 12230 as MM7's High Sorcerer's Key (2112). Music 22 (Castle Gloaming's track). exit:lake_island leads to X2 (xeen_x2.odm) at the arrival of X2's DOORS.md (provisional); exit:clouds_of_xeen is a placeholder: X9 is not built, MM7's Celeste stands in."
