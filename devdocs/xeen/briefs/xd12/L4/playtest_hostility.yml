# Hostility check of Darzog's Tower (XD-12) (first written by output/studio_cal/hostility/gen_hostility_tests.py;
# devdocs/xeen/ACT2_BUILD.md, "Hostility pass"; moved by hand to the Xeen rows, lane A8, 2026-11-20): its foes hostile
# to the party, Crodo peaceful, its kinds not fighting each other. The kinds: Carnage Hand 11602 (slot 1), Wizard 11190
# (slot 2), Floating Eye 11570 (slot 3), the Chief Librarian a Sorcerer 11191, Baron Darzog 11194 and his clones 11195
# (boss rows), Crodo 11900 (the world's peaceful character row). The world's relations.yml has the three families long
# toward the party, Crodo friendly and no feud; the map's own relations repeat them and keep the Eyes from the
# constructs, the wizards and Crodo. Run with --world xeen --map xeen_xd12.blv, as XD-27's
# (output/studio_cal/xd12/xfour.sh).
