# Playtest of Darzog's Tower (XD-12, L4): the critical path of M21 and the way down by the disc, as a player meets it.
# A level-33 party enters by the tower door (the arrival window: no magic here), finds its spells refused, crosses
# the gate floor's cloister to the west stair hall and climbs to the works, raises the works gate from the assembly
# hall's winch, climbs the east stair hall to the library, reads the warning note about the cracked flags, kills the
# Chief Librarian and takes the library key from his cabinet, reads the Book of Accuracy (+5, once per character),
# walks round the west walk's trapdoor and opens the library stair door, climbs to Darzog's floor, opens Darzog's
# doors and kills the Baron among his clones (his death window; it opens the disc's grille), reads Darzog's journal
# and loots his hoard, opens the portrait in his bedchamber and frees Crodo (M21's reveal, the qbit, Crodo gone home),
# rides Darzog's disc down the Well to the gate floor, calls it up and down with the bottom button, rides it up again,
# climbs the sky stair to the roof, where the cloud stair's top step opens the entrance window; Close stays, OK goes up to X9.
# Played from assets_dev with --world xeen --map xeen_xd12.blv (output/studio_cal/xd12/xfour.sh): the world's rows
# (Carnage Hand 11602, Wizard 11190, Floating Eye 11570, the Chief Librarian a Sorcerer 11191, Baron Darzog 11194, his
# clones 11195, Crodo 11900), the library key 12230 and M21's qbits 110500-110502. A3's hooks m21.arrival, m21.darzog
# and m21.crodo give the windows (asserted by their text), darzog_slain, crodo_freed, the 35,000 experience and the
# vault word's autonote 4121 (2026-11-20); the arrival window sets arrived_once 110503 (first arrival only).
# Event, door, container and map-variable numbers are ids.lock.yml's; actors are the scene's (0-5 the clones, 6 Crodo,
# 7 Darzog, 8 the Chief Librarian). Nothing depends on chance: only chests' fixed items are checked, every walk past
# a spawn point clears hostiles near it.
id: xeen.xd12.l4.walk
title: Darzog's Tower (XD-12 L4), the tower door to Crodo and the roof, every mechanism on the way
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_xd12.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 33, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 33, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 33, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 33, skills: [], equipment: {}}
  - assert: {map: xeen_xd12.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - assert: {party_position: {x: 2752, y: 0, radius: 64, z_min: -8, z_max: 8}}
  # The Xeen rows stand: Darzog and six clones (boss rows), the Chief Librarian, Crodo, the three slots; no stand-in rows.
  - assert: {actor_count: {monster_id: 11194, min: 1, max: 1}}
  - assert: {actor_count: {monster_id: 11195, min: 6, max: 6}}
  - assert: {actor_count: {monster_id: 11191, min: 1, max: 1}}
  - assert: {actor_count: {monster_id: 11900, min: 1, max: 1}}
  - assert: {actor_count: {monster_id: 11602, min: 20}}
  - assert: {actor_count: {monster_id: 11190, min: 10}}
  - assert: {actor_count: {monster_id: 11570, min: 6}}
  - assert: {actor_count: {monster_id: 294, max: 0}}
  - assert: {actor_count: {monster_id: 292, max: 0}}
  - assert: {actor_count: {monster_id: 278, max: 0}}
  - assert: {actor_count: {monster_id: 279, max: 0}}
  - assert: {actor_count: {monster_id: 293, max: 0}}
  - assert: {actor_count: {monster_id: 212, max: 0}}
  # The arrival window: why the party is here, and that magic fails in the tower (a one-shot timer).
  - advance_runtime: {seconds: 3, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Every spell you reach for dies before it is shaped"}}
  - play_lua: {source: "close(); if not qbit(110503) then error('the arrival did not set arrived_once') end"}
  - assert: {state_dump_map_var: {index: 0, value: 1}}
  # No spells inside (project.yml rules.no_spells).
  - cast_spell: {member_index: 3, spell_id: 1, skill: 5, mastery: 1, expect: refused}
  # The gate hall, the cloister round the Well's foot, the west stair hall.
  - walk_to: {x: 2200, y: 0, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1408, y: 0, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1408, y: -1408, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1408, y: -1408, z: 0, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1408, y: -768, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -2112, y: -768, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -2816, y: -1600, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -2816, y: 1350, z: 768, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -2112, y: 1350, z: 768, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -2112, y: -768, z: 768, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1408, y: -768, z: 768, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "wait(1)"}
  - assert: {party_position: {x: -1408, y: -768, radius: 100, z_min: 760, z_max: 776}}
  # The works: the assembly hall and its winch, which raises the works gate.
  - walk_to: {x: -1408, y: -1408, z: 768, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 384, y: -1408, z: 768, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 384, y: -2300, z: 768, radius: 64, timeout_seconds: 30, clear_hostiles: 2200}
  - clear_hostiles: {radius: 2200}
  - walk_to: {x: -1560, y: -2784, z: 768, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        if door_state(22) ~= "closed" then error("the works gate does not start shut") end
        click(54); wait(4)
        if door_state(22) ~= "open" then error("the winch did not raise the works gate: " .. door_state(22)) end
  - assert: {state_dump_map_var: {index: 5, value: 1}}
  # Through the works gate to the east stair hall and up to the library.
  - walk_to: {x: 384, y: -2300, z: 768, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 384, y: -1408, z: 768, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1408, y: -1408, z: 768, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1408, y: 640, z: 768, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2112, y: 640, z: 768, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2816, y: 1600, z: 768, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2816, y: -1350, z: 1536, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2112, y: -1400, z: 1536, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2112, y: 640, z: 1536, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1408, y: 640, z: 1536, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "wait(1)"}
  - assert: {party_position: {x: 1408, y: 640, radius: 100, z_min: 1528, z_max: 1544}}
  # The apprentice's note at the head of the stair names the trapdoors' tell.
  - play_lua: {source: "click(47); wait(1)"}
  - assert:
      dialog: {text_contains: "MIND THE CRACKED FLAGS"}
  - play_lua: {source: "if not close() then error('the note opened no message window') end"}
  # The great library: the Chief Librarian; his cabinet holds the library key (12230); the Book of Accuracy.
  - walk_to: {x: 1408, y: -1408, z: 1536, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 384, y: -1408, z: 1536, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 384, y: -2300, z: 1536, radius: 64, timeout_seconds: 30, clear_hostiles: 2500}
  - clear_hostiles: {radius: 2600}
  - assert: {actor_visible: {actor_index: 8, dead: true}}
  - walk_to: {x: 1152, y: -2830, z: 1536, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        if has_item(12230) then error("the party has the key before the cabinet") end
        loot_chest(34)
        if held() ~= 0 then stow() end
        if not has_item(12230) then error("the librarian's cabinet did not hold the library key 12230") end
  - walk_to: {x: 1600, y: -2560, z: 1536, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(2); wait(0.5)"}
  - play_lua: {source: "local s = tostring(status()); if not string.find(s, '+5 Accuracy', 1, true) then error('no line: ' .. s) end"}
  - play_lua:
      source: |
        click(2); wait(1)
        local seen = status()
        if not string.find(seen, "already learned", 1, true) then error("the Book of Accuracy worked twice: " .. seen) end
  # Round the west walk's trapdoor (its cracked flags at -1408, -1152) to the library stair door: the key opens it.
  - walk_to: {x: 384, y: -2300, z: 1536, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 384, y: -1408, z: 1536, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1680, y: -1500, z: 1536, radius: 48, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1680, y: 640, z: 1536, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        if door_state(4) ~= "open" then error("the west walk's trapdoor moved under a walk round it: " .. door_state(4)) end
        if door_state(15) ~= "closed" then error("the library stair door does not start shut") end
        click(35); wait(4)
        if door_state(15) ~= "open" then error("the library key did not open the library stair door: " .. door_state(15)) end
        if not qbit(110502) then error("library_door_opened was not set") end
  # The library stair hall up to Darzog's floor.
  - walk_to: {x: -2112, y: 640, z: 1536, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -2816, y: 1600, z: 1536, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -2816, y: -1350, z: 2304, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -2112, y: -1400, z: 2304, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -2112, y: 640, z: 2304, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1408, y: 640, z: 2304, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "wait(1)"}
  - assert: {party_position: {x: -1408, y: 640, radius: 100, z_min: 2296, z_max: 2312}}
  # Darzog's hall: his doors, the Baron among six clones.
  - walk_to: {x: -1408, y: 1408, z: 2304, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -512, y: 1408, z: 2304, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        if door_state(13) ~= "closed" then error("the disc's grille does not start shut") end
        if qbit(110500) then error("darzog_slain set before the fight") end
        click(20); wait(4)
        if door_state(10) ~= "open" or door_state(11) ~= "open" then error("Darzog's doors did not open") end
  - walk_to: {x: -512, y: 2300, z: 2304, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - assert: {state_dump_map_var: {index: 3, value: 1}}
  - clear_hostiles: {radius: 3600}
  - play_lua: {source: "wait(2); clear_hostiles(3600); wait(3)"}
  - assert: {actor_visible: {actor_index: 7, dead: true}}
  - assert: {actor_visible: {actor_index: 0, dead: true}}
  # His death runs a timer: A3's m21.darzog status line, the qbit and the grille.
  - advance_runtime: {seconds: 3}
  - play_lua: {source: "local s = tostring(status()); if not string.find(s, 'Baron Darzog falls', 1, true) then error('no line: ' .. s) end"}
  - play_lua:
      source: |
        wait(1)
        if not qbit(110500) then error("Darzog's death did not set darzog_slain") end
        if door_state(13) ~= "open" then error("Darzog's death did not open the disc's grille: " .. door_state(13)) end
  # His study: the journal names the portrait; his hoard.
  - walk_to: {x: -1600, y: 2496, z: 2304, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        click(21); wait(3)
        if door_state(12) ~= "open" then error("the study door did not open") end
  - walk_to: {x: -2300, y: 2400, z: 2304, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(33); wait(1)"}
  - assert:
      dialog: {text_contains: "behind my own portrait"}
  - play_lua: {source: "if not close() then error('the journal opened no message window') end"}
  - walk_to: {x: -2750, y: 2048, z: 2304, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "loot_chest(14); if held() ~= 0 then stow() end"}
  # The bedchamber: Darzog's portrait slides up on Crodo's cell (Darzog is dead); Crodo's words, and he is gone.
  - walk_to: {x: -1600, y: 2496, z: 2304, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  # Session 17 (A3): round the Baron's dais (1216-1664 x 2176-2816, 64 high, no step) by the south strip, never on it.
  - walk_to: {x: 1600, y: 2048, z: 2304, radius: 48, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1744, y: 2144, z: 2304, z_tolerance: 8, radius: 32, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        click(19); wait(3)
        if door_state(7) ~= "open" then error("the bedchamber door did not open") end
  - walk_to: {x: 2200, y: 2200, z: 2304, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2816, y: 2200, z: 2304, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        if door_state(16) ~= "closed" then error("the portrait does not start shut") end
        click(36); wait(4)
        if door_state(16) ~= "open" then error("the portrait did not open after Darzog's death: " .. door_state(16)) end
  - assert: {actor_visible: {actor_index: 6, hidden: false}}
  # Crodo's words open in a window as the party steps into the cell: M21's reveal; the qbit, and Crodo gone home.
  - play_lua: {source: 'remember("xp", experience(0))'}
  - walk_to: {x: 2816, y: 2800, z: 2304, radius: 64, timeout_seconds: 30, clear_hostiles: 500, expect: dialog}
  - assert:
      dialog: {text_contains: "Lord Xeen"}
  - assert:
      dialog: {text_contains: "The vault's word is 'laboratory'"}
  - play_lua:
      source: |
        if not close() then error("Crodo's words opened no message window") end
        wait(1)
        if not qbit(110501) then error("freeing Crodo did not set crodo_freed") end
        local xp = experience(0) - recall("xp")
        log("Crodo's experience: " .. xp)
        if xp < 35000 then error("m21.crodo gave " .. xp .. " experience, not 35,000") end
  - assert: {autonote: {id: 4121, present: true}}
  - assert: {actor_visible: {actor_index: 6, hidden: true}}
  # A second step into the cell (lane A8, 2026-11-20): the once-hook's else text, and no more experience.
  - walk_to: {x: 2816, y: 2200, z: 2304, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: 'remember("xp2", experience(0))'}
  - walk_to: {x: 2816, y: 2800, z: 2304, radius: 64, timeout_seconds: 30, clear_hostiles: 500, expect: dialog}
  - assert:
      dialog: {text_contains: "marks of his chain"}
  - play_lua:
      source: |
        if not close() then error("the empty cell opened no message window") end
        wait(1)
        if experience(0) ~= recall("xp2") then error("the empty cell gave experience again") end
  # Down the Well on Darzog's disc.
  - walk_to: {x: 2816, y: 2200, z: 2304, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2100, y: 2240, z: 2304, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1744, y: 2144, z: 2304, z_tolerance: 8, radius: 32, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1500, y: 2048, z: 2304, z_tolerance: 8, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -512, y: 2300, z: 2304, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -512, y: 1408, z: 2304, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 0, y: 1250, z: 2304, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 0, y: 672, z: 2304, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(15); wait(9)"}
  - assert: {party_position: {x: 0, y: 672, radius: 120, z_min: -8, z_max: 56}}
  - play_lua: {source: "if door_state(32) ~= 'open' or door_state(13) ~= 'closed' then error('the disc did not come down with its grille shut: ' .. door_state(32) .. door_state(13)) end"}
  # Off the disc into the north cloister; the bottom button sends it up and calls it down again.
  - walk_to: {x: 0, y: 1408, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        click(16); wait(9)
        if door_state(32) ~= "closed" or door_state(13) ~= "open" then error("the bottom button did not send the disc up: " .. door_state(32)) end
        click(16); wait(9)
        if door_state(32) ~= "open" then error("the bottom button did not call the disc down: " .. door_state(32)) end
  # Ride it up again with the bottom button, from the disc.
  - walk_to: {x: 0, y: 672, z: 0, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(16); wait(9)"}
  - assert: {party_position: {x: 0, y: 672, radius: 120, z_min: 2296, z_max: 2320}}
  # The sky stair to the roof and the cloud stair up to X9.
  - walk_to: {x: 0, y: 1300, z: 2304, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1408, y: 1408, z: 2304, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1408, y: -512, z: 2304, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2112, y: -512, z: 2304, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2816, y: -1600, z: 2304, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2816, y: 1350, z: 3072, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2816, y: 2200, z: 3072, radius: 64, timeout_seconds: 30, clear_hostiles: 2500}
  - clear_hostiles: {radius: 3000}
  - assert: {state_dump_map_var: {index: 4, value: 1}}
  - walk_to: {x: 0, y: 2000, z: 3072, radius: 64, timeout_seconds: 40, clear_hostiles: 2500}
  - play_lua:
      source: |
        for _, b in ipairs({110500, 110501, 110502}) do
          if not qbit(b) then error("quest bit " .. b .. " was lost") end
        end
  # The top step's event (9, session 17): with Crodo free the standard entrance window (F16, 2026-11-22: OK/Close, no
  # Yes/No); Close keeps the party on the roof, OK moves to X9's entrance:xd12_roof (0, -17920, 320) 512.
  - walk_to: {x: 0, y: 2752, z: 3232, z_tolerance: 64, radius: 24, timeout_seconds: 30, clear_hostiles: 1500, expect: dialog}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "Close"}
  - advance_runtime: {seconds: 1}
  - assert: {map: xeen_xd12.blv}
  - assert: {party_position: {x: 0, y: 2752, radius: 160, z_min: 3150, z_max: 3300}}
  - play_lua: {source: "close(); click(9); wait(0.5)"}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 2, follow_map_move: true}
  - assert: {map: xeen_x9.blv}
  - play_lua: {source: "clear_hostiles(6000); for _ = 1, 3 do if not close() then break end end"}
  - advance_runtime: {seconds: 2}
  - assert: {party_position: {x: 0, y: -17920, radius: 192, facing: 512, facing_within: 64}}
  - play_lua: {source: "log('X9 arrival: ' .. party())"}
