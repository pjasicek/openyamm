format: 0
level: L2
pitch: "The Tower of High Magic stands in the swamp of Lifeforce Lagoon: a pale plaster tower of four alchemy floors round a lift shaft, built by an Archmage who kept six brews, one to a laboratory, that harden whoever drinks them against the elements. Flying feet and guardian constructs keep the lower floors; sorceresses the upper. The stairs climb the east, west and east sides in turn so that every floor is crossed; a steam valve thaws the frozen door of the west stair; the Head Sorceress carries the Librarian's Key to the top floor; at each landing a lever unbolts the lift gate so the brass cages become a quick way down. At the top the Archmage's study holds the Skeleton Key to Darzog's Tower, and the Stairway to Heaven climbs out onto the roof under the open sky, where a stair of cloud goes on toward the High Magic clouds."
purpose: "Story step M13 (QUESTS.md): the Skeleton Key to Darzog's Tower, from the Archmage's chest (A3's hook m13.skeleton_key). Six permanent rewards (+5 to one resistance per brew, once per character, D-4) and the Prismatic Light spellbook. Class M, party 18-20, monsters 18-32."
mood: "Pale, bright and strange: plaster and marble lit warm by sconces, each laboratory in its own glow (furnace red, coil blue, frost white, poison green, energy yellow, magic violet); wind and open sky on the roof."
