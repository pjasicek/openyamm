# Playtest of the Tower of High Magic's way up to X8 (XD-11, L4; lane A8, 2026-11-20): the party stands on the roof by
# the stair of cloud (set_pose: the climb itself is playtest.yml's), clicks it (event 11, evt:cloud_stair: the standard
# entrance window, F16 2026-11-22), answers OK and arrives on X8 Cloudreach (xeen_x8.blv, A6) at the High Magic clouds' landing,
# -10752, -4337, 0 facing north (the orchestrator's explicit arrival). Run with --world xeen --map xeen_xd11.blv
# (output/studio_cal/xd11/four.sh, TESTS=playtest_exit).
id: xeen.xd11.l4.exit
title: Tower of High Magic (XD-11 L4), up the Stairway to Heaven to X8
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_xd11.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 20, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 20, skills: [], equipment: {}}
  - assert: {map: xeen_xd11.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - play_lua: {source: "wait(3)"}
  - play_lua: {source: "close()"}
  - set_pose: {map: xeen_xd11.blv, x: 1536, y: 920, z: 2560, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 4000}
  - play_lua: {source: "click(11); wait(0.5)"}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_x8.blv}
  - assert: {party_position: {x: -10752, y: -4337, radius: 128, z_min: -80, z_max: 200}}
  # No second window on X8.
  - assert: {dialog: {active: false}}
