  - id: evt:mysteries
    preset: chest
    source: chest:mysteries
    title: Cabinet
    text: "MYSTERIES OF LIGHT, says the brass plate on the cabinet's door."
    notes: "'Mysteries of Light' (aaze0058:2) names the shelf; the Prismatic Light spellbook inside (D-4 item 2)."
  - id: evt:obs_box
    preset: chest
    source: chest:obs_box
    title: Pandorian Box
    notes: "Original line 'Pandorian Box' (aaze0055:4): trapped (trap level 3)."
  - id: evt:quarters_chest
    preset: chest
    source: chest:quarters
    title: Chest
  - id: evt:reagents_box
    preset: chest
    source: chest:reagents_box
    title: Pandorian Box
    text: The box is empty.
    notes: "Original lines 'Pandorian Box', 'The box is empty.' (aaze0055:4, 5)."
  - id: evt:still_reagents
    preset: door
    source: door:still_reagents
    title: Door
  - id: evt:study_chest
    preset: chest
    source: chest:study
    title: Chest
    condition: {lua: "XeenQuests.hook(\"m13.study_door\")"}
    effects:
      - lua: "XeenQuests.hook(\"m13.skeleton_key\")"
    notes: "D-89: A3's m13.study_door first (the Enchanted Key 12306; else its refusal line); then A3's hook m13.skeleton_key (once): sets 111260, 6,000 experience and its status line (aaze0058:7); the Skeleton Key 12100 is the chest's item (F15)."
  - id: evt:valve
    preset: switch
    source: switch:valve
    title: Steam valve
    condition: {not: {map_var: frost_thawed}}
    opens: [door:frost]
    sets: {map_var: frost_thawed}
    effects:
      - message: "You heave the steam valve round. The pipes knock and hiss along the walls, and from the garden beyond the still comes the crack and drip of thawing ice: the frozen door of the west stair stands open."
    else_effects:
      - text: "The valve is open as far as it goes; steam hisses in the pipes."
    notes: "poi:steam_valve: two states (shut, open); thaws and opens door:frost."
notes: "XD-11's events, written by output/studio_cal/xd11/tools/dress.py."
