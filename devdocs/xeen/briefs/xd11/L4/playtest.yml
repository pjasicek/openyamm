# Playtest of the Tower of High Magic (XD-11, L4): the critical path through every mechanism and back down the lifts.
# A level-20 party arrives inside the enchanted door (the arrival window: why it is here), asks at the enchanted door
# (the exit window; it stays, OK is playtest_exit_x3.yml), drinks the Fire Brew (twice: the second says so),
# the Electric Brew, finds lift 0-1 refusing before its gate, climbs the east stair, finds gate 1 bolted, pulls its
# lever, rides lift 0-1 down and up, drinks the Cold Brew, finds the west stair's door frozen shut, opens the steam
# valve (the door thaws), opens the empty Pandorian Box, drinks the Poison Brew, climbs the west stair, drinks the
# Energy Brew, kills the Head Sorceress and takes the Librarian's Key from her corpse, drinks the Magic Brew, reads a
# bed, loots the quarters' chest, pulls gate 2's lever, opens the Librarian's door, climbs to the top floor, pulls gate
# 3's lever, reads The Art of Magic, takes the Prismatic Light spellbook from the cabinet of Mysteries of Light, opens
# the Archmage's chest (A3's hook: the Skeleton Key, qbit 111260; a second look: empty), loots the observatory's
# Pandorian Box, climbs the Stairway to Heaven to the roof, comes to the cloud stair (its climb to X8 is playtest_exit.yml), and
# rides the three cages down to the ground floor. Numbers are ids.lock.yml's (events, doors, map variables); actor 0
# is the Head Sorceress (placed monsters by id). Run with --world xeen --map xeen_xd11.blv
# (output/studio_cal/xd11/four.sh).
id: xeen.xd11.l4.walk
title: Tower of High Magic (XD-11 L4), the door to the Archmage's study, the roof and down the lifts
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_xd11.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 20, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 20, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 20, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 20, skills: [], equipment: {}}
  - assert: {map: xeen_xd11.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - advance_runtime: {seconds: 3, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "THE TOWER OF HIGH MAGIC"}}
  - assert: {dialog: {text_contains: "Skeleton Key"}}
  - play_lua: {source: "close()"}
  - play_lua: {source: "if not qbit(110680) then error('the arrival window did not set arrived_once') end"}
  # The enchanted door: asks to leave; cancelling keeps the party inside (OK leaves for X3's islet: playtest_exit_x3.yml).
  - walk_to: {x: -1408, y: -1900, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - execute_event: {id: 13}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - press_action: {action: cancel_dialog}
  - advance_runtime: {seconds: 1.0, follow_map_move: true}
  - assert: {map: xeen_xd11.blv}
  # The foyer, the door to the athanor, the Fire Brew (once).
  - walk_to: {x: -1408, y: -1100, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1088, y: 750, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - play_lua: {source: "open_door(15, 6)"}
  - walk_to: {x: -1088, y: 1260, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 640, y: 1260, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - walk_to: {x: 768, y: 1460, z: 0, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "status(); click(8); wait(1)"}
  - play_lua: {source: "local s = tostring(status()); if not string.find(s, '+5 Fire resistance', 1, true) then error('no brew line: ' .. s) end"}
  - play_lua:
      source: |
        close()
        click(8); wait(0.5)
        local seen = status()
        if not string.find(seen, "Fire Brew already", 1, true) then error("the Fire Brew worked twice: " .. seen) end
  # The lightning coils: the Electric Brew.
  - walk_to: {x: 640, y: 1150, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 640, y: 760, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: 270, y: 330, z: 0, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(6); wait(1)"}
  - play_lua: {source: "local s = tostring(status()); if not string.find(s, '+5 Air resistance', 1, true) then error('no brew line: ' .. s) end"}
  - play_lua: {source: "close()"}
  # The foot of the lift shaft: the cage hangs above and refuses before its gate is unbolted.
  - walk_to: {x: 640, y: 0, z: 0, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "open_door(12, 4)"}
  - walk_to: {x: 640, y: -420, z: 0, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        status()
        click(26); wait(1)
        local seen = status()
        if not string.find(seen, "will not come down", 1, true) then error("the call button said nothing: " .. seen) end
        if door_state(1) ~= "open" then error("lift 0-1 moved before its gate: " .. door_state(1)) end
  # Up the east stair to the east landing: gate 1 is bolted until its lever.
  - walk_to: {x: 640, y: 0, z: 0, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1150, y: 704, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1792, y: 560, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1792, y: -1600, z: 640, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1600, y: -1760, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1100, y: -1760, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: 760, y: -1150, z: 640, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        status()
        click(17); wait(1)
        local seen = status()
        if not string.find(seen, "bolted", 1, true) then error("the bolted gate said nothing: " .. seen) end
        if door_state(8) ~= "closed" then error("gate 1 opened before its lever") end
        click(18); wait(3)
        if door_state(8) ~= "open" then error("the lever did not open gate 1: " .. door_state(8)) end
  - assert: {state_dump_map_var: {index: 2, value: 1}}
  # Into the first-floor core, onto the cage: down to the ground floor and up again.
  - walk_to: {x: 640, y: -800, z: 640, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 448, y: -576, z: 640, radius: 40, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "click(25); wait(6)"}
  - assert: {party_position: {x: 448, y: -576, radius: 160, z_min: -10, z_max: 60}}
  - play_lua: {source: "click(27); wait(6)"}
  - assert: {party_position: {x: 448, y: -576, radius: 160, z_min: 600, z_max: 700}}
  - walk_to: {x: 640, y: -800, z: 640, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua:
      source: |
        status()
        click(29); wait(1)
        local seen = status()
        if not string.find(seen, "will not come down", 1, true) then error("lift 1-2's call button said nothing: " .. seen) end
  # The cold still: the Cold Brew.
  - walk_to: {x: 640, y: -1300, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 400, y: -1536, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -100, y: -1536, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: -128, y: -1790, z: 640, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(5); wait(1)"}
  - play_lua: {source: "local s = tostring(status()); if not string.find(s, '+5 Water resistance', 1, true) then error('no brew line: ' .. s) end"}
  - play_lua: {source: "close()"}
  # The poison garden: the west stair's door is frozen shut.
  - walk_to: {x: -256, y: -800, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -256, y: -300, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: -1140, y: -320, z: 640, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(16); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "frozen shut"}}
  - play_lua:
      source: |
        close()
        if door_state(7) ~= "closed" then error("the frozen door opened before the valve") end
  # The reagent store: the steam valve thaws the door; the Pandorian Box is empty.
  - walk_to: {x: -256, y: -800, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1100, y: -1600, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "open_door(38, 13)"}
  - walk_to: {x: -1600, y: -1600, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 1500}
  - walk_to: {x: -1600, y: -1300, z: 640, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(40); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "steam valve"}}
  - play_lua:
      source: |
        close(); wait(3)
        if door_state(7) ~= "open" then error("the valve did not thaw the frozen door: " .. door_state(7)) end
  - assert: {state_dump_map_var: {index: 1, value: 1}}
  - play_lua:
      source: |
        status()
        loot_chest(37)
        local seen = status()
        if held() ~= 0 then stow() end
        close()
        if not string.find(seen, "The box is empty.", 1, true) then error("the Pandorian Box said nothing: " .. seen) end
