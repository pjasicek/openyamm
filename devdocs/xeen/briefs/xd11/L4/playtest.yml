  - walk_to: {x: -1100, y: -1600, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -256, y: -800, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -256, y: -300, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1140, y: -320, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1140, y: 1100, z: 640, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(10); wait(1)"}
  - play_lua: {source: "local s = tostring(status()); if not string.find(s, '+5 Body resistance', 1, true) then error('no brew line: ' .. s) end"}
  - play_lua: {source: "close()"}
  # Through the thawed door and up the west stair to the west landing.
  - walk_to: {x: -1140, y: -320, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1550, y: -320, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1728, y: -200, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1728, y: 1550, z: 1280, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1600, y: 1728, z: 1280, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1100, y: 1728, z: 1280, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  # The energy lab: the Energy Brew.
  - walk_to: {x: -768, y: 1500, z: 1280, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -768, y: 1000, z: 1280, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: -990, y: 160, z: 1280, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(7); wait(1)"}
  - play_lua: {source: "local s = tostring(status()); if not string.find(s, '+5 Earth resistance', 1, true) then error('no brew line: ' .. s) end"}
  - play_lua: {source: "close()"}
  # The magic lab: the Head Sorceress dies and her corpse holds the Librarian's Key; the Magic Brew on its dais.
  - walk_to: {x: 250, y: 960, z: 1280, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "open_door(14, 5)"}
  - walk_to: {x: 700, y: 960, z: 1280, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - assert: {actor_visible: {actor_index: 0, dead: true}}
  - walk_to: {x: 1200, y: 1300, z: 1280, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - interact_actor: {actor_index: 0}
  - play_lua: {source: "wait(1); if held() ~= 0 then stow() end; close(); if not has_item(12260) then error('the Head Sorceress\\'s corpse did not hold the Librarian\\'s Key') end"}
  - walk_to: {x: 1344, y: 1540, z: 1312, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(9); wait(1)"}
  - play_lua: {source: "local s = tostring(status()); if not string.find(s, '+5 Mind resistance', 1, true) then error('no brew line: ' .. s) end"}
  - play_lua: {source: "close()"}
  # The quarters: a bed, the chest, gate 2's lever, the Librarian's door.
  - walk_to: {x: 896, y: 760, z: 1280, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 896, y: 200, z: 1280, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: 1472, y: 150, z: 1280, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        status()
        click(3); wait(0.5)
        local seen = status()
        if not string.find(seen, "nothing on, in, or under the bed", 1, true) then error("the bed said nothing: " .. seen) end
  - walk_to: {x: 1820, y: 128, z: 1280, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "loot_chest(36); if held() ~= 0 then stow() end; close()"}
  - walk_to: {x: 900, y: 0, z: 1280, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        click(20); wait(3)
        if door_state(9) ~= "open" then error("the lever did not open gate 2: " .. door_state(9)) end
  - walk_to: {x: 1728, y: 0, z: 1280, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        click(23); wait(3)
        if door_state(11) ~= "open" then error("the Librarian's Key did not open the door: " .. door_state(11)) end
  # Up the library stair to the top landing: gate 3's lever.
  - walk_to: {x: 1728, y: -360, z: 1280, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1700, y: -1780, z: 1920, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1600, y: -1856, z: 1920, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1100, y: -1856, z: 1920, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: 900, y: -1150, z: 1920, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        click(22); wait(3)
        if door_state(10) ~= "open" then error("the lever did not open gate 3: " .. door_state(10)) end
  # The library: The Art of Magic; the cabinet of Mysteries of Light holds the Prismatic Light spellbook.
  - walk_to: {x: 400, y: -1536, z: 1920, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -100, y: -1536, z: 1920, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: -512, y: -1260, z: 1920, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(2); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "THE ART OF MAGIC"}}
  - play_lua: {source: "close()"}
  - walk_to: {x: -500, y: 0, z: 1920, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -704, y: 1060, z: 1920, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "loot_chest(34); if held() ~= 0 then stow() end; close(); if not has_item(483) then error('the cabinet did not hold the Prismatic Light spellbook') end"}
  # The Archmage's study: the chest gives the Skeleton Key once (A3's hook), and holds no second key.
  - walk_to: {x: -500, y: 0, z: 1920, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1000, y: -1344, z: 1920, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "open_door(24, 12)"}
  - walk_to: {x: -1500, y: -1344, z: 1920, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: -1820, y: -1100, z: 1920, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  # D-89 (2026-11-22): the Enchanted Key opens the chest (m13.study_door), not the study door.
  - play_lua: {source: "status(); click(39); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "only a faint shimmer where a key would go"}}
  - play_lua: {source: "close(); if has_item(12100) then error('the Skeleton Key without the Enchanted Key') end"}
  - grant_item: {item_id: 12306}
  - play_lua:
      source: |
        status()
        loot_chest(39)
        if held() ~= 0 then stow() end
        close(); wait(1); close()
        if not has_item(12100) then error("the Archmage's chest did not give the Skeleton Key") end
        if not qbit(111260) then error("qbit 111260 not set") end
        if item_count(12100) ~= 1 then error("more than one Skeleton Key: " .. item_count(12100)) end
        loot_chest(39)
        if held() ~= 0 then stow() end
        close(); wait(1); close()
        if item_count(12100) ~= 1 then error("a second Skeleton Key: " .. item_count(12100)) end
  # The observatory's Pandorian Box (trapped).
  - walk_to: {x: -1664, y: -760, z: 1920, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
