  - walk_to: {x: 450, y: 1728, z: 2560, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -100, y: 1728, z: 2560, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1620, y: 1792, z: 1920, radius: 64, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: -1856, y: 1500, z: 1920, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1664, y: -300, z: 1920, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1664, y: -760, z: 1920, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1500, y: -1344, z: 1920, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1000, y: -1344, z: 1920, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -100, y: -1536, z: 1920, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 640, y: -1300, z: 1920, radius: 64, timeout_seconds: 20, close_dialogs: true}
