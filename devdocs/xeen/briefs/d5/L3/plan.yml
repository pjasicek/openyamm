    kind: zone
    part_of: zone:quivering_forest
    floor: 2700
    purpose: "A trampled clearing of broken aspens, a bone heap and a lean-to of whole trunks: \"You have found a Giant's lair. Destroy?\" (aaze0009:1-2); the lair's hoard under the trunks."
