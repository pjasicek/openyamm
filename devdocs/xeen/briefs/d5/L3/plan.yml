    purpose: "Stony desert of wind-cut mesas and dry wadis between the pass and the dunes, rising to the western and southern hills: the obelisk by the road, the oasis, the Shrine of Great Power on its mesa, a dead prospector in a wadi, a genie's lamp in a ruined hill shrine; vulture rocs over the wadis."
