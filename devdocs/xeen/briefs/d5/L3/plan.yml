    keep_clear: [spawns]
  - id: zone:highlands
    name: The northern highlands
    kind: wild
    floor: [2000, 3800]
    relief: uneven
    purpose: "Cold stony downs and snow in the hollows between the escarpment and the rim: the giants' country. Gurodel's hold and the great doors of his hall (DD-24), Bosco's Hall (DD-25) in a crag, the Northern Tower (DD-08) at the Parabolic Barrier's vertex, the Fountain of Might by the rim, an abandoned dwarf camp. Peaceful People giants at the hold; no wild monsters (the map's quiet quarter until Q-D16's war)."
    density: sparse
    population:
      - {id: pop:people, actor: Xeen Giant, groups: 1, placed: true, hostile: false, notes: "Gurodel's People at the hold: 6 placed, peaceful (A2's People rows 11083-11085, faction xeen_giants_people, D-47, D-49 Q1); hostile on q-d16.war, q-d16.hall_attacked, q-d12.hostile or q-d12.camp_burned. Not counted in the 110 at load."}
