    name: The Last Water
    kind: zone
    part_of: zone:desert_of_doom
    floor: 1330
    purpose: "A spring pool under a few date palms in a hollow south of the road: the Last Water, a stone basin fed by the spring (d5.last_water: +2 Luck, permanent, once per character; D-49 Q5 as A2 swapped it)."
