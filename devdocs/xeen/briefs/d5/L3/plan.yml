    density: sparse
    population:
      - {id: pop:cliff_birds, slot: 2, groups: 11, per_marker: [1, 3], levels: [30, 48], notes: "Encounter area E3: Vulture Rocs 30, Rocs 38, Griffins 48 (Dif 2), and 3 Griffins 48 placed at the eyrie."}
