    floor: 1500
    purpose: "By the west road in the Desert of Doom (D-49 change 1): Enchanted Boulders 1, 2 and 7 (the seventh asks \"What am I?\") in a chained ring, each within 400 of the next: one spot; at least 2,600 from the obelisk knoll and the Last Water."
