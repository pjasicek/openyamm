  - id: zone:barrier_lee
    name: Behind the Barrier
    kind: void
    purpose: "The strip between the Parabolic Barrier and the rim: bare rock and the drop to the stars. The curtain cannot be crossed; nothing is placed here (not counted as land)."
    empty: true
  - id: zone:bosco_terrace
    name: Bosco's door
    kind: zone
    part_of: zone:highlands
    floor: 2650
    purpose: "A paved terrace under a grey crag on the highlands' south-west shoulder: the carved stone double door of Bosco's Hall (DD-25, the dwarf king's small hall with a smith, a tavern and the Earth guild), two lanterns, a bench, the dwarves' anvil sign."
    safe: true
    keep_clear: [spawns]
  - id: zone:boulder_field
