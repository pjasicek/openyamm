  - id: poi:shrine_great_power
    space: zone:shrine_mesa
    kind: shrine
    behaviour: "\"Shrine of Great Power. Will the party pray?\" (aaze0010:15-17): +15 to all seven stats until the next rest (the source's +15 levels rescaled, as D1's prayer shrine's +3 levels became +10 all stats), once a day."
    uses: {times: 1, per: character, reset: daily}
  - id: poi:signposts
    spaces: [junction:pyramid_fork, junction:highland_fork, junction:doom_fork]
    count: 3
    kind: signpost
    behaviour: Signposts at the three forks.
