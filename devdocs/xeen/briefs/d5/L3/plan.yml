    keep_clear: [spawns]
  - id: zone:perishing_sands
    name: The Perishing Sands
    kind: wild
    floor: [1000, 1700]
    relief: uneven
    purpose: "A sea of high amber dunes east and south of the pyramid, a white salt pan in its lowest trough: iguanasaurus everywhere off the road; the boulder field by the road, a caravan swallowed by the sand, a lamp on a dune crest, the tunnel grate in the southern hills' foot."
    density: open
    population:
      - {id: pop:sands_lizards, slot: 1, groups: 8, per_marker: [2, 3], levels: [42, 55], notes: "Encounter area E1: Iguanasaurus 42, Great 50, Ancient 55 (Dif 3); the first fight from D4."}
      - {id: pop:pyramid_lizards, slot: 1, groups: 7, per_marker: [2, 3], levels: [42, 55], notes: "Encounter area E2: the same round the pyramid's west and south sides."}
