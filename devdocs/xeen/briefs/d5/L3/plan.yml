    space: zone:desert_of_doom
    kind: obelisk
    behaviour: "obelisks.d5: the fifth of six words, TRAVEL (autonote dark_5, 115054)."
    rule: native:obelisk
    notes: "On a red rock knoll beside the west road, the pyramid in view to the south-east."
