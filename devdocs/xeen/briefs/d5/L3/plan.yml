    story: M28
points_of_interest:
  - id: poi:boulder_sign
    space: zone:boulder_field
    kind: sign
    behaviour: "q-d24.sign: \"A weathered sign reads: A dying paladin gave all his magical armor to the enchanted boulders of the land for safekeeping.\""
  - id: poi:boulders
    space: zone:boulder_field
    count: 4
    kind: device
    behaviour: "q-d24.boulder_3-6: four great Enchanted Boulders with the sign, a chained ring (each within 400 of the next: one spot with the sign). After q-d24.solved each crumbles when clicked, gives one random treasure-level-5 item and is hidden (crumbled_3-6). No chests."
  - id: poi:boulders_west
    space: zone:boulders_west
    count: 3
    kind: device
    behaviour: "q-d24.boulder_1, 2 and 7: three Enchanted Boulders in a chained ring by the west road (one spot); the seventh asks \"What am I?\" (q-d24.answer: Paladin, the dead paladin's armour 12529; else answer_wrong). Boulders 1 and 2 crumble after the answer as the east ones (crumbled_1, 2)."
  - id: poi:capstone
    space: zone:east_valley
    kind: device
    behaviour: "obelisks.dark_hoard: the broken travel pyramid and its fallen capstone at its foot, within 400 of the pyramid's click (\"The pyramid portal has been destroyed.\", aaze0013:12): one spot (D-49 change 2); with all six Darkside words the party digs out the obelisk hoard, once."
    uses: {times: 1, per: party, reset: never}
  - id: poi:caravan_wreck
    space: zone:perishing_sands
    kind: chest
    behaviour: "A Sandcaster caravan the sands swallowed: a wagon's ribs and a strongbox at the salt pan's edge (a chest)."
  - id: poi:dwarf_camp
    space: zone:highlands
    kind: chest
    behaviour: "An abandoned dwarf prospectors' camp on the east highlands: a cold fire, picks, a sledge and a locked strongbox (a chest); Bosco's people stopped coming when the giants moved in."
  - id: poi:eyrie_nest
    space: zone:escarpment
    kind: chest
    behaviour: "The griffins' eyrie on a ledge of the cliffs: in the bones, a dead griffin-hunter's satchel (a chest), guarded by three griffins."
    reached_by: off_road
  - id: poi:fountain_energy
    space: zone:quivering_forest
    kind: fountain
    behaviour: "The Fountain of Energy Resistance (aaze0009:3-5, \"Your spine tingles and the hair on the back of your neck stands on end.\"): +5 Air resistance, permanent, once per character (the source's +50 rescaled by D-4's +5 rule, as D4's magic resistance well). By the Barrier's west end."
    uses: {times: 1, per: character, reset: never}
  - id: poi:fountain_might
    space: zone:highlands
    kind: fountain
    behaviour: "The Fountain of Might (aaze0013:9-11): +20 Might until the next rest (the source's +100 rescaled), once a day. A spring under the rim the giants drink from."
    uses: {times: 1, per: character, reset: daily}
  - id: poi:giants_lair
    space: zone:cyclops_lair
    kind: device
    behaviour: "\"You have found a Giant's lair. Destroy?\" (aaze0009:1-2): tearing it apart gives experience once (the source's +50,000 rescaled by A3)."
    uses: {times: 1, per: party, reset: never}
  - id: poi:gurodel
    space: zone:giants_hold
    kind: npc
    behaviour: "Gurodel, King of the People (5452), at his fire: Q-D16 (\"Greetings, little ones.\"). Not a point of interest (D-23 (1))."
  - id: poi:lair_hoard
    space: zone:cyclops_lair
    kind: chest
    behaviour: The cyclopes' hoard under the lean-to's trunks (a chest).
  - id: poi:lamp_doom
    space: zone:desert_of_doom
    kind: device
    behaviour: "A genie's lamp in a ruined hill shrine in the western hills (aaze0010:11-14; Q-D27's wish choice, greed punished)."
    reached_by: off_road
  - id: poi:lamp_sands
    space: zone:perishing_sands
    kind: device
    behaviour: "A genie's lamp half buried on a high dune crest in the sand sea (aaze0014:15-18; Q-D27)."
    reached_by: off_road
  - id: poi:last_water
    space: zone:oasis
    kind: fountain
    behaviour: "The Last Water (d5.last_water): +2 Luck, permanent, once per character (D-49 Q5: the least-served permanent stat by A2's ledger; the map's permanent device)."
    uses: {times: 1, per: character, reset: never}
  - id: poi:munchies
    spaces: [zone:desert_of_doom, zone:perishing_sands]
    count: 2
    kind: trap
    behaviour: "\"SOMEONE in the party got the munchies and ate all the food!\" (aaze0010:18, aaze0014:20): a spot that empties the party's food, once a day. Hazards, not counted as points of interest."
