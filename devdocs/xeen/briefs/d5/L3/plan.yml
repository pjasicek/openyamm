format: 0
level: L3
pitch: "Darkside's top middle, between the Forest of Peril and the Forbidden Zone. A basin of desert under the amber day: the Perishing Sands in the east and south, a sea of high dunes with a white salt pan, and rising out of it the Great Pyramid of the Dragon Pharaoh, alone and enormous; the Desert of Doom in the west, stony mesas and dry wadis, an oasis, a shrine on a mesa. Along the north the Griffin Cliffs lift the cold highlands of the giants: Gurodel's fire and the doors of his hall, Bosco's dwarf hall in a crag, the Northern Tower, and before the rim the Parabolic Barrier, a bowed line of Ancient frames with a shimmering curtain. In the north-west the aspens of the Quivering Forest never stop trembling."
purpose: "Act V's wilderness map (party 42-45): the Great Pyramid and DD-15 (M28-M30), Gurodel's giants and DD-24 (Q-D16), Bosco's Hall (DD-25) and the Northern Tower (DD-08, Q-D17), the Enchanted Boulders (Q-D24), the fifth Darkside obelisk and the obelisk hoard under the broken travel pyramid, the far end of Sandcaster's sewer tunnel (DD-18), two genie lamps (Q-D27); the road from D4 to D6."
mood: "Heat haze under a low amber band and a small pale sun; wind hissing over sand; the pyramid's shadow long across the dunes; cold wind and woodsmoke on the highlands; the trembling of the aspens; the Barrier's faint hum."
datum: water:rim_sea
