events:
  - id: evt:sky
    trigger: load
    effects:
      - lua: Xeen.applyDarksideSky()
    notes: Darkside's sky by the sun's stage (A3's helper).
  - id: evt:boulders_gone
    trigger: load
    lua: "if IsQBitSet(QBit(113481)) then HideThing(\"thing:boulder_1\") end if IsQBitSet(QBit(113482)) then HideThing(\"thing:boulder_2\") end if IsQBitSet(QBit(113483)) then HideThing(\"thing:boulder_3\") end if IsQBitSet(QBit(113484)) then HideThing(\"thing:boulder_4\") end if IsQBitSet(QBit(113485)) then HideThing(\"thing:boulder_5\") end if IsQBitSet(QBit(113486)) then HideThing(\"thing:boulder_6\") end if IsQBitSet(QBit(113480)) then HideThing(\"thing:boulder_7\") end"
    notes: "q-d24: the crumbled boulders and the answered seventh are gone (A3's crumbled_1-6, solved)."
  - id: evt:hold_struck
    trigger: timer
    every: 1
    condition: {not: {any: [{qbit: giants_war}, {qbit: hall_attacked}, {qbit: sardaj_hostile}, {qbit: sardaj_camp_burned}]}}
    lua: "local struck = false for i = 0, 5 do if evt.IsMapActorHostile(i) and not evt.IsMapActorDead(i) then struck = true end end if struck then XeenQuests.hook(\"q-d16.hold_attacked\") end"
    notes: "D-47 Q22 / D-49 Q1: a People giant struck at peace (the first six actors) calls q-d16.hold_attacked once; A2's relations then turn the People on both maps."
  - id: evt:rim_fall
    trigger: timer
    every: 1
    lua: "Xeen.rimFall({{{-32768, 32768}, {32768, 32768}, {32768, 20480}, {-32768, 20480}}}, {{22016, 18432, 3264, 1536}, {12288, 18432, 3488, 1536}, {9216, 18432, 3552, 1536}, {6144, 18432, 3552, 1536}, {3072, 18432, 3520, 1536}, {0, 18432, 3424, 1536}, {-3072, 18432, 3488, 1536}, {-12288, 18432, 3104, 1536}, {-15360, 18432, 3040, 1536}, {-18944, 18432, 3264, 1536}, {-22016, 18432, 3200, 1536}})"
    notes: "F29 (P2 pins p7, p12; 2026-11-23): a party in the sea below the world rim, or in the rim's foot below Xeen.RimFallDepth, is lifted back onto the rim at the nearest return point and falls the last Xeen.SkyFallHeight (common/wild.py, xeen_common.lua Xeen.rimFall). Return points (cells): [107, 28], [88, 28], [82, 28], [76, 28], [70, 28], [64, 28], [58, 28], [40, 28], [34, 28], [27, 28], [21, 28]."
