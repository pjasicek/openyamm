    title: Yellow Tomb Juice
    condition: {not: {player_bit: 11274}}
    effects:
      - player_bit: 11274
      - add:
          var: BaseAccuracy
          value: 2
      - text: Yellow Tomb Juice. +2 Accuracy (permanent).
    else_effects:
      - text: The liquid is powerless.
    notes: "aaze0080:6 and :9; D-4.2: +2 Accuracy once per character (player bit 11274)."
  - id: evt:maiden
    preset: door
    source: door:maiden
    title: Iron Maiden
    action: open
    text: "The iron maiden swings open. Its back is no back at all: behind the spikes a stair goes down into the dark."
    notes: "link:maiden_stair: the secret door (D-4)."
  - id: evt:manacles
    preset: switch
    source: switch:manacles
    title: Manacles
    condition: {not: {qbit: manacles_pulled}}
    opens: [door:portcullis]
    sets: {qbit: manacles_pulled}
    effects:
      - shake:
          strength: 0.4
          seconds: 2
    else_effects:
      - text: "The manacles hang slack. Below, the portcullis stands open."
    text: "You haul on the manacles and their chains run down into the floor. Far below, iron grinds upward."
    notes: "state:manacles: the portcullis before the coffin vault (D-4)."
  - id: evt:plaque_cage
    preset: text
    source: panel:plaque_cage
    title: Plaque
    text: "The plaque reads: Cage."
    window: true
    notes: "The source's plaques (aaze0080:11-13, 25)."
  - id: evt:plaque_maiden
    preset: text
    source: panel:plaque_maiden
    title: Plaque
    text: "The plaque reads: Iron Maiden."
    window: true
    notes: "The source's plaques (aaze0080:11-13, 25)."
  - id: evt:plaque_manacles
    preset: text
    source: panel:plaque_manacles
    title: Plaque
    text: "The plaque reads: Manacles."
    window: true
    notes: "The source's plaques (aaze0080:11-13, 25)."
  - id: evt:plaque_stocks
    preset: text
    source: panel:plaque_stocks
    title: Plaque
    text: "The plaque reads: Stocks."
    window: true
    notes: "The source's plaques (aaze0080:11-13, 25)."
  - id: evt:portcullis
    preset: door
    source: door:portcullis
    title: Portcullis
    condition: {qbit: manacles_pulled}
    locked_text: The portcullis does not move. Its chains run up through the roof toward the tomb above.
    action: open
  - id: evt:welcome
    preset: script
    source: platform:statue
    title: Statue
    effects:
      - lua: "XeenQuests.hook(\"m10.tomb_welcome\")"
    notes: "A3's hook m10.tomb_welcome: the plaque's words (aaze0080:0)."
