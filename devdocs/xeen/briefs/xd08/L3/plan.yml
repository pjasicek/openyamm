format: 0
level: L3
pitch: 'A tomb that its builders meant as a joke on the living: a Hall of Welcome whose statue boasts ''Insanity is our fame,
  undead is our game'', a gallery of torture devices that work - manacles whose chains raise a portcullis far below, an iron
  maiden that opens on a hidden stair, a hanging cage that rides its chain down to the crypts - mourning halls of coffins
  and biers, a ring of crypts round an ossuary, an embalming room of seven coloured juices, and a coffin vault whose great
  coffin only the strong can open. Below, raw rock, a bone pit and the Hall of a Thousand Terrors with its throne of skulls.'
purpose: Story M10 (five King's Megacredits in the great coffin, Might 30); the seven tomb juices (+2 each, once per character);
  an optional deep with the hoard. Party 15-17, monsters 15-30 (Grave Ghouls, Polter-Fools, Tomb Guards, Skeleton Lords; no
  Tomb Terror, D-4.1).
mood: Dark brick and skull friezes lit by skull torches; iron and green-black slabs in the torture rooms; grey barrow rock
  in the crypts; cold raw rock in the deep and a red glow in the Hall.
