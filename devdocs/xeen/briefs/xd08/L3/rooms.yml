format: 0
themes:
- id: theme:tomb
  wall: &id001 {texture: t6s1bs, size: [128, 256]}
  floor: &id002 {texture: t6s1fl, size: [128, 128]}
  ceiling: &id003 {texture: t6s1c, size: [128, 128]}
  reveal: *id001
  door: &id004 {texture: t5d1, size: [128, 256], fit: true}
  notes: 'The tomb proper: MM7''s Temple of Baa (d04) as it lays its set: brick t6s1bs, flagstones t6s1fl, the coffered ceiling
    t6s1c, iron-bound doors t5d1.'
- id: theme:tomb_tall
  wall: *id001
  floor: *id002
  ceiling: *id003
  reveal: *id001
  door: *id004
  notes: 'The tomb''s tall halls: the Baa set with its skull frieze t6s1b as a band under the ceiling (the room''s own bands).'
- id: theme:torture
  wall: &id006 {texture: t4s1fl, size: [128, 128]}
  floor: *id002
  ceiling: *id003
  reveal: *id001
  door: *id004
  notes: 'The torture rooms (stocks, chains, maiden, cage): d04''s green-black slabs t4s1fl on the walls, the tomb''s flags,
    iron (A6''s xwiron, xwcage, the kit''s xkportc).'
- id: theme:crypt
  wall: {texture: t5bs, size: [128, 256]}
  floor: {texture: t2bs, size: [128, 256]}
  ceiling: {texture: t4bs, size: [128, 256]}
  door: *id004
  notes: 'The crypts: MM7''s Barrow I (mdt03) as it lays them: sandy rock t5bs on walls, grey rock t2bs underfoot, green-black
    rock t4bs overhead.'
- id: theme:crypt_dressed
  wall: {texture: hwp1b, size: [128, 256]}
  floor: {texture: t2bs, size: [128, 256]}
  ceiling: {texture: t4bs, size: [128, 256]}
  door: *id004
  notes: 'The dressed crypts (coffin vault, embalming room): Barrow I''s plastered wall hwp1b with its moulding.'
- id: theme:ossuary
  wall: {texture: hwp1b, size: [128, 256]}
  floor: {texture: t2bs, size: [128, 256]}
  ceiling: {texture: t4bs, size: [128, 256]}
  door: *id004
  notes: 'The ossuary: the dressed crypt wall under two bands of skulls (the tomb''s skull frieze t6s1b).'
- id: theme:deep
  wall: &id005 {texture: gcav1flr, size: [256, 256]}
  floor: &id012 {texture: gcav2flr, size: [128, 128], scale: 2}
  ceiling: *id005
  door: *id004
  notes: 'The deep: raw rock (MM8 Ogre Fortress d12''s gcav1flr, gcav2flr, as XD-05 and XD-07''s caves).'
