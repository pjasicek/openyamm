format: 0
start:
  room: room:stair_foot
  at: [0, 704]
  facing: 270
  notes: "At the foot of the coffin stair, facing into the crypt (south): where X3's open coffin (thing:coffin_open) arrives (A5's `into`: 0, 704, 0 facing south, 1536)."
doors:
