      - {slot: 1, groups: 1, per_marker: [1, 1], levels: [45, 45], notes: 1 Gargoyle Overlord 45 (placed).}
      - {slot: 1, groups: 1, per_marker: [1, 1], levels: [38, 38], notes: 1 Gargoyle Sentinel 38 (placed).}
      - {slot: 1, groups: 1, per_marker: [2, 2], levels: [30, 30], notes: 2 Mountain Gargoyle 30 (placed).}
