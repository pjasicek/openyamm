    name: Still gallery
    kind: room
    size: M
    floor: 0
    purpose: "Weathered rock pillars like statues, three of the still shapes gargoyles; the rock steps climb from its end."
    population:
      - {slot: 1, groups: 1, per_marker: [3, 3], levels: [30, 30], notes: 3 Mountain Gargoyle 30 (placed).}
  - id: room:upper_perches
    name: Upper perches
    kind: corridor
    size: M
