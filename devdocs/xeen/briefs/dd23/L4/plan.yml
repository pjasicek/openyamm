    name: Bone ledge
    kind: room
    size: S
    floor: 0
    purpose: "A dead end with a chest: a side cleft where a climber died; his bones, rope and pack (the chest)."
    population:
      - {slot: 1, groups: 1, per_marker: [1, 1], levels: [30, 30], notes: 1 Mountain Gargoyle 30 (placed).}
  - id: room:guano_slope
    name: Guano slope
    kind: corridor
    size: M
    floor: 0
    purpose: "A passage slick with droppings, scratched by claws; gargoyles that heard the party come down from the dark."
    population:
      - {slot: 1, groups: 1, per_marker: [3, 3], levels: [30, 30], notes: 3 Mountain Gargoyle 30 (placed).}
  - id: room:mouth
    name: Cave mouth
    kind: room
    size: S
    floor: 0
    purpose: "The arrival (entrance:d4_mouth): the mouth white with droppings, daylight behind, the cave bending up and in. Quiet (D-11.3)."
