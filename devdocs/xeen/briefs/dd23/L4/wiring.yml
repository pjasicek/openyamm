format: 0
events:
  - id: evt:arrive
    preset: text
    trigger: timer
    every: 1
    once: true
    text: "The cave in the crag runs up into the mountain, its floor white with droppings. Somewhere above, claws scrape on rock."
    seconds: 7
  - id: evt:bones_seen
    preset: text
    source: room:bone_ledge
    trigger: step
    once: true
    text: "A climber's bones lie in the cleft, still roped to his pack."
    seconds: 5
  - id: evt:chest_climber
    preset: chest
    source: chest:climber
    title: Chest
  - id: evt:chest_nest
    preset: chest
    source: chest:nest
    title: Chest
  - id: evt:gallery_seen
    preset: text
    source: room:still_gallery
    trigger: step
    once: true
    text: Weathered pillars of rock stand about the gallery like statues. Some of the statues have wings.
    seconds: 6
  - id: evt:heap_east
    preset: script
    source: platform:heap_east
    title: Roosting rock
    condition: {not: {qbit: lair_destroyed}}
    effects:
      - lua: "XeenQuests.hook(\"q-d15.roost\")"
      - destroy: destructible:rock_high
      - destroy: destructible:rock_north
      - destroy: destructible:rock_west
      - destroy: destructible:rock_east
      - destroy: destructible:rock_south
    else_effects:
      - lua: "XeenQuests.hook(\"q-d15.roost\")"
    notes: "The rock's worn foot: the same click while the rock stands; after, A3's else text \"Rock dust. The gargoyles will have to sit somewhere else.\""
