# Playtest of the Gargoyle Lair (DD-23, L4): the critical path and the loop. A level-35 party arrives in the cave mouth
# (entrance:d4_mouth, the map's start), walks up the guano slope (the bone ledge and the climber's pack off it), through
# the perch hall and up the rock ramp to the upper perches, along the ledge walk into the roost; at a roosting rock it
# clicks a roosting rock (no question since F47, 2026-11-24: A3's q-d15.roost: lair_destroyed 113301, all five
# rocks broken), clicks a rock's foot (A3's else text), takes Caleb's glass from the nest (A3's q-d15.glass: 12352 once,
# glass_found 113302; then its else text) and the nest's hoard, saves and loads (the rocks stay broken), and goes back
# down by the rock steps, the still gallery and the perch hall to the mouth. Numbers are ids.lock.yml's: events (click),
# chest events (loot_chest), map variables (state_dump_map_var), destructibles (console). The exit to D4 is
# playtest_exit.yml's.
id: xeen.dd23.l4.walk
title: Gargoyle Lair (DD-23 L4), the mouth to the roost and the nest, down by the rock steps
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_dd23.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 35, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 35, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 35, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 35, skills: [], equipment: {}}
  - assert: {map: xeen_dd23.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - assert: {party_position: {x: 0, y: 256, radius: 64, z_min: -8, z_max: 8}}
  - advance_runtime: {seconds: 3}
  - assert: {state_dump_map_var: {index: 0, value: 1}}
  - play_lua: {source: "close()"}
  # Up the guano slope; its three gargoyles.
  - walk_to: {x: 0, y: 700, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 0, y: 1200, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  # The bone ledge: the climber's bones and his pack.
  - walk_to: {x: -200, y: 1536, z: 0, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -600, y: 1536, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 1500}
  - assert: {state_dump_map_var: {index: 1, value: 1}}
  - walk_to: {x: -880, y: 1680, z: 0, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        local g = gold()
        for _ = 1, 3 do
          loot_chest(3)
          if held() ~= 0 then stow() end
          if gold() >= g + 600 then return end
        end
        error("the climber's pack held no gold")
  # The perch hall: its perches and the Sentinel.
  - walk_to: {x: -200, y: 1536, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 0, y: 2100, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 0, y: 2600, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - assert: {state_dump_map_var: {index: 4, value: 1}}
  # Up the rock ramp behind the west wall to the upper perches.
  - walk_to: {x: -650, y: 2496, z: 0, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1088, y: 2560, z: 0, z_tolerance: 40, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1088, y: 3168, z: 320, z_tolerance: 120, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1088, y: 3800, z: 640, z_tolerance: 60, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -600, y: 3776, z: 640, z_tolerance: 20, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - assert: {party_position: {x: -600, y: 3776, radius: 100, z_min: 632, z_max: 648}}
  # The ledge walk to the roost.
  - walk_to: {x: 320, y: 3776, z: 640, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 320, y: 4672, z: 640, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: 800, y: 4672, z: 640, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3500}
  - assert: {state_dump_map_var: {index: 5, value: 1}}
  - play_lua: {source: "close()"}
  # The roosting rocks: a click pounds all five to powder (A3's q-d15.roost; no Yes/No since F47).
  - walk_to: {x: 1000, y: 4920, z: 640, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(19); wait(0.5)"}
  - advance_runtime: {seconds: 1}
  - assert: {dialog: {active: true, text_contains: "pound roosting rocks to powder"}}
  - play_lua: {source: "close(); if not qbit(113301) then error('lair_destroyed 113301 not set') end"}
  - console: {line: destructible 1 state, expect_contains: broken}
  - console: {line: destructible 2 state, expect_contains: broken}
  - console: {line: destructible 3 state, expect_contains: broken}
  - console: {line: destructible 4 state, expect_contains: broken}
  - console: {line: destructible 5 state, expect_contains: broken}
  # A rock's worn foot afterwards: A3's else text, no question.
  - play_lua: {source: "click(10); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "Rock dust"}}
  - play_lua: {source: "close()"}
  # The nest: Caleb's glass once (A3's q-d15.glass), then its else text; the hoard.
  - walk_to: {x: 1408, y: 5700, z: 640, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1408, y: 6080, z: 640, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - assert: {state_dump_map_var: {index: 3, value: 1}}
  - play_lua: {source: "close(); click(12); wait(1)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[scratched on the handle]], 1, true) then error("status line: " .. s) end
  - play_lua:
      source: |
        close()
        if held() ~= 0 then stow() end
        if item_count(12352) ~= 1 then error("no Caleb's glass: " .. pack_items()) end
        if not qbit(113302) then error("glass_found 113302 not set") end
  - play_lua: {source: "click(12); wait(1)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[Spoons, buckles, broken mirrors.]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "close(); if held() ~= 0 then stow() end; if item_count(12352) ~= 1 then error('the glass was given twice') end"}
  - walk_to: {x: 1590, y: 6130, z: 640, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        local g = gold()
        for _ = 1, 3 do
          loot_chest(4)
          if held() ~= 0 then stow() end
          if gold() >= g + 1000 then return end
        end
        error("the nest's hoard held no gold")
  - play_lua: {source: "close(); wait(0.5); close()"}
  # A save and load: the rocks stay broken.
  - reload: {}
  - play_lua: {source: "wait(2); close()"}
  - console: {line: destructible 1 state, expect_contains: broken}
  - console: {line: destructible 3 state, expect_contains: broken}
  - console: {line: destructible 5 state, expect_contains: broken}
  - play_lua: {source: "if not qbit(113301) then error('lair_destroyed lost on reload') end"}
  # Down by the rock steps, the still gallery and the perch hall to the mouth (the loop).
  - walk_to: {x: 1408, y: 5700, z: 640, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1536, y: 4600, z: 640, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1536, y: 3900, z: 360, z_tolerance: 160, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1536, y: 3400, z: 0, z_tolerance: 48, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1536, y: 3050, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - assert: {state_dump_map_var: {index: 2, value: 1}}
  - walk_to: {x: 900, y: 2752, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 0, y: 2700, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 0, y: 1500, z: 0, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 0, y: 300, z: 0, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - assert: {party_position: {x: 0, y: 300, radius: 100, z_min: -8, z_max: 8}}
