# Playtest of Newcastle Keep (XD-13, L4; lane A7, agent:xeen-a7-xd13): every stage from the party's first visit to the
# sword. Stage 0 (the ruin): the arrival line, the closed house doors with A4's closed texts, the hall's woodpile and
# rubble, syllables 1-3 (la, bo, ra), the larder, the statue's plaque, the dry well, the stair's rubble, the drop through
# the hall's broken floor into the foundation pit, the strongbox, the rubble ramp up into the pantry. Stage 2 (m11.keep
# 111221 set by console, as Emerson's topic would; a save and load): the wood golems hidden, the hole floored over, the
# ramp walled up, the smithy and the training hall open. Stage 3 (m22.dungeon 111441): the stage-3 monsters shown, the
# stair cleared, the chapel and the counting room open, YOUR well, down past the flooded cellar (syllable 4) and the
# laboratory (syllable 5, notebooks, chest) to the vault door: a wrong word, then 'laboratory', the sword (A3's
# m23.sword), the vault's hoard; the vault stays open after a reload. Numbers are ids.lock.yml's (events, doors).
id: xeen.xd13.l4.walk
title: Newcastle Keep (XD-13 L4), stage 0 ruin, stage 2 keep, stage 3 dungeon and the sword
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_xd13.blv
      party:
        gold: 0
        food: 2
        members:
          - {name: Brokk, class: Knight, level: 15, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 15, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 15, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 15, skills: [], equipment: {}}
  - assert: {map: xeen_xd13.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - setup_shortcut: {kind: set_qbit, id: 111160, value: true}
  - assert: {party_position: {x: 0, y: 320, radius: 64, z_min: -8, z_max: 8}}
  # The stage-0 arrival line (a one-shot timer) and the stages' actors: wood golems shown, the stage-3 monsters hidden.
  - play_lua: {source: "wait(3)"}
  - assert: {state_dump_map_var: {index: 2, value: 1}}
  - play_lua: {source: "close()"}
  # Actor indices follow objects.yml's monsters (sorted by id): 0-5 the cellar's swamp things, 6-9 the court's golems,
  # 10-15 the hall's, 16-17 the laboratory's iron golems, 18-22 the pit's golems, 23-24 the vault door's iron golems.
  - assert: {actor_visible: {actor_index: 10, hidden: false}}
  - assert: {actor_visible: {actor_index: 18, hidden: false}}
  - assert: {actor_visible: {actor_index: 0, hidden: true}}
  - assert: {actor_visible: {actor_index: 23, hidden: true}}
  # The smithy's door by the gate: A4's closed text before the keep.
  - walk_to: {x: -250, y: 384, z: 0, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "click(29); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "SMITHY (KEEP)"}}
  - play_lua: {source: "close()"}
  # The great hall: its golems, the woodpile, the first syllable on the north wall.
  - walk_to: {x: 0, y: 1100, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1300, close_dialogs: true}
  - clear_hostiles: {radius: 1300}
  - walk_to: {x: -400, y: 2700, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1300, close_dialogs: true}
  - clear_hostiles: {radius: 1500}
  - play_lua: {source: "click(42); wait(1); log('woodpile: ' .. status())"}
  - walk_to: {x: 0, y: 2850, z: 0, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(15); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "1: la"}}
  - play_lua: {source: "close()"}
  # The pantry: the larder fills the packs; syllable 2 under a sack.
  # Merge point 33 keeps clears to the party's storey: a pit golem can climb the rubble ramp into the pantry.
  - walk_to: {x: -1000, y: 2816, z: 0, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "open_door(18, 2)"}
  - walk_to: {x: -2048, y: 3000, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(16); wait(0.5)"}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 1}
  - assert: {food: 20}
  - walk_to: {x: -2600, y: 3080, z: 0, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(4); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "2: bo"}}
  - play_lua: {source: "close()"}
  # The statue court: the plaque, syllable 3 by the stair, the dry well, the three closed house doors.
  - walk_to: {x: -1000, y: 2816, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 600, y: 1728, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1800, y: 1728, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - play_lua: {source: "click(34); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "Built in honor of Great Adventurers."}}
  - play_lua: {source: "close()"}
  - walk_to: {x: 2176, y: 1050, z: 0, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(20); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "3: ra"}}
  - play_lua: {source: "close()"}
  - walk_to: {x: 2500, y: 1216, z: 0, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(40); wait(1); local s = status(); log('well: ' .. s); if not string.find(s, 'Dry', 1, true) then error('the well is not dry at stage 0: ' .. s) end"}
  - walk_to: {x: 2900, y: 1856, z: 0, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(37); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "TRAINING (KEEP)"}}
  - play_lua: {source: "close()"}
  - walk_to: {x: 2176, y: 2350, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(7); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "CHAPEL (DUNGEON STAGE"}}
  - play_lua: {source: "close(); click(11); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "BANK (DUNGEON STAGE)"}}
  - play_lua: {source: "close()"}
  # The dungeon stair is choked with rubble (aaze0073:7).
  - walk_to: {x: 2528, y: 1000, z: 0, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 2528, y: 380, z: -100, z_tolerance: 60, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(33); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "blocked with rubble"}}
  - play_lua: {source: "close(); if door_state(4) ~= 'closed' then error('the stair rubble is open at stage 0') end"}
  # Down through the hall's broken floor into the foundation pit; its golems; the strongbox; up the rubble ramp.
  - walk_to: {x: 2528, y: 1000, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 600, y: 1728, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -400, y: 1600, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -704, y: 1600, z: -640, z_tolerance: 60, radius: 96, timeout_seconds: 30, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: -1450, y: 1880, z: -640, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - play_lua: {source: "loot_chest(9); close()"}
  - play_lua: {source: "click(5); wait(1); log('bones: ' .. status())"}
  - walk_to: {x: -1600, y: 1408, z: -640, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -2560, y: 1408, z: -384, z_tolerance: 60, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -2560, y: 2350, z: 0, z_tolerance: 60, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -2560, y: 2750, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1000, y: 2816, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  # Stage 2: the keep (Emerson's topic sets m9.walls and m11.keep); the next entry is a save and load.
  - console: {line: "qbit set 111181"}
  - console: {line: "qbit set 111221"}
  - reload: {}
  - assert: {actor_visible: {actor_index: 6, hidden: true}}
  - assert: {actor_visible: {actor_index: 18, hidden: true}}
  - assert: {actor_visible: {actor_index: 0, hidden: true}}
  - play_lua: {source: "wait(3); if door_state(1) ~= 'open' then error('the pit lift did not rise: ' .. door_state(1)) end; if door_state(3) ~= 'closed' then error('the ramp is not walled up: ' .. door_state(3)) end"}
  - play_lua: {source: "close()"}
  # The hole is floored over: the party walks across it.
  - walk_to: {x: -400, y: 1600, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -704, y: 1600, z: 0, z_tolerance: 24, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1000, y: 1600, z: 0, z_tolerance: 24, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - advance_runtime: {seconds: 1}
  - assert: {party_position: {x: -1000, y: 1600, radius: 96, z_min: -16, z_max: 16}}
  # The smithy and the training hall open (A4's houses 4141, 4142).
  - walk_to: {x: 0, y: 1100, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -250, y: 384, z: 0, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(29); wait(1)"}
  - assert: {dialog: {active: true}}
  - play_lua: {source: "for i = 1, 3 do if not close() then break end wait(1) end"}
  - walk_to: {x: 0, y: 1100, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 1800, y: 1728, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 2900, y: 1856, z: 0, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(37); wait(1)"}
  - assert: {dialog: {active: true}}
  - play_lua: {source: "for i = 1, 3 do if not close() then break end wait(1) end"}
  # Stage 3: the dungeon (Artemus's permit and Emerson's dig set m22.dungeon and m23.started).
  - console: {line: "qbit set 111441"}
  - console: {line: "qbit set 111460"}
  - reload: {}
  - assert: {actor_visible: {actor_index: 0, hidden: false}}
  - assert: {actor_visible: {actor_index: 16, hidden: false}}
  - assert: {actor_visible: {actor_index: 24, hidden: false}}
  - play_lua: {source: "wait(3); close(); if door_state(4) ~= 'open' then error('the stair rubble is not cleared: ' .. door_state(4)) end"}
  # The chapel and the counting room (A4's houses 4143, 4144).
  - walk_to: {x: 2176, y: 2350, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(7); wait(1)"}
  - assert: {dialog: {active: true}}
  - play_lua: {source: "for i = 1, 3 do if not close() then break end wait(1) end"}
  - play_lua: {source: "click(11); wait(1)"}
  - assert: {dialog: {active: true}}
  - play_lua: {source: "for i = 1, 3 do if not close() then break end wait(1) end"}
  # YOUR well: +20 armour class until rest (D-4).
  - walk_to: {x: 2500, y: 1216, z: 0, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(40); wait(1)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[cool and refreshing]], 1, true) then error("status line: " .. s) end
  # Down the dug-out stair into the flooded cellar: swamp things; syllable 4 on the shelf.
  - walk_to: {x: 2528, y: 1000, z: 0, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 2528, y: 380, z: -100, z_tolerance: 60, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 2528, y: -850, z: -580, z_tolerance: 80, radius: 96, timeout_seconds: 40, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 2528, y: -1350, z: -640, z_tolerance: 60, radius: 64, timeout_seconds: 40, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: 3100, y: -1400, z: -640, radius: 64, timeout_seconds: 40, clear_hostiles: 2500, close_dialogs: true}
  - walk_to: {x: 3100, y: -1856, z: -640, radius: 48, timeout_seconds: 40, close_dialogs: true}
  - play_lua: {source: "click(36); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "4: to"}}
  - play_lua: {source: "close()"}
  # The old laboratory: its golems, the notebooks, the locker, syllable 5.
  - walk_to: {x: 1950, y: -1300, z: -640, radius: 64, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 1450, y: -1920, z: -640, radius: 64, timeout_seconds: 40, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: 960, y: -2250, z: -640, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(17); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "notebooks"}}
  - play_lua: {source: "close()"}
  - walk_to: {x: 1450, y: -1450, z: -640, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "loot_chest(8); close()"}
  - walk_to: {x: 420, y: -1472, z: -640, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(24); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "5: ry"}}
  - play_lua: {source: "close()"}
  # The vault door: a wrong word, then 'laboratory'.
  - walk_to: {x: 400, y: -1920, z: -640, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: -450, y: -1920, z: -640, radius: 48, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - play_lua: {source: "click(38); wait(0.5)"}
  - answer_input: {text: "sword"}
  - advance_runtime: {seconds: 1}
  - play_lua: {source: "close(); log('wrong word: ' .. status()); if qbit(111461) then error('a wrong word opened the vault') end; if door_state(5) ~= 'closed' then error('the vault door moved') end"}
  - play_lua: {source: "click(38); wait(0.5)"}
  - answer_input: {text: "Laboratory"}
  - advance_runtime: {seconds: 1}
  - assert: {dialog: {active: true, text_contains: "The humming stops."}}
  - play_lua: {source: "close(); wait(6); if not qbit(111461) then error('vault_opened not set') end; if door_state(5) ~= 'open' then error('the vault door did not open: ' .. door_state(5)) end"}
  # The sword vault: the pedestal, the sword's box on the rack (a chest, D-90; A3's m23.sword), the hoard.
  - walk_to: {x: -1000, y: -1920, z: -640, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1216, y: -1680, z: -640, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "loot_chest(35); wait(1)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[XEEN SLAYER]], 1, true) then error("status line: " .. s) end
  - play_lua:
      source: |
        close()
        if held() ~= 0 then stow() end
        if item_count(12500) ~= 1 then error("no Xeen Slayer Sword: " .. pack_items()) end
        if not qbit(111462) then error("m23.done not set") end
        loot_chest(35); wait(1); close()
        if held() ~= 0 then stow() end
        if item_count(12500) ~= 1 then error("the sword was given twice") end
        click(19); wait(1); log("pedestal: " .. status())
  - walk_to: {x: -1450, y: -2250, z: -640, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "loot_chest(10); close()"}
  # The next entry: the vault stays open.
  - reload: {}
  - play_lua: {source: "wait(2); close(); if door_state(5) ~= 'open' then error('the vault shut again after a reload') end; if item_count(12500) ~= 1 then error('the sword was lost') end"}
