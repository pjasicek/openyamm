format: 0
level: L2
pitch: "The Darkside's south-east corner: a sandstone merchant city at the desert's edge under the last Gemstone crags, the open market where six roads meet, and south of them the Aging Forest, whose red and gold leaves fall all year. The River of Wrath bursts from a cave in the eastern hills, runs south in its cut and turns east to fall off the edge of the world; above the east rim stands the glow of the bright face. Venom Pond lies in the fen of the south-east, and on a knoll at the very edge the Great Eastern Tower."
purpose: "Act III's town map (party 27-30): Sandcaster behind its pass (Q-D8: the emerald handle in the ruin, the gate), Natasha's bridle (M25), Astra's quarter (Q-D14, DD-19, Act IV), Barticus' Gym and the sewer (DD-18), Thaddeus and the Fountain of Youth (Q-D18 with the Eastern Tower DD-07, Act IV; Q-D19), Caleb at the Crossroads (Q-D15), Celia and Derek (Q-C22), Cornelius, the skill schools, training to 80, Lucio's Jetty after M30."
mood: "Warm sandstone and dusty olive scrub under the amber Darkside sky; a busy market; the Aging Forest's red-gold leaves falling in still air; the hiss of the fen; the river's roar at the falls and the pale glow beyond the rim."
datum: water:rim_sea
