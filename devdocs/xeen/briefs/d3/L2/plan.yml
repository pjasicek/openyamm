states:
  - id: state:cottage_shut
    condition: {not: {qbit: celia_moved}}
    locks: [building:celia_derek_cottage]
    notes: "A3's q-c22.cottage: the door refuses until q-c22.done, then moves Celia (4041) and Derek (4046) in and sets q-c22.moved."
  - id: state:fountain_venom
    condition: {not: {qbit: fountain_restored}}
    atmosphere: "The Fountain of Youth runs green; the jewel socket on its spout is empty."
  - id: state:gates_shut
    condition: {not: {any: [{item: sandcaster_pass}]}}
    locks: [entrance:south_gate, entrance:east_gate]
    atmosphere: "Guards in the gate arches; A3's fail text \"The gate guards want a pass. Wizards' orders.\""
    notes: "From inside (Town Portal, the mirror) the gates always open."
  - id: state:jetty_closed
    condition: {not: {qbit: lucio_open}}
    locks: [building:sc_lucio_jetty]
    atmosphere: "A jetty that ends in thin air. A sign: \"Celestial boats. Chosen Ones only.\" (A4's closed text)"
  - id: state:jetty_open
    condition: {qbit: lucio_open}
    opens: [building:sc_lucio_jetty]
    effects: ["Lucio's boat at the jetty's end twice a week (tue, fri); it departs only (D-28)."]
  - id: state:quarter_open
    condition: {qbit: quarter_open}
    opens: [building:wq_guild_dark, building:wq_magic, building:wq_houses]
  - id: state:quarter_sealed
    condition: {not: {qbit: quarter_open}}
    locks: [building:wq_guild_dark, building:wq_magic, building:wq_houses]
    atmosphere: "Wizard locks glowing on the doors; A4's closed texts (\"The wizards are sensitive to insults; best not to knock twice.\")."
landform:
  relief: "A dry valley (1,300) from D2 under Sandcaster's terrace (1,500, the quarter 1,700) and the last Gemstone crags (to 3,400); dunes to 1,900 north of the city and the west-bank hills (2,400) over the river's gorge; the Crossroads plain (1,250); east of the river the broken Wrath crest (3,100-3,400) with the Lakeside saddle (1,850) on the D4 road; the Howling ridge (1,900-2,200) in the south-west; the Aging Forest and the fen falling to 864 at Venom Pond; the rim cliff along the east and south. D-28: the range inside the playable box is about 2,500 (864-3,400)."
  height_range: [864, 3400]
  water: "The River of Wrath (about 2.5 cells wide, 80 cells long, in a cut 300-700 deep above the bridge), Venom Pond (about 100 cells)."
  water_share: 0.03
  caps:
    - {kind: bare rock, share: 0.06, where: "the crags, the river's cut, the rim cliffs"}
    - {kind: sand, share: 0.12, where: the desert edge and the caravan valley}
  rim: {notes: "The world rim along the whole east (x 104) and south (y 104): a cliff of about 1,000 down to the stars; the River of Wrath falls over it at y 64. West and north the land runs to the map edge; the roads run out to it."}
atmosphere: "Sky xeendark1 (xeen_darkside_day; A3's Lua switches to xeendark2/3 at M17/M27); no weather; music 39. Market bustle and camels at the Crossroads; wind in the scrub; the Howling Woods' stone moaning; leaves and insects in the Aging Forest (falling leaves: a particle gap, MU-2); frogs and hiss at Venom Pond; the falls' roar near the rim."
notes: "Written by output/studio_cal/d3/tools/gen.py from gen_l1.py (the approved L1 with D-28). Sealed until their maps exist: D4 (north edge), DD-18, DD-19, DD-07."
