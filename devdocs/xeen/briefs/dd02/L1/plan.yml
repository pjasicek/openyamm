format: 0
level: L1
pitch: 'Ellinger, the Queen''s wizard, locked himself in his tower inside Castleview''s walls when Alamar took the throne.
  The door asks a question of conscience; any honest answer passes, and ''I just don''t know'' puts the party back in the
  street. Above, the gauntlet: a hall of wards with Ellinger''s constructs, bats, a library whose gargoyle bookends wake,
  a floor of tapestries hiding buttons and back stairs, a loft of beholder bats and a trapped walk round the outer wall. At
  the top a door asks whom you seek. Ellinger explains the Energy Disks; after that a lift runs from his study to the ground
  floor, so the disks come to him without the climb.'
purpose: 'M17 Ellinger''s Tower (D1): the question, the gauntlet, the password, Ellinger; M18''s list; the study is where
  Ellinger takes the disks (M19, M26). Party 20-22; band 14-24; 50 monsters; treasure 2, the boot closet 3. About 25 minutes.'
mood: A scholar's tower of rose and white marble, lamplit; dusty tapestries, wind at broken windows, bats under the roof.
