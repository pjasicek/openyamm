  - walk_to: {x: 1264, y: 2432, z: 1920, z_tolerance: 60, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 500, y: 2432, z: 1920, radius: 64, timeout_seconds: 30, close_dialogs: true}
  # The last door: a wrong answer ("Begone!"), then "Ellinger" ("You may pass!").
  - walk_to: {x: 250, y: 2464, z: 1920, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "if door_state(8) ~= 'closed' then error('the last door does not start shut') end; click(19); wait(0.5)"}
  - answer_input: {text: "Alamar"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Begone!"}}
  - play_lua: {source: "close(); wait(1); if door_state(8) ~= 'closed' then error('a wrong answer opened the last door') end; if qbit(111341) then error('password set by a wrong answer') end"}
  - play_lua: {source: "click(19); wait(0.5)"}
  - answer_input: {text: "Ellinger"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "You may pass!"}}
  - play_lua: {source: "close(); wait(1.5); if not qbit(111341) then error('password not set') end; if door_state(8) ~= 'open' then error('the last door did not open: ' .. door_state(8)) end"}
  # The study: the lift refused before Ellinger has spoken; Ellinger with the orb (m17.done).
  - walk_to: {x: -300, y: 2464, z: 1920, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -768, y: 2400, z: 1920, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -768, y: 2080, z: 1920, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "click(6); wait(0.5)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "The lift does not move"}}
  - play_lua: {source: "close(); if door_state(1) ~= 'closed' then error('the cage moved before Ellinger spoke') end"}
  - assert: {actor_count: {monster_id: 11901, hostile: false, min: 1, max: 1}}
  - grant_item: {item_id: 12331, member_index: 0}
  - walk_to: {x: -704, y: 3050, z: 1920, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "click(15); wait(0.5)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - select_topic: {action_id: 40851, match_label: "Quest"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Dragon Pharaoh's orb"}}
  - play_lua: {source: "close(); wait(0.5); close(); if not qbit(111342) then error('m17.done not set') end"}
  # The Book o' Boots and Ellinger's list (m18.sources_note, after M17).
  - play_lua: {source: "click(4); wait(0.5)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Boots of Paradise"}}
  - play_lua: {source: "close(); click(28); wait(0.5)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "A list in Ellinger's hand"}}
  - play_lua: {source: "close()"}
  # The boot closet's chest.
  - walk_to: {x: -448, y: 3600, z: 1920, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "click(10); wait(1.5)"}
  - walk_to: {x: -448, y: 4000, z: 1920, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -96, y: 4120, z: 1920, radius: 48, timeout_seconds: 20, close_dialogs: true}
