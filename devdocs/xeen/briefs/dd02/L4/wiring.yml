  - id: evt:ellinger
    preset: script
    source: platform:desk
    title: Ellinger
    lua: evt.SpeakNPC(4954)
    notes: "Ellinger (NPC 4954; A3's topics: Alamar, m17.done with the orb): the studio cannot give a placed indoor monster its NPC (Words needed), so his desk speaks for him, as DD-04's throne."
  - id: evt:enter
    preset: text
    trigger: load
    text: Ellinger's Tower.
    notes: "Every entry: a status line."
  - id: evt:exit
    preset: exit
    source: exit:d1
    title: Exit Ellinger's Tower
    notes: "Out to D1 in front of the tower door (exit:d1_tower): the game's own window (D-24); the source's 'Exit Ellinger's Tower?' (aaze0053:0) is the title."
  - id: evt:mirror
    preset: text
    source: panel:mirror
    title: Mirror
    condition: {qbit: m26_stage4}
    else_effects:
      - text: The mirror does not respond.
    text: "The mirror shows Ellinger's study, and a small sign: 'Private. Use the one in the square.'"
    notes: "The dead mirror (D-26: flavour, no prompt): 'The mirror does not respond.' (aaze0053:11) before m26.stage4 (111522), the sign after."
  - id: evt:pass
    preset: door
    source: door:pass
    question: {ask: "Answer?", answers: [Ellinger], message: "Who do you seek?", wrong_effects: [{lua: "XeenQuests.hook(\"m17.password_wrong\")"}]}
    side: room:pass_door
    title: Door
    effects:
      - lua: "XeenQuests.hook(\"m17.password\")"
    notes: "The last door (aaze0056:0-3): 'Who do you seek?'; Ellinger: m17.password ('You may pass!', the qbit once) and the door opens; any other answer: m17.password_wrong ('Begone!')."
  - id: evt:pass_back
    preset: door
    source: door:pass
    side: room:study
    title: Door
  - id: evt:question
    preset: door
    source: door:question
    side: room:question
    title: Door
    condition: {qbit: question_passed}
    else_effects:
      - lua: |-
          if continueStep == 1 or continueStep == 2 then
              XeenQuests.hook("m17.question_right")
              return
          end
          if continueStep == 3 then
              XeenQuests.hook("m17.question_wrong")
              AskChoiceWithAnswerSteps(eventId, 5, "Begone!", {{Answer = "Leave the tower", Step = 5}})
              return
          end
          if continueStep == 5 then
              evt.MoveToMap(2560, 9216, 1152, 0, 0, 0, 0, 0, "xeen_d1.odm", {direct = true})
              return
          end
          if continueStep ~= nil then
              return
          end
          XeenQuests.hook("m17.question")
          AskChoiceWithAnswerSteps(eventId, 4, "Answer the question:", {{Answer = "Let him take up his sword", Step = 1}, {Answer = "Cut him down", Step = 2}, {Answer = "I just don't know", Step = 3}})
    notes: "m17.question: the door asks (A3's text, the three answers as buttons); 1 or 2: m17.question_right (question_passed; evt:question_open opens the door), 3: m17.question_wrong and the party is put out on D1 in front of the tower door. Once passed, a plain door."
  - id: evt:question_back
    preset: door
    source: door:question
    side: room:stair1f
    title: Door
  - id: evt:question_open
    preset: text
    trigger: timer
    every: 1
    condition: {qbit: question_passed}
    opens: [door:question]
    once: true
    text: The stair door swings open.
    notes: The door opens once the question is answered (question_passed set by m17.question_right).
  - id: evt:reading_table
