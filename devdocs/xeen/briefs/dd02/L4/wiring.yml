format: 0
events:
  - id: evt:arrive
    preset: script
    trigger: timer
    every: 1
    condition: {not: {qbit: arrived_once}}
    once: true
    effects:
      - message: "ELLINGER'S TOWER. The Queen's wizard locked himself in with his defences when Alamar took the throne. Madame Oorla said the orb must see him first, and that at the top the tower asks whom you seek. Somewhere above, bats are stirring."
      - qbit: arrived_once
    notes: "Why the party is here (M17), on the first arrival only (arrived_once 117080)."
  - id: evt:book_elec
    preset: script
    source: platform:lectern_elec
    title: Book of Electricity
    condition: {not: {player_bit: 11314}}
    effects:
      - add:
          var: AirResistance
          value: 5
      - player_bit: 11314
      - text: BOOK OF ELECTRICITY. +5 Elec. (permanent).
    else_effects:
      - text: You learn nothing more from the book.
    notes: "The library's Book of Electricity (aaze0054): +5 Air resistance once per character (player bit 11314; the source's +20 rescaled, the graph)."
  - id: evt:book_fire
    preset: script
    source: platform:lectern_fire
    title: Book of Fire
    condition: {not: {player_bit: 11313}}
    effects:
      - add:
          var: FireResistance
          value: 5
      - player_bit: 11313
      - text: BOOK OF FIRE. +5 Fire (permanent).
    else_effects:
      - text: You learn nothing more from the book.
    notes: "The library's Book of Fire (aaze0054): +5 Fire resistance once per character (player bit 11313; the source's +20 rescaled, the graph)."
  - id: evt:book_of_boots
    preset: script
    source: platform:boot_rack
    title: Book o' Boots
    lua: "XeenQuests.hook(\"m17.book_of_boots\")"
    notes: m17.book_of_boots (aaze0056:8-9) on the boot rack by the desk.
  - id: evt:call_foot
    preset: switch
    source: switch:call_foot
    title: Call the lift
    condition: {lua: "XeenQuests.can(\"m17.tower_lift\")"}
    opens: [door:gate_foot]
    closes: [lift:cage, door:gate_top]
    effects:
      - lua: "evt.PlaySoundName(\"xeen_lift\", -768, 1600, 960)"
    else_effects:
      - lua: "XeenQuests.hook(\"m17.tower_lift\")"
    text: The cage rattles down the shaft.
  - id: evt:call_top
    preset: switch
    source: switch:call_top
    title: Call the lift
    condition: {lua: "XeenQuests.can(\"m17.tower_lift\")"}
    opens: [lift:cage, door:gate_top]
    closes: [door:gate_foot]
    effects:
      - lua: "evt.PlaySoundName(\"xeen_lift\", -768, 1600, 960)"
    else_effects:
      - lua: "XeenQuests.hook(\"m17.tower_lift\")"
    text: The cage climbs the shaft to you.
  - id: evt:charts
    preset: text
    source: platform:charts
    title: Star charts
    text: "Star charts of the Darkside's sky, the sun's path drawn in red and crossed out twice."
    window: false
