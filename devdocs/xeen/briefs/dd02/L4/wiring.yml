    condition: {lua: "XeenQuests.can(\"m17.tower_lift\")"}
    opens: [door:gate_foot]
    closes: [lift:cage, door:gate_top]
    effects:
      - lua: "evt.PlaySoundName(\"xeen_lift\", -768, 1600, 960)"
    else_effects:
      - lua: "XeenQuests.hook(\"m17.tower_lift\")"
    text: The cage sinks to the ground floor.
  - id: evt:ride_up
    preset: switch
    source: switch:ride_up
    title: "Lift: up"
    condition: {lua: "XeenQuests.can(\"m17.tower_lift\")"}
    opens: [lift:cage, door:gate_top]
    closes: [door:gate_foot]
    effects:
      - lua: "evt.PlaySoundName(\"xeen_lift\", -768, 1600, 960)"
    else_effects:
      - lua: "XeenQuests.hook(\"m17.tower_lift\")"
    text: The cage climbs the shaft to Ellinger's study.
  - id: evt:sorcerer_book
    preset: script
    source: platform:lectern_sorc
    title: Book of Sorcerer's Knowledge
    lua: |-
      if IsPlayerBitSet(PlayerBit(11312)) then
          XeenQuests.hook("m17.sorcerer_book_again")
          return
      end
      if IsAtLeast(ActualIntellect, 20) then
          AddValue(BaseIntellect, 2)
          SetPlayerBit(PlayerBit(11312))
          XeenQuests.hook("m17.sorcerer_book")
          return
      end
      local hp = 0
      for v = 10, 5000, 10 do
          if not IsAtLeast(HP, v) then break end
          hp = v
      end
      evt.DamagePlayer(Players.Current, const.Damage.Physical, math.max(5, hp // 10))
      XeenQuests.hook("m17.sorcerer_book_hurt")
    notes: "D-26: the clicking member's current Intellect 20 or more: +2 Intellect (base) once per character (player bit 11312) and m17.sorcerer_book; again: m17.sorcerer_book_again; below 20: about a tenth of that member's present hit points (counted in tens: the scripts read no maximum) and m17.sorcerer_book_hurt, nothing used up."
  - id: evt:sources
