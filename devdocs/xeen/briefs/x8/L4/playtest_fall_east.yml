# The east zone's fall: off the Witch landing's east edge, no immortality; A3's Xeen.skyFall sets the
# party 850 over X1's ground by the Witch Tower and the engine's fall damage takes about a third of each
# member's hit points (D-6.2), none dies.
id: xeen.x8.l4.fall_east
title: 'Cloudreach (X8): a fall off the Witch Clouds lands on X1 by the Witch Tower and costs hit points (D-6.2, D-6.4)'
world: xeen
mode: faithful
steps:
