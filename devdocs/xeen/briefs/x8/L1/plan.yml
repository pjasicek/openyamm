format: 0
level: L1
pitch: "Walkable clouds high over Cloudside, two archipelagos and a long rope bridge between them. East, over Vertigo, the Witch Clouds: harpy nests on ragged spires, the Harpy Queen's eyrie, the explorer's statue on the highest rock, the offering statues. West, over the lagoon, the High Magic Clouds: a sorcerer's observatory, rhyming statues, flying feet and guardians, and on the high cloud two cloud golems no party of this age should wake. Below, through gaps, the land."
purpose: "Act II's sky map (party 18-20): reached one way up from the Witch Tower's roof (XD-04) and the Tower of High Magic's Stairway to Heaven (XD-11); left only by falling. The three rhyming statues tell the main quest's next steps (QUESTS M10-M21 hints, the source's rhymes); the explorer's statue and the offering statues reward Crusaders."
mood: "Airy, bright and vertiginous: high sun, the cloud sea below, wind in the ropes, harpies' cries."
datum: room:witch_landing
spaces:
  # ---- the Witch Clouds (east, over X1) ----
  - id: room:witch_landing
    name: The Witch Clouds' landing
    kind: room
    at: [14336, -6144]
    extent: [4608, 3584]
    shape: "a broad flat cloud, the stair's head on its south rim"
    floor: 0
    purpose: "Arrival from the Witch Tower's roof: a cloud-stone stair rising out of the cloud sea."
    population:
      - {id: pop:landing_harpies, actor: "11520", groups: 2, placed: true, hostile: true, notes: "Four Harpies (14)."}
  - id: room:offering_terrace
    name: The offering terrace
    kind: room
    at: [8192, -1024]
    extent: [4096, 3584]
    shape: "a terrace stepped twice, the long bridge's east head on its west edge"
    floor: 128
    purpose: "Two offering statues; the long rope bridge leaves west from here."
    population:
      - {id: pop:terrace_harpies, actor: "11521", groups: 2, placed: true, hostile: true, notes: "Five: Harpies and Harpy Hags (14, 18)."}
  - id: room:nest_spires
    name: The nest spires
    kind: room
    at: [16384, 4096]
    extent: [4096, 4608]
