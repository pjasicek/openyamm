    floor: 256
    purpose: "Two harpy nests to burn."
    population:
      - {id: pop:nest_harpies, actor: "11521", groups: 3, placed: true, hostile: true, notes: "Eight: Harpies and Hags."}
    treasure:
      - {kind: decoration, count: 2, notes: "nests: bones and stolen trinkets"}
  - id: room:queens_eyrie
    name: The Harpy Queen's eyrie
    kind: room
    at: [11264, 10240]
    extent: [4608, 4096]
    shape: "a high cloud ringed with broken rock, the great nest in its middle"
    floor: 640
    purpose: "The Harpy Queen's nest: the queen and her court; the hoard."
    population:
      - {id: pop:queens_court, actor: "11521", groups: 2, placed: true, hostile: true, notes: "Six Hags."}
      - {id: pop:queen, actor: "11522", groups: 1, placed: true, hostile: true, notes: "The Harpy Queen (24), with A2's boss modifiers if any."}
    treasure:
      - {kind: chest, count: 1, tier: 4, notes: "the queen's hoard"}
  - id: room:explorers_rock
    name: The explorer's rock
    kind: room
    at: [17920, 13824]
    extent: [2560, 2560]
    shape: "the highest pinnacle, a flat top just big enough for the statue"
    floor: 896
    purpose: "The explorer's statue: the source's reward for climbing highest."
    population:
      - {id: pop:rock_harpies, actor: "11520", groups: 1, placed: true, hostile: true, notes: "Two Harpies."}
  - id: room:witch_perch
    name: The witch's perch
    kind: room
    at: [11264, -12288]
    extent: [3072, 2560]
    floor: -128
    purpose: "A low cloud south of the landing: the first rhyming statue and a third nest."
    population:
      - {id: pop:perch_harpies, actor: "11520", groups: 1, placed: true, hostile: true, notes: "Three Harpies."}
  # ---- the gap ----
  - id: room:half_way
    name: The half-way cloud
    kind: room
    at: [512, 1536]
    extent: [2048, 1536]
