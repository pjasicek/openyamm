  - id: evt:stage_bar
    preset: script
    trigger: load
    condition: {qbit: dorm_bar}
    lua: "-- the event opens the door"
    opens: [door:dorm_bar]
    notes: The dormitory's door stays open once its bar is lifted.
  - id: evt:stage_doors
    preset: script
    trigger: load
    condition: {qbit: password}
    lua: "-- the event opens the door"
    opens: [door:password]
    notes: The password door stays open once answered.
  - id: evt:stage_lever
    preset: script
    trigger: load
    condition: {qbit: cell_lever}
    lua: "-- the event opens the door"
    opens: [door:cell_bars]
    notes: The shut cell stays open once the lever is down.
  - id: evt:stage_peasant
    preset: script
    trigger: load
    condition: {qbit: peasant_freed}
    effects:
      - hide_actors: 30
    notes: The freed peasant stays gone on every later load (D-39 XD-14 Q4).
