  - id: evt:password
    preset: script
    source: door:password
    question: {ask: "Password:", answers: [There wolf, therewolf, There-wolf], message: "STOP!  What is the password?", wrong_effects: [{lua: "XeenQuests.hook(\"q-c8.l2_wrong\")"}]}
    side: room:west_landing
    title: Door
    condition: {not: {qbit: password}}
    opens: [door:password]
    effects:
      - lua: "XeenQuests.hook(\"q-c8.l2_door\")"
    else_effects:
      - lua: "XeenQuests.hook(\"q-c8.l2_door\")"
    notes: "state:password: the source's prompt (aaze0069:10). 'There wolf' or 'therewolf' (aaze0069:8, :16): A3's q-c8.l2_door (password 112161), the door opens and stays open; any other answer q-c8.l2_wrong (its first word the source's 'Wrong!', aaze0069:9), and the next click asks again. Once answered: the hook's else line, 'The door stands open.'"
  - id: evt:password_in
    preset: door
    source: door:password
    side: room:scroll_hall
    title: Door
    action: open
    notes: From the hall of scrolls the door simply opens.
  - id: evt:pit_ledge_1
