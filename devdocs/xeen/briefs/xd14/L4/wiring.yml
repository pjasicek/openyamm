    notes: "The source's 'Werewolf Bed' (aaze0067:0-1, aaze0068:0-1): a find once, then 'Nothing here.' (aaze0067:10)."
  - id: evt:cell_lever
    preset: switch
    source: switch:cell_lever
    title: Lever
    condition: {not: {qbit: cell_lever}}
    opens: [door:cell_bars]
    sets: {qbit: cell_lever}
    else_effects:
      - text: The lever is down. The shut cell stands open.
    text: "The lever creaks down. Out in the cell row, bars grind up into the ceiling."
    notes: "state:cell_lever (cell_lever 118001): raises the bars of the peasant's cell for good."
  - id: evt:chest_bone_pit
    preset: chest
    source: chest:bone_pit
    title: Box
  - id: evt:chest_dormitory
    preset: chest
    source: chest:dormitory
    title: Chest
  - id: evt:chest_stores
    preset: chest
    source: chest:stores
    title: Chest
  - id: evt:chest_study
    preset: chest
    source: chest:study
    title: Chest
  - id: evt:desk
    preset: chest
    source: chest:desk
    title: Chest
    effects:
      - lua: "XeenQuests.hook(\"q-c8.scroll\")"
    notes: "The writing box on the desk (D-90): the Scroll of Insight (12316) is its item; A3's q-c8.scroll (once) sets scroll_found 112162 and says so on the status line."
  - id: evt:door_battle_e
    preset: door
    source: door:battle_e
    title: Battlements
  - id: evt:door_battle_w
    preset: door
    source: door:battle_w
    title: Battlements
  - id: evt:door_cells
    preset: door
    source: door:cells
    title: Cell row
  - id: evt:door_hall
    preset: door
    source: door:hall_doors
    title: Great hall
  - id: evt:door_kennels
    preset: door
    source: door:kennels
    title: Kennels
  - id: evt:door_scriptorium
    preset: door
    source: door:scriptorium
    title: Scriptorium
  - id: evt:door_stores
    preset: door
    source: door:stores
    title: Kitchen
  - id: evt:door_study
    preset: door
    source: door:study
    title: Study
  - id: evt:door_study_roof
    preset: door
    source: door:study_roof
    title: Roof walk
  - id: evt:dorm_inside
    preset: door
    source: door:dorm_bar
    side: room:dormitory
    title: Door
    action: open
    sets: {qbit: dorm_bar}
    text: "You lift the heavy bar out of its brackets, and the door swings open onto the east landing."
    notes: "From the dormitory: the bar lifted, the door opens and stays open (the wing's loop back)."
  - id: evt:dorm_landing
    preset: door
    source: door:dorm_bar
    side: room:east_landing
    title: Door
    condition: {qbit: dorm_bar}
    locked_text: The door is barred from the other side.
    action: open
    notes: "From the east landing: barred until the bar is lifted in the dormitory (dorm_bar 118000)."
  - id: evt:dungeon_seen
    preset: text
    source: room:guard_room
    trigger: step
    once: true
    text: "The jailers' room. Somewhere along the cells a chain rattles, and someone coughs."
    seconds: 6
  - id: evt:exit_left
    preset: exit
    source: exit:gate_left
    title: Gate
    notes: "The gate's left wing: out to X6 as evt:exit_right."
  - id: evt:exit_right
    preset: exit
    source: exit:gate_right
    title: Gate
    notes: "Out to X6 on the terrace in front of the gatehouse (-13312, 15104, 2592) facing south; the game's leave window (D-24; 'Leave Castle Basenji?', aaze0068:14, is its meaning)."
  - id: evt:free_peasant
    preset: script
    source: platform:chain_post
    title: Trapped Peasant
    condition: {qbit: cell_lever, not: {qbit: peasant_freed}}
    effects:
      - lua: "XeenQuests.hook(\"q-c8.peasant_freed\")"
      - hide_actors: 30
    else_effects:
      - text: An empty chain hangs from the post.
    notes: "state:freed: once the lever has raised the bars, a click on his chain frees him (A3's q-c8.peasant_freed: 'Thank you for saving me!', 500 experience per member, peasant_freed 112164) and he is gone (group 30 hidden)."
  - id: evt:kennels_seen
    preset: text
    source: room:kennels
    trigger: step
    once: true
    text: "The kennels: iron pens round a feeding pit, the straw soiled. What sleeps here is not a dog."
    seconds: 6
  - id: evt:lectern_aging
    preset: script
