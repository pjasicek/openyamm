format: 0
variables: [find_d1, find_d2, find_k1, find_k2, find_k3]
events:
  - id: evt:arrive
    preset: script
    trigger: timer
    every: 1
    once: true
    effects:
      - message: "Castle Basenji: the wizard cult's keep on its crag over the rim. Somewhere above is Arie's master's Scroll of Insight; somewhere below, the dogs that are not dogs. The gate is the way back out."
    notes: "Why the party is here (Q-C8), once, on the first arrival."
  - id: evt:bars
    preset: script
    source: door:cell_bars
    side: room:cells
    title: Trapped Peasant
    effects:
      - lua: "XeenQuests.hook(\"q-c8.peasant\")"
    notes: "The Trapped Peasant talks through the bars at any time (A3's q-c8.peasant: 'There wolf', and the Sphinx is Golux)."
  - id: evt:battle_seen
    preset: text
    source: room:battlements
    trigger: step
    once: true
    text: "The battlement walk over the gate: the desert lies white under the sun below the crag."
    seconds: 6
  - id: evt:bed_d1
    preset: script
    source: platform:bed_d1
    title: Werewolf Bed
    condition: {map_var: {name: find_d1, equals: 0}}
    effects:
      - set:
          var:
            map_var: find_d1
          value: 1
      - gold: 260
      - text: "Under the straw: 260 gold."
    else_effects:
      - text: Nothing here.
    notes: "The source's 'Werewolf Bed' (aaze0067:0-1, aaze0068:0-1): a find once, then 'Nothing here.' (aaze0067:10)."
  - id: evt:bed_d2
    preset: script
    source: platform:bed_d2
    title: Straw Bed
    condition: {map_var: {name: find_d2, equals: 0}}
    effects:
      - set:
          var:
            map_var: find_d2
          value: 1
      - gold: 120
      - text: "Under the straw: 120 gold."
    else_effects:
      - text: Nothing here.
    notes: "The source's 'Straw Bed' (aaze0067:0-1, aaze0068:0-1): a find once, then 'Nothing here.' (aaze0067:10)."
  - id: evt:bed_k1
    preset: script
