format: 0
variables: []
events:
  - id: evt:alehall
    preset: script
    source: door:alehall
    title: The Alehall
    effects:
      - lua: evt.EnterHouse(4702)
    notes: A4's house 4702 (source/towns/dd25.yml door:alehall).
  - id: evt:arrive
    preset: script
    trigger: timer
    every: 1
    condition: {not: {qbit: arrived_once}}
    once: true
    effects:
      - lua: "XeenQuests.hook(\"dd25.arrival\")"
      - qbit: arrived_once
    notes: "The first arrival only: A3's once-hook dd25.arrival (its line, sets arrived_once 117680; D-62)."
  - id: evt:campfire_hearth_fire
    preset: script
    source: deco:hearth_fire
    title: Hearth
    lua: "local food = math.random(1, 3) evt.Add(Food, food) local ring = IsAtLeast(PerceptionSkill, 1) if ring then evt.GiveItem(1, ItemType.Ring_) end if ring then evt.StatusText(\"Food by the fire (+\" .. food .. \"), and a ring in the ashes.\") else evt.StatusText(\"You find food by the fire (+\" .. food .. \").\") end"
    once: true
    notes: "D-104: a dungeon campfire feeds the party once and gives a character with Perception a small ring, as the outdoor campfires (level_generation/projects/xeen/common/campfires.py)."
  - id: evt:chalice
    preset: script
    trigger: load
    condition: {qbit: chalice_done}
    effects:
      - show: deco:chalice
    notes: "D-62 Q37: the Chalice stands on the tasting table from q-d17.done (113343), shown on every load."
  - id: evt:exit_gate_left
    preset: exit
    source: exit:gate_left
    title: Bosco's gate
    notes: "The game's own leave window (D-24), to D5's entrance:dd25_door on the terrace."
