format: 0
level: L1
pitch: "Bosco's Hall: the dwarf king's town dug into the crag over his terrace on the Desert of Doom. The gate opens on a passage and a gate hall where the Alehall is the first door; round the great hall's hearth and well the smiths' gallery holds the Forge and the Mailwright, a lane the Tinker's burrow and the stair down to the Deep Guild of Earth. Up four steps, through two carved leaves, Bosco's throne stands empty under his banner: the King keeps to his chambers behind the dais, where the cups can be watched."
purpose: "A town BLV (WORLD_DESIGN 5.2): three services (Bosco's Forge 4701, the Alehall 4702, the Deep Guild of Earth 4703) and three residences (the King's Hall 4704, the Mailwright's Burrow 4705, the Tinker's Burrow 4706); Q-D17 The Chalice of Protection in Bosco's topics (the King's Hall); teachers Axe, Chain, Earth Magic and Repair Item Grandmaster. No monsters, no chests, no finds (D-62)."
mood: "A dwarf hall: dressed stone under raw rock vaults, timber house fronts with shingle eaves, the ring of hammers from the forge bay, the hearth's glow, guards at the gate and the throne hall."
