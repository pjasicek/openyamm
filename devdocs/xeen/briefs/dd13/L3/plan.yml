format: 0
level: L3
pitch: 'Two ogre forts on their knolls either side of D2''s pass road, each a timber blockhouse round a fire-pit hall over
  a cellar dug into the knoll, the cellars joined by the ogres'' run under the road. The halls are empty (''the Ogres are
  out hunting''); the stay-behinds sleep in the bunks, guard the plunder and the cellars, and Graalg''s two chiefs sit by
  his strongbox. Each hall''s fire pit asks the source''s ''Burn?'': yes sets the hall ablaze round the party, and the fort
  stands charred and empty on every later visit.'
purpose: 'Q-D11 Graalg''s Ogres, the war route: A3''s hooks q-d11.fort_west and q-d11.fort_east at the two fire pits (west_burned
  113224 / east_burned 113225 and hostile 113222), q-d11.fort_search at Graalg''s strongbox (2 Energy Disks, barred after
  a peace 113223). Party 22-26, the pass ogres 11066-11068 (18, 22, 30) and the Kennel Sabertooth 11413 (22), 25 placed, treasure
  3.'
mood: 'Smoky timber halls lit by fire pits and wall torches, straw and hides; cold rock under them. After a burn: black timber,
  fallen roof, ash.'
