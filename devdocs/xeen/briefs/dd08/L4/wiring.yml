    source: platform:book_fool_and_money
    title: Book
    lua: |-
      if continueStep == 2 then
          evt.PlaySoundName("closebook")
      end
      Xeen.vowelessBook("fool_and_money", eventId, continueStep)
    notes: "A Voweless book (D-61 Q25): A3's Xeen.vowelessBook(\"fool_and_money\"): the proverb or its vowels runs q-d17.book_fool_and_money (+1 to one statistic for each member new to it, a player bit); a wrong answer q-d17.book_wrong (the slam) and it may be tried again."
