format: 0
level: L3
pitch: "The Voweless Knights' tower in the Desert of Doom: four floors of green-grey Mok ashlar round a split stair core, books on lecterns that ask for proverbs with their vowels taken out, armouries and a drill hall full of black knights; at the top the order's dark sanctum, where a stone mask asks what you seek, the Chalice waits behind an iron door, and five thrones teach the highs and the lows."
purpose: "Q-D17 The Chalice of Protection (QUESTS.md): climb to the voice and answer it the knights' way (Chlc or aie, q-d17.voice), take the Chalice (q-d17.chalice); the light route takes it to Bosco (DD-25), the dark route swears the oath at the chapter hall's plaque (q-d17.oath: the knights turn friendly, four come out of the walls). Seven books (+1 to one statistic each, once per character), the thrones (+1 to all after the four lows). After M30 the roof trapdoor leads one way up to D7 (D-58). Class M, party 49-52, monsters 45-55, no boss."
mood: "Cold green-grey ashlar and scale-pattern flags (the Towers of Mok), grey cobbles in the core; at the top the knights' rooms in dark rough stone under black-and-red banners; silence, armour and books with no vowels."
datum: arrival
