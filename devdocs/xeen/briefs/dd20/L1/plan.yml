format: 0
level: L1
pitch: "Under the Lakeside Guild the coven keeps house: the Guild's back stair comes down into its hall, where the initiation cauldron stands two steps from the foot ('Drink?'). The Moon seal's double doors lead to the witches' walk, the brewery's three cauldrons and the Head Witch in the north-west corner, her chest and her mirror. Half a storey down, four prisoners in cages; below them the tide-wet sewer runs east under the square to the lake outfall, where the stalkers nest and the Golden Dragon sits in a niche two steps past a dead man's bones. A wrong answer at the Guild's door drops the party into the sump under the square instead."
purpose: "Side quest Q-D22 The Coven (QUESTS.md): free the four prisoners (q-d22.camilla, aretha, isabella, rhett), kill the Head Witch (q-d22.head_witch) and take her chest's Necropolis pass (q-d22.witch_chest); or join at the initiation cauldron (q-d22.initiation: Great Druid to Warlock). Q-D20: the Golden Dragon in the sewer niche (q-d20.dragon). Class M, party 35-39, monsters 25-45, the Head Witch 45."
mood: "A witches' house under a guild: dressed temple stone, dark flags, cauldron smoke and candles; half a storey down the wet rock of the cells, and below them the dripping, tide-wet sewer with its plank walks and pale lake light through the bars."
