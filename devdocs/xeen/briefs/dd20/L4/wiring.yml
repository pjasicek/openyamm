    notes: "The game's own leave window, up the ladder to D4's grate by the jetty (entrance:dd20_shaft)."
  - id: evt:hatch
    preset: switch
    source: mover:hatch
    title: Hatch
    condition: {not: {map_var: hatch_open}}
    locked_text: The hatch lies open over the ladder.
    effects:
      - text: The hatch is bolted from above.
    notes: "From the cistern's ladder: 'The hatch is bolted from above.' until the store's bolt is drawn."
  - id: evt:hatch_bolt
    preset: switch
    source: switch:hatch_bolt
    title: Bolt
    condition: {not: {map_var: hatch_open}}
    locked_text: "The bolt is drawn; the hatch lies open."
    opens: [mover:hatch]
    sets: {map_var: hatch_open}
    effects:
      - text: You draw the bolt. The hatch slides open over a ladder down into the dark.
    notes: "poi:hatch_bolt: the store's floor hatch, bolted from above, opened once from the store."
  - id: evt:head_witch_dead
    preset: script
    trigger: timer
    every: 2
    condition: {kills: {monster: monster:head_witch}}
    lua: "XeenQuests.hook(\"q-d22.head_witch\")"
    once: true
    notes: "goal:head_witch: her death runs A3's q-d22.head_witch (head_witch_slain 113447): the coven turns hostile again (A2's relations), Naomi's stocks open on D4."
  - id: evt:hideout_bones
    preset: script
    source: deco:hideout_bones
    title: Bones
    condition: {not: {map_var: hideout_pack}}
    effects:
      - set:
          var:
            map_var: hideout_pack
          value: 1
      - gold: 400
      - message: "You find the last surviving page of this dead man's journal. It reads: ...witches won't find me under here. Maybe I can use one of the other exits from the sewer to pop up in the town and be gone before anyone can find me. All of this was so sudden. Who would have known that the witches were plotting to... Beside him, his pack. (+400 gold)"
    else_effects:
      - message: "You find the last surviving page of this dead man's journal. It reads: ...witches won't find me under here. Maybe I can use one of the other exits from the sewer to pop up in the town and be gone before anyone can find me. All of this was so sudden. Who would have known that the witches were plotting to..."
    notes: "poi:journals: the hideout's dead man (dark/aaze0034:8) and his pack (a find once)."
  - id: evt:initiation
    preset: script
    source: deco:init_cauldron
    question: {ask: "Drink (Yes/No)?", answers: [Yes, Y, yes, y], message: "Initiation cauldron. The brew smells of toad and ambition. Drink?"}
    title: Initiation cauldron
    lua: "XeenQuests.hook(\"q-d22.initiation\")"
    notes: "poi:initiation: A3's q-d22.initiation (needs riddle_answered and the Head Witch alive; sets joined 113449, the Warlock promotion; its fail and else texts)."
  - id: evt:lake_bars
    preset: text
    source: panel:lake_bars
    title: Bars
    text: "The lake, beyond the bars. Something with too many arms is listening."
    window: false
    notes: The outfall's barred mouth to the lake.
  - id: evt:mirror
    preset: text
    source: panel:mirror
    title: Mirror
    text: "A bodiless voice murmurs: \"You are the most beautiful one of all.\""
    window: true
    notes: poi:mirror (dark/aaze0033:9).
  - id: evt:niche_bones
    preset: text
    source: deco:niche_bones
    title: Bones
    text: "You find the last surviving page of this dead man's journal. It reads: ...still haven't a clue where that statuette is. The sewer is infested with sewer monsters, and they seem to come out of nowhere. Got to watch my back."
    window: true
    notes: "poi:journals: two steps short of the alcove (dark/aaze0034:7)."
  - id: evt:prisoners_load
    preset: script
    trigger: load
    lua: |-
      if IsQBitSet(QBit(113443)) then evt.SetMonGroupBit(20, MonsterBits.Invisible, 1) end
      if IsQBitSet(QBit(113444)) then evt.SetMonGroupBit(21, MonsterBits.Invisible, 1) end
      if IsQBitSet(QBit(113445)) then evt.SetMonGroupBit(22, MonsterBits.Invisible, 1) end
      if IsQBitSet(QBit(113446)) then evt.SetMonGroupBit(23, MonsterBits.Invisible, 1) end
    notes: "D-42 (3): each prisoner is hidden by her or his freed bit on every load."
