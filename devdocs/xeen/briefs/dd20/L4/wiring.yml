    notes: "'Bed' / 'Nothing here.' (dark/aaze0033:15-16)."
  - id: evt:cage_aretha
    preset: script
    source: mover:cage_aretha
    title: Cage
    condition: {not: {qbit: aretha_freed}}
    lua: |-
      XeenQuests.hook("q-d22.aretha")
      if IsQBitSet(QBit(113444)) then
          evt.SetMonGroupBit(21, MonsterBits.Invisible, 1)
      end
    else_effects:
      - lua: "XeenQuests.hook(\"q-d22.aretha\")"
    notes: "poi:cages: 'Cage' (dark/aaze0033:22); A3's q-d22.aretha (Aretha the Helpless's line, 113444, 500 XP); she or he is hidden at once; then the hook's 'Nothing here.'"
  - id: evt:cage_aretha_opens
    preset: switch
    trigger: timer
    every: 1
    condition: {qbit: aretha_freed, not: {map_var: cage_aretha_open}}
    opens: [mover:cage_aretha]
    effects:
      - set:
          var:
            map_var: cage_aretha_open
          value: 1
    notes: The cage front sinks once its prisoner is freed (and again after a refill).
