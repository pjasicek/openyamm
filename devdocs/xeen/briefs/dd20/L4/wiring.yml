format: 0
variables: [hatch_open, ambush_shown, sump_purse, hideout_pack, bed_found, witch_bed_found, shelf_found, cage_camilla_open, cage_aretha_open, cage_isabella_open, cage_rhett_open, trap_checked]
events:
  - id: evt:ambush
    preset: script
    source: room:cross
    trigger: step
    condition: {not: {map_var: ambush_shown}}
    effects:
      - show_actors: 6
      - set:
          var:
            map_var: ambush_shown
          value: 1
      - text: "Things climb out of the side drains!"
    notes: "poi:ambush (D-18, D-42 (7)): the hidden group 6 shows on the first step onto the cross and stays shown (saved with the map); a refill resets both."
  - id: evt:arrive
    preset: script
    trigger: timer
    every: 1
    condition: {not: {qbit: arrived_once}}
    once: true
    effects:
      - message: "LAKESIDE'S UNDERSIDE. Under the Guild the coven keeps house; half a storey below its hall are the cells, and under everything the town's sewer runs east to the lake. Naomi said four prisoners wait in the cells, and that the Head Witch keeps the coven's north-west corner."
      - qbit: arrived_once
    notes: "Say why the party is here (Q-D22: the prisoners, the Head Witch), on the first arrival by any of the three ways (arrived_once 117400)."
  - id: evt:bed_1
    preset: text
    source: platform:bed_1
    title: Bed
    text: Nothing here.
    window: false
    notes: "'Bed' / 'Nothing here.' (dark/aaze0033:15-16)."
  - id: evt:bed_2
    preset: text
    source: platform:bed_2
    title: Bed
    text: Nothing here.
    window: false
    notes: "'Bed' / 'Nothing here.' (dark/aaze0033:15-16)."
  - id: evt:bed_3
    preset: script
    source: platform:bed_3
    title: Bed
    condition: {not: {map_var: bed_found}}
    effects:
      - set:
          var:
            map_var: bed_found
          value: 1
      - gold: 150
      - text: A few coins in the straw. (+150 gold)
    else_effects:
      - text: Nothing here.
    notes: "'Bed' (dark/aaze0033:15): one find among the beds."
  - id: evt:bed_4
    preset: text
    source: platform:bed_4
