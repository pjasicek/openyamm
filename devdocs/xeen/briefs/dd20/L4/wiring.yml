  - id: evt:skull_endurance
    preset: text
    source: deco:skull_endurance
    title: Skull
    text: "Unprompted, the skull begins to speak: To make a potion of endurance, gather together the poisoned entrails of a toad kept under a cold stone for thirty-one days, a slice of swamp snake, the eye of a newt, the toe of a frog, wool from a bat, tongue of a dog, a lizard's leg, an owlet's wing, and the forked tongue of a snake. Throw them all in a cauldron and let sit under the auspices of a full moon. Begin boiling just before sunrise. Keep warm until sunrise of the next day. If the mixture turns black, the brew is sour and will turn its drinkers to stone. Makes one serving."
    window: true
    notes: "poi:skulls (dark/aaze0033:12-14): the recipe beside its cauldron."
  - id: evt:skull_personality
    preset: text
    source: deco:skull_personality
    title: Skull
    text: "Unprompted, the skull begins to speak: To make a Potion of Personality, gather together the ground horn of a Unicorn, the tanned hide of an Ogre, and the blood of a monkeydog sacrificed 'neath the blackness of a new moon. Slowly pour a half part of the blood into a twenty gallon cauldron and mix in the horn powder. Heat to a low simmer and let sit for three days. At the stroke of midnight on the third night, drop the Ogre hide into the stew and stir rapidly. If the hide dissolves any sooner or later than three minutes, the brew is sour and will turn its drinkers to stone. Makes one serving."
    window: true
    notes: "poi:skulls (dark/aaze0033:12-14): the recipe beside its cauldron."
  - id: evt:skull_speed
    preset: text
    source: deco:skull_speed
    title: Skull
    text: "Unprompted, the skull begins to speak: To make a potion of speed, gather together the claw of a roadrunner, the wing of a hummingbird, and the paw of a cheetah. Pound the claw to dust and sprinkle into briskly boiling salt water. Quickly drop in the wing, followed by the paw. Stir 100 times, rapidly. Remove the cauldron from the fire and pour the liquid through a strainer and into a second cauldron. If any material remains in the strainer, the brew is sour and will turn its drinkers to stone. Makes one serving."
    window: true
    notes: "poi:skulls (dark/aaze0033:12-14): the recipe beside its cauldron."
  - id: evt:sump_bones
    preset: script
    source: deco:sump_bones
    title: Bones
    condition: {not: {map_var: sump_purse}}
    effects:
      - set:
          var:
            map_var: sump_purse
          value: 1
      - gold: 250
      - text: An earlier wrong answer. Its purse is still on it. (+250 gold)
    else_effects:
      - text: Nothing here.
    notes: "'Bones' (dark/aaze0034:6): a purse once."
  - id: evt:trapdoor
    preset: script
    trigger: timer
    every: 1
    condition: {not: {map_var: trap_checked}}
    lua: |-
      local x, y, z = evt.GetPartyPosition()
      if x >= 3328 and x <= 3584 and y >= -768 and y <= -512 and z <= -448 then
          evt.StatusText("The trapdoor is shut fast above you.", 4)
      end
    effects:
      - set:
          var:
            map_var: trap_checked
          value: 1
    notes: "The sump: the trapdoor a wrong answer drops the party through stays shut (one way, D-42 (4)). Said once, on the first tick of a visit that began under the trapdoor (entrance:d4_trapdoor), never on a later walk through the sump (A3, session 9)."
  - id: evt:trapdoor_reset
    preset: script
    trigger: leave
    effects:
      - set:
          var:
            map_var: trap_checked
          value: 0
    notes: "Leaving ends the visit: the next arrival is checked again for a drop through the trapdoor."
  - id: evt:witch_bed
    preset: script
    source: platform:witch_bed
    title: Bed
    condition: {not: {map_var: witch_bed_found}}
    effects:
      - set:
          var:
            map_var: witch_bed_found
          value: 1
      - gold: 500
      - text: "Under the pillow: a purse of the coven's dues. (+500 gold)"
    else_effects:
      - text: Nothing here.
    notes: "'Bed' (dark/aaze0033:15): a find once, then 'Nothing here.' (:16)."
  - id: evt:witch_chest
    preset: chest
    source: chest:witch
    title: Chest
    condition: {any: [{qbit: joined}, {qbit: head_witch_slain}]}
    effects:
      - lua: "XeenQuests.hook(\"q-d22.witch_chest\")"
    else_effects:
      - lua: "XeenQuests.hook(\"q-d22.witch_chest\")"
    notes: "goal:pass: her chest opens to a member (joined) or over her body, the Necropolis pass among its loot (F15); A3's q-d22.witch_chest sets pass_found 113448 once; shut, its fail line on the status line."
notes: "DD-20's events, written by output/studio_cal/dd20/tools/dress.py."
