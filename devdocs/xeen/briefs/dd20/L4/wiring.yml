    window: false
    notes: "'Sewer Drain' (dark/aaze0034:2)."
  - id: evt:exit_guild
    preset: exit
    source: exit:guild
    title: Cellar door
    notes: "The game's own leave window, up into the Guild's back yard beside its cellar hatch (D4's entrance:dd20_guild, D-42 (4))."
  - id: evt:exit_shaft
    preset: exit
    source: exit:shaft
