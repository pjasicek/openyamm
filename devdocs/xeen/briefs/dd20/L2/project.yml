notes: "Xeen design brief for a new map: DD-20 Lakeside Coven and Sewer (the source's dark Lakeside town maze0033: the coven, its prisoners and cauldrons; and Lakeside Sewer maze0034: the stalkers, the statuette, two dead men's journals) as one BLV under D4's Lakeside. Side quest Q-D22 The Coven (A3's hooks q-d22.initiation, head_witch, witch_chest, camilla, aretha, isabella, rhett, cauldron_personality, cauldron_endurance, cauldron_speed; the Warlock promotion) and Q-D20's Golden Dragon (q-d20.dragon). Size M (MAPS.md section 0, D-42): 20-45 sectors, 30-90 M units squared, 45 monsters at levels 25-45, the Head Witch 45, party 35-39, treasure 4 (hoard 5), music 28. Graph devdocs/xeen/mockups/act4_graphs/dd20.graph.yml with decider D-42 (mockups/act4_a8_decisions.md, which wins): the Guild's back cellar door (entrance:d4_guild), the trapdoor (entrance:d4_trapdoor, one way) and the jetty shaft (entrance:d4_shaft); the Head Witch 11173 with her own skin, her group of three; the prisoners 11906-11909 named peaceful rows, hidden by their freed bits; the three brewery cauldrons +2 once per character (A3's player bits 11345-11347); the drain cross's ambush of five shown on the first step (D-18); Joseph left out. Rows (A2): coven 11170 (Witch 11170 32 x13, Coven Witch 11171 40 x4; peaceful to members, joined 113449, until the Head Witch dies, 113447), Head Witch 11173; sewer stalkers 11400 (Sewer Stalker 11401 25 x24, Stalker Matriarch 11402 35 x3). Kill XP 53,672 for the party, 13.42k per member. Rest encounters 10 %: sewer stalkers at Dif 5 only (D-42, D-46). Map qbits 117400-117439 (provisional); map_stats 9173."
