# Playtest of the Asp Undercroft (XD-25, L4): start to goal through every mechanism, and back up by the drain.
# A level-15 party arrives at the top of the cellar stair (the arrival from X4's door:xd25, the map's start), finds the
# door back up to Asp sealed, opens the hidden cache's slab and its chest, fights through the cistern, the moulting room
# (its chest) and the brood hall, sees the caged townsfolk (the cages will not open) and the drain grate bolted from
# below, goes down the brood stair, clears the keeper's cell (the straw bed's line, his hoard), and meets the field of
# light shut (A3's hook q-c5.field_gate gives its fail text). X4 is not built, so the pedestals' qbit q-c5.pedestals
# (112101) is set by a setup shortcut, as Asp's well would set it; the field then sinks. In the transformer hall the
# crystal housing is shut (q-c11.crystals' fail text); a click on the transformer runs
# A3's hook q-c5.transformer (q-c5.done 112102), stops the hum, opens the housing and the cages. The housing gives the
# Crystals of Piezoelectricity (12313, q-c11.crystals_found 112222) once. Back by the drain: its bolt is reached from
# below, the grate opens, and in the pens the freed townsfolk say "Thank you for saving us!" (townsfolk_thanked 110840).
# Then up through the cistern to the stair. Numbers are ids.lock.yml's: events (click), doors (door_state), map
# variables (state_dump_map_var index); actors 3-5 are the townsfolk (the scene lists placed monsters by id).
id: xeen.xd25.l4.walk
title: Asp Undercroft (XD-25 L4), the cellar stair to the transformer and back by the drain
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_xd25.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 15, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 15, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 15, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 15, skills: [], equipment: {}}
  - assert: {map: xeen_xd25.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - assert: {party_position: {x: -2208, y: 1760, radius: 64, z_min: 240, z_max: 270}}
  - advance_runtime: {seconds: 3}
  - assert: {state_dump_map_var: {index: 0, value: 1}}
  # The door back up to Asp's square is sealed (X4 is not built): its line, and the party stays.
  - play_lua: {source: "click(2); wait(1); close()"}
  - assert: {map: xeen_xd25.blv}
  # Down the stair; the door into the cistern.
  - walk_to: {x: -1500, y: 1760, z: 32, z_tolerance: 60, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "if door_state(7) ~= 'closed' then error('the stair door does not start shut') end; open_door(21, 7)"}
  - walk_to: {x: -900, y: 1760, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - assert: {state_dump_map_var: {index: 2, value: 1}}
  # The loose slab (secret) and the townsman's savings.
  - walk_to: {x: -1120, y: 1216, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "open_door(4, 1); close()"}
  - walk_to: {x: -1650, y: 1216, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua:
      source: |
        local g = gold()
        loot_chest(6)
        if held() ~= 0 then stow() end
        if gold() < g + 400 then error("the hidden cache held no savings") end
  # The moulting room and its chest.
  - walk_to: {x: -1120, y: 1216, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 300, y: 1600, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1000, y: 1600, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - assert: {state_dump_map_var: {index: 7, value: 1}}
  - walk_to: {x: 1900, y: 2150, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua:
      source: |
        local g = gold()
        for _ = 1, 3 do
          loot_chest(8)
          if held() ~= 0 then stow() end
          if gold() >= g + 250 then return end
        end
        error("the moulting room's chest held no gold")
  # South into the brood hall.
  - walk_to: {x: 1613, y: 1450, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 1613, y: 900, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - assert: {state_dump_map_var: {index: 1, value: 1}}
  # West into the holding pens: the caged townsfolk, the cages shut, the grate bolted from below.
  - walk_to: {x: 1000, y: 320, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 300, y: 320, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: 400, y: 700, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - assert: {state_dump_map_var: {index: 8, value: 1}}
  - assert: {actor_visible: {actor_index: 3, dead: false, hidden: false}}
  - assert: {actor_visible: {actor_index: 4, dead: false, hidden: false}}
  - assert: {actor_visible: {actor_index: 5, dead: false, hidden: false}}
  - walk_to: {x: -500, y: 320, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(5); wait(1); close(); if door_state(8) ~= 'closed' then error('the cages opened before the machine died') end"}
  - walk_to: {x: -384, y: -120, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(15); wait(1); close(); if door_state(4) ~= 'closed' then error('the grate opened from above') end"}
  # Down the brood stair to the machine level.
  - walk_to: {x: 1000, y: 320, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 2304, y: -300, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2304, y: -1850, z: -608, z_tolerance: 60, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2304, y: -2600, z: -640, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  # The keeper's cell: two Snake Lords, the straw bed, the hoard.
  - walk_to: {x: 2304, y: -2944, z: -640, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "open_door(16, 5)"}
  - clear_hostiles: {radius: 2500}
  - assert: {actor_visible: {actor_index: 0, dead: true}}
  - assert: {actor_visible: {actor_index: 1, dead: true}}
  - walk_to: {x: 2900, y: -2944, z: -608, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(22); wait(1); close()"}
  - walk_to: {x: 3080, y: -3150, z: -608, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua:
      source: |
        local g = gold()
        for _ = 1, 3 do
          loot_chest(7)
          if held() ~= 0 then stow() end
          if gold() >= g + 700 then return end
        end
        error("the keeper's hoard held no gold")
  # Round the coil passage to the field of light: shut while the pedestals are not set (A3's fail text).
  - walk_to: {x: 2304, y: -2944, z: -640, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 2304, y: -3584, z: -640, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 700, y: -3584, z: -640, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: -128, y: -3584, z: -640, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - assert: {state_dump_map_var: {index: 5, value: 1}}
  - play_lua: {source: "click(13); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "A wall of coloured light hums across the passage"}}
  - play_lua: {source: "close(); if door_state(3) ~= 'closed' then error('the field dropped without the pedestals') end"}
  # What Asp's well would give (X4, A5's pedestals): q-c5.pedestals.
  - setup_shortcut: {kind: set_qbit, id: 112101, value: true}
  - play_lua: {source: "open_door(13, 3); close()"}
  - walk_to: {x: -128, y: -3150, z: -640, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - assert: {actor_visible: {actor_index: 2, dead: true}}
  - assert: {state_dump_map_var: {index: 6, value: 1}}
  # The crystal housing is shut while the machine works.
  - walk_to: {x: 384, y: -2080, z: -640, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(10); wait(1)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[shut tight while the machine hums]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "close(); if door_state(2) ~= 'closed' then error('the housing opened before the machine died') end"}
  # The transformer: a click destroys it (F47 2026-11-24: no question).
  - walk_to: {x: 384, y: -2980, z: -640, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(25); wait(0.5)"}
  - advance_runtime: {seconds: 1}
  - assert: {dialog: {active: true, text_contains: "The transformer sparks, shudders and dies."}}
  - play_lua: {source: "close()"}
  - advance_runtime: {seconds: 6}
  - play_lua:
      source: |
        if not qbit(112102) then error("q-c5.done not set") end
        if door_state(2) ~= "open" then error("the crystal housing did not open: " .. door_state(2)) end
        if door_state(8) ~= "open" then error("the cages did not open: " .. door_state(8)) end
        if mapvar("AmbientSound4") ~= 2 then error("the hum did not stop") end
        click(25); wait(1); close()
  # The crystals, once.
  - walk_to: {x: 384, y: -2080, z: -640, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 384, y: -1680, z: -640, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(11); wait(1)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[a cluster of blue crystals]], 1, true) then error("status line: " .. s) end
  - play_lua:
      source: |
        close()
        if held() ~= 0 then stow() end
        if item_count(12313) ~= 1 then error("no Crystals of Piezoelectricity: " .. pack_items()) end
        if not qbit(112222) then error("crystals_found not set") end
        click(11); wait(1); close()
        if held() ~= 0 then stow() end
        if item_count(12313) ~= 1 then error("the crystals were given twice") end
  # Back by the drain: its bolt from below, the grate, the freed townsfolk.
  - walk_to: {x: 384, y: -2080, z: -640, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -384, y: -2080, z: -640, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -384, y: -1650, z: -640, z_tolerance: 60, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -384, y: -500, z: 0, z_tolerance: 60, radius: 64, timeout_seconds: 40, close_dialogs: true}
  - assert: {state_dump_map_var: {index: 4, value: 1}}
  - play_lua: {source: "open_door(15, 4); close()"}
  - walk_to: {x: -384, y: 0, z: 0, radius: 64, timeout_seconds: 30, expect: dialog}
  - assert: {dialog: {active: true, text_contains: "Thank you for saving us!"}}
  - play_lua: {source: "close(); if not qbit(110840) then error('townsfolk_thanked not set') end"}
  - assert: {actor_visible: {actor_index: 3, dead: false, hidden: false}}
  # A save and a load inside the visit: the freed townsfolk stay (A8's DD-09 rule: in_visit is saved with the map).
  - reload: {}
  - advance_runtime: {seconds: 1}
  - assert: {actor_visible: {actor_index: 3, dead: false, hidden: false}}
  # The next entry (out to Asp's square and back in): the townsfolk have gone home.
  - play_lua: {source: "close()"}
  - execute_event: {id: 2}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_x4.odm}
  - lua_event: {source: "evt.MoveToMap(-384, 0, 0, 512, 0, 0, 0, 0, \"xeen_xd25.blv\")"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_xd25.blv}
  - assert: {actor_visible: {actor_index: 3, hidden: true}}
  - assert: {actor_visible: {actor_index: 4, hidden: true}}
  - assert: {actor_visible: {actor_index: 5, hidden: true}}
  # Up through the cistern to the stair.
  - walk_to: {x: 400, y: 600, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "open_door(19, 6)"}
  - walk_to: {x: 400, y: 1250, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -900, y: 1760, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -2100, y: 1760, z: 256, z_tolerance: 60, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "if item_count(12313) ~= 1 or not qbit(112102) or not qbit(112222) or not qbit(110840) then error('a quest bit or the crystals were lost') end"}
