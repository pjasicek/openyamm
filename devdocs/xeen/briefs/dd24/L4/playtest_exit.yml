# Playtest of the Giants' Hall's way out and back (DD-24, L4; lane A7, fifteenth session): through the great doors to
# the porch, the mouth (the exit preset) out to D5 at its named arrival entrance:dd24_hold (11264, 10752, 2688) facing
# south, the leave window's OK pressed, the landing measured; then war (113321) and back in through D5's great doors
# (D5's event 40): the party arrives at entrance:d5_hold (0, 384) and the People's challenge shows at once (evt:war_arrival,
# A3's q-d16.war_threshold; the arrival stands inside the threshold, whose step event does not run on the way in).
id: xeen.dd24.l4.exit
title: Giants' Hall (DD-24 L4), out to D5 and back in at war
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_dd24.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 46, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 46, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 46, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 46, skills: [], equipment: {}}
  - assert: {map: xeen_dd24.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - assert: {party_position: {x: 0, y: 384, radius: 64, z_min: -8, z_max: 8}}
  - assert: {dialog: {active: false}}
  - play_lua: {source: "wait(3); close()"}
  - walk_to: {x: 0, y: 128, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "if door_state(1) ~= 'open' then click(4) end"}
  - advance_runtime: {seconds: 4}
  - walk_to: {x: 0, y: -480, z: 0, radius: 64, timeout_seconds: 40, close_dialogs: true}
  - execute_event: {id: 15}
  - assert: {dialog: {active: true, text_contains: "Do you wish to leave"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d5.odm}
  - play_lua: {source: "log('landing: ' .. status())"}
  - advance_runtime: {seconds: 2.0}
  - play_lua: {source: "log('landing after 2 s: ' .. status())"}
  - assert: {party_position: {x: 11264, y: 10752, radius: 200, z_min: 2600, z_max: 2800}}
  # War, then back in through D5's great doors.
  - setup_shortcut: {kind: set_qbit, id: 113321, value: true}
  - execute_event: {id: 40}
  - advance_runtime: {seconds: 0.5}
  # D5's great doors ask first (the entrance screen, picture 1, D5's rebuild 2026-11-22 01:28): answer it.
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_dd24.blv}
  - advance_runtime: {seconds: 1.0, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "We recognize you as enemies"}}
  - play_lua: {source: "close(); if not qbit(113324) then error('war_announced not set') end"}
  - assert: {party_position: {x: 0, y: 384, radius: 160}}
