format: 0
level: L1
pitch: "Sheltem's escape pod, standing upright in its crater on the Darkside: three decks round a lift spine, cold and red-lit, still kept by his guard machines. A lockdown seals the bridge until the security post below releases it; on the bridge, under a domed viewport, his empty command couch and the log computer that still pages his own account, from his break with the Ancients to the crash on Xeen."
purpose: "Optional lore for Act VI (MAPS: 'The other ship's log (six pages); opens after M33'): D6's hatch opens once m33.done (A3's d6.sheltem_hatch). The security console (dd22.security_console) opens the blast door; the log computer pages dd22.log_page_1..6 (autonote 4139 sheltem_log); the gun deck's weapons (dd22.weapons); the drive rack's find (dd22.drive_rack). Class S, party 56-60, robots 50-62."
mood: "MM6's Control Center in its red accents: dark teal hull panels and rust ceilings in cold light, red pilot lights and red floor grids where the pod still works; the bridge's red glow under a dome of dark steel ribs."
datum: arrival
spaces:
  - id: room:airlock
    name: Airlock
    kind: room
    size: S
    floor: 0
    purpose: "The arrival (entrance:d6_hatch) behind the round hatch (the exit preset, 'Exit Escape Pod 2?', aaze0088:1); the inner door north. Quiet (D-11.3); map qbit 117760 dd22_arrived_once."
    empty: true
  - id: room:bridge
    name: The bridge
    kind: room
    size: M
    floor: 896
    purpose: "The set piece: Sheltem's empty command couch under the domed viewport of dark steel ribs, the main and scanning consoles flickering red ('The computer seems to be malfunctioning.', aaze0088:5, :6), the log computer paging his six entries (A3's dd22.log_page_1..6; autonote 4139 after the sixth); his locker by the couch (T6)."
    population:
      - {actor: 11610, groups: 1, levels: [50, 50], placed: true, strength: pack}
      - {actor: 11611, groups: 1, levels: [62, 62], placed: true, strength: pack}
    treasure:
      - {kind: chest, count: 1, tier: 6}
  - id: room:bridge_ante
    name: Bridge landing
    kind: corridor
    size: S
    floor: 896
    purpose: "Lift B's head; the bridge's blast door (two leaves parting in the middle), sealed ('The bridge door is sealed. Security lockdown.', A3's dd22.blast_door) until the security post releases it."
    population:
      - {actor: 11610, groups: 2, levels: [50, 50], placed: true, strength: pack}
  - id: room:brig
    name: The brig
    kind: room
    size: M
    floor: 448
    purpose: "Two empty stasis cells, their fields dark, where Sheltem shut the Ancients' two agents (log XL70I); the guards' locker (T6) by the wall."
    population:
      - {actor: 11610, groups: 2, levels: [50, 50], placed: true, strength: pack}
      - {actor: 11611, groups: 1, levels: [62, 62], placed: true, strength: pack}
    treasure:
      - {kind: chest, count: 1, tier: 6}
  - id: room:drive
    name: Drive room
    kind: room
    size: M
    floor: 0
    purpose: "The stern drive under red floor grilles; the two alien devices, dark ('The strange alien device seems to be dormant.', aaze0088:0, D-62 Q53); the stasis generator that carried Sheltem through the crash, cold, and its tool rack (the find: one random T6 item once, 117762, D-62 APPROVAL)."
    population:
      - {actor: 11610, groups: 2, levels: [50, 50], placed: true, strength: pack}
      - {actor: 11611, groups: 1, levels: [62, 62], placed: true, strength: pack}
  - id: room:gun_deck
    name: Gun deck
    kind: room
    size: M
    floor: 448
    purpose: "Phaser Control and Photon Control ('A status indicator on the weapon shows it to be disarmed. Fire anyway?', aaze0088:2, :3; Yes: 'Nothing happens.', A3's dd22.weapons); the ladder's hatch in the floor."
    population:
      - {actor: 11610, groups: 2, levels: [50, 50], placed: true, strength: pack}
      - {actor: 11611, groups: 1, levels: [62, 62], placed: true, strength: pack}
  - id: room:ladder
    name: Maintenance ladder
    kind: room
    size: S
    floor: 0
    purpose: "A ladder in the hull's thickness from the lower ring up through the gun deck's floor hatch: the second way between decks 1 and 2 (the loop). Quiet."
    empty: true
  - id: room:ring0
    name: Lower ring
    kind: corridor
    size: M
    floor: 0
    purpose: "An L-shaped corridor round the lift shaft's foot; the maintenance hatch in its east arm (the ladder up)."
    population:
      - {actor: 11610, groups: 2, levels: [50, 50], placed: true, strength: pack}
  - id: room:ring1
    name: Middle ring
    kind: corridor
    size: M
    floor: 448
    purpose: "Lift A's head and lift B's foot in the middle of the ring; doors to the gun deck and the brig. Quiet."
    empty: true
  - id: room:security
    name: Security post
    kind: room
    size: S
    floor: 448
    purpose: "The machines' charging alcoves and the security console: 'Security lockdown: bridge sealed. Release?' Yes opens the bridge's blast door, one way (D-43; 117761); the alarm stops."
    population:
      - {actor: 11611, groups: 2, levels: [62, 62], placed: true, strength: pack}
      - {actor: 11610, groups: 1, levels: [50, 50], placed: true, strength: pack}
  - id: room:shaft0
    name: Lift shaft foot
    kind: room
    size: S
    floor: 0
    purpose: "The pod's spine: lift A's pad (deck 1 to 2) with its call button; the drive room north, the stores west. Quiet."
    empty: true
  - id: room:stores
    name: Stores
    kind: room
    size: S
    floor: 0
    purpose: A dead end with the pod's stores locker (T6) and barrels by the walls.
    population:
      - {actor: 11610, groups: 2, levels: [50, 50], placed: true, strength: pack}
    treasure:
      - {kind: chest, count: 1, tier: 6}
