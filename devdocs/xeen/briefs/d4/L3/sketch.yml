events:
  - id: evt:sky
    trigger: load
    effects:
      - lua: Xeen.applyDarksideSky()
    notes: Darkside's sky by the sun's stage (A3's helper).
  - id: evt:coven_gone
    trigger: load
    condition: {lua: "XeenQuests.can(\"q-d22.coven_gone\")"}
    lua: "evt.SetMonGroupBit(1, MonsterBits.Invisible, 1) evt.SetMonGroupBit(2, MonsterBits.Invisible, 1)"
    notes: "q-d22.coven_gone (D-36 (3)): once the Head Witch is dead the coven's two groups are gone; the Circle's chest and skulls stay."
  - id: evt:bat_storm
    trigger: timer
    when_flying: true
    every: 1
    lua: "local x, y, z = evt.GetPartyPosition() if x >= 8704 and x <= 15360 and y >= 4096 and y <= 11776 and z >= 2700 then evt.RemovePartyBuff(\"Fly\") evt.MoveToMap(5939, 5120, 1192, 0, 0, 0, 0, 0) XeenQuests.hook(\"m25.bat_storm\") end"
    notes: "m25.bat_storm (D-36 (1)): a flying party over the crag top is beaten out of the sky: Fly ends (evt.RemovePartyBuff, merge point 18), the party is set down on the north-shore track, then A3's hook (its line)."
  - id: evt:bat_shrieks
    trigger: timer
    every: 9
    lua: "evt.PlaySoundName(\"bat_aware\", 11776, 8448, 6204) evt.PlaySoundName(\"bat_aware\", 13517, 6861, 5904)"
    notes: "The bat storm's shrieks at its two spots (BAT_STORM_SPOTS), a shipped bat sound."
