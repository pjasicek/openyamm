format: 0
level: L3
pitch: "Darkside's north-east corner, where the world ends on two sides. A great lake fills the middle: Octopod Lake, dark and deep, with the Isle of Lost Souls and its ruined tower a short row off the shore. On its south shore lies Lakeside, a low town of grey stone and slate under the coven's rule; north across the water Castle Blackfang crowns a black crag in a storm of bats, and the Snow River comes down its rapids from a snowfield at the rim. West, Magic Mountain lifts its crags and snow over the Forest of Peril, with two wizards camped on its shoulder and gargoyles on its perches. The lake drains east over the rim into the stars; above the north-east rim stands the glow of the bright face."
purpose: "Act IV's wilderness map (party 35-38): the Isle and DD-12 (M20, M24), the coven and Lakeside's liberation (Q-D22, DD-20; Warlock if joined), Castle Blackfang's sealed gate (M25: the griffin is the only way in), the gargoyle lair (Q-D15, DD-23), Ector's ring (Q-D21), Slibo and the real map (Q-C24), Leafpoint (T2-LEAFPOINT), the fourth Darkside obelisk, Lucio's boat after M30."
mood: "Cold amber light on still dark water; slate roofs and closed shutters; reeds hissing; the far shriek of bats over Blackfang; snow and wind on the uplands; the falls' roar at the rim."
datum: water:rim_sea
