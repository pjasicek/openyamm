landform:
  relief: "A desert-edge heath along the south at 1,500-1,900 (D3's dunes and the Lakeside road run on), falling north to the lake at 1,056; Lakeside on its south shore at 1,100-1,150; the Forest of Peril in the west at 1,200-1,700 under Magic Mountain (to 4,100); the Snow River uplands (1,300-2,400) and the snowfield along the north rim; Blackfang's crag (3,100) on the north shore; the Rimward crags (to 2,400) between the road and the east rim. Inside the playable box the land spans about 1,060-4,100."
  height_range: [1056, 4100]
  water: "Octopod Lake (about 1,100 cells, level 1,056) with the Isle; the Snow River (about 30 cells, rapids); the outflow race and falls (4 cells); the Snow Springs tarn."
  water_share: 0.16
  caps:
    - {kind: snow, share: 0.08, where: the uplands north of y 36 and Magic Mountain's head}
    - {kind: bare rock, share: 0.07, where: "Magic Mountain's crags, Blackfang's crag, the rim cliffs"}
    - {kind: sand, share: 0.06, where: the desert edge and the beaches}
  rim: {notes: "The world rim along the whole north (y 24) and east (x 104): a cliff of 1,100-4,000 down to the stars; the lake falls over the east rim at y 67. South and west the land runs to the map edge; the roads run out to it."}
atmosphere: "Sky xeendark1 (xeen_darkside_day; A3's Lua switches to xeendark2/3 at M17/M27); occasional mist on the lake; light snow possible on the uplands only (no map weather by default); music 41. Lapping water, reeds and gulls at the shore; bats' shrieks near Blackfang; wind on the mountain; the falls at the rim."
sketch: {file: sketch.yml, grid: 512}
notes: "L3/L4 written by output/studio_cal/d4/tools/gen.py from the approved L1 and D-36. The plan keeps the L1 spaces; the coven's two groups and the five octopods are placed actors, the gargoyles and the rocs slot markers."
