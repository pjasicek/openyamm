landmarks:
  - id: landmark:blackfang
    space: zone:blackfang_crag
    what: "Castle Blackfang on its black crag over the lake: dark slate towers with cones, one lit window per storey, a storm of bats wheeling round the keep"
    seen_from: [zone:lakeside_brow, town:lakeside, zone:isle, zone:west_shore, zone:snow_uplands, zone:east_shore]
  - id: landmark:isle
    space: zone:isle
    what: "The Isle of Lost Souls: dead trees, graves and a ruined round tower on a rock in the lake"
    seen_from: [town:lakeside, zone:lakeside_brow, zone:west_shore, zone:east_shore]
  - id: landmark:magic_mountain
    space: zone:magic_mountain
    what: "Magic Mountain: grey crags and snow to 4,100, gargoyles on its perches"
    seen_from: [zone:west_edge, zone:forest_of_peril, zone:lakeside_brow, zone:west_shore]
