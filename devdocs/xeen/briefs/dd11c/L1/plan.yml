pitch: 'The third and widest troll hole drops the party straight before the carved log doors of Hobstadt''s hall. His court
  of eight stands in two rows under the root vaults and lets the party through; the Troll King on his throne of boulders names
  his price: all your gold, one of your number, or a fight to the death. Behind the throne lie the Thieves'' Guild''s sacks.
  A hide flap off the pit leads into the wild trolls'' warren, down to the frost seep under the world''s rim, where the ice
  trolls live.'
purpose: 'Q-D13 Hobstadt''s Trolls: NPC 5110''s topics (A3: tribute 113261, trial 113262 with the War Troll promotion, hostile
  113263), q-d13.hobstadt on his death (hobstadt_slain 113264), q-d13.throne (the vacant throne promotes a Troll member),
  q-d13.hoard (done 113266). Party 23 to 27: the court Hobstadt''s Guard 11075 (28) x8, Hobstadt 11073 (42); wild trolls Troll
  11690 (18) x8, Ice Troll 11692 (38) x4; treasure 3, the hoard 4.'
mood: A long earthen hall under root vaults, lit by the court's fires; outside the court, gnawed tunnels and a cold that steams
  the breath.
