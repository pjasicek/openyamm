    notes: "The bowl: one open-air room under the xeen_plane_earth sky, its floor the scree at -1,024, its walls raw rock 2,200-3,000 over the scree with a jagged skyline (ceiling_points), spurs, talus at their foot and hanging slabs leaning in high on them; the terraces stand in the scree, linked by ridges of rock and the Giants' Arch, each with a scree slope back up; the Root Stair down to the Sleeper's Hollow between its cheeks under the south wall's overhang."
