set_pieces:
  - id: set:rockfall
    kind: trap
    spaces: [room:geodes, room:pillars, room:quarry, room:west_ledge]
    rule: "The source's nine squares of falling rock: patches of fresh rubble under overhangs (a small floor face each). Stepping on one: one time in three 50 physical damage to each member, 'Rocks fall from above!', with a short camera shake (evt.CameraShake). PressurePlate faces textured `xperubble`, each calling A3's planes.rockfall. Cells: at (3328, 4224); at (4864, 3456); at (3712, 4736); at (3840, 512); at (4864, -896); at (1664, -2048); at (-128, -2176); at (-5248, 256); at (-5504, 1920). None on the critical path (measured 0 within 384 of the walk; 0 on a link, 0 in the arena)."
  - id: set:scree
    kind: trap
    spaces: [zone:scree]
    rule: "A drop from a terrace into the scree is a real fall (300-1,000, the engine's falling damage; Feather Fall none); scree slopes climb back to every terrace and ramp, none to the Anvil or the Hollow, so the test cannot be bypassed. The bowl's wall closes the room. Measured: the farthest scree is 4,189 from a way out (90 % within 3,010)."
  - id: set:test
    kind: boss
    spaces: [room:arena]
    rule: "D-58 C3 (a): the pedestal's 'Accept the test of Earth?' (A3's m38.test_earth) shows the three guardians, a hidden group until then, rising from the pit at (-3840, -1792): 1 Sleeper's Guardian of Earth (75), 2 Earth Blaster (70). Each guardian's death event calls Xeen.planeTestCheck(\"earth\", <the group>); when the three are dead it runs m38.test_earth_passed, which sets m38_earth_test (111766, P-1) and opens the gate. A party that leaves mid-fight finds the guardians still shown on return; the test is not offered again while they live."
    enabled_by: {map_var: test_accepted}
    gives:
      qbit: m38_earth_test
    population:
      - {id: pop:guardians, actors: [{actor: Sleeper's Guardian of Earth (11722), count: 1}, {actor: Earth Blaster (11721), count: 2}], placed: true, notes: "hidden until the test is accepted, at (-3840, -1792)"}
