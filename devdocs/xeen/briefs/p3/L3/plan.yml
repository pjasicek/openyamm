pitch: "The Plane of Earth of Xeen: a bowl of raw stone under a ceiling of brown dust, its walls leaning in like a cavern's. Terraces step down the pit past a quarry no one finished, a hall of split geodes and a field of stone pillars; at the bottom the Anvil, a floor of bare bedrock ringed by monoliths where the test of Earth waits, and below it, down the Root Stair, the Sleeper's Hollow."
