# The tribble door of the Olympus Sewer (DD-26, L4) across saves (D-65 change 2, Q58). A level-58 party of fighters at
# the landing before the bronze pair (the cistern cleared). The click asks with the voice's own line (aaze0038:5) and no
# message before it (B1). A wrong word: "Wrong! You may not pass!" (:8), the pair stays shut, 117805 clear. A save and a
# load. "Tribbles": "Correct! You may pass." (:9), 117805, both leaves open. A save and a load: still open; a click on
# the open pair asks nothing. Into the vault. Numbers are ids.lock.yml's (event 16 the door's landing side, doors 5 and
# 6 its leaves). Run with --world xeen --map xeen_dd26.blv (output/studio_cal/dd26/four.sh).
id: xeen.dd26.l4.password
title: Olympus Sewer (DD-26 L4), the tribble door wrong then right, kept open across saves
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_dd26.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 58, skills: [], equipment: {}}
          - {name: Hild, class: Paladin, level: 58, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 58, skills: [], equipment: {}}
          - {name: Sefa, class: Knight, level: 58, skills: [], equipment: {}}
  - setup_shortcut: {kind: immortal, value: true}
  - advance_runtime: {seconds: 2, present_dialogs: true}
  - play_lua: {source: "close()"}
  - set_pose: {map: xeen_dd26.blv, x: 2200, y: 2560, z: 0, yaw: 0.0, pitch: 0.0}
  - play_lua: {source: "clear_hostiles(3000)"}
  - advance_runtime: {seconds: 1}
  - walk_to: {x: 2900, y: 2560, z: 0, radius: 48, timeout_seconds: 20, close_dialogs: true}
  # A wrong word.
  - play_lua: {source: "if door_state(5) ~= 'closed' or door_state(6) ~= 'closed' then error('the bronze pair does not start shut') end; click(16); wait(0.5)"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "A disembodied voice booms, \"What's the password?\""}}
  - answer_input: {text: "Cyrano"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Wrong! You may not pass!"}}
  - play_lua: {source: "close(); wait(2); if door_state(5) ~= 'closed' or door_state(6) ~= 'closed' then error('a wrong word opened the pair') end; if qbit(117805) then error('tribble_door set by a wrong word') end"}
  - save_game: {name: dd26_wrong}
  - load_game: {name: dd26_wrong}
  - advance_runtime: {seconds: 1}
  - play_lua: {source: "close(); if door_state(5) ~= 'closed' or door_state(6) ~= 'closed' then error('the pair is open after the load') end; log('after wrong + load: ' .. party())"}
  # The word.
  - play_lua: {source: "click(16); wait(0.5)"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "What's the password?"}}
  - answer_input: {text: "Tribbles"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Correct! You may pass."}}
  - play_lua: {source: "close(); for _ = 1, 20 do if door_state(5) == 'open' and door_state(6) == 'open' then break end; wait(0.5) end; if not qbit(117805) then error('tribble_door not set') end; if door_state(5) ~= 'open' or door_state(6) ~= 'open' then error('the pair did not open: ' .. door_state(5) .. ' ' .. door_state(6)) end"}
  - save_game: {name: dd26_open}
  - load_game: {name: dd26_open}
  - advance_runtime: {seconds: 2}
  - play_lua: {source: "close(); if door_state(5) ~= 'open' or door_state(6) ~= 'open' then error('the pair shut after the load: ' .. door_state(5) .. ' ' .. door_state(6)) end; status(); click(16); wait(2); if door_state(5) ~= 'open' or door_state(6) ~= 'open' then error('a click shut the open pair') end; log('open pair click: ' .. status())"}
  # Into the vault.
  - walk_to: {x: 3400, y: 2560, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "clear_hostiles(2000); log('in the vault: ' .. party())"}
  - walk_to: {x: 3900, y: 2400, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
