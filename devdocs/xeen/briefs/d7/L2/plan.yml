set_pieces:
  - id: set:castaways
    kind: puzzle
    spaces: [room:sky_lake, room:stranded_west, room:stranded_south]
    rule: "Two bottles at the Sky Lake name the source squares A2 at 12,14 and C3 at 7,0; each is a small island with a strongbox, both out of the Megadragon's reach (D-58 D-2)."
    solution: Find the islands off the West Lookout and the Genie's Rock.
  - id: set:corners
    kind: scripted
    spaces: [room:fire_corner, room:air_corner, room:earth_corner, room:water_corner]
    rule: "corners.yml: each corner's tip asks 'What do you seek?' (the source's line); the element's name runs m38.corner_<element> and the map moves the party to its plane's entrance:d7_fall; another answer runs m38.corner_wrong. Each plane's way out returns to entrance:pN_return."
  - id: set:fall
    kind: scripted
    spaces: [void:cloud_sea]
    rule: "As X8 and X9: a one-second check moves a party below z -1,000 (and the room's floor at -6,000 catches the rest) through A3's Xeen.skyFall to the surface map under that part of the sky, at its entrance:d7_fall, with falling damage (about a third of a level-55 party's HP, D-6.2)."
  - id: set:megadragon
    kind: boss
    spaces: [room:roost]
    rule: "Q-D26 (optional): the Megadragon on Alamar's roof hatch. Its road leaves the Smoke Post with a 'DANGER! Mega Dragon' board; no other road comes within its breath. The hatch reads the source's lines until the key from its hoard opens it."
  - id: set:riddles
    kind: puzzle
    spaces: [room:smoke_post, room:north_crossing, room:steam_post, room:mud_wharf]
    rule: "The Merchants of the Elements: 'Between Fire and Air I constantly travel...What's my cargo?' smoke, dust (Air and Earth), steam (Fire and Water), mud (Water and Earth)."
    solution: "smoke, dust, steam, mud"
  - id: set:tolls
    kind: ambush
    spaces: [room:north_toll, room:mud_wharf, room:south_toll, room:west_toll]
    rule: "Sky bandits stop the party at four places, each with its own line of the source; pay and pass (once), or refuse and the two bandits there fight. Question 3."
