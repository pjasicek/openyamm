format: 0
level: L2
pitch: "The roads of the gods over the Darkside: a ring of cloud road round the whole sky with a corner at each element, floating Rest Stops along it, the sky bandits' tolls, the merchants of the elements with their riddles, and genies in lamps. Inside the ring, a road from the Dark Grove's rope crosses to Olympus on its marble cloud, past the Great Pyramid's sky door to the Sky Lake and its scarab sellers. Off a dead-end road in the north-west the Megadragon sleeps on Castle Alamar's roof."
purpose: "Act V-VI's sky map (party 55-58; reached after M30): M31 (Soul Storage in Olympus, the true-name plaque, the prophecy statues), M38 (the four corners to the planes P1-P4), Olympus' services and grandmasters, the side content of the Skyroads (Q-D26 the Megadragon, Q-D27's lamps, the riddles, the tolls, the scarabs, two castaways' strongboxes), DD-26's door, and the roof ways up from eight Darkside dungeons."
mood: "Amber and high: the Darkside's failing sun from above the clouds, the cloud sea below, white marble and gold in Olympus; deadpan signs along a highway in the sky ('Speeding??', 'Eat at Joe's'); polite robbers; the danger is played straight."
datum: zone:olympus
