  - id: evt:hatch_dd17
    preset: script
    source: platform:hatch_dd17
    title: Castle Alamar's roof hatch
    lua: |-
      if IsQBitSet(QBit(111662)) then
          if not XeenQuests.hook("q-d26.hatch") then return end
          evt.MoveToMap(-7744, 7168, 0, 0, 0, 0, 5062, 1, "xeen_fd01.blv")
          return
      end
      if not XeenQuests.hook("q-d26.hatch") then return end
      if not XeenQuests.can("m33.roof_arrival") then evt.StatusText("A voice, everywhere at once: \"Chosen Ones. You have nothing I need to fear.\" The ladder bucks, and you are back on the roof in the smoke.", 6) return end
      evt.MoveToMap(-2832, 2336, 1280, 0, 0, 0, 5050, 1, "xeen_dd17.blv")
    notes: "aaze0089:4-5; D-5: opens with the hoard's key (A3's Q-D26: its refusal line); F16: the entrance window (row 5050) into DD-17's entrance:d7_roof (FD-01's after m33.done, row 5062)."
