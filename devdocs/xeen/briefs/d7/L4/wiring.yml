  - id: evt:fall_check
    preset: script
    trigger: timer
    every: 1
    lua: |-
      local x, y, z = evt.GetPartyPosition()
      if z > -1000 then return end
      Xeen.skyFallD7()
    notes: "set:fall: a party under -1,000 has fallen off the roads; A3's Xeen.skyFallD7() picks the map below by the party's x, y (six zones, Q10) and sets it down at that map's entrance:d7_fall with falling damage."
  - id: evt:fall_floor
    preset: script
    source: room:air
    trigger: step
    lua: |-
      local x, y, z = evt.GetPartyPosition()
      Xeen.skyFallD7()
    notes: "The safety floor at -6,000: a fall the one-second check missed."
