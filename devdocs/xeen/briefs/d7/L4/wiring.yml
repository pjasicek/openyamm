  - id: evt:megadragon_death
    preset: script
    trigger: timer
    every: 2
    condition: {not: {qbit: qd26_slain}}
    lua: |-
      if evt.CheckMonstersKilled(ActorKillCheck.Group, 60, 0, false) then
          XeenQuests.hook("q-d26.slain")
          evt.SetMapVar("AmbientSound14", 2)
      end
    notes: "D-3: the Megadragon's death (its group) runs A3's q-d26.slain (sets slain, 113520) and switches sound:megadragon_sleep off (AmbientSound<key> 2)."
  - id: evt:megadragon_gone
    preset: script
    trigger: load
    condition: {qbit: qd26_slain}
    effects:
      - hide_actors: 60
      - lua: "evt.SetMapVar(\"AmbientSound14\", 2)"
    notes: "D-3: unique; once slain it stays gone (and its sleep sound off) through refills and a reset after a rebuild."
