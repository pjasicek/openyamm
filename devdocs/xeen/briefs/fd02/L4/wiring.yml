  - id: evt:swing_still
    preset: switch
    trigger: timer
    every: 1
    condition: {qbit: 118116}
    opens: [mover:swing_1, mover:swing_2, mover:swing_3, mover:swing_4]
    notes: "Paid (118116): the blades go back into their slots and stay there, in the same visit and on every load."
  - id: evt:swing_tick
    preset: switch
    trigger: timer
    every: 1
    condition: {not: {qbit: 118116}}
    toggles: [mover:swing_1, mover:swing_2, mover:swing_3, mover:swing_4]
    notes: "The Swinging Death's blades sweep out and back, alternate ones together, until protection is paid."
  - id: evt:table_boosts
    preset: script
    source: platform:table_s
    title: Embalmer's table
    lua: |-
      if XeenQuests.hook("m40.embalming_table") then
          evt.SetHeldItem(240, {bonus = 10}) evt.SetHeldItem(240, {bonus = 10})
      end
    notes: "D-57 Q10, D-22's pattern (XD-15): two Might Boosts of a fixed power 10, once per game (A3's m40.embalming_table sets embalming_boosts 118119 and says the line)."
  - id: evt:table_n
    preset: text
    source: platform:table_n
    title: Embalming table
    text: "Jars of resin and natron, hooks and linen. Nothing you want."
  - id: evt:throne
    preset: script
    source: deco:throne
    title: Throne of Legends
    effects:
      - lua: "XeenQuests.hook(\"m40.chair\")"
    notes: "aazex126:11 as the hover, A3's m40.chair (D-57 Q12): no reward."
