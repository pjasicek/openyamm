pitch: 'Picard the Aged''s home in the half-buried Southern Sphinx: a hall of embalming, two death runs whose toll-keepers
  sell protection, rune stones that spell a name, a stair that asks it, the old man''s library in the head, and under the
  sand a crypt of dragon mummies.'
purpose: 'M40 The Southern Sphinx: the runes (m40.runes) spell PICARD; the stair''s voice (m40.name_right, name_said 111800)
  opens the door of the name; Picard (npc 5704) trades the Chime of Opening for Halon''s widget (m40.done 111801). Party 58
  to 61, monsters 62-72 (26 placed, D-57 Q7), treasure 6.'
mood: 'Dry and still: sand on the steps, resin and old linen, blades whispering in the dark runs; above, an old man''s books
  in the light of two stone eyes; below, things too large for the arch.'
