format: 0
level: L1
pitch: "The Plane of Water of Xeen: a temple drowned in a sea with no shore, its colonnades standing out of green water under a sky the colour of the sea. Spray blows over the walks; a ship lies wrecked in the south court though there is no coast to wreck on. In the west the Whirlpool Court, where the test of Water turns in the pool, and beyond a falling veil of water, the Sleeper's Grotto."
purpose: "M38 (Act VI, party 56-60): the plaque (Step Four), the test of Water, the Water Sleeper (m38.sleeper_water, award 415) and the test's chest. Reached by stepping off D7's south-west corner after answering 'Water'; left by the waterspout at the arrival or the return dais by the sleeper, both to D7."
mood: "Cool, green and restless: the slap of waves on stone, spray in the light, the long hush of the swell. A shipwreck on a sea with no coast is the world's wink."
