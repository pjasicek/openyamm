set_pieces:
  - id: set:sea
    kind: trap
    spaces: [zone:sea]
    rule: "MM9's water rules (devdocs/mm9_rework/MM9_WATER_SWIMMING_DESIGN.md, already in the engine): surface swimming free, breath 15 s under, drowning 1/6 of maximum HP every 2 s; steps out along every walk and terrace; the walls of the Whirlpool Court and the Grotto stand 192-256 out of the water with no steps, so the test cannot be bypassed (P-2); past the stacks, edge volumes each with a constant inward `current` of 256 push swimmers back (the radial current is open engine work, not used). Nothing on the critical path needs swimming; no diving anywhere (Q2); Water Walk does nothing on a volume yet (recorded, accepted). Measured: the farthest sea is 5,432 from a way out (90 % within 3,605)."
  - id: set:test
    kind: boss
    spaces: [room:arena]
    rule: "D-58 C3 (a): the pedestal's 'Accept the test of Water?' (A3's m38.test_water) shows the three guardians, a hidden group until then, rising from the pit at (-4096, 1280): 1 Sleeper's Guardian of Water (75), 2 Tidal Terror (70). Each guardian's death event calls Xeen.planeTestCheck(\"water\", <the group>); when the three are dead it runs m38.test_water_passed, which sets m38_water_test (111767, P-1) and opens the gate. A party that leaves mid-fight finds the guardians still shown on return; the test is not offered again while they live."
    enabled_by: {map_var: test_accepted}
    gives:
      qbit: m38_water_test
    population:
      - {id: pop:guardians, actors: [{actor: Sleeper's Guardian of Water (11712), count: 1}, {actor: Tidal Terror (11711), count: 2}], placed: true, notes: "hidden until the test is accepted, at (-4096, 1280)"}
  - id: set:waves
    kind: trap
    spaces: [room:arena, room:reef, room:statue, room:wreck]
    rule: "The source's nine squares of freezing waves: wet stone where spray breaks over the walks (a small floor face each). Stepping on one: one time in three 50 cold damage to each member, 'A freezing wave breaks over you!' (resistance applies). PressurePlate faces textured `xpwspray`, each calling A3's planes.wave. Cells: at (3712, -256); at (4864, -1536); at (3968, 512); at (-128, -4608); at (1152, -3328); at (256, -5056); at (640, -256); at (-3712, 2688); at (-5248, 640). None on the critical path (measured 0 within 384 of the walk; 0 on a link, 2 in the arena)."
