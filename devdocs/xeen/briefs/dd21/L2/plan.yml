format: 0
level: L2
pitch: "A lich's crypt over a sewer. The crypt stair under D6's Necropolis comes down into Sandro's Hall of Biers; Sandro himself waits in his crypt, fights, falls and rises again, unable to die. Below, the Necropolis's sewer runs in a ring of channels round an outfall; a wheel upstream lifts the gate to the lowest culvert, where his heart beats in a jar of green glass over a black cistern. Bring it back and he is released."
purpose: "Side quest Q-D23 Sandro's Heart (QUESTS.md; Master Morbius 5506 sends the party): Sandro's first fall (q-d23.sandro), the heart (q-d23.heart), the release with the Key to the Dungeon of Death (q-d23.release), the ritual for Priests and Wizards first (q-d23.ritual: Priest of Dark, Lich). Class S, party 49-52, monsters 40-62, Sandro 65."
mood: "Tomb of Ethric's dark block stone and burial niches by candlelight above; below, Free Haven's wet sewer stone, ankle-deep sewage and the drip of the city's dead; at the bottom a green glow over black water."
datum: arrival
