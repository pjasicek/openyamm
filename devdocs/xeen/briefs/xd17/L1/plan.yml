    theme: "green valley floor (grass, flagstone lanes, packed earth by the doors), black basalt cliffs"
    population:
      - {id: pop:lacey, actor: "Lacey (monster 11915 Xeen Lacey, NPC 4719)", role: a white unicorn by the well, groups: 1, notes: "D-50 Q2: a placed peaceful actor on MM8's unicorn (Unicorn A), not counted; at [448, -384], wandering within 512 of her spot by the well. Her topic: 'The moons will align ...' (aaze0049:18), through A1's NPC-on-a-placed-monster word (D-47)."}
