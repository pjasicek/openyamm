format: 0
level: L1
pitch: "Beyond the last cave, cool air, and the smell of grass. A green valley in the black flank of Mount Firestone, ringed by cliffs, with a well that makes you better at everything and people who know the answers. The town is small and very pleased with itself."
purpose: "Act V's hidden town (Q-C26, party 48-52): five services from the source (D-5.1), the world's late Grandmasters in the Public Library, An Education and the hint people's houses, the +1 level well, the second travel pyramid (to Castle Alamar after M30), and a back way out to X7 that stays open once found."
mood: "Cool and bright after the Volcano Cave: high sun, green lawns, white plaster, water falling; the black rim and Firestone's smoke over it as a reminder of where you are."
datum: zone:court
spaces:
