    shape: "a slot of rock open to the sky, 384 wide, walls 1,500 high, bending once"
    at: [-6656, 3584]
    floor: [0, 128]
    purpose: "D-40 (3): the valley's back way to X7's cleft. Its far end is the inside of the rockfall: the first exit shifts the stones (xd17.cleft_opened) and the cleft is two-way after."
