format: 0
level: L1
pitch: "Castleview's sewer: a vaulted cross under the square where four drains meet, slow sewage channels down their middles, five iron ladders up to street grates of which only the square's hatch opens. West, the town's sluice house, its gate wedged open by gremlins with the mill's stolen gears, floods an old culvert below; Felix the Tinker, who dug his own tunnel, says as much, and Valio the Simple lives in a bed beside it. Shut the sluice and the culvert drains, rats and all: beyond it the rat queen's nest, Rooka and her hoard of shiny things, Nadia's necklace among them. The way back climbs through a bone midden and a drowned cellar to a floor grate bolted from below; the outfall's barred grate opens on the mill gorge once its bar is lifted."
purpose: "Story step M16 (QUESTS.md): Nadia's onyx necklace in the rats' nest (A3's hook m16.necklace). Side quest Q-D5: Valio wants Rooka the Queen Rat dead (q-d5.rooka at her death; his chest q-d5.valio_chest, opened early it angers him, q-d5.valio_angry). Class M, party 18-20, monsters 10-20, Rooka 24."
mood: "Damp and close: mossy cut stone with a green tide line, flags slick under sewage, lamplight falling down the shafts through round grates, the rats' caves of fallen brick, straw and filth."
datum: arrival
