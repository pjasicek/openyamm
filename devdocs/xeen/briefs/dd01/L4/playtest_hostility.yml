# Hostility check of the Castleview Sewer (DD-01), as XD-10's and XD-27's: its foes hostile to the party, its kinds not
# fighting each other. The kinds (all placed): Dire Rat 11393 (rats), Vampire Bat 11311 (night bats), Gremlin 11020
# and Gremlin Saboteur 11021 (gremlins), Wererat 11400 and Rooka the Rat Queen 11403 (sewer stalkers); Valio 11193
# placed hidden (a trap, not counted); the world's relations.yml decides between them. Run with --world xeen --map
# xeen_dd01.blv.
id: xeen.dd01.l4.hostility
title: 'the Castleview Sewer (DD-01): foes hostile to the party, no fights among them'
world: xeen
mode: faithful
steps:
- new_game_flow:
    start_map: xeen_dd01.blv
    party:
      gold: 0
      food: 20
      members:
      - {name: Brokk, class: Knight, level: 19, skills: [], equipment: {}}
      - {name: Hild, class: Cleric, level: 19, skills: [], equipment: {}}
      - {name: Ivar, class: Archer, level: 19, skills: [], equipment: {}}
      - {name: Sefa, class: Sorcerer, level: 19, skills: [], equipment: {}}
- setup_shortcut: {kind: immortal, value: true}
- advance_runtime: {seconds: 2}
- assert: {actor_count: {monster_id: 11393, hostile: false, max: 0}}
- assert: {actor_count: {monster_id: 11311, hostile: false, max: 0}}
- assert: {actor_count: {monster_id: 11020, hostile: false, max: 0}}
- assert: {actor_count: {monster_id: 11021, hostile: false, max: 0}}
- assert: {actor_count: {monster_id: 11400, hostile: false, max: 0}}
- assert: {actor_count: {monster_id: 11403, hostile: false, max: 0}}
- assert: {actor_count: {monster_id: 11393, hostile: true, min: 21, max: 21}}
- assert: {actor_count: {monster_id: 11311, hostile: true, min: 8, max: 8}}
- assert: {actor_count: {monster_id: 11020, hostile: true, min: 10, max: 10}}
- assert: {actor_count: {monster_id: 11021, hostile: true, min: 3, max: 3}}
- assert: {actor_count: {monster_id: 11400, hostile: true, min: 7, max: 7}}
- assert: {actor_count: {monster_id: 11403, hostile: true, min: 1, max: 1}}
- assert: {actor_count: {monster_id: 11193, min: 1, max: 1}}
- assert: {actor_count: {max: 51, min: 51}}
- note: 'Kinds of the map side by side in the drain cross, nearer each other than the party: they must not take each other on.'
- set_pose: {map: xeen_dd01.blv, x: 0, y: -400, z: 0, yaw: 1.5708, pitch: 0.0}
- clear_hostiles: {radius: 1500}
- console: {line: arena trace on}
- spawn_actor: {monster_id: 11400, x: -256, y: 480, z: 0}
- spawn_actor: {monster_id: 11393, x: -128, y: 480, z: 0}
- spawn_actor: {monster_id: 11311, x: 128, y: 480, z: 0}
- spawn_actor: {monster_id: 11020, x: 0, y: 520, z: 0}
- advance_runtime: {seconds: 12}
- assert: {ai_trace: {event: target, target: actor, max_count: 0, report: true}}
- assert: {ai_trace: {actor_index: last, event: target, target: party, min_count: 1}}
