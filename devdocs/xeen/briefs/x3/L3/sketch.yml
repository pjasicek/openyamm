    effects:
      - lua: "local v = evt.GetMapVar(\"x3_dial_2\", 6) if continueStep == 2 then v = v % 12 + 1 evt.SetMapVar(\"x3_dial_2\", v) if evt.GetMapVar(\"x3_dial_1\", 3) == 9 and evt.GetMapVar(\"x3_dial_2\", 6) == 9 and evt.GetMapVar(\"x3_dial_3\", 12) == 9 then SetQBit(QBit(112142)) else ClearQBit(QBit(112142)) end evt.StatusText(tr(\"The sundial is set to {reading}.\", {reading = v})) return end if continueStep ~= nil then return end AskChoiceWithAnswerSteps(eventId, 3, tr(\"The sundial is set to {reading}.  Turn?\", {reading = v}), {{Answer = \"Yes\", Step = 2}, {Answer = \"No\", Step = 3}})"
