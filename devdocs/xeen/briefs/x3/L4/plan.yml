format: 0
level: L3
pitch: "The swamp south of Burlock: a still green lagoon in dark marsh woods, a grey tower on a rock in it, a ruined castle on a rise, a vampire town that never sees the sun. In the east, where the road comes in from Rivercity, Ebenezer the taxman camps at the foot of Newcastle's rise selling the ruin; across the water Nightshadow sits in its mist. West the Black Fen drains the lagoon to the tundra; south-west the Gloomwood's dead trees hide the Tomb of a Thousand Terrors; south the Drowned Shore ends at the world's rim."
purpose: "Act II's castle map (party 13-16): the Newcastle chain (M8, M9, M11; XD-13), the Tomb (M10, XD-08), the Tower of High Magic (M13, XD-11, the way up to X8), Nightshadow's curse (Q-C7, XD-24) and Mirabeth (Q-C12). Services from day one at Ebenezer's camp."
mood: "Damp, green-grey and quiet; low light under a pale overcast, mist on the water at dawn. Frogs, reeds in the wind; Nightshadow silent in its fog; the camp's fire and hammering at the ruin."
datum: water:rim_sea
