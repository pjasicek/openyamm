  - id: evt:seal
    preset: script
    source: door:seal
    touch: true
    title: Shimmering air
    condition: {lua: "XeenQuests.can(\"m41.seal\")"}
    opens: [door:seal]
    effects:
      - lua: "XeenQuests.hook(\"m41.seal\")"
      - lua: "evt.PlaySoundName(\"xeen_mirror_shatter\", 0, 1472, 2400)"
    else_effects:
      - lua: "XeenQuests.hook(\"m41.seal\")"
    notes: "Clicked or walked into: A3's m41.seal (with the Chime: taken, seal_broken 111820, 27,000; without: 'An invisible seal prevents passage.'; after: the else_text); the leaf opens in the same visit."
  - id: evt:seal_load
    preset: switch
    trigger: load
    condition: {qbit: seal_broken}
    opens: [door:seal]
    notes: With seal_broken the roof stair is open on every load (D-57 Q21).
  - id: evt:skull
    preset: text
    source: platform:skull
    title: Skull
    text: The skull is silent.
    notes: "aazex116:15 (the riddle 9-14 dropped by A3; D-57 Q18)."
  - id: evt:slab3
    preset: switch
    trigger: timer
    every: 1
    condition: {all: [{qbit: ground_l3w}, {qbit: ground_l3e}, {not: {map_var: slab3_sent}}]}
    opens: [mover:slab3]
    sets: {map_var: slab3_sent}
    notes: "Both twin gongs rung: the slab rises out of the floor to the top in the same visit (a second after the second gong; movers are named only by presets, so the gongs' own handlers cannot test the other bit)."
  - id: evt:slab3_load
    preset: switch
    trigger: load
    condition: {all: [{qbit: ground_l3w}, {qbit: ground_l3e}]}
    opens: [mover:slab3]
    sets: {map_var: slab3_sent}
    notes: "Both bits: the L3 slab is up on every load."
  - id: evt:top1
    preset: script
    source: platform:top1
    trigger: step
    condition: {not: {qbit: ground_l1}}
    effects:
      - lua: "XeenQuests.hook(\"m41.gong_voice\")"
    notes: "The top step's plate before the gong: the voice's line (aazex113:2, A3's m41.gong_voice called, not re-typed), so the party knows what is missing."
  - id: evt:top2
    preset: script
    source: platform:top2
    trigger: step
    condition: {not: {qbit: ground_l2}}
    effects:
      - lua: "XeenQuests.hook(\"m41.gong_voice\")"
    notes: "The top step's plate before the gong: the voice's line (aazex113:2, A3's m41.gong_voice called, not re-typed), so the party knows what is missing."
  - id: evt:top3
    preset: script
    source: platform:top3
    trigger: step
    condition: {not: {all: [{qbit: ground_l3w}, {qbit: ground_l3e}]}}
    effects:
      - lua: "XeenQuests.hook(\"m41.gong_voice\")"
    notes: "The top step's plate before the gong: the voice's line (aazex113:2, A3's m41.gong_voice called, not re-typed), so the party knows what is missing."
  - id: evt:vault_load
    preset: switch
    trigger: load
    condition: {qbit: vault_open}
    opens: [door:force]
    notes: The force stays down on every load with 118124.
  - id: evt:vault_open
    preset: switch
    trigger: timer
    every: 1
    condition: {all: [{not: {qbit: vault_open}}, {lua: "evt.IsMapActorDead(ActorIndex(\"monster:onyx\"))"}]}
    opens: [door:force]
    effects:
      - qbit: vault_open
    notes: "The Onyx Golem's death drops the vault's force in the same visit (map qbit 118124, D-57 Q18)."
  - id: evt:way_out
    preset: exit
    source: exit:door
    title: Exit Darkstone Tower
    notes: "Out to X5 (installed, A6) through the game's leave window (D-24; meaning aazex113:0 'Exit Darkstone Tower?'), at X5's entrance:fd03_door's coordinates (-4608, 2560, 1504) facing 512 until the name is in X5's scene (A6)."
