  - id: evt:arrive
    preset: text
    trigger: timer
    every: 1
    once: true
    text: "Darkstone Tower: black stone, polished like a mirror. Far above, the stair to the Clouds of the Ancients."
    seconds: 6
    notes: "The arrival line (a new map line, no source text): the errand (M41) and where it goes."
