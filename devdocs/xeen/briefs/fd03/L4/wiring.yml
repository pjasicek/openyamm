    notes: "aazex116:0, while the force is up."
  - id: evt:gong1
    preset: script
    source: panel:gong1
    title: Gong
    condition: {not: {qbit: ground_l1}}
    opens: [mover:slab1]
    effects:
      - qbit: ground_l1
      - lua: "evt.PlaySoundName(\"xeen_gong\", 896, 0, 256)"
      - show_actors: 21
      - lua: "XeenQuests.hook(\"m41.gong_voice\")"
      - lua: "evt.PlaySoundName(\"6stone door0101\", 896, 0, 256)"
    else_effects:
      - lua: "evt.PlaySoundName(\"xeen_gong\", 896, 0, 256)"
      - lua: "XeenQuests.hook(\"m41.gong_voice\")"
    notes: "The gong (hover 'Gong', aazex113-116:1): m41.gong_voice, its two hidden guards shown (group 21, D-18), and mover:slab1 raised (map qbit 118120, D-57 Q15). A second ring: the voice only."
  - id: evt:gong1_load
    preset: switch
    trigger: load
    condition: {qbit: ground_l1}
    opens: [mover:slab1]
    effects:
      - show_actors: 21
    notes: "With 118120 the ground stays up and the guards shown on every load (D-56, D-57)."
