  - id: evt:hatch
    preset: script
    source: exit:hatch
    title: Climb to the Clouds of the Ancients
    lua: "evt.MoveToMap(4608, -3968, 0, 512, 0, 0, 0, 1, \"xeen_p5.blv\")"
    notes: "F16 (2026-11-22): the game's standard entrance window (OK/Close) in place of the map's old Yes/No. Was: Up to P5 (A5's open-air BLV, installed 06:41 with entrance:fd03_roof): the map's own Yes/No with A3's m41.roof_exit question 'Climb to the Clouds of the Ancients?' (D-66: a roof or hatch exit into a BLV asks, as DD-15, DD-08 and FD-04 do; no hook, so no text before it, D-65), then on Yes at once to P5's entrance:fd03_roof [4608, -3968, 0] facing north (the coordinates are P5's named arrival, written out because the move waits on the answer)."
  - id: evt:head_1
    preset: script
    source: panel:head_1
    title: Head
    effects:
      - set:
          var:
            map_var: plaque4_1
          value: 1
      - lua: |-
          if IsAtLeast(MapVar(plaque4_1), 1) and IsAtLeast(MapVar(plaque4_2), 1) and IsAtLeast(MapVar(plaque4_3), 1) and IsAtLeast(MapVar(plaque4_4), 1) and not IsAtLeast(MapVar(summary4), 1) then
              SetValue(MapVar(summary4), 1)
              evt.StatusText("Head 13 speaks: T-MEOE-FENN-TEAO", 6)
              XeenQuests.hook("m41.plaques_l4")
          else
              evt.SimpleMessage("Head 13 speaks: T-MEOE-FENN-TEAO")
          end
    notes: "aazex116:3 verbatim (the row, map text; D-57 Q17, D-63 9): a window; the click that completes the storey's four shows the row in the status line and A3's m41.plaques_l4 window (two windows in one handler show only the first)."
