notes: "Xeen design brief, level L3, for a new map (no original to rebuild). Story step M3, second half (devdocs/xeen/QUESTS.md): kill the Clan King. Encounter slots are Xeen families from devdocs/xeen/MONSTERS_AND_ITEMS.md: 1 Mad Dwarves (Mad Dwarf 7, Clan Sergeant 12), 2 Spiders (10 / 14), 3 Burrowers (Tiger Mole 9); Bat Queens (Bats rank b, 10) and the Clan King (18) are placed. Monster levels 7 to 18 (the brief keeps the rank-a Mad Dwarf at 7, one below MAPS.md's 8-18). Provisional ids: map_stats row 9133, qbits 110030-110031, item 12021 (Xeen ranges, devdocs/xeen/PRODUCTION.md); none registered. Size class S as in MAPS.md (QUESTS.md M3 says M). Reached only from XD-02 by cart until the escape shaft is opened. L2: the footprint is the L3 sketch's (about 8,000 x 8,100 with the caves and the shaft); `music` and `environment` are names for the Xeen world's tables, which do not exist yet: the game reads `music` as a track number and refuses the map until it is one."
