notes: "L3 sketch of the Deep Mine (XD-03), a new design: whole map units, x east and y north, origin at the south-west corner of the geode's lower terrace (the Red Dwarf vault lies west of it, at negative x). Heights are absolute against the plan's datum, the arrival: the deep landing's floor is 0, the hold's floor -512, the low caves -768. The footprint is about 8,000 x 8,100 (16 x 16 cells of 512) and the floor area about 21.6 M units^2. A plan space is one room except where a flight, a ramp or a sunken floor must be a room of its own: the gong gallery (gallery and its flight), the sentry cut (path, lookout niche, ramp), the furnace hall (near bank, far bank, two bridges, stair foot), the slag channel (three reaches and the drain), the barracks (hall, lever alcove, back stair), the furnace tower (stair and tower), the King's hall (hall, two gutters, dais steps, throne dais), the geode grotto (breach, descent, upper terrace, steps, lower terrace) and the mole warren (mouth and warren). The extra rooms name their space; openings inside one space carry no plan link (R3-V4). Walls are 64 thick wherever two rooms are joined through a wall, and 0 where one space is split into rooms that must read as one floor (the hall's banks, bridges and slag; the King's hall, gutters and dais). The 16 units of wall the build keeps at each side of an opening stand as thin stubs at the ends of the slag ledges and the bridge ends (R3-K9). Openings are placed by the build on the longest facing pair of walls, so every flight and ramp is drawn with no wall of a room it joins running alongside it within 512, and the dais flight is wider than it is deep. Every floor change on the critical path is a flight, a ramp or a level doorway: risers are 32 (12-step flights of tread 40 for the gallery and back stair, 8 of tread 48 to the tower, 6 of 48 for the dais, 4 of 48 in the geode), ramps rise at most 0.5 of their run, platforms rise 32 to 40. The deliberate drops are the slag ledges (128, out by the drain) and the gallery windows (a 96 sill, 384 above the hall). Still not drawable: the cracked geode dome over the King's hall and its glitter (void:geode_dome; R3-K5, R3-K7), the Deep Line's rails falling out of the landing's roof and the cut and burrows as round or rough tunnels (R3-K5, uneven relief), the gallery overhanging the hall (R3-K7), the gutters' dry look before the King's second phase (one floor surface per room; a texture swap by event), the vault's rune ring (a floor decal), door leaves, bars, levers, the gong, the cage and all furniture (objects and decorations, not shell). The arrival is the plan's cart entrance: without objects.yml the build puts it in the middle of the landing, facing north. Checked: oymap validate and build --dry-run; a scratch copy built, mounted under mm6 and walked in the game from the landing through every room to the escape shaft, into both reaches of slag and out again (all 37 rooms reached)."
