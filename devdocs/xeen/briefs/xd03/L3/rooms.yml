format: 0
themes:
  - id: theme:clan_hold
    wall: {texture: d2wlactr, size: [128, 256]}
    floor: {texture: 7tfb11, size: [128, 128]}
    ceiling: {texture: d2ceil3, size: [256, 256]}
    reveal: {texture: vlctrm3, size: [128, 128]}
    door: {texture: d2lgdor, size: [256, 256]}
    notes: "The clan's hold (L2): soot-blackened dwarven brick, dark flagstones, rough rock overhead, carved rune stone in the doorways, the studded skull door. Gong gallery and its two flights, stair foot, barracks and lever alcove, armoury, antechamber."
  - id: theme:dwarf_vault
    wall: {texture: 7cdb, size: [128, 256]}
    floor: {texture: 7tfb11, size: [128, 128]}
    ceiling: {texture: d2ceil3, size: [256, 256]}
    reveal: {texture: vlctrm3, size: [128, 128]}
    notes: "Red Dwarf work (L2): the older olive-grey dwarven blocks, dark flagstones, rune stone round the doorway. The Red Dwarf vault."
  - id: theme:forge_floor
    wall: {texture: d2wlactr, size: [128, 256]}
    floor: {texture: vlcflorc, size: [128, 128]}
    ceiling: {texture: d2ceil3, size: [256, 256]}
    reveal: {texture: vlctrm3, size: [128, 128]}
    door: {texture: d2lgdor, size: [256, 256]}
    notes: "Furnace hall (L2): the same soot-black brick over flagstones cracked by heat, the slag glow in their seams. Both banks, both bridges, the furnace tower and its stair."
  - id: theme:geode
    wall: {texture: orwtrlga, size: [256, 256]}
    floor: {texture: vlcflord, size: [128, 128]}
    ceiling: {texture: orwtrlga, size: [256, 256]}
    notes: "Geode (L2): blue-green crystal walls and crown, a floor of crushed blue crystal. Geode grotto, its terrace steps and lower terrace."
  - id: theme:hoard
    wall: {texture: cwb1gold, size: [128, 256]}
    floor: {texture: ctflor1, size: [128, 128]}
    ceiling: {texture: d2ceil3, size: [256, 256]}
    reveal: {texture: vlctrm3, size: [128, 128]}
    door: {texture: d2lgdor, size: [256, 256]}
    notes: "The King's hoard (L2): raw rock shot with gold veins, the hall's red inlay floor. Hoard and escape shaft."
  - id: theme:king_hall
    wall: {texture: ctwl5, size: [256, 256]}
    floor: {texture: ctflor1, size: [128, 128]}
    ceiling: {texture: orwtrlga, size: [256, 256]}
    reveal: {texture: vlctrm3, size: [128, 128]}
    door: {texture: d2lgdor, size: [256, 256]}
    notes: "The Clan King's hall (L2): dressed red-brown stone blocks, a floor of red stone inlay, the geode's crystal overhead (the cracked dome, drawn flat). King's hall, dais steps and throne dais."
  - id: theme:rock_cut
    wall: {texture: cwb1, size: [128, 256]}
    floor: {texture: cfb1, size: [128, 128]}
    ceiling: {texture: d2ceil3, size: [256, 256]}
    notes: "Raw rock (L2): red-brown rock walls and floor, rough rock overhead. Deep landing, sentry cut with its lookout and ramp, the breach and the drop to the geode, the burrow mouth and the mole warren."
  - id: theme:slag
    wall: {texture: vlcceila, size: [128, 128]}
    floor: {texture: lava, size: [256, 256]}
    ceiling: {texture: d2ceil3, size: [256, 256]}
    notes: "Slag (L2): cooled slag crust glowing in its cracks on the walls, molten slag underfoot (harmful floor). The channel's three reaches and its drain; the King's two gutters."
defaults: {theme: theme:clan_hold, ambient: 16}
