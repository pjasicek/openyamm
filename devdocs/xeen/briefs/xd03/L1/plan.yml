format: 0
level: L1
pitch: "Below the Red Dwarf Mines the Mad Dwarf Clan has carved itself a stronghold around an old smelter. The Deep Line cart stops at a landing; a sentry cut leads to a gallery with a great gong, looking down on the Furnace Hall, where a channel of glowing slag splits the floor and two narrow bridges cross it. The King's Gate is barred twice: one bar is worked from a lever in the sergeants' barracks, the other from a lever in a little tower across the slag. Behind it the Clan King holds court in a six-sided hall under a cracked geode roof, on an anvil throne at the top of a stepped dais. His key opens the hoard behind the throne and the counterweight shaft he kept for his own escape, straight up to the hills of Vertigo. A side grotto of crystal and webs hides the Red Dwarves' first vault."
purpose: "Story step M3, second half: kill the Clan King (the kill sets the quest bit; Mayor Gunther gives the Red Dwarf Badge on X1). Short, dense and harder than XD-02: clan sergeants, spiders at their middle and top ranks, tiger moles, bat queens, and a boss with a second phase. Optional: gems in the geode grotto and the hidden Red Dwarf vault. Monster levels 7 to 18; a party of about level 8 to 10."
mood: "Hot and red: slag glow from below, soot, the clang of the gong. The geode grotto is the cold blue exception; the King's hall is the climax, glittering and brutal."
datum: arrival
