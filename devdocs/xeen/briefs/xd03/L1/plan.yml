notes: "Size S at the top of its band (about 34 monsters in about 17 sectors, 2 per sector) because it is the Act I mine's finale. Most fighters are placed: sergeants and the King are characters of the hold, not spawns. Distribution: nothing at the landing; light in the sentry cut; the alarm fight at the gong; packs on both sides of the slag; the barracks heavy if alarmed; quiet armoury, vault and hoard; the boss room heaviest. Non-orthogonal: the zig-zag cut, curved gallery, bent hall with a diagonal channel, round tower, six-sided hall, wedge antechamber, trapezoid hoard, round vault, geode and burrows. Risers are 32 (the dais is six steps); the lowest ceiling is 384."
