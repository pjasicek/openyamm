set_pieces:
  - id: set:clan_king
    kind: boss
    spaces: [room:king_hall]
    rule: "The Clan King fights from the dais with his guard. At half health he kicks over the forge braziers beside the throne: slag pours down the two side gutters, which become harmful floor for the rest of the fight (and stay so), and he comes down off the dais. He drops his key. His death sets the quest bit."
    inputs: [the King's health]
    states: [on the dais, second phase (gutters burning), dead]
    gives:
      qbit: clan_king_slain
    population:
      - {actor: Clan King, role: boss, groups: 1, levels: [18, 18], placed: true, strength: boss, drops: clan_king_key}
  - id: set:gong_alarm
    kind: ambush
    spaces: [room:gong_gallery, room:furnace_hall, room:barracks]
    rule: "If the gong sentry lives for a few seconds after seeing the party, he rings the gong: the barracks doors burst open and the sergeants come round by the hall and up the back stair. Killing him first keeps the barracks shut and asleep until opened. Ringing it later does the same."
    inputs: [sentry sees the party, sentry killed, gong rung]
    states: [quiet, alarm rung]
    gives:
      map_var: alarm_rung
  - id: set:kings_gate
    kind: puzzle
    spaces: [room:barracks, room:furnace_tower, room:kings_antechamber]
    rule: "The King's Gate has two bars. Lever A (barracks) lifts one, lever B (furnace tower, over the north bridge) the other; the gate opens only with both lifted. Each lever clanks and its bar is seen rising from the antechamber."
    inputs: [lever A, lever B]
    states: [both down, one up, both up (gate opens)]
    solution: "Throw both levers, in either order."
  - id: set:slag_channel
    kind: trap
    spaces: [room:furnace_hall, zone:slag_channel]
    effect: {damage: "fire, per moment in the slag"}
    rule: "The slag channel is harmful floor (fire damage each moment in it). The bridges have no rails; a party knocked or stepping off falls 128 in and climbs out by the ramp at the channel's south end."
