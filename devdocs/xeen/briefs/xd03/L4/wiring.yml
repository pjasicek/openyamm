          var:
            map_var: alarm_rung
          value: 1
      - lights_on: [light:barracks_1, light:barracks_2, light:barracks_3]
      - lua: "evt.CameraShake(0.4, 0.8); evt.PlaySound(42682, 4912, 3640)"
    else_effects:
