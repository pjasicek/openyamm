notes: "L4 (2026-11-13): this is L3's plan unchanged in its spaces, links, keys and set pieces; the L4 shell (rooms.yml) builds it with the studio's words of 2026-11-13 and departs from L3's sketch where NOTES.md says (the gong gallery as a balcony inside the furnace hall, the slag channel as one sunken level with hanging bridges, the drain as steps, the stepped dais and throne floor inside the King's hall, a door at the back stair's foot, the Deep Line's last pitch as a cart ride). Level L2 of a new design (no original). Sizes, areas and extents are measured on the L3 sketch, every room of a space included (size classes by floor area: XS under 0.15 M units², S 0.15-0.5, M 0.5-1.5, L 1.5-3, XL over 3); the furnace hall's 5.2 leaves out its slag channel (0.9). Several L1 size classes were one step below their own extents (landing, gallery, barracks, antechamber, hoard, vault, shaft); L2 follows the measured areas. The sketch splits the furnace hall, the channel, the King's hall and every flight into several rooms, so it builds 37 sectors for 14 plan rooms; monsters per sector (about 1) is not comparable with the MM census. Light numbers are lights per million square units of floor, by room class: hold rooms 3 to 4 (iron wall torches trchb00, the barracks pair trchb00/nwtrchnf lit by the alarm), the furnace hall 2 (six low slag lights along the channel without visible sources, four flambeaux, the furnace mouth), the King's hall 2 (eight braziers), rock cut and landing 2 to 2.5 (torch01, the iron lantern torch02), geode and vault 2 to 3 (pulsing crystals crystl0 and mcryst01), the hoard 1.5 (one lantern), the burrows and the escape shaft unlit; 42 lights in all. Themes name texture families from the shared library (level_generation/textures_x4/inventory.json, worlds noted) and decorations of the engine's indoor bindings (assets_dev/engine/models/indoor_decorations.yml); 16 texture keys in all, one main wall (d2wlactr). Missing from the shared libraries: a weapon rack, a gong, a mine cart, a lever and a stone lectern (placeholders until made). Treasure: the map card's level 2, one step up (tier 3) for the King and his hoard; gold amounts are in notes (R4-X6). Population as L1, refined to ranks and places; about 34 monsters. Doors: the gate, the barracks double door, three hinged doors, the hoard door and the crystal wall. Design changes against L1, made while drawing the L3 sketch: the barracks and armoury moved to the north-east (the barracks-gallery loop cannot pass round the hall without stacked rooms), the furnace tower to the far bank's west wall, the channel's head closed by a broad span against the north wall with stone steps out of the main reach (no reach of slag without a way out), the geode reached through a breach in the west wall that also takes the drain, the gallery shortened to 768 with straight flights, the King's hall a coffin-shaped hexagon with its dais beyond the north wall and its gutters 32 deep."
