    atmosphere: "The hall's light turns from brazier gold to slag red; a hiss and a roar as the slag runs; the camera shakes once."
    notes: "Set by the King's script at half health (set:clan_king); the map variable is undeclared (R4-X7)."
atmosphere: "Music: the map card's deep-cave track, all through. Sound: the slag bubbling and hissing along the channel (placed ambient loops, the lava loop sound, on its banks), the cold smelter's draught, far hammering and voices in the hold until the alarm, then the gong's boom; a high crystal hum in the geode; wind sighing down the escape shaft. Light: hot red-orange from below in the furnace hall (low lights over the slag without visible sources, the flambeaux, the glowing furnace mouth), warm iron torches in the hold, the barracks dark until the alarm, brazier gold under the glittering crystal in the King's hall turning slag red in the second phase, a cold blue pulse in the geode and the vault, the burrows black. No fog; a faint heat shimmer is not asked for."
