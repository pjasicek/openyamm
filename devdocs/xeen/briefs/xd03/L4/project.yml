notes: "Xeen design brief, level L4: L3's plan redrawn with the studio's words of 2026-11-13, surfaces, objects and wiring; a playable map (NOTES.md). Story step M3, second half (devdocs/xeen/QUESTS.md): kill the Clan King. The Xeen world has no package, monsters or items yet, so this L4 is built and played as an MM7 map, as XD-01 and XD-02 are: `world: mm7` until worlds/xeen exists (one line to change back). Stand-ins: slot 1 Mad Dwarves (Mad Dwarf 7, Clan Sergeant 12) is MM7's Dwarf family (Dwarven Soldier 10), slot 2 Spiders (10 / 14) the Spider family at tier 3 (Venomous Spider 8, Widowmaker 12), slot 3 Burrowers (Tiger Mole 9) the Troglodyte family (Troglodyte Drone 9); the placed Clan Sergeants are Dwarven Soldiers by name, the Clan King (18) a Dwarven Lieutenant (230, level 20) with hit points of his own and a name, the Bat Queens (10) Inferno Bats (207, level 9). The King's key 12021 is MM7's Key to Snergle's Chambers (2108). Treasure level 3 (the brief's 2, one step up as the brief asks for the King and his hoard; the hold's chests say their own levels). Quest bits keep their provisional Xeen numbers (110030-110031). Music: MM7 cave track 18 for the brief's cave_deep, which the game refuses. Both neighbours point at Emerald Island until XD-02 and X1 are mounted beside this map."
