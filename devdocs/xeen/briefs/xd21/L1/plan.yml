set_pieces:
  - id: set:drawbridge
    kind: scripted
    spaces: [room:undercroft]
    rule: "The plank bridge is drawn back to the east bank. Its winch is on the east bank; once run out it stays."
    inputs: [the winch]
    states: [drawn back, out]
    gives:
      map_var: bridge_out
  - id: set:robber_boss
    kind: boss
    spaces: [room:boss_quarters]
    rule: "The Robber Boss and his two bodyguards hold his rooms; his lieutenants come from the far end. He carries the ring of keys."
    population:
      - {actor: Robber Boss, role: boss, groups: 1, levels: [18, 18], placed: true, strength: boss}
  - id: set:strongroom_traps
    kind: trap
    spaces: [room:strongroom_walk, room:boss_quarters]
    rule: "Each of three slabs in the passage fires darts at the whole party, every time, until the catch by the hearth is thrown. The ledger on the boss's desk says so."
    inputs: [the catch]
    states: [armed, locked]
    solution: "Read the ledger; throw the catch."
  - id: set:tripwire
    kind: trap
    spaces: [room:crawl]
    rule: A tripwire fires a bolt once.
