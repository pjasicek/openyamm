notes: "Xeen design brief, level L4: the Robbers' Den under Rivercity's great bridge (Q-C3 Princess Roxanne's tiara, promotion T1-E), a playable map (NOTES.md). Built and played as an MM7 map (`world: mm7`), as XD-01 to XD-05 and X1, until worlds/xeen exists. Stand-ins: slot 1 Outlaws (Rogue 12, Thief 18) is MM7's Thief family at tiers b and c (Rogue 12, Master Thief 18), slot 2 Xeen's Robbers is MM7's Fighter Leather family at tier b (Raider 14); the Robber Boss is a Master Thief (408) with the name and the vault's keys, his bodyguards Raiders (257). Items: roxannes_tiara 12150 is MM7's Noble Crown (900), ring_of_keys 12151 MM8's Ring of Keys (629). Quest bits are Xeen numbers (110300-110303). Music: MM7 dungeon track 18. The one neighbour is X2's door:xd21 (DOORS.md, provisional)."
