# Hostility check of the Robbers' Den (XD-21) (written by output/studio_cal/hostility/gen_hostility_tests.py; devdocs/xeen/ACT2_BUILD.md, "Hostility pass"):
# its foes hostile to the party, its peaceful ones peaceful, its kinds not fighting each other.
id: xeen.xd21.l4.hostility
title: 'the Robbers'' Den (XD-21): foes hostile to the party, no fights among them'
world: mm7
mode: faithful
steps:
- new_game_flow:
    start_map: xeen_xd21.blv
    party:
      gold: 0
      food: 20
      members:
      - name: Brokk
        class: Knight
        level: 10
        skills: []
        equipment: {}
      - name: Hild
        class: Cleric
        level: 10
        skills: []
        equipment: {}
      - name: Ivar
        class: Archer
        level: 10
        skills: []
        equipment: {}
      - name: Sefa
        class: Sorcerer
        level: 10
        skills: []
        equipment: {}
- setup_shortcut:
    kind: immortal
    value: true
- note: The map entry events run (the build's evt:studio_relations sets the map's relations).
- advance_runtime:
    seconds: 2
- assert:
    actor_count:
      monster_id: 406
      hostile: false
      max: 0
- assert:
    actor_count:
      monster_id: 407
      hostile: false
      max: 0
- assert:
    actor_count:
      monster_id: 408
      hostile: false
      max: 0
- assert:
    actor_count:
      monster_id: 256
      hostile: false
      max: 0
- assert:
    actor_count:
      monster_id: 257
      hostile: false
      max: 0
- assert:
    actor_count:
      monster_id: 258
      hostile: false
      max: 0
- assert:
    actor_count:
      monster_id: 407
      hostile: true
      min: 1
- assert:
    actor_count:
      monster_id: 408
      hostile: true
      min: 1
- note: 'Kinds of the map side by side, nearer each other than the party (a monster takes the nearest of its foes): they must
    not take each other on.'
- console:
    line: arena trace on
- spawn_actor:
    monster_id: 407
    x: -2400
    y: 900
    z: 0
- spawn_actor:
    monster_id: 257
    x: -2304
    y: 900
    z: 0
- advance_runtime:
    seconds: 12
- assert:
    ai_trace:
      event: target
      target: actor
      max_count: 0
      report: true
- assert:
    ai_trace:
      actor_index: last
      event: target
      target: party
      min_count: 1
- assert:
    actor_count:
      monster_id: 407
      hurt: true
      max: 0
- assert:
    actor_count:
      monster_id: 257
      hurt: true
      max: 0
