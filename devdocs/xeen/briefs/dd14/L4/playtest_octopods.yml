# The black cistern's octopods (DD-14, D-42 (4), D-52 (5)): A2's indoor Octopod D (11473: no swimmer AI, stationary),
# five of them just inside the pool's edge. From the bank (west, south, north) or the far ledge (east) by each, the
# octopod hits the party (trace `impact`) and the party's attack hurts it (trace `damaged`). Actor indices 9-13 are the
# built scene's octopods (objects.yml's monsters sorted by id). Run with --world xeen --map xeen_dd14.blv
# (output/studio_cal/dd14/four.sh, in its default list). The party: four Knights with swords (fists rarely hit) and an
# accuracy bonus (octopods' armour 36); the arrival window is skipped (117480); the
# octopod's touch leaves members unable to act, so each press of Attack follows a cure (the reach is what is tested).
id: xeen.dd14.l4.octopods
title: Castle Blackfang (DD-14 L4), the cistern's octopods reached and hitting back
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_dd14.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 42, skills: [{name: Sword, level: 20, mastery: 3}], equipment: {}}
          - {name: Hild, class: Knight, level: 42, skills: [{name: Sword, level: 20, mastery: 3}], equipment: {}}
          - {name: Ivar, class: Knight, level: 42, skills: [{name: Sword, level: 20, mastery: 3}], equipment: {}}
