format: 0
level: L3
pitch: "A black castle on a crag in a storm of bats, entered from the sky: Ambrose's griffin sets the party down on the south wall walk, where coffins stand in a row with their lids ajar. The party fights down through the towers and the upper floor (the sleeping hall's coffins open on sleepers) to the Count's hall, and his death lifts the bar on the stair into the crag, where the Queen of the Darkside, made a vampire, waits in a cell she will not leave. Ambrose waits on the walls to fly the party out."
purpose: "Story M27 (QUESTS.md): kill Count Blackfang (m27.blackfang) to open the dungeon stair (m27.dungeon_stair), find the Queen (m27.queen_cell: 3-31-62), fetch her crown from DD-03 and bring it back (m27.ambrose_return flies everyone to D1). Ambrose flies the party in and out (m25.gate_flight, m27.fly_out). Class M (large: 70 monsters), party 39-42, monsters 38-58, Count Blackfang 70."
mood: "Wind and bats over black battlements; inside, Castle Navan's green stone and coffered ceilings gone cold and unlit but for candles nobody living needs; below, Zokarr's dressed stone, iron doors and black water."
datum: arrival
