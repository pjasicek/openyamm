  - id: evt:count_dead
    preset: script
    trigger: timer
    every: 2
    condition: {kills: {monster: monster:count}}
    lua: |-
      XeenQuests.hook("m27.blackfang")
      evt.PlaySoundName("xeen_coffin_lid")
    once: true
    notes: "goal:count: his death runs A3's m27.blackfang (blackfang_slain 111540, once: 'every coffin lid in the castle slams shut at once ...'); the lids' sound."
  - id: evt:crest_great
    preset: text
    source: panel:crest_great
    title: Blackfang's arms
    text: "A black bat with one red fang on slate grey: the arms of Blackfang."
    window: false
    notes: xbfcrest on the great hall's end wall.
