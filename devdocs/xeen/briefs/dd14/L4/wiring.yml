  - id: evt:gong
    preset: script
    source: panel:gong
    title: Gong
    condition: {not: {map_var: study_open}}
    opens: [door:study_panel]
    effects:
      - lua: "evt.PlaySoundName(\"xeen_gong\")"
      - set:
          var:
            map_var: study_open
          value: 1
      - text: You hear a rumbling in the distance.
    else_effects:
      - lua: "evt.PlaySoundName(\"xeen_gong\")"
      - text: You hear a rumbling in the distance.
    notes: "poi:gong (dark/aaze0045:6-7): the first stroke slides open the study's panel on L2 (study_open), for good."
  - id: evt:griffin_load
    preset: script
    trigger: load
    condition: {qbit: m25_done}
    effects:
      - show_actors: 30
    else_effects:
      - hide_actors: 30
    notes: "Ambrose's griffin stands on its perch from m25.done (111503) on, on every load (D-42 Q1)."
  - id: evt:hatch
    preset: switch
    source: mover:hatch
    title: Trapdoor
    condition: {not: {map_var: hatch_open}}
    locked_text: The trapdoor lies open over a ladder.
    effects:
      - text: "A trapdoor in the floor, bolted from below."
    notes: "From the cellar: 'A trapdoor in the floor, bolted from below.' until the bolt is drawn."
  - id: evt:hatch_bolt
    preset: switch
    source: switch:hatch_bolt
    title: Bolt
    condition: {not: {map_var: hatch_open}}
    locked_text: "The bolt is drawn; the trapdoor lies open."
    opens: [mover:hatch]
    sets: {map_var: hatch_open}
    effects:
      - text: You draw the bolt. The trapdoor at the ladder's top falls open.
    notes: "poi:hatch_bolt: the trapdoor's bolt, drawn from the shaft, once."
  - id: evt:jewel_box
    preset: script
    source: platform:dressing_table
    title: Jewel box
    condition: {not: {map_var: jewels_found}}
    effects:
      - set:
          var:
            map_var: jewels_found
          value: 1
      - gold: 800
      - text: "The Countess's jewel box: rings and a jet brooch. No mirror anywhere. (+800 gold)"
    else_effects:
      - text: The jewel box is empty.
    notes: "The Countess's rooms' find, once."
  - id: evt:landing_bones
    preset: text
    source: deco:landing_bones
    title: Bones
    text: "You find a page of notes in the bones: Coffins contain treasure and vampires. Floor traps are regularly spaced. Remember to get Sorcerer to Jump us over them. The Count's magic keeps us from descending. Be sure to kill him when we get a chance."
    window: true
    notes: "poi:notes (dark/aaze0045:5): the traps' and the stair's answer-giver."
  - id: evt:ledger
    preset: text
    source: platform:desk
    title: Ledger
    text: "The Count's ledger. The last entry reads: 'Received from Lord Xeen's man: one queen, crowned. Crown kept by her people. No matter.'"
    window: true
    notes: The study's ledger (the graph's line).
  - id: evt:lineage
    preset: text
    source: platform:lectern
    title: The Blackfang Lineage
    text: "The Blackfang Lineage, in a dry hand: four names are copied out large on the last page, with a line for each coffin in the family crypt: Dutchess Blackfang, Countess Blackfang, Count Blackfang, Lady Blackfang."
    window: true
    notes: "The library's find: the crypt's four names."
  - id: evt:portraits
    preset: text
    source: panel:portraits
    title: Portraits
    text: Four centuries of Blackfangs. In every portrait the mirror behind the sitter shows an empty chair.
    window: false
    notes: The long gallery's find.
  - id: evt:queen
    preset: script
    source: platform:queen_bench
    title: Bench
    lua: |-
      if IsQBitSet(QBit(111542)) then
          evt.StatusText("The cell is empty. The Queen has gone home.")
          return
      end
      evt.StatusText("A stone bench.")
    notes: "The Queen's bench: after done 'The cell is empty. The Queen has gone home.' Queen Kalindra herself (monster:queen, npc 5001) talks when clicked: A3's The crown (queen_found, then done and m27.ambrose_return, the flight to D1)."
  - id: evt:queen_cell
    preset: script
    source: room:queen_cell
    trigger: step
    condition: {not: {qbit: queen_seen}}
    lua: "XeenQuests.hook(\"m27.queen_cell\")"
    notes: "m27.queen_cell on the cell's entry (D-52, A3): its first text once (queen_seen 111544), while the Queen is there (the hook's own not-done)."
  - id: evt:queen_load
    preset: script
    trigger: load
    condition: {qbit: done}
    effects:
      - hide_actors: 31
    notes: "Queen Kalindra is home once done 111542 is set (M27): her body is hidden on every load after."
  - id: evt:rat_bones
    preset: text
    source: deco:rat_bones
    title: Bones
    text: "You find a diary in the bones, but it has mostly been devoured by rats. None of what remains is legible."
    window: true
    notes: poi:shaft_bones (dark/aaze0047:5).
  - id: evt:roof_trapdoor
    preset: text
    source: platform:roof_trapdoor
    title: Trapdoor
    text: "A trapdoor in the roof, bolted from above. Wind howls over it."
    window: false
    notes: "poi:roof_trapdoor (D-42 (7)): drawn now, bolted; the D7 lane decides in phase 6."
  - id: evt:stair_force
    preset: script
    source: plate:stair_force
