    notes: "'Coffin' / 'The coffin is empty.' (aaze0046:0, aaze0047:1-2)."
  - id: evt:coffin_crypt_dutchess
    preset: script
    source: platform:coffin_crypt_dutchess
    title: Dutchess Blackfang
    condition: {not: {map_var: coffin_crypt_dutchess}}
    effects:
      - set:
          var:
            map_var: coffin_crypt_dutchess
          value: 1
      - show_actors: 14
      - lua: "evt.PlaySoundName(\"xeen_coffin_lid\")"
      - gold: 500
      - message: "The lid flies back and a vampire rises from the coffin! Grave goods: a purse of old coins. (+500 gold)"
    else_effects:
      - text: The coffin is empty.
    notes: "A sleeper's coffin (D-18): the first opening shows group 14 (counted at load) and gives its find; then 'The coffin is empty.' (aaze0047:2). Still rises after the Count's death (D-42 (5))."
