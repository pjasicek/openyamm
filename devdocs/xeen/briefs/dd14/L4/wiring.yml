    preset: script
    source: door:study_panel
    title: Panel
    condition: {not: {map_var: study_open}}
    effects:
      - text: "The panel is set fast in the wall. Somewhere above, something must move it."
    else_effects:
      - text: The panel stands open.
    notes: "The study's panel: shut until the gong."
  - id: evt:table
    preset: text
    source: platform:long_table
    title: Long table
    text: Goblets laid for a feast. They have never held wine.
    window: false
    notes: The great hall's long table.
  - id: evt:throne_seat
