    title: Throne
    text: A throne of black stone. The seat is cold.
    window: false
    notes: The Count's throne.
  - id: evt:tower_bones
    preset: script
    source: deco:tower_bones
    title: Bones
    condition: {not: {map_var: tower_purse}}
    effects:
      - set:
          var:
            map_var: tower_purse
          value: 1
      - gold: 300
