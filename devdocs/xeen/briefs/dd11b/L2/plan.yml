  - id: room:stair
    name: Root stair
    kind: corridor
    size: S
    floor: -448
    purpose: A stair of roots from the grub pens up to the fungus cave.
    empty: true
  - id: room:vat_cave
    name: Juice pit
    kind: room
    size: L
    floor: -448
    purpose: "A sunken vat of fungus, grubs and water: Troll Juice, poisonous, but it improves you (one drink a character)."
    population:
      - {actor: 11691, groups: 5, levels: [28, 28], notes: 5 placed Troll Guards (Xeen Warren Troll B).}
  - id: room:vat_rim
    name: Vat rim
    kind: room
    size: M
    floor: -448
    purpose: "Where the clay drop lands: a ledge round the juice pit."
    population:
      - {actor: 11690, groups: 3, levels: [18, 18], notes: 3 placed Trolls (Xeen Warren Troll A).}
