format: 0
level: L1
pitch: 'King Burlock''s castle on the savannah: a white-stone gatehouse whose portcullis lifts only for Crusaders, a marble
  great hall and throne room where the King hunts his mirror, the gallery of arms with Artemus''s and Emerson''s doors, the
  library and the well court in a ring round the court. The east tower is the royal family''s (Roxanne''s parlour, the bedroom);
  the west tower has been given up to the court''s mad fools and roosting gargoyles, and at its top stands the old King''s
  throne that throws whoever sits on it into the air outside. Under the kitchens the wine cellar''s iron door opens on the
  dungeon the trolls broke out of, its old cistern, their den, and the warden''s pit where a Fire Dragon waits behind a portcullis
  and a sign that says ''Do not pull''.'
purpose: Story M5-M7 (the audience, Artemus, the dungeon key), Emerson for Newcastle (M9, M11, M22), Roxanne (Q-C3, T1-E);
  optional fights in the west tower and the dungeon, an optional dragon. Party 12-14, monsters 8-22 (the band 10-24; Mad Fools
  8 mixed in, D-4).
mood: A bright, busy court of white stone and cream marble, banners and guards; the abandoned west tower draughty and noisy;
  the cellars and dungeon grey, cold and quiet; the pit a hot red cave.
