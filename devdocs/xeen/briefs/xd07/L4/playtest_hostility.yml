# Hostility check of Castle Burlock (XD-07), after XD-05's (devdocs/xeen/ACT2_BUILD.md, "Hostility pass"): the Madmen,
# Gargoyles, Trolls and the caged Fire Dragon hostile to the party, the King's Guards peaceful (the world's relation, D-4),
# and the map's kinds, the guard among them, not fighting each other. Written by hand (output/studio_cal/xd07).
