format: 0
level: L1
pitch: "Joe the Exterminator always turns up just after the pests, and his riverside warehouse in Vertigo is why. Behind the loading bay and a sagging grain hall full of doom bugs, a cellar stair marked KEEP OUT (THIS MEANS YOU, GUNTHER) leads down to a round brick cistern Joe has turned into breeding pens: six wedge-shaped slime pens round a drain pool, glass tanks of bugs on a shelf, and a lever labelled FEEDING TIME. Behind a gate painted with a heart live Mr and Mrs Wobbles, the mated pair of breeder slimes the whole scam rests on. In the shipping room beyond, a crate holds the invoice that convicts him, and a culvert from the pens' drain runs out to the river: the way Joe lets his stock into town. A ten-minute first dungeon of slapstick and low monsters."
purpose: "Story step M2: find the invoice for 'Breeder Slimes, 1 mated pair' that proves Joe breeds Vertigo's pests, and bring it to Mayor Gunther. First dungeon of the world: teaches doors, a key, a lever that does something bad, a secret behind a clue, a trap and a small boss, all at monster levels 2 to 4. Optional: kill the mated pair for a small bonus from Gunther."
mood: "Comic, dusty and damp: lamplit timber upstairs, warm sour brick and green glow below. Joe's hand-painted signs everywhere."
datum: arrival
spaces:
  - id: room:breeding_pens
    name: Breeding pens
    kind: room
    size: L
    extent: [1792, 1792]
    shape: "Round brick cistern about 1,700 across under a low brick dome. A drain pool sunk 64 in the centre behind a grate; six wedge-shaped pens round it, each behind a waist-high brick wall with a barred gate; a shelf of glass bug tanks runs round the outer wall. Doors leave it at three points of the circle."
    where: "Centre-north of the map, under the grain hall."
    floor: {level: -384, range: [-448, -384]}
    clear_height: [512, 704]
    relief: pit
    features:
      - {kind: pit, rise: -64, where: Centre, notes: "The drain pool, behind a grate; the culvert leaves from it."}
      - {kind: pen, count: 6, where: Ring round the pool, notes: "Wedges behind waist-high walls; their gates open together from the feeding lever."}
      - {kind: shelf, where: Outer wall, notes: Glass bug tanks.}
    purpose: "Signature room and the reveal: the pests are bred here. The heaviest fight of the map, made worse if the party pulls the feeding lever."
    light: dim
    population:
      - {slot: 1, groups: 3, per_marker: [2, 3], strength: pack, rank: a, notes: "Inside the pens; they stay in until the feeding lever opens the gates (set:feeding_time), then all come at once."}
      - {slot: 2, groups: 1, per_marker: [2, 3], strength: light, rank: a, notes: From a cracked tank on the shelf.}
  - id: room:cellar_stair
    name: Cellar stair
    kind: room
    size: S
    extent: [384, 1536]
    shape: "Straight flight down, 12 steps of 32, with a landing halfway; the KEEP OUT door at its top."
    floor: [-384, 0]
    clear_height: 384
    relief: steps
    purpose: Takes the party down from the grain hall to the pens.
    empty: true
  - id: room:culvert
    name: River culvert
    kind: room
    size: M
    extent: [384, 1920]
    shape: "Brick-lined culvert curving south-east from the pens' drain, sloping down to an iron grate on the river; ankle-deep water."
    where: "East of the pens, out under the riverbank."
    floor: [-640, -384]
    clear_height: 384
    relief: slope
    purpose: "How Joe's stock reaches town; the short way out once the invoice is found."
    population:
      - {slot: 1, groups: 1, per_marker: [1, 2], strength: light, rank: a}
  - id: room:feed_store
    name: Feed store
    kind: room
    size: S
    extent: [1024, 768]
    shape: "L-shaped store off the pens; sacks of JOE'S PREMIUM SLIME CHOW stacked to the ceiling along one wall."
    where: West of the pens.
    floor: -384
    clear_height: 448
    relief: flat
    purpose: "Quiet side room; the stacked sacks hide Joe's stash (link:feed_store_stash)."
    population:
      - {slot: 2, groups: 1, per_marker: [2, 3], strength: light, rank: a, notes: Feeding on a split sack.}
  - id: room:grain_hall
    name: Grain hall
    kind: room
    size: L
    extent: [2560, 1280]
    shape: "Long hall under a pitched roof of open rafters. The floor sags toward a gutter down the middle, and the north wall bows inward where the old river wall leans. Two square grain bins stand free in the hall."
    where: "North of the loading bay, the full width of the building."
    floor: [-32, 0]
    clear_height: [512, 896]
    relief: uneven
    islands: 2
    features:
      - {kind: bin, count: 2, where: Middle of the hall, notes: Freestanding grain bins to walk round.}
    purpose: "The middle of the map: doom bugs boiling out of torn sacks, the loft above, the cellar door in its north-east corner."
    population:
      - {slot: 2, groups: 2, per_marker: [2, 4], strength: pack, rank: a}
      - {slot: 1, groups: 1, per_marker: [2, 3], strength: light, rank: a, notes: In the gutter.}
  - id: room:joes_office
    name: Joe's office
    kind: room
    size: S
