format: 0
start:
  room: room:loading_dock
  at: [768, -900]
  facing: n
  notes: "On Joe's loading dock, the locked street doors ahead."
doors:
  - id: door:barn
    opening: open:bay_grain_hall
    kind: slide_left
    leaves: 2
    state: closed
    speed: 128
    surface: {texture: t66b03l, size: [128, 256], fit: true}
    notes: "The rolling barn doors between the bay and the grain hall; a plain click from either side."
  - id: door:culvert
    opening: open:pens_culvert
    kind: slide_up
    state: closed
    speed: 96
    surface: {texture: d8dorf, size: [128, 256], fit: true}
    notes: "The culvert's low iron door; it rises on a click."
  - id: door:heart_gate
    opening: open:pens_honeymoon
    kind: slide_up
    state: closed
    speed: 96
    surface: {texture: xnheartgt, size: [128, 256], fit: true}
    notes: "The plank gate painted red with a big white heart (xnheartgt, generated: see NOTES.md, generated textures), MR & MRS WOBBLES - DO NOT SEPARATE over it."
  - id: door:keep_out
    opening: open:hall_cellar_stair
    kind: hinged
    hinge: left
    swing: 95
    state: closed
    surface: {texture: gkp103a, size: [128, 256], fit: true}
    notes: "KEEP OUT (THIS MEANS YOU, GUNTHER): the head of the cellar stair; the pen key opens it for good."
  - id: door:office
    opening: open:office_steps_office
    kind: hinged
    hinge: right
    swing: 95
    state: closed
    notes: "Joe's office door at the top of the steps; it swings in. The slime bucket waits just inside (plate:bucket)."
  - id: door:river_grate
    opening: open:river_grate
    kind: slide_up
    state: closed
    speed: 64
    surface: {texture: d1lggrt, size: [256, 256], fit: true}
    notes: "The iron grate onto the river, lifted from the inside on first use."
  - id: door:shipping
    opening: open:pens_shipping
    kind: hinged
    hinge: right
    swing: 95
    state: closed
    surface: {texture: d6dorb, size: [256, 256], fit: true}
    notes: Plank door to the shipping room.
  - id: door:stash
    opening: open:feed_store_stash
    kind: slide_left
    state: closed
    speed: 64
    surface: {texture: cbmxbrck, size: [128, 128]}
    secret: true
    notes: "The secret door: a piece of the store's brick wall behind the Slime Chow sacks, on a hidden runner. Its faces carry the secret flag (the map's perception difficulty 0: a party with Perception sees them pulse); to anyone else it is the wall, found by the ledger's clue."
  - id: door:street
    opening: open:dock_ramp
    kind: slide_left
    leaves: 2
    state: closed
    speed: 128
    surface: {texture: t66b03l, size: [128, 256], fit: true}
    notes: "The street doors: two barred-plank leaves sliding apart into the warehouse front. Locked from the dock (wiring evt:street_doors)."
