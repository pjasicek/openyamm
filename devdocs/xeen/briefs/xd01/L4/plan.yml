notes: "A deliberately small S map (about 11 M units² of floor, under the S band's 20) because it is the world's first dungeon and should take about ten minutes. Fights are uneven: nothing at the street doors, light in the bay, a swarm in the grain hall, the heaviest in the pens, a boss pair in the honeymoon pen, light at the edges. Shapes: of the 11 plan rooms only the stash and the cellar stair are rectangles; the bay and hall are chamfered, the office a trapezoid, the cistern sixteen-sided, the honeymoon pen a kidney, the shipping room five-sided, the culvert bends twice and slopes. Risers are 32 throughout; the lowest ceiling is 384. L2 themes name texture families of the shared MM6-MM8 surface library (level_generation/textures_x4/inventory.json) and decorations of the engine's indoor bindings (assets_dev/engine/models/indoor_decorations.yml); Xeen has no kit of its own yet, so the warehouse borrows MM8's Ravenshore-style board walls and MM6 planks, the cellar MM6 brick. Light numbers are lights per M units² of floor. Treasure: map treasure level 1; containers give tier 1 except the stash (tier 2). Changes from L1: the cellar lies north of the warehouse instead of under it, and the loft beside the hall along its north side instead of over three sides of it (rooms cannot stack); the slime pens are six niches behind barred gates in the cistern wall instead of wedges behind waist-high walls round the pool (so each gate is a real door the lever can open); the cistern has five doorways, not three; the party arrives in the middle of the bay rather than at the top of the ramp (the plan's datum, 0, is the bay floor); the grain hall gains a north-east aisle that carries the KEEP OUT door and the foot of the loft stair, and its floor is level; the office's angled wall is the south one, the wall to the bay straight."
