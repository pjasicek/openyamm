atmosphere: "Two moods split by the cellar stair. Upstairs: dusty, warm and creaking, lamplit timber in pools of yellow lantern light (about 2 lights per M units² of floor; the loft's far end and the bins' shadows dark), motes in the air, the scratch and click of doom bugs in the sacks, Joe's hand-painted signs everywhere. Downstairs: damp, sour and green, warm brick sweating under green-flame torches (about 2.5 per M units² in the cistern, 1.5 in the side rooms), the drain pool's slow pulsing glow the brightest thing in the map, dripping water, the gurgle of the culvert and the wet slap of slimes. Base darkness (sector ambient) about 14 upstairs, 18 to 20 in the cellar, 22 in the culvert and 24 in the stash. No fog upstairs; a faint green haze in the cistern (indoor fog, opt-in). Placed ambient sounds: wind through the street doors' cracks, bugs' chitter in the grain hall, bubbling in the cistern, running water in the culvert. Music: the light dungeon track (map_stats dungeon_light) everywhere; the sound environment is a stone hall below, a wooden room above (one map value; stone hall chosen)."
