format: 0
level: L3
pitch: "Joe the Exterminator always turns up just after the pests, and his riverside warehouse in Vertigo is why. Behind the loading bay and a sagging grain hall full of doom bugs, a cellar stair marked KEEP OUT (THIS MEANS YOU, GUNTHER) leads down to a round brick cistern Joe has turned into breeding pens: six slime pens behind barred gates in its wall, round a drain pool, glass tanks of bugs on a shelf, and a lever labelled FEEDING TIME. Behind a gate painted with a heart live Mr and Mrs Wobbles, the mated pair of breeder slimes the whole scam rests on. In the shipping room beyond, a crate holds the invoice that convicts him, and a culvert from the pens' drain runs out to the river: the way Joe lets his stock into town. A ten-minute first dungeon of slapstick and low monsters."
purpose: "Story step M2: find the invoice for 'Breeder Slimes, 1 mated pair' that proves Joe breeds Vertigo's pests, and bring it to Mayor Gunther. First dungeon of the world: teaches doors, a key, a lever that does something bad, a secret behind a clue, a trap and a small boss, all at monster levels 2 to 4. Optional: kill the mated pair for a small bonus from Gunther."
mood: "Comic, dusty and damp: lamplit timber upstairs, warm sour brick and green glow below. Joe's hand-painted signs everywhere."
datum: arrival
