notes: "Xeen design brief, level L4: L3's rooms redrawn with the studio's words of 2026-11-12 (sixteen-sided cistern under a brick dome, pens behind barred gates, the culvert as a tunnel with a cross-section, the loft as a gallery inside the grain hall under a ridged roof, stairs with treads), themes, objects and wiring; a playable map (NOTES.md). Story step M2 (devdocs/xeen/QUESTS.md). The Xeen world has no package, monsters or items yet, so this L4 is built and played as an MM7 map: `world: mm7` until worlds/xeen exists (one line to change back). Stand-ins, each to be replaced by the Xeen row when it is registered: encounter slot 1 Oozes (Slime 2) is MM7's Rat family (Giant Rat 2), slot 2 Swarms (Doom Bug 2) is the Dragonfly family (Dragonfly 2); the two Breeder Slimes are MM7 Fire Rats (monster 387, the Rat family's C rank: level 6, 21 hit points; no ooze will do: every ooze row of MM6-MM8 is level 12 or more and immune to physical damage); the pen slimes are Giant Rats (385). Items: warehouse_key 12001 is MM6's Store Room Key (2176), pen_key 12003 the plain Key (2110), joes_invoice 12002 MM7's Bill of Sale (1530). Quest bits keep their provisional Xeen numbers (110010-110012). Music is the MM7 dungeon track 18 in place of the name dungeon_light, which the game refuses. Both neighbours point at Emerald Island until X1 exists."
