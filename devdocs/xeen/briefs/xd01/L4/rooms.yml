notes: "The to-scale plan in whole map units: x east, y north, heights from the bay's floor (0). L4 redraws L3 with the words of 2026-11-12: the street doors moved behind a covered loading dock (the arrival, so that their lock is played in this map); the loft is a gallery level inside the grain hall under a pitched roof with tie beams, reached by a flight along the north wall (the separate loft room, loft stair room and overlook opening are gone); the cistern has its brick dome, a pool sunk 64 behind a kerb, shelves of glass tanks and painted signs; the stair flights have stone treads and ceilings that fall with them, the landing a barrel vault; the culvert is one sectioned tunnel that bends and slopes (three rooms became one) ending in an outfall and the grate's sill; the shipping room has its chute and slide; the honeymoon pen a shallow dome. Pens, feed store, stash, office and bay keep L3's plan. Walls are 64 thick between joined rooms."
