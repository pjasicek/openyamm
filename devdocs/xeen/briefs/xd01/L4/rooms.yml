format: 0
themes:
  - id: theme:aisle
    wall: {texture: t66floor, size: [128, 128]}
    bands:
      - {height: 256, surface: {texture: t66b01, size: [128, 256]}}
    ends: {length: 32, surface: {texture: t66abc10a, size: [32, 128]}}
    floor: {texture: t66flr2, size: [128, 128]}
    ceiling: {texture: t66roof, size: [128, 128]}
    reveal: {texture: t66abc10a, size: [32, 128]}
    door: {texture: gkp103a, size: [128, 256], fit: true}
    notes: "The north-east aisle, a lean-to shed against the warehouse, in the Pirate Outpost's storeroom wood (MM8 d06): the panelled wainscot (t66b01) to 256 with upright planks above (t66floor, which d06 lays on walls too), posts in the corners (t66abc10a), flagstones underfoot (t66flr2) running on to the cellar stair, the beamed roof (t66roof)."
  - id: theme:cellar_brick
    wall: {texture: cbmxbrck, size: [128, 128]}
    bands:
      - {height: 64, surface: {texture: d1smbw, size: [128, 128]}}
    floor: {texture: d1medbw, size: [128, 128]}
    ceiling: {texture: cbrdbrck, size: [64, 64]}
    reveal: {texture: d1medbw, size: [128, 128]}
    door: {texture: d6dorb, size: [256, 256], fit: true}
    notes: "Old cellar brick: weathered mixed brick (MM6 cbmxbrck) on a damp stone footing (d1smbw), the Free Haven Sewer's block stone underfoot and in the doorways (d1medbw), red brick vaults (cbrdbrck), old MM6 plank doors (d6dorb, Lair of the Wolf). Cellar stair and shipping room."
  - id: theme:culvert
    wall: {texture: d1wldle2, size: [256, 256]}
    floor: {texture: swprrf3, size: [128, 128]}
    ceiling: {texture: d1wle, size: [256, 256]}
    reveal: {texture: d1medbw, size: [128, 128]}
    door: {texture: d8dorf, size: [128, 256], fit: true}
    notes: "River culvert, in the Free Haven Sewer's set (MM6 sewer.blv): its mossy block walls (d1wldle2, d1wldle3) and roof stone (d1wle), the walkway stone (d1medbw), its sewage underfoot (swprrf3, the liquid shader, on floors marked water), an MM6 iron door (d8dorf)."
  - id: theme:dock
    wall: {texture: t66c01a, size: [128, 256]}
    floor: {texture: t66flr2, size: [128, 128]}
    ceiling: {texture: t66floor, size: [128, 128]}
    reveal: {texture: t66abc10a, size: [32, 128]}
    door: {texture: t66b03l, size: [128, 256], fit: true}
    notes: "Joe's covered loading dock on the lane, in the Pirate Outpost's set (MM8 d06): the neighbours' brick (t66c01a, d06's hall brick) on three sides, the warehouse's plank front (t66floor, a wall entry) with its boarded shutters (gt003b) on the fourth, the lane's flagstones underfoot (t66flr2), the canopy's planks overhead."
  - id: theme:feed_store
    wall: {texture: cbmxbrck, size: [128, 128]}
    bands:
      - {height: 64, surface: {texture: d1smbw, size: [128, 128]}}
    floor: {texture: straw, size: [256, 256]}
    ceiling: {texture: d1ceil1, size: [256, 256]}
    reveal: {texture: d1medbw, size: [128, 128]}
    door: {texture: cbmxbrck, size: [128, 128]}
    notes: "Cellar brick under the Free Haven Sewer's plank ceiling (d1ceil1), spilt chaff on the floor (MM6 straw). Its door surface is the brick, so the stash's sliding door shows nothing until it is opened."
  - id: theme:loading_bay
    wall: {texture: t66floor, size: [128, 128]}
    ends: {length: 32, surface: {texture: t66abc10a, size: [32, 128]}}
    floor: {texture: t66flr2, size: [128, 128]}
    ceiling: {texture: t66roof, size: [128, 128]}
    reveal: {texture: t66abc10a, size: [32, 128]}
    door: {texture: t66b03l, size: [128, 256], fit: true}
    notes: "Warehouse, bay variant, as the Pirate Outpost's storerooms (MM8 d06) are built: upright planks (t66floor) over the panelled wainscot (t66b01, the bay's own band, 256: one picture high), flagstones where the carts come in (t66flr2), the beamed roof (t66roof), a post in every corner (t66abc10a), d06's braced plank doors (t66b03l). Also the loading ramp (no band: a band needs a level floor)."
  - id: theme:office
    wall: {texture: t66d01, size: [128, 256], scale: 1.75}
    floor: {texture: t66floor, size: [128, 128]}
    ceiling: {texture: t66roof, size: [128, 128]}
    reveal: {texture: t66abc10a, size: [32, 128]}
    door: {texture: t66b03l, size: [128, 256], fit: true}
    notes: "Joe's office, as the Pirate Outpost's better rooms (MM8 d06): cream plaster under a cornice over a carved panel wainscot (t66d01, one picture from floor to ceiling, 448 at scale 1.75), plank floor (t66floor), the beamed roof (t66roof), a braced plank door (t66b03l; phase 0: was its mirror t66b03r). The only plastered room of the map: Joe keeps up appearances where the customers come."
  - id: theme:pen
    wall: {texture: cbrdbrck, size: [64, 64]}
    bands:
      - {height: 96, surface: {texture: d1smbw, size: [128, 128]}}
    floor: {texture: straw, size: [256, 256]}
    ceiling: {texture: cbmxbrck, size: [128, 128]}
    reveal: {texture: d1medbw, size: [128, 128]}
    door: {texture: d6dorb, size: [256, 256], fit: true}
    notes: "A slime pen: the cistern's brick and mossy footing, bedded with straw (MM6 straw), a low brick ceiling."
  - id: theme:pens_brick
    wall: {texture: cbrdbrck, size: [64, 64]}
    bands:
      - {height: 96, surface: {texture: d1smbw, size: [128, 128]}}
    floor: {texture: d1medbw, size: [128, 128]}
    ceiling: {texture: cbmxbrck, size: [128, 128]}
    reveal: {texture: d1medbw, size: [128, 128]}
    door: {texture: d6dorb, size: [256, 256], fit: true}
    notes: "Cistern brick: red brick (MM6 cbrdbrck) over a mossy stone course where the water has stood (d1smbw), the Free Haven Sewer's block stone underfoot and in the reveals (d1medbw), a mixed-brick dome (cbmxbrck); the pen gates are iron bars (movers)."
  - id: theme:warehouse_timber
    wall: {texture: t66c01a, size: [128, 256]}
    floor: {texture: t66floor, size: [128, 128]}
    ceiling: {texture: t66roof, size: [128, 128]}
    reveal: {texture: t66abc10a, size: [32, 128]}
    door: {texture: t66b03l, size: [128, 256], fit: true}
    notes: "The grain hall, as the Pirate Outpost's big hall (MM8 d06): its brick walls (t66c01a), plank floor (t66floor), the beamed roof (t66roof), posts and beams (t66abc10a). No band: the hall's floor sags toward its gutter, and a band needs a level floor; the loft's front is d06's panelled wainscot (t66b01)."
