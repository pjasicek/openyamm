format: 0
themes:
  - id: theme:cellar_brick
    wall: {texture: cbmxbrck, size: [128, 128]}
    floor: {texture: tfb07, size: [128, 128]}
    ceiling: {texture: cbrdbrck, size: [64, 64]}
    reveal: {texture: d1medbw, size: [128, 128]}
    door: {texture: bwooda2, size: [256, 256], fit: true}
    notes: "The plan's old cellar brick: weathered mixed brick walls (MM6 cbmxbrck), dark stone slab floor (MM7 tfb07), red brick vaults overhead (MM6 cbrdbrck), old stone in the doorways (MM6 d1medbw), plank doors with iron grilles (MM8 bwooda2). Cellar stair and shipping room."
  - id: theme:culvert
    wall: {texture: d1medbw, size: [128, 128]}
    floor: {texture: slimywtr, size: [128, 128]}
    ceiling: {texture: d1smbw, size: [128, 128]}
    notes: "The plan's culvert: mossy river stone walls and ceiling (MM6 d1medbw, d1smbw), slimy water underfoot (MM8 slimywtr)."
  - id: theme:feed_store
    wall: {texture: cbmxbrck, size: [128, 128]}
    floor: {texture: straw, size: [256, 256]}
    ceiling: {texture: d2ceil2, size: [256, 256]}
    door: {texture: cbmxbrck, size: [128, 128]}
    notes: "The plan's feed store: cellar brick under a plank ceiling (MM6 d2ceil2), spilt chaff on the floor (MM6 straw). Its door surface is the brick, so the stash's secret door shows nothing until opened."
  - id: theme:loading_bay
    wall: {texture: bwooda1, size: [256, 256]}
    floor: {texture: bmplnk, size: [256, 256]}
    ceiling: {texture: d2ceil2, size: [256, 256]}
    reveal: {texture: cbeam5, size: [32, 256]}
    door: {texture: bwooda2, size: [256, 256], fit: true}
    notes: "The plan's warehouse timber, bay variant: weathered vertical boards (MM8 bwooda1), dark plank floor (MM6 bmplnk), joists and boards overhead (MM6 d2ceil2), beam reveals (MM6 cbeam5)."
  - id: theme:office
    wall: {texture: bemhwal, size: [256, 128]}
    floor: {texture: bembllg, size: [256, 256]}
    ceiling: {texture: d2ceil2, size: [256, 256]}
    reveal: {texture: cbeam5, size: [32, 256]}
    door: {texture: beemdorc, size: [128, 256], fit: true}
    notes: "The plan's office panelling: horizontal plank panels (MM6 bemhwal), warm board floor (MM6 bembllg), a panelled door (MM6 beemdorc)."
  - id: theme:pens_brick
    wall: {texture: cbrdbrck, size: [64, 64]}
    floor: {texture: tfb07, size: [128, 128]}
    ceiling: {texture: cbmxbrck, size: [128, 128]}
    reveal: {texture: d1medbw, size: [128, 128]}
    door: {texture: bwooda2, size: [256, 256], fit: true}
    notes: "The plan's cistern brick: red brick walls (MM6 cbrdbrck), stone slab floor (MM7 tfb07), mixed brick vault (MM6 cbmxbrck). Pen gates and the honeymoon gate use the grilled plank door until a barred gate exists."
  - id: theme:warehouse_timber
    wall: {texture: bwoodb1, size: [256, 256]}
    floor: {texture: bmplnk, size: [256, 256]}
    ceiling: {texture: d2ceil1, size: [256, 256]}
    reveal: {texture: cbeam5, size: [32, 256]}
    door: {texture: bwooda2, size: [256, 256], fit: true}
    notes: "The plan's warehouse timber: horizontal weatherboard walls (MM8 bwoodb1), dark plank floor (MM6 bmplnk), open rafters (MM6 d2ceil1), beam reveals, grilled plank doors (the barn doors). Grain hall, loft and loft stair."
defaults: {theme: theme:warehouse_timber, ambient: 14}
