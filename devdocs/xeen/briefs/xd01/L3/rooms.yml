    notes: "An L: the long hall (about 2,300 by 1,100) behind the barn doors, and its north-east aisle running north to the KEEP OUT door, which stands in the aisle's north wall. The hall's north-east corner is cut on the diagonal so the loft stair's side wall faces no hall wall. Two square grain bins (pillars, plank-faced) to walk round. The loft runs along the north wall, 256 above the floor: a long rail opening (sill 64) shows it, and the rail is broken at the west end where the ladder stands. Ceiling flat at 768. Still not drawable: the pitched rafter roof (R3-K5 shaped ceilings), the floor's sag and gutter (uneven relief), the ladder itself (no ladders in objects.yml)."
