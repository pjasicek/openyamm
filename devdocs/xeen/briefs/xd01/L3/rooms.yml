notes: "The to-scale sketch of the plan, in whole map units: x east, y north, heights from the plan's datum, the loading bay's floor (0). The warehouse is the south half (bay, office, grain hall with its north-east aisle, loft and the two stairs); the cellar is the north half, reached by the cellar stair running north from the aisle, with the breeding pens' sixteen-sided cistern centred at [2112, 4960]. A plan space is one room except where a flight, a ramp or a niche must be its own room: the loading ramp (bay), the office steps (office), the loft stair (loft), the cellar stair's two flights and landing, the six pen niches (breeding pens) and the culvert's bend, slope and grate end; the extra rooms name their space. Walls are 64 thick between joined rooms (the counter window's wall and the loft rail too); elsewhere rooms keep at least 23 units of solid between them (the feed store's neck between two pens is the tightest). The cistern's axis and diagonal walls run in exact integer directions and every room that opens off a cistern wall has a wall exactly parallel to it, which is how the build finds the pair. Every floor change on the critical path is a flight of 32-unit steps, a ramp no steeper than 128 over 448 or a level doorway; the only drops are the loft's broken rail (256, until the ladder is placed) and the honeymoon pen's 32 step down. Themes name the L2 texture families; pillars are the crate stacks and grain bins, platforms the office desk and the drain pool's kerb. No doors, lights, spawns or chests: those are L4 (objects.yml, wiring.yml). Not drawable yet: the grain hall's pitched rafters and the cistern's dome (shaped ceilings, R3-K5 and K7), the drain pool sunk 64 (R3-K6 sunken floors), the hall floor's sag (uneven relief), the shipping room's chute (a sloped shaft), the loft ladder (no ladders in objects.yml), barred gates as their own look (R3-K11 per-opening look)."
