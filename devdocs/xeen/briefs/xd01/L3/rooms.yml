    notes: "The signature room: a sixteen-sided brick cistern 1,600 across, ceiling 640 over the floor. Five of its walls are doorways (south: the cellar stair; west: the feed store; north: the honeymoon pen; north-east: the shipping room; east: the culvert's iron door), six are the barred gates of the slime pens, five are plain wall for the bug-tank shelf. The drain pool in the middle is a low slime-filled kerb (a platform 16 high, slime surface) until sunken floors exist. Axis and diagonal walls have exact integer directions, so the doorways' rooms face them exactly. Still not drawable: the low brick dome (R3-K5, R3-K7), the pool sunk 64 below the floor (R3-K6 sunken floors)."
