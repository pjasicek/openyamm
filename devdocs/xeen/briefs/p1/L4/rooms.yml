    notes: "The crater: one open-air room, its floor the lava lake (burning), its walls ragged cliffs to the sky, their tops 1,400-2,800 over the lava (ceiling_points on every rim corner: the walls end on that jagged line), spurs reaching into the lava, ledges, two lava falls in gullies; shelves, causeways and the Crucible stand in the lava, their sides skirted with steep crust. A notch in the north-west holds the Sleeper's Hall behind a wall, the gate framed in glass and basalt."
