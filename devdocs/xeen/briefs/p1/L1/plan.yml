set_pieces:
  - id: set:lava
    kind: trap
    spaces: [zone:lava]
    rule: "The lava burns as MM's lava floors (`lavtyl`, D-40): crust banks within 64 of every lava edge (a lip of at most 64 over the lava) and ramps up every shelf, so a party in the lava always walks out; none to the Sleeper's Hall or its bridge, which stand 320-448 over the lava (P-2). No falls: the crater wall closes the room. Measured: the farthest lava is 3,396 from a way out (90 % within 1,703)."
  - id: set:test
    kind: boss
    spaces: [room:arena]
    rule: "D-58 C3 (a): the pedestal's 'Accept the test of Fire?' (A3's m38.test_fire) shows the three guardians, a hidden group until then, rising from the pit at (256, 3584): 1 Sleeper's Guardian of Fire (75), 2 Fire Blower (70). Each guardian's death event calls Xeen.planeTestCheck(\"fire\", <the group>); when the three are dead it runs m38.test_fire_passed, which sets m38_fire_test (111764, P-1) and opens the gate. A party that leaves mid-fight finds the guardians still shown on return; the test is not offered again while they live."
    enabled_by: {map_var: test_accepted}
    gives:
      qbit: m38_fire_test
    population:
      - {id: pop:guardians, actors: [{actor: Sleeper's Guardian of Fire (11623), count: 1}, {actor: Fire Blower (11622), count: 2}], placed: true, notes: "hidden until the test is accepted, at (256, 3584)"}
  - id: set:vents
    kind: trap
    spaces: [room:spires, room:vents, room:west_shelf]
    rule: "The source's nine vent squares: glowing cracks in the crust (a small floor face each). Stepping on one: one time in three 50 fire damage to each member, 'A vent flares!' (resistance applies). PressurePlate faces textured `xpfvent`, each calling A3's planes.vent. Cells: at (-4480, -3200); at (-2816, -3328); at (-3712, -4352); at (-2432, -4224); at (-4864, -3712); at (4480, 256); at (3200, 1792); at (-4864, 2048); at (-3712, 128). None on the critical path (measured 0 within 384 of the walk; 0 on a link, 0 in the arena)."
