format: 0
level: L1
pitch: "The Plane of Fire of Xeen: a lake of lava in a crater of black glass under a sky of red smoke. Causeways of cooled crust run between basalt shelves; vents flare underfoot. On its rise the Crucible, a ring of obsidian where the test of Fire waits; beyond it, in a hall cut into the tallest spire, the Fire Sleeper on his couch."
purpose: "M38 (Act VI, party 56-60): the plaque (Step One), the test of Fire, the Fire Sleeper (m38.sleeper_fire, award 412) and the test's chest. Reached by stepping off D7's north-west corner after answering 'Fire'; left by the heat column at the arrival or the return dais by the sleeper, both to D7."
mood: "Hot, red and loud: the lava's slow churn, the crack of cooling crust, the roar of the vents. Danger played straight; the plaque and the sleeper's 'confidence is at 100%' are the world's wink."
