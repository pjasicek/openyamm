themes:
  - id: theme:ancient
    wall: {texture: swll4dk, size: [128, 256]}
    floor: {texture: swfloor2b, size: [128, 128]}
    ceiling: {texture: swceilf, size: [256, 256]}
    reveal: {texture: swankdk, size: [128, 128]}
    door: {texture: swdoorc, size: [128, 256]}
    notes: "The Ancients' levels (A6's assign: the lower Ancient levels in the sw set): steel panels (swll4dk), worn grey floor (swfloor2b), a grated ceiling (swceilf); L3's pad maze, the apex stair and the sky corridor."
  - id: theme:atrium
    wall: {texture: egywlf, size: [256, 256]}
    floor: {texture: egyflore, size: [256, 256]}
    ceiling: {texture: egyceild, size: [128, 128]}
    reveal: {texture: egytrmc, size: [64, 64]}
    door: {texture: egydrsmc, size: [128, 256]}
    notes: "The Visitor's Atrium: gold hieroglyph columns (egywlf), pale slabs (egyflore), a coffered ceiling (egyceild)."
  - id: theme:chapel
    wall: {texture: egywld, size: [256, 256]}
    floor: {texture: egyflorc, size: [128, 128]}
    ceiling: {texture: egyceilb, size: [128, 128]}
    reveal: {texture: egytrmc, size: [64, 64]}
    door: {texture: egydrsmc, size: [128, 256]}
    notes: "The four torch chapels: orange hieroglyph walls (egywld), pale flags (egyflorc); the niches (egywlspa/egywlspb)."
  - id: theme:gallery
    wall: {texture: egymeda, size: [256, 256]}
    floor: {texture: egyflord, size: [256, 256]}
    ceiling: {texture: egyceilb, size: [128, 128]}
    reveal: {texture: egytrmc, size: [64, 64]}
    door: {texture: egydrsmc, size: [128, 256]}
    notes: "The galleries round the atrium: dressed blocks (egymeda)."
  - id: theme:hall
    wall: {texture: egybiga, size: [256, 256]}
    floor: {texture: egyflord, size: [256, 256]}
    ceiling: {texture: egyceilb, size: [128, 128]}
    reveal: {texture: egytrmc, size: [64, 64]}
    door: {texture: egydrsmc, size: [128, 256]}
    notes: "The Royal Pyramid's public halls (MM6's Tomb of VARN): big sandstone blocks (egybiga), sand slabs (egyflord), block ceilings (egyceilb), hieroglyph trim in the doorways (egytrmc)."
  - id: theme:numbers
    wall: {texture: egywla, size: [256, 256]}
    floor: {texture: egyflord, size: [256, 256]}
    ceiling: {texture: egyceilb, size: [128, 128]}
    reveal: {texture: egytrmc, size: [64, 64]}
    door: {texture: egydrsmc, size: [128, 256]}
    notes: "The number hall: small blocks (egywla); the eight niches (egyspca)."
  - id: theme:office
    wall: {texture: egywlj, size: [256, 256]}
    floor: {texture: egyflorf, size: [256, 256]}
    ceiling: {texture: egyceilb, size: [128, 128]}
    reveal: {texture: egytrmc, size: [64, 64]}
    door: {texture: egydrsmc, size: [128, 256]}
    notes: "The Overseer's Office and vault, the embalmers' room: cracked plaster (egywlj), marbled slabs (egyflorf)."
  - id: theme:processional
    wall: {texture: egywlh, size: [256, 256], scale: 2}
