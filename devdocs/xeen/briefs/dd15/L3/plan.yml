format: 0
level: L3
pitch: "The Dragon Pharaoh's pyramid in the Desert of Doom, a museum for visitors gone to dust: the green doors open on the Royal Pyramid's halls, where four torches round the atrium wake the wardens in their niches and unlock the grand stair; a processional of verse statues ends at a registry door that wants a starship's number; above it the Ancients' steel hall of glyph pads, where only the bird leads on; at the apex the Pharaoh waits in his gilded throne hall, beside a vat he warns you away from."
purpose: "Story M28 (QUESTS.md): climb to the Dragon Pharaoh with his orb (npc 5453, The orb): the torches (m28.torches), the registry (m28.registry_lock), the pad maze (m28.maze), the Prime Directive (m28.prime_directive); M30 and M36 bring the party back (the Pharaoh's lift after the first audience); D-58's sky door to D7 after m30.done. Class L, party 44-47, monsters 42-65, no boss."
mood: "Sandstone and gold under hieroglyphs (MM6's Tomb of VARN), cold braziers that wake with the torches; one floor of rusted Ancient steel between the tombs and the apex; at the top, gold, blue tiles and a quiet hall."
datum: arrival
