  - id: evt:torch_ne
    preset: switch
    source: switch:torch_ne
    title: Lever
    condition: {not: {qbit: torch_ne}}
    locked_text: The lever is stuck.
    lua: |-
      evt.PlaySoundName("xeen_torch_light")
      if IsQBitSet(QBit(117561)) and IsQBitSet(QBit(117562)) and IsQBitSet(QBit(117563)) and IsQBitSet(QBit(117564)) and not IsQBitSet(QBit(111561)) then
          XeenQuests.hook("m28.torches")
      end
    effects:
      - qbit: torch_ne
      - show_actors: 21
      - show: deco:torch_ne
      - show: deco:brazier_ne
      - lights_on: light:brazier_ne
      - text: "The torch flares up. In the niches, something stirs!"
    notes: "The ne torch (D-61 Q2): one way; lights its torch and the atrium's ne brazier, shows the chapel's two niche mummies (group 21); a second pull 'The lever is stuck.' (aaze0083:39). The last of the four calls m28.torches."
