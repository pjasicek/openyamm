# Playtest of the Great Pyramid's sky door (DD-15, L4; D-58, D-61 Q9): before m30.done (111600) the sky door at the
# top of the sky corridor says "Access Denied!" (aaze0086:5, A3's d7.sky_door_dd15 fail text); with 111600 set it shows
# the standard entrance window (F16, 2026-11-22): Close keeps the party here, OK leaves for D7 at entrance:dd15_sky (11424, 2560, 1408)
# facing 1024. Then D7's way back in: entrance:d7_sky in the sky corridor, facing the throne (south). Numbers are
# ids.lock.yml's (evt:sky_door 67). Run with --world xeen (output/studio_cal/dd15/four.sh).
id: xeen.dd15.l4.sky
title: Great Pyramid (DD-15 L4), the sky door before and after m30.done
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_dd15.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 45, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 45, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 45, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 45, skills: [], equipment: {}}
  - setup_shortcut: {kind: immortal, value: true}
  - advance_runtime: {seconds: 2, present_dialogs: true}
  - play_lua: {source: "close()"}
  - set_pose: {map: xeen_dd15.blv, x: 0, y: 2900, z: 2304, yaw_degrees: 90, pitch: 0}
  - advance_runtime: {seconds: 1}
  - assert: {party_position: {x: 0, y: 2900, radius: 64, z_min: 2296, z_max: 2320}}
  - walk_to: {x: 0, y: 3060, z: 2304, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "status(); click(67); wait(0.5)"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - play_lua:
      source: |
        local s = status()
        log('sky door before m30.done: ' .. s)
  - assert: {dialog: {active: true, text_contains: "Access Denied!"}}
  - play_lua: {source: "close(); if qbit(111600) then error('m30.done set') end"}
  - assert: {map: xeen_dd15.blv}
  - lua_event: {source: "SetQBit(QBit(111600))"}
  - execute_event: {id: 67}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "Close"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - play_lua: {source: "close()"}
  - assert: {map: xeen_dd15.blv}
  - execute_event: {id: 67}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 2, follow_map_move: true}
  - assert: {map: xeen_d7.blv}
  - assert: {party_position: {x: 11424, y: 2560, radius: 128, facing: 1024, facing_within: 64}}
  - play_lua: {source: "log('D7 arrival: ' .. party()); close()"}
  # D7's sky door (door:dd15, after m30.done) comes back to entrance:d7_sky: 256 inside, facing the throne.
  - lua_event: {source: "evt.MoveToMap(0, 2944, 2304, 1536, 0, 0, 0, 0, \"xeen_dd15.blv\")"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_dd15.blv}
  - assert: {party_position: {x: 0, y: 2944, radius: 64, z_min: 2296, z_max: 2320, facing: 1536, facing_within: 64}}
