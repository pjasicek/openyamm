  - advance_runtime: {seconds: 1}
  - assert: {party_position: {x: 1280, y: -1920, radius: 250, z_min: 1528, z_max: 1550}}
  # The far cell's door and the apex stair to L4.
  - walk_to: {x: 1880, y: -2432, z: 1536, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "open_door(18, 3)"}
  - walk_to: {x: 2400, y: -2432, z: 1536, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 2880, y: -2630, z: 1536, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 2880, y: -1680, z: 2304, z_tolerance: 120, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 2624, y: -1250, z: 2304, radius: 64, timeout_seconds: 20, close_dialogs: true}
