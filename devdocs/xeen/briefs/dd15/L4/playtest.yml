  - play_lua: {source: "clear_hostiles(1500)"}
  - walk_to: {x: 2350, y: -1024, z: 2304, radius: 64, timeout_seconds: 20, close_dialogs: true}
  # D-89 (2026-11-22): the antechamber's door wants the Queen's pyramid key (m28.antechamber_door).
  - play_lua: {source: "click(17); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "Queen Kalindra, they say, keeps the key."}}
  - play_lua: {source: "close(); if door_state(2) == 'open' then error('the antechamber door opened without the key') end"}
  - grant_item: {item_id: 12348}
