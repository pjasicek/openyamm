format: 0
level: L2
pitch: "Sheltem's fortress of teal Ancient steel on its mesa. Four conveyor belts carry the party one way to four Lava Heads, each powering an energy field on the floor above; behind the fields four element sundials, set to nine, raise four bridges over the ring chasms to the true-name gate; behind the gate a lift rises to the trapdoor deck and Command Central, where Corak comes out of the Soul Box to face Sheltem."
purpose: "Story M33 (QUESTS.md): the arrival needs Corak's Soul Box (m33.arrival); the four Heads, the four sundials (Xeen.alamarSundial), the true-name gate (Sheltem), the lift, the dais (m33.sheltem), the self-destruct cinematic and the leave to D6. Q-D26's roof hatch to D7. Class L, party 52-55, monsters 50-75."
mood: "Machine hum, green grids and teal steel lit from within; the dial hall's chasms glow in their elements' colours; every window looks at you."
datum: arrival
