# release, the juice, 'Come to ME!'; the dais plate's No and Yes, the cinematic shows Sheltem and Corak, the leave to
# D6's entrance:dd17_gate. Numbers from ids.lock.yml (output/studio_cal/dd17/tools/tests.py).
