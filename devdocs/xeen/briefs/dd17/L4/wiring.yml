    preset: text
    source: panel:screens
    title: Command Central
    text: "Banks of machines over the throne, every light lit."
    notes: The machines over the throne.
  - id: evt:dais
    preset: script
    source: plate:dais
    trigger: step
    condition: {lua: "continueStep == 1"}
    effects:
      - lua: "XeenQuests.hook(\"m33.sheltem\")"
      - cinematic:
          id: cinematic:self_destruct
          then: evt:after_sheltem
    else_effects:
      - lua: |-
          if continueStep ~= nil then
              return
          end
          if not XeenQuests.can("m33.sheltem") then
              XeenQuests.hook("m33.sheltem")
              return
          end
          AskChoiceWithAnswerSteps(eventId, 3, "Before the throne. Open the Soul Box?", {{Answer = "Yes", Step = 1}, {Answer = "No", Step = 2}})
    notes: "D-61 Q16: the dais plate asks first (Yes/No, D-66); Yes calls m33.sheltem (takes the Soul Box, gives the Cube of Power, done 111662, the voiced lines), then the self-destruct cinematic (Sheltem and Corak shown), then the leave to D6. Without the gate or the box: the hook's fail line."
  - id: evt:dial_air
    preset: script
    source: platform:dial_air
    title: Air Time
    lua: |-
      if Xeen.alamarSundial("air", eventId, continueStep) then
          if IsQBitSet(QBit(117612)) then evt.SetDoorState(2, DoorAction.Open) else evt.SetDoorState(2, DoorAction.Close) end
          local reading = Xeen.alamarSundialReading(Xeen.AlamarSundials[2])
          if reading == 9 or reading == 10 then
              evt.PlaySoundName("6stone door0101")
          end
      end
    notes: "m33.sundials: A3's Xeen.alamarSundial(\"air\", ...) asks 'Air Time. The sundial reads N. Turn?', turns it on, says the line at nine and off nine and sets dial_air_nine 117612; when it turned the dial the event sets the air slab from that bit (the grind with it)."
  - id: evt:dial_earth
