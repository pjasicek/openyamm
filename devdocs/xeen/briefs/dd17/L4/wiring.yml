  - id: evt:vault_load
    preset: switch
    trigger: load
    condition: {qbit: vault_open}
    opens: [door:vault]
    notes: The strongroom stays open on every later load.
  - id: evt:vault_release
    preset: switch
    source: switch:vault_release
    title: "Vault release: the strongroom by Command Central"
    condition: {lua: "continueStep == 1"}
    opens: [door:vault]
    sets: {qbit: vault_open}
    effects:
      - text: "Far off, a heavy door grinds up."
    else_effects:
      - lua: |-
          if continueStep ~= nil then
              return
          end
          if IsQBitSet(QBit(117605)) then
              evt.StatusText("The release is down. The strongroom stands open.")
              return
          end
          AskChoiceWithAnswerSteps(eventId, 3, "Vault release. Pull?", {{Answer = "Yes", Step = 1}, {Answer = "No", Step = 2}})
    notes: "One-way (D-43): Yes/No (D-66); vault_open 117605 raises the strongroom's door by the antechamber; after it 'The release is down. The strongroom stands open.'"
