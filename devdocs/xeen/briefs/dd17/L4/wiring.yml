  - id: evt:dials_load
    preset: script
    trigger: load
    lua: |-
      Xeen.alamarSundialsSync()
      if IsQBitSet(QBit(117611)) then evt.SetDoorState(4, DoorAction.Open) else evt.SetDoorState(4, DoorAction.Close) end
      if IsQBitSet(QBit(117612)) then evt.SetDoorState(2, DoorAction.Open) else evt.SetDoorState(2, DoorAction.Close) end
      if IsQBitSet(QBit(117613)) then evt.SetDoorState(5, DoorAction.Open) else evt.SetDoorState(5, DoorAction.Close) end
      if IsQBitSet(QBit(117614)) then evt.SetDoorState(3, DoorAction.Open) else evt.SetDoorState(3, DoorAction.Close) end
    notes: "D-61 map reset: A3's helper rewrites the dial bits 117611-117614 and m33.sundial_nine from the dial variables, then each bridge slab is set from its bit (level while set)."
