    notes: "Q-D26 (D-58, D-61 Q14): q-d26.alamar_hatch ('Bolted from above.' until roof_unlocked 113521); then the standard entrance window (F16, 2026-11-22: OK/Close, no Yes/No): OK moves to D7's entrance:dd17_roof (-18688, 8448, 1536) facing 1024."
  - id: evt:head_air
    preset: script
    source: panel:head_air
    title: Lava Head
    condition: {lua: "continueStep == 1"}
    opens: [door:field_air]
    effects:
      - lua: "XeenQuests.hook(\"m33.head_air\")"
      - set_texture:
          of: panel:head_air
          to: xalavahdx
      - lights_off: light:head_air
      - lua: "evt.PlaySoundName(\"xeen_power_up\")"
      - lua: "evt.SetMapVar(\"AmbientSound8\", 2)"
      - lua: "evt.SetMapVar(\"AmbientSound4\", 2)"
    else_effects:
      - lua: |-
          if continueStep ~= nil then
              return
          end
          if IsQBitSet(QBit(117602)) then
              XeenQuests.hook("m33.head_air")
              return
          end
          AskChoiceWithAnswerSteps(eventId, 3, "The Head speaks: \"Air power field operational.\" Shut the field down?", {{Answer = "Yes", Step = 1}, {Answer = "No", Step = 2}})
    notes: "D-61 Q12, D-66: one Yes/No prompt 'The Head speaks: \"Air power field operational.\" Shut the field down?' (aaze0049:8 joined with the question); Yes calls A3's m33.head_air (head_air_off 117602, 'The Head goes dark. Somewhere above, a field dies.'); the Head goes dark (xalavahdx), its glow and hum stop, the air field on L2 drops (one-way, D-43). Afterwards the hook's else line."
