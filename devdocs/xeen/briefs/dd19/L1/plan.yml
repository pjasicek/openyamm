format: 0
level: L1
pitch: "Behind Sandcaster's guild gate, a precinct of pink ashlar under the Darkside's fading sun: two guild halls face each other across an open court, Xenoc's Mirage Guild and Morgana's Sorceress HQ, joined above by a covered bridge and below by an undercroft of quarters and a vault. Xenoc hides his hall behind a wall that is not there; Morgana sits behind a ward fed by two lamps. Both must die for Astra."
purpose: "Side quest Q-D14 (Astra, Act IV, level 39): kill Xenoc (q-d14.xenoc) and Morgana (q-d14.morgana); Astra's hand-in opens the quarter's houses on D3 and names the party's Rogues Spies. Class M, party 38-41, monsters 32-55, Xenoc 60, Morgana 60."
mood: "Rosy ashlar and marble in the court under a dimming sky; Icewind's cold grey brick and beams in the Mirage Guild; Corlagon's dark brick, skulls and violet flames in the Sorceress HQ; a low dark vault below."
