notes: "Xeen design brief for a new map: DD-19 Wizard Quarter, the precinct behind Sandcaster's guild gate (D3; the source's wizard corner of dark maze0031), as one BLV of three floors: an open-sky guild court between Xenoc's Mirage Guild (west) and Morgana's Sorceress HQ (east), a covered bridge between their upper floors, the Guild Common behind the arcade, and the guilds' quarters, alembic cellar and vault in an undercroft. Side quest Q-D14 (Astra; A3's hooks q-d14.xenoc, q-d14.morgana, q-d14.orange_potion, q-d14.purple_potion, q-d14.blastem; q-d14.quarter_gate is D3's), Promo Spy. Size M (MAPS.md section 0, D-42): 20-45 sectors, 30-90 M units squared, levels 32-55, Xenoc 60, Morgana 60, party 38-41, treasure 4 (hoard 5), music 34. Graph devdocs/xeen/mockups/act4_graphs/dd19.graph.yml with decider D-42 (mockups/act4_a8_decisions.md, which wins): Morgana 60; casters with Carnage Hands and four Iron Golems in the vault, no fighting among the families; the court under open sky (xeen_darkside_fading); Blastem (NPC 5248) a talking actor in the Common, 'The lesson' swaps him for Sorcerer 11191, hostile; the ward fed by two lamps that names them; the font refills spell points, repeatable; nothing changes inside after q-d14.done; the Orange and Purple Potions once per character. Rows (A2): wizards 11190 (Wizard 36 x16, Sorcerer 11191 45 x4, Xenoc 11196 60), sorceresses (Enchantress 11181 40 x10, Grand Sorceress 11182 55 x2, Morgana 11183 60), magic constructs (Carnage Hand 11602 35 x12), material golems (Iron Golem 11582 40 x4). Kill XP 98,846 for the party, 24.71k per member. Rest encounters 10 %: the sorceresses only (D-42). Map qbits 117520-117559 (dd19_arrived_once 117520, A3's); map_stats 9172."
