# Playtest of the Southern Tower's roof stair (DD-06, L4; lane A7, 2026-11-21, decider D-58): the party is put in the
# getaway room on the top floor (1920), walks north into the roof stair, up its flight to the head (2,432) and under
# the roof trapdoor (event 46, evt:roof_trapdoor, on platform:roof_hatch). Without m30.done (111600) A3's d7.roof_dd06
# answers "The trapdoor is shut fast." and the party stays; with it set the hook passes and the trapdoor asks its own
# Yes/No (D-66): No stays, Yes goes up at once (D7 is an indoor map: no leave window) to D7's entrance:dd06_roof
# (5632, -14848, 710) facing 1536, measured there.
id: xeen.dd06.l4.roof
title: Southern Tower (DD-06 L4), the roof stair and its trapdoor (shut before M30, up to D7 after it)
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_dd06.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 24, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 24, skills: [], equipment: {}}
  - assert: {map: xeen_dd06.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - play_lua: {source: "wait(2); close()"}
  - set_pose: {map: xeen_dd06.blv, x: 1100, y: 300, z: 1920, yaw_degrees: 90, pitch: 0}
  - advance_runtime: {seconds: 1}
  - assert: {party_position: {x: 1100, y: 300, radius: 64, z_min: 1912, z_max: 1928}}
  - clear_hostiles: {radius: 4000}
  # Into the roof stair, to the flight's foot, up it to the head and under the trapdoor.
  - walk_to: {x: 1168, y: 860, z: 1920, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 1376, y: 900, z: 1920, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 1376, y: 1760, z: 2432, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 1280, y: 1856, z: 2432, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - assert: {party_position: {x: 1280, y: 1856, radius: 80, z_min: 2424, z_max: 2440}}
  - play_lua: {source: "if qbit(111600) then error('m30.done (111600) is set at the start') end; click(46); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "The trapdoor is shut fast."}}
  - play_lua:
      source: |
        close(); wait(0.7)
        local s = tostring(status())
        if string.find(s, 'Not open yet', 1, true) then error('the sealed line showed before m30.done: ' .. s) end
  - assert: {dialog: {active: false}}
  - assert: {map: xeen_dd06.blv}
  # With m30.done the hook passes and the game's entrance window asks (F16, 2026-11-22: was D-66's Yes/No); OK goes
  # up to D7's entrance:dd06_roof.
  - setup_shortcut: {kind: set_qbit, id: 111600, value: true}
  - play_lua: {source: "click(46); wait(0.5)"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d7.blv}
  - assert: {dialog: {active: false}}
  - play_lua: {source: "log('landing: ' .. status())"}
  - clear_hostiles: {radius: 6000}
  - advance_runtime: {seconds: 4.0}
  - play_lua: {source: "log('landing after 4 s: ' .. status())"}
  - assert: {party_position: {x: 5632, y: -14848, radius: 160, z_min: 640, z_max: 800}}
