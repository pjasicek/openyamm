# Playtest of the Southern Tower's door onto D2 (DD-06, L4; lane A7, 2026-11-20): the front door (event 17,
# evt:front_door, the exit preset) out to A6's point in front of D2's door:dd06 (15872, -7680, 1056), facing north.
id: xeen.dd06.l4.exit
title: Southern Tower (DD-06 L4), the front door out to D2
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_dd06.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 24, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 24, skills: [], equipment: {}}
  - assert: {map: xeen_dd06.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - play_lua: {source: "wait(3)"}
  - walk_to: {x: 640, y: 1900, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - execute_event: {id: 17}
  - assert: {dialog: {active: true, text_contains: "Do you wish to leave"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d2.odm}
  - play_lua: {source: "status()"}
  - assert: {party_position: {x: 15872, y: -7680, radius: 160, z_min: 1000, z_max: 1120}}
