format: 0
level: L1
pitch: "A crooked black-timbered tower in Toad Meadow, visible from Vertigo, where the witches turn stolen children into goblins. Four floors stand round one central shaft; at its bottom a cauldron the size of a room bubbles green, and its steam rises past every floor's balcony. The stairs alternate sides, so each floor must be crossed: the goblin works and the warden's cage on the ground floor, the schoolroom where caged children are taught to be goblins on the second, the vat hall of the brewing witches on the third, and behind a door that answers only to the word a rescued child whispers, 'Rosebud', the coven's sanctum on the fourth. There the Alacorn of Falista stands on a narrow bridge over the shaft. Taking it makes the cauldron boil over; the witches' ingredient hoist is the quick way down. A half-turned boy on the ground floor will not leave until the Alacorn cures him. The roof stair stays sealed until the party are Crusaders, and then leads up into the clouds."
purpose: "Story step M4 and promotion T1-A: take the Alacorn of Falista and bring it to Old Valia (X1). Four caged children to free (a little experience each, and Valia's thanks); the password door; a boss; the first view of the sky maps (the roof opens to X8 after M4). Monster levels 4 to 14; a party of about level 8 to 10."
mood: "Grim fairy tale with a crooked smile: green cauldron light from below on black timber, steam, toads, little beds and a chalk-board lesson for children; it gets darker and quieter as the party climbs."
datum: arrival
