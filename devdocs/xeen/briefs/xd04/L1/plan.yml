notes: "Size M (about 52 monsters in about 30 sectors, 1.7 per sector; the empty stair cores pull the average down, the rooms themselves run 2 to 3). One BLV: four floors 640 apart (clear 448 to 768 under 640 floor-to-floor) stacked round one shaft, with the stairs on alternating sides (east, west, north) so each floor is crossed. Fights: none in the gate hall, landings, stairs or roof; light on the ring; heavy in the goblin pens, the vat hall and the sanctum. Nearly every room is curved or wedge-shaped (a round tower); the conical roof gives the sanctum and the bedchamber sloped ceilings. Risers are 32 throughout; the lowest ceiling is 384 (stairs, herb loft, hidden cage). The dormitory's secret cupboard is a container, not a space. The chests: warden's lodge, herb loft, bedchamber, and the dormitory cupboard."
