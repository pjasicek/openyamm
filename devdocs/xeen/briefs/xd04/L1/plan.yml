points_of_interest:
  - id: poi:cages
    spaces: [room:warden_lodge, room:schoolroom, room:hidden_cage, room:witch_bedchamber]
    count: 4
    kind: cage
    behaviour: "A child in a cage. The warden's ring opens it; the child thanks the party and runs home to Toad Meadow (a little experience, about 500 per child for the party). Child 2 whispers 'Rosebud'. Child 1, the half-turned boy, steps out but will not leave until the Alacorn is used on him."
    uses: {times: 1, per: party, reset: never}
    condition: {item: warden_ring}
  - id: poi:hoist_brake
    space: room:hoist_room
    kind: lever
    behaviour: "Releases the hoist brake: the cage drops to the cauldron chamber with a rattle; from then on it can be called and ridden from either end."
    uses: {times: 1, per: party, reset: never}
    gives:
      map_var: hoist_released
  - id: poi:recipe_card
    space: room:herb_loft
    kind: note
    behaviour: "Readable: 'Strength brew - the vat with the toad on its lid. NOT the bubbling one (Agnes). NOT the green one, unless you want to be green.' Names the good vat."
  - id: poi:slate_board
    space: room:schoolroom
    kind: sign
    behaviour: "Readable lesson: 'HOW TO BE A PROPER GOBLIN. 1. Never say please. 2. Never wash. 3. Forget your name.' A child has scratched 'Rosebud' small in the corner, half rubbed out."
  - id: poi:talking_skulls
    space: room:skull_niche
    kind: talking skull
    behaviour: "Three skulls who sell low spell scrolls of the Mind, Body and Air schools for 5 to 10 gems each (gems as the second currency); they also insult the party."
  - id: poi:vats
    space: room:vat_hall
    count: 3
    kind: vat
    behaviour: "Drinking from a vat: the toad-lid vat gives +2 permanently to one stat drawn at random, once per character (MM barrel style; the Act I permanent budget is about +10 per character with the XD-02 pools); the bubbling vat poisons; the green vat turns the drinker's skin green (Weak until rest)."
    uses: {times: 1, per: character, reset: never}
landmarks:
  - id: landmark:alacorn
    space: room:shaft_bridge
    what: "The Alacorn glowing white on its pedestal high over the shaft, the one clean light in the tower; seen from below through the steam."
    seen_from: [room:cauldron_chamber, room:balcony_f2, room:broken_balcony, room:coven_sanctum]
  - id: landmark:cauldron
    space: room:cauldron_chamber
    what: "The green-lit cauldron at the bottom of the shaft, seen from every balcony."
    seen_from: [room:cauldron_chamber, room:balcony_f2, room:broken_balcony, room:coven_sanctum, room:shaft_bridge]
sightlines:
  - id: sightline:roof_vista
    from: room:roof
    to: [room:roof]
    what: "From the roof, Toad Meadow and Vertigo below and the meadows ending at the world's rim to the east, the stars beneath it; the cloud stair climbing above."
    notes: "Looks out of the map (X1 as a backdrop); the schema has no target for a view of another map."
  - id: sightline:shaft_up
    from: room:cauldron_chamber
    to: [void:cauldron_shaft, landmark:alacorn]
    what: "From the cauldron's rim, straight up the steaming shaft past three balconies to the Alacorn's glow: the whole tower's goal shown in the first room."
set_pieces:
  - id: set:boil_over
    kind: scripted
    spaces: [room:shaft_bridge, room:coven_sanctum, void:cauldron_shaft]
    effect: {damage: "Body, every few seconds on the bridge"}
    rule: "Taking the Alacorn makes the cauldron boil over: a roar, a camera shake and a column of green steam rising up the shaft. For about a minute anyone on the bridge takes Body damage every few seconds; on the floors the steam only hides the shaft. Any goblins left alive below come up the stairs."
    inputs: [take the Alacorn]
    states: [simmering, boiling over, settled]
    enabled_by: {qbit: alacorn_taken}
  - id: set:cure_the_boy
    kind: scripted
    spaces: [room:warden_lodge]
    rule: "The half-turned boy steps out of his opened cage but refuses to go home with goblin ears. Using the Alacorn on him cures him (one of its charges, which it regains), and he runs home."
    inputs: [open cage 1, use the Alacorn on the boy]
    states: [caged, out but waiting, cured and gone]
    enabled_by: {item: alacorn}
    gives:
      qbit: child_rescued_1
  - id: set:head_witch
    kind: boss
    spaces: [room:coven_sanctum]
    rule: "The Head Witch curses (Weak) from the far side of the shaft and, once at half health, calls up two toads from the floor's witch-marks and crosses toward the bridge; she does not leave the floor."
    inputs: [her health]
    states: [cursing, summoning, dead]
    gives:
      qbit: head_witch_slain
    population:
      - {actor: Giant Toad, role: summoned familiar, groups: 2, levels: [11, 11], placed: true, strength: light, hidden_until: {map_var: head_witch_half}}
  - id: set:rosebud_door
    kind: puzzle
    spaces: [room:rosebud_landing]
    rule: "The carved face asks for the word. 'Rosebud' (from child 2, or the half-rubbed slate) opens the door for good. Any other answer puts a small jinx on the speaker (a curse until rest) and the face closes its eyes."
    inputs: [typed answer]
    states: [shut, open]
    solution: rosebud
  - id: set:shaft_view
    kind: vista
    spaces: [room:cauldron_chamber, void:cauldron_shaft, room:shaft_bridge]
    rule: "The first room shows the goal: the Alacorn high above the cauldron. Each floor's balcony shows it again from nearer."
  - id: set:vats
    kind: puzzle
    spaces: [room:vat_hall, room:herb_loft]
    rule: "Three vats: one strengthens, one poisons, one turns the drinker green. The recipe card in the herb loft names the good one."
    inputs: [drink from a vat]
    states: ["per character: untried", "per character: used"]
    solution: The vat with the toad on its lid.
