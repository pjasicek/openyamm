notes: "XD-04 Witch Tower, L3 sketch. The L1 tower stacks four floors round one shaft; rooms.yml cannot put a room over another (R3-K7), so the tower is drawn crooked: each storey is skewed a quarter turn round the shaft (ground floor south, second floor east, third floor north, fourth floor west, roof further west), and its balconies climb the shaft's walls in a spiral. The shaft and the cauldron chamber are one room 2688 high, seen from every floor. Walls are 64 thick between rooms an opening joins. Heights: floors at 0, 640, 1280 and 1920, the herb loft 1472, the roof 2560; risers 32 throughout."
