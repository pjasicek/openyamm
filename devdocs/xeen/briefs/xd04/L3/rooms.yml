    wall: {texture: hhm3b, size: [128, 256]}
    floor: {texture: 7trimd, size: [128, 256]}
    ceiling: {texture: hwm2rf, size: [128, 128]}
    reveal: {texture: hdp2b, size: [128, 256]}
    door: {texture: hhm3d, size: [128, 256], fit: true}
