notes: "Xeen design brief, level L3, for a new map (no original to rebuild). Story step M4 and promotion T1-A (devdocs/xeen/QUESTS.md): take the Alacorn of Falista to Old Valia, who makes the party Crusaders and promotes Knights, Paladins and Rangers; she also sets m4_crusaders, which unseals the roof. Encounter slots are Xeen families from devdocs/xeen/MONSTERS_AND_ITEMS.md: 1 Goblins and gremlins (Goblin 4 / Gremlin 6 / Gremlin Guard 10), 2 Witches (Wicked Witch 14 only), 3 Swamp Things (Giant Toad 11, the witches' familiars). Monster levels 4 to 14; the Head Witch is a Wicked Witch at 14 with boss hit points. Provisional ids: map_stats row 9134, qbits 110040-110047, items 12031-12033 (Xeen ranges, devdocs/xeen/PRODUCTION.md); none registered. The Alacorn is the relic of MONSTERS_AND_ITEMS.md §4.2. From L2 the tower is drawn crooked (each storey a quarter turn round the shaft, no room over another), so the footprint is 23 by 11 cells and the map climbs counter-clockwise from the south to the west, the roof furthest west. Music 'tower_dark' is a Xeen track still to be chosen: the game reads map_stats music as a track number, so a playable build needs a number here (a scratch build with 42, the MM6 dungeon track, loads and walks)."
