      - author: agent:xeen-fb4-town
        text: "He has a name and a voice now: hovering him reads 'Goblin-eared boy', and clicking him opens his talk (Toad Meadow Child). His Ears topic tells you what he wants: the warden's ring while he is caged, then the Alacorn on the plank bridge over the cauldron shaft, three floors up. With the Alacorn in your packs he is cured, runs home and you get the 200 experience once. Clicking his cage with the Alacorn still works the same way."
