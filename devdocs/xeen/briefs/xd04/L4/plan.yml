notes: "Size M by monsters (about 52 in 32 sectors, 1.6 per sector; the empty stairs and landings pull the average down, the rooms run 2 to 3) and doors (13 movers including the hoist cage and its gate); floor area 34.9 M, under the M band's 40 (the L1 extents add up to 36.7 M; the L1 total of 42 was optimistic). One BLV, drawn as a crooked tower because no room may stand over another (rooms.yml R3-K7): each storey is skewed a quarter turn round the shaft, ground floor south, second east, third north, fourth west, the roof furthest west, and the floors' openings onto the shaft climb its walls in a spiral. The shaft is the cauldron chamber's own height (2688). Floors at 0, 640, 1280 and 1920 (the herb loft 1472, the roof 2560); risers 32 throughout, treads 64. Stairs: a quarter turn east (south-east corner), a quarter turn west (north-east corner), one long straight north stair, one straight roof stair. Fights: none in the gate hall, landings, stairs or roof; light on the gallery and balconies; heavy in the goblin pens, the vat hall and the sanctum. Lowest ceiling 384 (herb loft, hidden cage, the stairs' clearance); the sanctum is 832 high and flat (no sloped ceilings, R3-K5). Chests: warden's lodge (tier 2), herb loft (tier 2), bedchamber (tier 3), the dormitory cupboard (tier 1); chests sit one tier above the monsters around them (MONSTERS_AND_ITEMS.md 4.1), map treasure level 2. Gems in every chest feed the talking skulls. Loops: 3 that the party walks (the tower ring through the hoist, the second floor, the two arches) plus the one-way drop; the sector graph of the built sketch counts 6, because the rails and windows onto the shaft are portals too."
