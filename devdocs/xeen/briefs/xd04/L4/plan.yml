    notes: "Looks out of the map (X1 as a backdrop); the schema has no target for a view of another map."
  - id: sightline:shaft_up
    from: room:cauldron_chamber
    to: [void:cauldron_shaft, landmark:alacorn]
    what: "From the cauldron's rim, straight up the steaming shaft past the balcony rail (east), the broken balcony (north) and the sanctum's window to the Alacorn's white light on the west buttress: the whole tower's goal and its spiral of floors shown in the first room."
set_pieces:
  - id: set:boil_over
    kind: scripted
    spaces: [room:shaft_bridge, room:coven_sanctum, void:cauldron_shaft]
    effect: {damage: "Body, every few seconds on the pier"}
    rule: "Taking the Alacorn makes the cauldron boil over: a roar, a camera shake and a column of green steam rising up the shaft (indoor fog thickening in the chamber). For about a minute anyone on the pier takes Body damage every few seconds; elsewhere the steam only hides the shaft. Any goblins left alive below come up the stairs."
    inputs: [take the Alacorn]
    states: [simmering, boiling over, settled]
    enabled_by: {qbit: alacorn_taken}
  - id: set:cure_the_boy
    kind: scripted
    spaces: [room:warden_lodge]
    rule: "The half-turned boy steps out of his opened cage but refuses to go home with goblin ears. Using the Alacorn on him cures him (one of its charges, which it regains), and he runs home."
    inputs: [open cage 1, use the Alacorn on the boy]
    states: [caged, out but waiting, cured and gone]
    enabled_by: {item: alacorn}
    gives:
      qbit: child_rescued_1
  - id: set:head_witch
    kind: boss
    spaces: [room:coven_sanctum]
    rule: "The Head Witch curses (Weak) from the far side of the shaft and, once at half health, calls up two toads from the floor's witch-marks and crosses toward the bridge; she does not leave the floor."
    inputs: [her health]
    states: [cursing, summoning, dead]
    gives:
      qbit: head_witch_slain
    population:
      - {actor: Giant Toad, role: summoned familiar, groups: 2, levels: [11, 11], placed: true, strength: light, hidden_until: {map_var: head_witch_half}}
  - id: set:rosebud_door
    kind: puzzle
    spaces: [room:rosebud_landing]
    rule: "The carved face asks for the word. 'Rosebud' (from child 2, or the half-rubbed slate) opens the door for good. Any other answer puts a small jinx on the speaker (a curse until rest) and the face closes its eyes."
    inputs: [typed answer]
    states: [shut, open]
    solution: rosebud
  - id: set:shaft_view
    kind: vista
    spaces: [room:cauldron_chamber, void:cauldron_shaft, room:shaft_bridge]
    rule: "The first room shows the goal: the Alacorn's light high on the west buttress above the cauldron. Each floor's opening on the shaft shows it again from nearer, a quarter turn further round."
  - id: set:vats
    kind: puzzle
    spaces: [room:vat_hall, room:herb_loft]
    rule: "Three vats: one strengthens, one poisons, one turns the drinker green. The recipe card in the herb loft names the good one."
    inputs: [drink from a vat]
    states: ["per character: untried", "per character: used"]
    solution: The vat with the toad on its lid.
mechanisms:
  - {kind: hinged door, count: 6, notes: "Plank leaves in the floor's theme, swinging away from whoever clicks them, from either side: gallery to the warden's lodge, the toad larder and the goblin pens; landing to dormitory; dormitory to schoolroom; sanctum to bedchamber."}
  - {kind: double hinged door, count: 1, notes: "Balcony to schoolroom, two leaves on one click."}
  - {kind: password door, count: 1, notes: "The Rosebud door (set:rosebud_door): a hinged carved leaf (hdm1d) that opens for good on the typed answer 'rosebud'; a wrong answer curses the speaker until rest. The face is a clickable face of the leaf."}
  - {kind: ward door, count: 1, notes: "Sanctum to roof stair: a translucent shimmering leaf that drops out of sight once qbit m4_crusaders is set; until then a click shows its text."}
  - {kind: roof hatch, count: 1, notes: "A plank hatch-door at the head of the roof stair, sliding up on a click (it never locks: the ward below is the lock)."}
  - {kind: secret bookcase door, count: 1, notes: "Vat hall to the hidden cage: a secret-flagged bookcase face (7t1books) that swings in on a click; a placed crying sound behind it is the clue."}
  - {kind: secret cupboard, count: 1, notes: A secret-flagged panel in the dormitory's east wall that opens as a chest.}
  - {kind: hoist (lift), count: 1, notes: "objects.yml lift in room:hoist_slot: 448 square (the slot's full size), travel 1920, speed 192, state up. Walked in the scratch build: the cage carries the party from 1928 to 8."}
  - {kind: brake lever, count: 1, notes: "A switch on the hoist room's north wall: its first pull lowers the cage and sets hoist_released; after that, clicking the cage moves it, and a call switch beside each door brings it."}
  - {kind: call switch, count: 2, notes: "Beside the hoist's upper and lower doors; work once hoist_released."}
  - {kind: hoist gate, count: 1, notes: "A sliding gate across the hoist room's door to the slot, closed whenever the cage is down (a 1920 drop otherwise); moved by the same events as the cage."}
  - {kind: cage, count: 4, notes: "Clickable cage decorations (bonecage on the floor, a hanging cage in the bedchamber) with a child NPC beside or inside each; the warden's ring opens them (poi:cages)."}
  - {kind: vat, count: 3, notes: "Clickable open barrels (bigbarel) on plinths; per-character map variables (poi:vats)."}
  - {kind: harmful liquid (cauldron), count: 1, notes: "The cauldron platform's top as a damaging floor face (Body damage per step); liquids are not built in S3, so at L4 a pressure-plate face with a damage event."}
  - {kind: talking skull vendor, count: 3, notes: Clickable skull decorations in the skull niche (poi:talking_skulls).}
  - {kind: readable, count: 2, notes: The slate wall (schoolroom) and the recipe card (herb loft).}
  - {kind: chest, count: 3, notes: "Warden's lodge (tier 2), herb loft (tier 2), bedchamber (tier 3); plus the secret cupboard (tier 1)."}
  - {kind: exit, count: 2, notes: "The tower door in the gate hall's south wall (to X1, needs the Crystal Key from outside) and the cloud stair on the roof's west wall (to X8, after M4)."}
