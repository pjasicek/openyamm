atmosphere: "A tower that is lit from below and darkens as it climbs. Music: tower_dark (a Xeen dungeon track still to be chosen) everywhere; sound environment stone hall. The cauldron chamber is the brightest place: three green lights up the shaft's axis and four braziers round the cauldron, minimum ambient 10, with a thin green-grey indoor fog in the shaft for the steam. The ground floor is torchlit (ordinary torches, one per 768 of wall, ambient 14), the second floor dim and candlelit (sconces, ambient 14 to 18), the third floor lit by the fires under the vats and a few lanterns (ambient 16 to 18, the broken balcony unlit), the fourth floor dark (green-flame torches and candlesticks only, ambient 20 to 24, the north stair unlit): about 39 placed lights for 32 sectors, all with visible sources, none of them in the stairs but at the turns. The Alacorn is a white point light, the one clean colour in the tower, seen from the cauldron floor. Placed sounds: the cauldron bubbling (loop, at the cauldron), the winch creaking (hoist room), dripping (toad larder), a child crying behind the bookcase (vat hall's west wall), wind on the roof. The roof is open sky over Toad Meadow (bright, ambient 4)."
