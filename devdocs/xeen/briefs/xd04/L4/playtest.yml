# Playtest of the Witch Tower (XD-04, L4), the critical path and the way back, as a player meets it (pass two): a
# level-9 party enters by the tower door, kills the Goblin Warden in his lodge (the lodge's cue names the ring of keys
# in his strongbox), finds cage 1 locked (its message says where the ring is), takes the ring from the strongbox, opens
# cage 1 (it is hoisted up its chain; the half-turned boy steps out but will not go home), loots the warden's
# strongbox; looks into the goblin pens (the skull over the straw shouts at the goblins); climbs the east stair, opens
# the dormitory, finds the loose panel and loots the goblin's hoard, goes through the mistress's door into the
# schoolroom (the caged girl calls out), kills the schoolmistress, reads the slate (a message window), frees child 2,
# Rosebud (her message names the herb loft's stores, where the coven's key to the face door is), leaves by the double
# door; refuses the Mind skull's "Feed me!" and buys three scrolls of Heal from the Body skull for a gem; climbs the west
# stair to the vat hall, walks up to the herb loft (the recipe card; the witches' stores give the coven's key), drinks
# from the good vat (once only), hears the crying at the bookcase, opens it and frees child 3 (the boy wants to go
# home); crosses the broken balcony, climbs the north stair, opens the face door with the coven's key (no password
# since pass two, the user's decision); kills the sanctum's guard and the Head Witch's sisters (her familiars crawl out
# of the floor), the Head Witch, finds the ward shut, frees child 4 in the bedchamber, hears the two vanity skulls and
# loots the coven's cabinet; crosses the bridge over the shaft and takes the Alacorn (the cauldron boils over);
# releases the hoist's brake, calls the cage up, rides it down to the cauldron floor, walks out by the arches, cures
# the boy with the Alacorn and leaves by the tower door with every bit and the Alacorn.
# Event, door, map-variable and light numbers are ids.lock.yml's; actors are the scene's (0-3 the children, 4-5 the
# familiars, 6 the Head Witch, 7 the schoolmistress, 8-9 the sisters, 10 the warden). Nothing depends on chance: only
# chests' fixed items are checked, every walk past a spawn point clears hostiles near it, counts are near what they
# count.
id: xeen.xd04.l4.walk
title: Witch Tower (XD-04 L4), the tower door to the Alacorn and back by the hoist, every mechanism
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_xd04.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 9, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 9, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 9, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 9, skills: [], equipment: {}}
  - assert: {map: xeen_xd04.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - assert: {party_position: {x: 0, y: -2900, radius: 64, z_min: -8, z_max: 8}}
  # The gate hall and the gallery: the first goblins at its west end.
  - walk_to: {x: 0, y: -1700, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - walk_to: {x: -700, y: -1312, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 900}
  - walk_to: {x: -1420, y: -1312, z: 0, radius: 48, timeout_seconds: 30, clear_hostiles: 900}
  - clear_hostiles: {radius: 900}
  # The warden's lodge: its plank door, the Goblin Warden at his table; his strongbox holds the ring of keys.
  - play_lua:
      source: |
        if door_state(20) ~= "closed" then error("the warden's door does not start shut") end
        click(24); wait(3)
        if door_state(20) ~= "open" or door_state(21) ~= "open" then error("the warden's door did not open: " .. door_state(20) .. door_state(21)) end
  - walk_to: {x: -1750, y: -1312, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - clear_hostiles: {radius: 1000}
  - assert: {actor_visible: {actor_index: 10, dead: true}}
  - assert: {actor_visible: {actor_index: 0, dead: false, hidden: false}}
  # The lodge's cue ran on entering (the boy points at the strongbox; the status line does not keep it).
  - assert: {state_dump_map_var: {index: 15, value: 1}}
  # Cage 1, locked: its message says where the ring is.
  - walk_to: {x: -2660, y: -1820, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - play_lua: {source: "if has_item(12032) then error('the party has the ring before the strongbox') end; click(7); wait(1)"}
  - assert:
      dialog: {text_contains: "strongbox"}
  - play_lua: {source: "if not close() then error('the locked cage opened no message window') end; if door_state(26) ~= 'closed' then error('cage 1 moved without the ring') end"}
  # The ring of keys is in the warden's strongbox (the user missed it as a small item on the table, 2026-11-13).
  - walk_to: {x: -1880, y: -1720, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - play_lua:
      source: |
        loot_chest(48)
        if held() ~= 0 then stow() end
        if not has_item(12032) then error("the strongbox did not hold the ring of keys") end
        if not has_item(177) or not has_item(222) then error("the strongbox did not hold its zircon and potion") end
  # Cage 1 opens: hoisted up its chain; the boy steps out but will not go home with goblin ears.
  - walk_to: {x: -2660, y: -1820, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - play_lua: {source: "click(7); wait(1)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[Not with these ears]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "close(); wait(3); if door_state(26) ~= 'open' then error('cage 1 was not hoisted: ' .. door_state(26)) end"}
  - play_lua: {source: "if not qbit(110048) then error('opening cage 1 did not set boy_waiting') end"}
  - play_lua: {source: "click(7); wait(1)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[budge]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "close(); if qbit(110040) then error('child_rescued_1 set too early') end"}
  # Back along the gallery; the goblin pens: over the straw, the source's skull shouts at the goblins (phase 0).
  - walk_to: {x: -1420, y: -1312, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - walk_to: {x: 1120, y: -1400, z: 0, radius: 48, timeout_seconds: 40, clear_hostiles: 900}
  - play_lua:
      source: |
        click(22); wait(3)
        if door_state(13) ~= "open" then error("the pen door did not open: " .. door_state(13)) end
  - walk_to: {x: 1120, y: -1800, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1400}
  - clear_hostiles: {radius: 1400}
  - walk_to: {x: 900, y: -2400, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1400}
  - walk_to: {x: 1600, y: -2700, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1400}
  - play_lua: {source: "click(55); wait(1)"}
  - assert:
      dialog: {text_contains: "Goblins back to work!"}
  - play_lua: {source: "if not close() then error('the pens skull opened no message window') end"}
  - walk_to: {x: 900, y: -2400, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1400}
  - walk_to: {x: 1120, y: -1800, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1400}
  - walk_to: {x: 1120, y: -1400, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  # Up the east stair to the second-floor landing.
  - walk_to: {x: 1400, y: -1312, z: 0, radius: 64, timeout_seconds: 40, clear_hostiles: 900}
  - walk_to: {x: 2560, y: -1312, z: 320, radius: 64, timeout_seconds: 30, clear_hostiles: 900}
  - walk_to: {x: 2560, y: -900, z: 360, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - walk_to: {x: 2560, y: 0, z: 640, radius: 64, timeout_seconds: 30, clear_hostiles: 900}
  - play_lua: {source: "wait(1)"}
  - assert: {party_position: {x: 2560, y: 0, radius: 100, z_min: 632, z_max: 648}}
  # The dormitory: its door, the turned children; the loose panel in the end wall and the goblin's hoard.
  - walk_to: {x: 2740, y: 64, z: 640, radius: 48, timeout_seconds: 30, clear_hostiles: 1000}
  - play_lua:
      source: |
        click(19); wait(3)
        if door_state(4) ~= "open" then error("the dormitory door did not open: " .. door_state(4)) end
  - walk_to: {x: 3050, y: 64, z: 640, radius: 64, timeout_seconds: 30, clear_hostiles: 1200}
  - clear_hostiles: {radius: 1200}
  - walk_to: {x: 4430, y: 416, z: 640, radius: 48, timeout_seconds: 30, clear_hostiles: 1000}
  - play_lua:
      source: |
        if door_state(3) ~= "closed" then error("the loose panel does not start shut") end
        click(17); wait(4)
        if door_state(3) ~= "open" then error("the loose panel did not open: " .. door_state(3)) end
        loot_chest(46)
        if held() ~= 0 then stow() end
        if not has_item(180) then error("the goblin's hoard did not hold its amber") end
  # The mistress's door into the schoolroom: the schoolmistress and her pupils.
  - walk_to: {x: 3136, y: 900, z: 640, radius: 48, timeout_seconds: 30, clear_hostiles: 1000}
  - play_lua:
      source: |
        click(21); wait(3)
        if door_state(11) ~= "open" then error("the mistress's door did not open: " .. door_state(11)) end
  - walk_to: {x: 3136, y: 1250, z: 640, radius: 64, timeout_seconds: 30, clear_hostiles: 1400}
  - clear_hostiles: {radius: 1400}
  - assert: {actor_visible: {actor_index: 7, dead: true}}
  # The caged girl called out as the party came in (cue_schoolroom's once-variable).
  - assert: {state_dump_map_var: {index: 16, value: 1}}
  # The slate (a message window with the lesson and Rosebud's name); cage 2: Rosebud says where the coven's key is.
  - walk_to: {x: 3250, y: 1500, z: 640, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - play_lua: {source: "click(38); wait(1)"}
  - assert:
      dialog: {text_contains: "her own name: Rosebud"}
  - play_lua: {source: "if not close() then error('the slate opened no message window') end; wait(1)"}
  - walk_to: {x: 2752, y: 2080, z: 640, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - assert: {actor_visible: {actor_index: 1, hidden: false}}
  - play_lua: {source: "click(8); wait(1)"}
  - assert:
      dialog: {text_contains: "in their stores in the herb loft"}
  - play_lua:
      source: |
        if not close() then error("Rosebud's words opened no message window") end
        wait(3)
        if not qbit(110041) or not qbit(110044) then error("child 2 was not freed or did not tell of the key") end
        if door_state(27) ~= "open" then error("cage 2 was not hoisted: " .. door_state(27)) end
  - assert: {actor_visible: {actor_index: 1, hidden: true}}
  # Out by the double door onto the balcony; the talking skull of the Body sells three scrolls of Heal for a gem.
  - walk_to: {x: 1720, y: 1312, z: 640, radius: 48, timeout_seconds: 30, clear_hostiles: 1000}
  - play_lua:
      source: |
        click(23); wait(3)
        if door_state(17) ~= "open" or door_state(18) ~= "open" then error("the schoolroom doors did not open") end
  - walk_to: {x: 1312, y: 1312, z: 640, radius: 64, timeout_seconds: 30, clear_hostiles: 900}
  - walk_to: {x: 1312, y: 704, z: 640, radius: 64, timeout_seconds: 30, clear_hostiles: 900}
  - clear_hostiles: {radius: 900}
  - walk_to: {x: 2140, y: 576, z: 640, radius: 48, timeout_seconds: 30, clear_hostiles: 1000}
  # The Mind skull opens with the source's "Feed me!" (phase 0); no gem for it.
  - play_lua: {source: "click(35); wait(0.5)"}
  - assert:
      dialog: {text_contains: "Feed me!"}
  - answer_input: {text: "No"}
  - advance_runtime: {seconds: 1}
  - play_lua: {source: "close(); wait(0.5)"}
  - play_lua: {source: "remember('gems', tostring(item_count(177) + item_count(178) + item_count(180))); remember('heal', tostring(item_count(367))); click(36); wait(0.5)"}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 1}
  - play_lua:
      source: |
        for _ = 1, 3 do if held() ~= 0 then stow() end end
        local heal = item_count(367) - tonumber(recall('heal'))
        if heal ~= 3 then error("the skull did not sell three scrolls of Heal: " .. heal) end
        local gems = item_count(177) + item_count(178) + item_count(180)
        if gems ~= tonumber(recall('gems')) - 1 then error("the skull did not take one gem: " .. recall('gems') .. " -> " .. gems) end
  # The west stair to the third-floor landing and the vat hall.
  - walk_to: {x: 1312, y: 1450, z: 640, radius: 64, timeout_seconds: 30, clear_hostiles: 900}
  - walk_to: {x: 1312, y: 2528, z: 960, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - walk_to: {x: 700, y: 2528, z: 1120, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - walk_to: {x: 0, y: 2560, z: 1280, radius: 64, timeout_seconds: 30, clear_hostiles: 900}
  - play_lua: {source: "wait(1)"}
  - assert: {party_position: {x: 0, y: 2560, radius: 100, z_min: 1272, z_max: 1288}}
  - walk_to: {x: -650, y: 2400, z: 1280, radius: 64, timeout_seconds: 30, clear_hostiles: 1600}
  - clear_hostiles: {radius: 1600}
  # Up the loft steps: the recipe card and the witches' stores.
  - walk_to: {x: -520, y: 1824, z: 1280, radius: 48, timeout_seconds: 30, clear_hostiles: 1000}
  - walk_to: {x: 200, y: 1824, z: 1472, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - play_lua: {source: "wait(1)"}
  - assert: {party_position: {x: 200, y: 1824, radius: 100, z_min: 1464, z_max: 1480}}
  - walk_to: {x: 300, y: 2060, z: 1472, radius: 48, timeout_seconds: 30, clear_hostiles: 1000}
  - play_lua: {source: "click(32); wait(1); close(); wait(1)"}
  - walk_to: {x: 780, y: 2060, z: 1472, radius: 48, timeout_seconds: 30, clear_hostiles: 1000}
  - play_lua:
      source: |
        loot_chest(47)
        if held() ~= 0 then stow() end
        if not has_item(226) or not has_item(224) then error("the witches' stores did not hold their potions") end
        if not has_item(12034) then error("the witches' stores did not hold the coven's key") end
  # The vat with the toad on its lid: once for each character.
  - walk_to: {x: 200, y: 1824, z: 1472, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - walk_to: {x: -520, y: 1824, z: 1280, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - walk_to: {x: -2048, y: 2650, z: 1280, radius: 64, timeout_seconds: 30, clear_hostiles: 1200}
  - play_lua:
      source: |
        status()
        click(42); wait(1)
        local seen = status()
        if not string.find(seen, "stronger", 1, true) then error("the good vat did nothing: " .. seen) end
        click(42); wait(1)
        seen = status()
        if not string.find(seen, "nothing more", 1, true) then error("the good vat worked twice: " .. seen) end
  # The bookcase: crying behind it; it rises on a click; child 3.
  - walk_to: {x: -2400, y: 2368, z: 1280, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - assert: {state_dump_map_var: {index: 10, value: 1}}
  - walk_to: {x: -2540, y: 2368, z: 1280, radius: 48, timeout_seconds: 30, clear_hostiles: 1000}
  - play_lua:
      source: |
        if door_state(2) ~= "closed" then error("the bookcase does not start shut") end
        click(5); wait(5)
        if door_state(2) ~= "open" then error("the bookcase did not open: " .. door_state(2)) end
  - walk_to: {x: -2850, y: 2300, z: 1280, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - play_lua:
      source: |
        click(9); wait(1)
  - assert:
      dialog: {text_contains: "I want to go home"}
  - play_lua:
      source: |
        if not close() then error("freeing child 3 opened no message window") end
        if not qbit(110042) then error("child 3 was not freed") end
  - assert: {actor_visible: {actor_index: 2, hidden: true}}
  # The broken balcony and the north stair to the Rosebud landing.
  - walk_to: {x: -2400, y: 2368, z: 1280, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - walk_to: {x: -896, y: 1750, z: 1280, radius: 64, timeout_seconds: 30, clear_hostiles: 1200}
  - walk_to: {x: -896, y: 1312, z: 1280, radius: 64, timeout_seconds: 30, clear_hostiles: 1200}
  - walk_to: {x: -1300, y: 1312, z: 1280, radius: 48, timeout_seconds: 30, clear_hostiles: 1200}
  - walk_to: {x: -2600, y: 1312, z: 1920, radius: 64, timeout_seconds: 40, clear_hostiles: 1000}
  - walk_to: {x: -3072, y: 1250, z: 1920, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - play_lua: {source: "wait(1)"}
  - assert: {party_position: {x: -3072, y: 1250, radius: 100, z_min: 1912, z_max: 1928}}
  # The Rosebud door: the coven's key from the herb loft opens it (no password since pass two).
  - walk_to: {x: -3072, y: 1080, z: 1920, radius: 48, timeout_seconds: 30, clear_hostiles: 1000}
  - assert: {state_dump_map_var: {index: 14, value: 0}}
  - play_lua: {source: "click(34); wait(4); if door_state(15) ~= 'open' or door_state(16) ~= 'open' then error('the face did not open to the coven key: ' .. door_state(15)) end"}
  - assert: {state_dump_map_var: {index: 14, value: 1}}
  # The sanctum: its guard, the Head Witch's sisters; her familiars crawl out of the witch-marks; the Head Witch.
  - assert: {actor_visible: {actor_index: 4, hidden: true}}
  - walk_to: {x: -3072, y: 700, z: 1920, radius: 64, timeout_seconds: 30, clear_hostiles: 1500}
  - clear_hostiles: {radius: 3200}
  - play_lua: {source: "wait(2); clear_hostiles(3200); wait(2)"}
  - assert: {actor_visible: {actor_index: 8, dead: true}}
  - assert: {actor_visible: {actor_index: 6, dead: true}}
  - play_lua: {source: "wait(5)"}
  - assert: {actor_visible: {actor_index: 4, hidden: false}}
  - assert: {state_dump_map_var: {index: 11, value: 1}}
  - clear_hostiles: {radius: 3200}
  - play_lua: {source: "if not qbit(110046) then error('the Head Witch\\'s death did not set head_witch_slain') end"}
  # The ward over the roof stair falls with the Head Witch (D-89 1.2): she is dead, so it sinks into the floor.
  - walk_to: {x: -3900, y: 448, z: 1920, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - play_lua:
      source: |
        if door_state(19) ~= "closed" then error("the ward does not start shut") end
        click(43); wait(5)
        if door_state(19) ~= "open" then error("the ward did not fall with the Head Witch: " .. door_state(19)) end
  # The bedchamber: child 4, the coven's cabinet.
  - walk_to: {x: -3344, y: -200, z: 1920, radius: 48, timeout_seconds: 30, clear_hostiles: 1000}
  - play_lua:
      source: |
        click(18); wait(4)
        if door_state(1) ~= "open" then error("the bedchamber door did not open: " .. door_state(1)) end
  - walk_to: {x: -3344, y: -600, z: 1920, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - clear_hostiles: {radius: 1000}
  - walk_to: {x: -3750, y: -500, z: 1920, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - play_lua:
      source: |
        click(10); wait(1)
        close()
        if not qbit(110043) then error("child 4 was not freed") end
  # The two vanity skulls on the dressing table under the mirror (phase 0).
  - walk_to: {x: -3856, y: -830, z: 1920, radius: 48, timeout_seconds: 30, clear_hostiles: 1000}
  - play_lua: {source: "click(56); wait(1)"}
  - assert:
      dialog: {text_contains: "You are the fairest one of all"}
  - play_lua: {source: "if not close() then error('the first vanity skull opened no message window') end; click(57); wait(1)"}
  - assert:
      dialog: {text_contains: "the most beautiful creature in all the land"}
  - play_lua: {source: "if not close() then error('the second vanity skull opened no message window') end"}
  - walk_to: {x: -2850, y: -800, z: 1920, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - play_lua:
      source: |
        loot_chest(45)
        if held() ~= 0 then stow() end
        if not has_item(181) or not has_item(179) then error("the coven's cabinet did not hold its gems") end
  # Over the bridge to the Alacorn: the cauldron boils over.
  - walk_to: {x: -3344, y: -200, z: 1920, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - walk_to: {x: -1250, y: -128, z: 1920, radius: 64, timeout_seconds: 30, clear_hostiles: 1500}
  - walk_to: {x: -860, y: -128, z: 1920, radius: 48, timeout_seconds: 30, clear_hostiles: 1000}
  - walk_to: {x: -420, y: -128, z: 1920, radius: 48, timeout_seconds: 30, clear_hostiles: 1000}
  - walk_to: {x: -180, y: -128, z: 1920, radius: 48, timeout_seconds: 30, clear_hostiles: 1000}
  - play_lua: {source: "wait(1)"}
  - assert: {party_position: {x: -180, y: -128, radius: 80, z_min: 1912, z_max: 1928}}
  - assert: {state_dump_map_var: {index: 7, value: 1}}
  - pick_up: {item_id: 12033}
  - play_lua:
      source: |
        if held() ~= 0 then stow() end
        status()
        wait(1.5)
        if not qbit(110045) then error("taking the Alacorn did not set alacorn_taken") end
        wait(2)
        local seen = status()
        if not string.find(seen, "scalds", 1, true) then error("the steam did not scald the party on the bridge: " .. seen) end
  # A3's hook m4.alacorn says the boil-over in a message window (opened by the map's timer; the walk closes it).
  - walk_to: {x: -860, y: -128, z: 1920, radius: 48, timeout_seconds: 30, clear_hostiles: 1000, close_dialogs: true}
  - walk_to: {x: -1250, y: -128, z: 1920, radius: 64, timeout_seconds: 30, clear_hostiles: 1000}
  - assert: {state_dump_map_var: {index: 7, value: 0}}
  # The hoist: the brake lever sends the cage down; the top's button calls it back; the party rides it down.
  - walk_to: {x: -2032, y: -200, z: 1920, radius: 64, timeout_seconds: 30, clear_hostiles: 1500}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: -1720, y: -460, z: 1920, radius: 48, timeout_seconds: 30, clear_hostiles: 1000}
  - play_lua:
      source: |
        if door_state(22) ~= "open" then error("the cage does not stand at the top: " .. door_state(22)) end
        click(12); wait(1)
  - assert:
      dialog: {text_contains: "brake lever is on this room"}
  - play_lua:
