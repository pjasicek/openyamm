notes: "Xeen design brief, level L4: L3's crooked tower built with the studio's words of 2026-11-13, surfaces, objects and wiring; a playable map (NOTES.md). Story step M4 and promotion T1-A (devdocs/xeen/QUESTS.md): take the Alacorn of Falista to Old Valia. The Xeen world has no package, monsters or items yet, so this L4 is built and played as an MM7 map, as XD-01 to XD-03 are: `world: mm7` until worlds/xeen exists (one line to change back). Stand-ins: slot 1 Goblins (Goblin 4 / Gremlin 6 / Gremlin Guard 10) is MM7's Goblin family (Goblin 4, Hobgoblin 6, Goblin Lord 10, the same levels); slot 2 Witches (Wicked Witch 14) the Moon clerics (Acolyte of the Moon 10, in green robes), slot 3 Swamp Things (Giant Toad 11, the witches' familiars) the Bat family at tier 3 (Inferno Bat 9): MM6-8 have no toad. The Head Witch is a Cleric of the Moon (215, level 20) with hit points and a name of her own, the schoolmistress an Acolyte, the Goblin Warden a Goblin Lord who carries the cage ring, the four caged children Goblin peasants (half-turned, peaceful). The Alacorn of Falista 12033 is MM7's Unicorn Horn (214: an alicorn is a unicorn's horn), the warden's ring 12032 the Ring of Keys (629); the Crystal Key 12031 opens X1's door and is not used here. Quest bits keep their provisional Xeen numbers (110040-110047). Music: MM7 track 28 (the Temple of the Moon's) for the brief's tower_dark, which the game refuses as a name. Both neighbours point at Emerald Island until X1 and X8 are mounted beside this map."
