format: 0
level: L1
pitch: "The bottom of Castle Alamar under its ruin: burnt, buckled sw steel round the west maze, two levers that drop two bulkheads out of sight, Alamar's strongroom with the Dragon Tower's key, the warden's Darkstone key, a skull door that reads the Cube, and a lift down to the cold round vault where the true Prince Roland lies in stasis."
purpose: "M39 Prince Roland (A3's m39 hooks: statue, plaque_nine, lever_west/east, grate_bolt/grate_bolted, pyramid, shaft_arrival, darkstone_key, skull_door, roland); Q-F1's key (12376, the map's find); Q-D26's way up (q-d26.depths_hatch). Class M, party 58-61, monsters 62-75, treasure 6."
mood: "The castle's machine hum, fainter, and the groan of settling metal; teal plate floors under rust and scorch; teal pilot lights; the vault cold and blue under the field."
datum: arrival
