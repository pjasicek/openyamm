# FD-01's robots (the XD-27 form): Annihilator 11611 (28) and Autobot 11612 (6), one faction, all hostile at load,
# none peaceful; both kinds spawned side by side in the workshop do not take each other on.
# Run with --world xeen --map xeen_fd01.blv (output/studio_cal/fd01/four.sh). Written by tools/tests.py.
id: xeen.fd01.l4.hostility
title: 'Alamar Depths (FD-01): the robots hostile, one faction, no infighting'
world: xeen
mode: faithful
steps:
- new_game_flow:
    start_map: xeen_fd01.blv
    party:
      gold: 0
      food: 20
      members:
      - name: Brokk
        class: Knight
        level: 58
        skills: []
        equipment: {}
      - name: Hild
        class: Paladin
        level: 58
        skills: []
        equipment: {}
      - name: Ivar
        class: Archer
        level: 58
        skills: []
        equipment: {}
      - name: Sefa
        class: Knight
        level: 58
        skills: []
        equipment: {}
- setup_shortcut:
    kind: immortal
    value: true
- advance_runtime:
    seconds: 2
- play_lua:
    source: close()
- assert:
    actor_count:
      monster_id: 11611
      hostile: true
      min: 28
      max: 28
- assert:
    actor_count:
      monster_id: 11612
      hostile: true
      min: 6
      max: 6
- assert:
    actor_count:
      monster_id: 11611
      hostile: false
      max: 0
- assert:
    actor_count:
      monster_id: 11612
      hostile: false
      max: 0
- note: 'Both kinds spawned side by side in the workshop, nearer each other than the party: they must not take each other
    on.'
- set_pose:
    map: xeen_fd01.blv
    x: -5800
    y: 400
    z: 0
    yaw_degrees: 0
    pitch: 0
- console:
    line: arena trace on
- spawn_actor:
    monster_id: 11611
    x: -4300
    y: 384
    z: 0
- spawn_actor:
    monster_id: 11612
    x: -4000
    y: 384
    z: 0
- spawn_actor:
    monster_id: 11611
    x: -3700
    y: 384
    z: 0
- spawn_actor:
    monster_id: 11612
    x: -3400
    y: 384
    z: 0
- advance_runtime:
    seconds: 10
- assert:
    ai_trace:
      event: target
      target: actor
      max_count: 0
      report: true
- console:
    line: arena trace off
