doors:
  - id: door:gallery
    opening: open:gallery_door
    kind: slide_up
    surface: {texture: swdoorb, size: [256, 256], fit: true}
    notes: "The gallery door, west out of the undercroft hall. One cross-braced sw leaf (swdoorb once, whole)."
  - id: door:grate
    opening: open:grate
    kind: slide_up
    surface: {texture: swdoorc, size: [128, 256], fit: true}
    notes: "The bolted grate (D-69 change 4): a solid leaf with the lattice picture (swdoorc once per face, whole); it blocks sight and shots; opened for good from the workshop's face."
  - id: door:guard
    opening: open:guard_door
    kind: slide_up
    surface: {texture: swdoorb, size: [256, 256], fit: true}
    notes: "The guard door at the south gallery's west end. One cross-braced sw leaf (swdoorb once, whole)."
  - id: door:north
    opening: open:north_door
    kind: slide_up
    surface: {texture: swdoorb, size: [256, 256], fit: true}
    notes: "The north door at the head of the long gallery. One cross-braced sw leaf (swdoorb once, whole)."
  - id: door:shaft
    opening: open:shaft_door
    kind: slide_up
    surface: {texture: swdoorb, size: [256, 256], fit: true}
    notes: "The shaft door between the rubble shaft and the north gallery. One cross-braced sw leaf (swdoorb once, whole)."
  - id: door:skull
    opening: open:skull_door
    kind: slide_up
    pictures:
      - [{texture: swtrpnl, size: [128, 256]}, {texture: swtrdk, size: [128, 256]}]
    back_pictures:
      - [{texture: swtrdk, size: [128, 256]}, {texture: swtrpnl, size: [128, 256]}]
    notes: "The skull door: two skull-mask panels (swtrpnl | swtrdk, each once at its 1:2) on one leaf; m39.skull_door (the Cube) raises it for good (117845)."
  - id: door:slab_east
    opening: open:east_slab
    kind: slide_down
    speed: 128
    surface: {texture: swdoora, size: [256, 256], fit: true}
    notes: "The east slab (D-69 change 1): a shut bulkhead (swdoora once per face, whole) that drops into the floor for good when the east lever is pulled (out of sight of the lever hall)."
  - id: door:slab_west
    opening: open:west_slab
    kind: slide_down
    speed: 128
    surface: {texture: swdoora, size: [256, 256], fit: true}
    notes: "The west slab (D-69 change 1): a shut bulkhead (swdoora once per face, whole) that drops into the floor for good when the west lever is pulled (out of sight of the lever hall)."
  - id: door:vault
    opening: open:vault_pair
    kind: slide_left
    leaves: 2
    pictures:
      - [{texture: swdoorb, size: [256, 256]}]
    back_pictures:
      - [{texture: swdoorb, size: [256, 256]}]
    notes: "The stasis vault's pair (D-69 change 3, D-67 item 3): one swdoorb picture split over two leaves that part in the middle."
  - id: door:warden
    opening: open:warden_door
    kind: slide_up
    surface: {texture: swdoorb, size: [256, 256], fit: true}
    notes: "The warden's door between the key vault and the warden's room. One cross-braced sw leaf (swdoorb once, whole)."
  - id: door:works
    opening: open:works_door
    kind: slide_up
    surface: {texture: swdoorb, size: [256, 256], fit: true}
    notes: "The assembly hall's works door. One cross-braced sw leaf (swdoorb once, whole)."
