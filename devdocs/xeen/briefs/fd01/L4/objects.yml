format: 0
start:
  room: room:stair
  at: [0, 0]
  facing: w
  notes: "The ruin stair's foot, facing west into the undercroft hall."
arrivals:
  - {entrance: entrance:d6_stair, room: room:stair, at: [0, 0], facing: w, notes: "From D6's thing:fd01_stair (A6; m39.depths_door, the Cube)."}
