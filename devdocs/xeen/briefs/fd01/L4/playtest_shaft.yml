# FD-01's rubble shaft (D-69 change 5): a party from D7 (D7's hatch makes this move: entrance:d7_roof at the shaft's
# foot, facing 0) gets m39.shaft_arrival's status line once (117846) and none on a second arrival. The ladder (foot,
# rails, rungs) without roof_unlocked (113521): "Bolted from above." and the party stays; with 113521 set, the standard
# entrance window (F16): Close stays, OK moves the party to D7's entrance:fd01_roof (-18688, 8448, 1536) facing 1024.
# Run with --world xeen --map xeen_fd01.blv (output/studio_cal/fd01/four.sh). Written by tools/tests.py.
id: xeen.fd01.l4.shaft
title: 'Alamar Depths (FD-01 L4): the D7 arrival line once, the ladder bolted, Close, then up to D7'
world: xeen
mode: faithful
steps:
- new_game_flow:
    start_map: xeen_d7.blv
    party:
      gold: 0
      food: 20
      members:
      - name: Brokk
        class: Knight
        level: 58
        skills: []
        equipment: {}
      - name: Hild
        class: Paladin
        level: 58
        skills: []
        equipment: {}
      - name: Ivar
