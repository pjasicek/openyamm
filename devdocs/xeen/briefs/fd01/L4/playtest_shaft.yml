      x: -7744
      y: 7168
      radius: 64
      z_min: -8
      z_max: 8
      facing: 0
      facing_within: 64
- play_lua:
    source: if not (qbit(117846)) then error('arrived_from_d7 117846 not set' .. ' / ' .. status() .. ' / ' .. party()) end
- play_lua:
    source: if not (string.find(status(), 'You climb down through smoke and rubble', 1, true)) then error('no shaft arrival
      line' .. ' / ' .. status() .. ' / ' .. party()) end
- play_lua:
    source: if close() then error('a window on the shaft arrival') end
- lua_event:
    source: evt.MoveToMap(-18688, 8448, 1536, 1024, 0, 0, 0, 0, "xeen_d7.blv")
- advance_runtime:
    seconds: 2
    follow_map_move: true
- play_lua:
