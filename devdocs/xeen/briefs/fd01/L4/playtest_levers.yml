# FD-01's levers in the other order (D-69 change 10): east, then west, each its status line ("Far to the east, a wall
# grinds down into the floor.", "Far to the west, ..."), its qbit (117842, 117841), its slab down and the lever thrown
# (D-71 P2: the arm with its grip swung over to hang from the pivot); both slabs down and both levers thrown after a save and a reload; then "The lever won't budge."
# from both, and from each lever's pivot boss, and nothing moves.
# Run with --world xeen --map xeen_fd01.blv (output/studio_cal/fd01/four.sh). Written by tools/tests.py.
id: xeen.fd01.l4.levers
title: 'Alamar Depths (FD-01 L4): the levers east then west, a reload, then the lever won''t budge'
world: xeen
mode: faithful
steps:
- new_game_flow:
    start_map: xeen_d6.odm
    party:
      gold: 0
      food: 20
      members:
      - name: Brokk
        class: Knight
        level: 58
        skills: []
        equipment: {}
      - name: Hild
        class: Paladin
        level: 58
        skills: []
        equipment: {}
      - name: Ivar
        class: Archer
        level: 58
        skills: []
        equipment: {}
      - name: Sefa
