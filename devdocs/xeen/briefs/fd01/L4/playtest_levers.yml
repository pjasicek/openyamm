    y: 2496
    z: 0
    yaw_degrees: 90
    pitch: 0
- clear_hostiles:
    radius: 9000
- play_lua:
    source: close(); status(); click(22); wait(0.8)
- play_lua:
    source: if not (string.find(status(), 'Far to the east, a wall grinds down into the floor.', 1, true)) then error("event
      22 did not say 'Far to the east, a wall grinds down into the floor.'" .. ' / ' .. status() .. ' / ' .. party()) end
- play_lua:
    source: if not (qbit(117842)) then error('slab_east not set' .. ' / ' .. status() .. ' / ' .. party()) end
- play_lua:
    source: for _ = 1, 30 do if door_state(8) == 'open' then break end; wait(0.5) end; if door_state(8) ~= 'open' then error('door
      8 is ' .. door_state(8) .. ', not open') end
- play_lua:
    source: for _ = 1, 30 do if door_state(20) == 'open' then break end; wait(0.5) end; if door_state(20) ~= 'open' then error('door
      20 is ' .. door_state(20) .. ', not open') end
- play_lua:
    source: close(); status(); click(23); wait(0.8)
- play_lua:
    source: if not (string.find(status(), 'Far to the west, a wall grinds down into the floor.', 1, true)) then error("event
      23 did not say 'Far to the west, a wall grinds down into the floor.'" .. ' / ' .. status() .. ' / ' .. party()) end
- play_lua:
    source: if not (qbit(117841)) then error('slab_west not set' .. ' / ' .. status() .. ' / ' .. party()) end
- play_lua:
    source: for _ = 1, 30 do if door_state(9) == 'open' then break end; wait(0.5) end; if door_state(9) ~= 'open' then error('door
      9 is ' .. door_state(9) .. ', not open') end
- play_lua:
    source: for _ = 1, 30 do if door_state(22) == 'open' then break end; wait(0.5) end; if door_state(22) ~= 'open' then error('door
      22 is ' .. door_state(22) .. ', not open') end
- play_lua:
    source: for i = 1, 4 do if not close() then break end wait(0.3) end
- reload: {}
- advance_runtime:
    seconds: 3
    present_dialogs: true
- play_lua:
    source: for i = 1, 4 do if not close() then break end wait(0.3) end
- play_lua:
    source: if not (door_state(9) == 'open' and door_state(8) == 'open') then error('a slab came back after a reload' .. '
      / ' .. status() .. ' / ' .. party()) end
- play_lua:
    source: for _ = 1, 30 do if door_state(22) == 'open' then break end; wait(0.5) end; if door_state(22) ~= 'open' then error('door
      22 is ' .. door_state(22) .. ', not open') end
- play_lua:
    source: for _ = 1, 30 do if door_state(20) == 'open' then break end; wait(0.5) end; if door_state(20) ~= 'open' then error('door
      20 is ' .. door_state(20) .. ', not open') end
- play_lua:
    source: close(); status(); click(22); wait(0.8)
- play_lua:
    source: if not (string.find(status(), "The lever won't budge.", 1, true)) then error('event 22 did not say "The lever
      won\'t budge."' .. ' / ' .. status() .. ' / ' .. party()) end
- play_lua:
    source: close(); status(); click(23); wait(0.8)
- play_lua:
    source: if not (string.find(status(), "The lever won't budge.", 1, true)) then error('event 23 did not say "The lever
      won\'t budge."' .. ' / ' .. status() .. ' / ' .. party()) end
- play_lua:
    source: close(); status(); click(60); wait(0.8)
- play_lua:
    source: if not (string.find(status(), "The lever won't budge.", 1, true)) then error('event 60 did not say "The lever
      won\'t budge."' .. ' / ' .. status() .. ' / ' .. party()) end
- play_lua:
    source: close(); status(); click(58); wait(0.8)
- play_lua:
    source: if not (string.find(status(), "The lever won't budge.", 1, true)) then error('event 58 did not say "The lever
      won\'t budge."' .. ' / ' .. status() .. ' / ' .. party()) end
- play_lua:
    source: if not (door_state(9) == 'open' and door_state(8) == 'open') then error('a second pull moved a slab' .. ' / '
      .. status() .. ' / ' .. party()) end
