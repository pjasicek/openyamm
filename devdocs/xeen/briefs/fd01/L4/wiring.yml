  - id: evt:lift_foot
    preset: switch
    source: switch:lift_foot
    title: Lift
    toggles: [lift:cage]
    effects:
      - lua: "evt.PlaySoundName(\"xeen_lift\", -1216, 3904, -768)"
    notes: The cage between the lift head (0) and the lift foot (-768).
  - id: evt:lift_head
    preset: switch
    source: switch:lift_head
    title: Lift
    toggles: [lift:cage]
    effects:
      - lua: "evt.PlaySoundName(\"xeen_lift\", -1216, 3904, 0)"
    notes: The cage between the lift head (0) and the lift foot (-768).
  - id: evt:plaque_fewaee
    preset: text
    source: panel:plaque_fewaee
    title: Plaque
    text: |-
      The message on the plaque reads: FEWAEEFFWAEFAWEEWWEFAW
      Remember: A = Air, E = Earth, F = Fire, W = Water.
    window: true
    notes: "aaze0052:14 (map-local; lore, the order of DD-17's belts)."
  - id: evt:plaque_nine
    preset: script
    source: panel:plaque_nine
    title: Plaque
    effects:
      - lua: "XeenQuests.hook(\"m39.plaque_nine\")"
    notes: "'Nine is the time.' (aaze0052:12)."
  - id: evt:pyramid
    preset: script
    source: platform:pyramid
    title: Pyramid
    effects:
      - lua: "XeenQuests.hook(\"m39.pyramid\")"
    notes: "Q70 (a): 'Its light is out. Its twin stands outside the gate.' (m39.pyramid)."
  - id: evt:skull_door
    preset: switch
    source: door:skull
    title: Skull door
    condition: {lua: "XeenQuests.can(\"m39.skull_door\")"}
    opens: [door:skull]
    sets: {qbit: skull_door_open}
    effects:
      - lua: "XeenQuests.hook(\"m39.skull_door\")"
    else_effects:
      - lua: "XeenQuests.hook(\"m39.skull_door\")"
    notes: "m39.skull_door: with the Cube 'Access granted.', the door rises for good (117845); without it the source's 'Access denied! You do not have the proper I.D.' (aaze0052:3) and it stays shut."
  - id: evt:skull_load
    preset: switch
    trigger: load
    condition: {qbit: skull_door_open}
    opens: [door:skull]
    notes: The skull door stays open on every load after the Cube.
  - id: evt:slab_east
    preset: text
    source: door:slab_east
    title: Bulkhead
    text: A shut bulkhead. Nothing on this side moves it.
    notes: The slab before its lever is pulled (map-local line).
  - id: evt:slab_east_load
    preset: switch
    trigger: load
    condition: {qbit: slab_east}
    opens: [door:slab_east, mover:lever_east_arm]
    notes: "Every load after the east lever: its slab stays down and the lever stays thrown."
  - id: evt:slab_west
