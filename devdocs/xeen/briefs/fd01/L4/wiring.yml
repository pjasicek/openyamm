format: 0
variables: [in_visit, visit]
events:
  - id: evt:arrival
    preset: script
    trigger: timer
    every: 1
    condition: {map_var: visit}
    lua: |-
      local x, y, z = evt.GetPartyPosition()
      local dx, dy = x - (-7744), y - (7168)
      if dx * dx + dy * dy < 409600 then
          XeenQuests.hook("m39.shaft_arrival")
      end
    effects:
      - set:
          var:
            map_var: visit
          value: 0
    notes: "D-69 change 5: on a real entry at the shaft's foot (within 640 of entrance:d7_roof) A3's m39.shaft_arrival (once per game, 117846, its status line, no line before it); a D6 arrival (the stair's foot) says nothing here (the statue speaks)."
  - id: evt:chest_assembly
    preset: chest
    source: chest:assembly
    title: Chest
  - id: evt:chest_pyramid
    preset: chest
    source: chest:pyramid
    title: Chest
  - id: evt:chest_stasis
    preset: chest
    source: chest:stasis
    title: Chest
  - id: evt:chest_warden
    preset: chest
    source: chest:warden
    title: Chest
    effects:
      - lua: "XeenQuests.hook(\"m39.darkstone_key\")"
    notes: "The warden's chest (T6): m39.darkstone_key (111780, the key on its cushion; then 'An empty velvet cushion.')."
  - id: evt:coffin
    preset: switch
    source: platform:coffin
    title: Coffin
    condition: {not: {qbit: m39_done}}
    opens: [mover:field, mover:lid]
    effects:
      - lua: "XeenQuests.hook(\"m39.roland\")"
      - lua: "evt.PlaySoundName(\"xeen_coffin_lid\")"
      - lights_off: light:field
      - lua: "evt.SetMapVar(\"AmbientSound3\", 2)"
    else_effects:
      - lua: "XeenQuests.hook(\"m39.roland\")"
    notes: "D-69 change 2: the coffin, its lid and the field all carry the click and 'Coffin' (aaze0052:7); m39.roland (done 111781, the amulet 12372, the award, 40,000) drops the field and slides the lid back; after it the hook's else line ('An empty stasis coffin, still faintly cold.')."
  - id: evt:coffin_load
    preset: switch
    trigger: load
    condition: {qbit: m39_done}
    opens: [mover:field, mover:lid]
    effects:
      - lights_off: light:field
      - lua: "evt.SetMapVar(\"AmbientSound3\", 2)"
    notes: "Every load with m39.done (111781): the field down, the lid open, the hum and the glow off."
  - id: evt:door_gallery
    preset: door
    source: door:gallery
    title: Door
  - id: evt:door_guard
