  - id: evt:lever_east
    preset: switch
    source: mover:lever_east_arm
    title: Lever
    condition: {not: {qbit: slab_east}}
    opens: [door:slab_east, mover:lever_east_arm]
    effects:
      - lua: "XeenQuests.hook(\"m39.lever_east\")"
      - lua: "evt.PlaySoundName(\"6stone door0101\")"
    else_effects:
      - lua: "XeenQuests.hook(\"m39.lever_east\")"
    notes: "D-69 change 1: the first pull grinds (the source's FX 35: the shipped stone grind), throws the lever down (D-71 P2) and calls m39.lever_east (the status line naming the direction, 117842); the slab drops for good; after it the hook's 'The lever won't budge.' (:17)."
