    source: mover:field
    title: Coffin
    condition: {not: {qbit: m39_done}}
    opens: [mover:field, mover:lid]
    effects:
      - lua: "XeenQuests.hook(\"m39.roland\")"
      - lua: "evt.PlaySoundName(\"xeen_coffin_lid\")"
      - lights_off: light:field
