    kind: wild
    floor: [1900, 2500]
    relief: uneven
    purpose: "Grey ash plains and cooled flows below the Gap (source E1): the black bridge over the lava river, the Volcano Cave and Shangri-La's cleft at Firestone's west foot, the Dragon Cave's crag on the rim, a knight's remains by the tax road; hydras."
    density: sparse
    population:
      - {id: pop:ash_flats, slot: 2, groups: 9, per_marker: [1, 3], levels: [45, 65], notes: "Encounter area: Hydras."}
  - id: zone:crater
    name: The crater
    kind: zone
    part_of: zone:firestone
    floor: 4600
    purpose: "A lava pool under the smoking rim (a landmark; nothing to take)."
  - id: zone:dragon_crag
    name: The Dragon Cave's crag
    kind: zone
    part_of: zone:ash_flats
    floor: 2500
