points_of_interest:
  - id: poi:cairn
    space: zone:red_dwarf_range
    kind: device
    behaviour: "The cairn of the unreturned: names scratched on the stones of those who went north. \"Add yours?\" +Luck, temporary, daily (\"The stones seem to wish you luck.\")"
    uses: {times: 1, per: character, reset: daily}
  - id: poi:demon_idols
    space: zone:volcano_mouth
    kind: device
    behaviour: "Two idols at the Volcano Cave's mouth, a demon and a devil: \"Their skulls are not here. Someone has scratched an arrow pointing inside.\" (Q-C26's hint; no effect). One spot with XD-16's door (D-40 change 5; A3's x7.idols)."
  - id: poi:dragon_hoard
    space: zone:firestone
    kind: chest
    behaviour: "A dragon's hoard on Firestone's east shoulder, among scorched bones (a chest). Treasure level 6 (D-40 change 1)."
  - id: poi:fire_reflector
    space: zone:fire_corner
    kind: device
    behaviour: "A3's m37.reflector_fire: \"Reflector. Activate?\"; after m36.started it hums (8,000 XP once); before, \"A machine of the Ancients, cold and silent.\""
  - id: poi:hot_spring
    space: zone:south_slopes
    kind: fountain
    behaviour: "The dwarves' hot spring: \"You soak until the ache leaves your bones.\" Heals Hit Points, daily."
    uses: {times: 1, per: character, reset: daily}
  - id: poi:hydra_wallow
    space: zone:lava_basin
    kind: chest
    behaviour: "The hydras' wallow on the lake shore: bones and a pilgrim's pack (a chest). Treasure level 5 (D-40 change 1)."
  - id: poi:knight_remains
    space: zone:ash_flats
    kind: chest
    behaviour: "A knight who came for the Dragon Cave, his armour run into the rock; his strongbox (a chest). Treasure level 5 (D-40 change 1)."
  - id: poi:lava_rock
    space: zone:lava_island
    kind: device
    behaviour: "A3's q-c14.lava_rock: the Ever-Hot Lava Rock on the cooled flow (source E2: \"You have found a rock that is still hot from an ancient volcanic eruption! Strangely, you are able to pick it up without getting burnt.\"); once."
  - id: poi:miner_cache
    space: zone:red_dwarf_range
    kind: chest
    behaviour: "A dwarf miner's old adit beside the Firestone road, his cache behind a fallen prop (a chest). Treasure level 3 (D-40 change 1)."
  - id: poi:obelisk
    space: zone:the_gap
    kind: obelisk
    behaviour: "Cloudside's seventh obelisk (A3's obelisks.x7: SPHINX)."
    rule: native:obelisk
    notes: "On the Gap's north lip, safe ground: an Act IV party collecting the words reaches it without a fight."
  - id: poi:orc_den
    space: zone:south_slopes
    kind: chest
    behaviour: "The gate pickets' den by the Orc Caves' back gate (source F2: \"Crude furnishings and filthy bedding tell you that orcs have been living in this cave. Pillage?\"): a chest. Treasure level 1 (D-40 change 1)."
  - id: poi:orc_outpost
    space: zone:orc_outpost
    kind: camp
    behaviour: "Source E2: \"You have found an Orc Outpost. Put it to the torch?\" / \"The Outpost burns well.\" Burns once (the source's +1,000 experience at MM6-MM8 scale, A3)."
  - id: poi:outpost_chest
    space: zone:orc_outpost
    kind: chest
    behaviour: The orcs' loot from the road (a chest). One spot with the outpost (D-40 change 5). Treasure level 1 (D-40 change 1).
  - id: poi:sablewing
    space: zone:sablewing_cave
    kind: teacher
    behaviour: "Sablewing the Dragon Hermit (4720): Dragon Master (A4's teachers; D-5.2); \"I came up the mountain to be alone. Then everyone came up the mountain to fight me.\""
  - id: poi:shrine_fire
    space: zone:south_slopes
    kind: shrine
    behaviour: "The Shrine of Fire (source E2: \"Shrine of Fire\" / \"You don't think anyone is listening.\"): +Fire resistance, temporary, daily (X4 already has a permanent Shrine of Fire; question 2)."
    uses: {times: 1, per: character, reset: daily}
  - id: poi:signposts
    spaces: [junction:gap, junction:lava_fork, junction:slope_fork]
    count: 3
    kind: signpost
    behaviour: "Signposts at the forks: the Gap's carries D-40's warning (\"North: Mount Firestone. Dragons. Turn back.\") when clicked; the other two name their roads when clicked (D-40's 22 POIs)."
  - id: poi:watch_chest
    space: zone:dwarf_watch
    kind: chest
    behaviour: "The watch's pay chest, left when the dwarves ran (a chest). Treasure level 2 (D-40 change 1). A note by it: \"The dragons came south. Pay owed to the end of the month. Nobody stays.\" (D-40 question 8; A3's x7.watch_note)"
  - id: poi:well_speed
    space: zone:south_slopes
    kind: well
    behaviour: "The Well of Speed (source E2: \"The water is cool and refreshing.\"): +2 Speed, permanent, once per character (the map's permanent device; question 2)."
    uses: {times: 1, per: character, reset: never}
