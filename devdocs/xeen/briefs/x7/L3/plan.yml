states:
  - id: state:cleft_shut
    condition: {not: {qbit: cleft_open}}
    atmosphere: "Fallen rock in the cleft; warm air between the stones."
    notes: "D-40 question 3: opens from inside the first time the party leaves Shangri-La by its back passage (xd17.cleft_opened, cleft_open 116140)."
  - id: state:reflector_cold
    condition: {not: {qbit: m36_started}}
    atmosphere: The Reflector cold and silent until M36 starts.
  - id: state:rock_taken
    condition: {qbit: rock_found}
    atmosphere: "The cooled flow empty; the golems still there."
  - id: state:xd05_barred
    condition: {not: {qbit: orc_back_gate}}
    atmosphere: The back gate barred from within.
    notes: "Opened from inside XD-05 (x1-tam.back_gate, 110051); then a two-way shortcut to X1."
landform:
  relief: "The south slopes (1,800-2,200) rise from X1's hills to the Red Dwarf Range (peaks to 3,200, the Gap 2,300); the Firestone road climbs its valley from X4's 1,300. North of the range the ash flats (1,900-2,500) fall west to the lava lake (1,500) and rise east into Mount Firestone, a cone to 5,000 with a crater pool at 4,600. Inside the square: 1,500 to 5,000."
  height_range: [1500, 5000]
  water: "No water: the lava lake (about 250 cells), the crater pool, the lava river and its north arm (lava liquid)."
  water_share: 0.04
  caps:
    - {kind: bare rock, share: 0.3, where: "the range, Mount Firestone, the crags, the rim cliffs"}
