    relief: slope
    purpose: "The Red Dwarf Range's mild southern slopes (source E2, F2): red stony ground and dry scrub rising from X1's hills; the north road, the dwarves' watch, Sablewing's cave, the Shrine of Fire, the Well of Speed, an orc outpost to burn, the Orc Caves' back gate; orcs only."
    density: sparse
    population:
      - {id: pop:west_slopes, slot: 1, groups: 4, per_marker: [1, 2], levels: [5, 10], notes: "Encounter area: Orcs."}
      - {id: pop:red_river, slot: 1, groups: 3, per_marker: [1, 2], levels: [5, 10], notes: "Encounter area: Orcs."}
      - {id: pop:gap_south, slot: 1, groups: 1, per_marker: [1, 2], levels: [5, 10], notes: "Encounter area: Orcs."}
      - {id: pop:south_hills, slot: 1, groups: 1, per_marker: [1, 2], levels: [5, 10], notes: "Encounter area: Orcs."}
  - id: zone:the_gap
    name: The Firestone Gap
    kind: zone
    part_of: zone:red_dwarf_range
    floor: 2300
    purpose: "The pass where the north road and the Firestone road meet; the obelisk on its north lip; the whole north below: the ash flats, the lava river, Mount Firestone."
  - id: zone:tower_crag
    name: The Dragon Tower's crag
    kind: zone
    part_of: zone:lava_basin
    floor: 2600
    purpose: "FD-04: a tower of black stone on a crag over the lava lake at the rim (phase 6)."
