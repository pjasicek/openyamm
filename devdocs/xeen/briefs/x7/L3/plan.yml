format: 0
level: L3
pitch: "Cloudside's north-east corner: the world's volcano. From Vertigo's hills the north road climbs red slopes past an abandoned dwarf watch and a dragon hermit's cave to the Firestone Gap; from there the whole north lies below, grey with ash: a lava river crossing the flats to a lava lake, the Volcano Cave and the Dragon Cave, a black tower on the rim, and Mount Firestone smoking over it all, its lava pouring off the edge of the world into the stars."
purpose: "Act V's trap and endgame map (party 40-55; the south slopes from level 5): Sablewing's Dragon Master (D-5.2, levels 20-30), the seventh obelisk, the Orc Caves' back gate (XD-05), the Ever-Hot Lava Rock (Q-C14), the Volcano Cave (XD-16, Q-C26) and Shangri-La's back gate (XD-17), the Dragon Cave (XD-18, Q-C25, optional), the Dragon Tower (FD-04, Q-F1/Q-F2, optional), the Fire Reflector (M37, Act VI)."
mood: "Grey ash drifting down through a dull red-brown light; heat shimmer over the flows; the roar of the crater and the hiss of lava; the south slopes merely dry and windy, the north scorched and still but for the wings overhead."
datum: water:rim_sea
