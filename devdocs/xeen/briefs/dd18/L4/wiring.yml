  - id: evt:paybox
    preset: script
    source: panel:paybox
    question: {ask: "Pay (Yes/No)?", answers: [Yes, Y], message: "It costs 5,000 gold to use the gym. Pay?", wrong_text: "Get lost!"}
    title: Pay box
    condition: {not: {qbit: gym_paid}}
    effects:
      - lua: "XeenQuests.hook(\"dd18.pay_box\")"
    else_effects:
      - lua: "XeenQuests.hook(\"dd18.pay_box\")"
    notes: "poi:paybox (D-27): 'It costs 50,000 gold to use the gym. Pay?' / 'Get lost!' (dark/aaze0032:3-4, the price rescaled); Yes runs A3's once-hook dd18.pay_box (5,000 gold, gym_paid 116120, 'Enjoy the facilities.'; short of gold the charity-gym refusal, dark/aaze0032:14); once paid the hook's 'Paid up.'"
  - id: evt:protein_brew
    preset: script
    source: deco:protein_brew
    title: Protein Brew
    lua: |-
      if not XeenQuests.hook("dd18.members_room") then
          return
      end
      evt.ForPlayer(Players.Current)
      if IsPlayerBitSet(PlayerBit(11319)) then
          XeenQuests.hook("dd18.brew_again")
          return
      end
      AddValue(BaseMight, 2)
      SetPlayerBit(PlayerBit(11319))
      XeenQuests.hook("dd18.protein_brew")
    notes: "Protein Brew (dark/aaze0032:9): members only; +2 Might once per character (player bit 11319)."
  - id: evt:vitamin_brew
    preset: script
    source: deco:vitamin_brew
    title: Vitamin Brew
    lua: |-
      if not XeenQuests.hook("dd18.members_room") then
          return
      end
      evt.ForPlayer(Players.Current)
      if IsPlayerBitSet(PlayerBit(11318)) then
          XeenQuests.hook("dd18.brew_again")
          return
      end
      AddValue(BaseEndurance, 2)
      SetPlayerBit(PlayerBit(11318))
      XeenQuests.hook("dd18.vitamin_brew")
    notes: "Vitamin Brew (dark/aaze0032:8): members only (dd18.members_room); +2 Endurance once per character (player bit 11318), A3's text; again: dd18.brew_again."
notes: "DD-18's events, written by output/studio_cal/dd18/tools/dress.py."
