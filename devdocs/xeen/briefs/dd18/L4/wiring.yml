  - id: evt:arrive
    preset: script
    trigger: timer
    every: 1
    condition: {not: {qbit: arrived_once}}
    once: true
    effects:
      - message: "THE SANDCASTER SEWER. The ladder from the street ends by a door under Barticus' sign: his members' room, where the brews are kept. Barticus says the stalkers got in. East, the drains run round the city's old cistern, and they say there is a passage in the sewer that leads a long ways under the desert."
      - qbit: arrived_once
    notes: "Say what is here (the members' room, the drains, the long tunnel; Barticus' town topic, D-27), on the first arrival only (arrived_once 117280)."
  - id: evt:book
