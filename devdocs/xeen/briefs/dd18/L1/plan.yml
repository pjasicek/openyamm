format: 0
level: L1
pitch: "Sandcaster's sewer: a street shaft under Barticus' sign, the gym's members' room behind a door at its foot (pay once, then a brew of each per member and the gym's one book); east, tan sandstone drains with slow water round a great pillared cistern under stepped-fret vaults, sewer stalkers breeding in a collapsed vault, the cobras of Venom Pond in the warm drain past a corridor of alcoves. South of the cistern the broken drain's floor has fallen into older works: a rubble slope down to the long tunnel, where mantis ants have dug galleries and a queens' nest across it, and the tunnel runs on a long way west under the desert to a grate with daylight through it, bolted on the other side."
purpose: "Optional (D-27): Barticus' members' room (dd18.pay_box, dd18.members_room, the two brews, The Art of Bodybuilding) and the long tunnel to D5, bolted on the desert side until Act V (dd18.tunnel_grate). Class M, party 28-30, monsters 25-38, treasure 3."
mood: "Warm, dry and close: tan rubble and carved sandstone, stepped-fret vaults, slow water in channels and a still cistern; below, grey rock chewed by ants, and a long straight tunnel with sand drifting along it."
datum: arrival
