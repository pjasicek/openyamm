set_pieces:
  - id: set:back_gate
    kind: scripted
    spaces: [room:back_gate]
    rule: "The bar lifts from the inside only; the gate is then a two-way door to the X7 slopes for good."
    inputs: [lift the bar]
    states: [barred, open]
    gives:
      qbit: orc_back_gate_open
  - id: set:captive
    kind: scripted
    spaces: [room:sleeping_hollows, room:prisoner_pit]
    rule: "Tam sits in the pit. Untying the rope ladder at the rim drops it; talking to Tam in the pit frees him and he climbs out and runs home (removed from the map)."
    inputs: [untie the ladder, talk to Tam]
    states: [held, ladder down, freed]
    gives:
      qbit: captive_freed
  - id: set:drum_master
    kind: boss
    spaces: [room:drum_hall, zone:drum_scaffold]
    rule: "While the Drum-Master lives on the scaffold, the great drum plays and every orc in the drum hall is frenzied (attacks faster, never flees). Killing him stops the drum and the frenzy; burning the drum afterwards is still needed for the quest. He stays on the scaffold and throws spears down; reaching him means the ladder under fire, or archery."
    inputs: [Drum-Master alive, great drum burnt]
    states: [drumming (frenzy), silent]
    population:
      - {actor: Orc Archer, role: Drum-Master, groups: 1, levels: [9, 9], placed: true, strength: boss}
  - id: set:drums_fade
    kind: scripted
    spaces: [room:cave_mouth, room:palisade_cave, room:cookfire_cave, room:drum_hall]
    rule: "The three drums are three layers of looping sound across the whole map. Each one burnt removes its layer; with all three burnt the caves fall silent but for dripping water, and the quest bit is set."
    inputs: [burn a drum]
    states: [three drums, two, one, silent]
    gives:
      qbit: war_drums_burned
  - id: set:palisade_fire
    kind: ambush
    spaces: [room:palisade_cave, zone:firing_step]
    rule: "Archers on the firing step shoot over the palisade as soon as the party comes within sight of the gate; the gate group waits behind it. Coming down from the upper ledge (the loop's other end) takes the archers from behind."
