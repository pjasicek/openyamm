notes: "Size S (about 35 monsters in about 17 sectors, 2 per sector, the top of the band), placed unevenly: nothing at the mouth, the ledge, the tunnel or the side caves with loot; an ambush at the palisade; packs at the fire; the heaviest fight in the drum hall; a tough optional pair at the back gate. No trap events: the danger is the archers' high ground and the frenzy. One loop, though S needs none, because the chimney climb is the cave's best moment. Nearly every space is a natural cave shape (round, oval, kidney, S-bend, amphitheatre); only the palisade and the scaffold are straight timber. Risers are 32 on the terraces and stairs; the steep tunnels are ramps. Lowest ceiling 384."
