notes: "Xeen design brief, level L4: L3's orc caves built with the studio's words of 2026-11-13, a playable map (NOTES.md). Optional Act I dungeon ('Burn the war-drums'). The Xeen world has no package, monsters or items yet, so this L4 is built and played as an MM7 map, as XD-01 to XD-04 are: `world: mm7` until worlds/xeen exists. Stand-ins: slot 1 Orcs (Orc Archer 7) is MM7's Goblin family (Goblin 4, Hobgoblin 6, Goblin Lord 10: they shoot arrows), slot 2 Bats (Giant Bat 3) MM7's Bat family, slot 3 Serpents (Giant Snake 5) MM7's Spider family (Giant Spider 5: MM7 has no snake). The Drum-Master, the shaman and the two Orc Guards are Goblin Lords (273); Tam a human peasant (358). Quest bits keep their provisional Xeen numbers (110050-110052). Music: MM7 track 18 (its caves'). exit:x1_hills leads to X1 (xeen_x1.odm); exit:x7_slopes points at Emerald Island until X7 exists."
