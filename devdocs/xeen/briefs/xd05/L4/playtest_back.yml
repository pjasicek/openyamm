# Second walk of the Orc Caves (XD-05, L4): the back way. A level-8 party goes in by the palisade gate and the run,
# straight down to the Drum Hall, turns into the bat chimney's foot and down the wet slope to the snake pool (the chest
# in the water), comes back over the east top terrace and down the east terraces to the floor, takes the back tunnel up
# to the guardroom, kills the two Orc Guards, finds the back gate barred (its message), lifts the bar and leaves for X7.
id: xeen.xd05.l4.back
title: Orc Caves (XD-05 L4), the snake pool and out by the back gate
world: mm7
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_xd05.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 8, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 8, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 8, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 8, skills: [], equipment: {}}
  - assert: {map: xeen_xd05.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - play_lua: {source: "wait(3)"}
  - walk_to: {x: 0, y: 1500, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 1500}
  - play_lua: {source: "click(21); wait(3); if door_state(3) ~= 'open' or door_state(4) ~= 'open' then error('the gate did not open') end"}
  - walk_to: {x: 0, y: 2400, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1200, close_dialogs: true}
  - walk_to: {x: 0, y: 3000, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1200, close_dialogs: true}
  - walk_to: {x: 864, y: 3400, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1200, close_dialogs: true}
  - walk_to: {x: 600, y: 4700, z: -96, radius: 64, timeout_seconds: 30, clear_hostiles: 1200, close_dialogs: true}
  - walk_to: {x: 384, y: 5150, z: -96, radius: 64, timeout_seconds: 30, clear_hostiles: 1200, close_dialogs: true}
  - walk_to: {x: 384, y: 5900, z: -256, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 0, y: 7100, z: -256, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 0, y: 7900, z: -384, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  # East along the top terrace into the chimney's foot; down the wet slope to the snake pool.
  - walk_to: {x: 1600, y: 8000, z: -384, radius: 64, timeout_seconds: 40, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 2000, y: 8544, z: -384, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: 2048, y: 8800, z: -384, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 2048, y: 9400, z: -690, z_tolerance: 40, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2300, y: 9900, z: -704, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: 2820, y: 10112, z: -736, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "loot_chest(6); if held() ~= 0 then stow() end"}
  # Back up to the hall and down the east terraces to the floor; the back tunnel.
  - walk_to: {x: 2048, y: 9400, z: -690, z_tolerance: 40, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 2048, y: 8800, z: -384, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 1600, y: 8544, z: -384, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 1600, y: 9024, z: -384, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 500, y: 9024, z: -640, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - walk_to: {x: 960, y: 10500, z: -640, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 960, y: 11648, z: -384, radius: 64, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 2176, y: 11648, z: -128, radius: 64, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 2176, y: 12800, z: 320, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - assert: {actor_visible: {actor_index: 1, dead: true}}
  - assert: {actor_visible: {actor_index: 2, dead: true}}
  # The barred gate says why; the bar lifts; the gate leads to X7.
  - walk_to: {x: 2176, y: 13250, z: 320, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(19); wait(1)"}
  - assert:
      dialog: {text_contains: "barred"}
  - play_lua:
      source: |
        if not close() then error("the barred gate opened no message window") end
        if qbit(110051) then error("the gate was open before the bar") end
        click(20); wait(3)
        if door_state(5) ~= "open" then error("the bar did not lift") end
        if not qbit(110051) then error("orc_back_gate_open not set") end
  - execute_event: {id: 19}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.0, follow_map_move: true}
  - assert: {map: 7out01.odm}
  - play_lua: {source: "if not qbit(110051) then error('the back gate bit was lost') end"}
