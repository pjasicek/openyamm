atmosphere: "Dark caves lit only by the orcs' fires. Light density by room class: the hearths (cookfire cave, drum hall) are fire-lit at about one fire per M units² of floor, warm orange; the posts (palisade, firing steps, back gate) have a brazier or a pair of torches each; the living caves (hollows, shaman's den) one small fire or two torches, the den's flames green; the passages and wild caves (run, upper ledge, bat chimney, snake pool, back tunnel, pit, plunder cache) are unlit. The mouth is the one daylit space and the back gate shows a line of daylight under its door. Minimum ambient: dark everywhere (map default about 18 of 31), lighter at the mouth (8) and the palisade (12 to 14), darkest in the chimney (24). Sound: the cave sound environment and the map's cave music under three looping drum layers (signal, spirit, great) that carry over the whole map and drop out one by one as the drums burn, leaving dripping water; frenzied roars in the drum hall while the great drum plays. Smoke: a light brown haze in the cookfire cave and the drum hall (opt-in indoor fog) where the roof is lost; no weather."
