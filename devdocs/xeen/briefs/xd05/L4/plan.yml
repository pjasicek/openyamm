notes: "Size S (about 36 monsters over 16 plan rooms and two zones, drawn as 45 rooms at L3 because every ramp and flight is its own room), placed unevenly: nothing at the mouth, the outer yard, the ledge, the tunnel or the side caves with loot; an ambush at the palisade; packs at the fire; the heaviest fight in the drum hall; a tough optional pair at the back gate. No trap events: the danger is the archers' high ground and the frenzy. One loop, though S needs none, because the chimney climb and the high ledge are the cave's best walk. Nearly every space is a natural cave shape (round, oval, kidney, S-bend, amphitheatre); only the palisade, the stairs and the scaffold are straight timber. Risers are 32 on the terraces and stairs; the steep tunnels are ramps. Lowest ceiling 384 clear. Changes from L1 made when the plan was drawn to scale (L3), each so that the critical path is walked and nothing stands over anything else: the three ladders on the critical path became timber stairs (the firing steps, the scaffold's gangway from a west top terrace); the firing step is two steps either side of a timber gate passage, and the cave behind the palisade is its own space (room:palisade_yard); the sleeping hollows, pit and plunder cache moved from east to west of the cookfire cave (east of it the loop's ring would have had to pass over them); the bat chimney's spiral ledge is a rock gallery round the shaft; the snake pool lies north of the chimney, east of the drum hall; the upper ledge is about 4,000 long, not 1,792; the terraces are three straight flights of eight steps of 32; the cookfire cave and the run gained windows from the ledge; the pit's rim got a cage gate. L1 errors fixed in L1 itself: the missing link from the run to the cookfire cave, and the ramp landing on the 'lowest' terrace (it is the top one). Totals: floor area 24.2 M units² and 45 rooms as built from the L3 sketch; the critical path is about 17,500 walked, counting the out-and-back climbs to the signal drum and the shaman's den (L1's 7,000 counted neither). The X7 entrance's id is entrance:x7_back_gate so that the mouth, listed first, is the build's arrival (the build takes the first entrance that is not an exit and does not read its condition). Lights: 24 placed fires and torches (2 mouth, 2 outer yard, 1 inner yard, 2 firing steps, 2 cookfire, 1 hollows, 2 shaman's den, 7 drum hall, 2 scaffold, 1 chimney, 2 back gate), not counting the drums."
