set_pieces:
  - id: set:back_gate
    kind: scripted
    spaces: [room:back_gate]
    rule: "The bar lifts from the inside only; the gate is then a two-way door to the X7 slopes for good."
    inputs: [lift the bar]
    states: [barred, open]
    gives:
      qbit: orc_back_gate_open
  - id: set:captive
    kind: scripted
    spaces: [room:sleeping_hollows, room:prisoner_pit]
    rule: "Tam sits in the pit behind the cage gate at its rim. Untying the rope ladder lifts the gate and drops the ladder; talking to Tam in the pit frees him and he climbs out and runs home (removed from the map)."
    inputs: [untie the ladder, talk to Tam]
    states: [held, ladder down, freed]
    gives:
      qbit: captive_freed
  - id: set:drum_master
    kind: boss
    spaces: [room:drum_hall, zone:drum_scaffold]
    rule: "While the Drum-Master lives on the scaffold, the great drum plays and every orc in the drum hall is frenzied (attacks faster, never flees). Killing him stops the drum and the frenzy; burning the drum afterwards is still needed for the quest. He stays on the scaffold and throws spears down; reaching him means climbing the terraces or walking the top terrace to the west shelf and its gangway under fire, or archery."
    inputs: [Drum-Master alive, great drum burnt]
    states: [drumming (frenzy), silent]
    population:
      - {actor: Orc Archer, role: Drum-Master, groups: 1, levels: [9, 9], placed: true, strength: boss}
  - id: set:drums_fade
    kind: scripted
    spaces: [room:cave_mouth, room:palisade_cave, room:cookfire_cave, room:drum_hall]
    rule: "The three drums are three layers of looping sound across the whole map. Each one burnt removes its layer; with all three burnt the caves fall silent but for dripping water, and the quest bit is set."
    inputs: [burn a drum]
    states: [three drums, two, one, silent]
    gives:
      qbit: war_drums_burned
  - id: set:palisade_fire
    kind: ambush
    spaces: [room:palisade_cave, zone:firing_step, room:palisade_yard]
    rule: "Archers on both firing steps shoot over the palisade as soon as the party comes within sight of the gate, and down through the murder holes into the gate passage; the gate group waits in the passage. Coming along the upper ledge (the loop's other end) takes the east step's archers from behind."
mechanisms:
  - {kind: double timber gate, count: 1, notes: "The palisade gate, 384 wide in 64 of timber (bwooda1 leaves): two leaves swinging inward on a plain click from either side; nothing locks it. The studio's doors are one leaf each: two hinged leaves on one opening."}
  - {kind: barred gate to another map, count: 1, notes: "The back gate: an exit panel in the guardroom's north wall (bwooda2, planks with grilles). From inside a click lifts the bar (qbit orc_back_gate_open) and leads to X7; afterwards it works both ways. From X7 before that: barred."}
  - {kind: secret rolling boulder, count: 1, notes: "Between the hollows and the plunder cache, in 64 of rock: a rock-faced leaf (gcav1wal) flagged secret, found by perception (map difficulty 1); a click rolls it aside. The studio's doors slide up or down or swing, so until a sideways slide exists it sinks into the floor."}
  - {kind: cage gate, count: 1, notes: "Across the pit's rim opening: lashed poles (bwooda2 look) that lift on the same click that drops the rope ladder, from the hollows' side."}
  - {kind: rope ladder, count: 1, notes: "256 down into the pit: a climbable ladder volume (the engine's scene ladders). objects.yml has no ladders yet; the build's stand-in is a lift about 192 square with 256 of travel in the pit, raised level with the rim, which the cage-gate event lowers."}
  - {kind: burnable war drum, count: 3, notes: "Signal (east firing step), spirit (the shaman's dais), great (the scaffold). Each a placeholder decoration (no drum model in the library) that is also a destructible prop (decoration_cog, about 30 hp, the wood break effect; a fire effect is wanted) and clickable: the click destroys it outright (evt.DestroyDestructible), a fire spell or blow wears it down. Its destroyed_event hides the drum, shows a charred frame (dec24x, the burned-out fire) with smoke, and counts the drums burnt in a map variable."}
  - {kind: looping drum sound, count: 3, notes: "Placed ambient sounds (scene ambient_sounds), each tied to its drum's decoration, with a radius over the whole map: hiding the drum stops its loop."}
  - {kind: timber stair, count: 3, notes: "Two flights of six steps up to the firing steps and the four-step gangway to the scaffold: rooms in the sketch, replacing the L1 plan's three ladders so the critical path is walked, not climbed."}
