format: 0
level: L3
pitch: "The orcs raiding Vertigo's farms answer to drums that boom out of a cave in the north hills. Inside the skull-hung mouth a timber palisade blocks the cave, archers on its firing steps. Beyond it the warband lives in smoky caves round a cookfire, keeps a captured farmer in a pit, and gathers in the Drum Hall, a tall natural amphitheatre of rock terraces where the Drum-Master pounds a great war drum on a timber scaffold and his drumming drives the orcs into a frenzy. A shaman beats a spirit drum in a bone-hung den; a third drum signals from the palisade. Burn all three and the hills fall quiet. A bat chimney climbs from the Drum Hall back up to a high ledge that runs to the palisade, and a narrow tunnel runs north to a barred back gate on Mount Firestone's slopes, held by two big orc guards."
purpose: "Optional Act I dungeon: burn the three war drums (the outposts on X1 lose heart: their orcs stop returning), free the captive farmer, take the warband's plunder. Monster levels 3 to 9, with a tougher pair of guards at the optional back gate to X7. A party of about level 5 to 8; about 15 minutes."
mood: "Smoke, firelight and noise: the drums are heard from the mouth and grow louder all the way in; each drum burnt takes a layer of the sound away, and the last leaves the caves silent."
datum: arrival
