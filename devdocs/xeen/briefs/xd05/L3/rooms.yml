notes: "The to-scale sketch of the Orc Caves, in whole map units: x east, y north, origin at the middle of the cave mouth's daylight edge; heights from the plan's datum, the arrival floor (0). Every corner is on a 64 grid. A plan space is one room except where a ramp or a flight must be its own straight, convex room, or where a shape needs pieces: the palisade cave (outer yard; behind the gate the inner yard space: gate passage, two stairs, yard), the firing step (two rooms), the run (3), the drum hall (8: entry ramp, top terrace, three banks of terraces, floor, west top terrace; the scaffold and its gangway are the scaffold zone), the bat chimney (8), the snake pool (3), the back tunnel (6) and the shaman's den (2); the extra rooms name their space and the openings between them carry no plan link. Rooms an opening joins are 64 apart (a rock or timber wall) except inside the drum hall's bowl and at the pool's waterline, where they touch. Every floor change on the critical path is a ramp, a flight or a level doorway, so the arrival walks to all three drums; the drops are deliberate one-way ledges (firing steps 192 over the palisade, the upper ledge 288 and 448, the scaffold 384, the pit 256). Lowest ceiling 384 clear. Still not drawable (gaps): the ladders (objects.yml has none; timber stairs replace the firing-step and scaffold ladders and a lift stands in for the rope ladder), a scaffold standing free in the hall and a ledge spiralling inside the chimney (R3-K7), the smoke hole and the roof's shape (R3-K5), curved terraces and openings without jambs (R3-K9; the banks are three straight flights between rock buttresses), the pool's liquid and sunken basin (R3-K6), rock relief, and the double gate, the sideways-rolling boulder and the drums as burnable props (objects stage)."
