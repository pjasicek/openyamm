notes: "Xeen design brief, level L2, for a new map (no original to rebuild). Optional dungeon, no story step; MAPS.md lists it as 'Burn the war-drums'. Encounter slots are Xeen families from devdocs/xeen/MONSTERS_AND_ITEMS.md: 1 Orcs (Orc Archer 7), 2 Bats (Giant Bat 3), 3 Serpents (Giant Snake 5). Monster levels 3 to 9 in the map's body; the Drum-Master is an Orc Archer at 9 with boss hit points; the two Orc Guards at the optional back gate are level 12 (the family's rank b), above MAPS.md's 5-9 on purpose. Provisional ids: map_stats row 9135, qbits 110050-110052 (Xeen ranges, devdocs/xeen/PRODUCTION.md); none registered. No items: the drums burn on a click or a fire spell, and the cave has no key. The footprint grew from L1's 12 x 14 cells to 12 x 24 when the plan was drawn to scale (L3): the loop through the drum hall and back along the upper ledge is a long ring, and the back tunnel climbs 960 north of the hall."
