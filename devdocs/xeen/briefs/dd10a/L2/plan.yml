  a high ruby stope round a rock pillar, a drift the arachnoid queens have webbed shut, a sump of standing water, a winding
  emerald gallery and a dead end of miners'' bones. Five ruby and five emerald veins give one rock each until the God of Minerals
  (DD-10B) is paid to refill them.'
