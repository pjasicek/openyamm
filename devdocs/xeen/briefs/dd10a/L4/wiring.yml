  - id: evt:enter
    preset: text
    trigger: load
    text: "Cold air, wet rock, old timber."
    notes: "Every entry: a status line."
  - id: evt:exit
    preset: exit
    source: exit:d1
    title: Adit
    notes: "Out to the outdoor map by the adit: the game's own leave window (D-24); 'Exit the Gemstone Mines?' (dark/aaze0039:0) is its meaning."
  - id: evt:refill
    preset: script
    trigger: load
    condition: {qbit: refill_a, not: {map_var: in_visit}}
    effects:
      - set:
          var:
            map_var: ruby_1
          value: 0
      - set:
          var:
            map_var: ruby_2
          value: 0
      - set:
          var:
            map_var: ruby_3
          value: 0
      - set:
          var:
            map_var: ruby_4
          value: 0
      - set:
          var:
            map_var: ruby_5
          value: 0
      - set:
          var:
            map_var: emerald_1
          value: 0
      - set:
          var:
            map_var: emerald_2
          value: 0
      - set:
          var:
            map_var: emerald_3
          value: 0
      - set:
          var:
            map_var: emerald_4
          value: 0
      - set:
          var:
            map_var: emerald_5
          value: 0
      - clear_qbit: refill_a
      - text: "The veins glitter again: the God of Minerals has been at work."
      - set:
          var:
            map_var: in_visit
          value: 1
    else_effects:
      - set:
          var:
            map_var: in_visit
          value: 1
    notes: "D-27: the God of Minerals (DD-10B, q-d7.god_of_minerals) sets the three refill bits; this pocket's fresh entry (not a load inside a visit: in_visit) resets its veins and clears its own bit (refill_a)."
