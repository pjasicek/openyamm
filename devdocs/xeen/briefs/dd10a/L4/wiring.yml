  - id: evt:skeleton
    preset: text
    source: deco:bones_skeleton
    title: Bones
    text: "A miner, still holding the handle of a broken pick. Nothing else on him."
    seconds: 5
  - id: evt:visit_end
    preset: script
    trigger: leave
    effects:
      - set:
          var:
            map_var: in_visit
          value: 0
    notes: "Leaving ends the visit: the next load is a fresh entry (evt:refill)."
notes: "DD-10A's events (gen.py, mine.py): the ten veins (q-d7.ruby_veins, emerald_veins: one rock each, a map variable each), the refill on entry (q-d7.refill_a), the exploding bone heap (D-27), the exit to D1, doors, chests, flavour."
