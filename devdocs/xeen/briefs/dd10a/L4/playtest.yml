# Playtest of the Gemstone Mines, west pocket (DD-10A, L4; lane A8, 2026-11-20): the loop through every mechanism and
# Q-D7's refill (D-27: pick, pay, re-enter, full).
# A level-25 party comes in at the adit (the arrival window, once); nothing is dug yet. Through the adit's door, the timbered gallery
# (bats), the ruby stope: five ruby veins, one rock each (q-d7.dug set), a spent vein says so; the cobweb drift (the
# queens), the sump's door, the strongbox; the emerald gallery's door: five emerald veins; the bone pocket: a heap that
# crumbles, the heap that explodes once (fire to every member), the chest; back round to the gallery and the adit.
# Re-entered before paying: the veins stay spent. Paid (10,000 gold; the hook's effects played by script): the three refill bits set, dug cleared; re-entered:
# this pocket's veins are full again and refill_a is cleared (refill_b stays for DD-10B); a vein gives a rock again.
# A rock given while the hand is empty lands in the hand (as any GiveItem): the test stows it.
# Played with --world xeen --map xeen_dd10a.blv (output/studio_cal/dd10a/four.sh). Numbers are ids.lock.yml's: events
# 21-25 ruby veins, 13-17 emerald veins, 2 and 4 bone heaps, 6 and 7 chests, 10-12 doors; map variables 7-11 ruby, 2-6
# emerald, 1 bones_blown.
id: xeen.dd10a.l4.walk
title: Gemstone Mines west pocket (DD-10A L4), the loop, ten veins, the bones, the refill
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_dd10a.blv
      party:
        gold: 12000
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 25, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 25, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 25, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 25, skills: [], equipment: {}}
  - assert: {map: xeen_dd10a.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - assert: {party_position: {x: 0, y: 192, radius: 64, z_min: -8, z_max: 8}}
  # A2's rows, all placed and hostile.
  - assert: {actor_count: {monster_id: 11331, min: 6, max: 6}}
  - assert: {actor_count: {monster_id: 11332, min: 4, max: 4}}
  - assert: {actor_count: {monster_id: 11312, min: 6, max: 6}}
  - assert: {actor_count: {monster_id: 11361, min: 4, max: 4}}
  # Why the party is here: the arrival window, once (arrived_once 117160).
  - advance_runtime: {seconds: 3, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "THE GEMSTONE MINES"}}
  - play_lua: {source: "close(); if not qbit(117160) then error('arrived_once not set') end"}
  - assert: {actor_count: {monster_id: 11331, hostile: false, max: 0}}
  - assert: {actor_count: {monster_id: 11312, hostile: false, max: 0}}
  # Nothing dug yet (the God of Minerals, DD-10B's q-d7.god_of_minerals, refuses while q-d7.dug is clear).
  - play_lua: {source: "if qbit(113144) or qbit(113141) then error('q-d7.dug or refill_a set at the start') end"}
  # The adit's door, the timbered gallery (three bats).
  - walk_to: {x: 0, y: 760, z: 0, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "open_door(10, 1)"}
  - walk_to: {x: 0, y: 1300, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 0, y: 2300, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        status(); click(5); wait(0.5)
        if not string.find(status(), "ore cart", 1, true) then error("the cart said nothing: " .. status()) end
  - walk_to: {x: 1400, y: 2432, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  # The ruby stope: five veins, one rock each; the spent line.
  - walk_to: {x: 2000, y: 2432, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - clear_hostiles: {radius: 2200}
  - play_lua:
      source: |
        if qbit(113144) then error("dug set before any vein") end
        for _, e in ipairs({21, 22, 23, 24, 25}) do click(e); wait(0.3); if held() ~= 0 then stow() end end
        if item_count(12357) ~= 5 then error("five ruby veins gave " .. item_count(12357) .. " rocks") end
        if not qbit(113144) then error("q-d7.dug not set by a ruby vein") end
        for v = 7, 11 do if mapvar(v) ~= 1 then error("ruby vein variable " .. v .. " is " .. mapvar(v)) end end
        click(23); wait(0.3)
        if not string.find(status(), "all this vein has to offer", 1, true) then error("no spent line: " .. status()) end
        if item_count(12357) ~= 5 then error("a spent vein gave a rock") end
  # The cobweb drift (the queens' den) and its web.
  - walk_to: {x: 3200, y: 2560, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 3900, y: 2560, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - assert: {actor_count: {monster_id: 11332, max: 0}}
  - play_lua:
      source: |
        click(8); wait(0.5)
        if not string.find(status(), "Cobwebs", 1, true) then error("the web said nothing: " .. status()) end
  # The sump's door, the strongbox.
  - walk_to: {x: 4288, y: 2200, z: 0, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "open_door(12, 3)"}
  - walk_to: {x: 4288, y: 1800, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 4096, y: 1240, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua:
      source: |
        local g = gold()
        loot_chest(7); close(); if held() ~= 0 then stow() end
        if gold() < g + 600 then error("the strongbox did not hold its 600 gold") end
  # The emerald gallery's door: five emerald veins.
  - walk_to: {x: 3900, y: 1376, z: 0, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "open_door(11, 2)"}
  - walk_to: {x: 3300, y: 1300, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - play_lua:
      source: |
        for _, e in ipairs({13, 14, 15, 16, 17}) do
            status(); click(e); wait(0.3)
            local seen = status()
            if not string.find(seen, "You work an emerald rock out of the vein.", 1, true) then error("vein " .. e .. " said: " .. seen) end
            if held() ~= 0 then stow() end
        end
        if item_count(12358) ~= 5 then error("five emerald veins gave " .. item_count(12358) .. " rocks") end
        click(15); wait(0.3)
        if not string.find(status(), "all this vein has to offer", 1, true) then error("no spent line: " .. status()) end
        if item_count(12358) ~= 5 then error("a spent emerald vein gave a rock") end
  - assert: {actor_count: {monster_id: 11331, max: 0}}
  - assert: {actor_count: {monster_id: 11312, max: 0}}
  - assert: {actor_count: {monster_id: 11361, max: 0}}
  # The bone pocket: a heap crumbles; the heap that explodes, once (fire to every member); the miners' chest.
  - walk_to: {x: 2300, y: 1024, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 1300, y: 1250, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua:
      source: |
        click(2); wait(0.3)
        if not string.find(status(), "crumble to dust", 1, true) then error("the bones did not crumble: " .. status()) end
  - assert: {party_health: {full: true}}
  - setup_shortcut: {kind: immortal, value: false}
  - execute_event: {id: 4}
  - assert: {dialog: {active: true, text_contains: "The bones explode!"}}
  - play_lua: {source: "close(); if mapvar(1) ~= 1 then error('bones_blown not set') end"}
  - assert: {party_health: {full: false}}
  - assert: {member_points: {member_index: 3, health_min: 1}}
  - setup_shortcut: {kind: immortal, value: true}
  - play_lua:
      source: |
        click(4); wait(0.3)
        if not string.find(status(), "crumble to dust", 1, true) then error("the heap exploded twice: " .. status()) end
        local g = gold()
        loot_chest(6); close(); if held() ~= 0 then stow() end
        if gold() < g + 450 then error("the miners' chest did not hold its 450 gold") end
  # Back round to the gallery and the adit.
  - walk_to: {x: 1024, y: 1900, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 1024, y: 2432, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 0, y: 2432, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 0, y: 1100, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 0, y: 400, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  # Re-entered before the God is paid: the veins stay spent.
  - load_map: {map: xeen_dd10a.blv}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {map: xeen_dd10a.blv}
  - play_lua:
      source: |
        close()
        for v = 2, 11 do if mapvar(v) ~= 1 then error("vein variable " .. v .. " reset without a payment") end end
        click(21); wait(0.3); if held() ~= 0 then stow() end
        if item_count(12357) ~= 5 then error("a vein refilled without a payment") end
  # The God of Minerals is paid in DD-10B (dug is set): its hook's do-list (A3's q-d7.god_of_minerals: 10,000 gold, the
  # three refill bits, dug cleared) is played here by an event script; the scenario's event Lua has no XeenQuests.
  - lua_event: {source: "if IsQBitSet(QBit(113144)) and IsAtLeast(Gold, 10000) then SubtractValue(Gold, 10000); SetQBit(QBit(113141)); SetQBit(QBit(113142)); SetQBit(QBit(113143)); ClearQBit(QBit(113144)) end"}
  - play_lua:
      source: |
        close()
        for _, b in ipairs({113141, 113142, 113143}) do if not qbit(b) then error("refill bit " .. b .. " not set") end end
        if qbit(113144) then error("dug not cleared by the payment") end
  # A save and a reload inside the visit refill nothing (A3, session 7: refill on a fresh entry only, in_visit).
  - save_game: {name: dd10a_paid}
  - load_game: {name: dd10a_paid}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - play_lua:
      source: |
        close()
        if not qbit(113141) then error("a reload inside the visit cleared refill_a") end
        if item_count(12357) ~= 5 then error("the rocks changed on a reload: " .. item_count(12357)) end
  # Out by the adit (the leave event ends the visit), then re-entered: this pocket refills (refill_a cleared; refill_b
  # and refill_c stay for the other pockets).
  - execute_event: {id: 19}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d1.odm}
  - load_map: {map: xeen_dd10a.blv}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {map: xeen_dd10a.blv}
  - play_lua:
      source: |
        close()
        for v = 2, 11 do if mapvar(v) ~= 0 then error("vein variable " .. v .. " not refilled: " .. mapvar(v)) end end
        if qbit(113141) then error("refill_a not cleared on entry") end
        if not qbit(113142) or not qbit(113143) then error("the other pockets' refill bits were cleared") end
        if mapvar(1) ~= 1 then error("the exploded heap came back with the veins") end
        click(21); wait(0.3); if held() ~= 0 then stow() end
        if item_count(12357) ~= 6 then error("a refilled ruby vein gave no rock: " .. item_count(12357)) end
        if not qbit(113144) then error("dug not set again by the refilled vein") end
        click(21); wait(0.3); if held() ~= 0 then stow() end
        if item_count(12357) ~= 6 then error("the refilled vein gave twice") end
  # Re-entered once more: no second refill without a second payment.
  - load_map: {map: xeen_dd10a.blv}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - play_lua:
      source: |
        close()
        if mapvar(7) ~= 1 then error("the picked vein refilled again without a payment") end
        if mapvar(8) ~= 0 then error("an unpicked vein is spent") end
