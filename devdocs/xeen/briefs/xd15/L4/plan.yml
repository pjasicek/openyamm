format: 0
level: L3
pitch: "The Northern Sphinx from inside: the breast between the paws, a hall of striped columns under its chest, sarcophagus galleries along its flanks, the belly hall where two carved throne doors wait for the Sphinx's name, the vault in its haunches. Up the throat, the head: two lappets and, behind the face, the riddle chamber, lit by the eyes, where a sun disc in the floor asks 'What is my name?'. GOLUX opens the thrones; anything else drops the party into the hieroglyph dungeon below, whose walls spell the name and whose stair climbs back to the body."
purpose: "Q-C9 The Sphinx (Act IV, party 31-34): the name (q-c9.riddle, name_right, name_wrong), the hieroglyph clues (q-c9.hieroglyphs), the four thrones (+2 once per character), the Starburst and Divine Intervention spellbooks. 45 monsters at 22-42 (Sand, Stone and Iron Golems, Tomb Mummies), treasure 4."
mood: "Warm sandstone lit by torches and braziers; gold and blue in the throne rooms; two bright bars of desert light behind the face; carved orange hieroglyphs and drifted sand below."
datum: arrival
