format: 0
start:
  room: room:breast_gate
  at: [0, 256]
  facing: n
  notes: "In the breast gate about 256 inside the leaves, facing north into the paw hall."
arrivals:
  - {entrance: entrance:x6_paws, room: room:breast_gate, at: [0, 256], facing: n, notes: "In the breast gate about 256 inside the leaves, facing north (X6's door between the paws arrives here)."}
doors:
  - id: door:drop
    opening: open:drop_ge
    kind: slide_up
    fold: true
    thickness: 24
    surface: {texture: egywle, size: [128, 128]}
    tile: true
    notes: "The drop cell's slab: it opens from inside and stays open (D-39)."
  - id: door:haunch
    opening: open:belly_haunch
    kind: slide_up
    fold: true
    thickness: 24
    surface: {texture: egywle, size: [128, 128]}
    tile: true
    notes: A carved stone slab into the haunch vault.
  - id: door:king
    opening: open:belly_king
    kind: hinged
    leaves: 2
    thickness: 24
    edge_surface: {texture: egywle, size: [128, 128]}
    pictures:
      - [{texture: egydrsml, size: [128, 256]}, {texture: egydrsmr, size: [128, 256]}]
    back_pictures:
      - [{texture: egydrsml, size: [128, 256]}, {texture: egydrsmr, size: [128, 256]}]
    notes: "The crown door: two carved leaves, Horus in the double crown (egydrsml/egydrsmr, a pair of wings), sealed until the Sphinx is named."
  - id: door:legend
    opening: open:riddle_legend
    kind: hinged
    leaves: 2
    thickness: 24
    edge_surface: {texture: egywle, size: [128, 128]}
    pictures:
      - [{texture: egydrlgl, size: [256, 256]}, {texture: egydrlgr, size: [256, 256]}]
    back_pictures:
      - [{texture: egydrlgl, size: [256, 256]}, {texture: egydrlgr, size: [256, 256]}]
    notes: "The legend door into the nemes' crown: the pharaoh enthroned under the sun on two leaves (egydrlgl/egydrlgr), sealed until the Sphinx is named."
  - id: door:library
    opening: open:gw_library
    kind: slide_up
    fold: true
    thickness: 24
    surface: {texture: egywle, size: [128, 128]}
    tile: true
    notes: The library's carved slab.
  - id: door:panel
    opening: open:queen_thieves
    kind: slide_up
    thickness: 24
    speed: 192
    surface: {texture: egywlspa, size: [256, 256], fit: true}
    secret: true
    back_surface: {texture: egymeda, size: [256, 256], fit: true, uneven: true}
    notes: "The loose panel with the carved jackal mask (egywlspa): a secret door that slides up on a click."
  - id: door:queen
    opening: open:belly_queen
    kind: slide_up
    thickness: 24
    speed: 192
    surface: {texture: egydrsmc, size: [128, 256], fit: true}
    back_surface: {texture: egydrsmc, size: [128, 256], fit: true}
    notes: "The veil door: one carved leaf of veiled women in relief (egydrsmc), sealed until the Sphinx is named; it rises into the wall."
movers:
  - id: mover:disc
    room: room:riddle
    at: [832, -4160]
    size: [376, 376]
    bottom: 0
    floor_height: 1088
    height: 200
    travel: [0, 0, -176]
    speed: 256
    auto_return_seconds: 3
    surface: {texture: egywle, size: [128, 128]}
    top_surface: {texture: egyswaon, size: [32, 32], scale: 12}
    notes: "The sun disc (a scarab on its face) over its shaft, 8 over the floor: stepping on it asks the name; a wrong name sinks it 176 into the shaft with the party on it, the party is moved to the drop cell, and the disc rises again by itself (D-39 Q5)."
plates: []
sounds:
