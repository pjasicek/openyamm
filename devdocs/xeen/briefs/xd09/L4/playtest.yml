# Playtest of the Golem Dungeon (XD-09, L4): every mechanism on the party's own route, start to goal and the way out.
# A level-17 party of four arrives on the landing (why it is here: the arrival message), asks at the tundra door and
# the Diamond door from the entry side, reads the statue's plaque (m10.golem_plaque), opens the Wood door, cuts three
# boughs by click and breaks the fourth as a blow would (the destructible's on_destroyed counts it), loots the seed
# chest, touches the statue (the Stone door opens), climbs to the galleries and the lamp gallery, pushes the nine
# blocks (six glowing rocks: the Iron door opens), loots the masons' chest, takes the Iron Key from the forge chest,
# is refused by the great lock, draws the three bolts (one lever thrown back and forth: the bolt follows), turns the
# key (the lid slides aside), goes down to the Diamond hall, kills the Diamond Golem (the vault opens), opens the vault
# chest (m10.golem_vault: five Megacredits, golem_credits, the award) and leaves by the vault stair through the
# Diamond door into the entry. Numbers are ids.lock.yml's (events, doors, map variables, destructibles).
# Run from assets_dev with --world xeen --map xeen_xd09.blv (A2's map_stats row 9125 and the Iron Key 12261 are in the
# world's tables since session 3): output/studio_cal/xd09/play.sh.
id: xeen.xd09.l4.walk
title: Golem Dungeon (XD-09 L4), the four homes, the vault and the way out
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_xd09.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 17, experience: 140000, might: 30, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 17, experience: 140000, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 17, experience: 140000, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 17, experience: 140000, skills: [], equipment: {}}
  - assert: {map: xeen_xd09.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - assert: {party_position: {x: 384, y: -2176, radius: 64, z_min: 184, z_max: 200}}
  # Why the party is here: the one-shot arrival timer (its map variable), first arrival only (arrived_once 110601).
  - play_lua: {source: "wait(3)"}
  - assert: {state_dump_map_var: {index: 0, value: 1}}
  - play_lua: {source: "if not qbit(110601) then error('the arrival window did not set arrived_once') end"}
  # The tundra door out to X5 asks first; the party stays (playtest_exit.yml takes it).
  - play_lua: {source: "close(); click(28); wait(1)"}
  - assert:
      dialog: {text_contains: "leave Golem Dungeon"}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - press_action: {action: cancel_dialog}
  - advance_runtime: {seconds: 0.5}
  - assert: {map: xeen_xd09.blv}
  # Down the steps; the Diamond door has nothing on this side.
  - walk_to: {x: 384, y: -1700, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 640, y: -1632, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua:
      source: |
        status(); click(26); wait(0.5)
        local s = tostring(status())
        if not string.find(s, "no ring or keyhole") then error("the Diamond door said: " .. s) end
        if door_state(1) ~= "closed" then error("the Diamond door opened from the entry") end
  # The Hall of the Plaque: the statue's rhyme and the count of boughs.
  - walk_to: {x: 384, y: -1100, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: 0, y: -450, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua:
      source: |
        status(); click(41); wait(1)
        local s = tostring(status())
        if not string.find(s, "Four branches remain") then error("the plaque did not count the boughs: " .. s) end
  - assert:
      dialog: {text_contains: "Solve the wood"}
  - play_lua:
      source: |
        close()
        if door_state(5) ~= "closed" then error("the Stone door is not shut") end
  # The Iron door says what opens it.
  - walk_to: {x: 1000, y: 384, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - play_lua: {source: "click(33); wait(1)"}
  - assert:
      dialog: {text_contains: "0 of them burn"}
  - play_lua: {source: "close(); if door_state(3) ~= 'closed' then error('the Iron door is not shut') end"}
  # The Wood: the trunk, the four boughs.
  - walk_to: {x: -1000, y: 0, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "open_door(44, 7)"}
  - walk_to: {x: -1800, y: 0, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - walk_to: {x: -2944, y: 0, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: -2944, y: 1300, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - console: {line: destructible 3 state, expect_contains: standing}
  - play_lua:
      source: |
        status(); click(16); wait(1.5)
        local s = tostring(status())
        if not string.find(s, "Three branches remain") then error("the low north bough said: " .. s) end
  - assert: {state_dump_map_var: {index: 11, value: 1}}
  - console: {line: destructible 3 state, expect_contains: broken}
  - play_lua:
      source: |
        status(); click(16); wait(0.5)
        if not string.find(tostring(status()), "lies cut") then error("a cut bough did not say so") end
  - walk_to: {x: -2944, y: 0, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -2944, y: -1300, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - play_lua:
      source: |
        status(); click(18); wait(1.5)
        local s = tostring(status())
        if not string.find(s, "Two branches remain") then error("the low south bough said: " .. s) end
  # The crown, the high north branch: this bough is broken as blows break it (its on_destroyed counts it).
  - walk_to: {x: -2944, y: 0, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -4300, y: 0, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - walk_to: {x: -5300, y: 0, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: -5632, y: 250, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -5632, y: 1350, z: 256, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - play_lua: {source: "status()"}
  - console: {line: destructible 1 destroy}
  - play_lua:
      source: |
        wait(1.5)
        local s = tostring(status())
        if not string.find(s, "One branch remains") then error("the broken high north bough said: " .. s) end
  - assert: {state_dump_map_var: {index: 11, value: 3}}
  - walk_to: {x: -5632, y: 250, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -5632, y: -250, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -5632, y: -1350, z: 256, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - play_lua:
      source: |
        status(); click(14); wait(1.5)
        local s = tostring(status())
        if not string.find(s, "Return to the statue") then error("the last bough said: " .. s) end
  - assert: {state_dump_map_var: {index: 11, value: 4}}
  # The heartwood's seed chest.
  - walk_to: {x: -5632, y: -250, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -6200, y: 0, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -7050, y: 0, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - play_lua: {source: "loot_chest(21); if held() ~= 0 then stow() end"}
  # Back to the statue: the Stone door opens.
  - walk_to: {x: -5300, y: 0, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -2000, y: 0, z: 0, radius: 64, timeout_seconds: 40, clear_hostiles: 2500, close_dialogs: true}
  - walk_to: {x: -900, y: 0, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -400, y: 500, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(41); wait(1)"}
  - assert:
      dialog: {text_contains: "Stone door grinds open"}
  - play_lua:
      source: |
        close(); wait(4)
        if door_state(5) ~= "open" then error("the statue did not open the Stone door") end
  # The Stone: up the stair; the lamp gallery's window; the block field.
  - walk_to: {x: 384, y: 1000, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 384, y: 2700, z: 480, z_tolerance: 48, radius: 64, timeout_seconds: 40, clear_hostiles: 2500, close_dialogs: true}
  - walk_to: {x: 384, y: 3200, z: 512, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - assert: {state_dump_map_var: {index: 15, value: 1}}
  - walk_to: {x: -448, y: 3200, z: 512, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -448, y: 1500, z: 512, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - assert: {state_dump_map_var: {index: 21, value: 1}}
  - walk_to: {x: -448, y: 3200, z: 512, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1600, y: 3200, z: 512, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - walk_to: {x: -1600, y: 5376, z: 512, radius: 64, timeout_seconds: 40, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: -1150, y: 5376, z: 512, z_tolerance: 48, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -200, y: 5376, z: 256, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  # The nine blocks, row by row from the north, standing west of each (a pushed block slides east).
  - walk_to: {x: -200, y: 5180, z: 256, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua:
      source: |
        status(); click(11); wait(3)
        local s = tostring(status())
        if not string.find(s, "Stone Block %- Glowing Rock") then error("block 33 said: " .. s) end
        if door_state(16) ~= "open" then error("block 33 did not slide") end
        status(); click(10); wait(3)
        status(); click(9); wait(3)
        s = tostring(status())
        if not string.find(s, "Bare stone") then error("block 31 said: " .. s) end
        status(); click(9); wait(0.5)
        if not string.find(tostring(status()), "sits in its recess") then error("a pushed block did not say so") end
  - walk_to: {x: -200, y: 4672, z: 256, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - assert: {state_dump_map_var: {index: 2, value: 2}}
  - play_lua: {source: "click(6); wait(3); click(7); wait(3); click(8); wait(3)"}
  - assert: {state_dump_map_var: {index: 2, value: 4}}
  - walk_to: {x: -200, y: 4160, z: 256, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - play_lua: {source: "click(5); wait(3); click(4); wait(3)"}
  - walk_to: {x: -200, y: 3650, z: 256, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - play_lua:
      source: |
        click(3); wait(4)
        for d = 8, 16 do if door_state(d) ~= "open" then error("block door " .. d .. " is not pushed") end end
        wait(4)
        if door_state(3) ~= "open" then error("six rocks did not open the Iron door") end
  - assert: {state_dump_map_var: {index: 2, value: 6}}
  # The east gallery and the masons' store.
  - walk_to: {x: 200, y: 5376, z: 256, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 1150, y: 5376, z: 512, z_tolerance: 48, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 1600, y: 5300, z: 512, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - walk_to: {x: 1600, y: 4864, z: 512, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - play_lua: {source: "open_door(40, 4)"}
  - walk_to: {x: 2300, y: 4700, z: 512, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - walk_to: {x: 2700, y: 4560, z: 512, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "loot_chest(22); if held() ~= 0 then stow() end"}
  - walk_to: {x: 1600, y: 4864, z: 512, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 1600, y: 3200, z: 512, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 384, y: 3200, z: 512, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 384, y: 1450, z: 0, z_tolerance: 48, radius: 64, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 384, y: 800, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  # The Iron: the forge chest's Iron Key.
  - walk_to: {x: 1000, y: 384, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 1800, y: 384, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 1800}
  - walk_to: {x: 1640, y: 950, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua:
      source: |
        for _, id in ipairs(pack_items()) do if id ~= 12261 and id ~= 12192 then while discard(id) do end end end
        loot_chest(20)
        if held() ~= 0 then stow() end
        if item_count(12261) ~= 1 then error("the forge chest did not hold the Iron Key") end
  # The lock hall: the lock refuses with the bolts shot.
  - walk_to: {x: 2900, y: -256, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "open_door(30, 2)"}
  # (clearing stays within 1,000 here: the Diamond hall below lies within 2,400 and must keep its golems)
  - walk_to: {x: 3500, y: -256, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 900, close_dialogs: true}
  - walk_to: {x: 3500, y: 500, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1000, close_dialogs: true}
  - clear_hostiles: {radius: 1000}
  - assert: {state_dump_map_var: {index: 22, value: 1}}
  - play_lua: {source: "click(31); wait(1)"}
  - assert:
      dialog: {text_contains: "3 of the three bolts"}
  - play_lua: {source: "close(); if door_state(20) ~= 'closed' then error('the lid moved with the bolts shot') end"}
  # Lever 2 (south wall): the south bolt.
  - walk_to: {x: 4224, y: -850, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(38); wait(3); if door_state(19) ~= 'open' then error('the south bolt did not draw') end"}
  # Lever 3 (east tumbler), thrown back and forth: the bolt follows.
  - walk_to: {x: 5050, y: 704, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 5550, y: 704, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 5450, y: 120, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua:
      source: |
        status(); click(36); wait(3)
        if door_state(17) ~= "open" then error("the east bolt did not draw") end
        click(36); wait(3)
        if door_state(17) ~= "closed" then error("the east bolt did not shoot home again") end
        if not string.find(tostring(status()), "shoots home") then error("the lever did not say the bolt shot home") end
        click(36); wait(3)
        if door_state(17) ~= "open" then error("the east bolt is not drawn after three throws") end
  - assert: {state_dump_map_var: {index: 17, value: 1}}
  # Lever 1 (north tumbler).
  - walk_to: {x: 5550, y: 704, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 4900, y: 704, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 3776, y: 1000, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 3776, y: 1700, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 4000, y: 1500, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(37); wait(3); if door_state(18) ~= 'open' then error('the north bolt did not draw') end"}
  # The key turns; the lid slides aside.
  - walk_to: {x: 3776, y: 1000, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 4800, y: 1000, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(31); wait(1)"}
  - assert:
      dialog: {text_contains: "The Iron Key turns"}
  - play_lua:
      source: |
        close(); wait(7)
        if door_state(20) ~= "open" then error("the great lock did not slide aside") end
  # The Diamond: down the stair; the Diamond Golem; the vault opens.
  - play_lua: {source: "if door_state(6) ~= 'closed' then error('the vault door is not shut while the Diamond Golem stands') end"}
  - walk_to: {x: 4224, y: 1180, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 4224, y: 850, z: -32, z_tolerance: 48, radius: 64, timeout_seconds: 30, close_dialogs: true}
  # The Diamond Golem and its Iron Golem come up the stair to meet the party: the fight (clear_hostiles) is on the stair.
  - walk_to: {x: 4224, y: -850, z: -620, z_tolerance: 48, radius: 64, timeout_seconds: 60, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 4224, y: -1350, z: -640, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - assert: {state_dump_map_var: {index: 14, value: 1}}
  - play_lua:
      source: |
        clear_hostiles(6000); wait(5)
        if not qbit(110600) then error("diamond_slain was not set") end
        if door_state(6) ~= "open" then error("the vault did not open on the Diamond Golem's death") end
  # The vault chest: m10.golem_vault.
  - walk_to: {x: 3600, y: -1632, z: -640, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 2880, y: -1500, z: -640, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua:
      source: |
        for _, id in ipairs(pack_items()) do if id ~= 12261 and id ~= 12192 then while discard(id) do end end end
        click(23); wait(1)
        local opened = take_chest()
        close(); close()
        if not opened then loot_chest(23) end
        if held() ~= 0 then stow() end
        if item_count(12192) ~= 5 then error("King's Megacredits from the vault: " .. tostring(item_count(12192))) end
        if not qbit(111202) then error("golem_credits was not set") end
  # The way out: the vault stair, the Diamond door from below, the entry.
  - walk_to: {x: 2300, y: -1632, z: -600, z_tolerance: 60, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 950, y: -1632, z: 0, z_tolerance: 40, radius: 64, timeout_seconds: 40, close_dialogs: true}
  - play_lua: {source: "click(24); wait(4); if door_state(1) ~= 'open' then error('the Diamond door did not open from the stair') end"}
  - walk_to: {x: 500, y: -1632, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 384, y: -1100, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - assert: {state_dump_map_var: {index: 12, value: 1}}
  - play_lua: {source: "if item_count(12192) ~= 5 then error('Megacredits lost') end"}
