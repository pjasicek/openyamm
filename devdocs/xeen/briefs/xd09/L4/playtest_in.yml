# Playtest of the way into the Golem Dungeon from X5 (XD-09, L4; lane A8, session 3, 2026-11-20): a new game on X5
# Winterkill Tundra (xeen_x5.odm, A6), set down in front of the Golem Rocks' slab door (X5 thing:xd09_door, event 92
# "Enter the Golem Dungeon", the pose of X5's own walk: 18688, -3577, 960 facing south). The door is open since D-89
# (no Golem Stone; A8 session 26): it leads into XD-09 at its own start
# on the landing (384, -2176, 192). Then the lane's re-entry check: the arrival window shows once (arrived_once 110601),
# the party leaves by the tundra door (event 28), comes in again by X5's door, and no window opens. Run from assets_dev
# with --world xeen and no --map (output/studio_cal/xd09/play.sh's fourth argument).
id: xeen.xd09.l4.in
title: Golem Dungeon (XD-09 L4), in from X5
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_x5.odm
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 17, experience: 140000, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 17, experience: 140000, skills: [], equipment: {}}
  - assert: {map: xeen_x5.odm}
  - setup_shortcut: {kind: immortal, value: true}
  - set_pose: {map: xeen_x5.odm, x: 18688, y: -3577, z: 960, yaw: -1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - press_interact: {expect: {kind: event_target}}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_xd09.blv}
  - assert: {party_position: {x: 384, y: -2176, radius: 128, z_min: 150, z_max: 240}}
  # First arrival only: the window shows once (arrived_once 110601); out by the tundra door, in again by X5's door, and
  # no window opens.
  - advance_runtime: {seconds: 3, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "The slab door grinds open at a push"}}
  - play_lua: {source: "close(); wait(1); if not qbit(110601) then error('the arrival window did not set arrived_once') end"}
  - execute_event: {id: 28}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.0, follow_map_move: true}
  - assert: {map: xeen_x5.odm}
  - assert: {party_position: {x: 18688, y: -3457, radius: 128, z_min: 880, z_max: 1100}}
  - set_pose: {map: xeen_x5.odm, x: 18688, y: -3577, z: 960, yaw: -1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - press_interact: {expect: {kind: event_target}}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_xd09.blv}
  - assert: {party_position: {x: 384, y: -2176, radius: 128, z_min: 150, z_max: 240}}
  - advance_runtime: {seconds: 3, present_dialogs: true}
  - assert: {dialog: {active: false}}
