      - message: "You touch the statue. Deep in the north wall a bar draws back, and the Stone door grinds open."
    else_effects:
      - lua: |-
          XeenQuests.hook("m10.golem_plaque")
          local s
          if IsAtLeast(MapVar(boughs), 4) then s = tr('The last branch falls. Return to the statue.')
          elseif IsAtLeast(MapVar(boughs), 3) then s = tr('One branch remains.')
          elseif IsAtLeast(MapVar(boughs), 2) then s = tr('Two branches remain.')
          elseif IsAtLeast(MapVar(boughs), 1) then s = tr('Three branches remain.')
          else s = tr('Four branches remain.') end
          if not IsAtLeast(MapVar(stone_open), 1) then evt.StatusText(s, 5) end
    notes: "set:wood: m10.golem_plaque shows the rhyme and the count of boughs left; with all four cut, a touch opens the Stone door."
  - id: evt:stone_door
    preset: script
    source: door:stone
    title: Home of the Stone
    condition: {not: {map_var: stone_open}}
    effects:
      - text: "A plaque over the door reads: Home of the Stone. The door is shut fast; there is no ring or keyhole."
    else_effects:
      - text: "A plaque over the door reads: Home of the Stone"
  - id: evt:vault_door
    preset: script
    source: door:vault
    title: Vault door
    condition: {not: {qbit: diamond_slain}}
    effects:
      - text: The vault door is sealed. It will not move while the Diamond Golem stands.
    else_effects:
      - text: The vault stands open.
  - id: evt:wood_door
    preset: door
    source: door:wood
    title: Home of the Wood
    action: open
    text: "A plaque over the door reads: Home of the Wood"
    seconds: 4
