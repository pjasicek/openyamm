  - id: evt:bough_hn
    preset: script
    source: platform:bough_hn
    title: Bough
    condition: {not: {map_var: cut_hn}}
    locked_text: The bough lies cut.
    sets: {map_var: cut_hn}
    effects:
      - add:
          var:
            map_var: boughs
          value: 1
      - destroy: destructible:bough_hn
      - lua: |-
          local s
          if IsAtLeast(MapVar(boughs), 4) then s = tr('The last branch falls. Return to the statue.')
          elseif IsAtLeast(MapVar(boughs), 3) then s = tr('One branch remains.')
          elseif IsAtLeast(MapVar(boughs), 2) then s = tr('Two branches remain.')
          elseif IsAtLeast(MapVar(boughs), 1) then s = tr('Three branches remain.')
          else s = tr('Four branches remain.') end
          evt.StatusText(tr('You hack through the living bough, and it falls. {remaining}', {remaining = s}), 6)
    notes: "Clicked, the party cuts the bough (its breaking runs the count)."
  - id: evt:bough_hn_cut
    preset: script
    trigger: call
    condition: {not: {map_var: cut_hn}}
    sets: {map_var: cut_hn}
    effects:
      - add:
          var:
            map_var: boughs
          value: 1
      - lua: |-
          local s
          if IsAtLeast(MapVar(boughs), 4) then s = tr('The last branch falls. Return to the statue.')
          elseif IsAtLeast(MapVar(boughs), 3) then s = tr('One branch remains.')
          elseif IsAtLeast(MapVar(boughs), 2) then s = tr('Two branches remain.')
          elseif IsAtLeast(MapVar(boughs), 1) then s = tr('Three branches remain.')
          else s = tr('Four branches remain.') end
          evt.StatusText(tr('The bough falls. {remaining}', {remaining = s}), 6)
    notes: "The bough's on_destroyed (broken by blows or missiles): counts down on the plaque; a cut by click has counted already."
