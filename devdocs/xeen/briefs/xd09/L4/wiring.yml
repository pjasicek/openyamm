variables: [boughs, cut_ln, cut_ls, cut_hn, cut_hs, stone_open, rocks, bolt_n, bolt_e, bolt_s, lid_open, diamond_open, block_11, block_12, block_13, block_21, block_22, block_23, block_31, block_32, block_33]
events:
  - id: evt:arrive
    preset: script
    trigger: timer
    every: 1
    condition: {not: {qbit: arrived_once}}
    once: true
    effects:
      - qbit: arrived_once
      - message: "The slab door grinds open at a push, and shut again behind you. Emerson's King's Megacredits for Newcastle lie somewhere below, the golems' hoard; the golems that keep this place were never told to stop."
    notes: "Why the party is here (M10: the five Megacredits for Newcastle's keep; no arrival hook exists for XD-09); first arrival only (arrived_once 110601)."
  - id: evt:bench
    preset: text
    source: platform:bench
    title: Bench
    text: "Chisels, mallets and stone dust: the golem-makers' bench."
  - id: evt:block_11
    preset: script
    source: mover:block_11
    title: Stone Block
    condition: {not: {map_var: block_11}}
    opens: [mover:block_11]
    sets: {map_var: block_11}
    effects:
      - add:
          var:
            map_var: rocks
          value: 1
      - lights_on: [light:rock_11, light:lamp_1]
      - set_texture:
          of: panel:lamp_1
          to: orfyrlga
      - lua: |-
          local n = 0
          for i = 1, 6 do if IsAtLeast(MapVar(rocks), i) then n = i end end
          evt.StatusText(tr('Stone Block - Glowing Rock! Far off, a lamp kindles over the Iron door ({count} of six).', {count = n}), 6)
    else_effects:
      - text: The block sits in its recess.
    notes: Bares glowing rock 1 (aaze0081:12) and lights lamp 1.
