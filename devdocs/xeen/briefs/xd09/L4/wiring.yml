  - id: evt:chest_vault
    preset: chest
    source: chest:vault
    title: Chest
    effects:
      - lua: "XeenQuests.hook(\"m10.golem_vault\")"
    notes: "m10.golem_vault (once): sets golem_credits, the Master of Golems award and 3,000 experience, and the plaque's lines; the chest holds the five Megacredits."
  - id: evt:diamond_back
    preset: door
    source: door:diamond
    side: room:vault_stair
    title: Door
    action: open
    sets: {map_var: diamond_open}
    text: "The Diamond door swings up: beyond it is the entry stair, by the Hall of the Plaque."
    seconds: 5
  - id: evt:diamond_dead
    preset: script
    trigger: timer
    every: 2
    condition: {kills: {monster: monster:diamond}}
    opens: [door:vault]
    once: true
    effects:
      - qbit: diamond_slain
    text: "The Diamond Golem shatters, and the vault door grinds up."
    seconds: 6
    notes: "set:diamond: its death opens the vault."
  - id: evt:diamond_front
    preset: script
    source: door:diamond
    side: room:entry
    title: Home of the Diamond
    condition: {not: {map_var: diamond_open}}
    effects:
      - text: "A plaque over the door reads: Home of the Diamond. The door has no ring or keyhole on this side."
    else_effects:
      - text: "A plaque over the door reads: Home of the Diamond"
  - id: evt:diamond_seen
    preset: text
    source: room:diamond_hall
    trigger: step
    once: true
    text: "A golem of living diamond turns its head. Behind it, the vault door."
    seconds: 5
  - id: evt:exit_x5
    preset: exit
    source: exit:x5
    title: Exit Golem Dungeon
    notes: "Out to X5 (installed): the original 'Exit Golem Dungeon?' (aaze0081:10) as the hint; the game's window asks 'Do you wish to leave Golem Dungeon?'."
  - id: evt:field_seen
    preset: text
    source: room:quarry_s
    trigger: step
    once: true
    text: "Below the rail, nine great stone blocks stand on the quarry floor, each beside an empty recess."
    seconds: 6
  - id: evt:forge_fire
    preset: text
    source: deco:forge_fire
    title: Forge
    text: "The forge's coals still glow, though no smith has worked them in an age."
  - id: evt:forge_lock_door
    preset: door
    source: door:forge_lock
    title: Door
    action: open
  - id: evt:forge_pot
    preset: text
    source: deco:forge_pot
    title: Golem forge
    text: An iron pot simmers on the coals. Here the golem-makers poured the iron limbs of their golems.
  - id: evt:great_lock
    preset: script
    source: mover:lid
    title: Great lock
    condition: {all: [{item: iron_key}, {map_var: bolt_n}, {map_var: bolt_e}, {map_var: bolt_s}, {not: {map_var: lid_open}}]}
    opens: [mover:lid]
    sets: {map_var: lid_open}
    effects:
      - message: "The Iron Key turns. All is set: the great lock slides aside, and a stair goes down into a cold light."
    else_effects:
      - lua: |-
          if not HasItem(12261) then
              evt.SimpleMessage('A lock as big as a door is set in the floor, held by three bolts. Its keyhole is cut for a great iron key.')
          else
              local n = 0
              if not IsAtLeast(MapVar(bolt_n), 1) then n = n + 1 end
              if not IsAtLeast(MapVar(bolt_e), 1) then n = n + 1 end
              if not IsAtLeast(MapVar(bolt_s), 1) then n = n + 1 end
              if n == 0 then evt.StatusText('The great lock lies open.', 4) else
              evt.SimpleMessage(tr('The Iron Key will not turn: {count} of the three bolts still hold the lock. Their levers are in this hall and in the rooms north and east.', {count = n})) end
          end
    notes: "set:iron: the Iron Key (forge chest) and the three drawn bolts open the great lock."
  - id: evt:hearth
    preset: text
    source: platform:hearth
    title: Forge
    text: "The forge's coals still glow, though no smith has worked them in an age."
  - id: evt:iron_door
    preset: script
    source: door:iron
    title: Home of the Iron
    condition: {not: {map_var: {name: rocks, at_least: 6}}}
    effects:
      - lua: |-
          local n = 0
          for i = 1, 6 do if IsAtLeast(MapVar(rocks), i) then n = i end end
          evt.SimpleMessage(tr('A plaque over the door reads: Home of the Iron. The door is shut fast. Six lamps are set in the stone above it; {count} of them burn.', {count = n}))
    else_effects:
      - text: "A plaque over the door reads: Home of the Iron"
  - id: evt:iron_open
    preset: script
    trigger: timer
    every: 1
    condition: {map_var: {name: rocks, at_least: 6}}
    opens: [door:iron]
    once: true
    effects:
      - text: "Six rocks glow. Far below, the Iron door grinds open."
    seconds: 6
    notes: "set:stone: six lamps open the Iron door."
  - id: evt:lamps_seen
    preset: text
    source: room:lamp_gallery
    trigger: step
    once: true
    text: "Through the window ahead: the Hall of the Plaque, and six lamps over the Iron door."
    seconds: 5
  - id: evt:lever_e
    preset: switch
    source: switch:lever_e
    title: Lever
    condition: {not: {map_var: bolt_e}}
    opens: [mover:bolt_e]
    sets: {map_var: bolt_e}
    effects:
      - text: "Iron grinds on iron: the east bolt draws back from the great lock."
    else_effects:
      - set:
          var:
            map_var: bolt_e
          value: 0
      - lua: "evt.SetDoorState(17, DoorAction.Close)"
      - text: "Iron grinds on iron: the east bolt shoots home into the great lock."
    seconds: 5
    notes: "Tumbler lever (east): two-way; the east bolt follows it."
