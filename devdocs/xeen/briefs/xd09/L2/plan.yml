format: 0
level: L2
pitch: 'Under Winterkill Tundra, behind a slab door in the Golem Rocks, the golem-makers'' house: a hall with a statue and
  a rhyme, and four homes round it. The Wood is a hollow trunk with four living boughs to cut; the Stone a quarry of nine
  blocks, six over glowing rocks that light the lamps over the Iron door; the Iron a forge, its key, and three tumblers that
  draw the bolts of a great lock in the floor; below it the Diamond Golem and its vault, where the last five King''s Megacredits
  wait, and a stair back up to the entry.'
purpose: 'Story step M10 (the last five King''s Megacredits for Newcastle''s keep) and the title Master of Golems (party award
  and 3,000 experience). Party 16 to 18 (MAPS section 0): 45 golems in groups of one or two (23 wood 18, 16 stone 26, 5 iron
  40) and the Diamond Golem 50; treasure level 3, the vault a level-4 hoard. Three material puzzles in order, two-state mechanisms
  only (D-4).'
mood: 'A workshop of stone that still works: lamplit block brick round the statue, the warm grain of the wood hall, the quarry''s
  dust and dripping water, the forge''s red coals, then the cold blue of the diamond level.'
