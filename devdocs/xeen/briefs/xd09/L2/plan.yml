diagram:
  file: diagram.txt
notes: 'Class M (MAPS: 20-45 sectors, 30-90 M units², 45-75 monsters, 3-7 chests, 6-16 doors). From the MU-6 graph devdocs/xeen/mockups/act2_graphs/xd09.graph.yml
  and decider D-4. Rooms added to the graph: the south gallery (the stair''s landing over the field), the lamp gallery (the
  window onto the lamps), two canopy walks, the vault stair. Original lines (aaze0081): the plaque rhyme (:0, m10.golem_plaque),
  Home of the Wood/Stone/Iron/Diamond (:2-5) over the four doors, ''Stone Block - Glowing Rock'' (:12), ''All is set ... Master
  of Golems I now dub thee.'' (:1) and ''King''s Megacredit!'' (:11) in m10.golem_vault, ''Exit Golem Dungeon?'' (:10) at
  the tundra door out to X5.'
set_pieces:
- id: set:wood
  kind: puzzle
  spaces:
  - room:hub
  - room:branch_ln
  - room:branch_ls
  - room:branch_hn
  - room:branch_hs
  rule: 'Each branch-end holds a living bough (a destructible block): cut by a click or broken by blows; each break says how
    many remain; with four cut, touching the statue opens the Stone door.'
- id: set:stone
  kind: puzzle
  spaces:
  - room:quarry
  rule: Nine two-state blocks, each sliding 256 east into its own recess when clicked and staying there; six bare a glowing
    rock and light one of six lamps over the Iron door (seen from the lamp gallery's window); six lamps open it.
- id: set:iron
  kind: puzzle
  spaces:
  - room:forge
  - room:tumbler_n
  - room:lock_hall
  - room:tumbler_e
  rule: Three two-way levers each draw or shoot one bolt of the great lock (seen from the lever); the Iron Key from the forge
    chest turns only with all three drawn, and the lid slides aside over the diamond stair.
- id: set:diamond
  kind: boss
  spaces:
  - room:diamond_hall
  rule: The Diamond Golem's death raises the vault door.
atmosphere: Torch-lit stone (MM6's torch01) in the hub, the wood and the iron; the forge's red hearth and the furnace's glow;
  dark lamps over the Iron door that light one by one; the quarry's glowing rocks; the diamond level cold and blue with no
  torches. Music 43; the forge's fire, drips in the quarry and the heartwood.
totals:
  spaces: 27
  monsters: 45.5
  chests: 4
  doors: 7
