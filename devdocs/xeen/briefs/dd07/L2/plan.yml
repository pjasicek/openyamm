format: 0
level: L2
pitch: 'The Great Eastern Tower: four floors of galleries round an open well that rises from the ground floor to the slate
  cone, the mages floating across it. One stair winds up the west side; from the top a floating disc rides the well back down.
  On the third floor the mages'' vault hides behind a door of light fed by two crystal pylons; on the top floor the Archmagus''s
  study and laboratory.'
purpose: 'Q-D18 The Jewel of Ages (the vault: the jewel and two Energy Disks; Ellinger''s letter in the study, the Archmage
  promotion through Nasir), Q-D20''s Golden Griffin, L4''s fountain (+1 all) and book (+2 Intellect). 30 monsters at 28-45
  (Floating Adepts, Floating Magi, Mystic Mages, Floating Eyes), treasure 4.'
mood: Cool green-grey stone and grey cobbles, pale light falling down the well, the hum of the pylons; warm brown stone and
  wood in the mages' own rooms at the top.
