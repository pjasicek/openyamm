notes: 'Class M by size with D-9.3''s 30 monsters (D-39 Q2; MAPS: 20-45 sectors, 30-90 M units², 3-7 chests, 6-16 doors).
  From the MU-6 graph devdocs/xeen/mockups/act4_graphs/dd07.graph.yml and D-39 (the floating-mage tiers, the fountain +1 all
  and the book +2 Intellect once per character, the Book of Great Power''s final refusal, the door of light fed by two destructible
  pylons, the dead mirror, MM7 7d14 for the laboratory and the study, the interior larger than the shell). The graph''s three
  stair landings are the landing halls, its spiral stair three two-storey stair halls, its disc landing an opening in the
  top gallery''s rail. The roof stair (D-58, L4 only) up to D7''s entrance:dd07_roof.'
