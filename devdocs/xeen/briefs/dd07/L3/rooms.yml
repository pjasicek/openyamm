  floor: *id006
  ceiling: *id002
  reveal: *id001
  door: *id003
  notes: 'The levitation well: the ashlar from the foot to the cone, a marble band (gstntileh) at each floor''s slab, the
    flags at its foot, the cone''s panels.'
- id: theme:lab
