notes: 'DD-07 Eastern Tower at L4: four floors 640 apart round the levitation well (an octagon open from the ground floor
  to the slate cone), each with its gallery (a U round the well''s north, east and south) and its landing hall west of the
  well; three two-storey stair halls west of the landings, alternating south, north, south. L1: the door hall (the D3 door),
  the commons, the store room. L2: the cabinet of curiosities, the dormitory, the mirror room. L3: the conjury and the scrying
  room (the two ward pylons), the vault behind its door of light, the disk alcoves. L4: the laboratory and the study (MM7
  7d14). x east, y north. Written by output/studio_cal/dd07/tools/gen.py.'
