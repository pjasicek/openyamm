events:
  - id: evt:sprites_slain
    trigger: timer
    every: 5
    condition: {kills: {group: 6}}
    effects:
      - lua: "XeenQuests.hook(\"q-d10.sprites_slain\")"
    once: true
    notes: "q-d10.sprites_slain: every village sprite dead."
  - id: evt:west_fort_burned
    trigger: load
    condition: {qbit: west_fort_burned}
    effects:
      - hide: [thing:west_palisade, thing:west_blockhouse, thing:west_banner]
      - show: [thing:west_ruin, thing:west_char_1, thing:west_char_2, thing:west_char_3, thing:west_char_4, thing:west_char_5, thing:west_char_6, thing:west_char_7, thing:west_char_8]
    notes: "q-d11.west_fort_burned: the west fort outside as a charred ruin (D-23); its gate stays."
  - id: evt:west_fort_ignite
    trigger: load
    condition: {qbit: west_fort_burned}
    effects:
      - lua: "if evt.GetMapVar(\"west_fort_fire_heard\", 0) == 0 then evt.SetMapVar(\"west_fort_fire_heard\", 1) evt.PlaySoundName(\"xeen_fire_ignite\", 4096, 15565, 2000) end"
    notes: "AU (2026-11-20): xeen_fire_ignite at the west fort once after it burns (map variable west_fort_fire_heard)."
  - id: evt:east_fort_burned
    trigger: load
    condition: {qbit: east_fort_burned}
    effects:
      - hide: [thing:east_palisade, thing:east_blockhouse, thing:east_banner]
      - show: [thing:east_ruin, thing:east_char_1, thing:east_char_2, thing:east_char_3, thing:east_char_4, thing:east_char_5, thing:east_char_6, thing:east_char_7, thing:east_char_8]
    notes: "q-d11.east_fort_burned: the east fort outside as a charred ruin (D-23); its gate stays."
  - id: evt:east_fort_ignite
    trigger: load
    condition: {qbit: east_fort_burned}
    effects:
      - lua: "if evt.GetMapVar(\"east_fort_fire_heard\", 0) == 0 then evt.SetMapVar(\"east_fort_fire_heard\", 1) evt.PlaySoundName(\"xeen_fire_ignite\", 11776, 9933, 2150) end"
    notes: "AU (2026-11-20): xeen_fire_ignite at the east fort once after it burns (map variable east_fort_fire_heard)."
  - id: evt:rim_fall
    trigger: timer
    every: 1
    lua: "Xeen.rimFall({{{-32768, -20992}, {32768, -20992}, {32768, -32768}, {-32768, -32768}}}, {{-18944, -18944, 992, 512}, {-15360, -18944, 960, 512}, {-9216, -18944, 1024, 512}, {-6144, -18944, 1024, 512}, {-3072, -18944, 896, 512}, {0, -18944, 960, 512}, {3072, -18944, 992, 512}, {6144, -18944, 1088, 512}, {9216, -18944, 992, 512}, {12288, -18944, 992, 512}, {15360, -18944, 1056, 512}, {18944, -18944, 1056, 512}})"
    notes: "F29 (P2 pins p7, p12; 2026-11-23): a party in the sea below the world rim, or in the rim's foot below Xeen.RimFallDepth, is lifted back onto the rim at the nearest return point and falls the last Xeen.SkyFallHeight (common/wild.py, xeen_common.lua Xeen.rimFall). Return points (cells): [27, 101], [34, 101], [46, 101], [52, 101], [58, 101], [64, 101], [70, 101], [76, 101], [82, 101], [88, 101], [94, 101], [101, 101]."
