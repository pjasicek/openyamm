  - {id: view:arrival, from: entrance:west_road, to: [landmark:great_tree, landmark:range], what: "Arrival from D1: the road into the forest's edge, glowing caps under the first trees, the great tree's crown over the canopy south-east, the range north."}
  - {id: view:pass, from: link:caravan_west, to: [landmark:west_fort, landmark:east_fort, landmark:range], what: "The signature view: the caravan road climbing into Ogre Pass, the west fort on its knoll left, Graalg's smoke in the saddle, the east fort beyond, the crystal-veined range behind."}
  - {id: view:village, from: junction:bark_glade, to: [landmark:great_tree], what: "Review view: the great tree's trunk and the village lane."}
set_pieces:
  - id: set:sprite_village
    kind: scripted
    spaces: [town:sprite_village]
    rule: "The village's sprites are peaceful; on q-d10.robbery they turn hostile; when all are dead the map sets q-d10.sprites_slain, which opens the treehouse chest's robbery branch."
    states: [peaceful, hostile, slain]
  - id: set:ogre_pass
    kind: scripted
    spaces: [zone:ogre_pass]
    rule: "The pass ogres are hostile until q-d11.friends; q-d11.hostile, west_burned or east_burned turn them and Graalg hostile (D-12.3). A burned fort shows as a charred ruin outside."
    states: [hostile, friends, war]
