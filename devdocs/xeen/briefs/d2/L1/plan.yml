    condition: {all: [{qbit: ogres_friends}, {not: {qbit: ogres_hostile}}]}
    notes: "q-d11.pass_ogres: the pass ogres are peaceful (A2's relations.yml)."
  - id: state:west_fort_burned
    condition: {qbit: west_fort_burned}
    notes: "The west fort's outside as a charred ruin (a model swap, if the build can; else unchanged)."
  - id: state:east_fort_burned
    condition: {qbit: east_fort_burned}
