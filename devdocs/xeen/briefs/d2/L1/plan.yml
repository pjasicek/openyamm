format: 0
level: L1
pitch: "The south-centre of Darkside, between Castleview's vale and Sandcaster's desert edge. North the Gemstone Range walls the map, its crags veined with glowing crystal; its foothills hold the Gemstone Mines' east adit. A spur of the range runs south across the middle, and the caravan road crosses it at Ogre Pass, between Graalg's two timber forts. South of the road the Sprite Forest fills the land to the world's rim: dark old trees, glowing mushrooms, and at its heart the great tree of the Temple of Bark rising high over the canopy. Sharla's sprites keep a treehouse village beside it; trolls dig their holes in the forest floor to the south-east; the Glimmerbrook runs down through the forest and falls off the edge of the world into the stars. East of the spur, the Southern Tower stands alone in darker woods."
purpose: "Act III's second Darkside region (party 21-25), a town map without a human town. Its quests: Nibbler's key (Q-D9) to the Temple of Bark (DD-09) and Sharla's princess inside (Q-D10); Graalg's ogres in the pass, peace or fire (Q-D11, DD-13); Hobstadt's troll holes (Q-D13, DD-11A-C); the Southern Tower (Q-D19, DD-06, opened later with Thaddeus's key from D3); the Gemstone Mines' east pocket (DD-10B, Q-D7); the second Darkside obelisk."
mood: "Amber light through dark leaves; a small pale sun low over the range. The forest is old and still, lit from below by glowing caps; the pass is wind, smoke and ogre noise; the rim at the forest's foot opens on the stars."
datum: water:rim_sea
spaces:
  # ---- the west: where D1's road comes in ----
  - id: zone:west_edge
    name: The forest's edge
    kind: zone
    floor: 1000
    where: "west, the Castleview road's last stretch from the D1 border to the Forest Fork"
    purpose: "Where the party comes in from D1: open woodland of tall dark trees thinning to the road, the first glowing caps under them, the great tree's crown in view south-east, the foothills and the range north."
    safe: true
    keep_clear: [spawns]
  - id: junction:forest_fork
    name: Forest Fork
    kind: junction
    signpost: true
    purpose: "East: the caravan road over Ogre Pass to Sandcaster. South-east: the track into the Sprite Forest."
  # ---- the north: the range and its foothills ----
  - id: zone:range
    name: The Gemstone Range
    kind: wild
    floor: [2400, 4400]
    relief: uneven
    purpose: "The wall along the north edge (beyond it D5's desert): grey slate crags with veins and clusters of glowing violet and teal crystal. Not walkable above its foot."
    empty: true
  - id: zone:foothills
    name: The Gemstone foothills
    kind: wild
    floor: [1200, 2000]
    relief: uneven
    density: sparse
    purpose: "Stony slopes under the range with scattered firs and crystal outcrops: wolves and sabertooths, the Gemstone Mines' east adit, a crystal seam to chip."
    population:
      - {id: pop:foothill_wolves, slot: 1, groups: 12, per_marker: [2, 3], levels: [16, 28], notes: "Encounter area E1: Dark Wolves 16 and Sabertooths 22, Snow Beasts 28 only on the upper slopes."}
  - id: zone:mine_mouth
    name: The east adit
    kind: zone
    part_of: zone:foothills
    floor: 1700
    purpose: "The Gemstone Mines' east entrance (DD-10B): a timbered adit in a rock face, spoil heaps and a broken ore cart."
    safe: true
    keep_clear: [spawns]
  # ---- Ogre Pass ----
  - id: zone:ogre_pass
    name: Ogre Pass
    kind: wild
    floor: [1500, 2100]
    relief: slope
    purpose: "The caravan road's climb over the Gemstone Spur: the west fort on its knoll north of the road at the west mouth, Graalg's parley fire in the saddle, the east fort on its knoll south of the road beyond. Kramer's caravans are robbed here (Q-D11)."
    population:
      - {id: pop:pass_ogres, actor: Xeen Ogre, groups: 4, placed: true, hostile: true, notes: "E4: 22 placed (Ogres 18, Brutes 22, two Chiefs 30) in the two fort yards and two road pairs; hostile at load, peaceful once q-d11.friends (A2's relations.yml), hostile again on q-d11.hostile or a fort burned (D-12.3)."}
      - {id: pop:graalg, actor: Xeen Ogre, groups: 1, placed: true, hostile: false, notes: "Graalg (talking actor 5108; row 11064 when he fights) and two Brute guards at the parley fire: peaceful until q-d11.hostile."}
  - id: zone:pass_saddle
    name: Graalg's saddle
    kind: zone
    part_of: zone:ogre_pass
    floor: 2050
    purpose: "The top of the pass: a ring of stones round a fire, Graalg's log seat, bones, the signpost."
    safe: true
    keep_clear: [spawns]
  - id: zone:spur_crags
    name: The Gemstone Spur
    kind: wild
    floor: [1600, 2800]
    relief: uneven
    purpose: "The spur's broken south end between the pass and the forest: cliffs and crags the forest track skirts at their foot. It splits the map into the forest west and the Southern Woods east."
    empty: true
  - id: zone:east_descent
    name: The east descent
    kind: wild
    floor: [1250, 1900]
    relief: slope
    density: sparse
    purpose: "The caravan road down from the pass to the D3 border; a goat track up to the genie's ledge."
  - id: zone:east_meadow
    name: The Sandcaster road's end
    kind: zone
    part_of: zone:east_descent
    floor: 1300
    purpose: "Where the party comes in from D3: open hillside, the pass and its east fort ahead and above, the Southern Woods below to the south."
    safe: true
    keep_clear: [spawns]
  # ---- the Sprite Forest ----
  - id: zone:sprite_forest
    name: The Sprite Forest
    kind: wild
    floor: [880, 1150]
    relief: uneven
    density: dense
    purpose: "Old dark broadleaf forest from the road to the rim, glowing mushrooms in rings and along the brook: the great tree, the sprites' village, the troll holes, the Forbidden Fruit hut, the obelisk at its north edge."
  - id: zone:west_glades
    name: The western glades
    kind: zone
    part_of: zone:sprite_forest
    floor: 1000
    purpose: "Mushroom glades south of the arrival: wild sprites, the first fight from D1."
    population:
      - {id: pop:west_sprites, slot: 3, groups: 4, per_marker: [2, 3], levels: [10, 14], notes: "Encounter area E2 (west): Medusa and Killer Sprites, wild (not Sharla's)."}
  - id: zone:whispering_glades
    name: The Whispering Glades
    kind: zone
    floor: [1100, 1500]
    relief: uneven
    density: medium
    purpose: "Glades and mushroom rings between the caravan road and the forest track, under the spur: wild sprites."
    population:
      - {id: pop:glade_sprites, slot: 3, groups: 6, per_marker: [2, 3], levels: [10, 18], notes: "Encounter area E2 (east): Medusa and Killer Sprites, a Sprite Queen 18."}
  - id: zone:bark_glade
    name: The glade of the great tree
    kind: zone
    part_of: zone:sprite_forest
    floor: 1000
    purpose: "The open ground round the great tree's roots: the temple door in the trunk (DD-09), Nibbler's hollow under a root, the signpost where the village lane leaves."
    safe: true
    keep_clear: [spawns]
    buildings:
      - {id: building:nibbler_hollow, type: house, service: residence, count: 1, doors: 1, footprint_cells: [[1, 1]]}
  - id: town:sprite_village
    name: Sharla's treehouse village
    kind: town
    floor: 980
    where: "a glade south-west of the great tree, 5 doors round a mossy green"
    purpose: "The sprites' village (A4's d2.yml, 4551-4555): Dewdrop Potions, the Light Guild of the Treetops, Sharla's Treehouse and two bowers. Each house is a giant hollow trunk with its door at the foot; platforms, stairs and rope walkways above. Peaceful sprites until q-d10.robbery."
    safe: true
    keep_clear: [spawns]
    density: medium
    theme: "Giant hollow trunks (bark, moss, round doors with lanterns), platforms of grey timber, rope walkways, glowing caps; no kit house forms. See the open question on how the build makes them."
    buildings:
      - {id: building:sharla_tree, type: house, service: "Sharla's Treehouse", count: 1, doors: 1, footprint_cells: [[3, 3]]}
      - {id: building:sprite_guild_light, type: house, service: Light Guild of the Treetops, count: 1, doors: 1, footprint_cells: [[2, 2]]}
      - {id: building:sprite_potions, type: house, service: Dewdrop Potions, count: 1, doors: 1, footprint_cells: [[2, 2]]}
      - {id: building:sprite_houses, type: house, service: residence, count: 2, doors: 1, footprint_cells: [[2, 2], [2, 2]]}
    population:
      - {id: pop:village_sprites, actor: Xeen Sprite, groups: 2, placed: true, hostile: false, notes: "8 village sprites (Medusa 10, Killer 14) on the green and the platforms: peaceful; hostile on q-d10.robbery; all dead sets q-d10.sprites_slain."}
  - id: zone:village_green
    name: The village green
    kind: zone
    part_of: town:sprite_village
    floor: 980
    purpose: "Moss and a ring of glowing caps between the five trunks; the lane from the great tree ends here."
    empty: true
    safe: true
  - id: zone:troll_country
    name: Troll country
    kind: wild
    part_of: zone:sprite_forest
    floor: [880, 1100]
    relief: uneven
    density: dense
    purpose: "The forest's south-east, darker and torn up: three troll holes (DD-11A-C), dug earth, gnawed bones, the Forbidden Fruit hut's clearing."
    population:
      - {id: pop:trolls, slot: 2, groups: 12, per_marker: [2, 3], levels: [18, 38], notes: "Encounter area E3: Trolls 18 by the holes and lanes, Troll Guards 28 deeper, Ice Trolls 38 only by the third hole."}
  - id: zone:fruit_clearing
    name: The Forbidden Fruit clearing
    kind: zone
    part_of: zone:troll_country
    floor: 950
    purpose: "A clearing with a tumbledown hut and a basket labelled Forbidden Fruit."
    safe: true
    keep_clear: [spawns]
  - id: zone:brink
    name: The Brink
    kind: zone
    part_of: zone:sprite_forest
    floor: 920
    purpose: "Where the forest ends at the rim: a sprites' lookout bench by the Glimmerbrook's fall over the edge; the stars below."
    safe: true
    keep_clear: [spawns]
  # ---- the east: the Southern Woods ----
  - id: zone:southern_woods
    name: The Southern Woods
    kind: wild
    floor: [950, 1400]
    relief: uneven
    density: dense
    purpose: "Darker, older woods east of the spur, south of the pass: wolves and sabertooths, the Southern Tower in its clearing, the Shrine of the Elements, the Leprechaun's hidden pot by the rim."
    population:
      - {id: pop:woods_wolves, slot: 1, groups: 12, per_marker: [2, 3], levels: [16, 22], notes: "Encounter area E5: Dark Wolves 16 and Sabertooths 22 (no Snow Beasts); the first fight from D3."}
  - id: zone:tower_clearing
    name: The Southern Tower's clearing
    kind: zone
    part_of: zone:southern_woods
    floor: 1050
    purpose: "The Southern Tower (DD-06): a lone Mok tower of slate-blue stone with a slate cone, NO THIEVES on its brass plate; a thieves' drop under a stump nearby."
    safe: true
    keep_clear: [spawns]
  - id: zone:shrine_glade
    name: The Shrine of the Elements
    kind: zone
    part_of: zone:southern_woods
    floor: 1000
    purpose: "Four standing stones round an altar, one per element, near the rim."
    safe: true
    keep_clear: [spawns]
  - id: junction:bark_glade
    name: Bark Glade
    kind: junction
    signpost: true
    purpose: "South-west: the treehouse village. South: the great tree. East: the forest track to the Southern Woods."
  - id: junction:south_fork
    name: South Fork
    kind: junction
    signpost: true
    purpose: "North: up to the caravan road east of the pass. South: the Southern Tower. West: the forest track under the spur."
  - id: junction:pass_saddle
    name: Pass saddle
    kind: junction
    signpost: true
    part_of: zone:pass_saddle
    purpose: "Top of Ogre Pass: west to Castleview, east to Sandcaster."
  # ---- water and the rim ----
  - id: water:brook
    name: The Glimmerbrook
    kind: water
    purpose: "Rises under the range, crosses the caravan road (a log bridge) and the forest track (a footbridge), runs past the great tree and falls off the rim into the stars (Sprite Falls)."
  - id: zone:rim
    name: The world rim
    kind: wild
    floor: 0
    purpose: "South, the land ends in a cliff; below, the stars (water at 0 stands for them)."
    empty: true
  - id: water:rim_sea
    name: Below the rim
    kind: water
    purpose: "The stars below the world's edge (water at 0, as X1 and X5)."
  - id: edge:west_end
    name: West edge
    kind: road
    part_of: zone:west_edge
    purpose: Where the Castleview road leaves for D1.
  - id: edge:east_end
    name: East edge
    kind: road
    part_of: zone:east_descent
    purpose: Where the caravan road leaves for D3.
links:
