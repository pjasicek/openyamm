  - {id: link:caravan_west, from: junction:forest_fork, to: junction:pass_saddle, kind: road, rise: 1100, crosses: [water:brook], features: [a log bridge over the Glimmerbrook at (51, 48)], purpose: "the caravan road up to Ogre Pass, past the west fort"}
  - {id: link:caravan_east, from: junction:pass_saddle, to: edge:east_end, kind: road, purpose: "travel: D3, past the east fort"}
