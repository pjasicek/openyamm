  - {id: band:rim_sea, range: [0, 0], spaces: [zone:rim, water:rim_sea]}
  - {id: band:low, range: [880, 1150], spaces: [zone:sprite_forest, zone:west_edge, town:sprite_village, zone:troll_country, zone:brink], partly: [zone:southern_woods]}
  - {id: band:mid, range: [1100, 2300], spaces: [zone:whispering_glades, zone:east_descent, zone:foothills], partly: [zone:southern_woods], notes: "The foothills rise to about 2,000 at the range's foot; the genie's ledge 2,300."}
  - {id: band:high, range: [1500, 3200], spaces: [zone:ogre_pass, zone:spur_crags], notes: "The pass road 1,600-2,050, the forts' knolls 2,000-2,150, the spur's crest 2,800-3,100 on both sides of the saddle."}
  - {id: band:peaks, range: [2400, 4400], spaces: [zone:range]}
