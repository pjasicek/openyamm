  - {id: link:glade_track, from: junction:bark_glade, to: junction:south_fork, kind: path, crosses: [water:brook], features: [a footbridge at (48, 70)], notes: "under the spur's crags; the forest's way round the pass"}
  - {id: link:south_climb, from: junction:south_fork, to: link:caravan_east, kind: path, rise: 300, notes: "joins the caravan road below the east fort: the loop"}
