  - {id: link:tower_lane, from: junction:south_fork, to: zone:tower_clearing, kind: path}
  - {id: link:shrine_path, from: link:tower_lane, to: zone:shrine_glade, kind: path}
  - {id: link:mine_lane, from: link:caravan_west, to: zone:mine_mouth, kind: path, rise: 500}
  - {id: link:fruit_lane, from: link:glade_track, to: zone:fruit_clearing, kind: path}
  - {id: link:brink_path, from: zone:fruit_clearing, to: zone:brink, kind: path}
entrances:
