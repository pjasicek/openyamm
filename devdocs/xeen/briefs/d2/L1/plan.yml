  - {id: entrance:east_road, space: zone:east_meadow, kind: both, neighbour: edge:east, facing: w, how: "The caravan road from Sandcaster, the pass above to the west."}
  - {id: entrance:dd09_door, space: zone:bark_glade, kind: both, neighbour: door:dd09, facing: n, condition: {item: bark_key}, how: "A round door of bark-grown planks in the great tree's trunk (q-d9.bark_door): 'Enter the Ancient Temple of Bark?'; locked: 'A door in the trunk of the great tree, locked. Nibbler sits nearby, looking innocent and hungry.'"}
  - {id: entrance:dd11a_hole, space: zone:troll_country, kind: both, neighbour: door:dd11a, how: "A pit in the forest floor, earth and roots round its lip (q-d13.troll_holes: 'Troll Hole. Descend?')."}
  - {id: entrance:dd11b_hole, space: zone:troll_country, kind: both, neighbour: door:dd11b, how: "The second pit, by a dead adventurer's pack."}
  - {id: entrance:dd11c_hole, space: zone:troll_country, kind: both, neighbour: door:dd11c, how: "The third and widest pit, near the rim; Hobstadt's hall below."}
  - {id: entrance:dd13_west, space: zone:ogre_pass, kind: both, neighbour: door:dd13_west, facing: s, how: "The west fort's gate in its log palisade, facing the road."}
  - {id: entrance:dd13_east, space: zone:ogre_pass, kind: both, neighbour: door:dd13_east, facing: n, how: "The east fort's gate, facing the road."}
  - {id: entrance:dd06_door, space: zone:tower_clearing, kind: both, neighbour: door:dd06, facing: n, condition: {item: south_tower_key}, how: "The Southern Tower's iron-bound door (q-d19.tower_door); locked: 'Locked. A brass plate reads NO THIEVES. Under it, scratched: ha.'"}
  - {id: entrance:dd10b_adit, space: zone:mine_mouth, kind: both, neighbour: door:dd10b, facing: s, how: "A timbered adit in the foothill rock; ore cart, spoil."}
critical_path: [edge:west_end, junction:forest_fork, junction:bark_glade, zone:village_green]
goals:
  - {id: goal:nibbler, space: zone:bark_glade, kind: use, what: "Bring Nibbler three Monga melons (from D1) for the key to the Temple of Bark (Q-D9).", story: Q-D9}
  - {id: goal:temple, space: zone:bark_glade, kind: reach, what: "Enter the Temple of Bark and free Sheewana (Q-D10).", story: Q-D10}
  - {id: goal:graalg, space: zone:pass_saddle, kind: use, what: "Make peace with Graalg, or burn both forts (Q-D11).", story: Q-D11}
  - {id: goal:troll_holes, space: zone:troll_country, kind: reach, what: "Descend the troll holes to Hobstadt (Q-D13).", story: Q-D13}
  - {id: goal:obelisk, space: zone:sprite_forest, kind: use, what: "Read the second Darkside word (obelisks.d2).", story: obelisks}
points_of_interest:
  - {id: poi:obelisk, space: zone:foothills, kind: obelisk, rule: "native:obelisk", behaviour: "obelisks.d2: 'Carved into the obelisk, the second of six words: BENEATH.' (autonote dark_2)", notes: "On the first foothill knoll north of the caravan road, the great tree in view south."}
  - {id: poi:shrine_elements, space: zone:shrine_glade, kind: shrine, behaviour: "Shrine of the Elements: +5 Fire, Air, Water and Earth resistance, permanent, once per character (D-4's +5 rule; the source's +50 rescaled).", uses: {times: 1, per: character, reset: never}}
  - {id: poi:forbidden_fruit, space: zone:fruit_clearing, kind: device, behaviour: "The Forbidden Fruit hut: a basket of fruit; each member may eat one: +2 to one permanent stat and a condition (the coconut of confusion, the plum of unconsciousness ...), once per character.", uses: {times: 1, per: character, reset: never}}
  - {id: poi:genie_lamp, space: zone:east_descent, kind: device, reached_by: off_road, behaviour: "A genie's lamp on a crag ledge above the east descent (Q-D27): rub it for a wish choice; greed is punished."}
  - {id: poi:pot_of_gold, space: zone:southern_woods, kind: chest, reached_by: secret, behaviour: "The Leprechaun's pot of gold, hidden in a ring of rocks on the brink at the woods' south-east corner: found only by searching (Perception)."}
  - {id: poi:graalg, space: zone:pass_saddle, kind: npc, behaviour: "Graalg (5108) at his parley fire with two Brutes (Q-D11)."}
  - {id: poi:treehouse_chest, space: town:sprite_village, kind: chest, behaviour: "q-d10.treehouse: the chest on Sharla's platform. 'A sprite's chest, with a sprite sitting on it.'; after the robbery 'In this treehouse there once lived many sprites, but someone murdered the lot of them. You find two energy disks.'"}
  - {id: poi:kramer_wagon, space: zone:ogre_pass, kind: chest, behaviour: "One of Kramer's caravan wagons, overturned and half burned below the west fort: a strongbox the ogres missed."}
  - {id: poi:crystal_seam, space: zone:foothills, kind: device, behaviour: "A seam of glowing crystal in the rock: chip out a few gems once (Might check)."}
  - {id: poi:fairy_ring, space: zone:sprite_forest, kind: pool, behaviour: "A ring of tall glowing mushrooms in the west woods: step inside to be healed and cured of poison, once a day.", uses: {times: 1, per: party, reset: daily}}
  - {id: poi:dead_adventurer, space: zone:troll_country, kind: chest, behaviour: "A dead adventurer's pack at the second troll hole's lip: what the trolls left."}
  - {id: poi:thieves_drop, space: zone:tower_clearing, kind: chest, behaviour: "Under a hollow stump by the tower: a thieves' drop, a few coins and a scrap of a note."}
  - {id: poi:brink_bench, space: zone:brink, kind: ruin, behaviour: "The sprites' lookout bench on the rim beside the falls: a view down into the stars."}
  - {id: poi:signposts, spaces: [junction:forest_fork, junction:bark_glade, junction:south_fork, junction:pass_saddle], kind: signpost, count: 4, behaviour: "Signposts at the forks."}
landmarks:
  - {id: landmark:great_tree, space: zone:bark_glade, what: "The great tree of Bark: a trunk 1,500 across, its crown about 3,500 above the forest floor, glowing fungus shelves up its bark", seen_from: [zone:west_edge, zone:ogre_pass, town:sprite_village, zone:foothills, zone:whispering_glades]}
  - {id: landmark:range, space: zone:range, what: "The Gemstone Range: slate crags to 4,400 with glowing crystal veins", seen_from: [zone:west_edge, zone:sprite_forest, zone:ogre_pass, zone:southern_woods]}
  - {id: landmark:west_fort, space: zone:ogre_pass, what: "The west fort: a log palisade and a blockhouse on a knoll, smoke and banners of hide", seen_from: [zone:west_edge, zone:whispering_glades, zone:foothills]}
  - {id: landmark:east_fort, space: zone:ogre_pass, what: "The east fort on its knoll beyond the saddle", seen_from: [zone:east_meadow, zone:ogre_pass]}
  - {id: landmark:southern_tower, space: zone:tower_clearing, what: "The Southern Tower: slate-blue stone, a slate cone, above the woods", seen_from: [zone:east_meadow, zone:ogre_pass, zone:southern_woods]}
  - {id: landmark:sprite_falls, space: zone:brink, what: "The Glimmerbrook falling off the rim into the stars", seen_from: [zone:troll_country, zone:brink]}
