format: 0
start:
  room: room:gate_hall
  at: [0, -1280]
  facing: n
  notes: "entrance:x7_gate: 256 inside the tower's gate, facing north into the tower."
arrivals:
  - {entrance: entrance:x7_gate, room: room:gate_hall, at: [0, -1280], facing: n, notes: "X7's Dragon Tower gate (door:fd04, A5): 256 inside the gate, facing north (512). Quiet: Alister is peaceful, the scorched hall's Acid pair round a turn and more than 1,024 from its low opening."}
  - {entrance: entrance:x9_clouds, room: room:roof_stair, at: [-1312, 608], floor_height: 4224, facing: s, notes: "X9's way down from the Dragon Clouds (A5): on the roof stair's head under the hatch (z 4,224), facing down the stair (south). Quiet: the crown's door is shut."}
