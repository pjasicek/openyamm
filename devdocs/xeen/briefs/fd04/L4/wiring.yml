    source: chest:crypt
    title: Chest
  - id: evt:chest_dorm
    preset: chest
    source: chest:dorm
    title: Chest
  - id: evt:chest_gongs
    preset: chest
    source: chest:gongs
    title: Chest
    effects:
      - lua: "if not IsQBitSet(QBit(118144)) and (IsAtLeast(MapVar(gong1), 1) or IsAtLeast(MapVar(gong2), 1) or IsAtLeast(MapVar(gong3), 1) or IsAtLeast(MapVar(gong4), 1)) then SetValue(MapVar(gong1), 0); SetValue(MapVar(gong2), 0); SetValue(MapVar(gong3), 0); SetValue(MapVar(gong4), 0); SetValue(MapVar(reset_pending), 1) end"
    notes: "The source's 'Touch any treasure and you'll have to start over!' (aazex123:3): opened before the shutter is up with any gong rung, it clears the four gongs; evt:gongs_reset puts their lamps out."
