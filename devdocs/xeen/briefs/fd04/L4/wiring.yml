  - id: evt:hatch
    preset: script
    source: exit:hatch
    title: Climb onto the Dragon Clouds
    lua: "evt.MoveToMap(20352, 17280, 2048, 512, 0, 0, 0, 1, \"xeen_x9.blv\")"
    notes: "F16 (2026-11-22): the game's standard entrance window (OK/Close) in place of the map's old Yes/No. Was: Up onto X9 (A5's BLV, installed with entrance:fd04_roof, 03:49): the map's own Yes/No 'Climb up through the hatch?' (D-66: a roof or hatch exit into a BLV asks, as DD-15 and DD-08 do; no hook, so no text before it, D-65), then on Yes at once to entrance:fd04_roof [20352, 17280, 2048] facing north (D-57 Q36; the coordinates are X9's named arrival, written out because the move waits on the answer)."
  - id: evt:lever
    preset: switch
    source: switch:lever
    title: Lever
    condition: {all: [{all: [{map_var: gong1}, {map_var: gong2}, {map_var: gong3}, {map_var: gong4}]}, {not: {qbit: shutter_up}}]}
    opens: [door:shutter]
    effects:
      - qbit: shutter_up
      - lua: "evt.PlaySoundName(\"6stone door0101\", 0, 9984, -2360)"
      - text: "The lever moves. Somewhere in the wall chains run, and the iron shutter rises."
    else_effects:
      - lua: "if IsQBitSet(QBit(118144)) then evt.StatusText(\"The lever is down.\") else evt.SimpleMessage(\"The lever won't budge.\\nA voice booms: Ring the four gongs and then pull the lever. Touch any treasure and you'll have to start over!\") end"
    notes: "aazex123:1-3: before the four gongs 'The lever won't budge.' and the voice (one window); after them it raises the shutter for good (118144, D-43 one-way)."
