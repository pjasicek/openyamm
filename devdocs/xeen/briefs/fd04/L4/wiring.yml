    title: 13 Across
    condition: {not: {qbit: word_13a}}
    effects:
      - lua: "XeenQuests.hook(\"q-f2.clue_13a\")"
      - set_texture:
          of: plate:cw_13a_10
          to: xfword
      - set_texture:
          of: plate:cw_x_13a_44d
          to: xfword
      - set_texture:
          of: plate:cw_13a_12
          to: xfword
      - lights_on: light:word_13a
      - lua: "evt.PlaySoundName(\"xeen_mirror_touch\", 0, 2176, -900)"
    else_effects:
      - text: "13 Across: Freed from spaceship. Corak."
    notes: "aazex121:11-188's 13 Across (A3's q-f2.clue_13a; 'Correct!' / 'Wrong!', aazex121:7-8): the word (CORAK) lights across the floor (118134)."
