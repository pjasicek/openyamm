format: 0
variables: [alister_hidden, gong1, gong2, gong3, gong4, reset_pending]
events:
  - id: evt:alister_gone
    preset: script
    trigger: timer
    every: 1
    condition: {all: [{qbit: alister_gone}, {not: {map_var: alister_hidden}}]}
    effects:
      - hide_actors: 60
      - set:
          var:
            map_var: alister_hidden
          value: 1
      - show: deco:lizard
    notes: "The paying talk sets 118147 (A3's q-f1 topic 'Dragon egg'); the second after it closes he is hidden and the lizard shown in the same visit (D-57 Q27)."
  - id: evt:alister_gone_load
    preset: script
    trigger: load
    condition: {qbit: alister_gone}
    effects:
      - hide_actors: 60
      - set:
          var:
            map_var: alister_hidden
          value: 1
      - show: deco:lizard
    notes: Gone on every load with 118147.
  - id: evt:alister_load
    preset: script
    trigger: load
    lua: "evt.SetMm9ActorCanReceiveDamage(ActorIndex(\"monster:alister\"), false)"
    notes: "Alister cannot be killed: every hit on him is zeroed, on every load (D-52's word)."
  - id: evt:arrive
    preset: text
    trigger: timer
    every: 1
    once: true
    text: "The Dragon Tower: warm black stone, and somewhere far above, something very large breathing."
    seconds: 6
    notes: "The arrival line (a new map line, no source text): the tower and its dragons."
  - id: evt:bed_1
    preset: text
    source: platform:bed_1
    title: Bed
    text: Nothing here.
    notes: aazex118:0-1.
  - id: evt:bed_2
    preset: text
    source: platform:bed_2
    title: Bed
    text: Nothing here.
    notes: aazex118:0-1.
  - id: evt:bed_3
