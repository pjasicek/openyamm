# Alister (D-57 Q27; written by output/studio_cal/fd04/tools/gen_tests.py): peaceful and unkillable (struck
# twenty times, still alive and peaceful); his first talk starts Q-F1; the nest's egg (q-f1.egg, 118146, once);
# his paying talk takes it; the second after the talk closes he is hidden (118147) and the lizard he became
# shown (S's xeen_lizard, hidden till then) in the same visit; a reload keeps him gone, the lizard and two eggs.
id: xeen.fd04.l4.alister
title: 'Dragon Tower (FD-04 L4): Alister, the egg and his vanish'
world: xeen
mode: faithful
steps:
