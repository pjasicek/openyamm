    source: close(); wait(0.5); if not has_item(12375) then error('no Dragon Egg') end; if not qbit(118146) then error('egg_taken
      118146 not set') end; click(56); wait(0.5)
- play_lua:
    source: 'local s = tostring(status()); if not string.find(s, [[Two eggs are left]], 1, true) then error(''status line:
      '' .. s) end'
- assert:
