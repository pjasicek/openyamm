format: 0
level: L3
pitch: "Castleview is falling to pieces: the mill's gears gone, the bridge's ropes cut, the bells without clappers. The gremlins did it, and their king Gettlewaithe holds court in a burrow under the town wall. Behind a tiny door a crooked burrow leads to a hall heaped with the town's missing things, a waiting room with benches built for gremlins, and the court itself: a throne of stacked chairs on a dais of the bridge's planks, a parlour rug, the Mayor's portrait with a moustache added. The court lets the party walk in and talk; the gremlin army in the wall's old cellar, the larder and the barracks below does not. Talk Gettlewaithe round in three rounds (and beat his guards), or kill him and take the three Energy Disks from his treasury."
purpose: "Q-D1 The Gremlin Court (Mayor Snarfblad, D1): a dialogue first, or a fight. Party 19-20; band 14-22, Gettlewaithe 24; 28 monsters; treasure 2, the treasury 3. About 15 minutes."
mood: "A comic court: low earthen burrows, then the town's own grey stone, firelight, stolen finery."
