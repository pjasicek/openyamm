notes: "Xeen design brief, level L1, for a new map (no original to rebuild). Side quest Q-C23 The Ogre Boulders (devdocs/xeen/QUESTS.md): Captain Nystor of Rivercity wants the lair of the ogres who throw boulders at his boats destroyed; his reward is the boat route upriver. Class S (MAPS.md: at most 15 sectors and 20 M units^2, 15-30 monsters; section 0: 28 monsters, levels 12-20, groups 2-3, treasure level 2). Encounter slots are Xeen families from devdocs/xeen/MONSTERS_AND_ITEMS.md: slot 1 Ogres at their dungeon tiers (15 and 20, below the X2 crossings' 18-30 as section 0 asks), slot 2 the ogres' dogs from Wolves and cats (Dark Wolf 14 / 19 here, the family's levels pulled into the map's band), slot 3 the ogres' shamans (an Ogres tier that casts). No boss row: section 0 names none; the Ogre Chieftain is the family's rank b (20) with a name. Provisional ids: map_stats row 9138, qbits 110340-110379, items 12170-12189 (devdocs/xeen/ACT2_BUILD.md); none registered."
