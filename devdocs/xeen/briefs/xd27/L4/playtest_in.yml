# Playtest of the way into the Ogre Lair from X2 (XD-27, L4): a new game on X2 (xeen_x2.odm, A5), set down 280 in front
# of the cave mouth (DOORS.md: its dark face at -20992, 17555, 1216, facing south), facing it. The door is open (no
# qbit or item): "Enter the Ogre Lair" leads into the lair at its own start (the mouth, party start 0, 448, 0).
# Played from assets_dev in the Xeen world with `--map xeen_x2.odm` (xfour.sh's MAP).
id: xeen.xd27.l4.in
title: Ogre Lair (XD-27 L4), in from X2
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_x2.odm
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 10, experience: 45000, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 10, experience: 45000, skills: [], equipment: {}}
  - assert: {map: xeen_x2.odm}
  - setup_shortcut: {kind: immortal, value: true}
  - set_pose: {map: xeen_x2.odm, x: -20992, y: 17275, z: 1233, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - press_interact: {expect: {kind: event_target}}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_xd27.blv}
  - assert: {party_position: {x: 0, y: 448, radius: 128, z_min: -40, z_max: 80}}
  # First arrival only (lane A8, 2026-11-20): the window shows once (arrived_once 110342); leave by the mouth, come in
  # again from X2's door, and no window opens.
  - advance_runtime: {seconds: 3, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "The ogres' lair, in the river bluff."}}
  - play_lua: {source: "close(); wait(1); if not qbit(110342) then error('the arrival window did not set arrived_once') end"}
  - execute_event: {id: 8}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.0, follow_map_move: true}
  - assert: {map: xeen_x2.odm}
  - set_pose: {map: xeen_x2.odm, x: -20992, y: 17275, z: 1233, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - press_interact: {expect: {kind: event_target}}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_xd27.blv}
  - assert: {party_position: {x: 0, y: 448, radius: 128, z_min: -40, z_max: 80}}
  - advance_runtime: {seconds: 3, present_dialogs: true}
  - assert: {dialog: {active: false}}
