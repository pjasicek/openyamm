notes: "Xeen design brief, level L4: L3's ogre lair built with the studio's words, a playable map (NOTES.md). Side quest Q-C23 The Ogre Boulders (Captain Nystor, X2). The Xeen world has no package, monsters or items yet, so this L4 is built and played as an MM7 map, as XD-01 to XD-05 are: `world: mm7` until worlds/xeen exists. Stand-ins: slot 1 Ogres (15 / 20) is MMerge's Ogre family from MM6 (Ogre 15, Ogre Raider 20; its 3D model mm6_ogr), slot 2 the ogres' dogs MM8's Dire Wolf family (Dire Wolf 14, Pack Leader 19), slot 3 the ogres' shamans MM8's Ogre Mage (Ogre Mage Apprentice 20, Fire Bolt). The Ogre Chieftain is an Ogre Raider (593, 20) with a name, the three Boulder Throwers Ogres (592, 15); no boss row (MAPS section 0 names none). The larder key 12170 is MM8's Ogre Key (641). Quest bits keep their provisional Xeen numbers (110340-110341). Music: MM7 track 18 (its caves'). exit:x2_hills leads to X2 (xeen_x2.odm) at X2's provisional arrival for door:xd27."
