format: 0
level: L2
pitch: "For months the ogres of the river hills have thrown boulders at the boats on the Great River below Rivercity, because they like the sound of crunching wood and screaming men. Their lair is a warm brown cave in a river bluff. Its mouth is shut by a crude gate of logs that the ogres bar from inside, so the party climbs in by the midden crack, a bone-strewn fissure where the ogres throw their scraps and their dogs gnaw. Inside lie the bone den where the band sleeps on heaps of hides, the feast cave round a sunken cooking pit, the dog kennel, and the Chieftain's den, hung with the oars and the figurehead of Captain Nystor's sunk boats, with his larder behind a locked plank door. North, a boulder quarry where the ogres prise rocks from the walls feeds a timber chute down to the throwing ledge, a shelf in the bluff open over the river gorge, where the Chieftain and his throwers stand by a heap of boulders on a timber rack. Kill the Chieftain, knock out the rack so the heap goes thundering into the river, and break everything in the lair."
purpose: "Side quest Q-C23 The Ogre Boulders: Captain Nystor (X2) wants the lair destroyed. The party arrives at about level 10 and leaves at 12; monster levels 14 to 20 (the map's band 12-20), groups of 2-3, 28 monsters, treasure level 2 with the Chieftain's larder one step up. About 15 minutes."
mood: "A beast's den, warm and rank: brown rock, bones underfoot, smoke from the cooking pit; then daylight and the roar of the river from the throwing ledge, the gorge open below."
datum: arrival
