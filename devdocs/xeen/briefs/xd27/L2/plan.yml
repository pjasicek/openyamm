set_pieces:
  - id: set:boulder_heap
    kind: scripted
    spaces: [room:river_ledge]
    rule: "The heap of boulders lies on a timber rack at the head of a slide in the rock. A click knocks out the props: the rack collapses, the heap rolls down the slide and out over the cliff, the cave shakes, and far below the river swallows the boulders."
    inputs: [knock out the props]
    states: [loaded, dumped]
    gives:
      qbit: ogre_boulders_dumped
  - id: set:chute_boulder
    kind: trap
    spaces: [room:chute]
    rule: "Halfway down the chute a boulder comes bounding after the party from the quarry: damage to the party, the cave shakes, and the boulder comes to rest at the chute's foot against the ledge's rock."
    inputs: [walk down the chute]
    states: [armed, sprung]
  - id: set:fall
    kind: trap
    spaces: [room:river_ledge, room:gorge]
    rule: "A party that goes over the parapet falls into the river gorge; the current washes it out below the lair's mouth (a teleport to the mouth with a message), bruised but alive."
  - id: set:gate_bar
    kind: scripted
    spaces: [room:mouth, room:gate_yard]
    rule: "From the mouth the gate does not move: a message says it is barred from inside and that a reek of bones blows from a crack in the west wall. From the gate yard the bar lifts; the gate then opens from both sides."
    inputs: [lift the bar]
    states: [barred, open]
  - id: set:lair
    kind: scripted
    spaces: [room:chief_den]
    rule: "The Chieftain's seat and his trophies: while he lives a click says the lair is guarded by its chief; once he is dead the source's question 'You have found an Ogre lair. Destroy?' Yes breaks everything: the seat and the trophies come down, and the quest bit is set."
    inputs: [Chieftain dead, destroy]
    states: [whole, broken]
    gives:
      qbit: ogre_lair_destroyed
