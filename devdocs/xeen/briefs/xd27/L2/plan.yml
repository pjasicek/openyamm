notes: "Size S: at most 15 sectors and 20 M units^2 (MAPS.md), measured against MM8's shipped small caves: the Dire Wolf Den (d08: 14 sectors, 14.7 M, 13 spawn points), the Ancient Troll Home (d43: 12, 17.7 M, 4 chests) and the Cyclops Larder (d14: 16, 19.6 M, 4 chests, a larder behind doors). About 28 monsters in 13 rooms, about 2 per room and placed unevenly: nothing at the mouth, the ramp, the chute or the larder; packs in the den and the kennel; the heaviest fight round the cooking pit; the Chieftain and three throwers on the ledge. One loop (the gate). Every room a natural cave shape; only the gate, the kennel hurdle, the chute's trough, the rack and the larder door are timber. Steps of 32; ramps under 0.5. L2: one texture family for the den and the works, MM8's Dire Wolf Den (d08, a small brown beast cave) with its own timber; the gorge outside is d08's rock with MM8's water and sky and the Xeen hills view of XD-05."
