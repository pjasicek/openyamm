# The adit out of the Gemstone Mines, east pocket (DD-10B) onto D2 (lane A8, 2026-11-20). From the map's start just
# inside the adit's mouth, the exit window (leave the Gemstone Mines?), OK: the party stands on D2 (Sprite Forest, A6)
# below the timbered adit in the Gemstone foothills (thing:dd10b_adit, D2 event 44), at A6's return point for that
# event, facing south, away from it, and walks on south. Run with --world xeen --map xeen_dd10b.blv
# (output/studio_cal/dd10b/four.sh).
id: xeen.dd10b.l4.exit_d2
title: Gemstone Mines east pocket (DD-10B L4), out by the adit to D2
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_dd10b.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 25, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 25, skills: [], equipment: {}}
  - assert: {map: xeen_dd10b.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - advance_runtime: {seconds: 3, present_dialogs: true}
  - play_lua: {source: "close()"}
  - assert: {party_position: {x: 0, y: 192, radius: 64, z_min: -8, z_max: 8}}
  - walk_to: {x: 0, y: 112, z: 0, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - execute_event: {id: 9}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d2.odm}
  - play_lua: {source: "log('arrival ' .. status())"}
  - assert: {party_position: {x: -15360, y: 16384, radius: 128, z_min: 1640, z_max: 1760}}
  # Facing south, away from the adit: walking on takes the party down from the foothills.
  - walk_to: {x: -15360, y: 16000, z: 1696, z_tolerance: 250, radius: 160, timeout_seconds: 30}
  - assert: {map: xeen_d2.odm}
