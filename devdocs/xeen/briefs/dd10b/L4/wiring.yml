      - lua: "XeenQuests.hook(\"q-d7.sapphire_veins\")"
      - text: You work a sapphire rock out of the vein.
    else_effects:
      - text: You've got all this vein has to offer.
    notes: "Sapphire vein 2 (dark/aaze0039:1-4 the hover, :10 when spent): one sapphire rock (12359, the hook's map_gives), q-d7.sapphire_veins sets q-d7.dug (113144); map variable sapphire_2."
  - id: evt:sapphire_3
    preset: script
