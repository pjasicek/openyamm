    condition: {not: {map_var: sapphire_3}}
    effects:
      - set:
          var:
            map_var: sapphire_3
          value: 1
      - give_item: sapphire_rock
      - lua: "XeenQuests.hook(\"q-d7.sapphire_veins\")"
      - text: You work a sapphire rock out of the vein.
    else_effects:
      - text: You've got all this vein has to offer.
    notes: "Sapphire vein 3 (dark/aaze0039:1-4 the hover, :10 when spent): one sapphire rock (12359, the hook's map_gives), q-d7.sapphire_veins sets q-d7.dug (113144); map variable sapphire_3."
  - id: evt:sapphire_4
    preset: script
    source: panel:sapphire_4
    title: Sapphire vein
    condition: {not: {map_var: sapphire_4}}
    effects:
      - set:
          var:
            map_var: sapphire_4
          value: 1
      - give_item: sapphire_rock
      - lua: "XeenQuests.hook(\"q-d7.sapphire_veins\")"
      - text: You work a sapphire rock out of the vein.
    else_effects:
      - text: You've got all this vein has to offer.
    notes: "Sapphire vein 4 (dark/aaze0039:1-4 the hover, :10 when spent): one sapphire rock (12359, the hook's map_gives), q-d7.sapphire_veins sets q-d7.dug (113144); map variable sapphire_4."
  - id: evt:sapphire_5
    preset: script
    source: panel:sapphire_5
    title: Sapphire vein
    condition: {not: {map_var: sapphire_5}}
    effects:
      - set:
          var:
            map_var: sapphire_5
          value: 1
      - give_item: sapphire_rock
      - lua: "XeenQuests.hook(\"q-d7.sapphire_veins\")"
      - text: You work a sapphire rock out of the vein.
    else_effects:
      - text: You've got all this vein has to offer.
    notes: "Sapphire vein 5 (dark/aaze0039:1-4 the hover, :10 when spent): one sapphire rock (12359, the hook's map_gives), q-d7.sapphire_veins sets q-d7.dug (113144); map variable sapphire_5."
  - id: evt:throne
    preset: text
    source: platform:throne
    title: Gem maker's throne
    text: The throne hums. It was not made for you.
    notes: "D-27: flavour. dark/aaze0039:8 the hover."
  - id: evt:throne_back
    preset: text
    source: platform:throne_back
    title: Gem maker's throne
    text: The throne hums. It was not made for you.
  - id: evt:throne_dais
    preset: text
    source: platform:throne_dais
    title: Gem maker's throne
    text: The throne hums. It was not made for you.
  - id: evt:visit_end
    preset: script
    trigger: leave
    effects:
      - set:
          var:
            map_var: in_visit
          value: 0
    notes: "Leaving ends the visit: the next load is a fresh entry (evt:refill)."
notes: "DD-10B's events (gen.py, mine.py): the five sapphire veins (q-d7.sapphire_veins: one rock each, a map variable each) and the false vein (D-27), the refill on entry (q-d7.refill_b), the God of Minerals (q-d7.god_of_minerals), the Gem maker's throne, the exit to D2, doors, chests."
