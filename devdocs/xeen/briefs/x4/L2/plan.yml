format: 0
level: L2
pitch: "The north-centre of Cloudside: a warm, rolling savannah under the Gargoyle Range, whose bare peaks end in the world's north rim. Castle Burlock, the royal seat, stands white on a rise at the range foot, its walled village below the gate and the jousting lists below that. The Great River falls out of the range beside the castle and runs south to Rivercity past Captain Nystor's landing. South-west lies Asp, a small town whose people are turning into snakes; west, dry downs toward the desert; south-east, the red dwarf hills; north-east, lava fields smoking toward Mount Firestone."
purpose: "Act II's royal map (party 11-15): the audience at Castle Burlock (M5, XD-07), Asp's curse (Q-C5, XD-25), the gargoyles' eyrie (Q-C10, XD-26), Falagar's crystals (Q-C11), the Autumn Druid (Q-C1), the dwarves' adit (M3's shortcut from X1), stables and Nystor's boat as travel."
mood: "Dry gold grass, wide sky, a fair breeze; banners over the white castle; Asp silent and wrong; the range grey and sharp in the north."
datum: water:rim_sea
