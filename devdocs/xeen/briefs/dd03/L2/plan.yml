format: 0
level: L2
pitch: "Queen Kalindra's white castle, pulled out of phase by Alamar, comes back into the world a floor at a time as the party brings Ellinger Energy Disks. At first only the ground floor is solid: an empty throne under dust like snow, wings where spirits still pass through the walls, a closet whose back wall is not there. Then the Cloud Stairs take a foot and the second floor's people come back; then the dungeon stair, with caged liches, two dragons in the old well and a dragon called Scraps in his kennel; last the Queen's floor, where Count Blackfang's vampires wait for her, and the open stable yard with the castle's mirror."
purpose: "Story M19 (stage 1-2: the throne room's safes), M24 (Dimitri, the disk safes 64-52-31), M26 (stage 3-4, the mirror switch), M27 (the crown safe 3-31-62), T2-A (the liches); A4's castle services by stage (houses 4501-4512). Party 30-40; 54 monsters at 26-45 (24 in Act III, 30 in Act IV), Scraps 70 optional; treasure 4, the kennel's hoard 5."
mood: "Cream marble and purple banners, lamplit; cobbled wings where the walls shimmer violet and spirits drift; a dark dungeon of cells; wind in the bell tower and the open yard."
datum: arrival
