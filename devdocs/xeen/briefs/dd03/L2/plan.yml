notes: "Class M (MAPS, Dungeons): 20-45 sectors, 30-90 M units², 45-75 monsters, 3-7 chests, 6-16 doors. The graph's 33 spaces as 34 rooms (each flight a room of its own, the kennel's low stair). D-26: each stage's monsters hidden until its qbit, every stage gate a leaf in xkshimmer, the liches named, two named Bone Dragons in the old well, Carl the Mason in the kitchen, the stable yard open to the sky."
