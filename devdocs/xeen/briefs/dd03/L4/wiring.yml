format: 0
variables: [armory_safe, vault_safe, phase_seen1, phase_seen2, phase_seen3, phase_seen4]
events:
  - id: evt:armory_safe
    preset: chest
    source: chest:armory_safe
    question: {ask: "Combination?", answers: [10-11-12, "101112"], message: A safe with three dials., wrong_effects: [{text: A tougher safe than the others. Three dials.}]}
    title: Chest
    condition: {not: {map_var: armory_safe}}
    effects:
      - set:
          var:
            map_var: armory_safe
          value: 1
    else_effects:
      - open_chest: chest:armory_safe
    notes: "The armory's tougher safe (D-26): 10-11-12 opens it (Guido's tip, aaze0044:47); a wrong answer: 'A tougher safe than the others. Three dials.'"
  - id: evt:arrive
    preset: script
    trigger: timer
    every: 1
    condition: {all: [{qbit: stage1}, {not: {qbit: arrived_once}}]}
    once: true
    effects:
      - lua: "XeenQuests.hook(\"m19.first_entry\")"
      - qbit: arrived_once
    notes: "M19's first arrival in the restored castle (A3's m19.first_entry), once (arrived_once 117320)."
  - id: evt:banquet_table
    preset: text
    source: platform:banquet_table
    title: Banquet table
    text: A table laid for a feast nobody ate. The bread has turned to stone.
    window: false
  - id: evt:carl
    preset: script
    source: platform:carl_bench
    title: Carl the Mason
    lua: evt.SpeakNPC(5014)
    notes: "Carl the Mason (NPC 5014, D-26: 'just keep walking', aaze0041:34-35): the studio cannot give a placed indoor monster its NPC, so his bench speaks for him (DD-01's and DD-02's way)."
  - id: evt:chest_hoard
    preset: chest
    source: chest:hoard
    title: Chest
  - id: evt:crest_gate
    preset: text
    source: panel:crest_gate
    title: Kalindra's crest
    text: "A silver crescent and a white rose on purple: Queen Kalindra's arms."
    window: false
  - id: evt:crown_safe
    preset: script
    source: panel:queens_mirror
    question: {ask: "Combination?", answers: [3-31-62, "33162"], message: "Behind the Queen's mirror, a wall safe with six dials.", wrong_effects: [{text: The dials click round and the safe stays shut.}]}
    title: The Queen's mirror
    condition: {all: [{not: {qbit: m27_crown}}, {lua: "XeenQuests.can(\"m27.crown_safe\")"}]}
    effects:
      - lua: "XeenQuests.hook(\"m27.crown_safe\")"
    else_effects:
      - lua: "XeenQuests.hook(\"m27.crown_safe\")"
    notes: "m27.crown_safe (stage 4, queen_found): 3-31-62 runs the hook (the crown); else its fail or else text."
  - id: evt:disk_safe
    preset: script
    source: panel:disk_safe
    question: {ask: "Combination?", answers: [64-52-31, "645231"], message: A combination safe. Six dials., wrong_effects: [{text: The dials click round and the safe stays shut.}]}
    title: Safe
    condition: {all: [{not: {qbit: m24_safes}}, {lua: "XeenQuests.can(\"m24.disk_safes\")"}]}
    effects:
      - lua: |-
          if XeenQuests.hook("m24.disk_safes") then
              AddValue(InventoryItem(12334), 12334)
              AddValue(InventoryItem(12334), 12334)
              AddValue(InventoryItem(12334), 12334)
              AddValue(InventoryItem(12334), 12334)
          end
    else_effects:
      - lua: "XeenQuests.hook(\"m24.disk_safes\")"
    notes: "m24.disk_safes (stage 2): after Dimitri (m24.done) the six dials ask; 64-52-31 runs the hook and the map gives four Energy Disks; before m24.done the hook's fail text, after it the else text."
