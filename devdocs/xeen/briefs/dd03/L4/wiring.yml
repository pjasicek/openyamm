  - id: evt:stage1
    preset: script
    trigger: load
    condition: {qbit: stage1}
    opens: [door:portcullis]
    effects:
      - passable: door:illusion
    notes: "Stage 1 (m19.stage1 111381): the gate's portcullis up; the coat closet's illusory wall passable."
  - id: evt:stage2
    preset: script
    trigger: load
    condition: {qbit: stage2}
    opens: [door:cloud]
    effects:
      - show_actors: 21
      - show_actors: 22
      - lua: "evt.SetMapVar('AmbientSound7', 2)"
    notes: "Stage 2 (m19.stage2 111382): the Cloud Stairs take a foot; the second floor's spirits shown."
  - id: evt:stage3
    preset: script
    trigger: load
    condition: {qbit: stage3}
    opens: [door:dstair]
    effects:
      - show_actors: 31
      - show_actors: 32
      - show_actors: 33
      - show_actors: 34
      - show_actors: 35
      - lua: "evt.SetMapVar('AmbientSound8', 2)"
    notes: "Stage 3 (m26.stage3 111521): the dungeon stair; the liches, the Tomb Terrors, the well's dragons and Scraps shown."
  - id: evt:stage4
    preset: script
    trigger: load
    condition: {qbit: stage4}
    opens: [door:upper, door:yard]
    effects:
      - show_actors: 41
      - show_actors: 42
      - show_actors: 43
      - lua: "evt.SetMapVar('AmbientSound3', 2); evt.SetMapVar('AmbientSound11', 2)"
    notes: "Stage 4 (m26.stage4 111522): the upper stair and the stable yard; Blackfang's vampires shown."
