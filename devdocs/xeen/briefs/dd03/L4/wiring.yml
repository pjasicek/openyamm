    text: "Chains rattle: the kennel's portcullis moves."
    notes: "The kennel's portcullis (D-26): the lever under 'Don't let Scraps out!'."
  - id: evt:kitchen_table
    preset: text
    source: platform:kitchen_table
    title: Kitchen table
    text: Strings of sun-dried lizard innards hang over the table. They have kept.
    window: false
  - id: evt:knights_brew
    preset: script
    source: deco:knights_brew
    title: Knight's Brew
    lua: |-
      evt.ForPlayer(Players.Current)
      if IsPlayerBitSet(PlayerBit(11305)) then
          evt.StatusText("Knight's Brew. You have had your fill.", 4)
          return
      end
      AddValue(BaseMight, 2)
      SetPlayerBit(PlayerBit(11305))
      evt.StatusText("Knight's Brew. +2 Might (permanent).", 4)
    notes: "Knight's Brew (dark/aaze0043:5-8): +2 once per character (player bit 11305; the source's +10 rescaled)."
