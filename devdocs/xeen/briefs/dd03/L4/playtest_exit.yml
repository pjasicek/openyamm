# Kalindra's gate out of Castle Kalindra (DD-03) onto D1 (lane A8, 2026-11-20). From the map's start inside the gate,
# the exit window ("Exit Castle Kalindra", leave?), OK: the party stands on D1 (Castleview Vale, A6) at A6's return
# point for the castle gate (D1 event 123, entrance:dd03_gate): (-9728, -3072, 1664), facing west, and walks off.
# Run with --world xeen --map xeen_dd03.blv (output/studio_cal/dd03/four.sh).
id: xeen.dd03.l4.exit_d1
title: Castle Kalindra (DD-03 L4), out by the gate to D1
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_dd03.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 35, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 35, skills: [], equipment: {}}
  - assert: {map: xeen_dd03.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - advance_runtime: {seconds: 3, present_dialogs: true}
  - play_lua: {source: "close()"}
  - assert: {party_position: {x: -1600, y: 0, radius: 64, z_min: -8, z_max: 8}}
  - walk_to: {x: -1900, y: 0, z: 0, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - execute_event: {id: 19}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d1.odm}
  - play_lua: {source: "log('arrival ' .. status())"}
  - assert: {party_position: {x: -9728, y: -3072, radius: 128, z_min: 1600, z_max: 1720}}
  # Off the gate's apron, west down the forecourt.
  - walk_to: {x: -10200, y: -3072, z: 1664, z_tolerance: 250, radius: 160, timeout_seconds: 30}
  - assert: {map: xeen_d1.odm}
