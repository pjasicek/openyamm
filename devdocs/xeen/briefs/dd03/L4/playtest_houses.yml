# Castle Kalindra (DD-03): A4's houses 4501-4511 open from their doors once their stage is back, and the mirror
# 4512 answers (lane A8, session 6, 2026-11-20, after A4's rows landed). All four stage qbits set by console (as the
# disks would), a save and load, then each door's event (both wings of the double doors) is clicked and must open its
# house (a house with one resident opens that NPC, its services in the NPC's window: 4502-4511). Event numbers are ids.lock.yml's.
id: xeen.dd03.l4.houses
title: Castle Kalindra (DD-03 L4), every house door at stage 4
world: xeen
mode: faithful
steps:
  - new_game_flow:
      start_map: xeen_dd03.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 35, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 35, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 35, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 35, skills: [], equipment: {}}
  - assert: {map: xeen_dd03.blv}
  - setup_shortcut: {kind: immortal, value: true}
  - console: {line: "qbit set 111381"}
  - console: {line: "qbit set 111382"}
  - console: {line: "qbit set 111521"}
  - console: {line: "qbit set 111522"}
  - reload: {}
  - advance_runtime: {seconds: 3, present_dialogs: true}
