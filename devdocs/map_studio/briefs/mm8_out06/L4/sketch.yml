events:
  - id: evt:group10_hostile
    trigger: load
    lua: "evt.SetMonGroupBit(10, MonsterBits.Hostile, 1)"
    notes: "Load event 4 of the original: the monsters of actor group 10 are hostile."
  - id: evt:town_sounds
    trigger: timer
    every: 600
    lua: |-
      local pick = math.random(1, 6)
      local places = {{-6976, -15104}, {2176, -11904}, {-2496, -16480}, {-10400, -12800}, {7872, -9664}}
      if places[pick] then evt.PlaySound(347, places[pick][1], places[pick][2]) end
    notes: "Timer 479 of the original (every 20 half minutes): sound 347 at one of five places in town, or none."
  - id: evt:well_sound
    trigger: timer
    every: 450
    lua: "if math.random(1, 6) <= 2 then evt.PlaySound(325, 864, -13024) end"
    notes: "Timer 490 of the original (every 15 half minutes): sound 325 by the stable, one time in three."
