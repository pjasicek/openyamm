  - id: evt:terminal_53
    preset: switch
    source: switch:terminal_53
    title: Computer Terminal
    effects:
      - message: "\"Hello and welcome to this self-guided tour of the Varn Planetary Control Facility.  We gladly welcome all visitors.  As you arrive at each key area, be sure to check any of our display screens for more information.  Enjoy your tour!\""
    notes: "The original's event 53: the screen turns to trekscon (the switch's `on`) and the text opens in a message window (evt.SetMessage), here the `message` effect (round six; rounds one to five showed it as a status line)."
  - id: evt:terminal_54
    preset: switch
    source: switch:terminal_54
    title: Computer Terminal
    effects:
      - message: "\"This is the main equipment storage and repair facility.  By now, you may have noticed several floating Drone-bots.  They are responsible both for maintaining the key systems of this facility as well as sanitation.  If a unit becomes damaged, it is brought here to be repaired.\""
    notes: "The original's event 54: the screen turns to trekscon (the switch's `on`) and the text opens in a message window (evt.SetMessage), here the `message` effect (round six; rounds one to five showed it as a status line)."
  - id: evt:terminal_55
    preset: switch
    source: switch:terminal_55
    title: Computer Terminal
    effects:
      - message: "\"The room to your left is the main meeting hall.  Visiting dignitaries from around the world have feasted at banquets held in their honor.  In fact, it is said that at his 21st birthday party King Sheridan nearly choked to death on a piece of mogred, but was saved by a serving girl who he later married and made his Queen.  Ahh, l'amour.\""
    notes: "The original's event 55: the screen turns to trekscon (the switch's `on`) and the text opens in a message window (evt.SetMessage), here the `message` effect (round six; rounds one to five showed it as a status line)."
  - id: evt:terminal_56
    preset: switch
    source: switch:terminal_56
    title: Computer Terminal
    effects:
      - message: "\"Chief Engineer Wilson's Personal Log.  I have locked myself in Storage Room #6 but currently have no means of escape.  The drone-bots have gone mad and have started killing everyone in sight.  I was able to access the main control terminal on Level Four despite warnings of a hazardous leak, and I sent a distress signal, but since we have not had contact with any of the colonies for several weeks, I do not believe that a rescue is possible.  I have also managed to seal this facility so that the drones can not escape.  It is my hope that the colonists will be able to mount some sort of defense by the time my encryption codes are broken.  Tell Emma I love her.  Wilson out.\""
    notes: "The original's event 56: the screen turns to trekscon (the switch's `on`) and the text opens in a message window (evt.SetMessage), here the `message` effect (round six; rounds one to five showed it as a status line)."
  - id: evt:terminal_57
    preset: switch
    source: switch:terminal_57
    title: Computer Terminal
    effects:
      - message: "\"We apologize for any inconvenience, but we ask that all personnel evacuate the facility at this time.  Please do not be alarmed.  Thank you.\""
    notes: "The original's event 57: the screen turns to trekscon (the switch's `on`) and the text opens in a message window (evt.SetMessage), here the `message` effect (round six; rounds one to five showed it as a status line)."
  - id: evt:terminal_58
    preset: switch
    source: switch:terminal_58
    title: Computer Terminal
    effects:
      - message: "\"Before entering the Planetary Reaction Chamber, please request a pair of Safety Goggles from one of our Drones.  During peak hours of operation, this facility can generate enough power to produce a light bright enough to be seen from space.  Please avoid looking directly into the light.\""
    notes: "The original's event 58: the screen turns to trekscon (the switch's `on`) and the text opens in a message window (evt.SetMessage), here the `message` effect (round six; rounds one to five showed it as a status line)."
  - id: evt:terminal_59
    preset: switch
    source: switch:terminal_59
    title: Computer Terminal
    effects:
      - message: "\"Alert, environmental controls are offline on Level Four, Sections 18 through 96.  Access restricted to drones until further notice.\""
    notes: "The original's event 59: the screen turns to trekscon (the switch's `on`) and the text opens in a message window (evt.SetMessage), here the `message` effect (round six; rounds one to five showed it as a status line)."
  - id: evt:terminal_60
    preset: switch
    source: switch:terminal_60
    title: Computer Terminal
    effects:
      - message: "\"Warning, intruder alert, Level Four, Section.  All drones proceed to Level Four to intercept intruders.  Reactor is offline.  Encryption integrity at 2.064%.  Warning, intruder alert, Level Four\""
    notes: "The original's event 60: the screen turns to trekscon (the switch's `on`) and the text opens in a message window (evt.SetMessage), here the `message` effect (round six; rounds one to five showed it as a status line)."
  - id: evt:terminal_61
    preset: switch
    source: switch:terminal_61
    title: Computer Terminal
    effects:
      - qbit: 1300
      - lua: "for member = 0, evt.GetPartyMemberCount() - 1 do evt.ForPlayer(member) if not IsAtLeast(BlasterSkill, 1) then SetValue(BlasterSkill, 1) end end"
      - message: "\"Blaster weapons provide an effective, accurate ranged attack.  To operate the blaster, hold the grip comfortably in your hand, point the barrel at your target, and gently squeeze the trigger.  Should the weapon misfire, do not look into the barrel- give the weapon to an instructor and let them fix the problem.  Never point a blaster at something you do not want to vaporize.\""
    notes: "The original's event 61: the screen turns to trekscon, the qbit, the Blaster skill for every member who lacks it (the MMMerge handler; a Lua line, no effect word teaches a skill), and the text in a message window (evt.SimpleMessage), here the `message` effect (round six)."
