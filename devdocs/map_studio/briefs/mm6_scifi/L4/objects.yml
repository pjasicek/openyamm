exits:
  - id: exit:to_oracle
    room: room:s65_entry
    wall: 2
    along: 0.5
    size: [256, 256]
    surface: {texture: swdoorb, size: [256, 256], fit: true}
    to: exit:oracle
    notes: "The original's event 70: the door behind the party start, back to the Oracle."
notes: "Doors, lights, spawns, chests, the button and the terminals stand where the original's do. The 80 spawns keep their position and slot; the original's encounter index (1, 4, 7, 10: a fixed tier of a slot) has no field. The chests hold the original's items (round five: blasters, blaster rifles, the Control Cube and Proclamation, two memory crystals; three are empty) and the ones with items are trapped, as the original's records say. The original places no monster and leaves no item lying (its scene's actors and sprite objects are empty), so `monsters` and `items` stay empty. The tube's 15 light triggers (events 38 to 52) switch the tube's lights by their numbers in ids.lock.yml; the three short-circuit handlers (62 to 64, bound to nothing in the shipped map) are not in the project. The spark trap of storage room 2 (event 71, a timer) and the Sparks of event 47 are events in wiring.yml."
