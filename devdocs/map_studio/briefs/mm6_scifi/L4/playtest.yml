# The rebuilt Control Center (devdocs/map_studio/briefs/mm6_scifi/L4): a walk from the party start through every
# level, by its ramps and stairs, that uses every door, the button and one chest of each wing. Written by
# output/studio_cal/mm6_scifi/mkplay.py; the shaft steps were added by hand in round two (do not run mkplay.py again).
# Event and door numbers are those of ids.lock.yml. Round five: the chests hold the original's items (checked after
# the loot), and the tube's lights switch as the party walks. Round six: before each loot the party drops what
# the walk does not assert (the start kit and whatever else it holds), so whether a chest's items fit never depends on
# what was picked up before; each loot counts the items its own chests give.
id: studio.mm6_scifi.walk
title: The Control Center rebuild, every level and every mechanism
world: mm6
mode: faithful
steps:
  - new_game_flow:
      start_map: calscifi.blv
  - assert: {map: calscifi.blv}
  - setup_shortcut: {kind: immortal, value: true}
  # Down the two ramps into the pit (floor -452 under the upper floor at -196) and back up its stair.
