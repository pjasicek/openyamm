  - walk_to: {x: -7488, y: 4660, z: -196, radius: 40, timeout_seconds: 60, clear_hostiles: 1500}
  - play_lua:
      source: |
        if qbit(1300) then error("qbit 1300 set before the terminal") end
        click(42); wait(1)
        if not qbit(1300) then error("terminal 61 did not set qbit 1300") end
  # Round six: the terminal's text opens in a message window, as the original's evt.SetMessage and press-any-key do;
  # the player reads it and closes it.
  - assert:
      dialog: {text_contains: "Blaster weapons provide an effective, accurate ranged attack"}
  - play_lua:
      source: |
        if not close() then error("terminal 61 opened no message window") end
