    kind: platform
    at: [99.8125, 78.2109375]
    size: [128, 64]
    raise: 32
    height: 112
    textures: {top: BemOB2, wall: BemOB2b}
    title: Shrine of Luck
    lua: |-
      if not IsAtLeast(MonthIs, 6) then
          evt.StatusText("You pray at the shrine.")
          return
      end
      if not IsQBitSet(QBit(1230)) then
          SetQBit(QBit(1230))
          if not IsQBitSet(QBit(1237)) then
              SetQBit(QBit(1237))
              evt.ForPlayer(Players.All)
              AddValue(BaseLuck, 10)
              evt.StatusText("+10 Luck permanent")
              return
          end
          evt.ForPlayer(Players.All)
          AddValue(BaseLuck, 3)
          evt.StatusText("+3 Luck permanent")
          return
      end
      evt.StatusText("You pray at the shrine.")
    notes: "SLuckN: the altar at the back of the recess, event 261 as the original's handler (128..272 in the original, its top a slope 240..272)."
