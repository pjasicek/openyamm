    notes: "The arrival band. The gate tunnel's floor rises gently from 0 at the junction to about +128 at the door; from the junction the tunnel descends (E3) to the cellar band."
  - id: band:ground
    level: 256
    spaces: [room:g5, room:g6, room:h1, room:h3, room:w1, room:w2, room:w3, room:w4]
    partly: [room:g2, room:h2]
    notes: "Flat floors throughout: W2's +464 is the canopy of a four-poster bed, furniture rather than a raised floor."
  - id: band:upper
