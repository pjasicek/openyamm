    spaces: [room:h1, room:h3, room:h2]
    closed_until: {item: [storage_key_a, storage_key_b]}
    notes: "Really closed until both double-locked storeroom doors have been opened (lock:storeroom); the keys are spent then, so the item condition only says what opens it. Every other branch is a dead end (barracks, cells, closets, treasury, vault)."
teleport_sets:
  - id: teleport:false_doors
    sources: [poi:false_doors, poi:tunnel_spots]
    landings:
      - {space: room:c1, count: 1}
      - {space: room:c2, count: 1}
      - {space: room:c4, count: 2}
      - {space: room:c5, count: 1}
    rule: "Random among the five landings, never the clicked door's own landing; message 'You are pulled through the door!'. Stateless."
    notes: "The tunnel spots are a second, accidental way into the cellar: the flow graph must count the cellar as reachable from E1 to E4 through them."
lock_groups:
  - id: lock:storeroom
    links: [link:h1_h3, link:h2_h3]
    condition: {item: [storage_key_a, storage_key_b]}
    consume: last_opened
    notes: "Each door opens only while the party carries both Storage Keys; otherwise it says 'The door is double locked.'. The first door opened keeps the keys; the second spends both."
entrances:
  - id: entrance:gate
    space: room:e1
    kind: both
    neighbour: exit:silver_cove
    how: "A large double door in the gate tunnel; the party arrives just inside it. The only way in or out: no other exits or drops."
critical_path: [room:e1, room:e2, room:e3, room:e4, room:c1, room:c3, room:c5, room:g1, room:g2, room:g5, room:h1, room:w1, room:w3, room:w4]
return_path: [room:w4, room:w3, room:w1, room:h1, room:h2, room:u1, room:u2, room:u3, room:e2, room:e1]
goals:
  - id: goal:eagle_statuette
    space: room:w4
    kind: take
    what: Open the vault chest and take the Eagle Statuette.
    gives:
      - qbit: statuette_found
      - qbit: statuette_seer_hint
    notes: The statuette is carried to a pedestal on another map for the continent-wide statuette quest.
keys:
  - id: key:portcullis_switch
    grants: {map_var: portcullis_raised}
    found_in: room:u3
    how: "lever: a wall button at the foot of the back stair"
  - id: key:storage_key_a
    grants: {item: storage_key_a}
    found_in: room:w3
    how: "chest of drawers in the study, together with the Warlord's Key"
  - id: key:storage_key_b
    grants: {item: storage_key_b}
    found_in: room:u15
    how: chest of drawers in the throne room
  - id: key:warlord_key
    grants: {item: warlord_key}
    found_in: room:w3
    how: "chest of drawers in the study, together with Storage Key A"
containers:
  - id: container:footlocker
    kind: chest
    notes: "Nine small footlockers (G3 2, G4 1, G6 3, U4 1, U8 2) open this one inventory."
  - id: container:shared_cabinet
    kind: cabinet
    notes: "Three cabinets (W3, U5, U15) open this one inventory."
points_of_interest:
  - id: poi:axe_brazier
    space: room:h1
    kind: brazier
    behaviour: "One of the hall's braziers: when used, gives a single good axe (treasure tier 6)."
    uses: {times: 1, per: party, reset: never}
  - id: poi:drawers_study
    space: room:w3
    kind: chest of drawers
    behaviour: "Gives two keys, with the message that two keys were found."
    uses: {times: 1, per: party, reset: never}
    gives:
      - item: warlord_key
      - item: storage_key_a
  - id: poi:drawers_throne
    space: room:u15
    kind: chest of drawers
    behaviour: "Gives a key, with the message that a key was found."
    uses: {times: 1, per: party, reset: never}
    gives:
      item: storage_key_b
  - id: poi:false_doors
    spaces: [room:c1, room:c2, room:c4, room:c5]
    count: 5
    kind: false door
    behaviour: "Door panels that look like real doors (C4 has two); clicking one teleports the party (teleport:false_doors)."
  - id: poi:lure_door
    space: room:e4
    kind: false door
    behaviour: "Only says 'This door won't open.'; the secret wall beside it is the way on (link:e4_c1)."
  - id: poi:portcullis_switch
    space: room:u3
    kind: switch
    behaviour: "Raises the portcullis between the back stair and the junction for good; the switch shows its thrown face from then on, across visits."
    uses: {times: 1, per: party, reset: never}
    gives:
      map_var: portcullis_raised
  - id: poi:tunnel_spots
    spaces: [room:e1, room:e2, room:e3, room:e4]
    kind: hidden click spot
    behaviour: "A few unmarked spots on the tunnel walls, floor and ceiling; they teleport like a false door (teleport:false_doors)."
set_pieces:
  - id: set:axe_brazier
    kind: scripted
    spaces: [room:h1]
    rule: "Using one particular brazier of the great hall gives a single good axe (treasure tier 6) the first time; nothing afterwards (poi:axe_brazier)."
    inputs: [use the brazier]
    states: [axe not taken, axe taken]
  - id: set:double_lock
    kind: puzzle
    spaces: [room:h1, room:h2, room:h3, room:w3, room:u15]
    rule: "Both storeroom doors are double locked (lock:storeroom): the two Storage Keys come from opposite ends of the map, A from the study's drawers and B from the throne room's drawers. With both doors open, H1, H2 and H3 form a small loop (loop:storeroom)."
    inputs: [click a storeroom door]
    states: [both locked, one opened (keys kept), both opened (keys spent)]
    solution: "Fetch Storage Key A in the study and Storage Key B in the throne room, then open both doors."
  - id: set:false_doors
    kind: scripted
    spaces: [room:e1, room:e2, room:e3, room:e4, room:c1, room:c2, room:c4, room:c5]
    rule: "The cellar of false doors: five false door panels (poi:false_doors) and the tunnel's unmarked click spots (poi:tunnel_spots) send the party to a random landing in the cellar (teleport:false_doors). Harmless disorientation."
    inputs: [click a false door panel, click an unmarked tunnel spot]
    states: [stateless]
  - id: set:lure_door
    kind: scripted
    spaces: [room:e4]
    rule: "The door at the tunnel end only shows 'This door won't open.'; the blank wall beside it is a secret wall into the cellar (link:e4_c1)."
    inputs: [click the door]
    states: [stateless]
  - id: set:statuette_chest
    kind: scripted
    spaces: [room:w4]
    rule: "The vault's single chest: the first opening gives the Eagle Statuette and sets the quest bit and the seer's hint bit."
    inputs: [open the chest]
    states: [statuette inside, statuette taken]
    gives:
      - qbit: statuette_found
      - qbit: statuette_seer_hint
mechanisms:
  - {kind: ordinary door, count: 11}
  - {kind: keyed door (single key), count: 1}
  - {kind: double-locked door, count: 2}
  - {kind: secret wall, count: 4, notes: "E4-C1, U5-U6 and U15-U16 rise; G3-G4 sinks."}
  - {kind: switch portcullis, count: 1}
  - {kind: switch, count: 1}
  - {kind: false teleporting door, count: 5}
  - {kind: lure door, count: 1}
  - {kind: hidden click spot, notes: "A few, on the tunnel walls, floor and ceiling (E1 to E4)."}
  - {kind: chest of drawers, count: 2}
  - {kind: interactive brazier, count: 1}
  - {kind: exit door (double), count: 1}
