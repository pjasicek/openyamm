  - id: state:portcullis_raised
    condition: {map_var: portcullis_raised}
    shows: [the switch at the foot of the back stair shows its thrown face]
    opens: [link:u3_e2]
    notes: "Persists across visits: the big ring (loop:big_ring) is then the fast way in and out."
