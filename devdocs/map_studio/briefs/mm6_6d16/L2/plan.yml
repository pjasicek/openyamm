regions:
  - id: region:cellar
    name: Cellar
    spaces: [room:c1, room:c2, room:c3, room:c4, room:c5]
    where: south-west
    theme: "D1 ashlar: ashlar walls with pilaster edges and centre panels (D1wlble1, D1wlbre1, D1WlBct1, d1trim), dark crazy-paving flagstones (D2flor1), rough rock ceiling (D8ceilD). Plain, bare cells; bracket torches."
  - id: region:entry
    name: Entry
    spaces: [room:e1, room:e2, room:e3, room:e4]
    where: west edge
    theme: "Rock-cut tunnel: blank ashlar walls (MM6 d1wblnkA, d1trim edges), packed red-earth floor (D8florH), rough rock ceiling (D8ceilD). Bracket torches."
    notes: "The gate tunnel runs along the west edge, descending from the gate toward the cellar band."
  - id: region:ground
    name: Ground floor
    spaces: [room:g1, room:g2, room:g3, room:g4, room:g5, room:g6]
    where: along the south
    theme: "Timber stairs (G1, G2) and the D1 ashlar guard post (G5); barracks and treasury in D8 rubble stone with the timber barracks kit."
  - id: region:hall
    name: Hall
    spaces: [room:h1, room:h2, room:h3]
    where: "east side (the great hall); the hall stair and storeroom in the centre"
    theme: "D1 pilastered hall: ashlar between tall pilasters (d1wctrA, d1wleA, d1wreA, blank d1wblnkA), panelled stone floor tiles (D2flor2), stone trims (d2trimB), rock ceiling (D8ceilD). The richest finish of the map."
  - id: region:upper
    name: Upper floor
    spaces: [room:u1, room:u2, room:u3, room:u4, room:u5, room:u6, room:u7, room:u8, room:u9, room:u10, room:u11, room:u12, room:u13, room:u14, room:u15, room:u16]
    where: north-west half
    theme: "D1 ashlar for the gallery, the west hall, the drill hall and the throne approach; D8 layered stone with the timber barracks kit for the barracks along the gallery; D8 rubble stone for the side room and the throne room."
    notes: "Wings sit side by side: no room lies over another, the gallery (U1) and the back stair (U3) included."
  - id: region:warlord
    name: Warlord's wing
    spaces: [room:w1, room:w2, room:w3, room:w4]
    where: north-east corner
    theme: "D8 rubble stone: grey rubble walls (D8wlB with D8wlBLE and D8wlBRE edges), blue-grey slab floor (D8florG), grey dressed-stone ceiling (D8ceilA) or plank ceiling (D2ceil1). Plank ceilings; the bedchamber with the timber kit."
