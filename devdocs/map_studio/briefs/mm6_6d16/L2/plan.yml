format: 0
level: L2
pitch: "A warlord's mercenary army has dug into a walled stronghold near Silver Cove. The front door opens only into a guard tunnel: the real way in is through a blank wall at its end into an empty cellar of false doors that drag the party between cells, then up through the store cellars and barracks into a vast brazier-lit muster hall packed with soldiers. Beyond the hall is the warlord's own wing, where a drawer in his study holds the key to the small vault with the Eagle Statuette, one of the statuettes the party carries to a pedestal for a continent-wide quest. Upstairs, a long gallery of barracks leads to a throne room held by the fortress's elite knights. A switch at the foot of a back stair lifts a portcullis that opens a short way back to the entrance. Play is room-by-room melee against human soldiers in three ranks (thugs, men-at-arms, plate knights), in great numbers, with chests in every barracks."
purpose: "Recover the Eagle Statuette (quest item; finding it sets the quest bit and the seer's hint bit) for the continent-wide statuette quest, and loot: a rich treasure map at the top treasure tier, about 20 containers. Held by the warlord's soldiers; no named boss actor: the throne room and the warlord's antechamber carry the strongest knights instead. Fights grow toward the great hall, the warlord's wing and the throne room; corridors, stairs and the cellar are empty."
mood: "Martial, crowded, torchlit stone and timber: a lived-in garrison rather than a ruin."
datum: arrival
