notes: "Size classes: the designer's legend (closet under 0.15 M units², small 0.15-0.5, medium 0.5-1.2, large 1.2-2, great over 2) maps to XS, S, M, L and XL; the two designer-large rooms whose floors fall under the schema's 1.5 (U1, U11) are M and carry their area. Light numbers are lights per million square units of floor, by room class: 4.5 for the tunnel, cellar and storehouse (bracket wall torches, 1 to 4 per room), 2.5 for rooms, barracks, stairs and passages (iron wall torches, 1 to 4 per room), 1.5 for the great rooms (H1, H3, U11, U15; H1 and U15 are lit mainly by their flambeaux); 75 lights in all. Unlit: W4, U2, U3, U6, U16. Themes name texture families of the shared MM6 surface library (level_generation/textures_x4/inventory.json) and decorations of the engine's indoor decoration bindings; no theme library exists yet to name instead. Treasure: every ordinary chest and cabinet holds three random items, one each of tiers 3, 4 and 5; the shared footlocker and cabinet inventories are empty and trapped. Trapped containers are listed in mechanisms (no trap field in v0)."
