atmosphere: "Music: the dungeon track most MM6 dungeons share (map_stats.music 42), all through. No fog, no weather, no ambient sound emitters: the soundscape is the music, the doors and the fighting. Light: warm pools of torchlight at a steady rhythm, white light at full brightness; torches reach about 256, the flambeaux of the great hall and throne room about 384. The great hall reads as a long nave of fire bowls under a tall dark ceiling; the cellar is small, bright and claustrophobic; closets, the vault and the back stair are dark."
