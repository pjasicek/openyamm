  - id: evt:d6
    preset: door
    source: door:d6
    title: Door
    condition: {all: [{item: storage_key_a}, {item: storage_key_b}]}
    locked_text: The door is double locked.
    action: open
    effects:
      - lua: "if IsAtLeast(MapVar(double_lock), 10) then RemoveItem(2185) RemoveItem(2191) else SetValue(MapVar(double_lock), 10) end"
    notes: "Original event 6: both storage keys (2185, 2191) or \"The door is double locked.\"; the first of the two doors opened sets map variable 11 to 10, the second spends both keys. The spending only on the second door is a Lua step (no word makes an effect wait on a variable)."
