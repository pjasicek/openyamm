    source: chest:statuette
    title: Chest
    condition: {any: [{not: {qbit: statuette_found}}, {map_var: statuette_seen}]}
    effects:
      - qbit: statuette_found
      - qbit: statuette_seer_hint
      - set:
          var:
            map_var: statuette_seen
          value: 1
    else_effects:
      - open_chest: chest:footlocker
    notes: "Original event 36: a party without qbit 1076 opens chest 11 and gets qbits 1076 and 1211 and map variable 22; once that is noted here, chest 11 again; a party that comes with qbit 1076 already set gets the shared footlocker (chest 0)."
  - id: evt:switch
    preset: switch
    source: switch:portcullis
    title: Switch
    opens: [door:d19]
    sets: {map_var: switch_thrown}
    notes: "Original event 19: the plate turns to D8s2on (the switch's `on`), door 19 opens for good, map variable 21 is set."
  - id: evt:switch_load
    preset: switch
    trigger: load
    condition: {map_var: switch_thrown}
    texture: {cog: 1, name: D8s2on}
    notes: "Original event 48 (on load): once the switch is thrown, its plate shows D8s2on again (cog 1 is switch:portcullis in ids.lock.yml)."
