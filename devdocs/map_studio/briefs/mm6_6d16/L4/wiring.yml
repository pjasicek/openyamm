  - id: evt:false_door_20
    preset: script
    source: panel:false_door_c4s
    title: Door
    lua: |-
      local r = PickRandomOption(20, 1, {1, 2, 3, 4})
      if r == 1 then evt.MoveToMap(-2539, -512, -255, 1024, 0, 0, 0, 0)
      elseif r == 2 then evt.MoveToMap(-1537, -788, -255, 512, 0, 0, 0, 0)
      elseif r == 3 then evt.MoveToMap(-1012, -1284, -255, 1024, 0, 0, 0, 0)
      elseif r == 4 then evt.MoveToMap(-1036, -1775, -255, 1536, 0, 0, 0, 0)
      end
    text: "You are pulled through the door!"
    notes: "Original event 20 (the west cell's south door, face 79): one of four landings in the cellar at random, never the one beside this door; the random choice is Lua (no word picks one of several teleports). Its further bindings in the original (clicked spots on the tunnels' walls, floor and roof) cannot be said: see NOTES.md."
