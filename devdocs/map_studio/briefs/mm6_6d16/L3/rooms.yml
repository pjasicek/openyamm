notes: "L3 sketch of Warlord's Fortress, origin at the fortress's south-west corner (19 x 14 cells of 512). Heights are absolute, datum the arrival band (entrance 0). Measured from the original and simplified: outlines with few points, corridors and tunnels 256 wide (`path` rooms where straight or bent; the curved tunnel bends are smoothed paths), L-, U- and T-shaped spaces as one outline; the original's diagonal corner joins are squared off. Joins and doorways follow the original's measurements: where two spaces share a whole passage end (open joins, the pieces of one tunnel or stair, the full-width portcullis and storeroom door) the rooms meet and the opening is `width: full`; doors stand in the 16-thick wall the original has (32 for the officer room and the bedchamber); the original's short door passages are either part of a room (the 256-wide, 240-long passages to the lower and upper barracks and the third gallery barracks, the 496-long passage north of the great hall) or a 256-thick wall with a doorway as wide as the passage (drill hall, study, storeroom from the hall, treasury). Every flight is its own rectangle with steps (16 per 256 of rise, 32 deep, as in the original) and every ramp its own convex room with level ends, so a space with stairs, a landing or a curved falling tunnel is several rooms naming one plan space; the openings between them carry no plan link. The descending tunnel's pieces are 260 wide where they run 4 east to 3 south, so their corners fall on whole units. rooms.yml cannot say which wall an opening is in: the build takes the facing pair with the longest shared stretch, so where a passage runs within 512 of a parallel wall of the other room, the competing wall is drawn in short collinear pieces (C1, C3, C4, G2, G5, H2, U1, U2) to keep each opening where the original has it. Built-in bunks and the treasury's chest ledge are platforms, 4 units clear of the walls (the build refuses a block that touches a wall); chests, cabinets, beds, the throne seat, barrels and torches belong to the furniture and object layers, as do door leaves, levers, the false doors and the exit door. Walls are smooth: the original's tunnel walls are smooth curves 256 apart, so no room is `rough` and there are no rock islands. Still not drawable: shaped ceilings (R3-K5: the great hall's coves, the beams, ceilings that follow a flight or a tunnel), per-opening kind and look (R3-K11) and the arrival spot (R3-K14). There are no stacked rooms (R3-K7 is not needed here)."
