  - walk_to: {x: 15400, y: 8400, z: -768, radius: 128, timeout_seconds: 240, clear_hostiles: 2500}
  - walk_to: {x: 12300, y: 7700, z: -768, radius: 128, timeout_seconds: 240, clear_hostiles: 2500}
