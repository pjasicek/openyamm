  - play_lua: {source: "open_door(25, 10)"}
  - walk_to: {x: 2624, y: 6912, z: -256, radius: 64, timeout_seconds: 120, clear_hostiles: 2500}
  - assert: {party_position: {x: 2624, y: 6912, radius: 128, z_min: -264, z_max: -248}}
