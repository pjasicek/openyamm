  - assert: {party_position: {x: 18300, y: 8576, radius: 128, z_min: -776, z_max: -760}}
  - play_lua:
      source: |
        local function make_room()
          for id in string.gmatch(pack_items(), "(%d+)x%d+") do
            id = tonumber(id)
            while item_count(id) > 0 and discard(id) do end
          end
        end
        clear_hostiles(2500)
        make_room(); loot_chest(10)
        make_room()
