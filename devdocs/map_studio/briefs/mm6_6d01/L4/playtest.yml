  - assert: {party_position: {x: -1856, y: 5760, radius: 128, z_min: -520, z_max: -504}}
  # the twelve lockers' doors, and the three chests painted on lockers' back walls
  - play_lua:
      source: |
        local function make_room()
          for id in string.gmatch(pack_items(), "(%d+)x%d+") do
            id = tonumber(id)
            while item_count(id) > 0 and discard(id) do end
          end
        end
        clear_hostiles(2500)
        for _, p in ipairs({{31, 16}, {32, 17}, {33, 18}, {35, 21}, {36, 22}, {37, 23}, {17, 2}, {18, 3}, {19, 4}, {20, 5}, {21, 6}, {22, 7}}) do
