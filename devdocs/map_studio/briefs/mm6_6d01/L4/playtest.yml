  - walk_to: {x: 576, y: 5300, z: 0, radius: 96, timeout_seconds: 180, clear_hostiles: 2500}
  - walk_to: {x: 2060, y: 4864, z: 0, radius: 48, timeout_seconds: 180, clear_hostiles: 2500}
  - play_lua: {source: "clear_hostiles(2500); click(50); wait(1)"}
  - assert: {party_position: {x: 9000, y: 1916, radius: 128, z_min: -776, z_max: -760}}
