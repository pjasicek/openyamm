    preset: script
    trigger: timer
    every: 2880
    effects:
      - set:
          var:
            map_var: wizard_eye
          value: 0
    notes: "Original event 65: daily at midnight the fountain's Wizard Eye is ready again. Here every 2880 half minutes (a day) from entry: no word for a timer at an hour of the day indoors."
