    closes: [mover:g57, mover:g58]
    sets: {map_var: switch_b}
    notes: "Original event 20 ('B'): once until P resets it (map variable 2 there), the gate bands of door records [55, 56] slide away and [57, 58] come back, and the switch's picture turns to T1swDu. Used again before the reset: nothing."
