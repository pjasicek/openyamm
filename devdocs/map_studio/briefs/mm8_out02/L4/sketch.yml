  edge: {north: 0, east: 2304, south: 0, west: 0}
  notes: "The travel prompts stand 44 cells from the centre on every side (x and y from 20 to 108): playable_square 0.69. Any point on a side prompts; the spans are where the land lets the party reach it. The map's outermost row and column (`edge`) are the original's: 0 on the north, west and south, 2304 under the east shelf. Beyond the square the uplands (west, the north road's two shoulders, east) are said by the grid of spot heights, the bands and the points, with the original's roughness (heights.rough); the west upland's hill (3700) and the headland (6400) are no shelf or ridge of `frame.rim`, and a level shelf on the east loses the crest that runs north and south at x 118 to 121."
