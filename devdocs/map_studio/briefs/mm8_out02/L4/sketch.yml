format: 0
grid: 512
map_cells: 128
notes: "Coordinates are terrain cells of the plan grid (512 units) on the 128 x 128 map: [x, y], x east, y south, origin the north-west corner of the terrain. Grid nodes are cell corners, so world X = (x - 64) x 512 and world Y = (64 - y) x 512 (world +Y is north; the terrain's first sample row is its north edge). Points are rounded to the nearest node; road centrelines and plot corners may use half cells. Heights are game units above sea level (the datum of plan.yml); point heights and cliff lines win over band polygons. No coarse height grid is given: at 4 to 8 cells per sample it mostly samples cliff faces, so the points, bands and cliff lines carry the landform. Plots: `at` is the north-west corner of the footprint; the footprint is owned by the building (`footprint_cells: [front width, depth]` in plan.yml, one pair per house in index order for a group), so a plot facing north or south covers [width, depth] in x and y and one facing east or west covers [depth, width]. Groups with a count (house groups) are addressed per house as `{building, index}`; each group's notes in plan.yml name the form of every index. Facing is the side the main door is on. `door_to` names the plan link the door opens onto, or the nearest one where the door opens onto a plaza, a pier or a street the plan does not list (see the gaps). The L2 plan's lanes floor of 256-512 is superseded here: the lanes stand 128-192 up. Where the sketch and the plan's text differ in a position or height, the sketch is the measured one."
