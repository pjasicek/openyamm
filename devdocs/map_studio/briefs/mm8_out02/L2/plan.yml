states:
  - id: state:after_ending
    condition: {qbit: endgame_seen}
    hides: [the crystal]
    seals: [entrance:crystal]
  - id: state:pirate_invasion
    condition: {qbit: pirates_invaded}
    lifted_by: {qbit: pirates_defeated}
    locks: [building:nw_block, building:ne_block, building:se_block, building:inn, building:sanctum, building:dancing_ogre, building:captains_ship, building:smugglers_ship, building:market_rich, building:market_middle, building:market_poor, building:market_warehouse, building:waterfront_rich, building:waterfront_middle, building:waterfront_warehouse, building:lanes_poor, building:lanes_middle]
    effects: [The party's bank balance is set to zero when the pirates land., "Every house, service and ship door shows the locked face animation; the seer, the council hall and the dungeon doors stay open.", The townsfolk and guards stay where they are.]
    population:
      - {id: pop:pirate_force, actors: [{actor: Regnan Bandit, count: 42}, {actor: Regnan Pirate, count: 26}, {actor: Regnan Brigadier, count: 10}], levels: [18, 50], placed: true, strength: heavy, rank: mixed, hostile: true, hidden_until: {qbit: pirates_invaded}, notes: "78 placed raiders, hidden until the landing: about 28 in the west lanes, 16 on the harbour, 13 on the waterfront row, 13 in the market and 8 on the town's outskirts. Far stronger than anything else on the map at that point in the story."}
  - id: state:smuggler_ship_docked
    condition: {qbit: smuggler_ship_docked}
    shows: [the smuggler's ship at its pier]
    opens: [entrance:smugglers_ship]
    notes: Before the letter is delivered the smuggler's pier is empty and its ship cannot be boarded.
landform:
  relief: "0 to 6,400. A low rolling basin (the middle three-fifths of the width, from the bay to the north edge) between flat-topped uplands (the outer fifth on each side, typically 2,200-2,500, rising to about 3,700 in the west and 3,100-3,300 in the east) with steep rock faces along their whole length, each cut to sea level by one pass (west a little north of the middle, east about the middle). A south-west headland of rock ridges rises to about 6,400. The town is flat."
  height_range: [0, 6400]
  water: "Open sea across the whole southern fifth to quarter and a broad bay biting north into the south-west and south-centre almost to the map's middle. A river enters the north edge just west of centre and winds to the bay's north-east corner (course under spaces, water:river); two crossings: the upper bridge and the town bridge. A small cliff-ringed sea inlet inside the headland opens south."
  water_share: 0.25
  coast: "The town is on the bay's north-east shore; the east shore curves away south-east to the corner. The south-west headland forms the bay's west arm."
  caps:
    - {kind: bare rock, where: The south-west headland's ridges.}
  rim: {width_share: 0.2, broken_by: [road:west_pass, road:east_cut], notes: "East and west only: the north is open grassland along the river and the south is sea."}
  notes: "Terrain materials (the MM8 world set): grass with patchy-grass variation covers most land; dirt (with the stony variant on about a tenth) on yards, lanes, knoll tops and camps; road (pebbles) on every road and the market streets, about 4 % of land; rock on the uplands' and headland's tops; cliff on every steep face; sand on all shores. About 3/4 of the land cells grass, 1/7 dirt, 1/9 rock."
atmosphere: "Temperate coastal daylight. Sky: the continent's ordinary daily sky ladder (clear and fair days most often, cloudy to stormy now and then), no map sky theme and no map fog. Weather: rain allowed at the world's default chance, never snow. Music: the Jadame plains and town track (track 9) everywhere on the map. Sound environment: plains (open air, no echo). Ambient: a horse neighing now and then by the caravan stable; otherwise the world's default outdoor sounds. Lights: 14 fires (two camp fires, two cook fires in the lanes, the chapel beacon, the challenge's fire basin, eight torches crowning the tomb) and the pedestal's glow; the town itself has no lamps."
