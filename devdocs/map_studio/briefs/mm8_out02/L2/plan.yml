  - {kind: quest-gated door (talk instead of entering), count: 1, notes: "The council hall's terrace door, in its tower's south face."}
  - {kind: key-item door, count: 1, notes: "The crystal: locked face animation without the key."}
  - {kind: locked dummy door, count: 1, notes: "In the north-east service block: 'The door is locked', never opens."}
  - {kind: "chest (trapped, random items)", count: 11, notes: "Market yard, den, woods camp, seer, three rim chests, the three-chest cache counted as three, and the hollow tree; trap level from the map card."}
  - {kind: award-locked chest, count: 1, notes: "The prize chest; card-game champion award."}
  - {kind: key-consumed vault, count: 1, notes: "The sealed vault; opens freely once the key has been used."}
  - {kind: well, count: 2, notes: The Might well and the bad well.}
  - {kind: fountain, count: 1}
  - {kind: buoy (one active), count: 4}
  - {kind: obelisk, count: 1}
  - {kind: buff pedestal, count: 1}
  - {kind: stat challenge, count: 1}
  - {kind: "reagent spot (skill-gated, once)", count: 2}
  - {kind: potion tree, count: 1}
  - {kind: label-only prop (sealed crates), count: 4, notes: Crate stacks at the harbour that only name themselves.}
  - {kind: story-shown model, count: 2, notes: The smuggler's ship (shown by its story bit) and the crystal (removed after the ending).}
  - {kind: map-load check, count: 3, notes: "The pirate landing, the ending, and the first-visit bit that makes this the party's starting town."}
  - {kind: timer check, count: 2, notes: "Pirates defeated, wolves cleared."}
  - {kind: ambient sound emitter, count: 1, notes: "A horse neighs now and then at the caravan stable (random, about one time in three)."}
