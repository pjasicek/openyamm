format: 0
level: L2
pitch: "Ravenshore is the merchant-ruled port at the heart of the continent and the party's home after the tutorial islands: a crowded harbour town of dark-elf, human and ogre households where every road, ship and caravan of the region meets. The town sits at sea level on the north-east shore of a wide bay, its market packed around a square dominated by a huge glowing crystal, a raised temple on the point beyond, two ships at the piers and a poorer lane village across the river mouth. Behind it a broad green basin, closed east and west by high upland walls and open to the north along a winding river, holds wolf-haunted woods in the west and a centaur meadow in the north-east, with six dungeon doors spread from the town square to a sea cave and a cliff-top chapel. It is played as a hub: shop, train, bank and take quests in town, make short low-level forays into the basin, leave by three roads, two ships or the guild caravans, and keep coming back; several doors stay shut until the story opens them."
purpose: "Regional hub and respawn town (home and death-return point once visited); the main-quest council hall and the endgame portal are both on its square. Second map of the campaign, lowest band after the starter islands. Play pattern: a service-dense town (nearly every service a short walk from the square), a wilderness ring of easy-to-medium fights, optional caches and stat bonuses, three road exits plus ships and caravans."
mood: "Busy, prosperous and safe in town, with a pleasant early-adventure countryside whose danger grows with distance."
datum: sea_level
