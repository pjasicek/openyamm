set_pieces:
  - id: check:pirates_defeated
    kind: scripted
    spaces: [town:ravenshore]
    rule: "During the invasion, when the whole pirate force is dead, the status line reads 'The Invaders have been defeated!' and the invasion ends."
    period: 7.5
    enabled_by: {qbit: pirates_invaded, kills: {group: pop:pirate_force, all: true}}
    gives:
      qbit: pirates_defeated
  - id: check:wolves_cleared
    kind: scripted
    spaces: [wild:wolf_woods, zone:den_mouth]
    rule: "The first time every dire wolf on the map is dead, one more wolf (a yearling) is summoned at the den and the wolf-hunt giver's bit is set; when that one is dead too, the status line reads 'You have killed all of the Dire Wolves' and the local quest is complete."
    period: 10
    enabled_by: {kills: {monster: Dire Wolf, all: true}}
    gives:
      - qbit: wolf_hunt_last_wolf
      - qbit: dire_wolves_cleared
    population:
      - {id: pop:last_wolf, slot: 3, groups: 1, per_marker: [1, 1], rank: a, notes: The straggler summoned at the den mouth.}
  - id: scripted:ending
    kind: scripted
    spaces: [town:ravenshore]
    rule: "On entering the map once all four lords are rescued: the ending movie plays, every character gains 100,000 experience, the council members go home to their own maps, townsfolk across the continent hail the party, and the crystal is removed for good."
    enabled_by: {qbit: all_lords_rescued}
    gives:
      qbit: endgame_seen
  - id: trigger:pirate_landing
    kind: scripted
    spaces: [town:ravenshore]
    rule: "On entering the map, from about two months (1,344 hours of the story clock) after the pirate leader on the islands is killed, unless the pirate fleet has been sunk first: the hidden pirate force appears, the party's bank balance is set to zero and the invasion begins."
    enabled_by: {qbit: pirate_leader_dead, not: {qbit: pirate_fleet_sunk}}
    gives:
      qbit: pirates_invaded
