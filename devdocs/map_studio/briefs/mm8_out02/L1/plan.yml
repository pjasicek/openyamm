    neighbour: door:wolf_den
    how: A den mouth at the foot of the west uplands' cliff.
    reached_by: off_road
goals:
  - id: goal:clear_wolves
    space: wild:wolf_woods
    kind: kill
    what: Every dire wolf on the map.
    gives:
      qbit: dire_wolves_cleared
    notes: "Completes a local quest; checked by set_pieces check:wolves_cleared."
keys:
  - id: key:card_game_champion
    grants: {award: 41}
    how: "The card-game champion award, won elsewhere."
  - id: key:conflux_key
    grants: {item: conflux_key}
    how: "Another map: the key is built late in the story."
  - id: key:council_hall_open
    grants: {qbit: council_hall_open}
    how: The campaign's opening quest.
  - id: key:emperor_thorns_key
    grants: {item: emperor_thorns_key}
    how: "Another map: a late-story key item."
points_of_interest:
  - id: poi:bad_well
    space: district:west_lanes
    kind: well
    behaviour: "Drink: 'not so refreshing', inflicts poison."
    reached_by: road
    notes: Near the town bridge.
  - id: poi:buff_pedestal
    space: zone:pedestal_knoll
    kind: pedestal
    behaviour: Grants the Earth Resistance buff.
    rule: native:buff_pedestal
    reached_by: off_road
    notes: "Top of the grassy knoll, among the centaurs."
  - id: poi:crystal
    space: zone:square
    kind: portal
    behaviour: Enters the endgame dungeon.
    also: [entrance:crystal, landmark:crystal]
    condition: {item: conflux_key}
    reached_by: road
  - id: poi:fountain
    space: district:harbour
    kind: fountain
    behaviour: "Drink: refreshing; sets the town's Town Portal anchor."
    gives:
      qbit: town_portal_ravenshore
    variants:
      - condition: {gold: {below: 100, include_bank: true}}
        behaviour: "Also gives 200 gold, at most twice in a game."
    reached_by: road
    notes: "Harbour plaza, beside the council hall."
  - id: poi:luck_buoy
    space: water:sea_and_bay
    kind: buoy
    behaviour: 5 skill points to the character who uses it.
    uses: {times: 1, per: party, reset: never}
    condition: {stat: {name: luck, at_least: 20}}
    reached_by: water
    notes: "One of the bay's four buoys, west of the harbour."
  - id: poi:might_well
    space: district:market
    kind: well
    behaviour: "Drink: temporary Might +25 while no Might bonus is active; records an autonote."
    reached_by: road
    notes: "East edge of the market, off the east street."
  - id: poi:obelisk
    space: wild:ne_meadow
    kind: obelisk
    behaviour: Gives one fragment of the continent's obelisk riddle.
    rule: native:obelisk
    uses: {times: 1, per: party, reset: never}
    reached_by: off_road
    notes: "Off the road, at the foot of the east cliffs about 9 cells east of the seer's ring."
  - id: poi:reagent_rock
    space: zone:pedestal_knoll
    kind: reagent_spot
    behaviour: Gives a random stat potion.
    uses: {times: 1, per: party, reset: never}
    condition: {stat: {name: disarm_trap_skill, at_least: 7}}
    reached_by: off_road
    notes: A rock on the pedestal knoll.
  - id: poi:reagent_tree
    space: wild:wolf_woods
    kind: reagent_spot
    behaviour: Gives a random reagent.
    uses: {times: 1, per: party, reset: never}
    condition: {stat: {name: disarm_trap_skill, at_least: 3}}
    reached_by: off_road
    notes: "A tree north of the west lanes, towards the river, about 17 cells east of the central-west junction."
  - id: poi:sealed_vault
    space: district:market
    kind: vault
    behaviour: "Opens with a late-story key item, then stays open."
    condition: {item: emperor_thorns_key, consume: true}
    reached_by: road
    notes: "North-east edge of the market, on the east street."
  - id: poi:stat_challenge
    space: district:waterfront_row
    kind: stat_challenge
    behaviour: "Top tier: a character with a stat of 200 gains 10 skill points."
    rule: native:stat_challenge
    uses: {times: 1, per: character, reset: never}
    condition: {stat: {name: any, at_least: 200}}
    reached_by: road
    notes: "In a garden ringed by small stones, flowers and trees."
landmarks:
  - id: landmark:crystal
    space: zone:square
    what: "The crystal, the tallest object in town."
    seen_from: [junction:town_bridge, district:west_lanes]
    notes: "Straight ahead from the town bridge; across the bay from the lanes."
  - id: landmark:obelisk
    space: wild:ne_meadow
    what: The obelisk in the north-east meadow.
  - id: landmark:sanctum
    space: district:temple_point
    what: The Sanctum's towers on the south-east point.
    seen_from: [district:market, district:harbour, water:sea_and_bay]
    notes: Closes the south end of the east street.
  - id: landmark:seer_ring
    space: zone:seer_ring
    what: "The seer's ring, a broad round stone platform."
  - id: landmark:ships
    space: district:harbour
    what: "Two ships at the piers: this is the port."
  - id: landmark:sw_headland
    space: wild:sw_headland
    what: "The highest mass of the map, framing the bay's west side and hiding the cove."
  - id: landmark:tomb
    space: zone:tomb
    what: "The tomb, a large block monument at the north-east cliff foot."
    seen_from: [zone:seer_ring]
    notes: Seen down the tomb road.
  - id: landmark:upland_walls
    spaces: [wild:upland_w, wild:upland_e]
    what: The upland walls east and west with their two notches.
    notes: The east cut screens Shadowspire (neighbour edge:shadowspire is screened).
sightlines:
  - id: sight:harbour_plaza
    from: district:harbour
    to: [landmark:ships, landmark:sanctum]
    what: "The ships to the west, the temple to the south-east."
  - id: sight:north_arrival
    from: edge:north
    to: [water:river, water:sea_and_bay]
    what: The river leads the eye south to the bay and the skyline.
  - id: sight:town_bridge
    from: junction:town_bridge
    to: [landmark:crystal]
    what: The crystal straight ahead across the bridge.
  - id: sight:west_lanes
    from: district:west_lanes
    to: [district:market, landmark:crystal]
    what: Across the river mouth to the market's towers and the crystal.
set_pieces:
  - id: check:wolves_cleared
    kind: scripted
    spaces: [wild:wolf_woods]
    rule: "When every dire wolf on the map is dead, the local quest is complete."
    enabled_by: {kills: {monster: Dire Wolf, all: true}}
    gives:
      qbit: dire_wolves_cleared
height_bands:
  - id: band:basin
    range: [0, 1350]
    spaces: [wild:basin, wild:wolf_woods, wild:ne_meadow]
    notes: "Sea level at the coast to a few hundred inland; knolls to about 1,000-1,350."
  - id: band:headland
    range: [2000, 6400]
    spaces: [wild:sw_headland]
    notes: The inlet it encloses is at sea level.
  - id: band:town
    range: [0, 640]
    spaces: [town:ravenshore, district:market, district:harbour, district:temple_point, district:waterfront_row, district:west_lanes]
    notes: "The town is flat: sea-level market pads, lanes slightly raised (128-192), temple terrace about 640 up."
  - id: band:uplands
    range: [2000, 3700]
    spaces: [wild:upland_w, wild:upland_e]
    notes: "Typically 2,200-2,500; the west rises to about 3,700, the east to about 3,100-3,300. Each cut to sea level by one pass."
states:
  - id: state:pirate_invasion
    condition: {qbit: pirates_invaded}
    population:
      - {id: pop:pirate_force, role: pirate raiders, groups: 80, placed: true, strength: heavy, rank: mixed, hostile: true, hidden_until: {qbit: pirates_invaded}, notes: "A hidden force that a story event reveals in town; not baseline density."}
    notes: "The rest of this state (locked houses, the bank emptied, the end when all are killed) is L2."
landform:
  relief: "0 to 6,400. A low rolling basin (the middle three-fifths of the width, from the bay to the north edge) between flat-topped uplands (the outer fifth on each side, typically 2,200-2,500, rising to about 3,700 in the west and 3,100-3,300 in the east) with steep rock faces along their whole length, each cut to sea level by one pass (west a little north of the middle, east about the middle). A south-west headland of rock ridges rises to about 6,400. The town is flat."
  height_range: [0, 6400]
  water: "Open sea across the whole southern fifth to quarter and a broad bay biting north into the south-west and south-centre almost to the map's middle. A river enters the north edge just west of centre and winds to the bay's north-east corner (course under spaces, water:river); two crossings: the upper bridge and the town bridge. A small cliff-ringed sea inlet inside the headland opens south."
  water_share: 0.25
  coast: "The town is on the bay's north-east shore; the east shore curves away south-east to the corner. The south-west headland forms the bay's west arm."
  caps:
    - {kind: bare rock, where: The south-west headland's ridges.}
  rim: {width_share: 0.2, broken_by: [road:west_pass, road:east_cut], notes: "East and west only: the north is open grassland along the river and the south is sea."}
diagram: {text: "North up, not to scale.\n                            [Alvar] N-edge\n   W UPLANDS                    |  north road, east side of river        E UPLANDS\n   (rim chest)        hollow-tree chest                                   (rim chests)\n                      (N-jct)=====loop road====[Seer ring]  [Obelisk]\n   [Den]* bones          ||upper bridge          NE MEADOW: centaurs,\n     WOLF WOODS         (river)                  pedestal knoll, 3-chest camp\n [Garrote]==W pass==(W-jct)  \\                          [Tomb] at cliff foot\n      |   camp+chest   \\    (CW-jct)--reagent tree          river loops\n  [Chapel] on spur      \\___/     \\                          \\        (E-jct)==E cut==[Shadowspire]\n                                   \\__north-shore road__ WEST LANES ==T-bridge== MARKET  (vault, prize chest)\n  SW HEADLAND (highest)                           (bad well, 2nd tavern)   [Crystal] square  (Might well)\n   [Smuggler's Cove] in                  BAY (buoys)          council hall | 3 service blocks\n   cliff-ringed inlet                                  HARBOUR: fountain, piers, 2 ships, inn\n                                                                              [Sanctum] on the point\n                                OPEN SEA (whole south)\n"}
