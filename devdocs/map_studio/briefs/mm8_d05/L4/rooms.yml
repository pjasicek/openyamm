    notes: "Sector 18: a rock cave about 2560 by 1920 under a dome (the rock roof rises from about 250 above the walls' foot to about 840 in the middle, steeply at first and then flatter; here one leaning roof from -384 at the walls to a flat top at 200 that is 0.4 of the cave's size). The floor is a bowl: the lake bed at -896 is the original's floor face (16 of its 17 corners) and banks fall to it from every wall's foot (-640), each bank's run the distance from its side of the bed to the wall it faces, less 1 (a bank that reaches the wall is refused). The banks rise 1.0 to 1.06 for each unit of run (normal 0.69 to 0.71): the game walks up them, the build calls them steep (`steep_floor`). A paved causeway crosses the lake west to east, a slab 64 thick (top -704, underside -768) with water under it, hanging from the bed (`base`), from the passage to a stand against the east wall where the Prophecies of the Snake lies; ramps fall to it from -640 at each end wall over 256, standing on the banks, and the fill under each end of the slab faces the lake as the original's does. A niche in the north wall behind a rising slab holds another book; a rock stand against the east wall at the causeway's end, with a recess in the wall above it, holds a Diamond."
