      - {id: platform:pit_floor, at: [6656, 2432], size: [768, 768], rise: 1, surface: {texture: t6502b, size: [128, 128]}, visible: false, base: 128, notes: "The original's unseen floor (face 2190, T6502B, invisible) across the shaft at -1023, just over the spikes' points: solid, not drawn, and it runs event 101 when the party lands on it."}
    levels:
      - id: level:pit
        outline: [[6272, 2048], [7040, 2048], [7040, 2816], [6272, 2816]]
        floor: -1152
        bank: 254
        edge: {texture: t65b02, size: [128, 128]}
        surface: {texture: t65b02m, size: [128, 128]}
    notes: "Sectors 11 and 21. The floor is four plates (objects.yml movers plate_w, plate_e at -656 over plate_s, plate_n at -704) that meet over a funnel round a pit 768 square (sector 21). Using the far door from inside shuts both doors and draws the plates back into the walls at 10 units a second; eight lit panels on the walls must all be put out, and a timer then stops the plates and opens the doors. Touching the funnel or the pit's floor kills the party (event 101). In the original the funnel falls from the walls' foot (-736) 272 over 256 to the pit's mouth (-1008) and the pit's walls stand upright from there to its floor (-1152). A funnel above a shaft cannot be said: a hole needs a level floor above it (`in: floor` refuses a sloped upper room) and a level may not stand inside another level. Drawn as one sunken level whose banks fall from the walls' foot straight to the pit's floor (416 over 254, `steep_floor`; the plates' stubs stand on the 2 units of level floor left at the walls): the top edge is the original's, the bank lies up to 144 under the original's funnel at the mouth. The pit's unseen killing floor at -1023 is a slab 1 thick across the pit's floor outline (`visible: false`) over 36 spikes that taper from 16 square to 2 over 128, as measured; event 101 is on it, on the bank and on the pit's floor."
