  - id: evt:panel_1
    preset: script
    source: switch:panel_1
    title: Button
    condition: {all: [{map_var: trap}, {not: {map_var: solved}}]}
    lua: |-
      if IsAtLeast(MapVar(panel_1), 1) then
          SetValue(MapVar(panel_1), 0)
          evt.SetTexture(43, "t65b11c")
          evt.SetLight(1, 1)
      else
          SetValue(MapVar(panel_1), 1)
          evt.SetTexture(43, "t65b11b")
          evt.SetLight(1, 0)
      end
    notes: "Event 102: while the trap runs and is not solved, a press puts a lit panel out (its picture dark, its light off) and a second press lights it again, as the original's toggle (map variable 12 counts the dark ones there; here panel_1 says whether this one is dark, and the timer wants all eight dark). Before the trap and after it is solved a press does nothing, as in the original. Textures by the switch's cog 43, the light by its number 1 (ids.lock.yml)."
