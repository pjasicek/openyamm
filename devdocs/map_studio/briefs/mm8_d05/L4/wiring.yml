  - id: evt:fall
    preset: script
    source: room:hall8
    trigger: step
    condition: {map_var: {name: 56, equals: 2}, not: {map_var: 57}}
    effects:
      - secret:
          of: platform:walk_a
          face: top
      - secret:
          of: platform:walk_b
          face: top
      - add:
          var:
            map_var: 56
          value: 1
    else_effects:
      - lua: |-
          if IsAtLeast(MapVar(57), 1) then return end
          if IsAtLeast(MapVar(56), 3) then return end
          AddValue(MapVar(56), 1)
          if IsAtLeast(MapVar(56), 3) then return end
          SetValue(MapVar(57), 1)
    notes: "Event 451: a fall from the walkway is counted (map variables 56 and 57 for the original's 13 and 14, which the build's named variables take) (once until the walkway is walked again). The third (the count at 2, armed) marks the walkway's top as secret, as the original's SetFacetBit(15, IsSecret) marks its 22 top faces, and counts it; the other falls as before."
