  - id: evt:crusher_reset
    preset: switch
    trigger: load
    condition: {not: {map_var: solved}}
    opens: [mover:plate_w, mover:plate_e, mover:plate_s, mover:plate_n]
    closes: [door:d108, door:d109]
    effects:
      - set:
          var:
            map_var: trap
          value: 0
      - set:
          var:
            map_var: panel_1
          value: 0
      - set:
          var:
            map_var: panel_2
          value: 0
      - set:
          var:
            map_var: panel_3
          value: 0
      - set:
          var:
            map_var: panel_4
          value: 0
      - set:
          var:
            map_var: panel_5
          value: 0
      - set:
          var:
            map_var: panel_6
          value: 0
      - set:
          var:
            map_var: panel_7
          value: 0
      - set:
          var:
            map_var: panel_8
          value: 0
    notes: "Event 2, first path: on entering, the unsolved trap room is reset (both doors shut, the plates out, the panels counted afresh)."
  - id: evt:crusher_solved_load
    preset: switch
    trigger: load
    condition: {map_var: solved}
    opens: [door:d108, door:d109, mover:plate_w, mover:plate_e, mover:plate_s, mover:plate_n]
    notes: "Event 2, second path: once solved, both doors stand open and the plates are out."
  - id: evt:crusher_timer
    preset: switch
    trigger: timer
    every: 5
    condition: {all: [{map_var: trap}, {map_var: panel_1}, {map_var: panel_2}, {map_var: panel_3}, {map_var: panel_4}, {map_var: panel_5}, {map_var: panel_6}, {map_var: panel_7}, {map_var: panel_8}, {not: {map_var: solved}}]}
    lua: |-
      evt.StopDoor(115) -- mover:plate_w (numbers of ids.lock.yml)
      evt.StopDoor(112) -- mover:plate_e
      evt.StopDoor(114) -- mover:plate_s
      evt.StopDoor(113) -- mover:plate_n
    opens: [door:d108, door:d109]
    sets: {map_var: solved}
    notes: "Event 110 (every 5 half-minutes): when all eight panels are out, the plates stop where they are and both doors open. Stopping a mover has no word; the Lua calls the game's StopDoor."
  - id: evt:crusher_trap
    preset: switch
    source: door:d109
    side: room:crusher
    title: Door
    condition: {not: {map_var: trap}}
    lua: |-
      evt.SetTexture(43, "t65b11c") -- switch:panel_1 lit (cog of ids.lock.yml)
      evt.SetTexture(44, "t65b11c") -- switch:panel_2 lit (cog of ids.lock.yml)
      evt.SetTexture(45, "t65b11c") -- switch:panel_3 lit (cog of ids.lock.yml)
      evt.SetTexture(46, "t65b11c") -- switch:panel_4 lit (cog of ids.lock.yml)
      evt.SetTexture(47, "t65b11c") -- switch:panel_5 lit (cog of ids.lock.yml)
      evt.SetTexture(48, "t65b11c") -- switch:panel_6 lit (cog of ids.lock.yml)
      evt.SetTexture(49, "t65b11c") -- switch:panel_7 lit (cog of ids.lock.yml)
      evt.SetTexture(50, "t65b11c") -- switch:panel_8 lit (cog of ids.lock.yml)
    closes: [door:d108, door:d109, mover:plate_w, mover:plate_e, mover:plate_s, mover:plate_n]
    sets: {map_var: trap}
    effects:
      - lights_on: [light:panel_1, light:panel_2, light:panel_3, light:panel_4, light:panel_5, light:panel_6, light:panel_7, light:panel_8]
    notes: "Event 63: using the far door (its source) from inside shuts both doors, draws the four plates back into the walls and lights the eight panels. The doors and plates are the preset's `closes` list; the eight panel lights go on (`lights_on`, the original's SetLight(1..8, 1)); changing the eight panels' texture stays Lua with their cog numbers from ids.lock.yml (one `texture` per event, and it takes a cog number, not a switch's name). The original has it on the inner faces of both doors and opens door 109 from the corridor's side (event 64); here it is the far door from inside (`side`), and evt:crusher_trap_w the near door from inside."
  - id: evt:crusher_trap_w
    preset: switch
    source: door:d108
    side: room:crusher
    title: Door
    condition: {not: {map_var: trap}}
