notes: "The Lincoln (7d23.blv) in its own frame. Five levels: 224 (hangar, lower corridor, lower hold), 1036 (hall floor, cargo bays, corridors, reactor room), 1484 (hall gallery, reactor gallery, engineering, east landing), 1548 (bridge) and 1868 (top deck). The hall is one room: its gallery and bridge are platforms against the walls and the stairs from the lobby come up through a hole in its floor. Since round three the cargo pit and the reactor lift tube are holes in the floors above with the lifts rising through them; the pod bays are shafts with two moving decks each, opening onto the walkway over their mouths; the upper east lift shares its room with the top landing round its head; the west lift opens through two funnel mouths one above the other; the engineering station has its vestibule and wall lockers; the bridge has its hipped ceiling with the stepped dome on its top. What still stands in for something the rooms cannot say (NOTES.md has each in full): the hall vault is one leaning ceiling level (the original is faceted); the bridge ceiling top is a rectangle over the dome (the original's top has seven corners); the cargo bays' rails stand 1 unit inside their channel; the pilot pits and the hold's trenches are sunken levels with steps where the original has slopes; the corridors' six-sided section is a wall with three bands; the hall's raking buttresses and the reactor's invisible drum are not built."
