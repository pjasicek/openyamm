notes: "Doors, lifts, movers, chests, spawn points and lights stand at the original's positions. Doors slide sideways as the original's leaves do (two halves where the original has a pair), except two (corr_lift_e1 in two halves, corr_cell2 to the south) where a leaf needs room in the wall that the original's folding leaves do not. Movers: the pod bays' decks (doors 1 to 8; chest 1 rides bay 2's lower deck), the rim round the cargo pit (38), the stasis beds (52 to 58), the two cranes (14, 44). The 17 monsters and 5 lying items of the original stand at their places; the four chests hold the original's fixed items and are trapped. Of the original's 267 lights the 182 the game ever lights are here (radius 0 in the file; 96 here). Placeholders hold the 20 item spawn points."
