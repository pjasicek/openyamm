format: 0
level: L1
pitch: "A ruined moon temple half swallowed by a cave system on the island where new parties first land. The way in is a long, dark, winding cave of rough rock: two broad caverns with rock pillars to walk round, side pockets that climb to high ledges or sink into a spider pit, and only bats, rats and spiders in small packs. At the far end, steps cut into the rock become masonry and drop into the temple: a sunken octagonal nave under a tall open dome, a raised apse with the moon altar, colonnaded side aisles, and two mirrored wings beyond, a dormitory and a library, held by a handful of human temple guards far tougher than the vermin. Every few moments a pair of fire bolts sweeps the lane in front of the altar from both wing corridors. A blank wall in the library lifts to reveal a hidden study. Three of the island scavenger hunt's six items are here: the moon floor tile in the hidden study, the wealthy hat in a dormitory chest and the longbow carried by the guard captain."
purpose: "Starter dungeon. The party comes for the Emerald Island scavenger hunt (return six items to the judge on the island): this dungeon holds three of them, each fetched a different way (a floor item in a secret room, a fixed chest item, an actor's drop). Secondary: first spell scrolls and two spellbooks from bookcases, a few low chests. Encounter slots are bats, rats and spiders at the lowest tier; four fixed human guards in the temple wings, several levels above the vermin, are the real fight and the only humanoids. No named boss. Density rises at the cave pockets and peaks in the nave."
mood: "Damp natural cave giving way to violet torchlit stone; a first dungeon, short to walk, easy to fight, with one sharp step up in danger at the temple doors."
