set_pieces:
  - id: set:fire_bolt_crossfire
    kind: trap
    spaces: [room:wing_corridor_n, room:passage_n, zone:apse, room:passage_s, room:wing_corridor_s]
    path: [room:wing_corridor_n, room:passage_n, zone:apse, room:passage_s, room:wing_corridor_s]
    emitters:
      - {space: room:wing_corridor_n, end: east, direction: s}
      - {space: room:wing_corridor_s, end: east, direction: n}
    effect: {spell: Fire Bolt, level: "novice, skill 2"}
    rule: "Two fire bolts fire at floor height in opposite directions along one north-south lane between the two emitters. The lane runs through both wing passages and across the apse between the altar and the nave steps, so anyone going between the nave and either wing crosses it. A torch marks each emitter end."
    period: 2.5
    notes: "Runs on a timer (every 5 half-minutes of game time) for as long as the map is loaded; nothing disables it. Each bolt is aimed at the other emitter."
  - id: set:temple_descent
    kind: vista
    spaces: [room:temple_stair, room:moon_nave, void:dome, zone:apse]
    rule: "Rough rock turns to cut stone on the stair, a straight flight down the nave's axis with the dome and its glow ahead; the nave sits lowest, the apse and wings one step-run higher."
mechanisms:
  - {kind: double sliding door, count: 2, notes: "Door hall to anteroom, both wings. Two leaves each slide 160 sideways apart at door speed 50, and a 15-unit seam strip between them withdraws as they open. A click on the leaves or on the door hall's buttresses, from either side, opens all three for good; there is no close."}
  - {kind: secret lifting wall, count: 1, notes: "The library's east wall into the hidden passage: a secret-flagged face found by perception (map perception difficulty 0). A click from either side lifts it 256 at door speed 50 into its slot; it stays open."}
  - {kind: timed spell trap, count: 1, notes: "The fire-bolt crossfire (set:fire_bolt_crossfire): two Fire Bolt casts, novice skill 2, every 2.5 game minutes; no trigger plate, no switch."}
  - {kind: chest, count: 5, notes: Cabinet chests in the dormitory's west alcove.}
  - {kind: secret wall chest, count: 2, notes: "A secret-flagged rock face that opens as a chest: south cavern and spider sinkhole."}
  - {kind: one-shot bookcase, count: 15, notes: "Clickable bookcase faces, each giving its one item once (a map variable per bookcase): 10 in the library, 5 in the hidden study."}
  - {kind: exit face, count: 1, notes: "The clickable mouth panel at the top of the ramp: 'Leave the Temple of the Moon', to Emerald Island."}
