atmosphere: "Dark throughout: every space has the same low minimum ambient light (about a tenth of full), no fog, no weather, no placed ambient sounds; the map's sound environment is a cave and music track 28 (an MM7 dungeon track) plays everywhere. The caves are unlit and bare: the party's own light, rough rock, nothing else. The temple is lit only by its own lights: 21 violet-flame wall torches (about 1.5 per M units² of temple floor; corridors one per about 640 of length, rooms one or two per wall, the hidden study none) and no other lights (the original's four light records on the dome's axis and in the hidden study give no visible light in the game), so the sanctum glows red under violet side light. Density of light rises from none (caves) to violet torchlight (wings) to the red dome glow (nave)."
