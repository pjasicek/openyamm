notes: "The to-scale sketch of the plan, in whole map units (every corner on a 32 grid): x east and y north in the original's frame, heights from the plan's datum, the arrival floor (0). Cave outlines are designer's simplifications measured from the original, not traces, and their heights were refitted by compare-and-fix rounds against the original (2026-11-12): the level caves have 8 to 31 points and rough walls (step 128, depth 40, so every solid stretch of 256 or more is broken up; the default 192 would leave most of these shorter walls straight), the ramps 4 to 6 points and smooth walls (a ramp must be convex, and only level floors take rough walls). The temple's axis is the line y 5952; the south wing mirrors the north wing across it, except the library and the hidden rooms. Walls have their real thickness where the original has walls: 64 at the double doors and the alcove arch, 32 at the lifting wall, 128 to 192 between the wing rooms and the corridors. Where the original's opening is a face of one space alone (thickness 0: the temple's arches into the passages, the stair's arch into the nave, the anterooms' mouths into the dormitory and the library, the hidden passage's mouth into the study), the rooms stand 32 apart, and where caves meet with different ceilings they stand 16 apart: two rooms' walls in one plane show through each other, and rooms cannot give a wall to one side only. Caves run into each other through full-width mouths that deep. The north cavern's mouth into the temple stair and the nave's mouths into its aisles and its apse still touch (each takes the whole wall, up to both ceilings). A plan space is one room except where a ramp or a flight must be its own straight, convex room: the descent bend (4 rooms), the east climb (5), the north cavern (4), the west descent, the west neck, the northeast chamber and the northeast pocket (2 each), and the temple stair (2); the extra rooms name their space. Ramps take a ceiling that slopes with the floor, where the original's cave ceilings rise and fall with it (each long ramp is one room), and a few level caves take the lean of the original's ceiling. The nave is one room on its sunken floor with the gallery round it as a raised level against its walls, open on the east where the temple stair comes down onto the sunken floor; the west steps are a flight with raking side walls; the dome (void:dome) as a raised ceiling level that narrows to its cap, not a room, with raking beams for its ribs; the temple stair's flight has a ceiling that slopes down to its arch; the altar is two stacked platforms. Every floor change between the arrival and the goals is a ramp, a flight or a level doorway, so the whole map is walkable both ways; the only drops are the 128 ledges from the nave's gallery onto its sunken floor, which the steps bypass. Rock islands are outlines of their own, cut out of the floor (the original's four: two in the south cavern, one each in the north cavern and the west descent); the aisles' columns are 8-sided pillars; furniture is platforms. Rooms set no ambient level: the original's sectors use the default, and the plan's darkness comes from the map's own ambient level and its lights."
