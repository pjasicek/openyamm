    notes: "One room on the sunken floor (-544) with the gallery round it as a raised level at the rim's height (-416, level with the aisles and the apse) against its north, west and south walls; on the east the sunken floor runs to the walls, as in the original. The steps up to the apse: 6 steps 320 wide on the axis, the first riser 640 in from the apse (x -1856, as in the original), between side walls that rake down with the flight (the flight's `sides`, 64 above the steps: the original's parapets, 32 thick, stand 64 above the sunken floor at the foot and 64 above the rim at the head, 192 above the sunken floor; here they are 85 above the floor at the foot, since the flight's sides stand as high above its first step as above its head), the last step level with the gallery and ending 16 into its 32 strip (a flight's head must stand on the higher floor). The temple stair comes down its 9 steps through the pointed arch in the middle of the east wall straight onto the sunken floor. Ceiling at +96 (640 above the sunken floor) with the dome opening over the centre. The dome is a ceiling level that narrows as it rises (see its notes). Its collar is a ring of beams 48 wide and 32 deep just inside the opening's edge (16 to 64 inside it, +96 to +128), in two halves, 'wall' as in the original (whose collar is an upright band 128 high, +96 to +224, which a leaning side cannot keep). Its ribs, measured: four half-ribs 64 wide on the temple axis and the cross axis (two ribs crossing under the crown), each climbing from the collar up the dome's side to a small dark 'wall' cap about 200 across; here each is a raking beam 64 wide and 64 deep under the leaning side, from the collar's top (+128, about 500 from the centre) up to +712 at the cap's edge (272 from it), then a beam under the cap (+736 to +800) to a block 160 square at the centre, the original's small cap. The original has no parapet along the gallery's open ledges. The nave itself has no torches. Walls: the nave's own bands, measured from the sunken floor so that they keep the original's heights: the twb3 arcade band to -416 (the ledge's height; behind the gallery it lies below the gallery's floor and does not show), the 7tws2 brick dado to -160 (256 above the gallery, as on the aisles and the apse) and the theme's twb1 plaster above. Still not drawable: the 128 ledge's arcade relief; the stair walls' 'wall' tops (the sides take one surface, 7tfb11); the dome's curve (its side is one straight slope from the ceiling, without the upright collar) and the ribs' curve with it (each is one straight rake)."
