notes: "Calibration brief, level L4 (Temple of the Moon, Emerald Island starter dungeon): the L3 sketch plus themes, objects.yml and wiring.yml, built as a playable map. plan.yml stays at level L3, the highest the plan schema knows. Every slot is its family's lowest tier. Its map_stats id is 9706; no reference row is set. Three of the items are the Emerald Island scavenger hunt items this map delivers; their quest bits (qbits) are set by the hunt's start on Emerald Island and cleared by the judge there when the item is handed in: this map neither sets nor tests them. The rest are the bookcase scrolls and spellbooks. The map descends from its south-east (arrival, high pockets) to the temple in the north-west."
