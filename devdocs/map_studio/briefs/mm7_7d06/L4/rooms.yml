notes: "The to-scale sketch of the plan, in whole map units (every corner on a 32 grid): x east and y north in the original's frame, heights from the plan's datum, the arrival floor (0). Cave outlines are designer's simplifications measured from the original, not traces, and their heights were refitted by compare-and-fix rounds against the original (2026-11-12): the level caves have 8 to 31 points and rough walls (step 128, depth 40, so every solid stretch of 256 or more is broken up; the default 192 would leave most of these shorter walls straight), the ramps 4 to 6 points and smooth walls (a ramp must be convex, and only level floors take rough walls). The temple's axis is the line y 5952; the south wing mirrors the north wing across it, except the library and the hidden rooms. Walls have their real thickness where the original has walls: 64 at the double doors and the alcove arch, 32 at the lifting wall, 128 to 192 between the wing rooms and the corridors. Cave mouths 16 deep take a cfb1 rock-floor threshold (`threshold`), as the original's floor runs through them. Where the original's opening is a face of one space alone (thickness 0: the temple's arches into the passages, the stair's arch into the nave, the anterooms' mouths into the dormitory and the library, the hidden passage's mouth into the study), the rooms stand 32 apart, and where caves meet with different ceilings they stand 16 apart: two rooms' walls in one plane show through each other, and rooms cannot give a wall to one side only. Caves run into each other through full-width mouths that deep. The north cavern's mouth into the temple stair and the nave's mouths into its aisles and its apse still touch (each takes the whole wall, up to both ceilings). A plan space is one room except where a ramp or a flight must be its own straight, convex room: the west descent, the northeast chamber and the northeast pocket (2 each: a ramp at their mouth), the anterooms (2 each: the square and the vaulted arm) and the temple stair (3: the run, the flight and the landing at its foot); the extra rooms name their space. Since round four the caves whose floors twist (the north cavern, the descent bend, the east climb, the west neck) are one room each, with uneven floors and roofs (`floor_points`, `ceiling_points`: heights where the surface changes slope, measured from the original, flat triangles between), and the other caves have measured roofs. The remaining ramps take a ceiling that slopes with the floor. The nave is one room on its sunken floor with the gallery round it as a raised level against its walls, open on the east where the temple stair comes down onto the sunken floor; the west steps are a flight with raking side walls; the dome (void:dome) as four stacked ceiling levels (an upright collar and three leaning bands to the cap), not a room, with raking beams just under the bands for its ribs; the temple stair's flight has a ceiling that slopes down to its arch; the altar is two stacked platforms. Every floor change between the arrival and the goals is a ramp, a flight or a level doorway, so the whole map is walkable both ways; the only drops are the 128 ledges from the nave's gallery onto its sunken floor, which the steps bypass. Rock islands are outlines of their own, cut out of the floor (the original's four: two in the south cavern, one each in the north cavern and the west descent); the aisles' columns are 8-sided pillars; furniture is platforms (the searched bookcases are platforms with ids, clicked); the cabinets are chests in objects.yml, the two rock-face chests clicked wall panels (panels with ids) that open theirs. Every room takes its base darkness from the defaults: ambient 24, the original's level in every sector, so the light comes from the torches alone. L4 adds the themes' reveal and door surfaces and the base darkness, and moves the dormitory cabinets and the searchable bookcases out to objects.yml as chests. Outlines are the L3 sketch's."
