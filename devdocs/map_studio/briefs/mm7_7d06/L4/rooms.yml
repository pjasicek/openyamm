format: 0
themes:
  - id: theme:rough_cave
    wall: {texture: cwb1, size: [128, 256]}
    floor: {texture: cfb1, size: [128, 128]}
    ceiling: {texture: cwb1, size: [128, 256]}
    reveal: {texture: cwb1, size: [128, 256]}
    notes: "The cave set (the plan's mm7_rough_cave, region:caves): cwb1 rock on walls and ceilings, cfb1 rock floor, and cwb1 on the sides, tops and thresholds of the 16-deep mouths between caves (the original's cave mouths are plain cwb1 rock: its few cws1 faces are nowhere near a mouth). The two secret rock-face chests are cws1d wall panels with ids and the exit is a plain dark panel (both in objects.yml). No lights, no decorations."
  - id: theme:temple_inner
    wall: {texture: 7tws2, size: [128, 256]}
    bands:
      - {height: 256, surface: {texture: twb1, size: [128, 256]}}
    floor: {texture: 7tfb11, size: [128, 128]}
    ceiling: {texture: wall, size: [128, 256]}
    reveal: {texture: twb1, size: [128, 256]}
    notes: "The plan's mm7_temple_masonry as the wings' inner rooms wear it (dormitory and its alcove, library, hidden passage, hidden study), measured from the original's wall faces: a twb1 dressed-stone dado 256 high (its frieze along its top), the 7tws2 brick above it to the ceiling (its own frieze under the ceiling), 7tfb11 floor, the plain 'wall' stone overhead, and plain twb1 in the doorways (the alcove's arch has twb1 sides, a twb2 top and the 7tfb11 floor through it); the doorways take a 7tfb11 threshold."
  - id: theme:temple_masonry
    wall: {texture: tws2b, size: [128, 256]}
    bands:
      - {height: 256, surface: {texture: twb1, size: [128, 256]}}
    floor: {texture: 7tfb11, size: [128, 128]}
    ceiling: {texture: wall, size: [128, 256]}
    reveal: {texture: twb3d, size: [128, 256]}
    door: {texture: t1d1, size: [256, 256]}
    notes: "The plan's mm7_temple_masonry as the wings' halls wear it (corridors, door halls, anterooms), measured from the original's wall faces: a twb1 dressed-stone dado 256 high (its frieze along its top), above it to the ceiling the tws2b brick with its ram skulls and the frieze under the ceiling; 7tfb11 patterned stone floor, the plain 'wall' stone on the flat ceilings (the original's wing ceilings are 'wall'; twb2 is only on their vaults), twb3d edging in doorways, the t1d1 double-door leaves. The original's few tws2a faces (the skull frieze without the brick below it) on the vault ends are not drawn."
  - id: theme:temple_nave
    wall: {texture: twb1, size: [128, 256]}
    bands:
      - {height: 256, surface: {texture: 7tws2, size: [128, 256]}}
    floor: {texture: 7tfb11, size: [128, 128]}
    ceiling: {texture: twb2, size: [128, 256]}
    reveal: {texture: twb3d, size: [128, 256]}
    notes: "The plan's mm7_temple_masonry as the nave, the aisles, the apse and the passages wear it (the stair's flight takes its floor, ceiling and edging, with its own twb2 walls), measured from the original's wall faces: the 7tws2 brick dado 256 above the rim floor (its frieze along its top), the twb1 plaster above it to the ceiling (its frieze under the ceiling), 7tfb11 patterned stone floor, twb2 overhead, twb3d edging. The nave sets its own bands from its sunken floor (the twb3 arcade band below the same dado and plaster, at the same heights); its gallery's ledge wears twb3 and the dome twb1a, set on the nave's level and ceiling level; the columns wear tfb2; the passages wear their own band."
  - id: theme:temple_stair
    wall: {texture: cwb1, size: [128, 256]}
    floor: {texture: 7tfb1, size: [128, 128]}
    ceiling: {texture: cwb1, size: [128, 256]}
    reveal: {texture: twb3d, size: [128, 256]}
    notes: "The temple stair's level run, measured from the original's wall faces: the twb1 plaster 256 high on every wall (one face from the floor up, its frieze along the top), the rough cwb1 rock above it, where the original's rock vault springs from the walls' tops (256 above the floor) and rises 128 to its flat crown, the 7tfb1 stone floor and the cwb1 rock overhead. The run's own bands give the plaster; the theme's wall is the vault's rock above them."
