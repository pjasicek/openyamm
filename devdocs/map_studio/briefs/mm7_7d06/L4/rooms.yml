 floor and does not show), the 7tws2 brick dado to -160 (256 above the gallery, as on the aisles and the apse) and the theme's twb1 plaster above. Still not drawable: the 128 ledge's arcade relief; the dome's curve (three straight bands) and the ribs flush with it (a leaning side takes one surface, so the ribs are beams under it); the west steps' own heights (the original's five 128 treads rise 28 then 20 each to -436 with the last riser into the apse at x -2496; a flight ends on a floor of its own room, so the steps here rise evenly onto the 32 strip)."
