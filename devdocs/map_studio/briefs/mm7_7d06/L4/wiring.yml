  - id: evt:button_n
    preset: switch
    source: switch:button_n
    title: Door
    opens: [door:double_n]
    once: true
    notes: "The button beside the north double door: like a click on the door itself, it opens both leaves for good (the original's event 3 presses the button in and opens doors 7 and 8)."
  - id: evt:button_s
    preset: switch
    source: switch:button_s
    title: Door
    opens: [door:double_s]
    once: true
    notes: The button beside the south double door (the original's event 2).
  - id: evt:chest_cabinet_1
    preset: chest
    source: chest:cabinet_1
    title: Chest
  - id: evt:chest_cabinet_2
    preset: chest
