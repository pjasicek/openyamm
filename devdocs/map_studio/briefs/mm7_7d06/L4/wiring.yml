    title: Chest
  - id: evt:chest_cabinet_3
    preset: chest
    source: chest:cabinet_3
    title: Chest
  - id: evt:chest_cabinet_4
    preset: chest
    source: chest:cabinet_4
    title: Chest
  - id: evt:chest_cabinet_hat
    preset: chest
    source: chest:cabinet_hat
    title: Chest
    notes: "The cabinet with the Wealthy Hat (scavenger hunt); the hat is a fixed item of the chest, so taking it needs nothing else here."
  - id: evt:chest_rock_sinkhole
    preset: script
    source: panel:rock_chest_sinkhole
    title: Chest
    effects:
      - open_chest: chest:rock_sinkhole
    notes: "As the original's event 26 (title Chest, OpenChest(6)) on the rock face f2236: the panel in the sinkhole's west wall opens the chest."
  - id: evt:chest_rock_south_cavern
    preset: script
    source: panel:rock_chest_south_cavern
    title: Chest
    effects:
      - open_chest: chest:rock_south_cavern
    notes: "As the original's event 27 (title Chest, OpenChest(7)) on the rock face f39."
  - id: evt:door_double_n
    preset: door
    source: door:double_n
    title: Door
    action: open
    notes: "North wing double door: a click from either side opens it for good; there is no close."
  - id: evt:door_double_s
    preset: door
    source: door:double_s
    title: Door
    action: open
    notes: "South wing double door, on the critical path."
  - id: evt:exit
    preset: exit
    source: exit:mouth
    title: Leave the Temple of the Moon
  - id: evt:fire_bolts
    preset: script
    trigger: timer
    every: 5
    effects:
      - cast:
          spell: 2
          from: [-2619, 7850, -415]
          to: [-2619, 4008, -415]
          mastery: normal
          level: 2
      - cast:
          spell: 2
          from: [-2619, 4050, -415]
          to: [-2619, 7896, -415]
          mastery: normal
          level: 2
    notes: "The fire-bolt crossfire, as the original's event 51: every 5 half-minutes of game time (5 seconds of play) for as long as the map is loaded, Fire Bolt (normal mastery, skill 2) is cast twice along the lane at x -2619, one unit above the wing floors, from the north corridor's east end (y 7850) south through the north passage, across the apse's strip and through the south passage to the south corridor (y 4008), and from there (y 4050) back north. The torches at the corridors' east ends mark the two points."
  - id: evt:secret_wall
    preset: door
    source: door:secret_wall
    title: Door
    action: open
    notes: "The library's secret lifting wall into the hidden passage (a secret door): a click from either side lifts it for good, as the original's event 4 (title 'Door', door 4 open)."
notes: "29 events: the 2 double doors and the secret wall (open for good), the two buttons beside the double doors (each opens its door's two leaves, once, as the original's events 2 and 3), 7 chests (5 cabinets and 2 rock-face panels), the 15 bookcase faces (each a clicked block: the first search gives its scroll or book, later ones nothing, as the original's events 29 to 43 with their map variables), the exit, and the fire-bolt crossfire (the original's event 51 on its 5 half-minute timer). The original's event 1 (doors 1 to 3, which the map does not have) and its chest 8 event (28, on no face) are dead and not rebuilt. The scavenger hunt items (the hat in chest:cabinet_hat, the Longbow on the captain, the moon floor tile on the study's floor) need no event: their quest bits are set and cleared on Emerald Island."
