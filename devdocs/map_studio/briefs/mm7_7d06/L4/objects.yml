format: 0
start:
  room: room:cave_mouth
  at: [-1171, -4160]
  facing: 56
  notes: "Near the foot of the mouth cave (its low north end), facing as Emerald Island's entrance event sends the party in (MoveToMap direction 320 of 2048 = 56 degrees; the user found 'n' wrong, 2026-11-13); the exit panel is behind, at the top of the cave. Round seven: given by its point (where round six's offset put it), since the cave's outline changed."
doors:
  - id: door:double_n
    opening: open:door_hall_n_anteroom_n
    kind: slide_left
    leaves: 2
    fold: true
    state: closed
    speed: 50
    edge_surface: {texture: twb1a, size: [128, 256]}
    pictures:
      - [{texture: t1d1a, size: [256, 256]}, {texture: t1d1b, size: [256, 256]}]
      - [{texture: t1d1c, size: [256, 256]}, {texture: t1d1d, size: [256, 256]}]
    notes: "The north wing's double door (door hall to anteroom), as the original's door records 7 and 8: two leaves that part sideways at 50 a second, each folding against its jamb (`fold`: the original's leaves move only their free edge, 160 of 192, and shrink into the wall's slot, leaving a stub). The original's leaves carry one round seal between them in four quarter textures that meet at the doorway's centre: seen from either side, the viewer's left leaf shows t1d1a over t1d1c and the right leaf t1d1b over t1d1d (four separate bitmaps; none of the faces carries a flip flag, so no picture is mirrored). `pictures` in two rows of two say exactly that, each at its own size from the doorway's middle, and read the same from the anteroom (no `back_pictures`). Opens for good on a click on the door or on the button beside it. Round seven: the leaves' free edges wear twb1a (`edge_surface`), as the original's leaf edges (face 1530 of door record 6)."
  - id: door:double_s
    opening: open:door_hall_s_anteroom_s
    kind: slide_left
    leaves: 2
    fold: true
    state: closed
    speed: 50
    edge_surface: {texture: twb1a, size: [128, 256]}
    pictures:
      - [{texture: t1d1a, size: [256, 256]}, {texture: t1d1b, size: [256, 256]}]
      - [{texture: t1d1c, size: [256, 256]}, {texture: t1d1d, size: [256, 256]}]
    notes: "Mirror of door:double_n, on the critical path to the library. Round seven: the leaves' free edges wear twb1a (`edge_surface`), as the original's leaf edges (face 1530 of door record 6)."
  - id: door:secret_wall
    opening: open:library_hidden_passage
    kind: slide_up
    state: closed
    speed: 50
    surface: {texture: twb1, size: [128, 256]}
    secret: true
    notes: "The library's secret lifting wall: the north end of its east wall, the hidden passage's 256-wide mouth, in the same dressed stone as the library's other walls, lifts 256 into its slot and stays open. A secret door, as the original's door 4 (both its faces carry the secret flag): it pulses for a party whose Perception finds secrets (map perception difficulty 0) and opens on a click whether found or not, as the original's event 4 does."
