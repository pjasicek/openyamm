exits:
  - id: exit:mouth
    room: room:cave_mouth
    wall: south
    size: [288, 384]
    surface: {texture: 7solid01, size: [16, 16]}
    to: exit:emerald_island
    notes: "The plain dark panel in the rock at the top of the mouth ramp, from the ramp's top floor up 384 to the ceiling: 'Leave the Temple of the Moon'. 288 wide: the sketch's south wall is 320 long and a panel keeps 16 of wall at its sides."
notes: "Placement by room and offset from the room's centre, by wall and along, or by point (`at`). The 21 violet torches are torch05 decorations (each carries its own violet light, radius 512): aisles 2 + 2, apse 1, corridors 3 + 3, anterooms 1 + 1, dormitory 4, library 2, hidden passage 2; no point lights (the original's four light records are not lamps). Round five: the original's four placed monsters (group 54: three temple guards, Swordsman A, and the captain, Swordsman B) at their points, peaceful by their kind's table as the original's; the moon floor tile, the map's goal, lying in the hidden study at its point; the 17 monster spawn points at the original's points and slots. Round six: the captain carries the Longbow (`carries`); the seven random floor items are item spawn points at the original's points and levels; each chest's rolls are at the original's levels (`random_levels`). No placeholders. The 15 searchable bookcase faces are clicked blocks in rooms.yml (platforms with ids) wired in wiring.yml, as the original's events; the 7 chests are the five alcove cabinets and the two rock-face panels (not secret: a chest has no secret flag). The double doors part sideways in two leaves; the library's lifting wall is a secret door."
