events:
  - id: evt:sword_drawn
    trigger: load
    condition: {qbit: 1327}
    effects:
      - set_sprite:
          of: thing:deco_swrdstn_1
          to: swrdstx
    notes: "The original's load event 65534: a drawn sword's stone stays empty."
  - id: evt:pit_meteors
    trigger: timer
    every: 60
    lua: |-
      if IsAtLeast(MapVar(3), 8) then return end
      if not IsAtLeast(MapVar(2), 1) then return end
      evt.SummonObject(8080, -12024, -3784, 400, 512, 1, true)
      evt.SummonObject(8080, -12032, -4744, 400, 512, 1, true)
      evt.SummonObject(8080, -12040, -2712, 640, 750, 1, true)
      evt.SummonMonsters(1, 1, 2, -13040, -2424, 645, 0, 0)
      evt.SummonMonsters(1, 2, 2, -10392, -2224, 645, 0, 0)
      evt.SummonMonsters(3, 1, 2, -12752, -3856, 640, 0, 0)
      evt.SummonMonsters(3, 2, 2, -11328, -3808, 640, 0, 0)
      AddValue(MapVar(3), 1)
    notes: "The original's timer event 200 (every 60): while the pit is armed (the castle pad, map variable 2) fire falls on the pit and lizards and peasants are called, at most eight times."
  - id: evt:arena_fountain_refill
    trigger: daily
    hour: 0
    effects:
      - set:
          var:
            map_var: 26
          value: 30
    notes: "The original's event 65535 at midnight: the pit fountain's store back to 30."
