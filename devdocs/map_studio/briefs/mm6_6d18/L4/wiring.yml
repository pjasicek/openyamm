  - id: evt:bookcase
    preset: script
    source: platform:bookcase
    title: Bookcase
    condition: {map_var: {name: bookcase_searches, below: 4}}
    effects:
      - add:
          var:
            map_var: bookcase_searches
          value: 1
      - text: "Found something!"
      - give_item:
          one_of: [1961, 1973, 1976, 1988, 1965, 1962]
    notes: "Original event 62: searched up to four times (map variable 3 there), each time \"Found something!\" and one scroll of six at random (Preservation, Charm, Mass Fear, Hammerhands, Shared Life, Heroism)."
