            map_var: on_lava
          value: 0
    notes: "Original event 53, on the 65 dry floor faces beside the lava: the four islands, the channel hall's two floors and four banks, the river's two banks and the cavern's recess. Since round five also the channel hall's two bank ramps (faces 1184, 1187), which are blocks with an `id`."
