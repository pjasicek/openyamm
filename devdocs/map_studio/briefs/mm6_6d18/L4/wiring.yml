    source: level:tower_island
    trigger: step
    sources: [level:s3_island, level:s9_island, level:machine_island, level:s34_west, level:s34_east, level:s34_bank_w, level:s34_bank_e, platform:s34_ramp_w, platform:s34_ramp_e, level:s36_inner, level:s36_outer, room:s39a]
