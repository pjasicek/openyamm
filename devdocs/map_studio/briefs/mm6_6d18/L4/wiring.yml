  - id: evt:lava_burn
    preset: script
    trigger: timer
    every: 2
    condition: {map_var: on_lava}
    effects:
      - damage:
          amount: 25
          kind: magic
          who: all
    notes: "Original event 54, a timer every two half-minutes: while map variable 2 is set, DamagePlayer(all, magic, 25). Since the finishing round the only thing that burns: the lava floors have no lava flag, as in the original."
