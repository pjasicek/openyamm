    preset: chest
    source: chest:c5
    title: Chest
    condition: {any: [{map_var: hourglass_chest_opened}, {not: {qbit: hourglass_taken}}]}
    effects:
      - set:
          var:
            map_var: hourglass_chest_opened
          value: 1
      - qbit: hourglass_taken
      - qbit: seer_hourglass_bit
    else_effects:
      - open_chest: chest:c8
    notes: "Original event 48: the first opening in this map by a party without qbit 1029 opens chest 5 (the Hourglass of Time), notes it in map variable 51 and sets qbits 1029 and 1207; once noted, chest 5 every time; a party that comes with qbit 1029 already set (and has not opened it here) gets chest 8 (chest:c8) instead."
