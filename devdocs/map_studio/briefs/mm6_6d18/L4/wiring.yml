  - id: evt:fire_wall
    preset: script
    source: panel:fire_wall
    condition: {lua: not IsPlayerBitSet(PlayerBit(59)), not: {map_var: fire_wall_used}}
    effects:
      - set:
          var:
            map_var: fire_wall_used
          value: 1
      - lua: SetPlayerBit(PlayerBit(59))
      - add:
          var: FireResistance
          value: 25
    notes: "Original event 91, on the wall over the first lava hall's north door (face 35): once per map and once per player bit 59, +25 fire resistance. The player bit has no word (a Lua test and a Lua step)."
  - id: evt:fountain_cavern
    preset: script
    trigger: timer
    every: 1
    lua: |-
      local shots = {
          {1050, 2560, 2304, -1404, false},
          {1000, 2560, 1664, -1404, true},
          {1050, 3456, 2304, -1404, false},
          {1050, 3456, 1792, -1404, false},
      }
      local shot = shots[evt.RandomBetween(1, #shots)]
      evt.SummonObject(shot[1], shot[2], shot[3], shot[4], 1000, 2, shot[5])
    notes: "Original timer 60 (every half minute): one of 4 things at random, a fireball (object 1050) or gold (object 1000), thrown up from a fixed point just above the lava. No effect throws an object, so Lua."
