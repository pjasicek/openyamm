# Round four: the "lava wall" (original door 53 and its face 2255 in the south hall's wall), from its lever on the
# machine room's north-east balcony, then into the chest alcove through its neck and back.
# Finishing round: the wall vanishes as the shipped map's does (event 35 with its supplement: the face made invisible
# and untouchable; map variable 4 is lava_wall_gone), and comes back on the next pull. Walking south at it from the
# hall stops 37 short of it (the party's radius) while it stands, and goes through the neck into the alcove once it
# has gone. The leaf of door:lava_wall (27) never moves.
- movement_segment:
    input: forward
    seconds: 1.5
    actor_collision: false
    actor_ai: false
    start: {map: cal6d18.blv, x: 1088, y: 4736, z: 0, yaw_degrees: -90, pitch: 0}
    expect_stop: {map: cal6d18.blv, x: 1088, y: 4645, z: 0, yaw_degrees: -90, pitch: 0}
