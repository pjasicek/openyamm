id: studio.cal6d18.walk
title: Gharik's Forge rebuild, the critical path and every mechanism on it
world: mm6
mode: faithful
steps:
- new_game_flow:
    start_map: cal6d18.blv
- assert:
    map: cal6d18.blv
- setup_shortcut:
    kind: immortal
    value: true
# Round two: the lava and the events without a clicked object. Map variable 0 is on_lava (ids.lock.yml). Off the
# bridge into the tower's lava: the lava floor's step event sets the variable; onto the island: its step event clears
# the variable. Round five: the raised tile is clicked, as in the original (event 32, evt:tile32, a platform with an
# id), and puts the party back at the start.
# The lava burns as OpenYAMM ships the map (the user's decision, 2026-11-13): the floors carry the lava flag and the
# timer stays (evt:lava_burn, event 54: 25 magic damage every two seconds of play while on_lava is set). The walk's party regains 80
# hit points a second (measured: 1000 to 1400 in five seconds), more than the timer takes, so each check sets its hit
# points to 1000 and reads them five seconds later (at least two runs of the timer): 1400 on the island (not hurt),
# at least 50 less on the lava (hurt).
- assert: {state_dump_map_var: {index: 0, value: 0}}
- walk_to: {x: -2688, y: 640, z: 1152, radius: 56, timeout_seconds: 60}
- walk_to: {x: -1800, y: 640, z: 1152, radius: 56, timeout_seconds: 60}
- walk_to: {x: -1800, y: 1000, z: -512, radius: 90, plan: false, timeout_seconds: 60}
- play_lua: {source: "wait(2)"}
- assert: {party_position: {x: -1800, y: 1000, radius: 200, z_min: -516, z_max: -508}}
- assert: {state_dump_map_var: {index: 0, value: 1}}
- assert: {party_health: {full: true}}
# The lead, 2026-11-13: a monster wandering into this short walk stopped it in two runs of about twenty
# ("nearest actor 38 at 86"); the party clears what stands in its way, as its later walks do.
- walk_to: {x: -1400, y: 900, z: -496, radius: 40, plan: false, timeout_seconds: 60, clear_hostiles: 2500}
- assert: {party_position: {x: -1400, y: 900, radius: 60, z_min: -500, z_max: -492}}
- assert: {state_dump_map_var: {index: 0, value: 0}}
