# Round four: chest contents from the original's chest records: chests 2 and 3 the letter and the journal scrap.
# Round five: the bookcase is the original's clicked block again (event 62, evt:bookcase): searched five times it
# gives one scroll of its six at random four times, and the fifth search finds nothing; map variable 1
# (bookcase_searches) counts to 4.
# The lead, 2026-11-12: by now the packs are nearly full of the earlier chests' random items, and whether chest 3's
# scrap still fitted depended on what they rolled (the step failed in two runs of four). A player drops spare
# things to make room; the things the walk has asserted or is about to are kept.
- play_lua:
    source: |
      local scrolls = {1961, 1973, 1976, 1988, 1965, 1962}
      local keep = {[2053] = true, [2148] = true, [2149] = true}
      for _, id in ipairs(scrolls) do keep[id] = true end
      local function make_room()
        for id in string.gmatch(pack_items(), "(%d+)x%d+") do
          id = tonumber(id)
          if not keep[id] then while item_count(id) > 0 and discard(id) do end end
        end
      end
      local function scrolls_held()
        local n = 0
        for _, id in ipairs(scrolls) do n = n + item_count(id) end
        return n
      end
      make_room()
      local before = scrolls_held()
      -- the game puts an item an event gives on the cursor, as a player sees it; the player stows it each time
      for search = 1, 5 do click(56); wait(1); if held() ~= 0 then stow() end end
      if scrolls_held() - before ~= 4 then error("five searches of the bookcase gave " .. (scrolls_held() - before) .. " scrolls, not 4") end
      make_room()
      loot_chest(17)
      if not has_item(2148) then error("chest 2 did not give the Letter to Marcus") end
      make_room()
      loot_chest(18)
