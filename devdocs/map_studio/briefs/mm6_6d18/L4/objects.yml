    room: room:machine
    at: [1920, 5888]
    size: [256, 992]
    bottom: 736
    height: 32
    travel: [1280, 0, 0]
    speed: 200
    surface: {texture: bemvwal, size: [128, 256]}
    top_surface: {texture: bemvwal, size: [128, 256]}
    kerbs:
      height: 64
      width: 16
    parts:
      - {at: [1832, 5400], size: [48, 16], height: 384, notes: "South-west post (faces 489, 491, 1762): 64 by 16, its west 16 standing on the kerb's end, so two parts that do not overlap the kerb."}
      - {at: [1800, 5400], size: [16, 16], bottom: 832, height: 320}
      - {at: [2008, 5400], size: [48, 16], height: 384, notes: "South-east post (faces 479, 480, 603): the same, its east 16 on the kerb's end."}
      - {at: [2040, 5400], size: [16, 16], bottom: 832, height: 320}
      - {at: [1832, 6376], size: [48, 16], height: 384, notes: "North-west post (faces 485, 486, 581, 597), beside the kerb's end."}
      - {at: [2008, 6376], size: [48, 16], height: 384, notes: "North-east post (faces 478, 579, 580, 589, 602), beside the kerb's end."}
    notes: "Original door 14: the bridge (256 by 992, -32 to 0, kerbs 16 wide and 64 high) between the upper west balconies, 16 short of each; the lever on the lower south-east balcony slides it 1,280 east to the upper east pair, for good. Its four corner posts, from the deck to the ceiling at 384 (64 by 16 at the south end over the kerbs' ends, 48 by 16 at the north end beside them), are parts of the same mover, as in the original's one door record. The party is never carried by it: the lever is on another balcony."
floors:
