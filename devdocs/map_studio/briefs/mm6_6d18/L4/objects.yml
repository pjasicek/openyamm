  - id: lift:shaft
    room: room:shaft
    at: [4736, 2440]
    size: [254, 240]
    travel: 2024
    speed: 200
    state: up
    surface: {texture: vlcwl1lg, size: [256, 256]}
    notes: "Original door 28: the lift floor, 256 by 240, from -16 down 2,032 at 200 a second (ten seconds). The original is a solid column too: only the four corners of its top move (its front face runs from the shaft floor to the top), so the lift is what the original is."
movers:
  - id: mover:bridge3
    room: room:s3
    at: [128, 2080]
    size: [256, 64]
    bottom: 640
    height: 112
    travel: [0, 959, 0]
    speed: 200
    stretch: true
    surface: {texture: d2wlactr, size: [128, 256]}
    top_surface: {texture: d2wlactr, size: [128, 256]}
    notes: "Original door 4: the bridge stub (256 wide, 64 out from the south wall, -128 to -16), whose end face the lever pushes 959 north at 200 a second, so that the bridge reaches the north door. Level travel: it does not carry the party, which walks on once it has arrived (as in the original, where the lever is in another room)."
