notes: "Gharik's Forge (MM6 6d18.blv) in the original's own frame. Every room is one of the original's sectors (its number is in the name) or a part of one; outlines are the sectors' floor outlines as measured, all straight walls on the original's 32 grid. Doors stand in walls 32 thick, as in the original. The lava rooms have the lava as their floor and everything walked on as levels or free blocks. First written by gen/gen.py (round one); edited by hand since round two, so the scripts in gen/ no longer reproduce these files."
