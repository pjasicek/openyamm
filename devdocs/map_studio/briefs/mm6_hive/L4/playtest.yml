# The Hive rebuilt (devdocs/map_studio/briefs/mm6_hive/L4): the walk from the entry to the Queen's chamber, with every
# door, switch and chest of the project used, the drops through the four pits and the hatch, and the events that run
# without a click. Kept by hand since round two. Event and door numbers are those of ids.lock.yml. Play it from
# output/studio_cal/mm6_hive/run (see NOTES.md, Round two, for the commands).
id: studio.mm6hive.walk
title: The Hive rebuilt, entry to the Queen's chamber
world: mm6
mode: faithful
steps:
  - new_game_flow:
      start_map: mm6hive.blv
  - assert: {map: mm6hive.blv}
  - setup_shortcut: {kind: immortal, value: true}
  # Entry, the flush lock and its double door, the gallery, the ledge.
  - play_lua:
      source: |
        open_door(6, 1)
  - walk_to: {x: 448, y: 4800, z: 0, radius: 96, timeout_seconds: 150, clear_hostiles: 1500}
  # The walked-on faces of the flush system (map variables as ids.lock.yml numbers them: 2 flush_armed, 6 flush_done,
  # 8 protected). The entry's floor only says so (event 17: the party has just walked over its plate, but status()
  # keeps only lines shown during a play_lua step, so the handler, event 38, is run again by its number); the floor
  # before the double door arms it (event 19).
  - play_lua:
      source: |
        click(38); wait(1)
        local s = status()
        if not s:find("Flush system activated") then error("the lock's floor said nothing: " .. s) end
  - assert: {state_dump_map_var: {index: 2, value: 0}}
  - play_lua:
      source: |
        open_door(19, 15)
        if door_state(36) ~= "open" then error("the double door's second leaf did not part: " .. door_state(36)) end
  - walk_to: {x: 448, y: 4800, z: 0, radius: 96, timeout_seconds: 150, clear_hostiles: 1500}
  # The scroll lying on the lock's floor (item 1817, the original's one sprite object), picked up as a player does.
  - walk_to: {x: 256, y: 5248, z: 0, radius: 64, timeout_seconds: 60, clear_hostiles: 1500}
  - pick_up: {item_id: 1817}
  - walk_to: {x: 448, y: 6000, z: 0, radius: 96, timeout_seconds: 150, clear_hostiles: 1500}
  - assert: {state_dump_map_var: {index: 2, value: 1}}
  # The flush runs on timers: a warning every 120 seconds while armed, the flush within 10 seconds of it (its text
  # and, the party being on no water pad, 20 physical damage to all in the same handler: the scenario's immortal
  # party shrugs that off), "complete" within 5 seconds of the flush.
  - play_lua:
      max_seconds: 200
      source: |
        local s = ""
        for i = 1, 70 do
          s = s .. status()
          if s:find("Warning!  Flush system activated!") then break end
          wait(2)
        end
        if not s:find("Warning!  Flush system activated!") then error("no flush warning in 140 seconds: " .. s) end
  - play_lua:
      max_seconds: 60
      source: |
        wait(28)
        local s = status()
        if not s:find("Flush sequence in progress") then error("the flush did not run: " .. s) end
        if not s:find("Flush sequence complete") then error("the flush did not end: " .. s) end
  - assert: {state_dump_map_var: {index: 9, value: 0}}
  - assert: {state_dump_map_var: {index: 6, value: 0}}
  - walk_to: {x: 448, y: 6900, z: 0, radius: 96, timeout_seconds: 150, clear_hostiles: 1500}
  # Off the ledge: a drop of 768 onto the floor of the great chamber.
  - walk_to: {x: 448, y: 7500, z: -768, radius: 160, timeout_seconds: 150, clear_hostiles: 1500, plan: false}
  - play_lua:
      source: |
        wait(2)
  - assert: {party_position: {x: 448, y: 7500, radius: 300, z_min: -780, z_max: -700}}
  # The party has landed on a water pad (event 56: protected); the floor beside it clears that (event 58).
  - walk_to: {x: 448, y: 7485, z: -752, radius: 60, timeout_seconds: 60}
  - assert: {state_dump_map_var: {index: 8, value: 1}}
  - walk_to: {x: -100, y: 7600, z: -768, radius: 60, timeout_seconds: 60}
  - assert: {state_dump_map_var: {index: 8, value: 0}}
