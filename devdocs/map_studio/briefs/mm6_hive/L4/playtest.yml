  - damage_actor: {actor_index: 1, amount: 100000}
  # A timer event's move of the party within the map happens in the game's frame; a play_lua wait() does not follow
  # it, advance_runtime does.
  - advance_runtime: {seconds: 4, follow_map_move: true}
  - play_lua:
      max_seconds: 30
      source: |
        for i = 1, 20 do if door_state(24) == "open" and door_state(10) == "open" then break end wait(0.5) end
        for d = 24, 29 do if door_state(d) ~= "open" then error("the kill did not sink the ring wall: " .. d .. " " .. door_state(d)) end end
        for d = 44, 45 do if door_state(d) ~= "open" then error("the kill did not open the north gate: " .. d .. " " .. door_state(d)) end end
        if door_state(10) ~= "open" then error("the kill did not open the Queen's gate: " .. door_state(10)) end
