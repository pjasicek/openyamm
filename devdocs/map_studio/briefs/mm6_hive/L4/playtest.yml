  # west and from (4416, 24900) north: both stop at the wall, as in the original).
  - play_lua:
      source: |
        click(41); wait(1)
        for d = 24, 29 do if door_state(d) ~= "closed" then error("the ring wall moved before the reactor was destroyed: " .. d) end end
        for d = 44, 45 do if door_state(d) ~= "closed" then error("the north gate moved before the reactor was destroyed: " .. d) end end
  # The reactor on its dais (the original's actor 0) is destroyed, as a player would, with the Ritual of the Void
  # (item 2164) in the packs: the kill flow (event 47, the map supplement's event 65011) sinks the ring wall and the
  # lower half of the gate, raises its upper half into the ceiling, opens the Queen's gate, summons sixteen monsters
  # round the ring and carries the party before the Queen's gate.
  - grant_item: {item_id: 2164}
  - walk_to: {x: 4416, y: 20700, z: -2256, radius: 96, timeout_seconds: 150, clear_hostiles: 1200, z_tolerance: 96}
