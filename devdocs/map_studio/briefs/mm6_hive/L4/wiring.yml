  - id: evt:door6_passage
    preset: switch
    source: door:d6
    side: room:s64_passage
    title: Switch
    opens: [door:d32, mover:button31]
    notes: "Event 31 on the leaf's passage face (2044): as the south cell's button, it presses button 31 and opens door 32."
