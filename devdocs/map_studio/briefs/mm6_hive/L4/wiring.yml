      - teleport:
          to: [3328, 25920, -2256]
          direction: 90
      - lua: "evt.ForPlayer(Players.All); SetValue(MajorCondition, 0); AddValue(HasFullHP, 0); AddValue(HasFullSP, 0)"
    notes: "The kill flow of the original's map supplement (hive_mmmerge.lua, event 65011): the reactor destroyed while the party carries the Ritual of the Void (item 2164): sixteen monsters of the encounter slots 1 and 2 at tier C round the reactor, the doors of event 100 (ring wall and gate sunk, the Queen's gate opened, door 28 shut), the party carried before the Queen's gate (the original adds up to 120 at random to x and y) and restored. The supplement tests the item at the moment of the kill, this event at the next two-second tick."
  - id: evt:reactor_dead_bad
    preset: script
    trigger: timer
    every: 2
    condition: {kills: {monster: monster:reactor}, not: {any: [{item: 2164}, {map_var: reactor_killed}]}}
    lua: "evt.ShowMovie(\"mm6end2\", false); evt.PlaySound(130); evt.ReturnToMainMenu()"
    once: true
    notes: "The other branch of event 65011: the reactor destroyed without the Ritual of the Void ends the game (the bad ending's film and the main menu)."
  - id: evt:switch16
    preset: teleport
    source: mover:button16
    title: Switch
    to: [468, 3690, 1]
    direction: 8
    toggles: [mover:button16]
    effects:
      - set:
          var:
            map_var: flush_armed
          value: 0
    text: Flush system deactivated
    notes: "Event 16: the button (door 16) goes in or out, the flush system is switched off, and the party is carried to the entry."
  - id: evt:switch31
    preset: switch
    source: mover:button31
    title: Switch
    opens: [door:d32, mover:button31]
    once: true
  - id: evt:switch33
    preset: switch
    source: mover:button35
    toggles: [door:d36, mover:button35]
  - id: evt:switch34
    preset: switch
    source: mover:button37
    title: Switch
    toggles: [mover:button37, mover:floor_panel]
    notes: Event 34 of the original slides the floor panel (door 38) in and out between the upper floor and the passage below.
  - id: evt:switch36
    preset: switch
    source: mover:button41
    title: Switch
    toggles: [mover:button41, mover:hatch_1, mover:hatch_2, mover:hatch_3, mover:hatch_4, mover:hatch_5, mover:hatch_6]
    notes: Event 36 of the original toggles the cover of the hatch (door 43) over the shaft in the middle of the great chamber.
  - id: evt:switch50
    preset: switch
    source: mover:button50
    title: Switch
    opens: [mover:button50]
    once: true
    sets: {map_var: flush_off}
    notes: "Event 50: the flush system is switched off for good (map variable 23). A floor button in the original."
notes: "Not wired, for want of a way to say it: the map supplement's damage hook (65010: a physical blow to the reactor does 2 to 40 at random). Events 30 and 62 have faces but no handler in the original. The underside of door 36's leaf carries event 6 (door 6) and door 6's underside event 31 in the original, a data slip not built."
