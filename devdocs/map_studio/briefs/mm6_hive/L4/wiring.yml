  - id: evt:exit_final
    preset: exit
    source: exit:final
    title: Exit
    condition: {qbit: exit_unlocked}
    locked_text: The door is locked
    notes: "Event 60 (replaced by the map supplement): locked until quest bit 1226; the ending is the leave event's (evt:leave_ending), as the supplement's 65012."
  - id: evt:exit_south
    preset: exit
    source: exit:south
    title: Exit
  - id: evt:flush_arm
    preset: script
    source: plate:lock_inner
    trigger: step
    condition: {not: {any: [{map_var: flush_off}, {map_var: flush_armed}]}}
    effects:
      - set:
          var:
            map_var: flush_armed
          value: 1
    notes: "Event 19: walking up to the double door arms the flush system, unless it was switched off for good."
  - id: evt:flush_complete
    preset: text
    trigger: timer
    every: 5
    condition: {map_var: flush_done}
    effects:
      - set:
          var:
            map_var: flush_done
          value: 0
    text: Flush sequence complete.
    notes: "Event 51: a timer of 2.5 game minutes."
  - id: evt:flush_notice
    preset: text
    source: plate:lock_entry
    trigger: step
    condition: {not: {any: [{map_var: flush_off}, {map_var: flush_armed}]}}
    text: Flush system activated.
    notes: Event 17.
  - id: evt:flush_run
    preset: script
    trigger: timer
    every: 10
    condition: {map_var: flush_warned}
    effects:
      - text: Flush sequence in progress.
      - lua: "if not IsAtLeast(MapVar(protected), 1) then evt.DamagePlayer(Players.All, const.Damage.Physical, 20) end"
      - set:
          var:
            map_var: flush_done
          value: 1
      - set:
          var:
            map_var: flush_warned
          value: 0
    notes: "Event 54 as one handler, in the original's order: a timer of 5 game minutes; while the warning stands, the text, then 20 physical damage to all unless the party stands on a water pad (a condition guards the whole handler, so the damage's own test is an `if` in a Lua step), then the variables."
  - id: evt:flush_warning
    preset: text
    trigger: timer
    every: 120
    condition: {map_var: flush_armed}
    sets: {map_var: flush_warned}
    text: "Warning!  Flush system activated!"
    notes: "Event 57: a timer of one game hour."
  - id: evt:hatch_top
    preset: switch
    source: room:s69_top
    trigger: step
    closes: [mover:hatch_1, mover:hatch_2, mover:hatch_3, mover:hatch_4, mover:hatch_5, mover:hatch_6]
    notes: "Event 27: the floor at the head of the stepped corridor, behind door 4 (which opens only from this side), uncovers the hatch, so a party that came up from below has its way back to the shaft."
  - id: evt:keg
    preset: script
    source: deco:keg
    title: Keg
    effects:
      - text: " +20 Hit Points"
      - add:
          var: HP
          value: 20
    notes: "Event 23 on the keg decoration: the line and 20 hit points, each click."
  - id: evt:leave_ending
    preset: script
    trigger: leave
    condition: {all: [{map_var: reactor_killed}, {map_var: queen_killed}, {item: 2164}]}
    effects:
      - qbit: 784
      - clear_qbit: 1222
      - take_item: 2164
      - lua: "SetAward(Award(78)); evt.ShowMovie(\"mm6end1\", false)"
    else_effects:
      - lua: "if IsAtLeast(MapVar(reactor_killed), 1) then evt.ShowMovie(\"mm6end2\", false); evt.PlaySound(130); evt.ReturnToMainMenu() end"
    notes: "The supplement's leave event (65012): leaving after the reactor's death is the good ending with the Queen dead and the Ritual of the Void in the packs (quest bit 784, 1222 cleared, the Ritual taken, award 78, the film), else the bad ending; before the reactor's death nothing."
  - id: evt:load
    preset: switch
    trigger: load
    condition: {qbit: reactor_destroyed}
    opens: [door:d30, mover:gate_high, mover:gate_low, mover:ring_ne, mover:ring_nw, mover:ring_se, mover:ring_se_stub, mover:ring_sw, mover:ring_sw_stub]
    closes: [door:d28]
    notes: "Event 100, run on entering the map: with quest bit 1204 (the original's, which nothing in the game sets now; the reactor's death opens the same doors through evt:reactor_dead) the ring wall sinks into the floor, the north gate's lower half sinks and its upper half rises into the ceiling, the Queen's gate opens and door 28 is shut again."
  - id: evt:pad_off
    preset: script
    source: room:s4_hall
    trigger: step
    sources: [room:s35_e, room:s35_w, room:s6_low, room:s3_gallery, room:s47_passage, room:s49_passage, room:s45_passage, room:s51_passage, room:s80_antechamber, room:s34_cave, room:s30_tunnel, room:s33_box, room:s56_cells_n, room:s62_passage, room:s61_cells_s, room:s75_chest, room:s24_tunnel, room:s14_tunnel, room:s68_ramp, room:s33_tunnel]
    effects:
      - set:
          var:
            map_var: protected
          value: 0
    notes: "Event 58: the floors round the water pads."
  - id: evt:pad_on
    preset: script
    source: platform:pad_hall_1
    trigger: step
    sources: [platform:pad_hall_2, platform:pad_hall_3, platform:pad_hall_4, platform:pad_hall_5, platform:pad_hall_6, platform:pad_north_e, platform:pad_north_w, platform:pad_sw_low, platform:pad_gallery_w, platform:pad_gallery_e, platform:pad_cell_sw, platform:pad_cell_w, platform:pad_cell_e, platform:pad_cell_ee, platform:pad_antechamber, platform:pad_cave_nw, plate:pad_north_tunnel, platform:pad_sw_box, plate:pad_cells_n, plate:pad_west_passage, plate:pad_keg, plate:pad_hall_door, plate:pad_east_tunnel, plate:safe_cells_s, plate:safe_chest_room, room:s74_switch, room:s42_b, room:s68_a]
    title: Protected
    effects:
      - set:
          var:
            map_var: protected
          value: 1
    notes: "Event 56: standing on a water pad protects from the flush. Nine of the original's 30 pads are built (the great chamber's six, the north hall's two and the one under the south-west pit)."
  - id: evt:queen_dead
    preset: script
    trigger: timer
    every: 2
    condition: {map_var: reactor_killed, kills: {monster: monster:queen}}
    once: true
    sets: {map_var: queen_killed}
    effects:
      - qbit: 1226
    notes: "The kill flow of the original's map supplement (hive_mmmerge.lua, event 65011): the Queen killed after the reactor sets quest bit 1226, which unlocks the final exit (event 60)."
  - id: evt:queen_floor
    preset: script
    source: room:s77_queen
    trigger: step
    effects:
