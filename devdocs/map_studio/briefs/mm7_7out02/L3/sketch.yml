    - {side: south, span: [56, 78], neighbour: edge:south, notes: "The south road valley floor at 640, the road in its cutting at x 58 to 63 and the outlet ravine at x 71 to 78."}
    - {side: east, span: [24, 62], neighbour: edge:east, notes: "No road: a bare shelf at 640 between the north-east valley's walls and the hill north of the Arbiter's knoll. Off-road, one-way."}
