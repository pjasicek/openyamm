events:
  - id: evt:fort_fire
    trigger: timer
    every: 5
    condition: {not: {qbit: 760}}
    lua: |-
      local towers = {
          {from = {7368, 4920, 416}, to = {{4903, 7358, 1}, {3820, 6694, 1}, {5419, 7931, 1}}},
          {from = {9000, 4920, 416}, to = {{11822, 8132, 0}, {11218, 7086, 0}, {12054, 6754, 0}}},
          {from = {9000, 3280, 416}, to = {{13002, 728, 64}, {11937, 538, 64}, {11239, -167, 64}}},
          {from = {7368, 3280, 416}, to = {{5493, 88, 1}, {5452, 815, 1}, {4448, 1052, 1}}},
      }
      local tower = towers[math.random(1, #towers)]
      local to = tower.to[math.random(1, #tower.to)]
      evt.CastSpell(6, 10, 3, tower.from[1], tower.from[2], tower.from[3], to[1], to[2], to[3])
    notes: "While the fort is not taken a fireball flies from one of its four towers at the land before it, every five half minutes of game time (the original also throws sparks and a death blossom: three of its five shots a tower are kept)."
  - id: evt:castle_rebuilt
    trigger: load
    condition: {any: [{qbit: 614}, {qbit: 641}]}
    effects:
      - show: [thing:castle_tower_south, thing:castle_tower_north, thing:castle_tower_middle]
    notes: "The upgrade towers stand once the castle is rebuilt (the original also takes its ruined middle away: those parts are one model with the body here)."
  - id: evt:castle_cleaned
    trigger: load
    condition: {qbit: 610}
    effects:
      - set_texture:
          of: building:castle
          from: ch1b1dl
          to: chb1dl
      - set_texture:
          of: building:castle
          from: ch1b1el
          to: chb1el
      - set_texture:
          of: building:castle
          from: ch1b1re
          to: chb1er
      - set_texture:
          of: building:castle
          from: ch1b1s
          to: chb1s
      - set_texture:
          of: building:castle
          from: ch1b1
          to: chb1
    notes: "The castle the party owns is clean stone: every wall texture of the ruin has its clean twin."
  - id: evt:intro_film
    trigger: load
    condition: {all: [{qbit: 519}, {not: {qbit: 648}}]}
    effects:
      - qbit: 648
      - lua: "evt.ShowMovie(\"\\\"pcout01\\\"\", true)"
    notes: "The original's load event 50: the film of the castle the first time the party comes back with the scavenger hunt won."
  - id: evt:region_state
    trigger: load
    lua: |-
      MM7.UpdateHarmondaleInvasion()
      MM7.UpdateJudgeGreyDeath()
    notes: "As the world's MMerge supplement (65002, which takes the place of the original's 50 and 211): the guild's deadline that sets the lockdown (695), and the messenger after Judge Grey's death."
  - id: evt:lockdown
    trigger: load
    condition: {qbit: 695}
    effects:
      - show_actors: 60
      - set:
          var: BankGold
          value: 0
      - clear_qbit: 693
      - clear_qbit: 694
    notes: "The original's load event 50 while the guild debt is failed: the squad (group 60) in the streets, the bank emptied."
  - id: evt:raiders_come
    trigger: load
    condition: {qbit: 774}
    effects:
      - show_actors: 71
    notes: "The original's load event 240: once the three watch fires are lit the raiders (group 71) stand in their camps in the south-west hills."
  - id: evt:lockdown_beaten
    trigger: timer
    every: 15
    condition: {all: [{qbit: 695}, {not: {qbit: 697}}, {kills: {group: 60}}]}
    effects:
      - qbit: 697
    once: true
    lua: |-
      if IsQBitSet(QBit(696)) then
          SetQBit(QBit(702))
          ClearQBit(QBit(695))
      end
    notes: "The original's timer 51 (every 15): the squad beaten ends the lockdown once the castle is cleared (696)."
  - id: evt:fruit_trees_bare
    trigger: load
    condition: {any: [{season: autumn}, {season: winter}]}
    effects:
      - set_sprite:
          of: thing:fruit_tree_1
          to: 7tree30
      - set_sprite:
          of: thing:fruit_tree_2
          to: 7tree30
      - set_sprite:
          of: thing:fruit_tree_3
          to: 7tree30
      - set_sprite:
          of: thing:fruit_tree_4
          to: 7tree30
      - set_sprite:
          of: thing:fruit_tree_5
          to: 7tree30
      - set_sprite:
          of: thing:fruit_tree_6
          to: 7tree30
      - set_sprite:
          of: thing:fruit_tree_7
          to: 7tree30
      - set_sprite:
          of: thing:fruit_tree_8
          to: 7tree30
    notes: "The original's load event 250 for the fruit trees: bare (7tree30) in autumn and winter. Its forest half is evt:forest_summer, evt:forest_autumn and evt:forest_winter (round four)."
  - id: evt:forest_summer
    trigger: load
    condition: {any: [{season: spring}, {season: summer}]}
    effects:
      - set_sprite:
          of: scatter:broadleaf
          to: 7tree13
      - set_sprite:
          of: scatter:firs
          to: 7tree16
      - set_sprite:
          of: scatter:pines
          to: 7tree22
      - show: scatter:flowers
    notes: "The original's load event 250 in spring and summer: ids 5, 6 and 7 take 7tree13, 7tree16 and 7tree22 and the flowers (id 10) show. So the 89 firs of id 5 stand as broadleaf trees in every season, as the original's do (scatter:broadleaf holds the 7tree16 the original gives id 5)."
  - id: evt:forest_autumn
    trigger: load
    condition: {season: autumn}
    effects:
      - set_sprite:
          of: scatter:broadleaf
          to: 7tree14
      - set_sprite:
          of: scatter:firs
          to: 7tree17
      - set_sprite:
          of: scatter:pines
          to: 7tree24
      - hide: scatter:flowers
    notes: "The original's load event 250 for autumn: the forests change their pictures (ids 5, 6, 7) and the flowers (id 10) are hidden."
  - id: evt:forest_winter
    trigger: load
    condition: {season: winter}
    effects:
      - set_sprite:
          of: scatter:broadleaf
          to: 7tree15
      - set_sprite:
          of: scatter:firs
          to: 7tree18
      - set_sprite:
          of: scatter:pines
          to: 7tree24
      - hide: scatter:flowers
    notes: "The original's load event 250 for winter: the forests change their pictures (ids 5, 6, 7) and the flowers (id 10) are hidden."
  - id: evt:gold_well_refresh
    trigger: weekly
    lua: "SetValue(MapVar(21), 0)"
    notes: "The original's weekly event 65532: the market well gives gold again, a week of the calendar after the last time."
  - id: evt:might_well_refresh
    trigger: daily
    hour: 1
    lua: |-
      evt.ForPlayer(Players.All)
      ClearPlayerBit(PlayerBit(1))
    notes: "The original's daily event 65533 at one in the night: the hamlet well's Might again."
