ves: 0, fascia: 16, hip: 320, ridge: 0, ridge_along: ew}], house: 1165, title: Arbiter, kit: rich, door: {bay: 2, part: p1, wall: s}, condition: {not: {any: [{qbit: 611}, {qbit: 612}, {qbit: 1697}, {qbit: 1698}, {qbit: 646}]}}, else_effects: [{lua: "local function q(n) return IsQBitSet(QBit(n)) end\n-- which history page the verdict writes: 0 the humans', 1 the elves', 2 the Arbiter's\nlocal function verdict()\n    local function late()\n        if q(659) then return 2 elseif q(596) then return 0 elseif q(597) then return 1 end\n        return 0\n    end\n    if q(592) then\n        if q(593) then return late() elseif q(597) or q(595) then return 1 end\n        return 0\n    elseif q(594) then\n        if q(595) then return late() end\n        return 0\n    elseif q(595) then\n        if q(597) then return 1 end\n    end\n    return 0\nend\nif q(611) then\n    evt.EnterHouse(1164)\nelseif q(612) then\n    evt.EnterHouse(1166)\nelseif q(1697) then\n    AddValue(History(7 + verdict()), 0)\n    SetQBit(QBit(611)); ClearQBit(QBit(665)); SetQBit(QBit(664)); SetValue(Counter(5), 0)\n    evt.SetNPCGreeting(416, 221); ClearQBit(QBit(1697))\n    evt.MoveNPC(416, 1164); evt.MoveNPC(417, 0); evt.MoveNPC(414, 0); evt.MoveNPC(415, 0)\n    evt.SetNPCTopic(416, 1, 894); evt.SetNPCTopic(416, 2, 889)\n    evt.ShowMovie(\"\\\"arbiter good\\\"\", true)\n    evt.EnterHouse(1164)\nelseif q(1698) then\n    AddValue(History(14 + verdict()), 0)\n    SetQBit(QBit(612)); ClearQBit(QBit(665)); SetQBit(QBit(663)); SetValue(Counter(5), 0)\n    evt.SetNPCGreeting(417, 218); ClearQBit(QBit(1698))\n    evt.MoveNPC(414, 0); evt.MoveNPC(416, 0); evt.MoveNPC(415, 0); evt.MoveNPC(417, 1166)\n    evt.SetNPCTopic(417, 1, 892); evt.SetNPCTopic(417, 2, 889)\n    evt.ShowMovie(\"\\\"arbiter evil\\\"\", true)\n    evt.EnterHouse(1166)\nend\nMM7.RemoveJudgeFollowers()"}], lua: MM7.RemoveJudgeFollowers(), notes: "The base is the original's eight-pointed star (Seer'BottomN): an eight-sided middle and eight pointed arms, each a part. The door opens the Arbiter's house (1165) until the story has a verdict; then the original's branches (qbits 611, 612, 1697, 1698, 646: the new Arbiter, the film, the history page) in else_effects."}
