  notes: "The travel prompt fires at the playable square's sides (about 23,100 units from the centre). Arrivals stand just inside it, at the mouths of the three road valleys. Outside it, a backdrop strip of hills 19 cells wide on every side, where the north, west and south roads run on to the true map edge."
