format: 0
grid: 512
notes: "Harmondale, L3 sketch on the 512-unit plan grid. Coordinates are terrain cells [x, y] of the 128 x 128 map, x east, y south, origin the north-west corner; a cell [x, y] is the world point X = (x - 64) * 512, Y = (64 - y) * 512 (the native outdoor convention: world origin at the map centre, world Y pointing north, terrain sample row y and column x at cell corner [x, y]). Integers everywhere except road centrelines and plot corners, which may use half cells. Heights (h, level, drop) are game units above the plan datum (zone:central_basin: the basin floor and town street, 0, which is also the lowest ground on the map); the coarse grid is in units of 64. Points, band polygons and cliff lines win over the grid. Group members are addressed by `index`; the index meanings are in the building's plan notes. Positions were measured from the original's data at design level and simplified: polygons have few points, roads few bends, and only key heights are given."
