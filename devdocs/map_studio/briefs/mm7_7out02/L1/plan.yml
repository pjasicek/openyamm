    features: [signpost at the northern junction, two wayside crates]
    purpose: "Trunk: south along the west side of the basin, then south-west to the hamlet. Links the town to the hamlet and the two southern exits."
  - id: link:west_road
    from: junction:south_fork
    to: zone:west_valley
    kind: road
    features: [watch fire on the hill beside the last stretch]
    purpose: "West road: west through a winding hill valley to the west edge (Erathia)."
    notes: Winds through the valley rather than climbing over.
entrances:
  - id: entrance:castle_door
    space: zone:castle_forecourt
    kind: both
    neighbour: door:castle
    how: "The castle door, west end of town: into the castle as a dungeon. Arrival in front of the door."
    variants:
      - condition: {qbit: castle_stage_2}
        behaviour: The castle opens as a house dialog (throne room) on the interior map.
        target: door:castle
      - condition: {not: {qbit: butler_met}}
        behaviour: "No travel: the butler appears, gives the clean-out quest and moves to the tavern (goal:castle_quest)."
  - id: entrance:cave_mouth
    space: zone:white_cliffs
    kind: both
    neighbour: door:white_cliff_caves
    how: "Plain door in the cave mouth, across the long footbridge over the lake outlet. Arrival in front of the door."
    reached_by: off_road
  - id: entrance:east_edge
    space: zone:outer_rim
    kind: exit
    neighbour: edge:east
    how: "Off-road onto a bare shelf at about 640 on the east side, between the north-east valley's walls and the hill north of the Arbiter's knoll; it is not reached over the rim. Only an 'East' hint."
    reached_by: off_road
  - id: entrance:north_road
    space: zone:ne_valley
    kind: both
    neighbour: edge:north
    how: Marker at the north road exit.
    reached_by: road
    notes: Also the arrival for parties coming from the east (there is no east arrival).
  - id: entrance:party_start
    space: zone:castle_forecourt
    kind: arrival
    facing: e
    how: "Just east of the castle door, facing down the main street."
    notes: "Start of the game; the world's respawn point and this map's Town Portal point (project.yml rules)."
  - id: entrance:south_road
    space: zone:south_road_valley
    kind: both
    neighbour: edge:south
    how: Marker at the south road exit.
    reached_by: road
  - id: entrance:stable_yard
    space: zone:stable_yard
    kind: both
    neighbours: [stable:erathia, stable:tularean, stable:tatalia, stable:arena]
    how: "The J.V.C. Corral's yard; departures go from the stable's house dialog."
    reached_by: road
  - id: entrance:west_road
    space: zone:west_valley
    kind: both
    neighbour: edge:west
    how: Marker at the west road exit.
    reached_by: road
goals:
  - id: goal:castle_quest
    space: zone:castle_forecourt
    kind: use
    what: "Click the castle door: the butler gives the quest to clean out the castle and moves to the tavern."
    gives:
      qbit: butler_met
  - id: goal:take_fort
    space: zone:hill_fort
    kind: set
    what: "Step into the fort's keep and beat the four goblin waves; the towers stop."
    gives:
      qbit: fort_taken
  - id: goal:watch_fires
    kind: set
    what: Light the three watch fires to bring the hidden raiding army out of the south-west highlands.
    gives:
      qbit: raiders_called
