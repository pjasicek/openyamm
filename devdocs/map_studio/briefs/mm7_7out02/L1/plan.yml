format: 0
level: L1
pitch: "Harmondale is a contested border barony in temperate highlands, and the region the party is handed as its own: a ruined castle on a shoulder at the head of a small, busy market town that sits in a sheltered bowl of hills. The town is the party's home base for the whole game, with every everyday service, seven magic guilds and a stable, and it stays safe ground. Beyond the bowl the land opens into a broad low basin of meadows held by goblins: an old hill fort in the middle whose towers still throw fire, goblin bands roaming the basin, a quiet farming hamlet on the road south, a small lake under white chalk cliffs that hide a goblin cave, and a lone house in the east where the kingdom's Arbiter sits in judgement. Play starts at the castle door: shop and train in town, clear the castle and the basin, take the fort, light the three watch fires to bring the hidden raiding army out of the south-west hills, and later restore the castle stage by stage while the region's politics (the Arbiter, the light-or-dark choice) play out here."
purpose: "The continent's home region and early-game hub: the party's own castle and home town, with every everyday service, seven guilds and a stable; the starting map of the castle arc, the world's return point and a Town Portal destination. Outside the town, open goblin-held country for the first fights, a hill fort to take, and the region's politics (the Arbiter, the light-or-dark choice)."
mood: "Pastoral and homely inside the town bowl; open and skirmishy outside it; high bare hills and white caps all round."
datum: zone:central_basin
