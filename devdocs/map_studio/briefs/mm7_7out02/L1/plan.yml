    rise: -500
    purpose: "Main street, west part: from the castle forecourt down onto the bowl floor."
    notes: "The main street is the town's spine, west to east on the bowl floor, about a fifth of the map wide: straight from the castle to the head of the south lane, where it doglegs about three plan cells north, then runs east through the gate; every service fronts it or a short lane off it."
