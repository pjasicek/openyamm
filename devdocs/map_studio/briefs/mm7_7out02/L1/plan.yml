  - id: link:high_road_valley
    from: junction:high_road_bend
    to: zone:ne_valley
    kind: road
    length_share: 0.25
    purpose: "High road: north up the north-east valley to the north edge."
  - id: link:highland_slopes
    from: zone:south_hamlet
