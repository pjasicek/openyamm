      - condition: {qbit: path_light}
        behaviour: The Arbiter's house dialog in its Light variant.
      - condition: {qbit: path_dark}
        behaviour: The Arbiter's house dialog in its Dark variant.
    reached_by: off_road
    notes: A small house on a flat round base. Judges and ambassadors move with the story (npc_moves).
  - id: poi:castle_door
    space: zone:castle_forecourt
    kind: door
    behaviour: "The castle door; its behaviour by story stage is entrance:castle_door's variants."
    also: [entrance:castle_door]
    reached_by: road
  - id: poi:fountain
