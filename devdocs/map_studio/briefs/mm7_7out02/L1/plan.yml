notes: "Heights are measured from the map's low ground (the town street and basin floor, datum zone:central_basin); the castle forecourt stands about 500 above it. All spawns lie east of the trunk. Deliberately off-road: the fort, the shrine, the Arbiter's hall, the obelisk, the cave, the hermit huts, the orchard and every watch fire's hilltop approach. Residence doors: town 8, hamlet 5, ridge huts 2. A later MAW overlay adds a dimensional-travel pedestal in the castle forecourt; it is not part of this design."
