    behaviour: Gives an apple.
    uses: {times: 1, per: party, reset: refill}
    gives:
      item: red_apple
    after_use: {shows: [bare fruit tree], hides: [fruit tree with apples]}
    condition: {any: [{season: spring}, {season: summer}]}
