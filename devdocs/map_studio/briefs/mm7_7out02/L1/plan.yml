landmarks:
  - id: landmark:arbiter_tower
    space: zone:east_knoll
    what: "The Arbiter's hall, a lone small house on its round base on the east knoll's shelf."
    seen_from: [zone:central_basin]
  - id: landmark:castle
    space: zone:castle_shoulder
    what: "Castle Harmondale on its shoulder, closing the west end of the main street: seen head-on from the town gate and along the whole street. Ruined at the start, low and broken; gains walls and towers as it is restored (state:castle_stage_2, state:castle_stage_3)."
    seen_from: [zone:market_end, zone:town_street, zone:gate_junction, zone:central_basin]
  - id: landmark:hill_fort
    space: zone:hill_fort
    what: "The hill fort's ring and four towers; the towers' fire marks it as dangerous from afar."
    seen_from: [link:high_road_basin, link:trunk]
  - id: landmark:temple_spire
    space: zone:civic_corner
    what: "The temple spire: the tallest structure in town, the town's skyline marker."
    seen_from: [zone:central_basin, link:high_road_basin]
  - id: landmark:town
    spaces: [zone:town_street, zone:market_end, zone:guild_terrace, zone:south_shelf]
    what: The town's roofs and streets.
    hidden_from: [zone:central_basin]
    screened_by: "The bowl's hills: only the castle and the spire show before the gate."
  - id: landmark:white_cliffs
    space: zone:white_cliffs
    what: "The bright white massif behind the lakes, drawing the eye to the cave."
    seen_from: [zone:central_basin]
sightlines:
  - id: sightline:street
    from: zone:gate_junction
    to: [landmark:castle]
    what: From the town gate the castle closes the view down the whole main street.
set_pieces:
  - id: set_piece:arbiter_messenger
    kind: scripted
    spaces: [zone:east_knoll]
    rule: "On entering the map after the party has given the artifact to the Arbiter, the humans or the elves, a messenger arrives, once, and starts the quest to choose a judge to succeed the Arbiter."
    inputs: [map load]
    enabled_by: {any: [{qbit: artifact_to_arbiter}, {qbit: artifact_to_humans}, {qbit: artifact_to_elves}]}
    gives:
      - qbit: succession_quest
      - qbit: arbiter_messenger_done
    disabled_by: {qbit: arbiter_messenger_done}
  - id: set_piece:fort_towers
    kind: trap
    spaces: [zone:hill_fort, zone:central_basin]
    emitters:
      - {space: zone:hill_fort, end: north-west tower, direction: nw}
      - {space: zone:hill_fort, end: north-east tower, direction: ne}
      - {space: zone:hill_fort, end: south-east tower, direction: se}
      - {space: zone:hill_fort, end: south-west tower, direction: sw}
    effect: {spell: fire spells (fireball and others)}
    targets: [zone:central_basin]
    rule: "On a short timer one tower, chosen at random, shoots a fire spell into its sector; a tower also fires into its sector when clicked."
    inputs: [short repeating timer, click on a tower]
    disabled_by: {qbit: fort_taken}
    notes: The timer's length is not in the brief ('a short timer').
  - id: set_piece:take_fort
    kind: ambush
    spaces: [zone:hill_fort, zone:central_basin]
    rule: "Stepping into the keep takes the fort, once: four waves of goblins arrive from the four sides, then the towers stop for good."
    inputs: [party steps into the keep]
    states: [held, taken]
    solution: Survive the waves.
    gives:
      qbit: fort_taken
    population:
      - {id: pop:fort_waves, slot: 1, groups: 4, per_marker: [10, 10], rank: a, hostile: true, notes: "Four waves of about ten, one from each side of the fort."}
    disabled_by: {qbit: fort_taken}
  - id: set_piece:watch_fires
    kind: puzzle
    spaces: [zone:ne_valley, zone:west_valley, zone:south_road_valley, zone:sw_highlands]
    targets: [pop:raiders]
    rule: "Each of the three watch fire pits (north, west, south) is lit by a click and stays lit. When the third is lit, the hidden raiding camp in the south-west highlands appears."
    inputs: [poi:watch_fire_north, poi:watch_fire_west, poi:watch_fire_south]
    states: [none lit, some lit, all lit]
    solution: "Light all three (fire_north, fire_west, fire_south), in any order."
    gives:
      qbit: raiders_called
height_bands:
  - id: band:highlands
    range: [1500, 3200]
    spaces: [zone:sw_highlands]
  - id: band:low_ground
    range: [0, 200]
    spaces: [zone:town_street, zone:market_end, zone:gate_junction, zone:central_basin, zone:south_hamlet, zone:se_lakes, zone:lake_chain]
    partly: [zone:se_lakes, zone:lake_chain]
    notes: "Town street, basin, the hamlet and the two lower lakes: the map's low ground. The south road's cutting also runs at this level."
  - id: band:rim
    range: [2000, 4000]
    spaces: [zone:outer_rim, zone:orchard_hill]
    notes: "Rim tops in the upper half of the map's height range; the highest knolls reach the map maximum and carry white chalk or snow caps."
  - id: band:shelves
    range: [380, 650]
    spaces: [zone:castle_shoulder, zone:castle_forecourt, zone:guild_terrace, zone:south_shelf, zone:east_knoll, zone:south_road_valley, zone:lake_chain, zone:outer_rim]
    partly: [zone:guild_terrace, zone:south_shelf, zone:south_road_valley, zone:lake_chain, zone:outer_rim]
    notes: "The town's three shelves (castle shoulder about 500, guild terrace stepping from about 290 to 640, residential shelf about 640), the Arbiter's shelf, the south road valley's floor (about 640, the road in a cutting below it), the bare shelf at the east travel side (about 640, in the outer rim) and the upper lake (about 400)."
states:
  - id: state:castle_stage_2
    condition: {qbit: castle_stage_2}
    shows: ["castle: repaired walls", two living trees beside the castle]
    hides: ["castle: ruined, broken walls", two dead trees beside the castle]
    notes: "Restoration stage two: castle parts shown, hidden and retextured. The castle door now leads to the interior map as a house dialog (throne room)."
  - id: state:castle_stage_3
    condition: {any: [{qbit: castle_stage_3_light}, {qbit: castle_stage_3_dark}]}
    shows: ["castle: upgraded towers"]
    notes: "Restoration stage three, reached by either the Light or the Dark castle quest."
  - id: state:fort_taken
    condition: {qbit: fort_taken}
    effects: [The fort's towers no longer fire (set_piece:fort_towers is disabled).]
  - id: state:raiders
    condition: {qbit: raiders_called}
    shows: [the raiding camp in the south-west highlands (pop:raiders)]
  - id: state:seasonal_bare
    condition: {any: [{season: autumn}, {season: winter}]}
    shows: [autumn or winter looks of the common trees across the map, bare fruit trees]
    hides: [summer looks of the common trees, fruit trees with apples]
  - id: state:town_lockdown
    condition: {qbit: guild_debt_failed}
    lifted_by: {all: [{kills: {group: pop:town_squad, all: true}}, {qbit: castle_cleared}]}
    locks: [building:weapon_shop, building:armour_shop, building:magic_shop, building:alchemist, building:tavern, building:bank, building:temple, building:training, building:town_hall, building:stable, building:guild_fire, building:guild_air, building:guild_spirit, building:guild_body, building:guild_water, building:guild_earth, building:guild_mind, building:town_houses, building:town_double_house, building:hamlet_houses, building:hamlet_long_house]
    effects: [the bank balance is wiped, pop:town_squad shows itself and turns hostile]
    notes: "The party failed the mercenary guild's deadline plot. The castle door, the Arbiter's hall and the ridge huts stay open."
npc_moves:
  - who: The humans' and the elves' ambassadors
    to: The castle's throne room (Castle Harmondale interior)
    condition: {qbit: arbiter_messenger_done}
    notes: Moved by set_piece:arbiter_messenger.
  - who: The two candidate judges
    to: One tavern each on other maps
    condition: {qbit: arbiter_messenger_done}
  - who: Two of the Arbiter's people
    to: Removed from the game
    condition: {qbit: arbiter_messenger_done}
landform:
  relief: "A rim of high bare hills runs round all four edges, broken by the three road valleys (north-east, west, south) and, on the east side, by a bare shelf at about 640 (the off-road east exit). Inside the rim, four parts: the sheltered town bowl (north-west, inner) on low ground with three shelves; the central basin, the largest low and nearly flat ground, with a few small rises (the fort's mound, a steep spire east of the fort rising to about 3,200 (no white cap), the Arbiter's knoll); the broad, wooded south-west highlands with a ridge spur separating the town bowl from the west road valley; and the south-east lake country below white cliffs. Roads keep to valley floors; the west road winds through its hill valley rather than climbing over."
  height_range: [0, 4000]
  water: "A chain of small lakes below the white cliffs in the south-east (two at basin level, an upper one on a shelf at about 400), draining by a stream south-west to the south edge. The outlet runs in its own ravine through the south road valley's floor, east of the road's cutting; a long footbridge crosses that ravine to the cave. No boats or docks."
  water_share: 0.015
  coast: "None: inland."
  caps:
    - {kind: white chalk or snow, share: 0.065, where: "The highest knolls of the rim; the largest a white massif in the south-east."}
  rim: {width_share: 0.14, broken_by: [link:high_road_valley, link:west_road, link:south_road], notes: Rim tops sit around the upper half of the height range.}
diagram: {text: "            [N rim]========== north road ==========> N exit (Tularean, 5d)\n               |                                 |   [N watch fire]   [Obelisk + crates]\n  [W rim]  [TOWN BOWL]--- high road east --------+ NE valley ------- [NE spawns]\n   orchard  castle > main street > town gate       \\\n   hill     (guilds N, homes S, market E)    junction  [CENTRAL BASIN]---- [Arbiter's knoll]\n               | (ridge)                   (sign)  |   [HILL FORT]  spire knoll       E shelf (off-road\n  [hermit huts on ridge]                   trunk S |       [shrine/altar]              exit, 7d)\n W exit <== west road == [SOUTH HAMLET] ==========+          [lake chain]\n (Erathia)  [W watch fire]   3-way sign  \\ south road     long bridge -> [WHITE CLIFF CAVES]\n  [SW HIGHLANDS: hidden raiding camp,     \\ bridge over cutting   [SE white cliffs, spawns, chest]\n   fruit trees, peak chest]                 > S exit (Barrow Downs, 5d) [S watch fire]\n"}
