    features: [road in its own cutting about 640 deep, stone bridge spanning the cutting overhead, watch fire beside the last stretch]
    purpose: "South road: south-east, then south in its own cutting below the south road valley's floor (about 640) and under a stone bridge that spans the cutting, to the south edge (the Barrow Downs). It crosses no water: the lake outlet has its own ravine further east."
  - id: link:town_gate
