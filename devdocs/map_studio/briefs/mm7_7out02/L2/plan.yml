    theme: "Main street and lanes paved in the road material; buildings front it directly."
    palette: ["flower01 planted beds: two long beds of about 30 each down the middle of the street", 7tree16 and 7tree13 broadleaf trees at the bed ends]
  - id: zone:west_valley
    name: West road valley and ridge
