    how: Marker at the south road exit.
    reached_by: road
  - id: entrance:stable_yard
    space: zone:stable_yard
    kind: both
    neighbours: [stable:erathia, stable:tularean, stable:tatalia, stable:arena]
    how: "The J.V.C. Corral's yard; departures go from the stable's house dialog."
    reached_by: road
  - id: entrance:west_road
    space: zone:west_valley
    kind: both
    neighbour: edge:west
    how: Marker at the west road exit.
    reached_by: road
