landmarks:
  - id: landmark:arbiter_tower
    space: zone:east_knoll
    what: "The Arbiter's hall, a lone small house on its round base on the east knoll's shelf."
    seen_from: [zone:central_basin]
  - id: landmark:castle
    space: zone:castle_shoulder
    what: "Castle Harmondale on its shoulder, closing the west end of the main street: seen head-on from the town gate and along the whole street. Ruined at the start, low and broken; gains walls and towers as it is restored (state:castle_stage_2, state:castle_stage_3)."
    seen_from: [zone:market_end, zone:town_street, zone:gate_junction, zone:central_basin]
  - id: landmark:hill_fort
    space: zone:hill_fort
    what: "The hill fort's ring and four towers; the towers' fire marks it as dangerous from afar."
    seen_from: [link:high_road_basin, link:trunk]
  - id: landmark:temple_spire
    space: zone:civic_corner
    what: "The temple spire: the tallest structure in town, the town's skyline marker."
    seen_from: [zone:central_basin, link:high_road_basin]
  - id: landmark:town
    spaces: [zone:town_street, zone:market_end, zone:guild_terrace, zone:south_shelf]
    what: The town's roofs and streets.
    hidden_from: [zone:central_basin]
    screened_by: "The bowl's hills: only the castle and the spire show before the gate."
  - id: landmark:white_cliffs
    space: zone:white_cliffs
    what: "The bright white massif behind the lakes, drawing the eye to the cave."
    seen_from: [zone:central_basin]
sightlines:
  - id: sightline:street
    from: zone:gate_junction
    to: [landmark:castle]
    what: From the town gate the castle closes the view down the whole main street.
set_pieces:
  - id: set_piece:arbiter_messenger
    kind: scripted
    spaces: [zone:east_knoll]
    rule: "On entering the map after the party has given the artifact to the Arbiter, the humans or the elves, a messenger arrives, once, and starts the quest to choose a judge to succeed the Arbiter."
    inputs: [map load]
    enabled_by: {any: [{qbit: artifact_to_arbiter}, {qbit: artifact_to_humans}, {qbit: artifact_to_elves}]}
    gives:
      - qbit: succession_quest
      - qbit: arbiter_messenger_done
    disabled_by: {qbit: arbiter_messenger_done}
  - id: set_piece:fort_towers
    kind: trap
    spaces: [zone:hill_fort, zone:central_basin]
    emitters:
      - {space: zone:hill_fort, end: north-west tower, direction: nw}
      - {space: zone:hill_fort, end: north-east tower, direction: ne}
      - {space: zone:hill_fort, end: south-east tower, direction: se}
      - {space: zone:hill_fort, end: south-west tower, direction: sw}
    effect: {spell: Fireball, level: 10}
    targets: [zone:central_basin]
    rule: "On a short timer one tower, chosen at random, shoots a fire spell into its sector; a tower also fires into its sector when clicked."
    inputs: [short repeating timer, click on a tower]
    period: 2.5
    disabled_by: {qbit: fort_taken}
    notes: "Each run one tower is picked at random; it casts Fireball (three times in five), Sparks or Death Blossom, at level 10 and master or grand master rank, into one of a few fixed points of its sector (north-west, north-east, south-east, south-west of the fort, 1,500 to 4,500 out). Clicking a tower fires into that tower's sector."
  - id: set_piece:take_fort
    kind: ambush
    spaces: [zone:hill_fort, zone:central_basin]
    rule: "Stepping into the keep takes the fort, once: four waves of goblins arrive from the four sides, then the towers stop for good."
    inputs: [party steps into the keep]
    states: [held, taken]
    solution: Survive the waves.
    gives:
      qbit: fort_taken
    population:
      - {id: pop:fort_waves, slot: 1, groups: 4, per_marker: [10, 10], levels: [4, 4], rank: a, hostile: true, notes: "Four waves of about ten, one from each side of the fort."}
    disabled_by: {qbit: fort_taken}
    notes: "The pressure plate is at the keep's entry; the four waves appear about 3,000 from the keep, one on each side."
  - id: set_piece:watch_fires
    kind: puzzle
    spaces: [zone:ne_valley, zone:west_valley, zone:south_road_valley, zone:sw_highlands]
    targets: [pop:raiders]
    rule: "Each of the three watch fire pits (north, west, south) is lit by a click and stays lit. When the third is lit, the hidden raiding camp in the south-west highlands appears."
    inputs: [poi:watch_fire_north, poi:watch_fire_west, poi:watch_fire_south]
    states: [none lit, some lit, all lit]
    solution: "Light all three (fire_north, fire_west, fire_south), in any order."
    gives:
      qbit: raiders_called
