  - id: link:lane_south
    from: zone:market_end
    to: zone:south_shelf
    kind: road
    purpose: "Town lane: a short spur south off the main street, the bank, stable and housing lane."
  - id: link:main_street_east
    from: zone:town_street
    to: zone:market_end
