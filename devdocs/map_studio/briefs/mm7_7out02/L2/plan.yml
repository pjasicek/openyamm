      - {id: building:town_gate_sign, type: gate sign, count: 1, notes: "A sign frame over the town entrance naming the town (hint only, no door)."}
      - {id: building:market_well, type: well, count: 1, notes: "Shared well kit (poi:well_market), in the market near the stable yard."}
      - {id: building:terrace_well, type: well, count: 1, notes: "Shared well kit (poi:well_terrace), on the guild terrace beside the Body guild."}
    palette: ["7tree16 and 7tree13 broadleaf trees: about 50, ringing the bowl slopes and courtyards, none on the street", "flower01 planted beds: about 75, mostly in the two street beds and house gardens", "flower02 and flower06 meadow flowers: about 25 on the bowl slopes", "7rock01, 7rock02, 7rock09 rocks: about 5, on the bowl slopes only"]
    population:
      - {id: pop:peasants, actor: Peasant, groups: 25, levels: [2, 3], placed: true, hostile: false, notes: "Human townsfolk, men and women, walking the streets and lanes."}
      - {id: pop:town_guards, actor: Guard, groups: 5, levels: [17, 17], placed: true, hostile: false, notes: "Swordsmen of the second grade, walking the streets."}
      - {id: pop:town_squad, actors: [{actor: Goblin, count: 4}, {actor: Hobgoblin, count: 2}, {actor: Goblin Lord, count: 3}, {actor: Guard, count: 2}, {actor: Adventurer, count: 4}], groups: 15, levels: [4, 24], placed: true, hostile: {qbit: guild_debt_failed}, hidden_until: {qbit: guild_debt_failed}, notes: "The lockdown squad (state:town_lockdown), spread through the streets, terraces and the castle forecourt; guards at level 17, adventurers at 24."}
    treasure:
      - {kind: floor_item, count: 11, pool: [mushroom, poppysnaps], notes: Reagents lying loose in the grass.}
    notes: "About 24 x 24 plan cells including the castle. Compact market core with nearest-building gaps of about 600 to 1,000; the guild terrace and the residential shelf looser (about 1,000 to 1,500). No Light or Dark guild. 17 service doors and 8 home doors."
  - id: zone:town_street
