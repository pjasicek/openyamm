notes: "Heights are measured from the map's low ground (the town street and basin floor, datum zone:central_basin); the castle forecourt stands about 500 above it. All spawns lie east of the trunk. Deliberately off-road: the fort, the shrine, the Arbiter's hall, the obelisk, the cave, the hermit huts, the orchard and every watch fire's hilltop approach. Residence doors: town 8, hamlet 5, ridge huts 2. A later MAW overlay adds a dimensional-travel pedestal in the castle forecourt; it is not part of this design. L2 adds kits and palettes per zone, the building list, mechanisms, population levels and atmosphere; decoration counts are targets with about 20% tolerance. Ground materials (MM7 world mapping): grass on grass_meadow, dirt on soil (with a stony variant on about a tenth), road on road_pebbles, white caps on snow, shores on sand_ripples, cliffs on rock; map-wide about grass 45%, soil 40%, white caps 7%, sand 2%, road 2%, water 1.5%."
