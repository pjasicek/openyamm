  - {kind: clickable watch fire pit (burnt-out to burning), count: 3, notes: set_piece:watch_fires.}
  - {kind: turret tower (timed and clicked spells), count: 4, notes: The fort's corner towers (set_piece:fort_towers).}
  - {kind: pressure plate, count: 1, notes: "The fort keep's entry (set_piece:take_fort), once."}
  - {kind: hatch (click to open for good), count: 1, notes: A floor hatch in the fort keep.}
  - {kind: chest, count: 4, notes: "Castle, fort keep, white cliff top, highland peak."}
  - {kind: crate, count: 8, notes: "Obelisk 2, trunk 2, hamlet 1, stable yard 3 (two wagons and the stable chest)."}
  - {kind: well, count: 3}
  - {kind: fountain, count: 1}
  - {kind: obelisk, count: 1}
  - {kind: altar (conditional teleport), count: 1}
  - {kind: "fruit tree (seasonal, picked look)", count: 8}
  - {kind: signpost (hint), count: 3, notes: "Gate junction, hamlet fork, and the town gate sign."}
  - {kind: map timer, count: 2, notes: The fort towers (every 2.5 game minutes) and the lockdown squad check (every 7.5 game minutes).}
  - {kind: on-load rule, count: 5, notes: "Castle stage looks, the raiders' visibility, the Arbiter messenger, the lockdown, the seasonal tree looks."}
  - {kind: well reset, count: 2, notes: "Hamlet well daily, market well weekly."}
