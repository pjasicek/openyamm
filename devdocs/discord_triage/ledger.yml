- id: OY-392
  kind: bug
  status: done
  title: 'MM8 Castle of Air: leaving puts the party inside the castle with walk-through walls'
  summary: Leaving the Castle of Air dungeon puts the party inside the castle area of the Plane of Air instead of on the stairs
    outside the door, as in the original; there every wall can be walked through except the stairs under the door.
  tags:
  - mm8
  - outdoor
  - collision
  - travel
  reported: '2026-10-30'
  updated: '2026-11-13'
  sources:
  - https://discord.com/channels/1563263436400623696/1563263444684111966/1565648342363672676
  - https://discord.com/channels/1563263436400623696/1563263444684111966/1565656640152403979
  commit: c91662e3ae
  resolution: a party arrival on a model floor up to its step height above the feet stands on it (the stairs under the castle
    door), not on a floor far below (scenario mm8/castle_of_air_exit_stairs.yml). Shipped in v2.0.
  notes: 'Owner: likely a bug. The exit event in d27.lua uses the original coordinates (-11771, -9444, 3234 in elema.odm,
    same as the decompiled D27), so the arrival point or the castle BModel''s collision/floor resolution differs.

    Investigated 2026-11-07 (effort M): The exit event uses the original coordinates: d27.lua:479 MoveToMap(-11771, -9444,
    3234) matches the decompiled D27 (mmext D27.txt:695). So the difference is in how elema.odm resolves arrival floor or
    support at that point. The party lands inside the castle BModel; walls collide only from their front side, so from inside
    every wall can be walked through except the stairs. Recommendation: Add a headless scenario that moves to elema.odm at
    that point and records the support face. Then fix the arrival floor search: keep the stairs face nearest the given Z instead
    of a floor below or inside the castle footprint.'
