    in the attack frames.'
- id: OY-28
  kind: bug
  status: open
  priority: low
  title: 'MM6 brown-clothed female NPC model: head-follow aims too high'
  summary: 'Visual defect in the 3D model, from a list of model notes covering several MM6/MM7 NPCs and creatures. MM6 brown-clothed
    female NPC model: head-follow aims too high.'
  tags:
  - mm6
  - models
  reported: '2026-10-24'
  updated: '2026-11-07'
  sources:
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1563541607037538336
  notes: 'Art backlog, outside the 2026-10-25 bug pass (devdocs/plans/discord_bugfixes_20261025/README.md).

    Investigated 2026-11-07 (effort S): The MM6 brown-dress woman is PeasantF2 `mm6_fmp`, with look nodes B_Neck/B_Head, 60
    degrees of yaw and 35 of pitch. WorldFxSystem::updateActorLook (game/fx/WorldFxSystem.cpp:1343-1352) adds the yaw and
    pitch toward the camera on top of the clip''s own head pose. It measures them from the body yaw and the rest head height.
    So a clip head already raised or turned (fmp Standing) ends above or beside the camera; other models do not show this.
    Recommendation: Check fmp''s Standing head orientation. Neutralise the head in the idle clip, or add a per-binding pitch
    offset (e.g. a negative `min_pitch_degrees`/offset in the look block) so the head aims at the camera.'
