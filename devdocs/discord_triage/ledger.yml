  notes: 'Investigated 2026-11-08 (effort S): likely a Dragon-race Cleric (MAW allows it). MAW counts Personality once for
    them, rings included (engine part); its item-side SP is zeroed for dragon race (zzClasses.lua:499, 645-648): about 48
    SP at level 1, 57 with this ring. OpenYAMM''s MawClassRules::baseMaxSpellPoints (MawClassRules.cpp:202-216) counts Personality
    twice without items (78), and applyClassBonuses zeroes the ring''s share (:293-296), so 78 either way. Plan: for dragon
    race and Death Knights compute base + factor x (level + total Personality effect) and set the magical SP bonus to the
    difference; skip Enlightenment for them; test in tests/MawClassTests.cpp. Decision: this lowers existing dragon-race casters''
    SP (78 to 48 here).'
