  title: Some pirates render almost black (model shadows)
  summary: Flying over Dagger Wound Island (MM8), one or two pirates near the future Regna landing look nearly black; model_shadow_quality=3.
  tags:
  - mm8
  - rendering
  - shadows
  reported: '2026-10-26'
  updated: '2026-11-13'
  sources:
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1564309745257545738
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1564328888224714854
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1564328931593560099
  commit: 3c2ca7fae2
  resolution: light probes baked inside buildings (no sun, under 2 % of the map's brightest ambient) are left out of the probe
    index at load, so actors sample the open ones (unit test). Shipped in v2.0.
  notes: 'Owner suspects baked shadows cooked against a building that is not there yet.

    Investigated 2026-11-07 (effort M): Outdoors, 3D creatures get their sun and ambient light from the bake''s probes (OutdoorRenderer.cpp:4403-4446).
    sampleProbe (game/outdoor/OutdoorLightingData.cpp:144-166) mixes the four nearest probes with a clear line of sight from
    the model''s centre. The bake puts probes on a 128-unit grid across every BModel''s footprint, 96 units above the terrain
    (tools/lighting/bake_outdoor.py:451-472), so many probes sit inside buildings and bake almost no light. A probe like that
    blackens any actor it reaches: when the line of sight to it passes through an opening, or when the BModel is absent or
    passable at runtime. The model then gets sunVisibility and ambient near 0 and draws black, as the black pirate and its
    reflection do. Recommendation: Skip probes with near-zero sky+indirect in sampleProbe, as if occluded (falling back to
    the sky-only fill). Better, mark probes enclosed by geometry invalid at bake time. Verify on Dagger Wound (MM8 out01)
    with model shadows on.'
