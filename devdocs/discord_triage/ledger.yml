    In real time, use a first-repeat delay of about 0.4-0.5 s (OS key-repeat style) and do not fire on a ready-member transition
    until that delay has passed; keep the TB-1 press-only rule. 2026-11-13: A player asked for a repeat-speed setting because
    a single click fired several times. Fixed in v2.0 (a held Attack repeats after half a second; the old quick repeat is
    the Fast attack repeat setting), commit aa20e079f4.'
