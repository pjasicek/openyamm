  - https://discord.com/channels/1563263436400623696/1563589245061308518/1566499210386341970
  commit: 93587dead9
  resolution: a bottle mixed into its potion takes the potion's size in the bag, in place when it fits, else wherever the
    party has room (InventoryBags::refitChangedItem; bench and drag mixing; unit test). Shipped in v2.0.
  notes: 'Investigated 2026-11-07 (effort M): The bench turns the empty bottle into the potion in place: bottleAsTarget makes
    the bottle the target (AlchemyBenchRuntime.cpp:106-115), and mix() changes *pTarget where it lies (676-735). mixReagentIntoBottle
    (InventoryItemMixingRuntime.cpp:302-321) changes objectDescriptionId but keeps the bottle''s width and height. A potion
    therefore keeps the bottle''s one-cell footprint while drawing its taller icon ("sits wrong", "fills one slot instead
    of two"). The held-bottle path recomputes the size (333-341); the in-place paths do not. Recommendation: After an in-place
    mix, set width and height from the result''s definition and re-place the item in its bag (or move it when the larger footprint
    does not fit there), for the bench and the drag-mix paths.'
