- id: OY-14
  kind: bug
  status: needs-decision
  title: Ooze collision box feels wrong
  summary: MM7 oozes are hard to hit or block oddly; their hitbox does not match the model.
  tags:
  - mm7
  - combat
  - monsters
  reported: '2026-10-24'
  updated: '2026-11-07'
  sources:
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1563542119140827367
  notes: 'Deferred in the 2026-10-25 pass (plan D5, decision 7): proposed radius 80 and height 64 instead of MMerge''s 47/120,
    to be checked in game first. 903e131b5 (v1.19) made monsters use their own height for collision, which may already help.
    Recommendation: re-test in 1.21 before changing table values.

    Investigated 2026-11-07 (effort S): MM7 oozes (monster_descriptors.txt rows 310-312) use the original MM7/MMerge collision
    of radius 47 and height 120: a narrow, tall cylinder under a wide, flat sprite. Since 903e131b5 (v1.19) monsters collide
    and are aimed at with their own height rather than twice their radius, which changed how oozes block and get hit. The
    report is vague and predates that change. Recommendation: Keep it in needs-decision: re-test in 1.21, and only if oozes
    still feel wrong, apply the deferred radius 80 / height 64 change as an explicit deviation from the original data.'
  priority: low
