  - controls
  reported: '2026-10-30'
  updated: '2026-11-13'
  sources:
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1565590918977818675
  commit: 5844bc2c79
  resolution: a held jump key jumps again on landing, indoors and outdoors; on a ladder, in water or in flight only a fresh
    press acts. Shipped in v2.0.
  notes: 'Jump is edge-triggered (OutdoorMovementDriver.cpp, jumpPressed = input.jump && !m_jumpHeld). Check the original
    before changing.

    Investigated 2026-11-07 (effort S): Jump is edge-triggered: OutdoorMovementDriver.cpp:203-205 (jumpPressed = input.jump
    && !m_jumpHeld) and the indoor equivalent at IndoorRenderer.cpp:15808-15810. The original repeats the jump while the key
    is held: OpenEnroth maps INPUT_ACTION_JUMP to TRIGGER_CONTINUOUSLY (InputEnumFunctions.cpp:99), and the jump only fires
    when grounded. Recommendation: Make jump level-triggered (request a jump on every grounded frame while held) indoors and
    outdoors. Keep fly-up edge-triggered.'
