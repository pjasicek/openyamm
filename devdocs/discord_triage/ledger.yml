  commit: 5844bc2c7
  notes: 'Investigated 2026-11-07 (effort S): Quick spells are stored by name (quickSpellName/extraQuickSpellNames, GameplayPartyOverlayInputController.cpp
    ~1720-1805) and resolved with SpellTable::findByName (GameplaySpellService.cpp:110-125). Mind "Charm" (60) and Vampire
    "Charm" (113) share a name, and the name index keeps the last row (SpellTable.cpp:176-177). A bound "Charm" therefore
    resolves to the other spell, which this character has not learned, so the game says "Spell not learned". This affects
    both rulesets. Recommendation: Store quick spells by spell id (add a save field or migrate names), or at least resolve
    the name to a spell the caster knows.'
