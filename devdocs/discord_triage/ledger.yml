- id: OY-438
  kind: bug
  status: done
  priority: low
  title: 'MAW: some enchanted items show no rarity colour on their name'
  summary: A Gold Ring of Earth Resistance (one enchantment) shows its name in the plain colour, while MAW would colour it
    green as an uncommon item.
  tags:
  - maw
  - items
  - ui
  reported: '2026-11-05'
  updated: '2026-11-13'
  sources:
  - https://discord.com/channels/1563263436400623696/1563589096608370698/1568013483843260528
  commit: 1fbd932e74
  resolution: MAW names colour by enchantment count below Ancient, as MAW's tooltip does, so an item stored as Common and
    enchanted later is coloured; the loot filter's ranking is unchanged (unit test). Shipped in v2.0.
  notes: 'MawItemRules::nameColor colours by mawShownRarity, which trusts a stored loot rarity before counting enchantments;
    an item that got Common stored (or came from a shop or chest) may stay uncoloured. Check the ring''s stored rarity.

    Investigated 2026-11-07 (effort S): MawItemRules::nameColor uses mawShownRarity, which returns the stored lootRarity when
    it is set and counts enchantments only when it is None (MawItemRules.cpp:72-85, 2050-2062). An item stored as Common (crafted
    or rolled Common, then enchanted) stays white. MAW colours the name by counting Bonus, Bonus2 and the second enchant,
    after the Celestial, Legendary, Primordial and Ancient checks (MawCore/Tooltip.lua:364-391), so a ring with one enchantment
    is green. Recommendation: Follow MAW in mawShownRarity: keep the stored tiers from Ancient up, and otherwise colour by
    the number of enchantments.'
