    to fix call sites each release. 2026-11-13: the user asked whether it is warranted. Agent''s assessment: no runtime catch-all.
    Every label would cost a catalog lookup per draw (per frame); text that only happens to equal an English key (a hero named
    "Rest", a save name) would be translated; one English word can need different translations by context (msgctxt "spell",
    "skill"), which a catch-all cannot choose; and the recent gaps were mostly composed text, which a whole-string fallback
    misses anyway. Proposed instead: a development check that logs any drawn text equal to an English catalog key (on only
    in the pseudo-language qps or a debug setting, no release cost), pointing at the call site that needs Engine::tr/localize.'
