- id: OY-140
  kind: bug
  status: open
  priority: low
  title: Models float on slanted surfaces
  summary: Models (decorations or items) placed on sloped ground hover above it.
  tags:
  - models
  - decorations
  - outdoor
  reported: '2026-10-26'
  updated: '2026-11-07'
  sources:
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1564370866525962322
  notes: 'Investigated 2026-11-07 (effort M): The terrain is drawn on a Catmull-Rom smoothed surface that may sit up to 32
    units off the native triangles (OutdoorGeometryUtils outdoorSmoothedTerrainHeight; level_generation/terrain/materials/README.md:28-31).
    Actors stay on the native collision height: updateActorLook and model placement use state.preciseZ plus zOffset. Only
    resting ground items are placed on the drawn ground (OutdoorGameView.cpp:2481-2503 item ground sampler). On convex crests
    and slopes the drawn ground is lower than the native surface, so creatures appear to float, as in the screenshot. Recommendation:
    Offset each terrain-standing actor model''s render height by renderedHeight(x, y) minus the native height, rendering only
    and keeping collision, as the item sampler does.'
