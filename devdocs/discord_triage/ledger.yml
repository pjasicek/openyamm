- id: OY-165
  kind: bug
  status: done
  title: Dragon race characters miss two extra starting skills
  summary: With Dragon as race, every class at party creation gets two fewer starting skills than expected.
  tags:
  - maw
  - party-creation
  - races
  - dragon
  reported: '2026-10-27'
  updated: '2026-11-13'
  sources:
  - https://discord.com/channels/1563263436400623696/1563589245061308518/1564592492400222209
  - https://discord.com/channels/1563263436400623696/1563589245061308518/1564594694908944466
  commit: 1fbd932e74
  resolution: party creation gives one extra skill pick for each free class skill the race cannot learn (a MAW dragon Knight
    picks four); MAW already grants Fangs, Scales and Dragon Ability at runtime. Not confirmed with the MAW author. Shipped
    in v2.0.
  notes: 'Developer said he would fix it; party creation was rewritten for 1.21 (399cd39a9). Re-check.

    Investigated 2026-11-07 (effort M): MAW forbids every weapon and armour skill for Dragons (rulesets/maw/content/race_skills.yml:56-103,
    max_mastery none). ClassSkillTable::getEffectiveStartingSkillAvailability returns None when the race''s effective cap
    is None (ClassSkillTable.cpp:697-700). So a dragon loses the class''s two free skills (Knight: Sword, Plate) and gets
    nothing in their place. The creation screen still asks for exactly two picks (NewGameScreen.cpp:2532-2535), and a dragon
    starts with 2 skills where every other race gets 4. MAW''s own creation copies the class starting skills regardless of
    race (MenuChooseCharacter.lua:218-220) and at load gives dragons Unarmed (Fangs), Dodging (Scales) and Dragon Ability
    (zzClasses.lua:421-430). The developer acknowledged the bug in the report thread; it is still present after the 1.21 creation
    rewrite. Recommendation: In the MAW ruleset, give a dragon Dragon Ability, Fangs (Unarmed) and Scales (Dodging) as free
    starting skills, as MAW''s load hook does. Otherwise raise the number of picks by the free skills the race lost. Confirm
    the intended count with the MAW author.'
