- id: OY-435
  kind: bug
  status: needs-info
  priority: low
  title: MM7 Gryphonheart's Trumpet messenger gives no letter
  summary: When the messenger arrives about Gryphonheart's Trumpet he mentions a letter but the player found none; the quest
    itself appears and resolves correctly.
  tags:
  - mm7
  - quests
  - maw
  reported: '2026-11-05'
  updated: '2026-11-07'
  sources:
  - https://discord.com/channels/1563263436400623696/1563589096608370698/1567922505736388639
  notes: 'The event (mm7_common.lua, the Artifact Messenger) does add item 1502 Message from Erathia. Check where the added
    item lands (cursor or a non-visible MAW bag) and whether it can be missed.

    Investigated 2026-11-07 (effort S): The 7out04 on-load event does SpeakNPC(412) and then AddValue(InventoryItem(1502))
    (mm7_common.lua:605-606), so the letter is queued in grantedItems. On desktop, granted items go to the cursor (GameplayHeldItemController.cpp:143-226).
    However, OutdoorInteractionController::closeActiveEventDialog (OutdoorInteractionController.cpp:1431-1440) discards any
    still-pending grantedItems. If the map-load dialog is closed before they are applied, the letter vanishes; the quest bit
    is set anyway. Recommendation: Check with a headless scenario (enter 7out04 with QBit 600 set, close the messenger dialog,
    assert item 1502); if it is lost, grant pending items before clearing them.'
