  notes: 'Investigated 2026-11-07 (effort S): The "of Power" special (+5 character levels, special_item_enchants.txt row 29)
    does nothing: its case in ItemEnchantRuntime.cpp:486-487 is an empty break. The engine already supports level modifiers
    (Character::levelModifier, GameMechanics::levelWithModifier). The original adds 5 to ATTRIBUTE_LEVEL while it is worn
    (OpenEnroth Character.cpp:2179-2181). Under MAW the special becomes death and eradication immunity instead (devdocs/maw/ITEMS_DATA.md
