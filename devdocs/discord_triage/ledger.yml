- id: OY-231
  kind: bug
  status: done
  title: 'Harmondale: black faces on the church bell tower'
  summary: The upper part of a church bell tower in Harmondale (MM7) renders solid black (lighting).
  tags:
  - mm7
  - rendering
  - lighting
  reported: '2026-10-30'
  updated: '2026-11-13'
  sources:
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1565590770063380500
  commit: 3c2ca7fae2
  resolution: the outdoor bake charts an exact duplicate face once and shares its chart; Harmondale (7out02) re-baked and
    installed; the bell tower renders lit. Shipped in v2.0.
  notes: 'Investigated 2026-11-07 (effort M): Harmondale (7out02.odm) has two coincident copies of the church bell tower:
    BModels 94 and 96, both named "Temple3_N", with identical bounds and 64 faces of the same textures. BModel 94''s faces
    all carry FACE_CLICKABLE 0x02000000 (the bell event) and 96''s do not. The Cycles bake (tools/lighting/bake_outdoor.py)
    treats each copy as an occluder of the other''s identical surface. Their lightmap texels self-occlude to black, and the
    runtime draws both black copies. 7out02.lighting was only re-hashed in 1.21 (refresh_scene_dependency.py), not re-baked.
    Recommendation: In the bake, skip a receiver''s exact coincident duplicate as a caster, or chart only one copy and share
    the page. Then re-bake 7out02 and check other maps for duplicate clickable BModels.'
