  priority: high
  commit: fc4e117a7
  resolution: In 1.16, Party::healMember healed members who had the Dead condition, then cleared Dead through updateMemberIncapacitatedCondition.
    A ruleset heal attached to Remove Curse (PartySpellSystem.cpp:2064-2087) could therefore revive. fc4e117a7 (v1.17) made
    healMember and adjustMemberHealth refuse dead or eradicated members (Party.cpp:8211). Remove Curse itself only clears
    Cursed (PartySpellSystem.cpp:1245).
- id: OY-171
  kind: bug
  status: needs-decision
  priority: low
  title: Loot bags float on water
  summary: Dropped loot bags float on the water surface.
  tags:
  - items
  - liquids
  reported: '2026-10-27'
  updated: '2026-11-07'
  sources:
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1564724200780992643
  notes: 'Investigated 2026-11-07 (effort S): Thrown or dropped items expire on water (OutdoorWorldRuntime.cpp:6567-6571),
    which matches the original splash (OpenEnroth SpriteObject.cpp:152-158). Loot-container bags are placed with zero velocity
    (OutdoorWorldRuntime.cpp:5838-5857 and 16943-16963), and the world-item update skips items that do not move (OutdoorWorldRuntime.cpp:6485-6488).
    So a bag placed over water never reaches the water check and stays on the surface. Recommendation: Decide what a bag over
    water should do: move to the nearest land (keeps the loot), sink with a splash (loses the loot), or keep floating. Moving
    it to land is the safe choice.'
- id: OY-172
  kind: bug
  status: done
  priority: low
  title: Emerald Island judge does not take an equipped longbow
  summary: Showing the longbow to the MM7 Emerald Island judge while it is equipped completes the step but the bow is not
    taken.
  tags:
  - mm7
  - quests
  - items
  reported: '2026-10-27'
  updated: '2026-11-13'
  sources:
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1564725638651445309
  commit: 93587dead9
  resolution: an event's item removal takes an equipped item when no bag holds one, as the item checks count it (unit test).
    Shipped in v2.0.
  notes: 'Investigated 2026-11-07 (effort S): The judge''s longbow step (Global.lua:7140-7145) checks HasItem(845) and then
    calls RemoveItem(845). Party::inventoryItemCount counts equipped slots (game/party/Party.cpp:5751-5800), so the check
    passes for an equipped bow. Removal goes through removeInventoryItemFromTargets -> Party::removeItemFromMember -> removeFromAnyBag
    (EventRuntime.cpp:1078, Party.cpp:3823-3853, 6010-6027), which only searches the bags. The equipped bow is never taken.
    The original also takes the item from the character (OpenEnroth Character.cpp:5197). Recommendation: When no bag holds
    the item, make removeFromAnyBag (or removeItemFromMember) take it from an equipped slot, so removal covers what the Cmp/HasItem
    check counts. Scripts that hand over equipped quest items then work too.'
