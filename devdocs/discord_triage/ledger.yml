- id: OY-487
  kind: bug
  status: done
  title: 'Battle orders: Bless is never treated as a buff the party already has'
  summary: 'v2.0 battle orders: most buff spells get the condition "when the party needs it" automatically, but Bless has
    no such condition, so an attack order with Bless casts it every time.'
  tags:
  - battle-orders
  - spells
  reported: '2026-11-12'
  updated: '2026-11-13'
  sources:
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1570465029999034391
  resolution: 'Working tree, 2026-11-13: an attack order''s buff (PartySpellSystem::isUpkeepBuffSpell: party buffs, member
    buffs such as Bless and Preservation, and the spells of several party buffs such as Hour of Power and Day of Protection)
    waits until it is gone from someone it reaches, by upkeepNeed without early renewal; before, only single party buffs were
    checked, so Bless and the composite spells recast every time. The order summary says ''when the party lacks it'' for all
    of them. Rule-made auras keep the old party-buff test. Checked the other buff kinds: every member-buff spell is covered;
