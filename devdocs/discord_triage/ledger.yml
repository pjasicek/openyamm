  - https://discord.com/channels/1563263436400623696/1563532826832535633/1567884103758389319
  notes: 'Owner suggests turning friendly fire off and suspects map data.

    Investigated 2026-11-07 (effort M): In the merged hostile.txt, Cleric Moon is friendly to the party (row 74, Party column
    = 0). The Priest of the Moon is placed in group 56, which 7d19.lua event 1 (onLoad) makes hostile (7d19.lua:84-87); the
    indoor apply path (IndoorWorldRuntime.cpp:21324-21335 and 14283-14320) looks correct. "Hits do no damage" is MAW''s friendly-fire-off
    rule for monsters not hostile to the party (MawCombatRules.cpp:171-176). So the open question is why group 56 was not
    hostile. One possible path: MAW revival or map reset rebuilds actors from their defaults (reviveSlainMonsters, IndoorWorldRuntime.cpp:18683-18737)
    after the onLoad hostility was applied. Recommendation: Ask for the save (ruleset, difficulty, whether the map was revisited,
    reset or revived). Then check whether a revived or reset actor loses the Aggressor/Hostile bits that the onLoad group
    event set.'
