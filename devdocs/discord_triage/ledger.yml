  - conditions
  reported: '2026-10-26'
  updated: '2026-11-13'
  sources:
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1564372794475814925
  commit: 5844bc2c79
  resolution: the cursed caster's 50 % roll comes after the target checks, so a cast still asking for its target never rolls
    (unit test). Shipped in v2.0.
  notes: 'Investigated 2026-11-07 (effort S): The 50% curse failure roll (PartySpellSystem.cpp:1607-1623) runs before the
    target checks. A targeted spell cast without a target first passes or fails the roll and returns NeedCharacterTarget.
    The cast is then repeated with the chosen target and rolls again. A cursed caster''s targeted spells therefore fail about
    75% of the time and can fail twice, and the first failure also spends mana and recovery. The original rolls once, when
    the queued cast runs. Recommendation: Roll the curse only on the real cast: skip the roll while the request still lacks
    the target that its rule needs (Need*Target / NeedUtilityUi), or move the roll after the target-resolution checks.'
