- id: OY-583
  kind: bug
  status: done
  title: Battle orders and quick-cast heals never pick MM9 hirelings
  summary: In MM9 a battle order "heal when an ally is below 70 %" does not heal wounded hirelings. The order's ally-health
    condition and the quick-cast auto-target of Heal and the cures only look at the five party members, so a hireling below
    the threshold neither triggers the order nor receives the heal. Reported on v2.0/2.1.
  tags:
  - mm9
  - battle-orders
  - spells
  - hirelings
  reported: '2026-11-12'
  updated: '2026-11-13'
  sources:
  - https://discord.com/channels/1563263436400623696/1570034244229529615/1570469734112034857
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1570507755314225263
  resolution: 'Working tree, 2026-11-13: the battle orders'' ally HP condition, the quick-cast target of heals, cures, revivals
    and member buffs, and the upkeep needs scan every combatant (Party::combatantCount), so MM9 hirelings are healed and buffed.
    Test: Mm9HirelingCombatTests ''automatic heals and upkeep buffs reach MM9 hirelings''.'
  notes: 'Confirmed in code. game/gameplay/GameplayActionController.cpp:867-893 (battleOrderSituation) computes lowestAllyHealthShare
    over party.members() only; game/party/PartySpellSystem.cpp:3428 onwards (quickCastCharacterTarget: heal, cures, revivals,
    buffs) also loops party.members() only. Hirelings are reachable through Party::combatantCount()/combatant() (Party.h:719-724;
    devdocs/mm9/MM9_HIRELINGS_PLAN.md says spells may target a hireling by its combatant index). Fix: iterate combatants in
    both places (a hireling''s reachable maximum is its row HP). MM6-MM8 unaffected (no hirelings there). Also reported elsewhere:
    The MM9 hirelings shown at the right are not chosen as targets by healing spells'' automatic targeting. The same report
    said they stayed with the party outside MM9 (fixed in 2.2: they now wait in Chedian).'
