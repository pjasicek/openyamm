- id: OY-553
  kind: bug
  status: done
  title: Special items never get their fixed enchantment (Noblebone Bow's Carnage, Moon Cloak's Dark Magic)
  summary: The Noblebone Bow fires ordinary arrows that do not explode, and its popup does not say "of Carnage"; in upstream
    MAW (and MMMerge) it explodes. A player's local patch confirmed the bow simply never received the Carnage power. Random
    "of Carnage" bows are believed to work. Reported in a MAW game around level 100-134.
  tags:
  - maw
  - items
  - combat
  - projectiles
  reported: '2026-11-08'
  updated: '2026-11-13'
  sources:
  - https://discord.com/channels/1563263436400623696/1563589245061308518/1569087293908717709
  - https://discord.com/channels/1563263436400623696/1563589245061308518/1569088236297396418
  - https://discord.com/channels/1563263436400623696/1563589245061308518/1569088731523321968
  - https://discord.com/channels/1563263436400623696/1563589245061308518/1569088931264336003
  - https://discord.com/channels/1563263436400623696/1563589245061308518/1569094660800905238
  - https://discord.com/channels/1563263436400623696/1563589245061308518/1569099244504228003
  - https://discord.com/channels/1563263436400623696/1563589245061308518/1569099317338312806
  - https://discord.com/channels/1563263436400623696/1563589245061308518/1569100203783360516
  - https://discord.com/channels/1563263436400623696/1563589245061308518/1569100892999782602
  - https://discord.com/channels/1563263436400623696/1563589245061308518/1570478524068794450
  resolution: 'Working tree, 2026-11-13: ItemTable::resolveSpecialItemEnchants resolves each Special item''s VarA name (a
    standard enchantment at VarB''s power, else a special one) once the enchantment tables load, and ItemGenerator::assignSpecialItemEnchants
    gives it to every new copy, map-placed ones included (indoor raw items too); Special items keep their own name. Save version
    177: Party::assignSpecialItemEnchants gives the party''s carried, stored and worn ones theirs (items already in opened
    chests or on the ground of visited maps are not migrated). The hand-written flat cold damage of the Axe of Balthazar is
    gone (its of Ice does it); Grognard''s Cutlass keeps Elf Slaying as an artifact power, no such enchantment exists. Test:
    InventoryEquipRegressionTests ''special items carry the enchantment their item row names''.'
  notes: 'Checked 2026-11-13: items.txt rows of material "Special" carry their enchantment by name in the VarA column (542
    Noblebone Bow "of Carnage", 1350 Moon Cloak "of Dark Magic", 1343 Villain''s Blade "Vampiric", 538-540 slaying, 1342/1346/1347-1354/1372
    ...). ItemTable.cpp:468 parses that column with parseInt, so the name becomes 0, and no code turns it into a specialEnchantId;
    the per-artifact switch has an empty case 542 (ItemEnchantRuntime.cpp:1444). The bow-shot Carnage path itself exists (GameMechanics.cpp:3326-3333,
    GameplayActionController.cpp:1835, ExplosiveArrows flag from ItemEnchantRuntime.cpp:476) and works for random "of Carnage"
    bows. Fix: resolve a Special item''s VarA name through the special enchant table (or give each Special item its specialEnchantId
    when created) in both rulesets; MAW keeps Carnage/Water Walking/Feather Fall powers through MawItemRules.cpp:526-533.
    MAW halves the explosion damage (its tooltip text "Explosive Impact! (half damage)"; MawCombatRules.cpp:1708-1716 quarters
    the roll). Several of these specials (Moon Cloak) are deliberately dropped under MAW, see OY-566.'
