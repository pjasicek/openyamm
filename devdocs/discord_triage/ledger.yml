  priority: low
  notes: 'Investigated 2026-11-07 (effort S): The code does not block resetting a beacon: the Set click overwrites any slot
    (PartySpellSystem.cpp:2493-2524) and MAW returns the solo scroll (MawSpellRules.cpp:1093-1097). However, the Lloyd window
    opens in Recall mode whenever a live beacon exists (GameplaySpellService.cpp:851-863, lloydsBeaconHasRecallableBeacon),
    and a caster without Water Magic has a single slot. While a beacon is live, a click on the slot therefore recalls unless
    the player first switches to the Set tab. That matches "can''t reset until it expires". The original (OpenEnroth LloydsBook.cpp:46)
    opens in Set mode. Recommendation: Ask whether they clicked the Set Beacon tab before the slot. Consider opening the window
    in Set mode like the original.'
