  resolution: inventory items answer a right-click over their whole grid cells, not only their icon's opaque pixels. Shipped
    in v2.0.
  notes: 'Investigated 2026-11-07 (effort S): Inventory items are registered for inspection with their icon rect and without
    wholeAreaHits (GameplayPartyOverlayRenderer.cpp:10620-10641). Outdoors the right-click inspect requires an opaque pixel
    (OutdoorGameView.cpp:4119-4125 passes requireOpaqueHitTest=true to GameplayHudOverlaySupport.cpp:625); indoors it passes
    false (IndoorGameView.cpp:2349). Left click picks by grid occupancy. So the right-click behaviour differs from left click,
    and differs between indoors and outdoors. Recommendation: Set wholeAreaHits on inventory-grid items and use their grid
    footprint as the hit rect. Keep opaque testing only for the paperdoll.'
