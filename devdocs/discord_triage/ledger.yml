  notes: 'Art backlog, outside the 2026-10-25 bug pass (devdocs/plans/discord_bugfixes_20261025/README.md).

    Investigated 2026-11-07 (effort M): The MM6 Titan `mm6_ttn` uses Meshy''s auto-rig with no finger chains, and its hands
    are rigid (mm6_ttn1_claude/README.md:15). Attack is a Meshy hook with the lunge halved, and the hand intersects the pauldron
