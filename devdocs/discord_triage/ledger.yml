- id: OY-132
  kind: bug
  status: needs-decision
  title: Ogres fall from the hilltop into the Alvar Ogre Fortress courtyard
  summary: Ogres on the hills around the MM8 Alvar Ogre Fortress chase the party standing at the entrance and drop into the
    courtyard where they get stuck; a killed one left no corpse.
  tags:
  - mm8
  - monsters
  - pathing
  - outdoor
  reported: '2026-10-26'
  updated: '2026-11-07'
  sources:
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1564176981204148284
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1564177572189700209
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1564177752242913283
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1564203745816871006
  notes: 'Owner confirmed it was not fixed in 1.14. 1.21 changed monster movement; re-test.

    Investigated 2026-11-07 (effort M): Outdoor walkers have no ledge or drop guard. The route planner limits drops to about
    128 (OutdoorWorldRuntime.cpp:11913-11916), but routes are only used while melee pursuit is active or line of sight is
    missing (OutdoorWorldRuntime.cpp:11868-11877). Otherwise, and whenever a plan fails or is partial, the ogre walks straight
    at the party. The steep-terrain slide (OutdoorMovementController.cpp:2068-2078) then carries it off the hilltop into the
    courtyard. The original had no ledge guard either (re_mm8/CREATURE_MOVEMENT.md, "Steep terrain and water"). Recommendation:
    Re-test on 1.21 first (per-actor route plans). If ogres still drop, decide whether to add a walker drop guard (refuse
    a direct step onto ground far below, or onto a steep downhill triangle, unless a route leads there). That is a deviation
