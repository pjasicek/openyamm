- id: OY-274
  kind: bug
  status: done
  priority: high
  title: 'Villain promotion: Alice Hargreave door stays locked'
  summary: For the MM7 Villain promotion, after taking the quest from William Setag and clearing the castle, the door to Alice
    Hargreave is locked and no promotion is possible; talking to Setag again does not assign the quest.
  tags:
  - mm7
  - promotion
  - quests
  reported: '2026-10-31'
  updated: '2026-11-13'
  sources:
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1566170860325179433
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1566174771211800669
  commit: 4b47a0411d
  resolution: 'Global_mm7_mmmerge.lua overrides Setag''s event 806: the Crusader check comes before the pitch, and a Crusader
    from Enroth (QBits 1635/1636) counts too (scenario mm7/villain_promotion_gate.yml). Shipped in v2.0.'
  notes: 'Investigated 2026-11-07 (effort S): Castle Gryphonheart''s door (7d33.lua:422-438) opens only with QBit 538 set.
    Only Setag''s "Villain" topic, event 806 (assets_dev/engine/events/Global.lua:7813-7833), sets 538, and only when the
    party has MM7''s Crusader award bits 1590/1591. Otherwise it leaves the topic and QBit unchanged, which is why talking
    to Setag again "assigns" nothing. 806 calls SetMessage with the full quest pitch first and the refusal ("must be promoted
    to Crusader") second. luaSetMessage appends every message (game/events/EventRuntime.cpp:9816-9843), so the player reads
    the whole pitch, which looks like a quest assignment. The original replaces the first message with the refusal. A Paladin
    promoted to Crusader in Enroth gets bits 1635/1636 (Global_mm6_mmmerge.lua:240), and MAW counts promotions from any world
    (rulesets/maw/data/promotions.yml), but 806 accepts only 1590/1591. The rest of the chain (803/805/807 overrides in Global_mm7_mmmerge.lua:243-307,
    Alice''s house 1158) looks correct. Recommendation: Override 806 in Global_mm7_mmmerge.lua so it checks the gate before
    showing the pitch (or make SetMessage replace within one execution). Accept a Crusader from any world (1635/1636, or a
    class 27 member) and say so in the refusal. Ask the reporter whether the Paladin became Crusader through Sir Charles Quixote
    in Antagarich.'
