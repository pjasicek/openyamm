  notes: 'Investigated 2026-11-07 (effort M): The MM7 Shoals (7out15.odm, UNDERWATER in map_stats) is only a fog and weather
    profile. isUnderwaterMap() (OutdoorWorldRuntime.cpp:8745) is used only for the wetsuit item check (GameplayItemService.cpp:280).
    The original blocks the spellbook and quick spells underwater (OpenEnroth Game.cpp:959, 1289), lets the party swim up
    and down freely without Fly, and applies no falling or fall damage (Outdoor.cpp:1018-1021, 1234-1236, 1301). OpenYAMM
    applies none of these rules. Recommendation: Use isUnderwaterMap() for underwater rules: refuse casting with the original
    "can''t do that while underwater" text, allow free vertical movement, and skip gravity and fall damage. The reporter likes
    casting there, so let the user confirm the spell block.'
