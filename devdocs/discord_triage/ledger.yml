    unchanged since 2ed3fb92a), so the separate animated Water Walk indicator shows as well. Lava and drowning checks already
    test Levitate directly (OutdoorMovementDriver.cpp:648/667, IndoorPartyRuntime.cpp:630). Recommendation: Hide the Water
    Walk indicator while Levitate is active, or apply only the Levitate buff and make the remaining Water Walk checks accept
    Levitate.'
