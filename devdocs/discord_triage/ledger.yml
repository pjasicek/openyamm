  notes: 'Investigated 2026-11-07 (effort S): Attack and Quick Cast act while the key is held and repeat after HeldActionRepeatDebounceSeconds
    = 0.14 s (GameplayActionController.h:166). They also fire at once when another member becomes ready while the key is still
