  title: SP reservation bar shows stale values in the inventory
  summary: After changing equipment that changes max SP, the reserved part of the SP bar looked wrong in the inventory screen;
    it corrects itself back in gameplay.
  tags:
  - maw
  - ui
  - auras
  reported: '2026-10-31'
  updated: '2026-11-07'
  sources:
  - https://discord.com/channels/1563263436400623696/1563589245061308518/1566039107816132618
  - https://discord.com/channels/1563263436400623696/1563589245061308518/1566041546422226945
  notes: 'Investigated 2026-11-07 (effort S): The reserved band is recomputed every frame from the live maximum: GameplayUiRenderer.cpp:876-884
    divides SpellRules::reservedSpellPoints by calculateEffectiveCharacterMaxSpellPoints, and MawSpellRules.cpp:882-917 takes
    a fixed percentage of that same maximum, rounded up. With more maximum SP the share can only stay equal or shrink, so
    a band that grew would need stale derived state that this code does not show. Only one of the two screenshots is cached,
    so the comparison cannot be checked. Recommendation: Ask for both screenshots, or a save before and after equipping the
    shield, and check whether the derived max SP updates on equip while the inventory screen is open.'
