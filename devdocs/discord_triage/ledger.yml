  commit: 1fbd932e74
  resolution: Mordred and Spiritslayer read Vampiric instead of Physical damage on hit. Shipped in v2.0.
  notes: 'The line comes from MawItemRules (artifact onHitType + " damage on hit"). The missing life leech looks intended
    per MAW''s artifact rework, per a tester. Reword the line to say what the on-hit effect does (or drop it for plain physical).

