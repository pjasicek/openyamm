- id: OY-302
  kind: bug
  status: open
  title: Ice Blast behaves like Poison Spray
  summary: Ice Blast fans out like Poison Spray instead of flying as one ball that bursts into shards.
  tags:
  - spells
  reported: '2026-11-02'
  updated: '2026-11-07'
  sources:
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1566626398330683423
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1566635139998416907
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1566745588035362880
  - https://discord.com/channels/1563263436400623696/1563263444684111966/1567919102427664485
  - https://discord.com/channels/1563263436400623696/1563263444684111966/1567919367855935659
  notes: 'Owner says the shotgun behaviour is an unintended early bug; the reporter likes it better than the original, which
    may make it a balance question.

    Investigated 2026-11-07 (effort M): Ice Blast uses PartySpellCastEffectKind::MultiProjectile (PartySpellSystem.cpp:602-605),
    the Poison Spray fan (2595-2630, 60-degree arc). The original fires one ball that bursts into seven shards (fallout) on
    impact (OpenEnroth CastSpellInfo.cpp:472, SpriteObject.cpp:889-920). An IceBlastFallout particle recipe exists but is
    not used for gameplay. The fan behaviour has been there since early versions. Some players prefer it. Recommendation:
    Implement the original: a single projectile that spawns ricocheting fallout shards on impact. Confirm with the user first,
    since players like the shotgun version; the Blaster Shotgun reuses this arc.'
- id: OY-303
  kind: bug
  status: done
  title: Dying in the Enroth endless arena sends the party to Dagger Wound Island
  summary: Death in the endless arena in Enroth (MM6) respawns the party on Dagger Wound Island (MM8).
  tags:
  - mm6
  - arena
  - death
  reported: '2026-11-02'
  updated: '2026-11-13'
  sources:
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1566824189627867328
  commit: 3bba4d1343
  resolution: the party remembers its last outdoor map (save version 155); a defeat in an Arena uses that map's continent
    for the death map and movie, as MMerge does (app regression case). Shipped in v2.0.
  notes: 'Investigated 2026-11-07 (effort S): MAW''s Endless Arena is d42.blv (MawRules.cpp:524, MawMonsterLevels.cpp:289).
    Its bolster row puts it on continent 1 (Jadame). resolvePartyDefeatRespawnDestination (game/app/GameApplication.cpp:14431-14490)
    uses that continent''s death maps. Because d42''s world is mm8, useFirstDeathMap is "Ravenshore not visited", so an Enroth
    party respawns at out01.odm, Dagger Wound. zarena.blv (continent 3) would send it to oute3. Recommendation: Respawn after
    a defeat in a shared, world-less map (the Arena maps) at the death map of the continent the party came from (last outdoor
    map or active world), not at the arena row''s continent.'
- id: OY-304
  kind: bug
  status: done
  title: Prismatic Light and Inferno hit through walls
  summary: Prismatic Light and Inferno damage monsters behind walls when the party is close enough.
  tags:
  - spells
  - los
  reported: '2026-11-02'
  updated: '2026-11-13'
  sources:
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1566868504605360313
  commit: 5844bc2c79
  resolution: indoors, Inferno, Prismatic Light and the other visible-creature spells skip monsters without a line of sight
    from the eye, as outdoors already did. Shipped in v2.0.
  notes: 'Investigated 2026-11-07 (effort S): Inferno and Prismatic Light hit every actor within 4096 whose sector is portal-visible
    and that stands in the view cone (IndoorWorldRuntime.cpp:16544-16700, PartySpellSystem.cpp:2904-2962). There is no line-of-sight
    test, so a monster behind a wall in a visible sector, such as the one next to a doorway, is hit. The original hits only
    drawn billboards whose centre the camera ray reaches unobstructed (OpenEnroth getActorsInViewport plus DoesRayIntersectBillboard).
    Recommendation: Add a party-eye to actor line-of-sight check to the visible-creature spells (Inferno, Prismatic Light,
    Fear, Soul Drinker), using the existing LOS helper.'
