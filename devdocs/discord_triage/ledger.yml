  notes: 'Investigated 2026-11-07 (effort M): The black blotches are blocky, stair-stepped clusters on the terrain and the
    seabed. Both screenshots are from Android, one dated 2026-10-17, so the problem predates recent changes. The shape suggests
    NaNs from mediump or ETC2 data in the terrain material shader (game/shaders/outdoor_terrain_materials.sh), or a NaN spread
    by a post-process (cinematic AO/blur). Nothing in the history since 2026-10-15 addresses it. Recommendation: Ask for the
    phone/GPU model, the game version, whether it persists with Cinematic grading/AO off, and the map.'
