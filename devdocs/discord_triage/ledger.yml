  notes: 'Since 98870c183 the multiplier is the weekday the condition was inflicted (faithful to all three executables), which
    can look random; check whether Merchant should apply to temples in the originals.

    Investigated 2026-11-07 (effort S): PriceCalculator::templeHealPrice (game/items/PriceCalculator.cpp:333-365) matches
