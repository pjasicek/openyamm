- id: OY-347
  kind: bug
  status: needs-info
  title: Priest of the Moon is friendly and takes no damage
  summary: In the MM7 Grand Temple of the Moon the Priest of the Moon is friendly and hits do no damage (wanted for his cape).
  tags:
  - mm7
  - monsters
  - indoor
  reported: '2026-11-05'
  updated: '2026-11-07'
  sources:
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1567868597135482971
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1567870526943400100
