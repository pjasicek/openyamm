- id: OY-344
  kind: bug
  status: done
  title: 'Solo: alchemy and crafting bag assignments are linked'
  summary: In a party of one (1.21), assigning the alchemy bag also assigns the crafting bag to the same bag.
  tags:
  - maw
  - solo
  - inventory
  reported: '2026-11-05'
  updated: '2026-11-13'
  sources:
  - https://discord.com/channels/1563263436400623696/1563589245061308518/1568005137513971744
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1568746472659353711
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1568749196738171064
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1568749472832557328
  - https://discord.com/channels/1563263436400623696/1563532826832535633/1568750816574046389
  commit: 3bba4d1343
  resolution: 'bag tags are 32 bits (save version 156, older saves migrate), so a solo character''s 25 bags can each be tagged;
    the tag buttons already name their bag (unit tests). Follow-up ("bags 2-5" in solo, i.e. tabs II-V): a pickup lands in
    a tagged bag on any tab (unit test), and crafting drops of water monsters that go straight to the party now use the tagged
    bags too. Shipped in v2.0.'
  notes: 'Investigated 2026-11-07 (effort M): Bag tags are uint8_t bitmasks and toggleTag/hasTag refuse bag >= 8 (InventoryBags.cpp:711-728;
    CharacterRulesetState.h:123-124). A solo party has 20 bags (MawItemRules.cpp:2602-2608), so bags on tabs 3-5 can never
    be tagged, and the status line still says "is no longer a ... bag". In addition, both tag buttons act on rulesetState.currentBag,
    which in the four-bag overview is the bag opened last (toggleBagTag, GameplayPartyOverlayInputController.cpp:2226-2244).
    Tagging crafting and then alchemy without zooming in therefore tags the same bag, which matches "assigning one assigns
    both". Recommendation: Widen the masks to 32 bits (new save version) and make the tag buttons act on an explicitly chosen
    or zoomed bag, or name the target bag on the button and its hover text. 2026-11-13: MAW solo: bags 2-5 could not be tagged
    for crafting/alchemy (message said tagged, materials went elsewhere); the developer said the 2026-11-07 fixes (32-bit
    bag tags, 3bba4d1343) cover it. Stays done.'
