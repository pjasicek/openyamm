    and buys random masteries (MercenaryRecruitmentRuntime.cpp:545-610, allCanonicalSkillNames). That includes MAW''s ruleset
    skills Cover, Mana Shield, Enlightenment and Retaliation. In MAW, Retaliation is only granted when Cover reaches 30 (MawSkillRules.cpp:250-255).
    MAW''s GenerateMercenary iterates Game.Classes.Skills[Class], the engine table that MAW''s DLL fills only with the base
    skills (NPCMercenaries.lua:278-282, Skills.lua projectEngineTable), so MAW mercenaries never roll the four new skills.
    Recommendation: Exclude ruleset skills (ids from FirstRulesetSkillId) from mercenary rolls, or at least Retaliation, which
    must come only from Cover 30.'
