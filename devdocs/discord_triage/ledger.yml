- id: OY-154
  kind: bug
  status: done
  title: Party homing missiles fail on monsters near the screen edge
  summary: Homing missiles sometimes do not home when the target is near the border of the screen (video in the report).
  tags:
  - maw
  - combat
  - projectiles
  reported: '2026-10-27'
  updated: '2026-11-13'
  sources:
  - https://discord.com/channels/1563263436400623696/1563589245061308518/1564428811246768171
  commit: 5844bc2c79
  resolution: a fallback target counts when any part of the monster's box is on screen (GameMechanics::actorBoxInViewport),
    indoors and outdoors; computed only on an attack. Shipped in v2.0.
  notes: 'Investigated 2026-11-07 (effort S): Party missiles home only on the actor picked at the shot (OutdoorWorldRuntime.cpp:18585
    attachPartyMissileHoming, fed by GameplayActionController.cpp:1298-1316). Without a crosshair target the fallback takes
    the nearest actor whose aim point (centre at target height, OutdoorWorldRuntime.cpp:17552-17566) projects inside the viewport
    (17652-17658, same indoors at IndoorWorldRuntime.cpp:18436). So a monster cut by the screen edge with its centre off-screen
    gets no target and the missile flies straight. MM8 (and so MAW, which homes on the engine''s object.Target, zzMAW-Skills.lua:666-690)
    picks from the drawn billboards (OpenEnroth Actor.cpp:3298 PickClosestActor), which counts partly visible monsters. The
    video has expired, so this is the likely cause rather than a confirmed one. Recommendation: Accept a fallback target when
    any part of its bounding box (not only the centre point) is inside the frustum. Re-test near the screen edge in a MAW
    game.'
- id: OY-155
  kind: bug
  status: open
  title: Z-fighting in Gharik's Forge
  summary: Many surfaces in Gharik's Forge flicker with z-fighting. Not MAW specific.
  tags:
  - mm6
  - rendering
  - indoor
  reported: '2026-10-27'
  updated: '2026-11-07'
  sources:
  - https://discord.com/channels/1563263436400623696/1563589245061308518/1564457192680333353
  notes: 'Investigated 2026-11-07 (effort M): Gharik''s Forge (MM6 6d18.blv) has many beam faces (BemH16a/BemV16a/BemSV16b)
    laid 4-12 units in front of coplanar walls (D2WlActr/D2Ceil1): 121 overlapping pairs, more than any other MM6 dungeon
    sampled. It also has three exactly coplanar duplicates: faces 115/118 vlcwl1LG, 238/1581 vlcwl2 vs D8wlBLE and 1541/1566
    BemVwal vs vlcwl4B. The indoor projection uses a 1-unit near plane with a 50000 far plane (IndoorRenderer.cpp:109-110,
    4262-4269), so depth precision at a few thousand units is around 1-4 units. The 4-unit beams therefore flicker at corridor
    distances, and the exact duplicates always flicker. Recommendation: Raise IndoorCameraNearClipDistance (e.g. 8-16) or
    switch indoors to reversed-Z with a float depth. Drop or offset the three duplicate faces with a scene face override.


    2026-11-07: face 115 (a duplicate wholly inside 118) hidden in 6d18_1.scene.yml. The beams 4-12 units in front of walls
    and the two coplanar detail pairs (238/1581, 1541/1566) need reversed-Z depth; a near plane of 4 or more clips Kriegspire/Korbu
    ceilings.'
