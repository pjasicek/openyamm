- id: OY-176
  kind: bug
  status: done
  title: Monsters walk far outside the outdoor map boundaries
  summary: Monsters move well outside the map's boundary; vanilla MM did this but MAW fixed it.
  tags:
  - maw
  - ai
  - outdoor
  reported: '2026-10-28'
  updated: '2026-11-13'
  sources:
  - https://discord.com/channels/1563263436400623696/1563589245061308518/1564910320697479220
  commit: 3c2ca7fae2
  resolution: outdoor actors are clamped to the map's travel bounds as they move, as MAW pulls strays back. Shipped in v2.0.
  notes: 'Investigated 2026-11-07 (effort S): Actors move through OutdoorWorldRuntime''s m_outdoorMovementController. That
    controller is built with the constructor that passes no map bounds (OutdoorWorldRuntime.cpp:5241, OutdoorMovementController.cpp:1752-1767).
    clampPositionToBounds (3434) therefore never limits actors, and monsters wander past the party''s travel edge as in vanilla.
    MAW pulls every outdoor monster back inside +/-22528 every 2 s (zzMaw-Monsters.lua:3536-3553, timer in zzMaw-Timers.lua:89).
    OpenYAMM has no equivalent. Recommendation: Clamp outdoor actors to the playable square (22528, or the map''s outdoorBounds)
    during movement. This is better done for both rulesets, or behind a MonsterRules hook if Standard must keep vanilla wandering.'
- id: OY-177
  kind: bug
  status: done
  priority: high
  title: Swapper mutator teleports the party into unsafe places
  summary: The Swapper boss mutator can swap the party past a one-way door (end of Smuggler's Cove), which may soft-lock,
    and once put the party under the floor in the passage under Regna.
  tags:
  - maw
  - bosses
  - mutators
  reported: '2026-10-28'
  updated: '2026-11-13'
  sources:
  - https://discord.com/channels/1563263436400623696/1563589245061308518/1564934390163841145
  - https://discord.com/channels/1563263436400623696/1563589245061308518/1565607715596926986
  - https://discord.com/channels/1563263436400623696/1563263444684111966/1567975258080677998
  commit: 3c2ca7fae2
  resolution: an indoor Swapper skips the swap when the party's body does not fit at the monster's spot (IndoorPartyRuntime::partyFitsAt).
    Outdoors is unchanged (the party is placed on the floor found there). Shipped in v2.0.
  notes: 'Investigated 2026-11-07 (effort M): A Swapper''s melee hit calls swapActorPlaces(attacker, nullopt) (MawCombatRules.cpp:3656-3660).
    Indoors this puts the party at the monster''s raw position with teleportPartyPosition (IndoorWorldRuntime.cpp:13973-13987,
    IndoorPartyRuntime.cpp:166) and checks only that the party''s old spot lies in a sector, for the actor. If the party''s
    larger body collides at the monster''s spot, or no floor is found there, IndoorMovementController::initializeStateFromEyePosition
    falls back to an unvalidated state with no sector or floor (IndoorMovementController.cpp:187-197). That gives the party
    under the floor of the screenshot. Outdoors teleportTo (OutdoorWorldRuntime.cpp:7457-7462) has no check at all. MAW itself
    swaps raw coordinates the same way (Damage.lua:1818-1821), so the one-way-door soft-lock is MAW behaviour. Landing outside
    the geometry is a defect of our engine. Recommendation: Before swapping, validate the destination for the party body (IndoorMovementController::airborneStateAt,
    or a grounded collision-free state, and the outdoor equivalent) and skip the swap (status "*Swap*" not shown) when the
    party does not fit. Ask the user whether also to refuse swaps across one-way doors; that would be a DEVIATIONS row.'
