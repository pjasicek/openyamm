    13918-13923). The new-game path (startNewSessionFromCharacterCreation, GameApplication.cpp:12314 onward) never requests
    a save. MM8 and MMerge autosave on a new game: MMExt fires BeforeNewGameAutosave from the first save of a session (reference/mmmerge/Scripts/Core/events.lua:917-930).
    Recommendation: Once the first gameplay frame of a new game has rendered, call the world runtime''s requestTravelAutosave
    (as map moves do), so the save gets its preview.'
