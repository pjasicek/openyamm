  notes: 'Remove Curse only clears Cursed (PartySpellSystem.cpp RemoveCurse case). Perhaps the same cause as the Regeneration
    revival (passive regeneration healing dead members, fixed in 1.21); re-test.

    Investigated 2026-11-07 (effort S): In 1.16, Party::healMember healed members who had the Dead condition, then cleared
    Dead through updateMemberIncapacitatedCondition. A ruleset heal attached to Remove Curse (PartySpellSystem.cpp:2064-2087)
    could therefore revive. fc4e117a7 (v1.17) made healMember and adjustMemberHealth refuse dead or eradicated members (Party.cpp:8211).
