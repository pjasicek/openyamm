# Map Studio's hosted page (openyamm-studio/README.md "The hosted page"): a static site on its own origin.
# Installed as /etc/nginx/sites-available/oyeditor.jasicek.net (linked from sites-enabled); the files live in
# /var/www/oyeditor, uploaded by openyamm-studio/web/scripts/deploy_hosted.sh. The headers are those of
# openyamm-studio/web/scripts/hosted_server.mjs: the page may reach only itself and a studio the visitor runs on
# their own computer (127.0.0.1); hashed app files and a release's core are immutable, pages are read again.
# The certificate is its own lineage (certbot certonly --nginx -d oyeditor.jasicek.net).

server {
    listen 80;
    listen [::]:80;
    server_name oyeditor.jasicek.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name oyeditor.jasicek.net;

    ssl_certificate /etc/letsencrypt/live/oyeditor.jasicek.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oyeditor.jasicek.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/oyeditor;
    index index.html;

    # stage_hosted.mjs writes <file>.gz beside every text and wasm file (nginx here has no Brotli module).
    gzip_static on;
    gzip_vary on;

    set $oy_csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* http://localhost:* ws://localhost:*; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'";

    # add_header in a location replaces the server's, so each location names all of them.
    location ~ ^/studio/[^/]+/(assets|core)/ {
        types {
            text/javascript js mjs;
            application/wasm wasm;
            application/json json;
            text/css css;
            image/svg+xml svg;
            image/png png;
            font/woff2 woff2;
        }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $oy_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        limit_except GET { deny all; }
        try_files $uri =404;
    }

    # The root page only redirects; the app declares its own empty icon.
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $oy_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }
}
