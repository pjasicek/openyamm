format_version: 1
kind: "mm9_map_import_manifest"
source_root: "mm9/extracted/WORLDS/WORLDS"
output_root: "assets_dev/worlds/mm9/maps"
notes:
  - "MM9 source maps are all LithTech DAT v66 worlds. target_format is the OpenYAMM import target."
  - "BLV maps use .scene.yml as the DLV/runtime-state replacement; no separate MM9 .dlv file exists."
  - "The classification below is intentionally explicit. Do not reclassify from DAT naming or sky/water markers alone."
