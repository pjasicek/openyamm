notes:
  - Original extracted REZ assets are mirrored here so MM9 DAT/DTX-native runtime work does not depend on generated
    ODM/BLV compatibility outputs as source truth.
  - Family folders remove the duplicate REZ nesting, for example TEXTURES/TEXTURES becomes source/textures.
  - Generated caches should live outside this source tree.
