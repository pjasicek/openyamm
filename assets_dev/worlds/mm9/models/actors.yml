# MM9 world actor models. Bindings here apply to the MM9 monster descriptors only (MM6-MM8 content keeps its own).
# MM9 dragonfly family (level_generation/creatures/mm9_dfly_claude): Meshy body weighted to the original MM9
# DRAGONFLY.abc skeleton, the MM9 clips resampled (StandAir, Flap, FidgetAir1, HAttackair1, Rattack1, WinceAir1,
# DieAir1+fall1+FallDOwn1); one shared skin, tiers by region mask + ramps from the three MM9 skins. Scale 100 is the
# MM9 size (the GLB is in LithTech units x 0.0256; MM9 world scale 2.56). Event times are the MM9 clip events:
# Bite 0.649 s (HAttackair1), rangeattack 0.673 s (Rattack1), released from the mouth.
# MM9 is a 3D game: its models' clips are its monsters' attack timing. An attack lasts its clip and applies at the
# clip's impact key (animation.events), as MM9 plays it; the rows' stand-in MM6-MM8 sprites time nothing
# (devdocs/mm9_rework/MM9_ANIMATION_AUDIT.md P1, game/maps/ActorModelManifest.h).
attack_timing: clip
# A fidget picks among the binding's `fidget` and its script clips fidget<n> and search<n>, as MM9 picks among a model's
# Fidget* and Search* clips (devdocs/mm9_rework/monster_ai/MM9_AMBIENT_ANIMATION.md, game/maps/ActorModelManifest.h).
fidget_variants: true
# MM9 plays the walk while its AI walks and the run while it runs (WalkTo, RunTo), not the clip that suits the speed:
# a townsperson strolling at MM9's WalkVelocity walks. A clip that would crawl or scurry outside its rate window gives way
# to one inside it (game/gameplay/ActorModelPresentation.h, actorModelIntendedGait).
gait: intent
actors:
# Mite: blue scales, violet belly, lavender wings (DRAGONFLY1)
- descriptor: MM9 Dragonfly A
  model: worlds/mm9/models/mm9_dfly.glb
  scale: 100.0
  yaw_offset: -1.570796327
  animation:
    cast: AttackRanged
    run: Running
    stride_length: 4.0
    run_stride_length: 4.0
    gait_rate: [0.8, 1.3]
    upper_body_root: Scene Root
    sockets:
      mouth: Socket_Mouth
    events:
      attack_melee: {impact: 0.649}
      attack_ranged: {impact: 0.673, release: mouth}
      cast: {impact: 0.673, release: mouth}
  clips:
    standing: Standing
    walking: Walking
    attack_melee: AttackMelee
    attack_ranged: AttackRanged
    hit: Hit
    dying: Death
    dead: Dead
    fidget: Fidget
  skin: dfly_a
