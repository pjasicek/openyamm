# Per-map table data that the registry (maps.yml, the orchestrator's) does not hold. Owner: A2. Map lanes send
# changes (spawn slots above all) to A2. tools/xeen/gen_maps.py writes map_stats.txt, bolster_maps.txt and
# outdoor_travels.txt from maps.yml and this file.
#
# Rows are written for every map that is built (maps.yml built_as_mm7_stand_in) or installed in the world
# (assets_dev/worlds/xeen/maps/<stem>); `include: all` writes all of maps.yml. Travel rows join two surface maps that
# are both installed in the world (an unbuilt neighbour's edge gets no row; its lane seals it with a sign).
#
# A spawn slot names a Xeen family (`family: goblins`, monsters.yml) or, until a built map is rebased, the installed
# monster family it was built with (`monster: Goblin`); `tier` is map_stats' Dif (0-5), `count` the group size per
# marker, `weight` the slot's share of the markers (%). `traps` lists placed monster rows that are deliberate traps far
# above the map's band (DECISIONS D-1.2): tools/xeen/balance.py counts them, in a column of their own, in the act of
# the quest that asks for the kill (`quest:`, that quest file's `act`; an explicit `act:` wins), or with no quest in the
# first act whose leaving party level (MAPS 0) is at least 60 % of the trap's level. `act_regions` (balance.py only, not table data) count the
# monsters standing in a part of the map in another act's budget, beside the traps (X5's east pocket in Act II, D-4 and
# D-6.1): {act, x_min, x_max, y_min, y_max, z_min, z_max} in game units, any bound left out is open (z for a BLV's
# floors: DD-03's stages).
# `act_rows: {IV: [row ids]}` (balance.py only) counts those rows in another act, placed or from a spawn marker
# (XD-13's stage 3 in Act IV, D-4; X7's south orcs in Act I, D-40).
# `no_travel: [north, ...]` leaves those edges out of outdoor_travels (the map leaves them by its own device).
# `count_friendly: [row ids]` (balance.py only) counts those rows although they are friendly at load (DD-24's People:
# the budget counts the war route, D-47).
# `arrivals: {<neighbour>: entrance:<id>}` lands the party crossing from that neighbour's edge at this map's named
# arrival (its installed <stem>.studio.yml, D-4) instead of the side's default; gen_maps writes the edge_spans entry.
# `xp_choices: {<quest id>.<hook>: times}` (balance.py only): an experience-or-goods choice the map offers that many
# times (Q-D27's wish lamps), added at its highest `xp` to the act's "most experience" line (D-53).
# `most_experience: [row ids]` (balance.py only) leaves those placed rows, peaceful or not, off the map's counted kill
# XP and adds them to the act's "most experience" kill line (D7's Megadragon and Sky Bandits, D-58).
# `row_before_install: true` writes the map's rows before the map is installed in the world, so its lane can test it
# from a scratch root (the game cannot load a map without its map_stats row).
schema: xeen.map_rows.v1

include: built

defaults:
  # continent_settings ids by the map's face (world.yml idRanges.continents: 6 Cloudside, 7 Darkside); the face's first
  # word decides (`cloudside sky` is 6, `darkside sky` 7). The elemental planes and the finale are 7 (A1, 2026-11-20:
  # the world's continent comes from the start map's bolster row). A face not listed stops the build.
  continents: {cloudside: 6, darkside: 7, planes: 7, finale: 7}
  encounter_chance: 10
  refill_days: 672
  alert_days: 0
  steal_perm: 0
  environment: {odm: PLAINS, blv: STONEROOM, open_air_blv: PLAINS}
  # Lock and trap difficulty by the map's treasure level, outdoors from the sheets (MAPS 1-2): 0/1 at the start,
  # about 4 mid-world, 8-10 late, 20 at the finale (research/MM678_CALIBRATION.md). Perception follows the lock.
  lock_trap_by_treasure: {0: [0, 0], 1: [1, 1], 2: [4, 2], 3: [6, 3], 4: [10, 5], 5: [15, 8], 6: [20, 10]}
  bolster:
    kind: LowerToEqual
    spells: true
    summons: false
    profs_max_rarity: 0
  travel_days: {default: 5, wilderness: 7}

travel_days:
  - {between: [X1, X2], days: 3}

# Engine award rows reworded while the party is in Xeen (data_tables/english/award_texts.txt, mode override; A1's merge
# point 18). The Warzone's arena (XD-20, D-39 Q2) adds award 45 + tier and counts the wins in %u; `sort` left out keeps
# the engine's.
