  - {id: 46, text: "Won %u Page battles in the Warzone.", note: XD-20}
  - {id: 47, text: "Won %u Squire battles in the Warzone.", note: XD-20}
  - {id: 48, text: "Won %u Knight battles in the Warzone.", note: XD-20}
  - {id: 49, text: "Won %u Lord battles in the Warzone.", note: XD-20}

