# Xeen's dungeon entrance lines (D-90 4): the rows the world adds to trans.txt (ids 5001-5999), shown in the standard
# MM6-MM8 entrance window in place of "Do you wish to enter X?". Owner: A3. tools/xeen/gen_quests.py writes
# data_tables/english/trans.txt from this file. Drafted in devdocs/xeen/drafts/XEEN_TRANS_ROWS_DRAFT.md (2026-11-22);
# the map lanes point each entrance's MoveToMap at its row when they rebuild (F16).
entrances:
- id: 5001
  dungeon: XD-01 Joe's Warehouse
  entered_by: 'x1 thing:warehouse_door (69). No row: x1 thing:culvert_grate (70, barred from inside)'
  text: 'A warehouse with a sign on the door: KEEP OUT. THIS MEANS YOU, GUNTHER.'
  source: current map text (m2.warehouse_door, locked)
