  started: {id: 111620, journal: "The only Soul Box left on Xeen is in Soul Storage, in Olympus. Corak needs it to hide from Sheltem.",
            until: [done]}
  done: {id: 111621, journal: "You have the Soul Box. Take it to Corak in his pod in the Forbidden Zone.",
            until: [m32.done]}
