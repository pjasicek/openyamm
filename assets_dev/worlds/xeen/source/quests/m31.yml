# M31 The Soul Box (QUESTS M31; Act V). Owner: A3. Format: devdocs/xeen/formats/QUESTS_FORMAT.md.
# Olympus, the city of the gods (D7), reached on Lucio's celestial boats after M30. The gods' servants let the Chosen
# Ones into Soul Storage, where one Soul Box is left; a plaque there names Alamar's true name (the answer of Castle
# Alamar's gate, M33; M28's journal says it too). The four prophecy statues of the square carry the source's verses.
# Zeus knows where Alamar keeps the real Prince Roland (M39's hint; Olympus is reached only after M21).
id: M31
title: The Soul Box
act: V
kind: main
status: full
giver: null
