          - when: {qbit: done}
            text: "The wind says Thickbark has grown a new ring. He is unbearable about it."
          - when: {all: [{qbit: q-c15.done}, {promotable: leafpoint}]}
            text: "My cousin Thickbark says you are civilized. He is a poor judge of most things, but not of that. Druids, stand in my shade. A tree's patience is the last lesson, and you have just learned it."
            do: [{set: done}, {xp: 3000}, {promote: leafpoint}]
          - when: {qbit: q-c15.done}
            text: "Civilized ones! Thickbark wrote, which for a tree means a century of rustling. If a druid among you ever wants the last lesson, come back."
          - text: "A tree does not talk to strangers who might be carrying axes."

rewards: {xp: 3000, gold: 0, promotion: "Great Druid -> Arch Druid (Light)"}
playthrough: "D4: Leafpoint (Civilized ones), after Q-C15: Great Druids become Arch Druids."
