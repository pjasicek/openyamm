          - when: {qbit: started}
            text: "You don't have enough Megacredits."
          - text: "How about a keep to go with those walls? Just 5 Megacredits!"
            do: [{set: started}]

hooks:
  keep:
    map: X3
    where: "the keep appears (BModel group by stage: Xeen.stageOf(\"newcastle\") >= 2); XD-13's stage 2"
    reads: [keep]

rewards: {xp: 4000, gold: 0}
