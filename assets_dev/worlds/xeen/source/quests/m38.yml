hooks:
  corner_fire:
    map: D7
    where: "the Skyroads' north-west corner (D-58 C2): the map asks 'What do you seek?' (the source's line); 'Fire' (any case) calls this hook, which shows the line on the status line and moves the party directly onto P1's entrance:d7_fall (Xeen.toPlane, standing, no falling damage); any other answer calls corner_wrong"
    status: true
    text: "The road ends in nothing. Far below, the nothing glows like a forge. You step off."
    do: [{lua: "Xeen.toPlane(\"fire\")"}]
  plaque_fire:
    map: P1
    where: "the fire statue decoration by the Fire Sleeper's chamber (S's xeen fire statue, indoor_decorations rows 4027-4030: its own black plinth with the plaque on the front; P1 has no plinth geometry, so the hook goes on the decoration, radius 224, solid and clickable; level_generation/decorations/xeen_planes_claude/README.md)"
    text: "A message at the base of the statue reads: Step One: When the time is right, activate the machines in the four corners of the other side of the world."
  test_fire:
    map: P1
    where: "'Accept the test of Fire?': Yes calls the hook, the map opens the test (its arena and guardians)"
    text: "You accept the test of Fire."
  test_fire_passed:
    map: P1
    where: "the test's three guardians dead (D-58 C3): the map's guardians' death event calls Xeen.planeTestCheck(\"fire\", <their group>), which runs this once when all three are dead; the gate to the sleeper's chamber opens then and on every load (fire_test)"
    sets: [fire_test]
    once: true
    text: "The last guardian falls back into the pit. The gate to the Sleeper's chamber grinds open."
  sleeper_fire:
    map: P1
    status: true   # D-90: experience, a find's answer or a death on the status line
    where: "the Fire Sleeper's couch (clicked, every time)"
    states:
      - when: {qbit: fire}
        text: "Fire Sleeper: I am awake and my confidence is at 100%. Grunfeld field generator is active and reports 100% confidence."
      - when: {all: [{award: m30.chosen}, {qbit: m37.air}, {qbit: m37.fire}, {qbit: m37.earth}, {qbit: m37.water}]}
        text: "Fire Sleeper: I am awake and my confidence is at 100%. Grunfeld field generator is active and reports 100% confidence."
        do: [{set: fire}, {award: fire}, {xp: 10500}]
      - when: {award: m30.chosen}
        text: "Fire Sleeper: I am awake and my confidence is at 100%. Awaiting Grunfeld field activation."
      - text: "Fire Sleeper: The Guardian has not informed me of your status as Chosen Ones. Much as I would like to, I am unable to fully awaken."
