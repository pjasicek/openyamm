# M38 The Elemental Sleepers (QUESTS M38; Act VI). Owner: A3. Each plane (P1 Fire, P2 Air, P3 Earth, P4 Water) is
# reached by stepping off a Skyroads (D7) corner after naming its element (the sky asks "What do you seek?"; the
# Pharaoh's M36 topic and autonote 4137 give the words and corners). Each plane has its test ("Accept the test of
# Fire?", the map's arena), a statue plaque with one of the source's four Steps, a chest, and its sleeper. The sleeper
# answers in three ways, as the source's (dark/aaze0025-0028): not Chosen Ones; Chosen but the Reflectors (M37) not all
# humming ("Awaiting Grunfeld field activation."); or awake, which gives its award (one hook with three states).
