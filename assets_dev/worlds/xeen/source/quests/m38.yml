  # the guardians and the pit read it on every load
  fire_test: {id: 111764, note: "P1's test passed: the gate to the Fire Sleeper's hall stays open"}
  air_test: {id: 111765, note: "P2's test passed"}
  earth_test: {id: 111766, note: "P3's test passed"}
  water_test: {id: 111767, note: "P4's test passed"}

