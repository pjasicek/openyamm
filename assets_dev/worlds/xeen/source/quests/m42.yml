    fail_text: "Dragon Pharaoh, Guardian of Xeen: In order for me to commence the unification ceremony, you must have the Cube of Power and the Scepter of Temporal Distortion. Also, the four Elemental Sleepers must be awakened."
    else_text: "The shrine is quiet. The pavilion is still there; somebody has left cake."
  ceremony:
    map: P5
    where: "the cinematic's done event (played out or skipped; generated, global event 42149): the ceremony text, once; the certificate follows when the window closes"
    sets: [ceremony_shown]
    once: true
    text: "The Dragon Pharaoh sets the Cube of Power in one hand of the shrine and the Scepter in the other. \"Let the two faces of Xeen be one world again.\" Far off, four sleepers answer at once. The sky turns over, and for a moment you see both faces of Xeen together: a whole world, close to its sun. When you can see again there is a pavilion on the cloud, Prince Roland and Queen Kalindra under it, and the Pharaoh, looking pleased with himself, reading the vows."
  disc:
    map: P5
    where: "the cloud-stone disc beside the pavilion's open south side, shown after done (D-56 change 7): the map's event shows this line and moves the party to entrance:fd03_roof (4608, -3968, 0) facing 512"
    requires: {qbit: done}
    reads: [done]
    status: true
    text: "You step onto the disc. It drifts back along the cloud road and sets you down by the stair house."

