npcs:
  4405:              # Prince Roland (the real one, M39) under the pavilion: A2's row 11920 (D-56 Q6)
    topics:
      - n: 1
        label: The wedding
        show: {all: [{qbit: done}, {lua: "Xeen.onMap(\"Clouds of the Ancients\")"}]}
        text: "Married on a cloud, by a dragon, with cake. My brother will not believe a word of it. Thank you, Crusaders: for the coffin, and for this."
  5001:              # Queen Kalindra in her wedding look under the pavilion: A2's row 11921 (D-56 Q6)
    topics:
      - n: 2
        label: One world
        show: {all: [{qbit: done}, {lua: "Xeen.onMap(\"Clouds of the Ancients\")"}]}
        text: "One world, and one sun. I stood in daylight this morning and nothing happened to me at all. I could get used to that. The Darkside owes you, Crusaders. So do I."

