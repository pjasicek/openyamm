# M42 The Clouds of the Ancients (QUESTS M42; Act VI, the ending). Owner: A3. P5 above Darkstone Tower (M41's seal;
# D-56). The source's walk (dark/aazex129): the Pharaoh's note on a post at the start, by the stair house's door; one
# ring of cloud road past three "Rest Stop" huts and ten boards naming New World Computing's games (the source's
# spellings, "Planets Edge"); "The observatory is closed."; his shrine. The shrine wants the Cube and the Scepter and the
# four sleepers awake (the source's check). Then the unification: the click takes the items, sets done, gives the award
# and the experience and starts the map's cinematic `unification` (evt.PlayCinematic); its done event (played or
# skipped) shows the ceremony text once, and when that window closes the completion certificate follows (A4's world.yml
# `completion` on 111840; A1 holds it back during the cinematic and an open window). The Pharaoh's voiced line plays
# only from the cinematic's cue (D-38). After the wedding Roland and Kalindra stand under the pavilion and talk; a
# cloud-stone disc takes the party back to the stair house. Falls land on X5 (Xeen.skyFallTo("p5")). Town Portal and
# Lloyd's Beacon work on P5; only Fly is off.
