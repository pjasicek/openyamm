# Q-D24 The Enchanted Boulders (QUESTS 2.2 Q-D24; Act V, D-16). Owner: A3. Seven boulders on D5 each speak one line of
# the source's riddle (dark/aaze0010, aaze0014: "My first is in apple and also in pear." ... "My last is in night but
# not in light."); the last asks "What am I?". A sign by the road tells the story outright (dark/aaze0031:21: "A dying
# paladin gave all his magical armor to the enchanted boulders of the land for safekeeping."), so the answer is
# given. The right answer (PALADIN) gives the paladin's armour (A2's 12529) and experience; the source's "visit the
# other boulders for their treasure": after it each of the other six crumbles once when clicked and leaves one random
# treasure-level-5 item, then is hidden (D-49 Q3; two clusters: 1, 2 and 7 west, the sign and 3-6 east).
