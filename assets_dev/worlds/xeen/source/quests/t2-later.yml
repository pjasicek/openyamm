# T2-LATER: tier-2 promotions for members who join later or reach the class later (QUESTS 3.2). Owner: A3 (A3-promo,
# 2026-11-21). Format: devdocs/xeen/formats/QUESTS_FORMAT.md. Each tier-2 quest below promotes every eligible member in
# its hand-in and pays there (its own file); like the T1 files and T2-A/T2-CLAN/T2-LEAFPOINT, the promoter then keeps a
# topic that promotes members who are eligible later, unpaid (MM9's composite model, Xeen.Promotions). Light or Dark:
# the topic of a route shows only after that route's hand-in (Sharla's after the polite route, Kramer's after the
# bounty, the Master Thief's after the inner circle). The map-hook promoters' later paths (Q-D13's throne and Hobstadt,
# Q-D22's cauldron, Q-D23 at Master Morbius): see D-74 (devdocs/xeen/reviews/D74_DECISION.md); they live in their files.
id: T2-LATER
