source: "QUESTS 3.2; MM9's composite model (Promote our eligible characters.)"

npcs:
  4905:              # Dreyfus, High Priest of Mok (Q-D6: Crusader -> Hero, Priest -> Priest of Light)
    topics:
      - n: 1
        role: promotion
        show: {all: [{qbit: q-d6.done}, {promotable: heretics}]}
        text: "Another servant of the light who has not knelt to Mok? Kneel. Crusaders rise as Heroes, Priests as Priests of Light. Mind the candles."
        do: [{promote: heretics}]
  5101:              # Sharla (Q-D10, the polite route: Hunter -> Ranger Lord)
    topics:
      - n: 2
        role: promotion
        show: {all: [{qbit: q-d10.done}, {qbit: q-d10.polite}, {promotable: sprites}]}
        text: "Another hunter the forest has not met? It has now. Walk it as its lord."
        do: [{promote: sprites}]
  4952:              # Luna (Q-D20: Warrior Mage -> Master Archer)
    topics:
      - n: 3
        role: promotion
        show: {all: [{qbit: q-d20.done}, {promotable: statuettes}]}
        text: "The altar still hums. Bow and spell together? Stand in its light. Rise, Master Archer."
        do: [{promote: statuettes}]
  5217:              # Astra (Q-D14: Rogue -> Spy)
    topics:
      - n: 4
        role: promotion
        show: {all: [{qbit: q-d14.done}, {promotable: quarter}]}
        text: "The guilds still talk about you. This one walks unseen too? Then the word is Spy."
        do: [{promote: quarter}]
  5210:              # Nasir, Light Guildmaster of Sandcaster (Q-D18: Wizard -> Archmage)
    topics:
      - n: 5
        role: promotion
        show: {all: [{qbit: q-d18.archmage}, {promotable: jewel}]}
        text: "Ellinger's letter is in my files, and it says 'the bearer'. Close enough. Wizards, take the robes."
        do: [{promote: jewel}]
  4914:              # Kramer (Q-D11, the bounty: Hunter -> Bounty Hunter)
    topics:
      - n: 6
        role: promotion
        show: {all: [{qbit: q-d11.bounty_paid}, {promotable: bounty}]}
        text: "A hunter who works for pay? The caravan guild's title is yours too. Bounty Hunter. It comes with a form."
        do: [{promote: bounty}]
  4950:              # Brother Reger (Q-D3: Initiate -> Master)
    topics:
      - n: 7
        role: promotion
        show: {all: [{qbit: q-d3.done}, {promotable: drawkcab}]}
        text: "Another walker of the inner way? Master you are now. Backwards, naturally."
        do: [{promote: drawkcab}]
  5109:              # The Master Thief (Q-D19, the inner circle: Warrior Mage -> Sniper, Rogue -> Assassin)
    topics:
      - n: 8
        role: promotion
        show: {all: [{qbit: q-d19.inner_circle}, {not: {qbit: q-d19.master_slain}}, {promotable: southern}]}
        text: "More hands for my trade? The ledger has room. Inner circle. Don't touch the chest on your way out."
        do: [{promote: southern}]

