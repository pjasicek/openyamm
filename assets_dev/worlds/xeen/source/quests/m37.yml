    map: X6
    status: true   # D-90: experience, a find's answer or a death on the status line
    where: "the Air Reflector on the north-west rim corner (prompt 'Reflector. Activate?'; Yes calls the hook)"
    requires: {qbit: m36.started}
    sets: [air]
    once: true
    do: [{xp: 8000}]
    text: "The Reflector hums quietly. Somewhere far to the south, something answers it."
    fail_text: "A machine of the Ancients, cold and silent. Its panel shows a dragon's eye, closed."
    else_text: "The Reflector hums quietly."
  reflector_fire:
    map: X7
    status: true   # D-90: experience, a find's answer or a death on the status line
    where: "the Fire Reflector on the north-east rim corner (prompt 'Reflector. Activate?')"
    requires: {qbit: m36.started}
    sets: [fire]
    once: true
    do: [{xp: 8000}]
    text: "The Reflector hums quietly. The heat of the mountain seems to lean towards it."
    fail_text: "A machine of the Ancients, cold and silent. Its panel shows a dragon's eye, closed."
    else_text: "The Reflector hums quietly."
  reflector_earth:
    map: X5
    status: true   # D-90: experience, a find's answer or a death on the status line
    where: "the Earth Reflector on the south-west rim corner, in the Land of the Giants (prompt 'Reflector. Activate?')"
    requires: {qbit: m36.started}
    sets: [earth]
    once: true
    do: [{xp: 8000}]
    text: "The Reflector hums quietly. The snow on its housing slides off in one sheet."
    fail_text: "A machine of the Ancients, cold and silent. Its panel shows a dragon's eye, closed."
    else_text: "The Reflector hums quietly."
  reflector_water:
    map: X1
    status: true   # D-90: experience, a find's answer or a death on the status line
    where: "the Water Reflector on the south-east rim corner (prompt 'Reflector. Activate?')"
    requires: {qbit: m36.started}
    sets: [water]
