# M37 The Reflectors (QUESTS M37; Act VI). Owner: A3. The four Ancient machines on the world's rim at Cloudside's
# corners, each guarded (the map lanes' fights): Air on X6 (north-west), Fire on X7 (north-east), Earth on X5
# (south-west), Water on X1 (south-east) (research MM4 3a: the Air and Earth corners named in the source's map; MAPS'
# sheets). The source's prompt "Reflector. Activate?" and answer "The Reflector hums quietly." (xeen/aaze0001:17-18).
# The source switches them on at any time; here they wake only after the Pharaoh's checklist (m36.started), so a low
# party on X1 meets a silent machine. The sleepers (M38) read all four bits.
id: M37
title: The Reflectors
act: VI
kind: main
status: full
giver: 5453          # The Dragon Pharaoh (M36's checklist)
maps: [X1, X5, X6, X7]
level: 56
block: 37
after: [m36.started]
source: "QUESTS M37; xeen/aaze0001:17-18, aaze0004:0-1, aaze0021:0, aaze0024:1"

qbits:
  air: {id: 111740, note: "X6's north-west rim (A5, event 43)",
       journal: "The Dragon Pharaoh wants the Air Reflector at the north-west corner of the Desert of the Sphinx turned on.",
       journal_while: [m36.started], until: [air]}
  fire: {id: 111741, note: "X7's north-east rim (A5, event 37)",
        journal: "The Dragon Pharaoh wants the Fire Reflector at the north-east corner of Mount Firestone turned on.",
