items:
  ligonos_skull: "Ligono's skull; the rocks at the world's edge (X2); cast into the surf at Ligono."

npcs:
  4155:              # Ligono
    topics:
      - n: 1
        role: quest
        show: {not: {qbit: done}}
        states:
          - when: {item: ligonos_skull}
            text: "My skull! Thank you! Already I can feel my tie to this world fading. Listen to the sound of the surf for your spell. (A book washes up at your feet: Recharge Item.)"
            do: [{take: ligonos_skull}, {set: done}, {clear: started}, {give: "engine:427"}, {xp: 4000},
                 {move_npc: [4155, 4814]}, {lua: "evt.SetMonGroupBit(55, MonsterBits.Invisible, 1)"}]   # X2's surf group 55 (A5's on-load event 221 does the same)
          - when: {qbit: started}
            text: "I see you don't have my skull yet. Well, that's ok. I've been here for a very long time. I don't mind another century or so. Don't worry about me. I'll just keep washing up on the shore here."
          - text: "I hate the surf. I have been trapped here since I died, crashing forward and pulling back, forward and back. I am sick of it. If you bring my skull and cast it into the surf here, I will be set free. I think my skull was pulled by the currents to the south and lies near the edge of the world. Retrieve my skull and I will teach you a spell before I go."
            do: [{set: started}]

      - n: 2
        label: Warning
        show: {qbit: done}
        text: "You came! Up here a spirit hears things. Alamar is not his name. Read the plaques of this city before you go to his castle, and do not go without a way to hide what you carry from him."

