          - when: {qbit: started}
            text: "The beasts still live. I wish someone would kill them. Three of them, big as barns. I'd not go near them without a great deal of practice."
          - text: "The fish supply is low. I am sure some sort of lake beasts are eating all the fish. If you kill the beasts, I will be indebted to you."
            do: [{set: started}]

hooks:
