npcs:
  4402:              # Artemus
    topics:
      - n: 1
        label: Crodo
        states:
          - when: {qbit: m21.crodo_freed}
            text: "Crodo is free. Good. The King was pleased for almost a minute, and then asked about the mirror."
          - when: {qbit: crodo_quest}
            text: "You haven't found Crodo yet. Keep searching."
          - when: {qbit: m5.audience}
            text: "Years ago King Burlock met Crodo, a kindly old sorcerer who became the King's friend. Baron Darzog, who was the King's master sorcerer, became very jealous of this friendship. I tried to warn the King that Darzog's jealousy would lead to no good, but he wouldn't listen to me. Now Crodo and Darzog have both disappeared and I fear that Crodo has been abducted. Perhaps Darzog has imprisoned him in his tower. If King Burlock were not so obsessed with the search for the Sixth Mirror, I'm sure he would have you search for him there."
            do: [{set: crodo_quest}, {autonote: darzog}]
          - text: "See the King first. Everyone sees the King first. Then they come to me."

