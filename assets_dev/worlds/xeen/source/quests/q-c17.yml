# Q-C17 The Wand of Faery Magic; racial promotion Dark Elf -> Patriarch (QUESTS 2.1, 3.2). Owner: A3.
id: Q-C17
title: The Wand of Faery Magic
act: II
kind: side
status: full
giver: 4154          # Danulf the Faery King (X2, his ring of stones)
maps: [X2]
level: 18
block: 67
after: []
source: "QUESTS Q-C17; xeen/aaze0011:1-3"

qbits:
  started: {id: 112340, journal: "Crazed sprites stole Danulf the Faery King's Wand of Faery Magic. They nest in the south woods.",
            until: [done]}
  sprite_eggs: {id: 110206, map: X2, note: "the nest destroyed; the wand found there"}
  faery_wand: {id: 110205, map: X2, note: "the wand found (the built map set it at the nest)"}
  done: {id: 112341}

items:
  wand_of_faery_magic: "the Wand of Faery Magic; the sprites' nest in X2's south woods; Danulf takes it."

npcs:
  4154:              # Danulf
    topics:
      - n: 1
        label: Wand
        states:
          - when: {qbit: done}
            text: "The forest is quiet again. The sprites are merely rude now, which for sprites is peace."
          - when: {item: wand_of_faery_magic}
            text: "You have returned my Wand of Faery Magic! Now peace can be restored to the forest. Please accept this gold as a reward. And any of you with elven blood in the dark: kneel. The wand remembers its own."
            do: [{take: wand_of_faery_magic}, {set: done}, {clear: started}, {xp: 4000}, {gold: 1500}, {promote: elf}]
          - when: {qbit: started}
            text: "The Sprites still possess my Wand. Try harder."
          - text: "A terrible thing has happened. My Wand of Faery Magic has been stolen by the Sprites. Without the Wand in my possession, my powers of magic are reduced. Now that the Sprites possess my Wand they are crazed with power, attacking anyone in the forest. If you return my Wand I will reward you handsomely."
            do: [{set: started}]
      - n: 2
        label: Patriarch
        show: {all: [{qbit: done}, {promotable: elf}]}
        text: "Elven blood in the dark, and the wand remembers it. Rise, Patriarch."
        do: [{promote: elf}]

hooks:
  nest:
    map: X2
    where: "the sprites' nest in the south woods (built: thing:sprite_eggs)"
    sets: [sprite_eggs, faery_wand]
    gives: [wand_of_faery_magic]
    once: true
    text: "A hollow full of blue speckled sprite eggs, and among them a slim wand of white wood: Danulf's Wand of Faery Magic."
    else_text: "Broken eggshells and angry chirping."

rewards: {xp: 4000, gold: 1500}
playthrough: "Danulf (Wand); the nest; Danulf (Wand)."
