# Q-D17 The Chalice of Protection (QUESTS 2.2 Q-D17; Act V, D-16; Dark promotion Black Knight / Villain). Owner: A3.
# Bosco the Dwarf King (5401, Bosco's Hall DD-25) fears a poisoned drink and wants the Chalice of Protection from the
# Voweless Knights' Northern Tower (DD-08); he gives the tower's key (a qbit, read by DD-08's door). The knights leave
# the vowels out of everything (the tower's books: "Lt slpng dgs l"); on L4 a voice asks what you seek and wants the
# answer their way, "Chlc" (Bosco says so; the Castleview library sells their sayings). Light: the Chalice to Bosco
# (the source's reward line; 2 Energy Disks, gold, an award). Dark: swear the Voweless oath on L4's plaque and give the
# Chalice back to the knights: they keep it, give 2 Energy Disks, and promote Cavaliers to Black Knights and Crusaders
# to Villains (D-16: a route choice, the class change is the reward).
id: Q-D17
title: The Chalice of Protection
act: V
kind: side
status: full
giver: 5401          # Bosco, the Dwarf King (DD-25)
maps: [DD-25, D5, DD-08]
level: 50
block: 97
after: []
source: "QUESTS Q-D17, 3.2; dark/aaze0013:13-16; aaze0069-0072 (the knights' books, the voice); aaze0037:5"

