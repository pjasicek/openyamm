          - when: {qbit: started}
            text: "The woodpile on Magic Mountain, by the wizards' camp. Third log, if I remember right. I never remember right."
          - text: "I took my ring off to split wood up on Magic Mountain, and now it's somewhere in the woodpile. Fetch it and I'll make it worth the walk."
            do: [{set: started}]

