    topics:
      - n: 1
        role: quest
        afterword: {n: 3, label: Tam}
        states:
          - when: {qbit: done}
            afterword: true
            text: "Tam eats like an orc now. I'm not complaining. Thank you."
          - when: {qbit: captive_freed}
            text: "Tam! He walked in the door an hour ago and asked what's for supper, as if nothing happened. Here. It's what I put by for his wedding, and he can earn another."
            do: [{set: done}, {clear: started}, {xp: 400}, {gold: 200}, {move_npc: [4040, 4036]}]
          - when: {qbit: started}
            text: "The caves are in the north-east hills. Follow the drums."
          - text: "The orcs took my boy Tam to their caves in the hills, north-east of town. You can hear their drums at night. I'm a farmer. I can't fight orcs."
            do: [{set: started}]
      - n: 2
        label: Drums
        show: {qbit: war_drums_burned}
        text: "The drums have stopped. Nights are quiet again, and the cows have started giving milk."

hooks:
  tam:
    map: XD-05
    window: "a long story text to read (Tam in the pit, 242 characters)"
    where: "the prisoner pit in the sleeping hollows: the cage gate over its rim (evt:cage_gate) lowers the rope ladder; stepping down to Tam (built: evt:tam, once; the map hides group 20 after the call) runs this in place of the map's message, bit and experience"
    sets: [captive_freed]
    once: true
    do: [{xp: 300}]
    text: "A skinny farm boy scrambles to his feet. \"You came! I'm Tam, Oslo's son. They were going to sell me back to Pa for every cow he's got. I can climb out myself now. I'll run straight home and tell him!\" He swarms up the rope ladder and is gone."
  drums:
    map: XD-05
    status: true   # D-90: experience, a find's answer or a death on the status line
    where: "the last of the three war drums burnt (built: evt:drums_all, once) in place of the map's bit, message and its 750 experience; each drum's own 250 stays the map's"
    sets: [war_drums_burned]
    once: true
    do: [{xp: 500}]
    text: "The last drum burns, and the caves fall silent but for dripping water. Without their drums the warband's raiders will not ride out again. Oslo will want to hear of it."
  back_gate:
    map: XD-05
    where: "the bar of the back gate (built: evt:gate_bar)"
    sets: [orc_back_gate_open]

