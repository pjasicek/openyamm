# The obelisks (QUESTS 4.3): one per surface map; each face's obelisks spell one line, and the line points to a buried
# hoard (MM6-MM8's obelisk treasure: the spot gives its hoard only to a party that has read every obelisk of its face).
# Cloudside, X1-X7 in map order: "SEEK THE HOARD BURIED FOR THE SPHINX" (X1, X2 and X5 built with SEEK, THE, FOR; X3's
# HOARD as A5 proposed); the hoard lies in the sand before the Sphinx's paws on X6. Darkside, D1-D6: "DIG BENEATH THE
# BROKEN TRAVEL PYRAMID"; the hoard lies under D5's broken pyramid. Ours: the source has no obelisks.
# Each map calls its obelisk's hook (the hook shows the word, sets the bit, writes the autonote). Owner: A3.
# Format: devdocs/xeen/formats/QUESTS_FORMAT.md.
