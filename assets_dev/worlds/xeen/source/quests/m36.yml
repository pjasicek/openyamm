# M36 The Destiny of Xeen (QUESTS M36; Act VI). Owner: A3. Format: devdocs/xeen/formats/QUESTS_FORMAT.md.
# With Sheltem gone (M33) and Lord Xeen dead (M35) the Dragon Pharaoh gives the finale's checklist, close to the
# source's (dark/aaze0086:17): turn on the four machines at the corners of the other side (M37), wake the four
# elemental sleepers (M38), free Prince Roland from the bottom of Sheltem's dungeon (M39), open the way to the cloud
# above Darkstone Tower (M40, M41) and bring the Cube and the Scepter together at his shrine there (M42). He also names
# the Skyroads' four corners and the word each one wants: the answer-giver of M38's corner question.
