  checklist: {id: 4136, text: "The Pharaoh's checklist: the four Reflectors at Cloudside's corners; the four Sleepers on the elemental planes; Prince Roland in the bottom of Sheltem's dungeon; the cloud above Darkstone Tower; the Cube and the Scepter at his shrine.", category: Misc}
  corners: {id: 4137, text: "The Skyroads' corners: say Fire at the north-west corner, Air at the north-east, Earth at the south-east, Water at the south-west, then step off.", category: Misc}

npcs:
  5453:              # The Dragon Pharaoh
    topics:
      - n: 1
        label: The destiny of Xeen
        show: {all: [{qbit: m33.done}, {qbit: m35.done}]}
        states:
          - when: {qbit: m42.done}
            text: "Xeen is one world, and the sun is where it belongs. I have nothing left to ask of you, Chosen Ones. That has not happened to me in a very long time."
          - when: {qbit: started}
            text: "The machines at the corners of the other side, the four sleepers on this side, Roland in Sheltem's dungeon, the cloud above Darkstone Tower. Then the Cube and the Scepter, together, at my shrine. Rest where you can."
          - text: "Now, with the Cube and the Scepter in hand and the enemies of the world out of the way, the destiny of Xeen is in sight. Turn on the four machines in the corners of the other side of the world. Awaken the elemental sleepers on this side. Open the way to the cloud world above Darkstone Tower: Prince Roland and Queen Kalindra are getting married there. Oh, that reminds me. Have you rescued Prince Roland from the bottom of Sheltem's dungeon yet? If you haven't, that's one more little detail."
            do: [{set: started}, {autonote: checklist}, {xp: 4000}]
      - n: 2
        label: The sleepers
        show: {qbit: started}
        text: "Each sleeper lies on its own plane, and the planes hang below the Skyroads. Stand at a corner of the roads and the sky asks what you seek. Name the element: Fire in the north-west, Air in the north-east, Earth in the south-east, Water in the south-west. Then step off. The sleepers wake only for the Chosen Ones, and only when the Reflectors are humming."
        do: [{autonote: corners}]

rewards: {xp: 4000, gold: 0}
