# Q-C26 Shangri-La (QUESTS 2.1 Q-C26; Act V). Owner: A3. In the Volcano Cave (XD-16, X7) a demon skull and a devil
# skull stand on altars; smashing both opens the hidden way to Shangri-La (XD-17; the source's +250k each is MM6-MM8
# sized here). The map's two skull events call the hooks; the way (a door or a lava bridge, A7's choice) reads
# `done`, and A4's Shangri-La houses and teachers open on it (towns/xd17.yml, teachers_plan `when: Q-C26`).
