# syllables are scratched on the dungeon's walls (la, bo, ra, to, ry); Crodo said the word plainly (m21, autonote
# 4121), and so does Elona in Shangri-La (npcs/xd17.yml). The sword: A2's xeen_slayer_sword (12500), the only weapon
# that harms Lord Xeen (M35, PRODUCTION E11).
