    map: X8
    status: true   # D-90: experience, a find's answer or a death on the status line
    where: "the first harpy nest on the nest spires (room:nest_spires): the map asks \"Harpy Nest. Destroy?\" and burns it (a destructible), then calls this"
    sets: [nest_1]
    once: true
    do: [{xp: 500}]
    text: "Bones, feathers and stolen trinkets go up together. The harpies will nest somewhere lower."
  nest_2:
    map: X8
    status: true   # D-90: experience, a find's answer or a death on the status line
    where: "the second harpy nest on the nest spires, as nest_1"
    sets: [nest_2]
    once: true
    do: [{xp: 500}]
    text: "Bones, feathers and stolen trinkets go up together. The harpies will nest somewhere lower."
  nest_3:
    map: X8
    status: true   # D-90: experience, a find's answer or a death on the status line
    where: "the nest on the witch's perch (room:witch_perch), as nest_1"
    sets: [nest_3]
    once: true
    do: [{xp: 500}]
    text: "The nest burns, and the smoke drifts down through a gap in the cloud toward Vertigo."

rewards: {xp: 1500, gold: 0}
