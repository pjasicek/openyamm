# X8-SKY Cloudreach's own rewards: the explorer's statue on the highest rock and the harpy nests to burn (A6's X8
# brief, room:explorers_rock, room:nest_spires, room:witch_perch). Ours in form, the source's in substance: the statue
# dubs "Super Explorer" (xeen/aaze0025) but its +1 level becomes +2 Speed (QUESTS rules: no permanent levels); each nest
# burnt pays a little, burn-the-camp style (QUESTS 4.3). Owner: A3. Format: devdocs/xeen/formats/QUESTS_FORMAT.md.
