          - when: {qbit: started}
            text: "I see you haven't found the Holy Book of Elvenkind. Please keep looking."
          - text: "While travelling through Troll forest recently, I was ambushed. In my haste to escape I dropped the Holy Book of Elvenkind. I can only hope that it has not been found, for if it happens to fall into the wrong hands it could lead to the extinction of my entire race. I will reward you well if you can return it to me. The Troll Forest is far to the south-west, in the snows."
            do: [{set: started}]

