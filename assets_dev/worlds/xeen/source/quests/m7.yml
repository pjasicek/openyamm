  pyramid_d1:
    map: D1
    where: "the travel pyramid outside Castleview: Xeen.travelPyramid(\"castleview\")"
    reads: [sigil]

rewards: {xp: 1000, gold: 0}
playthrough: "XD-07: Artemus (Pyramids): the Pyramid Sigil. X1: the pyramid on the knoll (Darkside, once D1 exists)."
