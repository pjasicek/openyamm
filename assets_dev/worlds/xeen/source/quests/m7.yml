id: M7
title: The Land Below the Land
act: II
kind: main
status: full
giver: 4402          # Artemus
maps: [XD-07, X1, D1]
level: 14
block: 7
after: [m6.crodo_quest]
source: "QUESTS M7; xeen/aaze0049:18, :25 (\"The moons are not aligned. You are unable to pass.\")"

