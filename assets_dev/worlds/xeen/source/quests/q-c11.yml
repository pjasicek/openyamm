        states:
          - when: {qbit: done}
            text: "Carlawna is my sister, by the way. She never tells anyone. I tell everyone."
          - when: {item: piezo_crystals}
            text: "Thank the Gods! You've recovered the crystals. You are truly great adventurers. As a reward, take this. A wizard's house is full of things a wizard has stopped using."
            do: [{take: piezo_crystals}, {set: done}, {clear: started}, {xp: 3000}, {treasure: 3}]
          - when: {qbit: started}
            text: "You haven't brought me my Crystals of Piezoelectricity. Perhaps they are in Asp."
          - text: "This region is in a lot of danger. First, my sister Carlawna's Scarab of Imaging was stolen, and now my Crystals of Piezoelectricity have been taken. Last night I remembered a story told to me as a boy about a strange machine that produced reptile creatures. This machine could be powered by using Crystals of Piezoelectricity and a Scarab of Imaging. I never gave much validity to the story because a mad wizard told it to me, but now I can't help but think it's true. Get my Crystals back and there will be a reward."
            do: [{set: started}]

hooks:
  crystals:
    map: XD-25
    gate: order
    where: "the crystal housing behind the transformer: loose once the machine is broken"
    requires: {qbit: q-c5.done}
