# M29 Corak's Pod (QUESTS M29; Act V). Owner: A3. Format: devdocs/xeen/formats/QUESTS_FORMAT.md.
# Escape Pod 1 (DD-16) lies in the lava of the Forbidden Zone (D6), open once the Pharaoh has cooled it (m28). Inside: a
# starship, log computers, and a stasis field that answers only an Ancient phrase; the console shows the phrase in
# plain words ("where no man has gone before"). Corak wakes, explains, and must hide from Sheltem's senses: the Soul Box
# of Olympus (M31, M32). Corak stays in the pod; his words are the hooks' (no NPC until M32).
id: M29
title: Corak's Pod
act: V
kind: main
status: full
giver: null
giver_name: (the Pharaoh sends the party, m28; Corak in DD-16)
maps: [D6, DD-16]
level: 46
block: 29
after: [m28.done]
source: "QUESTS M29; dark research 1 (step 17); the pod's log computers (dark research, backstory)"

qbits:
  started: {id: 111580, journal: "Something fell into the lava of the Forbidden Zone long ago. The Pharaoh has cooled it. He says to be polite to whoever wakes.",
            until: [done]}
  stasis_off: {id: 111581}
  done: {id: 111582, journal: "Corak, the Ancients' guardian, is awake in his pod. He must hide from Sheltem's senses before he can face him.",
            until: [m30.done]}
  dd16_power_on: {id: 118080, map: DD-16, note: "the map's own: the Main Power Console activated (A7; m29.power_console, the bridge's blast door opens)"}

player_bits:         # once per character (D-47 Q18); the hook decides and raises the clicking member
  alien_device: {id: 11352, map: DD-16, note: "the strange energy device: +1 to every statistic (base) and five years of age"}

autonotes:
  corak: {id: 4129, text: "Corak, in Escape Pod 1 (the Forbidden Zone): he hunted Sheltem across the stars. Sheltem can sense him; he needs a place to hide.", category: Misc}

hooks:
  pod_door:
    map: D6
    entrance: DD-16
    sealed: "a main-story set piece: the lava the Pharaoh cools"
    where: "Escape Pod 1's hatch in the lava field of the Forbidden Zone: shut and too hot until the Pharaoh cools it"
    requires: {qbit: m28.lava_cooled}
    reads: [m28.lava_cooled]
    fail_text: "A curved metal wall stands in lava that bubbles like soup. Nobody is touching that."
    text: "The lava round the hatch is black and cool. The hatch slides aside with a sigh, as if it had been waiting."
  log1:
    map: DD-16
    where: "the first log computer"
    text: "LOG. Pursuit of renegade guardian SHELTEM. Target crossed into the X.E.E.N. project. Collision imminent. Entering stasis."
  log2:
    map: DD-16
    where: "the second log computer"
    text: "LOG. Second pod landed safely. This pod: lava. Stasis holding. Waiting for a reply to the phrase."
  console:
    map: DD-16
    where: "the stasis console by the stasis field: shows the phrase in plain words (the source's cipher, given plainly)"
    text: "The console's screen reads, in plain words: TO RELEASE STASIS, ANSWER THE PHRASE: TO BOLDLY GO WHERE NO MAN HAS GONE BEFORE. Beneath: COMPLETE THE PHRASE: TO BOLDLY GO..."
  stasis:
    map: DD-16
    window: "a long lore text to read (Corak in stasis, 332 characters)"
    where: "the stasis field round the alcove where Corak stands from the first load (D-51: the field translucent, he cannot be clicked or struck through it): the map's prompt \"To boldly go...\", answers where no man has gone before (with or without punctuation); the right answer calls this"
    sets: [stasis_off, done]
    once: true
    do: [{autonote: corak}, {xp: 8000}]
    text: "The field flickers out. The tall figure inside it, in a guardian's armour, opens his eyes. \"Corak. I hunted Sheltem from Terra to here, and he has had centuries to prepare. If I step outside, he will feel me the moment I do. I need somewhere to hide that he cannot see into. The Ancients built such things: Soul Boxes. Find me one.\""
    else_text: "Corak stands by the dead field, very still. \"Find me a Soul Box.\""
  stasis_wrong:
    map: DD-16
    where: "the stasis field, any other answer"
    text: "The field hums. Nothing else happens."

  log_page_1:
    map: DD-16
    where: "the third log computer on the bridge (D-47 Q19): each click shows the next page, wrapping round after page 5 (A7's paging variable); page 1, dark/aaze0087:13 abridged"
    text: "Log Computer. Entry 1 of 5. Logs 1 to 4: Course set for the Terra project. Objective: deactivate and retrieve the damaged S.H.E.L.T.E.M. unit. Subject retrieved. Then: S.H.E.L.T.E.M. unit escaped; 3.8 years spent in stasis in the ship's brig. Activating the full C.O.R.A.K. personality module. Beginning the search."
  log_page_2:
    map: DD-16
    where: "the third log computer on the bridge (D-47 Q19): each click shows the next page, wrapping round after page 5 (A7's paging variable); page 2, dark/aaze0087:25-27 abridged"
    text: "Log Computer. Entry 2 of 5. Logs 5 to 7: Sheltem hides his tracks in the Wire. I face an advanced intelligence with no restraints and a will to survive. VARN 6 launched itself into the sun today on Sheltem's command: a hundred thousand lives in minutes. He must be stopped at any cost."
  log_page_3:
    map: DD-16
    where: "the third log computer on the bridge (D-47 Q19): each click shows the next page, wrapping round after page 5 (A7's paging variable); page 3, dark/aaze0087:28-29 abridged"
    text: "Log Computer. Entry 3 of 5. Logs 8 to 10: Sheltem was posing as King Alamar; his subjects said the king had acted strangely for four years. He fled to CRON, then back to Terra, where he ambushed me and left my memory core in stasis in a cave. Natives of CRON freed me, and saved CRON from his plan to fly it into the sun."
  log_page_4:
    map: DD-16
    where: "the third log computer on the bridge (D-47 Q19): each click shows the next page, wrapping round after page 5 (A7's paging variable); page 4, dark/aaze0087:30-32 abridged"
    text: "Log Computer. Entry 4 of 5. Logs 11 to 13: Terra again. Four VARNs have landed, and Sheltem assimilates them, harshly and too fast. He lives in the original seedship, under the sea; its matter transfer sites on the surface are disguised as pyramids. Through the Wire I am inside. I will have to defeat him myself."
  log_page_5:
    map: DD-16
    where: "the third log computer on the bridge (D-47 Q19): each click shows the next page, wrapping round after page 5 (A7's paging variable); page 5, dark/aaze0087:32-33 abridged"
    text: "Log Computer. Entry 5 of 5. Logs 14 and 15: Sheltem escaped in a pod toward the X.E.E.N. project; I follow in another, seconds behind, unarmed. Terrans launched the seedship after us; I told them how to use its matter transfer device. Xeen approaches. Engaging stasis. May the Gods smile upon me."
  power_console:
    map: DD-16
    where: "the Main Power Console in the engine room: the map asks 'Main Power Console. Activate?' (dark/aaze0087:7, its typo mended); Yes sets the map's power_on 118080, opens the bridge's blast door and calls this (once, the map's)"
    text: "Somewhere aft, machines wake. Lights come on one corridor at a time, and far forward a heavy door unseals."
  blast_door:
    map: DD-16
    where: "the bridge's blast door, clicked before the power is on (the map's 118080 clear)"
    text: "The bridge door is sealed. No power."
  alien_device:
    status: true   # F13: a touch effect answers on the status line
    map: DD-16
    where: "the strange energy device in the device bay (D-47 Q18; dark/aaze0087:8, :5, :10 rescaled): the map only calls this; the hook decides for the clicking member (player bit 11352)"
    states:
      - when: {lua: "IsPlayerBitSet(PlayerBit(11352))"}
        text: "The strange alien device seems to be dormant."
      - text: "Strange energy device. It hums, and holds you a moment too long. Your statistics have all been raised by one, but your age has also increased by five years."
        do: [{lua: "for _, stat in ipairs({BaseMight, BaseIntellect, BasePersonality, BaseEndurance, BaseSpeed, BaseAccuracy, BaseLuck}) do AddValue(stat, 1) end"}, {lua: "AddValue(Age, 5)"}, {lua: "SetPlayerBit(PlayerBit(11352))"}]

riddles:
  - {answer: "where no man has gone before", where: "DD-16's stasis field (m29.stasis)", said_by: "the stasis console (m29.console)"}

rewards: {xp: 8000, gold: 0}
playthrough: "D6: the pod hatch. DD-16: the logs; the console; the stasis field (where no man has gone before): Corak wakes."
