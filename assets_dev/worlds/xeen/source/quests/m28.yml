# M28 The Great Pyramid (QUESTS M28; Act V). Owner: A3. Format: devdocs/xeen/formats/QUESTS_FORMAT.md.
# DD-15 on D5 (A8, phase 5): four floors up to the Dragon Pharaoh. L1 torch levers and a number lock, L2 the registry
# lock ("NCC-1701", said plainly on the plaque beside it), L3 a teleport maze, L4 the Pharaoh. He takes his orb back and
# explains: Alamar is Sheltem, a guardian gone rogue, who would steer Xeen away from its sun; he cools the lava round
# the "second meteor" on D6, Corak's pod (M29). The Pharaoh is 5453 (A4: a talking actor on DD-15 L4, A8).
# D-61 (DD-15's graph): the optional number niches open the Overseer's vault (Xeen.pyramidNiche), the wall safe takes the
# tapestry's 20-30-1 (Xeen.pharaohSafe), the Pharaoh's lift wakes on the first audience, the Brew burns on a second sip.
id: M28
title: The Dragon Pharaoh
act: V
kind: main
status: full
giver: 5453
maps: [D5, DD-15, D6]
level: 45
block: 28
after: [m27.done]
source: "QUESTS M28; dark research 1 (step 16), the manual's Pharaoh log; MAPS DD-15 (the Prime Directive book); dark/aaze0083:6-39, aaze0086:0-31; D-61 (devdocs/xeen/mockups/act5_a8_decisions.md)"

