# Relations between factions (the family key, a `faction`'s name, or character_<key>), each rule one way; `from` and
# `to` may list several. A pair no rule covers keeps the engine table's relation, which has no row for Xeen ids, so
# Xeen monsters leave each other alone; these rules say so outright where a story needs it.
feuds:
  # D-52 (6): DD-14's vampires and gargoyles, and the griffin, never fight Ambrose or the Queen, nor they them.
  - {from: [vampires, gargoyles_mm, character_tethered_griffin], to: [character_ambrose, character_queen],
     relation: friendly}
  - {from: [character_ambrose, character_queen], to: [vampires, gargoyles_mm, character_tethered_griffin],
     relation: friendly}

