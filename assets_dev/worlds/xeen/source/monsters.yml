# Relations that switch on quest bits (relations.yml rules with after_qbit; later rules win while active).
relation_rules:
  # Q-D11 Ogre Pass (D-23): the pass ogres and the kennel friendly on friends 113221, all hostile on hostile 113222.
  - {faction: ogres_pass, relation: friendly, after_qbit: 113221}
  - {faction: ogres_pass, relation: long, after_qbit: 113222}
  - {faction: ogres_graalg, relation: long, after_qbit: 113222}
  # Q-D13 Troll Holes (D-25 Q7): tribute 113261 or trial 113262 befriends the holes' trolls; hostile 113263 turns
  # the court and the holes.
  - {faction: warren_trolls, relation: friendly, after_qbit: 113261}
  - {faction: warren_trolls, relation: friendly, after_qbit: 113262}
  - {faction: warren_trolls, relation: long, after_qbit: 113263}
  - {faction: trolls_hobstadt, relation: long, after_qbit: 113263}
  # Q-D10 (D-23): the stick-up 113203 turns D2's village sprites.
  - {faction: sprites_village, relation: long, after_qbit: 113203}
  # Q-D1 Gremlin Court (D-26): court_hostile 113024 turns the court side; court_peace 113026 befriends court and army.
  - {faction: gremlins_court, relation: long, after_qbit: 113024}
  - {faction: gremlins_court, relation: friendly, after_qbit: 113026}
  - {faction: gremlins_army, relation: friendly, after_qbit: 113026}
  # Q-D22 (D-12.1, D-36): the coven is peaceful to members (joined 113449) until the Head Witch dies (113447); the
  # later rule wins while both are set, so a party that joined and then broke the coven finds it hostile.
  - {faction: coven, relation: friendly, after_qbit: 113449}
  - {faction: coven, relation: long, after_qbit: 113447}
  # D-37: Gettlewaithe friendly again after court_peace; no court_hostile rule (he turns only when struck himself).
  - {faction: gremlins_king, relation: friendly, after_qbit: 113026}
  # D-47 Q22: the People (DD-24's hall and D5's hold) turn on Q-D16 war 113321, Q-D12 hostile 113242 or camp_burned
  # 113244, or q-d16.hall_attacked 113323 (A3, confirmed 2026-11-21); one blow in DD-24 or at D5's hold turns both.
  - {faction: giants_people, relation: long, after_qbit: 113321}
  - {faction: giants_people, relation: long, after_qbit: 113242}
  - {faction: giants_people, relation: long, after_qbit: 113244}
  - {faction: giants_people, relation: long, after_qbit: 113323}
  # D-61 Q28: the Voweless oath (q-d17 oath 113344) befriends the Northern Tower's Slayer and Death Knights.
  - {faction: voweless_knights, relation: friendly, after_qbit: 113344}

