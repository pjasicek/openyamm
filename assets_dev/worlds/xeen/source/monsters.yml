# Xeen monsters (owner: A2, devdocs/xeen/lanes/A2.md). tools/xeen/gen_monsters.py writes data_tables/monster_data.txt,
# monster_descriptors.txt and the world's relations.yml and modifiers.yml from this file.
#
# Numbers follow devdocs/xeen/MONSTERS_AND_ITEMS.md section 1 (no Xeen number carried over): HP = L^2/10 + 3L,
# XP = L(L+10), AC and damage per hit from the curves below (BALANCE_PLAN 7.1 band medians), recovery by MM6-MM8's
# bands, resistances from the level base, treasure level by monster level (MONSTERS_AND_ITEMS 4.1), gold and item
# chance at MM7's rates per experience (BALANCE_PLAN 3.3, before MM9's x2.2).
#
# A family has a block of ten row ids: A, B, C at block+0..2, extra tiers and bosses at block+3..9. Ids never move once
# a map uses them. `picture` names the family's own descriptors ("Xeen Goblin A/B/C"): map_stats spawn slots name the
# family by it. Every family names one installed descriptor family whose sprites, sounds, size and speed the rows
# borrow, as exactly one of:
#   `stand_in`: the family has no model of its own yet; S's binding for its descriptors copies this family's 3D
#     binding (the `model_stand_in` of ROADMAP 5.3; tools/xeen/standin_bindings.py), and `model` is the plan
#     (MONSTERS_AND_ITEMS 2);
#   `sprites`: S has bound the family's descriptors to its own model or Xeen colour tiers (worlds/xeen/models/
#     actors.yml); the descriptor only lends sprite names and body size. `model` is then the installed model as
#     actors.yml names it, and each tier and boss carries its `skin` (a tier's `model` where it differs from the
#     family's). Skin and model are records for S and the docs; no table has a column for them.
#
# Tier fields (all optional but name and level): bonus (on-hit condition, the Bonus column: Poison1-3, Disease1-3,
# Curse, Weak, Asleep, Afraid, Drunk, Insane, Paralyze, Uncon, Dead, Stone, Errad, BrkItem, BrkArmor, Brkweapon,
# Steal, Age, DrainSP; "x2" after it raises its level), type (attack 1 damage type), missile, damage (dice, instead of
# the curve), attack2 [type, dice, missile, chance], spell / spell2 [name, mastery N/E/M/G, skill, chance %],
# resist (per school, over the family's), ac_x, hp_x, special (the Special column), look (the stand-in or sprites
# tier it wears), fly (Y or N, the Fly column; else the borrowed row's), skin and model (above),
# party (a tier's own relation to the party, which makes it a faction of its own), faction (a faction several rows share:
# `name` is <family>_<name>, `other/name` another family's <other>_<name>, `other/` that family's own faction),
# loot_kind (Weapon, Armor, Misc, Gem, Ring...), item_chance_x (the item chance times this; family or tier),
# height and radius (the descriptor's collision body where it differs from the borrowed sprites'; family or tier),
# modifiers (modifiers.yml entries for the tier rows; family or tier; a boss takes only its own),
# stand_in (extra tiers D and later only: a whole installed descriptor with its letter, "ElemAir A", instead of the
# family's by `look`).
# no_arena (family or tier: true): the row gets the NoArena kind (data_tables/bolster_monsters.txt). Every boss,
# extra tier (D and later: placed only), character, row friendly to the party at load and row taller than 1,000 gets it
# without the field (D-39: XD-20's arena draws 11010-11699).
# kind (family or tier: one name or a list): the engine's monster kinds (bolster_monsters Type, then ExtraType): Demon
# for the Slayer Sword's SlayingDemon (D-2.3), Undead, Dragon, Ogre, Elemental, Titan, Elf for the slaying enchantments
# of MM6-MM8 loot and the undead spells.
# sounds (family, tier or boss): a set in worlds/xeen/audio/sounds.txt, <set>_attack, _death, _wince, _fidget into the
# descriptor's four sound columns (devdocs/xeen/AUDIO.md table (a)); without it the borrowed descriptor's sounds stay.
# Resistance values: imm, base (the level base), +N (base + N), 2x+20 (twice the base plus 20), or a number.
# Bosses add: id, hp_x (3 unless given), modifiers (modifiers.yml entries), look (which tier's look they borrow) and
# picture (the descriptor name, where two bosses share a display name; else "Xeen <name>").
schema: xeen.monsters.v1

curves:
  # level -> value, straight lines between the points (band medians at the bands' middles)
  ac: [[3, 5], [8, 8], [13, 14], [18, 15], [25, 20], [35, 30], [48, 35], [68, 50], [100, 90], [125, 100]]
  damage: [[3, 3], [8, 8], [13, 11.5], [18, 16.5], [25, 22], [35, 30.5], [48, 38.5], [68, 50], [100, 72], [125, 85]]
  # up to this level -> value
  recovery: [[5, 100], [20, 90], [40, 80], [999, 70]]
  resist_base: [[10, 0], [25, 5], [40, 15], [55, 18], [999, 30]]
  treasure_level: [[12, 1], [22, 2], [34, 3], [49, 4], [74, 5], [999, 6]]
  gold_per_1000_xp: [[5, 109], [10, 107], [15, 80], [20, 88], [30, 82], [40, 79], [55, 76], [80, 124], [999, 142]]
  items_per_million_xp: [[5, 180], [10, 253], [15, 163], [20, 156], [30, 84], [40, 53], [55, 55], [80, 52], [999, 62]]
  boss: {hp_x: 3, gold_x: 3, item_chance: 100, treasure_step: 1}

defaults:
  party: long          # relation toward the party (relations.yml): long, medium, short, close, friendly
  resist: {}

# Resistance themes (BALANCE_PLAN 3.2): referenced by a family's `theme`.
themes:
  undead: {mind: imm, body: 2x+20, spirit: 0}
  spirit: {mind: imm, body: imm, spirit: 0, phys: 30}
  construct: {mind: imm, spirit: imm, body: imm}
  fire: {fire: imm, water: 0}
  cold: {water: imm, fire: 0}
  air: {air: imm, earth: 0}
  earth: {earth: imm, air: 0}
  demon: {fire: imm, mind: +20, water: 0}
  vermin: {body: +20}
  caster: {mind: +20, spirit: +20}

