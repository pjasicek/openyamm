# place, D-2.2): name, price, picture, ground object, description and random-treasure weights; World:xeen, no new art
# (U-1). Without them every Xeen guild's shelf was empty (feedback F7, 2026-11-21).
spellbooks: {id_base: 12900, like_first: 400}

