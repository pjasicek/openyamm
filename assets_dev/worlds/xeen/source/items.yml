# Xeen items (owner: A2, devdocs/xeen/lanes/A2.md). tools/xeen/gen_items.py writes data_tables/items.txt,
# item_effects.txt, item_sets.txt and complex_item_pictures.txt from this file (random_items.txt: the spellbooks' weights).
#
# Every row copies an engine item (`like: <engine item id>`: equip slot, skill, sprite, paper-doll placement, icon) and
# changes what it lists. Keys are what quest files and map projects use (A3 resolves them through
# ctx.shared['items']); ids never move once used. The built maps' provisional ids 12001-12299 stay where they are.
#
# Ranges: 12000-12299 the maps' own items (in each built map's block), 12300-12499 story and side-quest items,
# 12500-12599 artifacts and relics (12540-12549 the gemsmith gear), 12901-12999 the spellbooks. The world adds no
# equipment bases: random loot and shops use the MM6-MM8 engine items (the user, 2026-11-20, DECISIONS U-1).
#
# Fields: id, key (the map), name, like, icon (quest items and books only: the icon file; default the like-item's),
# value, notes (the description), readable (`a3`: a readable letter, note or book whose text A3 writes, gen_quests
# adding its readable_items row; readable_draft is A2's suggested wording for A3, not written anywhere), damage / bonus
# (weapon dice and flat bonus; armour value and bonus), effects (item_effects columns by name), set.
# Artifacts, relics and the gemsmith gear wear an MM6-MM8 item's skin (DECISIONS U-1): `like` is an engine artifact,
# relic or special item of the same slot and skill where one fits, and its picture, paper-doll art and ground model
# are that item's; such a row has no icon of its own (gen_items refuses one). The description is the borrowed item's,
# adapted to Xeen, with an "(Effects: ...)" tail. A worn item (armour, helm, belt, cloak, boots) uses an engine picture
# that has doll files; gen_items copies that picture's doll offsets.
# `books` are readable items sold in shops (A4 stocks them): Readable|NoRandom|World:xeen. `crafted` are named items an
# NPC makes on demand (the Q-D7 gemsmiths): NoRandom|NoShop|World:xeen, `tier` their normalized tier.
