# The Adventurer's Inn roster (WORLD_DESIGN 5.3): characters the party can recruit at Vertigo's inn (and later
# Castleview's). Owner: A4. tools/xeen/gen_towns.py writes them as roster.txt rows (engine columns).
# The engine keeps one inn list for the whole party: every row whose `qbit` is set appears in any Adventurer's Inn.
# Vertigo's set opens at the start of a new game (qbit 119020, set by the world's new-game script, A3); Castleview's
# set (ids 410-418, Darkside) with qbit 119021 (A3's world.inn_castleview: the party first enters Castleview's inn).
# The Darkside set joins at level 15, as MM8's second roster tier (105,000 experience, Expert skills): the party
# reaches Castleview at about level 15-18 (MAPS D1).
# face: a party portrait id of engine character_data.txt (race and sex follow the face); voice: that face's default.
# The first six are World of Xeen's own pre-made party (raw/xeen_initial_state/maze.chr): Arturius, Rebecca,
# Seymour, Zippo, Badger and Tyro, on MM7 classes (Zippo, a gnome in the original, is a goblin: no gnomes, Q8).
roster:
