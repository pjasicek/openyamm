# D4 Lakeside and Blackfang: Lakeside, the coven-ruled lakeshore town (WORLD_DESIGN 5.2; MAPS D4). Owner: A4.
# Format: devdocs/xeen/formats/TOWNS_FORMAT.md; checks: tools/xeen/towns.py.
# Built (A6's L4 project `devdocs/xeen/briefs/d4/L4`, installed 2026-11-20 21:29 with its bake): every door as drawn;
# the arrivals are A6's points from the sketch's entrance cells (NOTES "Doors and arrivals for the other lanes").
# Cursed until Q-D22 (the Coven, Naomi the prisoner; A3's q-d22.done): before it only the guild works (its door asks
# the coven's riddle, A3's hook), the ferry to the Isle of Lost Souls (DD-12) runs (D-12.1: from day one, daily) and
# one old fisherman keeps his house; after it the tavern, the smithy, the temple, the mirror (also waiting for
# Kalindra's stage 4, A3's mirror helper) and the town's houses open. Before liberation the closed tavern and smithy
# read the source's lines (dark/aaze0033:1-2). The source's sign "This boat under repair." (:18) goes on a second,
# beached boat by the dock (D-12.1; A6 places it, a map event, not a house). The ferry dock also takes Lucio's celestial boat to Olympus twice a week once the party are
# the Chosen Ones (D-5.3, route 426, A3's m30.done). The five prisoners are in the coven's dungeon (DD-20, A8), not here.
# The way back from the Isle (D-36 (6)): Ferris Gull's mate Tern keeps a second boat at the Isle's jetty (A6's
# thing:isle_ferry sign at the jetty, cell (73.4, 73.6)), house 4667, daily to lakeside_dock (route 432, route 420's day); open at all hours, so a party that
# comes out of the Dungeon of Lost Souls at night is not left on the Isle.
# Teachers: Leather and Water Magic Grandmaster, Vampire Master (teachers_plan.yml, place lakeside).
key: D4
stem: xeen_d4.odm
town: Lakeside
face: darkside
blocks:
  houses: [4651, 4700]
  npcs: [5301, 5400]

arrivals:
