npcs:
  - {id: 5301, name: Grizel, title: Guildmistress of Lakeside, profession: Spell Master, greet: ["I never joined the coven. They kept me on for the bookkeeping. Spells are on the shelves.", "Mind the cauldron, it's mine."]}
  - {id: 5302, name: Bess Brewer, title: Innkeeper, profession: Cook, greet: ["We rebuilt the tavern in a week. Turns out the witches only painted it gone.", "Something warm?"]}
  - {id: 5303, name: Harrow, title: Smith of Lakeside, profession: Smith, greet: ["The witches wanted cauldrons. I made them swords. We disagreed.", "What needs an edge?"]}
  - {id: 5304, name: Father Wade, profession: Healer, greet: ["We had the doors nailed shut for two years. The prayers got out anyway.", "Be still."]}
  - {id: 5305, name: Captain Ferris Gull, title: Ferryman, profession: Sailor, greet: ["The coven never sank my boat. Somebody had to row their rejects to the Isle. Isle of Lost Souls, every day, for anyone with business there. Mind the octopods.", "Isle?"]}
  - {id: 5306, name: Old Gill, title: Fisherman, profession: Sailor, greet: ["I stayed. The witches didn't want an old man. Their loss.", "Fish?"]}
  - {id: 5307, name: Tanner Bodkin, profession: Armorer, teaches: [{skill: Leather, mastery: grandmaster}], greet: ["Good leather turns a blade and keeps out the rain. Great leather does it while you sleep in it.", "Feel that grain."]}
  - {id: 5308, name: Morna, title: Tidewife, profession: Water Master, teaches: [{skill: Water Magic, mastery: grandmaster}], greet: ["The lake listens to me. It ignored the coven. Lakes have taste.", "Hear the water?"]}
  - {id: 5309, name: Sir Malvern, profession: Noble, teaches: [{skill: Vampire, mastery: master}], greet: ["I quit Castle Blackfang. The hours were terrible and the master worse.", "Come in. Not too close to the window."]}
  - {id: 5310, name: Netty, title: Netmender, profession: Weaver, greet: ["Every net in Lakeside has a witch-sized hole in it. Now I mend them.", "Mind the hooks."]}
  - {id: 5311, name: Tobbin, title: Former Goblin, profession: Child, greet: ["I was a goblin for a year! I still like beetles.", "Want a beetle?"]}
  - {id: 5312, name: Wren Hollow, title: Tobbin's Mother, profession: Peasant, greet: ["They turned my boy into a goblin. Now he's a boy who eats beetles. I'll take it.", "Tobbin, put that down."]}
  - {id: 5313, name: Reed, title: Reedcutter, profession: Laborer, greet: ["Reeds for roofs, reeds for baskets, reeds for brooms. Not anymore, for brooms.", "Reeds?"]}
  - {id: 5314, name: Old Ottar, title: Eel Fisher, profession: Sailor, greet: ["Eels in the shallows, octopods in the deep. Stay in the shallows.", "Bite?"]}
  - {id: 5315, name: Widow Marsh, profession: Peasant, greet: ["My husband went to the Isle of Lost Souls to look for our daughter. Nobody comes back from the Isle.", "Any news from the Isle?"]}
  - {id: 5316, name: Skiff, title: Boatwright, profession: Carpenter, greet: ["I built the ferry. I also painted the sign. I'm good at signs.", "Boat?"]}
  # ---- added in the fourth session (a talking actor; portrait in a later batch) ----
  - {id: 5317, name: Slibo, title: Wizard of Magic Mountain, profession: Spell Master, house: none, place: "D4, Xanthus and Slibo's wizard camp on Magic Mountain (A6)", greet: ["A real treasure map? Nobody has brought me one of those in years. Let me see.", "Found anything I'd want?"], note: "Q-D2's real treasure map leads here (A3)"}
  - {id: 5318, name: Naomi, title: Prisoner of the Coven, profession: Peasant, house: none, place: "D4, in the stocks on Lakeside's square (A6)", greet: ["The witches put me here to watch the square. I watch them instead.", "Any luck with the coven?"], note: "Q-D22 (A3): she says the guild's word"}
  - {id: 5319, name: Leafpoint, title: Elder Tree, profession: Mystic, house: none, place: "D4, the Forest of Peril: Leafpoint's grove (a talking tree, A6)", greet: ["The leaves shiver. A tree hears axes before it sees them.", "The wind brought you back."], note: "T2-LEAFPOINT (A3): Great Druid to Arch Druid after q-c15.done; Thickbark's cousin (X5, 4528)", source: "dark E2 (Leafpoint the tree)"}
  - {id: 5320, name: Ector, title: Woodsman, profession: Laborer, house: none, place: "D4, the Forest of Peril, by his cabin (A6); his woodpile is on Magic Mountain", greet: ["Mind the stumps. Half this forest is firewood that hasn't heard yet.", "Any luck on the mountain?"], note: "Q-D21 Ector's Ring (A3)", source: "dark E2 (Ector the Woodsman)"}
  # ---- added in the ninth session (D-36 (6): the ferry back from the Isle) ----
  - {id: 5321, name: Tern, title: Ferryman's Mate, profession: Sailor, greet: ["The Captain rows them out. I row back whoever's left.", "Back to Lakeside?"]}
