  lakeside_dock: {at: [4608, -9216, 1056], direction: 1536, place: Lakeside, note: "Lakeside's jetty: the caravans of Castleview and Sandcaster (routes 414, 417) and the ferry back from the Isle (route 432) land here; Lucio's boat leaves from here (route 426)"}
  isle_landing: {at: [4096, -4096, 1120], direction: 512, place: "the Isle of Lost Souls", note: "the Isle of Lost Souls' landing by the Dungeon of Lost Souls (DD-12; sketch cell 72, 72)"}

