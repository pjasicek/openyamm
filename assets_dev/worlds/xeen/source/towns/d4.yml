  - {id: 4652, door: building:lk_tavern, kind: tavern, name: "The Cozy Lil' Tavern", owner: 5302, price: 20, opens: q-d22.done, closed_text: "These stairs once led to a tavern, but it was destroyed long ago."}
  - {id: 4653, door: building:lk_smithy, was: 12, kind: weapon_shop, name: Lakeside Smithy, owner: 5303, shop: {quality: 4}, opens: q-d22.done, closed_text: "These stairs once led to a blacksmith shop, but it was destroyed long ago."}
  - {id: 4654, door: building:lk_temple, was: 315, kind: temple, name: Temple of Still Waters, owner: 5304, opens: q-d22.done, closed_text: "The temple doors are nailed shut. Someone has painted a broom on them."}
