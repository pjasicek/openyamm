# D6 The Forbidden Zone: Necropolis, the walled city of the dead (WORLD_DESIGN 5.2; MAPS D6). Owner: A4.
# Format: devdocs/xeen/formats/TOWNS_FORMAT.md; checks: tools/xeen/towns.py.
# Built (A6's L4 project `devdocs/xeen/briefs/d6/L4`, installed 2026-11-21 01:22 with its bake): every door as drawn;
# the arrival is A6's point (NOTES "Doors and arrivals"), Z on the Square of Mourning's paving (8 over the terrain). The living need a pass to pass
# the gate (the Necropolis pass from the coven's chest, Q-D22: the gate is A3's hook and A6's event, not a house);
# inside, every house is open. Services: the Dark guild, the temple of the dead (resurrection; cheaper Raise Dead), a
# black-market magic shop, the embalmer (alchemist), a tavern for the dead and the mirror (waking with Kalindra's
# stage 4, A3's helper). The Necromancers' House is the MMerge Necromancer line's promotion (A3, with Sandro, Q-D23);
# Sandro himself is in the sewer (DD-21). The skull's story, the Books of the Dead and the "Food for the dead, keep
# warm." barrel are the map's lines (A6, A3).
# Teachers: Dagger, Dark Magic, Disarm Trap, Stealing and Vampire Grandmaster (place necropolis).
# D-49: Necropolis runs `town_feel --small` (5 services: guild, temple, market, embalmer, tavern; the mirror is no
# service); the gate opens on item 12336, refuses with A3's line, is always open from inside. No Freeda on D6 (she is
# X5's 4527, Master Body Building).
