npcs:
  # ---- proprietors ----
  - {id: 4001, name: Norman, title: Blacksmith, profession: Smith, greet: ["Norman's Ironworks. If it's sharp, I made it.", "Back for more steel?"]}
  - {id: 4002, name: Gudrun, title: Armorer, profession: Armorer, greet: ["Mind the slime on your boots. Armour?", "Still in one piece, I see. Good."]}
  - {id: 4003, name: Gunther, title: Mayor, talks: true, profession: Noble, greet: ["Welcome to Vertigo. Sadly, most of the population has left because the town is infested with pests.", "My favorite citizens, I'm always glad to see you."], source: "xeen/aaze0028:1, :5"}
  - {id: 4004, name: Gilbert, title: Hexer, greet: ["Gilbert's Hexes. No refunds on curses.", "Ah, customers who survived."]}
  - {id: 4005, name: Lady Geraldine, greet: ["Sit anywhere that isn't sticky.", "The usual table, then."]}
  - {id: 4006, name: Mortimer, title: Banker, profession: Banker, greet: ["The Bank of Vertigo. Your gold is safer here than in Joe's hands.", "Deposits on the left, complaints nowhere."]}
  - {id: 4007, name: Bartleby, title: Innkeeper, greet: ["Adventurers stop here between disasters. Looking for company?", "More friends for you upstairs."]}
  - {id: 4008, name: Rosalind, title: Alchemist, profession: Alchemist, greet: ["Philters, tonics, cures. Slime remover is extra.", "Back already? Something must have bitten you."]}
  - {id: 4009, name: Brother Silas, profession: Healer, greet: ["Welcome to the Slime Temple. The name was not our idea.", "Bless you. Wipe your feet."]}
  - {id: 4011, name: Calder, title: Guildmaster, greet: ["The Fire Guild of Vertigo. Members only, and mind the curtains.", "Warm to see you."]}
  - {id: 4012, name: Wynna, title: Guildmistress, greet: ["The Air Guild. Close the door, the scrolls blow away.", "Ah, the breeze is back."]}
  - {id: 4013, name: Marina, title: Guildmistress, greet: ["The Water Guild of Vertigo. The creek is ours too, sadly.", "Welcome back."]}
  - {id: 4014, name: Dunstan, title: Guildmaster, greet: ["The Earth Guild. Solid ground, solid spells.", "Still standing? Good."]}
  - {id: 4015, name: Thylon, title: Instructor, profession: Instructor, greet: ["Thylon's Training. I can take you to tenth level, no further.", "Ready to sweat?"]}
  - {id: 4016, name: Hob, title: Stablemaster, profession: Horseman, greet: ["Coaches to Rivercity, three days a week.", "The horses remember you."]}

  # ---- residents of the town ----
  - {id: 4018, name: Tobias Miller, profession: Miller, greet: ["The slimes got into the flour again.", "Mind the sacks."]}
  - {id: 4019, name: Molly Miller, title: Peasant, profession: Peasant, greet: ["Tobias is out back, swearing at the flour.", "Hello again."]}
  - {id: 4020, name: Edwina Ashby, title: Retired Guard, profession: Guard, teaches: [{skill: Shield, mastery: expert}], greet: ["Thirty years on the wall. I can teach you to hold a shield.", "Shield up, chin down."]}
  - {id: 4021, name: Greta, title: Mayor's Wife, profession: Peasant, greet: ["Gunther is at the town hall. He is always at the town hall.", "Oh, it's you again."]}
  - {id: 4022, name: Ilsa Weaver, profession: Weaver, greet: ["Doom bugs eat wool. Did you know that? I know that.", "Come in, mind the loom."]}
  - {id: 4023, name: Sergeant Pike, title: Town Guard, profession: Guard, teaches: [{skill: Sword, mastery: expert}], greet: ["Pike. I keep the gates and teach the sword.", "Keeping your edge?"]}
  - {id: 4024, name: Old Thorne, title: Sceptic, profession: Peasant, teaches: [{skill: Perception, mastery: expert}], greet: ["Some fool said money's now growing on trees. Ha!", "I've had my eye on you."], source: "xeen/aaze0028:24"}
  - {id: 4025, name: Cobb, title: Cobbler, profession: Cobbler, teaches: [{skill: Repair Item, mastery: expert}], greet: ["Boots, buckles, broken things. I mend them all.", "What did you break this time?"]}
  - {id: 4026, name: Bramble, title: Fire Mage, profession: Apprentice, teaches: [{skill: Fire Magic, mastery: expert}], greet: ["This place is deserted. You should go to Rivercity--Now there's a town full of action!", "Still here? So am I."], source: "xeen/aaze0028:25"}
  - {id: 4027, name: Fenwick, title: Retired Cutpurse, profession: Beggar, teaches: [{skill: Dagger, mastery: expert}], greet: ["That Gunther, what a dunce! He paid that con man Joe a fortune to clean up this town.", "Keep your purse close. Habit."], source: "xeen/aaze0028:26"}
  - {id: 4028, name: Vern, title: Guildman, profession: Clerk, services: [{guild_membership: elemental}], greet: ["I'll put anyone on the guild roll for free. Dues will cost 25 gold, though.", "Dues paid? Then off to the guild row."], source: "xeen/aaze0028:12-13"}
  - {id: 4029, name: Mylo, title: Mapmaker, profession: Cartographer, greet: ["Mylo's Maps. I will teach anyone cartography for 100 gold. Nobody ever asks.", "Lost already?"], source: "xeen/aaze0028:8-9"}
  - {id: 4030, name: Dudley, title: Tavern Patron, profession: Peasant, greet: ["Get Lost! Can't you see I'm drinkin'?", "(hic)"], source: "xeen/aaze0028:23"}
  - {id: 4031, name: Agnes Tanner, profession: Tailor, teaches: [{skill: Leather, mastery: expert}], greet: ["Leather is just a cow with better manners. I teach it.", "Smell's not so bad once you're used to it."]}
  - {id: 4032, name: Rialdo, title: Ranger, profession: Tracker, teaches: [{skill: Bow, mastery: expert}], greet: ["Rialdo the Ranger. I teach the bow to those who can hold still.", "Steady hands today?"], source: "xeen/aaze0028:10"}
  - {id: 4033, name: Cooper, profession: Cooper, teaches: [{skill: Axe, mastery: expert}], greet: ["Barrels need staves, staves need an axe. I'll show you.", "Split anything lately?"]}
  - {id: 4034, name: Fenn Fletcher, profession: Trader, greet: ["Arrows by the dozen. Rialdo buys most of them.", "Need fletching?"]}
  - {id: 4035, name: Dora Fletcher, title: Peasant, profession: Peasant, greet: ["The orcs took our sheep. All of them.", "Any news of the orcs?"]}
  - {id: 4036, name: Wren, title: Air Mage, profession: Apprentice, teaches: [{skill: Air Magic, mastery: expert}], greet: ["The wind tells me things. Mostly about weather.", "A good breeze today."]}
  - {id: 4037, name: Odette Marsh, title: Water Mage, profession: Apprentice, teaches: [{skill: Water Magic, mastery: expert}], greet: ["The creek is full of slime. I teach water magic anyway.", "Dry feet? Lucky you."]}
  - {id: 4038, name: Hollis, title: Earth Mage, profession: Stone Cutter, teaches: [{skill: Earth Magic, mastery: expert}], greet: ["Stone listens if you speak slowly.", "Back on solid ground."]}

  # ---- residents outside the walls ----
  - {id: 4039, name: Oslo, title: Farmer, profession: Farmer, greet: ["The orcs took my boy Tam to their caves in the hills.", "Any word of Tam?"]}
  - {id: 4040, name: Tam, title: Oslo's Son, profession: Child, house: none, note: "Held in the Orc Caves (XD-05); A3 moves him to 4036 when he is freed.", greet: ["You came! Is it far to home?", "Thanks for getting me out."]}
  - {id: 4041, name: Celia, title: Captive, profession: Peasant, greet: ["Untie me, please! Derek must be frantic.", "Derek is waiting for me."], note: "Q-C22: tied up in the hut in the zombie wood."}
  - {id: 4042, name: Myra, title: Herbalist, profession: Alchemist, teaches: [{skill: Alchemy, mastery: expert}], greet: ["The witches of the meadow have been turning everyone they find into toads.", "Mind the toads. Some of them were people."], source: "xeen/aaze0023:0"}
  - {id: 4043, name: Hedda Bogg, title: Peasant, profession: Farmer, greet: ["Toad Meadow. The toads were here first.", "Wipe your feet, it's a bog."]}
  - {id: 4044, name: Old Valia, title: Wise Woman, profession: Peasant, greet: ["When I was still a young maiden, I fell asleep in Toad Meadow, and woke beside a unicorn.", "Sit, sit. I'll tell you of Falista."], source: "xeen/aaze0024:5"}
  - {id: 4045, name: Joe, title: Exterminator, profession: Duper, greet: ["Two years ago, I came to this town on contract to control the vermin infestation. I've just about got the situation under control.", "Pest control by Joe!"], source: "xeen/aaze0028:7, :22"}

  # ---- people outdoors and on the streets (no house; the map lane places them) ----
  - {id: 4046, name: Derek, title: Ranger, profession: Tracker, house: none, place: "X1, Derek's camp (A5)", greet: ["My bride Celia is held in a hut in the zombie wood.", "Have you found Celia?"]}
  - {id: 4047, name: Orothin, title: Hermit, profession: Mystic, house: none, place: "X1, by his island statues (A5)", greet: ["I lost my bone whistle in the creek. Without it the statues sleep.", "The whistle?"]}
  - {id: 4048, name: The Spring Druid, profession: Mystic, house: none, place: "X1, Spring Druid's grove (A5)", greet: ["As I renew the year, so will I renew you.", "Spring comes to those who wait."], source: "xeen/aaze0019:15"}
  - {id: 4049, name: Plague Cult member, profession: Follower of Baa, house: none, place: "X1 streets (A5)", greet: ["Sinners must repent.", "Sinners must repent."], source: "xeen/aaze0028:17"}
  - {id: 4050, name: Plague Cult member, profession: Follower of Baa, house: none, place: "X1 streets (A5)", greet: ["The end is near.", "The end is near."], source: "xeen/aaze0028:18"}
  - {id: 4051, name: Plague Cult member, profession: Follower of Baa, house: none, place: "X1 streets (A5)", greet: ["The plague is upon us.", "The plague is upon us."], source: "xeen/aaze0028:19"}
  - {id: 4052, name: Plague Cult member, profession: Follower of Baa, house: none, place: "X1 streets (A5)", greet: ["Slime lords shall rule.", "Slime lords shall rule."], source: "xeen/aaze0028:21"}
