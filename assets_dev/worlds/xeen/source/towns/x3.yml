# X3 Lifeforce Lagoon: Nightshadow, Ebenezer's camp, the Newcastle site and the lagoon (Act II). Owner: A4.
# Format: devdocs/xeen/formats/TOWNS_FORMAT.md; checks: tools/xeen/towns.py.
# Built (A5, installed 2026-11-20): the doors are the ones the L4 sketch draws (briefs/x3/L4/sketch.yml); NPC topics in
# source/npcs/x3.yml (A3).
#
# Ebenezer's camp (WORLD_DESIGN 5.1): a tavern and a shrine at the Newcastle site, outside Nightshadow's curse, open
#   from day one. Ebenezer sells the deed from his tent (M8).
# Nightshadow (cursed, QUESTS Q-C7): before q-c7.done only the Moon Guild (Dark, open at night) and Count Du Monay's
#   manor; the rest opens with the town. After liberation the Moon Guild keeps day hours (a second row, 4104).
# Newcastle: its houses are in the keep (XD-13, xd13.yml); its mirror stands at the gate on X3 (here).
# This file holds X3's block 4101-4140 / 4201-4280; xd13.yml has 4141-4150 / 4281-4300 (TOWNS_FORMAT 2).
key: X3
stem: xeen_x3.odm
town: Lifeforce Lagoon
face: cloudside
blocks:
  houses: [4101, 4140]
  npcs: [4201, 4280]

arrivals:
  # A5's L4 points (briefs/x3/DOORS.md), Z checked against the installed map: the square is the court's floor (1008)
  nightshadow_square: {at: [18432, -5120, 1008], direction: 512, note: "Nightshadow's square among the sundials, by the mirror (Town Portal)"}
  newcastle_gate: {at: [9216, 13312, 1504], direction: 512, note: "outside the Newcastle keep's gate, by the mirror (Town Portal)"}

houses:
  # ---- Ebenezer's camp (town: Ebenezer's camp): open from day one ----
  - id: 4101
    door: thing:ebenezer_tent
    town: Ebenezer's camp
    was: 239
    kind: tavern
    name: Ebenezer's Tent
    price: 14                # D-29: packs to 14 days
    owner: 4201
  - id: 4102
    door: building:camp_shrine
    town: Ebenezer's camp
    was: 310
    kind: temple
    name: The Camp Shrine
    owner: 4203

  # ---- Nightshadow (town: Nightshadow): open from day one ----
  - id: 4103
    door: building:moon_guild
    town: Nightshadow
    was: 176
    kind: dark_guild
    name: The Moon Guild
    owner: 4204
    guild: {spells: 7}
    hours: [21, 6]
    open_before: true
    note: "Open at night only while the Count rules. After q-c7.done the door enters 4104 (day hours)."
  - id: 4104
    door: building:moon_guild
    town: Nightshadow
    alternate_of: 4103
    after: q-c7.done
    was: 176
    kind: dark_guild
    name: The Moon Guild
    owner: 4204
    guild: {spells: 7}
  - id: 4105
    door: building:du_monay_manor
    town: Nightshadow
    kind: residence
    name: Du Monay Manor
    residents: [4205]
    note: "The cursed town's one open house (WORLD_DESIGN 5.1): the Count's fee for the living."
    open_before: true
  # ---- Nightshadow: open once the town is liberated (q-c7.done) ----
  - id: 4106
    door: building:nightshadow_temple
    town: Nightshadow
    was: 312
    kind: temple
    name: Temple of the Dawn
    owner: 4206
    opens: q-c7.done
    closed_text: "Boarded up. Someone has written DAWN on the boards, and someone else has crossed it out."
  - id: 4107
    door: building:nightshadow_tavern
    town: Nightshadow
    was: 246
    kind: tavern
    name: The Coffin and Candle
    owner: 4207
    opens: q-c7.done
    closed_text: "Locked. Through the window: chairs on the tables and a lot of red wine."
  - id: 4108
    door: building:treasure_trove
    town: Nightshadow
    was: 88
    kind: magic_shop
    name: Treasure Trove
    owner: 4208
    shop: {quality: 3}
    opens: q-c7.done
    closed_text: "Closed. A sign: Open after dark. Well, after the dark."
  - id: 4109
    door: building:nightshadow_alchemist
    town: Nightshadow
    was: 120
    kind: alchemist
    name: Garlic and Grave Goods
    owner: 4209
    shop: {quality: 3}
    opens: q-c7.done
