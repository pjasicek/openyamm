  - {id: 4114, door: "building:nightshadow_houses#3", town: Nightshadow, kind: residence, name: Lenore's House, residents: [4215], opens: q-c7.done, closed_text: "Nobody opens. The curtains are drawn, the doorstep is dusty."}
  - {id: 4115, door: "building:nightshadow_houses#4", town: Nightshadow, kind: residence, name: Crow House, residents: [4216], opens: q-c7.done, closed_text: "Nobody opens. The curtains are drawn, the doorstep is dusty."}
  - {id: 4116, door: "building:nightshadow_houses#5", town: Nightshadow, kind: residence, name: Vey Residence, residents: [4217], opens: q-c7.done, closed_text: "Nobody opens. The curtains are drawn, the doorstep is dusty."}
  - {id: 4117, door: "building:nightshadow_houses#6", town: Nightshadow, kind: residence, name: Ambrose's Lean-to, residents: [4218], opens: q-c7.done, closed_text: "Nobody opens. The curtains are drawn, the doorstep is dusty."}
  - {id: 4118, door: "building:nightshadow_houses#7", town: Nightshadow, kind: residence, name: The Dial Keeper's House, residents: [4219], opens: q-c7.done, closed_text: "Nobody opens. The curtains are drawn, the doorstep is dusty."}
  - {id: 4119, door: "building:nightshadow_houses#8", town: Nightshadow, kind: residence, name: The Lamplighter's, residents: [4220], opens: q-c7.done, closed_text: "Nobody opens. The curtains are drawn, the doorstep is dusty."}
  - {id: 4120, door: "building:nightshadow_houses#9", town: Nightshadow, kind: residence, name: Wick House, residents: [4221], opens: q-c7.done, closed_text: "Nobody opens. The curtains are drawn, the doorstep is dusty."}

  # ---- Newcastle's mirror (town: Newcastle; the keep's houses are in xd13.yml) ----
  - id: 4121
    door: thing:newcastle_mirror
    town: Newcastle
    kind: mirror
    name: The Mirror of Newcastle
    opens: m11.keep
    closed_text: "An empty frame leans against the rubble. Emerson will hang the glass when there is a keep to hang it in."
    mirror: {face: cloudside, town: Newcastle, arrival: newcastle_gate, qbit: 119006}
    note: "Stage 2 (QUESTS 4.1: stage 1 walls opens nothing)."

npcs:
  # ---- fixed in the first session (A3 has their topics) ----
  - {id: 4201, name: Ebenezer, title: Taxman, profession: Clerk, talks: true, greet: ["The ruins of Newcastle are for sale. Twelve thousand gold, deed included.", "Changed your mind about the deed?"]}
  - {id: 4202, name: Mirabeth, title: Mermaid, profession: Peasant, talks: true, house: none, place: "X3, her rock in the lagoon (A5)", greet: ["These legs itch. Have you ever had legs that itch?", "Still on legs, sadly."]}
  # ---- Ebenezer's camp ----
  - {id: 4203, name: Brother Tobit, profession: Healer, greet: ["I followed the taxman for the souls. Mostly I bandage the people he taxes.", "Hurt?"]}
  # ---- Nightshadow ----
  - {id: 4204, name: Mordecai, title: Moon Guildmaster, profession: Spell Master, teaches: [{skill: Dark Magic, mastery: expert}], greet: ["We open when the moon is up. The Count prefers it. So do our customers.", "Good evening. It is always evening."]}
  - {id: 4205, name: Count Du Monay, profession: Noble, teaches: [{skill: Vampire, mastery: expert}], greet: ["The living pay a small fee to visit. A very small fee. Mostly in blood.", "Back so soon? How warm of you."], source: "MAPS X3: Count Du Monay's fee for the living"}
  - {id: 4206, name: Mother Aurelia, profession: Healer, greet: ["We hung the first lamp the morning the Count died. We have not taken it down.", "Blessed light."]}
  - {id: 4207, name: Grimsby, title: Innkeeper, profession: Cook, greet: ["The red wine is wine now. I checked.", "A table by the window?"]}
  - {id: 4208, name: Lucan Gloom, title: Dealer in Curiosities, profession: Merchant, greet: ["Everything here belonged to someone who no longer needs it.", "Browsing the dead?"]}
  - {id: 4209, name: Widow Mabry, title: Apothecary, profession: Alchemist, greet: ["Garlic for the neck, holy water for the rest. Cash only.", "More garlic?"]}
  - {id: 4210, name: Nib, title: Gnome, profession: Tinker, greet: ["We hid under the floor for nine years. It was roomy.", "Mind your head. No, lower."]}
  - {id: 4211, name: Tuck, title: Gnome, profession: Tinker, greet: ["Vampires can't bite what they can't find.", "Shh."]}
  - {id: 4212, name: Pim, title: Gnome, profession: Child, greet: ["Is it day? Is it really day?", "Still day?"]}
  - {id: 4213, name: Pale Agatha, title: Seamstress, profession: Weaver, greet: ["I made high collars for the whole town. They sold well.", "A collar?"]}
  - {id: 4214, name: Ostrick, title: Sexton, profession: Ditch Digger, greet: ["Graves dug, graves filled, graves refilled. Nightshadow kept me busy.", "Need a hole?"]}
  - {id: 4215, name: Lenore, title: Minstrel, profession: Bard, greet: ["I have songs about the Count. None you would sing at dinner.", "A song?"]}
  - {id: 4216, name: Bertram Crow, title: Chimney Sweep, profession: Chimney Sweep, greet: ["Bats in every chimney. They tip badly.", "Soot?"]}
  - {id: 4217, name: Constance Vey, title: Town Scribe, profession: Scribe, greet: ["I wrote down every disappearance. It was a long book.", "Anything to record?"]}
  - {id: 4218, name: Old Ambrose, title: Beggar, profession: Beggar, greet: ["Spare a coin? The Count never did.", "Spare another?"]}
  - {id: 4219, name: Tomas, title: Keeper of the Dials, profession: Clerk, greet: ["The Count wakes at nine and sleeps at nine. Set the dials, and he does neither.", "The dials are fine now."]}
  - {id: 4220, name: Merrin, title: Lamplighter, profession: Porter, greet: ["Nine years I lit lamps that nobody wanted.", "Lamps are lit."]}
  - {id: 4221, name: Jasper Wick, title: Locksmith, profession: Locksmith, greet: ["Every lock in town is mine. They never kept anything out.", "Locked out?"]}
