  - {id: 4112, door: "building:nightshadow_houses#1", town: Nightshadow, kind: residence, name: Agatha's House, residents: [4213], opens: q-c7.done, closed_text: "Nobody opens. The curtains are drawn, the doorstep is dusty."}
