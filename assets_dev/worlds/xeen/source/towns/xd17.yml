npcs:
  - {id: 4701, name: Wilbur, sex: male, title: Snackmaster, profession: Cook, greet: ["Try peanut butter and honey on your morning toast. Or anything on anything. It's Shangri-La.", "Snack?"], source: "xeen/aaze0049:22"}
  - {id: 4702, name: Kublai Khan, title: Bouncer, profession: Guard, greet: ["Shangri-La welcomes you!", "Still welcome. Behave."], source: "xeen/aaze0049:29"}
  - {id: 4703, name: Tolliver, sex: male, title: Smith of Arm and Hammer, profession: Smith, greet: ["Arm and Hammer: arms through this door, armour through the other. The hammers are also arms.", "What'll it be?"]}
  - {id: 4704, name: Mother Terra, sex: female, profession: Healer, greet: ["The earth heals all things, slowly. I do it faster, for a fee.", "Rest a while."]}
  - {id: 4705, name: Brunhilde, sex: female, title: Guildmistress, profession: Spell Master, greet: ["You folks look like you want membership in the Shangri-La Wizard's Guild. I'll put your name on the list. Membership is free here.", "Welcome back, members."], source: "xeen/aaze0049:0 (close)"}
  - {id: 4706, name: Jack Alltrades, title: Master of Everything, profession: Teacher, teaches: [{skill: Learning, mastery: grandmaster}], greet: ["I will teach you everything. Well, learning. Learning is everything, if you think about it.", "Learned anything?"], source: "xeen/aaze0049:3 (close)"}
  - {id: 4707, name: Librarian Wen, title: Keeper of the Public Library, profession: Scholar, teaches: [{skill: Meditation, mastery: grandmaster}], greet: ["Silence is the first lesson. You've already failed it. Sit.", "Shh."]}
  - {id: 4708, name: Scholar Ilse, title: Reader in Fire, profession: Spell Master, teaches: [{skill: Fire Magic, mastery: grandmaster}], greet: ["Fire in a library. Yes, I know. That's why I'm very, very good at it.", "Mind the scrolls."]}
  - {id: 4709, name: Brother Aldo, profession: Healer, teaches: [{skill: Body Magic, mastery: grandmaster}], greet: ["Every wound in the book, I've read about. Most of them I've healed.", "Page forty, I think."]}
  - {id: 4710, name: Maurice, title: Know-it-All, profession: Scholar, talks: true, greet: ["I know things. Ask me. No, go on, ask me.", "I knew you'd be back."]}
  - {id: 4711, name: Alexander, title: Hero, profession: Weapons Master, teaches: [{skill: Body Building, mastery: grandmaster}], greet: ["Bravery is mostly muscle. The rest is not thinking about it.", "Lift something."]}
  - {id: 4712, name: Princess Pilar, profession: Noble, teaches: [{skill: Dodging, mastery: grandmaster}], greet: ["A princess learns to dodge early. Suitors, mostly.", "Duck."]}
  - {id: 4713, name: Benedict, title: Prankster, profession: Instructor, teaches: [{skill: Unarmed, mastery: grandmaster}], greet: ["Smile. The intent expression you are wearing is being broadcast to millions from the hidden crystal in the wall.", "Still smiling?"], source: "xeen/aaze0049:14 (close: the camera in your monitor as a crystal in the wall)"}
  - {id: 4714, name: Elona, title: Explorer, profession: Scout, teaches: [{skill: Bow, mastery: grandmaster}], greet: ["I've been everywhere on Xeen. Twice, on the flat bits.", "Back from somewhere?"]}
  - {id: 4715, name: Murray, title: Snob, profession: Noble, teaches: [{skill: Staff, mastery: grandmaster}], greet: ["A staff is a walking stick with ambitions. Not unlike yourselves.", "Oh. You again."]}
  - {id: 4716, name: Psychic Sally, title: Seer, profession: Psychic, talks: true, greet: ["I knew you were coming. I always know. It's very tiring.", "Yes, I know."]}
  - {id: 4717, name: Martok, title: Wanderer, profession: Scout, teaches: [{skill: Dark Elf, mastery: grandmaster}], greet: ["The tavern in Shangri-La has the best tips. I wander here for them.", "Still wandering?"], source: "xeen/aaze0049:31"}
  - {id: 4718, name: Stumpy, title: Talking Tree, profession: Mystic, house: none, place: "XD-17, rooted in the valley's orchard at (4608, -2304) (A5; monster row 11916, MM7's treant)", greet: ["If you have suffered magical aging, the druids can help you. Visit the Druid of Summer first.", "Rustle."], source: "xeen/aaze0049:6"}
  - {id: 4719, name: Lacey, title: Unicorn, profession: Mystic, house: none, place: "XD-17, by the valley's well at (448, -384) (A5; monster row 11915, MM8's unicorn)", greet: ["The moons will align when you are able to visit the Darkside.", "The moons are fine."], source: "xeen/aaze0049:18"}
