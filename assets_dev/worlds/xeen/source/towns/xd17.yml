# XD-17 Shangri-La: the hidden utopia behind the Volcano Cave, an open-air BLV valley (WORLD_DESIGN 5.1; MAPS XD-17;
# source xeen/aaze0049). Owner: A4. Format: devdocs/xeen/formats/TOWNS_FORMAT.md; checks: tools/xeen/towns.py.
# Built (A5's L4 project `devdocs/xeen/briefs/xd17/L4`, installed 2026-11-21 01:45): all 15 doors as wired (D-50
# change 5: the residences' indoor ids are named after their residents); no arrival of A4's (no mirror, no Town Portal). Opens with Q-C26 (both skulls
# smashed; the way in is A3's and A7's). Services (D-5.1, all from the source): Arm and Hammer as two doors (arms and
# armour), the Earth Temple, Tavern Xanadu and the Light guild (guildmistress Brunhilde, membership free); no training
# hall, no mirror (not a Town Portal town); the travel pyramid and the +1 level well are A3's and the map's. The Public
# Library and Jack Alltrades' "An Education" hold the world's late Grandmasters; the source's hint people keep their
# houses. Their hint lines are A3's (they solve quests: Maurice the sword, Alexander the Sphinx's name, Pilar the key,
# Elona the password, Psychic Sally the mirror); Benedict, Wilbur, Murray, Martok, Kublai Khan, Stumpy and Lacey are
# flavour (A4, source/npcs/flavour/xd17.yml). Stumpy the Tree and Lacey the Unicorn stand in the valley as peaceful
# placed actors on shipped bodies (D-50 Q2: A2's rows 11916 Stumpy on MM7's treant, immobile, and 11915 Lacey on
# MM8's unicorn, wandering by the well; A5 places them with these NPC ids). No NPC for X9's Slick (D-50 Q6).
# Teachers: Staff, Bow, Fire Magic, Body Magic, Body Building, Meditation, Dodging, Unarmed, Learning and Dark Elf
# Grandmaster (place shangrila).
