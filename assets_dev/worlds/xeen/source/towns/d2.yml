npcs:
  - {id: 5101, name: Sharla, title: Queen of the Sprites, profession: Noble, talks: true, greet: ["Orcs hold my Princess Sheewana in the Temple of Bark. Ask politely, pay, or take her.", "Sheewana?"]}
  - {id: 5102, name: Dewdrop, title: Sprite Potioner, profession: Alchemist, greet: ["Potions brewed from morning dew. Mostly dew.", "A sip?"]}
  - {id: 5103, name: Lumen, title: Sprite Lightkeeper, profession: Spell Master, greet: ["The sun is weak; we keep a little of it in jars.", "Glow."]}
  - {id: 5104, name: Mossbell, title: Sprite, profession: Peasant, greet: ["Big people! Mind the branches. And the sprites on them.", "Hello again, big people."]}
  - {id: 5105, name: Thistledown, title: Sprite, profession: Piper, greet: ["I play for the trees. They don't clap, but they listen.", "A tune?"]}
  - {id: 5106, name: Nibbler, title: Monkeydog, profession: Peasant, talks: true, greet: ["(Nibbler sniffs your pack hopefully. He is looking for melons.)", "(Nibbler wags at you.)"]}
  - {id: 5107, name: Princess Sheewana, profession: Noble, talks: true, house: none, place: "DD-09 Temple of Bark, held by the orcs; A3 moves her to Sharla's treehouse (4553) after Q-D10", greet: ["You came for me? Oh, how proper.", "Take me home."]}
  - {id: 5108, name: Graalg, title: Ogre Chief, profession: Noble, talks: true, house: none, place: "D2, Ogre Pass between the forts (A6)", greet: ["You come to Graalg's pass. Talk peace or Graalg talks with club.", "Peace?"]}
  # ---- A3's quest people, added in the fourth session (talking actors; portraits in a later batch) ----
  - {id: 5109, name: The Master Thief, title: Head of the Thieves' Guild, profession: Burglar, house: none, place: "DD-06, the Southern Tower's top-floor counting room (A7)", greet: ["You got past the gongs and the chest. Impressive. Sit down before I'm impressed enough to kill you.", "Business, then?"], note: "Q-D19's Dark promotion (A3)"}
  - {id: 5110, name: Hobstadt, title: Troll King, profession: Noble, house: none, place: "DD-11C, his throne hall at the bottom of the troll holes (A7)", greet: ["You fell in. Everyone falls in. Now you pay, or you stay.", "Brought my gold?"], note: "Q-D13 (A3); monster 11073 when he fights"}
  # ---- DD-09 Temple of Bark's prisoners (D-27; peaceful talking actors A8 places, hidden on the next entry once freed;
