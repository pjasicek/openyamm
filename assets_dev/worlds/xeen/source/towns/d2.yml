  - {id: 5111, name: Nathan, title: Prisoner, profession: Peasant, house: none, place: "DD-09, the orcs' pens (A8)", greet: ["The orcs drag one of us out every morning. Nobody comes back.", "Still in the pen. Still breathing."], source: "dark/aaze0073:2"}
  - {id: 5112, name: Sky, title: Prisoner, profession: Peasant, house: none, place: "DD-09, the orcs' pens (A8)", greet: ["Days in this pen. I've forgotten the sun. Not that there's much of it left.", "Is it day out there?"], source: "dark/aaze0073:4"}
  - {id: 5113, name: Snog, title: Orc Prisoner, profession: Laborer, house: none, place: "DD-09, the cells (A8); his own peaceful group, not the orcs' relation (A2)", greet: ["Snog no do evil. Other orcs no like that. So Snog in here.", "Snog still here."], source: "dark/aaze0075:8"}
  - {id: 5114, name: Alicia the Just, title: Prisoner, profession: Peasant, house: none, place: "DD-09, the cells (A8)", greet: ["They chained me for saying aloud what the shaman is. The truth does not care for chains.", "The truth keeps."], source: "dark/aaze0075:10"}
