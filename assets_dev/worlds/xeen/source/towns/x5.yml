npcs:
  # ---- Winterkill ----
  - {id: 4501, name: Casper, title: Mindmeld Guildmaster, profession: Spell Master, talks: true, greet: ["Membership is strictly by invitation. Then again, I may fall asleep with the roll book open. (wink, wink)", "Still awake? I'm not."], source: "MAPS X5: Casper's bribe"}
  - {id: 4502, name: Mayor Randon, profession: Clerk, talks: true, house: none, place: "X5, Winterkill's square by the gongs (A6)", greet: ["My town is full of ghosts and empty of people. Ring the gongs, and come back after each wave.", "How many waves now?"]}
  - {id: 4503, name: Ulla, title: Innkeeper, profession: Cook, greet: ["The last ghost drank here every night. Never paid.", "Something hot?"]}
  - {id: 4504, name: Father Ingram, profession: Healer, greet: ["We buried the town twice. Once was enough.", "Warm yourself."]}
  - {id: 4505, name: Morwenna the Shade, title: Mistress of Shadows, profession: Spell Master, teaches: [{skill: Dark Magic, mastery: master}], greet: ["The ghosts were amateurs. We teach the real thing.", "Step out of the light."]}
  - {id: 4506, name: Bjorn Fellmonger, title: Furrier, profession: Armorer, greet: ["Fur outside, iron inside. The tundra respects both.", "Cold?"]}
  - {id: 4507, name: Old Ottilie, title: Mentalist, profession: Psychic, teaches: [{skill: Mind Magic, mastery: master}], greet: ["I heard the ghosts' thoughts for nine years. Yours are much louder.", "I know why you came."]}
  - {id: 4508, name: Grimwald, title: Ghost Hunter, profession: Hunter, teaches: [{skill: Identify Monster, mastery: master}], greet: ["The Acme Ghost Visualization System. Sold by the gross, works by the dozen.", "Seen anything pale?"], source: "MAPS X5: Acme Ghost Visualization System"}
  - {id: 4509, name: Sven, title: Labourer, profession: Laborer, greet: ["Shovelled snow off the ghosts' graves. They complained.", "Mind the ice."]}
  - {id: 4510, name: Hulda, title: Weaver, profession: Weaver, greet: ["Wool, wool and more wool. There's no such thing as too warm.", "Scarf?"]}
  - {id: 4511, name: Pieter Frost, title: Trapper, profession: Trapper, greet: ["Snow beasts by the score. They taste like boots.", "Need furs?"]}
  - {id: 4512, name: Agna, title: Cook, profession: Cook, greet: ["Soup. It's always soup. It's always cold out.", "Bowl?"]}
  - {id: 4513, name: Old Knut, title: Ice Fisher, profession: Sailor, greet: ["The fish under the ice don't care about ghosts.", "Bite yet?"]}
  - {id: 4514, name: Ragnhild, title: Herder, profession: Farmer, greet: ["The goats knew about the ghosts before we did.", "Mind the goats."]}
  - {id: 4515, name: Elof, title: Chandler, profession: Potter, greet: ["Candles sell well in a ghost town. Nobody wants the dark.", "Candles?"]}
  - {id: 4516, name: Sigrun, title: Tailor, profession: Tailor, greet: ["I sewed shrouds for a year. Now it's coats again.", "A fitting?"]}
  - {id: 4517, name: Bram, title: Woodcutter, profession: Laborer, greet: ["Wood for the fires, wood for the coffins. Mostly fires now.", "Need wood?"]}
  - {id: 4518, name: Liesl, title: Bram's Daughter, profession: Child, greet: ["I talked to the ghosts. They were nice. Papa says don't say that.", "Hello again!"]}
  - {id: 4519, name: Tobin Snow, title: Town Clerk, profession: Scribe, greet: ["Population: forty. Was: four hundred. I keep the old ledger too.", "Sign the book?"]}
  # ---- Kai Wu's monastery ----
  - {id: 4521, name: Kai Wu, title: Master of the Monastery, profession: Instructor, teaches: [{skill: Staff, mastery: master}], greet: ["The ninja in the pagoda were once my students. They learned the wrong lesson.", "Sit. Breathe."]}
  - {id: 4522, name: Brother Lin, profession: Healer, greet: ["The arrow that misses heals faster than the one that hits.", "Peace."]}
  - {id: 4523, name: Sister Mei, profession: Instructor, greet: ["Your hands are weapons. Mind where you leave them.", "Again."]}
  # ---- the tundra ----
  - {id: 4524, name: Glom, title: Gnome King, profession: Noble, talks: true, greet: ["Cyclopes on my border, snow on my roof. Burn their outpost and I'll make it worth your while.", "Is it burnt?"]}
  - {id: 4525, name: Fizzwick, title: Steward of the Gnome King, profession: Counselor, greet: ["His Majesty is busy. His Majesty is always busy.", "Back again?"]}
  - {id: 4526, name: Halon the Efficient, title: Clockmaker, profession: Tinker, talks: true, greet: ["My water clock freezes. Bring me the Ever-Hot Lava Rock from Mount Firestone.", "The rock? Efficiently, please."]}
  - {id: 4527, name: Freeda, title: Mountaineer, profession: Guide, house: none, place: "X5, the high pass (A6)", teaches: [{skill: Body Building, mastery: master}], greet: ["Climb with me and you'll come down stronger. Or not at all.", "Up again?"]}
  - {id: 4528, name: Thickbark, title: Learned Tree, profession: Scholar, house: none, place: "X5, the Troll Forest's edge (A6)", greet: ["The trolls are uncouth. Burn their warren and we shall discuss the weather.", "The warren?"]}
  - {id: 4529, name: The Winter Druid, profession: Mystic, house: none, place: "X5, the Winter Druid's grove (A6)", greet: ["Snow falls here, and nowhere else on Xeen.", "The snowflake?"]}
  - {id: 4530, name: Shinobu, title: Heir of the Clan, profession: Burglar, house: none, place: "XD-22, the Ninja Pagoda's cellar, among the clan's survivors (a talking actor, A7)", greet: ["You walk loudly for people who killed a ninja master.", "Back in the dark?"], note: "T2-CLAN (A3): Initiate to Ninja after q-c4.done, gated on m20.started (D-12.2); XD-22 stands on X5, so her id is X5's"}
