npcs:
  # ---- proprietors ----
  - {id: 4101, name: Brann, sex: male, title: Blacksmith, profession: Smith, greet: ["Rivercity Smithing. Paid up front; this is Rivercity.", "Back for an edge?"]}
  - {id: 4102, name: Ragna, sex: female, title: Armorer, profession: Armorer, greet: ["Armour. In this town you'll want it.", "Still alive. My work, I expect."]}
  - {id: 4103, name: Mother Grizzle, sex: female, greet: ["Into the Cauldron, dearies. Wands, rings, oddments.", "Back, dearies?"]}
  - {id: 4104, name: Pip, sex: male, title: Alchemist, profession: Alchemist, greet: ["The Bubbling Flask. Don't drink the green one.", "Something bubbling for you?"]}
  - {id: 4105, name: Pennyworth, sex: male, title: Banker, profession: Banker, greet: ["The Bank. Deposits welcome. Robbers less so.", "Your gold is where you left it."]}
  - {id: 4106, name: Bull, sex: male, title: Innkeep, greet: ["Bull's Tavern. Sit, drink, don't start anything.", "The usual?"]}
  - {id: 4107, name: Knuckles, sex: male, title: Instructor, profession: Instructor, greet: ["Street Fightin'. I'll train you to twenty-fifth level, if you live.", "Back for a beating?"]}
  - {id: 4108, name: Deacon Coyne, sex: male, title: Healer, profession: Healer, greet: ["Pray, pay, and be healed today.", "Coin first, then prayers."], source: "xeen/aaze0030:31"}
  - {id: 4109, name: Hesper, sex: female, title: Guildmistress, greet: ["The Guild of Body. Come in, all of you.", "Feeling well?"]}
  - {id: 4110, name: Thaddeus, sex: male, title: Guildmaster, greet: ["The Guild of Mind. Think before you touch anything.", "I thought you'd come."]}
  - {id: 4111, name: Sister Amity, sex: female, greet: ["The Guild of Spirit. Be welcome.", "Peace on you again."]}
  - {id: 4112, name: Garrick, sex: male, title: Stablemaster, profession: Horseman, greet: ["Royal Steeds. Coaches east to Vertigo.", "Saddled and ready."]}
  - {id: 4113, name: Captain Nystor, sex: male, talks: true, profession: Sailor, greet: ["I can give ya a boat ride to the Eastern shore, if ya be interested.", "Those Ogres are ruining me!"], source: "xeen/aaze0030:66, aaze0010:23"}

  # ---- residents north of the river ----
  - {id: 4114, name: Barlow, title: Bruiser, profession: Guard, teaches: [{skill: Mace, mastery: expert}], greet: ["A mace settles arguments. I'll show you how.", "Still arguing with people?"]}
  - {id: 4115, name: Mrs. Kettle, title: Gossip, profession: Peasant, greet: ["Have you heard? The robbers live under the bridge. Everybody knows.", "Have you heard the latest?"]}
  - {id: 4116, name: Old Kettle, title: Peasant, profession: Peasant, greet: ["Don't listen to her.", "She's out."]}
  - {id: 4117, name: Rook, title: Retired Thief, profession: Burglar, teaches: [{skill: Stealing, mastery: expert}], greet: ["Retired. Mostly. I could teach you a trick or two.", "Checked your pockets lately?"]}
  - {id: 4118, name: Sallow, title: Locksmith, profession: Locksmith, teaches: [{skill: Disarm Trap, mastery: expert}], greet: ["Every lock in Rivercity has been picked. I fit the new ones.", "Mind the tripwire. Joking."]}
  - {id: 4119, name: Magneto, title: Navigator, profession: Navigator, greet: ["For 2,000 gold I will teach you how to use the stars to keep from getting lost.", "School of Navigation 9N. Mountains in your way? Try due N."], source: "xeen/aaze0030:8-9, :27-28"}
  - {id: 4120, name: Gideon Tanner, title: Leatherworker, profession: Tailor, teaches: [{skill: Leather, mastery: master}], greet: ["Agnes in Vertigo taught you the basics? Good. Now the rest.", "Good hide, that."]}
  - {id: 4121, name: Lantern, title: Appraiser, profession: Scholar, teaches: [{skill: Identify Item, mastery: expert}], greet: ["Bring it into the light and I'll tell you what it is.", "Found something shiny?"]}
  - {id: 4122, name: Captain Yang, profession: Squire, teaches: [{skill: Sword, mastery: master}], greet: ["Captain Yang, of the King's knights. We keep the peace here. Mostly.", "Report, Crusaders."]}
  - {id: 4123, name: Old Ferris, title: Shepherd, profession: Farmer, teaches: [{skill: Staff, mastery: expert}], greet: ["A good staff walks you home and keeps the wolves off.", "Leaning on your staff?"]}
  - {id: 4124, name: Quill, title: Scholar, profession: Scholar, teaches: [{skill: Learning, mastery: expert}], greet: ["Books, dear adventurer. Books.", "Reading anything good?"]}
  - {id: 4125, name: Mudd, title: Ditch Digger, profession: Ditch Digger, greet: ["The river floods, I dig. The river floods again.", "Muddy work."]}
  - {id: 4126, name: Bess Mudd, title: Peasant, profession: Peasant, greet: ["Boots off at the door.", "Boots!"]}
  - {id: 4127, name: Martin, title: Mountaineer, profession: Guide, greet: ["For the low, low, price of 5,000 gold, I will teach you how to climb the highest mountains.", "Mountains are just tall hills."], source: "xeen/aaze0030:6-7"}
  - {id: 4128, name: Gaff, title: Fisherman, profession: Sailor, teaches: [{skill: Spear, mastery: expert}], greet: ["A gaff hook is a short spear. I teach the long kind too.", "Fish are biting. People too."]}
  - {id: 4129, name: Old Tackle, title: Fisherman, profession: Sailor, greet: ["Nystor's boats used to run upriver. Then the ogres came.", "Nothing biting."]}

  # ---- the tavern and the temple ----
  - {id: 4130, name: Snorri, title: Tavern Patron, profession: Peasant, greet: ["Get lost. Can't you see I'm drinkin'?", "(hic)"], source: "xeen/aaze0030:17"}
  - {id: 4131, name: Tavern Patron, profession: Peasant, greet: ["If Barok ever got his pendant back, this place might charge me for drinks.", "Free water. Can't complain."], source: "xeen/aaze0030:19"}
  - {id: 4132, name: Tavern Patron, profession: Gambler, greet: ["Now THIS is a wild town.", "The tavern hired the sorceresses to run Barok out of town."], source: "xeen/aaze0030:23, :21"}
  - {id: 4133, name: Temple goer, profession: Peasant, greet: ["I can't believe the cost of healing these days!", "Still can't believe it."], source: "xeen/aaze0030:26"}

  # ---- the skill row ----
  - {id: 4134, name: Arnold, title: Strongman, profession: Arms Master, teaches: [{skill: Body Building, mastery: expert}], greet: ["I see that you are pale and weak. I will teach you Bodybuilding so that you can put some meat on your bones.", "Lift!"], source: "xeen/aaze0030:4-5"}
  - {id: 4135, name: Flint, title: Armsmaster, profession: Weapons Master, teaches: [{skill: Armsmaster, mastery: expert}], greet: ["Fighting is simple. I'll teach you to be an Armsmaster in one easy lesson.", "One more lesson?"], source: "xeen/aaze0030:2-3"}
  - {id: 4158, name: Sparrow, title: Pit Fighter, profession: Instructor, teaches: [{skill: Dodging, mastery: expert}, {skill: Unarmed, mastery: expert}], greet: ["Two lessons. How to hit with nothing in your hands, and how not to be there when they hit back.", "Duck."], note: "D-73: Dodging and Unarmed Expert, the Monk's core skills, before Castleview's Masters"}
  - {id: 4136, name: Lindon, title: Taskmaster, profession: Quarter Master, greet: ["I'll give you 100 gold for a week of work. Sign up?", "Work's still there."], source: "xeen/aaze0030:0-1"}

  # ---- residents south of the river ----
  - {id: 4137, name: Crane, title: Old Soldier, profession: Guard, teaches: [{skill: Chain, mastery: expert}], greet: ["Chain mail is heavy until it saves your life.", "Still wearing it?"]}
  - {id: 4138, name: Mercy Wharf, title: Trader, profession: Trader, teaches: [{skill: Merchant, mastery: expert}], greet: ["Everything has a price. Learn to haggle.", "Bargain hunting?"]}
  - {id: 4139, name: Ladle, title: Cook, profession: Cook, greet: ["Stew's on. It's always on.", "Hungry?"]}
  - {id: 4140, name: Dottie Ladle, title: Peasant, profession: Peasant, greet: ["Don't touch the stew.", "Did you touch the stew?"]}
  - {id: 4141, name: Sister Ophelia, profession: Mystic, teaches: [{skill: Meditation, mastery: expert}], greet: ["Sit. Breathe. The bridge traffic fades.", "Breathe."]}
  - {id: 4142, name: Ott, title: Ferryman, profession: Sailor, greet: ["The bridge put me out of work. I row for fun now.", "Need a ferry? There's a bridge."]}
  - {id: 4143, name: Hawser, title: Rope Maker, profession: Laborer, greet: ["Rope for the boats, rope for the robbers. I don't ask.", "Need rope?"]}
  - {id: 4144, name: Widow Brine, title: Fishwife, profession: Trader, greet: ["Fresh fish! Fresh-ish fish!", "Still fresh-ish."]}
  - {id: 4145, name: Wenda, title: Ranger, profession: Hunter, teaches: [{skill: Bow, mastery: master}], greet: ["Rialdo taught you to hold a bow? I'll teach you to hit something.", "Still hitting the target?"]}
  - {id: 4146, name: Vatawna, title: Guildmaster, profession: Clerk, teaches: [{skill: Body Magic, mastery: expert}], greet: ["The roll's open. My lessons are not free.", "Back for a lesson?"], source: "xeen/aaze0030:12-13"}
  - {id: 4147, name: Aldous, title: Mind Guild Steward, profession: Counselor, teaches: [{skill: Mind Magic, mastery: expert}], greet: ["The Guild of Mind keeps its roll here. Your names are on it already.", "I knew you'd be back."]}
  - {id: 4148, name: Brother Cael, profession: Acolyte, teaches: [{skill: Spirit Magic, mastery: expert}], greet: ["The Guild of Spirit takes all who seek.", "Be welcome again."]}
  - {id: 4149, name: Reed, title: Basket Weaver, profession: Weaver, greet: ["Baskets. For fish, mostly.", "Basket?"]}
  - {id: 4150, name: Darlene, title: Swimming Teacher, profession: Sailor, greet: ["I can teach you how to swim for a mere 100 gold. Or sell you a scroll, if you sink.", "Water's fine."], source: "xeen/aaze0030:10-11"}

  # ---- outside the town ----
  - {id: 4151, name: Barok, title: Sorcerer, profession: Spell Master, greet: ["The sorceresses of Rivercity have stolen a magical pendant of mine. I want it back.", "No pendant, no reward."], source: "xeen/aaze0030:34-35, :38"}
  - {id: 4152, name: Medin, title: Fisherman, profession: Sailor, greet: ["Three dragons live in my lake. You can't fish with dragons.", "Are the beasts gone?"]}
  - {id: 4153, name: Tito, title: Elf Priest, profession: Healer, teaches: [{skill: Spirit Magic, mastery: master, opens: q-c18.done}], greet: ["The Holy Book of Elvenkind was lost in the Troll Forest.", "Any word of the Book?"]}
  - {id: 4154, name: Danulf, title: Faery King, profession: Noble, house: none, place: "X2, his ring of stones (A5)", greet: ["Crazed sprites hold my Wand of Faery Magic in the south woods.", "My wand?"]}
  - {id: 4155, name: Ligono, title: Restless Spirit, profession: Mystic, house: none, place: "X2, the cliff top at the rim (A5)", greet: ["I hate the surf. Find my skull.", "My skull?"], source: "xeen/aaze0015:10"}
  - {id: 4156, name: Velda, title: Sorceress for Hire, profession: Spell Master, greet: ["The tavern pays us to keep Barok out of town. You are not Barok. Sit, but touch nothing.", "Still not Barok? Good."], source: "xeen/aaze0030:21 (the tavern hired the sorceresses)"}
  - {id: 4157, name: Ysmay, title: Sorceress for Hire, profession: Enchanter, greet: ["We plugged the fountain. Water is a growth business.", "Thirsty?"]}
