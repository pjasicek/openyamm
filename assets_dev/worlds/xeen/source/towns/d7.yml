npcs:
  - {id: 5601, name: Hephaestus, sex: male, title: Smith of the Gods, profession: Smith, greet: ["I forged the thunderbolts. These are smaller. They're on sale.", "Hammer or tongs?"]}
  - {id: 5602, name: Dionysus, sex: male, title: Keeper of the Nectar House, profession: Cook, greet: ["Nectar, ambrosia, and a cheese plate. Even gods like cheese.", "Another cup?"]}
  - {id: 5603, name: Pythia, sex: female, title: Priestess of Olympus, profession: Healer, greet: ["I see the future. It needs healing. So do you.", "Be well. You will be."]}
  - {id: 5604, name: Heracles, sex: male, title: Master of the Hall of Heroes, profession: Weapons Master, greet: ["No ceiling in this hall. Only sky, and we're above most of it.", "Twelve labours. Start with one."]}
  - {id: 5605, name: Apollo, sex: male, title: Light Guildmaster, profession: Spell Master, teaches: [{skill: Light Magic, mastery: grandmaster}], greet: ["The sun below is failing. Up here we keep a spare.", "Shine."]}
  - {id: 5606, name: Hestia, sex: female, title: Spirit Guildmistress, profession: Healer, teaches: [{skill: Spirit Magic, mastery: grandmaster}], greet: ["Every hearth has a spirit. Mine has a guild.", "Warm yourself."]}
  - {id: 5607, name: Lucio, sex: male, title: Boatman, profession: Sailor, talks: true, greet: ["Celestial boats. Castleview, Sandcaster, Lakeside. Don't lean over the side.", "Going down? Use the mirror. My boats only sail up."], source: "dark/aaze0095, aaze0098 (Lucio the Boatman)"}
  - {id: 5608, name: Adonis, title: God of Beauty, profession: Noble, greet: ["Ever lie down on your belly and look over the edge of the cloud? The people are so small they look like ants.", "Still handsome. Thank you for noticing."], source: "dark/aaze0037:17"}
  - {id: 5609, name: Athena, title: Goddess of War, profession: Weapons Master, teaches: [{skill: Spear, mastery: grandmaster}], greet: ["Fill your packs with the nectar of the Gods while you are here. Then pick up a spear.", "Hungry? Armed?"], source: "dark/aaze0037:21 (close)"}
  - {id: 5610, name: Hermes, title: Messenger of the Gods, profession: Merchant, teaches: [{skill: Merchant, mastery: grandmaster}], greet: ["Pears just about everywhere cost but 1 gold. Know that, and you know trade.", "Buying or selling?"], source: "dark/aaze0037:23"}
  - {id: 5611, name: Atlas, title: Titan, profession: Weapons Master, teaches: [{skill: Regeneration, mastery: grandmaster}], greet: ["I held up the sky once. My back healed. Yours will too.", "Shoulders back."]}
  - {id: 5612, name: Zeus, title: King of the Gods, profession: Noble, teaches: [{skill: Air Magic, mastery: grandmaster}], greet: ["I am Zeus. You may have heard. Lightning is mostly wrist.", "Thunder?"]}
  - {id: 5613, name: Hera, title: Queen of the Gods, profession: Scholar, teaches: [{skill: Identify Monster, mastery: grandmaster}], greet: ["I'm waiting for my friend Ligono. If you see him, tell him to meet me here.", "Know thine enemy. I do."], source: "dark/aaze0037:35"}
