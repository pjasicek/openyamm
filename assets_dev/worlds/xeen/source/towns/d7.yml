# D7 The Skyroads: Olympus, the city of the gods (WORLD_DESIGN 5.2; MAPS D7; source dark/aaze0037). Owner: A4.
# Format: devdocs/xeen/formats/TOWNS_FORMAT.md; checks: tools/xeen/towns.py.
# Built (A6's install of 2026-11-21 04:53, briefs/d7/L4): the doors as A6's wiring names them. Reached after M30 (the Chosen
# Ones). Services: smith, tavern, temple, training without a cap (x80), the Light and Spirit guilds, the mirror (with
# Kalindra's stage 4, A3's helper) and Lucio's dock, the landing of his celestial boats from Castleview, Sandcaster and
# Lakeside (D-5.3: the boats only sail up, routes 424-426 in d1, d3, d4, after M30; the way down is the falls, the
# mirror and Town Portal, so the dock is Lucio's house, not a boats house; routes 421-423 retired). The source's six
# gods live in the six houses (Adonis, Athena, Hermes, Atlas, Zeus, Hera). Soul Storage (M31), the plaques and the
# prophecy statues are A3's and the map's. Ligono (4155, X2) arrives here after Q-C19 (A3 moves him; he waits by
# Hera's house).
# Teachers: Spear, Air, Spirit, Light, Merchant, Regeneration and Identify Monster Grandmaster (place olympus).
