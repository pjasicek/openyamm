# Second offers of a mastery that the three-place rule above already places: a teacher who is there before his
# Grandmaster offer opens (Gem, Errol). towns.py checks them like the others.
extra:
  - {skill: Perception, mastery: master, place: kalindra_court}
  - {skill: Armsmaster, mastery: master, place: kalindra_court}
