npcs:
  - {id: 5001, name: Queen Kalindra, profession: Noble, talks: true, house: none, place: "DD-14 Castle Blackfang's dungeon, her cell (3-31-62, m27.queen_cell), as A2's row 11918 Queen Kalindra (D-52 item 6: placed only, peaceful, unkillable, hidden after m27.done, 111542); then A3 moves her to the throne room (4501)", greet: ["My crown. My castle. My thanks, Crusaders.", "The Darkside owes you."]}
  - {id: 5002, name: Gem, title: Steward of the Throne, profession: Scout, teaches: [{skill: Perception, mastery: master}, {skill: Perception, mastery: grandmaster, opens: m26.stage4}], greet: ["I kept watch over an empty throne in a castle that wasn't there. You learn to notice things.", "Notice anything?"]}
  - {id: 5003, name: Errol, title: Master of Arms, profession: Weapons Master, teaches: [{skill: Armsmaster, mastery: master}, {skill: Armsmaster, mastery: grandmaster, opens: m26.stage4}], greet: ["Every weapon in the armoury, I've used. Some of them on the armoury.", "Pick one."]}
  - {id: 5004, name: Dimitri, title: Captain of the Guard, profession: Guard, talks: true, greet: ["The Queen is gone. What is a captain without a queen?", "Leave me be."]}
  - {id: 5005, name: Megan, title: Dimitri's Daughter, profession: Peasant, talks: true, greet: ["Father has lost all hope. Only the Songbird of Serenity could lift it.", "The Songbird?"]}
  - {id: 5006, name: Astronomer Tycho, title: Keeper of the Telescope, profession: Scholar, teaches: [{skill: Identify Item, mastery: master}], greet: ["The stars from here are very small. So is everything else, if you look closely.", "Look through the glass."]}
  - {id: 5007, name: Guido, title: Convict, profession: Burglar, talks: true, greet: ["Try ten, eleven, twelve on the tougher safes. You didn't hear it from me.", "Got a file?"], source: "MAPS DD-03: Guido's note (Try 10,11,12 on the tougher safes)"}
  - {id: 5008, name: Mother Seraphine, sex: female, profession: Healer, teaches: [{skill: Mace, mastery: grandmaster}], greet: ["The mace is a holy instrument. It is also a mace.", "Bless you."]}
  - {id: 5009, name: Treasurer Abelard, sex: male, profession: Banker, greet: ["The treasury came back with the castle. Most of it.", "Deposit?"]}
  - {id: 5010, name: Lady Brienne, sex: female, profession: Weapons Master, teaches: [{skill: Sword, mastery: grandmaster}], greet: ["Train here and there is no ceiling. Only the sky, and it's failing.", "Blades up."]}
  - {id: 5011, name: Haldor, sex: male, title: Queen's Smith, profession: Smith, teaches: [{skill: Plate, mastery: grandmaster}], greet: ["Plate for the Queen's knights. Fit for a queen's enemies, too.", "Need fitting?"]}
  - {id: 5012, name: Groom Wendell, sex: male, profession: Horseman, greet: ["The horses came back with the castle. They were not pleased.", "Where to?"]}
  - {id: 5014, name: Carl, title: Mason, profession: Stone Cutter, house: none, place: "DD-03, the kitchen (stage 1, A8)", greet: ["I helped build Castle Kalindra. The place is full of secret doors and traps. If you ever come to a dead end in the castle, just keep walking. The wall may be an illusion.", "Dead end? Keep walking."], source: "dark/aaze0041:34-35", note: "D-26: a stage-1 talking actor, the one answer to the coat closet's illusory wall"}
  - {id: 5013, name: Sir Roderic, profession: Arms Master, teaches: [{skill: Shield, mastery: grandmaster}], greet: ["A shield held right stops anything. Held wrong, it stops you.", "Shields!"]}
