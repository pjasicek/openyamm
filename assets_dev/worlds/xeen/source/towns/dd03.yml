# DD-03 Castle Kalindra: the Queen's castle, out of phase, restored in four stages of 5 Energy Disks (QUESTS 4.2).
# Owner: A4. Format: devdocs/xeen/formats/TOWNS_FORMAT.md; checks: tools/xeen/towns.py.
# Built (A8's L4 project `devdocs/xeen/briefs/dd03/L4`, installed 2026-11-20 19:45): every door as drawn (its NOTES and
# wiring): each oak house door is two wings, the left carrying the door id, the right a `panel:<id>_r` (also_doors);
# the throne is `platform:kalindra_throne`, the mirror a framed glass panel `panel:kalindra_mirror`.
# Stages (A3's Xeen.Stages.kalindra): m19.stage1 (5 disks) gate, throne room, Gem and Errol;
# (stage 1 they teach up to Master; their Grandmaster offers open at stage 4, orchestrator 2026-11-20);
# m19.stage2 (10) Dimitri, Megan, the telescope; m26.stage3 (15) the dungeon, Guido; m26.stage4 (20) the third floor:
# temple, bank, training to 200 (x50), smith, stables, and the Darkside mirrors wake (the mirror below; A3's helper
# keeps every Darkside mirror shut before that stage).
# Queen Kalindra (5001) is in Castle Blackfang until M27; A3 moves her into the throne room then.
# D-26 (mockups/act3_a8_decisions_a.md): the throne room is walkable and the throne itself is house 4501's door; the
# stables (4510) and the mirror (4512) stand in an open-sky yard inside the castle, behind the stage-4 phase wall; the
# coaches from Kalindra's stables set the party down outside the gate on D1 (`kalindra_gate`, d1.yml), so the castle has
# no arrival of its own. Carl the Mason (5014) talks in the kitchen from stage 1; James the Spy is left out.
key: DD-03
stem: xeen_dd03.blv
town: Castle Kalindra
face: darkside
blocks:
  houses: [4501, 4550]
  npcs: [5001, 5100]

