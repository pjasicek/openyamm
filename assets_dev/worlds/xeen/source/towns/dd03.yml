  - {id: 4502, door: door:captain_quarters, also_doors: [panel:captain_quarters_r], kind: residence, name: Captain's Quarters, residents: [5004], opens: m19.stage2, closed_text: "A shimmering wall seals the second floor. Something behind it sighs."}
  - {id: 4503, door: door:megan_room, also_doors: [panel:megan_room_r], kind: residence, name: Megan's Room, residents: [5005], opens: m19.stage2, closed_text: "A shimmering wall seals the second floor. Something behind it sighs."}
  - {id: 4504, door: door:observatory, also_doors: [panel:observatory_r], kind: residence, name: The Observatory, residents: [5006], opens: m19.stage2, closed_text: "A shimmering wall seals the second floor. Something behind it sighs."}
  - {id: 4505, door: door:guido_cell, kind: residence, name: Guido's Cell, residents: [5007], opens: m26.stage3, closed_text: "The dungeon stair ends in shimmering nothing."}
