  - {id: 4509, door: door:forge, also_doors: [panel:forge_r], was: 12, kind: weapon_shop, name: The Queen's Forge, owner: 5011, shop: {quality: 5}, opens: m26.stage4, closed_text: "The third floor shimmers, half here. Not yet."}
