# D3 Sandcaster and the Aging Forest: Sandcaster, its wizard quarter, the Crossroads market (Act III). Owner: A4.
# Format: devdocs/xeen/formats/TOWNS_FORMAT.md; checks: tools/xeen/towns.py.
# Built (A5's L4 project `devdocs/xeen/briefs/d3/L4`, installed 2026-11-20 18:21): every door as drawn (its DOORS.md);
# the arrivals are A5's points, Z the installed terrain or the square's paving. A3 writes the topics in
# source/npcs/d3.yml.
#
# Sandcaster (WORLD_DESIGN 5.2): a sandstone merchant city ruled by evil wizards; the skill-school town (Merchant,
#   Learning, Stealing; Navigator and Linguist are flavour, no MM6-MM8 skill). Training to 80 (x40). The wizard
#   quarter (houses 4613-4617) opens with Q-D14 (q-d14.done): the Dark guild, a second magic shop and its three
#   Grandmasters. Astra, who gives Q-D14, lives outside the quarter. The quarter's dungeon is DD-19 (A8).
# The Crossroads: six small house doors for the market stalls (WORLD_DESIGN 5.2 lets them be houses).
# Lucio's Jetty (D-5.3): Lucio's celestial boat up to Olympus, two departures a week, after M30 (A3's m30.done).
