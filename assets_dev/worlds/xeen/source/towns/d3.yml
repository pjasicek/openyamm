npcs:
  # ---- Sandcaster's services ----
  - {id: 5201, name: Rashid, title: Bladesmith, profession: Smith, teaches: [{skill: Dagger, mastery: master}], greet: ["A dagger is a sword that has learned to be discreet.", "Something sharp?"]}
  - {id: 5202, name: Zubaida, title: Armourer, profession: Armorer, greet: ["Brass scale: it shines, it turns a blade, and it cooks you at noon.", "A fitting?"]}
  - {id: 5203, name: Aladdin, title: Lamp Cleaner, profession: Merchant, greet: ["Lamps cleaned, lamps sold. If anything comes out, that's extra.", "Rub one?"], source: "MAPS D3: Aladdin the Lamp Cleaner"}
  - {id: 5204, name: Omar the Peddler, title: Remedy Seller, profession: Alchemist, greet: ["Vulture Repellant! Guaranteed! Results may vary.", "It didn't work? Odd."], source: "MAPS D3: the Vulture Repellant stall"}
  - {id: 5205, name: High Priestess Samira, profession: Healer, greet: ["The sun fails, and still we pray to it. Habit.", "Be healed."]}
  - {id: 5206, name: Hakim, title: Innkeeper, profession: Cook, greet: ["Water is dearer than wine here. I charge accordingly.", "Thirsty?"]}
  - {id: 5207, name: Barticus, title: Master of the Gym, profession: Instructor, greet: ["Lift, run, lift again. Eighty levels of it, if you can stand.", "Again!"]}
  - {id: 5208, name: Yusuf, title: Mind Guildmaster, profession: Spell Master, greet: ["The wizards took the quarter. We kept the guild. Small mercies.", "Think on it."]}
  - {id: 5209, name: Layla, title: Spirit Guildmistress, profession: Healer, talks: true, greet: ["Spirit is what's left when the wizards take everything else.", "Peace."]}
  - {id: 5210, name: Nasir, title: Light Guildmaster, profession: Spell Master, teaches: [{skill: Light Magic, mastery: master}], greet: ["A small sun, but ours. Light is learned slowly here.", "Let there be light."]}
  - {id: 5211, name: Caravan Master Idris, profession: Trader, greet: ["Castleview, and Lakeside when the coven lets us through.", "Where to?"]}
  # ---- the wizard quarter ----
  - {id: 5212, name: Magus Ferrante, title: Master of the Guild of Night, profession: Spell Master, greet: ["Xenoc kept us under lock. Now you hold the key. Do not insult it.", "Mind your tongue."]}
  - {id: 5213, name: Esmeralda, title: Purveyor of Esoterica, profession: Enchanter, greet: ["Everything here is magic. Some of it even works.", "Look, don't touch."]}
  - {id: 5214, name: Mindwright Orsolo, title: Wizard of the Mind, profession: Psychic, teaches: [{skill: Mind Magic, mastery: grandmaster}], greet: ["You are thinking that I am rude. I am thinking it too.", "Think louder."]}
  - {id: 5215, name: Appraiser Quince, profession: Scholar, teaches: [{skill: Identify Item, mastery: grandmaster}], greet: ["I can tell you what it is, who made it, and how much you overpaid.", "Show me."]}
  - {id: 5216, name: Alchemist Morvenna, title: Wizard of the Alembic, profession: Alchemist, teaches: [{skill: Alchemy, mastery: grandmaster}], greet: ["Black potions, white potions. The rest is details.", "Bring me something to boil."]}
  # ---- Sandcaster's people ----
  - {id: 5217, name: Astra, title: Good Sorceress, profession: Spell Master, talks: true, greet: ["Xenoc and Morgana have seized the guilds of the quarter. Help me throw them out.", "The quarter?"]}
  - {id: 5218, name: Natasha, title: Enchantress, profession: Enchanter, talks: true, greet: ["I enchant anything for a fee. A griffin's bridle? Double fee.", "Something to enchant?"]}
  - {id: 5219, name: Madame Gloriana, title: Palm Reader, profession: Gypsy, greet: ["Your palm says you will pay me. It is never wrong.", "Your other hand?"], source: "MAPS D3: Madame Gloriana the palm reader"}
  - {id: 5220, name: Merchant Hassan, title: Master of Trade, profession: Merchant, teaches: [{skill: Merchant, mastery: master}], greet: ["Buy low, sell high, and never let a wizard set the price.", "A lesson in haggling?"]}
  - {id: 5221, name: Master Faisal, profession: Teacher, teaches: [{skill: Learning, mastery: master}], greet: ["Read everything. Believe half. Remember all of it.", "Study."]}
  - {id: 5222, name: Silent Saleh, title: Retired Thief, profession: Burglar, teaches: [{skill: Stealing, mastery: master}], greet: ["I never stole a thing in Sandcaster. Ask anyone who noticed.", "Say nothing."]}
  - {id: 5223, name: Navigator Ansel, profession: Navigator, greet: ["North is that way. Usually.", "Lost?"]}
  - {id: 5224, name: Polyglot Pella, title: Linguist, profession: Scholar, greet: ["I speak eleven tongues and the wizards understand none of them.", "Pardon?"]}
  - {id: 5225, name: Kirra, title: Dark Elf Blademistress, profession: Scout, teaches: [{skill: Dark Elf, mastery: master}], greet: ["The dark elves remember the old ways. I'll teach you the sharper ones.", "In the shadows."]}
  - {id: 5226, name: Farida, title: Spice Seller, profession: Trader, greet: ["Saffron, cumin, and a little sand. The sand is free.", "Smell this."]}
  - {id: 5227, name: Archer Jalal, title: Bowman, profession: Hunter, greet: ["The secret of archery: accuracy, accuracy, and accuracy.", "Hit anything?"], source: "MAPS D3: the bow teacher's accuracy, accuracy, and accuracy"}
  - {id: 5228, name: Old Basim, title: Townsman, profession: Peasant, greet: ["The wizards took the quarter and the taxes. They left us the sand.", "Sand?"]}
  - {id: 5229, name: Dyer Nura, profession: Tailor, greet: ["Every colour but desert. Nobody wants desert.", "Some blue?"]}
  - {id: 5230, name: Glassblower Tariq, profession: Potter, greet: ["Sand in, glass out. Sandcaster's one honest trade.", "Mind the glass."]}
  - {id: 5231, name: Water Seller Amir, profession: Porter, greet: ["Water! Cold water! Well, water.", "Cup?"]}
  - {id: 5232, name: Camel Driver Rami, profession: Horseman, greet: ["Camels spit. People complain. The camels don't care.", "Need a camel?"]}
  - {id: 5233, name: Scribe Hala, profession: Scribe, greet: ["I write the wizards' decrees. I also misspell them.", "Write something?"]}
  - {id: 5234, name: Potter Ziad, profession: Potter, greet: ["Pots for water, pots for oil, pots for hiding gold from the wizards.", "Buy a pot."]}
  - {id: 5235, name: Tax Collector Malik, profession: Clerk, greet: ["The wizards' tax is due. It is always due.", "Pay up?"]}
  - {id: 5236, name: Old Rasha, title: Grandmother, profession: Peasant, greet: ["I remember when the sun was bright. You don't.", "Sit with me."]}
  - {id: 5237, name: Sandal Maker Idris, title: Cobbler, profession: Cobbler, greet: ["Sandals for sand. Boots for fools.", "New soles?"]}
  - {id: 5238, name: Date Farmer Yara, profession: Farmer, greet: ["Dates from the river palms. Sweeter than the wizards.", "Date?"]}
  - {id: 5239, name: Well Keeper Omid, profession: Laborer, greet: ["Deepest well in the city. Something at the bottom hums.", "Drink?"]}
  # ---- the Crossroads ----
  - {id: 5240, name: Fat Marwan, title: Food Seller, profession: Cook, greet: ["Six roads meet here, and all of them are hungry.", "Kebab?"]}
  - {id: 5241, name: Selima, title: Robe Seller, profession: Tailor, greet: ["Robes for wizards, robes for pilgrims. Same robe, different price.", "Try one on."]}
  - {id: 5242, name: Jamila, title: Necklace Seller, profession: Merchant, greet: ["Every necklace protects against something. Mostly poverty: mine.", "Pretty, no?"]}
  - {id: 5243, name: Bashir, title: Belt Seller, profession: Merchant, greet: ["A good belt holds up more than your trousers.", "Belt?"]}
  - {id: 5244, name: Kadir, title: Boot Seller, profession: Cobbler, greet: ["Six roads. You'll need boots for all of them.", "Boots?"]}
  - {id: 5245, name: Caleb, title: Inventor, profession: Tinker, talks: true, greet: ["Gargoyles took my magnifying glass. Destroy their lair and I'll show you what it magnifies.", "The glass?"]}
  # ---- the Aging Forest and the desert edge ----
  - {id: 5246, name: Thaddeus, title: Fountain Keeper, profession: Mystic, talks: true, greet: ["The Fountain of Youth runs dry without the Jewel of Ages. Thieves took it, and sold it on to who knows whom.", "The Jewel?"]}
  - {id: 5247, name: Cornelius, title: Leprechaun, profession: Scout, house: none, place: "D3, the Aging Forest (A5)", teaches: [{skill: Perception, mastery: master}], greet: ["See that? No? That's why you need me.", "Seen it yet?"]}
  # ---- added in the eleventh session (D-42 Q5: DD-19's talking wizard) ----
  - {id: 5248, name: Blastem, title: Wizard, profession: Spell Master, house: none, place: "DD-19 the wizard quarter, the Guild Common: a talking actor (A8); its click speaks to him (evt.SpeakNPC(5248))", greet: ["How dare you speak to me? You can learn to show respect to your betters on your own, or I can teach it to you."], source: "dark/aaze0031:50-51", note: "Q-D14 (A3's pending_npcs 'Blastem the Wizard': topics The lesson, Boots licked); 'The lesson' sets q-d14.blastem_angered and A8 swaps him for Sorcerer 11191, hostile (Valio's pattern, D-42 Q5)"}
