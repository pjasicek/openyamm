# D1 Castleview Vale: Castleview, the Darkside hub, and the vale (Act III). Owner: A4.
# Format: devdocs/xeen/formats/TOWNS_FORMAT.md; checks: tools/xeen/towns.py.
# Built (A6's L4 project `devdocs/xeen/briefs/d1/L4`): every door as drawn; the arrivals are the sketch's entrance
# points (cell -> world units), Z the installed terrain or floor under them. A3 writes the topics in source/npcs/d1.yml.
#
# Castleview (WORLD_DESIGN 5.2): the hub, every service, the second Adventurer's Inn, 27 houses. The pass at the gate
#   (M14) is the gate's business, not the houses'. The Gremlin Court is DD-04, Ellinger's Tower DD-02, the sewer
#   DD-01 (their people are the dungeon lanes'). The four Drawkcab monks (palindrome names) live in their cells in
#   town; the last lesson is Brother Reger's, in his cell outside the walls (Q-D3). Public Storage is Dyson's house
#   (Q-D4, the chests are map things); the jail holds Jasper (Q-D2).
# The travel pyramid outside the north gate is a map event (A3's Lua), not a house; its arrival is castleview_pyramid.
# Lucio's Jetty (D-5.3): Lucio's celestial boat up to Olympus, two departures a week, once the party are the Chosen
#   Ones (M30, A3's m30.done); house 4901 from the rest block, Castleview's own block being full. The way down is the
#   falls, the Olympus mirror and Town Portal. The Dragon Expert is Librarian Ormond's (D-5.2).
# Darkside mirrors wake with Castle Kalindra's stage 4 (A3's mirror helper); Kalindra's own mirror is in dd03.yml.
key: D1
stem: xeen_d1.odm
town: Castleview Vale
face: darkside
blocks:
  houses: [[4451, 4500], [4901, 4901]]   # 4901 from the rest block (TOWNS_FORMAT section 2)
  npcs: [4901, 5000]

arrivals:
  castleview_square: {at: [-512, 4096, 1160], direction: 512, note: "Castleview's square by the mirror, on the paving (Town Portal; Darkside's start)"}
  castleview_temple: {at: [2560, 2048, 1152], direction: 0, note: "in front of the temple (Darkside's death place)"}
  castleview_stables: {at: [3584, 5120, 1152], direction: 0, note: "Kramer's coach yard"}
  castleview_pyramid: {at: [-1024, 13312, 1248], direction: 1792, note: "beside the travel pyramid outside the north gate (X1's pyramid sets the party down here; A3's Xeen.PyramidArrivals)"}
  kalindra_gate: {at: [-9216, -3072, 1664], direction: 1024, note: "the ramp's top before Castle Kalindra's gate (Town Portal, Kalindra's mirror, the coaches from Kalindra's stables, D-26)"}

