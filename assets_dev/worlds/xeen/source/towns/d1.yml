npcs:
  # ---- service owners ----
  - {id: 4901, name: Hogarth, sex: male, title: Siege Smith, profession: Smith, teaches: [{skill: Spear, mastery: master}], greet: ["Spears for the walls, spears for the gate, spears for whoever pays.", "Need a point?"]}
  - {id: 4902, name: Ingrid Chainmaker, sex: female, title: Mailwright, profession: Armorer, teaches: [{skill: Chain, mastery: master}], greet: ["Ten thousand rings to a shirt. The gremlins steal about a hundred a night.", "Count your rings."]}
  - {id: 4903, name: Philippa, sex: female, title: Lampkeeper, profession: Merchant, greet: ["Wands, scrolls, and Eeried's guidebook. The guidebook is mostly wrong.", "Browsing?"], source: "MAPS D1: Eeried's guidebook on sale"}
  - {id: 4904, name: Zelda, sex: female, title: Herbalist, profession: Alchemist, talks: true, greet: ["I found a glowing orb in a crater. Take it, please. It hums at night.", "Still humming?"]}
  - {id: 4905, name: Dreyfus, sex: male, title: High Priest of Mok, profession: Healer, talks: true, teaches: [{skill: Mace, mastery: master}], greet: ["Heretics hold the Western Tower in Mok's name. Mok would be appalled.", "Mok's blessing."]}
  - {id: 4906, name: Bertha, sex: female, title: Innkeeper, profession: Cook, greet: ["Bread's short. The siege, you know. Ale isn't.", "Another?"]}
  - {id: 4907, name: Crispin Mint, sex: male, title: Banker, profession: Banker, greet: ["Our vault is the only building the gremlins haven't sabotaged. We check daily.", "Deposit?"]}
  - {id: 4908, name: Captain Varga, sex: female, profession: Weapons Master, greet: ["Train here and stand a watch. We train to forty, and the watch trains you the rest.", "On your feet."]}
  - {id: 4909, name: Ignatia, sex: female, title: Fire Guildmistress, profession: Spell Master, teaches: [{skill: Fire Magic, mastery: master}], greet: ["Fire is the one thing the besiegers can't take from us.", "Warm?"]}
  - {id: 4910, name: Aeolus, sex: male, title: Air Guildmaster, profession: Wind Master, greet: ["The wind blows the smoke over the enemy camp. You're welcome.", "Breezy."]}
  - {id: 4911, name: Marisol, sex: female, title: Water Guildmistress, profession: Water Master, teaches: [{skill: Water Magic, mastery: master}], greet: ["We keep the wells clean. Somebody keeps putting frogs in them.", "Thirsty?"]}
  - {id: 4912, name: Grund, sex: male, title: Earth Guildmaster, profession: Spell Master, greet: ["The walls stand because I tell them to.", "Steady."]}
  - {id: 4913, name: Sister Prudence, sex: female, profession: Healer, greet: ["Siege injuries, gremlin bites, and the odd catapult foot.", "Where does it hurt?"]}
  - {id: 4914, name: Kramer, sex: male, title: Caravan Master, profession: Trader, talks: true, greet: ["The ogres burned two of my wagons. I pay well for two of their forts.", "Ready to ride?"]}
  - {id: 4915, name: Old Hamish, sex: male, title: Innkeeper of the Adventurer's Inn, profession: Cook, greet: ["Adventurers come through the pyramid looking lost. I put them up and put them to work.", "Looking for company?"]}
  - {id: 4916, name: Mayor Snarfblad, sex: male, profession: Noble, talks: true, greet: ["Gremlins in the gears, enemies at the gate, and a stranger in my office. What now?", "Any news of the gremlins?"], source: "MAPS D1: the gremlin complaint about Mayor Snarfblad"}
  # ---- Castleview's people ----
  - {id: 4917, name: Warden Krupp, title: Jailer, profession: Guard, greet: ["Visiting hours are whenever I'm asleep.", "Who are you visiting?"]}
  - {id: 4918, name: Jasper, title: Prisoner, profession: Cartographer, talks: true, greet: ["I'm innocent. Joe sold the fake maps; I only drew the real ones.", "Any luck with the door?"]}
  - {id: 4919, name: Jethro, title: Mapmaker, profession: Cartographer, talks: true, greet: ["My brother Jasper rots in jail for Joe's maps. Help me get him out.", "Jasper?"]}
  - {id: 4920, name: Dyson, title: Puzzlemaster, profession: Locksmith, talks: true, teaches: [{skill: Disarm Trap, mastery: master}], greet: ["Public Storage: put things in, take things out, in the right order. The order is the hard part.", "Solved it?"]}
  - {id: 4921, name: Madame Oorla, title: Gypsy, profession: Gypsy, talks: true, greet: ["Show me your orb. Ah. First it must see Ellinger.", "The orb remembers you."]}
  - {id: 4922, name: Nadia, title: Ellinger's Housekeeper, profession: Peasant, talks: true, greet: ["Rats took my onyx necklace into the sewer. Bring it back and I'll give you the tower key.", "My necklace?"]}
  - {id: 4923, name: Brother Otto, profession: Instructor, teaches: [{skill: Dodging, mastery: master}], greet: ["Lesson one, first: backward walk.", "Again it do."]}
  - {id: 4924, name: Sister Hannah, profession: Instructor, teaches: [{skill: Unarmed, mastery: master}], greet: ["Lesson two: fist the not, hand the strike.", "Again it do."]}
  - {id: 4925, name: Brother Bob, profession: Mystic, greet: ["Lesson three: answer the before question the hear.", "Again it do."]}
  - {id: 4926, name: Sister Ada, profession: Mystic, greet: ["Lesson four: Reger see now. Outside walls the.", "Again it do."]}
  - {id: 4927, name: Lyle, title: Pigeon Feeder, profession: Peasant, greet: ["That bench is reserved for me. It says so.", "Seen my pigeons?"], source: "MAPS D1: This bench reserved for Lyle the Pigeon Feeder"}
  - {id: 4928, name: Librarian Ormond, title: Keeper of the Library, profession: Scholar, teaches: [{skill: Dragon, mastery: expert}], greet: ["We sell the Voweless Knights' answers, bound. Young dragons study here too; we keep buckets by the shelves.", "Quietly, please."], note: "D-5.2: the Dragon Expert (place castleview); the library keeps the dragons' first lessons"}
  - {id: 4929, name: Velana, title: Dark Elf Exile, profession: Scout, teaches: [{skill: Dark Elf, mastery: expert}], greet: ["My people walk in shadow. Here, at least, the shadow is honest.", "Mind the light."]}
  - {id: 4930, name: Fletch, title: Fletcher, profession: Hunter, greet: ["Arrows for the walls. They come back, mostly, from the other side.", "Arrows?"]}
  - {id: 4931, name: Gerda, title: Ropemaker, profession: Weaver, greet: ["Rope for the ladders, rope for the catapult, rope for the gremlins if I catch them.", "Rope?"]}
  - {id: 4932, name: Gatewarden Boll, profession: Guard, greet: ["No pass, no gate. Even I need a pass to go home.", "Pass?"]}
  - {id: 4933, name: Miller Dunn, profession: Miller, greet: ["The gremlins burned my mill. I grind by hand now and complain by mouth.", "Flour's dear."]}
  - {id: 4934, name: Mother Pottage, profession: Cook, greet: ["Soup for the hungry. Everybody is hungry. It's a siege.", "Bowl?"]}
  - {id: 4935, name: Wainwright Cole, profession: Carpenter, greet: ["I fix carts by day. The gremlins unfix them by night.", "Broken wheel?"]}
  - {id: 4936, name: Pip Melonby, title: Melon Farmer, profession: Farmer, greet: ["Best melons on the Darkside. Ask the monkeydog.", "Melon?"]}
  - {id: 4937, name: Thatcher Nell, profession: Laborer, greet: ["Fire arrows. Every roof. Every week.", "Roof leaks?"]}
  - {id: 4938, name: Widow Grey, profession: Peasant, greet: ["My husband stood the wall. Now I knit for those who do.", "Socks?"]}
  - {id: 4939, name: Bellringer Toll, profession: Porter, greet: ["One bell for gremlins, two for the enemy, three for supper.", "Hear the bells?"]}
  - {id: 4940, name: Wick Ambers, title: Lamplighter, profession: Porter, greet: ["The sun is weak here. I light the lamps by noon.", "Lamps lit."]}
  - {id: 4941, name: Saddler Rook, profession: Horseman, greet: ["Saddles for Kramer's caravans. When there are horses.", "Saddle?"]}
  - {id: 4942, name: Ditchwater Dan, title: Ditch Digger, profession: Ditch Digger, greet: ["I dig the moat deeper every year. Nobody asked me to stop.", "Mind the ditch."]}
  - {id: 4943, name: Mason Hild, profession: Stone Cutter, greet: ["Every stone of that wall I've laid twice.", "Solid, isn't it?"]}
  - {id: 4944, name: Tilly, title: Pigeon Girl, profession: Child, greet: ["Lyle lets me feed them on Tuesdays!", "Coo!"]}
  # ---- A3's quest people, added in the fourth session (talking actors; portraits in a later batch) ----
  - {id: 4955, name: Gettlewaithe, title: King of the Gremlins, profession: Noble, house: none, place: "DD-04, on the Gremlin Court's throne (A8)", greet: ["I am Gettlewaithe, Imperator Primus of the Gremlins! Give me one good reason why I should not command my mighty army to cut your grotesque human heads from your shoulders and hang your eviscerated corpses above my throne for the entertainment of my subjects!", "Back to petition the king?"], source: "dark/aaze0029:83 (the first greeting, D-26)", note: "Q-D1's three-round court (A3's topics); monster row when he fights is A2's/A8's"}
  - {id: 4956, name: Joe, title: Mapmaker, profession: Duper, house: none, place: "D1, his stall on the road outside Castleview's gate (A6)", greet: ["Treasure maps! Genuine! Passes to Castleview, also genuine! Prices genuinely low!", "Another map? Every one's a winner."], note: "Q-D2 and Q-C24 (A3): sells the fake maps; not X1's Joe (4045)"}
  - {id: 4958, name: Felix, title: Tinker, profession: Tinker, house: none, place: "DD-01, at the end of his tunnel (A8); sells nothing", greet: ["I helped invent the compass! These days I mostly invent tunnels. The gremlins wedged the town sluice open with the mill's gears; shut it and the old culvert drains, rats and all.", "Shut the sluice yet? Mind the rats when it drains."], source: "dark/aaze0030:1 (close: the compass; the tunnels and the sluice are D-26's)", note: "D-26: a flavour talking actor, the sluice hint"}
  - {id: 4957, name: Valio the Simple, title: Peasant, profession: Peasant, house: none, place: "DD-01, in the bed by Felix's tunnel (A8)", greet: ["Hello. I live in the bed. It's a nice bed. The rats don't like it.", "Is the big rat gone?"], note: "Q-D5 (A3); monster 11193 when angered"}
  # ---- the vale ----
  - {id: 4945, name: Linus, title: Ruby Smith, profession: Smith, talks: true, greet: ["Five rubies of the right cut, and gems, and I'll make you something worth the trouble.", "Rubies?"]}
  - {id: 4946, name: Simon, title: Emerald Smith, profession: Smith, talks: true, greet: ["Emerald steel never dulls. Bring me five stones.", "Emeralds?"]}
  - {id: 4947, name: Toby, title: Sapphire Smith, profession: Smith, talks: true, greet: ["Sapphire armour keeps you cool under fire. Literally.", "Sapphires?"]}
  - {id: 4948, name: Hector, title: Diamond Smith, profession: Smith, talks: true, greet: ["Diamonds come only from the north adit in the Forbidden Zone. Few who go there come back.", "Diamonds?"], note: "D-27: the diamond veins are DD-10C's, in Act V on D6"}
  - {id: 4949, name: Vespar, title: Wizard, profession: Spell Master, talks: true, greet: ["My staff lost its emerald handle somewhere in the east. Find it, and I'll get you into Sandcaster.", "The handle?"]}
  - {id: 4950, name: Brother Reger, profession: Mystic, talks: true, greet: ["Lessons the all you took? Word the say then.", "Word the?"]}
  - {id: 4951, name: Justine, title: Thief, profession: Burglar, talks: true, house: none, place: "D1, Justine's camp outside the gate (A6)", greet: ["Castleview pass? I happen to have one. It happens to be expensive.", "Still need a pass?"]}
  - {id: 4952, name: Luna, title: Druid, profession: Mystic, talks: true, house: none, place: "D1, Luna's grove (A6)", greet: ["Thieves stole my golden statuettes: the pegasus, the dragon and the griffin.", "The statuettes?"]}
  - {id: 4953, name: Yog, title: Barbarian Chief, profession: Noble, talks: true, house: none, place: "D1, the Sardaj camp (A6)", greet: ["You smell of town. Talk fast or fight faster.", "Talk or fight?"]}
  - {id: 4954, name: Ellinger, title: Wizard, profession: Spell Master, talks: true, house: none, place: "DD-02, the top of Ellinger's Tower (A8)", greet: ["You passed my tests. Alamar moved Castle Kalindra out of phase; twenty Energy Disks bring it back.", "The disks?"]}
