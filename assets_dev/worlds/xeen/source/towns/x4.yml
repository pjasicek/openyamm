# X4 Burlock Savannah: Castle Burlock's walled village, Asp and the savannah (Act II). Owner: A4.
# Format: devdocs/xeen/formats/TOWNS_FORMAT.md; checks: tools/xeen/towns.py.
# Built (A5, installed 2026-11-20): the doors are the ones the L4 sketch draws (briefs/x4/L4/sketch.yml); NPC topics in
# source/npcs/x4.yml (A3).
#
# Castle Burlock's village (WORLD_DESIGN 5.1): the royal seat's services stand in the walled village outside the
#   castle (XD-07, xd07.yml) and need no Crusaders title; only the castle's throne room does. Training to 40 (x25).
# Asp (cursed, QUESTS Q-C5): every house opens once q-c5.done is set (the door shows its closed text before), except
#   the Travel Pit stables and the roadside temple at the town's edge and Sarah Slither's house, open from day one
#   (WORLD_DESIGN 5.1, reviews/SCALE_AND_DENSITY 9). Adam and Eve, the quest givers, stand by the well.
key: X4
stem: xeen_x4.odm
town: Burlock Savannah
face: cloudside
blocks:
  houses: [4151, 4200]
  npcs: [4301, 4400]

# Coordinates come with the built map (A5); the names are fixed now (other towns' routes and Town Portal use them).
