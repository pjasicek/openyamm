# Street villagers of every Xeen settlement (decision D-96; the user's F20, 2026-11-22: "no villagers in the village?
# ... do we want all the villagers the same type in all the cities? ... diversity"). Owner: A4.
# Tool and check: tools/xeen/villagers.py (towns.py --strict runs the check). Spots: villagers_spots.yml (generated by
# `villagers.py --place <map>` from the built map). Each map's generator adds `villagers.sketch_actors(<map>)` and
# `villagers.relations(<map>)`; no villager is placed by hand.
#
# Measured on MM6-MM8 (output/xeen_villagers/data/ref.txt; placed peaceful townsfolk within 1,536 of a town's house
# doors, per door): New Sorpigal 0.88, Free Haven 0.62, Silver Cove 0.47, Castle Ironfist 0.89; Harmondale 0.96,
# Tatalia 0.6-1.0, Steadwick 0.52, Pierpont 0.77, Emerald Isle 1.18, Deyja 0.4-0.56; Ravenshore 0.62, Alvar 0.35,
# Shadowspire 0.42, Dagger Wound 1.19. Median about 0.7; hamlets of 2-6 doors 1-2 each. MM8 gives each town its own
# people (Ravenshore and Alvar dark elves, Shadowspire vampire folk, Dagger Wound lizardmen, Balthazar's minotaurs);
# MM7 mixes 3-6 human or elf kinds (Pierpont elves, Deyja goblins); MM6 3-4 (peasants, merchants, nobles).
#
# Race is a hard rule (the user, 2026-11-22: "make sure we dont use villagers race which doesnt fit the city/village"):
# each settlement lists the races that live there (`races`, from WORLD_DESIGN 5, its named NPCs' portraits
# (level_generation/ui/xeen_npc_portraits_20261120/descriptions.yml) and the MM4/MM5 town) and every palette entry
# names its `race`; villagers.py derives each row's race from its picture and fails a race the settlement does not
# allow. Diversity comes from clothing, trade and age within the fitting races. Xeen's towns are human but for the
# treehouse village (sprites), Bosco's Hall (dwarves) and the Necropolis (the undead and the living with passes).
#
# A settlement:
#   name        its name (the town files' `town:` unless `town:` names it)
#   map         the map key; houses: the town file's houses of that town
#   races       the races living there (human, dwarf, elf, sprite, vampire ...) and `source`: where that comes from
#   palette     {row, race} monster rows (3-5 kinds: a kind is a picture family, tiers of one family are one kind);
#               kinds take turns
#   count       villagers placed (about 0.7 per house door; hamlets 2 per door); the check's floor is 0.45 per door
#               (at least 3) for 8 doors or more, 2 below
#   group       the monster group (one per settlement, unused on the map; made peaceful on entry)
#   neighbours  settlements that may share at most one kind with this one
#   placed_by   an indoor map whose lane places them (a warning until then)
#   exempt      not a settlement with streets (why)
#   also_at     extra footprint points [x, y] in cells; reach: footprint radius (default 1,536)
#   avoid       [{at: [x, y], radius: units}] places the spots keep clear of (a puzzle, a fight)
settlements:
  # ---------------------------------------------------------------- Cloudside
  - name: Vertigo
    map: X1
    races: [human]
    source: "WORLD_DESIGN 5.1 a human river town; 50 named NPCs, all human; MM4 Vertigo"
    # MM7's Harmondale humans (as built), the start town's
    palette: [{row: 371, race: human}, {row: 368, race: human}, {row: 354, race: human}, {row: 350, race: human}]
    count: 23
    group: 47
    neighbours: [Rivercity, Nightshadow, Castle Burlock]
  - name: Rivercity
    map: X2
    races: [human]
    source: "WORLD_DESIGN 5.1 the human hub; 57 named NPCs human (one elf guest, one ghost); MM4 Rivercity"
    # the river trade city: MM6's Free Haven peasants and merchants (the sorceresses are placed apart)
    palette: [{row: 607, race: human}, {row: 595, race: human}, {row: 598, race: human}, {row: 577, race: human},
              {row: 608, race: human}, {row: 596, race: human}]
    count: 30
    group: 47
    neighbours: [Vertigo, Nightshadow, Castle Burlock, Asp]
  - name: Nightshadow
