  - {id: 4303, door: "building:x6_houses#1", town: Sphinx Wells, kind: residence, name: The Well Keeper's House, residents: [4606]}
  - {id: 4304, door: "building:x6_houses#2", town: Sphinx Wells, kind: residence, name: The Saddle Loft, residents: [4607]}
