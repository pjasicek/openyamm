npcs:
  - {id: 4601, name: The Summer Druid, profession: Mystic, house: none, place: "X6, the Summer Druid's grove (A5)", greet: ["The sun is kind here, and nowhere else on Xeen.", "The flower?"]}
  - {id: 4602, name: Saul, title: Hermit, profession: Mystic, house: none, place: "X6, his hermitage by the urn (A5)", teaches: [{skill: Meditation, mastery: master}], greet: ["Sit by the urn. Breathe. The sand will wait.", "Still breathing?"]}
  - {id: 4603, name: Hadda, title: Keeper of the Last Waterskin, profession: Cook, greet: ["Water's free. The cup costs a gold. The shade costs two.", "Thirsty again?"]}
  - {id: 4604, name: Oskar, title: Caravan Master, profession: Trader, greet: ["Camels to Asp, wagons to Rivercity. The sand comes along for free.", "Riding?"]}
  - {id: 4605, name: Gorm, title: Coachman of the Warzone, profession: Horseman, greet: ["One coach a week to Rivercity. One to Castleview, if you hold the sigil. Same seats, fewer passengers.", "Still in one piece? Climb in."], gate_line: "The sand's no place for you yet. Arena or home.", note: "D-8: gate_line is what Gorm says at the barred desert gate before x6.warzone_gate is set (A3's gate event)"}
  - {id: 4606, name: Old Ibb, title: Well Keeper, profession: Laborer, greet: ["The well is deeper than the Sphinx is tall. I've measured both.", "Water?"]}
  - {id: 4607, name: Tansy, title: Saddler, profession: Tailor, greet: ["Saddles for camels. The camels have opinions about saddles.", "Mind the camel. He bites."]}
  # ---- added in the fourth session for A3 (a talking actor; portrait batch 6) ----
  - {id: 4608, name: Arie, title: Apprentice, profession: Apprentice, house: none, place: "X6, Arie's camp below Castle Basenji (A5)", greet: ["The wizards of Castle Basenji killed my master. His scroll is still in there.", "Did you find the scroll?"], note: "Q-C8, Q-C9's 'Its name is Golux' (A3)"}
  # ---- added in the tenth session for A7's XD-20 (D-39 XD-20 Q3; a voice behind the booth windows; portrait batch 11) ----
  - id: 4609
    name: Varro
    title: Arena Master
    house: none
    place: "XD-20 The Warzone (on X6's coach yard): no actor; the lodge's booth window and the war floor's booth window both call evt.SpeakNPC(4609) (A7)"
    engine_topics: [704]
    greet: ["You look like tough fighters. Would you like to participate in the War Games? The odds can be high but the thrill of victory is well worth the risk.", "If you didn't come to fight, you have no business being here! Pick your battle, or come back when you have the mettle to do battle for glory!"]
    source: "xeen/aaze0085:0 (first greeting); xeen/aaze0085:1 adapted (later greetings, the decline line)"
    note: "D-39 XD-20 Q3: the engine's arena topic 704 (Page, Squire, Knight, Lord; the reward when all are dead); the source's master is unnamed"
