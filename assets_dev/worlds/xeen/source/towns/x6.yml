# X6 Desert of the Sphinx (Act IV, a wilderness map; MAPS X6, WORLD_DESIGN 3.3 and 5.1). Owner: A4.
# Format: devdocs/xeen/formats/TOWNS_FORMAT.md; checks: tools/xeen/towns.py.
# Built (A5's L4 project `devdocs/xeen/briefs/x6/L4`, installed 2026-11-20 19:40): every door as drawn (its DOORS.md);
# the arrivals are A5's points, Z the installed terrain.
# Sphinx Wells, the hamlet (WORLD_DESIGN 5.1 "Hamlets"; MAPS X6 "a caravan stop (tavern, stables)"): a caravan stop at
#   the desert's wells with a tavern, the caravan yard and two houses. Its caravans run to Asp's Travel Pit and to
#   Rivercity (routes 427, 428); Asp's Travel Pit runs one back (431, x4.yml).
# The Warzone coach (WORLD_DESIGN 3.3, the arena XD-20, A7): Rivercity's stables (406) and Castleview's (415) send a
#   coach once a week to the yard by the Warzone's gate (arrival warzone_coach); its coachman takes the party back,
#   once a week to each (429, 430). The coach to Castleview, a way between the faces, waits for the Pyramid Sigil
#   (m7.sigil) like the pyramids (D-8). The coach yard is a walled pocket holding only the arena gate (XD-20) and Gorm's
#   coach house; its desert gate is barred from inside until opened from the desert side (A3's x6.warzone_gate, qbit
#   116100), so a party that comes by coach leaves by the arena or by coach.
# The Summer Druid and Saul (Q-C1, Saul's Meditation Master) stand outdoors.
key: X6
stem: xeen_x6.odm
town: Desert of the Sphinx
face: cloudside
blocks:
  houses: [4301, 4350]
  npcs: [4601, 4700]

arrivals:
  sphinx_wells: {at: [-512, 1536, 1248], direction: 1024, note: "Sphinx Wells' street before the caravans' shed (the hamlet's stables; Asp's and Rivercity's caravans set down here)"}
  warzone_coach: {at: [11264, -16384, 1504], direction: 1024, note: "inside the coach yard by the Warzone's gate (D-8): a walled pocket with only the arena gate (XD-20) and Gorm's coach house (4305); its desert gate is barred from inside until opened from the desert side (x6.warzone_gate, 116100, A3); no spawns inside, the coach lands parties of any level here (A5)"}

