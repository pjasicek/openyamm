  pyramid_door:
    map: D7
    entrance: DD-15
    sealed: "the sky is Act VI's map, sealed by the story"
    where: "the Great Pyramid's sky door at the Pyramid's Door (D-58 Q2): its click calls this first; true asks the question and goes on to DD-15's entrance:d7_sky (both ways after m30.done), false has shown the refusal (DD-15's side says the same, sky_door_dd15)"
    question: "Enter the Pyramid?"
    requires: {qbit: m30.done}
    reads: [m30.done]
    fail_text: "Access Denied!"     # dark/aaze0086:5 (D-61), as the door's DD-15 side

  # The trapdoors up (D-58 D-4): each tower's way up to D7 calls its hook first; true goes on to the `exit` preset (its
  # question is this hook's), false has shown the line. They open after m30.done, when the party are the Chosen Ones.
  roof_dd02:
    map: DD-02
    gate: shortcut
    where: "Ellinger's Tower's trapdoor on the top floor, up to D7's entrance:dd02_roof (A8)"
    question: "Climb up through the trapdoor?"
    requires: {qbit: m30.done}
