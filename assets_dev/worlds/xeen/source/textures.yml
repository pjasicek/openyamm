# Xeen: every new texture of the world (ROADMAP §5.2). Owner: A6 (art direction). A lane that needs a new texture
# looks here first and reuses one; a texture it makes is added here (send A6 the entry) before its map is reported.
#
# Budget (the user's hard rule): shipped MM6-MM8 textures first; at most 30 new per kit; new per map at most
# S 4, M 8, L 14, ODM 12 beyond its kit; the world's new textures at most 450 in all. Every name below counts.
#
# Fields:
#   name     the face texture name (lowercase, at most 10 characters, unique against every shipped name)
#   family   the kit (kits below) or the map it belongs to, and the shipped family it is painted to match
#   area     what it shows / where it goes
#   maps     map keys that use it (source/maps.yml keys)
#   size     logical texels; the x4 master is 4x
#   kind     tile, picture, sign, edit (painted into a shipped master), cutout, derived (cut from another entry)
#   maker    how and when it was made; the project folder holds specs, prompts, raw returns and checks
#   source   the finished x4 master
#   installed  where its cooked files are: `world` (assets_dev/worlds/xeen/textures_x4 and textures_x2), or a
#            scratch root
#   reuse    (optional) where else the texture fits: a lane picks these before it makes a new one
#
# Sources (xeen-o, 2026-11-20): every entry's finished x4 master is also copied unchanged to
# assets_source/worlds/xeen/textures_x4/<name>.png (locally excluded from git, as the models), where
# tools/lighting/stale_bakes.py finds it. A6 copies each new texture there when it registers it.
#
# Grandfathered (decision D-3.4, 2026-11-20): the Act I dungeons' textures made on 2026-11-13 stay as they stand,
# over the per-map caps (XD-01 11, 12 with the slogan; XD-02 15; XD-03 12; XD-05 11; XD-04 13, added by D-22.1, 45 of
# 45 distinct on XD-04, the world total unchanged), charged to the world's 450 and not a precedent. They are the
# world's to reuse; reuse first: XD-03's six gong cuts (xngong1-xngong6: any bronze plate, door or panel), XD-02's
# Deep Line iron (xnrustirn: rails, chains, cages, iron fittings in any mine or dungeon), and XD-04's xwiron (iron
# plates), xwcage (any bars or cages), xwbrew (brews and troughs), xwsky and xwcloudst (sky openings).

kits:
  cloudside_town: {title: "Cloudside half-timber town", families: level_generation/xeen_art/kits/cloudside_town.yml}
  royal_castle: {title: "Royal castle, white stone", families: level_generation/xeen_art/kits/royal_castle.yml}
  towers: {title: "Witch and wizard towers, dark timber and slate", families: level_generation/xeen_art/kits/towers.yml}
  darkside_town: {title: "Darkside low slate-stone town", families: level_generation/xeen_art/kits/darkside_town.yml}
