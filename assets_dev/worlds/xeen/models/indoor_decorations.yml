# The Xeen world's indoor (BLV) decoration models (extends engine/models/indoor_decorations.yml; see its header). Lane S.
# Rows in worlds/xeen/models/decoration_data.txt (4001-4999), sprites (the engine's `pending` texture, never drawn) in
# worlds/xeen/rendering/sprite_frame_data_world_decorations.yml (27001-27999).
decorations:
  # DD-05's Golden Pegasus on the alcove ledge (A8): the Golden Pegasus Statuette's ground model (item 12349,
  # worlds/xeen/world_items/items.yml), 34 x 29 x 43.4, origin at its base centre. Collision radius 20.
  - name: xeen_pegasus
    model: worlds/xeen/world_items/models/item_xeen_12349.glb
    height: 43.4
  # Q-D27's genie lamps in dungeons: as worlds/xeen/models/decorations.yml's xeen_genielamp (1.5x MM7's Genie Lamp).
  - name: xeen_genielamp
    model: engine/world_items/models/item_7item260.glb
    height: 23
    yaw: facing
  # P5 shrine (lane S, xeen-s7-p5, D-56; level_generation/decorations/xeen_p5hands_claude, xeen_p5props_claude):
  # the right stone hand, palm up, thumb to its -x (the WEST hand at facing 270), 448 tall from its plinth's
  # base centre, plinth radius 124, palm centre over the origin at 390. yaw_offset: facing = the front's direction.
  - name: xeen_stonehand
    model: worlds/xeen/models/xeen_deco_stonehand_r.glb
    height: 448
    yaw: facing
    yaw_offset: -1.570796327
  # The left stone hand: the right one mirrored (the EAST hand at facing 270).
  - name: xeen_stonehand_l
    model: worlds/xeen/models/xeen_deco_stonehand_l.glb
    height: 448
    yaw: facing
    yaw_offset: -1.570796327
  # The Cube of Power in the west hand: the ground item model (39.6) at 84 (2.12x), raised 394 onto the palm
  # (z_offset); place it at the hand's own xy and floor, facing 0. Hidden until state:wedding (A5).
  - name: xeen_cube
    model: worlds/xeen/world_items/models/item_xeen_12365.glb
    height: 84
    yaw: facing
    z_offset: 394
  # Xeen's Scepter in the east hand: the ground item model (48.6 long, 6.04 high) at 3.6x (175 long), lying
  # across the palm (east-west at facing 0), raised 398 (z_offset). Hidden until state:wedding (A5).
  - name: xeen_scepter
    model: worlds/xeen/world_items/models/item_xeen_12366.glb
    height: 21.7
    yaw: facing
    yaw_offset: -1.570796327
    z_offset: 398
  # The wedding cake on MM9's round table, one model: table 165 across and 92 high, a three-tier cake 69 high
  # on it. Origin at the table's foot centre. Hidden until state:wedding (A5).
  - name: xeen_cake
    model: worlds/xeen/models/xeen_deco_cake.glb
    height: 161.6
    yaw: facing
    yaw_offset: -1.570796327
  # The Rest Stop bench: MM9's Bench01 (a backless plank bench), 92 x 50, 56 high; its long side is its front.
  - name: xeen_bench
    model: worlds/xeen/models/xeen_deco_bench.glb
    height: 56
    yaw: facing
    yaw_offset: -1.570796327
  # The elemental planes' ways up (D-58 C5/C7; lane S session 8, level_generation/decorations/xeen_wayup_claude):
  # additive shells scrolling upward, no collision (radius 0), origin at the column's foot centre on the floor.
