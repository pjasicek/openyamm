# Xeen world actor models (lane S, devdocs/xeen/lanes/S.md). Owner: S. Bindings apply to the Xeen descriptors only.
# Until a family's own model or Xeen colour tiers exist, its rows bind the stand-in model that A2 named in
# source/monsters.yml (`stand_in`), generated by tools/xeen/standin_bindings.py (2026-11-20; raw fragment kept in
# level_generation/creatures/xeen_tiers_claude/standin_fragment_20261120.yml). S replaces a family's entries when its
# model or tiers are installed.
# Exceptions to the generated fragment:
# - Xeen Orc Warband B (Orc Shaman) casts Ice Bolt; MM7's goblin (mm7_m246) has no cast clip, so it binds the MM6
#   goblin shaman model as xeen_gob2.glb skin xgob_e (orc-brown skin), own scale.
# - 3 entries (Xeen Mummy A/B/C) copy MM9 bindings that MM9 times by clip (attack_timing: clip, gait: intent): this file keeps sprite
#   timing, so their attacks follow the stand-in sprite's timing here.
# - Xeen Toad A/B/C: the new toad (xeen_toad.glb, skins toad_a/b/c), 2026-11-20.
# - Xeen Swarm B/C: the new swarm (xeen_swarm.glb, skins swarm_b/c), 2026-11-20.
# - Xeen Swarm A: the Doom Bug cricket (xeen_doombug.glb, skin bug_a), 2026-11-20.
# - Goblins and Gremlins: xeen_gob2.glb (MM6 goblin + Xeen tiers xgob_a teal goblin, xgob_b purple gremlin, xgob_c deep violet, xgob_d magenta), 2026-11-20.
# - Xeen Sprite A/B/C and Sharla: the new sprite (xeen_sprite.glb, skins sprite_a/b/c; Sharla sprite_c), 2026-11-20.
# - Xeen Witch A/B/C and Head Witch: the new witch (xeen_witch.glb + xeen_witch_staff.glb, skins witch_a/b/c; Head Witch witch_c), 2026-11-20. The Coven keeps its stand-in until its tiers exist.
# - Orcs and the orc warband (A, C, bosses): xeen_m246.glb (MM7 goblin + Xeen tiers xorc_a-e; since D-10 tan skin), 2026-11-20.
# - Mad dwarves: xeen_dwa1.glb (xdwa_a-c), 2026-11-20.
# - Ogres: xeen_ogr.glb (xogr_a-c; horns, and since D-10 armour plates and cloth), 2026-11-20.
# - Outlaws: xeen_thf.glb (xthf_a-c), 2026-11-20.
