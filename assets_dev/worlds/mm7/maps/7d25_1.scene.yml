# Celeste's sky faces (7plansky1, IndoorSky) open to the Enhanced sky instead of the projected sky box, whose face seams
# and ambient occlusion showed the box's edges (OY-339; devdocs/INDOOR_OPEN_SKY.md). The above_clouds preset continues
# the sky below the horizon, where the gaps beside the walkways look down (the clear preset filled them with flat fog).
format_version: 1
kind: "indoor_scene_overlay"
source:
  geometry_file: "7d25.blv"
sky: {mode: open, sky_texture: 7plansky1, preset: above_clouds}
