# Lever 35 also clears the lava wall face 2255 (vlcwl3a, x 1024-1152, y 4608), which door 53 lists but cannot move
# (the door has no vertices); a fix MAW carries (devdocs/maw/MAPS_CONTENT.md §3.1). The map gives the face no cog
# number, so it gets an unused one here for evt.SetFacetBit (../events/maps/6d18_mmmerge.lua).
# The lava floors (orfyrlga) were scripted: stepping on them set a map variable (event 51) that a one-minute timer
# (event 54) read to deal 25 magic damage.
# They are now native lava, as in MM8: the overrides below add the Lava flag (0x40000000) and drop the step
# trigger (0x04000000), so the floors burn every second like any lava and Levitate protects. The event stays
# bound; a save that already holds this map keeps its saved face flags, and so the scripted lava, until the map
# resets.
