# MM6 Demon Queen (qfi): Meshy queen (head-only graft) on a local hybrid rig (source-frame upper body on a six-bone
# abdomen) and the Meshy rock alcove on its own Rock bone, one actor (level_generation/creatures/mm6_qfi_claude).
# 393 native units / 2.4 m model. The rock stands against the end wall of her Hive room, so the model keeps a fixed
# facing (east, as placed) and her spine, neck and head turn toward the party instead. Death: the rock collapses
# while she sinks into it (native qdea0-qdef0).
- descriptor: zDemonQueen
  model: worlds/mm6/models/mm6_qfi.glb
  scale: 163.75
  yaw_offset: -1.570796327
  fixed_yaw_degrees: 0
  animation:
    cast: Cast
    run: Standing
    stride_length: 1
    run_stride_length: 1
    upper_body_root: B_Spine
    look:
      nodes: [B_Spine1, B_Spine2, B_Neck, B_Head]
      max_yaw_degrees: 60
      max_pitch_degrees: 30
    # one-handed caster: only the casting palm is bound (the charge glows at the bound palms' midpoint)
    sockets:
      palm_right: Socket_Palm_R
    # The claw blow lands at 1.05 s of the Attack (source peak after a 0.25 s ease from Standing); Incinerate leaves
    # the right palm at 1.02 s of the Cast.
    events:
      attack_melee: {impact: 1.164}
      cast: {impact: 1.203, glow: [palm_right]}
      attack_ranged:
        impact: 1.164
        glow: [palm_right]
        effects:
          Fire: openyamm:fx/creature_fire_hand
  clips:
    standing: Standing
    walking: Standing
    attack_melee: Attack
    attack_ranged: Attack
    hit: Hit
    dying: Death
    dead: Dead
    fidget: Standing
