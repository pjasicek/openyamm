# MM6 Apprentice/Journeyman/Mage (pmn2), Meshy Smart Topology + Meshy rig, staff in the right fist; the spell's
# element-coloured charge glow forms at the staff head (the events' glow), where bolts and spells leave.
# Skins pmn2_a/b/c share one texture set; red/green/blue cloth comes from the material tint and mask.
