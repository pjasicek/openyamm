# Shared geometry/rig/LODs; skin is resolved once when an actor is created.
actors:
- descriptor: Demon A
  model: worlds/mm6/models/mm6_demon.glb
  death_effect:
    # Engine burn from the moment of death (user: gone in about a second, then 25 % slower): the arms fling out over
    # 0.31 s while the body burns inward from the hands, feet, head and tail tip in the variant's colour
    # (green: grey skin, green harness).
    # A NoCorpse actor that leaves the game first keeps its model until the fire is out (burningRemains).
    type: burn
    start: 0.0
    end: 0.9375
    char_width: 0.16
    edge_width: 0.035
    fire_width: 0.3
    color: [0.3, 1.0, 0.35]
    brightness: 2.4
    flames_per_second: 220
    flame_size: 22
    flame_color: [90, 255, 110]
    light: {color: [110, 255, 120], radius: 450}
  scale: 104.8623316
  yaw_offset: -1.570796327
  animation:
    cast: Cast_FireBolt
    run: Jog
    stride_length: 1.466
    run_stride_length: 2.7038
    sprint: Sprint
    sprint_stride_length: 3.7585
    upper_body_root: mixamorig:Spine
    # The neck and head share a turn toward the party over every clip but the death.
    look:
      nodes: [mixamorig:Neck, mixamorig:Head]
      max_yaw_degrees: 60
      max_pitch_degrees: 35
    sockets:
      eye_left: Socket_Eye_Left
      eye_right: Socket_Eye_Right
      palm_left: Socket_Palm_Left
      palm_right: Socket_Palm_Right
    eye_color:
    - 231
    - 156
    - 156
    # The authored cast thrusts the hands apart at 0.92 s of its 1.0 s: the game releases the spell there; the
    # thrust finishes during the recovery.
    events:
      attack_melee: {impact: 0.5}
      attack_ranged:
        impact: 0.5
        glow: [palm_right]
        effects:
          Fire: openyamm:fx/creature_fire_hand
      cast: {impact: 0.87, glow: [palm_left, palm_right]}
  clips:
    standing: Standing
    walking: Walk2
    attack_melee: Attack
    attack_ranged: Attack
    hit: Hit
    dying: Death
    dead: Dead
    fidget: Fidget
  skin: demon_a
