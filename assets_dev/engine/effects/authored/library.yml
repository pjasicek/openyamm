- id: openyamm:fx/shadow_ward
  display_name: Shadow Ward Sparks
  # Sparks drifting inward over an actor behaviour ward (engine/behaviors/bosses/necro_mage.lua) at a 400-unit radius
  # around the actor's centre; the shell itself is the ward's shield dome (ShieldDomeRenderer). Respawned about every
  # 0.8 s while the ward holds; spawn scale also scales the radius (scale = ward radius / 400).
  duration_seconds: 1.2
  compatibility_profile: predictable
  components:
  - id: 1
    type: sprite_system
    start_seconds: 0
    end_seconds: 0.8
    sprite_resource: openyamm:effect-sprite/spark
    blend: additive
    color_keys:
    - time: 0
      rgb: [225, 165, 255]
      transparency: 190
    - time: 0.25
      rgb: [200, 120, 255]
      transparency: 70
    - time: 1
      rgb: [90, 25, 160]
      transparency: 255
    scale_keys:
    - time: 0
      value: 0.3
    - time: 1
      value: 0.06
    motion_keys: []
    particle_lifetime_seconds: 0.7
    emission_shape: sphere
    radius: 400
    velocity: -25
    plane_direction: [0, 0, 1]
    sprites_per_emission: 5
    emission_interval_seconds: 0.05
    wind_direction: [0, 0, 0]
    wind_amount: 1
