  # trail of violet sparks, like creature_fire_hand, using the CC0 showcase sprites.
  duration_seconds: 30
  compatibility_profile: predictable
  components:
  - id: 1
    type: sprite
    start_seconds: 0
    end_seconds: 30
    sprite_resource: openyamm:effect-sprite/arcane
    blend: additive
    scale_keys:
