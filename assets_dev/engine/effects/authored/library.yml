- id: openyamm:fx/energy_beam
  display_name: Energy beam
  # A beam (scripted: evt.Beam / evt.BeamToParty): a steady energy line from the effect to its beam target, until it is
  # stopped or its time runs out.
  duration_seconds: 600
  compatibility_profile: predictable
  components:
  - id: 1
    type: ribbon
    start_seconds: 0
    end_seconds: 600
    sprite_resource: openyamm:effect-sprite/trail_noise
    blend: additive
    beam: true
    lifetime_seconds: 1
    width: 14
    sample_distance: 32
    texture_length: 160
    scroll_speed: 3
    fill: 0.6
    core: 0.8
    width_keys:
    - {time: 0, value: 1}
    color_keys:
    - {time: 0, rgb: [255, 120, 200], transparency: 40}
- id: openyamm:fx/arc_beam
  display_name: Arc beam
  # A beam of crackling lightning (scripted: evt.Beam): an arc from the effect to its beam target.
  duration_seconds: 600
  compatibility_profile: predictable
  components:
  - id: 1
    type: ribbon
    start_seconds: 0
    end_seconds: 600
    sprite_resource: openyamm:effect-sprite/trail_electric
    blend: additive
    beam: true
    lifetime_seconds: 1
    width: 24
    sample_distance: 24
    texture_length: 90
    scroll_speed: 6
    fill: 0
    jitter: 9
    jitter_rate: 24
    width_keys:
    - {time: 0, value: 1}
    color_keys:
    - {time: 0, rgb: [200, 225, 255], transparency: 20}
# Destructibles (devdocs/INDOOR_DESTRUCTIBLES.md): a wall, window or prop breaking, at its centre, sized for a piece
# about 200 units across (the scene's effect_scale fits it). Stone: a settling dust cloud and falling rubble.
- id: openyamm:fx/destructible/stone
  display_name: Destructible breaking (stone)
  duration_seconds: 3
  compatibility_profile: predictable
  components:
  - id: 1
    type: sprite_system
    start_seconds: 0.0
    end_seconds: 0.03
    sprite_resource: openyamm:effect-sprite/dust_cloud
    particle_space: world
    blend: alpha
    random_roll: true
    spin_speed: 0.3
    sprites_per_emission: 14
    emission_interval_seconds: 1.0
    particle_lifetime_seconds: 2.8
    emission_shape: sphere
    radius: 60
    velocity: 40
    wind_direction: [0, 0, -1]
    wind_amount: 12
    scale_keys:
    - {time: 0.0, value: 0.3}
    - {time: 1.0, value: 0.75}
    color_keys:
    - {time: 0, rgb: [150, 132, 110], transparency: 40}
    - {time: 0.5, rgb: [140, 125, 105], transparency: 140}
    - {time: 1, rgb: [130, 118, 100], transparency: 255}
    motion_keys: []
  - id: 2
    type: sprite_system
    start_seconds: 0.0
    end_seconds: 0.03
    sprite_resource: openyamm:effect-sprite/debris
    particle_space: world
    blend: alpha
    random_roll: true
    spin_speed: 5
    sprites_per_emission: 14
    emission_interval_seconds: 1.0
    particle_lifetime_seconds: 1.6
    emission_shape: sphere
    radius: 60
    velocity: 130
    wind_direction: [0, 0, -1]
    wind_amount: 420
    scale_keys:
    - {time: 0.0, value: 0.85}
    - {time: 1.0, value: 0.7}
    color_keys:
    - {time: 0, rgb: [150, 138, 120], transparency: 0}
    - {time: 0.8, rgb: [150, 138, 120], transparency: 40}
    - {time: 1, rgb: [150, 138, 120], transparency: 255}
    motion_keys: []
