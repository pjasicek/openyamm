    motion_keys: []
  - id: 2
    type: sprite_system
    start_seconds: 0
    end_seconds: 30
    sprite_resource: openyamm:effect-sprite/spark
    particle_space: world
    blend: additive
    sprites_per_emission: 2
    emission_interval_seconds: 0.03
    particle_lifetime_seconds: 0.35
    emission_shape: sphere
    radius: 4
    velocity: 14
