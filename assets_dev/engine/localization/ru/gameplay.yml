  'Potions that clash explode, and without Alchemy skill so does any real recipe.': 'Несовместимые зелья взрываются. Без навыка алхимии смешивание зелий также приводит к взрыву.'
  'Potions that clash explode, and so does a recipe beyond {mastery} Alchemy.': 'Несовместимые зелья взрываются, как и смеси выше ступени алхимии «{mastery}».'
  'Needs {mastery} Alchemy. Safe for {name}.': 'Требуется алхимия: {mastery}. {name} может безопасно смешать.'
