  'Needs {required} Alchemy; {name} has {mastery}.': 'Требуется алхимия: {required}; у персонажа {name}: {mastery}.'
  'This mixture blew up before, and {name} would fail it again.': 'Эта смесь уже взрывалась, и {name} снова не сможет её приготовить.'
