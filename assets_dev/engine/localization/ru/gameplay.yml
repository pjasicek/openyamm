  'Brewed {potion} (power {power}, {steps} steps)': 'Сварено: {potion} (сила {power}, шагов: {steps})'
  'Usually I try to buy something like this {item} for {listed} gold. I''ll give you {price} for it.': 'Обычно я стараюсь купить такой предмет, как «{item}», за {listed} золота. Вам я дам за него {price}.'
  'Normally, I do my best to buy a {item} for {listed} gold. But I can see you know it''s worth {price}. Agreed?': 'Обычно я стараюсь купить предмет «{item}» за {listed} золота. Но я вижу, что вы знаете его цену — {price}. Согласны?'
  'Hmph. Looks like junk to me. <yawn> I suppose I could give you oh, say, {price} gold pieces for it.': 'Хм. По-моему, это просто хлам. <зевок> Думаю, я мог бы дать вам за это, скажем, {price} золота.'
  'Sorry, I''m not interested in that item.': 'Извините, этот товар меня не интересует.'
  'An excellent choice! This {item} is of the finest quality. I am willing to virtually give it away for {price} gold.': 'Отличный выбор! Предмет «{item}» отличается высочайшим качеством. Я готов практически отдать его за {price} золота.'
  'I try to sell things like this {item} for {listed} gold. But we both know it''s really worth {price}. So that''s my price.': 'Я стараюсь продать такой предмет, как «{item}», за {listed} золота. Но мы оба знаем, что он стоит {price}. Такова моя цена.'
  'Ordinarily I sell things like this {item} for {listed} gold. But you drive a hard bargain-- I''ll sell it to you for {price}.': 'Обычно я продаю такой предмет, как «{item}», за {listed} золота. Но вы умеете торговаться — я продам его вам за {price}.'
  'Sorry, I can''t identify a {item} because I''m a {profession}. I don''t know anything about those.': 'Извините, я не могу опознать предмет «{item}», потому что я {profession}. Я ничего не знаю о таких вещах.'
  'I''ll tell you what it is for {price} gold pieces.': 'Я опознаю этот предмет за {price} золота.'
  'Sorry, I have no idea how to fix a {item}.': 'Извините, я понятия не имею, как починить предмет «{item}».'
  'This {item} is nearly beyond repair. It will take a superhuman effort to fix it! I''ll have to charge {price} gold.': 'Предмет «{item}» практически не подлежит ремонту. Чтобы его починить, потребуются сверхчеловеческие усилия! Мне придётся взять за это {price} золота.'
  'Hmmm. Nothing a little glue and polish won''t fix, I warrant. My policy is to ask for {listed} gold, but I can go as low as {price}.': 'Хм. Уверяю вас, это легко исправить с помощью клея и полировки. Обычно я прошу {listed} золота, но могу уступить до {price}.'
  'This {item} is in bad shape, but it can be fixed. I usually want {listed} gold, but for you I will charge a mere {price}.': 'Предмет «{item}» в плохом состоянии, но его можно починить. Обычно я прошу за это {listed} золота, но с вас возьму всего лишь {price}.'
