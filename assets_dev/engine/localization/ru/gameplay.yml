  # Generated mercenary invitations: keep each experience tier separate so class names remain placeholders.
  'Good tidings. I am {name}, apprentice {class}. I''d love to see the world and taste the adventure, but it''d be foolish to go alone. Perhaps I could come with you?': 'Привет. Я — {name}, начинающий {class}. Мне очень хотелось бы увидеть мир и испытать приключения, но отправляться в путь в одиночку было бы глупо. Может быть, я смогу отправиться с вами?'
  'Good tidings. I am {name}, skilled {class}. I''d love to see the world and taste the adventure, but it''d be foolish to go alone. Perhaps I could come with you?': 'Рад вас видеть. Я — {name}, опытный {class}. Мне очень хотелось бы увидеть мир и испытать приключения, но отправляться в путь в одиночку было бы глупо. Может быть, я смогу отправиться с вами?'
  'Good tidings. I am {name}, well known {class}. I''d love to see the world and taste the adventure, but it''d be foolish to go alone. Perhaps I could come with you?': 'Рад вас видеть. Я — {name}, известный {class}. Мне очень хотелось бы увидеть мир и испытать приключения, но отправляться в путь в одиночку было бы глупо. Может быть, я смогу отправиться с вами?'
  'Good tidings. I am {name}, masterful {class}. I''d love to see the world and taste the adventure, but it''d be foolish to go alone. Perhaps I could come with you?': 'Здравствуйте. Я — {name}, опытный {class}. Мне очень хотелось бы увидеть мир и испытать приключения, но отправляться в путь в одиночку было бы глупо. Может быть, я смогу отправиться с вами?'
  'Good tidings. I am {name}, great {class}. I''d love to see the world and taste the adventure, but it''d be foolish to go alone. Perhaps I could come with you?': 'Рад вас видеть. Я — {name}, великий {class}. Мне очень хотелось бы увидеть мир и испытать приключения, но отправляться в путь в одиночку было бы глупо. Может быть, я смогу отправиться с вами?'
  # NPC dialogue %05 substitution.
  'morning': 'утро'
  'afternoon': 'день'
  'evening': 'вечер'
  'Your party has already completed this quest. Eligible companions are promoted to {class}.': 'Ваша группа уже выполнила это задание. Соответствующие требованиям спутники получают повышение. Новый класс: {class}.'
  'You have to be promoted to {classes} to learn this skill.': 'Чтобы освоить этот навык, вам необходимо получить повышение. Требуемый класс: {classes}.'
  ' or ': ' или '
  'This skill level can not be learned by the {class} class.': 'Этот уровень навыка недоступен для класса «{class}».'
  'You must have at least 50 base Intellect to learn Master Learning.': 'Чтобы стать мастером навыка «Обучение», вам нужно не менее 50 единиц базового интеллекта.'
  'You must have at least 50 base Personality to learn Master Merchant.': 'Чтобы стать мастером навыка «Торговля», вам нужно не менее 50 единиц базовой личности.'
  'You must have at least 50 base Endurance to learn Master Bodybuilding.': 'Чтобы стать мастером навыка «Бодибилдинг», вам нужно не менее 50 единиц базовой выносливости.'
  'The requirements for this training are unmet.': 'Требования к данному обучению не выполнены.'
  'This character does not know that skill.': 'Этот персонаж не владеет этим навыком.'
  'This character already knows that mastery.': 'Этот персонаж уже достиг этой степени владения навыком.'
