  'Find an action. Choose a key.': 'Найдите действие и назначьте клавишу.'
  'Scale monsters with the party. Apply when entering an area.': 'Подстраивать монстров под отряд при входе в область.'
  'Show quest markers where the game provides them.': 'Показывать метки заданий там, где они предусмотрены игрой.'
  'Show damage and combat messages in the world.': 'Показывать урон и боевые сообщения в игровом мире.'
  'Show the target, recent combatants, or nearby visible enemies.': 'Показывать цель, недавних участников боя или видимых врагов рядом.'
  'Show current and maximum health above enemy bars.': 'Показывать текущее и максимальное здоровье над полосами врагов.'
  'Briefly show recently lost health behind the current fill.': 'Ненадолго оставлять след недавно потерянного здоровья.'
  'Report attacks in the status text.': 'Выводить сведения об атаках в строке состояния.'
  'Offer contextual actions for the object under the pointer.': 'Предлагать доступные действия для объекта под указателем.'
  'Skip event movies. Leave off for a first adventure.': 'Пропускать сюжетные ролики. Для первого прохождения лучше отключить.'
  'Set the detail options below at once; changing one of them shows Custom.': 'Задать все параметры детализации сразу; ручное изменение включает профиль «Особый».'
  'Changes must be confirmed within 15 seconds.': 'Изменения нужно подтвердить в течение 15 секунд.'
  'Borderless uses your desktop resolution.': 'В безрамочном режиме используется разрешение рабочего стола.'
  'Reduce screen tearing by syncing frames to the display.': 'Синхронизировать кадры с экраном, уменьшая разрывы изображения.'
  'Smooth jagged edges and shimmering foliage.': 'Сглаживать ступенчатые края и мерцание листвы.'
  'Longer distances can reduce performance outdoors.': 'Большая дальность может снизить производительность на открытой местности.'
  'Filter texture pixels instead of showing sharp texel edges.': 'Фильтровать текстуры вместо отображения резких границ текселей.'
  'Keep distant ground textures sharper. Uses anisotropic terrain filtering.': 'Сохранять чёткость дальних текстур земли с помощью анизотропной фильтрации.'
  'Use simpler creature shapes at a distance while retaining full detail nearby.': 'Использовать упрощённые модели существ вдали и полную детализацию вблизи.'
  'Animated shadows on creatures and their surroundings. Higher quality improves detail and range.': 'Анимированные тени существ и окружения. Высокое качество повышает детализацию и дальность.'
  'Draw extra terrain decorations where available.': 'Отображать дополнительные украшения ландшафта, если они предусмотрены.'
  'Density of falling rain and snow; Off hides them while the weather itself goes on.': 'Плотность дождя и снега; отключение скрывает осадки, не меняя саму погоду.'
  'How finely torches, spells and other lights are sorted across the view; Low is lighter on phones.': 'Точность распределения факелов, заклинаний и других источников света; низкое значение быстрее на телефонах.'
  'Rain darkens the ground and buildings, which dry slowly after it stops.': 'Дождь затемняет землю и здания, которые постепенно высыхают после него.'
  'Smooth rock and rain-wet ground catch the sun and nearby lights.': 'Гладкий камень и мокрая земля отражают солнце и ближайшие источники света.'
  'Reflect the sky, ground and buildings in visible water. Requires extra rendering.': 'Отражать в воде небо, землю и здания. Требует дополнительного рендеринга.'
  'Higher detail makes scenery reflections sharper and costs more rendering time.': 'Высокая детализация делает отражения чётче, но требует больше времени на рендеринг.'
  'Include nearby creatures, trees and decorations in water reflections.': 'Включать ближайших существ, деревья и декорации в отражения на воде.'
  'Small ripples from creatures moving on water.': 'Небольшая рябь от существ, движущихся по воде.'
  'Raindrop rings on still water while it rains.': 'Круги от капель дождя на спокойной воде.'
  'Add soft shading where solid surfaces meet.': 'Добавлять мягкое затенение в местах соприкосновения поверхностей.'
  'Adjust the strength of contact shading.': 'Настроить силу контактного затенения.'
  'Flames, glowing crystals and spell light bloom softly into their surroundings.': 'Пламя, светящиеся кристаллы и заклинания мягко освещают окружение.'
  'Adjust how far and how brightly the glow spreads.': 'Настроить яркость и радиус свечения.'
  'Apply the cinematic colour treatment.': 'Применять кинематографическую цветокоррекцию.'
  'Adjust the strength of cinematic colour.': 'Настроить интенсивность кинематографической цветокоррекции.'
  'Sharpen the 3D view; the interface is unaffected. Zero turns it off.': 'Повышать резкость трёхмерного мира, не затрагивая интерфейс. Ноль отключает эффект.'
  'Use the colours of nearby light sources.': 'Использовать цвета ближайших источников света.'
  'Retain the original tinting option.': 'Сохранять исходное цветовое тонирование.'
  'Show blood splat effects.': 'Показывать эффекты брызг крови.'
  'Add blood effects when melee attacks connect.': 'Добавлять кровь при попаданиях в ближнем бою.'
  'Show a slash, thrust or crush where melee attacks connect.': 'Показывать эффект рубящего, колющего или дробящего удара при попадании.'
  'Play impact sounds by what was struck and briefly hold the struck creature.': 'Проигрывать звук по материалу цели и ненадолго задерживать поражённое существо.'
  'Briefly brighten a creature struck in melee.': 'Ненадолго подсвечивать существо при попадании в ближнем бою.'
  'Nudge the view along the blow on critical hits and kills.': 'Слегка толкать камеру по направлению удара при критическом попадании или убийстве.'
  'Weapons, spells, interface sounds, and the world.': 'Оружие, заклинания, интерфейс и звуки мира.'
  'Music in menus, towns, and dungeons.': 'Музыка в меню, городах и подземельях.'
  'Spoken character reactions and dialogue.': 'Озвученные реплики персонажей и диалоги.'
  'Play walking and running sounds.': 'Проигрывать звуки ходьбы и бега.'
  'Modern: WASD, left-click attack, E to use. Classic: arrow keys, A to attack, left-click to use.': 'Современная: WASD, атака левой кнопкой мыши, действие на E. Классическая: стрелки, атака на A, действие левой кнопкой мыши.'
