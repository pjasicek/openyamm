    Ещё раз спасибо, пожалуйста, примите это золото и мою благодарность в качестве награды.'
  ? 'Keep searching� the lives of the mayor and myself could very well be in your hands.

    We can�t take action against them without proof.'
  : 'Продолжайте поиски — жизнь мэра и моя могут оказаться в ваших руках.

    Без доказательств мы не можем принять против них никаких мер.'
  ? 'King Parson is beyond the date when he could have used those false papers.

    Don''t bother taking them to him--it doesn''t matter anymore.

    '
  : 'Срок, в течение которого Кинг Парсон мог бы воспользоваться этими поддельными документами, уже истек.

    Не стоит даже приносить их ему — это уже не имеет значения.'
  ? 'Korbu scattered vials of the dirt from his original grave to safe guard himself.

    This way he could always gain access to the dirt and move his crypt if he needed to.'
  : 'Корбу разбросал флаконы с землёй из своей первоначальной могилы, чтобы обезопасить себя.

    Таким образом он всегда мог получить доступ к этой земле и переместить свою гробницу, если в этом возникнет необходимость.'
  ? 'Kriegspire is the castle inside the volcano.

    We mages were forced to raise the earth around the castle to try and prevent the creatures from overrunning the surrounding
    towns.

    Now they�re contained inside, and that�s where the egg is.'
  : 'Кригспайр — это замок, расположенный внутри вулкана.

