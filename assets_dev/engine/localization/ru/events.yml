  The chest is locked.: Сундук заперт.
  The crates are all empty.: Все ящики пустые.
  The crimson embers will lead the way: Алые угли укажут путь
  ? 'The death of Judge Grey was a blow to all of us.

    I hope his replacement does his legacy justice.'
  : 'Смерть судьи Грея стала тяжелым ударом для всех нас.

    Надеюсь, что его преемник оправдает его наследие.'
  The dirty water leaves a bad taste in your mouth.: Грязная вода оставляет неприятный привкус во рту.
  The door clicks.: Дверь щелкнула.
  The door is blocked: Дверь заблокирована
  The door is double locked.: Дверь заперта на два замка.
  The door is locked: Дверь заперта
  The door is locked.: Дверь заперта.
