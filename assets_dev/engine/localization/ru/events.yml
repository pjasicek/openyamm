    Только тогда я возобновлю твоё обучение.'
  I�m glad to see you again, but the Celestial Order is still in the Monolith.: Я рад снова тебя видеть, но «Небесный Орден»
    по-прежнему находится в «Монолите».
  ? "I�m sorry, but I still haven�t remembered exactly what it is you need.\nI know you need to search Corlagon�s Estate.\n\
    \ "
  : 'Извините, но я до сих пор не вспомнил, что именно вам нужно.

    Я знаю, что вам нужно обыскать поместье Корлагона.'
  ? 'I�m still looking for the mirror. <pauses> I mean Hourglass� I keep getting those mixed up.

    Did you try the dark cavern� no wait, it was the old fort south of here.

    I always seem to mix those up.'
  : 'Я всё ещё ищу зеркало. <пауза> То есть «Песочные часы»… Я всё время их путаю.

    Ты пробовал заглянуть в тёмную пещеру? Нет, постой, это же старый форт к югу отсюда.

    Я всегда их путаю.'
  ? 'I�ve discovered a way to reverse the effects of time and make myself young again.

    This requires a complex magical ritual, which I�ve worked out.

    The problem is that I need to place magical statuettes on various pedestals. The tiger statuette goes on the pedestal
    near Sweet Water, the bear statuette in Kriegspire, the eagle statuette in Dragonsand, the wolf statuette in the Mire
    of the Damned, and the dragon statuette in Bootleg Bay.

    The distances are too far for me to travel in my old age, and in the meantime I need to prepare the ritual itself.

    There is no way I can do all of this on my own; I need your help.

    The statuettes are in the chest outside my house.

    Place them on the pedestals and return to me.

    Even if the ritual is a failure, I''ll pay you for your efforts.'
  : 'Я обнаружил способ обратить вспять действие времени и вновь обрести молодость.

    Для этого требуется сложный магический ритуал, который я разработал.

