  ? 'The survivors in this region need Potions of Fire Resistance!

    With them we can survive until a place is found for us to move to!

    Take these potions!

    Unfortunately they are all I have!

    Deliver them to the six southernmost houses that remain standing in the village of Rust!'
  : 'Выжившим в этом регионе нужны зелья сопротивления огню!

    С их помощью мы сможем продержаться, пока не найдём место, куда можно будет перебраться!

    Возьмите эти зелья!

    К сожалению, это всё, что у меня есть!

    Доставьте их в шесть самых южных домов, которые ещё стоят в деревне Раст!'
  The switch does not work.: Выключатель не работает.
  The switch is locked in place.: Переключатель зафиксирован в этом положении.
  The torches Ignite and so does the swamp gas.: Зажигаются факелы, и вместе с ними воспламеняется болотный газ.
  ? 'The toughest band of contestants have apparently hid out in the Temple of the Moon.

    I think they might be wanting to ambush any group that tries to go there.'
  : 'Похоже, самая опасная группа участников укрылась в Храме Луны.

    Думаю, они, возможно, собираются устроить засаду на любую группу, которая попытается туда пробраться.'
  The tree shakes at your touch.: Дерево дрожит от твоего прикосновения.
  The vein dried up.: Вены высохли.
  The vent brings in fresh air.: Вентиляционное отверстие обеспечивает поступление свежего воздуха.
  The water cools you down.: Вода помогает охладиться.
  The waters part.: Воды расступаются.
  The way has been cleared: Путь расчищен
  ? 'Thee�ve done it! I knew thee could do it!

    I�m so proud of thee!

    Alice has been freed of the clutches of the wicked William Setag, evil has been vanquished, and good upheld.

    Where once there was wrong, now there is right! [Charles sighs and smiles broadly] Well.

    My work here is done!

    Thee have passed the tests and deserve thy reward.

    Therefore do I solemnly declare thee Heroes! '
  : 'Ты сделала это! Я знал, что ты сможешь!

    Я так тобой горжусь!

    Элис освободилась из лап злобного Уильяма Сетага, зло побеждено, а добро восторжествовало.

    Где раньше царило зло, теперь царит добро! [Чарльз вздыхает и широко улыбается] Ну что ж.

    Моя работа здесь закончена!

    Вы прошли испытания и заслужили свою награду.

    Поэтому я торжественно провозглашаю вас Героями!'
  ? "There are many Prophecies that tell of the destruction of Jadame and the entire world!\n Most tell of a time when the\
    \ world will be consumed by that which created it.\nPerhaps the Ancients have decided to wipe us all out!"
  : 'Существует множество пророчеств, предсказывающих гибель Джадаме и всего мира!

    В большинстве из них говорится о времени, когда мир будет поглощён тем, кто его сотворил.

    Возможно, Древние решили уничтожить нас всех!'
  ? There are many predators who would take advantage of the lair in this vulnerable time. I've already driven off looters�and
    worse. One of Zog's patrols stopped by soon after the flood. I fought them off, but some escaped. I am sure they will
    be back in greater numbers.
  : Есть много хищников, которые готовы воспользоваться уязвимостью логова в это трудное время. Я уже прогнал мародеров… и
    не только их. Вскоре после наводнения сюда заглянул один из патрулей Зога. Я отбился от них, но некоторым удалось сбежать.
    Уверен, что они вернутся в ещё большем количестве.
  There are no items that interest you: Нет товаров, которые вас интересуют
  ? 'There are still troglodytes roaming the lower mine levels.

    Please remove them!'
  : 'На нижних уровнях шахты до сих пор бродят троглодиты.

    Пожалуйста, устраните их!'
  ? 'There are traders in Alvar and Shadowspire that trade for the different types of ore that can be found all over Jadame.

    They use the ore to create items that they are more than happy to trade for more ore!'
  : 'В Альваре и Тень-Шпиле есть торговцы, которые обменивают различные виды руды, добываемой по всей Джадаме.

    Они используют эту руду для изготовления предметов, которые с удовольствием обменивают на новую руду!'
  There doesn't seem to be anymore apples.: Похоже, яблок больше нет.
  There is a strong smell of gas pervading the air.: В воздухе витает сильный запах газа.
  ? 'There is no use returning to me to talk about your quest.

    I cannot change the rules or your quest.

    Longfang awaits your avenging sword.

    Now get to it!'
  : 'Нет смысла возвращаться ко мне, чтобы рассказывать о своём задании.

    Я не могу изменить ни правила, ни само задание.

    Лунфан ждёт твоего меча мести.

    А теперь за дело!'
  There is of nothing of value in the crates.: В ящиках нет ничего ценного.
  ? 'There really is a dragon on the island?

    I thought everyone was referring to the dragonflies everywhere.

    I''ll warn everyone to stay away from that cave so we don''t lose anyone else.'
  : 'На острове действительно есть дракон?

    Я думал, все имели в виду тех стрекоз, которые повсюду летают.

    Я предупрежу всех, чтобы держались подальше от той пещеры, чтобы мы больше никого не потеряли.'
  ? 'There''s no rush in destroying the book.

    If you manage it, come back and talk to me.

    I''m not sure it''s even possible to get to the book and destroy it� there are far too many evil creatures in that castle.'
  : 'С уничтожением книги спешить не стоит.

    Если у тебя это получится, вернись и поговори со мной.

    Я даже не уверен, что вообще возможно добраться до книги и уничтожить её — в том замке слишком много злобных существ.'
  There's nothing but spikes in the Iron maiden.: В «Железной деве» нет ничего, кроме шипов.
  These are really old bones...really old.: Это действительно старые кости… очень старые.
  ? 'They''re gone?

    Routed back into the connecting tunnels to Nighon!

    Excellent!

    We can get back to mining immediately!

    Thank you so much for your help; take this as a reward for your services.'
  : 'Они ушли?

    Они отступили обратно в соединительные туннели, ведущие в Найгон!

    Отлично!

    Мы можем сразу же возобновить добычу!

    Большое спасибо за помощь; примите это в качестве вознаграждения за ваши услуги.'
  ? 'This 1000 gold will go a long way to keeping zombies off the roads.

    Thank you for your contribution.'
  : 'Эти 1000 золотых в значительной степени помогут удержать зомби подальше от дорог.

    Спасибо за ваш вклад.'
  This Door has Been Locked: Эта дверь заперта
  This Door is Locked: Эта дверь заперта
  This Door won't budge.: Эта дверь не поддается.
  ? 'This Temple is a pretty nasty place.

    You should probably watch your back around here-- you never know what might want to kill you.'
  : 'Этот храм — довольно жуткое место.

    Здесь, наверное, стоит быть начеку — никогда не знаешь, что может захотеть тебя убить.'
  This cave-in blocks any further access into the mine.: Этот обвал преграждает дальнейший доступ в шахту.
  This door won't open.: Эта дверь не открывается.
  ? 'Though the law may decide who is guilty and who is not, I decide who is called Thief, and who is just a criminal.

    Bring me that lovely vase I saw on the mantle in Lord Markham�s manor, and I shall call you Rogue.'
  : 'Пусть закон и решает, кто виновен, а кто нет, но я решаю, кого называть «вором», а кого — просто преступником.

    Принеси мне ту прекрасную вазу, которую я видела на каминной полке в поместье лорда Маркхэма, и я назову тебя «мошенником».'
  ? 'To attain the status of Great Wyrm, a Dragon must prove that he can handle himself against a great number of foes.

    He must face down the vermin that Charles Quixote would send against us.

    To the southwest of here, Quixote has established an encampment of his puny �Dragon Slayers.�

    This camp is lead by Jeric Whistlebone, the second in command of Quixote�s army.

    Destroy this camp!

    Kill all of those who serve Quixote in that region and return to me.

    Return to me with the sword of

    Whistlebone the Slayer.

    In doing this, you will prove to me your worthiness.

    '
  : 'Чтобы обрести статус Великого Дракона, дракон должен доказать, что способен справиться с огромным количеством врагов.

    Он должен дать отпор отбросам, которых Чарльз Кихот пошлет против нас.

    К юго-западу отсюда Кихот разбил лагерь своих ничтожных «убийц драконов».

    Этим лагерем командует Джерик Уистлбоун, заместитель командующего армией Кихота.

    Уничтожь этот лагерь!

    Убей всех, кто служит Кихоту в этой местности, и вернись ко мне.

    Вернись ко мне с мечом

    Уистлбона Убийцы.

    Сделав это, ты докажешь мне свою достойность.'
  ? 'To the west of Avlee lies the craft that Resurectra and her associates used to come to Erathia.

    Visit the ship and retrieve the Oscillation Overthruster to insure our victory.

    Make sure to be properly outfitted for the journey.'
  : 'К западу от Авли находится корабль, на котором Ресуректра и её соратники прибыли в Эратию.

    Посетите корабль и добудьте «Осцилляционный сверхдвигатель», чтобы обеспечить нашу победу.

    Убедитесь, что вы должным образом экипированы для этого путешествия.'
  ? 'Tobersk fruit is native only to the Dagger Wound Island region.

    Here the mild winters and humid summers provide the perfect conditions for the Tobersk fruit to achieve the correct levels
    of sugar and juice.

    The pulp masters in Ravenshore pay good money for the tobersk fruit.'
  : 'Плоды тоберска произрастают исключительно в регионе острова «Рана от кинжала».

    Здесь мягкие зимы и влажные лета создают идеальные условия для того, чтобы плоды тоберска достигли необходимого содержания
    сахара и сока.

    Мастера по переработке мякоти в Рейвеншоре платят за плоды тоберска хорошие деньги.'
  ? 'Tobersk fruit is processed in Ravenshore into tobersk pulp.

    Its from this pulp that the master brewers in Alvar distill tobersk brandy.'
  : 'Плоды тоберска перерабатываются в Рейвеншоре в тоберскую мякоть.

    Именно из этой мякоти мастера-дистилляторы в Альваре производят тоберский бренди.'
  ? 'Tobren Forgewright assisted the city of Ravenshore in the First Pirate War.

    Her forge glowed for four weeks straight as she made chain armor for the defenders of Ravenshore.

    She still teaches Expert use of the armor from her home in the seaside port of Ravenshore.'
  : 'Кузнечица Тобрен помогала городу Рейвеншор во время Первой пиратской войны.

    Её кузница не угасала целых четыре недели подряд, пока она изготавливала кольчуги для защитников Рейвеншора.

    И по сей день она обучает мастерскому владению этой броней в своём доме в приморском порту Рейвеншор.'
  ? 'Tolberti has a mission of great importance.

    Everything we''ve staked so far rests on its completion.

    Prepare well for his task or you will certainly fail.'
  : 'На Толберти возложена чрезвычайно важная миссия.

    От её успешного выполнения зависит всё, на что мы сделали ставку до сих пор.

    Тщательно подготовьтесь к выполнению этой задачи, иначе вы непременно потерпите неудачу.'
  Trap!: Ловушка!
  Tree: Дерево
  Trial by Cold: Испытание холодом
  Trial by Fire: Испытание огнём
  Uh oh....: Ой-ой...
  ? 'Um.

    Hi. <smiling weakly> Would you believe I got lost and these nice people were taking me home?

    No?

    I guess I wouldn�t either.

    I suppose it�s time we got back to the castle, then.'
  : 'Э-э.

    Привет. <слабо улыбается> Поверишь, что я заблудилась, и эти милые люди везли меня домой?

    Нет?

    Наверное, я бы тоже не поверила.

    Полагаю, тогда нам пора возвращаться в замок.'
  ? 'Um�The weight needs to go in the box in the lower gatehouse�not here.

    Go back to Watchtower 6 and put the weight in the right box!'
  : 'Э-э... Груз нужно положить в ящик в нижней сторожевой будке, а не сюда.

    Вернись к «Сторожевой башне № 6» и положи груз в нужный ящик!'
  ? 'Very few people even know that these weapons exist.

    The only other person I''ve ever seen using an ancient weapon is Rexella, but she was last living in Paradise Valley�
    I''m not sure she''s even there anymore.'
  : 'Очень немногие люди вообще знают о существовании этого оружия.

    Единственный человек, которого я когда-либо видел с древним оружием, — это Рекселла, но в последний раз она жила в Парадайз-Вэлли…
    Не уверен, что она там вообще ещё осталась.'
  ? Very good�or at least, as good as can be expected. You managed to bring three partners into the alliance--the minimum
    number my advisors told me would be sufficient to fulfill the "�Jadame, must stand together�" part of the prophecy. A
    pity it could not be more, but events of the cataclysm are clearly coming to a head. It is time to move onward.You must
    travel to Ravenshore and meet with the alliance council gathered there. With them, decide what must be the next step we
    take in meeting the elemental crisis.
  : Очень хорошо… или, по крайней мере, так хорошо, как и следовало ожидать. Тебе удалось привлечь в альянс трёх партнёров
    — минимальное количество, которое, по словам моих советников, достаточно для исполнения части пророчества «…Джадаме, мы
