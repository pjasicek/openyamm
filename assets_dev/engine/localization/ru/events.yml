  Join you! Ha! I admire your audacity. Yes�admire it a great deal. Very well. You have my respect. I will go with you.: Присоединиться
    к тебе! Ха! Я восхищаюсь твоей смелостью. Да… восхищаюсь ею безмерно. Хорошо. Ты заслужил моё уважение. Я пойду с тобой.
  ? Judging from the tactics employed by the Regnan pirates, I suspect that Blackwell Cooper is involved. Cooper is an old�shall
    we say, "associate," of mine. Why, if I were a gambling man, I'd bet gold that he is leading the Regnan expeditionary
    force on Dagger Wound.
  : Судя по тактике, которую применяют регнанские пираты, я подозреваю, что к этому причастен Блэквелл Купер. Купер — мой
    старый… как бы это сказать… «партнёр». Если бы я был азартным человеком, то поставил бы золото на то, что именно он возглавляет
    регнанский экспедиционный отряд на «Кинжальной Ране».
  ? 'Just a minute, let me check.

    Mirror, mirror, on the wall� <the witch peers into her mirror for a few minutes, then sighs> It''s still Alice Hargreaves.

    She lives in Castle Gryphonheart.

    She''s quite a noble beauty, that girl is!

    Takes me back to my youth, this one does.'
  : 'Подожди минутку, дай-ка я проверю.

    Зеркало, зеркало на стене… <ведьма несколько минут вглядывается в зеркало, а затем вздыхает> Это всё ещё Элис Харгривз.

    Она живёт в замке Грифонхарт.

    Какая же она благородная красавица, эта девушка!

    Она напоминает мне мою молодость.'
  ? 'Just as I suspected!

    I�m surprised the Mayor was number three on their enemies list.

    I suppose he IS a tad incompetent, but he�s not a bad person.

    Thanks again, please accept this gold and my gratitude as your reward.'
  : 'Как я и подозревал!

    Удивлен, что мэр оказался третьим в их списке врагов.

