    Теперь они заперты внутри, и именно там находится яйцо.'
  Let�s go see the circus!: Пойдем в цирк!
  Look Out!: Осторожно!
  Looks like an earthquake hit this mine.: Похоже, в этой шахте произошло землетрясение.
  ? 'Looks like the trophy fell into the hands of Avlee.

