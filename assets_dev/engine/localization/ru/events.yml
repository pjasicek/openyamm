  The door will not budge.: Дверь не поддается.
  The door won't budge: Дверь не поддается
  The door won't budge.: Дверь не поддается.
  ? 'The doors became warded when a strange creature came to reside here.

    I am not familiar with this type of being, and I�ve seen many types in my long time here in Enroth.

    I do not know why it chose this place as its home, or why there is only one, but I would like to see it destroyed for
    the trouble it has caused me. '
  : 'Двери оказались заблокированы, когда здесь поселилось странное существо.

    Я не знаком с подобными существами, а за долгое время, проведённое мной здесь, в Энроте, я видел много разных видов.

    Я не знаю, почему оно выбрало это место в качестве своего жилища, и почему его только одно, но я хотел бы, чтобы его уничтожили
    за те неприятности, которые оно мне доставило.'
  The doors seem stuck.: Двери, похоже, заклинило.
  ? 'The dragon is fallen--and at your hands!

    You are a hero!'
  : 'Дракон повержен — и это твоя заслуга!

    Ты — герой!'
  The entrance to the central pyramid lies to the South.: Вход в центральную пирамиду находится на юге.
  ? 'The execution date for Loren Steel has passed.

    Don''t bother bringing the imposter to the Queen--she''ll be too suspicious for our ruse to succeed.

    He''ll be leaving you now.'
  : 'Срок казни Лорена Стила уже истек.

    Не стоит приводить самозванца к королеве — она будет слишком подозрительна, и наша уловка не сработает.

    Он сейчас уйдет от вас.'
  The fires of the dead shall burn forever: Огни умерших будут гореть вечно
  The flowers smell nice.: Цветы приятно пахнут.
  The gate will not budge.: Ворота не сдвигаются с места.
  The haunted sounds of tortured souls assail your ears.: Ваши уши ошеломляют призрачные звуки мучимых душ.
  ? 'The hourglass wasn�t there?

    Oh, that�s right!

    I knew I forgot something!

    The key is in there!

    You use the key to open the Forge of� <pauses>

    Well, I can�t remember whose forge it is, but that is the resting place of the Hourglass of Time...I think.

    It can�t hurt to look there, especially now that you�ve found the key.

    <pauses>

    At least I THINK that�s what the key opens.

    Anyway, that forge or laboratory or whatever it is can be found on the islands north of New Sorpigal.

    Good Luck!'
  : 'Песочных часов там не было?

    Ах, да, точно!

    Я знал, что что-то забыл!

    Ключ там!

    Этим ключом открывается Кузница… <пауза>

    Ну, я не помню, чья это кузница, но именно там хранятся Песочные часы Времени… кажется.

    Посмотреть там не помешает, особенно теперь, когда ты нашёл ключ.

    <пауза>

    По крайней мере, я ДУМАЮ, что именно это открывает ключ.

    В любом случае, эту кузницу, лабораторию или что там ещё можно найти на островах к северу от Нью-Сорпигала.

    Удачи!'
  ? 'The infernal dragon hunters of Charles Quixote are dead? Fantastic!

    We can once again enjoy the peace of Garrote Gorge without fear.

    Here is your promised reward!

    I will go speak with Deftclaw Redreaver of your bravery this instant!'
  : 'Адские драконоборцы Чарльза Кихота погибли? Замечательно!

    Теперь мы снова сможем без страха наслаждаться покоем ущелья Гарроте.

    Вот обещанное вознаграждение!

    Я тут же пойду и расскажу Дефтклоу Редреверу о твоей доблести!'
  ? 'The ingredients!

    Thank you!

    Take this as a reward!'
  : 'Ингредиенты!

    Спасибо!

    Примите это в качестве награды!'
  ? 'The legendary Pirate Stanley is rumored to have stolen hundreds and thousands of gold pieces from the Merchants of Alvar.

    No one has ever found where he has hidden his treasure.

    Some say it isn''t even hidden on the Island of Regna.'
  : 'Ходят слухи, что легендарный пират Стэнли похитил сотни и тысячи золотых монет у купцов из Альвара.

    Никто так и не смог обнаружить, где он спрятал своё сокровище.

    Некоторые утверждают, что оно даже не спрятано на острове Регна.'
  The lever will not move: Рычаг не сдвигается с места
  The mead barrel is empty.: Бочка с медовухой пуста.
  The mine shakes and shifts around you.: Шахта дрожит и сдвигается вокруг вас.
  The monolith feels strange to the touch.: Монолит на ощупь кажется странным.
  The niche is empty.: Ниша пуста.
  ? 'The night the stranger came through here was the same night that the crystal erupted in the center of town.

    I only caught a glimpse of the stranger.

    He didn�t appear the potent mage that he was.

    I was not in the town square when he summoned the crystal, but I did see the flash of light that traveled across the sky.

    It was truly a terrible night.'
  : 'В ту ночь, когда здесь появился незнакомец, в центре города взорвался кристалл.

    Я лишь мельком заметил этого незнакомца.

    Он не выглядел таким могущественным магом, каким был на самом деле.

    Меня не было на городской площади, когда он вызвал кристалл, но я видел вспышку света, пронзившую небо.

    Это была поистине ужасная ночь.'
  ? 'The palace is deadly dull, and everyone tells me what to do.

    Being royalty isn�t really worth much and no one will let me go outside the walls while my father is gone.

    I haven�t left the castle for months!

    Anyway, you people look pretty important.

    What if you helped me sneak out and stay with you for a couple of days?

    I can�t give you much in return yet, but I�ll owe you a favor.

    Someday I�ll be able to repay you.

    I am the prince, after all!

    I�ll go out the secret door and meet you outside.'
  : 'В дворце смертельно скучно, и все мне указывают, что делать.

    Быть членом королевской семьи — не такая уж большая удача, и пока отец в отъезде, мне никому не разрешают выходить за
    пределы дворца.

    Я уже несколько месяцев не выходил из замка!

    В любом случае, вы, похоже, довольно важные люди.

    А что, если бы вы помогли мне тайком выбраться отсюда и побыть с вами пару дней?

    Пока я не могу предложить вам ничего значительного в обмен, но я буду у вас в долгу.

    Когда-нибудь я смогу отплатить вам.

    В конце концов, я же принц!

    Я выйду через потайную дверь и встречусь с вами снаружи.'
  The pool shimmers as you touch it.: Когда к нему прикасаешься, бассейн переливается.
  The prince has been kidnapped!  No visitors will be admitted until this crisis has been resolved!: Принца похитили!  Посетители
    не будут допускаться до тех пор, пока этот кризис не будет разрешен!
  ? 'The proprietor of the Howling Moon is George Caniss.

    It''s a wonderful place.

    Tell him I said hi!'
  : 'Владелец бара «Воющая Луна» — Джордж Канисс.

    Это замечательное место.

    Передайте ему от меня привет!'
  ? 'The reason I wanted the key was to open the Dragon Towers and make the adjustments to prevent them from shooting flyers
    indiscriminately.

    There is a way to adjust the towers to shoot at only large objects, and I want all of them adjusted for the good of the
    Kingdom.

    Magic is becoming more common, as are stories of young Sorcerers getting shot from the sky because they didn�t know the
    function of the towers.

    You have the key.

    If you adjust all of the towers to shoot at only large objects, I will promote all warrior mages amongst you to master
    archers and promote any honorary warrior mages to honorary master archers.'
  : 'Я хотел получить этот ключ, чтобы открыть Башни Дракона и настроить их так, чтобы они не стреляли без разбора по летающим
    целям.

    Существует способ настроить башни так, чтобы они стреляли только по крупным объектам, и я хочу, чтобы все они были настроены
    в интересах Королевства.

    Магия становится всё более распространённой, как и истории о молодых чародеях, которых сбивают с неба, потому что они
    не знали, как работают эти башни.

    Ключ у вас.

    Если ты настроишь все башни так, чтобы они стреляли только по крупным объектам, я повышу всех воинов-магов из вашего числа
    до звания мастеров-лучников, а всех почетных воинов-магов — до звания почетных мастеров-лучников.'
  ? 'The road to Ironfist is much safer thanks to you.

    You have our gratitude.'
  : 'Благодаря вам дорога в Айронфист стала гораздо безопаснее.

    Мы вам очень благодарны.'
  The rock shifts at your touch.: Камень сдвигается при вашем прикосновении.
  The sack is empty.: Мешок пуст.
  The sacks are filled with flawed crystal shards (worthless).: Мешки наполнены обломками кристаллов с дефектами (бесполезными).
  ? 'The sea of fire took us all by surprise.

    It spread through the eastern half of the village like wildfire.

    Luckily its growth seems to have slowed.

    Still I don�t know how much longer any of us can last.'
  : 'Море огня застало нас всех врасплох.

    Оно распространилось по восточной половине деревни, как лесной пожар.

    К счастью, похоже, его распространение замедлилось.

    Но я всё ещё не знаю, сколько времени нам ещё осталось.'
  The ship begins to sink: Корабль начинает тонуть
  ? 'The signal rocket on the west side of the island should be set of to warn ships off from approaching to close to that
    side of the island.

    The reefs off the west coast have proven deadly in the past.'
  : 'Сигнальную ракету, расположенную на западной стороне острова, следует запустить, чтобы предупредить суда о недопустимости
    приближения к этой стороне острова.

    Рифы у западного побережья в прошлом неоднократно становились причиной гибели людей.'
  The skeleton grabs for you.: Скелет тянется к тебе.
  The skulls seem to sap your might: Кажется, эти черепа лишают тебя сил
  The statue shifts as your touch it.: Статуя меняет положение, когда к ней прикасаешься.
  The stew tastes good - you feel better (+5 hits).: Рагу очень вкусное — самочувствие улучшается (+5 очков здоровья).
  The stew tasts good - you feel better (+5 hits).: Рагу вкусное — самочувствие улучшается (+5 очков).
