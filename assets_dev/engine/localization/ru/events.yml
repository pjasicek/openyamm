  '"+100,000 Experience"': «+100 000 очков опыта»
  '"+5000 Experience, -5000 Gold."': «+5000 очков опыта, -5000 золотых».
  '"A copper sign reads: As the winds blow, the seasons change, and only at the end of all can the doors be opened."': '«На
    медной табличке написано: „Ветер дует, времена года сменяют друг друга, и только в конце всего этого двери могут открыться“».'
  '"A lapis sign reads: As the winds blow, the seasons change, and only at the end of all can the doors be opened."': '«На
    табличке из лазурита написано: „Ветер дует, времена года сменяют друг друга, и только в конце всего этого двери могут
    открыться“».'
  '"A silver sign reads: As the winds blow, the seasons change, and only at the end of all can the doors be opened."': '«На
    серебряной табличке написано: „Ветер дует, времена года сменяют друг друга, и только в конце всего этого двери могут открыться“».'
  ? '"A small nymph comes out of a hole in the floor thanking you for clearing the spores, he shakes your hand vigorously
    then disappears down the hole (which somehow disappears after him). +500 experience."'
  : «Из отверстия в полу появляется маленькая нимфа, которая благодарит тебя за то, что ты избавился от спор, энергично пожимает
    тебе руку, а затем исчезает в отверстии (которое почему-то исчезает вслед за ней). +500 очков опыта».
  '"A voice whispers -I am the spirit of the swamp, congratulations, take what you may and leave in peace-"': '«Голос шепчет:
    „Я — дух болота. Поздравляю! Бери, что хочешь, и уходи с миром…“»'
  '"A wooden sign reads: As the winds blow, the seasons change, and only at the end of all can the doors be opened."': '«На
    деревянной табличке написано: „Ветер дует, времена года сменяют друг друга, и только в конце всего этого двери могут открыться“».'
  '"Ah, delicious amber!"': «Ах, восхитительный янтарь!»
  ? '"Alert, environmental controls are offline on Level Four, Sections 18 through 96.  Access restricted to drones until
    further notice."'
  : «Внимание! Системы контроля за состоянием окружающей среды на четвёртом уровне, в секциях с 18 по 96, вышли из строя.
    До дальнейшего уведомления доступ ограничен только для дронов».
  ? '"Alive without breath, as cold as death, never thirsty ever drinking, all in mail never clinking, ever travelling, never
    walking, mouth ever moving, never talking.  What am I? "'
  : «Живой, но не дышащий, холодный, как смерть, никогда не испытывающий жажды, но всегда пьющий, весь в доспехах, но они
    никогда не звенят, всегда путешествующий, но никогда не идущий, рот всегда шевелится, но никогда не говорит. Что я такое?»
  ? '"Before entering the Planetary Reaction Chamber, please request a pair of Safety Goggles from one of our Drones.  During
    peak hours of operation, this facility can generate enough power to produce a light bright enough to be seen from space.  Please
    avoid looking directly into the light."'
  : «Перед входом в камеру планетарной реакции, пожалуйста, обратитесь к одному из наших дронов, чтобы получить защитные очки.
    В часы пиковой нагрузки данное сооружение может генерировать достаточно энергии для создания света, который виден из космоса.
    Пожалуйста, не смотрите прямо на свет».
  ? '"Blaster weapons provide an effective, accurate ranged attack.  To operate the blaster, hold the grip comfortably in
    your hand, point the barrel at your target, and gently squeeze the trigger.  Should the weapon misfire, do not look into
    the barrel- give the weapon to an instructor and let them fix the problem.  Never point a blaster at something you do
    not want to vaporize."'
  : «Бластерное оружие обеспечивает эффективную и точную атаку на расстоянии. Чтобы воспользоваться бластером, удобно возьмите
    его за рукоятку, наведите ствол на цель и плавно нажмите на спусковой крючок. Если оружие дало осечку, не смотрите в ствол
    — передайте его инструктору, чтобы он устранил неисправность. Никогда не направляйте бластер на то, что вы не хотите испарить».
  ? '"Chief Engineer Wilson�s Personal Log.  I have locked myself in Storage Room #6 but currently have no means of escape.  The
    drone-bots have gone mad and have started killing everyone in sight.  I was able to access the main control terminal on
    Level Four despite warnings of a hazardous leak, and I sent a distress signal, but since we have not had contact with
    any of the colonies for several weeks, I do not believe that a rescue is possible.  I have also managed to seal this facility
    so that the drones can not escape.  It is my hope that the colonists will be able to mount some sort of defense by the
    time my encryption codes are broken.  Tell Emma I love her.  Wilson out."'
  : «Личный журнал главного инженера Уилсона. Я заперся в кладовой № 6, но пока у меня нет возможности выбраться отсюда. Дроны
    сошли с ума и начали убивать всех, кто попадается им на глаза. Мне удалось получить доступ к главному терминалу управления
    на четвёртом уровне, несмотря на предупреждения об опасной утечке, и я отправил сигнал бедствия, но, поскольку мы уже
    несколько недель не выходили на связь ни с одной из колоний, я не верю, что спасение возможно.  Мне также удалось герметизировать
    этот объект, чтобы дроны не смогли сбежать.  Я надеюсь, что к тому моменту, когда мои коды шифрования будут взломаны,
    колонисты смогут организовать какую-то оборону.  Скажите Эмме, что я её люблю.  Уилсон, конец связи».
  ? '"Etched into the tree a message reads:                                                                                                                                                                                                                              The
    fifth is twice the second, five letters in all I reckon!"'
  : '«На дереве вырезано следующее сообщение:                                                                                                                                                                                                                              Пятая
    буква в два раза длиннее второй, всего, по-моему, пять букв!»'
  ? '"Etched into the tree a message reads:                                                                                                                                                                                                                              The
    first is half the forth plus one, better hurry or you''ll be done!"'
  : '«На дереве вырезано следующее сообщение:                                                                                                                                                                                                                              Первое
    — это половина четвертого плюс один, лучше поторопись, а то тебе конец!»'
  ? '"Etched into the tree a message reads:                                                                                                                                                                                                                              The
    forth is eight from the end, Archibald really is your friend!"'
  : '«На дереве вырезано следующее послание:                                                                                                                                                                                                                              Четвертый
    — восьмой от конца, Арчибальд — действительно твой друг!»'
  ? '"Etched into the tree a message reads:                                                                                                                                                                                                                              The
    second is next to the third, oh so pretty like a bird!"'
  : '«На дереве вырезано следующее послание:                                                                                                                                                                                                                              Второе
    находится рядом с третьим, о, как это красиво, словно птичка!»'
  ? '"Etched into the tree a message reads:                                                                                                                                                                                                                              The
    third is the first of twenty six, A through Z you''ll have to mix!"'
  : '«На дереве вырезано следующее послание:                                                                                                                                                                                                                              Третий
    — первый из двадцати шести, от А до Я тебе придётся смешивать!»'
  ? '"Expert Perception is the key and the doors of Baa will let you be.                                                                                                                                                                                                                  The
    Spiral then each head, talk to Baa or you''ll be dead."'
  : «Мнение эксперта — это ключ, и двери Баа откроются перед тобой.                                                                                                                                                                                                                  Затем
    пройди по спирали к каждой голове, поговори с Баа, иначе ты погибнешь».
  '"Follow Baa!  +50,000 Experience."': «Следуй за Баа!  +50 000 очков опыта».
  ? '"Hello and welcome to this self-guided tour of the Varn Planetary Control Facility.  We gladly welcome all visitors.  As
    you arrive at each key area, be sure to check any of our display screens for more information.  Enjoy your tour!"'
  : «Здравствуйте и добро пожаловать на эту самостоятельную экскурсию по Центру управления планетой Варн. Мы рады приветствовать
    всех посетителей. При подходе к каждому ключевому участку обязательно обращайте внимание на наши информационные экраны,
    где вы найдете дополнительную информацию. Желаем вам приятной экскурсии!»
  '"I go through an apple, or point out your way, I fit in a bow, then a target, to stay. What am I?"': «Я пронзаю яблоко
    или указываю тебе путь, я вписываюсь в лук, а потом в мишень, чтобы остаться на месте. Что я такое?»
  '"In case of energy leak, bathe in one of the medicated pools placed for your safety and convenience."': «В случае утечки
    энергии окунитесь в один из лечебных бассейнов, установленных для вашей безопасности и удобства».
  '"Life above all, Accuracy before Might, Endurance before Speed, and finally, Luck."': «Жизнь превыше всего, точность важнее
    силы, выносливость важнее скорости, и, наконец, удача».
  '"The Curator of Kriegspire proclaims, ''For 10,000 gold you shall be healed.''"': '«Куратор Кригспайра провозглашает: „За
    10 000 золотых вы будете исцелены“».'
  '"The Guardian of Kriegspire proclaims, ''For 50,000 gold, the secret will be revealed!''"': '«Хранитель Кригспайра провозглашает:
    „За 50 000 золотых тайна будет раскрыта!“»'
  ? '"The room to your left is the main meeting hall.  Visiting dignitaries from around the world have feasted at banquets
    held in their honor.  In fact, it is said that at his 21st birthday party King Sheridan nearly choked to death on a piece
    of mogred, but was saved by a serving girl who he later married and made his Queen.  Ahh, l�amour."'
  : «Комната слева от вас — главный зал для собраний. Здесь в честь высокопоставленных гостей со всего мира устраивались банкеты.
    Говорят, что на вечеринке по случаю своего 21-летия король Шеридан чуть не подавился кусочком могреда, но его спасла служанка,
    на которой он впоследствии женился и сделал королевой. Ах, любовь».
  ? '"The surface of the obelisk is blood warm to the touch.  A message swims into view as you remove your hand:                                                                                                                                                            _ay,enis_nn_ans."'
  : '«Поверхность обелиска на ощупь тёплая, как кровь. Когда ты убираешь руку, в поле зрения появляется надпись:                                                                                                                                                            _ay,enis_nn_ans.»'
  ? '"The surface of the obelisk is blood warm to the touch.  A message swims into view as you remove your hand:                                                                                                                                                            erbthieaeuu,_o''d"'
  : '«Поверхность обелиска на ощупь тёплая, как кровь. Когда ты убираешь руку, в поле зрения появляется надпись:                                                                                                                                                            erbthieaeuu,_o''d»'
  ? '"This is the main equipment storage and repair facility.  By now, you may have noticed several floating Drone-bots.  They
    are responsible both for maintaining the key systems of this facility as well as sanitation.  If a unit becomes damaged,
    it is brought here to be repaired."'
  : «Это главный центр хранения и ремонта оборудования. К этому моменту вы, возможно, уже заметили несколько парящих дронов-ботов.
    Они отвечают как за обслуживание ключевых систем этого объекта, так и за поддержание чистоты. Если какой-либо аппарат
    повреждается, его доставляют сюда для ремонта».
  ? '"Warning, intruder alert, Level Four, Section.  All drones proceed to Level Four to intercept intruders.  Reactor is
    offline.  Encryption integrity at 2.064%.  Warning, intruder alert, Level Four�"'
  : «Предупреждение, сигнал о вторжении, четвертый уровень, секция. Все дроны — направляйтесь на четвертый уровень для перехвата
    вторгшихся. Реактор отключен. Целостность шифрования — 2,064 %. Предупреждение, сигнал о вторжении, четвертый уровень…»
  ? '"We apologize for any inconvenience, but we ask that all personnel evacuate the facility at this time.  Please do not
    be alarmed.  Thank you."'
  : «Приносим извинения за доставленные неудобства, но просим весь персонал покинуть объект в данный момент.  Пожалуйста,
    не беспокойтесь.  Спасибо».
  ? '"Well, thanks for sneaking me out of the Castle.  Sorry about the circus thing�I hope I wasn�t too much trouble to find.  I�ll
    go in myself so no one will see that it was you who kidnapped me.  Thanks again, and goodbye.  I�ll remember this, and
    I owe you a favor! "'
  : «Ну, спасибо, что вытащил меня из Замка. Извини за всю эту суматоху… Надеюсь, тебя не заставило слишком долго меня искать.
    Я войду сама, чтобы никто не догадался, что это ты меня похитил. Еще раз спасибо и до свидания. Я это запомню, и теперь
    у меня у тебя должок!»
  '"What consumes rocks, levels mountains, destroys wood, pushes the clouds across the sky, and can make a young one old?"': «Что
    разъедает скалы, сглаживает горы, уничтожает лес, гонит облака по небу и способно сделать молодого старым?»
  '"Who told you!  Alright, you may pass!"': «Кто тебе это сказал!  Ладно, можешь пройти!»
  ? '"With painstaking care, you are able to decipher the message of the hieroglyphs, intermixed with diagrams of devils:                                                                                          Remember
    our Enemy, children, and never underestimate the danger they pose.  Though you will never see one during your journey,
    you must be forever vigilant against invasion from the Void once the Voyage has ended.  Mighty beyond words, the Enemy
    is nonetheless vulnerable after a Crossing, for their numbers are small and their defenses weak.  Use the energy weapons
    carried on the Ship to defeat them, and never, ever engage the Enemy with lesser weapons, or you will surely perish."'
  : '«С кропотливой тщательностью вам удастся расшифровать послание, зашифрованное в иероглифах и перемежающееся изображениями
    демонов:                                                                                          Помните о нашем Враге,
    дети, и никогда не недооценивайте опасность, которую он представляет. Хотя вы никогда не увидите ни одного из них во время
    своего путешествия, вы должны всегда оставаться начеку, чтобы противостоять вторжению из Пустоты, как только Путешествие
    закончится.  Несмотря на свою невыразимую мощь, Враг тем не менее уязвим после Перехода, ибо их число невелико, а защита
    слаба.  Используйте энергетическое оружие, имеющееся на Корабле, чтобы победить их, и ни в коем случае не вступайте в
    бой с Врагом, вооружившись менее мощным оружием, иначе вы непременно погибнете».'
  ? '"With painstaking care, you are able to decipher the message of the hieroglyphs:                                                                                                                                                     Though
    the Crossing of the Void be a long and arduous journey, the land you find at the end will be sweet and unspoiled by ancestors
    or the Enemy.  Take heart that your children''s children will live in a perfect world free of war, free of famine, and
    free of fear.  Remember your sacred duty to care for the Ship on her long Voyage and ensure her safe arrival in the Promised
    Land.  Tend well the Guardian and house it securely away from the ship lest both be lost in a single misfortune."'
  : '«С кропотливой тщательностью вам удается расшифровать послание иероглифов:                                                                                                                                                     Хотя
    Переход через Пустоту и будет долгим и тяжёлым путешествием, земля, которую вы найдёте в конце, будет благодатной и нетронутой
    ни предками, ни Врагом.  Будьте уверены: дети ваших детей будут жить в совершенном мире, свободном от войн, голода и страха.  Помни
    о своём священном долге — заботиться о Корабле в его долгом Путешествии и обеспечить его безопасное прибытие в Землю Обетованную.  Бережно
    храни Хранителя и держи его в надёжном месте, вдали от корабля, чтобы не потерять и то, и другое в результате одной беды».'
  ? '"You cannot see me, hear me or touch me.  I lie behind the stars and alter what is real, I am what you really fear, Close
    your eyes and come I near. What am I?"'
  : «Ты не можешь меня увидеть, услышать или прикоснуться ко мне. Я скрываюсь за звёздами и изменяю реальность, я — то, чего
    ты на самом деле боишься. Закрой глаза, и я подойду к тебе. Кто я?»
  '"You drink the water, with no effect."': «Ты пьешь воду, но это не даёт никакого эффекта».
  '"You thumb through the books, but find nothing of interest."': «Ты пролистываешь книги, но ничего интересного не находишь».
