  ? 'Looks like the trophy fell into the hands of Erathia.

    I hear there was quite a fight over it! '
  : 'Похоже, трофей достался Эратии.

    Говорят, за него развернулась настоящая битва!'
  ? 'Looks like the trophy fell into the hands of the Arbiter.

    I hear there was quite a fight over it! '
  : 'Похоже, трофей попал в руки Арбитра.

    Говорят, за него развернулась настоящая схватка!'
  ? 'Lord Stone has not authorized me to vote in your behalf.

    You will need to take this matter up with him.'
  : 'Лорд Стоун не уполномочил меня голосовать от вашего имени.

    Вам придётся обсудить этот вопрос с ним.'
  ? 'Lots of sheep have gone missing since the Baa cult moved in--and I mean lots.

    No doubt they were taken to the Baa temple for sacrifice.

    I''m going to go broke if someone doesn''t do something about those cultists!'
  : 'С тех пор как здесь обосновался культ «Баа», пропало множество овец — и я имею в виду действительно множество.

    Без сомнения, их увезли в храм «Баа» для принесения в жертву.

    Я разорился, если кто-нибудь не примет меры против этих сектантов!'
  Luck +2 (Permanent): Удача +2 (постоянно)
  Magic Gate Open: «Волшебные ворота» открыты
  Magically Refreshing!: По-настоящему освежающе!
  Main Power failed.  Emergency power on.: Сбой основного питания.  Включено аварийное питание.
  Main Power restored.: Основное электроснабжение восстановлено.
  ? 'Master Botham was one of the finest warriors in the First Pirate War.

    Ravenshore owes him a debt of gratitude.

    Botham and his fellow swordsman led the charge against the first wave of Regnans.

    Their Plate armor deflected all but the most serious blows.

    He still teaches Mastery of Plate armor from his home.'
  : 'Мастер Ботам был одним из лучших воинов Первой пиратской войны.

    Рейвеншор обязан ему огромной благодарностью.

    Ботам и его товарищ-фехтовальщик возглавили атаку на первую волну регнанцев.

    Их пластинчатые доспехи отражали все удары, кроме самых сильных.

    Он по-прежнему преподаёт мастерство владения пластинчатыми доспехами у себя дома.'
  ? 'Master Jobber can instruct students of the Dagger to Mastery.

    He lives in the city of Ravenshore.'
  : 'Мастер Джоббер может обучать учеников «Кинжала» до уровня «Мастерство».

    Он живет в городе Рейвеншор.'
  ? 'Master Oberic Nosewort teaches students of the bow in his home in Ravenshore.

    If you seek Mastery of this weapon you must seek him out there.'
  : 'Мастер Оберик Ноузворт обучает искусству владения луком в своём доме в Рейвеншоре.

    Если вы стремитесь овладеть этим оружием, вам нужно найти его там.'
  ? 'Matric Townsaver defended the city of Ravenshore against many Regnan Pirate raids.

    His skill and instruction of the uses of the spear allowed the townsfolk to push the Pirates back. He can instruct you
    to Expert skill level with the spear.'
  : 'Матрик Таунсейвер защищал город Рейвеншор от многочисленных набегов регнанских пиратов.

    Благодаря его мастерству и обучению владению копьем горожанам удалось отбить пиратов. Он может обучить вас владению копьем
    до уровня «Эксперт».'
  Maybe that wasn't such a good idea.: Возможно, это была не самая удачная идея.
  ? 'Medwari Elmsmire makes the finest Leather armor in the realm.

    She also holds the title of Grand Master of Leather Armor and can instruct you at her home in the village of Rust in the
    Ironsand Desert.'
  : 'Медвари Элмсмайр изготавливает лучшие кожаные доспехи во всем королевстве.

    Кроме того, она носит титул Великого мастера по изготовлению кожаных доспехов и может обучить вас этому ремеслу в своём
    доме в деревне Раст, расположенной в пустыне Айронсэнд.'
  ? 'Members of the Shadow Guild have moved down south recently, and have been trying to exert their influence over merchants
    in the area.

    I refused them access to our town, so they kidnapped Sharry Carnegie, an old healer loved by the townspeople, in an attempt
    to �convince� me to let them operate here.

    I can�t believe that their extortion has moved so far south, I thought I was safe from that down here.

    Please rescue Sharry� I can offer you some money as a reward, and I�m sure the townsfolk would appreciate her return.'
  : 'Члены «Гильдии Теней» недавно переместились на юг и пытаются оказать влияние на местных торговцев.

    Я отказал им в доступе в наш город, и тогда они похитили Шэрри Карнеги — старую целительницу, которую очень любят горожане,
    — чтобы «убедить» меня разрешить им вести здесь свою деятельность.

    Не могу поверить, что их вымогательство дошло так далеко на юг — я думал, что здесь, в этих краях, я в безопасности от
    этого.

    Пожалуйста, спасите Шэрри… Я могу предложить вам деньги в качестве вознаграждения, и я уверен, что горожане будут благодарны
    за её возвращение.'
  ? Memory Crystal Alpha � Hermit�s Isle.Memory Crystal Beta � Alamos.Memory Crystal Delta � Darkmoor.Memory Crystal Epsilon
    � Kriegspire.
  : Кристалл памяти «Альфа» — Остров Отшельника. Кристалл памяти «Бета» — Аламос. Кристалл памяти «Дельта» — Даркмур. Кристалл
    памяти «Эпсилон» — Кригспайр.
  Memory module restored.: Модуль памяти восстановлен.
  ? 'Messengers have informed me of your visit with my King.

    I hope you can see now why we are the rightful rulers of Harmondale.

    '
  : 'Посланцы сообщили мне о вашей встрече с моим королём.

    Надеюсь, теперь вы понимаете, почему именно мы являемся законными правителями Хармондэйла.'
  Might +2 (Permanent): Сила +2 (постоянное)
  Might +25 (Temporary): Сила +25 (временно)
  ? 'Mine is the traditional duty to oversee the, um, less than upright business in the Kingdom.

    My House has done this for centuries under the philosophy that such business will always exist and is better watched and
    regulated than not.

    Recently, a man styling himself the ''Prince of Thieves'' has begun to usurp my authority in Free Haven.

    Not only does he challenge my authority, he cooperates with that loathsome new cult that�s sprung up recently�what�s it
    called?

    Moo, or Yak, or Bark�no�whatever.

    Some sort of animal sound.

    Anyway, my sources tell me that this cult plots to overthrow the King and assume power in Enroth.

    This is a bad business, and needs to be stopped.

    You can start by arresting the Prince of Thieves and returning him to me in chains.

    I will, of course, reward you richly.

    '
  : 'На меня возложена традиционная обязанность следить за, э-э, не совсем честными делами в Королевстве.

    Мой Дом занимается этим на протяжении веков, руководствуясь принципом, что такие дела будут существовать всегда и что
    их лучше контролировать и регулировать, чем оставлять без внимания.

    Недавно некий человек, называющий себя «Принцем воров», начал узурпировать мою власть в Свободной гавани.

    Он не только бросает вызов моей власти, но и сотрудничает с той отвратительной новой сектой, которая недавно возникла…
    как она там называется?

    «Му», или «Як», или «Барк»… нет… как там.

    Какой-то животный звук.

    В любом случае, мои источники сообщают, что этот культ замышляет свергнуть короля и захватить власть в Энроте.

    Это плохое дело, и его нужно остановить.

    Вы можете начать с того, что арестуете Принца воров и приведете его ко мне в цепях.

    Я, конечно же, щедро вознагражу вас.'
  ? 'My brother, Elron, was an avid Arcomage player.

    Have you played Arcomage yet?

    Horribly addicting game, if I do say so.

    In any rate, you can only play if you have a deck, and decks are hard to come by� so I guess you probably haven''t.

    In any case, Elron wanted to go over some strategies to help him win more games.

    Unfortunately, he didn''t want to be in town because he didn''t want anyone else to spy on him learn his tricks so he
    went to the White Cliff Caves southeast a bit from town.Elron hasn''t been back in almost a week.

    I''m certain something horrible has happened to him, but if he''s alive I''d like to know that too.

    Would you do me the service of locating him?

    I don''t have a lot of money to pay you back with, but I''d be greatly in your debt.'
  : 'Мой брат Элрон был заядлым игроком в «Аркомадж».

    А ты уже играл в «Аркомадж»?

    Ужасно увлекательная игра, если можно так сказать.

    В любом случае, играть можно только если у тебя есть колода, а колоды достать нелегко… так что, наверное, ты ещё не играл.

    В любом случае, Элрон хотел проработать некоторые стратегии, чтобы чаще выигрывать.

    К сожалению, он не хотел оставаться в городе, чтобы никто не подглядывал за ним и не узнал его хитрости, поэтому он отправился
    в пещеры Белого Утеса, расположенные чуть юго-восточнее города. Элрон не возвращался уже почти неделю.

    Я уверен, что с ним случилось что-то ужасное, но если он жив, я бы тоже хотел это знать.

    Не могли бы вы оказать мне услугу и разыскать его?

    У меня не так много денег, чтобы отплатить вам, но я буду вам безмерно благодарен.'
  ? 'My father Blazen, left here years ago to slay the Skeletal Dragons in the Shadowspire Region. Unfortunately, he has never
    returned.

    He took with him, Ebonest, the greatest Dragon slaying spear ever forged. Charles Quixote has never forgiven my father
    for taking Ebonest with him.

    Unfortunately we have no idea what befell my father.

    Because my father was Charles� second in command and responsible for the loss of Ebonest, Charles is unwilling to promote
    me to Champion, regardless of the merit of my skills. Perhaps if you find Ebonest, Charles with promote your knights and
    myself to Champions!'
  : 'Мой отец Блейзен много лет назад отправился отсюда, чтобы убить Скелетных Драконов в регионе Тень-Шпиль. К сожалению,
    он так и не вернулся.

    Он взял с собой «Эбонест» — величайшее копье для охоты на драконов, когда-либо выкованное. Чарльз Кихот так и не простил
    моему отцу того, что тот взял «Эбонест» с собой.

    К сожалению, мы не имеем ни малейшего представления о том, что случилось с моим отцом.

    Поскольку мой отец был правой рукой Чарльза и несет ответственность за потерю «Эбонеста», Чарльз не желает повысить меня
    до звания Чемпиона, несмотря на мои заслуги и мастерство. Возможно, если вы найдёте «Эбонест», Чарльз повысит ваших рыцарей
    и меня до звания Чемпионов!'
  ? 'My father believed that the Necromancers of Shadowspire were attempting to create an undead Dragon.

    This would be a truly horrid beast. He believed is was his personal duty to stop them.'
  : 'Мой отец считал, что некроманты из Тень-Шпиля пытались создать дракона-нежить.

    Это было бы поистине ужасное чудовище. Он считал своим личным долгом остановить их.'
  ? 'My father sent you to rescue me?

    I am grateful.

    I will return to my father and let him know of your assistance!'
  : 'Мой отец послал тебя, чтобы спасти меня?

    Я тебе благодарен.

    Я вернусь к отцу и расскажу ему о твоей помощи!'
  ? 'My favorite wine is the stuff they give you for winning at the circus.

