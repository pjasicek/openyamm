  The Book of Liches is destroyed: «Книга личей» уничтожена
  ? 'The Cleric sent you back with the Gem of Restoration?

    I am free of this place!

    Search me out if you wish for me to ever travel with you!

    It would be my pleasure to join you in your journeys!

    I will wait for you at the Adventurer''s Inn in Ravenshore.'
  : 'Священник отправил тебя обратно с «Самоцветом восстановления»?

    Я наконец-то свободен от этого места!

    Найди меня, если захочешь, чтобы я когда-нибудь путешествовал с тобой!

    Буду рад присоединиться к тебе в твоих путешествиях!

    Я буду ждать тебя в «Гостинице авантюристов» в Рейвеншоре.'
  The Door Won't Budge: Дверь не поддается
  The Door is locked: Дверь заперта
