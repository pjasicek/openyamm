    на пьедестал возле Сладкой Воды, статуэтку медведя — в Кригспайре, статуэтку орла — в Драконьем Песке, статуэтку волка
    — в Болоте Проклятых, а статуэтку дракона — в Гавани контрабандиста.

    Расстояния слишком велики, чтобы я мог преодолеть их в моём преклонном возрасте, да и к тому же мне нужно подготовиться
    к самому ритуалу.

    Мне ни за что не справиться со всем этим в одиночку; мне нужна твоя помощь.

    Статуэтки находятся в сундуке возле моего дома.

    Поставь их на пьедесталы и вернись ко мне.

    Даже если ритуал провалится, я вознагражу тебя за твои усилия.'
  ? 'Jadame owes you a great debt!

    You have saved the entire world from total destruction!'
  : 'Джадаме в огромном долгу перед тобой!

    Ты спас весь мир от полного уничтожения!'
  ? 'Jasp Hunter is the Master instructor of the axe.

    He can teach you the skills that will lead to Mastery of the axe.

    His home is in the seaside city of Ravenshore.'
  : 'Джасп Хантер — мастер-инструктор по владению топором.

    Он может научить вас навыкам, которые приведут к мастерству в обращении с топором.

