  ? '20 years ago, I won the annual archery competition held at Castle Ironfist, and I have held the championship ever since.

    This gives me the right to promote archers to the title of warrior mage and master archer as I see fit.

    I�ll grant the title of warrior mage to all the archers amongst you if you do me a little favor. I need the key to the
    old Dragon Towers set up near every major settlement in Enroth to shoot down flying creatures.

    I think that they can be set to shoot down only monsters, instead of shooting anything flying through the air. Since this
    is something of a pet project, I will reward honorary warrior mage status to the rest of you.

    The key is in my old keep near the southern entrance to my lands.

    I had to leave it there when the ogres and their companions took it from me a few years ago.

    Return with that key and be rewarded.

    And I won�t be crying in my beer if you kill a lot of those monsters while you�re at it.

    They took my keep!'
  : '20 лет назад я выиграл ежегодные соревнования по стрельбе из лука, проходившие в замке Айронфист, и с тех пор удерживаю
    титул чемпиона.

    Это дает мне право по своему усмотрению присваивать лучникам звания «воин-маг» и «мастер-лучник».

    Я присвою звание «воин-маг» всем лучникам из вашей компании, если вы окажете мне небольшую услугу. Мне нужен ключ от старых
    «Башен Дракона», установленных возле каждого крупного поселения в Энроте для сбивания летающих существ.

    Думаю, их можно настроить так, чтобы они сбивали только монстров, а не всё, что летает в воздухе. Поскольку это своего
    рода мой личный проект, остальным из вас я присвою почетное звание «воин-маг».

    Ключ находится в моей старой крепости у южного входа в мои земли.

    Мне пришлось оставить его там, когда несколько лет назад огры и их союзники отняли у меня эту крепость.

    Вернитесь с этим ключом — и получите награду.

    И я не буду плакать в пиво, если заодно убьёте много этих монстров.

    Они отняли у меня крепость!'
  ? '<Loretta Fleise contacts you via a telepathy spell> Welcome to the Ceremony of the Sun.

    Stand ye in the circle of life and face the north while no shadows stretch before thee.

    Meditate upon this truth:

    �Money is everything.

    I have no truer a friend than money�� <grinning> Just kidding.

    Now, close your eyes, and meditate as you stand at the center of the world and time for just this one, sublime moment�
    <long, silent pause>

    Open your eyes.

    I hereby promote all druids to great druids and all non-druids to honorary druids. <Loretta fades away> '
  : '<Лоретта Флейз связывается с вами с помощью заклинания телепатии> Добро пожаловать на Церемонию Солнца.

    Встаньте в круге жизни и обратитесь лицом к северу, пока перед вами не простираются тени.

    Поразмышляйте над следующей истиной:

    «Деньги — это всё.

    У меня нет более верного друга, чем деньги» <ухмыляется> Шучу.

    А теперь закройте глаза и помедитируйте, стоя в центре мира и времени, всего на этот единственный, возвышенный миг» <длинная,
    тихая пауза>

    Откройте глаза.

    Настоящим я повышаю всех друидов до звания великих друидов, а всех не-друидов — до звания почетных друидов. <Лоретта исчезает>'
  ? '<Wilbur snaps his fingers> Say, you wouldn�t happen to be interested in taking care of a little detail for me, would
    you?

    Lord Kilburn disappeared near Blackshire.

    Find out what you can and return to me with the information.

    If it is true that he has been slain by devils, return his shield to me if at all possible.

    I will grant you my favor with the High Council, should you require it, and you can rest assured your compensation will
    be generous.'
  : '<Уилбур щелкает пальцами> Скажи, ты, случайно, не хотел бы помочь мне уладить одну небольшую деталь?

    Лорд Килберн исчез где-то недалеко от Блэкшира.

    Разберись, что сможешь, и вернись ко мне с информацией.

    Если правда, что его убили демоны, верни мне его щит, если это вообще возможно.

    Я окажу тебе свою поддержку перед Высшим Советом, если тебе это понадобится, и можешь быть уверен, что вознаграждение
    будет щедрым.'
  ? 'A Potion of Pure Luck would be of great assistance to any merchant.

    One could stumble upon any number of great deals if his Luck was at its highest!

    Bring me the basic ingredients for a Potion of Pure Luck and I will reward you well!'
  : 'Зелье чистой удачи стало бы отличным подспорьем для любого торговца.

    Если удача будет на высоте, можно наткнуться на множество выгодных сделок!

    Принесите мне основные ингредиенты для зелья чистой удачи, и я щедро вас вознагражу!'
  ? 'A fork approaches in your path.

    I will only train you after you''ve chosen to walk the lighter path.'
  : 'На твоём пути предстоит разветвление.

    Я начну обучать тебя только после того, как ты выберешь более лёгкий путь.'
  ? 'A good friend of mine, Sherell, went with a group of friends to the islands in Bootleg Bay to explore an old temple rumored
    to be there.

    Her friends returned and said she was captured by cannibals on the island and taken to some ancient temple.

    I�m sure she doesn�t have much time before they do something dreadful to her, please rescue her!'
  : 'Моя хорошая подруга Шерелл отправилась с группой друзей на острова в Гавани контрабандиста, чтобы исследовать старинный храм, который,
    по слухам, там находится.

    Её друзья вернулись и рассказали, что её похитили каннибалы с острова и увезли в какой-то древний храм.

    Я уверена, что у неё осталось совсем мало времени, прежде чем они сделают с ней что-то ужасное. Пожалуйста, спасите её!'
  ? 'A letter from Norbert Thrush the Historian? Let me see it.

    [Lord Markham scans the letter briefly] Hmmmmm�he wants the Peacock feather that was used to sign the Treaty of Pierpont,
    does he.

    Well, seeing as though he has a supposed original of the Treaty, I guess the feather should go to him.

    He has promised me anything else in his collection.

    Take this to him and tell him that I will come collect from him shortly!'
  : 'Письмо от историка Норберта Траша? Дайте-ка посмотреть.

    [Лорд Маркхэм бегло просматривает письмо] Хм… так он хочет перо павлина, которым был подписан Пирпонтский договор, да?

    Что ж, раз у него якобы есть оригинал договора, пожалуй, перо должно достаться ему.

    Он пообещал мне всё остальное из своей коллекции.

    Отнесите это ему и передайте, что я скоро приеду забирать у него!'
  A scrawled message on the brick reads   2=1  3=2  1=3: 'На кирпиче нацарапано сообщение:   2=1  3=2  1=3'
  A strange force reaches out of the wall and grabs you.: Из стены вытягивается какая-то странная сила и хватает тебя.
  A teleporter!: Телепорт!
  A voice hisses -Walk the path of the snake-.: 'Голос шипит: «Иди по пути змеи».'
  ? 'A wanderer came into town.

    Several ruffians sought to relieve this traveler of whatever wealth he possibly possessed. The wanderer barely paid any
    of them much notice.

    With a small flick of his wrist all fell before him.

    Then he walked to the town square and summoned the giant crystal that you''ll find there today.'
  : 'В город пришел странник.

    Несколько хулиганов попытались лишить этого путешественника всего, что у него могло быть. Странник почти не обратил на
    них внимания.

    Одним легким движением запястья он сразил их всех.

    Затем он направился к городской площади и вызвал гигантский кристалл, который вы найдете там сегодня.'
  Access Denied.  All codes must be entered first.: Доступ запрещен. Сначала необходимо ввести все коды.
  Accuracy +2 (Permanent): Меткость +2 (постоянно)
  ? 'Aerie Luodrin currently dwells in Ravenshore.

    She is a most dedicated student of the uses of the Sword and can instruct you to and Expert skill level with the weapon.'
  : 'Эри Луодрин в настоящее время проживает в Рейвеншоре.

    Она — преданная ученица, изучающая искусство владения мечом, и может обучить вас владению этим оружием до уровня «Эксперт».'
  ? Ah yes�"the portals." I have been studying them and the lost culture that built them for years.They were built by the
    civilization that had its day long before the Lizardmen came to inhabit these islands. They were a means of instantaneous
    travel between the islands. Sadly, the power stones needed to operate them are in short supply.
  : Ах да… «порталы». Я уже много лет изучаю их и затерянную культуру, создавшую их. Их построила цивилизация, процветавшая
    задолго до того, как эти острова заселили ящерицы. Они служили средством мгновенного перемещения между островами. К сожалению,
    камни силы, необходимые для их работы, сейчас в дефиците.
  ? 'Ah, you seek to achieve the ultimate in the darker arts.

    The necromancer�s among you seek to turn themselves into Liches, the most potent of necromancers.

    Very well, I can perform this transformation for you, but you must do something for me...and get something for yourselves.

    I require the Lost Book of Khel.

    It contains secrets of necromancy that had been hidden since Khel�s tower sank beneath the waves.

    The Lizardmen of Dagger Wound celebrated when the sea took Khel and his knowledge from us.

    With the volcanic upheaval in that region, I believe the Tower of Khel can be found.

    Retrieve the book from the library and bring it to me!

    Now, for yourselves, you will need a Lich Jar for every necromancer that wishes to become a Lich.

    Zanthora, the Mad Necromancer keeps a large supply of these jars, perhaps she will sell you one!

    If not you must take them from her!'
  : 'Ах, вы стремитесь достичь совершенства в тёмных искусствах.

    Некроманты среди вас стремятся превратиться в личей — самых могущественных из некромантов.

    Хорошо, я могу осуществить это превращение для вас, но вы должны сделать кое-что для меня… и получить кое-что для себя.

    Мне нужна «Потерянная книга Кхела».

    В ней содержатся секреты некромантии, которые оставались сокрытыми с тех пор, как башня Кхела погрузилась в пучину.

    Ящерицы из Даггер-Уаунд ликовали, когда море унесло от нас Кхела и его знания.

    Учитывая вулканическую активность в том регионе, я полагаю, что Башню Кхела можно найти.

    Найдите книгу в библиотеке и принесите её мне!

    Теперь, что касается вас самих, вам понадобится сосуд лича для каждого некроманта, желающего стать личем.

    Зантора, Безумная Некромантка, хранит большой запас таких сосудов, возможно, она продаст вам один!

    Если нет, вам придётся отобрать их у неё!'
  ? 'Ah.

    �Tis a sad day when so noble a Knight should fall to such foul monsters!

    You have done a good thing, bringing his shield to me.

    I shall ensure that he and his men receive all the honors due them.

    I am in your debt, and you have my favor with the council.

    Here is your reward.'
  : 'Ах.

    Какой печальный день — когда столь благородный рыцарь пал от рук таких отвратительных чудовищ!

    Вы поступили правильно, принеся мне его щит.

    Я позабочусь о том, чтобы он и его люди получили все почести, которых они заслуживают.

    Я в долгу перед вами, и вы заслужили мою благосклонность перед советом.

    Вот ваша награда.'
  ? 'Ahhh!

    [The tree sighs happily]

    You have the heart!

    The forest sings with joy!

    Tonight we will recite the song of the ancestors.

    Will you stay and recite with us?'
  : 'Ах!

    [Дерево счастливо вздыхает]

