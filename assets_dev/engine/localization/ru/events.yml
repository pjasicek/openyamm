  The Door will not move: Дверь не сдвигается с места
  The Door won't budge.: Дверь не поддается.
  ? 'The Dragonbane Flower has many medicinal uses.

    It also has some uses that are less than medicinal.

    From this flower we can distill a poison that is deadly to Dragons.

    With it we should be able to make quick work of the Dragon vermin that infest this region.

    Find this flower and return to me with it.

    You will not be disappointed by my reward.'
  : 'Цветок «Драконобой» имеет множество лечебных свойств.

    Однако у него есть и применения, не связанные с медициной.

    Из этого цветка можно извлечь яд, смертельный для драконов.

    С его помощью мы сможем быстро расправиться с драконьей нечистью, заполонившей этот регион.

    Найди этот цветок и вернись ко мне с ним.

    Моя награда тебя не разочарует.'
  ? 'The Dragons of Garrote Gorge are susceptible to a poison that can be distilled from the rare dragonbane flower.

    The flower also is the only means of an antidote for the Dragons.'
  : 'Драконы ущелья Гарроте уязвимы к яду, который можно получить путем дистилляции из редкого цветка «драконобой».

    Этот цветок также является единственным средством, способным служить противоядием для драконов.'
  ? 'The Dragoons that have been plaguing the roads around here recently stole a harp of mine from one of my caravans.

    I�m not strong enough to get it back from them, but I�m willing to pay someone capable to do it for me.

    Find the harp and return it, and I�ll reward you.'
  : 'Драгуны, которые в последнее время терроризируют окрестные дороги, украли мою арфу из одного из моих караванов.

    Я не достаточно силен, чтобы отнять её у них, но готов заплатить тому, кто способен сделать это за меня.

    Найдите арфу и верните её, и я вознагражу вас.'
  ? 'The Drum of Victory needs to be recovered if we are to ever defeat the Dragons in this region.

    If you were to recover the Drum I would reward you well!'
  : 'Чтобы когда-нибудь победить драконов в этом регионе, нам необходимо вернуть «Барабан Победы».

    Если ты вернёшь этот барабан, я щедро вознагражу тебя!'
  ? 'The Heartwood of Jadame is used by the Vampires of the Shadowspire region in the construction of their coffins.

    The Heartwood''s durability provides the coffin''s owner with many years of rest during the daylight hours.'
  : 'Сердцевину дерева Джадаме вампиры региона Тень-Шпиль используют для изготовления своих гробов.

    Благодаря прочности сердцевины владелец гроба может на протяжении многих лет спокойно отдыхать в дневное время.'
  ? 'The Heartwood of Jadame is used by the vampires of the Shadowspire region in the construction of their coffins.

    The Heartwood''s durability provides the coffin''s owner with many years of rest during the daylight hours.'
  : 'Сердцевину дерева Джадаме вампиры региона Тень-Шпиль используют для изготовления своих гробов.

    Благодаря прочности сердцевины владелец гроба может на протяжении многих лет спокойно отдыхать в дневное время.'
  ? 'The Herd of Masul is in debt to you.

    Any Minotaurs in your party are promoted to Minotaur Lord!'
  : 'Стадо Масула в долгу перед вами.

    Все минотавры в вашей группе получают звание «Лорд минотавров»!'
  The Invaders have been defeated!: Захватчики разгромлены!
  ? 'The King of the Dwarves, Snergle, usurped Rocklin for leadership of the dwarven clans.

    Now Rocklin is in exile somewhere and Snergle is in charge.

    Most dwarves don�t like Snergle and would like to see Rocklin back in power.

    Unfortunately, Snergle has claimed both Rocklin�s caverns and the largest dwarven Iron Mine.

    Snergle, fearing treachery near home, has removed me, the Dwarven Weaponmaster, from my position.

    We need someone to get Snergle out of power by any means necessary.

    I�d even consider training you humans how to use an axe like a true dwarf if you�ll help us.'
  : 'Король гномов Снергл отстранил Роклина от власти и захватил руководство над кланами гномов.

    Сейчас Роклин находится где-то в изгнании, а Снергл стоит у руля.

    Большинство гномов не любят Снергла и хотели бы, чтобы Роклин вернулся к власти.

    К сожалению, Снергл захватил как пещеры Роклина, так и крупнейшую гномскую железную шахту.

    Снергл, опасаясь измены вблизи своего дома, отстранил меня, мастера оружия гномов, от должности.

    Нам нужен кто-то, кто сможет лишить Снергла власти любыми необходимыми средствами.

    Я даже готов научить вас, людей, обращаться с топором, как настоящие гномы, если вы поможете нам.'
  ? 'The Lizardman Thadin is the Expert instructor of the use of Leather armor.

    His instruction will give you an Expert skill level with this armor.

    You can find him on the Island of Dagger Wound.'
  : 'Человек-ящерица Тадин — инструктор экспертного уровня по ношению кожаных доспехов.

    После прохождения его обучения вы получите навык «Эксперт» в ношении этих доспехов.

    Вы найдёте его на Острове Кинжальной Раны.'
  ? 'The Mayor here in Mist is considering allowing the Fraternal Order of Silver to police the town in their battle against
    evil.

    I know the Silver Helm Persecution Squads have murdered innocents in their misguided crusade against �evil,� but there
    are no living witnesses to their atrocities.

    I need you to storm their outpost to the south of here to find proof so that I can convince the mayor to ban them from
    Mist.'
  : 'Мэр города Мист рассматривает возможность разрешить «Братству Серебра» обеспечивать правопорядок в городе в рамках их
    борьбы со злом.

    Я знаю, что отряды преследования «Серебряных Шлемов» убивали невинных людей в ходе своего ошибочного крестового похода
    против «зла», но живых свидетелей их злодеяний нет.

    Мне нужно, чтобы ты совершил штурм их аванпоста к югу отсюда и нашёл доказательства, чтобы я смог убедить мэра изгнать
    их из Миста.'
  ? 'The Prophecies of the Sun have never been found.

    They may not event exist. The Prophecies were written by our greatest prophet.

    If they are found it is our hope they will be returned to us!'
  : '«Пророчества Солнца» так и не были найдены.

    Возможно, их и не существует вовсе. Эти пророчества были написаны нашим величайшим пророком.

    Если их найдут, мы надеемся, что их вернут нам!'
  ? 'The Regnan Pirates are a threat to the economy and free travel in Jadame.

    Very few boats ply the sea, for fear of being sunk�or worse!

    When in Ravenshore, I did hear rumors of a small band of smugglers who have been working beneath the notice of the pirates.

    I wonder how they do that!'
  : 'Пираты из Регнана представляют угрозу для экономики и свободного судоходства в Джадаме.

    По морю курсирует очень мало судов — из-за страха быть потопленными… или даже хуже!

    Когда я был в Рейвеншоре, до меня дошли слухи о небольшой группе контрабандистов, которые действуют, оставаясь незамеченными
    пиратами.

    Интересно, как им это удаётся!'
  ? 'The Regnans are the worst slime to ever set foot on the shore of Jadame. They keep the peoples of this continent from
    trading with Erathia and Enroth.

    What choice do we have?

    Even the Merchants of Alvar couldn�t muster a fleet to deal with the pirates.

    Rumor says that there are smugglers around that have found ways around the pirate blockades.'
  : 'Регнаны — самые отвратительные слизи, когда-либо ступавшие на берега Джадаме. Они мешают народам этого континента вести
    торговлю с Эратией и Энротом.

    А какой у нас есть выбор?

    Даже купцы из Альвара не смогли собрать флот, чтобы справиться с пиратами.

    Ходят слухи, что в этих краях есть контрабандисты, которые нашли способы обойти пиратские блокады.'
  ? 'The Regnans call themselves the Empire of the Endless Ocean--trying to make more of themselves than there really is.

    All they are is bullies and bandits.

    Of course, don�t tell them that I said that!'
  : 'Регнаны называют себя «Империей Бесконечного океана» — пытаясь придать себе большее значение, чем они имеют на самом
    деле.

    На самом деле они — всего лишь хулиганы и бандиты.

    Конечно, только не говорите им, что я так сказал!'
  The Sword won't budge!: Меч не сдвигается с места!
  ? 'The Tularean Forest is so old that it has developed a mind�sort of.

    The forest is vaguely aware of who walks through it, but only one part of the forest can communicate with people.

    That''s the oldest tree.

    If you want to have a very long and slow conversation, it will be happy to oblige.

    Look for it on an island to the south east of the forest.

    It''s larger than the rest of the trees.

    You can''t miss it.'
  : 'Туларейский лес настолько древен, что у него, так сказать, сформировалось собственное сознание.

    Лес смутно осознает, кто по нему проходит, но только одна его часть способна общаться с людьми.

    Это самое старое дерево.

    Если вы хотите поговорить с ним очень долго и неторопливо, оно с удовольствием пойдёт вам навстречу.

    Ищите его на острове к юго-востоку от леса.

    Оно больше, чем остальные деревья.

    Его невозможно не заметить.'
  The Well of VARN must be keyed last.: Колодец ВАРН необходимо настроить в последнюю очередь.
  ? 'The Yellow Fever epidemic is over!

    Thank you for your help!'
  : 'Эпидемия желтой лихорадки закончилась!

    Спасибо за вашу помощь!'
  ? 'The actual Peacock feather that was used to sign the Treaty of Pierpont.

    My collection is complete!

    I will be sure to record your activities and deeds correctly and justly so that all will know you as the true Lords of
    Harmondale!'
  : 'Настоящее перо павлина, которым был подписан Пирпонтский договор.

    Моя коллекция в сборе!

    Я обязательно точно и справедливо зафиксирую ваши действия и поступки, чтобы все узнали вас как истинных лордов Хармондейла!'
  The air smells stale and makes you cough.: Воздух пахнет затхлостью и вызывает кашель.
  The bed(s) are empty.: Кровать (кровати) пуста (пусты).
  The bones feel weird (+5 Magic resistance permanent): Кости вызывают странное ощущение (+5 к сопротивлению магии, постоянно)
  The bones feel weird (+5 Might permanent): Кости кажутся странными (+5 к Силе, постоянно)
  The bones feel weird (+5 Poison resistance permanent): Кости кажутся странными (+5 к сопротивлению яду, постоянно)
  The bones seems to charge with electricity !!.: Похоже, кости заряжаются электричеством!!.
  The bowl is empty.: Миска пуста.
  The button will not move: Кнопка не сдвинется с места
  The cabinet is filled with old and broken harvesting tools.: Шкаф забит старыми и сломанными уборочными инструментами.
