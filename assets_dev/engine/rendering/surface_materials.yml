  # New Sorpigal uses large, flat BModel faces, so keep the response restrained:
  # the material layer should separate surface types without turning whole facades
  # into polished plastic. Exact names also avoid changing similarly named content
  # in the other mounted worlds.
  - id: mm6_new_sorpigal_rough_stone
    semantic: generic
    applies_to: [face]
    match:
      texture_names:
        - rblbw
        - rblst
        - rblst1
        - rblle
        - rblre
        - tews
        - tewls
        - tewrs
        - tewrd
        - tewld
        - tewm
        - tav128wl
        - tavle
        - tavre
        - tavctr
        - t1wl5lea
        - t1wl5rea
        - t1wl5lec
        - t1wl5ct
        - t1wl4w
        - t1wl4ctr
        - t1wl1lea
        - t1wl1lea1
        - t1wl1rea
        - t1wl1cts
        - t1w11a
        - cbrdbrck
        - cbmxbrck
        - pbrle
        - pbrre
        - pbrst
        - pbrwn
        - granite
    shading:
      roughness: 0.86
      specular: 0.055
      fresnel_strength: 0.10
      receives_wetness: true
      wetness_response: 0.75
      wet_roughness: 0.20
      wet_darkening: 0.08

