        - t1wl5ct
        - t1wl4w
        - t1wl4ctr
        - t1wl1lea
        - t1wl1lea1
        - t1wl1rea
        - t1wl1cts
        - t1w11a
        - cbmxbrck
        - pbrle
        - pbrre
        - pbrst
        - pbrwn
        - granite
    shading:
      roughness: 0.86
      specular: 0.055
      fresnel_strength: 0.10
      receives_wetness: true
      wetness_response: 0.75
      wet_roughness: 0.20
      wet_darkening: 0.08

