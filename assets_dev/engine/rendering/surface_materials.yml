  # New Sorpigal uses large, flat BModel faces, so keep the response restrained:
  # the material layer should separate surface types without turning whole facades
  # into polished plastic. Exact names also avoid changing similarly named content
  # in the other mounted worlds.
  - id: mm6_new_sorpigal_rough_stone
    semantic: generic
    applies_to: [face]
    match:
      texture_names:
        - rblst
        - rblst1
        - rblle
        - rblre
        - tews
        - tewls
        - tewrs
        - tewrd
        - tewld
        - tewm
        - tav128wl
        - tavle
        - tavre
        - tavctr
        - t1wl5lea
        - t1wl5rea
