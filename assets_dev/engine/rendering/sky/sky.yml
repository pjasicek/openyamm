# Enhanced outdoor sky presets. See level_generation/lighting/SKY_RENDERING.md.
# Colours are linear RGB (0-4); times are game-clock HH:MM and wrap at midnight.
# A preset inherits every value it does not key itself; a keyed value replaces the parent's whole track.
version: 1
transition_seconds: 45
fallback: clear

special:
  underwater: underwater
  red_fog: plane_fire
  always_light: plane_air
  always_dark: always_dark
  rain: rain
  snow: winter_overcast

# MMerge continent weather ladders (continent_settings.txt "Skies, from clear to storm"), by position.
weather_ladder: [clear, fair, cloudy, overcast, rain, storm, storm]

# Map themes recolour whichever preset the weather or sky name selects, so a map keeps its character in every
# weather. Each is derived from the map's name, role, terrain tiles and original sky/fog (see SKY_RENDERING.md).
# sky_tint: zenith/horizon/fog/water sky; sun_tint: sun glow/disc/water glint; cloud_tint: clouds and painted skies;
# saturation (0 grey, 1 unchanged) for sky, fog, sun glow and clouds; haze: minimum wash toward the themed fog colour;
# stars: star brightness scale; preset: pin a preset regardless of weather (special map flags still win).
themes:
  # Ironsand Desert: sand and lava beside the lava lake; original warm fog tint (230, 184, 136).
  scorched: {sky_tint: [1.7, 0.86, 0.4], sun_tint: [1.3, 0.82, 0.5], cloud_tint: [1.5, 0.9, 0.52],
             saturation: 0.6, haze: 0.5, stars: 0.4}
  # Dagger Wound Island, Hermit's Isle: volcanic islands, ash in the air.
  volcanic: {sky_tint: [1.08, 0.9, 0.82], sun_tint: [1.1, 0.88, 0.75], cloud_tint: [1.0, 0.88, 0.82],
             saturation: 1.0, haze: 0.12}
  # Shadowspire, Deyja: necromancer wastes; dead grey-green sky and sickly sun.
  necrotic: {sky_tint: [0.62, 0.68, 0.6], sun_tint: [0.72, 0.8, 0.68], cloud_tint: [0.64, 0.7, 0.62],
             saturation: 0.25, haze: 0.22, stars: 0.5}
  # Mire of the Damned: undead swamp; murky olive haze.
  mire: {sky_tint: [0.8, 0.88, 0.7], sun_tint: [0.95, 0.95, 0.7], cloud_tint: [0.78, 0.84, 0.7],
         saturation: 0.45, haze: 0.32, stars: 0.6}
  # Tatalia: swamp and lowland humidity.
  swamp: {sky_tint: [0.92, 1.0, 0.86], sun_tint: [1.05, 1.0, 0.85], cloud_tint: [0.92, 0.97, 0.88],
          saturation: 0.7, haze: 0.24}
  # Evenmorn Island: haunted, permanent fog in the designer notes; cold blue-grey mist.
  haunted: {sky_tint: [0.82, 0.9, 1.02], sun_tint: [0.85, 0.92, 1.05], cloud_tint: [0.82, 0.88, 0.98],
            saturation: 0.45, haze: 0.4, stars: 0.5}
  # Misty Islands: bright sea mist.
  misty: {sky_tint: [0.98, 1.0, 1.02], cloud_tint: [1.0, 1.0, 1.02], saturation: 0.65, haze: 0.38}
  # Bracada Desert, Dragonsand: bright dry desert; bleached zenith, warm horizon.
  arid: {sky_tint: [1.18, 1.0, 0.8], sun_tint: [1.15, 1.0, 0.8], cloud_tint: [1.1, 1.0, 0.88],
         saturation: 0.8, haze: 0.24}
  # Ravage Roaming, Land of the Giants, Sweet Water: cracked barren wastes; dusty khaki air.
  barren: {sky_tint: [1.06, 0.97, 0.84], sun_tint: [1.08, 0.97, 0.82], cloud_tint: [1.0, 0.95, 0.86],
           saturation: 0.6, haze: 0.2}
  # Mount Nighon, Kriegspire: snow and volcanic rock; grey-red ash.
  ashen: {sky_tint: [0.98, 0.84, 0.8], sun_tint: [1.1, 0.82, 0.7], cloud_tint: [0.85, 0.78, 0.76],
          saturation: 0.5, haze: 0.26, stars: 0.6}
  # Frozen Highlands: snowfields; cold, pale and clean.
  frozen: {sky_tint: [0.9, 0.98, 1.1], sun_tint: [0.95, 0.98, 1.08], cloud_tint: [0.95, 0.99, 1.06],
           saturation: 0.75, haze: 0.14, stars: 1.2}
  # Blackshire, Barrow Downs: werewolf moors and barrows; overcast gloom.
  gloomy: {sky_tint: [0.84, 0.86, 0.94], sun_tint: [0.9, 0.9, 0.95], cloud_tint: [0.8, 0.82, 0.88],
           saturation: 0.55, haze: 0.18}
  # Regna, Emerald Island: tropical seas; deep turquoise.
  tropical: {sky_tint: [0.92, 1.03, 1.08], sun_tint: [1.05, 1.0, 0.92], saturation: 1.15}
  # Murmurwoods, Avlee, Tularean Forest: lush forests; slightly richer colour.
  lush: {sky_tint: [0.97, 1.02, 1.0], saturation: 1.08}
  # Plane Between Planes: the void where the elemental planes meet; violet sky, fire-coloured sun.
  otherworldly: {sky_tint: [0.94, 0.84, 1.06], sun_tint: [1.1, 0.86, 0.94], cloud_tint: [0.98, 0.86, 1.06],
                 saturation: 0.85, haze: 0.15, stars: 1.4}

