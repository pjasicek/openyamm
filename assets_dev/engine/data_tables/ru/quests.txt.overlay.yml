  "1153":
    1: "Доставьте череп Этрика из его могилы к западу от Фри-Хейвена для Габриэля Картмана в Фри-Хейвене."
  "1154":
    1: "Убейте Королеву Пауков в Заброшенном храме в Нью-Сорпигале и верните ее сердце Буфорду Т. Оллману в Нью-Сорпигал."
  "1155":
    1: "Разрушьте алтарь в Монолите к западу от Серебряной бухты и вернитесь к Элеоноре Вандербильт в Серебряной бухте."
  "1158":
    1: "Уничтожьте кристалл в Храме Кулака и вернитесь к Уинстону Шезару в Бухту Бутлег."
  "1160":
    1: "Спасите Эммануэля из Храма Змеи недалеко от Блэкшира и верните его Джоан Кравиц в Блэкшир."
  "1161":
    1: "Найдите потерянный артефакт в Крепости Драгун рядом с замком Темпер и верните его Золтану Фелпсу в Свободную Гавань."
  "1162":
    1: "Спасите Шарри из убежища Гильдии Теней и вернитесь с ней к Фрэнку Фэйрчайлду в Нью-Сорпигал."
  "1163":
    1: "Спасите Анджелу из Заброшенного храма и верните ее Вайолет Доусон в Нью-Сорпигал."
  "1164":
    1: "Спасите Шерелл от каннибалов на островах к востоку от Фри-Хейвена и вернитесь с ней к Карло Тормини в Фри-Хейвен."
  "1165":
    1: "Уничтожьте алтарь Оборотня в Логове Волка и вернитесь к Марии Трепан в Блэкшир."
  "1167":
    1: "Найдите Жемчужину Гниления в Логове Волка и принесите ее Призраку Бальтазара, также в Логове Волка."
  "1168":
    1: "Заберите украшенное драгоценными камнями яйцо из замка Кригспайр и верните его Эмилю Лайму в деревню Кригспайр."
  "1169":
    1: "Снимите защитные чары с дверей в Зале Повелителя Огня и вернитесь к Повелителю Огня."
  "1186":
    1: "Найдите Кристалл Памяти Альфа в Верховном Храме Баа и верните его на модульный алтарь Оракула под Высшим Советом."
  "1187":
