  "1188":
    1: "Найдите Кристалл Памяти Дельта в замке Даркмур и верните его на алтарь модуля Оракула под Высшим советом."
  "1189":
    1: "Найдите Кристалл Памяти Эпсилон в замке Кригспайр и верните его на алтарь модуля Оракула под Высшим советом."
  "1190":
    1: "Заберите Контрольный куб из гробницы Варна в Драконьем Песке и вернитесь к Оракулу под Высшим советом."
  "1224":
    1: "Найдите лекарство от Пройдохи Серебряного Языка в Высшем Храме Баа к востоку от Замка Кригспайр и вернитесь к Уилбуру Хамфри с хорошими новостями."
  "1225":
    1: "Принесите письмо с подробным описанием измены Серебряного Языка Высшему Совету во Фри-Хейвене."
  "1228":
    1: "Найдите и уничтожьте Книгу Личей в замке Даркмур и вернитесь к Терри Росу в деревню Даркмур."
  "1243":
    1: "Поместите статуэтки в Свит-Уотер, Кригспайр, Драконий песок, Болото Проклятых и Бухту Бутлега и вернитесь к Твиллену в Блэкшире."
