rows:
  "3":
    1: "Доставить письмо Дадеросса Элгару Феллмуну в Дом торговцев в Равеншоре."
  "5":
    1: "Убить главаря пиратского аванпоста Регны на островах Кинжальной Раны."
  "7":
    1: "Отнести кристалл портала Брекиша Одноклыка Фредрику Талимэру."
  "9":
    1: "Доставить шантажное письмо Феллмуна Ариону Хантеру, предводителю контрабандистов-крысолюдов. Затем доложить Феллмуну."
  "11":
    1: "Явиться к Бастиану Лудрину, главе Торговой гильдии в Альваре."
  "13":
    1: "Заключить союз между главными фракциями Джадама."
  "14":
    1: "Заключить союз с Гильдией некромантов Шэдоуспайра."
  "15":
    1: "Заключить союз с Храмом Солнца в Мурмурвуде."
  "16":
    1: "Заключить союз с охотниками на драконов из ущелья Гарроты."
  "17":
    1: "Заключить союз с драконами ущелья Гарроты."
  "18":
    1: "Заключить союз с минотаврами Блуждающего Разора."
  "25":
    1: "Найти свидетеля появления огненного озера и привести его в Торговую гильдию Альвара."
  "26":
    1: "Найти преобразователь скелетов в Гильдии некромантов Шэдоуспайра, уничтожить его и вернуться к Оскару Тайру."
  "28":
    1: "Принести Жаровню Ночной Тени Сандро, главе Гильдии некромантов. Жаровня находится в Храме Солнца."
  "30":
    1: "Спасти минотавров, запертых в Логове Бальтазара в Блуждающем Разоре."
  "31":
    1: "Забрать драконье яйцо из крепости Зога в Блуждающем Разоре и отнести его Чарльзу Кихоту в ущелье Гарроты."
  "33":
    1: "Найти драконье яйцо и отнести его предводителю драконов Ловкому Когтю Редриверу."
  "36":
    1: "Потопить флот Регны и вернуться в зал Совета в Равеншоре."
  "39":
    1: "Найти Каури Блэкторн, затем вернуться к Дантилиону в Мурмурвуд и сообщить, где она находится."
  "41":
    1: "Принести Ксантору Сердце Воды с Плана Воды."
  "42":
    1: "Принести Ксантору Сердце Воздуха с Плана Воздуха."
  "43":
    1: "Принести Ксантору Сердце Земли с Плана Земли."
  "44":
    1: "Принести Ксантору Сердце Огня с Плана Огня."
  "46":
    1: "Пройти через Кристальные врата и выяснить причину катаклизма."
  "48":
    1: "Освободить Пираннаста, Владыку Огня."
  "50":
    1: "Освободить Гралкора Жестокого, Владыку Земли."
  "52":
    1: "Освободить Акваландера, Владыку Воды."
  "54":
    1: "Освободить Шалвенда, Владыку Воздуха."
  "61":
    1: "Положить прах Вайлбайта в гробницу деревни Раст и вернуться к Овердюну."
  "68":
    1: "Найти древнюю родину троллей и вернуться к Вологу Сэндволду в Пустыню Железных Песков."
  "70":
    1: "Найти Блейзена Стормланса и забрать копьё Эбонест. Вернуться к Лиан Стормланс в ущелье Гарроты и передать Эбонест Чарльзу Кихоту."
  "72":
    1: "Расспросить Дервиша Шеврона в Равеншоре о лекарстве для Блейзена Стормланса."
  "74":
    1: "Убить всех истребителей драконов и вернуть меч Вислбона Истребителя Ловкому Когтю Редриверу в ущелье Гарроты."
  "76":
    1: "Найти Топор Бальтазара в шахтах тёмных гномов, показать его Дадероссу и вернуть Тессалару, наследнику вождя стада минотавров."
  "78":
    1: "Найти Пророчества Солнца в Заброшенном храме и отнести их Стивену."
  "80":
    1: "Найти саркофаг и останки Корбу и вернуть их Латеану в Шэдоуспайре."
  "82":
    1: "Найти утраченную Книгу Кхела и вернуть её Вертринусу в Шэдоуспайре."
  "85":
    1: "Найти Дадеросса, минотавра — главу вашего торгового каравана. В последний раз он собирался поговорить с вождём деревенского клана."
  "91":
    1: "Посоветоваться о кристалле Равеншора с Ксантором, придворным мудрецом Железных Кулаков."
  "101":
    1: "Доставить свитки Исцеления болезни в шесть хижин на внешних островах Кинжальной Раны и вернуться к Айслен на главном острове."
  "109":
    1: "Найти освящённое зелье и отнести его Лэнгвиду на острова Кинжальной Раны."
  "111":
    1: "Принести Хиссу из деревни Кровавая Капля Идола Змеи из Заброшенного храма."
  "113":
    1: "Принести Тистлу с островов Кинжальной Раны основные ингредиенты для зелья Чистой скорости."
  "115":
    1: "Принести Риханси в Альвар основные ингредиенты для зелья Чистой удачи."
  "117":
    1: "Доставить поддельный доклад Ужасному пирату Стэнли в таверну «Пиратский привал» на острове Регна."
  "119":
    1: "Спасти дочь Ариона Хантера из крепости огров в Альваре."
  "121":
    1: "Принести Талиону в Пустыне Железных Песков основные ингредиенты для зелья Чистой выносливости."
  "123":
    1: "Принести Кельвину в Шэдоуспайре основные ингредиенты для зелья Чистого интеллекта."
  "125":
    1: "Принести Кастигейру в Мурмурвуде основные ингредиенты для зелья Чистой личности."
  "127":
    1: "Найти щит Затмение для Латиуса в Равеншоре."
  "129":
    1: "Убить всех огров в каньоне Альвара и в крепости огров, затем вернуться к Келдону в Альвар."
  "132":
    1: "Принести Гальвинусу в Блуждающем Разоре основные ингредиенты для зелья Чистой меткости."
  "135":
    1: "Найти Пророчества Змеи для Пасцеллы Тиск."
  "137":
    1: "Найти Истрика Языка, брата Ротнакса, и вернуться к Ротнаксу в деревню Кровавая Капля на островах Кинжальной Раны."
  "139":
    1: "Убить всех лютых волков в Равеншоре и вернуться к Мэддигану."
  "142":
    1: "Доставить зелья сопротивления огню в шесть самых южных домов деревни Раст и вернуться к Хоберту."
  "150":
    1: "Найти цветок Драконьей погибели для Калиндриля в ущелье Гарроты."
  "152":
    1: "Найти цветок Драконьей погибели для Балиона Рваное Крыло в драконьих пещерах ущелья Гарроты."
  "154":
    1: "Убить всех драконов в окрестностях ущелья Гарроты и вернуться к Авалону."
  "157":
    1: "Убить всех охотников на драконов в окрестностях ущелья Гарроты и вернуться к Джерину Огненный Глаз в драконьи пещеры."
  "160":
    1: "Найти легендарный Барабан Победы и вернуть его Зелиму в ущелье Гарроты."
  "162":
    1: "Найти шкатулку-головоломку Исельдира для Бенефиса из Шэдоуспайра."
  "164":
    1: "Найти флакон могильной земли и вернуть его Халиену в Шэдоуспайр."
  "166":
    1: "Найти Кость Судьбы для Тентилиона из Шэдоуспайра."
  "172":
    1: "Бросить вызов чемпиону Аркомага в каждой таверне Джадама."
  "173":
    1: "Победить в Аркомаг во всех одиннадцати тавернах, затем вернуться к Тонку Блюсвану в Равеншор."
  "176":
    1: "Найти круг сыра Фреландо и отнести его Асаэлю Фромаго в Альвар."
  "177":
    1: "Найти головку сыра Элденбри и отнести её Асаэлю Фромаго в Альвар."
  "178":
    1: "Найти шар сыра Дандак и отнести его Асаэлю Фромаго в Альвар."
  "236":
    1: "Найти сокровище Ужасного пирата Стэнли."
  "284":
    1: "Вернуться к Феллмуну в Равеншор и доложить об успешном шантаже Ариона Хантера, контрабандиста-крысолюда."
