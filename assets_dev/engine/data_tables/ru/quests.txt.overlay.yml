    1: "Выпейте из Фонтана Магии и вернитесь к лорду Альберту Ньютону в Тумане."
  "1136":
    1: "Заберите Кристалл Терракса и вернитесь к лорду Альберту Ньютону в Туман."
  "1137":
    1: "Уничтожьте заставу Дьявола и вернитесь к лорду Озрику Темперу в замок Темпер."
  "1138":
    1: "Получите у Чедвика рекомендацию в рыцари и вернитесь к лорду Озрику Темперу в замок Темпер."
  "1139":
    1: "Победите Военачальника и принесите доказательства Осрику Темперу."
  "1140":
    1: "Установите цены во всех девяти конюшнях королевства и вернитесь к леди Флейзе в Серебряную бухту."
  "1142":
    1: "Посетите Алтарь Солнца в круге камней к северу от Серебряной бухты в день равноденствия или солнцестояния (Подсказка: 20 марта — день равноденствия)."
  "1143":
    1: "Посетите Алтарь Луны в Храме Луны в полночь полнолуния."
  "1144":
    1: "Положите конец зиме для лорда Стромгарда в замке Стромгард и вернитесь к нему с хорошими новостями."
  "1145":
    1: "Добудьте ключ от Башен Дракона в Крепости Ледяного Ветра к югу от Уайткепа и отнесите его лорду Стромгарду в замок Стромгард."
  "1146":
    1: "Перенастройте все Драконьи башни в городах и вернитесь к лорду Стромгарду в замок Стромгард."
