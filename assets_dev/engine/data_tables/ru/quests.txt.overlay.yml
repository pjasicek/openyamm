    1: "Убейте Снергла в Пещерах Снергла и вернитесь с его топором к Авинрилу Смайтерсу в таверну «Призрак» в Болоте Проклятых."
  "1149":
    1: "Штурмуйте заставу «Серебряный Шлем» возле Тумана и верните констеблю Тумана доказательства их порчи."
