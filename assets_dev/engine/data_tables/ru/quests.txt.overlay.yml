  "556":
    1: "Разрушить Алтарь Добра в Храме Солнца на острове Эвенморн и вернуться к Дэдалу Фальку в Пустоши Дейи."
  "557":
    1: "Собрать шесть частей голема, оживить его и вернуться к Томасу Грею в Школу Чародейства."
  "559":
    1: "Найти Книгу Божественного Вмешательства в Зоне размножения в Яме и вернуть её Томасу Грею в Школу Чародейства."
  "560":
    1: "Забрать сосуды личей с Испытательного полигона в Селесте и принести их Халфгилду Винаку в Яму."
  "561":
    1: "Посетить три монолита Стоунхенджа в Таталии, на островах Эвенморн и в Авли, затем вернуться к Энтони Грину в Туларейский лес."
  "566":
    1: "Забрать останки короля гномов из туннелей между Каменным городом и Нигоном, предать их земле в Курганных холмах и вернуться к Энтони Грину в Туларейский лес."
  "567":
    1: "Забрать драконье яйцо из Драконьей пещеры в Стране Великанов и вернуть его Тору Анвину на горе Нигон."
  "587":
    1: "Очистить замок Хармондейл и вернуться к дворецкому в таверне «За счёт заведения» в Хармондейле."
  "588":
    1: "Спасти гномов из шахт Красного гнома и вернуться к королю гномов в Каменный город в Курганных холмах."
  "589":
    1: "Забрать планы из форта Риверстрайд и доставить их Элдричу Парсону в замок Наван в Туларейском лесу."
  "590":
    1: "Спасти Лорена Стила из Туларейских пещер в Туларейском лесу и доставить его королеве Кэтрин."
  "591":
    1: "Забрать Трубу Грифонхарта с поля битвы в Туларейском лесу и передать выбранной стороне."
  "606":
    1: "Передать поддельные планы форта Риверстрайд Элдричу Парсону в замке Наван в Туларейском лесу."
  "607":
    1: "Доставить самозванца Лорена королеве Кэтрин в замок Грифонхарт в Эратии."
  "613":
    1: "Пройти Стены Тумана, не убив ни одного противника, и вернуться к Гэвину Магнусу в замок Ламбент в Селесте."
  "615":
    1: "Забрать части алтаря из Храма Света в Селесте и Храма Тьмы в Яме и вернуть их Ресуректре в замок Ламбент в Селесте."
  "616":
    1: "Отправиться в колонию Зод в Стране Великанов и убейте Ксенофекса, а затем вернуться к Ресуректре в замке Ламбент в Селесте."
  "618":
    1: "Исследовать винный погреб в Таталии и вернуться к Крэгу Хаку в замке Ламбент в Селесте."
  "620":
    1: "Забрать сосуды душ из Сумеречного замка в Яме и вернуть их сэру Канегему в Селесту."
  "621":
    1: "Убить Толберти в его доме в Яме и вернуть его контрольный куб Роберту Мудрому в Селесте."
  "634":
    1: "Забрать части алтаря из Храма Света в Селесте и Храма Тьмы в Яме и вернуть их Касторе в Яму."
  "635":
    1: "Отправиться в колонию Зод в Стране Великанов, убить Ксенофекса и вернуться к Касторе в Яму."
  "636":
    1: "Забрать сосуды душ у чернокнижников на горе Громовой Кулак и принести их Максимусу в Яму."
  "637":
    1: "Снять защиту от телепортации в лаборатории Кланкера и вернуться к Тёмной Тени в Яму."
  "639":
    1: "Забрать контрольный куб у Роберта Мудрого в его доме в Селесте и принести куб Толберти в Яму."
  "640":
    1: "Завершите Зону размножения и вернуться к Арчибальду в Яму."
  "642":
    1: "Отправиться к «Линкольну» в море к западу от Авли, заберите колебательный двигатель и вернуть его Ресуректре в Селесте."
  "643":
    1: "Добраться до «Линкольна» в море к западу от Авли, забрать колебательный двигатель и принести его Касторе."
  "658":
    1: "Поговорить с гномами в Каменном городе в Курганных холмах и узнать, как восстановить замок Хармондейл."
  "663":
    1: "Войти в Яму через Зал Ямы в Пустошах Дейи и поговорить с Арчибальдом в Сумеречном замке."
  "664":
    1: "Войти в Селесту из огромного телепорта в пустыне Бракада, затем поговорите с Гэвином Магнусом в замке Ламбент в Селесте."
  "665":
    1: "Выбрать судью, который сменит судью Грея на посту арбитра Хармондейла."
  "667":
    1: "Забрать Фонарь Света из Курганных холмов и вернуть его Тарину Витерну в Хармондейл."
  "668":
    1: "Забрать останки Халдара из Лабиринта в Нигоне и вернуть их Мазиму Даску."
  "669":
    1: "Забрать кольцо-печатку Даврика из Бандитских пещер на северо-востоке Эратии и вернуть Даврику Пеладиуму в Хармондэйл."
  "670":
