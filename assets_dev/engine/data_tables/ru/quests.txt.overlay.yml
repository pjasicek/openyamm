    1: "Отправляйтесь в поместье лорда Маркхэма в Таталии, украдите там вазу и отнесите её Уильяму Ласкеру в канализацию Эрафии."
  "531":
    1: "Отправляйтесь к Сторожевой башне № 6 в Пустошах Дейи и перенесите груз с верхнего этажа на нижний. Затем вернитесь к Уильяму Ласкеру в канализацию Эрафии."
  "533":
    1: "Отправляйтесь в Небесный Двор в Селесте и убейте леди Элеонору Кармин.  Вернитесь с доказательствами к Секниту Подтенью в Пустошах Дейи."
  "534":
    1: "Убейте Ромтракса Бессердечного в его пещере в Таталии, затем поговорите с сэром Чарльзом Кихотом."
  "536":
    1: "Спасите Алису Харгривз из Башни Уильяма в Пустошах Дейи, а затем поговорите с сэром Чарльзом Кихотом."
  "538":
    1: "Захватите Алису Харгривс из ее резиденции в замке Грифонхарт и доставьте ее в Башню Уильяма в Дейских болотах."
  "539":
    1: "Найдите затерянное место для медитации в Гномьих курганах."
  "540":
    1: "Отправляйтесь в Храм Баа в Авли и убейте Верховного Жреца Баа, затем вернитесь к Варфоломею Хьюму в Хармондейл."
  "541":
    1: "Взломайте код в Школе чародейства в пустыне Бракада, чтобы узнать местонахождение гробницы Ашвара Ног'Ногота. Найдите гробницу, войдите в неё, а затем вернитесь к Стефану Сэнду в Яму."
  "542":
    1: "Заберите идеальный лук из Цитадели Титанов в Авли и верните его Лоуренсу Марку в Хармондейл."
  "543":
    1: "Выведите из строя лифт в шахтах Красного гнома в пустыне Бракада, а затем вернитесь к Стигалу Снику в Авли."
  "544":
    1: "Заберите идеальный лук из Цитадели Титанов в Авли и верните его Стигалу Снику в Авли."
  "545":
    1: "Выиграйте пять испытаний на арене, а затем вернитесь к Леде Роуэн в пустыне Бракада."
  "546":
    1: "Уничтожьте всю нежить в Доме с привидениями в Курганных холмах и вернитесь к Фредерику Оргу в Эрафию."
  "547":
    1: "Совершите набег на эльфийскую сокровищницу в замке Наван в Туларийском лесу и вернитесь к Фредерику Оргу в Эрафию."
  "548":
    1: "Успокойте деревья Туларийского леса, поговорив со Старейшим деревом, а затем вернитесь к Лисандру Свиту в пустыню Бракада."
  "549":
    1: "Разгадайте секрет входа в Курган Фей в Авли и поговорите с Королем Фей."
  "550":
    1: "Соберите награды на 10 000 золотых от охотников за головами в ратушах, а затем вернитесь к Эбеднезеру Сеятелю в Туларийский лес."
  "551":
    1: "Найдите Сердце леса в Гильдии наёмников в Таталии и верните его Старейшему дереву Туларийского леса."
  "554":
    1: "Очистите Алтарь зла в Храме Луны на острове Вечернего утра, а затем вернитесь к Ребекке Дивайн в Селесте."
  "555":
    1: "Найдите потерянную пиратскую карту в Пещерах Приливной Воды в Таталии и вернитесь к Дедалу Фальку в Пустоши Дейи."
  "556":
    1: "Разрушьте Алтарь Добра в Храм Солнца на острове Вечернего утра, а затем вернитесь к Дедалу Фальку в Пустоши Дейи."
  "557":
    1: "Соберите шесть частей голема и постройте цельного голема, а затем вернитесь к Томасу Грею в Школу Чародейства."
  "559":
    1: "Найдите Книгу Божественного Вмешательства в Зоне размножения в Яме и верните ее Томасу Грею в Школу Чародейства."
  "560":
    1: "Заберите кувшины с личами на полигоне в Селесте и принесите их Халфгильд Винаку в Яму."
  "561":
    1: "Посетите три монолита Стоунхенджа в Таталии, на островах Вечернего Моря и Авли, а затем вернитесь к Энтони Грину в Туларийский лес."
  "566":
    1: "Достаньте кости Короля гномов из туннелей между Каменным городом и Нигоном и поместите их в надлежащее место упокоения в Курганных холмах, а затем вернитесь к Энтони Грину в Туларийский лес."
  "567":
    1: "Достаньте драконье яйцо из Драконьей пещеры в Стране Великанов и верните его Тору Анвину на горе Нигон."
  "587":
    1: "Очистите замок Хармондейл и вернитесь к дворецкому в таверне «За счёт заведения» в Хармондейле."
  "588":
    1: "Спасите гномов из шахт Красного гнома и вернитесь к королю гномов в Каменный город в Курганных холмах."
  "589":
    1: "Достаньте планы из форта Риверстрайд и верните их Элдричу Парсону в замок Наван в Туларийском лесу."
  "590":
    1: "Спасите Лорена Стила из туларских пещер Туларийского леса и верните его королеве Екатерине."
  "591":
    1: "Заберите Трубу Грифонхарта из битвы в Туларийском лесу и верните ее той стороне, которую выберете."
  "606":
    1: "Передайте поддельные планы форта Риверстрайд Элдричу Парсону в замке Наван в Туларийском лесу."
  "607":
    1: "Доставьте самозванца Лорена королеве Екатерине в замок Грифонхарт в Эрафии."
  "613":
    1: "Пройдите Стены Тумана, не убив ни одного противника, и вернитесь к Гэвину Магнусу в замок Ламбент в Селесте."
  "615":
    1: "Заберите алтарь из Храма Света в Селесте и Храма Тьмы в Яме и верните их Ресуректре в Замке Ламбент в Селесте."
  "616":
    1: "Отправляйтесь в колонию Зод в Стране Великанов и убейте Ксенофекса, а затем вернитесь к Ресуректре в замке Ламбент в Селесте."
  "618":
    1: "Исследуйте винный погреб в Таталии и вернитесь к Крэгу Хаку в замке Ламбент в Селесте."
  "620":
    1: "Заберите ящик с банками душ из Сумрачного замка в Яме и вернитесь к сэру Канегему в Селесту."
  "621":
    1: "Убейте Толберти в его доме в Яме и верните его контрольный куб Роберту Мудрому в Селесте."
  "634":
    1: "Заберите алтарь из Храма Света в Селесте и Храма Тьмы в Яме и верните их Касторе в Яме."
  "635":
    1: "Отправляйтесь в колонию Зод в Стране Великанов и убейте Ксенофекса, а затем вернитесь к Касторе в Яме."
  "636":
    1: "Заберите ящик с сосудами душ у чернокнижников на горе Громовой Кулак и принесите его Максимусу в Яму."
  "637":
    1: "Уничтожьте магическую защиту внутри Лаборатории Кланка и вернитесь к Дарк Шейду в Яму."
  "639":
    1: "Убейте Роберта Мудрого в его доме в Селесте и вернитесь к Толберти в Яму."
  "640":
    1: "Завершите Зону размножения и вернитесь к Арчибальду в Яму."
  "642":
    1: "Отправляйтесь к «Линкольну» в море к западу от Авли, заберите колебательный двигатель и верните его Ресуректре в Селесте."
  "643":
    1: "Отправляйтесь к «Линкольну» в море к западу от Авли, заберите колебательный двигатель и верните его Касторе в Яме."
  "658":
    1: "Поговорите с гномами в Каменном городе в Курганах, чтобы найти способ починить замок Хармондейл."
  "663":
    1: "Войдите в Яму из Зала Ямы в Пустошах Дейи, затем поговорите с Арчибальдом в Сумеречном замке в Яме."
  "664":
    1: "Войдите в Селесту из огромного телепорта в пустыне Бракада, затем поговорите с Гэвином Магнусом в замке Ламбент в Селесте."
  "665":
    1: "Выберите судью, который сменит судью Грея на посту арбитра в Хармондейл."
  "667":
    1: "Заберите Фонарь Света из Курганных холмов и верните его Тарину Витерну в Хармондейл."
  "668":
    1: "Достаньте останки Халдара из лабиринта в Нигоне и верните их Мазиму Даску в Нигон."
  "669":
    1: "Достаньте кольцо-печатку Даврика из Бандитских пещер на северо-востоке Эрафия и верните его Даврику Пеладиуму в Хармондейл."
  "670":
    1: "Отнесите запечатанное письмо лорду Маркхэму в поместье лорда Маркхема в Таталии для коллекционера Норберта Траша."
  "671":
    1: "Верните перо Парсона Норберту Трашу в Эрафии."
  "691":
    1: "Отнесите запечатанное письмо Королю Фей в Зале под Холмом в Авли."
  "692":
    1: "Отнесите волшебные свирели Иоганну Керриду в Туларийский лес."
  "693":
    1: "Отправляйтесь в Гильдию наемников в Таталии и в течение двух недель поговорите с Найлсом Стэнтли."
  "694":
    1: "Украдите гобелен из замка вашего товарища и верните его Найлзу Стэнтли в Гильдию наемников в Таталии."
  "698":
    1: "Убейте всех троглодитов под Каменным городом и вернитесь к Искре Бернкиндлу в Каменный город."
  "699":
    1: "Убейте всех грифонов в Эрафии и пустыне Бракада и вернитесь к Сету Драксону в Пустоши Дейи."
  "706":
    1: "Узнайте судьбу брата Даррона в пещерах Белых скал, а затем вернитесь к Даррону Темперу в Хармондейл."
  "707":
    1: "Заберите из Зала Ямы сезонную палантину и верните ее Гэри Зимму в пустыню Бракада."
  "712":
    1: "Достаньте три статуэтки и поместите их в святыни в пустыне Бракада, Таталии и Авли, а затем вернитесь к Тому Лумбре в Туларийский лес."
  "716":
    1: "Найдите три картины и верните их Фердинанду Висконти в Таталию."
  "717":
    1: "Одержите победу в Аркомаге во всех тринадцати тавернах, а затем вернитесь к Джине Барнс в Эрафию."
  "757":
    1: "Поздравления"
  "1105":
    1: "Покажите письмо Салмана Андоверу Потбелло в Нью-Сорпигале."
  "1106":
    1: "Принесите письмо Салмана регенту Уилбуру Хамфри в замок Айронфист."
  "1107":
    1: "Найдите комбинацию, ведущую к двери хранилища в Гоблинвотче, и вернитесь в ратушу в Нью-Сорпигале."
  "1108":
    1: "Возьмите колокол гармонии из храма Баа и вернитесь в ратушу Новой Сорпигалии."
  "1110":
    1: "Найдите Щит лорда Килберна и вернитесь к Уилбуру Хамфри в замок Айронфист, чтобы доложить об этом."
  "1112":
    1: "Спасите девушку, попавшую в беду, и вернитесь с ней к Уилбуру Хамфри в замок Айронфист."
  "1113":
    1: "Убейте Длинного Клыка Сухошкура в его пещере возле замка Даркмур и вернитесь к Уилбуру Хамфри в замок Айронфист."
  "1114":
    1: "Развлеките Николая."
  "1119":
    1: "Найдите и верните принца Николая в замок Айронфист."
  "1120":
    1: "Найдите Третий глаз и принесите его принцу Николаю в замок Айронфист."
  "1122":
    1: "Схватите Принца Воров и приведите его к лорду Энтони Стоуну в Замке Стоун."
  "1129":
    1: "Наймите каменотеса и плотника, приведите их к Храмовому камню в Фри-Хейвене, чтобы отремонтировать Храм, а затем вернитесь к лорду Энтони Стоуну в Каменный замок."
  "1131":
    1: "Возьмите Священную Чашу у монахов в их островном храме к востоку от Фри-Хейвена, верните ее Храмовому Камню во Фри-Хейвене, а затем вернитесь к Лорду Стоуну в Замке Стоуна."
  "1134":
    1: "Найдите и верните «Песочные часы времени» лорду Альберту Ньютону в Тумане."
