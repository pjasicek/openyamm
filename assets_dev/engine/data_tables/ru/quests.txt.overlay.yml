  "541":
    1: "Взломайте код в Школе чародейства в пустыне Бракада, чтобы узнать местонахождение гробницы Ашвара Ног'Ногота. Найдите гробницу, войдите в неё, а затем вернуться к Стефану Сэнду в Яму."
