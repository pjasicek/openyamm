    1: "Ограбить эльфийскую сокровищницу в замке Наван в Туларейском лесу и вернуться к Фредерику Оргу в Эратию."
  "548":
    1: "Успокоить деревья Туларейского леса, поговорив со Старейшим деревом, и вернуться к Лисандру Свиту в пустыню Бракада."
  "549":
    1: "Разгадать секрет входа в Курган Фей в Авли и поговорить с Королем Фей."
  "550":
    1: "Получить в ратушах награды за головы на общую сумму 10 000 золотых и вернуться к Эбеднезеру Соуеру в Туларейский лес."
  "551":
    1: "Найти Сердце леса в Гильдии наёмников в Таталии и вернуть его Старейшему дереву Туларейского леса."
  "554":
    1: "Очистить Алтарь Зла в Храме Луны на острове Эвенморн и вернуться к Ребекке Дивайн в Селесту."
  "555":
