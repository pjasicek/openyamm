    1: "Отправиться к Сторожевой башне № 6 в Пустошах Дейи, перенести груз с верхнего этажа на нижний и вернуться к Уильяму Ласкеру в канализацию Эратии."
  "533":
    1: "Отправиться в Небесный двор в Селесте, убить леди Элеонору Кармин и принести доказательство Секниту Подтенью в Пустоши Дейи."
