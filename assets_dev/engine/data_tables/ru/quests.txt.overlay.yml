    1: "Забрать идеальный лук из Цитадели Титанов в Авли и вернуть его Лоуренсу Марку в Хармондейл."
  "543":
    1: "Выведите из строя лифт в шахтах Красного гнома в пустыне Бракада, а затем вернуться к Стигалу Снику в Авли."
  "544":
    1: "Забрать идеальный лук из Цитадели Титанов в Авли и вернуть его Стигалу Снику в Авли."
  "545":
    1: "Выиграть пять испытаний на арене, а затем вернуться к Леде Роуэн в пустыне Бракада."
