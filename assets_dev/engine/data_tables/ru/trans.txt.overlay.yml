rows:
  "1":
    1: "Склепы вампиров обычно хорошо скрыты. То, что вампиры Шэдоуспайра действуют так открыто, свидетельствует об их могуществе в этих краях."
    2: "Склеп вампиров, 32"
  "2":
    1: "Погребальный курган. Хотя двери явно не одно столетие, инкрустация и позолота на них чисты и не потускнели. Должно быть, их сохраняет магия."
    2: "Склеп Корбу, 37"
  "3":
    1: "Когда лорд Бринн скончался, его смерть оплакивали по всей стране. Его могила — святое место, которое посещают паломники и другие почитатели."
    2: "Гробница лорда Бринни, 39"
  "4":
    1: "Вы обнаруживаете проход, ведущий вниз. Войти?"
    2: "Проход под Регной, 44"
  "5":
    1: "По всей видимости, вулкан поднял это древнее сооружение со дна моря. Кто же были его загадочные строители?"
    2: "Поднятая библиотека, 51"
  "6":
    1: "Альварианские тёмные гномы появились в этих краях совсем недавно. Однако за короткое время они построили обширную систему шахт."
    2: "Поселение тёмных гномов, 52"
  "8":
    1: "Судя по всему, в этих пещерах обитает огромный дракон.  Трупы, лежащие рядом с его логовом, возможно, принадлежат искателям приключений, которые пытались добыть сокровища дракона."
    2: "Драконья пещера (область 12)"
  "9":
    1: "Огромные размеры и роскошное убранство поместья лорда Маркхэма создают поразительный контраст со скромными крестьянскими домами и хижинами, расположенными поблизости."
    2: "Усадьба лорда Маркхэма"
  "10":
    1: "Судя по мусору и гниющим отходам снаружи, многие поколения бандитов использовали эту пещеру, чтобы скрываться от закона."
    2: "Пещеры бандитов"
  "11":
    1: "Когда-то это был величественный особняк, но его прежние владельцы уже давно покинули этот старый дом.  Судя по всему, нынешние жильцы не особо заботятся о его состоянии."
    2: "Особняк с привидениями"
  "12":
    1: "Вход в этот курган радует глаз, но в то же время выглядит угрожающе. Возле входа царит полная тишина."
    2: "Курган"
  "13":
    1: "Вход в этот курган радует глаз, но в то же время выглядит угрожающе. Возле входа царит полная тишина."
    2: "Курган"
  "14":
    1: "Вход в этот курган радует глаз, но в то же время выглядит угрожающе. Возле входа царит полная тишина."
    2: "Курган"
  "15":
    1: "Дверь не заперта и снаружи никто её не охраняет.  Железная ручка на двери покрыта ржавчиной, а в углу над дверью видно небольшое гнездо шершней."
    2: "Башня"
  "16":
    1: "От входа в эту пещеру доносится неприятный запах, разносимый невидимым подземным ветерком.  Пахнет гниющим мясом, смешанным с серой и… мятой?  Ну и ладно.  Выглядит опасно."
    2: "Пещера Дракона (зона 13)"
  "17":
    1: "Неприметный дом какого-то незначительного человека… или, по крайней мере, человека, который хочет казаться таким."
    2: "«Маленький домик» (убийство)"
  "18":
    1: "Эта гробница, должно быть, является местом упокоения какого-то эксцентричного отшельника. Судя по всему, гробницу уже довольно давно никто не трогал."
    2: "Скрытая гробница"
  "22":
    1: "Судя по всему, в этих пещерах обитает огромный дракон.  Нежить, обнаруженная рядом с его логовом, возможно, была отрядом искателей приключений, которые пытались добыть сокровища дракона."
  "23":
    1: "От входа в эту пещеру доносится слабый запах серы и звуки разговоров существ на непонятном языке."
