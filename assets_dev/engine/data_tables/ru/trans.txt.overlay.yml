  "335":
    1: "Регент Уилбур Хамфри, Первый Паладин, и принц Николай Айронфист, наследник престола Энрота, оба проживают в замке Айронфист."
  "336":
    1: "Лорд Альберт Ньютон, Верховный чародей Энрота, проживает в замке Ньютон."
  "337":
    1: "Лорд Осрик Темпер, Первый рыцарь, проживает в замке Темпер."
  "338":
    1: "Лорд Энтони Стоун, верховный жрец Свободной гавани, проживает в замке Стоун."
  "339":
    1: "Леди Лоретта Флейз, канцлер казначейства, проживает в замке Флейз."
  "340":
    1: "Лорд Эрик фон Стромгард, маркиз Северных Марк, проживает в замке Стромгард."
  "341":
    1: "Вихревые потоки магии Воздуха удерживают вместе яйцо из облачного тумана. Из странного сооружения доносится тихий, но явно сердитый вой."
    2: "Тюрьма Повелителя Земли"
  "342":
    1: "Хотя воздух довольно тёплый, эта ледяная оболочка не тает. Вокруг неё кружится стихийная сила магии Воды, сохраняя зимний холод."
    2: "Тюрьма Повелителя Огня"
  "343":
    1: "Силы огненной магии раскаляют этот железный цилиндр до красного. Шум пара заставляет задуматься, не наполнен ли он кипящей водой."
    2: "Тюрьма Повелителя Воды"
  "344":
    1: "После того как вы их спасли, минотавры из Логова Балтазара построили новый вход в свой город."
    2: "Новый вход в логово Бальтазара"
  "345":
    1: "Чёрный ход в таинственный заброшенный храм, построенный народом, жившим на Кинжальной Ране до появления ящеролюдов. Теперь здесь должно быть безопасно, верно?"
    2: "Задний вход в заброшенный храм"
  "346":
    1: "Согласно историческим сведениям, храмы людей-ящеров того периода охранялись ловушками, а не чудовищами. Как же тогда объяснить появление ползущего рептилоподобного существа, исчезающего в темноте?"
    2: "Заброшенный храм"
  "347":
    1: "Сквозь эти врата в эфирном царстве не видно твердой земли. В туманной дали виднеются здания причудливой формы, которые, кажется, парят в небе."
    2: "Врата в План Воздуха"
  "348":
    1: "Глядя сквозь проход, создается ощущение, будто смотришь через окно на подводный каньон. Вдали угрожающе плавают существа самых разных размеров."
    2: "Врата в План Воды"
  "349":
    1: "Запах свежесрубленной древесины свидетельствует о том, что этот форт был построен совсем недавно. Большие штабеля припасов указывают на то, что регнанские пираты планируют задержаться здесь надолго."
    2: "Пиратский аванпост"
  "350":
    1: "Хотя вид заслоняют мерцающие волны раскаленного воздуха, сквозь ворота можно разглядеть адский пейзаж с бесконечными мостами, перекинутыми через океан лавы."
    2: "Врата в Сферу Огня"
  "351":
    1: "Даже в свободном порту Равеншор некоторые грузы приходится скрывать от властей. Обычно их переправляют через эту уединённую бухту под присмотром контрабандистов-крысолюдей."
    2: "Бухта контрабандистов"
  "352":
    1: "Ворота ведут в земляной туннель, который простирается на несколько шагов, а затем разветвляется влево и вправо. Невозможно сказать, куда ведут эти проходы."
    2: "Врата в План Земли"
  "353":
    1: "Судя по количеству волчьих следов, ведущих к этому волчьему логову, либо волки здесь чрезвычайно активны, либо в этих пещерах обитают сотни волков."
    2: "Логово гигантского волка"
  "354":
    1: "Торговцы-тёмные эльфы Альвара управляют могущественной торговой империей, охватывающей весь Джадам. Это их местный торговый дом в Равеншоре."
    2: "Торговый дом Альвара"
  "355":
    1: "Из ключа слияния раздаётся пронзительный звук, который резонирует по всему кристаллу. Открывается скрытая глубина — проход, притягивающий вас необъяснимой силой."
    2: "Внутри кристалла"
  "356":
    1: "Улей гудит так, что зубы стучат. Ветерок, который вы чувствуете, — не ветер, а поток воздуха от тысячи чудовищных крыльев."
    2: "Осиное гнездо"
  "357":
    1: "Армии огров не нуждаются в лебедках на местах возведения своих крепостей. Их физической силы и выносливости вполне достаточно, чтобы поднимать массивные балки и столбы."
    2: "Форт огров-налётчиков"
  "358":
    1: "Тролли из Раста на протяжении веков хоронили здесь своих умерших — каждое поколение рыло всё более глубокие катакомбы под теми, что были вырыты ранее."
    2: "Гробница троллей"
  "359":
    1: "Для чего циклопам нужен этот зловещий подвал? Что бы они там ни делали, оттуда пахнет, как из мясной лавки."
    2: "Кладовая циклопов"
  "360":
    1: "Туннель из застывшей лавы извивается вниз. Может ли он служить безопасным проходом под огненным озером?"
    2: "Огненная цепь"
  "361":
    1: "Несмотря на то что этот замок был разрушен в какой-то давно забытой войне, некоторые его части до сих пор остаются целыми. Охотники на драконов нашли им достойное применение."
    2: "Лагерь охотников на драконов"
  "362":
    1: "По природе драконы — одиночки. Иногда несколько драконов устраивают гнёзда рядом, но здесь, в ущелье Гарроты, они создали могущественное общество."
    2: "Драконья пещера"
  "363":
    1: "Каменный фасад этого древнего храма рассыпался в песках времени. Но его величие — и таинственность — остались."
    2: "Хранилище наг"
  "364":
    1: "Хотя этот храм построен совсем недавно, он уже обладает неподвластной времени красотой."
    2: "Храм Солнца"
  "365":
    1: "Тёмный камень этих памятников не встречается поблизости. Ближайший источник — горы Шэдоуспайра в ста лигах отсюда."
    2: "Заброшенный круг друидов"
  "366":
    1: "Похоже, эта вентиляционная шахта — единственный вход в затопленный город минотавров, Логово Бальтазара."
    2: "Логово минотавров"
  "367":
    1: "Предпочтение шакала Зога строить жилища на возвышенностях оказалось неожиданным благом, обеспечив ему защиту от бушующих паводковых вод."
    2: "Крепость Зога"
  "368":
    1: "Регнаны никогда не славились своей утончённостью. Этот замок с толстыми стенами и усыпанный пушками — само воплощение слова «угрожающий»."
    2: "Пиратская крепость"
  "369":
    1: "Издалека эта покрытая мхом и обветшалая крепость выглядит давно заброшенной. Но свежие следы ботинок в грязи и сигнальное зеркало говорят об обратном."
    2: "Заброшенная пиратская крепость"
  "370":
    1: "Этот странный аппарат, судя по всему, способен передвигаться как над водой, так и под водой. Ряд кривошипов приводил в движение колесо с лопастями, обеспечивающее его движение."
    2: "Подводная лодка с ручным приводом"
  "371":
    1: "Гильдия некромантов, возвышающаяся над раскинувшейся внизу деревней, излучает атмосферу всепоглощающего зла."
    2: "Гильдия некромантов"
  "372":
    1: "Хотя Зантора славится красотой, безумие заставляет её избегать общества. В этом мрачном замке она проводит свои зловещие эксперименты."
    2: "Лаборатория Безумного Некроманта"
  "373":
    1: "Все здания в Плане Воздуха парят в воздухе. Так почему же этот облачный замок выглядит особенно не к месту? Возможно, из-за его огромных размеров?"
    2: "Воздушный замок"
  "374":
    1: "Все здания в Плане Воздуха парят в воздухе. Так почему же этот облачный замок выглядит особенно не к месту? Возможно, из-за его огромных размеров?"
    2: "Воздушный замок"
  "375":
    1: "Гробница-памятник"
    2: "Гробница-памятник"
  "376":
    1: "В стенах и башнях этой могучей крепости из камня и железа не видно ни одной деревянной доски или других горючих материалов."
    2: "Огненный замок"
  "377":
    1: "Если и оставались сомнения во враждебных намерениях огненных элементалей к Джадаму, этот сборный лагерь их развеивает."
    2: "Военный лагерь"
  "378":
    1: "Разрушитель правит из мрачного дворца. Какое существо решило бы поселиться внутри черепа гиганта высотой 400 футов?"
    2: "Дворец Эскатона"
  "379":
    1: "Магическая сила Земли кружится вокруг этой коконоподобной оболочки из земли и камня. Изнутри доносится мучительный крик, подобный умирающему ветру."
    2: "Тюрьма Повелителя Воздуха"
  "382":
    1: "Перед вами стоит входная дверь вашего нового дома."
    2: "Замок Хармондэйл"
  "383":
    1: "Перед вами возвышается величественный вход в замок Грифонхарт. Над замком часто можно увидеть пару ручных грифонов, кружащих в небе."
    2: "Замок Грифонхарт"
  "384":
    1: "Замок Наван — традиционная резиденция эльфийской власти.  Вековые заросли растений вокруг замка придают ему лесной облик."
    2: "Замок Наван"
  "385":
    1: "Кто знает, почему некроманты посчитали нужным построить замок глубоко в недрах земли? Замок «Сумерки» — уродливый, зловещий и очень, очень хорошо защищённый."
    2: "Замок Сумерки"
  "386":
    1: "Благодаря тому, что замок Ламбент возвышается над большинством облаков, он получает больше солнечного света в год, чем любое другое место.  Элегантная архитектура замка позволяет в полной мере использовать преимущества таких погодных условий."
    2: "Замок Ламбент"
  "387":
    1: "Капанье воды и странный, неузнаваемый писк — единственные звуки, которые, судя по всему, доносятся из входа в эту пещеру."
    2: "Храм Луны"
  "389":
    1: "Судя по всему, в этих пещерах обитает огромный дракон.  Возможно, именно здесь находятся те пропавшие искатели приключений..."
    2: "Логово дракона"
  "390":
    1: "Перед вами стоит входная дверь вашего нового дома."
    2: "Замок Хармондэйл"
  "391":
    1: "Эти пещеры издавна служат укрытием для гоблинов и разбойников.  Что бы там ни обитало сейчас, запах там оставляет желать лучшего…"
    2: "Пещеры Белого Утёса"
  "392":
    1: "Из большой сливной трубы, идущей от Эратской канализации, льётся грязная вода. Говорят, что здесь находится Гильдия воров."
    2: "Эратские канализационные трубы"
  "393":
    1: "Эта могучая крепость превосходно защищает Восточный мост от захватчиков.  Похоже, что посетителей внутри крепости не приветствуют."
    2: "Форт Риверстрайд"
  "394":
    1: "В эту пещеру ведут свежие следы человека или эльфа, а у входа недавно расчистили сорняки и кустарник."
    2: "Тулареанские пещеры"
  "395":
    1: "За дверью слышны слабые звуки отдаленных взрывов и безумного смеха.  В воздухе витает резкий, едкий запах."
    2: "Лаборатория Кланкера"
  "396":
    1: "Устрашающее зрелище — тенистые когти и извращённые демонические фигуры — манит вас внутрь.  Вдали слышно, как поёт женщина, но слова разобрать не удаётся."
    2: "Зал Ямы"
  "397":
    1: "Шестая сторожевая башня — последняя из целой серии башен, которые когда-то охраняли границу Дейи. Она покрыта следами сражений, но по-прежнему гордо возвышается."
    2: "«Сторожевая башня» № 6"
  "398":
    1: "Резкий, как электрический разряд, запах магии наполняет воздух за пределами Школы — результат сотен лет магических экспериментов и детских шалостей, происходивших в одном и том же здании."
    2: "Школа магии"
  "399":
    1: "Хотя гномы недавно покинули эту шахту, в ней по-прежнему легко разглядеть мастерство и заботу, с которыми они её обустроили."
    2: "Шахты «Красного карлика»"
  "400":
    1: "«Стены Тумана» — испытательный полигон Волшебников — парят в облаках, словно небесный мираж. Это полностью магическое сооружение."
    2: "Стены тумана"
  "401":
    1: "Храм Света — одно из самых прекрасных и умиротворённых мест в мире. Любой последователь Света, прогуливаясь по этим священным залам, может почувствовать, как его заботы улетучиваются."
    2: "Храм Света"
  "402":
    1: "Предателей и военнопленных часто бросают в эту ужасную яму в качестве наглядного примера жестокости. Все некроманты также должны спуститься в яму и выбраться оттуда, прежде чем они смогут завершить своё обучение."
    2: "Питомник"
  "403":
    1: "Храм Тьмы по-прежнему используется силами зла. Ежемесячно здесь приносят жертвы, а на парадной лестнице регулярно проводятся зловещие обряды."
    2: "Храм Тьмы"
  "404":
    1: "Ещё у входа отчётливо слышны звуки зловещего пения, а также крики и стоны нежити."
    2: "Великий Храм Луны"
  "405":
    1: "Заросший травой и изношенный временем, Великий Храм Солнца видел и лучшие дни.  Похоже, кто-то всё ещё заботится об этом месте."
    2: "Великий храм Солнца"
  "406":
    1: "Колдуны Найгона считают этот потухший вулкан своим домом. Сеть естественных и высеченных в скалах туннелей расходится от горы, позволяя путешествовать по всему Найгону и через море."
    2: "Гора Громовой Кулак"
  "407":
    1: "Перед вами, насколько хватит глаз, простирается огромный волшебный лабиринт.  Если долго смотреть на него, глаза заслепляются, а разум теряется в догадках."
    2: "Лабиринт"
  "408":
    1: "Каменный Город — один из величайших оплотов расы гномов в мире.  Главные ворота выглядят очень надежными."
    2: "Каменный город"
  "409":
    1: "Словами не описать весь этот ужас. Одна из труб, должно быть, служит входом…"
    2: "Колония Зод"
  "410":
    1: "Гильдия наемников — пристанище для всех меченосцев, не сумевших стать разбойниками. Посетители здесь не приветствуются."
    2: "Гильдия наемников"
  "411":
    1: "На протяжении веков эти пещеры служили укрытием для пиратов и разбойников."
    2: "Пещеры Тайдвотер"
  "412":
    1: "След зловещих коричневых пятен ведёт вниз по лестнице, в темноту…"
    2: "Винный погреб"
  "413":
    1: "Могучая крепость, в которой обитают фантастические и кровожадные титаны. Никто из тех, кто туда проник, так и не вернулся, чтобы рассказать об этом."
    2: "Крепость Титанов"
  "414":
    1: "Храм, некогда бывший гордостью ложной религии, пришел в упадок."
    2: "Храм Баа"
  "415":
    1: "На первый взгляд это не выглядит чем-то особенным, но попасть туда не так-то просто.  Старайтесь не сбиваться с тропы."
    2: "Зал под холмом"
  "416":
    1: "Этот невероятный звездолет — лишь небольшой пример чудес Древних."
    2: "«Линкольн»"
  "417":
    1: "Обветшалые камни этой старой крепости окружают пустующие здания в заброшенном дворе.  С изношенной лестницы, ведущей вниз под крепость, доносятся едва уловимые звуки."
  "418":
    1: "За дверями этого храма слышно приглушённое пение. Похоже, посетителей здесь не приветствуют."
  "419":
    1: "Это была первая крепость, предназначенная для исследований в области магии; её удаленное расположение обеспечивало магам конфиденциальность, а населению — защиту на случай несчастного случая."
  "420":
    1: "Эта пирамида, судя по всему, сделана из какого-то странного, подвергшегося воздействию атмосферных явлений металла.  Похоже, она частично зарыта в песке."
  "421":
    1: "Из этого странного сооружения открывается потрясающий вид на Райскую долину.  Наружные стены построены из неизвестного материала."
  "422":
    1: "Из-за входных дверей доносится странный скрип. Когда-то здесь находился храм Баа, но из-за ужасного проклятия прежние обитатели были вынуждены покинуть это место."
  "423":
    1: "Это большое, но простое сооружение стало центром отправления культа для небольшой религиозной группы под названием «Орден Кулака»."
  "424":
    1: "По мере приближения к воротам этого замка температура начинает понижаться.  Согласно легенде, в этом замке хранится знание о том, как преодолеть смерть и стать нежитью."
  "425":
    1: "Похоже, это место заброшено.  Однако свежие следы ведут к недавно отремонтированной двери и от неё.  Возможно, оно всё-таки не так уж и заброшено."
  "426":
    1: "Кажется, что воздух вокруг этого сооружения наполнен запахами смерти и разложения.  Первоначальное назначение храма уже давно забыто новыми верующими."
  "427":
    1: "Кригспайр больше не возвышается между озерами: земля вокруг замка была насыпана, чтобы не дать существам, находящимся внутри, сбежать."
  "428":
    1: "Древние руны над входом призваны отпугнуть случайного посетителя.  Свежие следы гоблинов ведут в дверной проем и из него."
  "429":
    1: "Эта забытая святыня Церкви Солнца стоит до сих пор. Несмотря на то, что храм уже давно находится в условиях влажных джунглей, он сохранился в удивительно хорошем состоянии."
  "430":
    1: "Эти пещеры когда-то принадлежали изгнанному королю Роклину, но теперь в них обитает новый король гномов — Снергл."
  "431":
    1: "Изначально это старинное святилище служило местом поклонения Церкви Луны, а сейчас здесь обитает группа друидов Седрика Дротера."
  "432":
    1: "Первоначальное название этих пещер утрачено с течением времени. Сейчас они названы в честь банды разбойников, которая использует их в качестве своей базы."
  "433":
    1: "По мере приближения к дверям температура неуклонно повышается, а запах серы и пепла становится всё сильнее. Это место больше напоминает укрытие, чем храм."
  "434":
    1: "Этот небольшой пост служит передовым пунктом для «Братства Серебра». Отсюда они могут патрулировать Мист в ходе своей борьбы со злом."
  "435":
    1: "Высший храм, являющийся центром всего поклонения Баа в Энроте, допускает внутрь только последователей Баа."
  "436":
    1: "Гильдия «Теней», в которой обитает так называемый «Принц воров», действует вне юрисдикции Энтони Стоуна.  Это здание гильдии закрыто для посетителей."
  "437":
    1: "Лес разбросанных повсюду статуй словно усиливает тишину на Звёздном острове.  По всей видимости, слухи о том, что в этом храме обитают медузы, соответствуют действительности."
  "438":
    1: "Снергл захватил крупнейшую гномью шахту Энрота, заявив права на неё как преемник гномьего престола."
  "439":
    1: "Драгуны восстановили и переоборудовали эту крепость под свою штаб-квартиру. Отсюда они нападают на путников, следующих в Свободную гавань и обратно."
  "440":
    1: "Когда-то это поместье принадлежало архимагу Терраксу. Позже Арчибальд пожаловал его Корлагону за службу во время Войн за престол."
  "441":
    1: "Штаб-квартира Братского ордена Серебра и дом сэра Джона Сильвера. Серебряные Шлемы из этой крепости патрулируют Серебряную Бухту в поисках зла."
  "442":
    1: "Это внушающее трепет сооружение излучает магическую силу. Друиды со всего Энрота периодически совершают паломничества, чтобы посетить это священное место."
  "443":
    1: "Этрик, первый чародей, искавший жизнь после смерти, до сих пор бродит по своей гробнице, возглавляя полчище нежити.  По крайней мере, так гласят слухи..."
  "444":
    1: "Первоначально крепость служила для предотвращения побега существ из Замерзших Пустошей, а теперь она преграждает путь в замок Стромгард и город Уайт-Кэп и обратно."
  "445":
    1: "Из этой внушительной крепости доносятся приглушенные звуки столкновения металла и громкие голоса. Никто не осмелится напасть на резиденцию Военачальника."
  "446":
    1: "От входа в эти пещеры доносится неприятный запах.  Издалека слышен волчий вой."
  "447":
    1: "Элементали огня помогали Гарику в его попытках создать здесь могущественные предметы.  Несколько его учеников продолжают его эксперименты."
  "448":
    1: "Эта лаборатория стала местом проведения бесчисленных ужасающих экспериментов. Её удаленное расположение было выбрано как из соображений безопасности, так и для обеспечения секретности."
  "449":
    1: "В этих пещерах существует странный союз между человеческими воинами и драконами.  Драконьи башни были построены в городах для защиты от этих налетчиков."
  "451":
    1: "Центр управления закрыт со времени «Тишины», произошедшей почти двенадцать веков назад."
  "508":
    1: "Чёрный ход в таинственный заброшенный храм, построенный народом, жившим на Кинжальной Ране до появления ящеролюдов. Теперь здесь должно быть безопасно, верно?"
    2: "Заброшенный храм"
  "671":
    1: "Текст-заполнитель"
  "672":
    1: "Текст-заполнитель"
  "673":
    1: "Громоподобный вой пронзает уши, вызывая чувство ужаса. То, что издало этот звук, приближается, и каждый его шаг сотрясает землю под вашими ногами."
    2: "Туннели, ведущие в Эофол"
  "674":
    1: "По мере того как вы продвигаетесь всё глубже в эту обширную сеть туннелей, инстинкт подсказывает вам, что здесь обитает множество опасных существ. Вы клянетесь не терять бдительности."
    2: "Гора Громовой Кулак"
  "675":
    1: "Этот туннель ведёт в Каменный город."
    2: "Туннели Найгона"
