  "148":
    1: "Регент Уилбур Хамфри, Первый Паладин, и принц Николай Айронфист, наследник престола Энрота, оба проживают в замке Айронфист."
  "152":
    1: "Лорд Альберт Ньютон, Верховный чародей Энрота, проживает в замке Ньютон."
  "154":
    1: "Лорд Осрик Темпер, Первый рыцарь, проживает в замке Темпер."
  "158":
    1: "Лорд Энтони Стоун, верховный жрец Свободной гавани, проживает в замке Стоун."
  "160":
    1: "Леди Лоретта Флейз, канцлер казначейства, проживает в замке Флейз."
  "164":
    1: "Лорд Эрик фон Стромгард, маркиз Северных Марк, проживает в замке Стромгард."
  "166":
    1: "Сколько себя помнят люди, Оракул дарует правителям Энрота мудрость."
