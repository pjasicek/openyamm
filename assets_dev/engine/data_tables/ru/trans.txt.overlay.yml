  "806":
    1: "Эта пещера является легендарным местом в тролльских преданиях и считается святыней. Однако другие существа могут рассматривать её просто как логово, которое нужно захватить и защищать."
    2: "Дом древнего тролля, 54"
  "813":
    1: "Текст-заполнитель"
  "815":
    1: "Как и во всех местах, священных для последователей Ипа, в этом храме пахнет сырой шерстью и сыром. Изнутри доносится хор писков, похожий на песнопения."
    2: "Великий храм Иипа, 55"
  "823":
    1: "Текст-заполнитель"
  "825":
    1: "Как и во всех местах, священных для последователей Ипа, в этом небольшом храме слабо пахнет мехом и сыром."
    2: "Часовня Иипа, 56"
  "833":
    1: "Текст-заполнитель"
  "835":
    1: "Церковь, почитаемая последователями Иипа. В ней слабо пахнет сырой шерстью и сыром."
    2: "Церковь Иипа, 57"
  "843":
    1: "Текст-заполнитель"
  "845":
    1: "Вход в пещеру. Легкий ветерок изнутри доносит до вас слабый запах серы."
    2: "Пещера Илсингора, 58"
  "852":
    1: "Текст-заполнитель"
  "854":
    1: "Вход в пещеру. Логово какого-то чудовищного зверя?"
    2: "Пещера Яардрейка, 59"
  "860":
    1: "Текст-заполнитель"
  "862":
    1: "Вход в эту пещеру был грубо расширен существом, чьи когти способны разрывать твёрдый тёмный камень."
    2: "Пещера Старого Лоэба, 60"
