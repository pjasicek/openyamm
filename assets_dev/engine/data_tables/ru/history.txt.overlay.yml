rows:
  "1":
    1: |-
      Соберитесь вокруг, и я поведаю вам историю Дня Разрушителя. Это сказание о том, как могучие пали, а слабые обрели силу; о великой угрозе, которую отвели герои, упорно исполнявшие возложенный на них долг. Сегодня я расскажу о %31, восставшем из полной безвестности и ставшем величайшим героем нашего времени — гордостью Джадама! И о том, как %33 спасли страну от грозного Разрушителя.

      При всём причинённом им разорении Разрушителя видели в Джадаме лишь однажды. Ярким зимним днём он с непостижимой целью вошёл в портовый город Равеншор. Как вам известно, среди городов Джадама Равеншор отличается редкой терпимостью к чужакам, однако появление одинокого богача привлекло внимание местных грабителей и карманников. Но их алчность обратилась в страх: стоило одному за другим приблизиться к незнакомцу с дурными намерениями, как невидимая сила отбрасывала их прочь, а Разрушитель невозмутимо шёл к городской площади.

      Это не осталось незамеченным. Вскоре тролли, огры, тёмные эльфы и прочие горожане хлынули из домов и лавок и последовали за молчаливым, не обращавшим на них внимания незнакомцем — разумеется, на безопасном расстоянии. Когда он достиг площади, там собралась огромная толпа — на свою беду, ибо многих разорвало на части или покалечило высвобожденными им космическими силами. Ударив скипетром о землю, Разрушитель заставил громадные кристаллы вырасти из-под земли. Тех, кого не свалили разломы почвы, отбросили волны огня и воздуха, пока кристаллы складывались в исполинское сооружение из сияющего алмаза. Стены сомкнулись вокруг Разрушителя, и вскоре он исчез из виду.

      Разрушитель пропал. Всё случившееся можно было бы счесть сном, если бы не кристальное сооружение — настолько огромное, что лавки и дома вокруг городской площади казались рядом с ним крошечными.

      Но это было лишь начало. Содеянное Разрушителем почувствовали в самых дальних уголках джадамского пограничья. Вместе с кристаллом пришли наводнения, огненные бури, водовороты и вулканы, а вслед за ними — захватчики с элементальных планов. Казалось, кристалл предназначался не только для того, чтобы скрыть Разрушителя и посеять смятение среди жителей Равеншора. Он служил великим призывным маяком, разжигавшим войну между нашим миром и планами Земли, Воздуха, Воды и Огня.

      %31, вероятно, не сразу узнал бы об этих великих событиях, если бы почтенные Торговцы Альвара не наняли %33 охранять повозку с плодами тоберска, ожидавшую отправки с островов Кинжальной Раны. Поэтому %33 вместе с простодушными ящеролюдами Кинжальной Раны стали свидетелями страшного разрушения. На виду у берегов главного острова из моря взметнулся огромный вулкан, толкая перед собой могучую волну. Волна и горящие камни, дождём падавшие с неба, опустошили поля и хижины ящеролюдов и быстро уничтожили мосты, соединявшие обитаемые острова друг с другом и с материком Джадама.

      День и ночь на Кинжальной Ране царил хаос, а камни продолжали падать с неба. Но беды не закончились: на следующий день напали пираты Регны. Я не склонен несправедливо порочить целый народ, однако хуже регнанцев никого не припомню. Словно волки, набросившиеся на раненого телёнка, они безжалостно ударили по искалеченным островам. Высадившись с больших морских кораблей, регнанцы начали жестокую кампанию грабежей и разорения.

      В таком положении находился %31 в тот день, когда Судьба избрала %34 защитником этой земли.
    3: "День Разрушителя"
  "2":
    1: |-
      Опасность положения не укрылась от Дадеросса — главы каравана %31 и проницательного минотавра. Дадеросс понимал, что увиденное заинтересует его хозяев, тёмных эльфов из числа Торговцев Альвара. Поэтому он призвал верного стража каравана, %31, и поручил %34 важное дело: «Вы должны сообщить об этом бедствии Элгару Феллмуну, главе Торговой гильдии в Равеншоре. Он решит, что делать».

      Он передал %31 письмо. «Я знаю, что обстоятельства и пираты заперли нас здесь, но вы должны найти путь на материк. Ступайте!» С этими словами Дадеросс вернулся к другим заботам.

      Однако %31 не остался без помощи. Брекиш Одноклык, вождь деревни ящеролюдов, рассказал %34 о древних порталах, некогда позволявших путешествовать между островами, но давно переставших действовать. Одноклык также поведал %31 о Фредрике Талимэре — жившем в деревне клирике, который разбирался в устройстве порталов.

      Когда %31 разыскал Талимэра, %33 выяснил, что клирик знает не только о порталах, но и о древнем храме. Через него пролегал путь к лодочным причалам на острове, ставшем недоступным после разрушения мостов.

      И вот с помощью Талимэра %31 отправился в путь. О, дорогу преграждало множество опасностей, и не последней из них была битва между ящеролюдами и регнанцами, но %31 преодолел все препятствия. Починив порталы, %33 вскоре оказался перед древним храмом.

      Можно было бы подумать, что столь давно покинутое место необитаемо, однако это было не так. Внутри на %31 набросились всевозможные отвратительные рептилии. Хуже всех были змеи, похожие телом на людей, но лишённые искры разума. И этим опасности храма не исчерпывались: с каждым шагом в глубины срабатывали ловушки, давным-давно установленные неизвестными руками. Лишь на пределе сил %32 отряду удалось провести %31 сквозь них, выбраться живым к лодочным причалам и на %32 лодке отправиться в Равеншор на материке.
    3: "Мир должен узнать!"
  "3":
    1: "Как уже упоминалось, Равеншор — город, не похожий ни на один другой в Джадаме. Там, ради торговли, все расы — по крайней мере, при свете дня и на более оживлённых улицах — откладывают в сторону свою взаимную вражду. Было бы глупо утверждать, что там царит мир, но, по крайней мере, можно вести дела. В любом случае, именно в Равеншоре Элгар Феллмун, главный торговец гильдии «Купцы Альвара», вёл дела.\n\n«Дело серьёзное», — сказал Феллмун, получив письмо от Дадеросса. «Не только потеря его каравана — это серьёзный ущерб для гильдии, но и события на Кинжальной Ране, да и тот гигантский кристалл…» Он указал на огромный светящийся алмаз, оставленный Разрушителем. «…вполне возможно, предвещают конец света! Нам нужна дополнительная информация, и у меня есть план, как её добыть».\n\nФеллмун быстро набросал письмо и передал его %31. «Отнеси это лидеру местной контрабандистской группировки, Ариону Хантеру. У него одни из самых быстрых лодок на побережье, которые понадобятся моим разведчикам. В этом письме содержится просьба об их использовании. Хантер, скажем так, обязан мне «особыми услугами». Уверен, он окажется полезным».\n\nИтак, после некоторых недоразумений с охранниками Хантера, в результате которых многие из них лишились возможности чинить дальнейшие препятствия, %31 передал просьбу Феллмуна главе контрабандистов, который, прочитав письмо Феллмуна, понял намёк и предоставил свои лодки в распоряжение купца."
    3: "Контрабандист-крысочеловек"
  "4":
    1: "Когда %31 вернулся в торговый дом после улаживания дел с контрабандистами из Равеншора, %33 обнаружил, что Феллмун подготовил для него новое задание. «Конечно, хорошо, что я знаю о том, что ты видел, но эту новость необходимо донести и до главной торговой гильдии в Альваре. Об этом также нужно сообщить верховному магистру гильдии Бастиану Лаудрину. Хотя я подозреваю, что мы стали свидетелями признаков пророчества, я не могу сказать этого наверняка. Бастиан всегда больше интересовался древними знаниями, чем я. Он знает об этом лучше».\n\nК этому моменту %31 уже собрал группу последователей; те, кто совершает великие деяния, как правило, привлекают к себе других искателей славы. И поэтому, когда %31 отправился в Альвар, родину тёмных эльфов, %33 путешествовал не в одиночку. И это было к лучшему, ведь между Равеншором и Альваром простирались обширные глубинки — а для путешественника из Джадама это означало множество столкновений с разбойниками и враждебными существами. И действительно, таких столкновений было немало. По этой причине %31 и его друзья прибыли в Альвар измученные дорогой.\n\nБастиан Лаудрин воспринял рассказ %31 о событиях в Равеншоре и Кинжальной Ране с таким же смятением, как и Феллмун. Лаудрин тоже увидел в этих новостях признаки пророчества. «Это именно то, что предсказано в „Экелбрет Суманунала“, нашем трактате о конце света. Если верить вашим новостям и другим слухам, грядут великие и ужасные события. Мы можем предотвратить их — пророчество описывает путь к спасению, — но мы должны быть уверены. Нужны дополнительные доказательства».\n\nИтак, мастер гильдии нанял %31 и его компанию на службу. Он рассказал искателям приключений о настойчивых слухах, согласно которым в пустыне Железных Песков появилось огненное озеро. «Вы должны подтвердить или опровергнуть эту историю для меня. Отправляйтесь в пустыню. Если это озеро действительно существует, найдите мне свидетеля событий, готового сопровождать вас обратно сюда. Я должен услышать доказательства собственными ушами. Тогда я узнаю, наступили ли последние дни»."
    3: "Посещение Альвара"
  "5":
    1: "Как вскоре обнаружил %31 по прибытии в пустыню Железных Песков, слухи оказались правдой. Огненное озеро простиралось до самого горизонта и полыхало с неистовым жаром. Это была странная и тревожная загадка, ведь оно горело без топлива — разве что этим топливом был негорючий песок… а это было невозможно. Ещё более невероятным казалось найти свидетеля появления озера, поскольку почти все очевидцы погибли. Но благодаря усердным поискам удалось найти одного выжившего — Овердуна Снэпфингера, тролля из деревни Раст. К сожалению, Овердун не собирался отправляться вместе с %31 в Альвар.\n\n«Да, я видел, как возник огненное озеро, но я не могу пойти с вами. Я должен остаться здесь, чтобы ухаживать за отцом, который страдаёт от горя, вызванного смертельной участью моего брата, Вайлбайта. Он погиб в огне, что уже само по себе достаточно плохо. Хуже того, что нам не удалось похоронить его останки в семейной гробнице. Мой отец страдаёт, потому что верит: Вайлбайт не обретёт покоя, пока с его телом не поступят должным образом».\n\nУслышав это, %31 предложил доставить тело Вайлбайта в гробницу, если Овердун согласится после этого отправиться к Лаудрину. «Конечно», — сказал тролль, протягивая %31 небольшой флакон с прахом. «Вот всё, что осталось от бедного Вайлбайта. Гробница находится сразу за деревней. Вернись сюда, когда закончишь, и я сопровожу тебя». «Ах да, кстати, гробница кишит гогами — демонами, которые швыряют шары взрывающегося огня».\n\nИ вот, вскоре, %31 и его спутники оказались в лабиринтообразной гробнице тролльской деревни, которую один из членов отряда метко охарактеризовал так: «Если бы нас не преследовали безумные чудовища, жаждущие нашей гибели, это было бы благословенным и умиротворяющим местом». С непоколебимой решимостью отряд дал отпор гогам и таким образом пробился к семейной усыпальнице Снапфингерсов. Оставив позади жалкие останки Вайлбайта, они вернулись к Овердуну.\n\n«Теперь я буду путешествовать с вами», — сказал довольный Овердун. «Видите, мой отец уже поправляется и может позаботиться о себе сам». И действительно, седой старый тролль, явно идущий на поправку, сидел за грубым столом в хижине и самостоятельно ел суп. «Пойдём в Альвар, я с радостью представлю свой отчёт гильдии»."
    3: "Озеро огненное"
  "6":
    1: "В гильдии Овердун выступил со своим докладом. По мере того как он рассказывал о появлении огненного озера, Бастиан Лаудрин мрачнел всё сильнее. «Все так, как я и опасался. Наступили последние дни! Но, к счастью, наша судьба ещё не предрешена. Пророчество даёт нам выбор: мы можем либо бездействовать и столкнуться с полным уничтожением в пламени вышедших из-под контроля стихий, либо следовать путям спасения, указанным в пророчестве. Лично я предпочитаю второе».\n\n«Пророчество совершенно ясно указывает, что нужно сделать, даже если это и не лёгкая задача. В одном из толкований там говорится: «Земля, которая объединится, будет спасена. Та, которая этого не сделает, погибнет». Я понимаю это так, что мы должны заключить союз между расами Джадама, чтобы противостоять угрозе нашего надвигающегося забвения. Далее в пророчестве описывается герой, которому суждено либо обречь землю на гибель, либо спасти её. Я не могу не заметить, что ты, %31, очень похож на героя пророчества».\n\nИтак, на плечи %31 легло тяжкое бремя, и он стал тем самым Героем Джадама. %33 не был из тех, кто уклоняется от обязанностей, но с чего же начать? Ошеломлённый масштабом долга, возложенного на %34, %33 обратился за советом к мастеру гильдии. Лаудрин немного подумал, прежде чем ответить.\n\n«Полагаю, тебе предстоит путешествовать по стране и искать помощи у своих соотечественников из Джадама. Предлагаю тебе обратиться к королям, вождям, мастерам гильдий и другим лидерам. Настаивай на идее союза. Несомненно, многие страдают от последствий стихийных бедствий, таких как извержение вулкана у островов Кинжальной Раны или огненное озеро в пустыне Железных Песков. Они поймут всю серьёзность ситуации и с радостью примут разумно предложенное решение».\n\n«Когда найдёте союзников, отправьте их в Равеншор. Я пошлю гонца к Феллмуну с указанием, что его торговый дом теперь является штаб-квартирой альянса. У вас уже есть поддержка тёмных эльфов и троллей. Найдите других»."
    3: "Пророчество"
  "7":
    1: "Лучших союзников можно было найти среди самых могущественных существ, а никто не могущественнее драконов. Так рассудил %31 и повёл искателей приключений к драконьим пещерам ущелья Гарроты. У некоторых членов отряда были сомнения, но отступать было уже поздно, ведь внезапно перед ними появились драконы, охранявшие вход в пещеру. К счастью, эти драконы отличались хладнокровием, и %31 получил возможность изложить %32 дело, вместо того чтобы погибнуть на месте. В сопровождении нескольких готовых к бою драконов отряд был проведён в пещеры, в личную пещеру Дефтклоу Редревера, короля драконов.\n\n«Обычно вы бы не подошли к нашей пещере ближе, чем на сто шагов — по крайней мере, не остались бы в живых, — сказал Редревер. — Но сейчас не обычное время. Мне ясно, что над этими днями нависла гибель. Я склонен верить пророчеству Бастиана Лаудрина, но наши собственные проблемы должны стоять на первом месте. Понимаете, мы, драконы, ведём борьбу за выживание. На нас охотятся. Если ты спустишься на равнины у подножия наших гор, то увидишь огромный лагерь охотников на драконов».\n\n«Но почему вы просто не убьёте охотников и не покончите с этой проблемой?» — спросил %31.\n\n«Мы не смеем атаковать их напрямую», — ответил король драконов. «Они держат в заложниках моё яйцо с ещё не вылупившимся принцем, которому однажды предстоит унаследовать мой трон. Если бы это яйцо не было в их руках, я мог бы вам помочь, но до тех пор я не могу».\n\nПлан действий %31 был ясен. Взяв с собой отряд, %33 отправился на поиски яйца Короля драконов. Небольшое расследование показало, что яйцо вовсе не было у охотников на драконов! На самом деле они уже продали его Зогу Шакалу, вождю огров из «Блуждающего Разора».\n\nИтак, приключение привело их к крепости Зога, расположенной в пустошах. Обнажив оружие, %31 и его спутники ринулись к воротам крепости. Благодаря своей силе и отваге они прорвались через охрану и проникли в крепость Зога. Забрав яйцо, они благополучно скрылись. Они вернулись в ущелье Гарроты и к Королю Драконов. В знак благодарности он согласился присоединиться к альянсу."
    3: "Яйцо для дракона"
  "8":
    1: "«Союз для борьбы с катаклизмом? Интересно…» — сказал Чарльз Кихот, предводитель отряда охотников на драконов, разбившего лагерь в ущелье Гарроты, когда %31 обратился к нему по этому поводу. «Мы с рыцарями уже давно участвуем в этой экспедиции, и я уверен, что многие из них с радостью примут новую цель. Возможность сразиться с великой угрозой для земли — это как раз то, что нужно». «К сожалению, прежде чем присоединиться к вам, мы должны завершить здешние дела».\n\n«Незавершённые дела?» — подсказал %31.\n\n«Да», — ответил Кихот. «Например, я продал драконье яйцо в кредит некоему Зогу Шакалу, варвару из пустошей „Блуждающего Разора“. Он взял товар, а потом отказался платить. Те, кого я послал за ним, так и не вернулись. Если бы он не убил моих гонцов, я, возможно, оставил бы это дело в покое, но теперь это стало делом чести. Прости, я не смогу присоединиться к альянсу, пока не верну яйцо. А судя по тому, как идут дела, пройдут месяцы, прежде чем у меня появится достаточно свободных людей, которых я смогу послать».\n\nПлан действий %31 был ясен. Взяв с собой отряд, %33 отправился на поиски яйца.\n\nИтак, приключение привело их к крепости Зога в пустошах. С обнажённым оружием %31 и его отряд штурмовали ворота крепости. Благодаря силе и отваге они прорвались через стражу и проникли в крепость Зога. Забрав яйцо, они благополучно скрылись. Они вернулись в ущелье Гарроты и к Чарльзу Кихоту. В знак благодарности он согласился присоединиться к альянсу."
    3: "Честь рыцаря"
  "9":
    1: "%31 решил предложить союз Храму Солнца. Их главный храм находился в Мурмурвуде, и туда-то и отправился отряд. Без особых церемоний они получили аудиенцию у верховного жреца Оскара Тайра.\n\n«Как вы знаете, Братство Солнца всегда ищет возможности идти по Пути Света. Ваш союз кажется именно таким, но на нас лежит более важное призвание. Видите ли, мы ведём священную войну против злобной Гильдии некромантов в Шэдоуспайре. Все наши ресурсы задействованы там, и, честно говоря, война могла бы идти лучше. Скажи, %31! Возможно, ты мог бы помочь нашему делу. Если бы ты это сделал, мы непременно смогли бы присоединиться к вам».\n\n«Помочь каким образом?» — спросил %31. «Что может сделать моя небольшая группа, чего не смогла бы ваша армия?»\n\n«То, что вы небольшие и не из наших, как раз и подходит для моего плана. Гильдия не заподозрит вас в коварстве и позволит вам войти в их крепость. У меня есть агент, внедрённый в их ряды. Вы могли бы встретиться с ним и помочь ему нанести удар по самому сердцу гильдии. В их штабе находится устройство под названием «скелетный трансформатор». Если вы его уничтожите, это значительно сократит численность армии, которую они смогут выставить. Тогда мои войска быстро выиграют эту кампанию».\n\n%31 попрощался с %32. Быстро собравшись, искатели приключений отправились в Шэдоуспайр. Там, как и обещал главный жрец, они беспрепятственно вошли в крепость гильдии. Там они встретили агента храма, Дайсона Лиланда — жреца, выдающего себя за некроманта.\n\nОценив состав отряда, Лиланд остался доволен. «Вместе мы сможем нанести мерзким некромантам сокрушительный удар. Пока вы будете сдерживать их стражу, я смогу произнести заклинания, которые уничтожат скелетный трансформатор. Вооружитесь. Наносим удар немедленно!»\n\nИтак, они двинулись по каменным коридорам гильдии. Только когда они приблизились к трансформатору, им пришлось столкнуться с сопротивлением. Это была часть гильдии, куда Лиланду не разрешалось входить. К счастью, у него были %31 и его товарищи, чтобы прорваться туда. Оставив позади павших охранников, искатели приключений вскоре оказались перед скелетным трансформатором. Лиланд давно готовился к борьбе с этим ужасным устройством и поэтому быстро справился с его уничтожением.\n\nБлагополучно выбравшись из крепости, отряд вернулся в Мурмурвуд и Храм Солнца, где их встретили как героев. Так Храм Солнца присоединился к делу альянса."
    3: "Задача для священнослужителей"
  "10":
    1: "%31 решил предложить союз Гильдии некромантов, и поэтому отряд отправился в Шэдоуспайр. Гильдия согласилась принять их, и вскоре они оказались перед верховным мастером гильдии — печально известным личем Сандро. Его вид вызывал тревогу: он так давно перестал заботиться о своём теле, что выглядел как сплошной скелет. \n\nСандро выслушал просьбу %31 и вскоре ответил: «Вы, возможно, думаете, что, прожив столько, сколько я, я с радостью приму конец света и последующее забвение. Но это не так; я дорожу своим существованием». Он махнул костлявой рукой в знак сожаления. «К сожалению, этому существованию сейчас угрожает Храм Солнца. Они объявили нам священную войну. Я не могу присоединиться к вам, пока мы сражаемся с ними».\n\n«Возможно, мы сможем помочь», — предложил %31.\n\n«Да, возможно, сможете». Сандро задумался на мгновение. «У меня как раз есть идея! Прежде чем они послали свои войска против нас, агенты храма пришли сюда и похитили у нас ценный артефакт — Жаровню Ночной Тени. Она создаёт область вечной тьмы. Пока она была у нас, наши вампиры могли свободно передвигаться по Шэдоуспайру как днём, так и ночью. Теперь же им приходится прятаться от солнца. Если бы мы вернули жаровню, вампиры смогли бы защищать наши земли, а мы освободили бы войска для борьбы с храмом. Мы бы быстро выиграли эту войну».\n\nИтак, отряд отправился в Храм Солнца в Мурмурвуде. Взяв с собой Дайсона Лиланда, бывшего жреца храма, теперь перешедшего на службу к некромантам, они проникли внутрь храма. Хотя стражи храма сражались яростно, в конце концов они оказались не в силах противостоять боевому мастерству %31 и его товарищей. Авантюристы завладели жаровней и вернулись с ней в Шэдоуспайр.\n\n«Превосходно!» — воскликнул Сандро по их возвращении. «Теперь мы непременно победим Храм. Пусть никто и не говорит, что Гильдия некромантов не ценит оказанные ей услуги. Мы присоединимся к вашему альянсу»."
    3: "Некроманты"
  "11":
    1: "За время путешествий с минотавром Дадероссом %31 услышал немало историй, которые вожак каравана рассказывал у костра о своём стаде. Особенно %33 запомнил, что минотавры недавно выиграли войну против Ледяных гигантов из Вори. Полагая, что народ, способный победить столь могущественного врага, должен быть сильным, %33 решил обратиться к стаду Дадеросса в их подземном городе в Блуждающем Разоре.\n\nОднако, когда отряд прибыл в город минотавров, стало ясно, что минотавры сильно пострадали от стихийного бедствия. Великое наводнение затопило туннели и пещеры их логова. Вода перекрыла почти все проходы в глубины города.\n\n«Мы должны найти способ осушить туннели», — заявил %31. «Возможно, часть стада выжила и оказалась в ловушке внутри».\n\nВойдя в затопленные ходы, отряд обнаружил, что паводковые воды можно слить на более низкие уровни города, открыв водонепроницаемые осадные ворота, которые были частью оборонительных укреплений минотавров. То, что на искателей приключений постоянно нападали враждебные тритоны, не помешало им выполнить эту задачу. Ближе к концу они нашли глубоко расположенный эвакуационный туннель, через который можно было полностью осушить логово. Когда вода спала, раздались радостные голоса сотен минотавров. Они были заперты там много дней и теперь обрели свободу.\n\nМасул, вождь стада, лично поблагодарил %31. «Вы спасли мой народ от медленной и мучительной смерти. Мы будем вечно благодарны вам. Мы с радостью присоединимся к вашему союзу»."
    3: "В логове Бальтазара"
  "12":
    1: "И так Джадам объединился — или, по крайней мере, настолько, насколько это было возможно. Стало ясно, что трёх союзников должно хватить, ведь события, связанные с катаклизмом, достигали своей кульминации. Теперь было известно, что с помощью равеншорского кристалла Разрушитель создал четыре портала, ведущих в стихийные планы земли, воздуха, воды и огня. Из порталов хлынули существа стихийных планов и начали войну против Джадама.\n\n%31 повёл отряд обратно в торговый дом в Равеншоре. «Совет альянса сформирован», — сообщил %33 своим товарищам-авантюристам, %32. «Теперь мы должны следовать их указаниям».\n\nДействительно, когда они прибыли, у совета уже было для них задание. Элгар Феллмун объяснил: «С нами связались магическим путём из королевского двора Энрота… Я, конечно, имею в виду Роланда и Кэтрин Айронфист, короля и королеву земель за восточным морем. Они плывут в Джадам, чтобы присоединиться к нам. К сожалению, их путь преградил пиратский флот Регнана».\n\n«Пираты — бич Джадама. Я не знаю, как именно, но вы должны что-то сделать, чтобы помочь Айронфистам высадиться на берег»."
    3: "Задание от Совета"
  "13":
    1: "Не видя другого выхода, %31 вернулся на Острова Кинжальной Раны. Если пираты нападали именно оттуда, то, возможно, именно там удастся найти способ добраться до Регны? %31 был полон решимости выяснить это. И удача действительно улыбнулась %34, ведь, обыскивая небольшой форт, возведённый пиратами, отряд обнаружил необычное судно. Оно не только могло двигаться, как другие лодки, но и нырять, как кит, безопасно перевозя пассажиров под водой.\n\nВоспользовавшись способностью судна передвигаться под водой, чтобы незаметно проскользнуть мимо регнанских надводных кораблей, отряд благополучно добрался до Регны. Там %31 придумал смелый план. «Мы должны найти ту часть регнанского флота, которая находится здесь, в порту. Если нам удастся потопить эти корабли, пираты отзовут свой морской флот для защиты своего родного острова. Тогда наши новые союзники, Айронфисты, смогут беспрепятственно высадиться на Равеншоре».\n\nТакой портовый флот действительно существовал, и путь к нему оказался нелёгким. Его причалы были построены в хорошо укреплённой морской пещере, доступ к которой был возможен только через главную регнанскую крепость. %31 и его товарищи были вынуждены в тот день сразить немало регнанцев, прокладывая путь к огромному гроту, служившему главным портом флота Регны. Переходя от корабля к кораблю, они пробивали корпуса ниже ватерлинии. Вскоре флот лежал в руинах. Выполнив задачу, отряд благополучно скрылся."
    3: "Среди правящих"
  "14":
    1: "Вернувшись в торговый дом в Равеншоре, отряд встретил возбуждённый Элгар Феллмун. «Отлично поработали с регнанами. Прибыли Айронфисты и поделились своей мудростью на совете. А ещё лучше — они привели с собой своего придворного мудреца Ксантора. Он хорошо разбирается в подобных делах. Поговорите с ним; у него есть план».\n\nКсантор разместился в жилище неподалёку от кристалла. На его лице были отчётливо видны морщины, прочерченные опытом, и он властно обратился к %31: «Я полагаю, что кристалл Разрушителя обладаёт заклятием, которое заставляет обитателей стихийных планов нападать на наш план. Сила этой магии объясняет огромные размеры кристалла. Второе назначение кристалла заключается в том, что он служит вратами в место, откуда Разрушитель ведёт свою кампанию уничтожения. Я полагаю, что это царство хаоса — источник, из которого формируются все остальные планы существования. Вы должны добраться до этого «Плана между планами» и сразиться с самим Разрушителем».\n\n«Но сначала вам нужно создать средство для входа в кристалл — ключ. Кристалл настроен на энергии стихий, и ключ тоже должен быть таким же. Я могу его изготовить, но мне нужны компоненты, которые можно найти только в планах земли, воздуха, воды и огня. Мне нужны сердечные камни стихий. Их вы должны добыть для меня»."
    3: "Прибытие Айронфистов"
  "15":
    1: "%31 и его спутники продолжили своё путешествие через врата стихий!\n\nНа Плане Огня им пришлось пробиваться через лабиринт хрупких мостов, перекинутых через бесконечное море лавы. На каждом шагу им противостояли свирепые саламандры и фениксы. Но они пробились к замку из раскалённого железа и там обрёли Сердце Огня.\n\nОни проплыли через глубины Плана Воды, едва избежав гибели в челюстях гигантских черепах и на трезубцах тритонов. И Сердце Воды они нашли в странном святилище среди глубоководных морских каньонов.\n\nОни пробрались через тесные и бесконечные ходы Плана Земли. Преодолев испытания в виде каменных стражей, они обрели там Сердце Земли.\n\nГромовые птицы и существа, наполовину люди, наполовину вороны, густо роились в бесконечных просторах Плана Воздуха, лишённых небосвода. Кружащимися стаями они набрасывались на отряд, но не смогли помешать ему добраться до окружённого облаками замка, где было найдено Сердце Воздуха.\n\nИ во всех этих местах им противостояли обезумевшие обитатели планов. Все они были охвачены безумием, вызванным тёмным заклятием кристалла. Это было ужасающее зрелище, и всех опечалило то, что им пришлось убить столько невинных людей, попавших в ловушку Разрушителя.\n\nКогда %31 передал Ксантору четыре камня-сердца, тот быстро приступил к созданию ключа, о котором говорил ранее. Созданное им устройство гудело, наполненное энергией стихий. «Возьми этот „ключ слияния“. С его помощью ты сможешь проникнуть в кристалл, через который найдёшь проход в Мировое Пространство. Там, я полагаю, ты найдёшь Разрушителя. Я не знаю, что тебе предстоит там сделать, но до сих пор ты проявил находчивость. Надеюсь, ты и впредь будешь таким же, ибо наше спасение лежит на твоих плечах. Не подведи нас!»"
    3: "Сферы стихий"
  "16":
    1: "В соответствии с замыслом, ключ Ксантора открыл портал в кристалл, и отряд прошёл в него. Внутри находился странный проход со стенами из алмазов, охраняемый драконами с телами из драгоценных камней и другими минеральными противниками. Даже эти герои, столкнувшиеся со многими загадками на стихийных планах и в других местах, были ошеломлены, но %31 сплотил %32 последователей. Именно смелое руководство %32 помогло им пройти через проход и добраться до Плана между планами.\n\nЦарство Разрушителя было царством безумия. Созданный из первородной субстанции хаоса, План между планами — место, совершенно непригодное для существования более упорядоченных существ. Хотя туда попадали лишь единицы, говорят, что более слабые существа мгновенно сходят с ума под непосильным гнётом раздора. Но это место отнюдь не безлюдно. Странные чудовища, сложенные из энергии кошмаров, бродят по пустошам этого мира; они ждут своего часа, чтобы проникнуть в сны обитателей других миров.\n\nОбычно мы воспринимаем этих монстров как ментальные призраки беспокойного сна, но именно их опасные физические формы преграждали путь искателям приключений к дворцу Разрушителя. В конце концов, однако, им всё же удалось прорваться. По пути они миновали скульптуры и сооружения непостижимой формы. Они почти не обращали на них внимания, учитывая яростные сражения вокруг. Итак, избитые и измученные, они вошли в дворец-лабиринт и вскоре оказались перед самим Разрушителем.\n\n«Почему?» — спросил %31. «Почему, Разрушитель, ты стремишься к уничтожению моего мира? Мы любим его и хотим, чтобы ты отказался от этого».\n\nБожество посмотрело на %34 с безразличием. «Моё внимание привлек ваш мир, когда он был поражён демонами. Я выяснил, что вы называете событие, ознаменовавшее их приход, „Ночью кометы“. Демоны, или „Криган“, пришли вместе с ней. Мои господа создали меня как крайнюю меру против них. Если они появляются в мире, неспособном защитить себя, меня призывают, чтобы я не допустил их распространения».\n\n«Но мы же справились с ними!» — воскликнул %31. «Ведь всего лишь в прошлом году Кэтрин Айронфист истребила их. Ваша задача уже выполнена».\n\n«Это я знаю», — сказал Разрушитель. «Однако, раз меня вызвали, меня уже нельзя отозвать. Когда мне поручили эту миссию, креганы ещё были живы. Так устроили меня мои создатели, которые ужасно пострадали от рук креганов».\n\n%31 был ошеломлён. «Это безумие!»\n\n«Согласен», — сказал Разрушитель, покачав головой. «И я бы хотел положить этому конец, но не могу помочь тебе напрямую. Но представь, что я положу эти ключи», — он поднял кольцо с четырьмя ключами с драгоценными навершиями, — «на стол, а затем отвернусь? И если, пока я буду стоять спиной, эти ключи исчезнут, откуда мне узнать, что с ними случилось?» И, сказав это, Разрушитель положил таинственное кольцо с ключами на стол перед собой и повернулся, чтобы рассмотреть богато украшенный гобелен за своим троном.\n\n%31 тихо подошёл к столу и спрятал ключи в карман. Настойчивым жестом %33 приказал группе последовать за %34 из тронного зала, подальше от загадочного Разрушителя."
    3: "«Разрушитель»"
  "17":
    1: "Выйдя из дворца, %31 осмотрел ключи Разрушителя. Драгоценные камни в их головках были изготовлены из сердечных камней стихий — каждый ключ имел один из четырёх типов: земля, воздух, вода и огонь. «Возможно, они открывают двери в какие-то из этих странных зданий», — предположил один из членов отряда.\n\nЭто казалось вполне вероятным, поэтому последователи %31 и %32 начали обследовать территорию вокруг дворца. У некоторых зданий были двери без видимых замочных скважин. У других дверей не было вовсе — это были незащищённые оболочки, открытые для всех. Но было четыре сооружения, которые отличались от остальных. Хотя у них не было видимых дверей, при приближении к каждому из них один из четырёх ключей Разрушителя начинал светиться, излучая свет из своего драгоценного навершия. Для каждого ключа было по одному такому сооружению. Несколько экспериментов показали, что в присутствии подходящего ключа стены этих сооружений становились такими же проницаемыми, как стена тумана.\n\nИтак, искатели приключений вошли в каждое из четырёх сооружений. И каждое из них оказалось тюрьмой одного из четырёх повелителей стихий. Поскольку они обладали достаточной мощью, чтобы противостоять порабощающему воздействию кристалла Равеншора на своих подданных, Разрушитель заключил их в тюрьму, чтобы ускорить выполнение своей миссии.\n\nВ тюрьме из воды искатели приключений нашли и освободили Пираннаст, Повелителя Огня. Его противоположность, Акваландер, Повелитель Воды, они обнаружили в камере с пылающими стенами. Здание, где находился Гралкор Жестокий, Повелитель Земли, было необъяснимым образом заполнено облаками и небом, а его камера висела в воздухе без какой-либо видимой опоры. Повелителя Воздуха, Шалвенда, они нашли в глубокой земляной пещере.\n\nПосле освобождения Шалвенд поблагодарил %31. «Благодаря вам мои страдания и страдания моих подданных закончились. Теперь я отправляюсь наводить порядок в своём воздушном царстве. Вместе с моими братьями-повелителями мы обладаем силой, способной победить Разрушителя. И мы сделаем это незамедлительно. Я советую вам поспешить покинуть этот мир и вернуться в свой»."
    3: "Повелители стихий"
  "18":
    1: "К счастью, %31 прислушался к настоятельным призывам Шалвенда поспешить, иначе группа %33 и %32 могла бы оказаться в ловушке, лишившись возможности вернуться в свой мир. Останавливаясь лишь для боя с уцелевшими противниками, искатели приключений поспешили через земли хаоса, прошли по кристальному проходу и вернулись на городскую площадь в Равеншоре. Там их встретил Ксантор, который, казалось, ждал их.\n\n«Отличная работа, — сказал маг, — и вы прибыли как раз вовремя, чтобы увидеть результаты. Отойдите от кристалла и посмотрите! Повелители стихий приближаются».\n\nАвантюристы сделали так, как просил Ксантор. Отступая от кристалла, они почувствовали, как задрожала земля, когда повелители, теперь достигшие гигантских размеров, вошли на городскую площадь. Намеренные уничтожить кристалл, они сосредоточили на нём свои силы. Затем, как один, они начали метать лучи чистой стихийной силы на мерзкий самоцвет Разрушителя. Сначала он сопротивлялся мощной энергии, но затем повелители усилили атаку. Когда их могучие лучи ударили по граням кристалла, тот начал светиться и вибрировать. Воздух наполнился пронзительным звуком, словно звон сотни церковных колоколов. И тогда, под бесконечную какофонию разбивающегося стекла, кристалл исчез.\n\nЗавершив своё дело, лорды удалились. Гралкор погрузился в землю под своими ногами, а Акваландер растворился в огромном потоке воды, хлынувшем в реку Альвар, протекающую через город. Пираннаст превратился в огромный огненный шар, который поднялся в небо, а затем устремился за горизонт. Шалвенд поднялся в воздух и превратился в облако, унесённое могучим ветром. «Прощайте», — сказал он затихающим голосом. «Сегодня ваш день, герои Джадама. Прощайте…»\n\nТак заканчивается история о Дне Разрушителя и о приключении, благодаря которому %31 стал так хорошо известен в этих землях — о том, как %33, спасший землю от абсолютной гибели, вышел из полной безвестности и стал героем всех таверненных историй. Какие новые истории будут рассказываться об этом могучем искателе приключений, покажет только время. Но так же верно, как то, что %31 бродит по просторам Джадама, я уверен, что их будет много.\n\nКОНЕЦ"
    3: "Герои Джадама"
