  "1":
    1: |-
      Соберитесь вокруг, и я поведаю вам историю Дня Разрушителя. Это сказание о том, как могучие пали, а слабые обрели силу; о великой угрозе, которую отвели герои, упорно исполнявшие возложенный на них долг. Сегодня я расскажу о %31, восставшем из полной безвестности и ставшем величайшим героем нашего времени — гордостью Джадама! И о том, как %33 спасли страну от грозного Разрушителя.

      При всём причинённом им разорении Разрушителя видели в Джадаме лишь однажды. Ярким зимним днём он с непостижимой целью вошёл в портовый город Равеншор. Как вам известно, среди городов Джадама Равеншор отличается редкой терпимостью к чужакам, однако появление одинокого богача привлекло внимание местных грабителей и карманников. Но их алчность обратилась в страх: стоило одному за другим приблизиться к незнакомцу с дурными намерениями, как невидимая сила отбрасывала их прочь, а Разрушитель невозмутимо шёл к городской площади.

      Это не осталось незамеченным. Вскоре тролли, огры, тёмные эльфы и прочие горожане хлынули из домов и лавок и последовали за молчаливым, не обращавшим на них внимания незнакомцем — разумеется, на безопасном расстоянии. Когда он достиг площади, там собралась огромная толпа — на свою беду, ибо многих разорвало на части или покалечило высвобожденными им космическими силами. Ударив скипетром о землю, Разрушитель заставил громадные кристаллы вырасти из-под земли. Тех, кого не свалили разломы почвы, отбросили волны огня и воздуха, пока кристаллы складывались в исполинское сооружение из сияющего алмаза. Стены сомкнулись вокруг Разрушителя, и вскоре он исчез из виду.

      Разрушитель пропал. Всё случившееся можно было бы счесть сном, если бы не кристальное сооружение — настолько огромное, что лавки и дома вокруг городской площади казались рядом с ним крошечными.

      Но это было лишь начало. Содеянное Разрушителем почувствовали в самых дальних уголках джадамского пограничья. Вместе с кристаллом пришли наводнения, огненные бури, водовороты и вулканы, а вслед за ними — захватчики с элементальных планов. Казалось, кристалл предназначался не только для того, чтобы скрыть Разрушителя и посеять смятение среди жителей Равеншора. Он служил великим призывным маяком, разжигавшим войну между нашим миром и планами Земли, Воздуха, Воды и Огня.

      %31, вероятно, не сразу узнал бы об этих великих событиях, если бы почтенные Торговцы Альвара не наняли %33 охранять повозку с плодами тоберска, ожидавшую отправки с островов Кинжальной Раны. Поэтому %33 вместе с простодушными ящеролюдами Кинжальной Раны стали свидетелями страшного разрушения. На виду у берегов главного острова из моря взметнулся огромный вулкан, толкая перед собой могучую волну. Волна и горящие камни, дождём падавшие с неба, опустошили поля и хижины ящеролюдов и быстро уничтожили мосты, соединявшие обитаемые острова друг с другом и с материком Джадама.

      День и ночь на Кинжальной Ране царил хаос, а камни продолжали падать с неба. Но беды не закончились: на следующий день напали пираты Регны. Я не склонен несправедливо порочить целый народ, однако хуже регнанцев никого не припомню. Словно волки, набросившиеся на раненого телёнка, они безжалостно ударили по искалеченным островам. Высадившись с больших морских кораблей, регнанцы начали жестокую кампанию грабежей и разорения.

      В таком положении находился %31 в тот день, когда Судьба избрала %34 защитником этой земли.
    3: "День Разрушителя"
  "2":
    1: |-
      Опасность положения не укрылась от Дадеросса — главы каравана %31 и проницательного минотавра. Дадеросс понимал, что увиденное заинтересует его хозяев, тёмных эльфов из числа Торговцев Альвара. Поэтому он призвал верного стража каравана, %31, и поручил %34 важное дело: «Вы должны сообщить об этом бедствии Элгару Феллмуну, главе Торговой гильдии в Равеншоре. Он решит, что делать».

      Он передал %31 письмо. «Я знаю, что обстоятельства и пираты заперли нас здесь, но вы должны найти путь на материк. Ступайте!» С этими словами Дадеросс вернулся к другим заботам.

      Однако %31 не остался без помощи. Брекиш Одноклык, вождь деревни ящеролюдов, рассказал %34 о древних порталах, некогда позволявших путешествовать между островами, но давно переставших действовать. Одноклык также поведал %31 о Фредрике Талимэре — жившем в деревне клирике, который разбирался в устройстве порталов.

      Когда %31 разыскал Талимэра, %33 выяснил, что клирик знает не только о порталах, но и о древнем храме. Через него пролегал путь к лодочным причалам на острове, ставшем недоступным после разрушения мостов.

      И вот с помощью Талимэра %31 отправился в путь. О, дорогу преграждало множество опасностей, и не последней из них была битва между ящеролюдами и регнанцами, но %31 преодолел все препятствия. Починив порталы, %33 вскоре оказался перед древним храмом.

      Можно было бы подумать, что столь давно покинутое место необитаемо, однако это было не так. Внутри на %31 набросились всевозможные отвратительные рептилии. Хуже всех были змеи, похожие телом на людей, но лишённые искры разума. И этим опасности храма не исчерпывались: с каждым шагом в глубины срабатывали ловушки, давным-давно установленные неизвестными руками. Лишь на пределе сил %32 отряду удалось провести %31 сквозь них, выбраться живым к лодочным причалам и на %32 лодке отправиться в Равеншор на материке.
    3: "Мир должен узнать!"
