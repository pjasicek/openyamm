    10: Артефактный латный доспех
    16: (Скорость, +15 Скорость, +15 Точность, Рыцарь) Каждый великий мастер Гильдии оружейников Блэкшира создает шедевральный латный комплект в доказательство своего права удерживать свою позицию. Члены гильдии нередко тратят от десяти до двадцати лет на создание одного из этих костюмов.
  '516':
    2: Затмение
    10: Большой артефактный щит
    16: 'Предмет задания: (Духа, Тела, Разума, Священника) Когда Первый Храм Солнца был сожжен во время Войны Голубя и Вороны, сражавшейся между храмами Солнца и Луны, святой алтарь расплавился. Металл алтаря позже был собран и включен в этот щит, который носил Жрец Солнца Дерико во время его последней решающей кампании войны.'
  '517':
    2: Флитфингерс
    10: Артефактные рукавицы
    16: (+8 к навыкам «Обезоружить ловушку», «Лук» и «Оружейник»). То, что у нее действительно было имя для ее перчаток, является свидетельством яркого, хотя и заслуженного, тщеславия Дарси Дарби, наиболее широко известной своей кражей украшенного драгоценностями Жезла Права, части королевских регалий Энрота.
  '518':
    2: Сапоги Вестника
    10: Артефактные сапоги
    16: (Скорость + 30, Быстрота, Иммунитет ко сну) Когда Джерико Железный Кулак завоевал трон в Первой войне за Энротианское наследство, он послал вестников, чтобы распространить эту новость. Им выдали пары этих ботинок, чтобы новость быстро распространилась и, таким образом, как можно скорее положила конец широкомасштабным гражданским беспорядкам.
  '519':
    2: Кольцо самолетов
    10: Артефактное кольцо
    16: (+40 к сопротивлению огню, земле, воде и воздуху) Когда картограф Альвия Моррания отправилась наносить на карту местность элементальных планов, она хорошо подготовилась. Это кольцо общей защиты было среди многих особых предметов, заказанных дворами Энрота для поддержки ее экспедиции.
  '520':
    2: Шлем Дрогга
    10: Артефактный шлем
    16: (Личность +15, Интеллект +15, Регенерация очков здоровья) В истории варварских племен Вори редко можно встретить вождя, правившего долгое время. Еще реже встречается тот, кто удерживал свое положение благодаря магии, а не силе. Дрогг был именно таким — воином-магом, пережившим многие годы соперничающих испытаний. Говорят, что он носил шлем даже во сне. Теперь, когда вы обладаете им, вы понимаете, почему.
  '521':
    2: Корона Последнего Владычества
    10: Артефактная корона
    16: (Интеллект +50, Темная магия, Лич) Назван так в честь своего создателя и единственного суверенного владельца Медерона, первого и последнего Императора-лича Нигона. Вечная династия, которую он надеялся основать, просуществовала едва ли дюжину лет. Медерон избежал участи своего королевства. Говорят, что он до сих пор живет как сумасшедший и ищет по всему миру свою потерянную корону.
  '522':
    2: Крылья Архангела
    10: Артефактный плащ
    16: (Падение пера, Интеллект +30, Все сопротивления магии +10) Когда ангелы впадают в немилость, они теряют свои крылья. Поскольку это явление крайне редкое, крылья ангела — очень редкий товар. Крылья архангела почти никогда не встречаются. При использовании в качестве материала они наделяют полученный предмет фантастическими силами.
  '523':
    2: Змея
    10: Реликтовый длинный меч
    16: (Замедляет цель, Сопротивление воде -50, Личность -15) Навершие этого меча ужасно бодается сморщенной головой медузы. Хотя сила медузы значительно уменьшена, она течет вдоль клинка Змеи к его целям - хороший замысел, но плохо реализованный, поскольку часть негативной энергии перетекает и в владельца меча.
  '524':
    2: Хаос
    10: Реликтовый длинный меч
    16: (Скорость +70, Точность +70, Класс брони -20) Чары Хаоса позволяют ему легко преодолевать защиту любой цели. К сожалению, его агрессивный дух делает его равнодушным к парирующим движениям.
  '525':
    2: Завершение
    10: Реликтовый двуручный меч
    16: (10-20 очков урона от огня, Медленность, Скорость -20) Когда главный убийца Деметри Разен наконец предстал перед судом, было обнаружено, что его кожа приобрела необычную твердость благодаря постоянным чарам. Обычные клинки не смогли бы его порезать, поэтому Финалити был создан для того, чтобы нанести смертельный удар, приговоренный энротианскими судами.
  '526':
    2: Адский Тесак
    10: Реликтовый топор
    16: (Мощь +70, Точность +70, Личность -50, Интеллект -50) Назван так из-за своей способности демонизировать своего владельца, тем не менее, есть много тех, кто охотно заплатил бы цену за силу, предлагаемую «Адским тесаком».
  '527':
    2: Убийца духов
    10: Реликтовое копье
    16: (Вампир, Сила +50, Удача -40) Многие под властью Лютинера Сурового видели в существовании его копья Духоубийцы доказательство существования зла. Травмы, нанесенные копьем, выходят за рамки физических, поскольку Убийца Духов воспринимает удар как возможность выпить саму сущность своей цели.
  '528':
    2: Трезубец правления
    10: Реликтовое копье
    16: (Водное дыхание, +70 Сопротивление воде, -70 Сопротивление огню) Трезубец Правления никогда не должен был находиться на суше, однако, когда некогда могущественная империя Тритона, простиравшаяся от океана до океана, рухнула, многие из ее величайших артефактов, включая те, что находились в ее королевских сокровищах, были разграблены и пробились на поверхность.
  '529':
    2: Клинок милосердия
    10: Реликтовый кинжал
    16: (Мощь +40, 4-10 очков электрического урона, Точность -40, Некромант) Хотя в современных некромантских обычаях обычно считается немодным, живые жертвоприношения когда-то широко практиковались. Чтобы уменьшить жестокость, причиняемую своим жертвам, некромант Ферредин Милосердный создал клинок, способный принести более быстрый и менее мучительный конец.
  '530':
    2: Посох стихий
    10: Реликтовый посох
    16: (магии Воздуха, магии Огня, магии Воды, магии Земли, Класс брони -40) Навязывая своему владельцу состояние углубленной концентрации, Посох Стихий увеличивает его или ее близость к магии стихий в значительной степени. Конечно, не всегда хорошо отвлекать внимание от насущных забот.
  '531':
    2: Турнирный лук
    10: Реликтовый лук
    16: (Точность +100, навык лука +5, класс брони -20) Этот лук был создан по спецификациям великого эльфийского турнирного лучника Терин Турфезер. Турфезера больше заботила необычная стрельба, чем реалии поля боя, и вредное воздействие лука не волновало - более повседневным владельцам следует уделять больше внимания.
  '532':
    2: Молниеносный арбалет
    10: Реликтовый арбалет
    16: (Скорость, Точность -50, Темный эльф) Гениальное сочетание механики и магии было использовано при создании этого самовзводного арбалета, стреляющего с невероятной силой. Тот факт, что та же самая сила запуска заставляет его лягаться, как мул, означает, что только самые опытные могут использовать его с хорошим эффектом.
  '533':
    2: Кираса последней стадии
    10: Реликтовая кожаная броня
    16: (Личность +80, Интеллект +70, -30 сопротивления разуму и духу) Последняя стадия вырождения из человеческой формы делает Лича полностью бездушным и, следовательно, невосприимчивым к определенной магии. Такие личи часто проклинают свои личные вещи уязвимостью к этой магии, чтобы отговорить других от их использования.
  '534':
    2: Потерянный щит Эрондейла
    10: Реликтовый малый щит
    16: (Иммунитет к страху, камню, параличу и сну; личность -15, удача -15) Великий рыцарь Джерральд Эрондейл отказался от этого щита после того, как он принял на себя основной удар темного и смертельного проклятия. Хотя он все еще сохранял свою великую силу, щит также был отягощен злобной энергией.
  '535':
    2: Кольцо Слияния
    10: Реликтовое кольцо
    16: (Вода, навык Алхимии +5, Интеллект +40, Выносливость -20) Утраченная реликвия Гильдии алхимиков Фрихейвена, до ее исчезновения это кольцо было печаткой гильдмастера. Его предназначалось для ношения только во время приготовления самых мощных зелий, поскольку оно отнимало у пользователя много энергии.
  '536':
    2: Счастливая шляпа
    10: Реликвийная шляпа
    16: (Удача + 90, Личность -50) Единственная причина, по которой кто-то будет носить эту шляпу, - это удача, которую она несет. Это далеко не лесть!
  '537':
    2: Пояс берсерка
    10: Реликтовый пояс
    16: (Мощь +100, Иммунитет к страху, Точность -30, Класс брони -15) Эксперимент Гильдии ремесленников Блэкшира, этот пояс был разработан, чтобы превратить своего владельца в идеального воина - могучего и бесстрашного. Больше ничего не было сделано, когда в полевых испытаниях стало очевидно, что «безрассудство» и «беспечность» не являются достоинствами идеального воина.
  '538':
    2: Булава Солнца
    10: Особая булава
    16: Хотя на первый взгляд кажется, что это одна и та же булава, которую повсюду носят клирики Храма Солнца, кажется, что этот предмет наполнен противоречивыми энергиями.
  '539':
    2: Эбонест
    10: Особое копье
    16: 'Предмет задания: Личное копье Чарльза Кихота, убивающее драконов, Эбонест — действительно прекрасное оружие. Когда его используют против Дракона, кажется, что он безошибочно целится в щели между твердой чешуей своей цели.'
  '540':
    2: Меч Свистокости
    10: Особый двуручный меч
    16: 'Предмет задания: То, что Свистуны выбрали такое жестокое оружие в качестве своей семейной реликвии, во многом говорит об их приверженности семейному бизнесу по охоте на драконов.'
  '541':
    2: Топор Бальтазара
    10: Особый двуручный топор
    16: 'Предмет задания: Ни один король Минотавров не носит корону. Вместо этого в качестве своего должностного знака они носят огромные топоры высочайшего качества. Этот топор был утерян, когда Бальтазар был предан Ледяными Великанами Вори. То, что оно сильно зачаровано, ясно; при использовании в бою его удары наносят как обычный урон, так и ошеломляющий ледяной холод.'
  '542':
    2: Благородный костяной лук
    10: Особый лук
    16: Луки из кости кригана пользуются большим спросом; материал прочен и легко принимает чары. Самая востребованная кость добывается у криганов, бывшего правящего класса расы дьяволов.
  '543':
    2: Цикл жизни
    10: Особое кольцо
    16: (Общая жизнь, Выносливость +20) Кольцо из простого металла (меди или латуни?), теплое на ощупь.
