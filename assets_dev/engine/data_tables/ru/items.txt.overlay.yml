    10: Бутылка
    16: 'Предмет задания: Светящийся эликсир явно магических свойств.'
  '1432':
    2: Красное яблоко
    10: Яблоко
    16: Подобные яблоки производятся на деревьях, пропитанных магией, обычно в эльфийских землях Авли и Туларейском лесу, хотя и не ограничиваясь этими областями. Чтобы использовать яблоко, возьмите яблоко и щёлкните левой кнопкой по изображению вашего персонажа на экране инвентаря.
  '1433':
    2: Богатая шляпа
    10: Шляпа
    16: 'Предмет задания: Похоже, эта шляпа принадлежит более состоятельному члену общества, перо настоящее, а конструкция прочная. К сожалению, похоже, это не подходит.'
  '1434':
    2: Лютня
    10: Инструмент
    16: 'Предмет задания: Эта лютня мастерски изготовлена ​​и бережно поддерживается. Этот инструмент явно принадлежит Барду.'
  '1435':
    2: Волшебные трубки
    10: Инструмент
    16: 'Предмет задания: Несмотря на то, что эти трубки прекрасно сделаны и выглядят обманчиво просто, играть на этих трубках довольно сложно; кажется, у них есть собственное мнение.'
  '1436':
    2: Труба Грифонхарта
    10: Инструмент
    16: 'Предмет задания: Артефакт из предыдущего спора между эльфами и людьми, потерянный Терренсом Грифонхартом во время дерзкого ночного рейда эльфийских сил. Ходят слухи, что ни одна армия, сражавшаяся на стороне музыки этой трубы, никогда не была побеждена. Даже если слух ложный, он, безусловно, повысит моральный дух обеих сторон.'
  '1437':
    2: Ракушка
    10: Ракушка
    16: 'Предмет задания: Морские ракушки такого размера можно найти только на пляжах Изумрудного острова. Один из них может стать хорошим сувениром из вашего пребывания здесь.'
  '1438':
    2: Напольная плитка (со знаком луны)
    10: Плитка
    16: 'Предмет задания: Эта плитка, очевидно, была частью библиотеки Храма Луны.'
  '1439':
    2: Крылатые сандалии
    10: Сандалии
    16: (+100 Скорость, +50 Точность, +50 Сопротивление воздуху, Постепенная регенерация ОЗк и ОЗ, а также Падение перьев) Ходят слухи, что крылатые сандалии — это обувь бога, и они наделяют владельца огромной силой.
  '1440':
    2: Сезонный палантин
    10: Шарф
    16: 'Предмет задания: Временный палантин носят священники во время сезонных праздников. Хотя он не имеет никакой прямой силы, большинство простых людей верят, что он приносит удачу при посадке или сборе урожая.'
  '1441':
    2: Сундук голема
    10: Часть голема
    16: 'Предмет задания: Широкое туловище могучего голема. Похоже, что для того, чтобы он стал полностью функциональным, требуется небольшая сборка.'
  '1442':
    2: Обычная голова голема аббатства
    10: Часть голема
    16: 'Предмет задания: помятая голова могучего голема. Выглядит она немного… странно. Похоже, для полной работоспособности голема потребуется кое-что собрать.'
  '1443':
    2: Голова голема
    10: Часть голема
    16: 'Предмет задания: Гордая голова могучего голема. Похоже, что для того, чтобы он стал полностью функциональным, требуется небольшая сборка.'
  '1444':
