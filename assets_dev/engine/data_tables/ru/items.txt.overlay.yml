  '602':
    2: Ложное сообщение
    10: Отчет
    16: 'Предмет задания: Письмо, данное вам Арионом Охотником для доставки Ужасному Пирату Стэнли на Регне.'
  '603':
    2: Урна с прахом
    10: Урна
    16: 'Предмет задания: Погребальная урна, доверенная вам на попечение тролля Овердюна Щелкающего пальца. В нем находится прах его брата Вилебита.'
  '604':
    2: Жаровня «Ночная тень»
    10: Жаровня
    16: 'Предмет задания: Эта жаровня излучает тревожный свет темной магии. Сильно пахнет смолой и серой.'
  '605':
    2: Яйцо вождя драконов
    10: Яйцо
    16: 'Предмет задания: Это яйцо Дракона почти готово вылупиться. Маленькая жизнь внутри дает о себе знать редким шорохом.'
  '606':
    2: Сердце Огня
    10: Камень сердца
    16: 'Предмет задания: Сердце Огня — это драгоценный камень чистой стихийной силы, лишенный недостатков и весящий не менее сотни карет. Без сомнения, магический предмет, сделанный из него, будет невероятно мощным.'
  '607':
    2: Сердце Воды
    10: Камень сердца
    16: 'Предмет задания: Сердце Воды — это драгоценный камень чистой стихийной силы, лишенный недостатков и весящий не менее сотни карет. Без сомнения, магический предмет, сделанный из него, будет невероятно мощным.'
  '608':
    2: Сердце Воздуха
    10: Камень сердца
    16: 'Предмет задания: Сердце Воздуха — это драгоценный камень чистой стихийной силы, лишенный недостатков и весящий не менее сотни карет. Без сомнения, магический предмет, сделанный из него, будет невероятно мощным.'
