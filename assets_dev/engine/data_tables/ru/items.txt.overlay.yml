  '627':
    2: Останки Корбу
    10: Остается
    16: 'Предмет задания: Останки Корбу, который, по некоторым утверждениям, был самым могущественным вампиром всех времен. Однако сейчас ему особо не на что смотреть. Его скелет почти полностью разобран — то ли намеренно, то ли под воздействием времени, а деревянный кол полностью расположен внутри грудной клетки.'
  '628':
