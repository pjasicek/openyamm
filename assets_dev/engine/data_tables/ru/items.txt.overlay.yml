  '800':
    2: Колесо Фреландо
    10: Колесо Фреландо
    16: Колесо ценного сыра Фреландо из молока единорога. Нарезанный на крекеры, он станет прекрасным дополнением к бокалу прекрасного тоберского бренди.
  '801':
    2: Журнал Элденбри
    10: Журнал Элденбри
    16: Половник сыра Вори Эльденбри. Хотя многие пытались повторить его тонкий, дымный вкус, только мастера сыра Ледяного Гиганта из замороженных пустошей Вори знают секреты его приготовления.
  '802':
    2: Шар Дандака
    10: Шар Дандака
    16: Шарик сыра из данки. Изготовленный гоблинами Эрафии небольшими партиями, большинство считает, что это на любителя.
  '803':
    2: Грубый длинный меч
    10: Длинный меч
    16: Несмотря на зазубрины и вмятины, этот длинный меч по-прежнему остается эффективным оружием.
  '804':
    2: Эльфийская Сабля
    10: Сабля
    16: Обычное эльфийское оружие, эта сабля является смертоносным, хотя и ничем не примечательным оружием.
  '805':
    2: Острый длинный меч
    10: Длинный меч
    16: Хотя этот длинный меч выглядит довольно старым, край его лезвия необычайно острый. Вполне вероятно, что он был заколдован и оставался таким во время своего создания.
  '806':
    2: Изящный меч
    10: Длинный меч
    16: Высококачественный длинный меч, инициалы с монограммой возле основания навершия указывают на то, что он был выкован мастером-оружейником Мекоригом Слепым около 780-800 годов.
  '807':
    2: Клинок дуэлянта
    10: Длинный меч
    16: Эти редкие клинки были выкованы незадолго до Безмолвия и веками использовались благородными дуэлянтами, которые хотели умереть стильно. Нет двух одинаковых людей, но у всех общая кровавая история.
  '808':
    2: Двуручный меч
    10: Двуручный меч
    16: Этот простой двуручный меч с кожаной рукояткой — распространенная конструкция в Эрафии.
  '809':
    2: Большой меч
    10: Двуручный меч
    16: Эффективная, смертоносная конструкция, использовавшаяся во все времена менее дисциплинированными армиями. Кузнец этого двуручного меча заботливо добавил кровяную канавку по центру клинка.
  '810':
    2: Героический меч
    10: Двуручный меч
    16: 'Некоторые мастера-фехтовальщики считают, что волнистое лезвие немного прочнее прямого и наносит больший урон при ударе по противнику. Это может быть правдой, а может и нет, но одно можно сказать наверняка: мастерство изготовления этого конкретного меча является одним из лучших, которые вы когда-либо видели.'
  '811':
    2: Палаш
    10: Палаш
    16: Полированный палаш, обычно используемый всеми силами Эрафии.
  '812':
    2: Стальной палаш
    10: Палаш
    16: Прекрасный эрафианский стальной палаш превосходного качества и остроты.
  '813':
    2: Мастер Палаша
    10: Палаш
    16: Это великолепное оружие, скорее фальшион, чем палаш, сохраняет остроту, несмотря на свой возраст.
  '814':
    2: Абордажная сабля
    10: Абордажная сабля
    16: Загнутая назад форма абордажной сабли помогает противникам недооценивать истинную дальность действия оружия. Многие неопытные фехтовальщики погибли из-за этого обманчивого замысла.
  '815':
    2: Сабля гоблина
    10: Абордажная сабля
    16: Странная смесь латуни и другого красноватого металла придает этому оружию странный цвет и необычайную силу. Гоблинов-ремесленников обычно не заботит внешний вид, но когда дело доходит до убийства, на них можно рассчитывать, что они сделают все правильно.
  '816':
    2: Изысканная абордажная сабля
    10: Абордажная сабля
    16: Искусно скрытые инициалы возле навершия этой абордажной сабли доказывают, что это прекрасное оружие является работой Алека Телинга, мастера-кузнеца Харека IX, лорда Регны и императора Бесконечного океана.
  '817':
    2: Импровизированный кинжал
    10: Кинжал
    16: Грубый кинжал, который повсюду можно найти в руках воров и хулиганов.
  '818':
    2: Гномий кинжал
    10: Кинжал
    16: Этот кинжал, больше похожий на короткий меч для гнома, является отличным примером превосходной дварфийской инженерной мысли и низкого художественного творчества.
  '819':
    2: Кинжал Акулье Зуба
    10: Кинжал
    16: «Лезвие» этого кинжала на самом деле представляет собой зуб акулы, взятый из вод Тихого океана и закрепленный на причудливой рукоятке. Он очень острый и легкий.
  '820':
    2: Кинжал убийцы
    10: Кинжал
    16: Крестовина этого кинжала складывается, чтобы его было легче спрятать. Пружина в навершии очень тихо выдергивает крестовину, когда кинжал вынимается из ножен.
  '821':
    2: Чудо-кинжал
    10: Кинжал
    16: Оружие из Времени чудес, более острое или сильное лезвие уже невозможно сделать.
  '822':
    2: Дрянной длинный кинжал
    10: Длинный кинжал
    16: Длинный кинжал сочетает в себе большую дальность действия меча и скрытность кинжала.
  '823':
    2: Эрафианский длинный кинжал
    10: Длинный кинжал
    16: Этот длинный кинжал внешне напоминает меньшие эрафианские кинжалы, сделанные из акульих зубов, но его лезвие явно стальное. Конструкция прочная и надежная, а лезвие так же смертоносно, как и акульий зуб, за исключением того, что оно лучше держит заточку и его легче затачивать.
  '824':
    2: Изысканный длинный кинжал
    10: Длинный кинжал
    16: Запасной, но привлекательный дизайн этого длинного кинжала типичен для артефактов до Безмолвия. Этот конкретный стиль был очень популярен в то время, но, поскольку прошло более тысячи лет, осталось немногие. Как и все со времен Безмолвия, оно выглядит таким же новым, как и в тот день, когда оно было создано.
  '825':
    2: Грубый топор
    10: Топор
    16: Этот примитивный топор больше похож на простой инструмент, чем на оружие.
  '826':
    2: Боевой топор
    10: Топор
    16: Расклешенный край клинка — распространенный стиль, используемый малобюджетными человеческими армиями и бандитами.
  '827':
    2: Топор гномов
    10: Топор
    16: 'Типичное производство гномов: прочное, практичное и простое.'
  '828':
    2: Стальной топор
    10: Топор
    16: Один из нескольких ящиков с такими топорами, украденных у гномов чернокнижниками Нигона. Каждое из этих видов оружия было закалено и зачаровано в литейной мастерской Каменного города и проштамповано их клеймом.
  '829':
    2: Топор Минотавра
    10: Топор
    16: Подобные двулезвийные топоры мощно зачарованы колдунами-минотаврами с помощью секретного процесса, известного только им. Эти топоры легкие там, где они должны быть тяжелыми, и прорезают металлическую броню так же легко, как и ткань.
  '830':
    2: Секира
    10: Двуручный топор
    16: Этот топор с длинной рукояткой имеет больший радиус действия и большую мощность, чем обычный одноручный топор.
  '831':
    2: Секира воина
    10: Двуручный топор
    16: 'Эта секира имеет более острое лезвие, оснащенное всеми новейшими военными технологиями: бороздками для крови, отверстиями для свистков и уравновешенным лезвием меньшего размера за рукояткой для сложных, потрошащих ударов на спине.'
  '832':
    2: Секира палача
    10: Двуручный топор
    16: Секира Палача, названная так в честь устройства казни, любимого палачами, имеет более длинное лезвие, позволяющее избежать грязных и неловких ошибок при казни.
  '833':
    2: Грубое копье
    10: Копье
    16: Несмотря на то, что это копье состоит из заостренного камня, прикрепленного к грубой палке, оно может нанести серьезный урон. (+1D9 при использовании двуручным оружием).
  '834':
    2: Солдатское копье
    10: Копье
    16: Подобные копья встречаются во всех армиях, где регулярно демонстрируется их универсальность как в качестве древкового, так и в качестве оружия ближнего боя.
  '835':
    2: Эльфийское копье
    10: Копье
    16: Эльфийское оружие почти всегда столь же изящно, сколь и практично. Стиль и элегантность копья не были достигнуты за счет практичных качеств, таких как прочное крепление наконечника к рукоятке или выбор металла и рукоятки.
  '836':
    2: Жестокое копье
    10: Копье
    16: Треугольная форма наконечника копья приводит к особенно болезненным ранам, которые не заживают легко и плохо. Рунические заклинания, начертанные вдоль рукоятки, предполагают заклинания, усиливающие жестокий эффект треугольной головки.
  '837':
    2: Великолепное копье
    10: Копье
    16: Символ кузницы и штамп даты указывают на то, что это копье было изготовлено в магических кузницах губернатора Падиша за 12 лет до Безмолвия.
  '838':
    2: Старая алебарда
    10: Алебарда
    16: Как и все алебарды, это оружие представляет собой топор с очень длинной рукоятью. Это универсальное оружие, которое можно использовать как копье, когда в боевой комнате тесно, или как посох, когда необходима личная защита. Это обычная работа и материалы.
  '839':
    2: Утяжеленная алебарда
    10: Алебарда
    16: Рукоять этой алебарды имеет сердцевину и заполнена свинцовым стержнем. При взмахе оружия ведущий стержень с громким треском скользит к лезвию алебарды, добавляя удару силу и вес.
  '840':
    2: Могучая алебарда
    10: Алебарда
    16: Небольшой штамп на клинке этого оружия указывает на то, что оно было изготовлено в знаменитой литейной мастерской Мекорига самим мастером, Мекоригом Слепым. Вам будет сложно найти более прекрасную алебарду в любой точке мира.
  '841':
    2: Грубый трезубец
    10: Трезубец
    16: Вариант фермерских вил, трезубец, использовался копейщиками с незапамятных времен. Сейчас это традиционное оружие воинов-мореплавателей всего мира.
  '842':
    2: Колючий трезубец
    10: Трезубец
    16: 'Улучшенная конструкция трезубца: кончики пальцев имеют грубые, обращенные назад зазубрины. Эта конструкция наносит гораздо больший урон, если оружие выдергивают у жертвы.'
  '843':
    2: Боевой трезубец
    10: Трезубец
    16: Стиль, излюбленный Иммерским Ренганским флотом, два боковых зубца боевого трезубца тонкие и острые, поэтому рубить так же легко, как колоть. Чтобы еще больше произвести впечатление на врагов, зубья позолочены из латуни, а рукоять выкрашена в желтый цвет, создавая впечатление, будто регнанцы сражаются золотым оружием.
  '844':
    2: Грубый лук
    10: Длинный лук
    16: Простой длинный лук, изготовленный из обычных материалов и лишенный вдохновения дизайна.
  '845':
    2: Длинный лук
    10: Длинный лук
    16: Длинный лук более высокого качества, созданный по образцу эльфийского длинного лука, но без эльфийских навыков.
  '846':
    2: Эльфийский длинный лук
    10: Длинный лук
    16: Выгравированные инициалы у основания лука указывают на то, что этот лук был изготовлен мастерской мастера-лучника Ивана Сельвинга во время Лесных войн в конце 600-х годов.
  '847':
    2: Композитный лук
    10: Длинный лук
    16: Композитные луки изготавливаются из различных материалов и деталей, а не из цельного куска дерева. Они, как правило, более гибкие и мощные, чем обычные луки.
  '848':
    2: Лук Грифона
    10: Длинный лук
    16: Ужасные материалы, использованные в этом луке — череп грифона и прочный позвоночник — делают лук удивительно прочным и мощным. Излишне говорить, что собирать урожай трудно, и грифоны сопротивляются гораздо сильнее, чем тисы.
  '849':
    2: Грубый арбалет
    10: Арбалет
    16: Хотя арбалеты имеют множество преимуществ — фиксация защелки тетивы, превосходная сила выстрела, простота в освоении — они не сравнятся с длинным луком, когда скорость и дальность стрельбы имеют решающее значение.
  '850':
    2: Тяжелый арбалет
    10: Арбалет
    16: Эти арбалеты были накоплены Арчибальдом незадолго до Войны за Наследие для использования против его брата. Как и большинство решений, связанных со смертью, Арчибальд сделал мудрый выбор. Эти арбалеты являются одними из лучших в стране.
  '851':
    2: Идеальный арбалет
    10: Арбалет
    16: Это одновременно и арбалет, и произведение искусства — скульптура темной фигуры с изогнутыми рогами вместо луковых посохов. Было бы менее удивительно, если бы это действительно было просто украшение, но в нем есть все необходимые механические детали, искусно встроенные в деревянную раму. Его происхождение неизвестно, хотя можно с уверенностью предположить, что это продукт темного колдовства, а его характеристики соответствуют его внешнему виду.
  '852':
    2: Сырая булава
    10: Булава
    16: Булава, едва более сложная, чем обычная дубинка, немного более эффективна и гораздо более долговечна.
  '853':
    2: Шипастая булава
    10: Булава
    16: Это оружие предназначено для нанесения хорошего урона как бронированным, так и небронированным противникам.
  '854':
    2: Булава фанатика
    10: Булава
    16: Обычная булава с Каригора, она демонстрирует такое же превосходное качество, как и все оружие и снаряжение с этого острова.
  '855':
    2: Гномий Утренняя Звезда
    10: Булава
    16: Разновидность булавы, моргенстар бьет медленнее, но гораздо сильнее. Шипы на шаре гарантируют, что получатель почувствует удар, независимо от доспехов и шкуры.
  '856':
    2: Верховный цеп
    10: Булава
    16: Цепы — более тяжелое и грозное оружие, чем моргенстар, и они почти так же опасны для своего владельца, как и для противников. Цепы, подобные этому, высочайшего качества и тщательно зачарованы Гильдией чернокнижников Нигона.
  '857':
    2: Самодельный молоток
    10: Молот
    16: Грубое, похожее на инструмент оружие, этот молот снабжен цепочкой на запястье, предотвращающей его выпадение из руки.
  '858':
    2: Боевой молот
    10: Молот
    16: Самыми большими преимуществами этого относительно простого молотка являются его небольшая зона удара из-за размера головки и шип на обратной стороне, который можно использовать для нанесения довольно неприятных ран.
  '859':
    2: Двемерский молот
    10: Молот
    16: Вершина семейства молоткового оружия. Этот молот гномов был изготовлен в кузницах Каменного города, и каждая его деталь идеальна — баланс, вес, материал рукоятки, конструкция головки — все самое лучшее, что возможно с помощью современных металлургических технологий.
  '860':
    2: Первобытный клуб
    10: Клуб
    16: Примитивное оружие, которым могут воспользоваться даже самые глупые монстры. Эта дубина построена из эрафийского дуба.
  '861':
    2: Шипованная дубинка
    10: Клуб
    16: Эта маленькая дубинка оснащена острыми, похожими на шипы шипами, которые в некоторой степени компенсируют ее компактный размер.
  '862':
    2: Стальная дубина
    10: Клуб
    16: Симметрия и длина набалдашника на конце клюшки — единственная особенность, отличающая эту клюшку от булавы. Баланс хороший, конструкция крепкая, но это все же клуб, и от него многого ожидать нельзя. Вероятно, производства гоблинов.
  '863':
    2: Простой посох
    10: Персонал
    16: Посох – обычное оружие угнетенных.
  '864':
    2: Посох железного ядра
    10: Персонал
    16: Этот посох наполнен железом, чтобы наносить более сильный удар, чем обычный посох, но при этом выглядит не более чем причудливой тростью. Древесина – полированный ясень, украшенный изящной резьбой.
  '865':
    2: Посох волшебника
    10: Персонал
    16: Странное сочетание дерева, стекла и алюминия образует посох, а на вершине его находится хрустальный череп. Все оружие скреплено клеем и сильными чарами, чтобы получился один из самых легких и прочных посохов в мире.
  '866':
    2: Бластер
    10: Древнее оружие
    16: Оружие огромной силы, почти наверняка созданное во времена чудес.
  '867':
    2: Бластерная винтовка
    10: Древнее оружие
    16: Лучшее личное оружие, созданное во времена чудес, бластерные винтовки могут нанести смерть быстрее, чем любое оружие, которое вы когда-либо видели.
  '868':
    2: Доспехи из грубой кожи
    10: Кожаный доспех
    16: Кожаные доспехи — самые легкие и легко изнашиваемые доспехи, но они обеспечивают меньшую защиту, чем более тяжелые доспехи. Кожа этого костюма была неправильно обработана и до сих пор пахнет химикатами, использованными при ее производстве.
  '869':
    2: Кожа с шипами
    10: Кожаный доспех
    16: Этот комплект кожаных доспехов скрепляется бронзовыми заклепками вместо кожаных ремней. Такая конструкция делает его немного прочнее, но и немного тяжелее.
  '870':
    2: Офицерская кожа
    10: Кожаный доспех
    16: В остальном обычный кожаный доспех, этот костюм пропитан тонкими чарами, которые укрепляют материал от ударов, не увеличивая при этом вес.
  '871':
    2: Светлая кожа дракона
    10: Кожаный доспех
    16: Стандартная кожаная броня для офицеров ВМС Регнана. Все такие кожаные доспехи подвергаются чарам, усиливающим и облегчающим их во время их создания в Оружейной палате Регнана.
  '872':
    2: Королевская кожа
    10: Кожаный доспех
    16: 'Всего несколько костюмов, подобных этому, были изготовлены по специальному заказу для членов королевской семьи Эрафии — Грифонхартов. Этот должен был быть получен в одном из трех мест: украден из дворцового арсенала, взят на поле битвы или украден из могилы.'
  '873':
    2: Растрепанная кольчуга
    10: Кольчуга
    16: Кольчуга — это броня, состоящая из маленьких переплетенных металлических петель. Похоже, кто-то забыл смазать кольца или, может быть, оставил их под дождем, потому что в подмышках и под воротниками начала образовываться ржавчина.
  '874':
    2: Качественная стальная кольчуга
    10: Кольчуга
    16: Этот костюм кольчуги сделан из стали и на самом деле легче, чем аналогичные костюмы из обычного железа. В его конструкции использовались тонкие кольца, но состав стали делает их очень прочными.
  '875':
    2: Тонкая кольчуга
    10: Кольчуга
    16: Высококачественная сталь усилена тонкой кожей с шипами для смягчения ударов и минимизации веса. Кожаные детали весьма художественны и приятны для глаз.
  '876':
    2: Великолепная кольчуга
    10: Кольчуга
    16: Отличительный доспех, предназначенный для облегчения распознавания офицеров во время боя. Помимо того, что эта броня просто хорошо выглядит, она является одной из самых легких и гибких кольчуг из существующих.
  '877':
    2: Золотая кольчуга
    10: Кольчуга
    16: Очень редкий доспех, полученный в Небесных Кузницах Губернатора Падиша еще до Безмолвия. Первоначально доспехи носили исключительно высшие офицеры губернатора как знак должности. Это не просто для галочки; эта кольчуга легче, прочнее и гибче, чем любая другая цепь в мире.
  '878':
    2: Латы
    10: Латы
    16: Латный доспех — самый прочный из существующих доспехов. Он намного тяжелее других доспехов, и чтобы привыкнуть к его ношению, требуется значительная практика. Этот костюм сделан из железа, качество изготовления ничем не примечательно.
  '879':
    2: Великолепный латный доспех
    10: Латы
    16: 'Этот комплект лат, выкованный в эратском арсенале, несёт свежее клеймо: Б. Р., литейная Стедвика, 1151. Инициалы принадлежат Байрону Рокерманну, королевскому оружейнику Эрафии. Его работы искусны и изящны.'
  '880':
    2: Благородный латный доспех
    10: Латы
    16: Такой прекрасный доспех мог быть создан только в кузнице самого Мастера — Мекорига Слепого. Действительно, на этом возле пятки есть инициалы его сына Касева Мекорига. Соединения легко двигаются, а металл имеет любопытную конструкцию с тройным покрытием, что делает его тонким и легким, но невероятно прочным. Набивка тоже удобная.
  '881':
    2: Щит гоблина
    10: Большой щит
    16: Простой старый щит с грубыми отметинами на лицевой стороне. Некрасиво, но практично.
  '882':
    2: Деревянный щит
    10: Большой щит
    16: Этот щит сделан из дерева и обрамлен железом. Он тяжелый, но хорошо сконструирован и находится в хорошем состоянии.
  '883':
    2: Щит всадника
    10: Большой щит
    16: Узкий и сужающийся книзу, этот щит предназначен для боя верхом на лошади, но отлично подойдет и пешим. Конструкция плотная, а материалы прочные — он должен выдерживать прямой удар копья.
  '884':
    2: Стерлинговый щит
    10: Большой щит
    16: Этот щит, сделанный из легкого металла, имеет литейное клеймо из арсенала Келебрима. Несмотря на лёгкость, материал очень прочный, а металл сваривается практически бесшовно.
  '885':
    2: Финаксианский щит
    10: Большой щит
    16: Эти щиты были выкованы Финаксианской империей во время ее недолгого прихода к власти в степях южной Эрафии (790-864). Они сделаны из стали, металла, который хорошо поддается зачарованию и внес большой вклад в военную мощь Финаксии. К сожалению, добыть очень мало металла удалось, и в 864 году н.э. Финаксия пала. к наступлению эльфов.
  '886':
    2: Сырой Баклер
    10: Малый щит
    16: Небольшой деревянный баклер, предназначенный для защиты от стрел, не обременяя владельца. Качество любительское, но в хорошем состоянии и сослужит свою службу.
  '887':
    2: Бронзовый щит
    10: Малый щит
    16: Бронзовые щиты легче железных щитов того же размера, но не так прочны. Этот конкретный вариант немного большего размера и достаточно хорошо защищен от ржавчины.
  '888':
    2: Металлический щит
    10: Малый щит
    16: Красивый красный рисунок на поверхности этого щита означает, что он от Дейи, а краска — это не краска. Эмульгаторы и консерванты помогают сохранить первоначальный цвет…
  '889':
    2: Сплавный щит
    10: Малый щит
    16: Точная смесь металлов в этих прочных щитах была утеряна сотни лет назад. Попытки заново открыть процесс их создания закончились жалким провалом. В этих щитах нет абсолютно ничего зачарованного или магического — любые чары, которые они несут, были добавлены после их создания.
  '890':
    2: Величественный Щит
    10: Малый щит
    16: Темный, золотистый цвет этих щитов на самом деле является недостатком. Около пятидесяти таких щитов были изготовлены Небесной Кузницей, когда она начала выходить из строя. Хотя они несовершенны, они уступают только щитам, созданным Кузницей в ее расцвете сил.
  '891':
    2: Рогатый шлем
    10: Шлем
    16: Этот дешевый шлем больше подойдет для костюмированной вечеринки, чем для битвы. Рога приклеены к жесткой кожаной кепке, выкрашенной в черный цвет, чтобы она выглядела устрашающе. Материал хрупкий и шелушащийся и, вероятно, развалится в самый неподходящий момент.
  '892':
    2: Шлем призывника
    10: Шлем
    16: Простой стиль и единообразие этих шлемов призваны вселять ужас в сердца врагов, когда они видят ряд за рядом марширующих к ним бронзовых шипастых шлемов.
  '893':
    2: Эльфийский шлем
    10: Шлем
    16: Этот шлем использовался эльфами Эрафии еще до наступления Безмолвия. Он состоит из серебра и стали и очень прочен.
  '894':
    2: Финаксианский шлем
    10: Шлем
    16: Эти шлемы, которые носили финаксидские драгуны во время расширения своей империи несколько сотен лет назад, прочные, гибкие и легкие. Они сделаны из двух полосок драконьей шкуры, скрепленных между собой металлическими заклепками.
  '895':
    2: Шлем Могреда
    10: Шлем
    16: Эти шлемы, наполовину сделанные из черепа свирепого зверя Могреда в Каригоре, становятся все более редкими с каждым годом по мере того, как Могреды приближаются к исчезновению. Из красных пятен на передней части шлема росли два ядовитых шипа.
  '896':
    2: Крестьянская шляпа
    10: Шляпа
    16: Обычная тканевая шляпа с пером, прикрепленным к ленте, чтобы добавить немного стиля.
  '897':
    2: Шляпа путешественника
    10: Шляпа
    16: Простая шляпа, предназначенная для защиты головы путешественника от солнца и пыли.
  '898':
    2: Необычная шляпа
    10: Шляпа
    16: Эта шляпа, последняя мода, возвращает нас к стилю рабочего класса. На самом деле в моде не шляпа, а рабочий человек, которому молодые дворяне пытаются подражать, а тот, в свою очередь, стремится подражать дворянину…
  '899':
    2: Корона
    10: Корона
    16: Это дешевая корона, которую носят примитивные гоблины, чтобы высмеивать человеческие обычаи. Металл — бронза, а драгоценный камень — стекло.
  '900':
    2: Благородная корона
    10: Корона
    16: Прекрасная, хотя и несколько показная корона из сусального золота с крупными аметистами превосходного качества. Она достойна дворянина вашего положения.
  '901':
    2: Королевская Корона
    10: Корона
    16: Короны, подобные этой, украшают головы настоящих королевских особ. Они не только выглядят элегантно, но не кричаще, но и идеально подходят для воздействия самых сильных чар.
  '902':
    2: Кожаный ремень
    10: Ремень
    16: Крестьянский ремень. Этот сделан из плохо обработанной кожи и ржавых железных заклепок.
  '903':
    2: Тонкий пояс
    10: Ремень
    16: Хорошо изготовленный ремень из хорошо дубленой кожи с тонкой строчкой. Пряжка изготовлена ​​из полированного серебра.
  '904':
    2: Прочный ремень
    10: Ремень
    16: Прочный, но высококачественный кожаный ремень. Этот, вероятно, был сделан в западной Эрафии.
  '905':
    2: Серебряный пояс
    10: Ремень
    16: Очень красиво сделанный серебряный ремень, старый, но за ним хорошо ухаживали. Ни на одном из звеньев нет следов потускнения, только немного потерта пряжка.
  '906':
    2: Позолоченный пояс
    10: Ремень
    16: Этот невероятно яркий ремень изготовлен из чистого 14-каратного золота. На лицевой стороне каждой ссылки имеется отдельное изображение низкого качества. Невкусно, но ценно.
  '907':
    2: Тонкий кожаный плащ
    10: Плащ
    16: Простой плащ путешественника.
  '908':
    2: Плащ охотника
    10: Плащ
    16: Плащ охотника зеленого цвета, чтобы его было трудно заметить в лесу. Смотреть не на что, но своей цели он служит.
  '909':
    2: Плащ следопыта
    10: Плащ
    16: Эти плащи, сотканные из растительных волокон, найденных в Туларийском лесу, являются традиционной одеждой эльфийских рейнджеров. Эта черная разновидность предназначена для рейнджеров более высокого ранга и символизирует их статус лидеров.
  '910':
    2: Элегантный плащ
    10: Плащ
    16: Этот плащ того качества, которое предпочитают богатые дворяне и члены королевской семьи. Трудно найти лучше.
  '911':
    2: Славный плащ
    10: Плащ
    16: Почти все плащи, подобные этому, обладают какими-то чарами. Чернокнижники Нигона нанимают легионы психически порабощенных людей для выполнения утомительного плетения и ритуального произнесения заклинаний, необходимых для изготовления этих плащей.
  '912':
    2: Защемленные рукавицы
    10: Рукавицы
    16: Железные рукавицы низкого качества с тканевой подкладкой для предотвращения образования волдырей.
  '913':
    2: Стальные рукавицы
    10: Рукавицы
    16: Эта пара рукавиц изготовлена из стали и украшена латунным узором вдоль внешней стороны ладони и тыльной стороны руки. Он в хорошем состоянии и хорошо смазан.
  '914':
    2: Серебряные сетчатые рукавицы
    10: Рукавицы
    16: 'Чудесное достижение: эти рукавицы были выкованы и сотканны гномами Каменного города. Предлагает как гибкость, так и надежную защиту. Единственная проблема заключается в том, что кожа владельца иногда попадает в сетку, что приводит к болезненным ущемлениям.'
  '915':
    2: Рукавицы из драконьей шкуры
    10: Рукавицы
    16: Шкура дракона, как и следовало ожидать, является превосходным материалом для рукавиц, обеспечивая защиту рук, превосходящую многие более простые конструкции из железа или стали. Единственным недостатком является то, что кожа толстая и жесткая, что несколько ограничивает ловкость движений.
  '916':
    2: Рукавицы Могреда
    10: Рукавицы
    16: Эти рукавицы, сделанные из шкуры зверя Могреда на Каригоре, прочные, гибкие и устойчивые к магии. Раньше из двух красных пятен росли ядовитые шипы.
  '917':
    2: Кожаные сапоги
    10: Сапоги
    16: Эти ботинки сделаны из мягкой кожи для более удобной посадки, но они мало защищают в бою.
  '918':
    2: Стальные латные сапоги
    10: Сапоги
    16: Эта пара кожаных ботинок оснащена стальными пластинами в верхней части стопы и на голени.
  '919':
    2: Сапоги рейнджера
    10: Сапоги
    16: 'Качественный комплект эрафианских кожаных ботинок. Эта пара обладает обычными характеристиками эрафианского мастерства по работе с кожей: мягкая, водостойкая и тихая.'
  '920':
    2: Рыцарские сапоги
    10: Сапоги
    16: Полированные серебряные ботинки с бархатной подкладкой. Эти ботинки легче стальных ботинок и гораздо удобнее. Они тоже выглядят довольно броско.
  '921':
    2: Сапоги Паладина
    10: Сапоги
    16: Эти ботинки из серебра и стали, изготовленные в кузнице Байрона Рокермана, являются одними из лучших в мире. Они чрезвычайно прочны, но удобны и гибки в использовании во всех нужных местах.
  '922':
    2: Латунное кольцо
    10: Кольцо
    16: Потускневшее латунное кольцо. Отполированный, вы, возможно, сможете продать его за что-нибудь… но не ждите многого.
  '923':
    2: Жемчужное кольцо
    10: Кольцо
    16: Это ничем не примечательное золотое кольцо украшает крупная несовершенная жемчужина.
  '924':
    2: Платиновое кольцо
    10: Кольцо
    16: На первый взгляд серебряное, это кольцо на самом деле сделано из платины. Драгоценный камень представляет собой небольшой бриллиант с дефектами.
  '925':
    2: Изумрудное кольцо
    10: Кольцо
    16: Простое серебряное кольцо украшает большой изумруд огранки.
  '926':
    2: Сапфировое кольцо
    10: Кольцо
    16: В верхней части этого серебряно-золотого кольца вмонтированы три маленьких сапфира. Кольца такого качества часто зачаровывают.
  '927':
    2: Кольцо чернокнижника
    10: Кольцо
    16: Эта сложная и яркая композиция из аметистов на платине может показаться привлекательной, если вам нравятся подобные вещи.
  '928':
    2: Зачарованное кольцо
    10: Кольцо
    16: Редкий драгоценный камень в драгоценном изумруде и гранате установлен на прекрасном золотом кольце.
  '929':
    2: Ослепительное кольцо
    10: Кольцо
    16: Красивая розетка из рубинов и изумрудов на золотой основе. Само кольцо платиновое.
  '930':
    2: Кольцо волшебника
    10: Кольцо
    16: Три совершенных граната, оправленных в серебро, опровергают чары, использованные при создании этого кольца. При длительном обращении с кольцом рука покалывает.
  '931':
    2: Кольцо Ангела
    10: Кольцо
    16: Очень странный коричневый камень (окаменевшее дерево?) установлен на металле, который выглядит как золото, но намного легче.
  '932':
    2: Амулет глазного яблока
    10: Амулет
