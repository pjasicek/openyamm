  '1418':
    2: Лампа Джинна
    10: Лампа
    16: Джинны, захваченные в этих лампах, обычно вознаграждают тех, кто их освободил, хотя иногда они получают жестокое удовольствие, наказывая первых живых существ, с которыми сталкиваются. Чтобы использовать лампу джинна, возьмите лампу и щёлкните левой кнопкой по изображению вашего персонажа на экране инвентаря.
  '1419':
