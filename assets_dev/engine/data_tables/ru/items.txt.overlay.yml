  '2019': {}
  '2020':
    2: Мордред
    10: Артефакт
    16: 'Один из девяти таких клинков в мире, Мордред, был изготовлен Братством в 428 году нашей эры. в рамках своих первых экспериментов по развитию Темной Магии. Они надеялись найти способ продлить жизнь одного человека за счет другого, но вместо того, чтобы повернуть возраст вспять, они просто нашли способ украсть здоровье. (Особые способности: вампиризм)'
  '2021':
    2: Тор
    10: Артефакт
    16: 'Происхождение Тора потеряно во времени, но это могучее варварское оружие хорошо помнят военные историки. Оружие использовалось в битвах многими владельцами на протяжении веков, хотя последний раз оно появлялось в битве при Шименгарде в 902 году нашей эры. Сила удара этого молота настолько мощна, что может отбросить противника на несколько футов назад от владельца. (Особые способности: Сила)'
  '2022':
    2: Конан
    10: Артефакт
    16: 'Этот могучий топор зачарован, чтобы уничтожать драконов и дьяволов. У него есть способ найти владельца, который может столкнуться с такими монстрами и достаточно силен, чтобы сражаться с ними. (Особые способности: Убийство Дьявола и Дракона)'
  '2023':
    2: Экскалибур
    10: Артефакт
    16: 'Тяжелый, но, казалось бы, легкий, как перышко, в умелых руках Экскалибур наделяет своего владельца огромной мощью. Противникам нелегко уйти от ударов этого легендарного оружия. (Особые способности: +30 силы)'
  '2024':
    2: Мерлин
    10: Артефакт
    16: 'Традиционно носимый Верховным Друидом, но потерянный во время борьбы за религиозную доктрину, Мерлин действует как резервуар силы заклинаний, к которому владелец может обратиться в любое время. Мерлин зачарован стремительностью, и дождь обрушивается на врагов гораздо быстрее, чем обычный посох. (Особые способности: быстрота и +40 очков заклинаний)'
  '2025':
    2: Персиваль
    10: Артефакт
    16: 'Персиваль был очарован Гильдией лучников в 912 году нашей эры. как прототип в процессе зачарования, который они разрабатывали в то время. К сожалению, в зале гильдии вспыхнул подозрительный пожар, разрушивший планы развития и уничтоживший экзотические материалы, необходимые для создания новых Персивалей. Гильдия так и не оправилась от своих потерь и продала Персиваля эльфам в 918 году нашей эры. С тех пор она много раз переходила из рук в руки. (Особые способности: стремительность и резня)'
  '2026':
    2: Галахад
    10: Артефакт
    16: 'Возможно, это лучшая кольчуга, созданная со времен Безмолвия. Чары материальной силы Галахада настолько сильны, что в некоторой степени воздействуют на тело владельца, что делает его способным выдерживать гораздо большее насилие, чем обычно. (Особые способности: защита и +25 очков здоровья)'
  '2027':
    2: Пеллинор
    10: Артефакт
    16: 'Названный в честь древнего рыцаря, Пеллинор укрепляет своего владельца неестественным здоровьем, настолько сильным, что владелец исцеляется от серьезных травм за считанные часы. Доспехи довольно тяжелые и защищают владельца от ударов во время боя. (Особые способности: +30 к выносливости, восстановлению ударов и регенерации очков здоровья)'
  '2028':
    2: Валерия
    10: Артефакт
    16: 'Созданная по заказу короля Эрафии Давида IV во время Лесных войн, Валерия не только защищает пользователя от обычных ударов, но и помогает перехватывать множество летящих стрел, магическим образом фокусируя внимание владельца на полете снаряда. Те же чары, которые делают возможным эффект защиты, также значительно увеличивают точность владельца. (Особые способности: защита и +30 точности)'
  '2029':
    2: Артур
    10: Артефакт
    16: 'В бесконечном стремлении создать идеального короля-жреца служители Церкви Солнца создали Артура и наделили его силой, которая развивает способности владельца и увеличивает запас магической энергии. Замысел удался, усилив природные таланты их короля — вместе с его гордыней. В 1073 году Леопольд VII начал священную войну против Церкви Луны, доведя обе организации до нищеты и в итоге погубив их. (Особые свойства: зачарование «Богов» и +25 очков маны)'
  '2030':
    2: Пендрагон
    10: Артефакт
    16: 'Первоначально этот плащ принадлежал Аластэру Блейну, главному вору Гильдии Теней. Плащ значительно увеличил его удачу и некоторые воровские навыки, позволив ему сделать долгую и процветающую карьеру. Блейн так и не был привлечен к ответственности за свои преступления - вместо этого его убили во время карточной игры за мошенничество, когда он носил плащ, чтобы повысить свои шансы. (Особые способности: +30 удачи, воровство, иммунитет к яду)'
  '2031':
    2: Люциус
    10: Артефакт
    16: 'Никто не знает, где и когда были изготовлены эти волшебные ботинки, но во многих легендах говорится, что они появлялись в самых необычных местах. Они даруют своему владельцу сверхчеловеческую быстроту и грацию движений. (Особые способности: +30 скорости)'
  '2032':
    2: Гвиневра
    10: Артефакт
    16: 'Гвиневра была создана Гильдией алхимиков под камнями замка Кригспайр много лет назад. Он увеличивает магические ресурсы, доступные его владельцу, и облегчает использование заклинаний Зеркального Пути. (Особые способности: +30 очков заклинаний, «Магия Света» и «Магия Тьмы»)'
  '2033':
    2: Игрейна
    10: Артефакт
    16: 'Лорд Соломон Стоун заказал это кольцо во время своего пребывания на посту Первосвященника Пути в 1018 году. Оно дает огромный импульс способностям пользователя в жреческой магии, а также доступ к большому количеству магической энергии. (Особые способности: +25 очков заклинаний и «Магия тела, разума и духа»)'
  '2034':
    2: Морган
    10: Артефакт
    16: 'Хотя происхождение Моргана неизвестно, за последние сто лет у Моргана было много владельцев, и все они были неизвестны до того, как нашли амулет. На самом деле амулет настолько могуч, что любой крестьянин или ребенок, который возьмет его в руки, обязательно станет легендой своего времени. (Особые способности: +20 очков заклинаний и «Магия огня, воздуха, воды и земли»).'
  '2035':
    2: Аид
    10: Реликвия
    16: 'Мощное оружие, которое, как говорят, было доставлено из Преисподней в ответ на желание массового убийцы. Оружие наносит ужасные раны своим острым, как бритва, лезвием и постоянно капает кислотой. Меч не только ужасное оружие, но и дарует хитрость мастера-вора в обезвреживании ловушек и удачу дьявола в избежании нанесенного ими ущерба. Аид медленно и постоянно вытягивает свою силу из своего владельца. (Особые способности: +20 урона ядом, +20 удачи, воровства и отрицательной регенерации)'
  '2036':
    2: Арес
    10: Реликвия
    16: 'Мощная боевая булава, Арес горит огнём из сердца горы, из которой она была создана. Та же самая магия, которая заставляет его гореть ужасным огнём, дарует его владельцу устойчивость к огню. (Особые способности: +30 урона от огня, +25 сопротивления огню)'
  '2037':
    2: Посейдон
    10: Реликвия
    16: 'Этот трезубец, вероятно, вдохновил флот Регнана сделать трезубец своим любимым оружием войны. Посейдон наполняет своего владельца пугающей боевой яростью, увеличивая мощь, выносливость и точность владельца за счет личной безопасности. Желание владельца поразить своих врагов во время использования Посейдона настолько всепоглощающе, что он забывает уклоняться от ударов, которых иначе мог бы избежать. С другой стороны, мертвые враги (обычно) не сопротивляются. (Особые способности: +20 силы, +20 выносливости, +20 точности, -10 класса брони и -10 скорости)'
  '2038':
    2: Кронос
    10: Реликвия
    16: 'Кронос, скорее магическая диковинка, чем по-настоящему полезное оружие, фантастически увеличивает жизненную силу владельца и вдвое уменьшает его удачу. (Особые способности: +100 очков здоровья и -50 удачи)'
  '2039':
    2: Геркулес
    10: Реликвия
    16: 'Огромный меч, предназначенный для неумелых, Геркулес наполняет своего владельца силой сотни человек. В соответствии со своей «большой и глупой» темой, меч снижает интеллект своего владельца, когда он его держит. (Особые способности: +50 силы, +20 выносливости и -30 интеллекта)'
  '2040':
    2: Артемида
    10: Реликвия
    16: 'Наделенный силой грома, Артемус стреляет стрелами, магически заряженными электричеством. Несмотря на свою мощь, пользователю лука следует быть осторожным: кажется, что магия стихий притягивается к луку и наносит больше урона, когда попадает в владельца. (Особые способности: +20 урона электричеством, -10 к сопротивлению стихиям)'
  '2041':
    2: Аполлон
    10: Реликвия
    16: 'Эта уникальная броня приносит удачу своему владельцу, помогая ему избежать основного удара большинства стихийных атак. Однако он черпает свою энергию из телосложения своего владельца, что делает ношение этих доспехов рискованным занятием. (Особые способности: +20 к сопротивлению, +20 к удаче и -30 к выносливости)'
  '2042':
    2: Зевс
    10: Реликвия
    16: 'Возможно, этот доспех предназначался только для Богов. Доспехи, которые время от времени носят вожди варваров, увеличивают физическую жизнеспособность и магическую энергию, которыми располагает владелец, но ужасной ценой. Известно, что комнатные растения получают более высокие оценки в тестах на интеллект, чем те, кто носит эту броню. Можно было бы подумать, что за такой внезапной потерей разума наверняка последует случайная смерть, однако удача, даруемая доспехами, похоже, предотвращает катастрофу. Часто владелец доспехов становится настолько глупым, что забывает их снять. (Особые способности: +50 очков здоровья, +50 очков заклинаний, +50 удачи и -50 интеллекта)'
  '2043':
    2: Эгида
    10: Реликвия
    16: 'Легенда гласит, что этот щит был подарен Богами человеку, желающему сразиться с ужасными медузами в их крепости. Щит является отражающим и не дает владельцу замерзнуть от пристального взгляда медузы. Он также несет в себе чары, помогающие защитить от стрел, но щит очень тяжелый и немного замедляет пользователя. (Особые способности: иммунитет к эффектам плоти и камня, защита +20 к удаче и -20 к скорости)'
  '2044':
    2: Один
    10: Реликвия
    16: 'Эта корона — могучая реликвия, которая защищает от стихийных магических атак всех видов, но имеет недостаток, который чрезвычайно замедляет владельца. (Особые способности: +50 к сопротивлению стихиям и -40 скорости)'
  '2045':
    2: Атлас
    10: Реликвия
    16: 'Легенды гласят, что этот плащ был выброшен Богом, которого раздражало магическое замедление его действий. Он наделяет владельца несравненной мощью ценой большой потери скорости. (Особые способности: +100 силы и -40 скорости)'
  '2046':
    2: Гермес
    10: Реликвия
    16: 'Эти ботинки, реликвия времен Безмолвия, должны скрывать в себе какую-то скрытую магию, поскольку они очень тяжелые, но легкие после ношения. Они действуют на нервы и мышцы своего владельца, повышая его скорость и рефлексы до нечеловеческого уровня, но одновременно вызывая неточность и сверхкомпенсацию. Ботинки на протяжении веков принадлежали многим, и все они погибли в результате какого-либо несчастного случая, связанного с превышением скорости, например, бега на невероятной скорости в гору, а затем падения со скалы на вершине. (Особые способности: +100 скорости и -40 точности)'
  '2047':
    2: Афродита
    10: Реликвия
    16: 'Это красивое кольцо, желанное и востребованное глупцами на протяжении веков, разглаживает кожу, очищает голос и значительно улучшает физическую красоту своего владельца, а также подчеркивает индивидуальность. Кольцо также несет в себе проклятие неудачи, и владелец обычно умирает в результате трагического несчастного случая вскоре после того, как нашел кольцо. (Особые способности: +100 индивидуальности и -40 удачи)'
  '2048':
    2: Афина
    10: Реликвия
    16: 'Также известное как Кольцо Ученого, Афина значительно обостряет и улучшает интеллект своего владельца ценой физической силы. Хотя эффект на физическое тело почти парализующий, большинство магов считают, что искушение носить кольцо слишком велико, чтобы ему можно было сопротивляться. (Особые способности: +100 интеллекта и -40 силы)'
  '2049':
    2: Гера
    10: Реликвия
    16: 'Эта любопытная реликвия, которую иногда называют Амулетом дурака, эта любопытная реликвия, существовавшая до Безмолвия, резко увеличивает личную жизненную силу, магическую энергию и удачу владельца за счет личности. Пока доспехи надеты, лицо становится дряблым, глаза пустыми, а голос становится монотонным. (Особые способности: +50 очков здоровья, +50 очков заклинаний, +50 удачи и -50 личности)'
  '2050':
    2: Кожаный чехол
    10: Кожаный чехол
    16: Небольшой кожаный мешочек.
  '2051':
    2: Кожаный чехол
    10: Кожаный чехол
    16: Небольшой кожаный мешочек.
  '2052':
