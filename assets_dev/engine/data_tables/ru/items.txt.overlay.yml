rows:
  '1':
    2: Железный длинный меч
    10: Длинный меч
    16: Эти слегка перекошенные мечи, выпускаемые в больших количествах, являются оружием ополченцев по всей стране.
  '2':
    2: Троллий боевой меч
    10: Длинный меч
    16: Несмотря на примитивное мастерство, большой вес клинка этого оружия придает ему превосходную ударную силу.
  '3':
    2: Длинный меч тёмных эльфов
    10: Длинный меч
    16: Оружие торговца из города тёмных эльфов Альвар. Лезвие с волнистым краем хорошо держит заточку.
  '4':
    2: Меч храмовника
    10: Длинный меч
    16: Меч для настоящего фехтовальщика. Отсутствие украшений говорит об исключительной цели его замысла.
  '5':
    2: Меч чемпиона
    10: Длинный меч
    16: Они созданы исключительно для членов Эрафианского Ордена Клинка. Поскольку по традиции их хоронят вместе со своими павшими владельцами на священных и охраняемых территориях, они действительно являются редкими предметами.
  '6':
    2: Железный двуручный меч
    10: Двуручный меч
    16: Большой вес и длина этого клинка делают его удары более дальнобойными и наносимыми. В остальном, это безупречное качество.
  '7':
    2: Полуторный меч тёмных эльфов
    10: Двуручный меч
    16: Эти клинки, которые часто носят эльфийские стражи караванов, слегка непропорциональные, почти, но не совсем, достаточно легкие, чтобы ими можно было размахивать одной рукой.
  '8':
    2: Боевой меч минотавра
    10: Двуручный меч
    16: Только те, кто обладает огромной силой и балансом, могут изящно размахивать этими могучими клинками, не говоря уже о том, чтобы управлять ими в пылу боя.
  '9':
    2: Клинок охотника на драконов
    10: Двуручный меч
    16: Глубоко режущее, идеально сбалансированное оружие, созданное для одной цели — уничтожения драконов.
  '10':
    2: Секира палача
    10: Двуручный меч
    16: Изготовленный из очищенного эрудинового сплава, а затем закаленный в луже бурлящей лавы, этот меч практически не затупляется и идеально сбалансированный клинок, что подчеркивает его устрашающий внешний вид.
  '11':
    2: Железный палаш
    10: Палаш
    16: Некоторые фехтовальщики клянутся, что мягкий металл железного меча дает им определенные боевые преимущества. Эти мечники никогда не кажутся очень старыми.
  '12':
    2: Троллий клеймор
    10: Палаш
    16: Несмотря на примитивную конструкцию и мастерство изготовления, это оружие, выкованное троллями, эффективно в сильных руках.
  '13':
    2: Палаш ящеролюдов
    10: Палаш
    16: Ящеры производят оружие, способное служить надежно.
  '14':
    2: Рыцарский палаш
    10: Палаш
    16: Вес несконусного клинка этого меча сделал бы его громоздким, если бы не его точный противовес.
  '15':
    2: Палаш архангела
    10: Палаш
    16: Этот клинок из чистой эрудиновой стали разрезает броню, как масло, и сияет звездным светом. Существуют мечи и получше, но их количество можно пересчитать по пальцам одной руки.
  '16':
    2: Ржавая абордажная сабля
    10: Абордажная сабля
    16: Это оружие, возможно, когда-то было кое-каким, хотя это было бы трудно сказать по очевидным годам коррозии.
  '17':
    2: Гоблинский ятаган
    10: Абордажная сабля
    16: После того, как Говдарские глубинные гоблины были стерты с лица Джадама в Войнах гоблинов и огров, тысячи единиц этого оружия появились на общем рынке.
  '18':
    2: Регнанская абордажная сабля
    10: Абордажная сабля
    16: Выданные морякам Регнана в качестве основного дополнительного оружия, эти лопасти завоевали прочную репутацию.
  '19':
    2: Регнанский фальшион
    10: Абордажная сабля
    16: Чрезвычайно передний баланс клинка этого оружия придает ему дополнительную ударную мощь, но требует от владельца огромной силы и навыков.
  '20':
    2: Капитанская абордажная сабля
    10: Абордажная сабля
    16: Это превосходное оружие, данное капитанам Регнана после получения первого командования, помогает им доминировать над своими врагами и подчиненными.
  '21':
    2: Грубый кинжал
    10: Кинжал
    16: Будучи режущим инструментом и орудием для еды, а также оружием, этот кинжал из мягкой стали имеет остроту, но теряет ее при очень малом использовании.
  '22':
    2: Хрустальный кинжал
    10: Кинжал
    16: Эти кинжалы часто носят с собой члены Гильдии Некромантов. Кристаллы, используемые для изготовления лезвий, можно найти в горах Теневого Шпиля. Они невероятно острые, но имеют тенденцию разбиваться.
  '23':
    2: Кинжал купца
    10: Кинжал
    16: Этот кинжал является типичным примером кинжалов, производимых оружейниками Альвара. Он изготовлен из закаленной стали и имеет отличный баланс.
  '24':
    2: Кинжал мастера
    10: Кинжал
    16: Кинжалы такого качества действительно редки. Сделанный из ценных пород редкого дерева, отделанный золотом и инкрустированный крупным рубином, он был бы расточительством богатого человека, если бы не был еще и столь эффективным оружием.
  '25':
    2: Клыкастый клинок
    10: Кинжал
    16: Рукоять этого клинка явно менялась много раз. Говорят, что такими клинками пользовались первые Вампиры, появившиеся за тысячелетия до Безмолвия. Может ли это быть одним из тех древних орудий?
  '26':
    2: Длинный кинжал
    10: Длинный кинжал
    16: Это оружие с лезвием длиной между мечом и кинжалом предназначено для бойцов с ножом, которым требуется немного больше дальности действия. Это конкретное оружие посредственно изготовлено из мягкой стали.
  '27':
    2: Альварский пуаньяр
    10: Длинный кинжал
    16: На многих общественных мероприятиях в Альваре считается неуместным носить меч. Эльфийские воины обычно носят с собой клинок меньшего размера на случай, если что-то станет нецивилизованным.
  '28':
    2: Регнанский боевой нож
    10: Длинный кинжал
    16: Не желая быть обремененными щитом, многие регнанские пираты-рейдеры сражаются с абордажной саблей в одной руке и одним из этих более коротких клинков в другой.
  '29':
    2: Сумеречный крис
    10: Длинный кинжал
    16: Этот длинный кинжал с волнистым лезвием из стали высшего качества является изделием оружейников Сумерек. Защита крыла летучей мыши, украшенная кроваво-красным рубином, указывает на то, что это оружие вампира.
  '30':
    2: Дуэльный длинный кинжал
    10: Длинный кинжал
    16: Хотя они представляют собой единый фронт перед остальным миром, среди вампиров Теневого Шпиля существует много внутренних разногласий. По обычаю, очень серьезные разногласия разрешаются в бою с помощью этих смертоносных клинков изысканной работы.
  '31':
    2: Каменный топор
    10: Топор
    16: Эти грубые орудия представляют собой не что иное, как закаленные в огне палки, привязанные к острым камням, и являются плохими инструментами и оружием.
  '32':
    2: Боевой топорик
    10: Топор
    16: Боевые топоры, которые часто носят конные рыцари в качестве дополнительного оружия, предпочитают некоторые, кто носит их, а не любой меч.
  '33':
    2: Боевой топор
    10: Топор
    16: Эти тяжелые топоры предназначены для ношения одной рукой и использования против как бронированных, так и небронированных противников.
  '34':
    2: Дварфийский боевой топор
    10: Топор
    16: Хотя кузнецы джадамейских темных дворфов не так квалифицированы, как их эрафианские коллеги, они все равно производят продукцию, превосходящую большую часть того, что доступно в противном случае.
  '35':
    2: Боевой топор минотавра
    10: Топор
    16: Эти топоры, выкованные Минотаврами для их войн с ограми, изготовлены из секретного сплава. Их края трудно затупить и еще труднее заточить.
  '36':
    2: Двуручный топор
    10: Двуручный топор
    16: Этот грубый топор, являясь не только орудием для обработки дерева, но и оружием, все же может нанести ощутимый удар.
  '37':
    2: Топор пехотинца
    10: Двуручный топор
    16: Эти двуручные топоры, способные раскалывать броню, являются фаворитом среди солдат, сражающихся с конными рыцарями.
  '38':
    2: Военный топор минотавра
    10: Двуручный топор
    16: Эти двуручные топоры обычно используются Минотаврами, у которых есть сила, необходимая для того, чтобы справиться с их огромным весом.
  '39':
    2: Элитный топор минотавра
    10: Двуручный топор
    16: Эти топоры превосходного качества выдаются только членам «Черного Рога», элитным воинам, охраняющим святые места Минотавра.
  '40':
    2: Топор пастуха минотавров
    10: Двуручный топор
    16: Пастухи-минотавры ведут свои войска в бой, владея этими разрушительными боевыми топорами превосходного баланса и качества изготовления.
  '41':
    2: Боевая дубина огра
    10: Копье
    16: Закаленные в огне и заточенные саженцы, усеянные шипами, подобные копья используются войсками огров для тренировок и базовой боевой подготовки.
  '42':
    2: Стальное копьё
    10: Копье
    16: Базовые копья можно найти в арсеналах многих рас, и не зря — они являются эффективным и смертоносным оружием. Этот конкретный имеет происхождение от Минотавра.
  '43':
    2: Длинное эльфийское копьё
    10: Копье
    16: Тонкое мастерство и баланс этого копья с наконечником из легированной стали свидетельствуют о том, что это работа оружейников Альвара.
  '44':
    2: Боевое копьё
    10: Копье
    16: Это копье создано для боя. Он слишком тяжел для того, чтобы им мог пользоваться ополченец, работающий по совместительству, и создан для профессионального воина, который предпочитает копье другому оружию.
  '45':
    2: Драконий гарпун
    10: Копье
    16: Стальная головка этого оружия с зазубринами сзади предназначена для нанесения серьезного урона даже самым древним драконам. Естественно, это выбор копейщика для уничтожения всех врагов.
  '46':
    2: Самодельная глефа
    10: Алебарда
    16: Эта простая секира, похоже, была сделана путем прикрепления лезвия сельскохозяйственного орудия к плохо изготовленному копью.
  '47':
    2: Алебарда
    10: Алебарда
    16: Алебарда — универсальное оружие, сочетающее в себе качества топора и копья, предназначенное для ведения боя в строю и индивидуального боя на ближней дистанции.
  '48':
    2: Клювовидная алебарда
    10: Алебарда
    16: Эта улучшенная алебарда имеет шипованное лезвие напротив топора, что обеспечивает баланс и позволяет пробивать пластинчатую броню.
  '49':
    2: Походный полэкс минотавра
    10: Алебарда
    16: 'Когда Минотавры пошли на войну с Ледяными Гигантами далекого Вори, их король Бальтазар заказал это древковое оружие для вооружения своих войск. Сообщается, что он сказал: «Поскольку их не будет так долго, вооружите их чем-нибудь универсальным».'
  '50':
    2: Лабиринтный багор
    10: Алебарда
    16: Минотавры очень нетерпимы к злоумышленникам в их священных лабиринтах. Об этом хорошо свидетельствует внимание, уделяемое оружию, созданному для охранников лабиринта.
  '51':
    2: Вилы
    10: Трезубец
    16: Несмотря на то, что эти вилы для сена являются обычным сельскохозяйственным орудием, они имеют прочную конструкцию и могут стать отличным, если их смастерить, оружием.
  '52':
    2: Пехотные вилы
    10: Трезубец
    16: Узкоспециализированное снаряжение, предназначенное для уравнивания состязаний между пехотинцами и конными противниками в доспехах. Эти модифицированные копья являются эффективным, хотя и немного неуклюжим оружием.
  '53':
    2: Трезубец ящеролюдов
    10: Трезубец
    16: Кузнецы на островах Кинжальной Раны создают самые разнообразные наконечники копий. Этот трезубец — один из самых необычных их дизайнов. Зубцы с зазубринами наносят дополнительный урон во время прямых колющих атак.
  '54':
    2: Регнанский трезубец
    10: Трезубец
    16: Ни один корабль Регнана не покидает порт без тайника с трезубцами. Абордажные атаки на их галеры редко увенчиваются успехом против массивных стенок их ученых зубцов.
  '55':
    2: Трезубец тритона
    10: Трезубец
    16: Первое, на что обращаешь внимание, впервые взяв в руки этот трезубец, это то, что он необычайно холоден на ощупь. Во-вторых, создается впечатление, что костные зубцы драконьей черепахи ищут уязвимости в защите своих целей, как будто их направляет невидимая рука.
  '56':
    2: Охотничий лук
    10: Лук
    16: Эти легкие луки простой конструкции предназначены для уничтожения мелких диких животных, а не для прямого боя.
  '57':
    2: Изогнутый лук
    10: Лук
    16: Изогнутые луковые посохи позволяют лучнику натянуть более тяжелый лук, чем он мог бы в противном случае. Больший вес тяги означает большую скорость стрелы, что увеличивает дальность стрельбы и урон.
  '58':
    2: Лук из змеиного дерева
    10: Лук
    16: Люди-солдаты Энрота носят луки, сделанные из местного змеиного дерева. Прочная и гибкая древесина делает лук прочным.
  '59':
    2: Эльфийский боевой лук
    10: Лук
    16: Путем ламинирования слоев дерева, стали и кости лучники Альвара создали лук с идеальным балансом, прочностью и точностью. Этот процесс требует много времени, труда и дорогих материалов, что объясняет высокую цену этих луков.
  '60':
    2: Лук из кости дьявола
    10: Лук
    16: Лукузчики темных эльфов обнаружили, что необычные характеристики позвоночного столба Кригана делают его лучшим материалом для тяжелых луков. Умное расположение составных шкивов позволяет тем, у кого сила меньше сверхчеловеческой, тянуть это могучее оружие.
  '61':
    2: Лёгкий арбалет
    10: Арбалет
    16: Из-за простоты использования подобные арбалеты хранятся в арсеналах ополчения повсюду. Однако их низкая сила тяги и посредственное качество изготовления делают их лишь умеренно эффективными.
  '62':
    2: Арбалет Кровавой Капли
    10: Арбалет
    16: Легкий арбалет хорошего качества. Это оружие имеет рифленый столик, базовые прицельные приспособления и плавно сбрасываемую гайку.
  '63':
    2: Охотничий арбалет
    10: Арбалет
    16: Этот средний арбалет, созданный для использования в полевых условиях, предназначен для охоты, но одинаково эффективен и в качестве боевого оружия.
  '64':
    2: Арбалет караванщика
    10: Арбалет
    16: Торговцам Альвара нравится видеть хорошо вооруженную охрану своих караванов. Этот хорошо сделанный тяжелый арбалет имеет коленчатый механизм натяжения.
  '65':
    2: Регнанский арбалет
    10: Арбалет
    16: Пираты острова Регна веками совершенствовали конструкцию своих арбалетов. Получившееся оружие имеет прицел с хрустальными линзами и посохи из чистой стали, из-за чего лук невозможно было бы взвести, если бы не рукоятка из эрудинового сплава.
  '66':
    2: Прочная булава
    10: Булава
    16: 'Небольшое улучшение по сравнению с обычной дубинкой: булавы лучше сбалансированы, более долговечны и наносят больший урон.'
  '67':
    2: Кистень
    10: Цеп
    16: Хотя цеп и произошел от сельскохозяйственного орудия, носящего его название, большой радиус действия и ударная сила делают его грозным оружием.
  '68':
    2: Храмовая булава
    10: Булава
    16: Корона солнечных лучей, окружающая головку этой хорошо сделанной булавы, служит религиозным заявлением для жрецов Храма Солнца; это также значительно увеличивает урон от его ударов.
  '69':
    2: Жреческий скипетр
    10: Булава
    16: Эти искусно изготовленные булавы являются не только оружием, но и символом должности, и их носят жрецы Храма Солнца из внутреннего круга. Его богато украшенное древко затмевает эффективность позолоченной головки из эрудиновой стали.
  '70':
    2: Троллья боевая булава
    10: Булава
    16: В то время как большинство рас концентрировались на разработке клинкового оружия, тролли всегда довольствовались усовершенствованием простой дубинки. Это жестокое оружие, выкованное из цельного куска стального сплава, является лучшим образцом их ремесла.
  '71':
    2: Кувалда
    10: Молот
    16: Этот молоток — скорее строительный инструмент, чем оружие. Тем не менее, это может нанести ощутимый, хотя и неуклюжий удар.
  '72':
    2: Походный молот
    10: Молот
    16: Этот молот был разработан как дополнительное оружие пехоты, предназначенное для добивания бронированных противников, упавших на землю.
  '73':
    2: Боевой молот
    10: Молот
    16: Улучшенная версия полевого молота. Это оружие тяжелее, лучше сбалансировано и долговечнее. Хотя для владения им требуется сила, это ужасное зрелище как для бронированных, так и для небронированных противников.
  '74':
    2: Солнечный молот
    10: Молот
    16: Жрецам Солнца запрещено использовать клинковое оружие. То, что они носят такие прекрасные боевые молоты, является естественным результатом этого ограничения. В качестве дополнительной меры преданности на поразительном лице выбито обратное изображение символа солнца.
  '75':
    2: Троллий молот
    10: Молот
    16: Необходимо обращаться с этим оружием, чтобы оценить его идеальную хватку и баланс. Головка молотка вырезана из цельного минерального кристалла. Троллские оружейники всю жизнь осваивают технику обработки, чтобы изготовить головку, сохраняющую невероятную твердость и не подверженную разрушению.
  '76':
    2: Шипастая дубина
    10: Клуб
    16: Деревянная головка и рукоятка, усыпанные короткими железными шипами. Лучшим достоинством простой дубинки является то, что ее можно изготовить из найденных материалов.
  '77':
    2: Дубина из терновника
    10: Клуб
    16: Тролли Железнопесчаной пустыни изготавливают эти дубинки путем закалки фантастически прочного корня терновой коры.
  '78':
    2: Дубина повелителя
    10: Клуб
    16: Вожди племен троллей должны завоевать свое положение путем испытания боем. Победитель сохраняет свою клюшку как символ должности. Клубы неудачников часто проникают на рынок оружия.
  '79':
    2: Посох странника
    10: Персонал
    16: Джадамейскому путешественнику грозит множество опасностей. Даже наименее настроенные на битву носят какое-нибудь оружие. Эти трости с железным наконечником являются распространенным выбором.
  '80':
    2: Посох с навершием
    10: Персонал
    16: Этот посох увенчан навершием из полированной бирюзы, что придает ему большую ударную силу.
  '81':
    2: Жреческий посох
    10: Персонал
    16: Этот прекрасно украшенный посох — произведение искусства Ящеров. Эти посохи, обернутые экзотической кожей и заканчивающиеся бронзовой подножкой и ударником, носят жрецы Ящеров как символ положения.
  '82':
    2: Змеиный посох
    10: Персонал
    16: Эти редкие посохи могут показаться громоздкими, но они являются продуктом колдовства. В бою они используют животный интеллект, чтобы пробить защиту своих целей.
  '83':
    2: Костяной посох
    10: Персонал
    16: Эти посохи, изготовленные из хребтовых костей виверн и увенчанные нижней шипованной пластиной дракона, являются продуктом некромантского оружейного искусства. Необычно найти такое смертоносное оружие, которое не несет в себе мощных чар.
  '84':
    2: Кожаный камзол
    10: Кожаный доспех
    16: Эта броня из толстой, мягкой кожи с латунными вставками обеспечивает минимальную защиту от ударов.
  '85':
    2: Нагрудник из упрочнённой кожи
    10: Кожаный доспех
    16: Этот предмет кожаной брони был закален для обеспечения повышенной защиты. Он удобный и легкий, но обеспечивает мало покрытия.
  '86':
    2: Кожаный доспех караванщика
    10: Кожаный доспех
    16: Этот тип доспехов чаще всего носят те, кто охраняет альверийские торговые караваны. Закаленный нагрудник с внутренними креплениями покрывает нижний костюм из жесткой, но гибкой шкуры, обеспечивая полную защиту тела владельца с минимальным затруднением движений.
  '87':
    2: Регнанский кожаный доспех
    10: Кожаный доспех
    16: Хотя эта броня дизайна Регнана кажется слишком тонкой, чтобы обеспечить надежную защиту, она обладает тонкими чарами, которые делают кожу почти стальной прочной. Кроме того, секретный процесс делает костюм устойчивым к коррозии в соленой воде.
  '88':
    2: Альварский кожаный доспех
    10: Кожаный доспех
    16: Комплекты кожаных доспехов такого качества — одни из лучших, производимых Альварианской гильдией оружейников. Панели с кромкой из стального сплава практически непроницаемы; их умное соединение дает владельцу прекрасную свободу движений.
  '89':
    2: Ржавый кольчужный жилет
    10: Кольчуга
    16: Этот ржавый кольчужный жилет видал и лучшие дни. Его ремонтировали во многих местах, и даже имеется большой участок более тонкой кольчуги, уцелевший от куска кольчужного капюшона.
  '90':
    2: Стальная кольчуга
    10: Кольчуга
    16: Изготовленный из прочной стали, этот тип доспехов носят рядовые пехотинцы многих армий.
  '91':
    2: Кольчуга минотавра
    10: Кольчуга
    16: Этот тип кольчуги, изначально созданный Минотаврами для их кампаний вори, благодаря хорошему покрытию и прекрасной конструкции, оказался популярным среди других рас. Теперь оружейники Логова Батазар строят его таких размеров, что любой, у кого есть готовое золото, может его потратить.
  '92':
    2: Сиертальская кольчуга
    10: Кольчуга
    16: Альварианские темные эльфы тщательно охраняют свою формулу сплава сиертала. Кольчуга из этого металла легкая и способна поворачивать самые твердые лезвия.
  '93':
    2: Эрудиновая кольчуга
    10: Кольчуга
    16: Еще один шедевр Альварианской гильдии оружейников, этот гибридный доспех из лат и кольчуги изготовлен из эрудина из сиерталового сплава с вниманием к мастерству, достойному драгоценных материалов.
  '94':
    2: Ржавый нагрудник
    10: Латы
    16: Этот кусок пластинчатого доспеха, извлеченный из большого костюма, настолько проржавел, что остается вопросом, является ли это снаряжением для воина или хламом для свалщика.
  '95':
    2: Полосчатые латы
    10: Латы
    16: Стальные полосы покрывают середину туловища этого кольчужного и пластинчатого нагрудного доспеха. Хотя эта броня легче и проще в изготовлении, чем непрерывно сформированная пластина, она обеспечивает меньшую защиту, чем более тяжелая пластина.
  '96':
    2: Латы минотавра
    10: Латы
    16: Этот пластинчатый доспех, являющийся примером работы оружейников Минотавра из Логова Бальтазара, обеспечивает превосходную защиту средней части тела. Руки оставлены свободными в стиле Минотавра.
  '97':
    2: Латы тёмного рыцаря
    10: Латы
    16: Несмотря на подкладку из войлока и красного бархата, украшенную эмалью и позолотой, эти доспехи не являются экспонатом. Пластины из сплава сиертала легкие, но достаточно прочные, поэтому их обработка, вероятно, производилась инструментами с эрудированными рабочими поверхностями.
  '98':
    2: Латы охотника на драконов
    10: Латы
    16: Техника изготовления пластинчатых доспехов из листов эрудина не известна на Джадаме. На самом деле, его производит только мастер-оружейник Деррик Горет из Эрафии, который всю жизнь посвятил строительству своей знаменитой кузницы Белого Света.
  '99':
    2: Троллий щит
    10: Большой щит
    16: Простой деревянный щит троллийского производства, дизайн которого часто копируют ученики оружейников, только изучающие свое ремесло.
  '100':
    2: Терновый щит
    10: Большой щит
    16: Этот щит, сделанный из сердцевины терновой коры и обитый железом, прочен, хотя и немного тяжел.
  '101':
    2: Регнанский турнирный щит
    10: Большой щит
    16: Каждые десять лун Регнанцы проводят большой фестиваль, который включает в себя турнир по оружию. Участники из благородного класса не жалеют средств на создание легких, но достаточно прочных щитов, способных защитить их от повреждений.
  '102':
    2: Щит ветерана
    10: Большой щит
    16: В Демонических Войнах Эрафии люди обнаружили, что только эрудированная броня может защитить от огненных атак их врагов. Постепенно части этой брони – например, этот щит – добрались до Джадаме.
  '103':
    2: Щит охотника на драконов
    10: Большой щит
    16: В городе Кригспайр в Энроте возникла проблема с драконами. Эти щиты были их ответом. Магически связанные слои эрудина, стальной стали и кожи гидры создают практически неразрушимый материал, устойчивый к большинству видов оружия дыхания Дракона.
  '104':
    2: Деревянный баклер
    10: Малый щит
    16: Этот небольшой щит зажат в руке, свободной от оружия. Владелец во многом зависит от ловкости, чтобы использовать свое скудное защитное покрытие.
  '105':
    2: Малый щит караванщика
    10: Малый щит
    16: Охранникам караванов, путешествующим по торговым маршрутам Торговца Альвара, часто приходится преодолевать большие расстояния пешком. Этот щит, как и все остальное снаряжение, хорошо сделан и легок.
  '106':
    2: Кавалерийский щит
    10: Малый щит
    16: Эти стальные щиты, любимцы конных рыцарей, достаточно прочны, чтобы отразить удары копейщиков.
  '107':
    2: Щит с мёртвой головой
    10: Малый щит
    16: Гильдия Некромантов любит хорошо вооружать свои армии нежити. Их элитная пехота носит эти щиты из эрудированного сплава огромной прочности.
  '108':
    2: Мистический щит
    10: Малый щит
    16: Известно только двенадцать таких щитов. Их тела сделаны из сплава, который, кажется, бурлит цветом угольного огня. Их ободья сделаны из другого неизвестного металла, который достаточно мягок, чтобы цепляться за лезвия, но не царапается и не царапается.
  '109':
    2: Шлем
    10: Шлем
    16: Эта кепка из мягкого железа и незакаленной кожи обеспечивает небольшую защиту от ударов по голове.
  '110':
    2: Шлем ящеролюдов
    10: Шлем
    16: Железные и кожаные шлемы такого типа производятся кузнецами повсюду. Этот экземпляр изготовлен Ящером и украшен настоящими бараньими рогами.
  '111':
    2: Закрытый шлем
    10: Шлем
    16: Стальные шлемы этой конструкции в больших количествах заказываются Торговцами Альвара, которые выдают их конным стражам караванов.
  '112':
    2: Боевой шлем
    10: Шлем
    16: Этот полный шлем изготовлен из превосходных материалов и качества изготовления. Конструктивно более слабые участки вокруг глаз и носовых прорезей усилены сиерталом.
  '113':
    2: Драконий шлем
    10: Шлем
    16: Лицевая панель этого превосходного шлема крепится на почти невидимых швах, поэтому в закрытом состоянии обеспечивает плотное прилегание и полное покрытие лица. Только самые меткие удары имеют шанс пробиться насквозь.
  '114':
    2: Шляпа горожанина
    10: Шляпа
    16: Свободная шляпа из прочной ткани.
  '115':
    2: Праздничная шляпа
    10: Шляпа
    16: Шляпы, украшенные дешевыми стеклянными драгоценными камнями, регнанцы носят на праздниках, которых у них много.
  '116':
    2: Шляпа купца
    10: Шляпа
    16: Эта плиссированная кепка из бархата, на подкладке и по краям из черного кроличьего меха, украшена небольшим эмалированным медальоном.
  '117':
    2: Клёпаный кожаный пояс
    10: Ремень
    16: Простой ремень из выделанной кожи. Он украшен железными заклепками и закрывается на засов.
  '118':
    2: Прочный пояс
    10: Ремень
    16: Толстый кожаный ремень. Шпильки и пряжка изготовлены из латуни.
  '119':
    2: Пояс из кожи виверны
    10: Ремень
    16: Кожа виверны очень прочная, и ее трудно добыть. Кожевники Шэдоуспайра ценят его, потому что при дублении он становится черным — цвет, который предпочитает их клиентура вампиров и некромантов.
  '120':
    2: Стальной пояс
    10: Ремень
    16: Этот хорошо изготовленный ремень изготовлен из эмалированной стали. Он имеет две искусно скрытые боковые петли и защелкивающуюся застежку сзади.
  '121':
    2: Пояс ремесленника
    10: Ремень
    16: Искусно изготовленные ремни из кожи дракона созданы для хранения чар. Этот выполнен из золота и окружен тонкими полосками сиертала.
  '122':
    2: Плащ путешественника
    10: Плащ
    16: Этот теплый плащ из крашеной шерсти также обеспечивает небольшую защиту от атак оружием.
  '123':
    2: Плащ храма Луны
    10: Плащ
    16: Синий краситель, используемый для окраски перчаточных кожаных плащей, которые носят жрецы Храма Луны, получают из листьев лепестков цветов, которые растут только в районе горы Нигон в Эрафии.
  '124':
    2: Плащ Альвара
    10: Плащ
    16: Плащи такого качества, сделанные в Альваре, часто можно увидеть на плечах более богатых членов Альварской Торговой Гильдии.
  '125':
    2: Плащ некроманта
    10: Плащ
    16: Очевидно, это плащ, созданный для практикующего темные искусства. Этот прекрасный плащ украшен загадочными узорами, вышитыми темной серебряной нитью.
  '126':
    2: Плащ вампира
    10: Плащ
    16: Этот темно-черный плащ из кожи виверны с высоким воротником и подкладкой из красного бархата — стиль, который очень любят старейшие вампиры Теневого Шпиля.
  '127':
    2: Кожаные перчатки
    10: Рукавицы
    16: Эти перчатки из плохо обработанной кожи носят рабочие повсюду.
  '128':
    2: Рукавицы тролля
    10: Рукавицы
    16: Эти кожаные перчатки троллийского производства усеяны железными шипами на костяшках пальцев.
  '129':
    2: Стальные рукавицы
    10: Рукавицы
    16: Эти рукавицы, изготовленные из шарнирных стальных пластин, обеспечивают хорошую защиту, но имеют тенденцию защемляться.
  '130':
    2: Рукавицы Минотавра
    10: Рукавицы
    16: Сплав сиертала делает эти перчатки легкими и прочными. Превосходное качество изготовления делает их удобными и гибкими.
  '131':
    2: Рукавицы крестоносца
    10: Рукавицы
    16: Эти рукавицы мастерски изготовлены из чистого эрудина, что указывает на то, что они являются продуктом кузницы Белого Света Деррика Горета.
  '132':
    2: Прогулочные ботинки
    10: Сапоги
    16: Эти ботинки из мягкой кожи, созданные больше для комфорта, чем для боя, обеспечивают хорошую защиту от грязи и острых камней, но не предназначены для отражения ударов оружия.
  '133':
    2: Сапоги из закаленной кожи
    10: Сапоги
    16: Кожа этих ботинок усилена для большей защиты. У них толстая подошва и подкладка из тонкого слоя более мягкой кожи.
  '134':
    2: Сапоги Ренан
    10: Сапоги
    16: Эти ботинки со стальными колпаками обычно носят воины Регнана. Кожаные детали обработаны для придания им водонепроницаемости.
  '135':
    2: Альварианские сапоги
    10: Сапоги
    16: Эти ботинки, изготовленные альварианскими эльфами, изнутри усилены полосами из сиерталового сплава. Их подошвы мягче, чем у большинства ботинок, что делает их ход тише.
  '136':
    2: Сапоги дракона
    10: Сапоги
    16: Охотникам на драконов требуется необычайно прочное защитное снаряжение, не исключая и ботинки. Эти ботинки изготовлены из ракушек из эрудинового сплава и обтянуты кожей виверны.
  '137':
    2: Бронзовое кольцо
    10: Кольцо
    16: Простая безделушка, имеющая очень небольшую ценность.
  '138':
    2: Золотое кольцо
    10: Кольцо
    16: Кольцо из мягкого золота, выполненное с нерешительным мастерством как средство удобного ношения небольшого количества богатства.
  '139':
    2: Жемчужное кольцо
    10: Кольцо
    16: Серебряное кольцо с жемчужиной хорошего качества.
  '140':
    2: Кольцо с драгоценным камнем
    10: Кольцо
    16: Это золотое кольцо украшено множеством крошечных драгоценных камней, придающих ему разноцветное сияние.
  '141':
    2: Кольцо с аметистом
    10: Кольцо
    16: Кольцо с тремя аметистами. Самый крупный — превосходный камень — насыщенного и равномерно фиолетового цвета с идеальной огранкой.
  '142':
    2: Некроматическое кольцо
    10: Кольцо
    16: Хотя это кольцо сделано из полудрагоценного серебра, оно очень ценно, поскольку хорошо подходит для удержания чар средней силы.
  '143':
    2: Рубиновое кольцо
    10: Кольцо
    16: Это просто элегантное кольцо украшено одним овальным рубином высокого качества — голубиного кроваво-красного цвета, идеальной огранки и без дефектов.
  '144':
    2: Кольцо Вампира
    10: Кольцо
    16: Кольцо носят только старшие вампиры великой силы. Говорят, что часть их жизненной силы вложена в создание кольца. Это, безусловно, объясняет их способность удерживать мощные чары.
  '145':
    2: Кольцо с солнечным опалом
    10: Кольцо
    16: Солнечные опалы сияют мягким внутренним светом. Они чрезвычайно редки и востребованы магами стихий.
  '146':
    2: Фокальное кольцо
    10: Кольцо
    16: «Камень» этого платинового кольца на самом деле представляет собой крошечный межпланарный портал, который черпает силу из потусторонних миров. Предел силы чар, которые могут удерживать такие кольца, — это навыки и знания чародея.
  '147':
    2: Латунный кулон
    10: Амулет
    16: Эти штампованные и лакированные безделушки представляют собой дешевые безделушки, которые продаются паломникам на память.
  '148':
    2: Нефритовый амулет
    10: Амулет
    16: Большой полированный нефрит украшает и повышает ценность этого простого амулета.
  '149':
    2: Талисман крови
    10: Амулет
    16: Созданные некромантами для хранения темной магии, другие колдуны признали их ценность для других целей.
  '150':
    2: Медальон Теневой секты
    10: Амулет
    16: Эти амулеты, выполненные из белого и желтого золота, инкрустированные нефритом и украшенные перидотами, носят члены секретной секты теней, спрятанные под одеждой.
  '151':
