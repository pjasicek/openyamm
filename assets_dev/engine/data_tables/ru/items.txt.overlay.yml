    16: 'Предмет задания: Картина Арчибальда Железного Кулака незадолго до его Войны за Наследство в Энроте.'
  '1425':
    2: Картина Роланда Айронфиста
    10: Живопись
    16: 'Предмет задания: Картина Роланда Айронфиста незадолго до Войны за Наследство в Энроте.'
