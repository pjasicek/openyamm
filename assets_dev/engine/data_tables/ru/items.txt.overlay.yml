  '610':
    2: Ключ слияния
    10: Ключ
    16: 'Предмет задания: Используя четыре элементарных камня сердца, Ксантор сделал для вас этот межплановый ключ чрезвычайной силы. Он скажет вам, что это откроет хрустальные врата, соединяющие Рэйвеншор с таинственным Планом Между Планами.'
  '611':
    2: Утерянная книга Келя
    10: Книга
    16: 'Предмет задания: Бывшая «потерянная» книга Келя. Некоторые говорят, что он был величайшим некромантом прошлого века. Смотреть на обложку с замысловатым тиснением вызывает тревогу, поскольку кажется, что дизайн корчится от злой энергии.'
  '612':
    2: Саркофаг Корбу
    10: Саркофаг
    16: 'Предмет задания: Несмотря на то, что саркофаг Корбу кропотливо вырезан из цельной плиты серого камня, он по необъяснимым причинам гораздо легче, чем кажется возможным. Снятие плотно прилегающей крышки приводит к мощному выдоху мирры и спертого воздуха склепа.'
  '613':
    2: Коробка-головоломка
    10: Коробка
    16: 'Предмет задания: Как бы вы ни перемещали подвижные панели этой маленькой инкрустированной коробки, ее крышка остается закрытой. Если встряхнуть его, то можно услышать, как внутри что-то дребезжит. Звучит как большой орех или бусина.'
  '614':
    2: Фиал могильной земли
    10: Флакон
    16: 'Предмет задания: Это пузырек с грязью, который вы украли из вампирского склепа в Теневом Шпиле.'
  '615':
    2: Барабан Победы
    10: Барабан
    16: 'Предмет задания: Свойства этого магического предмета вам неизвестны. Когда вы постукиваете по головке барабана одной из его палочек, возникающий ритм резонирует с эхом, которое, кажется, отражается от потолка неба.'
  '616':
    2: Зелье помазанных трав
    10: Бутылка с зельем
    16: 'Предмет задания: Хотя это зелье не обладает магическими свойствами, ингредиенты этого зелья были собраны в самых строгих ритуальных условиях. Порошок коры терна, например, измельчали ​​в серебряной ступке из коры, содранной во время пика полуденного затмения. Вся смесь хранилась в личном святилище провидца более ста лет.'
  '617':
    2: Камень силы
    10: Камень
    16: 'Предмет задания: Ограненный резной камень из темной стеклянной скалы. При постукивании по нему издается высокий колокольный тон.'
  '618':
