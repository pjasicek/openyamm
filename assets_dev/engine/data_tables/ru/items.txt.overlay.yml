    10: Артефактный длинный меч
    16: (Точность +40, 10-20 единиц урона Светом) Кузница Хаоса была разрушена при создании Мечей Баланса. Легенда гласит, что Клинок Света, Эльсенрейл, и Клинок Тьмы, Гломенталь, сыграют главные роли в последнем акте вселенной.
  '501':
    2: Гломенталь
    10: Артефактный длинный меч
    16: (Мощь +40, 10-20 очков урона от тьмы) Кузница Хаоса была уничтожена при создании Мечей Баланса. Легенда гласит, что Клинок Света, Эльсенрейл, и Клинок Тьмы, Гломенталь, сыграют главные роли в последнем акте вселенной.
  '502':
    2: Конечная остановка
    10: Артефактный палаш
    16: (Навык Оружейника +7, Сопротивление воздуху +30) В детстве, прежде чем вырезать свое варварское королевство в Вори, Ларс Эйлиф нашел этот меч глубоко в ледяной пещере. Когда он умер, оно было брошено вместе с ним на его похоронной барже. Как оно оказалось в Джадаме – загадка.
  '503':
    2: Разумная мера
    10: Артефактная абордажная сабля
    16: (Выносливость +40, Удача +40, Убийство огров) До того, как возникла Империя Регнанов, предки троллей Железного Песка жили на острове Регна. С помощью этого клинка и орды морских разбойников Харек I вытеснил троллей и сформировал свою пиратскую нацию.
  '504':
    2: Элдеракс
    10: Артефактный топор
    16: (Мощь +20, Стремительность, 6-12 единиц урона холодом, Минотавр) Когда темные гномы вырезали первый лабиринт Минотавра в сердце горы Пепельная Гибель, они выковали этот топор для Заксиуса, первого пастуха.
  '505':
    2: Вулкан
    10: Артефактный двуручный топор
    16: (10-20 единиц урона от огня, сопротивление огню +40) Безумный ремесленник Корнелиус Блэкширский построил этот топор для расчистки деревьев вокруг своего загородного поместья. «Один удар и повалит дерево, и превратит его в дрова!» было слышно, как он воскликнул. То, что вскоре его нашли убитым, а топор пропал, является доказательством того, что кто-то нашел этому инструменту лучшее применение.
  '506':
    2: Змееплеватель
    10: Артефактное копье
    16: (Выносливость +20, Убийство драконов, Быстрота) Вероятно, лучший охотник на драконов всех времен, сэр Райан Смедли носил это могучее копье с собой во всех своих экспедициях, утверждая, что с ним в руке он может победить любого дракона в единоборстве. Это оказалось правдой, но, тем не менее, он был убит не менее чем дюжиной драконов, устроивших ему засаду у Перевала Теневых Топей.
  '507':
    2: Страж
    10: Артефактная алебарда
    16: (+10 ко всем атрибутам, 10-20 единиц урона телу) Великий вампир Корбу, как известно, использовал живых людей для охраны своего склепа в светлое время суток. Очарованные чарами порабощения, эти жалкие души ходили по своим местам, неся эти могучие алебарды. Когда Корбу загадочным образом исчез, а заклинание рабства провалилось, несколько экземпляров этого оружия появились в большом мире.
  '508':
    2: Гнилой Клык
    10: Артефактный длинный кинжал
    16: (Вампир, 10 единиц урона ядом, Вампир) По завершении Войны вампиров за Чашу Корбу нанес ужасающее возмездие своему побежденному врагу, Калдену Фейну. Для мира будет лучше, если знания о некромантском искусстве, превратившие Фэйна — тело и душу — в этот живой клинок, будут утеряны.
  '509':
    2: Скипетр королей
    10: Артефактная булава
    16: (Личность + 40, Регенерация очков здоровья) Ури Хоссана, король западных эльфов, также известный как «Пьяный король», был свергнут в тот день, когда он по неосторожности потерял свой скипетр во время охоты. Это оказалось последней ошибкой недееспособного правителя. Его советники лишили его короны и оставили на произвол судьбы в Воющих топях. Его больше никогда не видели.
  '510':
    2: Выключатель
    10: Клуб Артефактов
    16: '(Мощь +20, Выносливость +20, 10-20 очков урона по телу) Тролльский фольклор полон басен о Семисильном Берлфисте, который вместе с Кусаком, своим верным спутником-волком, и своей могучей дубиной Брейкером бесконечно искал Серебряную Розу. Басни? Возникает вопрос: если существует Брейкер, то почему бы и нет Серебряной Розы?'
  '511':
    2: Посох Болота
    10: Артефактный посох
    16: (Защита; иммунитет к болезням, параличу и яду) Немерит, ничем не примечательная ведьма прошлой эпохи, была известна своими навыками изготовления посохов. Она создала посох для любого мыслимого использования. Говорят, она несла этот посох в поездки по сбору реагентов в болота.
  '512':
    2: Долгоискатель
    10: Артефактный лук
    16: (Точность +50, Стремительность, умение лука +4) Легенды рассказывают о многих великих героях-лучниках, но никто из них не выдающийся, как Бреннан Морланд, о котором, как говорят, однажды пронзил золотой соверен на 300 шагах на турнире по стрельбе из лука. Теперь, держа в руках его лук, вы должны задаться вопросом, не обязана ли легенда луку больше, чем человеку.
  '513':
    2: Сохранение Серендины
    10: Артефактный кожаный доспех
    16: (Регенерирует очки заклинаний, Выносливость +30) Маг, известный как хрупкостью тела, так и магическим мастерством, Серендина из Фрихейвена создала эту броню, чтобы максимально использовать свои сильные стороны и наименьшее количество слабостей.
  '514':
    2: Гломенмейл
    10: Артефактная кольчуга
    16: (+10 ко всем статистическим данным, +10 ко всем сопротивлениям, Темный эльф) На протяжении веков отношения темных и светлых эльфов были мирными, хотя и непростыми. До этого не было ничего, кроме войны. Лишь немногие комплекты этой боевой брони тёмных эльфов пережили разрушительное воздействие времени. Понятно, что те, у кого есть, желанны.
  '515':
