    16: Книга заклинаний. Чтобы выучить это заклинание, возьмите книгу и щёлкните левой кнопкой по изображению вашего персонажа на экране инвентаря. Чтобы изучить это заклинание, ваш персонаж должен владеть навыком темной магии до уровня Мастера.
  '1300':
    2: Пожиратель душ
    10: Книга заклинаний
    16: Книга заклинаний. Чтобы выучить это заклинание, возьмите книгу и щёлкните левой кнопкой по изображению вашего персонажа на экране инвентаря. Чтобы изучить это заклинание, ваш персонаж должен знать навык магии Тьмы до уровня Грандмастера.
  '1301':
    2: _scroll/book499
    10: _scroll/book499
    16: Описание здесь.
  '1302':
    2: Шайба
    10: Артефакт
    16: (Скорость +40, Скорость) Древний и волшебный, чары Пака заставляют его практически лететь к горлу врага. Никто не знает, когда и где был создан Пак, но происхождение Фейри безошибочно.
  '1303':
    2: Железное перо
    10: Артефакт
    16: (Мощь +40, 6-15 единиц электрического урона) Невероятно легкий двуручный меч, Железное Перо увеличивает Мощь своего владельца, делая владение огромным оружием еще проще. Эта комбинация практически позволяет использовать меч одной рукой — единственной проблемой является огромный размер лезвия.
  '1304':
    2: Уоллес
    10: Артефакт
    16: (Навык Оружейника +10, Личность +40) Уоллес каким-то образом на протяжении веков попадал в руки повстанцев и подстрекателей толпы. Оружие усиливает как способности, так и уверенность своего владельца, часто заставляя его владельцев идти на риск, которого в противном случае они могли бы избежать. Хотя ни одно из амбиций его владельца не было реализовано, никто никогда не отказывался нести Уоллеса после того, как услышал песню его сирены.
  '1305':
    2: Корсар
    10: Артефакт
    16: (Навык воровства +5, навык обезоруживания +5, Удача +40) Корсар — одно из лучших видов оружия, когда-либо выпускавшихся оружейными мастерскими Регнана. Всегда верные своей природе, кузнецы Регны создали оружие, которое помогло бы их имперским усилиям по «сбору налогов» в открытом море и прибрежных городах. На сегодняшний день Регна не создала оружие, которое не способствовало бы достижению их эгоистических целей за счет других.
  '1306':
    2: Доспехи губернатора
    10: Артефакт
    16: (Половина урона от ракетных атак, +10 ко всем статистическим данным) Эта фантастическая броня, принадлежавшая губернатору колонии Падишу во Времени Безмолвия, вновь появлялась во многих великих кладах сокровищ на протяжении всей истории. Как и большинство творений, созданных Небесной Кузницей, он практически неразрушим, и его подобие больше не может быть создано ни в одной кузнице на земле.
  '1307':
    2: Йоруба
    10: Артефакт
    16: (Иммунитет к болезням, безумию, параличу, яду, сну и каменным состояниям, Выносливость +25) Йоруба, названный в честь своего владельца и создателя, представляет собой чрезвычайно прочный, устойчивый к магии доспех из пластинчатой ​​кольчуги. Из-за непомерно высокой стоимости доспехи строились по частям — и это видно. Разные детали изготавливаются из разных материалов, самые дорогие из них — нагрудник. На нагруднике есть два прокола, которые первоначальный владелец так и не починил, возможно, из сентиментальных соображений.
  '1308':
    2: Разветвитель
    10: Артефакт
    16: (Взрывной удар, сопротивление огню +50). Несмотря на свою мощь, Разветвитель никогда не остаётся у одного владельца надолго. При ударе клинок испускает мощные вспышки огня, а даруемой оружием магической защиты недостаточно, чтобы полностью уберечь владельца от взрыва.
  '1309':
    2: Вурдалак
    10: Артефакт
    16: (Убийство нежити, иммунитет к параличу, урон от огня 3-18) Гулсбэйн был заказан Церковью Солнца более 150 лет назад в рамках их усилий по уничтожению постоянно растущей популяции нежити, созданной Церковью Луны. Несмотря на свою мощь, это всего лишь одно оружие, а нежити — легион. Церковь Солнца пала в 1083 году н.э.
  '1310':
    2: Виселица
    10: Артефакт
    16: (Убийство Нежити, Убийство Дракона, Убийство Демонов) Невесёлое оружие, если не сказать больше, Виселица была выкована Мекоригом Слепым, чтобы помочь положить конец Эпохе Монстров и продвинуть Эпоху Человека. Благородная идея, но она не сработала. Виселица часто пропадает на годы, но амбициозные искатели приключений находят ее заново в каких-нибудь драконьих кладах. Мощь оружия часто вдохновляет таких искателей приключений переместить оружие в другой драконий клад, где оно снова пропадает на годы.
  '1311':
    2: Шарель
    10: Артефакт
    16: Построенный по приказу Харека I во время формирования Ренанской «Империи», Шареле был назван в честь его жены, королевы Шареле. Его оставили на единственном эрафианском аванпосте Регны во время хаоса, последовавшего за смертью Харека от отравления в 590 году нашей эры.
  '1312':
    2: Уллисы
    10: Артефакт
    16: (Точность +50, урон водой 9-12) Мечта лучника. Уллису не нужны стрелы, он стреляет ледяными стрелами, образующимися при натягивании тетивы. Его происхождение неизвестно, но стиль предполагает эльфийское происхождение.
  '1313':
    2: Руки мастера
    10: Артефакт
    16: (Навык без оружия +10, навык уклонения +10) Руки мастера предназначены для монахов, но некоторые воры использовали их с отличными результатами. Большинство владельцев добились славы и богатства, но последний, очевидно, преуспел не так хорошо.
  '1314':
    2: Бутсы Семи лиг
    10: Артефакт
    16: (Скорость +40, Магия Воды) Названные так в честь улучшения рефлексов и скорости владельца, истинная функция Ботинок — облегчить использование магии Воды для ускорения путешествия. Каждому, кто использует эти ботинки, суждено добиться величия, но не обязательно чести. Много бед можно списать на предыдущих владельцев этих ботинок.
  '1315':
    2: Кольцо правителя
    10: Артефакт
    16: (Магии разума, магии Тьмы) Кольцо Правителя было изготовлено в 744 году нашей эры. Джошуа Стом, главный алхимик Чернокнижников Нигона. Хотя кольцо и не является изначально злым артефактом, оно было создано для контроля и завоевания, не более того.
  '1316':
    2: Маш
    10: Реликвия
    16: (Мощь +150, Интеллект -40, Личность -40, Скорость -40) Говорят, что Маш был ответом на молитву Первого Огра Богам об оружии, которое сделало бы его сильнее, чем что-либо еще. Раздраженные, Боги прокляли Первого Огра Машем, и с тех пор все Огры несли на себе печать этого поступка — сильные, но медленные, тупые и глупые. В любом случае, Маш теперь ваш.
  '1317':
    2: Посох Этрика
    10: Реликвия
    16: (Тёмная магия, навык медитации +15, постепенное уменьшение очков здоровья, зло) Посох Этрика — скорее инструмент, чем оружие, созданный первым в мире личем — Этриком Безумным. Посох усиливает темную магию, черпая жизненную силу своего пользователя. Поскольку жизненная сила Этрика поддерживалась магией, для него это не было проблемой. Однако смертные будут постепенно ощущать, как их жизненная сила утекает, пока они держат посох.
  '1318':
    2: Кожа Харека
    10: Реликвия
    16: (Навык воровства +5, навык обезоружения +5, Ходьба по воде, Удача +50, Все сопротивления -10)Эта кожаная броня была специально изготовлена ​​арсеналом Регнана для Харека Первого, Лорда Регны и Императора Бесконечного Океана. Доспехи делали все, на что мог надеяться такой прославленный пират, как Харек, кроме защиты от яда. Могущественный первый император Регны умер сразу после ужина в доспехах, отравленный рукой своей жены.
  '1319':
    2: Старый Ник
    10: Реликвия
    16: (Навык обезоруживания +5, 8 очков урона ядом, Убийство эльфов, Зло) Тайно передававшийся от одного Ассасина к другому на протяжении веков, Старый Ник счастливо исчез из поля зрения истории во время Утренней Битвы - совместной атаки людей и эльфов на гильдию Ассасинов почти 200 лет назад. Говорят, что Старый Ник убил больше людей, чем Чума. Теперь, когда вы нашли это зловещее оружие, вы собираетесь бросить его в колодец... не так ли?
  '1320':
    2: Амук
    10: Реликвия
    16: (Мощь +100, Выносливость +100, Класс брони -15) Первоначальное имя Амука было потеряно во времени, но клинок сохранил магическую остроту и всю свою первоначальную силу. Фантастическая сила и жизненная сила даруются владельцу за счет должного чувства страха. Владельцы Амука не особо стараются уклоняться от ударов в бою.
  '1321':
    2: Щит Славы
    10: Реликвия
    16: (Духовная магия, навык щита +5, сопротивление тела -10, сопротивление разума -10) Один из пяти известных существующих таких щитов, Щит Славы, был построен во времена чудес. Он был специально настроен для развития магии Духа, но эта же настройка оставляет владельца в некоторой степени открытым для атак, основанных на разуме и теле.
  '1322':
    2: Келебрим
    10: Реликвия
    16: (Иммунитет к состоянию камня, Половина урона от ракетных атак, Выносливость +50, Сопротивление земле -30) Один из первых щитов, выпущенных в литейной мастерской Келебрима, на нем есть простая печать «Келебрим» внутри под ремешком на руку. У него есть очень мощные чары, предназначенные для защиты от взглядов Медузы, но, как и у многих великих чар, у него есть недостаток. Келебрим ослабляет сопротивление своего владельца магии Земли.
  '1323':
    2: Шлем Таледона
    10: Реликвия
    16: (Магии Света, Личности +15, Мощи +15, Удачи -40, Добра) Принадлежащий Таледону, Божественному Первосвященнику и Высшему Святому Проводнику Церкви Солнца с 870 года нашей эры, этот мощный шлем, вероятно, способствовал его безвременной смерти в 881 году. Говорят, что объект может потребовать слишком много чар - попробуйте вложить слишком много, и что-то негативное выдавливает. В данном случае негатив делал владельца крайне неудачливым. Таледон, возможно, самая влиятельная фигура своего времени, опытный дипломат, солдат и священник, был раздавлен колесами повозки беглого крестьянина, когда переходил улицу в Стедвике.
  '1324':
    2: Кепка учёного
    10: Реликвия
    16: (Навык обучения +15, Выносливость -50) Шапка Ученого значительно улучшает способность разума усваивать и сохранять опыт. Эффект настолько интенсивен, что владельцы часто забывают заботиться о своем теле, плавая в море своих мыслей.
  '1325':
    2: Финаксианская корона
    10: Реликвия
    16: (Магия огня, Сопротивление воде +50, Личность +30, Класс брони -20) Это потерянная (БЫЛА потерянная) корона недолговечной Империи Финакс. При ношении драгоценности короны тлеют едва сдерживаемой магией Огня и бросают красноватый свет на лицо владельца. Корона усиливает любые навыки магии Огня, которыми может обладать владелец, и яростно сопротивляется атакам, основанным на воде.
  '1326':
    2: Пояс Титана
    10: Реликвия
    16: (Мощь +75, Скорость -40) Как и многие подобные предметы, Пояс Титана увеличивает мощь своего владельца за счет скорости. Единственная разница с этой реликвией — это величина компромисса.
  '1327':
    2: Сумерки
    10: Реликвия
    16: (Скорость +50, Удача +50, Все сопротивления -15, Зло) Зловещий Сумеречный плащ использовался шпионами и убийцами на протяжении веков. Природа чар настолько полезна для этих профессий, что потерю магического сопротивления легко не заметить.
  '1328':
    2: Аня Селвинг
    10: Реликвия
    16: (Точность +150, Навык лука +5, Класс брони -25) Мастер-кузнец Иван Селвинг назвал этот арбалет в честь своей единственной дочери Ани, назвав его вторым лучшим творением за всю историю. Лучники, использующие этот арбалет, редко промахиваются, но их концентрация и медленные, осторожные движения делают их легкой добычей.
  '1329':
    2: Правосудие
    10: Реликвия
    16: (Убийство нежити, магия разума, магия тела, -40 скорости, добро) Справедливость, выкованная в безмятежные дни на заре Церкви Солнца, является мощным оружием добра. За счет скорости Справедливость — одна из самых могущественных реликвий, которую Паладин или Священник может использовать на Пути Света.
  '1330':
    2: Молот Мекорига
    10: Реликвия
    16: (Магия духа, Сила +75, Сопротивление воздуху -50) Это тот самый молот, который великий Мекориг Слепой использовал для изготовления огромного количества лучшего в мире зачарованного снаряжения за многие годы своего пребывания на посту Мастера литейной Мекорига. Связь молота со стихиями делает владельца уязвимым для стихийной магии, но это небольшая цена за улучшенные способности «Я» и Мощь, которые дает молот.
  '1331':
    2: Сандалии Гермеса
    10: Сандалии
    16: (+100 Скорость, +50 Точность, +50 Сопротивление воздуху, Регенерация ОЗ, Регенерация ОЗк, Падение перьев) Ходят слухи, что крылатые сандалии являются обувью бога и наделяют владельца огромной силой.
  '1332':
    2: Плащ овцы
    10: Артефактный плащ
    16: (Иммунитет к болезням, безумию, параличу, яду, сну и каменным состояниям, Интеллект -20, Личность -20) Плащ, который носил Верховный Жрец Баа, хотя и полезен, но кажется, что он медленно подрывает волю владельца.
  '1333':
    2: Эльфийская гибель
    10: Артефактный двуручный меч
    16: (Защита, убийца эльфов, только для гоблинов) Этот меч гоблины создали для своего вождя Грогара. Гоблины проиграли войну, и Эльфийская гибель надолго исчезла. Зачарованный убивать эльфов и защищать владельца от стрел, меч полностью оправдывает своё название. Любопытный побочный эффект чар не позволяет пользоваться им никому, кроме гоблинов.
  '1334':
    2: Внутренний взор
    10: Артефактный шлем
    16: (+15 к интеллекту, +15 к личности, восстановление маны, только для людей) Внутренний взор был создан Мекоригом для великого друида Ларетты Вейсман. Он повышает интеллект и личность, восстанавливает ману владельца и защищает его голову. К сожалению, этот шлем подходит только человеку.
  '1335':
    2: Эльфийская кольчуга
    10: Артефактная кольчуга
    16: (Восстановление, +15 Скорость, +15 Точность, Эльфийский) Эльфийская кольчуга была более распространена до войн против людей и гоблинов. Столетия сражений в сочетании с деградацией навыков изготовления доспехов сократили количество комплектов эльфийских кольчуг практически до нуля. Эффект использования более легких материалов и индивидуальной разработки доспехов, подходящих только для эльфов, дает владельцу больше свободы передвижения, позволяя атаковать быстрее и точнее.
  '1336':
    2: Ковать рукавицы
    10: Артефактные рукавицы
    16: (+30 сопротивления огню, +15 силы, +15 выносливости, гном) Рукавицы кузницы были созданы Мекоригом для его помощников, чтобы помочь им помочь ему. Увеличивая и без того удивительную мощь и выносливость дварфов, рукавицы также обеспечивают исключительную устойчивость к огню, что необходимо в такой жаркой кузнице, как кузница Мекорига.
  '1337':
    2: Ремень героя
    10: Артефактный пояс
    16: (+5 навыка «Оружейник», +15 «Мощь», «Регенерация ОЗ», «Мужчина») Этот пояс, созданный для Святого Перси, дарует боевое мастерство, исключительную силу и регенерацию. Святой Перси довольно широко пользовался поясом, но даже с его помощью ему не удалось предотвратить смерть от руки дракона Вромтракса.
  '1338':
    2: Женский эскорт
    10: Артефактное кольцо
    16: (Ходьба по воде, Падение перьев, Защиты, Женщина) Магический «эскорт», созданный магом Терраксом для одной из его подруг, которой пришлось пройти довольно далеко, чтобы добраться до него. Кольцо защищает владельца от непогоды, падения и утопления. К сожалению, она отправилась в Эрафию, и кольцо вскоре исчезло.
  '1339':
    2: Амулет звонаря
    10: Особый амулет
    16: Могучий инструмент алхимика — именно этот амулет был секретом успеха Звонаря.
  '1340':
    2: Сабля лейтенанта
    10: Особая абордажная сабля
    16: Прекрасное стальное оружие, эта абордажная сабля заточена и готова к действию.
  '1341':
    2: Зеркало Медузы
    10: Особый амулет
    16: Пользователь этого зеркала полностью невосприимчив к эффектам забивания камнями. Было бы неплохо сделать это раньше.
  '1342':
    2: Кинжал леди Кармин
    10: Особый кинжал
    16: Потертости и царапины на этом ужасном лезвии показывают, что оно повидало немало боевых действий.
  '1343':
    2: Клинок злодея
    10: Особый меч
    16: Уильям Сетаг часто убивал пленников этим клинком, чтобы залечить свои небольшие порезы и синяки. Оружие холодное на ощупь и покалывает в руке.
  '1344':
    2: Идеальный лук
    10: Особый лук
    16: 'Предмет задания: Несмотря на высокое качество, этот лук, похоже, работает не так хорошо, как следовало бы. Тетиву слишком трудно натянуть назад, она недостаточно устойчива при прицеливании и кажется немного разбалансированной.'
  '1345':
    2: Идеальный лук
    10: Особый лук
    16: Кажется, этот лук знает силу своего владельца и соответствующим образом адаптируется. Вам никогда не придется прилагать усилия, чтобы натянуть тетиву назад, и всегда легко удерживать выстрел, пока вы не будете готовы выстрелить. Десятки подобных небольших преимуществ в конструкции лука делают его лучшим оружием такого типа, которое вы когда-либо видели.
  '1346':
    2: Маска Тени
    10: Особый шлем
    16: Маска, предназначенная для сокрытия личности владельца, она также была магически улучшена, чтобы обеспечить хорошую защиту и облегчить воровские действия.
  '1347':
    2: Кольцо призрака
    10: Особое кольцо
    16: Странное кольцо, удивительно теплое на ощупь. Это усиливает связь владельца с духом.
  '1348':
    2: Кольцо Феи
    10: Особое кольцо
    16: Редкое и очень мощное кольцо, созданное Фейри. Немногие смертные когда-либо видели такое!
  '1349':
    2: Солнцезащитный плащ
    10: Особый плащ
    16: Этот плащ означает высший ранг, достижимый Жрецом Солнца. Всего было изготовлено не более девяти таких плащей — по одному на каждого члена Высшего Совета Солнца.
  '1350':
    2: Лунный плащ
    10: Особый плащ
    16: Этот плащ означает высший ранг, достижимый Жрецом Луны. Всего было изготовлено не более девяти таких плащей — по одному на каждого члена Высшего Совета Луны.
  '1351':
    2: Топор Зокарра
    10: Особый двуручный топор
    16: Семейная реликвия монархов Зокарра. Это оружие дает владельцу большую близость к магии земли.
  '1352':
    2: Накидка вампира
    10: Особый плащ
    16: Неудивительно, что такой плащ можно найти на вампире. Плащ препятствует попаданию солнечных лучей на тело, но не способен защитить лицо.
  '1353':
    2: Топор Минотавра
    10: Специальный топор
    16: Отличный трофей! Топор создан для Минотавра и очень тяжел, но магическая сила, которую он придает, позволяет легко использовать его любому.
  '1354':
    2: Сабля Гроньяра
    10: Особая абордажная сабля
    16: Искусно изготовленное и специально зачарованное оружие гоблинов. Хотя изначально это оружие было создано для уничтожения эльфов, оно отлично справляется с представителями других рас.
