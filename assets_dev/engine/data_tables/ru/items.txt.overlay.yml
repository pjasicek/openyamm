  '1603':
    2: Длинный меч
    10: Длинный меч
    16: Несмотря на простоту конструкции и конструкции, этот длинный меч, тем не менее, смертоносен.
  '1604':
    2: Меч Воина
    10: Длинный меч
    16: Длинный меч превосходной силы и остроты.
  '1605':
    2: Меч крестоносца
    10: Длинный меч
    16: Чеканный металлический узор на лезвии этого длинного меча свидетельствует о высоком качестве гномьего производства.
  '1606':
    2: Меч Завоевателя
    10: Длинный меч
    16: Длинный меч чрезвычайно высокого качества, это оружие является одним из не более чем тысячи подобных, выкованных мастером-оружейником Мекоригом Слепым около 780-800 годов.
  '1607':
    2: Меч Львиного Сердца
    10: Длинный меч
    16: Оружие столь же редкое, сколь и древнее. Этот длинный меч был выкован во времена чудес. Процесс, используемый для ковки стали такого качества, был утерян сразу после Безмолвия.
  '1608':
    2: Клеймор
    10: Двуручный меч
    16: Обычный двуручный меч. Тысячи этого низкокачественного оружия можно найти по всему Энроту.
  '1609':
    2: Варвар Фламберге
    10: Двуручный меч
    16: Еще один простой двуручный меч, оружие этого варвара имеет волнистое лезвие и дополнительную крестовину. Его конструкция прочная, а лезвие острое.
  '1610':
    2: Меч покорителя
    10: Двуручный меч
    16: Необыкновенно высококачественный двуручный меч, этот клинок одновременно прочный и надежный.
  '1611':
    2: Прекрасный палаш
    10: Палаш
    16: Обычный палаш. Эти клинки можно найти по всей земле в руках как героев, так и злодеев.
  '1612':
    2: Массивный стальной палаш
    10: Палаш
    16: Более крупная разновидность эрафианского стального палаша, ничуть не уступающая по качеству своему меньшему аналогу. Увеличенный размер требует больше силы, но он гарантированно оставит след.
  '1613':
    2: Могучий палаш
    10: Палаш
    16: Острие и красота этого палаша зачарованы и нетронуты временем. Клинок выглядит так, будто его выковали вчера.
  '1614':
    2: Абордажная сабля
    10: Абордажная сабля
    16: Абордаж, изготовленный гоблинами, этот клинок столь же смертоносен, сколь и уродлив.
  '1615':
    2: Пиратская абордажная сабля
    10: Абордажная сабля
    16: Традиционное резервное оружие пиратов Регнана, живущих на бесчисленных островах к востоку от острова Тумана. Эти абордажные сабли были выкованы одним из многочисленных кузнецов, уроженцев этих островов.
  '1616':
    2: Мастер Абордаж
    10: Абордажная сабля
    16: Эти великолепные абордажные сабли были созданы в ограниченном количестве Алеком Телингом, мастером-оружейником Харека IX, и выдавались только адмиралам флотов Регнана в качестве символа положения. Вряд ли вы в своей жизни увидите более прекрасную абордажную саблю.
  '1617':
    2: Кинжал
    10: Кинжал
    16: Обычный кинжал, любимый ворами и убийцами во всем мире.
  '1618':
    2: Кровавый кинжал
    10: Кинжал
    16: Кровавые кинжалы — церемониальное оружие, которое носила знать Регны. Их популярность в последние годы распространилась на знать Энрота, и теперь их можно найти по всей стране. Хотя они и церемониальны, это острые и надежные клинки.
  '1619':
    2: Теневой кинжал
    10: Кинжал
    16: Говорят, что эти кинжалы, созданные по заказу Этрика Безумного, когда он был еще человеком, связаны с Землей Мертвых. Их используют в некоторых магических ритуалах, направленных на неестественное продление жизни.
  '1620':
    2: Кинжал мага
    10: Кинжал
    16: Один из менее чем сотни таких клинков, кинжалы Магов, которые носили и выковывали члены Алхимического Альянса примерно 300 лет назад в кострах под Замком Аламос. Уже невозможно сделать клинок лучше, чем кинжал Мага.
  '1621':
    2: Драгоценный кинжал
    10: Кинжал
    16: Оружие из Времени Чудес, этот клинок очень старый и качественный.
  '1622':
    2: Прекрасный длинный кинжал
    10: Длинный кинжал
    16: Обычный длинный кинжал. Эти длинные кинжалы, граничащие с мечами, предпочитают убийцы, которым нужно оружие, которое можно спрятать, но при этом оно имеет большую дальность действия, чем традиционный кинжал.
  '1623':
    2: Пронзающий кинжал
    10: Длинный кинжал
    16: На самом деле это скорее короткий меч, чем кинжал, узкое лезвие скрывает необычную силу и, возможно, зачарованное лезвие.
  '1624':
    2: Божественный кинжал
    10: Длинный кинжал
    16: «Оружие Богов», это оружие было одним из последних, созданных до того, как великие кузницы пали от Безмолвия в 113 году нашей эры (После Безмолвия).
  '1625':
    2: Ручной топор
    10: Топор
    16: Этот простой топор скорее инструмент, чем оружие, он подойдет в крайнем случае. Но не ожидайте многого.
  '1626':
    2: Варварский топор
    10: Топор
    16: Этот боевой топор, созданный как оружие войны, а не инструмент, обычно используется варварами и недисциплинированными армиями.
  '1627':
    2: Боевой топор
    10: Топор
    16: Этот боевой топор, по-видимому, является одним из большой партии таких топоров, захваченной Роландом во время Войны за Наследие. Он был изготовлен в Каригоре по приказу Арчибальда Железного Кулака для использования против его брата в борьбе за трон Энрота.
  '1628':
    2: Благородный топор гномов
    10: Топор
    16: 'Пример высококачественной работы, выполненной гномами Красных гор: лезвие острое, а баланс идеален.'
  '1629':
    2: Верховный топор
    10: Топор
    16: У этого оружия наверняка темная история. Топор такого качества выковывается только как личное оружие благородного гнома, и его никогда не продают и не обменивают…
  '1630':
    2: Легкая секира
    10: Двуручный топор
    16: Этот тип топора с длинной рукояткой обычно используется для смертельного воздействия восточными племенами и элитной гвардией некоторых представителей знати.
  '1631':
    2: Тяжелая секира
    10: Двуручный топор
    16: Более сильная версия базовой секиры, это оружие часто используется городской стражей и другими бойцами, которые не планируют сражаться большими, скоординированными группами (например, армиями).
  '1632':
    2: Большая секира
    10: Двуручный топор
    16: Лезвие этого оружия, очевидно, было создано с помощью магии. Он одновременно необычайно острый и легкий.
  '1633':
    2: Копье
    10: Копье
    16: Это копье, не более чем заостренная палка, по-прежнему весьма смертоносно. Как и все копья, его можно использовать одной или обеими руками (+1D9, если использовать двуручное оружие).
  '1634':
    2: Прочное копье
    10: Копье
    16: Это копье имеет усиленный стальной наконечник, который помогает ему пробивать прочную броню и шкуры. Как и все копья, его можно использовать одной или обеими руками (+1D9, если использовать двуручное оружие).
  '1635':
    2: Змеиное копье
    10: Копье
    16: Это копье, украшенное резными змеями, бегущими вдоль древка, оснащено крестовиной, предназначенной для предотвращения скольжения пронзенных противников по древку копья и нанесения вам удара при смерти. Как и все копья, его можно использовать одной или обеими руками (+1D9, если использовать двуручное оружие).
  '1636':
    2: Дикое копье
    10: Копье
    16: Полностью изготовленное из редкого голубоватого металла, нижняя половина этого копья обернута дорогой кожей. Предмет коллекционирования! Как и все копья, его можно использовать одной или обеими руками (+1D9, если использовать двуручное оружие).
  '1637':
    2: Священное копье
    10: Копье
    16: Это копье несет в себе характеристики снаряжения Времени чудес — красивое, в идеальном состоянии и смертоносное. Эта модель производилась уже за столетия до Безмолвия и оставалась в производстве почти до конца существования Небесных Кузниц, служа в тот период церемониальным и представительским целям. Более поздние боевые модели — единственные копья массового производства, которые превосходят их по характеристикам (+1D9 при использовании двуручным оружием).
  '1638':
    2: Обычная алебарда
    10: Алебарда
    16: Комбинация секиры и копья, алебарда может нанести ужасные раны, но медленно восстанавливается после ударов. Это оружие среднего качества и изготовления (+1D6 при использовании двуручным оружием).
  '1639':
    2: Массивная алебарда
    10: Алебарда
    16: Эта алебарда имеет прочную конструкцию и особенно тяжелое лезвие. Вооруженный могучим воином, он, несомненно, может быть использован для уничтожения самых сильных монстров (+1D6 при использовании двуручным оружием).
  '1640':
    2: Элитная алебарда
    10: Алебарда
    16: То, что эта великолепная алебарда является продуктом литейной мастерской Мекорига, вас не удивит. От замысловатой формы головы до прочности конструкции — все в этом оружии кричит о качестве (+1D6 при использовании двуручным оружием).
  '1641':
    2: Трезубец
    10: Трезубец
    16: Обычные боевые трезубцы, подобные этому, представляют собой оружие хорошего качества, выпускаемое Имперским флотом Регнана для облегчения сбора имперских пошлин в открытом море. Большинство торговцев и других правительств называют эту деятельность пиратством… (+1D6, если использовать двуручное оружие).
  '1642':
    2: Изысканный трезубец
    10: Трезубец
    16: Высококачественный боевой трезубец в стиле офицеров Имперского флота Регнана. Этот, вероятно, был взят у офицера во время битвы за имперское налогообложение, которая прошла неудачно для Флота (+1D6 при использовании двуручным оружием).
  '1643':
    2: Титаник Трезубец
    10: Трезубец
    16: Этот красивый трезубец в основном сделан из кергара, редкого голубоватого металла, который не ржавеет и не теряет своей остроты с течением времени (+1D6 при использовании двуручным оружием).
  '1644':
    2: Грубый длинный лук
    10: Длинный лук
    16: Простой длинный лук, изготовленный из обычных материалов и лишенный вдохновения дизайна.
  '1645':
    2: Эльфийский лук
    10: Длинный лук
    16: Оружие, созданное только эльфами великих Эрафианских лесов. Он отражает то же высокое качество изготовления, что и все эльфийские артефакты.
  '1646':
    2: Прецизионный лук
    10: Длинный лук
    16: Выгравированные инициалы у основания лука указывают на то, что этот лук был изготовлен в мастерской мастера-лучника Ивана Сельвинга во время Лесных войн против эльфов Эрафии в конце 600-х годов.
  '1647':
    2: Волшебный лук
    10: Длинный лук
    16: Этот лук сделан из странных материалов и соединен тонкими чарами. Он чрезвычайно легкий и точный.
  '1648':
    2: Звездный лук
    10: Длинный лук
    16: Созданные путем лишения Небесных Кузниц их зачарованных частей, когда они стали бесполезными через несколько лет после Безмолвия, очень немногие из этих луков пережили время. То немногое, что осталось, хранится эльфами и отдельными коллекционерами.
  '1649':
    2: Арбалет
    10: Арбалет
    16: Арбалеты — самое смертоносное оружие дальнего боя, созданное со времен чудес. Этот арбалет сделан из прочного тиса и металлических деталей, но в остальном он довольно обычный.
  '1650':
    2: Точный арбалет
    10: Арбалет
    16: Эти арбалеты имеют изогнутую деревянную часть рядом с посохами, которая помогает предотвратить отдачу и повышает точность. Это достигается за счет большего веса, чем у более легких арбалетов.
  '1651':
    2: Настоящий арбалет
    10: Арбалет
    16: Эти исключительные арбалеты, оснащенные рукояткой и прицельными приспособлениями, превосходят все, что было раньше. Откуда они взялись, пока остается загадкой…
  '1652':
    2: Простая булава
    10: Булава
    16: Эта обычная булава, не более чем прославленная дубинка, сделана из обычных материалов и с незаурядным мастерством.
  '1653':
    2: Злая булава
    10: Булава
    16: Надежно разработан для нанесения смертельных травм, даже через броню. Баланс немного тяжеловат, но качество изготовления хорошее.
  '1654':
    2: Громовая булава
    10: Булава
    16: Эта булава — одна из тысяч, созданных Небесными Кузницами до Наступления Безмолвия. Но это было более тысячи лет назад, и осталось не так много.
  '1655':
    2: Чудо-булава
    10: Булава
    16: Только магия могла сделать такое неуклюжее оружие таким легким и при этом столь сильным.
  '1656':
    2: Булава Смерти
    10: Булава
    16: Это необычное оружие, созданное гильдией Некромантов незадолго до их падения во время Войны за Наследие, почти всегда зачаровано мощной магией.
  '1657':
    2: Массивный молот
    10: Молот
    16: Неизящное и лишенное воображения оружие, молоты медленные, но бьют очень сильно. Это обычная конструкция и материалы.
  '1658':
    2: Темный Молот
    10: Молот
    16: Эти молоты представляют собой шаг вперед в качестве конструкции и обычно используются гуманоидными монстрами. Поскольку всем известно, что большинство монстров не производят оружие, вопрос «откуда они его берут?» возникает…
  '1659':
    2: Святой Молот
    10: Молот
    16: Эти магически созданные молоты являются собственностью Церкви Луны в Каригоре.
  '1660':
    2: Корневой клуб
    10: Клуб
    16: Примитивное оружие, которым могут воспользоваться даже самые глупые монстры. Вы же не думаете об этом, не так ли?
  '1661':
    2: Шипастая дубинка
    10: Клуб
    16: Эта дубинка с шипами, улучшенная по сравнению с простой дубинкой, наносит более неприятные раны.
  '1662':
    2: Клуб убийц
    10: Клуб
    16: Король клубной семьи. Если бы у этого оружия была ручка или шар на конце, это была бы булава. В этом клубе есть свидетельства настоящего мастерства, но вы не можете увидеть никаких истинных опознавательных знаков, указывающих на то, кто его создал.
  '1663':
    2: Персонал
    10: Персонал
    16: Посох – традиционное оружие угнетенных. Этот ничем не примечателен, а рубин на его конце на самом деле просто цветное стекло.
  '1664':
    2: Изумрудный посох
    10: Персонал
    16: Этот магически легкий и твердый посох изготовлен из редкой древесины, захваченной у эльфов во время Лесной войны в 600 году нашей эры. Изумруд на конце настоящий и, вероятно, служит магическим резервуаром, из которого посох черпает свою силу.
  '1665':
    2: Силовой посох
    10: Персонал
    16: Этот посох, как и другие подобные, был найден в сокровищнице гильдии Некромантов после их катастрофического поражения от Роланда в конце Войны за Наследие.
  '1666':
    2: Бластер
    10: Древнее оружие
    16: Оружие огромной силы, явно созданное во времена чудес.
  '1667':
    2: Бластерная винтовка
    10: Древнее оружие
    16: Лучшее личное оружие, созданное во времена чудес. Эта бластерная винтовка может нанести смерть быстрее, чем любое оружие, которое вы когда-либо видели.
  '1668':
    2: Кожаный доспех
    10: Кожаный доспех
    16: Самая легкая и простая в изготовлении броня, кожаная броня обеспечивает наименьшую защиту. Конкретно этот костюм среднего качества.
  '1669':
    2: Усиленная кожа
    10: Кожаный доспех
    16: Кожа с шипами обеспечивает большую защиту, чем обычная кожаная броня, но она более жесткая и весит больше. Этот конкретный костюм сделан хорошо.
  '1670':
    2: Зачарованная кожа
    10: Кожаный доспех
    16: Слегка зачарованный доспех, который намного прочнее, чем можно было бы предположить по его весу. Накладки на плечи и пояс обеспечивают дополнительную защиту без ущерба для свободы движений.
  '1671':
    2: Кожа дракона
    10: Кожаный доспех
    16: Стандартная кожаная броня для офицеров ВМС Регнана. Все такие кожаные доспехи подвергаются чарам, усиливающим и облегчающим их во время их создания в Оружейной палате Регнана. Этот конкретный костюм несколько тяжелее обычного и немного больше закрывает тело.
  '1672':
    2: Императорская кожа
    10: Кожаный доспех
    16: Чрезвычайно редкий комплект кожаных доспехов, созданный во время конфликтов между Церковью Луны и Церковью Солнца примерно 80 лет назад. Эти костюмы обеспечивают лучшую защиту, доступную кожаным доспехам.
  '1673':
    2: Кольчуга
    10: Кольчуга
    16: 'Кольчуга — это броня, состоящая из маленьких переплетенных металлических петель. Этот костюм низкого качества: металл — простое железо, колец всего два слоя, он тяжелый и жесткий для своего размера. Несмотря на то, что он начал подвергаться коррозии, он до сих пор остался нетронутым.'
  '1674':
    2: Базовая стальная кольчуга
    10: Кольчуга
    16: Превосходный кольчужный костюм, в этом костюме использована сталь, и бывший владелец тщательно следил за тем, чтобы костюм был хорошо смазан и не содержал ржавчины. Однако покрытие областей ниже талии могло бы быть лучше.
  '1675':
    2: Благородная кольчуга
    10: Кольчуга
    16: Кольчуга кавалерийского офицера времен правления Таледона V из Каригора, Божественного Первосвященника и Высшего Святого Проводника Церкви Солнца, около 870 г. н.э. Доспехи представляют собой высококачественную цепь, зачарованную для облегчения и укрепления металла.
  '1676':
    2: Королевская кольчуга
    10: Кольчуга
    16: Сильно зачарованная броня, которую носила эльфийская знать и члены королевской семьи во время Лесных войн седьмого и восьмого веков.
  '1677':
    2: Величественная кольчуга
    10: Кольчуга
    16: Модель брони до Безмолвия — ее можно было увидеть Губернатором и его ближайшими соратниками в качестве знака должности. Формула создания этих костюмов довольно старая, фактически она была скорректирована незадолго до того, как сломались Кузницы. По сути, эта кольчуга превосходит большинство других подобных доспехов в современном мире, хотя ее все еще превосходят костюмы, созданные в годы, предшествовавшие Безмолвию.
  '1678':
    2: Латная кольчуга
    10: Латы
    16: Пластинчатая броня, состоящая из взаимосвязанных пластин и соединений, является лучшей доступной незачарованной броней. Однако он тяжелый и замедляет движения владельца. Этот костюм среднего качества, кузнец неизвестен.
  '1679':
    2: Стальная пластинчатая кольчуга
    10: Латы
    16: Хорошо сконструированные стальные пластины вместе образуют превосходный доспех. Литейный штамп под правой рукой указывает на то, что он был выкован недавно в Келебриме.
  '1680':
    2: Золотая латная кольчуга
    10: Латы
    16: Этот комплект пластинчатых доспехов был выкован в литейном цеху Мекорига через восемнадцать лет после смерти Мекорига Слепого. Эта шедевральная броня почти так же проста в ношении, как и обычную одежду, и, вероятно, это лучшая броня, доступная в мире.
  '1681':
    2: Воздушный щит
    10: Большой щит
    16: Этот простой щит, состоящий из натянутых шкур на деревянном каркасе, обеспечивает базовую защиту от физических атак.
  '1682':
    2: Башенный щит
    10: Большой щит
    16: Простота геральдического рисунка на этом щите заставляет предположить, что он был создан либо варварами, либо гоблинами. Он изготовлен из прочных материалов и должен достаточно хорошо выдержать бой.
  '1683':
    2: Щит замка
    10: Большой щит
    16: Этот щит сделан из дерева и обрамлен железом. Он несколько тяжел для своего размера, но он должен безопасно провести вас в битве — если только вы не получили удар в спину.
  '1684':
    2: Небесный Щит
    10: Большой щит
    16: Этот щит, сделанный из легкого металла, имеет литейное клеймо из арсенала Келебрима. Несмотря на лёгкость, материал очень прочный, а металл сваривается практически бесшовно.
  '1685':
    2: Олимпийский щит
    10: Большой щит
    16: Этот круглый щит представляет собой образец давно ушедшей финаксидской империи, которая когда-то правила южной Эрафией. Выкованный из стали, он чрезвычайно прочен и восприимчив к чарам. Он настолько хорошо сделан, что единственным его недостатком, кажется, является довольно компактный размер для большого щита, что несколько ограничивает его зону действия.
  '1686':
    2: Занозистый баклер
    10: Малый щит
    16: Небольшой деревянный щит, предназначенный главным образом для защиты от стрел. Древесина, из которой он сделан, никогда не строгалась должным образом, поэтому на ее поверхности полно щепок и щепок. Оставшееся время его жизни в бою, вероятно, намного короче, чем хотелось бы.
  '1687':
    2: Ржавый бронзовый щит
    10: Малый щит
    16: Бронзовые щиты легче железных щитов того же размера, но не так прочны.
  '1688':
    2: Стальной щит
    10: Малый щит
    16: Поскольку этот щит сделан из закаленной стали, он должен противостоять любому зачарованному оружию, кроме самого необычного.
  '1689':
    2: Щит Духа
    10: Малый щит
    16: Щиты духов — это обычные стальные щиты, зачарованные посредством ритуального процесса, который может иметь мощные, хотя и непредсказуемые результаты. Этот процесс отнимает много времени и требует пристального внимания как минимум трех мастеров духовной магии.
  '1690':
    2: Астральный щит
    10: Малый щит
    16: Эти редкие щиты изготавливались сотнями с помощью Небесных Кузниц для борьбы с силами повстанцев в бесконечной череде стычек и набегов с припасами, которые испытывали (и, наконец, побеждали) силы губернатора в первом веке нашей эры. Как и все подобное снаряжение, оно легкое, прочное и способно удерживать самые мощные чары.
  '1691':
    2: Деревянный шлем
    10: Шлем
    16: Обычный шлем. Этот сделан из шкур, натянутых на дерево. Внутри нет ни меха, ни подкладки, поэтому при сильном ударе ваша голова, вероятно, зазвенит, как колокольчик.
  '1692':
    2: Стальной шлем
    10: Шлем
    16: Это обычный стальной шлем. Конструкция хороша и веками использовалась воинами по всему миру. Предполагается, что этому шлему 50-75 лет.
  '1693':
    2: Шлем Стража
    10: Шлем
    16: Этот шлем использовался эльфами Эрафии еще до наступления Безмолвия. Орнаменты на его крыльях подчеркивают превосходящую силу и добавляют чувства отличия эльфийским лидерам, которым приходилось отправляться в бой в этих шлемах.
  '1694':
    2: Шлем защитника
    10: Шлем
    16: Эти шлемы, наполовину сделанные из черепа свирепого зверя Могреда из Каригора, становятся все более редкими с каждым годом по мере того, как Могреды приближаются к исчезновению. Красные полосы вокруг рогов шлема очень восприимчивы к зачарованию.
  '1695':
    2: Ангельский шлем
    10: Шлем
    16: 'Эти шлемы чрезвычайно редки, и никто не знает, откуда они происходят, но они почти наверняка пришли из Времени Чудес. Очень красивая надпись внутри руля гласит: «Собственность корабельного склада, ВАРН МСМИВ».'
  '1696':
    2: Тканевая шапка
    10: Шляпа
    16: Обычная шляпа. Материал — смесь хлопка и шерсти, перо — утиное.
  '1697':
    2: Шляпа Денди
    10: Шляпа
    16: Эти модные и стильные шляпы пользуются популярностью среди представителей высшего класса и тех, кто стремится им подражать.
  '1698':
    2: Шапка мастера
    10: Шляпа
    16: Не смейтесь – хотя это выглядит глупо, даже смешно, многие маги тратят довольно много времени на зачаровывание таких шляп мощной магией. Коническая форма и «глаза» на передней части шляпы особенно привлекательны для существ духовного мира, и это свойство облегчает зачаровывание шляпы.
  '1699':
    2: Венок Корона
    10: Корона
    16: Это плохо сделанная корона, которую могут создать гоблины или малобюджетные актеры, чтобы высмеивать королевскую семью. Он не обеспечивает реальной защиты головы, хотя может нести небольшое зачарование.
  '1700':
    2: Королевская корона
    10: Корона
    16: В центре этой изящной серебряной заводной головки вставлен крупный несовершенный сапфир. Чрезвычайно мелкие следы от молотка позволяют предположить, что эта корона была изготовлена ​​руками гномов.
  '1701':
    2: Корона Всемогущего
    10: Корона
    16: Короны такого типа обычно создаются с использованием магии, чтобы повысить их восприимчивость к магии. Если корона была найдена без каких-либо чар, вероятно, по какой-то причине она осталась незавершенной.
  '1702':
    2: Ремень из грубой кожи
    10: Ремень
    16: Обычная полоска кожи, используемая для поддержки брюк.
  '1703':
    2: Пояс наемника
    10: Ремень
    16: Широкий кожаный ремень с большой яркой пряжкой, любимой бандитами и наемниками. И наемникам, и бандитам нравится, когда на них накладывают чары или небольшие чары в качестве помощи в бою.
  '1704':
    2: Ремень Авангарда
    10: Ремень
    16: Обработанная драконья шкура и полированная бронза скреплены вместе, образуя пояс необычайной силы и устойчивости к магии. Хотя с этими поясами трудно работать, они могут обеспечить отличную защиту от магии, если на них успешно наложены чары.
  '1705':
    2: Ремень полководца
    10: Ремень
    16: Этот пояс, сделанный из серебра и шкуры неизвестного существа, усеян вертикальными полосками из золотого сплава. Пряжка представляет собой одинарную крупную вставку из опала на платиновой основе.
  '1706':
    2: Суверенный пояс
    10: Ремень
    16: Несмотря на то, что материал этого ремня мягкий и гибкий, он состоит из чрезвычайно тонких нитей белого золота. Белое золото сплетено с помощью процесса, слишком сложного для человеческих рук, а рубин, вставленный в пряжку, был идеально огранен с помощью процесса, давно затерянного во времени.
  '1707':
    2: Кожаный плащ
    10: Плащ
    16: Использованный кожаный плащ. Слегка пахнет нафталином и пылью.
  '1708':
    2: Плащ Призрака
    10: Плащ
    16: Краситель индиго с архипелага Ренан был использован для окраски этого шерстяного плаща в цвет летнего ночного неба.
  '1709':
    2: Эльфийский плащ
    10: Плащ
    16: Эти плащи, сотканные из растительных волокон, найденных в лесах Эрафии, являются традиционной одеждой эльфийских рейнджеров.
  '1710':
    2: Плащ кардинала
    10: Плащ
    16: Плащ, который раньше носили высокопоставленные чиновники Церкви Солнца Каригора до роспуска Церкви в 1083 году нашей эры. Почти все эти плащи были тем или иным образом зачарованы.
  '1711':
    2: Плащ Судного Дня
    10: Плащ
    16: Плащ, который раньше носили высокопоставленные чиновники Церкви Луны Каригора до роспуска Церкви в 1083 году нашей эры. Почти все эти плащи были тем или иным образом зачарованы.
  '1712':
    2: Рукавицы
    10: Рукавицы
    16: Стальная перчатка простой конструкции.
  '1713':
    2: Рыцарские рукавицы
    10: Рукавицы
    16: Эта перчатка представляет собой усовершенствованную версию простых, негибких стальных перчаток, которые обычно носят гоблины и разбойники. Тыльная сторона кисти и запястье цельные, а соединения вокруг пальцев выполнены из звеньев цепи для улучшения ловкости.
  '1714':
    2: Рукавицы Паладина
    10: Рукавицы
    16: Несмотря на недостаток гибкости, эти перчатки имеют усиленные суставы на костяшках пальцев и у основания запястья.
  '1715':
    2: Кавалерийские рукавицы
    10: Рукавицы
    16: Высококачественная перчатка, обеспечивающая гибкость и защиту. Суставы усилены, но достаточно «мягки», чтобы обеспечить почти нормальное движение рук.
  '1716':
    2: Абсолютные рукавицы
    10: Рукавицы
    16: Гномьи кузнецы создали этот шедевр дизайна перчаток. За исключением дополнительного объема, разница между этой перчаткой и бархатной перчаткой невелика. Умные скользящие и вращающиеся пластины в суставах и запястьях обеспечивают нормальное движение руки, обеспечивая постоянную защиту.
  '1717':
    2: Старые кожаные сапоги
    10: Сапоги
    16: Обычные сапоги путешественника, сделанные из кожи и скрепленные гвоздями. Предыдущий владелец не очень хорошо за ними ухаживал, кожа потускнела и местами деформировалась.
  '1718':
    2: Стальные сапоги
    10: Сапоги
    16: Тяжелые стальные ботинки созданы для надежной защиты ног в бою. В них неудобно ходить, и они имеют тенденцию ржаветь внутри.
  '1719':
    2: Бронированные сапоги
    10: Сапоги
    16: Внутренняя часть этих ботинок со стальным покрытием сделана из кожи и ткани, чтобы смягчить острые края металлических пластин. Они немного тяжелые, и их утомительно носить в течение длительного времени.
  '1720':
    2: Стерлинговые сапоги
    10: Сапоги
    16: Полированные серебряные ботинки с бархатной подкладкой. Эти ботинки легче стальных ботинок и гораздо удобнее. Они тоже выглядят довольно броско.
  '1721':
    2: Абсолютные ботинки
    10: Сапоги
    16: Сапоги из драконьей шкуры, усиленные литыми роговыми полосками и металлическими заклепками. Мягкие и легкие, они обеспечивают непревзойденную защиту ног.
  '1722':
    2: Тонкое кольцо
    10: Кольцо
    16: Маленькое золотое кольцо с бриллиантом в четверть карата. Стиль простой и элегантный.
  '1723':
    2: Сверкающее кольцо
    10: Кольцо
    16: Это простое платиновое кольцо украшено двумя аметистами.
  '1724':
    2: Лунное кольцо
    10: Кольцо
    16: Золотое кольцо с большим лунным камнем в центре. Эти кольца обычно несут в себе чары.
  '1725':
    2: Кольцо Ведьмы
    10: Кольцо
    16: Кольца, подобные этому, носили члены гильдии ведьм в знак членства в период их расцвета между 550-800 годами нашей эры.
  '1726':
    2: Благословенное кольцо
    10: Кольцо
    16: Три жемчужины, установленные на золотой основе, мерцают слабым голубым светом, когда их держат на солнце, давая представление об источнике их магии.
  '1727':
    2: Ценное кольцо
    10: Кольцо
    16: Большой звездчатый сапфир в окружении двух рубинов меньшего размера украшает простое золотое кольцо.
  '1728':
    2: Драгоценное кольцо
    10: Кольцо
    16: Три драгоценных камня, симметрично равных по размеру и качеству, украшают чеканное золотое кольцо. Центральный камень — рубин, а два камня по бокам — фиолетовые топазы.
  '1729':
    2: Эфирное кольцо
    10: Кольцо
    16: Кольцо из чеканного белого золота с большим центральным бриллиантом и двумя маленькими жемчужинами, на него обычно не падает свет. Кольцо непредсказуемо блестит и тускнеет, словно его освещает невидимое солнце, сияющее в невидимом, но параллельном мире.
  '1730':
    2: Изысканное кольцо
    10: Кольцо
    16: Три опала, окаймленные странным красным металлом, заключены в идеальное кольцо из стали — очень редкого металла, который можно найти только в южной Эрафии.
  '1731':
    2: Кольцо Скарабея
    10: Кольцо
    16: Золотое кольцо, украшенное панцирем редкого жука, обитающего только в пустынях Энрота. При правильном обращении с этими панцирями у алхимика можно создать самые могущественные чары.
  '1732':
    2: Бирюзовый амулет
    10: Амулет
    16: Бирюзовый камень, закрепленный бронзовой цепочкой и застежкой, представляет собой недорогой, но очаровательный амулет.
  '1733':
    2: Готический амулет
    10: Амулет
    16: Этот причудливый амулет, вероятно, был создан каким-то алхимиком с искаженным пониманием магии. Форма и симметрия помогают сохранить все чары, которые он вложил в него.
  '1734':
    2: Амулет с когтями
    10: Амулет
    16: Окостеневшая ступня какого-то неизвестного зверя или монстра инкрустирована огромным, несовершенным фиолетовым топазом. Это некрасиво, но определенно волшебно.
  '1735':
    2: Древний амулет
    10: Амулет
    16: 'Этот амулет состоит из двух частей: передняя часть представляет собой древний, идеально вырезанный прямоугольник из прочного нержавеющей стали. Основа представляет собой гораздо более позднюю золотую цепочку и застежку. Внимательный осмотр передней части показывает, что это мемориальная доска с именем какого-то давно умершего солдата или рабочего. Символы на лицевой стороне, вероятно, обозначают статус и звание.'
  '1736':
    2: Амулет Рубиновая Звезда
    10: Амулет
    16: Идеальный рубин огранки в форме звезды, заключенный в золотую застежку, дал этому амулету свое название. Если смотреть в тусклом свете, можно увидеть огненную искру, танцующую в центре драгоценного камня.
  '1737':
    2: Сверкающая огненная палочка
    10: Жезл
    16: Стержень из синего металла и дерева, увенчанный синим надгробием. Чтобы использовать эту палочку, вы должны вооружить ее так же, как если бы вы вооружили оружие.
  '1738':
    2: Сверкающая палочка искр
    10: Жезл
    16: Стержень из синего металла и дерева, увенчанный синим надгробием. Чтобы использовать эту палочку, вы должны вооружить ее так же, как если бы вы вооружили оружие.
  '1739':
    2: Сверкающая палочка яда
    10: Жезл
    16: Стержень из синего металла и дерева, увенчанный синим надгробием. Чтобы использовать эту палочку, вы должны вооружить ее так же, как если бы вы вооружили оружие.
  '1740':
    2: Сверкающая палочка ошеломления
    10: Жезл
    16: Стержень из синего металла и дерева, увенчанный синим надгробием. Чтобы использовать эту палочку, вы должны вооружить ее так же, как если бы вы вооружили оружие.
  '1741':
    2: Сверкающая палочка вреда
    10: Жезл
    16: Стержень из синего металла и дерева, увенчанный синим надгробием. Чтобы использовать эту палочку, вы должны вооружить ее так же, как если бы вы вооружили оружие.
  '1742':
    2: Жезл Света Друида
    10: Жезл
    16: Эта волшебная палочка — скорее посох, чем палочка. Она необъяснимым образом жива, хотя много лет назад ее срезали с родительского дерева. Чтобы использовать эту палочку, вы должны вооружить ее так же, как если бы вы вооружили оружие.
  '1743':
