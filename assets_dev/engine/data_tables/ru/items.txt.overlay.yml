    10: Кусок руды
    16: Небольшой кусок металлизированной руды. Легко зачаровываемый и твердый, как обсидиан, в руках опытного мастера из сталя можно сделать невероятно мощное оружие, амулет, кольцо, доспехи или практически любой другой предмет.
