    10: Кожаный чехол
    16: Небольшой кожаный мешочек.
  '2053':
    2: Песочные часы времени
    10: Песочные часы
    16: 'Предмет задания: Прекрасные песочные часы из хрусталя, обрамленные тиковым деревом и наполненные измельченной жемчужной пылью. Очевидно, он заколдован.'
  '2054':
    2: Священная чаша
    10: Чаша
    16: 'Предмет задания: серебряная чаша, украшенная по краям и у основания узором из белого золота. Из неё доносится тихое ровное гудение.'
  '2055':
    2: Рог Рос
    10: Рог
    16: Рог дракона Рос, убитого во время Ночи падающих звезд. Этот рог позволяет его владельцу более точно чувствовать раны противника.
  '2056':
    2: Алмаз
    10: Драгоценный камень
    16: Большой энротианский алмаз, безупречный и блестящий. Как камень ювелирного качества, он не обладает магическими свойствами, поэтому его можно продать.
  '2057':
