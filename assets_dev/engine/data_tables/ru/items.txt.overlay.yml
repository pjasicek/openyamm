  '686':
    2: Железосодержащая руда
    10: Кусок руды
    16: Небольшой кусок железосодержащей руды. В руках умелого мастера из него можно было сделать оружие, амулет, кольцо, доспехи или почти любой другой полезный предмет.
  '687':
    2: Руда с серталом
    10: Кусок руды
    16: Небольшой кусок руды, пропитанной сиерталем. Прочнее и легче стали, в руках искусного мастера сиертал мог изготовить исключительное оружие, амулет, кольцо, доспехи или практически любой другой полезный предмет.
  '688':
    2: Руда, содержащая филт
    10: Кусок руды
    16: Небольшой кусок филтовой руды. Филт часто используется в стальных сплавах для повышения прочности и зачаровываемости стали. В руках искусного мастера из филта можно было сделать оружие, амулет, кольцо, доспех или практически любой другой полезный предмет.
  '689':
    2: Кергарская руда
    10: Кусок руды
    16: Небольшой кусок руды, пропитанной кергаром. Кергар имеет многие свойства стали, но его гораздо легче зачаровать. В руках умелого мастера кергар легко мог изготовить магическое оружие, амулет, кольцо, доспех или практически любой другой предмет.
  '690':
    2: Руда, пропитанная эрудином
    10: Кусок руды
    16: Небольшой кусок руды, пропитанной эрудином. Редкая магическая руда, найденная в нескольких регионах Эрафии, в руках опытного мастера-эрудина может сделать мощное оружие, амулет, кольцо, доспехи или почти любой другой предмет.
  '691':
