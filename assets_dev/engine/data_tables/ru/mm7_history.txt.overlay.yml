rows:
  "1":
    1: "Лорд Маркхэм поручил мне составить эту историю замка Хармондейл и его владельцев, чтобы будущие поколения не забыли о великих событиях, которым ещё предстоит здесь свершиться. Надеюсь, что мне удастся достойно справиться с этой задачей. По мере того как будут происходить важные события, я стану записывать их в этой книге со всей возможной точностью — будь они добрыми или дурными. Не мне судить о том, что здесь происходит — моя задача — лишь вести летопись. \n\nДа улыбнется нам Провидение!\n\nВенделл Твид\nПридворный историк"
    3: "Предисловие автора"
  "2":
    1: "Замок Хармондейл был построен в 689 году как первая линия обороны против эльфийских войск под командованием короля Лотхо IV во время Лесных войн. Как предзнаменование грядущих событий, всего через три года он пал под натиском эльфов в ходе печально известной Битвы за Хармондейл. С тех пор замок 13 раз переходил из рук в руки в ходе кровопролитных конфликтов, унесших жизни сотен людей. За исключением двух случаев, замком всегда владели либо Эратия, либо Авли, но именно эти два случая заслуживают особого внимания. \n\nВ 817 году многострадальные жители Хармондейла разорвали на куски на улицах жестокого барона Данфорта Октавио за его «энергичные» методы сбора налогов. Воспользовавшись моментом, толпа провозгласила мэра Тай Веспина королём Хармондейла и усадила его в замке. Славное правление короля Веспина Первого продлилось ровно шесть недель. Эратский король Аарон Грифонхарт IV двинулся на город с двумя опытными легионами и предал мечу короля Веспина и его самых ярых сторонников. Обеспечив себе эту «победу», король Грифонхарт затем двинулся на эльфов, которые убили его в сражении две недели спустя. В 818 году замок вновь перешёл под контроль эльфов.\n\nСовсем недавно, в 1008 году, лорд-некромант Терренс Роквин II захватил замок в рамках своих планов экспансии. Те немногие жители, которые пережили это завоевание, спаслись, укрывшись в холмах на весь год, пока он владел замком. Свидетели сообщали о признаках лихорадочных раскопок, проводившихся в замке, но когда Хармондейл был отвоёван осенью 1009 года, никаких следов раскопок или строительства обнаружить не удалось. Кстати, ни один из пленников, доставленных некромантами в замок, больше никто не видел."
    3: "Предыстория"
  "3":
    1: "%30\n\nСегодня в замок Хармондейл прибыли новые лорды. По указу лорда Маркхэма совместно правят %31, %32, %33 и %34. К сожалению, не было ни церемонии, ни приветственной встречи. Более того, в замке обосновалась небольшая банда гоблинов, которая отказывается уходить без боя. Что касается меня, то я вынужден оставаться в городской гостинице, пока их не выгонят. \n\nОтношение горожан к новым лордам я бы охарактеризовал как «осторожно враждебное». Никто не ожидает, что они продержатся дольше нескольких месяцев, почти нет надежды, что они будут лучше предыдущих лордов, и существует значительный страх, что они окажутся гораздо, гораздо хуже. Учитывая историю этого места, я не могу их винить, но очень надеюсь, что они окажутся неправы.\n\nТрадиционные правители Хармондейла — Эратия и Авли — пока что практически не заметили смену владельцев, но я уверен, что это всего лишь упущение, которое скоро будет исправлено. Поскольку Хармондейл в настоящее время находится под властью людей, я ожидаю, что вскоре к нам заглянут сборщики налогов королевы, чтобы выяснить ситуацию."
    3: "Великое состязание"
  "4":
    1: "%30\n\nВ знак благодарности за героическое спасение гномов из их старой шахты король гномов Хотфарр IX официально признал моих лордов законными правителями Хармондейла. В соседние страны были отправлены посланники, чтобы объявить об этом решении, и в ответ Эратия и Авли направили послов в замок Хармондейл для официального изложения своей позиции. \n\nЧто ещё важнее, король Хотфарр был настолько благодарен за помощь в шахте, что направил инженера и строительную бригаду для проведения давно назревших ремонтных работ в замке и городе. Я был свидетелем этих работ и должен сказать, что впечатлён! Обломки, которые лежали в замке со времени поражения лорда Роквина II более 150 лет назад, наконец-то были убраны, открыв доступ к нескольким комнатам, которые с тех пор не использовались.\n \nДаже обычно пессимистично настроенные горожане начали приободряться. Хотя большинство улучшений в городе носят косметический характер, эффект оказался потрясающим! Торговля процветает, горожане воспряли духом, и царит реальное ощущение, что худшие дни остались позади. Если провидение позволит, налоги останутся низкими, а удача — на высоте. Все жители единодушно считают, что ничего плохого не может случиться!"
    3: "Признание"
  "5":
    1: "%30\n\nК моему сожалению, старое соперничество между Эратией и Авли вновь разгорелось, и на этот раз речь идёт именно о нас. Благодаря успехам моих лордов эта территория стала ценным ресурсом, и обе державы стремятся присвоить Хармондейл. Хотя в настоящее время она находится под юрисдикцией Эратии, Авли заявила о своём праве на эту территорию по Туларейскому договору, подписанному в 673 году. Эратия, разумеется, ответила на это требование, указав на аннулирование договора со стороны Авли в 811 году согласно положениям «Деклараций и Оповещений». Позиция Авли по ЭТОМУ вопросу заключалась в отрицании аннулирования на основании доктрины «Предателей и Неверных», установленной около 375 года великим полководцем Сардовином Одноглазым. \n\nНа это утверждение тоже есть ответ, а на ответ — ответ, и так до бесконечности. Тема международных отношений заслуживает целых книг, но выходит за рамки данной истории. Достаточно сказать, что обе стороны считают, что есть достаточные основания для кровопролития, и что оно, скорее всего, произойдёт в Хармондейле и его окрестностях. Я боюсь за будущее.\n\nГорожане восприняли объявление войны спокойно, но в воздухе витает подспудное беспокойство. Я уверен, что давление на моих лордов, вынуждающее их выбрать сторону, чрезвычайно сильное. Я не знаю, как бы поступил сам, и меня утешает то, что принимать это решение не мне. Действуйте осторожно, господа."
    3: "Война!"
  "6":
    1: "%30\n\nХорошие новости! После нескольких незначительных стычек, а также множества шпионских операций и маневров обе стороны этой нелепой войны решили объявить перемирие до тех пор, пока не будет найден подходящий арбитр. Мои лорды были уполномочены выбрать этого арбитра. Будущее отношений между Эратией и Авли теперь полностью лежит на (пока что) способных плечах моих лордов. Я уверен, что их решение будет мудрым.\n\nЧто касается других событий, то прибыли послы из Дейи, страны некромантов, и Бракады, страны волшебников. Они прибыли, чтобы объявить о признании их странами моих лордов законными правителями Хармондейла и, без сомнения, чтобы заручиться дипломатическими льготами. Политика такова, что обе стороны ненавидят друг друга. Я не удивлюсь, если один из послов попытается убить другого посреди ночи. \n\nВсе затаили дыхание. Похоже, ничего не может произойти, пока не будет принято это решение."
    3: "Перемирие"
  "7":
    1: "Мои лорды избрали сэра Брандиса Фэйрвезера в качестве арбитра по Договору Хармондейла. Его репутация беспристрастного посредника не имеет себе равных. %30 сэр Фэйрвезер возглавил напряжённые переговоры по разделу спорных земель Хармондейла и прилегающих территорий. Хотя мир находился под угрозой из-за разногласий, благодаря оперативным дипломатическим усилиям сэра Фэйрвезера удалось достичь успеха, и между Эратией и Авли был подписан официальный мирный договор. Эратии был передан контроль над Хармондейлом, а более отдалённые земли остались за Авли.\n\nВ то время как посол Райт из Бракады, казалось, был доволен выбором арбитра, посол Скейл пришёл в ярость. Он выступил (от имени своего правительства) с предупреждением всем путешественникам, включая моих лордов, покидающим Хармондейл, о том, что их «безопасность не может быть гарантирована». Думаю, его смысл ясен. Однако он выразил надежду, что, возможно, когда-нибудь интересы нации Дейя совпадут с интересами Хармондейла. (Примечание автора: я не думаю, что интересы Дейи и Хармондейла когда-либо «совпадут», пока они не завоюют нас...)"
    3: "Мир: победа людей"
  "8":
    1: "Мои лорды избрали сэра Брандиса Фэйрвезера в качестве арбитра по Договору Хармондейла. Его репутация беспристрастного посредника не имеет себе равных. %30 сэр Фэйрвезер возглавил напряжённые переговоры по разделу спорных земель Хармондейла и прилегающих территорий. Хотя мир находился под угрозой из-за разногласий, благодаря оперативным дипломатическим усилиям сэра Фэйрвезера удалось достичь успеха, и между Эратией и Авли был подписан официальный мирный договор. Авли было передано управление Хармондейлом, а более отдалённые районы остались за Эратией.\n\nВ то время как посол Райт из Бракады, казалось, был доволен выбором арбитра, посол Скейл пришёл в ярость. Он выступил (от имени своего правительства) с предупреждением всем путешественникам, включая моих лордов, покидающим Хармондейл, о том, что их «безопасность не может быть гарантирована». Думаю, его смысл ясен. Однако он не отозвал свои слова, выразив надежду, что, возможно, когда-нибудь интересы нации Дейя совпадут с интересами Хармондейла. (Примечание автора: я не думаю, что интересы Дейи и Хармондейла когда-либо «совпадут», пока они не завоюют нас...)"
    3: "Мир: победа эльфов"
  "9":
    1: "Мои лорды избрали сэра Брандиса Фэйрвезера в качестве арбитра по Договору Хармондейла. Его репутация беспристрастного посредника не имеет себе равных. %30 сэр Фэйрвезер возглавил напряжённые переговоры по разделу спорных земель Хармондейла и прилегающих территорий. Хотя мир оказался под угрозой из-за разногласий, благодаря оперативным дипломатическим усилиям сэра Фэйрвезера удалось достичь успеха, и между Эратией и Авли был подписан официальный мирный договор. \n\nВ результате этого исторического события договор предусматривал создание Королевства Хармондейл, назначая моих лордов правителями и возлагая на них всю ответственность за управление королевством. Поскольку вторжение не грозит в ближайшее время, как это было в случае с злополучным королём Веспином, есть большие надежды на то, что Королевство Хармондейл просуществует очень долго.\n\nВ то время как посол Райт из Бракады, казалось, был доволен выбором арбитра, посол Скейл пришёл в ярость. Он выступил (от имени своего правительства) с предупреждением всем путешественникам из Хармондейла, включая моих лордов, о том, что их «безопасность не может быть гарантирована». Думаю, его смысл ясен. Тем не менее он выразил надежду, что, возможно, когда-нибудь интересы нации Дейя совпадут с интересами Хармондейла. (Примечание автора: Я не думаю, что интересы Дейи и Хармондейла когда-либо «совпадут», пока они не завоюют нас...)"
    3: "Мир: ваша победа"
  "10":
    1: "Мои лорды оказались вовлеченными в некую интригу при дворе великого визиря Гэвина Магнуса. Недавно они прошли испытание для волшебников, требующее мастерства и сдержанности, и приступили к реализации плана по нанесению удара по нашим врагам с помощью своих новых союзников. Надеюсь, это мудрое решение. Я не сомневаюсь, что наши враги непременно отреагируют на любую агрессию со стороны Хармондейла, включая шпионаж любого рода. Наши союзники сильны, но достаточно ли они сильны, чтобы защитить нас от нападения со стороны Дейи, и можно ли рассчитывать на их помощь, когда это нападение начнётся?\n\nХодят слухи, и, похоже, секрет новой смелости Великого визиря кроется в четырёх новых советниках, которых он нанял. Они всегда рядом с ним, строя планы и интриги на благо Бракады. По крайней мере, так говорят мои источники. Кто знает, откуда на самом деле эти люди и какова их истинная цель?"
    3: "Испытания"
  "11":
    1: "Ещё один удар по силам тьмы! Сосуды с душами некромантов были похищены! %30 мои лорды передали волшебникам Бракады весь запас сосудов с душами некромантов. Хотя этот набег не принесет некромантам немедленных потерь, они не смогут совершить «Ритуал вечности» для тех некромантов, которым необходимо стать личами. Некоторые могут умереть от старости, а другие будут впадать во всё большее отчаяние и, возможно, предпримут опрометчивые действия. В любом случае, для них это не сулит ничего хорошего. Сейчас, как никогда раньше, я ожидаю ответных мер со стороны Дейи. \n\nСвидетельством ущерба, нанесённого этим набегом, служит растущее число слухов, доносящихся из Бесплодных земель. Ходят разговоры о расколе между «военным» крылом некромантов и «научным». В землях над Ямой происходили магические дуэли и даже ожесточённые сражения между толпами восставших и нечестивых монстров, созданных некромантами. Если повезёт, эти конфликты перерастут в полномасштабную гражданскую войну между нашими врагами. Или, возможно, злобный Арчибальд падёт в одной из этих дуэлей. Неизвестно, какие радостные возможности станут реальностью, как только наши враги начнут ссориться между собой."
    3: "Набег на Яму"
  "12":
    1: "Высший храм (или, вернее, низший?) Тьмы, сердце наших врагов, был разграблен! %30 мои лорды, по велению своих союзников при дворе Гэвина Магнуса, доставили алтарный камень храма ко двору и преподнесли его Рессуректре, главному советнику самого Гэвина Магнуса. Там она соединила его с «сестринским камнем» из Высшего храма Света и создала… камень побольше? Что ж, далек я от того, чтобы понимать странные пути магии, но главное, что наши враги были унижены, а их зачарованный алтарный камень захвачен. Надеюсь, это положит конец любым их планам по использованию этого камня.\n\nЧто ж, от Дейи до сих пор не поступило никакой реакции на кражу камня, но я сомневаюсь, что они просто смирятся с этим. Нет, они уже сейчас вынашивают какой-то мстительный план, или же мой исторический опыт меня полностью подводит. Вопрос не в том, нанесут ли они удар, а в том, когда. И где? Здесь? В городе? Или, возможно, в самой Бракаде. Возможно, моим лордам стоит нанять придворного астролога или нескольких шпионов для консультаций."
    3: "Храм тьмы"
  "13":
    1: "%30\n\nА теперь — более необычная история, связанная с этим союзом между моими лордами и волшебниками Бракады. Судя по всему, каждый из специальных советников Гэвина Магнуса руководил недавними миссиями в качестве испытания. Они готовят какой-то план, но пока не раскрывают, в чём он заключается. Должен признать: хотя я и презираю подобные манипуляции, не могу не испытывать к этим людям определённого восхищения и доверия.\n\nПоследнее испытание заключалось в поиске и уничтожении могущественного лорда-вампира, скрывавшегося где-то в Эратии. Тщательный анализ и здравый рассудок позволили сузить круг возможных укрытий вампира, которым, как оказалось, был винный погреб под совершенно обычным домом. %30 лорд-вампир был убит, а его приспешники вскоре последовали за ним в вечную смерть. \n\nЧто касается наших врагов в Дейе, то произошло важное событие. Арчибальд Айронфист, бывший король Энрота и ныне бывший лидер Гильдии некромантов, покинул свою резиденцию в Яме, унеся с собой некромантов, ориентированных на «науку». Никто не знает, куда они ушли, но это лучшая новость со времени подписания мирного договора между Эратией и Авли. Никогда ещё наши враги не были столь слабы и столь лишены руководства. Советники Арчибальда, возможно, останутся, чтобы руководить военным крылом, но, лишившись половины своих сил, даже решительная и хорошо организованная армия вполне может завоевать Дейю и отправить Чёрную гильдию на свалку истории!"
    3: "Вампиры"
  "14":
    1: "Мои лорды избрали лорда Девона Слина в качестве арбитра по договору Хармондейла. Хотя он и славится как искусный дипломат, его политика невмешательства нередко приводила к ненужным конфликтам между сторонами, обращавшимися к нему за помощью. Переговоры между королевой Эратии Кэтрин и королём Авли Элдричем Парсоном, состоявшиеся %30, — яркий тому пример. Не сумев договориться о надлежащем разделе земель, переговоры быстро завершились, и война возобновилась. После множества, множества смертей война официально закончилась, и Эратия прочно укрепила свой контроль над Хармондейлом. Эльфы были не слишком довольны таким исходом, но пока ничего с этим поделать не могут. Без сомнения, этот инцидент станет причиной новой войны в будущем.\n\nВ то время как посол Скейл из Дейи казался довольным выбором арбитра, посол Райт был в ярости. Он выступил (от имени своего правительства) с предупреждением моим лордам никогда не ступать на землю Бракады под страхом смертной казни. Однако он выразил готовность продолжить «диалог» между нашими странами. Очевидно, он надеется в будущем добиться от нас каких-то уступок."
    3: "Мир: победа людей"
  "15":
    1: "Мои лорды избрали лорда Девона Слина в качестве арбитра по договору Хармондейла. Хотя он и славится как искусный дипломат, его политика невмешательства нередко приводила к ненужным конфликтам между сторонами, обращавшимися к нему за помощью. Переговоры между королевой Эратии Кэтрин и королём Авли Элдричем Парсоном, состоявшиеся %30, — яркий тому пример. Не сумев договориться о надлежащем разделе земель, переговоры быстро завершились, и война возобновилась. После множества, множества смертей война официально закончилась, и Авли прочно установила контроль над Хармондейлом. Люди были не слишком довольны таким исходом, но пока ничего с этим поделать не могут. Без сомнения, этот инцидент станет причиной новой войны в будущем.\n\nВ то время как посол Скейл из Дейи казался довольным выбором арбитра, посол Райт был в ярости. Он выступил (от имени своего правительства) с предупреждением моим лордам никогда не ступать на землю Бракады под страхом смертной казни. Однако он не покинул замок, что свидетельствует о готовности продолжить «диалог» между нашими странами. Очевидно, он надеется в будущем добиться от нас каких-то уступок."
    3: "Мир: победа эльфов"
  "16":
    1: "Мои лорды избрали лорда Девона Слина в качестве арбитра по договору Хармондейла. Хотя он и славится как искусный дипломат, его политика невмешательства нередко приводила к ненужным конфликтам между сторонами, обращавшимися к нему за помощью. Переговоры между королевой Эратии Кэтрин и королём Авли Элдричем Парсоном, состоявшиеся %30, — яркий тому пример. Не сумев договориться о надлежащем разделе земель, переговоры быстро завершились, и война возобновилась. После множества, множества смертей война официально закончилась вничью.\n\nВ результате исторического события мирное соглашение предусматривало создание Королевства Хармондейл, назначая моих лордов правителями и возлагая на них всю ответственность за управление королевством. Поскольку вторжение не грозит в ближайшее время, как это было в случае с злополучным королём Веспином, есть большие надежды, что Королевство Хармондейл просуществует очень долго.\n\nВ то время как посол Скейл из Дейи казался довольным выбором арбитра, посол Райт был в ярости. Он выступил (от имени своего правительства) с предупреждением моим лордам никогда не ступать на землю Бракады под страхом смертной казни. Тем не менее, он выразил готовность продолжить «диалог» между нашими странами. Очевидно, он надеется в будущем добиться от нас каких-то уступок."
    3: "Мир: ваша победа"
  "17":
    1: "Мои лорды оказались втянуты в некую интригу при дворе Арчибальда Айронфиста. Недавно они прошли испытание, потребовавшее от них ловкости и силы, и приступили к осуществлению плана по нанесению удара по нашим врагам с помощью своих новых союзников. Надеюсь, это мудрое решение. Я не сомневаюсь, что наши враги непременно отреагируют на любую агрессию со стороны Хармондейла, включая шпионаж любого рода. Наши союзники сильны, но достаточно ли они сильны, чтобы защитить нас от нападения со стороны Бракады, и можно ли на них положиться, когда это нападение наступит?\n\nХодят слухи, и, похоже, секрет новой смелости лорда Айронфиста кроется в четырёх новых советниках, которых он нанял. Они всегда рядом с ним, строя планы и интриги на благо Дейи. По крайней мере, так говорят мои источники. Кто знает, откуда на самом деле эти люди и какова их истинная цель?"
    3: "Испытания"
  "18":
    1: "Действуя по поручению наших новых союзников из Дейи, мои лорды доставили Касторе, главному советнику лорда Айронфиста, набор ценных сосудов для душ, необходимых некромантам для совершения «Ритуала вечности». Чернокнижники Найгона — способные алхимики, но некомпетентные защитники. Судя по всему, захватить сосуды для душ оказалось настолько нелепо просто, что я сомневаюсь, что наши новые враги в Найгоне смогут организовать серьёзный ответный удар.\n\nЛегкая доступность сосудов для душ значительно укрепит позиции наших союзников. В целом это хорошо, но я не могу не заметить нотку разлада при дворе Арчибальда. Сообщения, поступающие из Дейи, гласят, что приказы, отдаваемые Арчибальдом и его «советниками», часто противоречат друг другу, и Арчибальд не всегда берет верх, когда нужно принимать решения. Создаётся впечатление, будто в Дейе существуют две фракции, борющиеся за власть, а Арчибальд представляет лишь одну из них. Надеюсь, это не так. Связь с сильным союзником защищает нас от атак, но когда этот сильный союзник начинает выглядеть слабым, будьте начеку!"
    3: "Чернокнижники и минотавры"
  "19":
    1: "Действуя по поручению наших новых союзников из Дейи, мои лорды доставили Касторе, главному советнику лорда Айронфиста, набор ценных сосудов для душ, необходимых некромантам для совершения «Ритуала вечности». Чернокнижники Найгона — искусные алхимики, но слабые защитники. Тем не менее вступать с ними в бой было бы опасно, поэтому я с облегчением могу сообщить, что мои лорды смогли договориться с чернокнижниками и получить сосуды для душ без сражения.\n\nНаличие сосудов для душ значительно укрепит позиции наших союзников. В целом это хорошо, но я не могу не заметить нотку разлада при дворе Арчибальда. Сообщения, поступающие из Дейи, свидетельствуют о том, что приказы Арчибальда и его «советников» часто противоречат друг другу, и Арчибальд не всегда берет верх, когда нужно принимать решения. Создаётся впечатление, будто за контроль над Дейей борются две фракции, а Арчибальд представляет лишь одну из них. Надеюсь, это не так. Связь с сильным союзником защищает нас от нападений, но когда этот сильный союзник начинает выглядеть слабым, будьте начеку!"
    3: "Чернокнижники и минотавры"
  "20":
    1: "Высший храм Света, сердце наших врагов, разграблен! %30 милорды, по приказу своих союзников при дворе Арчибальда Айронфиста принесли алтарный камень храма ко двору и преподнесли его Касторе, главному советнику самого лорда Айронфиста. Там он соединил его с «сестринским камнем» из Высшего храма Тьмы и получил… камень побольше? Что ж, далек я от того, чтобы понимать странные пути магии, но главное — наши враги были унижены, а их зачарованный алтарный камень захвачен. Надеюсь, это положит конец любым их планам по использованию этого камня.\n\nПока что от Бракады не поступило никакой реакции на кражу камня, но я сомневаюсь, что они просто смирятся с этим. Нет, они уже сейчас вынашивают какой-то мстительный план, или же мой исторический опыт меня полностью подводит. Вопрос не в том, нанесут ли они удар, а в том, когда. И где? Здесь? В городе? Или, может быть, в самой Дейе. Возможно, моим лордам стоит нанять придворного астролога или нескольких шпионов для консультации."
    3: "Храм Света"
  "21":
    1: "%30\n\nЛорд Айронфист отдал приказ о нападении на лабораторию алхимика Клайва Кланкера, которое мои лорды осуществили с мастерством и точностью. Даже сейчас его некроманты обыскивают лабораторию в поисках ловушек и сокровищ, оставленных алхимиками. \n\nЕщё большее напряжение в придворных отношениях вызывает успешный набег волшебников Бракады на сокровищницу сосудов для душ в Яме. Эта катастрофа несомненно вызовет конфликты в и без того напряжённом дворе Дейи. Без сосудов для душ некроманты не смогут завершить ритуал, необходимый для превращения в личей.\n\nМне кажется, что наши союзники вот-вот вступят в схватку. Уже сейчас на поверхности над Ямой между представителями двух фракций ведутся магические дуэли. Надеюсь, мои лорды смогут определить, кто окажется на стороне победителей, и присоединиться к ним, пока пыль не осела. Ведь выбор не той стороны непременно повлечёт за собой последствия."
    3: "Лаборатория Кланкера"
  "22":
    1: "%30\n\nВ Дейе царит разлад, и среди некромантов произошёл раскол. Арчибальд Айронфист появился в старой лаборатории Клайва Кланкера. До недавнего времени лаборатория мирно процветала, продавая зачарованное оружие и снаряжение всем, у кого хватало денег — в том числе и пиратской «империи» Регна. Наняв пиратов в качестве наёмников во время Войны за престол в Энроте, Арчибальд знал об их богатых поставщиках алхимических материалов. Само существование этого богатства послужило отличной дымовой завесой, скрывающей истинные причины нападения Арчибальда.\n\nНедавние трения между Арчибальдом и его новыми советниками хорошо задокументированы. Фракционность и раздор привели к невыносимой ситуации в Дейе, настолько плохой, что одной из сторон пришлось уйти. Некроманты «научного» направления Арчибальда атаковали лабораторию Кланкера не ради алхимических сокровищ, а ради жилого пространства. Мы променяли одного сильного врага на двух более слабых. Надеюсь, эта замена пойдет на пользу. Возможно, Арчибальд будет склонен к мирным переговорам?"
    3: "Покушение"
  "23":
    1: "%30\n\nАрчибальд Айронфист, бывший лидер наших союзников в Дейе, переехал в бывшую лабораторию Клайва Кланкера. До недавнего времени лаборатория благополучно процветала, продавая зачарованное оружие и снаряжение всем, у кого хватало денег — в том числе и пиратской «империи» Регна. Наняв пиратов в качестве наёмников во время Войны за престол в Энроте, Арчибальд знал об их богатых поставщиках алхимических материалов. Само существование этого богатства послужило отличной дымовой завесой, скрывающей истинные причины манипуляций Арчибальда над моими лордами ради достижения своих целей.\n\nНедавняя напряжённость между Арчибальдом и его новыми советниками хорошо задокументирована. Фракционность и раздор создали в Дейе невыносимую ситуацию, настолько плохую, что одной из сторон пришлось уйти. Некроманты «научной» фракции Арчибальда напали на лабораторию Кланкера не ради алхимических сокровищ, а ради жилого пространства. Возможно, это к лучшему. Очевидно, что фракция Касторе — сильнее из двух, и он явно намеревается продолжить переговоры с моими лордами. В воздухе витает что-то важное, что-то, что непременно проявится в ближайшее время."
    3: "Покушение"
  "24":
    1: "%30\n\nДобрый король Роланд Айронфист, брат Арчибальда Айронфиста, был спасён из лап Дьяволов спустя много долгих лет! Даже представить себе, через что ему пришлось пройти, находясь в плену у этих чудовищ в течение столь долгого времени, просто невозможно. Все уже потеряли надежду на то, что он остался жив. Его обнаружили почти случайно.\n\nМои лорды были отправлены уничтожить гнездо дьяволов во имя человечества. Арчибальд Айронфист, свергнутый правитель Дейи и один из самых ненавистных людей в истории, предложил помощь по своим собственным причинам. Во время миссии мои лорды обнаружили короля Роланда в железной клетке в глубине гнезда и освободили его. Кроме того, Арчибальд вызвался лично вернуть Роланда королеве Кэтрин.\n\nАрчибальд и его брат вновь воссоединились. Хотя их соперничество было ожесточённым, они никогда не пытались убить друг друга. Однако у жены Роланда, королевы Эратии Кэтрин, действительно есть опыт убийства неприятных родственников. Она поклялась казнить Арчибальда, если ей когда-нибудь посчастливится его поймать. Интересно, что она сделает теперь?"
    3: "Спасение Роланда"
  "25":
    1: "%30\n\nПохоже, королева Кэтрин приняла решение. Вместо того чтобы казнить Арчибальда, она постановила, что лаборатория Кланкера станет его постоянным местом жительства. Ему запрещено покидать остров под страхом смертной казни. Арчибальд, судя по всему, согласился с этими условиями и навсегда отказался от своих амбиций… но «навсегда» — это так долго. Сомневаюсь, что мы видели его в последний раз.\n\nНаши отношения с Эратией значительно улучшились. Королева Кэтрин говорит, что бесконечно благодарна за возвращение Роланда и уничтожение Дьяволов. В атмосфере всеобщей доброжелательности война кажется лишь далёким кошмаром. Со своей стороны, Роланд также выразил глубокую благодарность и сказал, что вернётся в Энрот, как только физически оправится после долгого плена.\n\nТем не менее в воздухе витает напряжение. Все эти, казалось бы, не связанные между собой задания для таинственных советников, сбор необычных артефактов и покушения наверняка к чему-то ведут. У меня предчувствие, что скоро всё прояснится."
    3: "Изгнание Арчибальда"
  "26":
    1: "%30\n\nНаши специальные советники при дворе Бракады оказались действительно весьма необычными. Они утверждают, что пришли из другого мира и пересекли космическое пространство в поисках следов Древних и их слуг. Говорят, что прибыли сюда, потому что их магические устройства обнаружили руины цивилизации Древних, а также оборудование, позволяющее открыть врата к звёздам и перемещаться среди них так же легко, как мы с вами пересекаем комнату. Они говорят, что намеревались вернуть нашему миру утраченную славу цивилизации Древних.\n\nНо когда они прибыли, четверо членов их команды отказались от своей давней мечты об обнаружении Древних. Вместо этого они решили завоевать наш мир с помощью нашего собственного разрушенного оборудования Древних. И они выбрали Арчибальда Айронфиста и его некромантов в качестве своего инструмента и марионеток. \n\nГоворят, им нужна всего одна деталь, чтобы восстановить путь к звёздам, и эта деталь находится на корабле, на котором они прибыли в наш мир. Их враги, «советники» Арчибальда, также нуждаются в этой детали, чтобы завершить свой собственный проект — восстановление Небесной Кузницы. Если враг получит эту деталь, он использует кузницу для тиражирования своего мощного оружия и завоевания нашего мира. Если Рессуректра и её команда получат деталь, они используют её, чтобы открыть врата к звёздам и принести благословения магии Древних всем жителям нашего мира.\n\nТеперь моим лордам предстоит извлечь эту деталь из их корабля и вернуть её одной из двух фракций пришельцев. Я полагаю, что Рессуректра преследует благие намерения, но в прошлом я уже ошибался в своих суждениях."
    3: "Гости"
  "27":
    1: "%30\n\nНаши специальные советники при дворе Дейи оказались действительно весьма необычными. Они утверждают, что пришли из другого мира и пересекли космическое пространство в поисках следов Древних и их слуг. Говорят, что прибыли сюда, потому что их магические устройства обнаружили руины цивилизации Древних, а также оборудование, позволяющее открыть врата к звёздам и перемещаться среди них так же легко, как мы с вами пересекаем комнату. Они говорят, что намеревались вернуть нашему миру утраченную славу цивилизации Древних.\n\nНо когда они прибыли, Касторе и его фракция уже устали от своих поисков и отказались от своей давней мечты об обнаружении Древних. Вместо этого они предпочли взять на себя управление нашим миром и привести его к величию, воспользовавшись своей превосходной мудростью и наукой. Остальные, одержимые своей первоначальной миссией, отказались прислушаться к голосу разума и продолжили свои бессмысленные поиски.\n\nИх враги утверждают, что им нужна всего одна деталь, чтобы восстановить путь к звёздам, и эта деталь находится на корабле, на котором они прибыли в наш мир. Фракции Касторе эта деталь также необходима для завершения собственного проекта — восстановления Небесной Кузницы. Если фракция Касторе получит эту деталь, она использует кузницу для тиражирования своего мощного оружия и захватит власть над нашим миром. Если Рессуректра и её команда получат деталь, они используют её, чтобы открыть врата к звёздам с неизвестными последствиями, возможно, прорвав дыру в пустоту или предоставив монстрам с других звёзд, таким как Дьяволы, путь для вторжения в наш мир.\n\nТеперь моим лордам предстоит извлечь эту деталь из их корабля и вернуть её одной из двух фракций пришельцев. Я полагаю, что Касторе преследует благие намерения, но в прошлом я уже ошибался в своих суждениях."
    3: "Гости"
  "28":
    1: "Жители Хармондейла начали воспринимать правосудие моих лордов как… несколько суровое. На данный момент %30 из 100 граждан были без суда и следствия казнены на улицах за преступления против моих лордов. Хотел бы отметить, что, хотя жители называют моих лордов «Ужасными» (например, %31 Ужасный), их суровое правосудие значительно снизило уровень преступности на улицах города. Многие преступники предпочитают оставаться дома, а не выходить на улицы, опасаясь, что мои лорды узнают их и учинят скорую расправу на их трусливые головы. Я уверен, что история оправдает мудрую политику моих лордов."
