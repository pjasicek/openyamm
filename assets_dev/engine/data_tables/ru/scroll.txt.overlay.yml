    2: "Искрящееся зелье"
    3: "Рецепт зелья «Искрящееся зелье»"
  "720":
    1: "«Зелье стремительности»: Наделяет немагическое оружие свойством «Стремительность» на 30 минут за каждое очко силы зелья. Для приготовления этого зелья необходимо использовать правильную комбинацию: один реагент любого красного типа, три реагента любого синего типа и один реагент желтого типа."
    2: "Зелье стремительности"
    3: "Рецепт зелья «Зелье стремительности»"
  "721":
    1: "«Исцеление паралича»: Излечивает паралич. Чтобы приготовить это зелье, необходимо использовать правильную комбинацию: один реагент любого типа из красных, один реагент любого типа из синих и три реагента из жёлтых."
    2: "Исцеление паралича"
    3: "Рецепт зелья «Исцеление паралича»"
  "722":
    1: "«Божественное восстановление»: Снимает все неблагоприятные состояния, кроме смерти, окаменения и уничтожения. Для приготовления этого зелья необходимо использовать правильную комбинацию из двух красных реагентов любого типа, двух синих реагентов любого типа и двух жёлтых реагентов."
    2: "Божественное восстановление"
    3: "Рецепт зелья «Божественное восстановление»"
  "723":
    1: "«Божественное исцеление»: Восстанавливает количество очков здоровья, равное пятикратной силе зелья. Для приготовления этого зелья необходимо правильно скомбинировать три красных реагента любого типа и три жёлтых реагента любого типа."
    2: "Божественное исцеление"
    3: "Рецепт зелья «Божественное исцеление»"
  "724":
    1: "«Божественная сила»: Восстанавливает количество очков маны, равное пятикратной силе зелья. Для приготовления этого зелья необходимо правильно скомбинировать три синих реагента любого типа и три жёлтых реагента любого типа."
    2: "Божественная сила"
    3: "Рецепт зелья «Божественная сила»"
  "725":
    1: "«Повышение удачи»: Временно повышает удачу на величину, равную утроенной силе зелья, на 30 минут за каждое очко силы зелья. Чтобы приготовить это зелье, вам понадобится правильное сочетание трёх красных реагентов любого типа и трёх синих реагентов любого типа."
    2: "Повышение удачи"
    3: "Рецепт зелья «Повышение удачи»"
  "726":
    1: "«Сопротивление огню»: Временно повышает сопротивление огню на величину, равную утроенной силе зелья, на 30 минут за каждое очко силы зелья.  Чтобы приготовить это зелье, вам понадобится правильное сочетание двух красных реагентов любого типа, одного синего реагента любого типа и трёх жёлтых реагентов."
    2: "Сопротивление огню"
    3: "Рецепт зелья «Сопротивление огню»"
  "727":
    1: "«Сопротивление воздуху»: Временно повышает сопротивление воздуху на величину, равную утроенной силе зелья, на 30 минут за каждое очко силы зелья.  Чтобы приготовить это зелье, вам понадобится правильная комбинация из трёх красных реагентов любого типа, двух синих реагентов любого типа и одного жёлтого реагента."
    2: "Сопротивление воздуху"
    3: "Рецепт зелья «Сопротивление воздуху»"
  "728":
    1: "«Сопротивление воде»: Временно повышает сопротивление воде на величину, равную утроенной силе зелья, на 30 минут за каждое очко силы зелья.  Чтобы приготовить это зелье, вам понадобится правильная комбинация: один реагент любого типа из красных, три реагента любого типа из синих и два реагента из жёлтых."
    2: "Сопротивление воде"
    3: "Рецепт зелья «Сопротивление воде»"
  "729":
    1: "«Сопротивление земле»: Временно повышает сопротивление земле на величину, равную утроенной силе зелья, на 30 минут за каждое очко силы зелья.  Чтобы приготовить это зелье, вам понадобится правильная комбинация из трёх красных реагентов любого типа, одного синего реагента любого типа и двух жёлтых реагентов."
    2: "Сопротивление земле"
    3: "Рецепт зелья «Сопротивление земле»"
  "730":
    1: "«Сопротивление разуму»: Временно повышает сопротивление разуму на величину, равную утроенной силе зелья, на 30 минут за каждое очко силы зелья.  Чтобы приготовить это зелье, вам понадобится правильная комбинация из двух красных реагентов любого типа, трёх синих реагентов любого типа и одного жёлтого реагента."
    2: "Сопротивление разуму"
    3: "Рецепт зелья «Сопротивление разуму»"
  "731":
    1: "«Сопротивление телу»: Временно повышает сопротивление телу на величину, равную утроенной силе зелья, на 30 минут за каждое очко силы зелья.  Для приготовления этого зелья вам понадобится правильная комбинация: один реагент любого типа из красных, два реагента любого типа из синих и три реагента из жёлтых."
    2: "Сопротивление телу"
    3: "Рецепт зелья «Сопротивление телу»"
  "732":
    1: "Я, Дадеросс, удостоверяю, что лица, имеющие при себе это письмо с моей печатью, действительно несут с собой Топор Балтазара. Относитесь к этим доблестным воинам как к своим родным и окажите им все возможные почести.  Дадеросс, подмастерье-торговец из Альвара, мастер-топорочник Странствующего стада «Разрушители»"
    3: "Сертификат подлинности"
  "733":
    1: "Братья мои! Я решил разыскать саркофаг Корбу в надежде, что сам Корбу даст мне ответы, которые я ищу. Путь будет долгим и опасным: жители Равеншора и охотники на драконов из ущелья Гарроты не встретят нашего сородича с распростёртыми объятиями. По дороге в Блуждающий Разор я буду искать любое доступное укрытие. Эти записи останутся свидетельством моего путешествия. Если обо мне больше не услышат, быть может, вы найдёте Корбу. Сиатлен Венитиус"
    3: "Обрывок дневника"
  "734":
    1: "Братья мои! Как я и опасался, Равеншор оказался негостеприимным местом для нашего рода. Толпа с факелами выгнала меня из города. Всё было как в страшных историях, которыми нас пугают, когда мы впервые познаём голод, чтобы отвадить от людных мест. Здешние лютые волки не обращали на меня внимания — возможно, почуяли родственную душу. Завтра я попытаюсь добраться до ущелья Гарроты. Надеюсь найти там укрытие. Сиатлен Венитиус"
    3: "Обрывок дневника"
  "735":
    1: "Братья мои! Ущелье Гарроты превратилось в поле боя. Рыцари-драконоборцы Чарльза Кихота и стаи Дефтклоу Редривера сражаются каждый день, и конца этой войне не видно. Битва кажется бессмысленной. По крайней мере, мы достигли шаткого соглашения с некромантами Шэдоуспайра, на которых охотимся. Возможно, Корбу и впрямь был безумен: по крайней мере, нам не приходится сражаться ради пищи. Но справедливо ли, что другая раса отдаёт жизни ради нашего существования? Я не знаю. Завтра я отправлюсь в Блуждающий Разор. Никто из нашего рода не бывал там с тех пор, как нас покинул Корбу. Что я найду? Ответы? Самого Корбу? Сиатлен Венитиус"
    3: "Обрывок дневника"
  "736":
    1: "Братья мои! Здесь, в склепе Корбу, я нашёл лишь трагедию. Корбу погиб. Возможно, у него больше не было воли отнимать чужие жизни ради собственной. Склеп заполонили наги-стражи, и добраться до Корбу было нелегко. Вместо ответов я обрёл лишь новые вопросы. Почему Корбу предпочёл смерть чужой жизни? Величайший из нашего рода стал горсткой костей и праха. Я отнесу останки старейшинам — быть может, они найдут ответы, которых не нашёл я. Сиатлен Венитиус"
    3: "Обрывок дневника"
  "737":
    1: "Братья мои! Сегодня я насытился кровью молодой рыцарши. Впервые с тех пор, как я познал голод, осушая её жизнь, я почувствовал нечто неприятное, чему не могу подобрать названия. Мысли мои вновь и вновь возвращаются к причинам, по которым Корбу так давно покинул нас. Мы живём вечно, но ценой чужих жизней. Сегодня с севера налетела страшная буря. Я видел, как деревья взлетали над северным хребтом Драконьих Зубов. Такой бури я ещё не встречал. Я продолжу путь через Равеншор, а затем отправлюсь домой. Сиатлен Венитиус"
    3: "Обрывок дневника"
  "738":
    1: "Братья! Сегодня я приблизился к окраинам Равеншора. Из центра города исходило странное сияние, а воздух был полон тёмной магии. Помня о прошлом приёме, я решил идти на север через Альвар, затем на восток — в пустыню Железных Песков, а оттуда домой, в Шэдоуспайр. Этой ночью, утоляя голод, я вновь ощутил тот же ужас, что и после смерти молодой рыцарши. Я всё ещё вижу страх в её глазах. Быть может, Корбу был прав? Разве справедливо отнимать жизни, чтобы жить самим? Сиатлен Венитиус"
    3: "Обрывок дневника"
  "739":
    1: "Сегодня я обгорел. В Альваре мало укрытий, и солнце опалило моё лицо и руки. Если бы я догадался попросить у старейшин амулет Ночной Тени! С ним путь был бы куда быстрее. С Равеншора я ещё не питался: не хочу вновь испытать чувство, впервые настигшее меня в ущелье Гарроты. Быть может, в пустыне Железных Песков я насыщусь троллем. Здешние циклопы не враждебны нашему роду после того, как мы помогли им напасть на альварский караван. Я отдохну в их кладовой и вернусь домой. Сиатлен"
    3: "Обрывок дневника"
  "740":
    1: "С меня довольно. Корбу был прав: мы не вправе отнимать чужие жизни ради собственного существования. Чувство, которое меня преследует, должно быть, называется раскаянием. Вероятно, его же ощущал Корбу. Я больше не стану питаться. Я лягу здесь, как когда-то Корбу, и умру в кладовой циклопов. Надеюсь, Корбу забудут, а его останки навсегда останутся здесь. Я спрячу их: уверен, он не хотел бы вернуться к жизни. Древние предания говорят о проклятии, наложенном на наш народ. Теперь я верю, что мы и правда прокляты. Познав раскаяние, желаешь лишь прощения. Для меня оно останется мечтой. Сиатлен"
    3: "Обрывок дневника"
  "741":
    1: "Гильдейский мастер Феллмун,  я пишу вам, чтобы сообщить о тревожных событиях на Островах Кинжальной Раны. Мой караван оказался здесь в ловушке, но это ещё не самое страшное. Вскоре после нашего прибытия из близлежащего моря поднялся огромный вулкан. Он вызвал гигантскую волну, которая смыла мосты, соединявшие острова между собой и с материком. Днём и ночью остров обрушивается под градом раскалённых камней, извергаемых вулканом. В довершение ко всему, регнаны воспользовались этой ситуацией, чтобы устроить набег. Говорю вам, это настоящий хаос!  Вожак каравана Дадеросс"
    3: "Письмо Дадеросса Феллмуну"
  "742":
    1: "Дорогой Хантер,  В связи с недавними событиями я вынужден обратиться к тебе с просьбой о сотрудничестве и помощи. В частности, я хотел бы, чтобы ты предоставил моей гильдии право немедленного использования твоих лодок на неопределенный срок. О, я понимаю, что это может повлиять на твой бизнес, поэтому в качестве ответного подарка позволь мне заверить тебя в том, что твоя прекрасная дочь Ирабель будет в полной безопасности. Насколько я знаю, она учится в Академии Альвар. Было бы жаль, если бы её обучение прервалось из-за какого-то несчастья, не так ли? Уверен, мы с тобой согласны, поэтому заранее благодарю тебя за твою щедрость.  Элгар Феллмун"
    3: "Шантажное письмо"
  "743":
    1: "…и теперь мы готовимся завоевать то, чего так долго искали. Невероятное осиное гнездо находится в каньоне чуть севернее нашего лагеря, и сокровище, спрятанное в нем, станет нашим. Я уверен, что мы добьёмся успеха там, где так много других потерпели неудачу. Не то чтобы они не были достаточно отважными, просто они были плохо подготовлены.  Это потребовало нескольких месяцев тщательного сбора, но у нас с собой есть волшебство, которое понадобится нам для маневрирования внутри улья. Всё золото, которое мы потратили на сбор свитков, окупится с лихвой. Деньги не будут проблемой, как только мы…"
    3: "Обрывок дневника"
  "744":
    1: "Расположенное на территории современного города Равеншор, «Хранилище времени» представляет собой любопытную реликвию династии Амберли — монархии, правившей на южном побережье Джадаме в период 342–621 гг. Р.Э. Последний амберлийский император, Торн III (589–633 гг. Р.Э.), понимая, что империя рушится, запечатал свои регалии в специально построенном хранилище, чтобы сохранить их до того дня, когда он или его потомки смогут вернуть империи былую славу.  Теперь, когда амберлийцы окончательно ушли в историю, хранилище Торна стало объектом пристального внимания многих кладоискателей. Магические заклятия, опечатывающие хранилище, оказались достаточно сильными, чтобы отразить любую попытку проникнуть в него. По сей день сокровища Торна остаются скрытыми от глаз всех."
    3: "История Хранилища времени"
  "745":
    1: "КАМЕННЫЕ ПОРТАЛЫ  Эти странные устройства выглядят как каменные квадраты, вмонтированные в землю, с короткими столбиками по углам. Похоже, они были сооружены строителями храма в качестве средства передвижения между островами. Здесь явно задействована магия. Их источником энергии служат зачарованные ониксовые камни. Я сам нашел один такой портал возле храма, и знаю, что у Онефанга есть ещё один. Каждому порталу для питания требуется свой собственный камень.  ЗАБРОШЕННЫЙ ХРАМ  Я обнаружил гравюру, которая, судя по всему, указывает на то, что заброшенный храм на северо-западном острове под водой соединяется с островом на северо-востоке. Если это так, то строители владели очень передовыми строительными технологиями."
    3: "Странности Кинжальной Раны"
  "746":
    1: "Арион Хантер,  Мы будем следить за тобой, чтобы гарантировать выполнение тобой требований Зога.  Любое отклонение от его приказов — и Вожак Стаи приведёт Ужасных Волков в твоё тайное убежище и выгонит тебя в море.  Помни: твоё мнение никому не интересно, требуется лишь твоё подчинение.  Передай отчёты о «Торговцах Альвара» Ужасному Пирату Стэнли, как приказано, и твоя семья вернётся к тебе.  Со временем.    Зог"
    3: "Письмо Ариону Хантеру"
  "747":
    1: "ОТВЕТЫ\nЗагадки, стр. 56: 1) Пятнадцать уток!  2) Бабушка тролля  3) Тюрьма\nЗагадки, стр. 57: 1) Яйцо  2) Курица висела вниз головой. 3) Осиное желе на крекере\nЗагадки, стр. 58: 1) Ноги людоеда 2) Внутри 3) Они сварили суп."
    3: "Страница, вырванная из книги"
  "748":
    1: "План: использовать старую систему осадных дверей, чтобы осушить логово.  Порядок нажатия рычагов: A, B, C, E, G, D, J, C, E, F, D, I, C, самый нижний  Сброс: A  Тритоны: будьте осторожны!"
    3: "Записи с чрезвычайного совещания"
  "749":
    1: "Наконец-то! После многих лет неудач нам удалось провести успешные испытательные стрельбы из «Пушечного ядра господства». Пушка не только не взорвалась, но и вызвала ожидаемый массивный взрыв, охвативший обширную территорию. Теперь перед нами стоит задача разработать подходящую корабельную установку для этой экспериментальной пушки, расположенной за пределами крепости. Как только мы справимся с этой задачей, мы навсегда станем властелинами морей! Наши корабли смогут потопить целые флотилии одним-единственным выстрелом из одной только такой новой пушки!"
    3: "Записи о конструкции пушки"
  "750":
    1: "Это неизбежно: храм для нас утрачен. Мы и подумать не могли, что наши собственные творения обратятся против нас. И не думали, что они смогут так легко привести к нашему уничтожению. Только я и мой помощник, Хст'т'к, — все, что осталось от Стражей Реликвий. Эта записка предназначена для любого из Хранителей Истинного Зрения, кто придет, чтобы вернуть храм.  Хст'т'к и я уже обеспечили сохранность священного идола. Помните: это шестая пластина, а не четырнадцатая! Мы потеряли Стража Рш'Дхкс, когда в прошлый раз была допущена эта ошибка. Я только молюсь, чтобы защитные системы устояли до вашего прибытия.  С уважением,  Иввч'вхс кхл'брок, Верховный Гнездомастер"
    3: "Древний свиток"
  "751":
    1: "Чёрное зелье «Божественное усиление» временно повышает все семь ваших характеристик. Для приготовления этого зелья требуется правильное сочетание одиннадцати реагентов: среди них всегда три синих и три жёлтых. Остальные пять реагентов варьируются в зависимости от множества возможных комбинаций, позволяющих получить это зелье."
    3: "Рецепт зелья «Божественное усиление»"
  "752":
    1: "Чёрное зелье «Божественная защита» объединяет в себе эффекты белых зелий, повышающих сопротивляемость, и временно увеличивает все ваши показатели сопротивляемости. Для приготовления этого зелья требуется правильное сочетание двенадцати реагентов: среди них всегда три красных и три жёлтых. Остальные шесть реагентов варьируются в зависимости от множества возможных комбинаций, позволяющих получить данное зелье."
    3: "Рецепт зелья «Божественная защита»"
  "753":
    1: "Чёрное зелье «Божественное превосходство» временно повышает уровень персонажа. Для приготовления этого зелья вам понадобится правильная комбинация из десяти реагентов: по три каждого цвета плюс один дополнительный реагент случайного цвета."
    3: "Рецепт зелья «Божественное превосходство»"
  "754":
    1: "«Эссенция удачи»: Навсегда повышает удачу на 15 и снижает меткость на 5. Действует только один раз на персонажа. Для приготовления этого зелья требуется шесть реагентов: четыре одного цвета и по одному каждого из остальных цветов."
    3: "Рецепт зелья «Эссенция удачи»"
  "755":
    1: "Великолепное «Зелье богов» однократно повышает все семь характеристик персонажа на 20. Существует множество способов приготовить это зелье, но во всех случаях требуется десять реагентов: по четыре одного типа и по три каждого из двух остальных типов."
    3: "Рецепт зелья «Зелье богов»"
  "756":
    1: "«Зелье рока» навсегда повышает все семь характеристик и сопротивления на 1, но вызывает магическое старение на 5 лет. Это зелье можно приготовить несколькими способами, но для этого всегда требуется восемь реагентов: по два одного типа и по три каждого из двух остальных типов."
    3: "Рецепт зелья «Зелье рока»"
  "757":
    1: "«Чистое сопротивление Огню» однократно повышает сопротивление Огню вашего персонажа на 40. Это одно из самых сложных зелий для приготовления, для которого требуется целых двенадцать реагентов. Существует несколько способов приготовления этого зелья, но каждый из них предполагает использование как минимум трёх красных, четырёх жёлтых и двух синих реагентов."
    3: "Рецепт зелья «Чистое сопротивление огню»"
  "758":
    1: "Зелье «Чистое сопротивление Воздуху» однократно повышает сопротивление Воздуху вашего персонажа на 40. Это одно из самых сложных зелий для приготовления, для которого требуется целых двенадцать реагентов. Существует несколько способов приготовления этого зелья, но каждый из них предполагает использование как минимум четырёх красных, четырёх синих и одного жёлтого реагента."
    3: "Рецепт зелья «Чистое сопротивление воздуху»"
  "759":
    1: "Зелье «Чистое сопротивление Воде» однократно повышает сопротивление Воде вашего персонажа на 40. Это одно из самых сложных зелий для приготовления, для которого требуется целых двенадцать реагентов. Существует несколько способов приготовления этого зелья, но каждый из них предполагает использование как минимум двух красных, трёх жёлтых и четырёх синих реагентов."
    3: "Рецепт зелья «Чистое сопротивление воде»"
  "760":
    1: "«Чистая сопротивляемость Земле» однократно повышает сопротивляемость Земле вашего персонажа на 40. Это одно из самых сложных зелий для приготовления, для которого требуется целых двенадцать реагентов. Существует несколько способов приготовления этого зелья, но каждый из них предполагает использование как минимум четырёх красных, трёх жёлтых и двух синих реагентов."
    3: "Рецепт зелья «Чистое сопротивление земле»"
  "761":
    1: "Зелье «Чистое сопротивление разуму» навсегда повышает сопротивление разуму на 40. Это одно из самых сложных зелий для приготовления: для него требуется целых двенадцать реагентов. Существует несколько способов приготовления этого зелья, но каждый из них предполагает использование как минимум трёх красных, двух жёлтых и четырёх синих реагентов."
    3: "Рецепт зелья «Чистое сопротивление разуму»"
  "762":
    1: "Зелье «Чистое сопротивление телу» навсегда повышает сопротивление телу на 40. Это одно из самых сложных зелий для приготовления: для него требуется целых двенадцать реагентов. Существует несколько способов приготовления этого зелья, но каждый из них предполагает использование как минимум двух красных, четырёх жёлтых и трёх синих реагентов."
    3: "Рецепт зелья «Чистое сопротивление телу»"
  "763":
    1: "«Эссенция силы»: Навсегда повышает силу на 15 и снижает интеллект на 5. Действует только один раз на персонажа. Для приготовления требуется шесть реагентов: четыре одного цвета и по одному двух других цветов."
    3: "Рецепт зелья «Эссенция силы»"
  "764":
    1: "«Эссенция интеллекта»: Навсегда повышает интеллект на 15 и снижает силу на 5. Действует только один раз на персонажа. Для приготовления требуется шесть реагентов: четыре одного цвета и по одному двух других цветов."
    3: "Рецепт зелья «Эссенция интеллекта»"
  "765":
    1: "«Эссенция харизмы»: Навсегда повышает харизму на 15 и снижает скорость на 5. Действует только один раз на персонажа. Для приготовления требуется шесть реагентов: четыре одного цвета и по одному двух других цветов."
    3: "Рецепт зелья «Эссенция харизмы»"
  "766":
    1: "«Эссенция меткости»: Навсегда повышает меткость на 15 и снижает удачу на 5. Действует только один раз на персонажа. Для приготовления требуется шесть реагентов: четыре одного цвета и по одному двух других цветов."
    3: "Рецепт зелья «Эссенция меткости»"
  "767":
    1: "«Эссенция выносливости»: Навсегда повышает выносливость на 15 и снижает все остальные характеристики на 1. Действует только один раз на персонажа. Для приготовления требуется шесть реагентов: четыре одного цвета и по одному двух других цветов."
    3: "Рецепт зелья «Эссенция выносливости»"
  "768":
    1: "«Эссенция скорости»: Навсегда повышает скорость на 15 и снижает харизму на 5. Действует только один раз на персонажа. Для приготовления требуется шесть реагентов: четыре одного цвета и по одному двух других цветов."
    3: "Рецепт зелья «Эссенция скорости»"
  "769":
    1: "Зелье «Защита от магии» обеспечивает тому, кто его выпьет, действие заклинания в течение времени, зависящего от силы зелья. Для приготовления этого зелья требуется семь реагентов: по два каждого вида плюс седьмой, который может быть любого цвета. Это означает, что зелье можно получить тремя различными способами."
    3: "Рецепт зелья «Защита от магии»"
  "770":
    1: "Здравствуй, караванер.\n\nУ меня для тебя есть предложение, которое затмит карьеру любого искателя приключений! Встретимся в Мурмурвудсе, внутри круга из камней. Не буду доверять бумаге больше подробностей.\nЯ буду там *в любое время*, когда ты решишь прийти, но, хотя это и противоречит кодексу нашей организации, я тебя умоляю — не затягивай слишком долго.\n\nВ."
    2: "Событие, межконтинентальное приключение"
    3: "Письмо для вас"
  "771":
    1: "Здравствуйте, знатные господа.\n\nУ меня для вас есть предложение, которое затмит судьбу любого героя! Встретимся в пустой башне лаборатории Клансера в Тулареанском лесу. Не буду доверять бумаге больше подробностей.\nЯ буду там *в любое время*, когда вы решите прийти, но, хотя это и противоречит кодексу нашей организации, умоляю вас — не затягивайте слишком долго.\n\nВ."
    2: "Событие, межконтинентальное приключение"
    3: "Письмо для вас"
  "772":
    1: "Привет, искатели приключений.\n\nУ меня для вас предложение, которое затмит судьбу любого героя! Встретимся в курортном отеле «Абдул» в Драконьем Песке. Не буду фиксировать подробности на бумаге.\nЯ буду рядом с пьедесталом *в любое время*, когда вы решите прийти, но, хотя это и противоречит кодексу нашей организации, умоляю вас — не затягивайте слишком долго.\n\nВ."
    2: "Событие, межконтинентальное приключение"
    3: "Письмо для вас"
  "773":
    3: "Свиток с сообщением 773"
  "774":
    1: "Друг-путешественник!\n\nБлагородный лорд Маркхэм устраивает грандиозное состязание на Изумрудном острове!\nВоспользуйся шансом войти в пантеон знати, завоевав право править знаменитым замком Хармондейл и всеми его окрестностями!\n\nПока проходит состязание, каждую среду из Стидвика отправляются корабли на Изумрудный остров."
    2: "Город Стидвик."
    3: "Объявление"
  "775":
    3: "Свиток с сообщением 775"
  "776":
    3: "Свиток с сообщением 776"
  "777":
    3: "Свиток с сообщением 777"
  "778":
    3: "Свиток с сообщением 778"
  "779":
