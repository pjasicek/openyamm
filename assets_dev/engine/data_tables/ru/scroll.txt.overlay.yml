  "1536":
    1: "Мои священники, у меня плохие новости. Похоже, что наша операция в Энроте провалилась, и что наш маневр против Екатерины здесь, в Эратии, также закончился неудачей. Я не ожидаю, что ваши попытки привлечь новых приверженцев увенчаются успехом, поэтому советую вам как можно лучше укрыться. Я верю, что мы сможем восстановить силы после потерь и нанести ответный удар в подходящий момент, но до тех пор вам не следует попадаться на глаза. Ксенофекс"
