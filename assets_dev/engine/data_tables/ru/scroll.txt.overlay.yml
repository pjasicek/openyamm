  "1583":
    3: "_quest/misc781"
  "2120":
    1: "III = 16 и IV = 4"
    2: "D1"
    3: "Послание"
  "2121":
    1: "Смерть злоумышленнику!"
    2: "T6"
    3: "Предупреждение"
  "2122":
    1: "«Серебряный Язык,  мои шпионы докладывают, что по стране разъезжает небольшая группа самозваных героев, пытающихся положить конец нашему маленькому «Плану нового мира».  По имеющимся сведениям, они просят разрешения посетить Оракула в Свободной гавани.  Ты не должен допустить этого — если Хранитель пробудится до того, как наш план созреет, это станет концом для нас обоих.  Откажи им в разрешении посетить Оракула, даже если это разоблачит тебя как предателя.  Нам нужно время, которое ты нам выиграешь своей задержкой.  Ах да... Слава Баа. \nЗенофекс»"
    2: "T7"
    3: "Письмо Ксенофекса"
  "2123":
    1: "Джарвис,  Мы установили, что мэр Миста занимает третье место в нашем списке врагов, уступая лишь Чарльзу д’Сорпигалу и Дженнике Брэдли.  Нам нужно, чтобы ты ТАКТНО добился права патрулировать Мист и прилегающие острова, а затем соответствующим образом разобрался с мэром.  Если всё пройдёт гладко, то устрани также Чарльза и Дженнику.  Выполни это задание с особой осторожностью, и ты будешь вознаграждён.  Джеррард Блэкэмс"
    2: "D7"
    3: "Список врагов"
  "2124":
    1: "Дамиан,  поздравляю с новым заданием.  «Гильдия Теней» поручает тебе устроить засаду на караваны, следующие из Нью-Сорпигала в Айронфист или Свободную гавань.  Ни при каких обстоятельствах не разглашай, что ты имеешь к нам какое-либо отношение, иначе сделка будет сорвана, и ты узнаешь, что ждёт тех, кто нас предаёт.  Делай, как тебе велено, и проблем не будет.  Принц воров"
    2: "D6"
    3: "Приказы Гильдии Теней"
  "2125":
    1: "«Мой дорогой Сулман, 17 сентября 1152 года\nТы отлично справился, и настоящим я повышаю тебя до звания Верховного жреца Второго круга. В Нью-Сорпигале у Андовера Потбелло тебя ждёт сумма золота, которую он передаст тебе, если ты скажешь ему, что тебя послал Сэндмен, и покажешь печать на этом письме. Сэндмен… Мне это нравится.    \nТы мастерски разделался с делом Роланда, и мне особенно понравился этот ход со снежной бурей — это действительно вселило в него страх, не так ли? Суеверный дурак! Его устранение ускорило наш график как минимум на два года и избавило нас от необходимости убивать его в более деликатный момент. Все приготовления завершены. Мои приспешники организовали отзыв королевы Екатерины на родину, в Эратию, для участия в похоронах её отца.  В этом году она не вернётся, и это оставляет во главе дворца только её бесполезного отродья Николая и того идиота-регента Уилбура Хамфри. \nНарод начал чуять, что что-то не так, что, возможно, боги разгневались.  Что, возможно… «Айронфисты» утратили «Мандат Небес».  Ещё несколько бедствий — и вполне может разразиться полномасштабное восстание! А мы будем ждать у бреши, готовые вмешаться и сказать овцам, что им делать и когда.  Уже сейчас наши храмы разбросаны по всей стране, предлагая помощь пострадавшим от бедствий и утешение скорбящим…   \nДа.  Оставайся в Новом Сорпигале и держись в тени.  Когда придет время, с тобой свяжутся и дадут дальнейшие инструкции.  Так что не унывай и знай: наш план реализуется без сбоев, и вскоре мы будем править этим миром.  Твое положение в нашей иерархии будет очень высоким!\n--Зенофекс»"
    2: "1"
    3: "Письмо"
  "2126":
    1: "Содержание этого свитка трудно понять, в основном потому, что оно написано на незнакомом языке. Однако на некоторых схемах указаны места нахождения и маршруты патрулирования демонов."
    2: "Мини-подземелье"
    3: "Планы дьявола"
  "2127":
    1: "Завершение строительства этого храма стало знаменательным днём для Церкви Солнца! Теперь у нас есть храмы во всех крупных регионах мира. Этот храм, окружённый и уединённый среди природы, станет центром поклонения для наших новых последователей — коренных жителей этих островов. Пусть слава Солнца сияет над вами всеми и благословляет ваш труд."
    2: "T4"
    3: "Послание архиепископа"
  "2128":
    1: "Кергмонд,   тебе не хватает навыков владения оружием, самоотдачи и, что самое главное, способности командовать, чтобы добиться успеха в качестве рыцаря.  Твои постоянные неудачи не оставляют мне иного выбора, кроме как исключить тебя из рядов Рыцарей Энрота.  Я бы посоветовал тебе найти новую профессию, поскольку ты никогда не овладеешь искусством ведения войны.  Осрик Темпер"
    2: "D16"
    3: "Документы об увольнении"
  "2129":
    1: "Я должен похвалить вас за отличную работу. Продолжайте подрывать власть «Айронфистов», и никому не останется сил бросить нам вызов. Если представится возможность, заманивайте как можно больше людей перспективой занять трон. Если мы правильно разыграем свои карты, люди уничтожат друг друга в кровавой войне за трон. Криганы щедро вознаградят своих верных последователей."
    2: "T6"
    3: "Письмо Ксенофекса"
  "2130":
    1: "Продолжай накладывать свои тёмные заклинания на Монолит.  Если нам удастся полностью осквернить Монолит, мы ослабим друидов Лоретты настолько, что сможем взять верх.  Эта задача имеет решающее значение для наших будущих планов, не подведи!"
    2: "D13"
    3: "Письмо от Седрика Друта"
  "2131":
    1: "Обратите взор к природе там, где цивилизация терпит неудачу — скалы и деревья, небо и земля обладают силой, превосходящей силу человека."
    2: "D13"
    3: "Клочок бумаги"
  "2132":
    1: "Снергл,  нам так и не удалось найти Роклина нигде.  Какая бы дыра ни поглотила его, она, должно быть, проглотила его целиком.  Я знаю, что тебе нужна его смерть, чтобы подчинить остальных гномов, но мы обыскали весь Энрот и так и не смогли его найти.  Ланстоун"
    2: "D5"
    3: "Письмо Снерглу"
  "2133":
    1: "Продолжайте свою работу в Замке Айронфиста и Новом Сорпигале.  Эти клоуны на юге не готовы к нашей встрече, так что вы сможете собрать с них отличный урожай.  Не забывайте приводить яркие и понятные примеры — и овцы пойдут за вами куда угодно."
    2: "D3"
    3: "Письмо Принца воров"
  "2134":
    1: "Текст бегущей строки. 514"
    3: "Свиток с сообщением 514"
  "2135":
    1: "Джеррард,  поздравляем с новым повышением.  Теперь, когда «Братство Серебра» находится под твоим контролем, у тебя появится больше свободы в поиске тех, кто недостаточно жестко борется со злом в Энроте.  В конечном итоге мы надеемся помочь тебе избавиться от самых нерадивых в борьбе со злом — «Айронфистов».  Продолжай свою работу, и твои мечты сбудутся.  Зенофекс"
    2: "D12"
    3: "Элегантное письмо"
  "2136":
    1: "Принц, Энтони Стоун решил избавиться от тебя раз и навсегда. Уверен, что ты скоро встретишься с его людьми. Ради твоей безопасности я подготовил для тебя укрытие в канализации под Свободной гаванью. Немедленно покинь здание Гильдии и отправляйся в канализацию. Как только шумиха уляжется, ты сможешь вернуться в здание Гильдии. Фетзил"
    2: "D8"
    3: "Письмо Принцу воров"
  "2137":
    1: "Текст бегущей строки. 517"
    3: "Свиток с сообщением 517"
  "2138":
    1: "Попытка применить силу против Башен Дракона была ошибкой, как показал нам урок в Кригспайре.  В ходе атаки мы потеряли почти два десятка наших верховых животных и едва смогли отключить Башню.  К счастью, наши союзники в Ледяном Перевале нашли Ключи, необходимые для полного отключения Башен.  Скоро мы снова сможем летать, и крестьяне будут разбегаться перед нами, как зайцы перед волками.  Я слишком долго застрял в этих пещерах — даже Голиаф, мой верховой, начинает нервничать.  Теперь, когда Башни Дракона отключены, а армии с юга задержались и не могут до нас добраться, мы снова сможем свободно скакать."
    2: "D20"
    3: "Страница дневника"
  "2139":
    1: "Черт! Похоже, я оставил Кристалл Памяти в Кригспайре, когда мы бежали от моих минотавров. Никогда не смешивайте быка с чем-либо! Я должен был догадаться, что эмоциональная нестабильность людей и вспыльчивый характер быков приведут к полной катастрофе.  Мне придётся отправиться в замок, чтобы забрать Кристалл, но сначала мне понадобятся какие-нибудь существа, которые помогут мне пройти мимо минотавров.  Может быть, если бы я создал какое-нибудь летающее волшебное око…"
    2: "D19"
    3: "Страница из дневника Агара"
  "2140":
    1: "…не знаю, как ему это удаётся, но лорд Юстас порой так быстро исчезает из тронного зала. Я даже не уверен, куда он девается — там ведь только один выход. Я думал, что, может быть, в зале есть тайный выход, но это просто глупо. К тому же я никогда не находил никаких механизмов, когда обыскивал…"
    2: "D15"
    3: "Фрагменты дневника"
  "2141":
    1: "Отличная работа — вы выполнили первую часть плана.  Благодаря этой крепости вам удастся предотвратить любое вмешательство с юга.  Используйте ключи от Башен Дракона, чтобы отключить их, и мы снова сможем совершать набеги на города.  За проделанную вами отличную работу вы получите достойное вознаграждение.  Когда закончите, приходите в наши пещеры на северо-западе, чтобы получить вознаграждение."
    2: "D15"
    3: "Письмо предводителя драконов"
  "2142":
    1: "Похоже, что обнаруженный вами кристалл не совсем соответствует нашим ожиданиям, но мы признаем его полезность. Мы пошлем нескольких жрецов, чтобы они изучили этот кристалл, а затем примут решение, что с ним делать. Приготовьтесь к их приезду через несколько недель."
    2: "T2"
    3: "Письмо из храма"
  "2143":
    1: "Крысы!  В буквальном смысле — крысы.  Мы довели до совершенства «Проклятие бесконечной вредителей», но один из аколитов напортачил, и теперь вместо того, чтобы поразить Новый Сорпигал, наш храм заполонили такие количества грызунов, насекомых и вредителей, каких я нигде не видел.  Мы два дня пытались снять проклятие и отразить натиск этих надоедливых тварей, но у нас ничего не вышло.  Теперь у нас остаётся только бежать и построить храм где-нибудь ещё на юге."
    2: "D2"
    3: "Заметки о магических ритуалах"
  "2144":
    1: "Текст бегущей строки. 524"
    3: "Свиток с сообщением 524"
  "2145":
    1: "В ближайшие несколько недель нам потребуется, как минимум, 150 % объёма добычи с этой шахты.  Мне понадобятся оружие и доспехи для моих солдат, чтобы подавить любое недовольство моим правлением.  Продолжайте искать любые более ценные металлы, такие как стальт и кергар.  Пока что не обращайте внимания на золото и драгоценные камни — у нас достаточно денег, чтобы продержаться довольно долго; именно нехватка оружия и доспехов станет нашей гибелью."
    2: "D9"
    3: "Приказы Снергла"
  "2146":
    1: "Текст бегущей строки. 526"
    3: "Свиток с сообщением 526"
  "2147":
    1: "Мои занятия с Кристаллом Терракса стали утомительными.  По-моему, я недостаточно хорошо владею основами магии, чтобы полностью понять уроки Кристалла.  Время, которое у меня здесь осталось, подходит к концу, и, по-видимому, мне придётся продолжить обучение в образе лича.  Я отказываюсь сдаться и принять смерть — не после моего поражения в Войнах за Престол и неудач в изучении магии.  Я использую время, которое даёт мне статус лича, чтобы более тщательно обучиться магии и спланировать месть «Айронфистам» за то, что они сделали с Арчибальдом и со мной."
    2: "D11"
    3: "Страница из дневника Корлагона"
  "2148":
    1: "Брат, вскоре нам понадобится всё, что ты сможешь предоставить нам в плане оружия.  Теперь, когда Гарик ушёл, ты полностью контролируешь объекты «Кузницы».  Мне нужно, чтобы ты использовал этот контроль для оказания нам помощи.  Скоро мы сможем нанести удар по самому сердцу наших врагов, и ты займёшь место рядом со мной как правитель Энрота.  Джеррард Блэкэймс"
    2: "D18"
    3: "Письмо Маркусу"
  "2149":
    1: "Если не одно, то другое.  Теперь Арчибальд хочет, чтобы я занялся оснащением его армии лучшим снаряжением, которое только смогу создать.  Меня заставили переехать сюда из Аламоса, чтобы я мог как можно быстрее выполнить этот заказ.  Я оставил тот проклятый Кристалл, о котором он так беспокоился, своим коллегам в Аламосе.  Надеюсь, они скоро смогут прийти к какому-то выводу по поводу него, хотя я бы хотел, чтобы Арчибальд наконец определился, чего он хочет."
    2: "D18"
    3: "Обрывок дневника Гарика"
  "2150":
    1: "…помните, что наша цель — стать единственным орденом друидов в Энроте. Ничто не сможет помешать нам в наших усилиях по очищению наших рядов и устранению всякой оппозиции. С этой целью мы будем использовать как Монолит, так и всё, что удастся найти в этом старом Храме Луны, чтобы подорвать власть Лоретты и её друидов повсюду. Мы должны выдержать испытания, чтобы стать сильнее. Седрик Друтерс"
    2: "T5"
    3: "Фрагменты письма"
  "2151":
    1: "Поздравляю с успешным завершением вашей трансформации.  Надеюсь, у вас всё в порядке.  Но даже если это не так, мне необходимо, чтобы вы исследовали Кристалл Памяти и раскрыли содержащуюся в нём информацию.  У меня больше нет времени на задержки или неудачи, и я рассчитываю, что ты добьёшься успеха там, где другие потерпели неудачу.  Я знаю, что у тебя есть слабость к кристаллам, и надеюсь, что ты воспользуешься своим опытом работы с ними, чтобы быстро завершить эту работу.  Когда у тебя будет информация, принеси её мне в Замок Айронфист.  Возможно, мы сможем использовать то, что ты найдёшь, чтобы получить доступ к остальным кристаллам.  Арчибальд"
    2: "CD2"
    3: "Письмо Терраксу"
  "2152":
    1: "«Ритуал бесконечной ночи» — пожалуй, один из самых сложных для исполнения. И не из-за физических нагрузок, а из-за душевных и духовных мучений, которые приходится переносить магу. Отказаться от своей человечности, от своей души — это не так-то просто. Только самые алчные, самые амбициозные или бессердечные способны выдержать связанные с этим испытания."
    2: "CD2"
    3: "Отдельный лист"
  "2153":
    1: "...пытались найти зачарованные двери.  Уильям отказался взять с собой найденный нами янтарь, поскольку считал, что он проклят.  Проблуждая почти целый день, мы наткнулись на странное существо, которое телепортировало нас к входу.  В обмен на эту услугу оно поглотило жизненную силу Уильяма, но ему удалось восстановить силы за несколько дней.  Мы приостанавливаем все дальнейшие экспедиции до тех пор, пока не сможем выяснить…"
    2: "D4"
    3: "Фрагмент дневника"
  "2154":
    1: "Прекратите свои нынешние эксперименты по эволюции и созданию существ.  Мне нужно, чтобы вы сосредоточили свои усилия на изучении назначения этого Кристалла и информации, содержащейся в нём.  Очевидно, Оракул использует их для каких-то целей, и мне нужно, чтобы вы точно определили, в чём именно они заключаются.  Эта задача важнее, чем создание нелетающих птиц, людей-быков или чего бы то ни было, чем вы сейчас занимаетесь.  Арчибальд"
    2: "CD3"
    3: "Письмо Агару"
  "2155":
    1: "Пожалуйста, воспользуйтесь своими знаниями о магических предметах и материалах, чтобы извлечь из этого кристалла содержащуюся в нём информацию.  Если понадобится, задействуйте все ресурсы Аламоса, но не подведите меня.  Мне крайне важно узнать всю информацию, которую Оракул пытается скрыть от меня.  Арчибальд"
    2: "CD1"
    3: "Письмо Гарику"
  "2156":
    1: "Восток:  Зал гильдии «Тени» Запад:  Убежище гильдии «Тени» Север:  Гильдия воров «Свободное пристанище» Юг:  Пещеры драгунов"
    2: "D8 «Спираль»"
    3: "Инструкции по изготовлению спирали"
  "2157":
    1: "Когда начнётся Высадка, капитан, отнесите этот кодовый свиток в центральную рубку и, когда вас попросят, произнесите ключ «krik». Все старшие офицеры должны предъявить свои кодовые свитки и ключи, чтобы открыть проход. Ваш ключ — последний в последовательности."
    2: "Пирамида"
    3: "Код капитана"
  "2158":
    1: "Когда начнётся Высадка, старпом, отнесите этот кодовый свиток в центральную рубку и, когда вас попросят, произнесите ключ «kcops». Все старшие офицеры должны предъявить свои кодовые свитки и ключи, чтобы открыть проход."
    2: "Пирамида"
    3: "Код старпома"
  "2159":
    1: "Когда начнётся Высадка, штурман, отнесите этот кодовый свиток в центральную рубку и, когда вас попросят, произнесите ключ «ulus». Все старшие офицеры должны предъявить свои кодовые свитки и ключи, чтобы открыть проход."
    2: "Пирамида"
    3: "Код штурмана"
  "2160":
    1: "Когда начнётся Высадка, офицер связи, отнесите этот кодовый свиток в центральную рубку и, когда вас попросят, произнесите ключ «aruhu». Все старшие офицеры должны предъявить свои кодовые свитки и ключи, чтобы открыть проход."
    2: "Пирамида"
    3: "Код офицера связи"
  "2161":
    1: "Когда начнётся Высадка, инженер, отнесите этот кодовый свиток в центральную рубку и, когда вас попросят, произнесите ключ «yttocs». Все старшие офицеры должны предъявить свои кодовые свитки и ключи, чтобы открыть проход."
    2: "Пирамида"
    3: "Код инженера"
  "2162":
    1: "Когда начнётся Высадка, врач, отнесите этот кодовый свиток в центральную рубку и, когда вас попросят, произнесите ключ «yoccm». Все старшие офицеры должны предъявить свои кодовые свитки и ключи, чтобы открыть проход."
    2: "Пирамида"
    3: "Код врача"
  "2163":
    1: "«Вот ключ от двери с кодовым замком, который вы заказали.\n\nA.  Ловушка.\nB.  Открывает дверь № 4 и закрывает дверь № 5.\nC.  Открывает дверь № 5 и закрывает дверь № 4.\nD.  Открывает дверь № 1 и закрывает дверь № 5.\nE.  Открывает дверь № 5 и закрывает дверь № 1.\nF.  Открывает дверь № 2 и закрывает дверь № 4.\nG.  Открывает дверь № 6.\nH.  Открывает дверь № 3 и закрывает дверь № 2.\nI.    Открывает дверь № 2 и закрывает дверь № 3.\nJ.   Открывает дверь № 2 и закрывает дверь № 1.\nK.  Открывает дверь № 6 и закрывает дверь № 5.\nL.   Открывает дверь № 3 и закрывает дверь № 4.\nM.  Техническое обслуживание.\nN.  Открывает дверь 1 и закрывает дверь 2.\nO.  Открывает дверь 5 и закрывает дверь 6.\nP.  Сброс.  \n\nС уважением, монахи Дроуккаб»."
    2: "D1"
    3: "Код Гоблинвотча"
  "2164":
    1: "Ритуал, описанный в этом свитке, судя по всему, представляет собой сложную магическую формулу, требующую от заклинателя встать лицом к цели на некотором расстоянии и выполнить длинную и точную последовательность действий. Вы не можете понять, каким будет эффект заклинания после его произнесения."
    2: "D1"
    3: "Ритуал Пустоты"
  "2165":
    1: "Я спрятал это письмо здесь в надежде, что его найдёт кто-нибудь, верный Короне.  То, что я вообще смог его написать, — уже чудо: мои похитители оказались слишком глупы, чтобы забрать у меня письменные принадлежности, — и мне понадобится ещё много чудес, чтобы выжить в этой беде.  Все мои люди погибли в сражении с дьяволами, и в живых остались только Танир, Рагнар и я.  Лорд Рагнар в плохом состоянии, и я боюсь, что он не переживет эту ночь.  Возможно, так для него даже лучше.  Поскольку нас ещё не убили, я полагаю, что нас приберегают для чего-то особенного.  Что бы это ни было, пока есть жизнь, есть надежда.  Вероятно, они перевезут Танира и меня из этого ужасного места в другое ужасное место, чтобы выкупить нас или замучить ради информации.  Какой бы ни была наша судьба, ты, мой верный подданный, должен сделать всё, чтобы обеспечить выживание королевства и нашего мира.  Эти демоны представляют гораздо большую угрозу, чем когда-либо представлял Арчибальд, и для их победы потребуются самые отчаянные меры.  Прими эти меры, даже если это означает освобождение моего злобного брата из его каменной гробницы.  Прежде всего, обратись за советом к Оракулу в Свободной гавани.  Я слышу, как мои похитители идут по коридору!  Скажи моей жене и сыну, что я их люблю, и НЕ ДОВЕРЯЙ СУЛЬМАНУ! Он — предатель.  Удачи!  — Роланд Айронфист, король Энрота"
    2: "D1"
    3: "Дневник Роланда"
  "2166":
    1: "Поздравляю!  Настоящим я провозглашаю вас всех «Супер-Губерами»!"
