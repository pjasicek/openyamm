  "1530":
    1: "Торговый договор Получатель:  Шмендрик Отправитель:  ACME Golem's  Мы изготовили детали для голема в соответствии с вашим заказом.  К сожалению, наша служба доставки потеряла эти детали, предназначенные для вас.  Мы не несем ответственности за ошибки службы доставки. Однако нам известно, куда были доставлены ваши детали, и вы можете самостоятельно их забрать в удобное для вас время. 1 деталь была доставлена в Барроу-Даунс, 1 деталь — в Таталию, 1 деталь — в Авли, 2 детали — в Дейю, 2 головы — в Бракаду (поскольку мы не знали, какую модель вы предпочитаете)."
    2: "В сундуке с головой Эбби Нормал в пустыне Бракада"
    3: "Договор купли-продажи"
