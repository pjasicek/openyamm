rows:
  "700":
    1: "«Омоложение»: Устраняет последствия магического старения. Чтобы приготовить такое зелье, необходимо подобрать правильное сочетание по три единицы каждого из исходных реагентов."
    2: "Омоложение"
    3: "Рецепт зелья «Омоложение»"
  "701":
    1: "«Чистая сила»: Навсегда повышает силу на 50.  Увеличение постоянной Силы способно превратить ЛЮБОГО в боевую машину.  Для приготовления этого зелья вам понадобится правильная комбинация из четырёх красных реагентов любого типа, двух синих реагентов любого типа и одного жёлтого реагента."
    2: "Чистая сила"
    3: "Рецепт зелья «Чистая сила»"
  "702":
    1: "«Чистая меткость»: Навсегда повышает меткость на 50.  Дополнительная постоянная Меткость может превратить ЛЮБОГО в настоящую боевую машину.  Чтобы приготовить это зелье, вам понадобится правильная комбинация из четырёх жёлтых реагентов любого типа, двух красных реагентов любого типа и одного синего реагента."
    2: "Чистая меткость"
    3: "Рецепт зелья «Чистая меткость»"
  "703":
    1: "«Чистая харизма»: Навсегда повышает харизму на 50. Это приведёт к увеличению общего количества очков маны, рассчитываемых на основе показателя харизмы. Для приготовления этого зелья необходимо использовать правильную комбинацию: один реагент любого красного типа, четыре реагента любого синего типа и два реагента жёлтого типа."
    2: "Чистая харизма"
    3: "Рецепт зелья «Чистая харизма»"
  "704":
    1: "«Чистая выносливость»: Навсегда повышает выносливость на 50.  Увеличение постоянной выносливости способно превратить ЛЮБОГО в боевую машину, повысив его количество очков здоровья далеко за пределы нормы.  Для приготовления этого зелья потребуется правильное сочетание двух красных реагентов любого типа, четырёх синих реагентов любого типа и одного жёлтого реагента."
    2: "Чистая выносливость"
    3: "Рецепт зелья «Чистая выносливость»"
  "705":
    1: "«Чистый интеллект»: Навсегда повышает интеллект на 50. Для приготовления этого зелья вам понадобится правильная комбинация: один реагент любого красного типа, два реагента любого синего типа и четыре реагента жёлтого типа."
    2: "Чистый интеллект"
    3: "Рецепт зелья «Чистый интеллект»"
  "706":
    1: "«Чистая скорость»: Навсегда повышает скорость на 50.  Дополнительная постоянная скорость может оказаться именно тем, что нужно, чтобы успеть восстановиться и действовать раньше монстров.  Быстроты много не бывает. Для приготовления этого зелья вам понадобится правильная комбинация из четырёх красных реагентов любого типа, одного синего реагента любого типа и двух жёлтых реагентов."
    2: "Чистая скорость"
    3: "Рецепт зелья «Чистая скорость»"
  "707":
    1: "«Чистая удача»: Навсегда повышает удачу на 50.  Дополнительная постоянная удача может оказаться именно тем, что нужно, чтобы успеть увернуться до срабатывания ловушки.  Удачи много не бывает. Для приготовления этого зелья вам понадобится правильное сочетание четырёх красных реагентов любого типа, трёх синих реагентов любого типа и двух жёлтых реагентов."
    2: "Чистая удача"
    3: "Рецепт зелья «Чистая удача»"
  "708":
    1: "«Зелье истребления»: Наделяет немагическое оружие свойством «Истребление драконов».  Чтобы приготовить это зелье, вам понадобится правильная комбинация из трёх красных реагентов любого типа, трёх синих реагентов любого типа и двух жёлтых реагентов."
    2: "Зелье истребления"
    3: "Рецепт зелья «Зелье истребления»"
  "709":
    1: "Зелье снятия окаменения. Для приготовления этого зелья необходимо соединить три реагента любого красного типа, два реагента любого синего типа и три реагента жёлтого типа в нужном соотношении."
    2: "Зелье снятия окаменения"
    3: "Рецепт зелья снятия окаменения"
  "710":
    1: "«Повышение силы»: Временно повышает силу на величину, равную утроенной силе зелья, на 30 минут за каждое очко силы зелья. Чтобы приготовить это зелье, вам понадобится правильное сочетание трёх красных реагентов любого типа и двух синих реагентов любого типа."
    2: "Повышение силы"
    3: "Рецепт зелья «Повышение силы»"
  "711":
    1: "«Повышение интеллекта»: Временно повышает интеллект на величину, равную утроенной силе зелья, на 30 минут за каждое очко силы зелья. Для приготовления этого зелья вам понадобится правильное сочетание двух синих реагентов любого типа и трёх жёлтых реагентов любого типа."
    2: "Повышение интеллекта"
    3: "Рецепт зелья «Повышение интеллекта»"
  "712":
    1: "«Повышение харизмы»: Временно повышает харизму на величину, равную утроенной силе зелья, на 30 минут за каждое очко силы зелья. Для приготовления этого зелья вам понадобится правильное сочетание трёх синих реагентов любого типа и двух жёлтых реагентов любого типа."
    2: "Повышение харизмы"
    3: "Рецепт зелья «Повышение харизмы»"
