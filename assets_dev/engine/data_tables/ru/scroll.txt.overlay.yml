  "781":
    3: "Свиток с сообщением 781"
  "1502":
    1: "Здравствуйте!  Много лет назад, во время одной из предыдущих войн, эльфы похитили у нас артефакт в ходе набега.  С тех пор им удавалось скрывать этот артефакт, но теперь они решили перевезти его в Туларейские пещеры для хранения.  Мы отправили собственный отряд, чтобы отобрать у них артефакт, пока они не успели доставить его в пещеры.  Я прошу вас оказать помощь нашим войскам в обеспечении возвращения артефакта.  Спасибо,  Эллен Рокуэй"
    2: "Событие"
    3: "Послание от Эратии"
  "1503":
    1: "У цпйъф твгйэъкь ьсёыфвф Уфэцсэс э шю цчч чсдсбрб щпщчиуса уюх. Гц всячс: гщкфв, цчбдгу, нф, ьиясш с ёцвыа. Вфйюдф ъуцаиэс, шчыф зшыслнэ. Ешижъ."
    2: "Событие"
    3: "Шифр"
  "1504":
    1: "Сложный волновой узор часто наблюдается после относительно редкого явления конденсации эндоплазматической сети на внутренней стенке волнового фронта импульсного кантилевера, образующегося при проведении эндокромантии над неправильно подготовленными арабитами. Поскольку кубический корень из i можно определить только путем измерения впадин, обнаруживаемых среди карабинов, становится ясно, что во время этого явления происходило «бриллинг», а скользкие товы кружились и вертелись в волне.  Очевидно, это приводит к неизбежному выводу, что все мимси были бороговами!  По сути, при наблюдении таких явлений можно далее постулировать, что косинус A дельта F положителен, а мом-раты переграбят.  Конечно, всё это элементарно!  Для более углублённого изучения обратитесь к классическому исследованию Дельфины «Реголит Уайтсинаж и Маларки»."
    2: "Школа волшебства"
    3: "Свиток волн"
  "1505":
    1: "У шифров много разновидностей. Здесь мы рассмотрим простой способ с повторяющимся ключом. Отправитель и получатель заранее договариваются о слове или фразе. Буквы ключа подписывают под буквами сообщения, повторяя ключ до конца текста. Пробелы и знаки препинания пропускают: буква ключа на них не расходуется. Используется русский алфавит из 33 букв, включая «ё» после «е». Буквы нумеруются от 1 до 33: а = 1, б = 2, …, я = 33. Чтобы зашифровать букву, сложите её номер с номером буквы ключа. Если сумма больше 33, вычтите 33. Чтобы расшифровать, вычтите номер буквы ключа из номера зашифрованной буквы; если результат меньше 1, прибавьте 33. Например, с ключом «ангел» сообщение «слишком много тайн» превращается в «тъмючпы руыдэ цёцо». Подпишите под шифровкой повторяющийся ключ и вычитайте буквы по этому правилу — получите исходное сообщение. В более сложном шифре ключом служит целая страница книги: повторений ключа нет, и взломать его НАМНОГО труднее. Надеюсь, этот краткий урок криптографии окажется полезен. Удачного шпионажа!"
    2: "Замок Хармондэйл"
    3: "Основы криптографии"
  "1506":
    1: "«Милорды», прошу вас явиться через две недели в Гильдию наемников в Таталии для обсуждения услуги, которую вы обязаны оказать моему знакомому, мистеру Мальвику. Невыполнение этой просьбы может обернуться крайне плачевными последствиями для вас и вашего города. С нетерпением жду встречи с вами. Найлс Стэнтли"
    2: "Событие"
    3: "Обращение г-на Стэнтли"
  "1507":
    1: "Подробные планы форта Риверстрайд, включая схемы патрулирования и графики дежурств.  В чужих руках эти планы могут привести к катастрофическим последствиям."
    2: "Форт Риверстрайд"
    3: "Планы Риверстрайда"
  "1508":
    1: "Подробные планы форта Риверстрайд, включая схемы патрулирования и графики дежурств.  Ввиду содержащейся в них ложной информации эти планы могли бы нанести сокрушительный ущерб любым врагам, планирующим нападение на форт."
    2: "Событие"
    3: "Ложные планы Риверстрайда"
  "1509":
    1: "…уже не долго продержимся.  Гоблины получили помощь от какого-то огромного летающего существа, и вскоре после того, как мы захватили форт, они начали падать с неба.  Не думаю, что нам удастся продержаться ещё долго; я буду скучать по своей жене и семье…"
    2: "Сундук в форте в зоне 2"
    3: "Отрывок из дневника солдата"
  "1510":
    1: "Тюремщик Фэдрил,  мы построили новое пристройку к пещерам здесь, в Тулареанском лесу; уверен, она тебе понравится.  Чтобы попасть в новую часть, тебе придётся перейти через мост, который мы замаскировали магией (кому же придётся в голову попытаться пройти по воздуху?), а затем активировать несколько телепортов.  Один из телепортов перенесёт вас в тюремный блок; два других — ловушки.  Чтобы ещё больше укрепить охрану тюрьмы, нам удалось поймать несколько виверн из Авли и небольшое племя троглодитов для охраны тюремного блока пещер.  Обязательно хорошо их кормите, если хотите посетить этот блок — виверны могут быть весьма враждебны.  Конечно, мы не несем никакой ответственности за вашу жизнь или жизни ваших людей — наша задача заключалась в том, чтобы контролировать строительство тюрьмы и свести к минимуму вероятность спасения или побега.  Ваша безопасность — в ваших руках.  Найлс Стэнтли"
    2: "Пещеры Туларе"
    3: "Письмо от г-на Стэнтли"
  "1511":
    1: "…Святой Перси отправился из Авли в Бракаду в поисках пропавшего копья и не раз сбивался с пути.  Ему не удавалось обнаружить местонахождение копья, и он объел почти весь континент Эратия.  Когда он, наконец, потерял всякую надежду, ему явилось видение:  «Когда солнце зайдет на западе, когда луна зайдет на севере, и когда звезды упадут на востоке, ты найдешь то, что ищешь».  Святой Перси обрёл надежду благодаря этому видению и вновь отправился на поиски..."
    2: "Великий Храм Света, где-то, куда можно добраться"
    3: "Порванная страница"
  "1512":
    1: "…Исследования игры Аркомаг позволили сделать следующие выводы:  Ваш выбор способа победы в игре должен основываться на условиях победы.  Если башни изначально небольшие, у вас есть хорошие шансы уничтожить башню соперника.  Если башни или стены изначально большие, вам следует сосредоточиться на своей собственной башне.  Если башни или стены изначально большие, а для победы вам нужна огромная башня, победа за счет ресурсов может оказаться более достижимой.  Кроме того, обратите внимание, что красные карты, как правило, нацелены на вашу стену, синие — на вашу башню, а зелёные — на вашу атаку.  Помните об этом, выбирая, на чём делать упор: на карьерах, магии или «зоопарках».  Я заметил преобладающую тенденцию в мышлении большинства игроков в «Аркомаг», которая может дать вам преимущество над ними: если они начинают разыгрывать синие карты, вы можете противодействовать этому с помощью..."
    2: "Пещеры Уайт-Клифф, рядом с картами и скелетом"
    3: "Записки об Аркомаге"
  "1513":
    1: "Заметки писца (допрос Селжина, 3-й день) 8 июня 1120 года  Допрашивающий:  Давайте ещё раз всё повторим, хорошо?  Вчера вы сказали, что гробница находится в Бракаде.  Несколько моих людей были убиты големами, когда искали в том месте, которое вы указали.  Я думал, мы наконец решили сотрудничать.  Теперь я вижу, что ты мне соврал.  Селджин:  Нет… Не врал… Границы меняются…  Дознаватель:  Фу!  Они изменились ещё в прошлом году!  Примените инструменты!  Дознаватель:  Ладно, исцелите его и разбудите.  (пауза).  Я твой друг.  Я могу избавить тебя от боли.  Скажи мне, где находится Гробница Мастера.  Сельджин:  Эратия!  Южная Эратия!    Дознаватель:  Хм.  Звучит более правдоподобно.  Примените инструменты ещё раз, на всякий случай.  (пауза)  Ладно, вылечите его и разбудите снова.  Я твой друг.  Я могу избавить тебя от боли.  Скажи мне правду.  Где находится Гробница Мастера?  Селджин:  Я же тебе говорил!  О, пожалуйста!  Юг… Южная Эратия!    Дознаватель:  Хорошо, отлично.  На этом всё, ребята.  Верните заключённого в камеру, и в путь!"
    2: "Камера пыток в замке Хармондэйл"
    3: "Отрывок из дневника"
  "1514":
    1: "Скайл: Кэтрин и Элдрич никогда не поймут нашей радости от их борьбы за спорный Хармондэйл. Продолжай пожинать плоды их войны. В конце концов они не смогут противостоять нам. — Арчибальд"
    2: "Послание Арчибальда Послу Зла"
    3: "Письмо от Арчибальда"
  "1515":
    1: "Найлс,  по-моему, я нашёл группу «авантюристов», которые подойдут тебе.  У них есть определённые способности, но они кажутся очень доверчивыми.  Я сделаю всё возможное, чтобы они согласились оказать нам услугу.  Уверен, что, как только их обманут, мы сможем использовать эту услугу в своих интересах.  Если они не захотят «отплатить» нам за эту услугу, мы всегда сможем устроить так, чтобы с ними случился несчастный случай.  Надеюсь, эта группа подойдёт тебе, и ты организуешь наш отъезд с этого скалистого острова!  С нетерпением жду, когда смогу покинуть этот проклятый остров.  — Мальвик"
    2: "Гильдия наемников"
    3: "Письмо из Мальвика"
  "1516":
    1: "Посол Райт,  очень важно, чтобы вы поговорили с новыми лордами Хармондэйла.  Я надеюсь, что они смогут положить конец этой бессмысленной вражде между королевой Кэтрин и королем Элдричем. Лорен Стил, доставивший это послание, сможет предоставить вам более подробную информацию. Если война продолжится, это только укрепит позиции Арчибальда.  Гэвин Магнус, верховный волшебник"
    2: "Пещеры Туларе"
    3: "Письмо от Гэвина Магнуса"
  "1517":
    1: "…наш первый день после прибытия на Изумрудный остров.    К нам подошёл какой-то странный человек по имени Мальвик. Его предложение показалось нам странным: волшебная палочка в обмен на «будущие услуги».  Мы отказались.  Когда мы уходили и направлялись в северо-восточную часть острова, он рассмеялся и крикнул, что знает: «больше нас не увидит»."
    2: "Пещера Дракона на Изумрудном острове"
    3: "Фрагмент дневника"
  "1518":
    1: "-Хэйрбоу.  Разведите сигнальные костры, когда поймёте, что люди наиболее уязвимы.  Мы прибудем в течение нескольких дней после того, как увидим ваш сигнал!  Не предавайте меня больше!  Если хотите выжить в моём племени, вы должны отбросить свои личные интересы.  Грогнар Великий!"
    2: "Замок Хармондэйл — либо явно размещенный, либо расположенный на гоблине"
    3: "Письмо Хэрбоу"
  "1519":
    1: "Дорогой мистер Мальвик,  уже давно не получал от вас вестей.  Надеюсь, это письмо застанет вас в добром здравии.  Вы должны были регулярно присылать нам сообщения, чтобы мы были в курсе хода вашей «кампании по вербовке».  Очень важно, чтобы вы нашли подходящих людей.  С Маркхэмом нужно поступить правильно… и тогда Хармондейл будет нашим.  Как только вы завершите эту задачу, я уверен, что мы сможем договориться о том, чтобы вернуть вас домой и списать ваш долг.  — Найлс"
    2: "Эратские канализационные коллекторы"
    3: "Письмо от г-на Стэнтли"
  "1520":
    1: "Запись в дневнике от 23 апреля 1058 года  Пусть Солнце освещает мой путь и ведёт меня в этот день.  Сегодня к нам поступило известие, что Храм Луны направил вооружённый отряд в Найгон. Было решено, что я возглавлю часть своих братьев, чтобы попытаться предотвратить то гнусное деяние, которое они замышляют.  Да озарит нас Солнце и да положит конец этой войне как можно скорее.  Сражения на севере разорвали равнины Бракады.  Если мы продолжим эту войну, мы рискуем уничтожить ту самую землю, которую пытаемся спасти..."
    2: "Великий храм Солнца"
    3: "«Запись в дневнике, 23 апреля»"
  "1521":
    1: "Запись в дневнике от 30 июня 1059 года  Да осветит Солнце истину и разгонит тьму.  Каменный круг здесь, в Найгоне, больше не существует.  Пытаясь остановить последователей Луны, мы способствовали разрушению того, что были призваны защищать. Осталось лишь несколько братьев.  Мы попробуем вернуться в Великий Храм Солнца.  Если этот дневник будет найден, значит, нам не удалось.  Я надеюсь, что те, кто прочитает это, поймут: мы не хотели никому причинить вреда.  Мы лишь стремились защитить.  Да направит Солнце наши шаги сквозь грядущую тьму..."
    2: "Боль в груди"
    3: "«Запись в дневнике, 30 июня»"
  "1522":
    1: "…наконец-то мне удалось избавиться от этой проклятой земли. У меня и так хватает проблем — мне уж точно не нужно, чтобы к ним добавился вековой конфликт между эльфами и людьми. К счастью, мой план сработал на славу: эта небольшая группа согласилась на территорию, за которую я бы ни за что не смог заплатить, чтобы кто-то её занял. Теперь осталось только укрепить своё положение в Каре…"
    2: "Усадьба лорда Маркхэма"
    3: "Отрывок из дневника"
  "1523":
    1: "Велатир,  наши набеги оказались весьма успешными; наше расположение позволяет нам наносить удары по двум маршрутам: из Эратии в Дейю и из Эратии в Хармондэйл.  Мы поступили так, как ты и советовал, и проводили наши операции достаточно редко, чтобы не допустить прямого вмешательства со стороны эратских войск.  Кроме того, наша пещера скрыта настолько хорошо, что случайного наблюдения будет недостаточно, чтобы её обнаружить.  Ваша оплата сейчас находится на стадии завершения и вскоре будет отправлена вам.  Лаерат"
    2: "Пещеры бандитов"
    3: "Письмо"
  "1524":
    1: "Запись в дневнике, 11 декабря 1059 года  Да поразит Солнце тьму и раскроет истину  Мы добрались до Даунса.  Всё изменилось.  Призраки и гоги заполонили эту местность.  Брат Питер был похищен чем-то ночью.  Похоже, курганы излили своё зло на окрестности. Брат Кристиан и я пытаемся добраться до особняка, о котором я знаю, на дальнем востоке этой области.  Мы с ним остались единственными.  Да направит Солнце наш путь..."
    2: "Барроу-Даунс"
    3: "«Запись в дневнике, 11 декабря»"
  "1525":
    1: "Капитан Харрет,  хотя мы не ожидаем каких-либо прямых угроз со стороны Дейи или эльфов, я хотел бы, чтобы вы следили за деятельностью бандитов.  У меня есть подозрение, что бандиты гораздо лучше организованы, чем они хотят нас заставить поверить.  Не стесняйтесь уничтожать их, но не ослабляйте из-за этого Форт Риверстрайд чрезмерно.  Генерал Даггерсон"
    2: "Форт Риверстрайд"
    3: "Заказы от компании «Стедвик»"
  "1526":
    1: "Запись в дневнике, 2 января 1057 года  Солнце ведёт мои шаги по пути к истине.  Великий Храм послал меня в Таталию с миссией по вербовке новых последователей.  Мы надеемся укрепить нашу веру и пополнить наши ряды.  Последователи Луны преследуют какой-то великий план. Да остановит их Солнце в их тьме..."
    2: "Таталия"
    3: "«Запись в дневнике, 2 января»"
  "1527":
    1: "Запись в дневнике 19 сентября 1057 года  Солнце ведёт меня и защищает от лжи.  Я отправился в Дейю, чтобы собственными глазами увидеть ужасные последствия деяний некромантов.  Ходят слухи, что они сотрудничают с последователями Луны.  Это невозможно, ведь их объединенная сила была бы непобедима.  Пусть Солнце выведет меня из тьмы..."
    2: "Дейя"
    3: "«Запись в дневнике, 19 сентября»"
  "1528":
    1: "..всё идёт хорошо.  Нам удалось найти идеальное место для установки подъёмного двигателя — рядом с постоянным источником паровой энергии.  При надлежащем обслуживании этот двигатель должен работать вечно.  Металлы, которые мы обнаружили на нижнем уровне, гораздо лучшего качества, чем тот хлам наверху; правда, драгоценных камней и драгоценных металлов мы пока не видели.  Надеюсь, завтрашние раскопки принесут что-нибудь получше.  12 августа 1167 года  Мы пробили проход в том, что, по-видимому, было естественной пещерой, и обнаружили ужасное существо с телом змеи и женским человеческим туловищем.  Одного лишь взгляда этих существ хватило, чтобы превратить наших шахтёров в камень.  Остальные из нас бежали, а Дратен Кельдин, наш инженер, остался, чтобы попытаться вывести лифт из строя.  Я не уверен, где это существо..."
    2: "Шахты «Красного карлика»"
    3: "Запись в дневнике"
