    1: "«Сопротивление земле»: Временно повышает сопротивление земле на величину, равную утроенной силе зелья, на 30 минут за каждое очко силы зелья.  Для приготовления этого зелья вам понадобится правильная комбинация из трёх красных реагентов любого типа, одного синего реагента любого типа и  двух жёлтых реагентов."
    2: "Сопротивление земле"
    3: "Рецепт зелья «Сопротивление земле»"
  "1572":
    1: "«Сопротивление разуму»: Временно повышает сопротивление разуму на величину, равную утроенной силе зелья, на 30 минут за каждое очко силы зелья.  Чтобы приготовить это зелье, вам понадобится правильная комбинация из двух красных реагентов любого типа, трёх синих реагентов любого типа и  одного жёлтого реагента."
    2: "Сопротивление разуму"
    3: "Рецепт зелья «Сопротивление разуму»"
  "1573":
    1: "«Сопротивление телу»: Временно повышает сопротивление телу на величину, равную утроенной силе зелья, на 30 минут за каждое очко силы зелья.  Для приготовления этого зелья вам понадобится правильная комбинация: один реагент любого типа из красных, два реагента любого типа из синих и  три реагента из жёлтых."
    2: "Сопротивление телу"
    3: "Рецепт зелья «Сопротивление телу»"
  "1574":
    1: "Серые зелья — катализаторы — можно смешивать друг с другом, чтобы получить зелье с более высокой силой действия. Применение заклинания «Зачаровать предмет» к достаточно сильному катализатору превратит его в философский камень."
    2: "Лаборатория Кланкера"
    3: "Подсказка по «Философскому камню»"
  "1575":
    2: "774"
    3: "Пустой свиток"
  "1576":
    2: "775"
    3: "Пустой свиток"
  "1577":
