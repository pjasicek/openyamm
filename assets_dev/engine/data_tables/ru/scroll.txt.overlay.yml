  "716":
    1: "«Пламенное зелье»: Наделяет немагическое оружие свойством «Пламя» на 30 минут за каждое очко силы зелья. Чтобы приготовить это зелье, необходимо смешать в нужном соотношении два красных реагента любого типа, один синий реагент любого типа и два жёлтых реагента."
    2: "Пламенное зелье"
    3: "Рецепт зелья «Пламенное зелье»"
  "717":
    1: "«Морозное зелье»: Наделяет немагическое оружие свойством «Мороз» на 30 минут за каждое очко силы зелья. Для приготовления этого зелья необходимо смешать правильную комбинацию из двух реагентов любого красного типа, двух реагентов любого синего типа и одного желтого реагента."
    2: "Морозное зелье"
    3: "Рецепт зелья «Морозное зелье»"
  "718":
    1: "«Ядовитое зелье»: Наделяет немагическое оружие свойством «Яд» на 30 минут за каждое очко силы зелья. Чтобы приготовить это зелье, необходимо использовать правильную комбинацию: один реагент любого красного типа, два реагента любого синего типа и два реагента желтого типа."
    2: "Ядовитое зелье"
    3: "Рецепт зелья «Ядовитое зелье»"
