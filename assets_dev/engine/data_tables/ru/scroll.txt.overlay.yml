  "1542":
    1: "«Омоложение»: Устраняет последствия магического старения. Чтобы приготовить такое зелье, необходимо подобрать правильное сочетание по три единицы каждого из исходных реагентов."
    2: "Омоложение"
    3: "Рецепт зелья «Омоложение»"
  "1543":
    1: "«Чистая сила»: Навсегда повышает силу на 50.  Увеличение постоянной Силы способно превратить ЛЮБОГО в боевую машину.  Для приготовления этого зелья необходимо правильно скомбинировать четыре красных реагента любого типа, два синих реагента любого типа и один жёлтый реагент."
    2: "Чистая сила"
    3: "Рецепт зелья «Чистая сила»"
  "1544":
    1: "«Чистая меткость»: Навсегда повышает меткость на 50.  Дополнительная постоянная Меткость способна превратить ЛЮБОГО в настоящую боевую машину.  Для приготовления этого зелья необходимо соединить в правильной комбинации четыре жёлтых реагента любого типа, два красных реагента любого типа и один синий реагент."
    2: "Чистая меткость"
    3: "Рецепт зелья «Чистая меткость»"
  "1545":
    1: "«Чистая харизма»: Навсегда повышает харизму на 50. Для приготовления этого зелья вам понадобится правильная комбинация: один реагент любого типа красного цвета, четыре реагента любого типа синего цвета и два реагента желтого цвета."
    2: "Чистая харизма"
    3: "Рецепт зелья «Чистая харизма»"
  "1546":
    1: "«Чистая выносливость»: Навсегда повышает выносливость на 50.  Увеличение постоянной выносливости способно превратить ЛЮБОГО в боевую машину, повысив его количество очков здоровья далеко за пределы нормы.  Для приготовления этого зелья необходимо использовать правильную комбинацию из двух красных реагентов любого типа, четырёх синих реагентов любого типа и одного жёлтого реагента."
    2: "Чистая выносливость"
    3: "Рецепт зелья «Чистая выносливость»"
  "1547":
    1: "«Чистый интеллект»: Навсегда повышает интеллект на 50. Для приготовления этого зелья вам понадобится правильная комбинация: один реагент любого типа из красных, два реагента любого типа из синих и четыре реагента из жёлтых."
    2: "Чистый интеллект"
    3: "Рецепт зелья «Чистый интеллект»"
  "1548":
    1: "«Чистая скорость»: Навсегда повышает скорость на 50.  Дополнительная постоянная скорость может оказаться именно тем, что нужно, чтобы успеть восстановиться и действовать раньше монстров.  Быстроты много не бывает. Чтобы приготовить это зелье, вам понадобится правильная комбинация из четырёх красных реагентов любого типа, двух синих реагентов любого типа и одного жёлтого реагента."
    2: "Чистая скорость"
    3: "Рецепт зелья «Чистая скорость»"
  "1549":
    1: "«Чистая удача»: Навсегда повышает удачу на 50.  Дополнительная постоянная удача может оказаться именно тем, что нужно, чтобы успеть увернуться до срабатывания ловушки.  Удачи много не бывает. Для приготовления этого зелья вам понадобится правильное сочетание четырёх красных реагентов любого типа, трёх синих реагентов любого типа и двух жёлтых реагентов."
    2: "Чистая удача"
    3: "Рецепт зелья «Чистая удача»"
  "1550":
    1: "«Зелье истребления»: Наделяет немагическое оружие свойством «Истребление драконов».  Чтобы приготовить это зелье, необходимо смешать три реагента любого красного типа, три реагента любого синего типа и  два реагента жёлтого типа в правильном соотношении."
    2: "Зелье истребления"
    3: "Рецепт зелья «Зелье истребления»"
  "1551":
