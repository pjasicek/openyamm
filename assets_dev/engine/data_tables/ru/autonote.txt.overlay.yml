  "460":
    1: "Хеджадж Маусил будет покупать яйца кобры по 300 золотых за штуку в Новом Сорпигале."
  "461":
    1: "Лоуренс Алеман купит в Свободной гавани храмовые гонги по 2000 золотых за штуку."
  "462":
    1: "Лон Миллер будет покупать кости по 1000 золотых за штуку в Свободной гавани."
  "463":
