  "470":
    1: "В Бандар-Джахроме в курортном отеле «Абулс Дезерт» в Драгонсанде можно обменять драгоценные камни на лампы."
  "471":
    1: "Теперь вам предстоит уничтожить улей Криганов. Уничтожьте реактор, победите их королеву и обязательно спаситесь, унеся с собой «Ритуал Пустоты» — тогда вы успешно выполните свою задачу."
  "472":
    1: "Прежде чем уничтожить реактор, вам понадобится заклинание, способное сдержать последующие взрывы. Вы должны освободить Арчибальда из его каменной тюрьмы. Поговорите с Николаем и принесите ему «Третье око» — он позволит вам использовать «Колокол Танира», чтобы вернуть Арчибальда в нормальное состояние. После этого вам должно удастся убедить Арчибальда поделиться с вами необходимыми знаниями."
  "473":
    1: "Чтобы получить доступ к Центру управления, вам понадобится Куб управления, находящийся в Храме Варна в Драконьем Песке. Отнесите Куб к Оракулу, чтобы получить доступ к Центру управления. Реактор Кригана неуязвим для любых атак. Нанести урон реактору могут только древние оружия из Центра управления. Убедитесь, что у вас есть эти оружия и навык их использования."
  "474":
    1: "Оракул спит с тех пор, как Арчибальд устроил с ним свои проделки. Чтобы оживить Оракула, вам понадобятся четыре кристалла памяти. Их можно найти на Острове Отшельника, в замке Аламос, в замке Кригспайр и в замке Даркмур."
  "475":
    1: "Похоже, что Сликкер Сильвертонг — предатель в Совете. Вам понадобятся доказательства, чтобы убедить регента Хамфри и добиться отстранения Сликкера от должности в Совете. Отправляйтесь в Верхний храм Баа в Кригспайре и вернитесь с доказательствами, связывающими Сликкера с храмом Баа."
  "476":
    1: "Чтобы посетить Оракула, вам необходимо заслужить расположение шести членов Высшего совета в Свободной гавани. Каждый лорд поручит вам задание, за выполнение которого вы сможете завоевать его благосклонность. Выполните каждое из этих заданий, а затем поговорите с членом Совета, представляющим этого лорда, чтобы получить его одобрение. Как только все члены Высшего совета дадут своё разрешение, вам будет позволено посетить Оракула."
  "477":
    1: "Я бы посоветовал вам выполнить задания на повышение шести лордов Энрота, прежде чем продолжить путь."
