    1: "Так вы считаете себя искателями приключений, да?\nУ вас даже мяса не хватит, чтобы выдержать пощечину от маленького тролля!\nБодибилдинг — единственный выход.\nВы станете сильнее и выносливее, чем раньше!\nМастер бодибилдинга гораздо выносливее, чем обычный герой.\nЯ могу научить вас этому, если ваш уровень навыка «Эксперт» равен 7, вы заплатите 2500 золотых и у вас выносливость 50! Без труда не вытащишь рыбку из пруда!"
  "1348":
    1: "Так вы считаете себя искателями приключений?\nДа у вас не хватит сил устоять даже под ударом маленького дракончика!\nБодибилдинг — единственный выход.\nВы станете сильнее и выносливее!\nВеликий мастер бодибилдинга — самый крепкий герой из всех, кого можно встретить.\nЯ обучу вас, если ваш навык достиг уровня мастера (9), у вас не меньше 50 единиц выносливости и вы заплатите 6000 золотых. Без труда не вытащишь и рыбку из пруда!"
  "1349":
    1: "Не хватает очков заклинаний для произнесения заклинаний уровня «Эксперт»?\nВам нужна медитация.\nПри навыке «Медитация» уровня «Эксперт» вы получаете двойной бонус к доступным очкам заклинаний.\nЭто может означать возможность произнести ещё одно мощное заклинание, когда оно вам больше всего нужно!\nВы сможете получить навык уровня «Эксперт», если ваш уровень навыка равен 4 и вы заплатите мне 500 золотых."
  "1350":
    1: "Не хватает очков заклинаний для применения заклинаний уровня «Мастер»?\nВам нужна медитация.\nПри уровне навыка «Мастер» в медитации вы получаете тройной бонус к доступным очкам заклинаний.\nЭто может означать возможность использовать ещё одно мощное заклинание, когда оно вам больше всего нужно!\nВы сможете достичь уровня «Мастер», если ваш уровень навыка «Эксперт» равен 7 и вы заплатите мне 2500 золотых."
  "1351":
    1: "Не хватает очков заклинаний для применения заклинаний уровня «Великий мастер»?\nВам нужна медитация.\nПри уровне навыка «Великий мастер» в медитации вы получаете четырехкратный бонус к доступным очкам заклинаний.\nЭто может означать возможность использовать одно или несколько мощных заклинаний именно тогда, когда они вам нужны больше всего!\nВы сможете достичь уровня «Великий мастер», если ваш уровень навыка «Мастер» равен 10 и вы заплатите мне 6000 золотых."
  "1352":
    1: "Иногда в подземельях и замках этой земли прячутся различные предметы.\nВозможно, вы что-то упустили, даже не подозревая об этом.\nНавык «Восприятие» повышает ваши шансы найти эти спрятанные предметы. Мастерство в навыке «Восприятие» удваивает ваши шансы найти эти спрятанные предметы.\nЗа 500 золотых и при 4-м уровне навыка «Восприятие» я научу вас этому."
  "1353":
    1: "Иногда в подземельях и замках этой земли прячутся различные предметы.\nВозможно, вы что-то упустили, даже не подозревая об этом.\nНавык «Восприятие» повышает ваши шансы найти эти спрятанные предметы. Мастерство в навыке «Восприятие» утраивает ваши шансы найти эти спрятанные предметы.\nЗа 2500 золотых и уровень навыка «Восприятие» 7 (уровень «Эксперт») я научу вас этому."
  "1354":
    1: "Иногда в подземельях и замках этой земли прячутся различные предметы.\nВозможно, вы что-то упустили, даже не подозревая об этом.\nНавык «Восприятие» повышает ваши шансы найти эти спрятанные предметы. Мастерство высшего уровня в навыке «Восприятие» увеличивает ваши шансы найти их в пять раз. За 6000 золотых и при уровне «Мастер» 10 в навыке «Восприятие» я научу вас этому."
  "1355":
    1: "Мой брат Элрон был заядлым игроком в «Аркомадж».\nА ты уже играл в «Аркомадж»?\nУжасно увлекательная игра, если можно так сказать.\nВ любом случае, играть можно только если у тебя есть колода, а колоды достать нелегко… так что, наверное, ты ещё не играл.\nВ любом случае, Элрон хотел проработать некоторые стратегии, чтобы чаще выигрывать.\nК сожалению, он не хотел оставаться в городе, чтобы никто не подглядывал за ним и не узнал его хитрости, поэтому он отправился в пещеры Белого Утеса, расположенные чуть юго-восточнее города. Элрон не возвращался уже почти неделю.\nЯ уверен, что с ним случилось что-то ужасное, но если он жив, я бы тоже хотел это знать.\nНе могли бы вы оказать мне услугу и разыскать его?\nУ меня не так много денег, чтобы отплатить вам, но я буду вам безмерно благодарен."
  "1356":
    1: "Его всё ещё нет?\nПонимаю.\nЕсли вам всё-таки удастся выяснить, что с ним случилось, пожалуйста, дайте мне знать."
  "1357":
    1: "Погиб?\nОй, боже мой!\nНо это, безусловно, его карты.\nМне эти карты не нужны; можешь их забрать — эта игра и так уже дорого мне обошлась.\nО, бедный Элрон!\nУ меня есть немного денег, которые ты можешь оставить себе за помощь, и спасибо, что выяснил, что случилось с Элроном."
  "1358":
    1: "Школа магии, расположенная здесь, в пустыне Бракада, хранит множество странных магических предметов.\nНесколько лет назад из Школы был похищен предмет, представляющий особый интерес, — его унесли налетчики из Дейи.\nЭтот предмет, Палантин времён года, носили жрецы Солнца во время религиозных церемоний при смене времён года.\nКак представитель Школы магии, я уполномочен вознаградить вас за его возвращение.\nПо последним данным, похищенный палантин находится в Зале Ямы; я бы посоветовал сначала проверить именно там."
  "1359":
    1: "Не забудьте, что за Палантин времён года предусмотрено вознаграждение, если вам удастся его найти и вернуть мне."
  "1360":
    1: "Превосходно!\nЭто, без сомнения, Палантин времён года.\nВот твоя награда; ты оказал огромную услугу как Школе магии, так и мне лично."
  "1361":
    1: "Надоело, что сундуки взрываются прямо у вас перед носом?\nУстали от ядовитого газа, огненных шаров и молний, отправляющих спутников на тот свет?\nНа уровне эксперта навык «Обезвреживание ловушек» вдвое повышает шанс справиться с ловушкой до её срабатывания.\nЯ обучу вас за 500 золотых, если навык достиг 4-го уровня."
  "1362":
    1: "Надоело, что сундуки взрываются прямо у вас перед носом?\nНадоели облака ядовитого газа, огненные шары и молнии, отправляющие членов вашей группы на тот свет?\nНавык «Мастерство в взломе замков» в три раза увеличивает ваши шансы обезвредить эти ловушки до того, как они сработают.\nЯ научу вас навыку «Мастерство в взломе замков», если у вас уровень навыка «Эксперт» равен 7 и вы можете заплатить 2500 золотых."
  "1363":
    1: "Надоело, что сундуки взрываются прямо у вас перед носом?\nУстали от облаков ядовитого газа, огненных шаров и молний, отправляющих членов вашей группы на тот свет?\nНавык «Взлом замков на уровне Великого мастера» полностью устраняет эти надоедливые ловушки ещё до того, как они сработают.\nЯ научу вас навыку «Взлом замков на уровне Великого мастера», если у вас уровень мастерства «Мастер» равен 10 и вы можете заплатить 6000 золотых."
  "1364":
    1: "Лучшая защита от атаки — это не находиться на месте, когда она совершается.\nКонечно, для этого нужно быть быстрым и ловким, а также не носить доспехов. Хотя навык «Уклонение» и делает вас более труднопопаваемым, этот бонус удваивается, если вы освоили мои уроки на уровне «Эксперт».\nЯ обучу вас, если у вас уровень навыка «Уклонение» равен 4 и вы заплатите 2000 золотых."
  "1365":
    1: "Лучшая защита от атаки — это не находиться на месте, когда она совершается.\nКонечно, для этого нужно быть быстрым и ловким, а также не носить доспехов. Хотя навык «Уклонение» и так затрудняет попадание по вам, этот бонус утраивается, если вы освоили «Мастерство уклонения».\nЯ обучу вас, если у вас уровень навыка «Эксперт» 7 в «Уклонении» и вы заплатите 5000 золотых."
  "1366":
    1: "Лучшая защита от удара — не оказаться на его пути.\nДля этого нужны быстрота и ловкость, а ещё обычно приходится обходиться без доспехов. Но великий мастер уклонения сохраняет все преимущества навыка даже в кожаных доспехах, а бонус к защите утраивается.\nЯ обучу вас, если «Уклонение» достигло уровня мастера (10), «Бой без оружия» достиг уровня мастера (10) и вы заплатите 8000 золотых."
  "1367":
    1: "Рукопашный бой — самый быстрый способ сражаться.\nНикакое оружие не замедлит вас. Благодаря моим урокам для экспертов вы научитесь наносить больше урона каждым ударом, который попадает по врагу. У вас должен быть 4-й уровень навыка «Рукопашный бой», и вам нужно будет заплатить мне 2000 золотых."
  "1368":
    1: "Хотите освоить бой без оружия на уровне мастера?\nЭтот уровень удвоит прибавку к атаке и урону каждого удара.\nДля обучения требуется навык уровня эксперта (7) и 5000 золотых."
  "1369":
    1: "Достигнув уровня «Великий мастер» в «Бое без оружия», вы сможете полностью уклоняться от атак, что позволит вам беспрепятственно сразить противника.\nЧтобы получить мои наставления, вам необходимо продемонстрировать уровень мастерства «Мастер» (10) в «Бое без оружия», уровень мастерства 10 в «Уклонении» и заплатить 8000 золотых."
  "1370":
    1: "Знание того, с чем вам приходится сталкиваться в бою, может стать решающим фактором, определяющим жизнь или смерть.\nУмение опознавать монстров и противников, с которыми вы сражаетесь, может сыграть решающую роль. Я могу научить вас навыку «Экспертная опознание монстров», если у вас уже есть 4-й уровень этого навыка и вы заплатите 500 золотых."
  "1371":
    1: "Тот, кто сегодня убегает, останется в живых, чтобы убежать в другой раз.\nОднако это не обязательно означает, что он трус.\nВозможно, он просто очень умен.\nВозможно, он знает, как атакует его противник и какие заклинания тот может использовать, если вообще будет их применять.\nЯ могу научить вас заклинанию «Опознание монстров на уровне мастера», если вы достигли 7-го уровня навыка «Эксперт» и можете заплатить 2500 золотых."
  "1372":
    1: "Если вы сможете проанализировать оборону противника и выявить его слабые места, вы всегда будете побеждать.\nОбладая навыком «Опознание монстров» на уровне «Великий мастер», вы будете знать, как атакует ваш противник и какова его оборона.\nЭти знания позволят вам наносить удары по его самым уязвимым местам. Я могу повысить ваш уровень этого навыка до «Великого мастера», если у вас уровень «Мастер» равен 10 и вы заплатите 6000 золотых."
  "1373":
    1: "Знание одного вида оружия — это отлично.\nА знание всех видов оружия — это ещё лучше.\nНавык «Мастер оружия» позволяет сократить время восстановления любого оружия ближнего боя, которым вы уже владеете, и даёт шанс нанести больший урон.\nЯ могу сделать вас «Экспертом по оружию», если у вас уровень навыка 4 и вы заплатите 2000 золотых."
  "1374":
    1: "Умение владеть одним видом оружия ближнего боя — это отлично.\nА умение владеть всеми видами оружия ближнего боя — это ещё лучше.\nНавык «Мастер оружия» позволяет сократить время восстановления любого оружия ближнего боя, которым вы уже владеете, и даёт шанс нанести больший урон.\nЯ могу сделать вас «Мастером оружия», если у вас уровень навыка «Эксперт» равен 7 и вы заплатите 5000 золотых."
  "1375":
    1: "Умение владеть одним видом оружия ближнего боя — это отлично.\nА умение владеть всеми видами оружия ближнего боя — это ещё лучше.\nНавык «Мастер оружия» сокращает время восстановления любого оружия ближнего боя, которым вы уже владеете, и даёт шанс нанести больший урон.\nЯ могу сделать вас «Великим мастером оружия», если у вас уровень навыка «Мастер» равен 10 и вы заплатите 8000 золотых."
  "1376":
    1: "Не хочется платить за товар в магазине?\n«Пятипальцевая скидка» позволяет взять предмет бесплатно.\nЯ обучу вас краже на уровне эксперта за 500 золотых, если навык достиг 4-го уровня.\nЭто вдвое повысит шанс на успех!"
  "1377":
    1: "Не хватает золота? Или бесплатное всегда лучше платного?\nЕсли навык «Кража» достиг уровня эксперта (7) и у вас есть 2500 золотых, я обучу вас до уровня мастера. Это втрое повысит шанс на успех!"
  "1378":
    1: "Хочешь сохранить всё это с таким трудом заработанное золото, да?\nНе хочешь платить за замену того сломанного предмета, который нельзя починить? Как Великий мастер воровства я могу научить тебя способам, которые в пять раз увеличат твои шансы на успех при краже.\nУ тебя уже должен быть уровень мастерства «Мастер» (10), и ты должен заплатить мне 6000 золотых!"
  "1379":
    1: "Надоели простые смеси для зелий?\nХотите приготовить что-то новое и мощное?\nХотите создавать сложные зелья?\nЯ обучу вас алхимии до уровня эксперта, если ваш навык достиг 4-го уровня и вы заплатите 500 золотых."
  "1380":
    1: "Хотите узнать, как использовать зелья и составные зелья для приготовления белых зелий?\nЯ могу повысить ваш уровень знаний по алхимии до «Мастера», если у вас есть навык «Эксперт» 7-го уровня и вы заплатите 2500 золотых."
  "1381":
    1: "Чёрное зелье — это величайшее творение алхимика!\nОно способно оказывать самое разнообразное воздействие и к тому же имеет восхитительный вкус!\nВы сможете овладеть «Великим мастерством алхимии», если ваш уровень навыка «Мастер» в алхимии достигнет 10, у вас будет по одному экземпляру каждого из лучших реагентов и вы заплатите 6000 золотых."
  "1382":
    1: "Обучение позволяет вам получать больше опыта от путешествий и новых знакомств. «Экспертное обучение» удваивает бонус к получаемому опыту, ведя вас по пути к большей мудрости.\nЯ обучу вас «Экспертному обучению», если ваш уровень навыка равен 4 и вы заплатите мне 2000 золотых."
  "1383":
    1: "Навык «Мастерство обучения» позволяет вам получать больше опыта от путешествий и новых знакомств. «Мастерство обучения» утраивает бонус к получаемому опыту, ведя вас по пути к большей мудрости.\nЯ обучу вас навыку «Мастерство обучения», если у вас уровень навыка «Эксперт» равен 7, вы заплатите мне 5000 золотых и ваш показатель интеллекта составляет 50."
  "1384":
    1: "Обучение позволяет вам получать больше опыта от путешествий и новых знакомств. Навык «Обучение великого мастера» в пять раз увеличивает бонус к получаемому опыту, ведя вас по пути к большей мудрости.\nЯ обучу вас навыку «Обучение великого мастера», если у вас уровень навыка «Мастер» равен 10, вы заплатите мне 8000 золотых и ваш показатель интеллекта составляет 50."
  "1385":
    1: "Томас Грей руководит Школой волшебства.\nЕсли вы хотите получить звание волшебника или почетного волшебника, он — тот, кто вам нужен.\nЕго кабинет находится прямо за дверью позади меня."
  "1386":
    1: "Хотите стать членом клуба «Магазин свитков Школы волшебства»?\nЧленство дает вам бесплатный доступ к свиткам, имеющимся в нашей библиотеке.\nСтоимость шестимесячного членства составляет 5000 золотых, но ассортимент магазина пополняется раз в неделю."
  "1387":
    1: "Вот членский билет — не забудьте, что он действителен только шесть месяцев.\nЗагляните на полки в передних залах, чтобы посмотреть, что есть в наличии."
  "1388":
    1: "У тебя недостаточно золота — бесполезно пытаться обмануть волшебника."
  "1389":
    1: "Ты хочешь похоронить останки Зокарра IV в наших старых курганах?\nНи один из местных гномов не рискнет подвергнуться опасности, но Зокарр заслуживает того, чтобы его похоронили в надлежащем месте.\nНайди тайный курган — тот, у которого только один вход.\nТам стоит гроб, готовый принять останки Зокарра."
  "1390":
    1: "Нам не к кому обратиться, кроме вас, новых лордов Хармондэйла. «Фонарь Света» — это драгоценная священная реликвия, используемая в храмах Эратии.\nЕё ценность скорее символическая, чем связанная с силой — без неё служители храмов теряют веру.\nЭтот Фонарь пропал, когда его перевозили в этот храм из храма в Каменном Городе.\nМы полагаем, что он затерялся где-то в лабиринтообразных Барроуз.\nПожалуйста, найдите его и верните нам."
  "1391":
    1: "Вы уже нашли «Фонарь света»?\nМы уверены, что он затерялся в лабиринте курганов в Барроу-Даунс."
  "1392":
    1: "Благодарим вас, лорды Хармондэйла.\nВозвращение «Фонаря» укрепит нашу веру и позволит нам продолжить наше служение.\nПримите, пожалуйста, эту скромную награду в знак нашей благодарности."
  "1393":
    1: "Ой, брат, Халдар скончался в прошлом месяце.\nСемья отправляла мне его останки, чтобы я уложил его в последний путь.\nС теми, кто доставлял мне эти останки, что-то случилось: они исчезли в Найгоне, и с тех пор о них нет никаких известий. Боюсь, душа моего брата никогда не обретет покой, пока их не найдут!\nПожалуйста, верни мне Халдара, если найдешь его. Я щедро вознагражу тебя за это!"
  "1394":
    1: "Ты нашёл останки Халдара?\nЕго душа, наверное, испытывает невыносимые муки!\nПожалуйста, найди сосуд с его останками!"
  "1395":
    1: "Спасибо, что вернули мне останки моего «брата»!\nОн был многообещающим чародеем, и его жизнь оборвалась слишком рано.\nТеперь, когда у меня есть его останки, я постараюсь воскресить его в образе лича, и вместе мы будем стремиться к великой силе и славе!"
  "1396":
    1: "Милорды, по возвращении из Авли на меня напали гнусные разбойники, и они отобрали у меня всё, что я привёз от эльфов.\nОни даже забрали моё перстень с печатью!\nБез него я не могу продолжать свой бизнес, потому что не могу скреплять печатью договоры между мной и другими купцами.\nЯ слышал, что бандиты обосновались в лагере в Эратии, но я не воин — я не продержался бы против них и минуты.\nПожалуйста, отправляйтесь в Эратию и восстановите справедливость!"
  "1397":
    1: "Ты ещё не нашёл моё кольцо?\nБандиты находятся к югу от замка Грифонхарт в Эратии.\nПожалуйста, помоги мне, мне больше не к кому обратиться."
  "1398":
    1: "Мое кольцо!\nСпасибо вам, господа.\nТеперь я смогу продолжить свои дела и возместить убытки, а вы сделали торговые пути более безопасными для всех купцов!"
  "1399":
    1: "Так вы, значит, лорды Хармондэйла, да?\nВы не выглядите чем-то особенным; посмотрим, как вас оценит история!\nЯ сам историк и коллекционер редких исторических предметов.\nЛорд Маркхэм также коллекционирует подобные интересные предметы, и есть один предмет, который, в частности, дополнил бы мою коллекцию — «Перо Парсона» — то самое перо, которым был подписан Пирпонтский договор, положивший конец первой Лесовой войне.\nЯ знаю, что вы уже имели дело с лордом Маркхэмом — ведь именно так вы и стали лордами этой земли, — и если бы вы доставили это письмо лорду Маркхэму в Таталию, я уверен, что он откликнется на него благосклонно.\nЯ буду вам ещё более благодарен, если лорд Маркхэм отправит этот предмет обратно с вами!\nЯ обязательно благосклонно запишу ваши героические поступки и деяния!"
  "1400":
    1: "Лорд Маркхэм отказался отдать тебе «Перо», или ты ещё даже не навещал его?\nЕго поместье находится в Таталии, пожалуйста, не забудь мне помочь."
  "1401":
    1: "Настоящее перо павлина, которым был подписан Пирпонтский договор.\nМоя коллекция в сборе!\nЯ обязательно точно и справедливо зафиксирую ваши действия и поступки, чтобы все узнали вас как истинных лордов Хармондейла!"
  "1402":
    1: "Письмо от историка Норберта Траша? Дайте-ка посмотреть.\n[Лорд Маркхэм бегло просматривает письмо] Хм… так он хочет перо павлина, которым подписали Пирпонтский договор, да?\nЧто ж, раз у него якобы есть оригинал договора, пожалуй, перо должно достаться ему.\nОн пообещал мне всё остальное из своей коллекции.\nОтнеси это ему и передай, что я скоро приеду забрать у него!"
  "1403":
    1: "Слышал, вы, ребята, теперь новые лорды Хармондейла, да?\nМожет быть, вы окажете мне большую услугу и при этом сами извлечете из этого выгоду.\nК северу, в Авли, находится «Зал под холмом» — владения Короля фей.\nОн у меня в долгу за одну из моих прежних услуг, и я хотел бы его взыскать.\nК сожалению, феи в этом Зале и их проделки пугают меня до смерти.\nЕсли вы доставите это письмо Королю фей и принесёте мне то, что он вам даст, я буду вам очень благодарен.\nКроме того, у вас будет возможность лично познакомиться с Королём фей."
  "1404":
    1: "Отлично!\nТрубы!\nТы даже не представляешь, как много это для меня значит.\nВот, возьми награду и ещё раз спасибо за помощь!"
  "1405":
    1: "Не забудь передать письмо Королю фей.\nБез него он, скорее всего, даже не захочет с тобой разговаривать."
  "1406":
    1: "Мы обращаемся к вам с просьбой выполнить всего лишь одно небольшое поручение.\nВ замке Ламбент хранится ценный гобелен, похищенный во время нападения на Сторожевую башню три года назад.\nЯ хотел бы, чтобы вы добыли этот гобелен для меня, ведь у вас, должно быть, есть *какой-то* доступ к замку — мои обычные помощники даже не могут приблизиться к этому месту.\nЯ слышал, что в тех краях бродит большая банда гоблинов и отступников-мечников… Было бы очень жаль, если бы они случайно пробрались в Хармондэйл.\nУ вас есть один месяц, чтобы добыть гобелен.\nНе опоздайте."
  "1407":
    1: "Мы обращаемся к вам с просьбой выполнить одно задание.\nВ замке Глоуминг хранится редкий и ценный гобелен — антикварная вещь из окрестностей Тишины, похищенная у волшебников некоторое время назад.\nЯ хотел бы, чтобы вы добыли этот гобелен для меня, так как мои обычные помощники не имеют доступа в замок Глоуминг.\nВзамен я позабочусь о том, чтобы большая банда отступников-мечников и гоблинов, находящаяся недалеко от Хармондэйла, случайно не наткнулась на вашу тихую маленькую деревушку.\nУ вас есть один месяц; не опоздайте."
  "1408":
    1: "Отлично!\nВижу, что на тебя можно положиться — ты отлично справляешься, когда от тебя этого требуют.\nЯ учту это, когда в следующий раз понадобится что-то сделать.\nТвоя награда — не более чем статус-кво: всё могло бы быть гораздо хуже, чем есть сейчас.\nИди уже, у меня больше нет на тебя времени."
  "1409":
    1: "Понятно.\nЧто ж, похоже, что банда отщепенцев действительно обнаружила ваш маленький городок и приступила к грабежу.\nВозможно, вы обнаружите, что ваш банковский счет немного, ну, похудел.\nСчитайте это уроком пунктуальности.\nА теперь идите и проведите приятный, приятный день."
  "1410":
    1: "Несколько лет назад, ведя горные работы под Каменным Городом, мы столкнулись с настоящим шоком.\nОказалось, что чародеи из Найгона прокопали туннель под морем, чтобы совершить внезапное нападение на побережье Эратии.\nИз-за их неаккуратной работы земля в этих местах просела, и теперь территории вокруг старых гробниц гномов и, конечно же, Каменного Города возвышаются над местностью.\nВ наших горнодобывающих районах мы обнаружили отряд троглодитов, а также туннель, ведущий обратно в Найгон.\nЕсли бы вы помогли нам избавиться от троглодитов в туннелях, мы смогли бы возобновить добычу.\nНе могли бы вы нам помочь?"
  "1411":
    1: "На нижних уровнях шахты до сих пор бродят троглодиты.\nПожалуйста, устраните их!"
  "1412":
    1: "Они ушли?\nОни отступили обратно в соединительные туннели, ведущие в Найгон!\nОтлично!\nМы можем сразу же возобновить добычу!\nБольшое спасибо за помощь; примите это в качестве вознаграждения за ваши услуги."
  "1413":
    1: "Недавно мне стало известно, что войска королевы Кэтрин в Эратии начали формировать армию для нападения на Дейю.\nВвиду сложного рельефа местности они приступили к разведению и дрессировке грифонов, которые будут помогать им в наступлении.\nЭтих грифонов выращивают как в Эратии, так и в пустыне Бракада.\nМне нужно, чтобы ты уничтожил всех грифонов в этих двух районах, чтобы эратианцы были вынуждены значительно отложить свои планы нападения."
  "1414":
    1: "Вы ещё не уничтожили всех грифонов ни в Эратии, ни в пустыне Бракада.\nВам необходимо завершить это задание, чтобы предотвратить их вторжение."
  "1415":
    1: "Ты уничтожил грифонов возле города Спайр, но с грифонами в Эратии тебе ещё предстоит разобраться.\nУничтожь их обоих и вернись ко мне."
  "1416":
    1: "Ты уничтожил грифонов возле Стидвика, но с грифонами в пустыне Бракада тебе ещё предстоит разобраться.\nУничтожь их обоих и вернись ко мне."
  "1417":
    1: "Отлично!\nТы проделал великолепную работу.\nВот, возьми это в качестве награды и знай: своим смелым успехом ты заслужил уважение Дейи."
  "1418":
    1: "«Детёныш дракона» даёт всем чернокнижникам в отряде бонус +3 ко всем навыкам заклинаний и постепенно восстанавливает им очки заклинаний.\nОднако дракон нуждается в пище, чтобы вырасти большим и сильным, поэтому для отдыха требуется дополнительная порция еды."
  "1419":
    1: "Главного инструктора «Штаба», Элси Педертон, можно найти в пустыне Бракада, на горном хребте в юго-западной части региона."
  "1420":
    1: "Учительницу, которая как никто другой владеет искусством обращения с посохом, Джиллиан Митрит, можно найти на эльфийской территории Авли.\nОна живет в городе, расположенном на северо-востоке."
  "1421":
    1: "Тугор Слайсер, мастер фехтования, живёт в небольшой деревне на западе Дейи."
  "1422":
    1: "Великий мастер меча Чадрик Таунсейвер находится в небольшой деревне в Велнине, чуть южнее города Хармондэйл."
  "1423":
    1: "Мастера-наставника «Кинжала», Азнога Слэшера, можно найти в северной части Нигона."
  "1424":
    1: "Великий мастер кинжала Тонкен Фист находится в городе Тайдвотер в Таталии.\nХодят слухи, что мастер-вор, обитающий в глубинах эратских канализационных туннелей под столицей Стидвиком, также может обучать на этом уровне."
  "1425":
    1: "Главного инструктора по всему, что связано с топором, Дэлина Киниджа, можно найти в северо-восточном углу Каменного города."
  "1426":
    1: "Лучшего учителя по владению топором, Карна Стоункливера, можно найти на заснеженных вершинах северо-восточной части Таталии."
  "1427":
    1: "Мастера-учителя Кладерина Сильверпойнта можно найти в северо-восточной части города Пирпонт, расположенного в эльфийском регионе Туларейского леса. Там он поможет вам углубить свои знания в искусстве владения копьем."
  "1428":
    1: "Великая мастерица копья Селин Фалкони обитает в северо-восточной части Каменного города."
  "1429":
    1: "Мастер-наставник по стрельбе из лука, Ланши Рейвенсайт, проживает в северных районах Найгона."
  "1430":
    1: "Великий мастер лука, Кардрик Неуклонный, находится к юго-востоку от замка в городе Хармондэйл."
  "1431":
    1: "Мастера-инструктора по владению булавой, брата Ротхама, можно найти в южной части болот Таталии."
  "1432":
    1: "Великий мастер владения булавой, Патвин Феллберн, преподаёт в своём доме в деревне гоблинов, расположенной в восточной части Дейи."
  "1433":
    1: "Моего наставника, Исрама Галлоузвелла, можно найти на заснеженных высотах в северо-восточной части Таталии. Там вы получите дальнейшие наставления по владению Щитом."
  "1434":
    1: "Великого мастера Щита, Федвина Смитсона, можно найти на восточном острове архипелага Эвенморн."
  "1435":
    1: "Мастер-наставник по кожевенному доспеху Рабиса Недлон проживает в северных районах Нигона."
  "1436":
    1: "Великого мастера по изготовлению кожаных доспехов, Мийона Быстрого, можно найти в восточной части города Пирпонт, расположенного в эльфийском регионе Туларийского леса."
  "1437":
    1: "Медвари Драконтрекер, мастер владения кольчугой, живёт в городе на северо-востоке эльфийской Авли."
  "1438":
    1: "Великий мастер владения кольчугой Халиан Невермор проживает в одном из крупных городов на северо-западе Дейи."
  "1439":
    1: "Мой наставник, Декиан Форджрайт, проживает в Эратии, в столице — городе Стидвик. Он может дать вам дополнительные наставления по использованию пластинчатых доспехов."
  "1440":
    1: "Великий мастер по изготовлению пластинчатых доспехов, Брэнд Мейкер, находится в пустыне Бракада, на горном хребте в центральной части региона."
  "1441":
    1: "Мастера-наставника по магии огня, Эшена Темпера, можно найти в городе Хармондэйл, рядом с конюшнями."
  "1442":
    1: "Великий мастер огненной магии Блейз проживает в Эратии, в столице страны — городе Стидвик."
  "1443":
    1: "Мастер-наставник магии воздуха, Рислин Гринсторм, живет на эльфийской территории Авли.\nЕго дом находится в городе на северо-востоке."
  "1444":
    1: "Великого мастера воздушной магии Гейл можно найти в башне в пустыне Бракада, на горном хребте в северной части региона."
  "1445":
    1: "Мастер-наставник по применению водной магии, Тобрен Рейншилд, проживает в юго-западной части Нигона."
  "1446":
    1: "Великий мастер водной магии Торрент живёт на горном хребте к югу от Хармондэйла, откуда открывается вид на город."
  "1447":
    1: "Мастер-наставница магии Земли Лара Стоунрайт обитает на территории эльфов в Туларейском лесу.\nОна проживает в городе Пирпонт."
  "1448":
    1: "Великий мастер магии Земли, Аваланш, проживает в западной части Дейи."
  "1449":
    1: "Моя наставница, Хизер Дримрайт, живёт в Эратии, где-то в столице — городе Стидвик.\nТам можно получить более глубокие знания в области магии духов."
  "1450":
    1: "Величайшего учителя в искусстве духовной магии, Бенджамина Уравновешенного, можно найти на территории эльфов в Туларейском лесу.\nОн проживает в городе Пирпонт."
  "1451":
    1: "Мастера-учителя в искусстве магии разума, Майлза Фезервинда, можно найти на эльфийской территории Авли.\nОн живет в городе, расположенном к северо-востоку."
  "1452":
    1: "Великий мастер магии разума Ксавье Бремен обитает на заснеженных высотах в северо-восточной части Таталии."
  "1453":
    1: "Мастера-учителя искусства «Магии тела», брата Бомба, можно найти в болотистых районах Таталии.\nЕго дом находится где-то в южной части региона."
  "1454":
    1: "Мастера навыка «Опознание предметов» Сэмюэла Бенсона можно найти на горном хребте в центральной части пустыни Бракада."
  "1455":
    1: "Великого мастера навыка «Опознание предметов» Пейдж Блюсван можно найти на эльфийской территории Авли.\nЕго дом находится к северо-западу от эльфийского города Спауард."
  "1456":
    1: "Мастера навыка «Торговец», Бетольда Кэверхилла, можно найти на самом восточном острове архипелага Эвенморн."
  "1457":
    1: "Великий мастер ремесла «Торговля», Бригам Бережливый, находится в башне в пустыне Бракада, на горном хребте в северной части региона."
  "1458":
    1: "Мастера-преподавателя навыка «Ремонт предметов» Томаса Мура можно найти в болотистой дельте южной части Таталии."
  "1459":
    1: "Великий мастер навыка «Ремонт предметов», Гарет Умелец, ведёт обучение в своём доме в столице Эратии — городе Стидвик."
  "1460":
    1: "Мастера бодибилдинга Ванду Фострик можно найти в деревне гоблинов в восточной части болота Дейджа."
  "1461":
    1: "Эвандар Томас, великий мастер бодибилдинга, живёт на востоке Найгона."
  "1462":
    1: "Мастера медитации Тессу Гринсвард можно найти на горном хребте в юго-восточной части пустыни Бракада."
  "1463":
    1: "Великий мастер медитации Кейн находится на эльфийской территории Авли.\nЕго дом расположен на острове где-то в центральной части залива."
  "1464":
    1: "Мастера навыка «Восприятие» Гаррета Доутса можно найти в эльфийской части Туларийского леса.\nОн проживает в эльфийском городе Пирпонт."
  "1465":
    1: "Великого мастера навыка «Восприятие» — Петру Клирэй — можно найти в городе, расположенном в северо-западной части Дейи."
  "1466":
    1: "Ленорд Скиннер, мастер обезвреживания ловушек, живёт на хребте к югу от Хармондэйла, откуда открывается вид на город."
  "1467":
    1: "Силк Квиктанг, великий мастер обезвреживания ловушек, живёт на юге Найгона."
  "1468":
    1: "Мастера искусства уклонения, Оберика Крейна, можно найти на самом восточном острове архипелага Эвенморн"
  "1469":
    1: "Великого мастера искусства уклонения Кеннета Уэйна можно найти в столице штата Стидвик, расположенной в Эратии."
  "1470":
    1: "Мастера рукопашного боя, Ульбрехта Драчуна, можно найти на самом восточном острове архипелага Эвенморн."
  "1471":
    1: "Великий мастер рукопашного боя Норрис находится в столице штата Стидвик, в Эратии."
  "1472":
    1: "Джени Свифтфут, мастер опознания монстров, живёт в городе на северо-востоке эльфийской Авли."
  "1473":
    1: "Рейвен Охотник, великий мастер опознания монстров, живёт в небольшой деревне к югу от Хармондэйла."
  "1474":
    1: "Мастер-наставница навыка «Мастер оружия» Пола Брайтспир проживает на эльфийской территории Авли.\nЕё дом находится в городе на северо-востоке."
  "1475":
    1: "Великий мастер навыка «Мастер оружия», Ласитер Убийца, обитает в восточной части Эофола."
  "1476":
    1: "Мастер-наставница в навыке «Кража», Лиэн Шэдоурраннер, обитает в деревне гоблинов, расположенной в восточной части Дейи."
  "1477":
    1: "Великий мастер искусства кражи, Эверил Найтвокер, обитает в болотистой дельте южной части Таталии."
  "1478":
    1: "Мастера алхимии Эльзбет Уинтерспун можно найти в западной части Нигона."
  "1479":
    1: "Великого мастера-инструктора по алхимии, Люсида Эппл, можно найти на эльфийской территории Авли.\nЕго дом находится на острове где-то в центральной бухте."
  "1480":
    1: "Мастера знаний Дороти Сенджак можно найти в юго-восточной части Нигона."
  "1481":
    1: "Великий мастер знаний Уильям Смитсон ведёт занятия из своего дома на восточном острове архипелага Эвенморн."
  "1482":
    1: "Мастера магии света Хелену Морнингстар можно найти в облачном городе Селесте!"
  "1483":
    1: "Великий мастер магии света находится в замке волшебников — замке Ламбент."
  "1484":
    1: "Повелителя Тьмы, Сета Даркенмора, можно найти в «Яме» под Дейей!"
  "1485":
    1: "Великий мастер магии Тьмы находится в замке некромантов — замке Глоуминг.\nИзвестно, что иногда Арчибальд отправляется в лабораторию Кланкера."
  "1486":
    1: "Пустая бочка"
  "1487":
    1: "+2 к силе (постоянный эффект)"
  "1488":
    1: "+2 к меткости (постоянный эффект)"
  "1489":
    1: "+2 к харизме (постоянный эффект)"
  "1490":
    1: "+2 к интеллекту (постоянный эффект)"
  "1491":
    1: "+2 к выносливости (постоянный эффект)"
  "1492":
    1: "+2 к скорости (постоянный эффект)"
  "1493":
    1: "+2 к удаче (постоянный эффект)"
  "1494":
    1: "Пустой котёл"
  "1495":
    1: "+2 к сопротивлению огню (постоянный эффект)"
  "1496":
    1: "+2 к сопротивлению воде (постоянный эффект)"
  "1497":
    1: "+2 к сопротивлению воздуху (постоянный эффект)"
  "1498":
    1: "+2 к сопротивлению земле (постоянный эффект)"
  "1499":
    1: "Болезнь!"
  "1500":
    1: "Здесь ничего нет"
  "1501":
    1: "Отравлен!"
  "1502":
    1: "Пьяный!"
  "1503":
    1: "Пустая бочка"
  "1504":
    1: "Гриб"
  "1505":
    1: "Так это ВЫ выиграли конкурс лорда Маркхэма!\nКак вам пока нравятся призы?\nУже надоело выигрывать?\nНа вашем месте я бы высказал ему всё, что думаю!\nЕго особняк находится в Таталии, недалеко от пристани."
  "1506":
    1: "Друзья мои, следите за своими кошельками, пока вы здесь — в Стидвике полно воров.\nПо правде говоря, мы — мировая столица воров!\nВсем известно, что Билл Ласкер, «Мастер-вор», живет в канализации под Стидвиком."
  "1507":
    1: "Ещё когда я служил в армии, мне поручили разведать сторожевые башни в Дейе.\n<хихикая> Пробиваться через главный вход бесполезно, поэтому я обычно искал другой путь проникновения.\nЭти некроманты такие трусы, что всегда заранее продумывают путь отступления.\nА путь отступления — это и путь проникновения..."
  "1508":
    1: "Билл Ласкер, может, и преступник, но время от времени он работал на Корону.\nСпециальные миссии, официальные опровержения причастности, шпионаж… всё в этом роде.\nС Биллом связано немало необычных событий, но ни одно из них не имеет отношения к Короне.\nСерьёзно, разве вы не думаете, что люди королевы смогли бы найти и арестовать одного человека, даже если бы он прятался в канализации?"
  "1509":
    1: "Хочешь узнать об этой предательнице, Кармин?\nНу, она раньше работала в дипломатическом корпусе, пока не размякла и не присоединилась к этим «добродетельным» волшебникам.\nТеперь она свободно разгуливает по улицам Селесты, ничуть не заботясь о тех, кого оставила позади.\nС ней скоро случится что-то плохое, запомни мои слова!"
  "1510":
    1: "Ищешь «работу»?\nМастера-убийцу можно найти где-то в «Яме».\nУ него найдётся для тебя задание.\nВсегда найдётся кто-то или что-то, кого или что нужно убить — это точно."
  "1511":
    1: "До недавнего времени наш местный дракон Вромтракс Бессердечный ограничивал свои грабежи холмами на юге — он пожирал коз, домашний скот и бродячих собак.\nНо он пристрастился к эльфийской крови и теперь охотится и на нас.\nЕсли вы решите вступить с ним в схватку, его пещера находится на севере, к западу от Гильдии наёмников, в горах.\nОн не всегда там.\nБудьте осторожны — он могущественен."
  "1512":
    1: "Что, ты тоже хочешь стать крестоносцем?\nЭтот город просто кишит ими, клянусь!\nНу, в задней части одного здания недалеко от центра города живёт какой-то сумасшедший.\nЛюди постоянно пытаются записаться к нему, а он их всё отказывает.\nУдачи."
  "1513":
    1: "Подожди минутку, дай-ка я проверю.\nЗеркало, зеркало на стене… <ведьма несколько минут вглядывается в зеркало, а затем вздыхает> Это всё ещё Элис Харгривз.\nОна живёт в замке Грифонхарт.\nКакая же она благородная красавица, эта девушка!\nОна напоминает мне мою молодость."
  "1514":
    1: "Один из наших самых выдающихся и добропорядочных граждан — Уильям Сетаг, которого некоторые считают самым безжалостным злодеем на свете.\nНа самом деле он — один из наших лучших агентов.\nВолшебники и им подобные жалуются, потому что слишком часто становились жертвами его интриг, — но в своей профессии он — лучший из лучших.\nЕсли вы ищете работу, обратитесь к нему.\nЕго башня находится на северном берегу Дейи, в довольно труднодоступном месте.\nОн не любит гостей, но, наверное, будет рад, если к нему на порог придет больше учеников."
  "1515":
    1: "Если вы ищете наставника, чтобы начать серьёзное обучение на монаха, поговорите с Бартоломью Хьюмом — его можно найти в деревне к югу от города Хармондэйл."
  "1516":
    1: "Я слышал, что на стенах курганов есть отметки, по которым можно ориентироваться в гробницах.\nЭто поможет тебе не заблудиться, но не спасёт от нежити, охраняющей эти могилы."
  "1517":
    1: "Несколько лет назад в эти края поселилась странная секта под названием «Храм Баа».\nСначала они казались популярными — ведь предлагали бесплатные сеансы исцеления, — но вскоре стало ясно, что они преданны тьме.\nСейчас туда почти никто не заходит, и, похоже, те злые боги, которые их поддерживали, лишили их своей поддержки.\nНо они всё ещё там, скрываясь в тени.\nЖутко."
  "1518":
    1: "С тех пор как здесь обосновался культ «Баа», пропало множество овец — и я имею в виду действительно множество.\nБез сомнения, их увезли в храм «Баа» для принесения в жертву.\nЯ разорился, если кто-нибудь не примет меры против этих сектантов!"
  "1519":
    1: "В таких местах полно шпионов, друзьяаа.\nЕсли вы хотите, чтобы ваши письма и сообщения оставались в секрете, вам следует использовать шифр при написании.\nВ библиотеке Замка есть книга, в которой всё объясняется, друзьяаа."
  "1520":
    1: "Восемь лет назад мы отправили группу учёных на место, которое сейчас известно как шахта «Красный карлик», чтобы изучить странных существ, время от времени появлявшихся там.\nПервое, что мы заметили, — это то, что эктоплазма слизистых существ служит отличным катализатором для зелий.\nВторое — что слизистым существам просто невозможно нанести физический урон: они разваливаются на части или размазываются, а затем снова сливаются воедино. Если вы хотите убить одно из них, вам придётся использовать магию."
  "1521":
    1: "В шахтах «Красного карлика» обитает порода медуз, обладающая иммунитетом к магии.\nЭти чудовища — настоящий кошмар!\nМогу только поблагодарить богов за то, что эти существа не сбежали из шахты.\nЧто бы мы тогда делали — забивали их до смерти нашими посохами?"
  "1522":
    1: "Если вы направитесь на юг мимо Равнин Вивернов, не стоит стучать в дверь той огромной крепости, которую увидите посреди воды.\nЭто Крепость Титанов, и они не особо любят гостей."
  "1523":
    1: "Бои на арене доступны всем, кто хочет потренироваться с любым соперником.\nПопасть на арену можно, посетив конюшню в любое воскресенье и попросив, чтобы вас туда отвели."
  "1524":
    1: "Каждое воскресенье проходят чемпионаты на Арене.\nВ них может принять участие любой — но будьте осторожны!\nВаших соперников выбирает администрация Арены, а не вы!"
  "1525":
    1: "Кажется, рядом с каждым кладбищем или родовым захоронением обязательно находится дом с привидениями — и наш не исключение.\nРядом с одним из плато на поверхности, на северо-западе, стоит особняк.\nВ нём, без сомнения, обитают привидения."
  "1526":
    1: "Бойтесь прикосновения Призрака так же, как боитесь потери жизни.\nОно наносит ужасные духовные раны и на глазах у вас лишает вас молодости!"
  "1527":
    1: "Ещё несколько войн назад мой прадед работал над прокладкой туннеля, ведущего из эльфийского замка к Туларейским пещерам.\nНе думаю, что им когда-либо пользовались — ни одно нападение на замок не привело к его падению, — но это, безусловно, интересный кусочек истории, не правда ли?"
  "1528":
    1: "Говорят, что эльфы — это феи, но на самом деле мы с ними лишь отдалённо родственны.\nНастоящие феи не живут среди людей, и они именно такие, как описывают в сказках — озорные, жестокие, волшебные и опасные.\nНо если ты действительно хочешь с ними познакомиться, можешь навестить их в их Зале под Холмом, как они его называют.\nОн находится недалеко от деревни, к северу и западу.\nДобраться до входной двери будет непросто..."
  "1529":
    1: "Некоторое время назад я видел, как ночью в Туларейский лес пришли несколько мужчин с топорами и факелами, следуя по какой-то карте.\nКогда они уходили, они смеялись и были в приподнятом настроении.\nПохоже, они несли с собой большой зелёный камень.\nМой брат говорит, что это была банда наёмников из Таталии.\nВ любом случае, на следующий день лес сошёл с ума.\nСейчас туда идти слишком опасно."
  "1530":
    1: "Туларейский лес настолько древен, что у него, так сказать, сформировалось собственное сознание.\nЛес смутно осознает, кто по нему проходит, но только одна его часть способна общаться с людьми.\nЭто самое старое дерево.\nЕсли вы хотите поговорить с ним очень долго и неторопливо, оно с удовольствием пойдёт вам навстречу.\nИщите его на острове к юго-востоку от леса.\nОно больше, чем остальные деревья.\nЕго невозможно не заметить."
  "1531":
    1: "Любой, кому нужно подзаработать, может обратиться в мэрию любого крупного города, чтобы получить задание на охоту за головами.\nГородские советы всегда опасаются появления очередного людоеда, бандита или безумного волшебника и назначают вознаграждение за поимку того существа, которое в данном месяце доставляет им наибольшие хлопоты.\nВ их выборе нет ни логики, ни системы, так что не стоит пытаться в этом разобраться.\nЗадания часто оплачиваются довольно щедро."
  "1532":
    1: "Если вам когда-нибудь надоест заниматься охотой за головами на любительском уровне и вы захотите продвинуться по карьерной лестнице, поговорите с Эбеднезером Соуером в Авли.\nПравда, он обучает только последователей Пути Тени."
  "1533":
    1: "Пираты уже двадцать лет базируются в пещерах у побережья.\nОни не регнанцы и не входят в отряд Билла Ласкера, но всё равно довольно опасны.\nЕсли хочешь туда попасть, просто отправляйся на острова к западу."
  "1534":
    1: "Остров Эвенморн не то чтобы затерян, скорее до него трудно добраться.\nОн окружён коварными рифами, песчаными отмелями, водоворотами и акулами.\nЕсли что-то и может быть опасным, то этот остров окружён именно этим.\nСуществует всего один или два безопасных пути, ведущих на остров, а карта, на которой были обозначены эти пути, была похищена пиратами в суматохе недавних войн.\nСкорее всего, карта до сих пор хранится у них в пещерах."
  "1535":
    1: "Капитаны лодок с удовольствием доставят любого платящего пассажира на остров Эвенморн, но у них нет надёжных карт.\nНикто не станет рисковать своим судном, проходя мимо рифов вокруг острова, если у него нет карты!"
  "1536":
    1: "Ну, у меня нет запчастей для големов — я никогда не посещал этот курс, — но по всей Бракаде полно студентов, у которых валяются лишние запчасти для големов.\nОни ничего не стоят, если у тебя нет полного набора, так что, скорее всего, они просто отдадут их тебе бесплатно."
  "1537":
    1: "Видишь всех этих големов, бродящих по Бракаде?\nКаждый из них был создан Школой.\nНеплохо для студентов, а?\nОни не особо разговорчивы, но зато — крепкие стражи и способны почувствовать, когда поблизости появляется последователь Тьмы.\nТебе бы увидеть, как они вступают в бой, когда какой-нибудь некромант или чародей забредает на наши земли.\nУууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууу"
  "1538":
    1: "Наши астрологи установили, что пропавший текст «Божественного вмешательства» находится где-то глубоко под землёй.\nТочнее говоря, под Дейей.\nОни опасаются, что нынешнее воплощение текста попало в «Яму размножения» — некромантскую версию наших «Испытательных полей».\nО, чем же мы так оскорбили богов?\nНам никогда не удастся вернуть текст из этого проклятого места!"
  "1539":
    1: "Заклинание «Божественное вмешательство» — самое могущественное из школы магии Света — считается утраченным уже на протяжении веков.\nМы полагаем, что это проклятие — наказание за нашу недостаточную преданность и веру в Свет.\nМы боремся, и время от времени кто-то отправляется на поиски этого заклинания, но никому это ещё не удавалось.\nКаждый раз, когда его находят, судьба жестоко вырывает его из наших рук.\nНаши Великие Мастера лишены этого последнего, великого заклинания с тех пор, как только помнят ныне живущие."
  "1540":
    1: "Единственные люди в мире, изготавливающие сосуды для душ, — это чародеи из Найгона.\nЭто секрет их ремесла — что довольно странно, ведь им самим они совершенно не нужны.\nТем не менее, нам приходится торговаться с ними за эти сосуды, чтобы совершенствовать своё мастерство.\nКонечно, время от времени нам удавалось отбирать у них сосуды силой… но тогда они в отместку поднимали цены.\nНаверное, такова наша судьба — терпеть такие страдания."
  "1541":
    1: "Каждый некромант стремится однажды стать личем.\nДля этого нужны лишь сосуд для души, знание ритуала и магическое мастерство, позволяющее пережить путешествие в Страну мёртвых и вернуться обратно.\nТело увядает, а душа продолжает жить в великолепном состоянии, свободном от голода, болезней и ран.\nТолько мелочные и поверхностные люди обращают внимание на то, как ритуал влияет на внешний вид.\nНастоящие практикующие этого почти не замечают."
  "1542":
    1: "Давным-давно друиды соорудили три каменных круга.\nПоскольку информация об их местонахождении может помешать будущим Великим Друидам в их попытках Вознесения, я могу дать вам лишь общую подсказку: все они находятся на открытом месте, ничем не прикрыты и обнажены, и все расположены вдали от населённых пунктов.\nРаскрыть больше — значит испортить вам Вознесение."
  "1543":
    1: "Изначально существовало четыре Каменных круга — по одному для каждой стороны света и каждого времени года, — но Восточный круг был разрушен где-то в Найгоне во время войн между Церквями Солнца и Луны."
  "1544":
    1: "На этом кладбище действительно покоятся останки древнего короля, но эта освящённая земля проклянет любого, кто нарушит её покой.\nЯ не завидую тебе в связи с этой задачей.\nКаждая могила, которую ты откроешь, вызовет своё проклятие и, возможно, запустит какую-нибудь ловушку.\nЛучше убедись, что ты начинаешь копать именно ту могилу, которую нужно."
  "1545":
    1: "Хотя курганы были сооружены для отпугивания воров, необходимо было найти способ проходить через них во время похорон и церемоний.\nРядом с каждыми воротами вы найдёте табличку.\nЭти таблички написаны загадочным языком, но они не дадут вам сбиться с пути, если вы будете ими пользоваться.\nНи один вор до сих пор не понял их значения, поэтому, попав в курганы, они уже никогда оттуда не выходят."
  "1546":
    1: "Во время войны мы проложили туннель, ведущий от нашей горы Громкий Кулак к Стране Гигантов.\nИменно там мы обнаружили криганов, а также больше титанов и драконов, чем ты можешь себе представить.\nДумаю, тот, кто знаком с драконами, мог бы найти яйца в одной из драконьих пещер этой ужасной земли.\nОстерегайся матери..."
  "1547":
    1: "Я слышал легенды о том, что в Стране Титанов обитает дракон, превосходящий по величине всех своих предшественников.\nМеньшие драконы и титаны сражаются на склонах горы, в пещере которой он обитает.\nЭтот дракон настолько огромен и могущественен, что остальные драконы кормят его из страха, что однажды он выйдет из своей пещеры и в приступе ярости пожрёт их всех.\nДраконы верят, что он — бог.\nЕсли это так, представьте себе, какое у него сокровище..."
  "1548":
    1: "Рад, что ты пробрался через черный ход.\nНаверное, благодаря этому тебе удалось избежать действительно неприятной засады.\nНадеюсь, мой совет оказался полезным!"
  "1549":
    1: "Ну что ж… что посеешь, то и пожнёшь, да?\nОтлично поступил с этим предателем Кармином!"
  "1550":
    1: "Дракон повержен — и это твоя заслуга!\nТы — герой!"
  "1551":
    1: "Культ Баа исчез?\nНу, это ДЕЙСТВИТЕЛЬНО хорошая новость!\nВсе в долгу перед тобой, знают они об этом или нет."
  "1552":
    1: "Рад слышать, что культ «Баа» исчез, а не мои овцы!\nОтлично сработано!"
  "1553":
    1: "Я впечатлён: немногим вообще удаётся попасть внутрь волшебного кургана, и ещё меньше заходят так далеко."
  "1554":
    1: "Теперь в лесу стало гораздо безопаснее — и это благодаря тебе!\nСамое старое дерево очень тебе благодарно и включило тебя в свои рассказы об истории."
  "1555":
    1: "О, так карту нашли?\nЧто ты будешь делать со своим новообретённым сокровищем?\nНадеюсь, поделишься им!"
  "1556":
    1: "Раз у тебя уже есть карта, думаю, ты скоро туда отправишься.\nБудь осторожен — говорят, что на этом острове лежит проклятие!"
  "1557":
    1: "Если вас не пугают болота и туман, остров Эвенморн — отличное место для жизни.\nКонечно, проклятие не добавляет радости — по острову свободно бродят призраки и скелеты, — но, за исключением этого, соседи держатся особняком.\nЦеркви Солнца и Луны уже почти не конфликтуют друг с другом.\n<Хех!> — наверное, это значит, что у них заканчиваются прихожане..."
  "1558":
    1: "Божественное вмешательство обнаружено и скопировано?\nЧудо!\nНикогда не думал, что доживу до этого!"
  "1559":
    1: "Все великие мастера очень вами довольны.\nВы оказали нашей профессии огромную услугу!"
  "1560":
    1: "Поскольку вы обнаружили эти круги самостоятельно, они оказали на вас свое волшебное воздействие.\nНадеюсь, вы не будете рассказывать другим о том, где они находятся, так же, как я поступил в вашем случае."
  "1561":
    1: "Во время войн между Храмами Солнца и Луны из святилищ в пустыне Бракада, Таталии и Авли были похищены три статуэтки.\nЯ представляю группу друидов, которые хотят вернуть эти святилища в их первоначальный вид — это крайне важно для их культа.\nС этой целью я предлагаю щедрую награду любому, кто найдёт эти статуэтки и вернёт их на место в святилищах."
  "1562":
    1: "Все три статуэтки не установлены.\nЯ не могу вознаградить за частичный успех.\nВернись, когда установишь все три."
  "1563":
    1: "Отличная работа!\nДруиды настолько довольны, что решили добавить небольшой бонус за твое прекрасное выступление.\nВозьми это — ты это, безусловно, заслужил."
  "1564":
    1: "Как вы, возможно, уже догадались, я коллекционер произведений изобразительного искусства.\nВ настоящее время я ищу набор картин: одну с изображением короля Роланда, одну — с изображением его брата Арчибальда и одну — со статуей ангела во дворе замка Айронфист.\nЭтот набор представляет огромную ценность, и, как коллекционер, я готов заплатить за него весьма щедро.\nЕсли вам удастся собрать полный набор картин, принесите их мне, и я обязательно щедро вознагражу вас за ваши усилия."
  "1565":
    1: "У тебя нет ни одной из этих картин.\nЯ ищу набор, в который входят картины с Роландом, Арчибальдом и статуей."
  "1566":
    1: "Помни, мне нужен полный комплект картин — сами по себе они не стоят почти ничего.\nКогда у тебя будут остальные, принеси их все ко мне."
  "1567":
    1: "Замечательно!\nЯ годами не мог раздобыть этот набор!\nТы более чем заслуживаешь обещанную мной награду; вот, надеюсь, этого хватит."
  "1568":
    1: "Чтобы стать чемпионом «Аркомага», выиграйте партию в каждой таверне на поверхности Эратии и под ней.\nВсего турниры по «Аркомагу» проводятся в 13 тавернах.\nВыполнив задание, вернитесь ко мне за наградой."
  "1569":
    1: "Вы должны победить во ВСЕХ 13 тавернах.\nДо тех пор вас не смогут провозгласить чемпионом «Аркомага»."
  "1570":
    1: "Поздравляю!\nТы стал чемпионом «Аркомага»!\nПриз ждёт тебя в сундуке у входа в мой дом."
  "1571":
    1: "Вот %s, которые вы потеряли.\nВ будущем будьте более осторожны."
  "1572":
    1: "У тебя этого никогда не было."
  "1573":
    1: "Говорят, что гномы живут в бесплодных землях к югу от Хармондэйла, но это не совсем так — они живут ПОД ними.\nИщите их главные ворота в центре Барроу-Даунс, там, где сходятся три моста."
  "1574":
    1: "С тех пор как чародеи из Найгона пробили туннель через Каменный Город со своего острова, путешественники просят разрешения пройти через город, чтобы добраться до Найгона.\nКороль гномов не одобряет это и хотел бы взимать значительную плату с тех, кто желает войти в Каменный Город.\nОднако он пока не стал вводить эту плату, опасаясь политических последствий и возможных столкновений с чародеями из Найгона."
  "1575":
    1: "Колдуны Найгона обитают на горе Гром-Кулак — потухшем вулкане на большом острове, расположенном в нескольких милях от материка.\nВо время недавних войн колдуны проложили туннели через Каменный Город, чтобы переправить свои войска через пролив.\nЭти туннели до сих пор открыты и по ним можно пройти."
  "1576":
    1: "Во время войны чародеи проложили туннели из Найгона через Стоун-Сити, чтобы добраться до материка и захватить территории.\nНесмотря на то что Эратия оттеснила их обратно на остров, туннели сохранились."
  "1577":
    1: "Гномы живут под землёй в Барроу-Даунс — бесплодном массиве древних курганов, сооружённых их народом много веков назад в честь павших королей и героев.\nНе ко всем курганам можно добраться с поверхности — многие из них магическим образом связаны друг с другом через систему телепортов и ловушек, защищающих могилы от тех, кто хочет их ограбить.\nЕсли присмотреться к стенам, вы заметите знаки, которые могут помочь вам сориентироваться."
  "1578":
    1: "Мы наживали целое состояние в шахтах Красного Карлика, пока не появились Медузы!\nНам пришлось бежать, пока они не превратили всех в камень.\nБез добычи полезных ископаемых у нас почти нет возможности зарабатывать на жизнь.\nПо-моему, это не жизнь, достойная настоящего карлика!"
  "1579":
    1: "Несколько лет назад компания «Бракада» сдала нам в аренду участок земли, на котором мы открыли шахту «Красный карлик».\nТак продолжалось до тех пор, пока не появились «Медузы» и не отняли шахты у нашего народа.\nТолько боги знают, какие ужасы творятся там сейчас.\nШахты находились в северо-восточной части Бракады."
  "1580":
    1: "Когда Медузы отняли у нас шахты «Красного карлика», не всем удалось спастись.\nВ шахтах до сих пор остаются несколько статуй.\nИх можно спасти, если их статуи ещё не разбиты, но для этого придётся пробиваться сквозь ряды Медуз."
  "1581":
    1: "Вам нравится наш город?\nЭто не просто дыра в земле — это дом под землёй!\nГномы ведут здесь горные работы уже целые столетия!\nПравда, запасов полезных ископаемых здесь уже почти не осталось, а те, что остались, находятся в неустойчивых и опасных штреках.\nБудьте осторожны, если спуститесь на нижние уровни."
  "1582":
    1: "Со всем уважением, милорды, должен сказать, что никто не ожидает, что вы продержитесь долго, ведь ни один из лордов Хармондэйла не продержался долго.\nВоенные конфликты и политические интриги между Эратией и Авли рано или поздно погубят вас.\nСкорее всего, рано."
  "1583":
    1: "Восстания здесь, в Хармондэйле, случаются редко, но у нас было несколько крупных!\nВ большинстве случаев местные лорды не задерживаются на своих постах достаточно долго, чтобы против них успели поднять восстание, но были и такие, кто заслуживал этого!\nНе то чтобы я считал вас, милорды, злодеями."
  "1584":
    1: "Приятно снова увидеть кого-то в Хармондэйле, милорды.\nЗамок стоит пустой со времён войны, если не считать гоблинов.\nНо их, пожалуй, не стоит учитывать."
  "1585":
    1: "Учитывая все эти войны, в которые Авли постоянно ввязывается, да ещё и высокие налоги, я переехал в Хармондэйл, чтобы остаться здесь навсегда.\nВ Хармондэйле много насилия, но зато здесь, по крайней мере, нет призыва.\nЗнаете, в Авли было столько войн, что один из королей велел прокопать туннель от своего замка до пещер на севере — на тот случай, если замок в очередной раз захватят."
  "1586":
    1: "Недалеко от Хармондэйла находится система пещер, которая издавна служит пристанищем для разбойников, монстров и прочей нечисти.\nЕё называют «Пещеры Белого Утеса».\nЕсли вас когда-нибудь ограбят или вы захотите найти злодеев, чтобы наказать их, вам нужно просто отправиться туда.\nТам вас точно ждёт сражение!"
  "1587":
    1: "Вы заметили тот крытый мост по дороге из Хармондэйла в Стидвик?\nОн называется «Форт Риверстрайд» и защищает нас от внезапных атак эльфов, наступающих через Хармондэйл.\nВнутри его столько ловушек и уловок, что, как говорят, он никогда не падет без помощи предателей."
  "1588":
    1: "Существует артефакт, за который Авли и Эратия борются уже десятилетиями.\nОбе стороны утверждают, что он был создан их народом, и много раз теряли его в ходе набегов друг на друга.\nОн даже не обладает магическими свойствами — это просто трофей.\nПятнадцать лет назад трофей пропал во время одного из набегов, и никто не знает, куда он делся.\nВ последнее время ходят слухи, и начались поиски, чтобы выяснить, куда он делся.\nЕсли его найдут — берегитесь!\nБудет пролита кровь."
  "1589":
    1: "Из-за напряжённой обстановки Эратия и Авли наняли арбитра, чтобы тот помог им уладить разногласия.\nОн остановился в «Доме звёзд» на восточной окраине территории Хармондэйла.\nВозможно, у него найдётся для тебя какой-нибудь совет."
  "1590":
    1: "Если вам когда-нибудь понадобится совет о том, что делать дальше, или вы потеряли что-то важное, отправляйтесь к Арбитру в «Дом звёзд», расположенный у восточной границы территории Хармондэйла.\nОн часто знает, куда делись потерянные вещи, или может дать совет о том, что вам нужно делать.\nУверен, он вам поможет."
  "1591":
    1: "Смерть судьи Грея, арбитра Хармондэйла, приостановила ход войны.\nКажется, будто весь мир затаил дыхание, ожидая, пока вы сделаете свой выбор.\nЛучше будьте осторожны с выбором — похоже, это будет очень важное решение, милорды."
  "1592":
    1: "Испытательный полигон, называемый «Стенами Тумана»,\n— это место, где должны побывать все волшебники Селесты, прежде чем они смогут овладеть Высшим Искусством.\nГоворят, что это скорее испытание нравственной силы, чем физической.\nВ лабиринте запрещено убивать монстров."
  "1593":
    1: "Город Селесте на протяжении веков является прибежищем Света.\nОн был основан королём Магнусом II\nв 499 году как центр Королевства Бракада и как символ надежды для всего остального мира."
  "1594":
    1: "То, что вы видите на поверхности в Дейе, — лишь небольшая часть истинного Царства Смерти.\nСуществует подземный город, который называют «Ямой».\nДобраться до него с поверхности можно только через Зал Ямы, расположенный в северной части Дейи."
  "1595":
    1: "Селеста — это волшебный город, построенный волшебниками Бракады много веков назад; он наполовину укоренился в горах, а наполовину — в тумане высоко над Бракадой.\nЧтобы попасть туда, вам нужно воспользоваться одним из их телепортов — его можно найти недалеко от центра Бракады."
  "1596":
    1: "Недавно произошло ещё одно убийство, о котором весь город только и говорит.\nЕщё один труп — молодая женщина, как я слышал, — нашли возле канализации.\nОбескровленная, ради Света!\nЭто всё те воры, что живут в канализации, говорю вам!\nОни — крысы.\nКто-нибудь должен спуститься туда и покончить с ними раз и навсегда!"
  "1597":
    1: "Во время войны чародеи вступали в контакты с некими странными существами, называемыми «криганами», в горах к югу от Авли.\nДобраться туда с материка невозможно, но чародеи прокопали под морем туннель со своего острова, ведущий к обители криганов."
  "1598":
    1: "Во время войны мы переоценили свои силы и не смогли завоевать ни одного участка территории на материке.\nНаши «союзники», криганы, оказались крайне ненадежными.\nЖители Энрота называют их дьяволами — теперь мы знаем, почему.\nИменно в тот момент, когда мы нуждались в них больше всего, они развернулись и сбежали, оставив нас один на один с гневом армий Эратии и Авли.\nВ следующий раз мы не будем так доверчивы."
  "1599":
    1: "Говорят, в Дейе в последнее время наблюдается немалая активность.\nПохоже, Арчибальд Айронфист, лидер Дейи (и бывший король Энрота), покинул Яму и отправился на остров у восточного побережья Авли.\nМногие некроманты последовали за ним туда — судя по всему, происходит какой-то раскол."
  "1600":
    1: "Из Найгона доносятся слухи о том, что король Энрота Роланд, возможно, всё ещё жив.\nНекоторые чародеи утверждают, что лично видели его, когда встречались с отвратительным Криганом.\nВ слухах также говорится, что криганы держат его в клетке и ужасно с ним обращаются."
  "1601":
    1: "«Сосуд души» — это то, что необходимо некроманту для завершения ритуала и превращения в лича — бессмертного нежить-монстра, сохранившего разум и воспоминания о прошлой жизни.\nСовершенно очевидно, что для большинства людей это далеко не желанное состояние, поэтому рынок сбыта этих артефактов не слишком активен.\nТем не менее некроманты готовы пойти почти на всё, чтобы заполучить их — от этого зависит само существование их профессии."
  "1602":
    1: "В последнее время люди исчезают.\nИ не один-два, а по несколько каждый день!\nВечером они ложатся спать, а на следующий день их нигде не видно, а их дома пустуют!\nЯ очень хочу, чтобы кто-нибудь выяснил, что происходит!"
  "1603":
    1: "Вот тебе и могучая оборона.\nГоворят, что некроманты во главе с Арчибальдом Айронфистом телепортировались прямо в лабораторию Кланкера и захватили её.\nПравда, мне сказали, что в этом не обошлось без предательства со стороны своих."
  "1604":
    1: "Хотя чародеи, строго говоря, являются слугами Тьмы, они, как правило, не склонны к насилию.\nКонечно, в случае нападения они будут защищаться, но сами не начнут драку, если вы не начнёте её первыми.\nНа самом деле они довольно разумны и со всей серьёзностью относятся к своим делам.\nМне было весьма приятно иметь с ними дело."
  "1605":
    1: "Подземный комплекс, созданный Кланкером, удивительно хорошо защищён.\nГлавный вход защищает от любых магических атак, а само расположение острова затрудняет высадку на него крупных сил.\nПока что Кланкер держался в стороне, и никто ещё не пытался всерьёз проверить его оборону, но его лучшая защита — это ряд блокираторов телепортации, установленных внутри комплекса.\nНи одна магическая армия не сможет телепортироваться мимо главного входа, пока эти блокираторы не будут сначала выведены из строя."
  "1606":
    1: "Мы высадились на западном побережье Северного Авли.\nВойдите в море с самой западной точки пляжа и оглядитесь под водой.\nКорабль невозможно не заметить."
  "1607":
    1: "Лорды Хармондейла!\nНастоящие герои, скажу я вам!\nМой двоюродный брат был одним из тех, кого вы спасли!\nМы в долгу перед вами!"
  "1608":
    1: "Спасибо, что спасли наших людей от медуз!\nГномы Каменного города никогда вас не забудут!"
  "1609":
    1: "Мы вам очень благодарны за то, что вы отважно спасли наших людей.\nВосстановление вашего замка — это самое малое, что мы могли для вас сделать."
  "1610":
    1: "Добрый день, милорды.\nДолжен сказать, что люди начинают по-другому смотреть на ваши шансы на выживание.\nВсе говорят, как замечательно, что в Замке появились стабильные правители!"
  "1611":
    1: "Приятно видеть, что замок восстановлен, а этих отвратительных гоблинов-разбойников выгнали.\nС тех пор, как ты взял здесь бразды правления, дела пошли на поправку!"
  "1612":
    1: "Я слышал, что Форт Риверстрайд был захвачен с помощью предательства!\nКакая жалость, что этим негодяям удалось выторговать у королевы уступки в обмен на возвращение того, что и так уже принадлежало нам!"
  "1613":
    1: "Похоже, трофей достался Эратии.\nГоворят, за него развернулась настоящая битва!"
  "1614":
    1: "Похоже, трофей достался Авли.\nГоворят, за него развернулась настоящая борьба!"
  "1615":
    1: "Похоже, трофей попал в руки Арбитра.\nГоворят, за него развернулась настоящая схватка!"
  "1616":
    1: "Смерть судьи Грея стала тяжелым ударом для всех нас.\nНадеюсь, что его преемник оправдает его наследие."
  "1617":
    1: "Похоже, последствия вашего выбора только начинают проявляться, милорды.\nНадеюсь, вы сделали мудрый выбор."
  "1618":
    1: "Так это же вампир убивал всех этих людей!\nЯ слышал, что именно вы и избавились от него!\nСпасибо!\nТеперь все чувствуют себя гораздо безопаснее."
  "1619":
    1: "Говорят, вам приписывают спасение короля Роланда!\nЭто настоящая гордость для вас, милорды!\nНАСТОЯЩАЯ гордость!"
  "1620":
    1: "Ищете обучение навыку на уровне эксперта?\nНаставников-экспертов по большинству навыков можно найти в Хармондэйле, Эратии и Туларийском лесу."
  "1621":
    1: "Вот твоё оружие; если найдёшь ещё руды, я с удовольствием изготовлю тебе ещё оружия."
  "1622":
    1: "Мне нужна руда, чтобы изготовить оружие.\nЧем лучше руда, тем лучшее оружие я смогу изготовить."
  "1623":
    1: "Вот твоя броня; если найдешь ещё руды, я с удовольствием сделаю тебе ещё броню."
  "1624":
    1: "Мне нужна руда, чтобы изготовить доспехи.\nЧем лучше руда, тем лучше доспехи я смогу изготовить."
  "1625":
    1: "Вот ваш предмет; если найдёте ещё руды, я с удовольствием изготовлю для вас ещё предметы."
  "1626":
    1: "Мне нужна руда, чтобы изготовить предметы.\nЧем лучше руда, тем лучше предметы я смогу изготовить."
  "1627":
    1: "Сигнальную ракету, расположенную на западной стороне острова, следует запустить, чтобы предупредить суда о недопустимости приближения к этой стороне острова.\nРифы у западного побережья в прошлом неоднократно становились причиной гибели людей."
  "1628":
    1: "Остерегайтесь болот на южной оконечности острова.\nИменно там размножаются стрекозы, досаждающие жителям нашего города!"
  "1629":
    1: "Поваленные или мертвые деревья иногда могут служить укрытием для каких-нибудь сокровищ или безделушек.\nОднако там также могут обитать насекомые или, что ещё хуже!"
  "1630":
    1: "Телепорты в центре Бракады позволяют перенестись в различные точки пустыни.\nПросто посмотрите на столб перед телепортом, чтобы узнать, куда он вас перенесет.\nОднако будьте осторожны: некоторые телепорты работают с перебоями и не отображают пункт назначения!"
  "1631":
    1: "Милорды!\nЛорд Арчибальд прислал инженеров и ремесленников, чтобы модернизировать замок Хармондэйл!\nТеперь у нас есть верхний и нижний этажи!\nЛорд Арчибальд также оставил подарки в сундуках в этих новых помещениях.\nРемесленники открывают лавки в прихожей и будут предлагать на продажу множество замечательных вещей!\nО, да, рабочие обнаружили в замке старую часть — камеру пыток и подземелье!\nНам очень повезло!\nЯ и не думал, что Хармондейл может позволить себе такую роскошь, милорды!"
  "1632":
    1: "Милорды!\nГэвин Магнус прислал инженеров и ремесленников, чтобы модернизировать замок Хармондэйл!\nТеперь у нас есть верхний и нижний этажи!\nГэвин Магнус также оставил подарки в сундуках в этих новых помещениях.\nРемесленники открывают лавки в прихожей и будут предлагать на продажу множество замечательных вещей!\nОднако рабочие обнаружили в замке более старую часть — камеру пыток и подземелье.\nБоюсь, это не самое приятное зрелище."
  "1633":
    1: "Милорды::кланяется:: Теперь, когда вы очистили замок Хармондэйл от гоблинов и прочей нечисти, вам следует сосредоточиться на изгнании гоблинов из окрестностей Хармондэйла.\nК востоку отсюда находится центр спорной территории.\nТам произошло множество великих сражений между войсками короля эльфов Элдрича и королевы Эратии Кэтрин.\nГоблины захватили разрушенный форт в этой местности и используют его для нападений на всех путешественников, пытающихся добраться до Хармондейла!"
  "1634":
    1: "Милорды, помните: замок Хармондэйл — ВАШ.\nНе стесняйтесь расслабиться, пока вы здесь.\nВаш сон никогда не будет нарушен нападениями монстров, и ничто из того, что вы решите хранить в сундуках замка, никогда не будет украдено или унесено.\nВы дома."
  "1635":
    1: "Если вам нужна помощь Эратии, зажгите сигнальные костры у дорог, ведущих к Барроу-Даунс, Эратии и Туларийскому лесу.\nЭратские войска, находящиеся поблизости, увидят костры и поспешат вам на помощь!"
  "1636":
    1: "Милорды. Замок Хармондэйл готов принять вас."
  "1637":
    1: "По всей стране можно найти пьедесталы, которые могут обеспечить вам временную защиту от определённых видов магии."
  "1638":
    1: "::Вы получаете телепатическое сообщение:: Мои... господа.\nМеня зовут Арчибальд Айронфист.\nВы, вероятно, слышали обо мне — именно я до недавнего времени был правителем Ямы.\nПосле ухода на покой я больше не занимаюсь государственными делами.\nЯ знаю, что мы были противниками, но вынужден обратиться к вам за помощью.\nВзамен, думаю, я смогу помочь вам. С помощью оборудования, которое я нашёл в своей новой лаборатории, я обнаружил, что мой брат Роланд, супруг королевы Эратии Кэтрин, по-прежнему удерживается дьяволами в их мерзком, э-э, жилище.\nЯ подслушал, что вы уже отправляетесь на сражение с ними (это оборудование действительно замечательное), и хочу убедиться, что всё пройдёт гладко.\nМой брат похитил ключ от покоев их вождя и спрятал его в той чудовищной клетке, в которой его держат.\nПожалуйста, спасите его!\nДаже я не могу вынести мысли о том, что мой брат находится в таких условиях!\nЧтобы помочь вам, я предлагаю вам это оружие.\nЕго… нашел мой верный слуга, сержант Пиридак, среди личных вещей моего советника.\nНадеюсь, оно вам пригодится."
  "1639":
    1: "::Вы получаете телепатическое сообщение:: Друзья мои.\nЯ знаю, что вы сотрудничаете с моими бывшими советниками, но я вынужден ещё раз обратиться к вам за помощью. С помощью оборудования, которое я нашёл в своей новой лаборатории, я обнаружил, что мой брат Роланд, супруг королевы Кэтрин из Эратии, по-прежнему удерживается демонами в их отвратительном, э-э, логове.\nЯ подслушал, что вы уже отправляетесь на сражение с ними (это оборудование действительно замечательное), и хочу убедиться, что всё пройдёт гладко.\nМой брат похитил ключ от покоев их вождя и спрятал его в той чудовищной клетке, в которой они его держат.\nПожалуйста, спасите его!\nДаже я не могу вынести мысли о том, что мой брат находится в таких условиях!\nЧтобы помочь вам, я предлагаю вам это оружие.\nОно было… найдено моим верным слугой, сержантом Пиридаком, среди личных вещей моего советника.\nНадеюсь, оно вам пригодится."
  "1640":
    1: "У Толберти есть для вас дело. Поговорите с ним, он объяснит, что нужно сделать."
  "1641":
    1: "У нашего друга Роберта Мудрого сейчас есть для тебя задание.\nПойди к нему, и он даст тебе инструкции."
  "1642":
    1: "Эти 1000 золотых в значительной степени помогут удержать зомби подальше от дорог.\nСпасибо за ваш вклад."
  "1643":
    1: "Жаль.\nКакое совпадение, кажется, я вижу на дорогах зомби.\nВозможно, в следующий раз ты будешь более склонен вносить свой вклад."
  "1644":
    1: "Отлично!\nВот ящик с наконечниками стрел.\nПип Хиллиер из Эратии платит за них самые высокие цены. Обязательно загляните к нему!"
  "1645":
    1: "Ах, посылка с туларейским деревом от моего друга Роберта Белкнапа.\nНадеюсь, у него всё в порядке. Вот ваша оплата."
  "1646":
    1: "Вот ваша корзина с перьями грифонов.\nРоберт Белкнап из Туларейского леса платит за эти перья самые высокие цены.\nОбязательно передайте ему от меня привет, когда увидите его."
  "1647":
    1: "Райдрик прислал мне очередную партию наконечников для стрел.\nЗамечательно!\nВот твоя плата."
  "1648":
    1: "Вот ваш ящик с туларийской древесиной.\nОтнесите его Райдрику в Хармондэйл — он хорошо заплатит."
  "1649":
    1: "Пип Хиллиер прислал очередную партию перьев «Гриффин».\nВот ваша оплата.\nХорошего дня!"
  "1650":
    1: "Спасибо!\nВот ваш ящик с песком. Арвин Бенеклоуд из Барроу-Даунс хорошо платит за этот песок — он делает из него прекрасные бутылки!"
  "1651":
    1: "Ах, партия энротского вина из Инфернона.\nЭто согреет сердца многих! Вот ваша оплата."
  "1652":
    1: "Обязательно отнесите эту ящик стеклянных бутылок Инфернону в Авли.\nОн разливает в бутылки лучшее энротское вино."
  "1653":
    1: "Ах, посылка с песком от Калиндры Голденсайт.\nВот твоя оплата."
  "1654":
    1: "Вот ваш ящик энротского вина.\nОтнесите его Калиндре Голденсайт в Таталию — она хорошо заплатит."
  "1655":
    1: "Арвин Бенеклоуд прислал мне очередную партию стеклянных бутылок.\nПора разлить ещё немного энротского вина.\nВот твоя оплата."
  "1656":
    1: "Из этого порта можно нанять корабль до Эратии по вторникам, четвергам и субботам. Корабли в пустыню Бракада отправляются по понедельникам и средам, а в Авли — только по пятницам. Если вы выполнили задание на повышение до жреца, по воскресеньям можно отплыть на остров Эвенморн."
  "1657":
    1: "Если вы хотите быстро добраться до Найгона через туннели, пролегающие под землёй, вам следует выбрать левую ветвь туннеля Найгона.\nМногие выбрали правую ветвь и с тех пор о них больше ничего не было слышно.\nХотя, с другой стороны, возможно, они и добрались до Найгона, но были схвачены чародеями!"
  "1658":
    1: "Многие торговцы по всей Эратии нанимают путешественников для доставки своих товаров!\nЕсли вам когда-нибудь понадобятся дополнительные деньги, попробуйте найти одного из этих торговцев и выполнить для него доставку!"
  "1659":
    1: "Я вижу, что у тебя доброе сердце, но кошелек, судя по всему, не в лучшем состоянии.\nЕсли у тебя нет денег, просто скажи об этом.\nВ любом случае, удачи в борьбе с зомби.\nПока-пока!"
  "1660":
    1: "Вы проиграли игру!"
  "1661":
    1: "Вы проиграли состязание!"
  "1662":
    1: "Вы не прошли тест!"
  "1663":
    1: "Ты не справился с испытанием!"
  "1664":
    1: "Вы уже победили!"
  "1665":
    1: "Ты победил!\n+3 очка навыков"
  "1666":
    1: "Ты победил!\n+5 очков навыков"
  "1667":
    1: "Ты победил!\n+7 очков навыков"
  "1668":
    1: "Ты победил!\n+10 очков навыков"
  "1669":
    1: "Что?!\nТы же не поверишь в эту выдумку, правда?\nМне и в голову не пришло бы подрывать твое правление здесь!\nГаааа!\nГотовься к смерти!"
  "1670":
    1: "Я слышал слухи, что храм, расположенный к юго-востоку отсюда, может перенести тебя в Страну гигантов.\nЯ бывал в этом храме много раз, но он ни разу не сделал для меня ничего особенного.\nИли, может быть, сюда можно попасть ИЗ Страны гигантов? Интересно..."
  "1671":
    1: "По всей территории разбросаны испытания.\nЕсли ваши способности достаточно высоки и вы справитесь с испытанием, вы получите очки навыков, которыми сможете распоряжаться по своему усмотрению!"
  "1673":
    1: "Как говорится, вчетвером — это компания, а впятером — уже толпа. Мне не нужна последняя."
  "1674":
    1: "Нажмите ещё раз, чтобы закрыть"
  "1675":
    1: "Нажмите ещё раз, чтобы нанять"
  "1676":
    1: "Стань %s."
  "1677":
    1: "Да, это я — тот, кого ты ищешь. Ты уверен, что хочешь пойти по пути %s?"
  "1678":
    1: "Поздравляем, %s!"
  "1679":
    1: "Ваш вид не может стать %s. Извините."
  "1680":
    1: "Привет! Меня зовут %s, я %s %s. Мне очень хотелось бы увидеть мир и испытать приключения, но отправляться в путь в одиночку было бы глупо. Может быть, я смогу поехать с тобой?"
  "1681":
    1: "Я не могу поехать с вами, в вашей группе уже слишком много людей."
  "1682":
    1: "ученик,квалифицированный,известный,виртуозный,великий"
  "1683":
    1: "Какой несчастный захочет иметь дело с такой мразью, как ты? Покайся в своих грехах и не показывайся здесь, пока не покаешься."
  "1684":
    1: "Дракон наелся! Пусть растет."
  "1685":
    1: "Выбери имя для своего дракона."
  "1686":
    1: "Дракона назовут «%s», вы уверены? (Д/Н)"
  "1687":
    1: "Детёныш ещё слишком мал, чтобы отправиться с вами."
  "1688":
    1: "Ваша группа переполнена."
  "1689":
    1: "Дракон вырос!"
  "1690":
    1: "Чтобы играть здесь, у вас должна быть собственная колода карт. _________________________________________"
  "1692":
    1: "Накорми дракона"
  "1693":
    1: "Ой!\nПечать.\nВот, я должен отдать тебе эти деньги.\nА теперь уходи, пока нас вместе не заметили!\nКто-нибудь заподозрит неладное."
  "1694":
    1: "Не пытайся сказать, что я тебе не заплатил!\nТы же получил своё золото!"
  "1695":
    1: "Мои инструкции совершенно ясны.\nЯ должен заплатить тому, кто доставит письмо с печатью.\nПоскольку у вас нет письма с печатью, вы не получите денег!"
  "1696":
    1: "Чуть южнее города находится старинная крепость под названием «Гоблинватч».\nИзначально она была построена для защиты города от набегов гоблинов, но в последнее время здесь царил такой мир, что мы перестали за ней ухаживать.\nМожете себе представить, как нам было неловко, когда мы поняли, что те самые монстры, от которых мы защищались, заселились в крепости!\nК тому же они сменили замок на очень важной двери, ведущей в пещеры под подземельями.\nМы объявили постоянную награду в размере 2000 золотых монет тем, кто сможет разгадать комбинацию и сообщить нам её."
  "1697":
    1: "Как ты собираешься найти комбинацию к этому замку, просто стоя здесь?\nПора в путь!"
  "1698":
    1: "Ах, спасибо, что позаботились об этой мелкой детали за нас.\nВот ваше золото!\nНе стесняйтесь возвращаться в Гоблинвотч в любое время, чтобы до конца расправиться с оставшимися монстрами.\nМы не можем вам заплатить, но вы можете забрать всё, что найдёте там."
  "1699":
    1: "Вы так отлично справились с заданием «Стражи гоблинов», что мы хотели бы снова нанять вас.\nКульт обосновался в старом заброшенном храме, расположенном в нескольких днях пути к западу отсюда.\nЧтобы финансировать свои кощунственные действия, они грабят путешественников, следующих по дороге, ведущей к замку Айронфист.\nМы обратились к регенту с просьбой принять меры против этих ужасных культистов, но он ответил, что все его войска заняты на западе, или что-то в этом роде.\nМы хотим избавиться от них немедленно, поэтому готовы заплатить вам 5000 золотых монет за то, чтобы вы избавились от них и принесли нам «Колокольчик гармонии» в качестве доказательства выполнения задания."
  "1700":
    1: "Без «Звона гармонии» я не имею права выплатить вознаграждение."
  "1701":
    1: "Отличная работа!\nВот тебе золото!\nНе знаю, как тебя отблагодарить за то, что ты разрушил этот храм.\nТеперь дорога в Айронфист снова станет безопасной для путешествий."
  "1702":
    1: "Благодаря вам дорога в Айронфист стала гораздо безопаснее.\nМы вам очень благодарны."
  "1703":
    1: "Хозяина таверны «Воющая луна» зовут Джордж Канисс.\nЭто замечательное место.\nПередайте ему от меня привет!"
  "1704":
    1: "Огромное спасибо, что принесли мне эти письма! <Уилбур начинает читать письма> Я так переживал… Понимаю… Это нехорошие новости… О, нет.\nПредатели!\nВезде одни предатели и заговорщики!\nЯ должен немедленно организовать экспедицию! <Уилбур понижает голос> Надеюсь, ты не расскажешь принцу об этих письмах… он и так уже слишком подавлен и несчастен, чтобы слышать ещё больше плохих новостей.\nА теперь я должен заняться организацией экспедиции.\nВот мешок с золотом в качестве награды… ты заслужил его и мою благодарность.\nВот если бы только я мог найти кого-нибудь, кто бы доискался лорда Килберна…"
  "1705":
    1: "<Уилбур щелкает пальцами> Скажи, ты, случайно, не хотел бы помочь мне уладить одну небольшую деталь?\nЛорд Килберн исчез где-то недалеко от Блэкшира.\nРазберись, что сможешь, и вернись ко мне с информацией.\nЕсли правда, что его убили демоны, верни мне его щит, если это вообще возможно.\nЯ окажу тебе свою поддержку перед Высшим Советом, если тебе это понадобится, и можешь быть уверен, что вознаграждение будет щедрым."
  "1706":
    1: "Хм.\nПока не удалось найти щит, да?\nНу, продолжай искать, ладно?\nОчень важно, чтобы кто-нибудь сообщил, где он находится."
  "1707":
    1: "Если бы его щит был в моём замке, я думаю, я бы об этом знал.\nВозможно, если бы ты ушёл, тебе бы повезло больше в его поисках…"
  "1708":
    1: "Ах.\nКакой печальный день — когда столь благородный рыцарь пал от рук таких отвратительных чудовищ!\nВы поступили правильно, принеся мне его щит.\nЯ позабочусь о том, чтобы он и его люди получили все почести, которых они заслуживают.\nЯ в долгу перед вами, и вы заслужили мою благосклонность перед советом.\nВот ваша награда."
  "1709":
    1: "Что ж, ты можешь рассчитывать на мой голос в Высшем Совете.\nЯ тебе полностью доверяю.\nЯ отправил гонца с поручением, чтобы Сликкер Сильвертанг проголосовал за тебя от моего имени.\nСейчас я очень занят и должен заняться другими делами.\nУверен, ты сможешь справиться с любыми проблемами и недоразумениями, которые могут возникнуть в связи с этим делом.\nДа.\nСовершенно верно."
  "1710":
    1: "Я не могу выразить вам всю свою благодарность за то, что вы раскрыли этого ужасного предателя и его преступления против престола.\nЯ понимаю, что вы выполняете весьма важную миссию, поэтому в знак признания ваших заслуг перед Короной я считаю своим долгом предоставить вам королевскую яхту для путешествий на безвозмездной основе.\nОна доставит вас даже до Острова Отшельника, если вам это понадобится.\nЕщё раз спасибо!"
  "1711":
    1: "Я — Верховный Паладин, и как таковой я отвечаю за присвоение и сохранение званий и обязанностей, присущих паладинам.\nТе паладины, кто желает выполнить задание для официального повышения до звания крестоносца, должны спасти деву, находящуюся в беде.\nТе из вас, кто не является паладинами, получат звание почетного крестоносца, а всем будет выплачена щедрая золотая награда.\nВернитесь ко мне с этой девушкой, и я повышу всех паладинов, помогавших в её спасении, до звания крестоносца."
  "1712":
    1: "Я знаю, что сейчас не хватает девушек, попавших в беду, но это задание — традиционное испытание.\nЯ действительно не могу пойти на исключение в этом случае.\nПродолжай искать — я уверен, что ты кого-нибудь найдёшь.\nЕсли это поможет, я слышал, что Мелоди Сильвер, дочь знатного Джона Сильвера, удерживается в плену головорезами на Острове Тумана."
  "1713":
    1: "Я слышал рассказы об этом смелом спасении и очень рад, что вы вернулись вместе с мисс Сильвер.\nЯ немедленно позабочусь о том, чтобы её вернули семье.\nОтличная работа!\nНастоящим я официально повышаю всех паладинов до звания крестоносцев, а всех, кто не является паладинами, — до звания почётных крестоносцев!"
  "1714":
    1: "Что ж, тогда!\nСтать крестоносцем — это, конечно, хорошо, но стать героем — ещё лучше.\nКак ты, наверное, уже догадался, условием получения статуса героя является убийство дракона.\nЯ знаю, что это кажется сложной задачей, но традиции требуют своего.\nХуже того, нельзя убить просто любого дракона — нужно убить дракона с именем.\nВаша задача — убить Лонгфанга Увядающую Шкуру и вернуться с когтем или зубом в качестве доказательства.\nК счастью, мы знаем, что Лонгфанг обитает в пещере в горах за замком Даркмур.\nОн убил уже не менее двенадцати самозваных героев, так что будьте осторожны!"
  "1715":
    1: "Нет смысла возвращаться ко мне, чтобы рассказывать о своём задании.\nЯ не могу изменить ни правила, ни само задание.\nЛунфан ждёт твоего меча мести.\nА теперь за дело!"
  "1716":
    1: "Отлично!\nНа один ужасный монстр в мире стало меньше — это хорошо.\nНастоящим я официально присваиваю всем крестоносцам звание героев, а всем почетным крестоносцам — статус почетных героев! Пусть вы и впредь достойно носите это звание!"
  "1717":
    1: "Всегда приятно пообщаться с героями королевства!\nВернись в более спокойные времена, и мы поделимся историями о чести и отваге у костра!"
  "1718":
    1: "В дворце смертельно скучно, и все мне указывают, что делать.\nБыть членом королевской семьи — не такая уж большая удача, и пока отец в отъезде, мне никому не разрешают выходить за пределы дворца.\nЯ уже несколько месяцев не выходил из замка!\nВ любом случае, вы, похоже, довольно важные люди.\nА что, если бы вы помогли мне выбраться отсюда и пожить у вас пару дней?\nПока я не могу предложить вам ничего значительного в обмен, но я останусь у вас в долгу.\nКогда-нибудь я смогу отплатить вам.\nВ конце концов, я же принц!\nЯ выйду через потайную дверь и встречусь с вами снаружи."
  "1719":
    1: "Пойдем в цирк!"
  "1720":
    1: "Похоже, принц Николай исчез, пока вы отдыхали."
  "1721":
    1: "Э-э.\nПривет. <слабо улыбается> Поверишь, что я заблудилась, и эти милые люди везли меня домой?\nНет?\nНаверное, я бы тоже не поверила.\nПолагаю, тогда нам пора возвращаться в замок."
  "1722":
    1: "Нам следует вернуться в замок Айронфист."
  "1723":
    1: "<Николай обращается к тебе> Ну, спасибо, что вытащил меня из замка.\nИзвини за эту затею с цирком… Надеюсь, я не доставил тебе слишком много хлопот.\nЯ сам зайду внутрь, чтобы никто не догадался, что это ты меня похитил.\nЕщё раз спасибо и до свидания.\nЯ это запомню, и теперь у меня у тебя должок!"
  "1724":
    1: "Спасибо, что отвез меня домой.\nЯ у тебя в долгу!"
  "1725":
    1: "Все говорят, что мой дядя Арчибальд был не самым хорошим человеком и что он чуть не отнял трон у моего отца, но мы его победили.\nОтец велел Таниру превратить его в камень, а потом запер его в библиотеке.\nТам уже много лет никто не бывал."
  "1726":
    1: "Ты хочешь освободить Арчибальда?!\nЕсли Оракул велел тебе это сделать, то, наверное, нам стоит, но он наверняка доставит нам неприятности, как только вырвется на свободу — это точно.\nЯ знаю, где находится колокол, превративший его в камень, но без «Третьего глаза» я не смогу открыть семейную гробницу, в которой он хранится.\nЭто один из трёх драгоценных камней, которые нужно вставить в дверь склепа, чтобы открыть его.\nУ меня есть два из них — один в короне моего отца, а другой — в его скипетре, но мой отец спрятал третий и не сказал мне, где он находится.\nЕсли бы ты смог его найти, я бы смог открыть склеп и достать колокол."
  "1727":
    1: "Без «Третьего глаза» я не смогу попасть в хранилище, чтобы достать для тебя колокол, который освободит Арчибальда.\nНаверное, он спрятал его где-то рядом с замком, ведь раньше он просто выходил на улицу и приносил его, когда нужно было открыть хранилище."
  "1728":
    1: "Ты нашёл «Третье око»!\nЛадно, подожди здесь… Колокол должен быть в хранилище.\n<Николай выбегает из тронного зала и через некоторое время возвращается> Вот он!"
  "1729":
    1: "Надеюсь, ты знаешь, что делаешь.\nВсе говорят, что мой дядя — довольно коварный человек."
  "1730":
    1: "пропущенный текст 38"
  "1731":
    1: "Подожди минутку, Танир, и я сделаю так, чтобы тебе стоило позволить мне… О. <Арчибальд долго молчит> Полагаю, я должен поблагодарить вас за то, что вы освободили меня из каменной тюрьмы.\nСпасибо!\nТы говоришь, тебе нужно заклинание, которое я создал?\n<протягивает руку к полкам и достаёт библиотечный свиток> Что ж, в качестве награды я подарю тебе «Ритуал Пустоты».\nИспользуй его с пользой для себя.\nНу, я уверен, что ты очень занят, как и я… <Арчибальд машет руками и исчезает>"
  "1732":
    1: "Спасибо, что спасли меня из лап этих хулиганов!\nО, как бы я хотела найти способ отблагодарить вас!"
  "1733":
    1: "На меня возложена традиционная обязанность следить за, э-э, не совсем честными делами в Королевстве.\nМой Дом занимается этим на протяжении веков, руководствуясь принципом, что такие дела будут существовать всегда и что их лучше контролировать и регулировать, чем оставлять без внимания.\nНедавно некий человек, называющий себя «Принцем воров», начал узурпировать мою власть в Свободной гавани.\nОн не только бросает вызов моей власти, но и сотрудничает с той отвратительной новой сектой, которая недавно возникла… как она там называется?\n«Му», или «Як», или «Барк»… нет… как там.\nКакой-то животный звук.\nВ любом случае, мои источники сообщают, что этот культ замышляет свергнуть короля и захватить власть в Энроте.\nЭто плохое дело, и его нужно остановить.\nВы можете начать с того, что арестуете Принца воров и приведете его ко мне в цепях.\nЯ, конечно же, щедро вознагражу вас."
  "1734":
    1: "пропущенный текст 42"
  "1735":
    1: "У меня нет никакой информации о том, где он находится, так что бесполезно со мной об этом говорить.\nПопробуй отправиться в Свободную гавань и поинтересоваться там.\nНаверняка у него есть укрытие где-то в этом городе или поблизости.\n<Улыбается> Если найдёшь, где он живёт, обязательно загляни под кровать и в шкаф — скорее всего, он прячется под кучей одежды."
  "1736":
    1: "Ах!\nДрузья мои, вы вернулись с посылкой!\nМолодцы!\nВот вам вознаграждение.\nВы можете рассчитывать на мою полную поддержку в совете. <обращаясь к принцу> Добро пожаловать в мой скромный дом, могущественный принц.\nЯ приготовил комнату специально для вас.\nСтража!\nУведите его."
  "1737":
    1: "Ваша работа по поимке «Принца воров» принесла мне немалую пользу.\nВы можете рассчитывать на мою полную поддержку в Высшем Совете."
  "1738":
    1: "Помимо выполнения обязанностей инспектора по нелицензированной коммерческой деятельности, я являюсь Верховным жрецом Энрота.\nВ мои полномочия входит повышение клириков до звания священников, а при наличии оснований — священников до звания верховных жрецов.\nВ настоящее время все вакансии священников заняты, и я не могу повысить новых кандидатов без создания дополнительных должностей.\nТакой шаг был бы крайне нестандартным, но если кто-то окажет королевству выдающуюся услугу, такое повышение будет допустимо.\n<Потирая виски> Если подумать, есть одна услуга, которая мне нужна.\nНесколько месяцев назад храм в Свободной гавани был уничтожен пожаром.\nЕсли бы вы смогли восстановить его, у меня появился бы повод повысить любого из вас, клириков, до звания священника.\nПоскольку я очень хочу, чтобы эта работа была выполнена, я даже готов присвоить тем, кто не является клириком, почетное звание священника, и я хорошо вам заплачу за вашу услугу.\nВам нужно будет нанять каменотеса и плотника и показать им храм, над которым вы хотите, чтобы они работали."
  "1739":
    1: "Храм, который я просил тебя восстановить, по-прежнему лежит в руинах.\nЛюди лишены того утешения, которое им по праву принадлежит, а ты возвращаешься ко мне с пустыми руками.\nУходи отсюда и заверши свою миссию!"
  "1740":
    1: "Отличная работа!\nХрам восстановлен, и оскорбление богов устранено.\nВ знак благодарности за эту услугу я с радостью повышаю всех клириков до звания священников, а всем, кто не является клириками, присваиваю звание почетного священника.\nПоздравляю!"
  "1741":
    1: "Кажется, немного рано повышать кого-либо до звания верховного жреца, учитывая, что повышение до звания священника произошло совсем недавно.\nВедь многие ждут всю жизнь, чтобы получить такое повышение, но получают его лишь посмертно.\nОднако выдающаяся заслуга могла бы ускорить это повышение — ну, скажем, прямо сейчас… И у меня на уме как раз такая заслуга.\nЕретические монахи, живущие на островах к востоку от Свободной гавани, похитили наш священный потир.\nЗаберите его у монахов и поместите в храм, который вы восстановили.\nЗатем вернитесь ко мне."
  "1742":
    1: "У монахов по-прежнему хранится чаша, а в нашем храме её до сих пор нет.\nПочему вы медлите?"
  "1743":
    1: "Вижу, ты вернул чашу!\nОтличная работа, но тебе ещё нужно поместить её в храме.\nНемедленно отнеси её туда и вернись ко мне, чтобы получить повышение!"
  "1744":
    1: "Вы добились успеха!\nПохоже, мне придётся сдержать своё обещание и проводить более нерегулярные, досрочные повышения.\nЯ делаю это с удовольствием.\nНастоящим я повышаю всех священников до звания верховных жрецов, а всех почетных священников — до звания почетных верховных жрецов."
  "1745":
    1: "Хотя твой путь к званию верховного жреца был почти неприлично быстрым, за все свои годы я не видел лучших верховных жрецов.\nЯ благодарен тебе за всё, что ты сделал для меня и для Энрота."
  "1746":
    1: "Сейчас %s, месяц %s.\nОтправляйтесь к святилищу %s и помолитесь там, чтобы получить награду."
  "1747":
    1: "Чтобы совершить паломничество, вам нужно дождаться начала нового месяца."
  "1748":
    1: "совершал смелые поступки"
  "1749":
    1: "Что ты потерял?"
  "1750":
    1: "1"
  "1751":
    1: "2"
  "1752":
    1: "3"
  "1753":
    1: "Иногда у меня возникают огромные трудности с запоминанием того, чему я научился.\nНе знаю, почему так происходит, но я нашел способ обойти эту проблему.\nЯ собираюсь создать зеркало, которое позволит мне заглянуть в прошлое, чтобы вспомнить то, что я забыл.\nДля этого мне нужны «Песочные часы времени», но мои обязанности и исследования не позволяют мне самостоятельно отправиться на их поиски.\nГоворят, что песочные часы находятся в тёмной пещере где-то недалеко от... <делает паузу>\nНет, это было «Копьё Тьмы»...\nГде же песочные часы?\n<снова делает паузу>\nЯ должен был это вспомнить.\n<щелкает пальцами>\nКонечно!\nОни закопаны в старом форте к югу отсюда.\nЯ могу предложить тебе свою поддержку в совете, если ты поможешь мне создать моё зеркало."
  "1754":
    1: "Ты забыл, где здесь выход?\nЯ иногда забываю.\nДумаю, это те большие двери за твоей спиной.\nИли это кухня?\nВ любом случае, я уверен, что песочных часов здесь нет — если бы они были, я бы их уже давно нашёл."
  "1755":
    1: "Я всё ещё ищу зеркало. <пауза> То есть «Песочные часы»… Я всё время их путаю.\nТы пробовал заглянуть в тёмную пещеру? Нет, постой, это же старый форт к югу отсюда.\nЯ всегда их путаю."
  "1756":
    1: "Теперь мне осталось только вспомнить, как создать зеркало.\nЯ записал все важные моменты, чтобы не забыть, как это делается.\n<замирает> Куда я дел эти записи?\n<задумывается на минуту> Наверное, оставил их где-то на видном месте, возможно, в лаборатории.\nВ любом случае, ваша роль в этом деле выполнена, и я ещё раз благодарю вас.\nВ совете я окажу вам полную поддержку в этом деле.\nКак, вы сказали, вас зовут?"
  "1757":
    1: "Песочных часов там не было?\nАх, да, точно!\nЯ знал, что что-то забыл!\nКлюч там!\nЭтим ключом открывается Кузница… <пауза>\nНу, я не помню, чья это кузница, но именно там хранятся Песочные часы Времени… кажется.\nПосмотреть там не помешает, особенно теперь, когда ты нашёл ключ.\n<пауза>\nПо крайней мере, я ДУМАЮ, что именно это открывает ключ.\nВ любом случае, эту кузницу, лабораторию или что там ещё можно найти на островах к северу от Нью-Сорпигала.\nУдачи!"
  "1758":
    1: "Ещё раз спасибо, что достал для меня песочные часы!\nЕсли бы я только мог вспомнить, куда я их положил.\n<вздыхает>\nЯ буду поддерживать тебя в совете столько, сколько тебе понадобится."
  "1759":
    1: "Я — маг, ответственный за обучение и продвижение колдунов.\nНесмотря на свою мощь, колдун не является вершиной мастеров стихий.\nВолшебники берут за основу знания и способности колдуна и оттачивают их до совершенства.\nУ них гораздо больший магический потенциал, чем у колдуна, и они заслуживают большего уважения.\nОднако путь к получению такого обучения нелегкий.\nНайди Фонтан Магии, выпей из его вод и вернись сюда.\nЕсли тебе удастся это сделать, я обучу тебя искусству волшебника."
  "1760":
    1: "Я — маг, ответственный за\nпродвижение колдунов.\nХотя никто из вас не является колдуном, я — справедливый человек.\nЕсли вам удастся найти Фонтан Магии, я присвою вам почетный статус волшебника.\nВы не получите никаких преимуществ, связанных с обучением волшебников, но завоюете большее уважение в глазах колдунов и волшебников."
  "1761":
    1: "Не проси у меня подсказок — я уже забыл, где находится Фонтан.\nЯ знаю, что это нелегкая задача, но если бы она не была сложной, каждый колдун уже был бы волшебником."
  "1762":
    1: "Ты молодец, что нашел Фонтан.\nЕго местонахождение и силы — тайна, не разглашай, где он находится.\nА теперь позволь мне раскрыть тебе секреты волшебника."
  "1763":
    1: "Ваше обучение не заканчивается на том, чему вы научились как волшебник — остался последний шаг.\nСтатус архимага завершает ваше овладение магией стихий.\nОпираясь на полученное образование, архимаги обладают огромными магическими способностями — они используют магию наиболее эффективно и искусно из всех.\nДля прохождения этого обучения требуется мощный артефакт, принадлежащий могущественному архимагу Драэлу… нет, это был Фрундир… нет, это тоже неверно.\nВообще-то, я, похоже, не могу вспомнить, что это был за артефакт и кому он принадлежал.\nХотя, если бы я его увидел, то наверняка бы вспомнил.\nЯ знаю, что его можно найти в поместье Корлагона, недалеко от Болота Проклятых.\nНайди его там и верни; он мне нужен, чтобы обучить тебя и сделать из тебя архимага."
  "1764":
    1: "Извините, но я до сих пор не вспомнил, что именно вам нужно.\nЯ знаю, что вам нужно обыскать поместье Корлагона."
  "1765":
    1: "Отличная новость!\nЯ помню, что тебе нужно найти!\nКристалл Терракса!\nО, похоже, ты его уже нашёл.\nНу, просто замечательно!\nТогда я смогу обучить тебя искусству магии.\nПервый архимаг, Терракс, использовал этот Кристалл, чтобы овладеть стихиями.\nОгонь, земля, вода и воздух объединились, чтобы создать его, и, изучая его, он узнал многое о магии стихий.\nКроме того, его влияние на свет привело его к открытиям в области магии света и тьмы.\nС тех пор изучение этого кристалла служит руководством для каждого нового архимага.\nПозволь мне показать тебе секреты кристалла."
  "1766":
    1: "У меня сейчас не так много времени на разговоры… Мне предстоит много дел.\nЯ занимаюсь организацией нескольких военных операций по нанесению ударов по демонам вдоль западного побережья.\nТы должен понимать, как и я, что ничто во всём Энроте не представляет такой угрозы для нашей безопасности, как они.\nХотелось бы, чтобы другие Лорды помогли мне, предоставив припасы и войска или просто участвуя в планировании этих атак.\nОни тратят больше времени на ссоры между собой из-за границ, законов и торговли, чем на то, чтобы помочь мне справиться с НАСТОЯЩЕЙ угрозой.\nУ демонов есть передовой пост в Кригспайре, недалеко от Стражей.\nОтсюда они могут организовывать небольшие набеги и собирать разведданные о наших войсках.\nМне нужно, чтобы вы проникли туда и атаковали этот пост, раздобыли как можно больше информации о расположении крепостей дьяволов и схемах патрулирования, а затем уничтожили это место.\nНе дайте ни одному из дьяволов сбежать!\nЭлемент неожиданности и секретность — наше самое сильное оружие."
  "1767":
    1: "Ты всё ещё здесь?\nДемоны находятся на западе, у побережья, а не в моём тронном зале!\nИли ты настолько заблудился?\nУ тебя есть вся необходимая информация для выполнения этой миссии, осталось только выйти и выполнить её."
  "1768":
    1: "Ты провалил свою миссию?\nТы же не дал демонам сбежать, правда?\nЭтот пост ДОЛЖЕН быть уничтожен, чтобы любая крупная атака против них увенчалась успехом.\nПока этот пост существует, твоя миссия по-прежнему в силе."
  "1769":
    1: "Отлично сработано!\nБлагодаря информации, которую ты привёз, у нас теперь есть разведданные, необходимые для организации атаки на демонов, и теперь, когда этот пост устранен, мы сможем нанести по ним удар, когда они этого меньше всего ожидают. Я окажу тебе полную поддержку в совете — надеюсь, что на этот раз совет наконец-то что-нибудь СДЕЛАЕТ."
  "1770":
    1: "Отличная работа — разгромили этих дьяволов!\nЕщё раз благодарю вас.\nВы можете рассчитывать на мою поддержку в совете, по крайней мере до тех пор, пока угроза со стороны дьяволов не минет.\nНадеюсь, вам удастся подтолкнуть совет к действиям.\nКстати, информация, которую вы привезли, подтвердила наши подозрения относительно базы врага.\nОна определенно находится недалеко от города Свит-Уотер в Парадайз-Вэлли."
  "1771":
    1: "Я — Мастер оружия, ответственный за повышение в звании всех рыцарей в Энроте.\nДостойные рыцари могут быть повышены до звания кавалеров.\nКавалеры воплощают дух действия и силу целеустремлённости.\nВдохновлённые их мужественным примером, армии бросаются в бой, а враги в ужасе бегут. Однако, чтобы стать кавалером, необходимо получить рекомендацию от авторитетного лица.\nЕсли бы вам удалось получить такую рекомендацию, этого было бы для меня вполне достаточно."
  "1772":
    1: "Я — Мастер оружия, ответственный за присвоение рыцарского звания.\nК сожалению, никто из вас не является рыцарем, и поэтому навыки, которым я мог бы вас научить, оказались бы бесполезными.\nОднако, если вы того пожелаете, можете попробовать выполнить задание, предназначающееся для будущего кавалера.\nПолучите рекомендацию от авторитетного лица — например, от кавалера — и вернитесь ко мне."
  "1773":
    1: "Ну что ж, вы хотите, чтобы вас выдвинули в кавалеры?\nВ своё время я был отважным рыцарем.\nЯ сражался вместе с Роландом в войнах за престол, хотя теперь я уже слишком стар, чтобы принести какую-то пользу на поле боя.\nПриятно видеть, что Осрик поддерживает рыцарские традиции.\nСкажите ему, что я с гордостью выдвигаю вас в кавалеры, а если он будет вам мешать, пусть сам придёт ко мне."
  "1774":
    1: "Поздравляю!\nЯ знаю, что из вас выйдут отличные рыцари.\nКак бы я хотел вернуть свою юность, чтобы вместе с Осриком участвовать в походе против демонов."
  "1775":
    1: "Да ладно тебе!\nЧеловеку с твоей славой и авторитетом не должно быть сложно попасть в список номинантов.\nТолько не говори мне, что твоя слава надуманная… Ты уверен, что заслуживаешь такой известности?\n<смеётся>\nЯ шучу, успокойся.\nА если серьёзно, я бы посоветовал заглянуть в Свободную гавань или в деревню Рокхэм.\nЯ слышал, что несколько кавалеров часто бывают в местных тавернах."
  "1776":
    1: "Поздравляю!\nВозможно, эта номинация покажется тебе не столь важной, но у нас есть традиция, которой необходимо следовать при этом повышении.\nКак кавалер, ты должен понимать, что традиции и ценности народа необходимо защищать.\nС удовольствием повышаю тебя до звания кавалера!"
  "1777":
    1: "Ах, достойные кавалеры, последний этап вашего обучения — стать чемпионом.\nКавалер — это отважный и благородный воин, но чемпион — это сила, достойная восхищения.\nНикакая сила не может встать между чемпионом и победой.\nСудьба целых военных кампаний решается благодаря отваге, решительности и мощному примеру чемпиона.\nОднако задание, необходимое для получения этого звания, весьма сложно.\nВы должны победить могущественного врага, чтобы доказать свои способности и решимость.\nЕдинственный враг, достойный этой задачи, — человек, известный лишь как Военачальник, опасный и могущественный воин.\nОн командует легионом злых рыцарей, обычно базирующимся к северо-востоку от\nперевала Айсвинд.\nПобедите его, принесите доказательство своей победы, и ваше повышение до звания чемпиона будет гарантировано."
  "1778":
    1: "Ты же не боишься Военачальника, правда?\nЕго террор нужно положить конец.\nТы не сможешь стать чемпионом, прячась под кроватью или просто стоя и глядя на стены — тебе нужно выйти и СДЕЛАТЬ это!"
  "1779":
    1: "Отлично!\nПревосходно!\nЯ не был уверен, что ты вернёшься живым.\nУ Кергмонда был больший потенциал, чем я думал, но ты, безусловно, более чем достоин сразиться с целой армией Кергмондов.\nТы доказал, что достоин звания чемпиона. Не бойся взять в руки оружие, чтобы защитить то, что правильно.\nПусть твои враги боятся твоего приближения, а союзники объединяются под знаменем твоего мужества. А теперь я повышаю тебя до звания чемпиона!"
  "1780":
    1: "Кристалл памяти «Альфа» — Остров Отшельника. Кристалл памяти «Бета» — Аламос. Кристалл памяти «Дельта» — Даркмур. Кристалл памяти «Эпсилон» — Кригспайр."
  "1781":
    1: "Вставьте кристаллы памяти в модули, расположенные выше.\nДля активации Оракула необходимы все четыре кристалла."
  "1782":
    1: "Я — Мелиан, Хранитель Энрота.\nСпасибо, что заменили мои модули памяти.\nАрчибальд забрал их отсюда, когда я отказался помогать ему в борьбе за престол.\nВы подошли как нельзя кстати.\nКриганы вторглись в наш мир, и вы должны попытаться остановить их.\nК сожалению, попытки Арчибальда извлечь из меня информацию нанесли мне такой ущерб, что сейчас я не могу помочь вам напрямую.\nВместо этого я могу лишь дать вам совет. Хотя большинство криганов можно убить обычным оружием и заклинаниями, элитные стражники и представители высшего эшелона обладают более прочной кожей и естественной защитой, которая защищает их от всего, кроме очень мощного оружия.\nВ планетарном центре управления, расположенном под мной, находятся оружие и доспехи, которые понадобятся вам, чтобы выжить в сражении с врагом.\nОднако мои приказы разрешают проход только тому, у кого есть Куб управления.\nМои приборы показывают, что единственный Куб управления, оставшийся на Энроте, можно найти где-то под землёй в Драконьем Песке."
  "1783":
    1: "Теперь у вас есть доступ к Центру управления.\nПросто попросите перенести вас, и я выполню вашу просьбу.\nОднако одно предупреждение: стражи Центра управления больше не находятся под моим контролем, поэтому, пожалуйста, будьте осторожны во время посещения Центра."
  "1784":
    1: "Как я уже говорил, криганы устойчивы к большинству видов оружия, имеющихся на Энроте, но не ко всем.\nЧтобы избавить мир от них, вам нужно найти место крушения их корабля и уничтожить главный реактор.\nЕдинственная проблема заключается в том, что взрывы, вызванные разрушением реактора, уничтожат эту планету.\nВам понадобится мощное заклинание, чтобы взрыв не нанёс ущерба планете, но такого заклинания в современном мире не существует.\nЕдинственный человек, который, на мой взгляд, мог бы знать такое заклинание, — это Арчибальд, но он сейчас не в состоянии научить вас этому.\nЧто ещё хуже, реактор не поддаётся воздействию обычного оружия или заклинаний — для его уничтожения вам понадобятся древние оружия, хранящиеся в Центре управления."
  "1785":
    1: "Хотя Арчибальд повредил мою память, я всё ещё помню, какую опасность представляет для нашего мира наш древний враг — криганы.\nКриганы впервые появились примерно 1500 лет назад, нападая на отдалённые колонии и грабя их ресурсы.\nВ то время считалось, что им просто нужны определённые минералы и с ними можно договориться, но это оказалось не так.\nИх жизненный цикл заставляет их размножаться до тех пор, пока мир не сможет прокормить их, после чего они отправляют корабли на другие миры, чтобы возобновить цикл.\nИх нападения на империю Древних нарушили сеть судоходства и связи, которая держала нас всех вместе, что привело к «Тишине», ознаменовавшей первый год нашего современного календаря.\nБез поддержки с родных миров наша только зарождавшаяся технология потерпела крах, приведя нас к этому плачевному положению.\nЯ бы помог восстановить нашу технологию, но, похоже, в сознании многих людей я стал религиозной фигурой, и очень немногие навещают меня или понимают, что я могу предложить.\nВозможно, этот кризис с криганами, с которым мы столкнулись, приведет людей в чувство — если, конечно, мы его переживем."
  "1786":
    1: "Мне известно, что вы входите в число немногих искателей приключений, стремящихся завоевать расположение Высшего Совета.\nЗачем вам это нужно — я не знаю и меня это не интересует.\nБуду откровенен:\nЯ люблю деньги и хочу их больше.\nНамного больше.\nУ меня есть план, как на время зафиксировать цены на перевозку в мою пользу, и мне нужны компетентные агенты для его реализации.\nХорошо выполните это задание, и я окажу вам свою поддержку, не говоря уже о больших деньгах.\nВот план:\nКаждую из девяти транспортных компаний Королевства нужно убедить взимать не менее 48 золотых за фунт за милю перевозимого груза.\nОни все конкурируют друг с другом и знают об этом, поэтому ни одна из них не захочет сделать первый шаг раньше остальных.\nМне всё равно, как вы их убедите — просто выполните задание и доложите мне."
  "1787":
    1: "Не все компании согласились поднять цены!\nЗачем ты вернулся, если только для того, чтобы продемонстрировать свою некомпетентность?\nЯ мог бы получить огромную прибыль, если бы ты выполнил свою работу и убедил этих идиотов поднять цены!\nМНЕ ПРИДЕТСЯ ДЕЛАТЬ ЭТО САМОМУ?\nМожет, мне послать кого-нибудь другого?\nПочему я окружаю себя ИДИОТАМИ?!\nК настоящему моменту я потерял много золота из-за того, что ты не завершил свою работу!\nЯ вычту эти убытки из твоего окончательного гонорара, будь уверен!"
  "1788":
    1: "Наконец-то!\nУже думал, что ты никогда не закончишь.\nМожет, ты всё-таки на что-то годен.\nТы заслужил мою поддержку в совете и, конечно же, своё вознаграждение."
  "1789":
    1: "Если вы беспокоитесь о том, что крестьяне страдают из-за моего повышения цен, не стоит.\nЯ сделал это ради благой цели.\nМне нужно было собрать деньги на зернохранилища, чтобы хранить излишки зерна, которые мы собираем в этом году.\nЦены на доставку снова снизились, а наличие дешевого и высококачественного зерна с лихвой компенсирует это.\nВот так!\nЯ ведь не такой уж и ужасный, правда?"
  "1790":
    1: "Хотя в это и трудно поверить, я являюсь одним из лучших друидов в стране.\nВ силу этого я уполномочен присваивать друидам звания «великого друида» и «архидруида», при условии, что они докажут свою достойность.\nЧтобы получить звание великого друида, вы должны провести Церемонию Солнца.\nМолитесь в центре Каменного круга в день любого равноденствия или солнцестояния — 20 марта, 21 июня, 23 сентября или 21 декабря.\nЕсли вы будете там в это время, я свяжусь с вами магическим путём и проведу вас через Церемонию, тем самым присвоив вам звание великого друида.\nТе из вас, кто не является друидами, получат почетное звание великого друида, и я уверен, что этот опыт будет для вас полезным."
  "1791":
    1: "Чтобы завершить Церемонию Солнца и получить звание великого друида, тебе необходимо помолиться в центре Каменного круга во время равноденствия или солнцестояния.\nДо тех пор я ничего не могу сделать, чтобы ты получил это звание."
  "1792":
    1: "<Лоретта Флейз связывается с вами с помощью заклинания телепатии> Добро пожаловать на Церемонию Солнца.\nВстаньте в круге жизни лицом к северу так, чтобы перед вами не лежало ни одной тени.\nПоразмышляйте над следующей истиной:\n«Деньги — это всё.\nНет у меня друга вернее денег…» <ухмыляется> Шучу.\nА теперь закройте глаза и помедитируйте, стоя в центре мира и времени, в это единственное возвышенное мгновение. <долгая тихая пауза>\nОткройте глаза.\nНастоящим я повышаю всех друидов до великих друидов, а всех остальных — до почётных великих друидов. <Лоретта исчезает>"
  "1793":
    1: "Итак, ты считаешь, что достоин звания архидруида.\nЧтобы обрести статус архидруида, тебе необходимо пройти «Церемонию Луны».\nРаньше, до раскола последнего поколения друидов на фракции, это было довольно просто, но теперь тебе придётся пробиваться к священному алтарю.\nОн находится в Храме Луны, который в настоящее время контролирует злобный еретик Седрик Друтерс.\nОни ни за что не позволят тебе спокойно провести церемонию, так что, скорее всего, тебе придётся пробиваться туда с боем.\nКак и Церемония Солнца, Церемония Луны должна проводиться в определённом месте и в определённое время.\nПомолись у Алтаря Луны в Храме Луны в полночь в любую полнолунную ночь.\nЕсли ты окажешься там в это время, я свяжусь с тобой с помощью магии и проведу тебя через Церемонию."
  "1794":
    1: "<Лоретта Флейз связывается с вами с помощью заклинания телепатии> Добро пожаловать на Церемонию Луны.\nВстаньте перед алтарём Луны лицом к югу.\nЗакройте глаза и сосредоточьтесь на Круге Времен года и Колесе Жизни.\n<длинная пауза>\nОткройте глаза, друзья мои.\nНастоящим я присваиваю всем великим друидам звание архидруидов, а всем почетным великим друидам — звание почетных архидруидов.\n<Лоретта исчезает>"
  "1795":
    1: "Чтобы провести Церемонию Луны и получить звание архидруида, вам необходимо в полночь в любой день полнолуния встать перед алтарем Луны.\nДо этого момента я ничего не могу сделать, чтобы вы получили это звание."
  "1796":
    1: "На западе Земля ранена.\nЯ чувствую это, мои собратья-друиды, и если вы прикоснетесь рукой к земле и прислушаетесь сердцем, то тоже это почувствуете.\nЯ связан здесь своими обязанностями, но настоятельно призываю вас выяснить источник этой боли.\nЯ уверен, что эта рана и «Ночь падающих звёзд» связаны между собой."
  "1797":
    1: "Я устал от зимы.\nВ моих землях зима, кажется, длится круглый год.\nПо правде говоря, в последние несколько лет лето вообще не наступало.\nЯ пришёл к выводу, что с погодой что-то не так, и хочу, чтобы с этим что-то сделали.\nЯ знаю о вашей репутации и слышал, что вы способны на всё.\nУ меня для вас предложение.\nПокончите с зимой в моих землях, и я окажу вам поддержку в Высшем Совете, когда придет время, и вы об этом попросите.\nЕсли это хоть как-то поможет, я слышал, что где-то к западу отсюда на вершине горы живёт отшельник, который тщательно изучал погоду."
  "1798":
    1: "Не могли бы вы как-нибудь ускорить это чудо?\nСнег на земле все больше накапливается, и нам скоро придется ставить здания на сваи!"
  "1799":
    1: "Я смотрел в окно, когда погода резко изменилась и снег исчез!\nЧудо!\nНастоящее чудо!\nВы оказали мне и моему народу огромную услугу.\n<Ударив себя в грудь> Считайте графа Эрика фон Стромгарда своим другом навсегда!"
  "1800":
    1: "За ваши заслуги я дарую вам свою благосклонность в Высшем Совете!\nДа живете долго, о враги Зимы!"
  "1801":
    1: "20 лет назад я выиграл ежегодные соревнования по стрельбе из лука, проходившие в замке Айронфист, и с тех пор удерживаю титул чемпиона.\nЭто дает мне право по своему усмотрению присваивать лучникам звания «боевой маг» и «мастер-лучник».\nЯ присвою звание «боевой маг» всем лучникам из вашей компании, если вы окажете мне небольшую услугу. Мне нужен ключ от старых «Башен Дракона», установленных возле каждого крупного поселения в Энроте для сбивания летающих существ.\nДумаю, их можно настроить так, чтобы они сбивали только монстров, а не всё, что летает в воздухе. Поскольку это своего рода мой личный проект, остальным из вас я присвою почетное звание «боевой маг».\nКлюч находится в моей старой крепости у южного входа в мои земли.\nМне пришлось оставить его там, когда несколько лет назад огры и их союзники отняли у меня эту крепость.\nВернитесь с этим ключом — и получите награду.\nИ я не буду плакать в пиво, если заодно убьёте много этих монстров.\nОни отняли у меня крепость!"
  "1802":
    1: "Нет ключа — нет награды.\nНаши условия просты и понятны.\nЗабери ключ из моей старой крепости и вернись, как только его получишь."
  "1803":
    1: "Отлично!\nВы добыли ключ и, надеюсь, уничтожили немало этих отвратительных тварей.\nНастоящим я присваиваю всем лучникам звание «боевой маг», а всем, кто не является лучником, — звание «почетный боевой маг»."
  "1804":
    1: "Я хотел получить этот ключ, чтобы открыть Башни Дракона и настроить их так, чтобы они не стреляли без разбора по летающим целям.\nСуществует способ настроить башни так, чтобы они стреляли только по крупным объектам, и я хочу, чтобы все они были настроены в интересах Королевства.\nМагия становится всё более распространённой, как и истории о молодых колдунах, которых сбивают с неба, потому что они не знали, как работают эти башни.\nКлюч у вас.\nЕсли ты настроишь все башни так, чтобы они стреляли только по крупным объектам, я повышу всех боевых магов из вашего числа до звания мастеров-лучников, а всех почетных боевых магов — до звания почетных мастеров-лучников."
  "1805":
    1: "Хм.\nНе все башни были сброшены.\nИх легко найти, хотя добираться до них приходится довольно долго.\nСамая доступная находится в Уайткэпе, к западу от нас."
  "1806":
    1: "Я вижу, что тебе удалось в некоторой степени настроить башни, но работа ещё не закончена.\nЕсть ещё башни, которые остались не настроенными.\nЗаверши начатое и вернись ко мне, чтобы получить награду."
  "1807":
    1: "Я знал, что не зря в тебя поверил!\nТы устранил серьезную проблему в нашем королевстве, не говоря уже о том, что оказал услугу самому себе… Теперь можно без опаски летать над городами.\nС большим удовольствием я повышаю всех боевых магов до звания мастеров-лучников, а всех почетных боевых магов — до звания почетных мастеров-лучников."
  "1808":
    1: "Добро пожаловать, мастера-лучники!\nВы можете согреться у моего камина в любое время!"
  "1809":
    1: "Мне нравится здесь, наверху.\nКак будто я могу наблюдать, как вращается мир, находясь высоко в небе и в полном одиночестве.\nБезмятежно.\nНеприкосновенно.\nПочти… пророчески.\nЯ вижу, как облака бурлят и плывут, распадаются и смешиваются.\nЯ могу предсказать погоду почти с абсолютной точностью.\n<Улыбается> Прямо сейчас я предсказываю, что будет ещё больше снега."
  "1810":
    1: "Значит, Стромгарду нужно чудо с погодой, да?\nА я всё это время думал, что именно он виноват в том, что снег не перестаёт идти.\nЯ без труда могу снять заклятие с погоды, и если ты поспешишь к нему, то, уверен, сможешь взять ответственность на себя."
  "1811":
    1: "Как бы я ни был благодарен вам за компанию, на самом деле я — отшельник.\nУверен, у вас масса важных дел, и вам не стоит больше загромождать мой дом."
  "1812":
    1: "Рад вас видеть, герои!\nПожалуйста, не тратьте ни своё, ни моё драгоценное время в такие моменты.\nИспользуйте свои навыки на благо Энрота и оставьте меня в покое — я занимаюсь планированием!\nКогда эта битва закончится, ТОГДА мы сможем поделиться историями о доблести и мастерстве."
  "1813":
    1: "Привет!\nВы пришли укладывать плитку на пол?\nОй!\nИзвините, на мгновение я забыл, кто вы такие!\nЕщё раз добро пожаловать, архимаги!\nМожет быть, вы сможете помочь мне с одним-двумя экспериментами, когда у вас будет меньше дел?"
  "1814":
    1: "Мне разрешено голосовать только по тем вопросам, по которым лорд Темпер даст мне конкретные указания.\nЕсли вы заручитесь его одобрением, то по его рекомендации я проголосую в вашу пользу."
  "1815":
    1: "Осрик поручил мне проголосовать в поддержку вашего дела.\nОт его имени я оказываю вам полную поддержку."
  "1816":
    1: "Леди Флейз абсолютно не интересуют ваши проблемы, и поэтому я даже не буду рассматривать вашу просьбу."
  "1817":
    1: "От имени Лоретты я голосую за то, чтобы мы отправились к Оракулу."
  "1818":
    1: "Лорд Стоун не уполномочил меня голосовать от вашего имени.\nВам придётся обсудить этот вопрос с ним."
  "1819":
    1: "Энтони поддерживает твою просьбу о встрече с Оракулом, и я голосую за тебя от его имени."
  "1820":
    1: "Я не могу голосовать по вопросам, не касающимся лорда Стромгарда.\nПока вы не получите его поддержку, я не смогу проголосовать за вас."
  "1821":
    1: "Я предлагаю вам отправиться к Оракулу, как велел сам Эрик фон Стромгард."
  "1822":
    1: "Пока я не получу положительного ответа от лорда Ньютона по поводу вашей просьбы, я не могу оказать вам свою поддержку."
  "1823":
    1: "Альберт разрешил мне поддержать вашу просьбу о встрече с Оракулом."
  "1824":
    1: "Вы не продемонстрировали должной лояльности моему господину, лорд Хамфри, и я не могу отдать за вас свой голос."
  "1825":
    1: "Пока я являюсь членом этого совета, вам не будет разрешено посетить Оракула.\nЯ не уверен в вашей искренности и не удовлетворю вашу просьбу."
  "1826":
    1: "Не думайте, что вы победили!\nСкоро хватка Айронфистов ослабеет, и я стану вашим королём!\nИ будьте уверены: я вас не забуду..."
  "1827":
    1: "Чёрт!\nОпять не получилось!"
  "1828":
    1: "Ну, если у Лоретты появился новый план, я в деле!\nНо тебе лучше убедить все остальные компании присоединиться!"
  "1829":
    1: "Вы уже состоите в этой гильдии."
  "1830":
    1: "Если вы хотите вступить в Гильдию Стихий, вам нужно обратиться ко мне.\nСтоимость вступления составляет 100 золотых монет.\nТолько члены гильдии могут приобретать заклинания из нашей обширной библиотеки.\nВ гильдии имеются заклинания всех четырёх стихийных дисциплин, и, как и у всех гильдий королевства, у нас есть два гильдейских зала.\nЧленство в одном из них автоматически означает членство и в другом."
  "1831":
    1: "Мой священный долг — принимать пожертвования в пользу Гильдии «Я».\nЕсли вы пожертвуете 100 золотых монет, мы предоставим вам статус члена гильдии.\nЧленам гильдии разрешается приобретать заклинания в любой Гильдии «Я» на всей территории королевства."
  "1832":
    1: "Пссс… Хочешь стать членом «Логова Буканьеров»?\nУ нас в королевстве есть два отделения, и мы помогаем нашим членам, обучая их некоторым ценным навыкам.\nУверен, ты понимаешь, о чём я.\nВсе, что нам нужно, — это 25 золотых монет, и наши услуги будут в твоем распоряжении."
  "1833":
    1: "Привет.\nЯ — рекрутер гильдии «Служба охраны» — «особой» гильдии, уполномоченной лордом Энтони Стоуном предоставлять услуги охраны купцам, независимо от того, хотят они этого или нет.\nНо мы не все бандиты — мы также предлагаем легальные услуги и курсы обучения.\nЧленство в гильдии «Служба охраны» стоит 50 золотых и дает право приобретать курсы по любому навыку, который мы преподаем."
  "1834":
    1: "Гильдия контрабандистов не только провозит контрабандные товары мимо таможенных инспекторов — она также предлагает обучение всем навыкам, необходимым контрабандисту для достижения мастерства в выбранной профессии.\nВсе наши члены получают доступ к лучшим наставникам в этой сфере.\nВсе, что мы просим, — это единовременный вступительный взнос в размере 50 золотых монет."
  "1835":
    1: "ЭЙ!\nГильдия наёмников «Край Клинков» ищет ИМЕННО ТЕБЯ — при условии, что ты готов заплатить небольшую сумму за вступление.\nЗа 25 золотых мы предоставим тебе доступ к наставникам по многим навыкам, необходимым хорошему наёмному мечнику для достижения успеха."
  "1836":
    1: "Наемническая гильдия «Преимущество дуэлянтов» предлагает ценные уроки по всем навыкам, которые необходимы воину, ведущему кочевой образ жизни.\nЗа единовременную плату в размере 50 золотых мы предоставим вам доступ не только к одному из наших прекрасных залов гильдии, но и к ОБОИМ.\nПомните: наша гильдия — единственная, где преподают ценный навык ремонта."
  "1837":
    1: "Единственный способ научиться правильно носить пластинчатую броню — если не считать четырёхлетней службы в Железной армии — это вступить в наёмническую гильдию «Ярость берсерков».\nМы обучаем и многим другим навыкам, поэтому наша скромная плата за пожизненное членство в размере 50 золотых монет — это действительно недорого."
  "1838":
    1: "Если вы уже являетесь членом Гильдии Стихий, то, уверен, вы уже успели убедиться, что их «превосходная библиотека» не соответствует вашим высоким требованиям.\nИменно поэтому я настоятельно рекомендую вам оплатить членский взнос в Гильдии Воздуха.\nПоскольку мы специализируемся на магии воздуха, у нас вы с большей вероятностью найдёте то, что ищете.\nК тому же цена совсем невысокая!\nВсего 50 золотых за пожизненное членство."
  "1839":
    1: "Членство в Гильдии Земли откроет вам доступ к нашей великолепной библиотеке заклинаний стихии Земли.\nКак и все гильдии заклинаний, у нас есть два гильдейских дома, и членство в одном из них автоматически означает ваше членство в другом.\nСтоимость вступления составляет всего 50 золотых монет."
  "1840":
    1: "Возможно, вы заметили, что в последнее время по всему королевству разгуливают монстры и враждебно настроенные люди.\nЗащищаться с помощью простых заклинаний, которым Гильдия Стихий обучает своих членов, бывает непросто.\nВам нужна огневая мощь!\nГильдия Огня владеет самыми разрушительными заклинаниями из всех известных человечеству, за исключением магии Тьмы.\nЗа 50 золотых монет вы получите доступ к нашей превосходной библиотеке."
  "1841":
    1: "Членство в Гильдии Воды даёт вам право приобретать наши заклинания преобразования и перемещения.\nВ мои обязанности входит набор новых членов и сбор с них членских взносов.\nСтоимость составляет 50 золотых, и в эту сумму входит членство как в зале начинающих, так и в зале адептов нашей гильдии."
  "1842":
    1: "Я — рекрутер гильдии «Тело».\nМы знаем, что многие считают простые заклинания исцеления, доступные в гильдии «Я», вполне достаточными, но уверяем вас: это не так.\nЕсли вы вступите в нашу гильдию, у вас появится возможность приобрести гораздо более эффективные заклинания магии Тела.\nСтоимость — 50 золотых монет."
  "1843":
    1: "Величайшие заклинания магии разума нельзя найти в Гильдии «Я» — их можно найти только в Гильдии Разума.\nЯ уполномочен продавать членство в Гильдии Разума за 50 золотых монет.\nУ нас есть два зала гильдии, и членство в любом из них — это одно и то же."
  "1844":
    1: "Когда наступает смерть, меры, которые принимает человек для предотвращения финансовых потерь для скорбящей семьи, зачастую оказываются недостаточными, что приводит к непосильным расходам на похороны.\nЛучший способ избежать этих расходов — инвестировать в заклинание «Воскрешение мертвых» или «Воскрешение», которое можно приобрести у дружелюбных ребят из Гильдии магии духов.\nДа, члены гильдии получают полный доступ к нашим роскошным и хорошо укомплектованным библиотекам за небольшую единовременную плату в размере 50 золотых.\nДействуйте прямо сейчас и обретите душевный покой!"
  "1845":
    1: "Магия Света — это самая могущественная магия, которой человек может владеть, не нанося ущерба своей душе.\nПоскольку нигде больше в королевстве её не найти, мы уверены, что наша цена в 1000 золотых за членство в гильдии является справедливой."
  "1846":
    1: "Я знаю, чего ты хочешь — силы.\nТы устал от неэффективных заклинаний, которые лишь слегка царапают и порезают твоих врагов, но не наносят им реального урона.\nПозволь мне познакомить тебя с Гильдией Тьмы.\nНаши заклинания — самые сильные во всей стране, вот и всё.\nЧленство в нашей гильдии обойдётся тебе всего в 1000 золотых."
  "1847":
    1: "Вступите в Гильдию Стихий за 100 золотых"
  "1848":
    1: "Вступить в Гильдию Самости за 100 золотых"
  "1849":
    1: "Присоединяйтесь к «Логову пиратов» за 25 золотых"
  "1850":
    1: "Присоединяйтесь к «Службе защиты» за 50 золотых"
  "1851":
    1: "Вступите в Гильдию контрабандистов за 50 золотых"
  "1852":
    1: "Вступить в «Край Клинков» за 25 золотых"
  "1853":
    1: "Вступить в «Клинок дуэлянта» за 50 золотых"
  "1854":
    1: "Присоединяйтесь к «Ярости берсерков» за 50 золотых"
  "1855":
    1: "Вступите в Гильдию воздушников за 50 золотых"
  "1856":
    1: "Вступите в Гильдию Земли за 50 золотых"
  "1857":
    1: "Вступите в Гильдию Огня за 50 золотых"
  "1858":
    1: "Вступите в Гильдию Воды за 50 золотых"
  "1859":
    1: "Вступите в Гильдию Тела за 50 золотых"
  "1860":
    1: "Вступите в Гильдию Ума за 50 золотых"
  "1861":
    1: "Вступите в гильдию «Дух» за 50 золотых"
  "1862":
    1: "Вступите в Гильдию Света за 1000 золотых"
  "1863":
    1: "Вступите в «Тёмную гильдию» за 1000 золотых"
  "1864":
    1: "Чтобы учиться здесь, вы должны быть членом этой гильдии"
  "1865":
    1: "За ваши многочисленные преступления и злодеяния вы приговорены к одному году лишения свободы."
  "1866":
    1: "Последователи Баа и банда карманников совершают набеги на Мист с островов, расположенных к северу.\nОни попадают на Мист через телепорт, расположенный на северо-западе острова.\nЯ активирую телепорт, чтобы вы смогли добраться до их островов и избавиться от них.\nУверен, что на тех островах у них хранится всё украденное, а обратно вы сможете вернуться через их телепорт."
  "1867":
    1: "Ты так и не нашёл это."
  "1868":
    1: "Вот тот %s, который вы потеряли.\nВ будущем вам нужно быть более внимательными."
  "1869":
    1: "Сликер Сильвертунг отказался выполнить мой приказ?\nЭто, должно быть, измена!\nВпрочем, я знаю его так давно, и он никогда раньше не ослушался приказа… Возможно, у него галлюцинации.\nДа, вот в чём дело.\nОн так много времени уделял расследованию этого ужасного культа Баа, что это повлияло на его рассудок… Я даже нашёл один из их плащей в его комнате.\nВозможно, ты сможешь найти для него лекарство.\nОни наверняка знают, что с ним сделали!\nЯ бы начал с их штаб-квартиры к востоку от замка Кригспайр.\nВот, возьми этот плащ… Возможно, он тебе пригодится."
  "1870":
    1: "Ой, боже мой!\nПохоже, Сликер Сильвертунг действительно предатель!\nКто бы мог такое предположить?\nТы поступил правильно, принеся мне это письмо.\nНемедленно отнеси его в Высший Совет, чтобы мы раз и навсегда избавились от этого злобного предателя!"
  "1871":
    1: "Пожалуйста, поспешите с поиском лекарства для Сликкера Сильвертонга!\nЯ уверен, что этот бедняга, наверное, ужасно страдает под действием их страшного заклинания контроля над разумом!"
  "1872":
    1: "Добро пожаловать в «Цирк Солнца»!\nУ нас есть множество игр для вашего развлечения.\nВы можете обменять призы, выигранные в различных играх, на бочки вина или золотые пирамиды.\nЧтобы получить бочку вина, вам понадобится не менее 10 очков, а 30 и более очков позволят вам выиграть золотую пирамиду.\nЕсли вы ещё не знаете, каждый магнитный камень стоит 1 очко, каждое перо гарпии — 3 очка, а каждый четырёхлистный клевер — 5 очков."
  "1873":
    1: "Отсутствующий текст:\nОбмен главного шатра цирка на приз"
  "1874":
    1: "Извините, но у вас пока нет 10 очков.\nПочему бы вам не сыграть ещё несколько игр?"
  "1875":
    1: "Поздравляем!\nВы выиграли бочонок вина!\nЗдесь нет ограничений на призы, так что продолжайте играть!"
  "1876":
    1: "Поздравляем!\nВы выиграли золотую пирамиду!\nОтлично сработано! Не забывайте, что количество призов не ограничено, так что продолжайте играть!"
  "1877":
    1: "Добро пожаловать!\nЧтобы сыграть в мою игру, просто заплатите 50 золотых и подходите, чтобы сразиться со мной.\nВ зависимости от ваших результатов вы можете выиграть либо магнитный камень, либо перо гарпии, либо четырехлистный клевер.\nЕсли вы сыграете плохо, вы ничего не выиграете.\nВы можете обменять свои магнитные камни, перья и клеверы в главном шатре."
  "1878":
    1: "Жаль!\nТы был совсем близок.\nЗа 50 золотых я дам тебе ещё один шанс."
  "1879":
    1: "Отлично, я уже думал, что тебя поймал.\nТы выиграл магнитный камень!"
  "1880":
    1: "Отличная работа, ты выиграл перо гарпии!"
  "1881":
    1: "Невероятно!\nТы уверен, что не списывал?\nНу, правило есть правило.\nВот твой приз — четырехлистный клевер!"
  "1882":
    1: "В рамках работы по восстановлению Храма здесь, в Свободной гавани, я собираю храмовые гонги.\nЕсли у вас есть гонги, я заплачу вам 2000 золотых за каждый из них."
  "1883":
    1: "Этот немного грязноватый, но, пожалуй, сойдет.\nВот золото, которое я тебе обещал за него.\nСпасибо за помощь!"
  "1884":
    1: "Я ищу кости для своих ритуалов.\nЯ предпочитаю кости людей или гуманоидов, но, пожалуй, обойдусь и тем, что вы найдёте.\nЗа кости, которые мне пригодятся, я готов заплатить до 1000 золотых."
  "1885":
    1: "Хм...\nКость ноги человека?\nЭто как раз подойдет.\nЭта кость, безусловно, стоит 1000 золотых."
  "1886":
    1: "Многие люди не имеют возможности пойти в цирк, поэтому я собираю цирковые призы, чтобы раздать их тем, кто не может пойти туда сам.\nЯ куплю магнитные камни по 5 золотых за штуку, если вы захотите от них избавиться."
  "1887":
    1: "Спасибо!\nВы слишком щедры — это станет прекрасным подарком.\nВот 5 золотых, которые я вам должен."
  "1888":
    1: "Моя дочь хочет сходить в цирк, но у нас никогда не получается найти время, когда цирк приезжает к нам в город.\nЯ бы с удовольствием подарила ей пучок красивых перьев гарпии.\nЯ куплю у вас любые перья гарпии по 10 золотых за штуку."
  "1889":
    1: "Спасибо!\nТолько не говорите об этом моей дочери, я хочу сделать ей сюрприз.\nВот 10 золотых."
  "1890":
    1: "Я слышал, что на Пустынном курорте Абдула можно приобрести по-настоящему занятные вещи, если расплачиваться золотыми пирамидами.\nНадеюсь, когда-нибудь туда попасть, а пока хочу запастись пирамидами.\nЯ куплю у вас любые золотые пирамиды по 1000 золотых."
  "1891":
    1: "Добро пожаловать, искатели приключений!\nУ вас для меня что-нибудь есть?\nЯ, знаете ли, очень занятой человек."
  "1892":
    1: "Я могу помочь вам стать экспертом в использовании посоха в качестве оружия.\nДля этого вам понадобится навык владения посохом среднего уровня (4-й ранг) и 2000 золотых."
  "1893":
    1: "Не хочу хвастаться, но я лучший боец с посохом во всей стране.\nЯ обучу вас до уровня мастера за 5000 золотых, если навык владения посохом достиг уровня эксперта (7)."
  "1894":
    1: "Мои уроки помогут вам улучшить технику владения мечом.\nЧтобы мои советы принесли вам пользу, вы должны уже обладать навыками среднего уровня (4-й ранг).\nЯ беру 2000 золотых с каждого ученика."
  "1895":
    1: "Я вхожу в число лучших фехтовальщиков в стране.\nЗа 5000 золотых я буду обучать учеников, обладающих высоким уровнем мастерства (7-й ранг). С остальными я не буду тратить своё время."
  "1896":
    1: "Хочешь научиться нескольким трюкам с кинжалом?\nТы попал по адресу, друг мой.\nЯ научу тебя, если ты уже немного умеешь обращаться с кинжалом (4-й уровень) и, конечно же, сможешь заплатить мне 2000 золотых."
  "1897":
    1: "Кинжал — это быстрое и незаметное оружие, для владения которым требуется больше ума, чем силы.\nЕсли вы уже достаточно опытны (7-й ранг), я могу научить вас мастерству этого оружия за 5000 золотых."
  "1898":
    1: "Обращаться с топором сложнее, чем кажется.\nЕсли ты уже немного попрактиковался в обращении с топором (4-й уровень), я с удовольствием покажу тебе все тонкости расщепления черепов.\nМоя плата — 2000 золотых."
  "1899":
    1: "Итак, ты хочешь освоить навык владения топором по-гномски?\nМои уроки покажут тебе, как значительно увеличить урон, наносимый топором. Для этого мне потребуется высокий уровень навыка (7-й ранг) и 5000 золотых."
  "1900":
    1: "Чтобы правильно владеть копьем, нужна практика.\nНужно уметь не дать противнику пройти мимо острия и знать, что делать, если ему всё же удастся это сделать.\nЕсли у тебя уже достаточно навыков (4-й ранг), я могу показать тебе правильные приёмы.\nЗа свои услуги я прошу всего 2000 золотых."
  "1901":
    1: "Немного практики с копьем поможет вам избежать роковых ошибок в бою, но более интенсивные тренировки позволят вам добиться максимальной эффективности в обращении с копьем.\nЯ научу вас секретам мастеров, если вы уже немного попрактиковались (7-й ранг).\nМоя плата составляет 5000 золотых."
  "1902":
    1: "Научиться быстро и точно стрелять из лука — это навык, на освоение которого может уйти вся жизнь.\nЯ могу помочь тебе встать на этот путь, если у тебя уже есть базовая подготовка (4-й ранг) и 2000 золотых в кошельке.\nЧто скажешь?"
  "1903":
    1: "Много лет назад я открыл для себя технику, позволяющую выпустить в два раза больше стрел за то же время, чем стрелок, прошедший стандартную подготовку. Стоимость моего обучения составляет 5000 золотых, и вы должны уже обладать высоким уровнем мастерства (7-й ранг) в стрельбе из лука."
  "1904":
    1: "Многие считают, что в использовании булавы или молота нет ничего сложного, но они ошибаются.\nЗабивать кого-то до смерти булавой — это почти то же самое, что играть на барабанах.\nНужно целиться в твёрдые костные участки противника, чтобы оружие быстро отскакивало и само готовилось к следующему удару.\nЯ могу научить вас этой технике, если у вас уже есть небольшой навык (4-й уровень), за 2000 золотых."
  "1905":
    1: "Мастер булавы способен одним ударом вырубить врага.\nЯ отрабатывал эту технику годами и довел её до совершенства.\nЕсли у вас есть навык (7-й уровень), я могу научить вас своей технике за 5000 золотых."
  "1906":
    1: "Ни одно современное оружие не может сравниться по мощи с оружием «Времени чудес».\nНе уверен, что какое-либо из тех древних оружий сохранилось до наших дней, но если ты найдешь такое, я могу показать тебе несколько хитростей.\nПравда!\nЯ не сумасшедший!"
  "1907":
    1: "Давным-давно я нашел старое оружие, которое стреляло солнечным светом и могло убить практически всё, против чего я его применял.\nЯ убил столько драконов, что это стало для меня обычным делом.\nЯ мог сбивать их с неба, как больших, медлительных уток.\nОднажды оно просто перестало работать, и моя карьера драконоборца подошла к концу.\nЕсли ты когда-нибудь принесешь мне такое оружие, я за 5000 золотых покажу тебе, как им правильно пользоваться."
  "1908":
    1: "При правильном использовании щит даёт огромное преимущество в бою.\nБез надёжной защиты не победить.\nЯ обучу тебя владению щитом на уровне эксперта за 2000 золотых, если навык уже достиг 4-го уровня."
  "1909":
    1: "Пользоваться щитом легко, но пользоваться им правильно — гораздо труднее.\nЯ могу значительно усилить вашу защиту.\nЯ обучаю только опытных бойцов, поэтому ваш навык владения щитом должен достичь уровня эксперта (7).\nМоя плата — 3000 золотых."
  "1910":
    1: "Я обучу вас ношению кожаных доспехов на уровне эксперта за 1000 золотых, если навык достиг 4-го уровня."
  "1911":
    1: "Мои уроки позволят вам достичь мастерского ранга в ношении кожаных доспехов за 3000 золотых.\nЧтобы мои уроки принесли вам пользу, вы должны уже обладать высоким уровнем мастерства (7-й ранг) в ношении кожаных доспехов."
  "1912":
    1: "Умение носить кольчугу — это навык, который нужно развивать, как и любой другой.\nЭто совсем не то же самое, что надеть тяжелое пальто, это точно!\nЯ могу немного повысить твою квалификацию за 1000 золотых, при условии, что у тебя уже есть некоторый навык (4-й уровень) в ношении кольчуги."
  "1913":
    1: "Кольчуга — это оружие войны, в этом нет никаких сомнений, и я тщательно подбираю тех, кого обучаю ее использованию.\nПрежде чем начать обучение, я требую, чтобы мои ученики достигли высокого уровня подготовки (7-й ранг).\nМоя плата составляет 3000 золотых."
  "1914":
    1: "Эксперт носит латы легко и изящно.\nЯ обучу вас этому за 1000 золотых, если навык достиг 4-го уровня."
  "1915":
    1: "Тот, кто в совершенстве владеет искусством ношения пластинчатой брони, носит её так же легко, как собственную одежду.\nЯ буду обучать этому только опытных мастеров (7-го ранга) за 3000 золотых."
  "1916":
    1: "Тайны огня поистине глубоки, и их можно передать только тому, кто хорошо освоил это искусство (4-й уровень).\nЗа 1000 золотых я могу поднять ваш навык до уровня «эксперт»."
  "1917":
    1: "Я долго изучал тайны магии огня и наконец овладел этим искусством.\nЗа 4000 золотых я могу поделиться некоторыми из своих знаний с мастерами высокого уровня (7-го ранга)."
  "1918":
    1: "Существуют способы черпать магическую энергию из воздуха, чтобы ваши заклинания действовали дольше и эффективнее.\nЕсли вы владеете искусством магии воздуха (4-й уровень), я могу научить вас этому за 1000 золотых."
  "1919":
    1: "Магия воздуха — самая тонкая и причудливая из всех стихийных магий, которые можно изучить.\nВвиду сложности освоения этого навыка я требую высокого уровня владения (7-й ранг).\nМоя цена — 4000 золотых."
  "1920":
    1: "Вода — это стихия движения и перемен.\nБез навыков владения водной магией путь от одного конца королевства до другого займет целую вечность.\nЯ могу повысить ваш уровень мастерства до уровня «эксперт», если вы уже немного попрактиковались (4-й ранг).\nМоя плата составляет 1000 золотых."
  "1921":
    1: "Мастер магии Воды, владеющий заклинанием «Маяк Ллойда», может путешествовать по королевству сколько пожелает.\nЯ обучаю этому только экспертов (7) и беру 4000 золотых."
  "1922":
    1: "Если вы хотите стать экспертом в магии земли, то вы попали по адресу.\nВсе, что вам нужно, — это умение на умеренном уровне (4-й ранг) и 1000 золотых в качестве гонорара."
  "1923":
    1: "Я могу научить экспертов в магии земли стать мастерами магии земли.\nЧтобы я смог вам помочь, вы должны обладать очень высоким уровнем мастерства (7-й ранг), а моя плата составляет 4000 золотых."
  "1924":
    1: "Магия духов — это магия, необходимая для того, чтобы воскресить мертвого.\nЯ могу обучить тебя этому важному навыку, если у тебя уже есть небольшой опыт (4-й уровень) и ты готов заплатить мне 1000 золотых."
  "1925":
    1: "Самые совершенные заклинания духовной магии позволяют практикующему воскрешать мертвых. Решение о возвращении души из места её последнего упокоения — дело поистине ответственное, и я буду обучать только тех, кто обладает достаточным мастерством (7-й ранг), за 4000 золотых."
  "1926":
    1: "Я могу отточить ваши навыки в магии разума, подняв вас до уровня эксперта в этом жизненно важном навыке.\nВы должны иметь небольшой опыт (4-й ранг) и быть готовы заплатить 1000 золотых."
  "1927":
    1: "Я обучу любого специалиста по магии разума, обладающего достаточным уровнем мастерства (7-й ранг), до уровня мастера за 4000 золотых."
  "1928":
    1: "«Магия тела» — это магия заклинаний исцеления и укрепления.\nЗа 1000 золотых я обучу любого желающего до уровня эксперта.\nЧтобы я смог вам помочь, достаточно лишь немного попрактиковаться заранее (4-й ранг)."
  "1929":
    1: "Вы сможете раскрыть тайны тела всего за символическую цену в 4000 золотых.\nТолько высококвалифицированные (7-го ранга) специалисты смогут извлечь пользу из моих учений."
  "1930":
    1: "Я могу раскрыть вам некоторые секреты магии света, если у вас уже есть начальные навыки (4-й уровень).\nМоя плата составляет 1000 золотых."
  "1931":
    1: "Мастер магии света — один из самых могущественных заклинателей в мире.\nЯ могу повысить уровень практически любого эксперта до уровня мастера, но не делаю этого без веских причин.\nДля этого требуется высокий уровень навыка (7-й ранг) и 5000 золотых."
  "1932":
    1: "Ах!\nНесомненно, ученик тьмы!\nЕсли ты хочешь обучиться магии Тьмы, я могу тебе помочь, если ты уже немного практиковался (4-й ранг).\nМоя плата составляет 1000 золотых."
  "1933":
    1: "Я могу подготовить специалистов по магии Тьмы до уровня мастера, если они соответствуют моим требованиям.\nЯ обучаю только по-настоящему преданных делу — тех, кто обладает высоким мастерством (7-й ранг).\nЯ не делаю исключений и беру всего 5000 золотых ради того, чтобы распространить тьму по всему миру."
  "1934":
    1: "Если вы хоть немного занимались приключениями, то знаете, насколько важно понимать, для чего служит ваше снаряжение и сколько оно стоит.\nЯ могу повысить ваш уровень мастерства в этом навыке, если у вас уже есть начальный уровень навыка «Опознание предметов» (4-й ранг).\nМоя цена — 500 золотых."
  "1935":
    1: "Возможно, вы уже успели убедиться: хотя умение точно определять сокровища — это хорошо, одного этого недостаточно.\nЯ изменю\nэто.\nЗа 2500 золотых я научу экспертов становиться мастерами.\nВсе, что вам нужно, — это достаточный уровень мастерства (7-й ранг)."
  "1936":
    1: "Я обучу вас торговле на уровне эксперта за 2000 золотых, если навык достиг 4-го уровня.\nЦена может показаться высокой, но оно того стоит!"
  "1937":
    1: "Эксперт торговли встречается редко, а мастер — ещё реже.\nЯ завершу ваше обучение за 4000 золотых, если навык достиг уровня эксперта (7), а личность — 50."
  "1938":
    1: "В кузнице можно починить снаряжение, но что делать, если вещь сломалась в дороге?\nЯ обучу вас ремонту предметов на уровне эксперта за 500 золотых, если навык достиг 4-го уровня."
  "1939":
    1: "Я обучаю специалистов по ремонту, чтобы они стали мастерами своего дела.\nДля оплаты моих услуг у вас должен быть высокий уровень мастерства (7-й ранг) и 2500 золотых."
  "1940":
    1: "Да, ты хочешь научиться бодибилдингу, верно?\nТогда слушай меня внимательно.\nЯ научу тебя всему, как надо, за 500 золотых, если у тебя уже есть немного мяса на теле (4-й ранг), чтобы начать."
  "1941":
    1: "Если я когда-нибудь и видел таких жалких слабаков, как вы, то, честное слово, не могу этого вспомнить!\nУ голодающих крыс на костях мяса больше!\nЗа плату в 2500 золотых я буду безжалостно избивать вас, пока вы не станете мастерами бодибилдинга!\nОднако, прежде чем я возьмусь за вас, вы должны уже иметь опыт тренировок (7-й уровень) и быть достаточно выносливыми, чтобы выдержать мои избиения (Выносливость 50)!"
  "1942":
    1: "Путь к обретению силы в материальном мире лежит через обретение силы в духовном мире.\nЯ могу показать вам этот путь.\nЗа вознаграждение в размере 500 золотых я помогу вам достичь уровня «эксперт» в медитации, если вы уже имеете небольшой опыт (4-й уровень)."
  "1943":
    1: "Кто нарушает мою медитацию, как камешек нарушает тишину пруда?\nАх, искатели Истинного Пути.\nЕсли вы уже некоторое время (7-й уровень) идёте по пути медитации, что необходимо для моего обучения, я могу привести вас к статусу мастера за 2500 золотых."
  "1944":
    1: "Наблюдательный человек иногда может заметить ловушку буквально за мгновение до того, как она сработает.\nТем, кому везёт и кто обладает навыками, иногда удаётся вообще избежать ущерба.\nЯ могу научить вас распознавать и обходить эти ловушки, если вы уже немного попрактиковались (4-й уровень) и готовы заплатить мне 500 золотых."
  "1945":
    1: "Тот, кому повезло иметь хорошо натренированный глаз, часто может избежать опасности, когда ловушка срабатывает неожиданно.\nЕсли у вас уже есть большой опыт (7-й уровень), я сделаю вас мастером навыка «Восприятие».\nМоя плата составляет всего 2500 золотых."
  "1946":
    1: "Не можете заставить людей с вами разговаривать?\nВ этом виновата ваша репутация!\nНемного дипломатического мастерства поможет смягчить последствия ваших прошлых проступков.\nЯ могу повысить ваш уровень дипломатии до «эксперта», если вы уже немного попрактиковались в этом деле (4-й уровень) и готовы заплатить мне 500 золотых."
  "1947":
    1: "Даже убийца имеет право на суд, а хороший дипломат способен представить заранее устроенную засаду отчаянной самообороной.\nЯ обучаю дипломатов-экспертов до уровня мастера. Для этого нужен навык уровня эксперта (7), слава 200 и 2500 золотых."
  "1948":
    1: "Большая часть сокровищ этой земли находится в руках монстров и преступников, и они стали очень изобретательны в создании своих ловушек.\nВам действительно нужно знать, как обойти эти ловушки и остаться в живых, чтобы рассказать об этом.\nЯ могу вам помочь.\nЕсли у вас уже есть небольшой навык (4-й ранг), я могу обучить вас до уровня эксперта всего за 500 золотых."
  "1949":
    1: "Одно дело — убить богатого и могущественного монстра, а совсем другое — преодолеть ловушки, которые он устанавливает на своих сундуках с сокровищами.\nМои тренировки по обезвреживанию ловушек — лучшие во всём королевстве.\nЕсли вы уже являетесь экспертом и обладаете этим навыком (7-й ранг), я могу научить вас мастерству за 2500 золотых."
  "1950":
    1: "Чтобы прожить долгую и плодотворную жизнь, нужно научиться хорошо учиться.\nЕсли ты уже понимаешь, о чём я говорю (4-й уровень), я смогу помочь тебе достичь гораздо большего.\nМои уроки стоят 2000 золотых."
  "1951":
    1: "Я — учитель учителей, мастер знаний.\nЯ могу поднять ваше понимание окружающего мира на новый уровень.\nЯ буду обучать только тех, кто прошел обучение у моих бывших учеников и досконально понимает мои принципы (7-й ранг).\nЕсли вы достаточно умны (Интеллект 50), я могу поднять вас до ранга мастера за 5000 золотых."
  "1952":
    1: "У тебя не хватает золота!"
  "1953":
    1: "Вы пока не отвечаете требованиям для обучения."
  "1954":
    1: "Чтобы стать экспертом, сначала необходимо изучить сам навык!"
  "1955":
    1: "Прежде чем стать мастером, нужно сначала стать экспертом в данном деле."
  "1956":
    1: "Не в твоём состоянии!"
  "1957":
    1: "Вы уже достигли уровня эксперта в этом навыке."
  "1958":
    1: "Вы уже достигли уровня мастера в этом навыке."
  "1959":
    1: "Лучший учитель владения посохом во всей стране, Джаспер Райс, живёт недалеко от Серебряной бухты.\nВам стоит поговорить с ним, если вы хотите продолжить обучение владению посохом."
  "1960":
    1: "Гай Хэмптон из Блэкшира научил меня всему, что я знаю о мече.\nЕсли вы хотите овладеть искусством владения мечом, то именно у него стоит учиться."
  "1961":
    1: "По сравнению с таким человеком, как Джулс Майлз, я всего лишь новичок.\nОн живёт недалеко от Касл-Стоуна и может научить любого, как улучшить свои навыки владения кинжалом."
  "1962":
    1: "Авинрил Смайтерс освоил искусство владения топором ещё до того, как большинство из нас появилось на свет, но он не обучает людей.\nУверен, если бы вы смогли сделать для него что-то особенное, он, возможно, согласился бы научить человека, как по-настоящему владеть топором.\nБольшую часть времени он проводит в «Пристанище» в «Болоте Проклятых»."
  "1963":
    1: "Лучший копьеносец в Энроте, Бертон Рутерфорд, живёт в Даркмуре.\nНе знаю, почему он выбрал для проживания такое отдалённое место.\nМожет, ему не нравится, когда его беспокоят ученики?"
  "1964":
    1: "Несмотря на то, что лорд Стромгард прекрасно владеет луком, он не принимает учеников.\nЧтобы освоить стрельбу из лука, вам нужно поговорить с Десмондом Уэллером в Кригспайре."
  "1965":
    1: "Если вы хотите освоить боевую булаву, вам нужно поговорить с Эрролом Остерманном в Блэкшире."
  "1966":
    1: "Очень немногие люди вообще знают о существовании этого оружия.\nЕдинственный человек, которого я когда-либо видел с древним оружием, — это Рекселла, но в последний раз она жила в Парадайз-Вэлли… Не уверен, что она там вообще ещё осталась."
  "1967":
    1: "Никто в Блэкшире не умеет владеть щитом так, как Бронвин Мек.\nЕсли вы хотите освоить искусство владения щитом, вам нужно обратиться именно к ней."
  "1968":
    1: "Арлен Сейлор руководит лучшей школой по искусству ношения кожаных доспехов.\nОбычно он проводит занятия недалеко от Касл-Стоуна."
  "1969":
    1: "В Даркмуре живёт Дэвид Фезер — единственный человек, о котором я знаю, способный научить вас в совершенстве владеть кольчугой."
  "1970":
    1: "Форрест Сазерс, один из главных паладинов в Энроте, обучает искусству владения доспехами возле замка Темпер."
  "1971":
    1: "Чтобы освоить навык «Огонь», вам нужно поговорить с Джезебель в Мисте."
  "1972":
    1: "Као Салем может научить вас более сложным приёмам магии воздуха в Мисте."
  "1973":
    1: "Чтобы в совершенстве овладеть навыком «Вода», вам нужно пройти обучение у Харпера Коллинза в Мисте."
  "1974":
    1: "Реве Ботания может научить вас владеть навыком «Земля» в Серебряной бухте."
  "1975":
    1: "Овладеть Духом можно с помощью епископа Инквизиторио.\nОн живет прямо за замком Айронфист, его невозможно не заметить."
  "1976":
    1: "Тэйн Ропер может научить вас овладеть навыком «Ум» в Серебряной бухте."
  "1977":
    1: "Если вы хотите овладеть искусством «магии тела», вам нужно поговорить с Гилбертом Хаммером в Серебряной бухте."
  "1978":
    1: "Магия света — это сложное искусство, а Великого Учителя Ки Ло Ни можно найти только где-то в окрестностях замка Аламос."
  "1979":
    1: "Су Ланг Маньчжу был моим учителем по магии Тьмы.\nОн живет в небольшом домике в деревне в Райской долине."
  "1980":
    1: "Ханс Гиффорд может показать вам ещё больше интересных приёмов по опознанию предметов в Свободной гавани."
  "1981":
    1: "Самый красноречивый торговец, которого я когда-либо видел, — это Уилл Оттоман из Серебряной бухты.\nЕсли вы хотите повысить свой навык «Торговля», вам стоит обратиться именно к нему."
  "1982":
    1: "Если вы считаете, что я хорошо разбираюсь в ремонте, то Райан Трикл — лучший мастер в округе.\nУверен, его можно будет уговорить помочь вам освоить это ремесло.\nНасколько я знаю, он живёт недалеко от Касл-Стоуна."
  "1983":
    1: "Джейсон Трэвелер научит вас тонкостям бодибилдинга.\nОн работает в Свободной гавани — если, конечно, вы сможете выдержать его интенсивные тренировки."
  "1984":
    1: "Если ваша цель — овладеть искусством медитации, вам нужно встретиться с Норио Ариганакой в «Мисте»."
  "1985":
    1: "Навык «Восприятие» можно освоить с помощью Макро Калигулы в Даркмуре."
  "1986":
    1: "Жак Коль сотрудничает с лордом Стромгардом над разработкой экспериментальных рецептов.\nЕсли у него найдётся время, возможно, он сможет помочь и вам в освоении искусства алхимии."
  "1987":
    1: "Величайший специалист по обезвреживанию ловушек, Гейб Лестер, в настоящее время обучает своему ремеслу недалеко от Касл-Стоуна.\nЕсли вы хотите освоить все лучшие приёмы, вам нужно обратиться именно к нему."
  "1988":
    1: "Джон Так может научить вас освоить навык обучения.\nПо-моему, он до сих пор живёт в Серебряной бухте."
  "1989":
    1: "Король гномов Снергл отстранил Роклина от власти и захватил руководство над кланами гномов.\nСейчас Роклин находится где-то в изгнании, а Снергл стоит у руля.\nБольшинство гномов не любят Снергла и хотели бы, чтобы Роклин вернулся к власти.\nК сожалению, Снергл захватил как пещеры Роклина, так и крупнейшую гномскую железную шахту.\nСнергл, опасаясь измены вблизи своего дома, отстранил меня, мастера оружия гномов, от должности.\nНам нужен кто-то, кто сможет лишить Снергла власти любыми необходимыми средствами.\nЯ даже готов научить вас, людей, обращаться с топором, как настоящие гномы, если вы поможете нам."
  "1990":
    1: "Мне нужно доказательство того, что Снергл был побеждён.\nИзвините, но я просто не могу поверить вам на слово.\nПринесите какой-нибудь его личный предмет, например, его топор."
  "1991":
    1: "О, какой чудесный день!\nС кончиной Снергла мы теперь можем отправиться на поиски Роклина, чтобы вернуть его к власти.\nВечная благодарность тебе за это, и все гномы мира в долгу перед тобой."
  "1992":
    1: "Мэр города Мист рассматривает возможность разрешить «Братству Серебра» обеспечивать правопорядок в городе в рамках их борьбы со злом.\nЯ знаю, что отряды преследования «Серебряных Шлемов» убивали невинных людей в ходе своего ошибочного крестового похода против «зла», но живых свидетелей их злодеяний нет.\nМне нужно, чтобы ты совершил штурм их аванпоста к югу отсюда и нашёл доказательства, чтобы я смог убедить мэра изгнать их из Миста."
  "1993":
    1: "Продолжайте поиски — жизнь мэра и моя могут оказаться в ваших руках.\nБез доказательств мы не можем принять против них никаких мер."
  "1994":
    1: "Как я и подозревал!\nУдивлен, что мэр оказался третьим в их списке врагов.\nДумаю, он ДЕЙСТВИТЕЛЬНО немного некомпетентен, но он не плохой человек.\nЕщё раз спасибо, пожалуйста, примите это золото и мою благодарность в качестве награды."
  "1995":
    1: "Думаю, я, возможно, просто разрешу «Братству Серебра» следить за порядком в окрестностях Миста.\nВозможно, им удастся выследить всех злодеев и превратить этот остров в рай."
  "1996":
    1: "Не могу поверить, что эти «Серебряные Шлемы» хотели меня убить!\nЯ за всю свою жизнь ни разу не сделал ничего плохого!\nНу, по крайней мере, ничего хуже, чем любой другой мэр.\nЕщё раз спасибо, что остановили их."
  "1997":
    1: "Не могли бы вы оказать Храму Баа услугу?\nПохоже, мои собратья покинули старый храм, расположенный к северо-западу отсюда, в слишком большой спешке, и там остался канделябр, необходимый для некоторых наших ритуалов.\nНи один из жрецов Баа не хочет возвращаться туда, потому что они боятся проклятия, которое, как считается, лежит на храме.\nОднако если вы принесете мне этот канделябр, я смогу вознаградить вас вместо них."
  "1998":
    1: "Тебя тоже отпугнуло это проклятие?\nЯ тебя понимаю.\nНо Баа — человек терпеливый.\nЕсли ты все-таки наберешься смелости и найдешь этот канделябр, я по-прежнему готов вознаградить тебя за это."
  "1999":
    1: "Отлично!\nСлава Баа!\nВижу, ты всё-таки не испугался проклятия.\nВот твоя награда, и ещё раз спасибо за помощь."
  "2000":
    1: "Кто бы мог подумать, что зло, с которым я боролся по всему Энроту, окажется так близко от моего собственного дома?\nДжерард Блэкэмс когда-то был моим заместителем.\nНезадолго до того, как он убил меня, он начал переписываться с Храмом Баа, и они стали подбрасывать ему цели для нашего Ордена.\nВ итоге я сам оказался одной из таких целей, а Джерард захватил власть над Орденом.\nТеперь «Серебряные Шлемы» столь же злы, как и те, на кого они охотятся.\nЯ уверен, что Храм Баа несет ответственность за разложение нашего Ордена.\nВ то же время брат Джеррарда, Маркус-чародей, снабжает «Серебряные Шлемы» высококачественным снаряжением.\nПо последним сведениям, Маркус помогал кому-то в кузнице на острове к юго-востоку."
  "2001":
    1: "Мою племянницу Мелоди похитили из её дома в Мисте и заперли на ближайшем к нему аванпосте «Серебряного Шлема».\nОна — одна из немногих, кто знает, что меня убили.\nЯ уверен, что Джеррард запер её именно по этой причине, но полагаю, что он хочет заставить её выйти за него замуж, чтобы устранить любое сопротивление своему лидерству в «Братском ордене Серебра»."
  "2002":
    1: "Спасибо, что спасли мою племянницу.\nЗа этой стеной находится тайное помещение, которое я все эти годы скрывал даже от Джеррарда.\nМожете брать всё, что захотите; я предпочту, чтобы это досталось вам, а не Джеррарду."
  "2003":
    1: "У Джеррарда есть анкх с выгравированным на нём именем, который ему подарили жрецы Баа.\nЯ не совсем уверен, для чего именно используется этот анкх, но, возможно, он использует его, чтобы показать, что он друг Баа."
  "2004":
    1: "Ты хочешь победить Снергла, да?\nНу, он прекрасно знает, как к нему относятся большинство гномов.\nОн заселся в старых пещерах Роклина, окруженный ордой своих верных гномов.\nЕсли там что-нибудь и произойдёт, он просто сразу заперётся в своей личной комнате и оставит всё на попечение своих последователей.\nТебе понадобится ключ, чтобы попасть в его комнату; выбить высококачественную гномскую дверь тебе ни за что не удастся.\nЯ был управляющим у Роклина — я хорошо знаю эту комнату, и у меня, как раз, до сих пор при себе спрятан ключ от неё.\nК твоему счастью, я оказался в этой камере из-за Снергла, и нет ничего, чего бы я хотел больше, чем поскорее положить конец его правлению.\nВот ключ — считай это платой за то, что я выпущу тебя из этой камеры."
  "2005":
    1: "Спасибо, что отпустили меня.\nЕдинственное, что удержало «Серебряных Шлемов» от того, чтобы убить меня, — это то, что я священник.\nЧестно говоря, я удивлён, что они вообще проявили ко мне хоть какую-то милость.\nСлушайте, я слышал какие-то странные звуки, доносившиеся отсюда… Думаю, где-то поблизости может быть потайной проход.\nВ любом случае, мне, наверное, пора уходить; я не хочу больше оставаться в этой камере."
  "2006":
    1: "Драгуны, которые в последнее время терроризируют окрестные дороги, украли мою арфу из одного из моих караванов.\nЯ не достаточно силен, чтобы отнять её у них, но готов заплатить тому, кто способен сделать это за меня.\nНайдите арфу и верните её, и я вознагражу вас."
  "2007":
    1: "Моя арфа до сих пор не найдена, поэтому за её возвращение по-прежнему объявлено вознаграждение.\nЯ знаю, что драгуны базируются к югу отсюда, недалеко от побережья.\nПожалуйста, верните мне мою арфу."
  "2008":
    1: "Большое спасибо!\nМоя жена просто обожает эту арфу; я так рад, что вам удалось её вернуть!\nВот, примите это в качестве вознаграждения.\nЯ слышал слухи, что драгуны сотрудничали с Гильдией Теней.\nЕсли это правда, то мэр Нью-Сорпигала, несомненно, с удовольствием увидел бы доказательства этого.\nЕщё раз спасибо за вашу помощь."
  "2009":
    1: "Ну, это ДЕЙСТВИТЕЛЬНО музыкальный инструмент, но это не арфа.\nПозвольте объяснить разницу:\nВы принесли флейту.\nФлейта — это трубка с отверстиями.\nА у арфы — струны.\nЭто помогло?\nЯ уверен, что арфа у них до сих пор есть, и я щедро вознагражу вас за её возвращение."
  "2010":
    1: "У меня есть несколько теорий о нежити, которые я очень хотел бы доказать.\nМне действительно нужны останки нежити, желательно очень могущественного существа.\nВообще-то, мне нужны именно останки ПЕРВОГО лича — Этрика Безумного.\nОднако я ученый и не располагаю средствами, чтобы заполучить такой образец.\nУ меня есть небольшие сбережения, и я готов хорошо заплатить вам за останки Этрика."
  "2011":
    1: "Поверьте, я прекрасно понимаю, насколько сложна эта задача.\nНе торопитесь, но, по крайней мере, выполните работу как следует."
  "2012":
    1: "Отличная работа! Теперь я могу завершить своё исследование.\nЕсли мне удастся понять, как действует «Ритуал бесконечной ночи», возможно, я найду способ обратить этот процесс вспять.\nВот награда, которую я тебе обещал."
  "2013":
    1: "Наш город периодически страдает от нашествия гигантских пауков.\nЯ почти уверен, что если убить королеву пауков, остальные пауки исчезнут.\nВ настоящее время я предлагаю вознаграждение тому, кто сможет убить королеву пауков."
  "2014":
    1: "Никто не вернулся с доказательством того, что убил королеву пауков, поэтому награда по-прежнему в силе."
  "2015":
    1: "Какой жуткий трофей!\nЭто сердце доказывает, что ты победил злобную королеву пауков.\nНадеюсь, теперь пауки больше не будут терроризировать Нью-Сорпигал.\nВот награда, которую я тебе обещал."
  "2016":
    1: "Седрик Друтерс и его «Небесный Орден» захватили «Монолит» — древнее святилище друидов.\nИх мрачные ритуалы развращают «Монолит», и их необходимо остановить — какой бы алтарь они ни использовали в качестве центра своих церемоний, его нужно осквернить.\nСделайте это для нас, и мы вознаградим вас за потраченное время и оказанные услуги."
  "2017":
    1: "Я рад снова тебя видеть, но «Небесный Орден» по-прежнему находится в «Монолите»."
  "2018":
    1: "Спасибо за помощь!\nПозвольте мне вознаградить вас за ваши усилия.\nТеперь мы можем спать спокойнее, зная, что Седрик и его отколовшиеся друиды больше не оскверняют эту священную местность."
  "2019":
    1: "Я коллекционирую редких и экзотических животных и зарабатываю на жизнь, продавая некоторых из них в качестве домашних питомцев.\nВ настоящее время кобры пользуются большим спросом, а у меня их осталось не так много.\nПоэтому я готов щедро заплатить за любые яйца кобры, которые у вас могут оказаться.\nПомните: если вы найдёте яйца кобры, я предложу вам самые выгодные цены."
  "2020":
    1: "Прекрасный экземпляр!\nЯ смогу вывести его в мгновение ока и таким образом поддержать свой пробуксовывающий бизнес.\nВот моя оплата за это замечательное яйцо.\nЯ куплю все остальные яйца кобры, которые у вас есть, пока на них есть спрос."
  "2021":
    1: "Удалено сообщение о летучих мышах"
  "2022":
    1: "Удалено сообщение о летучих мышах"
  "2023":
    1: "Удалено сообщение о летучих мышах"
  "2024":
    1: "Неподалеку находится храм, посвящённый Ордену Кулака.\nКогда-то я сам был членом этого ордена, но недавно они обнаружили могущественный кристалл зла.\nОни надеются использовать этот кристалл в качестве козыря, чтобы их приняли в Храм Баа.\nЯ не хочу, чтобы кристалл попал в руки Баа — его нужно уничтожить.\nПожалуйста, проникни в храм и уничтожь кристалл."
  "2025":
    1: "Тебе нужно поспешить и уничтожить кристалл, пока Баа не завладел им.\nЯ не знаю, сколько времени это займет, так что время имеет решающее значение."
  "2026":
    1: "Отличная работа!\nЯ рад, что ты успел.\nДаже не хочу думать о том, что Баа сделал бы с этим кристаллом.\nТы оказал огромную услугу всему Энроту."
  "2027":
    1: "Мой муж, Эммануэль, несколько недель назад отправился на остров Стар вместе с несколькими друзьями в надежде найти какое-нибудь сокровище.\nС тех пор я его не видела и очень переживаю за него.\nЯ не решаюсь пойти на остров — ходят слухи, что там обитают медузы!\nЕсли бы вы могли найти его и привести домой, я была бы вам очень благодарна."
  "2028":
    1: "Не повезло?\nЕсли вы его не нашли, значит, он, наверное, в большой опасности.\nЕсли вам всё-таки удастся его найти, пожалуйста, приведите его сюда.\nЯ буду ждать его."
  "2029":
    1: "О, спасибо, что вернули мне Эммануила!\nНичто в этом мире не значит для меня столько, сколько он!\nПожалуйста, примите это в качестве благодарности.\nЯ знаю, это не много, но вы заслуживаете этого за то, что вернули его мне."
  "2030":
    1: "Спасибо, что вернули меня в нормальное состояние. Я бы с удовольствием остался поболтать, но мне действительно пора уходить."
  "2031":
    1: "Спасибо, что вернули меня в нормальное состояние. Я бы с удовольствием остался поболтать, но мне действительно пора уходить."
  "2032":
    1: "Не могли бы вы помочь мне выбраться отсюда?\nМне нужно вернуться к жене в Блэкшир."
  "2033":
    1: "Мой друг-исследователь недавно во время своих путешествий обнаружил могущественный артефакт по имени Мордред.\nОн хотел продать его мне и отправил сюда, чтобы я решил, нужен ли он мне.\nК сожалению, на караван, в котором он находился, напали разбойники и похитили артефакт.\nВ последний раз их видели направляющимися в район к западу от замка Темпер; я уверен, что у них там должна быть какая-то база.\nЕсли ты вернёшь Мордреда для меня, я отдам тебе часть той суммы, которую заплачу своему другу за него."
  "2034":
    1: "Здравствуйте снова.\nМордреда пока никто не нашёл, так что наша сделка по-прежнему в силе.\nЯ отдам вам часть суммы, вырученной от продажи артефакта, если вы его вернёте."
  "2035":
    1: "Так это и есть легендарный Мордред, да?\nИнтересно, я ожидал чего-то гораздо более грандиозного.\nВообще-то, я, пожалуй, не хочу его.\nПочему бы тебе его не оставить себе, а я сам договорился с другом насчёт оплаты."
  "2036":
    1: "Члены «Гильдии Теней» недавно переместились на юг и пытаются оказать влияние на местных торговцев.\nЯ отказал им в доступе в наш город, и тогда они похитили Шерри Карнеги — старую целительницу, которую очень любят горожане, — чтобы «убедить» меня разрешить им вести здесь свою деятельность.\nНе могу поверить, что их вымогательство дошло так далеко на юг — я думал, что здесь, в этих краях, я в безопасности от этого.\nПожалуйста, спасите Шэрри… Я могу предложить вам деньги в качестве вознаграждения, и я уверен, что горожане будут благодарны за её возвращение."
  "2037":
    1: "Ты уже нашёл Шэрри?\nНет?\nУверен, она там, где прячется Гильдия Теней.\nНайди их — и найдёшь её."
  "2038":
    1: "Огромное спасибо за то, что спасли Шэрри!\nЯ даже не могу выразить, как много это значит и для «Нью-Сорпигал», и для меня лично.\nМы будем вечно вам благодарны."
  "2039":
    1: "Интересно.\nДрагуны были наняты «Гильдией Теней».\nУверен, Энтони Стоун захочет об этом услышать.\nЯ передам ему это письмо, когда увижусь с ним в следующий раз. Спасибо за это.\nУверен, он захочет принять меры против «Гильдии Теней», теперь, когда у нас есть доказательства их деяний."
  "2040":
    1: "Спасибо, что спасли меня от этих ужасных хулиганов!\nТеперь я хотел бы вернуться домой, в Нью-Сорпигал."
  "2041":
    1: "Ой, помогите мне, пожалуйста!\nМоя дочь Анжела пропала!\nДумаю, она, возможно, забрела в заброшенный храм недалеко от города, и если это так, то ей может грозить страшная опасность… Кто знает, какие ужасные существа скрываются в этом проклятом месте!\nПожалуйста, найдите её и верните мне."
  "2042":
    1: "Ты не нашла бедную Анжелу?\nС ней, наверное, случилось что-то ужасное!"
  "2043":
    1: "Она жива!\nОгромное спасибо за то, что нашли Анджелу!\nЕсли бы я не была так рада её видеть, ей бы пришлось несладко.\nПожалуйста, примите это в качестве благодарности за всё, что вы сделали."
  "2044":
    1: "Кажется, я заблудился... <вздыхает>... Хочу домой!"
  "2045":
    1: "Моя хорошая подруга Шерелл отправилась с группой друзей на острова в Гавани контрабандиста, чтобы исследовать старинный храм, который, по слухам, там находится.\nЕё друзья вернулись и рассказали, что её похитили каннибалы с острова и увезли в какой-то древний храм.\nЯ уверена, что у неё осталось совсем мало времени, прежде чем они сделают с ней что-то ужасное. Пожалуйста, спасите её!"
  "2046":
    1: "Ой, боже мой!\nТы её ещё не нашёл?\nНаверняка её принесли в жертву, съели или что-то в этом роде.\nПожалуйста, постарайся её найти или хотя бы отомсти за её смерть."
  "2047":
    1: "Замечательно!\nОказывается, она всё-таки жива!\nСпасибо за все ваши усилия.\nНадеюсь, вы примете этот знак моей благодарности."
  "2048":
    1: "Привет!\nПожалуйста, о, пожалуйста, вытащите меня из этого храма.\nЯ не хочу умирать!"
  "2049":
    1: "На наш город лежит ужасное проклятие, хотя большинство людей в это не верят.\nВ полнолуние мы все превращаемся в оборотней.\nХотя никто из нас не является по-настоящему злым, мы не знаем, какие ужасные вещи совершаем, будучи оборотнями.\nМы не можем обратиться к нашему господину, Актону Спиндлеру, с этой проблемой, потому что он не подозревает, что именно мы и являемся оборотнями.\nПожалуйста, найдите способ вернуть нас в нормальное состояние!"
  "2050":
    1: "Разве для нас нет никакой надежды?\nПожалуйста, пообещай мне, что будешь продолжать искать способ снять проклятие и вернуть нас к нормальной жизни."
  "2051":
    1: "Спасибо!\nТеперь мы сможем спать по ночам, не беспокоясь о том, какие ужасные поступки мы совершим, превратившись в монстров!\nОчень жаль, что наш господин сам был оборотнем; мы будем по нему очень скучать.\nПожалуйста, примите это в знак благодарности за вашу помощь и за то, что поверили в нас."
  "2052":
    1: "В последнее время Блэкшир страдает от оборотней.\nНаверняка именно из этих пещер и появляются оборотни!\nОднако мне понадобится помощь, чтобы уничтожить их.\nВы можете забрать любую часть найденных нами сокровищ.\nМеня интересует только одно — уничтожить их раз и навсегда!"
  "2053":
    1: "Понимаешь, я оборотень, и скоро ты тоже им станешь!"
  "2054":
    1: "Я был гостем в поместье лорда Спиндлера, когда на него напала банда оборотней, пробравшихся туда через туннели из гор.\nЯ пробился обратно по туннелям, которые они прорыли, в надежде спастись.\nВ конце концов они загнали меня в угол, и меня убили именно здесь."
  "2055":
    1: "Во время бегства мне удалось спрятать Жемчужину Чистоты в этих пещерах.\nЖемчужина не только защитит вас от проклятия оборотней, но и уничтожит Алтарь Волка, если коснется его.\nЭто должно освободить всех, кто пострадал от проклятия, наложенного этими оборотнями.\nЖемчужина находится в конце пещеры, расположенной напротив этой.\nПожалуйста, сделай мне одну услугу: верни Жемчужину Уилбуру Хамфри.\nОн — лорд, командующий паладинами, и Жемчужина должна принадлежать ему."
  "2056":
    1: "Вождь оборотней владеет «Жемчужиной гниения» — противоположностью моей «Жемчужины чистоты».\nС помощью этой жемчужины ему удалось наложить проклятие.\nМне так и не удалось убить его, когда я отступал.\nЯ смогу упокоиться с миром, зная, что он побеждён."
  "2057":
    1: "Вождь оборотней владеет «Жемчужиной гниения» — противоположностью моей «Жемчужины чистоты».\nС помощью этой жемчужины ему удалось наложить проклятие.\nМне так и не удалось убить его, когда я отступал.\nЯ смогу упокоиться с миром, зная, что он побеждён."
  "2058":
    1: "Спасибо за то, что вы победили вожака оборотней.\nКак бы я хотел быть достаточно сильным, чтобы предотвратить это.\nПримите мою благодарность за то, что позволили моему духу уйти.\nЯ заберу жемчужину, чтобы она больше не причиняла вреда жителям Энрота."
  "2059":
    1: "Что это такое?\nУ тебя есть «Жемчужина чистоты»?\nЯ думал, что у Бальтазара… О, он умер, да?\nТогда я пока оставлю её у себя, согласно его последней воле.\nСпасибо от имени нас обоих."
  "2060":
    1: "В этом месяце объявлена награда за %s.\nУбейте цель и вернитесь до конца месяца, чтобы получить %lu золотых."
  "2061":
    1: "Вы одолели %s! Поздравляю!\nВот обещанная награда — %lu золотых.\nВозвращайтесь в следующем месяце за новой целью."
  "2062":
    1: "В этом месяце награду уже забрали.\nВозвращайтесь в следующем месяце за новой целью."
  "2063":
    1: "Не используется."
  "2064":
    1: "Ты не гоблин!\nУбирайся!\nМы захватим замок, чтобы присматривать за людьми!\nТы больше не будешь нас убивать!"
  "2065":
    1: "Отличная работа — вы избавили эту крепость от гоблинов.\nСейчас ситуация в основном под контролем, хотя ваша помощь всегда приветствуется."
  "2066":
    1: "Здравствуйте снова, мои ученики!\nБоюсь, больше я вас ничему научить не могу — отныне вам предстоит полагаться только на свой опыт.\nЯ знаю не больше вашего о демонах, уничтоживших Свит-Уотер, но знаю, к кому вам нужно обратиться.\nОракул в Свободной гавани знает, что нужно сделать, чтобы избавить Энрот от ужасных демонов.\nК сожалению, вам понадобится одобрение шести членов Высшего Совета, каждый из которых представляет одного из лордов Энрота.\nВы должны сделать всё необходимое, чтобы поговорить с Оракулом в Свободной гавани и избавить Энрот от демонов."
  "2067":
    1: "Как вам, возможно, известно, последние члены Гильдии некромантов в Энроте бежали в замок Даркмур после своего поражения в Войне за престол.\nКто знает, какие мерзкие заклинания они там сочиняют, пока мы здесь бездельничаем.\nЯ уверен, что книга, содержащая «Ритуал бесконечной ночи», известная как «Книга личей», была перенесена в этот замок.\nЕсли эту книгу удастся уничтожить, это нанесёт серьёзный удар по любым их злым планам.\nЯ несколько раз пытался добраться до книги, но замок слишком хорошо защищён.\nЕсли вам удастся уничтожить эту книгу, вернитесь ко мне, и я лично вознагражу вас."
  "2068":
    1: "С уничтожением книги спешить не стоит.\nЕсли у тебя это получится, вернись и поговори со мной.\nЯ даже не уверен, что вообще возможно добраться до книги и уничтожить её — в том замке слишком много злобных существ."
  "2069":
    1: "Невероятно!\nЯ и не думал, что тебе это удастся.\nТеперь, когда «Книга личей» исчезла, Гильдия некромантов здесь, в Энроте, постепенно придет в упадок.\nИ всё это благодаря тебе!\nВот, возьми это в качестве награды и прими также мою благодарность."
  "2070":
    1: "Когда-то, давным-давно, я был придворным волшебником.\nВсё это закончилось, когда Арчибальд… нарушил… устоявшийся порядок.\nАрчибальд овладел некоторыми навыками чародея и знал заклинания, выходящие за рамки того, чему сегодня учат волшебников, и поэтому больше не нуждался в моих услугах.\nС тех пор я живу в этой маленькой лачуге, занимаюсь собственными исследованиями и состарился."
  "2071":
    1: "Я обнаружил способ обратить вспять действие времени и вновь обрести молодость.\nДля этого требуется сложный магический ритуал, который я разработал.\nПроблема в том, что мне нужно разместить магические статуэтки на различных пьедесталах. Статуэтку тигра нужно поставить на пьедестал возле Сладкой Воды, статуэтку медведя — в Кригспайре, статуэтку орла — в Драконьем Песке, статуэтку волка — в Болоте Проклятых, а статуэтку дракона — в Гавани контрабандиста.\nРасстояния слишком велики, чтобы я мог преодолеть их в моём преклонном возрасте, да и к тому же мне нужно подготовиться к самому ритуалу.\nМне ни за что не справиться со всем этим в одиночку; мне нужна твоя помощь.\nСтатуэтки находятся в сундуке возле моего дома.\nПоставь их на пьедесталы и вернись ко мне.\nДаже если ритуал провалится, я вознагражу тебя за твои усилия."
  "2072":
    1: "Я был одним из магов, обучавшихся в Кригспайре, когда обитавшие там существа полностью вышли из-под контроля.\nСпасаясь из замка, я оставил там ценный предмет — украшенное драгоценными камнями яйцо.\nЭто яйцо — семейная реликвия, история которой уходит корнями в эпоху Тишины.\nЯ несколько раз пытался вернуть его, но существа там слишком сильны для меня.\nЯ с радостью отдал бы за него щедрую сумму денег, чтобы вернуть своё яйцо."
  "2073":
    1: "Кригспайр — это замок, расположенный внутри вулкана.\nНам, магам, пришлось поднять землю вокруг замка, чтобы не дать существам захватить близлежащие города.\nТеперь они заперты внутри, и именно там находится яйцо."
  "2074":
    1: "Спасибо, что вернули мне это яйцо; это самое дорогое, что у меня есть."
  "2075":
    1: "Я — Повелитель Огня, бессмертный дух земли.\nМоя сила черпается из недр земли.\nКаналы, которыми я пользуюсь, заблокированы на севере дверями, защищёнными мощной магией.\nМне нужно, чтобы ты снял защиту с этих дверей, чтобы я мог вновь пробудиться.\nХотя заклинания на них и сильны, янтарь сможет сломать защиту на дверях."
  "2076":
    1: "Если вы заблудитесь в пещерах, вам могут помочь мои слуги.\nЕсли у вас есть кусочек янтаря, они сочтут, что вы находитесь под моей опекой, и телепортируют вас обратно ко мне, если вы с ними заговорите.\nЕсли у вас нет янтаря, они заберут у вас часть жизненной силы в качестве платы за телепортацию сюда, наверх.\nНе беспокойтесь, они редко кого-то убивают."
  "2077":
    1: "Двери оказались заблокированы, когда здесь поселилось странное существо.\nЯ не знаком с подобными существами, а за долгое время, проведённое мной здесь, в Энроте, я видел их множество.\nЯ не знаю, почему оно выбрало это место в качестве своего жилища, и почему его только одно, но я хотел бы, чтобы его уничтожили за те неприятности, которые оно мне доставило."
  "2078":
    1: "Несмотря на всю мою терпеливость, я хотел бы, чтобы каналы, которые поддерживают меня, снова открылись.\nПожалуйста, не подведите."
  "2079":
    1: "Спасибо за вашу помощь.\nЯ благодарен вам за то, что вы вернули мне источник существования.\nТеперь, когда у меня снова появилась такая возможность, мне нужно восполнить те немногие силы, которые у меня остались."
  "2080":
    1: "Ещё раз спасибо за помощь, но сейчас я очень занят подготовкой всего необходимого для проведения ритуала."
  "2081":
    1: "Итак, сэр Джон был убит, а «Серебряные Шлемы» подкупил Храм Баа?\nЭто многое объясняет.\nХорошо, что ты сообщил мне об этом, но за вознаграждение тебе придётся обратиться к Энтони Стоуну."
  "2082":
    1: "Я должен был догадаться, что за этим стоит «Баа» — похоже, они во всем за этим стоят.\nСпасибо, что рассказали мне об этом.\nЭто дает ответы на вопросы, которые у меня были по поводу «Братского ордена Серебра»."
  "2083":
    1: "Значит, Баа стояла за коррупцией «Серебряных Шлемов» и убийством сэра Джона Сильвера?\nКакая трагедия для сэра Джона, да упокоится его душа.\n<blink> Лоретта велела тебе забрать у меня награду?\nЖадная ведьма.\nВот, твои услуги не должны остаться без вознаграждения."
  "2084":
    1: "Отличная работа!\nТы когда-нибудь задумывался о том, чтобы работать у меня на полную ставку?\nМне бы точно пригодилась надежная помощь.\nЗа эти годы у меня накопилось немало всяких безделушек, так что, пожалуйста, возьми себе несколько из них в качестве оплаты за твои услуги.\nМне нужно здесь немного прибраться, но, пожалуй, я скоро вернусь в замок Айронфист и посмотрю, есть ли там вакансия придворного волшебника."
  "2085":
    1: "Спасибо!\nНе терпится отвезти это на Пустынный курорт Абдула и посмотреть, что из этого выйдет!\nА вот и деньги, которые я тебе должен."
  "2086":
    1: "Моё любимое вино — это то, что дают за победу в цирке.\nЯ заплачу 300 золотых за любую бочку вина из цирка, которую ты сможешь мне принести."
  "2087":
    1: "Моё любимое!\nСпасибо за вино!\nВот 300 золотых — оно того стоит."
  "2088":
    1: "У меня потрясающая коллекция зубов, но я всегда ищу новые экземпляры.\nЕсли вы найдёте зуб, которого ещё нет в моей коллекции, я заплачу вам за него 500 золотых."
  "2089":
    1: "По-моему, у меня пока нет такого зуба, вот 500 золотых."
  "2090":
    1: "Я три раза ходил в цирк, но так и не смог ничего выиграть.\nНа самом деле я хочу только те классные четырехлистные клевера, которые там раздают в качестве призов.\nЯ заплачу 25 золотых за любой четырехлистный клевер, который ты мне принесешь."
  "2091":
    1: "Я уже так устал от «Теневого гильдии», но у меня нет никаких весомых доказательств их деятельности.\nХотелось бы иметь что-нибудь, что я мог бы показать Энтони Стоуну, доказывая, что «Теневая гильдия» тут, внизу, затевает что-то недоброе."
  "2092":
    1: "Один из немногих сохранившихся артефактов паладинов — это «Жемчужина чистоты».\nНасколько мне известно, последний раз жемчужина находилась у Бальтазара.\nОн был в гостях у лорда Спиндлера в Блэкшире, но я уже несколько месяцев ничего о нём не слышал."
  "2093":
    1: "Я буду говорить только с Избранными — с теми, кто несет символ огня."
  "2094":
    1: "В последнее время «Братство Серебра» мешает моему бизнесу и создает проблемы для моих караванов.\nНе знаю, почему сэр Джон считает это необходимым, но я бы хотел, чтобы это прекратилось.\nЕсли бы вы смогли убедить его оставить меня в покое, я уверен, что смог бы отдать вам часть тех денег, которые вы сэкономите мне."
  "2095":
    1: "«Братство Серебра» начало наносить более прямые удары по моим законным партнерам из преступного мира.\nЯ был бы вам очень признателен, если бы вы поговорили с сэром Джоном и выяснили, почему он считает эти действия необходимыми."
  "2096":
    1: "Ура!\nЭто гораздо проще и гораздо менее неловко, чем пойти в цирк и проиграть!\nВот тебе 25 золотых!"
  "2097":
    1: "Я слышал, что в системе пещер к северу от замка Айронфист можно найти крупные куски янтаря.\nУ меня никогда не бывает времени покинуть Свободная гавань, но я бы с удовольствием раздобыл немного этого янтаря.\nЯ заплачу 500 золотых за любой кусок янтаря."
  "2098":
    1: "Это подойдет как нельзя лучше!\nСпасибо за янтарь, вот 500 золотых, которые я тебе обещал."
  "2099":
    1: "Я почти подготовил весь ритуал — осталось только расставить статуэтки."
  "2100":
    1: "Отличная работа!\nБлагодаря тебе я снова почувствовал себя молодым… А ты не думал о том, чтобы работать у меня на полную ставку?\nМне бы очень пригодилась надежная помощь.\nЗа эти годы мне удалось собрать целую коллекцию всяких безделушек, так что, пожалуйста, возьми себе несколько из них из сундука снаружи в качестве оплаты за твои услуги.\nМне нужно здесь немного прибраться, но, пожалуй, я вернусь в замок Айронфист и посмотрю, есть ли там вакансия придворного волшебника."
  "2101":
    1: "Здесь ничего нет!"
  "2102":
    1: "Путь света"
  "2103":
    1: "Путь тьмы"
  "2104":
    1: "Вы уверены, что хотите изменить свой путь? Тёмные заклинания исчезнут из вашей книги заклинаний, а знания о магии Тьмы будут стерты из вашей памяти. (Да/Нет)"
  "2105":
    1: "Вы уверены, что хотите сменить свой путь? Заклинания света исчезнут из вашей книги заклинаний, а знания о магии света будут стерты из вашей памяти. (Да/Нет)"
  "2106":
    1: "Никогда не поздно вернуться к свету, дитя. Выбери сторону света."
  "2107":
    1: "Тьма ждёт, и её терпение бесконечно. Выбери тёмную сторону."
  "2108":
    1: "да"
  "2109":
    1: "Либо ты уже выбрал свой путь, либо ты ещё не готов к этому."
  "2110":
    1: "Котел пуст"
  "2111":
    1: "+1 Постоянная огнестойкость"
  "2112":
    1: "+1 Постоянная устойчивость к холоду"
  "2113":
    1: "+1 Постоянное электрическое сопротивление"
  "2114":
    1: "+1 к постоянной устойчивости к яду"
  "2115":
    1: "+1 к сопротивлению магии (постоянный эффект)"
  "2116":
    1: "Кастрюля пустая"
  "2117":
    1: "Болезнь!"
  "2118":
    1: "Поиск не удался!"
  "2119":
    1: "Вам нужно передать письмо регенту Уилбуру Хамфри в замке Айронфист."
  "2120":
    1: "Советую выполнить задания на повышение у шести лордов Энрота и лишь затем продолжить путь."
  "2121":
    1: "Пустой мешок"
  "2122":
    1: "Чтобы посетить Оракула, вам необходимо заслужить расположение шести членов Высшего совета в Свободной гавани.\nКаждый лорд поручит вам задание, за выполнение которого вы сможете заслужить его благосклонность.\nВыполните каждое из этих заданий, а затем поговорите с членом Совета, представляющим этого лорда, чтобы получить его одобрение.\nКак только все члены Высшего совета дадут своё разрешение, вам будет позволено посетить Оракула."
  "2123":
    1: "Пустой мешок"
  "2124":
    1: "Похоже, что Сликкер Сильвертонг — предатель в Совете.\nТебе понадобятся доказательства, чтобы убедить регента Хамфри и добиться отстранения Сликкера от должности в Совете.\nОтправляйся в Высший храм Баа в Кригспайре и вернись с доказательствами, связывающими Сликкера с храмом Баа."
  "2125":
    1: "Оракул спит с тех пор, как Арчибальд устроил с ним свои проделки.\nЧтобы оживить Оракула, тебе понадобятся четыре кристалла памяти.\nИх можно найти на Острове Отшельника, в замке Аламос, в замке Кригспайр и в замке Даркмур."
  "2126":
    1: "Чтобы получить доступ к Центру управления, вам понадобится Куб управления, который находится в Храме Варна в Драконьем Песке.\nОтнесите Куб к Оракулу, чтобы получить доступ к Центру управления.\nРеактор Кригана неуязвим для любых атак.\nНанести урон реактору могут только древние оружия из Центра управления.\nУбедитесь, что у вас есть эти оружия и навык их использования."
  "2127":
    1: "Вам, наверное, стоит показать «Письмо к Андоверу Потбелло» в Нью-Сорпигале."
  "2128":
    1: "Здесь ничего нет"
  "2129":
    1: "Прежде чем уничтожить реактор, вам понадобится заклинание, способное сдержать последующие взрывы.\nВы должны освободить Арчибальда из его каменной тюрьмы.\nПоговорите с Николаем и принесите ему «Третье око» — он позволит вам использовать «Колокол Танира», чтобы вернуть Арчибальда в нормальное состояние.\nПосле этого вам должно удастся убедить Арчибальда поделиться с вами необходимыми знаниями."
  "2130":
    1: "Теперь вам предстоит уничтожить улей Криганов.\nУничтожьте реактор, победите их королеву и обязательно спаситесь, унеся с собой «Ритуал Пустоты» — тогда вы успешно выполните свою задачу."
  "2131":
    1: "Тебе больше не нужны мои советы."
  "2132":
    1: "Добро пожаловать в мой курорт в пустыне!\nВы заметите, что у нас нет той шпаны, которая обычно толпится в городах и деревнях этих земель.\nНайдите минутку, чтобы расслабиться и насладиться безмятежностью пустыни, друзья мои.\nЕсли вам интересно, у нас здесь есть несколько торговцев, которые обменивают редкие предметы на оружие и доспехи — возможно, вам стоит к ним заглянуть."
  "2133":
    1: "Похоже, вокруг моего маленького курорта ходит масса слухов.\nУвы, тот «Источник молодости», о котором все, кажется, говорят, находится не здесь, а в нескольких днях пути на запад."
  "2134":
    1: "Привет!\nУ меня есть отличные доспехи, которые я готов обменять на золотые пирамиды или бочки с вином."
  "2135":
    1: "Пустое ведро"
  "2136":
    1: "Я готов обменять высококачественное оружие на золотые пирамиды или бочки с вином."
  "2137":
    1: "У меня есть множество самых разных магических аксессуаров, которые я с удовольствием обменяю на золотые пирамиды или бочки с вином."
  "2138":
    1: "Было приятно иметь с вами дело, вот ваша броня!"
  "2139":
    1: "Бесполезный кристалл"
  "2140":
    1: "Боюсь, у вас нет золотой пирамиды, поэтому я не могу заключить с вами сделку."
  "2141":
    1: "У тебя же нет бочонка вина, которым можно было бы обменяться!"
  "2142":
    1: "Было приятно иметь с вами дело, вот ваше оружие!"
  "2143":
    1: "Было приятно иметь с вами дело, вот ваш аксессуар!"
  "2144":
    1: "Я коллекционирую подержанные волшебные лампы, но у меня нет денег.\nЗато я готов обменять на них несколько из этих красивых камней."
  "2145":
    1: "Спасибо за лампу!\nВот твои камни."
  "2146":
    1: "Режим «Высокая детализация» доступен только при объёме оперативной памяти 32 МБ или более."
  "2147":
    1: "Не используется"
  "2149":
    1: "Это прозвучит странно, но выслушайте меня, герои. Меня зовут Вердант, и я — путешественник во времени. Произошло нечто весьма тревожное, и мне нужна ваша помощь. Вернее, миру нужна ваша помощь. Я всего лишь посланник… и, вероятно, виновник всех этих неприятностей, но это сейчас не главное. \nВажно то, что существует тайный консорциум учёных. У него нет названия, поскольку о нём не следует говорить, и, следовательно, в нём нет необходимости. Мы — группа магов, исследующих тонкости путешествий во времени с целью документирования истории нашего мира. Чистой, незапятнанной, беспристрастной. Чего, очевидно, неспособны сделать люди, запутавшиеся в своих делах и скованные политическими интересами. Как гласит пословица: «Историю пишут победители». И поэтому мы овладели искусством путешествий во времени, чтобы стать свидетелями истории и объективно зафиксировать её, расставить по местам искажённые факты, раскрыть правду, погребённую под удобными ложными утверждениями.\nВсё шло отлично, наши архивы пополнялись с каждой экспедицией, но на этот раз что-то… немного пошло не так."
  "2150":
    1: "Понимаете, лично мне всегда было досадно, что все хроники подробно описывают жизни королей, королев и других политиков. Как там обычно пишут: «И королева такая-то посвятила своих героев в рыцари». Мне не хочется читать об этом, я хочу читать о самих героях. Мне хочется узнать о трясинах, через которые им приходилось пробираться, о милях, которые они преодолевали, о сокровищах, которые они выносили, и о простых людях, которых они спасали. \nПоэтому я взял на себя задачу написать летопись, в которой будет всё это и даже больше. Я выбрал три группы героев, чьи подвиги спасли бесчисленное количество жизней, и настроил свою магию так, чтобы посетить их всех в самом начале их путешествий. Я хотел познакомиться с ними поближе, понять, откуда они родом, увидеть мир их глазами, вдохнуть запах их пота и крови. Да, буквально — не будьте брезгливыми, это вам не пригодится в вашей профессии..."
  "2151":
    1: "...В общем, с ритуалом что-то пошло не так, какая-то осечка, и, э-э, ну... Похоже, я стёр группу героев из существования. Или, возможно, перебросил их в другое существование, столетие или эпоху. Скрестим пальцы, чтобы это оказалось именно перемещением. Затем, ну, я попыталась исправить ситуацию, и то же самое, в некотором роде, произошло со второй группой героев. Прежде чем ты спросишь — да, ты третий. Нет, тебя не переместят и не уничтожат. *Вердант бросает взгляд на книгу, которую держит в руках* Наверное. Если то же самое можно сказать и о всех твоих органах, то всё должно быть в порядке."
  "2152":
    1: "То, что я хочу, чтобы ты сделал, по сути довольно просто. В общем, я знаю, что ты способен спасти мир, поэтому мне нужно, чтобы ты сделал это ещё несколько раз. Всего три раза, не волнуйся! Поскольку две другие группы героев сейчас либо навсегда вышли из строя, тебе придётся взять на себя их обязанности, иначе всё пойдёт наперекосяк. Я имею в виду, действительно: история перепишется сама собой, и, учитывая масштаб изменений и количество затронутых жизней, кто знает. История может просто сказать: «Хватит уже!» — и взорвать всё на куски. Дикое, но обоснованное предположение. Так что ты понимаешь, в чём проблема.\nО, ты не знал, что ты — герой? Да, да, я часто забываю, как действуют и думают люди, живущие в стабильном времени. Конечно. Ну, да, добро пожаловать в ряды героев. Вы можете попытаться уклониться от своего пути, но, честно говоря, гораздо проще будет просто спасти мир.\nЛично я думаю, что мне эта идея действительно нравится. Это может прозвучать холодно, но я ничего не могу с собой поделать — герои — моя слабость. А трижды спасшие мир? Я сейчас прямо на месте растаю. Мрррау! Свет в конце туннеля, как говорится, да?"
  "2153":
    1: "Чтобы путешествовать во времени и ступить на тропы, предназначенные для других героев, вам понадобится воспользоваться «дверями измерений», расположенными в местах, пронизанных магией. Не бойтесь, они безопасны. В некоторой степени.\nОдну из них вы найдёте в Мурмурвуде, другую — в Драконьем Песке, а ещё одну, если я правильно помню, ждёт вас на острове Эвенморн. Возможно, их больше. А может, и нет. Кто знает? В любом случае, как только найдёте свой портал, вы сможете активировать его, произнеся рядом заклинание «Городской портал». Есть ещё вариант — найти свитки «Межпространственный портал», валяющиеся вместе с другим хламом в некоторых лавках. Думаю, большинство людей принимает их за рискованные кулинарные рецепты, так что спрашивайте именно их.\nКстати, спешить не нужно. Вселенная медленно перестраивается и реагирует на изменения, внесённые в структуру времени, но постарайтесь всё успеть, пока не состарились, а?"
  "2154":
    1: "Эта игра вам понравится, если вы любите цвета. Я имею в виду: огненно-красный, небесно-голубой, землисто-коричневый, морской изумрудный. Ха-ха. Да, ну, стихии здесь повсюду, прямо перед глазами. Они… можно сказать, вышли из-под контроля. На самом деле это своего рода кризис. В любом случае, вам предстоит взять на себя роль охранников каравана, но не волнуйтесь — каравану уже не предстоит путь, никаких скучных поездок. Вы сможете ограбить то, что осталось, продать добычу очаровательным ящерицам, обитающим на острове, а затем заняться более интересными подвигами. Обязательно попробуйте. Мммм… подвиги. Дааа. О, и там даже есть единороги! К сожалению, вам, возможно, придётся их убить. Они немного злобные. Рррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррррр"
  "2155":
    1: "О, это нечто особенное. Вы станете ЛОРДАМИ. Слышите? ЛОРДАМИ. Звучит внушительно, правда? Ха! Но ради этого роскошного титула сначала придётся победить в поиске сокровищ на маленьком острове. Пустяки, соперников почти нет. И даже не думайте просто дождаться конца и позволить кому-нибудь другому победить, чтобы выбраться из этой маленькой тюрьмы. Не выйдет. Победите — и окажетесь дома, правя клочком земли между двумя воюющими королевствами. Каждое хочет урвать от него кусок. Точнее, забрать его целиком. Весело. Но зато вы сможете называть себя ЛОРДАМИ. Кому есть дело до остального?"
  "2156":
    1: "Всё просто. Вы — компания весёлых ребят, которых спас один милый чародей, всю жизнь тренировались, а теперь выросли и готовы к приключениям. Не нужно углубляться в ролевую игру, просто не ведите себя как придурки. Походите по окрестностям, побьёте пару гоблинов, раздавите паука-другого, подразните черта. Э-э... то есть, ученика волшебника, да. Никаких чертей, забудьте про чертей. Не думаю, что мне стоит рассказывать вам о вашем будущем. Ну, о их будущем. Но теперь это и ваше будущее тоже. Вы понимаете, о чём я. От нуля до героя — не торопитесь, наслаждайтесь видами… как только найдёте обзорную точку, где не грозит смерть. А это будет нелегко. Эта земля кишит убийцами. Серьёзно. Мне это нравится."
  "2157":
    1: "Хорошая новость: вся эта заварушка с исчезновением героев — не только моя вина. Плохая новость: вся эта заварушка с исчезновением героев — не только моя вина. Ещё одна новость: где-то разгулялся Неудержимый Хаос, который сеет беспорядки, и его нужно поймать и локализовать! Причём в гораздо более буквальном смысле, чем хотелось бы.\nЯ не буду вдаваться в технические подробности, потому что чем больше я скажу, тем меньше вы поймёте — это совершенно нормально и ни в коем случае не оскорбление вашего ума. Проще говоря, представьте, что существует нечто, что мы назовём Материей Хаоса, — воплощённая сила Хаоса во вселенной. Энтропия и всё такое. И от этой материи, скажем так, откололся кусочек и начал создавать непредсказуемые проблемы. Вы можете подумать: «Но ведь хаос и должен быть именно таким — хаотичным!» Тогда позвольте напомнить вам девиз: «В каждом хаосе есть порядок, в каждом порядке — хаос».\nНеудержимый Хаос — это и есть тот самый кусочек. Он прицепился к моим заклинаниям и заставил их ужасно обернуться против меня, как вы хорошо знаете. Вам нужно отправиться к Контролируемому пролому, захватить Неудержимый Хаос и вернуть его в… э-э… Неустойчивую материю происхождения. Да, я сам придумал это название, но ни один здравомыслящий человек не запомнит то, которым мы обозначаем её в консорциуме, даже услышав его сотню раз."
  "2158":
    1: "«Контролируемый пролом» — это созданное консорциумом место, где можно увидеть Неудержимый Хаос и взаимодействовать с ним, а также через которое можно добраться до «Неустойчивой материи происхождения». Это область, напоминающая искусственное измерение, где с материей *Вердант хихикает* можно безопасно обращаться, не подвергая опасности никакие места в реальном мире. \nРуины Кристалла Эскатона должны быть достаточно насыщены магией, чтобы наш старый друг — заклинание «Городской портал» — смог телепортировать вас туда.\nОказавшись там, вам останется лишь найти Неудержимый Хаос и вернуть его в «Неустойчивую материю происхождения». Что вас ждёт по пути? Да, этого даже я вам сказать не могу. Поскольку это результат временной аномалии, мы, очевидно, никогда раньше этого не видели. \nЧто с вами произойдёт после того, как вы войдёте и выйдете?\nНу, э-э... Давайте не будем слишком задумываться над этим. Но я уверен, что будет весело!"
  "2159":
    1: "Мне нужно выяснить точную причину всей этой неразберихи с временной шкалой. Возможно, есть ещё какие-то аномалии, которые я упустил. Ты мне уже очень помог, но не будешь ли ты сильно против, если я когда-нибудь снова обращусь к тебе за помощью? В смысле, ты и так по уши в этой заварушке, и вряд ли тебе удастся выбраться из неё в ближайшее время *Вердант хихикает*. Так что почему бы тебе не продолжить мне помогать, верно?"
  "2160":
    1: "Классная штуковина, правда? Эта жемчужина позволит нам общаться где угодно и когда угодно. Но, э-э, как всегда, есть одно «но». Устройство довольно нестабильно и потребует подзарядки после каждого нашего контакта. Проще говоря, оно поглощает энергию из окружающего воздуха. Вы можете либо подождать несколько дней, либо запрыгнуть в дверь для путешествий во времени, чтобы мгновенно зарядить устройство. Вы когда-нибудь задумывались, почему, выходя из таких дверей, у вас волосы торчат во все стороны? Теперь вы знаете. Энергия. Огромное количество энергии."
  "2161":
    1: "(Заряженный соединительный камень восстанавливает ваше здоровье один раз в день.)"
  "2162":
    1: "Рад, что ты спросил — из-за всей этой головоломки мне довольно трудно заснуть. Я мог бы притвориться, что меня не даёт уснуть беспокойство о бедных дурачках, которых я вышвырнул из нашего царства, существования, времени или как там это ещё называется, но я всегда был большим поклонником правды. Ложь — это такая морока, когда приходится всё удерживать в голове, правда?\nПо сути, мне плевать на тех неудачников, которых я прогнал, но мне чертовски небезразличны герои, дремлющие внутри них. И я хочу вернуть этих героев, и я хочу отправить их в очередную опасную ситуацию, чтобы увидеть их славу и, может быть, спасти пару жизней заодно. Поэтому я усердно работаю над поиском двух пропавших групп. Но чтобы сделать это в разумные сроки, мне понадобится ваша помощь."
  "2163":
    1: "Вы можете спросить: какое значение имеет время для путешественника во времени? И разве страдания других героев не начались уже — или, по сути, не закончились столетия назад, если бы они оказались в другом периоде? На что я отвечу вам: хватит слишком много думать. Попытки разобраться во всём этом только приведут к головной боли. Это типичная ошибка новичка, сталкивающегося с ситуациями, чреватыми парадоксами.\nПосмотрите на это с другой стороны — мы живём в опасные времена. Как, собственно, и все времена, так что нам никуда не спрятаться в другое время. *Вердант пожимает плечами.* И поэтому не исключено, что завтра или послезавтра меня съест дракон и сократит моё рабочее время. Это было бы крайне тревожно и досадно, учитывая, что я также вовлечена в другие дела большой важности, но суть в том, что это может случиться. Я не знаю, что ждёт меня в этой временной линии, если я останусь здесь, ведь я никогда раньше не была здесь и сейчас… Думаю. О боги, вот я и начала. Хватит уже, женщина! *Вердант хлопает себя по левому уху, словно хочет, чтобы размышления о парадоксах выпали из правого.*\nВ любом случае, мне нужно, чтобы ты помогла мне построить телелокатор. Это увеличит шансы на то, что я завершу задачу, прежде чем стану закуской для дракона."
  "2164":
    1: "Здесь нужно знать две вещи.\nВо-первых: я не могу вернуть потерянных героев в их собственные временные линии, так как уже привязал вас к их путям. Нам придётся переместить их в какое-нибудь другое время, иначе вселенная может сильно рассердиться, а этого нам явно не хочется. Если мы «бросим» их в какое-нибудь случайное, достаточно неспокойное время и место, они начнут свои собственные новые пути, и всё будет хорошо.\n\nВторое: чтобы приступить к этому «перемещению», нам сначала нужно найти этих бедняг. Это можно сделать, создав устройство, которое мы называем «Телелокатор». И тут-то ты и пригодишься.\nПрежде всего, нам нужен жезл. Не просто какой-нибудь жезл, а особый жезл из пропитанного металла. Рядом с Альваром обитает клан дуэргаров, которые занимаются обработкой такой руды. Уверен, у них где-то в их поселении найдётся такой жезл — какой хоть немного компетентный кузнец не имел бы его? Я бы предложил просто купить его, но слышал, что эти дуэргары довольно ворчливы. И под «ворчливы» я имею в виду, что они скорее вонзят топор тебе в голову, чем пойдут на бартер."
  "2165":
    1: "Как проходит экспедиция «Род»? Нет, я не могу вместо этого использовать деревянную палку — хватит уже спрашивать, а то я возьму такую и в следующий раз, когда ты спросишь, использую её для других целей. А именно — чтобы надрать задницу, если у кого-то возникли сомнения."
  "2166":
    1: "Просто великолепно. Это замечательная удочка. Вы уже погладили её рукой? Попробуйте! Бззз. Бззз! Забавно, правда? Теперь нам понадобится «Направляющий камень»."
  "2167":
    1: "Добудьте для Верданта металлический стержень с магическим наполнителем, который послужит основой для телелокатора. Она сказала, что у дуэргаров из Альвара, возможно, есть несколько таких."
  "2168":
    1: "Конечно же, никакого «Ведущего камня» не существует, придется его изготовить самим. Для этого мне понадобится большой круглый кристалл. БОЛЬШОЙ. КРУГЛЫЙ. И я имею в виду *ДЕЙСТВИТЕЛЬНО КРУГЛЫЙ*. Никакой этой дряни от сомнительных торговцев. Если поток энергии исказится из-за неровной формы шара, у меня может пойти кровь из носа века, когда я воспользуюсь телелокатором. Я уже обрызгал коридоры кровью столетие назад и ещё через шесть столетий, и мне совершенно не хочется повторять этот опыт.\nТак что да, круглый, пожалуйста. Я поинтересовался у знакомых, и мне сказали, что у гномов из Каменного города, возможно, есть что-то подобное в запасе. Они, конечно, обожают свои кристаллы, а когда дело доходит до изысканной огранки камней, им нет равных.\nВозможно ли, что тебе придётся его украсть? Да ладно тебе, мы же живём в мире чудес. Драконы, единороги, говорящие деревья, сила и магия. Конечно, это возможно, что это за глупый вопрос?"
  "2169":
    1: "Гномы — в целом очень дружелюбный народ. Если они на тебя разозлятся, просто сбеги и дай им время остыть, оставаясь подальше от их глаз. Или научись действовать скрытно и не попадайся с самого начала. Я бы посоветовал второе, но не удивлюсь, если ты вместо этого просто пойдёшь и всех перебьешь. Ты бы не поверил, что иногда любят вытворять некоторые герои, спасающие мир. *Вердант закатывает глаза, но уголок её губ подергивается так, что возникает подозрение: может, ей даже нравится, когда в её хрониках время от времени появляется какой-нибудь антигерой, придающий им пикантности.*"
  "2170":
    1: "Прекрасно, это просто прелесть. Такая гладкая… Я могла бы часами сидеть и гладить её. Наверное, так и поступлю, пока ты не вернёшься с Пеленами духа: без них работа всё равно не продвинется."
  "2171":
    1: "Найдите большой кристалл идеально круглой формы для телелокатора Верданта. Такой кристалл, возможно, можно найти в Каменном городе, расположенном в Барроу-Даунс."
  "2172":
    1: "Отлично, отлично, мы почти собрали всё воедино. Чтобы прикрепить драгоценный камень к жезлу, мне нужна ещё одна вещь — Пелены духа. По сути, это бинты, но пропитанные сильной духовной сущностью. Такое возможно только в том случае, если они соприкасались с «плотью» нежити и некоторое время находились под воздействием сильного духовного присутствия.\nЯ знаю как раз то место, где можно найти такую вещь. Недалеко от замка Айронфист вы найдёте место, которое когда-то принадлежало волшебнику по имени Корлагон. Эта дыра просто кишит всевозможными нежитью. Если с кого-то из них когда-нибудь отвалился кусок ткани, он подойдёт идеально. Эти призраки там, похоже, очень… похожи на простыни. Так что я ничуть не удивлюсь, если вся эта местность будет усыпана обрывками, оторванными от них, пока они летали по коридорам.\nЧто? Вы не знаете, что такое простыни? Бедняжки! Тогда захватите в Усадьбе труп призрака и в следующий раз застелите им свою постель. Вы мне ещё поблагодарите!"
  "2173":
    1: "Не говорите мне, что ни один из этих призраков ни разу не наткнулся на острый гвоздь, торчащий из стены или откуда-то ещё?"
  "2174":
    1: "Прекрасно, это именно то, что мне нужно. Ммм… и пахнет просто восхитительно. Если, конечно, не обращать внимания на запах смерти и гниющего мяса. Вот, попробуй, попробуй уловить эту едва уловимую нотку на заднем плане. Ой, да ладно! Почему никто никогда не хочет делиться со мной простыми радостями? *Вердант надувает губы* Ладно, тогда перейдем к делу. Нам нужно сейчас зачаровать жезл и драгоценный камень."
  "2175":
    1: "Добудьте Пелены духа для телелокатора Верданта. Она посоветовала поискать их в поместье Корлагона, недалеко от замка Айронфист."
  "2176":
    1: "Насыщение «Ведущего самоцвета» может оказаться делом скорее дорогостоящим, чем опасным. Я бы с удовольствием возместил тебе расходы, но, увы, у меня нет валюты, принимаемой к оплате в эту эпоху. В том месте, где я в последний раз бывал с целью сделать покупки, перестали принимать золото. *Вердант показывает тебе кучу бесполезных бумажных клочков* За это можно было бы купить лошадь. Забавно, не правда ли?\nСейчас мне нужны драгоценные камни — самые разные драгоценные камни. Принесите мне один из %s. Мне нужно измельчить их в порошок и поэкспериментировать, чтобы найти правильную комбинацию порошков, которая должным образом настроит «Ведущий камень» на миры."
  "2177":
    1: "Приобретите %s для телелокатора Верданта. Их можно найти по всему миру и купить у различных торговцев."
  "2178":
    1: "Я очень надеюсь, что тебе нравится коллекционировать разные вещи. Не говори мне, что это не так — позволь мне радоваться за тебя!"
  "2179":
    1: "Ну, это %s, мне всё ещё нужно %s."
  "2180":
    1: "Ой, разве они не просто великолепны? Даже жалко превращать их в прах… Интересно, а может, есть другой способ… ЛАДНО, ХОРОШО, Я ЭТО СДЕЛАЮ! Не надо на меня так смертельно смотреть, вы что, горгоны? *Вердант что-то бормочет себе под нос.*"
  "2181":
    1: "Удочку можно зачаровать, приложив совсем немного усилий. Вам придётся заглянуть в четыре Стихийных плана, но прежде чем паниковать — не стоит. То, что мне нужно, можно найти прямо у входа в каждый из них.\nВсё, что вам нужно сделать, — это зайти внутрь, ударить по каркасу мечом или чем-нибудь, что окажется под рукой, и поднять то, что отвалится. Эти металлические конструкции на удивление мягкие — всё держится на бушующем элементальном ядре, которое и придаёт им форму. Кто бы мог подумать, а? Возможно, вы даже найдёте валяющиеся обломки, что избавит вас от лишних хлопот. Серьёзно, разъярённая кошка, наверное, могла бы откусить кусок.\nВ любом случае, принесите мне четыре таких обломка, и я вплавлю их в посох, чтобы наделить его столь необходимой силой."
  "2182":
    1: "Соберите «Осколок портала Огня», «Осколок портала Воды», «Осколок портала Земли» и «Осколок портала Воздуха» для телелокатора Верданта. Их можно найти внутри Сфер Стихий рядом с входным порталом."
  "2183":
    1: "Если хочешь, можешь попробовать откусить кусочек от рамок. Если кошка может это сделать, то и ты тоже. Но помни — это должна быть рамка внутри области. Внешние рамки на самом деле довольно прочные и, скорее всего, просто сломают тебе зубы. Не спрашивай меня, почему так, — я их не делал."
  "2184":
    1: "Вы получили %s «Чиппинг»!"
  "2185":
    1: "Ладно, дай мне это, и посмотрим, что из этого выйдет."
  "2186":
    1: "Замечательно, великолепно, прекрасно. Теперь, когда у нас есть этот малыш, целый и достаточно волшебный, да ещё и настроенный на миры, нам нужно сделать ещё одну вещь, прежде чем я его активирую. Ну, почти одну. Нам нужно настроить его на героические духи, черты, присущие героям, родственные души доблести — назови это как хочешь. Короче говоря, мне нужно, чтобы ты подержал его и позволил ему опьянеть от твоей крутости. Проблема может заключаться в том, что тебе нужно быть действительно потрясающим, чтобы устройство захотело «напиться» от тебя.\nК счастью, ему не нужно питаться только от одного человека. Нет, оно не будет буквально высасывать из тебя эту силу! Серьёзно? Я говорю метафорически. Зачем мне тебя ломать… *Вердант вздыхает и качает головой.* Телелокатору нужно почувствовать Силу, Выносливость, Точность, Интеллект, Личность и Удачу. Если ты чувствуешь себя сильным в одном из этих качеств, подойди, возьми его и закрой глаза. Расскажи ему мысленно о своей доблести. Если оно сочтёт тебя достойным и поглотит твою сущность — НЕ забирая её, КЛЯНУСЬ — Ведущий Камень засияет."
  "2187":
    1: "[недостаточно] Сильнее! Может, попробуй сжать его?"
  "2188":
    1: "*«Телелокатор» загорается. Вердант что-то шепчет себе под нос, не отрывая взгляда от каждого движения твоих мышц.*"
  "2189":
    1: "[недостаточно] Может, сначала походите несколько раз вверх и вниз по лестнице?"
  "2190":
    1: "*«Телелокатор» загорается.* Хотел бы я тоже «настроиться» на тебя. Я задыхаюсь уже после десяти секунд бега. Черт, я задыхаюсь даже от одного разговора об этом. *Вердант тяжело дышит.*"
  "2191":
    1: "[недостаточно] Попробуй прищуриться. Сильнее. Ещё сильнее! Закрой глаза! Целься только мыслью! Эх. Всё равно ничего не получается."
  "2192":
    1: "*Телелокатор загорается.* Можешь добыть мне оленя на ужин? Я уже слишком много дней питаюсь местными грибами. Фу."
  "2193":
    1: "[недостаточно] Тебе задали загадку или что-то в этом роде? Если да, то расскажи, мне интересно, смог бы я правильно ответить."
  "2194":
    1: "*«Телелокатор» загорается.* Классно. Знаешь, нам стоит как-нибудь встретиться и сыграть партию в «Угили Дули». Это увлекательная игра, но, похоже, никто из окружающих даже правил не понимает. Не говоря уже о том, чтобы составить мне достойную конкуренцию!"
  "2195":
    1: "[недостаточно] Не волнуйся, я лично считаю, что ты очень, очень обаятельный и… симпатичный. Мррр…"
  "2196":
    1: "*Телелокатор загорается.* Значит, мы с этим приспособлением пришли к общему мнению."
  "2197":
    1: "[недостаточно] Как часто ты наступаешь на какашки? Мне кажется, это хороший показатель того, насколько сильно тебя ненавидит мир. Как только частота станет меньше двух раз в день, попробуй ещё раз."
  "2198":
    1: "*Телелокатор загорается.* Сегодня наш счастливый день! Удача нам сегодня улыбается! Хм. Я приготовил ещё несколько клише на этот случай, но они вылетели из головы. Похоже, тебе действительно *повезло*."
  "2199":
    1: "Пройдите проверку на Силу (70), чтобы настроить телелокатор.\nПройдите проверку на Выносливость (70), чтобы настроить телелокатор.\nПройдите проверку на Точность (70), чтобы настроить телелокатор.\nПройдите проверку на Интеллект (70), чтобы настроить телелокатор.\nПройдите проверку на Личность (70), чтобы настроить телелокатор.\nПройдите проверку на «Удачу» (70), чтобы настроить телелокатор"
  "2200":
    1: "Мы почти на месте. Мне чуть ли не слышны отчаянные крики о помощи наших «выброшенных» друзей! При условии, что они действительно где-то ещё существуют и не были полностью стёрты из всех миров… Давайте все-таки остановимся на том, что я «чуть ли не слышу» их крики, а?\nТеперь, пожалуй, будет непросто. Чтобы активировать Телелокатор, мне понадобится много энергии. Не такая уж и фантастическая, как в энергетическом ядре, но всё же. Нам нужно десять Философских камней. Как только вы принесёте их мне, мы наконец-то сможем запустить эту штуку! Я уже начинаю волноваться."
  "2201":
    1: "Могу я предложить ограбить лабораторию алхимиков? В крайних случаях — крайние меры, как говорится."
  "2202":
    1: "Ну, осталось ещё %s камней."
  "2203":
    1: "Отлично. Хватит болтать. Пошли."
  "2204":
    1: "Соберите 10 философских камней, чтобы активировать телелокатор."
  "2205":
    1: "*Вердант проводит довольно длительный ритуал, чтобы активировать телелокатор, и как раз когда ты начинаешь беспокоиться, что после всех этих усилий устройство может не сработать, оно включается, и волшебница широко открывает глаза. Она смотрит прямо на тебя, но её взгляд отрешён — она видит не тебя, а вещи из миров или времён, удалённых отсюда и от настоящего момента. Затем она говорит странно механическим голосом.\nЦели обнаружены. Миры: настроены. Время: настроено.\nМир: Ашан. Год: 1923.\nСостояние целей: без сознания и в замешательстве. Прогнозируемая оставшаяся продолжительность жизни целей: одиннадцать тысяч шестьдесят шесть дней.\nМиры: отключены. Время: отключено.\n*Вердант с вскриком открывает глаза.*\nО, черт."
  "2206":
    1: "Да, у нас это получится. Не знаю, сколько ты уже слышал, но я точно знаю, как вернуть потерянных героев в наш мир и поставить их в более справедливые условия. Для этого мне понадобятся некоторые жутковатые вещи. Понимаешь, сейчас всё сводится к жертвам и страданиям. И, как всегда, поспеши, но не переживай слишком сильно из-за времени. Телелокатор разъединил обе временные линии, так что пока я жив и вселенная не перевернется с ног на голову, героев можно спасти.\nМне понадобится, чтобы ты принёс мне 5 сердец огонька-блуждалки, 5 волчьих глаз, 3 пера феникса, флакон крови тролля, флакон крови Гога, 2 драконьих глаза и фокальное кольцо.\nТогда я… Давай пока не будем об этом думать и говорить. Вперёд, давай спасём этих Губеров, чтобы они смогли стать теми героями, которыми, как мы все знаем, они могут быть!"
  "2207":
    1: "Этого мало для убийства. Займись этим, ладно? Поверь мне, я тут остаюсь в накладе…"
  "2208":
    1: "Это %s, всё в порядке."
  "2209":
    1: "Нужно ещё %s."
  "2210":
    1: "А также, %s"
  "2211":
    1: "Должна признаться, я как бы надеялась, что ты, может, и не вернёшься… Фу! Да, мне действительно приходится всё это размять и выпить. Теоретически, тебе тоже приходится так делать каждый раз, когда пьёшь то или иное зелье, но поверь мне, это совсем другое дело, когда просто… разминаешь… без кипячения… без магии. *Вердант закрывает глаза и резко вдыхает.* Мне уже тошно и противно. Можешь хотя бы смешать это для меня? Только не клади перьевые стержни..."
  "2212":
    1: "С *удовольствием*?! Что это вообще значит?! Вот так герои! *Она скрещивает руки на груди и пинает в вашу сторону горшок. Вы смешиваете ингредиенты и предлагаете колдунье получившуюся жижу. Это действительно незабываемое зрелище… особенно прямо перед тем, как вас стошнит.*\nНу вот, поехали. *Вердант долго собирается с духом, но в конце концов доказывает свою преданность делу и выпивает смесь.*"
  "2213":
    1: "Ну, кольцо на мгновение как будто застряло у меня в горле, но, кажется, прошло. КТО придумал этот рецепт? *Она бросает гневный взгляд на лежащую рядом книгу, затем берет устройство и снова начинает его активировать. Механический голос снова зазвучал.*\nЦели обнаружены. Миры: синхронизированы. Время: синхронизировано.\nЦели: синхронизированы. Захвачены. Удалены. Вновь вызваны. Размещены. Отсоединены. \nМир: Энрот. Год: 1176. Континент: Вори.\n*Канализация завершена, и Вердант открывает глаза, улыбаясь тебе.*"
  "2214":
    1: "В общем, надо сказать, это было довольно эффективно с точки зрения использования героев. Одна группа — и уже три героя, а ещё два остались в запасе на случай будущих или прошлых катастроф. Хотя, раз они все оказались в одном месте, там, пожалуй, будет небольшой переизбыток героев. С другой стороны, может, они в конце концов влюбятся и размножатся? Если меня спросить, то я считаю, что миру нужны все герои, которых только можно найти. Да, я *знаю*, что могу просто проверить, не будь таким занудой!\nНо отличная работа, я серьезно. Спасаешь героев, спасаешь миры — я, кажется, сам влюбляюсь в тебя. Шучу, это уже решенное дело. Это была любовь с первого взгляда!"
  "2215":
    1: "Соберите 10 сердец «Огненного огонька», 5 волчьих глаз, 3 пера феникса, флакон с кровью тролля, флакон с кровью Гога, 2 драконьих глаза и фокальное кольцо, чтобы вернуть пропавших героев."
  "2216":
    1: "Другие герои#Помогите Губерам#Телелокатор#Зачарованный металлический стержень#Направляющий самоцвет#Пелены духа#Детали телелокатора#Зачаровать самоцвет#Зачаровать стержень#Настроить телелокатор#Настроить #Активировать телелокатор#Активировать!#Спасите Губеров!#Смешать зелье#...#Губеры, попавшие в другое измерение"
  "2217":
    1: "Заполнитель"
  "2218":
    1: "Его можно увидеть и в поле, и в городе,\nОн не может встать,\nНо часто падает."
  "2219":
    1: "дождь"
  "2220":
    1: "Его не удержат даже самые прочные цепи,\nни рвы, ни валы не смогут его остановить.\nТысяча солдат не сможет его победить,\nоно способно свалить деревья одним толчком."
  "2221":
    1: "ветер"
  "2222":
    1: "Это неутомимый труженик,\nпереносящий грузы по грязной земле.\nНо есть одна вещь, которую нельзя заставить —\nэто возвращение на место своего рождения."
  "2223":
    1: "река"
  "2224":
    1: "С острым как бритва юмором,\nИ с выдержанной сдержанностью,\nОно способно разрешать споры,\nБез лишнего шума."
  "2225":
    1: "меч"
  "2226":
    1: "Для одного это слишком много.\nОно предназначено для двоих.\nНо его уже нет,\nКогда двое становятся больше."
  "2227":
    1: "секрет"
  "2228":
    1: "Этот старик живет вечно,\nНо ни на шаг не сдвигается с места.\nУ него нет ни легких, ни горла,\nИ все же он издает могучий рев."
  "2229":
    1: "водопад"
  "2230":
    1: "Оно может передвигаться по воде,\nно летать не умеет.\nОно может передвигаться под водой,\nно при этом оставаться совершенно сухим."
  "2231":
    1: "тень"
  "2232":
    1: "Оно не находится в доме,\nно и без него не обходится.\nБольшинство пользуется им, когда входят,\nи снова — когда выходят."
  "2233":
    1: "дверь"
  "2234":
    1: "Мерцающее поле, простирающееся вдаль.\nИ все же на нем нет следов,\nИ через него можно пройти, не находя троп."
  "2235":
    1: "океан"
  "2236":
    1: "Это ощущение, будто тебя поглощает,\nдействительно странное.\nЧем сильнее оно становится,\nтем меньше ты видишь."
  "2237":
    1: "тьма"
  "2238":
    1: "Когда она приходит,\nОт моря до берега,\nДвадцать шагов — вот и всё,\nНи больше, ни меньше."
  "2239":
    1: "туман"
  "2240":
    1: "Заполнитель"
  "2241":
    1: "%s, друг! Ты здесь, я так рад познакомиться с тобой."
  "2242":
    1: "Я уже думал, что здесь заблудился, рад вас снова видеть."
  "2243":
    1: "По крайней мере, одно знакомое лицо среди всего этого безумия — %s!"
  "2244":
    1: "Наконец-то, друзья!"
  "2245":
    1: "Кто ты? Ещё один кошмар этого места? Если нет, давай останемся вместе."
  "2246":
    1: "Привет, живое существо."
  "2247":
    1: "Все местные волшебники сошли с ума, но их големы по-прежнему работают. Главное в том, что я не хочу задерживаться здесь дольше, чем это абсолютно необходимо."
  "2248":
    1: "Можете поверить, что эти фехтовальщики приняли меня за принца Николая? Поразительно. В любом случае, здесь, по крайней мере, безопасно."
  "2249":
    1: "Здесь кишит огненными элементалями. Я убил нескольких, но они продолжают наступать. Ну, по крайней мере, форт пуст — это уже что-то. Блин, тут так жарко. У тебя есть вода? Или хоть что-нибудь жидкое?"
  "2250":
    1: "Эти вонючие громоздкие штуки снаружи выглядят примерно так же дружелюбно, как и пахнут. Я пробрался сюда, чтобы дождаться рассвета, но на улице всё ещё темно, и я совершенно потерял счет времени."
  "2251":
    1: "Это место — настоящий сумасшедший дом! То, что мы ищем — Неудержимый Хаос — это не живое существо. Представьте себе призрак или какой-то дух."
  "2252":
    1: "Это место… от него у меня мурашки по коже. Оно напоминает мне Альвар, но эльфов здесь мы не найдём. В домах то загораются, то гаснут огни, хотя здесь никого нет. Думаю, нам стоит поискать Неудержимый Хаос в одном из зданий."
  "2253":
    1: "Слушай, я нашёл дневник какого-то несчастного. Вернее, то, что от него осталось. Похоже, кто-то попал в «Брешь» задолго до нас… если вообще можно говорить о времени в этих местах. Он написал: «Всё, что здесь написано, — отражение событий, произошедших где-то, когда-то. Ничего из этого не реально, за исключением Личностей». Похоже, бедняга не смог найти отсюда выхода и начал сходить с ума. Последние страницы просто заполнены бессвязным бредом о каких-то загадках."
  "2254":
    1: "Друзья мои! Я нашёл его! Неудержимый Хаос! Или, может быть… может быть, это он нашёл меня? Не знаю, не знаю, всё это кажется какой-то грандиозной шуткой. Он окружил меня адскими тварями, чудовищами, рождёнными из моих кошмаров. Наверное, чтобы напугать меня, или просто посмотреть, как я поступлю. Я сражался, чтобы выжить, а он просто смеялся. Когда я произношу эти слова, я слышу эхо этого пронзительного хохота, пронзающего мой череп. И когда я наконец упал на землю, не имея ни капли сил, чтобы продолжать, кошмары внезапно рассеялись. Исчезли, все до единого. Но раны, которые они оставили, были реальны… и всё же, когда я посмотрел вниз, не было ни одного пореза. Только моя разорванная одежда служила доказательством того, что вообще что-то произошло.\nИ тогда существо заговорило со мной таким спокойным голосом, что у меня перестали бегать мурашки. «Я задам тебе пять загадок, — сказало оно, — ответь на них, чтобы почувствовать себя живым. Если тебе удастся, загадай желание — может быть, тогда ты будешь освобождён». Я не знал ответов. Но оно оставило меня в покое. Я не знаю, почему. Может, оно пожалело меня. А может, просто хотело дать мне отдохнуть, прежде чем вернуться, чтобы снова мучить меня."
  "2255":
    1: "Не тратьте моё время!"
  "2256":
    1: "Никогда об этом не слышал."
  "2257":
    1: "Что это? Новый магазин?"
  "2258":
    1: "Ах, как же я люблю загадки! Скажи-ка, что это такое:"
  "2259":
    1: "Я помню одну из своего детства:"
  "2260":
    1: "Иногда в самых разных книгах можно найти загадки. Это так приятно и неожиданно. Вот, например, такая:"
  "2261":
    1: "Эти слова пробормотал в таверне слюнявый пьяница. По сути, это были его последние слова:"
  "2262":
    1: "Хм, да, это подойдет. Было интересно пообщаться с тобой, действительно очень приятно. За хорошо проведённое время полагается хорошая награда. Загадай желание, и я его исполню."
  "2263":
    1: "Я уже не знаю."
  "2264":
    1: "Правильно!"
  "2265":
    1: "Не совсем, друг мой, не совсем."
  "2267":
    1: "Ну, у меня нет никаких навыков, но я — отличный компаньон!\nПросто накормите меня и бросьте мне пару золотых — и я с удовольствием пойду с вами!"
  "2268":
    1: "Я с удовольствием присоединюсь к вам за 200 золотых и %17 процентов от всего найденного золота.\nПока я работаю на вас, то починю любое оружие, которое вы попросите."
  "2269":
    1: "Я ищу работу мастера по ремонту доспехов.\nМоя плата — 200 золотых вперёд и %17 процентов от всего найденного золота.\nВы не пожалеете, что наняли меня!"
  "2270":
    1: "Я могу починить любой сломанный магический предмет, кроме оружия и доспехов.\nМоя плата — 400 золотых вперёд и %17 процентов от всего найденного золота."
  "2271":
    1: "Восемь лет я учился у лорда Ньютона в Мисте, чтобы уметь отличать один магический предмет от другого.\nЯ буду работать на вас за 500 золотых вперёд и %17 процентов от всего найденного золота."
  "2272":
    1: "Я знаю все короткие пути и просёлочные дороги Энрота.\nЯ стану вашим проводником всего за 100 золотых вперёд и %17 процентов от всего найденного золота."
  "2273":
    1: "Я знаю все короткие пути и просёлочные дороги по всему Энроту.\nЯ буду вашим проводником за 200 золотых вперёд плюс %17 процентов от найденного золота."
  "2274":
    1: "Я знаю все короткие пути и просёлочные дороги по всему Энроту.\nЯ буду вашим проводником всего за 300 золотых вперёд, плюс %17 процентов от найденного золота."
  "2275":
    1: "Э-э, да.\nЯ могу, э-э, ну, работать.\nНа корабле.\nЯ помогу вам быстрее добираться куда нужно.\nСо мной вы пересечёте море на два дня быстрее обычного. Э-э, я хочу… ну, скажем, 100 золотых вперёд и %17 процентов от найденного золота."
  "2276":
    1: "Я потратил немало времени на составление точных карт вод, окружающих наш континент.\nБлагодаря моим картам и моему мастерству я смогу переправить вас через море на три дня быстрее, чем обычно.\nЯ беру 200 золотых вперёд, плюс %17 процентов от найденного золота."
  "2277":
    1: "Я могу путешествовать вместе с вами, дети мои, при условии первоначального взноса в размере 500 золотых и отчисления %17 процентов от найденного нами золота в пользу моей церкви.\nОдин раз в день я смогу исцелять вас от всех ран, за исключением смертельных."
  "2278":
    1: "Как опытный целитель, я могу раз в день исцелять ваши раны и многие другие недуги, кроме смерти и окаменения.\nМне нужно лишь пожертвование в 2000 золотых для моей церкви и %17 процентов от найденного золота."
  "2279":
    1: "Как мастер-целитель я пользуюсь большим спросом, хотя могу применять свою целительную магию лишь раз в день.\nЯ способен исцелить всё, кроме уничтожения. Прошу лишь пожертвовать моему храму 5000 золотых и отдавать мне %17 процентов от найденного золота."
  "2280":
    1: "Я помогу вам осмыслить всё увиденное в путешествии. Думаю, мои советы позволят вам получить больше опыта.\nЗа свои услуги я беру 300 золотых вперёд и %17 процентов от найденного золота."
  "2281":
    1: "Я помогу вам осмыслить всё увиденное в путешествии. Думаю, мои советы позволят вам получить гораздо больше опыта.\nЗа свои услуги я беру 700 золотых вперёд и %17 процентов от найденного золота."
  "2282":
    1: "Хороший совет пригодится каждому, а в оружии и тактике боя я разбираюсь как никто другой.\nВ сражении мои указания повысят ваши навыки владения оружием.\nМоя плата — 300 золотых вперёд и %17 процентов от найденного золота."
  "2283":
    1: "Хороший совет пригодится каждому, а в оружии и тактике боя я разбираюсь лучше всех.\nВ сражении мои указания значительно повысят ваши навыки владения оружием.\nМоя плата — 400 золотых вперёд и %17 процентов от найденного золота."
  "2284":
    1: "Я могу поделиться магической силой, чтобы усилить ваши заклинания и облегчить их сотворение. Моя плата — 500 золотых вперёд и %17 процентов от найденного золота."
  "2285":
    1: "Я могу значительно усилить вашу магию за 1000 золотых вперёд и %17 процентов от найденного золота."
  "2286":
    1: "Я могу поделиться немалой магической силой, чтобы значительно повысить ваши навыки владения магией и усилить заклинания. Моя плата — 2000 золотых вперёд и %17 процентов от найденного золота."
  "2287":
    1: "Иногда людям трудно торговаться за себя.\nЯ с удовольствием подскажу, как добиваться у торговцев более выгодных цен.\nМне нужно лишь 100 золотых вперёд и %17 процентов от найденного золота."
  "2288":
    1: "Я давно состою в Гильдии купцов, а прежде сам торговал коврами, поэтому знаю все хитрости ремесла.\nЯ подскажу, как торговаться с другими купцами и добиваться лучших цен.\nМоя плата — 200 золотых вперёд и %17 процентов от найденного золота."
  "2289":
    1: "У меня острый глаз и громкий голос.\nЯ замечу опасность и предупрежу вас прежде, чем станет поздно.\nЭто может спасти вам жизнь. Мне нужно лишь 300 золотых вперёд и %17 процентов от найденного золота."
  "2290":
    1: "Я всю жизнь провёл при дворах и в государственных учреждениях и знаю, как расположить людей к нужному делу.\nНаймите меня, и я помогу вам.\nМоя плата — 200 золотых вперёд и %17 процентов от найденного золота."
  "2291":
    1: "Я всю жизнь провёл при дворах и в государственных учреждениях и знаю, как расположить людей к нужному делу.\nНаймите меня, и я помогу вам.\nМоя плата — 300 золотых вперёд и %17 процентов от найденного золота."
  "2292":
    1: "Я немного разбираюсь в ремонте инструментов и прочих вещах.\nА ещё я умею обращаться с замками.\nЗа 200 золотых вперёд и %17 процентов от найденного золота я помогу вам их вскрывать."
  "2293":
    1: "Обращаться со сложными замками нелегко — без мастера тут не обойтись.\nЯ буду работать на вас за 300 золотых вперёд и %17 процентов от найденного золота."
  "2294":
    1: "Боги благоволят к пьяницам, детям и дуракам.\nНу а я — дурак!\nВозьми меня с собой, и, может быть, боги будут благоволить и тебе.\nМне нужно лишь 100 золотых вперёд и %17 процентов от найденного золота."
  "2295":
    1: "Говорят, что трубочистам сопутствует удача.\nНе знаю, как там на самом деле… Чистить дымоходы — это тяжёлый труд!\nНо если хочешь, можешь нанять меня за 200 золотых вперёд и %17 процентов от найденного золота…\nМожет быть, я принесу тебе удачу."
  "2296":
    1: "Если вам нужен кто-то, кто понесёт палатки, походную посуду и прочие дорожные удобства, я к вашим услугам!\nМне нужно лишь 100 золотых вперёд и %17 процентов от найденного золота."
  "2297":
    1: "За 200 золотых вперёд и %17 процентов от найденного золота я позабочусь о лагерных припасах и понесу ваше снаряжение.\nПоверьте, мои услуги стоят этих денег!"
  "2298":
    1: "За 500 золотых вперёд и %17 процентов от найденного золота я приведу в порядок ваши финансы и проверю редкость всех найденных монет.\nОбычно мне удаётся увеличить состояние клиента на 5 процентов."
  "2299":
    1: "За 1000 золотых вперёд и %17 процентов от найденного золота я приведу в порядок ваши финансы и проверю редкость всех найденных монет.\nОбычно мне удаётся увеличить состояние клиента на 10 процентов."
  "2300":
    1: "Хотите нанять личного повара?\nЗа 300 золотых вперёд и %17 процентов от найденного золота я возьму в дорогу дополнительный провиант и буду готовить на всех нас.\nНе пожалеете — все обожают мою кухню!"
  "2301":
    1: "Я учился в лучших кулинарных школах Энрота и готов стряпать для вас всего за 400 золотых вперёд и %17 процентов от найденного золота."
  "2302":
    1: "Вижу, вы не слишком хорошо умеете обращаться с лошадьми.\nЯ буду присматривать за всеми лошадьми, которых вы арендуете в конюшнях.\nС моей помощью вы доберётесь до места быстрее.\nМне нужно лишь 100 золотых вперёд и %17 процентов от найденного золота."
  "2303":
    1: "Слава известного музыканта следует за мной повсюду.\nЕсли я буду с тобой, часть этой славы наверняка достанется и тебе.\nМне нужно лишь 1000 золотых вперёд и %17 процентов от найденного золота на дорожные расходы."
  "2304":
    1: "По всему Энроту встречаются опасные чародеи.\nБольшинство из них применяет заклинания огня, молнии и других стихий.\nЯ знаю заклинание, которое защитит вас от стихий, и могу постоянно поддерживать его действие.\nЯ буду накладывать его, если вы возьмёте меня с собой.\nМне нужно лишь 1000 золотых вперёд и %17 процентов от найденного золота."
  "2305":
    1: "За 200 золотых вперёд и %17 процентов от найденного золота я буду постоянно поддерживать заклинание «Глаз волшебника» на уровне эксперта."
  "2306":
    1: "Хотели когда-нибудь полетать?\nВозьмите меня с собой, и я смогу раз в день накладывать на вас заклинание «Полёт».\nМоя плата — 2000 золотых вперёд и %17 процентов от найденного золота.\nНедорого, правда?"
  "2307":
    1: "Древние пророки утверждали, что умеют ходить по воде, и я вновь открыл их секрет.\nРаз в день я могу накладывать на вас и ваших спутников заклинание «Хождение по воде».\nМоя плата — 1000 золотых вперёд и %17 процентов от найденного золота."
  "2308":
    1: "Некоторые заклинания воспроизводят природные магические свойства Энрота.\nОдно из них — «Портал в город», и я умею накладывать его на уровне мастера.\nЕсли вы меня наймёте, я буду применять его для вас не чаще одного раза в день.\nМоя плата — 2000 золотых вперёд и %17 процентов от найденного золота."
  "2309":
    1: "Пожертвуйте моему храму 200 золотых и отдавайте %17 процентов от найденного золота — тогда я отправлюсь с вами и буду раз в день накладывать заклинание «Благословение»."
  "2310":
    1: "Ни одна уважающая себя армия не выступает без волынщика, вдохновляющего воинов на подвиги.\nДаже такому небольшому отряду, как ваш, это пойдёт на пользу.\nЯ отправлюсь с вами за 300 золотых вперёд и %17 процентов от найденного золота."
  "2311":
    1: "Мой опыт странствий поможет на день сократить любое путешествие — и по суше, и по морю.\nМне нужно лишь 100 золотых вперёд и %17 процентов от найденного золота."
  "2312":
    1: "Ар-р-р!\nЖизнь вольного моряка научила меня быстро ходить по морю и крепко держаться за своё золото.\nНо нынче мне не везёт, поэтому я наймусь к вам всего за 500 золотых вперёд и %17 процентов от найденного золота."
  "2313":
    1: "Каждому воину нужен оруженосец, который будет ухаживать за оружием и доспехами и прикрывать в бою.\nЯ стану вашим оруженосцем за 600 золотых вперёд и %17 процентов от найденного золота."
  "2314":
    1: "Удача — моя специальность, и я могу сделать вас удачливее за 400 золотых вперёд и %17 процентов от найденного золота."
  "2315":
    1: "Я всю жизнь провёл в дороге, и поверьте: нужно знать, как путешествовать и как договариваться.\nЯ помогу вам и с тем и с другим за 100 золотых вперёд и %17 процентов от найденного золота."
  "2316":
    1: "Не каждый умеет уговорить незнакомца дать ему желаемое.\nА я умею.\nВозьмите меня с собой, и мои способности облегчат вам общение с людьми.\nМоя плата — 500 золотых вперёд и %17 процентов от найденного золота."
  "2317":
    1: "Многих можно уговорить отдать то, с чем они ни за что не расстались бы, будь у них время подумать.\nГлавное — говорить быстро и не давать собеседнику опомниться.\nВсего за 200 золотых вперёд и %17 процентов от найденного золота я останусь с вами и научу этому полезному искусству."
  "2318":
    1: "Нужно обезвредить ловушки?\nЯ этим занимаюсь с тех пор, как три года назад вышел из тюрьмы.\nЕсли вам нужна помощь, я пойду с вами бесплатно!\nМне нужна практика."
  "2319":
    1: "У меня нет никаких навыков, которыми я мог бы тебе помочь, но если это позволит мне сбежать из школы и от домашних дел, я с удовольствием буду ходить за тобой повсюду!"
  "2321":
    1: "Ремонт любого оружия.\n%01 получает %17 процентов от всего найденного золота."
  "2322":
    1: "Ремонт любых доспехов.\n%01 получает %17 процентов от всего найденного золота."
  "2323":
    1: "Ремонт любых магических предметов.\n%01 получает %17 процентов от всего найденного золота."
  "2324":
    1: "Безошибочное опознание предметов и бонус 5 процентов ко всему получаемому опыту.\n%01 получает %17 процентов от всего найденного золота."
  "2325":
    1: "Все переходы по карте на один день быстрее (минимум на один день).\n%01 получает %17 процентов всего найденного вами золота."
  "2326":
    1: "Все переходы по карте занимают на два дня меньше (минимум на один день).\n%01 получает %17 процентов всего найденного вами золота."
  "2327":
    1: "Все переходы по карте занимают на три дня меньше (минимум на один день).\n%01 получает %17 процентов всего найденного вами золота."
  "2328":
    1: "Любое путешествие на лодке занимает на 2 дня меньше (минимум один день).\n%01 получает %17 процентов всего найденного вами золота."
  "2329":
    1: "Все путешествия на лодке занимают на 3 дня меньше (минимум один день).\n%01 получает %17 процентов всего найденного вами золота."
  "2330":
    1: "Один раз в день восстанавливает все очки здоровья всей группы.\n%01 получает %17 процентов от всего найденного вами золота."
  "2331":
    1: "Один раз в день восстанавливает все очки здоровья и снимает все состояния со всех членов группы (за исключением состояний «мертв», «оцепенение» или «уничтожен»).\n%01 получает %17 процентов от всего найденного вами золота."
  "2332":
    1: "Один раз в день полностью восстанавливает здоровье и устраняет все состояния у всей группы.\n%01 получает %17 процентов от всего найденного вами золота."
  "2333":
    1: "Бонус в размере 10 % ко всему полученному опыту.\n%01 получает %17 процентов от всего найденного золота."
  "2334":
