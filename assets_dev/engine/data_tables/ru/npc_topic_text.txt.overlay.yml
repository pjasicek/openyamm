    1: "Овладение вашей природной способностью дракона сделает вас намного сильнее!\nОвладев этой способностью, вы обретете способность летать, что позволит вам перевозить всю свою группу!\nЧтобы достичь уровня «Мастер», вам необходимо иметь уровень «Эксперт» 7 и заплатить мне 4000 золотых."
  "371":
    1: "Ты стремишься овладеть мастерством Великого мастера драконов?\nНе многим удаётся заслужить этот титул.\nМастерство Великого мастера дарует силу атаки «Удар крылом»!\nЭта атака отбрасывает противников назад, позволяя тебе раскрыть всю мощь своего «Пламенного взрыва»!\nТебе нужно будет доказать мне, что твой уровень мастерства достиг 10, и заплатить небольшую пошлину в размере 8000 золотых.\nКак только эти требования будут выполнены, звание Великого мастера станет твоим!"
  "372":
    1: "Вам когда-нибудь доводилось продавать предмет, который оказался лучше вашего текущего снаряжения?\nНет ничего хуже, чем когда торговец насмехается над вами за то, что вы не знаете, что продаете. С помощью навыка «Опознание предметов на уровне эксперта» вы сможете пытаться определять оружие и доспехи, чтобы избежать подобного конфуза. Если ваш уровень навыка равен 4 и вы заплатите 500 золотых, я научу вас этому."
  "373":
    1: "Жезлы, свитки, кольца и зелья могут оказаться очень важными, поэтому глупо не знать, что они собой представляют.\nНа уровне мастера навык «Опознание предметов» позволяет опознавать оружие, доспехи и прочие предметы.\nЯ обучу вас за 2500 золотых, если ваш навык уже достиг уровня эксперта (7)."
  "374":
    1: "Нашли древний предмет или реликвию и не знаете, как они действуют?\nВ этом случае незнание не благо: оно вполне может стоить вам жизни. На уровне великого мастера навык «Опознание предметов» позволяет опознать любую находку, включая артефакты и реликвии.\nДля обучения требуется навык уровня мастера (10) и 6000 золотых."
  "375":
    1: "Владельцы магазинов — народ жадный.\nХотите получать более выгодные цены на товары, которые покупаете и продаёте?\nТогда вам лучше как можно скорее освоить навык «Торговля». Я могу обучить вас навыку «Торговля» на уровне «Эксперт», если у вас уровень навыка равен 4 и вы заплатите 2000 золотых.\nУровень «Эксперт» удваивает ваш бонус к ценам."
  "376":
    1: "Владельцы магазинов — народ жадный.\nХотите получать более выгодные цены на товары, которые покупаете и продаёте?\nТогда вам лучше освоить навык «Торговец» и изучить все тонкости торговли. Я могу научить вас мастерству в навыке «Торговец», если у вас уровень «Эксперт» равен 7, показатель «Личность» — 50, и вы заплатите 5000 золотых.\nМастерство утраивает ваш бонус к ценам."
  "377":
    1: "Владельцы магазинов — народ жадный.\nХотите покупать и продавать товары по более выгодным ценам?\nТогда вам лучше освоить навык «Торговец» и изучить все тонкости торговли. Я могу научить вас уровню «Великий мастер» по навыку «Торговец», если у вас уровень «Мастер» равен 10 и вы заплатите 8000 золотых.\nУровень «Великий мастер» позволяет вам платить и получать реальную цену за товары."
  "378":
    1: "Качество вашего снаряжения зависит от мастерства того, кто его ремонтирует.\nЕсли вы не сможете его починить, то рискуете оказаться в дикой местности без доспехов и оружия.\nЭто может обернуться крайне плачевными последствиями. Мастерство в навыке «Ремонт предметов» дает вам возможность ремонтировать не только оружие, но и доспехи.\nВы сможете овладеть этим навыком, если ваш уровень навыка достигнет 4 и вы заплатите 500 золотых."
  "379":
    1: "Качество вашего снаряжения зависит от мастерства того, кто его ремонтирует.\nЕсли вы не сможете его починить, то рискуете оказаться в дикой местности без доспехов и оружия.\nЭто может обернуться крайне плачевными последствиями. Освоение навыка «Ремонт предметов» дает вам возможность не только ремонтировать оружие и доспехи, но и любые сломанные предметы прочего назначения.\nВы сможете овладеть этим навыком, если ваш уровень навыка «Эксперт» равен 7 и вы заплатите 2500 золотых."
  "380":
    1: "Качество вашего снаряжения зависит от мастерства того, кто его ремонтирует.\nЕсли вы не сможете его починить, то рискуете оказаться в дикой местности без доспехов и оружия.\nЭто может обернуться крайне плачевными последствиями. Великий мастер по ремонту предметов способен починить ЛЮБОЕ сломанное снаряжение.\nВы сможете овладеть этим навыком, если у вас уровень навыка «Мастер» равен 10 и вы заплатите 6000 золотых."
  "381":
    1: "Так вы считаете себя искателями приключений, да?\nУ вас даже мяса не хватит, чтобы устоять под ударом ребенка Тёмного Гнома!\nБодибилдинг — единственный выход.\nВы станете сильнее и выносливее, чем раньше!\nЭксперт по бодибилдингу выносливее обычного героя.\nЯ могу научить вас этому, если ваш уровень навыка равен 4, вы заплатите 500 золотых и готовы попотеть!"
  "382":
    1: "Так вы считаете себя искателями приключений, да?\nУ вас даже мяса не хватит, чтобы устоять под ударом даже маленького тролля!\nБодибилдинг — единственный выход.\nВы станете сильнее и выносливее, чем раньше!\nМастер бодибилдинга гораздо выносливее, чем обычный герой.\nЯ могу научить вас этому, если ваш уровень навыка «Эксперт» равен 7, вы заплатите 2500 золотых и у вас выносливость 50! Без труда не вытащишь рыбку из пруда!"
  "383":
    1: "Так вы считаете себя искателями приключений?\nДа у вас не хватит сил устоять даже под ударом маленького дракончика!\nБодибилдинг — единственный выход.\nВы станете сильнее и выносливее!\nВеликий мастер бодибилдинга — самый крепкий герой из всех, кого можно встретить.\nЯ обучу вас, если ваш навык достиг уровня мастера (9), у вас не меньше 50 единиц выносливости и вы заплатите 6000 золотых. Без труда не вытащишь и рыбку из пруда!"
  "384":
    1: "Не хватает очков заклинаний для произнесения заклинаний уровня «Эксперт»?\nВам нужна медитация.\nПри уровне навыка «Эксперт» в медитации вы получаете двойной бонус к доступным очкам заклинаний.\nЭто может означать ещё одно мощное заклинание, когда оно вам больше всего нужно!\nВы сможете получить уровень «Эксперт», если ваш уровень навыка равен 4 и вы заплатите мне 500 золотых."
  "385":
    1: "Не хватает очков заклинаний для применения заклинаний уровня «Мастер»?\nВам нужна медитация.\nПри уровне навыка «Мастер» в медитации вы получаете тройной бонус к доступным очкам заклинаний.\nЭто может означать возможность использовать ещё одно мощное заклинание, когда оно вам больше всего нужно!\nВы сможете достичь уровня «Мастер», если ваш уровень навыка «Эксперт» равен 7 и вы заплатите мне 2500 золотых."
  "386":
    1: "Не хватает очков заклинаний для применения заклинаний уровня «Великий мастер»?\nВам нужна медитация.\nПри уровне навыка «Великий мастер» в медитации вы получаете четырехкратный бонус к доступным очкам заклинаний.\nЭто может означать возможность использовать одно или несколько мощных заклинаний именно тогда, когда они вам нужны больше всего!\nВы сможете достичь уровня «Великий мастер», если ваш уровень навыка «Мастер» равен 10 и вы заплатите мне 6000 золотых."
  "387":
    1: "Иногда в подземельях и замках этой земли прячутся различные предметы.\nВозможно, вы что-то упустили, даже не подозревая об этом.\nНавык «Восприятие» повышает ваши шансы найти эти спрятанные предметы. Мастерство в навыке «Восприятие» удваивает ваши шансы.\nЗа 500 золотых и при 4-м уровне навыка «Восприятие» я научу вас этому."
  "388":
    1: "Иногда в подземельях и замках этой земли прячутся различные предметы.\nВозможно, вы что-то упустили, даже не подозревая об этом.\nНавык «Восприятие» повышает ваши шансы найти эти спрятанные предметы. Мастерство в навыке «Восприятие» утраивает ваши шансы.\nЗа 2500 золотых и при уровне навыка «Восприятие» 7 (уровень «Эксперт») я научу вас этому."
  "389":
    1: "Иногда в подземельях и замках этой земли прячутся различные предметы.\nВозможно, вы что-то упустили, даже не подозревая об этом.\nНавык «Восприятие» повышает ваши шансы найти эти спрятанные предметы. Мастерство высшего уровня в навыке «Восприятие» увеличивает ваши шансы в пять раз. За 6000 золотых и при уровне навыка «Восприятие» 10 я научу вас этому."
  "390":
    1: "Уровень «Эксперт» в навыке «Регенерация» удваивает количество очков здоровья, восстанавливаемых с течением времени.\nДля обучения этому навыку на уровне «Эксперт» требуется базовый уровень навыка 4 и оплата в размере 2000 золотых."
  "391":
    1: "Уровень мастерства «Мастер» в навыке «Регенерация» утраивает количество очков здоровья, восстанавливаемых с течением времени.\nДля обучения этому навыку на уровне «Мастер» требуется уровень «Эксперт» равный 7 и оплата в размере 5000 золотых."
  "392":
    1: "На уровне великого мастера навык «Регенерация» в четыре раза увеличивает скорость восстановления здоровья.\nДля обучения требуется навык уровня мастера (10) и 8000 золотых."
  "393":
    1: "Надоело, что сундуки взрываются прямо у вас перед носом?\nУстали от облаков ядовитого газа, огненных шаров и молний, отправляющих спутников на тот свет?\nНа уровне эксперта навык «Обезвреживание ловушек» вдвое повышает шанс справиться с ловушкой до её срабатывания.\nЯ обучу вас за 500 золотых, если навык достиг 4-го уровня."
  "394":
    1: "Надоело, что сундуки взрываются прямо у вас перед носом?\nУстали от облаков ядовитого газа, огненных шаров и молний, отправляющих спутников на тот свет?\nНа уровне мастера навык «Обезвреживание ловушек» втрое повышает шанс справиться с ловушкой до её срабатывания.\nЯ обучу вас за 2500 золотых, если навык достиг уровня эксперта (7)."
  "395":
    1: "Надоело, что сундуки взрываются прямо у вас перед носом?\nУстали от облаков ядовитого газа, огненных шаров и молний, отправляющих спутников на тот свет?\nВеликий мастер навыка «Обезвреживание ловушек» всегда устраняет ловушки до их срабатывания.\nЯ обучу вас за 6000 золотых, если навык достиг уровня мастера (10)."
  "396":
    1: "Хотелось бы и мне. К сожалению, мы ведем священную войну с проклятой Гильдией некромантов. Все ресурсы Храма Солнца, включая меня самого, направлены на это дело."
  "397":
    1: "Отправиться в приключение с тобой? Да, с удовольствием. Кстати, перед тем как уйти, Чарльз Кихот предложил именно это. «Неликс, — сказал он, — если те герои из альянса заглянут сюда, тебе стоит подумать о том, чтобы отправиться с ними». Похоже, он тебя высоко ценит. Ну, мне достаточно его рекомендации. Пойдем?"
  "398":
    1: "Пойти с тобой? Думаю, нет. Зачем мне присоединяться к кучке дилетантов, когда у меня и так здесь хватает приключений? Не смеши меня. Что ты можешь мне предложить такого, чего нет в жизни охотника на драконов?"
  "399":
    1: "Пойти с тобой? Мне нравится эта идея, но я должен остаться здесь. Я один из последних ветеранов, оставшихся здесь. Я должен остаться, чтобы защищать деревню."
  "400":
    1: "Да, это звучит неплохо. Хотя деревне, возможно, нужна моя помощь для защиты, я думаю, что лучшее, что я могу для неё сделать, — это пойти с тобой. Мой народ погибнет, если катаклизм не будет остановлен. Если я могу что-то сделать, чтобы это предотвратить, я должен это сделать."
  "401":
    1: "Присоединиться к вашей группе? С удовольствием. Вы не только оказали огромную услугу моему стаду, но мне стало ясно, что от ваших действий зависит само наше выживание."
  "402":
    1: "Знание того, с чем вам приходится сталкиваться в бою, может стать решающим фактором, определяющим жизнь или смерть.\nУмение распознавать монстров и противников, с которыми вы сражаетесь, может сыграть решающую роль. Я могу научить вас навыку «Экспертная опознание монстров», если у вас уже есть 4-й уровень этого навыка и вы заплатите 500 золотых."
  "403":
    1: "Тот, кто сегодня убегает, остаётся в живых, чтобы убежать в другой раз.\nОднако это не обязательно означает, что он трус.\nВозможно, он просто очень умен.\nВозможно, он знает, как атакует его противник и какие заклинания тот может использовать, если таковые имеются.\nЯ могу научить вас заклинанию «Мастер: Опознание монстров», если вы достигли 7-го уровня мастерства в навыке «Эксперт» и можете заплатить 2500 золотых."
  "404":
    1: "Если вы сможете проанализировать оборону своих врагов и выявить их слабые места, вы всегда будете побеждать.\nОбладая навыком «Опознание монстров» на уровне «Великий мастер», вы будете знать, как атакуют ваши враги и какова их оборона.\nЭти знания позволят вам наносить удары по их самым уязвимым местам. Я могу повысить ваш уровень этого навыка до «Великого мастера», если у вас уровень «Мастер» равен 10 и вы заплатите 6000 золотых."
  "405":
    1: "Знание одного вида оружия — это отлично.\nА знание всех видов оружия — ещё лучше.\nНавык «Эксперт-оружейник» повышает ваш шанс попасть любым оружием ближнего боя, которым вы можете владеть. Я могу сделать вас «Экспертом-оружейником», если у вас уровень навыка 4 и вы заплатите 2000 золотых."
  "406":
    1: "Умение владеть одним видом оружия ближнего боя — это отлично.\nА умение владеть всеми видами оружия ближнего боя — это ещё лучше. Навык «Мастер оружия» увеличивает урон, наносимый вами любым оружием, которым вы можете владеть. Я могу сделать вас «Мастером оружия», если у вас уровень навыка «Эксперт» равен 7 и вы заплатите 5000 золотых."
  "407":
    1: "Умение владеть одним видом оружия ближнего боя — это отлично.\nА умение владеть всеми видами оружия ближнего боя — ещё лучше.\nНавык «Мастер оружия» сокращает время восстановления любого оружия ближнего боя, которым вы уже владеете, и даёт шанс нанести больший урон.\nМастерство уровня «Великий мастер» удваивает как ваш шанс попадания, так и бонусы к урону по этому навыку. Я могу сделать вас «Великим мастером оружия», если у вас уровень навыка «Мастер» равен 10 и вы заплатите 8000 золотых."
  "408":
    1: "Присоединиться к вам? Я вынужден отказаться от этого предложения. Хотя вы оказали моему стаду огромную услугу, я пока не уверен в ваших лидерских качествах. Я хочу помочь в борьбе с катаклизмом, но не уверен, что ваш путь — правильный."
  "409":
    1: "Не думайте, что ваши подвиги остались незамеченными! Очевидно, вы — искатели приключений высочайшего класса. Я бы с удовольствием присоединился к вашей команде… если, конечно, вы меня примете."
  "410":
    1: "Я вижу, что вы тоже — искатели приключений. Но… ну, можно я буду откровенен? Хотя я не сомневаюсь в вашем потенциале, очевидно, что вы — не самая опытная группа, которую я видел. Я с удовольствием присоединился бы к вам, если бы вы были более… как бы это сказать, «закаленными»?"
  "411":
    1: "Надоели простые смеси для зелий?\nХотите приготовить что-то новое и мощное?\nХотите создавать сложные зелья?\nЯ обучу вас алхимии до уровня эксперта, если ваш навык достиг 4-го уровня и вы заплатите 500 золотых."
  "412":
    1: "Хотите узнать, как использовать зелья и составные зелья для приготовления белых зелий?\nЯ могу повысить ваш уровень знаний по алхимии до «Мастера», если у вас есть навык «Эксперт» 7-го уровня и вы заплатите 2500 золотых."
  "413":
    1: "Чёрное зелье — это вершина творчества алхимика!\nОно может оказывать влияние на самые разные вещи и к тому же имеет восхитительный вкус!\nВы сможете овладеть «Великим мастерством алхимии», если ваш уровень навыка «Мастер» в алхимии достигнет 10, у вас будет по одному экземпляру каждого из лучших реагентов и вы заплатите 6000 золотых."
  "414":
    1: "Обучение позволяет вам получать больше опыта от путешествий и новых знакомств. «Экспертное обучение» удваивает бонус к получаемому опыту, ведя вас по пути к большей мудрости.\nЯ обучу вас «Экспертному обучению», если ваш уровень навыка равен 4 и вы заплатите мне 2000 золотых."
  "415":
    1: "Навык «Мастерское обучение» позволяет вам получать больше опыта от путешествий и встреч. «Мастерское обучение» утраивает бонус к получаемому опыту, ведя вас по пути к большей мудрости.\nЯ обучу вас навыку «Мастерское обучение», если у вас уровень навыка «Эксперт» равен 7, вы заплатите мне 5000 золотых и ваш показатель «Интеллект» составляет 50."
  "416":
    1: "Обучение позволяет вам получать больше опыта от путешествий и новых знакомств. Навык «Обучение великого мастера» увеличивает бонус к получаемому опыту в пять раз, ведя вас по пути к большей мудрости.\nЯ обучу вас навыку «Обучение великого мастера», если у вас уровень навыка «Мастер» равен 10, вы заплатите мне 8000 золотых и ваш показатель интеллекта составляет 50."
  "417":
    1: "Паддл Тэйн — один из самых перспективных учеников.\nОн обучает владению посохом на уровне эксперта в Равеншоре."
  "418":
    1: "Селия Стоун, Мастер посоха, проживает в деревне троллей Раст, расположенной в пустыне Железных Песков.\nОна может научить вас искусству владения посохом, если вы этого пожелаете."
  "419":
    1: "Тристен Стилвотер обучает владению посохом на уровне великого мастера.\nТолько он поможет вам в совершенстве овладеть этим прекрасным оружием.\nИщите его в городе Сумерки у подножия Шэдоуспайра."
  "420":
    1: "Аэри Луодрин в настоящее время проживает в Равеншоре.\nОна — преданная ученица, изучающая искусство владения мечом, и может обучить вас владению этим оружием до уровня «Эксперт»."
  "421":
    1: "К сожалению, Джейсин Кардрон, мастер меча, посчитал, что его навыки будут, так сказать, «выгоднее» передать охотникам на драконов из ущелья Гарроты.\nЕсли вы хотите достичь уровня «Мастер» в владении мечом, вам придётся обратиться к нему в лагере охотников на драконов в ущелье Гарроты."
  "422":
    1: "Мион Драконтрекер, великий мастер меча, присоединился к рыцарю Чарльзу Кихоту в его походе против драконов ущелья Гарроты.\nВы найдёте Миона в форте охотников на драконов."
  "423":
    1: "Инструктор-эксперт по владению кинжалом Лори Весперс живет в городе тёмных эльфов Альвар.\nНайдите её там."
  "424":
    1: "Мастер Джоббер обучает владению кинжалом до уровня мастера.\nОн живёт в Равеншоре."
  "425":
    1: "Карла Нирсес, Великий мастер Кинжала, обучает всех пиратов Регна искусству владения кинжалом.\nОна живет вместе с ними на острове Регна, поскольку они хорошо ей платят."
  "426":
    1: "Херальд Фострайк, один из лучших рыцарей Чарльза Кихота, обучает экспертному владению топором.\nЕго можно найти в лагере охотников на драконов в ущелье Гарроты."
  "427":
    1: "Джасп Хантер — мастер владения топором.\nОн обучит вас приёмам, необходимым для достижения уровня мастера.\nОн живёт в Равеншоре."
  "428":
    1: "Великий мастер Гарик Сенджак — великий мастер, преподающий искусство владения топором.\nОн проживает в Логове Бальтазара в регионе Блуждающем Разоре."
  "429":
    1: "Матрик Таунсейвер защищал город Равеншор от многочисленных набегов регнанских пиратов.\nБлагодаря его мастерству и обучению владению копьем горожанам удалось отбить пиратов. Он может обучить вас владению копьем до уровня «Эксперт»."
  "430":
    1: "Ашандра Уитерсмит — мастер-преподаватель владения копьем.\nЕё обучение искусству владения копьем приведёт вас к мастерству в обращении с этим оружием.\nОна живёт в торговом городе Альвар."
  "431":
    1: "Ярроу — Великий мастер копья.\nЕё острый глаз и умение выслеживать добычу помогли ей достичь такого уровня мастерства.\nОна использует копьё, чтобы выслеживать ядовитых куатов в джунглях Островов Кинжальной Раны."
  "432":
    1: "Шиван Кини в совершенстве стреляет из лука.\nЕё уроки помогут вам достичь уровня эксперта во владении этим дальнобойным оружием.\nОна живёт в деревне Кровавая Капля на Островах Кинжальной Раны."
  "433":
    1: "Мастер Оберик Ноузворт обучает искусству владения луком в своём доме в Равеншоре.\nЕсли вы стремитесь овладеть этим оружием, вам нужно найти его там."
  "434":
    1: "Солис, Великий мастер стрельбы из лука, живет в городе тёмных эльфов Альвар.\nОна может научить вас искусству стрельбы из лука на уровне «Великий мастер»."
  "435":
    1: "Лиша Саурброу обучает владению булавой на уровне эксперта у себя дома в Равеншоре."
  "436":
    1: "Роберт Морнингстар обучает рыцарей в ущелье Гарроты искусству владения булавой."
  "437":
    1: "Брат Хартсворн, Великий мастер владения булавой, удалился в тишину пустыни Железных Песков, ища умиротворения среди дюн этого края.\nОн обитает в деревне Раст."
  "438":
    1: "Киллейн Мур прежде служил рыцарю Чарльзу Кихоту, но не поддержал его поход на драконов ущелья Гарроты. Теперь Мур обучает владению щитом на уровне эксперта у себя дома в Альваре."
  "439":
    1: "Шелдон Найтвуд живёт в городе Твайлайт, под Гильдией некромантов на Шэдоуспайре.\nОна может научить вас навыку «Мастерство щита»."
  "440":
    1: "Рыцарь Перин Риверстон носит титул великого мастера щита.\nСейчас он служит Чарльзу Кихоту и обучает рыцарей правильному обращению со щитом.\nНайдите его в лагере охотников на драконов в ущелье Гарроты."
  "441":
    1: "Человек-ящерица Тадин — инструктор экспертного уровня по ношению кожаных доспехов.\nПосле его обучения вы получите экспертный уровень навыка в ношении этих доспехов.\nВы найдёте его на Острове Кинжальной Раны."
  "442":
    1: "Мастер Шеймус Холлифилд живёт в Логове Бальтазара, городе минотавров в Блуждающем Разоре.\nОн может обучить вас мастерскому владению кожаными доспехами."
  "443":
    1: "Медвари Элмсмайр изготавливает лучшие кожаные доспехи во всём королевстве.\nОна носит титул великого мастера кожаных доспехов и обучает этому навыку у себя дома в деревне Раст, в пустыне Железных Песков."
  "444":
    1: "Кузнечица Тобрен помогала Равеншору во время Первой пиратской войны.\nЧетыре недели её горн не угасал, пока она ковала кольчуги для защитников города.\nТеперь она обучает ношению кольчуги на уровне эксперта у себя дома в портовом Равеншоре."
  "445":
    1: "Халиан Эверсмайл освоил все навыки, которые только мог, у Великого мастера кольчуги, а затем бежал в город Альвар, где теперь обучает купцов Альвара искусству владения этими доспехами.\nОн научит и вас этому искусству."
  "446":
    1: "Великий мастер Селин Бернкиндл обучает тому, как максимально эффективно использовать кольчугу.\nОна живёт среди пиратов Регны."
  "447":
    1: "Боун обучает ношению лат на уровне эксперта в своей хижине на Островах Кинжальной Раны."
  "448":
    1: "Мастер Ботам был одним из лучших воинов Первой пиратской войны.\nРавеншор обязан ему огромной благодарностью.\nБотам и его товарищ-фехтовальщик возглавили атаку на первую волну регнанцев.\nИх пластинчатые доспехи отражали все удары, кроме самых сильных.\nОн по-прежнему преподаёт мастерство владения пластинчатыми доспехами у себя дома."
  "449":
    1: "Сетин Айронфист, великий мастер пластинчатых доспехов, — настоящая движущая сила крестового похода Чарльза Кихота против драконов ущелья Гарроты.\nБез его наставлений по обращению с доспехами рыцари Кихота стали бы лишь пушечным мясом перед гневом драконов Редревера."
  "450":
    1: "Тарен Темпер покинул Эратию, чтобы начать новую жизнь среди тех, кто ничего не знает об истории рода Темперов.\nВ своём доме в Равеншоре он преподаёт навыки «Эксперт» в области огненной магии."
  "451":
    1: "Соломон Стил, Мастер Огня, живет в тихом городе Альвар.\nОн может научить вас искусству магии огня."
  "452":
    1: "Бёрн, Великий мастер Огня, обитает в удушающей жаре Плана Огня.\nВозможно, Ворота Огня, появившиеся в Железнопесчаной пустыне, приведут вас к нему.\nОн сможет научить вас искусству магии огня на уровне великого мастера."
  "453":
    1: "Реши преподаёт навык «Эксперт» в области воздушной магии в своём доме на Островах Кинжальной Раны."
  "454":
    1: "Холлис Стормей, Великий мастер магии воздуха, обосновалась в Логове Бальтазара — обители минотавров."
  "455":
    1: "Клауд Недлон стремился заключить сделку с Владыками Воздуха.\nОн отправился на поиски пути в План Воздуха, где, как он полагал, сможет узнать всё, что ему до сих пор оставалось непонятным в искусстве магии Воздуха.\nВам предстоит отправиться в План Воздуха, чтобы узнать, удалось ли ему это."
  "456":
    1: "Ульбрехт Педертон в одиночку положил конец Второй пиратской войне.\nКогда пираты начали высаживаться на берег, он бросился по пляжу на помощь Равеншору.\nОн подчинил себе само море и заставил регнанский флот отступить обратно в океан.\nК сожалению, эта попытка стоила ему способности пользоваться магией вообще.\nТем не менее он по-прежнему преподаёт курс «Магия воды для экспертов».\nОн живёт в Равеншоре по сей день."
  "457":
    1: "Грегори Мист, Мастер магии воды, живёт в деревне Раст, расположенной в пустыне Железных Песков.\nОн утверждает, что у него есть план, как с помощью магии превратить жаркую пустыню в зелёную равнину.\nЕсли у него найдётся время, он сможет научить вас искусству владения магией воды."
  "458":
    1: "Блэк Каррент когда-то была могущественной магией в этих краях.\nЕё жажда власти взяла верх над осторожностью, и она попыталась завоевать План Воды.\nОна призвала врата в этот план и прошла через них.\nС тех пор о ней больше ничего не было слышно.\nОна была Великим Мастером магии воды.\nЕсли она всё ещё жива, вы можете найти её в Плане Воды."
  "459":
    1: "Острин Гривич, эксперт-инструктор по магии Земли, живет в деревне «Кровавая капля» на островах Кинжальной Раны."
  "460":
    1: "Мастер земной магии Дороти Сэйблвуд помогла положить конец Первой пиратской войне.\nС помощью неизвестного мага воздуха она возвела глиняные стены, чтобы не дать регнанским пиратам покинуть свои корабли.\nСейчас она преподаёт свои навыки в своём доме в Альваре."
  "461":
    1: "Великий мастер Гривен перешёл в Сферу Земли после того, как прочитал свой последний урок Дороти Сэйблвуд.\nВозможно, он живёт там и по сей день.\nКто знает, что происходит в стихийной сфере?"
  "462":
    1: "Стратон Хоторн обучает магии Духа на уровне эксперта. Он живёт в портовом городе Равеншор."
  "463":
    1: "Мастер Бетольд Керн служит рыцарю Чарльзу Кихоту в его походе против драконов ущелья Гарроты.\nНайдите его в лагере охотников на драконов.\nЕсли вам повезёт, у него найдётся время научить вас магии духа."
  "464":
    1: "Ласитер Рейвенсайт — Великий мастер магии Духа.\nОн живет в Мурмурвуде, недалеко от Храма Солнца, где продолжает свои исследования сущности Духа.\nОн может повысить ваш уровень мастерства в магии Духа до уровня великого мастера."
  "465":
    1: "Шейн Крюлен, ученик школы «Магия разума», может обучить вас навыкам экспертного уровня в этой тайной магии.\nНайдите его в городе тёмных эльфов Альвар."
  "466":
    1: "Барбара Лоттс, мастер магии разума, живёт в Логове Бальтазара, городе минотавров в Блуждающем Разоре.\nПод её руководством можно овладеть магией разума на уровне мастера."
  "467":
    1: "Гилад Дримрайт, Великий мастер магии разума, присоединился к многим другим Великим Мастерам магии в регионе Мурмурвуд.\nЗдесь они сотрудничают с Храмом Солнца, чтобы совершенствовать свои общие навыки и знания.\nГилад может обучить вас магии разума до уровня великого мастера."
  "468":
    1: "Зева Пойзд обучает магии Тела на уровне эксперта. Он живёт со своим народом на Островах Кинжальной Раны в Ифаринском море."
  "469":
    1: "Тугор Арин, мастер магии тела, служит целителем у рыцаря Чарльза Кихота в ущелье Гарроты.\nЕго искусство помогает исцелять молодых рыцарей, раненных в походе против местных драконов."
  "470":
    1: "Критий Сноутри, великий мастер магии Тела, живёт в тихом Мурмурвуде вдали от мирских тревог.\nТолько он способен обучить вас этому тайному искусству на уровне великого мастера."
  "471":
    1: "Арчибальд Доунсглоу обучает магии Света на уровне эксперта в Равеншоре, на берегу Ифаринского моря.\nРодители назвали его, не зная, что такое же имя носит глава эратийской Гильдии некромантов.\nАрчибальд хочет прославить своё имя в Свете, а не во Тьме, как его тёзка."
  "472":
    1: "Мастер Луниус Доунбрингер обитает среди жрецов Мурмурвуда. Он может присвоить вам звание Мастера магии света, если вы сможете пережить все опасности леса."
  "473":
    1: "Олдрин Клирай, Великий мастер Света, обитает на острове Регна.\nОн надеется положить конец злодеяниям пиратов.\nОн может обучить вас искусству великого мастера, если вы переживете встречу с пиратами."
  "474":
    1: "Патвин Даркенмор обучает магии Тьмы на уровне эксперта и живёт среди тёмных эльфов Альвара."
  "475":
    1: "Мастер магии Тьмы Карла Амберпул следовала за путешествиями Ситикуса Шэдоурнера, великого мастера Тьмы, и обосновалась среди некромантов Шэдоуспайра."
  "476":
    1: "Ситикус Шэдоураннер, Великий мастер искусства Магии Тьмы, обосновавшаяся на острове Регна.\nЗдесь капитаны пиратов получают её благословение на свои корабли перед набегом.\nОна может обучить вас искусству Магии Тьмы на уровне великого мастера."
  "477":
    1: "Кайра Спаркмен обучает опознанию предметов на уровне эксперта и живёт в Альваре."
  "478":
    1: "Эйтиан, мастер опознания предметов, служит у торговцев Альвара и сейчас живёт на Островах Кинжальной Раны. Многие путешественники приносят ему трофеи для опознания.\nЕсли вы его навестите, у него, возможно, найдётся время обучить вас до уровня мастера."
  "479":
    1: "Эльзбет Рогген, Великий мастер навыка «Опознание предметов», проживает в городе Сумерки, расположенном в Шэдоуспайре.\nОна может научить вас всему, что необходимо для достижения уровня Великого мастера."
  "480":
    1: "Фишнер Томб оставил службу у Торговцев Альвара и вернулся на родные Острова Кинжальной Раны в Ифаринском море.\nНайдите его там, чтобы обучиться торговле на уровне эксперта."
  "481":
    1: "Фентон Айверсон, мастер торговли из Альвара, испытывает всех, кто желает повысить этот навык.\nВы найдёте Фентона в городе Альвар, где он сможет обучить вас до уровня мастера."
  "482":
    1: "Рейвен Квиктонг, великий мастер-торговец Альвара, проживает в городе Равеншор.\nТам Рейвен может наблюдать за взаимодействием многочисленных рас, ведущих между собой торговлю.\nТолько он может повысить ваш уровень владения навыком «Торговля» до уровня «Великий мастер»."
  "483":
    1: "Эвандар Лоттс обучает навыкам «Ремонт предметов» на уровне «Эксперт».\nОн проживает в приморском городе Равеншор."
  "484":
    1: "Быстрая Джени — мастер навыка «Ремонт предметов». Она живёт в деревне, расположенной недалеко от форта охотников на драконов в ущелье Гарроты."
  "485":
    1: "Кетрин Тонк, великий мастер навыка «Ремонт предметов», живёт в тихом Мурмурвуде.\nЕго умения оказались неоценимы для Храма Солнца."
  "486":
    1: "Меназавр, сильнейший ящер с Островов Кинжальной Раны, обучает бодибилдингу на уровне эксперта."
  "487":
    1: "Кеннет Оттертон носит титул крестоносца и служит под командованием рыцаря Чарльза Кихота в ущелье Гарроты.\nХодят слухи, что он в одиночку повалил дракона на землю.\nКонечно, затем другим рыцарям пришлось помочь ему добить чудовище.\nКеннет также обучает мастерскому владению навыком «Бодибилдинг»."
  "488":
    1: "Микел Смитсон носит титул «Сильнейший в Джадаме».\nКроме того, он является великим мастером бодибилдинга.\nЕсли хотите укрепить тело, отправляйтесь к нему в деревню Раст, расположенную в пустыне Железных Песков."
  "489":
    1: "Олтон Путнэм — эксперт в искусстве медитации.\nОн сможет научить вас, если вы найдёте его в приморском городе Равеншор."
  "490":
    1: "Гретчин Невермор обучает всех жрецов Солнца высокому искусству медитации. Он обитает в Мурмурвуде, недалеко от Храма Солнца."
  "491":
    1: "Ленорд Найткраулер, великий мастер медитации, является одним из ведущих членов Гильдии некромантов Шэдоуспайра.\nОн обучает некромантов искусству медитации у себя дома в деревне Сумерки."
  "492":
    1: "Силк Найтвокер обучает восприятию на уровне эксперта и живёт среди тёмных эльфов Альвара.\nБольшую часть времени он учит торговцев замечать то, что должно оставаться скрытым, но, если вам повезёт, найдёт время и для вас."
  "493":
    1: "Хельга Стилэй живет среди некромантов Шэдоуспайра в деревне Сумерки.\nГильдия некромантов благодарна ей за обучение на уровне «Мастер» в навыке «Восприятие»."
  "494":
    1: "Великий мастер восприятия Балан Суретрейл живёт в Логове Бальтазара, городе минотавров.\nЧтобы пройти у него обучение, найдите его в Блуждающем Разоре."
  "495":
    1: "Кетрик Тарент преподает курс «Экспертные знания по регенерации» у себя дома в деревне Раст, расположенной в пустыне Железных Песков."
  "496":
    1: "Уильям Сэмпсон, Мастер регенерации, живёт в тишине Мурмурвуда.\nОн пользуется библиотеками Храма Солнца, чтобы углубить свои знания по истории троллей."
  "497":
    1: "Уш Многохвостый, великий мастер регенерации и легендарный воин, живёт среди своего народа на Островах Кинжальной Раны.\nГоворят, он тринадцать раз терял хвост в боях с регнанскими пиратами, и каждый раз у него отрастал новый!"
  "498":
    1: "Чевон Уист обучает навыку «Обезвреживание ловушек» на уровне эксперта. Эти знания особенно полезны исследователям разрушенных храмов возле его дома на Островах Кинжальной Раны."
  "499":
    1: "Келли Лайтфингерс, мастер по обезвреживанию ловушек, ушла на покой и поселилась в своем доме в торговом городе Альвар.\nТам она по-прежнему обучает молодых купцов навыкам установки и обезвреживания ловушек на сундуках.\nЕсли вы достойны, она сможет повысить ваш навык «Обезвреживание ловушек» до уровня мастера."
  "500":
    1: "Гарет Лифтер, Великий мастер обезвреживания ловушек, живет на роскошном острове Регна, где учит своих товарищей-пиратов, как лучше всего защищать свои сундуки с награбленным добычей."
  "501":
    1: "Да! Да! Отличная идея. Вы — именно те спутники, которых я ищу. Я слышал о вас и о ваших приключениях."
  "502":
    1: "Нет. Я — старый вампир. Чтобы было ясно: ты мне не достоин. Я ищу приключений, а не хочу быть твоим опекуном. У меня нет терпения, чтобы обучать тебя всем азам."
  "503":
    1: "Да, ты, похоже, достоин моего общества. Хорошо, я пойду, если ты меня примешь."
  "504":
    1: "Думаю, нет. Теперь, когда я успел тебя разглядеть, становится ясно, что ты не достоин моего общества. Я ищу компанию более известных людей."
  "505":
    1: "Должен сказать, что эта идея мне нравится. Хм, да! Вкус свободы на дороге — это именно то, что мне нужно. Я уже давно занимаюсь этим делом — сражаюсь с драконами, и, честно говоря, оно начинает надоедать. Человеку нужно постоянно искать для себя новые увлечения. Если хочешь, я пойду с тобой."
  "507":
    1: "Тесса Мейкер, эксперт по опознанию монстров, совершенствует свои навыки, составляя каталог драконов ущелья Гарроты.\nСейчас она служит рыцарю Чарльзу Кихоту."
  "508":
    1: "Мэтрик Кинедж, мастер навыка «Опознание монстров», в настоящее время изучает обитателей Мурмурвуда.\nЕсли вы хотите овладеть этим навыком, вам нужно найти его там."
  "509":
    1: "Блэкен Стоункливер, великий мастер опознания монстров, видел всех существ континента Джадам.\nОн поделится с вами знаниями, если вы найдёте его дом в Равеншоре."
  "510":
    1: "Рыцарь Норберт Слейер обучает всех рыцарей Чарльза Кихота навыку «Мастер оружия» на уровне эксперта.\nПосетить одно из его занятий можно в ущелье Гарроты."
  "511":
    1: "Ласатин Шрамоносный, мастер навыка «Мастер оружия», живет на Островах Кинжальной Раны."
  "512":
    1: "Джаспер Стилкойф, великий мастер навыка «Мастер оружия», входит в число предводителей Регнанского пиратского совета.\nОн обучает пиратов обращению со всеми видами оружия.\nЕсли вы отважитесь отправиться на Регну и переживёте его уроки, то тоже сможете стать великим мастером."
  "513":
    1: "Вы, наверное, шутите! Я — по праву знаменитый рыцарь. Зачем мне путешествовать с такой шпаной, как вы? Ну, может, это и было бы по-своему забавно, но я же должен заботиться о своей репутации."
  "514":
    1: "Да! Звучит здорово. Судя по тому, что я слышал о твоих приключениях, у тебя есть шанс познать величие. С моей помощью мы сможем превратить этот шанс в реальность. Ну, что скажешь? Я всегда ищу возможность пополнить свою легенду!"
  "515":
    1: "Присоединиться к тебе? Хо-хо. Какая забавная идея. Зачем великому Торну Андерстоуну путешествовать с такими, как ты?"
  "516":
    1: "Табита Уотершед, эксперт алхимии, обучает приготовлению зелий и припарок у себя дома в торговом городе Альвар."
  "517":
    1: "Кетри Трежерстоун, мастер-алхимик, живёт в Мурмурвуде, изучая растения и грибы, растущие в этом умиротворённом лесу."
  "518":
    1: "Ич, Великий мастер алхимии, десятилетиями изучал искусство приготовления зелий.\nОн знает всё, что только можно знать о смешивании реагентов для создания как полезных, так и вредных зелий.\nНайдите его дом в густых джунглях Островов Кинжальной Раны."
  "519":
    1: "Петра Митрит, эксперт в области обучения, живет недалеко от Храма Солнца в Мурмурвуде."
  "520":
    1: "Гаррет Мистспринг, Мастер обучения, обучает всех учеников некромантии искусству обучения.\nЗа это Гильдия некромантов щедро вознаграждает его.\nОн живет в деревушке Сумерки, у подножия Шэдоуспайра."
  "521":
    1: "Ванда Лайтсворн, великий мастер обучения, служит Чарльзу Кихоту и обучает его рыцарей.\nЧарльз Кихот надеется, что это даст его войскам преимущество в сражении с драконами ущелья Гарроты."
  "522":
    1: "Флинн Шадор, вампир-эксперт, проживает в городе Сумерки и служит «глазами» и убежищем для всех вампиров, прибывающих в этот регион.\nОн может обучить вас навыкам вампира-эксперта."
  "523":
    1: "Дуглас Диртмур, Мастер-вампир, будет обучать всех, чьи навыки соответствуют его стандартам.\nКогда он закончит с вами, вы в полной мере овладеете способностями, присущими всем вампирам.\nОн проживает в деревне «Сумерки» в Шэдоуспайре."
  "524":
    1: "Хотя наверняка этого никто не знает, ходят слухи, что Пейдж Арахния, великий мастер вампирских способностей, — первый вампир на континенте Джадам. Она знает о жизни вампира всё и может обучить вас своим умениям.\nНайдите её логово в Шэдоуспайре."
  "525":
    1: "Федвин Дервиш может научить вас искусству тёмных эльфов на уровне «Эксперт».\nПройдя обучение у него, вы начнёте великое путешествие, которое приведёт вас к роли лидера своего народа.\nНайдите его в городе тёмных эльфов Альвар."
  "526":
    1: "Ланши Кэверхилл, главный торговец Альвара, в настоящее время проживает в приморском порту Равеншор.\nОна знает всё о том, как в полной мере раскрыть природные способности, присущие всем тёмным эльфам."
  "527":
    1: "Тон Агрейнель, главный торговец Альвара, может обучить вас навыкам великого мастера тёмных эльфов.\nВам придётся доказать, что вы достойны его наставлений, но полученные преимущества с лихвой окупят все ваши усилия."
  "528":
    1: "Иштон, младший командир драконьей эскадрильи ущелья Гарроты, обучает молодых драконов владению их расовой способностью на уровне эксперта.\nОн живёт здесь, в Драконьих пещерах ущелья Гарроты."
  "529":
    1: "Мастер-дракон Эртинт является командиром эскадрильи всех драконов, служащих под началом Дефтклоу Редревера, и может обучать драконов искусству владения их природными драконьими способностями. Эртинт обитает в Драконьих пещерах ущелья Гарроты."
  "530":
    1: "Клейн Скарвинг уступает по силе лишь самому Дефтклоу Редреверу.\nКлейн носит титул великого мастера драконьих способностей и обучает драконов пользоваться их природной силой.\nОбратитесь к нему, если хотите достичь уровня великого мастера.\nОн живёт здесь, в Драконьих пещерах ущелья Гарроты."
  "531":
    1: "Священник отправил тебя обратно с «Самоцветом восстановления»?\nЯ наконец-то свободен от этого места!\nНайди меня, если захочешь, чтобы я когда-нибудь путешествовал с тобой!\nБуду рад присоединиться к тебе в твоих путешествиях!\nЯ буду ждать тебя в Гостинице искателей приключений в Равеншоре."
  "532":
    1: "Ты не уничтожил всех вредителей.\nУ меня есть отчёты, согласно которым в этом регионе всё ещё находятся драконы.\nВернись, когда уничтожишь их всех!"
  "533":
    1: "Ты ещё не убил всех охотников на драконов.\nТолько что вернулся отряд, который сообщил, что видел их на равнинах.\nВернись, когда убьёшь их всех!"
  "534":
    1: "Вот твоё оружие. Если найдёшь ещё руды, я с удовольствием изготовлю тебе ещё оружия."
  "535":
    1: "Мне нужна руда, чтобы изготовить оружие.\nЧем лучше руда, тем лучшее оружие я смогу изготовить."
  "536":
    1: "Вот твоя броня. Если найдешь ещё руды, я с удовольствием сделаю тебе ещё броню."
  "537":
    1: "Мне нужна руда, чтобы изготовить доспехи.\nЧем лучше руда, тем лучше доспехи я смогу изготовить."
  "538":
    1: "Вот ваш предмет. Если вы найдёте ещё руды, я с удовольствием изготовлю для вас ещё предметы."
  "539":
    1: "Мне нужна руда, чтобы изготовить предметы.\nЧем лучше руда, тем лучше предметы я смогу изготовить."
  "540":
    1: "Чтобы стать чемпионом «Аркомага», выиграйте партию в каждой таверне на поверхности Джадама и под ней.\nВсего турниры по «Аркомагу» проводятся в 11 тавернах.\nВыполнив задание, вернитесь ко мне за наградой."
  "541":
    1: "Вы должны одержать победу во ВСЕХ 11 тавернах.\nПока вы этого не сделаете, вас не смогут объявить чемпионом Аркомагов."
  "542":
    1: "Поздравляю!\nТы стал чемпионом «Аркомага»!\nПриз ждёт тебя в сундуке у входа в мой дом."
  "543":
    1: "Ах, «приключения». Похоже, в последнее время мне их явно не хватало. С тех пор как закончилась наша война с Ледяными гигантами, я почти не занимался ничем, кроме обучения молодых воинов. Скажи, а тебе не нужен случайно попутчик? Может, я смогу отправиться с тобой. У меня есть много навыков, которые могут тебе пригодиться, да и топором я владею просто смертельно!"
  "544":
    1: "Да, приключения — это замечательно. У меня их было уже несколько. Вообще-то, давай я расскажу тебе о том случае, когда я… Постой, мне только что пришло в голову, что ты предлагаешь мне отправиться в приключение вместе с тобой! Предложение неплохое, но… как бы это по-вежливому сказать? Ты просто ещё недостаточно опытен. Боюсь, что мне быстро наскучат те испытания, к которым ты готов."
  "545":
    1: "А, вы предлагаете мне поехать с вами, чтобы я сам посмотрел эти места. Прекрасное предложение. Я, безусловно, уже достаточно отдохнул! Хорошо, я готов отправиться в путь, если вы возьмете меня с собой."
  "546":
    1: "Хотя после моего долгого сна я, возможно, и не выгляжу так, знайте: вы разговариваете с одним из величайших вампиров, живущих сегодня. Пойти с вами? Думаю, нет. Ваша неопытность скорее помешала бы мне, чем помогла. Мне лучше будет действовать в одиночку."
  "547":
    1: "Присоединиться к тебе! Ха! Я восхищаюсь твоей смелостью. Да… восхищаюсь ею безмерно. Хорошо. Ты заслужил моё уважение. Я пойду с тобой."
  "548":
    1: "Присоединиться к тебе? Какая глупая мысль. У меня и так уже достаточно блох. Мне не нужны ещё какие-то паразиты. Убирайся!"
  "549":
    1: "Великий мастер, преподаватель искусства «Магии тела», Темпус, обитает на эльфийской территории Авли.\nЕго дом находится на острове где-то в центральной части залива."
  "550":
    1: "Я доволен Айронфистами и их мудрецом Ксантором. Хотя мы никогда не работали вместе напрямую, их борьба в Энроте и Эратии против Гильдии некромантов и демонов ясно показывает, что они служат Свету. Я полностью доверяю их плану спасения от кризиса."
  "551":
    1: "У Храма Солнца было достаточно времени, чтобы изучить врата, появившиеся в Мурмурвуде. Я уверен, что они ведут в Сферу Воздуха. Несколько раз мои братья видели возле этих врат духов воздуха. Некоторые из самых смелых заглянули сквозь них и рассказали, что увидели кружащееся царство облаков."
  "552":
    1: "Как Жрец Света, у меня есть свои соображения относительно причин этого кризиса. Я уверен, что к этому так или иначе причастны либо Храм Луны, либо Гильдия некромантов. Великий Свет! А что, если они объединились? Какая ужасная мысль."
  "553":
    1: "Не уверен, что можно доверять словам этого так называемого «Разрушителя». Однозначно, он не тот Разрушитель, о котором говорится в Священном Писании. А все эти разговоры о криганах и людях, живущих на многих мирах, — это прямое противоречие Истине, которую мой храм хранит с начала времен!"
  "554":
    1: "Мы рады, что вы с нами, герои Джадама. Знайте: Храм Солнца также считает вас слугами Света. Вы всегда будете нашими желанными гостями."
  "555":
    1: "Хотелось бы, чтобы мой первый визит в Равеншор состоялся при более благоприятных обстоятельствах. В этом городе есть на что посмотреть, и жаль, что у меня не хватило времени, чтобы лучше его изучить. Зато в этом купеческом доме есть отличная библиотека. Вы её видели?"
  "556":
    1: "Регнанцы построили аванпост на одном из Островов Кинжальной Раны. Мы опасаемся, что они могут напасть на Равеншор. Если это произойдёт, мы эвакуируем город и вернёмся, когда гарнизон очистит его от пиратов."
  "557":
    1: "Когда я стал вожаком стада, я и не предполагал, что мое правление будет настолько насыщенным событиями. И уж точно я не думал, что встречу кого-то вроде королевы Кэтрин! А вы знали, что до тех пор, пока она не отреклась от престола в Эратии, она правила и Эратией, и Энротом?"
  "558":
    1: "Как вы знаете, портал, ведущий в План Воды, появился недалеко от Логова Бальтазара в «Блуждающем Разоре». Он находится посреди озера, образовавшегося в результате великого наводнения, которое хлынуло оттуда."
  "559":
    1: "Возможно, вам будет сложно раздобыть провизию в землях за Кристаллом. Когда я покидал Логово Бальтазара, я взял с собой запас железных пайков, которые мои войска берут с собой в поход. Вот, возьмите то, что у меня есть. Они лёгкие и сытные. Надеюсь, они вам пригодятся."
  "560":
    1: "Если именно заключение владык стихий стало причиной этого кризиса, то, безусловно, их освобождение — это способ положить ему конец! Они — существа, обладающие почти невообразимой силой. Освободившись от власти Разрушителя, они смогут восстановить прежний порядок вещей. Наверное, именно об этом и говорится в пророчестве!"
  "561":
    1: "Словами этого не передать. Моё стадо, как и все обитатели Джадама, навсегда останется у вас в долгу. Благодаря вашей самоотверженности здесь и в других мирах Логово Бальтазара вновь обрело величие. Вы и ваши товарищи всегда будете нашими желанными гостями. Да благословит вас Свет!"
  "562":
    1: "Не могу отделаться от ощущения, что в другом месте я мог бы работать более эффективно. Я уверен, что Тант справится с управлением гильдией в мое отсутствие, но всё же сидеть здесь сложа руки, пока мы воюем с Храмом Солнца, испытывает моё терпение. Тебе действительно нужно быстрее справляться со своими обязанностями!"
  "563":
    1: "Когда речь заходит о регнанцах, обычно на ум не приходит выражение «повелители магии». Но я предупреждаю вас: регнанские пираты удерживают свой остров уже много веков. У них было достаточно времени, чтобы как обрести, так и изучить тайные знания. Там живут некоторые могущественные маги. Если вам придётся сразиться с ними, будьте готовы ко всему."
  "564":
    1: "Неверно, что мы, члены Гильдии Некромантов, не уважаем магов других школ. То, что они выбрали пути, ведущие к меньшим силам, — это их личное дело. Этот Ксантор — внушительная фигура для волшебника, не следующего Тёмным Путем. Насколько это возможно, я считаю его советы вполне достойными внимания."
  "565":
    1: "Я узнал, что Тёмные гномы Альвара хранят предмет, который я давно жаждал заполучить, но который может оказаться особенно полезным вам, если вам предстоит путешествовать по стихийным планам. Кольцо планов наделяет своего владельца мощной защитой от разрушительных заклинаний земли, воды, воздуха и огня."
  "566":
    1: "В ходе своих исследований я узнал кое-что об этом «Пространстве между мирами». Пишут, что его обитатели рождаются не обычным образом. Я слышал, что там можно встретить существ, воплощающих энергию кошмарных снов человечества. У меня информации об этом не так много, но я полагаю, что такое существо будет одновременно могущественным и злобным."
  "567":
    1: "Один из основных законов магии заключается в том, что Огонь противостоит Воде, а Воздух — Земле. В рамках этих пар один из элементов имеет слабости по отношению к своему противоположному элементу. Полагаю, что Разрушитель использует этот принцип при сооружении своих тюрем."
  "568":
    1: "Я знаю, что выражаю мнение всей гильдии, когда говорю, что мы в долгу перед вами. Я погашаю этот долг, предоставляя вам и вашим спутникам безопасный проход через все земли, находящиеся под нашим контролем. Ни один член гильдии не похитит вас для проведения магических экспериментов, и ни один из них не будет рассматривать вас в качестве пищи для своих слуг — живых или иных. Этот указ гильдии будет действовать в течение одного года с сегодняшнего дня. И, конечно же, я лично благодарю вас."
  "569":
    1: "Хозяина сейчас нет. Он пошёл посоветоваться с Элгаром Феллмуном в зал заседаний совета. Возможно, вы найдёте его там."
  "570":
    1: "Кристалл, установленный Разрушителем на городской площади, выполняет две функции. Во-первых, если мы не предпримем никаких действий, он уничтожит мир. Во-вторых, он служит вратами в иное измерение существования — «Пространство между мирами» — где, несомненно, находится база Разрушителя. Кристалл призывает в наш мир стихийные силы и притягивает их к себе. Когда эти силы сойдутся здесь, у кристалла, мир будет уничтожен в результате катаклизма. Если мы хотим предотвратить это, кому-то придётся использовать кристалл как врата, чтобы добраться до Разрушителя и либо убедить его прекратить нападение, либо уничтожить его."
  "571":
    1: "Поскольку кристалл настроен на силы стихий, он пропустит только тех, кто сам находится в гармонии с ними. Я полагаю, что можно создать ключ, который имитирует эту гармонию для небольшой группы, такой как ваша. Я могу изготовить ключ, но для этого мне понадобятся компоненты, содержащие чистые стихийные силы. Насколько мне известно, такие компоненты существуют только в одном виде. На каждом из четырёх стихийных планов вы найдёте драгоценные камни, называемые «сердцами стихий». Принесите их мне, и я изготовлю ключ, который откроет кристаллические врата."
  "572":
    1: "Чтобы пройти через хрустальные врата и сразиться с Разрушителем, тебе понадобится ключ, который я должен изготовить! А чтобы изготовить этот ключ, мне нужны драгоценные камни — сердца стихий — из четырёх стихийных миров! Отправляйся и добудь их для меня!"
  "573":
    1: "Я рад, что тебе удалось в некоторой степени добиться успеха в поиске сердец стихий, но того, что у тебя есть, недостаточно. Мне нужно по одному сердцу из каждого из четырёх миров стихий, прежде чем я смогу создать ключ к кристаллическим вратам. Принеси мне остальные сердца, чтобы мы могли продолжить."
  "574":
    1: "Что-то в этом кристалле, похоже, оказывает гипнотическое воздействие на обитателей стихийных миров. Иначе почему бы им вести войну против нашего мира? Я слышал ваши рассказы и другие свидетельства очевидцев. Создается впечатление, будто эти стихии охвачены безумием. И это действительно безумие! Ведь уничтожение Энрота привело бы к мощному дисбалансу между мирами, от которого неминуемо пострадали бы их собственные миры. Вполне возможно, что они сами погибли бы в этом катаклизме. По крайней мере, они рискуют изменить природу своих собственных миров. Я не вижу, как такая перемена могла бы пойти на пользу!"
  "575":
    1: "Тот факт, что повелители стихий заключены в «Плоскости между мирами», многое объясняет. Я задавался вопросом, почему обитатели миров Земли, Воздуха, Воды и Огня стали столь враждебными. Обычно они довольствуются тем, что занимают своё место в иерархии. Полагаю, Разрушителю пришлось вырвать повелителей из их родных миров. Без умиротворяющего присутствия повелителей ему было бы гораздо легче подчинить элементалей, как он и сделал. Вам необходимо освободить повелителей стихий. Они смогут восстановить порядок в своих мирах и предотвратить катаклизм!"
  "576":
    1: "Да, я слышал имя «Эскатон». В легендах многих культур его называют по-разному. Я не знаю, что он из себя представляет, но его цель — уничтожать миры. Да, именно «миры», говорю я. Все больше и больше фактов указывает на то, что Энрот — не единственное место во вселенной, где существует жизнь. Повествования, дошедшие до нас из времен до «Тишины», говорят о многих, живущих среди звёзд. Да, кажется невозможным представить, что кто-то может жить на светиле в небе, но подумайте: эти звёзды могут быть похожи на наше Солнце. Если это так, то почему эти солнца не могут освещать другие места, подобные Энроту? Если бы это было так, то мог бы существовать «разрушитель миров». Я верю, что именно с этим мы и сталкиваемся."
  "577":
    1: "Нет, не думаю, что я уйду, когда Айронфисты продолжат своё путешествие обратно в Энрот. Возможно, через несколько лет я присоединюсь к ним, но пока что меня завораживают эти земли. Хотя он и разрушен, я бы хотел изучить остатки кристаллических ворот. Насколько мне известно, в этом мире никогда не существовало артефакта, обладающего сопоставимой силой. Возможно, я найду какое-то применение кристаллическим осколкам? Неважно. В любом случае, когда Айронфисты уйдут, они уйдут без меня."
  "578":
    1: "Без ложной скромности должен сказать, что «Костёр Паслена» — величайшее творение моих тёмных искусств. Когда его огонь должным образом поддерживается, проклятое солнце не способно проникнуть в зону его действия. Успокаивающая тень ночи навсегда опускается на обширную местность. В пределах этих границ вампиры и другие ночные существа обретают свободу, о которой иначе не могли бы и мечтать. Мы свободны от склепов и не боимся разрушительного дневного света! А теперь Храм Солнца похитил мою добычу. Её нужно вернуть!"
  "579":
    1: "Я — Эскатон Разрушитель, которого также называют «Гибель Дьявола», «Паук в Паутине Врат» и «Разрушение». Есть места, где меня почитают как бога. Но сам я считаю себя лишь слугой своих высших господ. Знайте также, что именно я принёс катаклизм в ваш мир, который должен быть уничтожен. Это гибель, которую вы навлекли на себя сами, не сумев избавиться от дьявола Кригана в своих царствах."
  "580":
    1: "Мои хозяева — те, кто создал меня. Они придали мне форму и функции. Таким образом, я доказал свою неуязвимость. Я уничтожаю миры, заражённые криганами."
  "581":
    1: "В вашем мире говорят о Тишине, которая длится уже тысячу лет и более. Я стар гораздо больше, чем это, а мои господа кажутся мне древними."
  "582":
    1: "Существует гораздо больше миров, чем ваш — их бесчисленное множество. Когда-то эти миры были соединены великой паутиной, по нитям которой можно было перемещаться, словно по мостам через реки. То, что вы называете «Тишиной», ознаменовало разрыв этой паутины, сотканной моими учителями."
  "583":
    1: "Когда-то мои древние хозяева были хранителями миров, число которых превышало количество яблок в бушеле. До появления Криганов — до наступления «Тишины» — это были миры чудес. Мои господа были королями и королевами золотой цивилизации. Меня создали не потому, что я был нужен, а потому, что меня можно было создать — защитником того, что не нуждалось в защите… символом могущества для могущественного народа. Но теперь, на протяжении тысячелетия, креганская чума пожирает великолепие этих миров. И так же пали и мои господа. Они — военачальники и генералы, а я — их величайший воин."
  "584":
    1: "Ваш мир будет уничтожен стихийными силами, которые его создали. Кристалл в центральном городе Джадама заставляет обитателей стихийных миров открывать проходы в ваш мир. Когда их миры соприкоснутся внутри кристалла, произойдёт реакция, которая обрушит неудержимое разрушение на землю, небо и море. Ни одно живое существо не уцелеет."
  "585":
    1: "Катаклизм был вызван, когда я совершил ритуал «Призыв катаклизма», в результате которого появился кристалл. Это оружие крайней необходимости, созданное моими господами для защиты от криганцев. У меня есть и другое оружие. Но когда я узнал о нашествии криганцев на ваш мир, я счел необходимым применить крайнюю силу. Ваш мир настолько пришёл в упадок, что казалось совершенно очевидным: вы не сможете защититься от моих врагов. Хотя я недооценил ваши способности, и криганы в конечном итоге были уничтожены, я по-прежнему считаю, что поступил правильно, проявив излишнюю осторожность."
  "586":
    1: "Мои господа, опасаясь, что криганы найдут способ совратить меня, сделали меня неподкупным. Я не в силах отменить «Созыв Катаклизма», если он уже был произведён. Их приказ — неотъемлемая часть моего существа. Мне не остаётся ничего другого, как подчиниться."
  "587":
    1: "«Созыв Катаклизма», каким бы могущественным он ни был, сам по себе не способен уничтожить мир. Каждый из миров стихий управляется повелителем. Эти повелители способны противостоять принуждению, наложенному на их подчиненных. По этой причине я удалил повелителей из их миров. На данный момент они являются моими «гостями». Как только катаклизм завершится, я верну их, чтобы они могли восстановить ваш мир и свои собственные."
  "588":
    1: "За время, прошедшее после «Тишины», ваш мир утратил знания о происхождении криганов. Вам было достаточно того, что они напоминают мифических демонов, и действительно, «демонами» их называет большинство. На самом деле они пришли из иного мира. До того, как они напали на нас, мои господа ничего о них не знали. Криганы заражают наши миры и распространяются, где только могут. Казалось бы, в бесконечной вселенной они могли бы расширяться в другом направлении, а не в нашем. Но они не сделали такого выбора, поэтому мы должны защищаться от них."
  "589":
    1: "Мне известно, что король и королева Энрота избавили ваш мир от криганов. Тем не менее, ваш мир предстоит уничтожить. Как только меня вызовут, я должен провести Собор. Как только Собор начнётся, он должен продолжаться. Меня вызвали, когда криганы ещё жили в вашем мире. Не имеет значения, что к моменту моего прибытия они уже превратились в прах."
  "590":
    1: "Если бы не криганы и навязанное ими состояние войны, мои господа смогли бы восстановить Паутину Миров и снять то, что вы называете «Тишиной». Мои господа много раз пытались восстановить Паутину, но криганы всегда её разрушали. Теперь они пришли к выводу, что криганов необходимо полностью уничтожить, иначе золотая цивилизация никогда больше не возродится. Именно для достижения этой цели я и был создан."
  "591":
    1: "Насколько я могу это осознать, я поражён тем, что вашему миру удалось избавиться от нашествия криганов. Они гораздо более… развиты, чем вы. Король и королева Энрота, должно быть, стратеги высочайшего уровня. Жаль, что им не удалось завершить свою задачу раньше. Если бы я мог о чем-то сожалеть, то сожалел бы о том, что мне пришлось без необходимости уничтожить ваш мир."
  "592":
    1: "Да, ваш мир действительно нуждается в спасении! Если не остановить катаклизм, он полностью уничтожит его. Перед вами дилемма: я, как виновник катаклизма, знаю, как его остановить. Кроме того, я признаю, что, поскольку в вашем мире больше нет криганцев, его не обязательно уничтожать. Но, будучи слугой своих хозяев, я вынужден позволить катаклизму продолжаться, не раскрывая вам своих знаний. Тем не менее я задам вам несколько вопросов. Возможно, в ответах на них вы найдёте что-то полезное для себя?"
  "593":
    1: "Хотя мне предстоит разрушить ваш мир, всё, что мне нужно было сделать, я уже сделал. Пока катаклизм не достигнет своего апогея, ничто не мешает мне порадовать вас своей беседой. Это не может продолжаться вечно. Ничто не может. Иногда вопросы порождают новые вопросы. Иногда они дают ответы. Интересно, что принесут вам мои вопросы?"
  "594":
    1: "Мои хозяева сделали меня хранителем знаний, но не дозволили делиться ими. И всё же, возможно, мои вопросы помогли вам самим обрести знание? Я задал все вопросы, которые собирался задать. Теперь обдумайте ответы. «Тюрьма» подразумевает заключённого. Кто он? «Внутри» — внутри чего? И «яйцо» — какое именно? Птичье? Или нечто, похожее на яйцо?"
  "595":
    1: "Где за вину расплачиваются годами,\nне вольны уйти, когда захотят,\nа выйдя оттуда, обретают свободу?"
  "596":
    1: "Да. Ваш ответ, похоже, отлично подходит к этой загадке. Возможно, это и есть правильный ответ."
  "597":
    1: "Нет, это совсем не похоже на верный ответ."
  "598":
    1: "Тюрьмы, темницы и камеры бывают разными. Говорят даже о «тюрьмах разума». И всё же в этой загадке, похоже, речь о настоящей тюрьме. А вы как думаете?"
  "599":
    1: "Где вы оказываетесь, войдя в комнату?\nЭто место не может быть снаружи,\nдаже если дверь оставить открытой.\nОтветьте одним словом."
  "600":
    1: "Язык полон причуд. И всё же ваш ответ, похоже, подходит к вопросу."
  "601":
    1: "Пожалуй, такой ответ подошёл бы… Нет, если подумать, он совершенно неверен."
  "602":
    1: "Внутри. Внутри чего? И что там внутри? И раз уж мы задаём вопросы… почему?"
  "603":
    1: "Ларец цвета луны,\nкоторый открывают изнутри,\nхранит сокровище жизни\nцвета солнца.\nЧто это?"
  "604":
    1: "И в самом деле, что ещё это может быть? Если подумать, наверняка найдётся и другой ответ. Но в таких делах лучше доверять самой ясной мысли. Полагаю, ваш ответ может быть верным."
  "605":
    1: "Не понимаю, как это может быть ответом. Правда, не понимаю."
  "606":
    1: "Да, «яйцо». А может быть, «яйца». Это источник жизни, своего рода семя. У яиц необычная форма, которую редко встретишь у других предметов. Обдумайте этот ответ вместе с остальными — возможно, он укажет вам путь."
  "607":
    1: "Полагаю, вы верно разгадали все загадки. Выходит, своими вопросами я всё-таки вам помог. Для меня, с учётом моей природы, этого достаточно. В награду возьмите эту безделушку. У меня их несколько — больше, чем мне нужно. Видите? Я могу отдать её вам, ведь мне неизвестно, знаете ли вы, как ею воспользоваться."
  "608":
    1: "Спасибо, что освободили меня. Теперь я отправляюсь восстанавливать порядок в своём королевстве и сделать всё, что в моих силах, для вашего. Знайте: Шалвенд, Повелитель Воздуха, благосклонен к вам. Прощайте."
  "609":
    1: "«Разрушитель» — вполне подходящее прозвище для того, кто решил заключить меня в такую тюрьму. Если бы не ты, я, Акваландер, Повелитель Воды, вскоре погиб бы. Моя смерть привела бы к нарушению равновесия во всех мирах. Спасибо тебе. А теперь я отправляюсь, чтобы восстановить порядок."
  "610":
    1: "Я свободен! Теперь тот, кто был настолько глуп, что посадил меня в тюрьму — этот Разрушитель — почувствует мой гнев. То, что меня, Повелителя Земли, называют «Гралькор Жестокий», — не случайно. Страдания, которые я перенёс, вернутся к нему многократно!"
  "611":
    1: "Наконец-то я свободен. Мои мучения закончились, но что же будет с моими подданными? Я знаю, что Разрушитель заставляет их выполнять ужасную работу. Моё присутствие успокоит их. Я должен идти. Я должен… прощайте…"
  "612":
    1: "Нет! Кто-то должен остаться здесь, чтобы охранять логово от набегов варваров. Вернитесь, когда поможете моему стаду. Тогда я, возможно, решу присоединиться к вам."
  "613":
    1: "Есть много хищников, которые готовы воспользоваться уязвимостью логова в это трудное время. Я уже прогнал мародеров… и не только их. Вскоре после наводнения сюда заглянул один из патрулей Зога. Я отбился от них, но некоторым удалось сбежать. Уверен, что они вернутся в ещё большем количестве."
  "614":
    1: "У меня больше нет провианта, который я мог бы вам дать. Если вам нужно ещё, вам придётся найти еду где-нибудь в другом месте."
  "615":
    1: "Учитывая ущерб, нанесённый гигантскими волнами, обвалом камней и набегом пиратов, я не знаю, вернётся ли наша деревня когда-нибудь в прежнее состояние. Я знаю, что вы многое сделали для нас, но не всё можно исправить, если оно уже разрушено. Я не уверен, что нам делать. Возможно, мы восстановим деревню, а может быть, уедем. Всё решит время и обстоятельства."
  "616":
    1: "Отлично поступили, разобравшись с этими пиратами. Теперь, когда их больше нет, возможно, вождь Одноклык и его люди смогут начать жизнь с нуля. То, что здесь произошло, — это настоящая трагедия."
  "617":
    1: "К сожалению, караван оказался одним из первых объектов, которые пираты разграбили во время своих набегов. Понятия не имею, что они собираются делать с тремя сотнями ящиков тоберских фруктов! Конечно, я скучаю по этим фруктам, но хуже всего то, что они повредили повозки. Похоже, мне придётся остаться здесь как минимум на следующий сезон, чтобы следить за их ремонтом. Я только надеюсь, что работа будет завершена до следующего урожая тоберска, чтобы я смог получить хоть какую-то отдачу от этого убыточного предприятия."
  "618":
    1: "Вы действительно зарабатываете право на получение награды за этот месяц, но пока не набрали необходимого количества убийств!"
  "619":
    1: "Жёлтая лихорадка — очень тяжелое заболевание, которое вспыхивает каждые несколько лет.\nОбычно мы заказываем лекарства с материка, но теперь, когда мосты разрушены, никто не может добраться до причалов!"
  "620":
    1: "Вот, возьми эти свитки «Исцеление от болезни».\nМожет быть, нам удастся хотя бы предотвратить эпидемию!\nШесть хижин на внешних островах заражены.\nЕсли отремонтировать телепорты между островами, ты сможешь отнести эти свитки в хижины.\nК сожалению, в своих путешествиях тебе придётся найти ещё три свитка."
  "621":
    1: "Эпидемия желтой лихорадки закончилась!\nСпасибо за вашу помощь!"
  "622":
    1: "Я слышал, что среди людей снова распространяется желтая лихорадка.\nОбычно основным источником этой болезни здесь, на главном острове, является водопровод.\nРаньше, когда вспыхивала эпидемия, мы получали зелье из освящённой травы с материка.\nОднако без доступа к причалу мы не можем достать это необходимое лекарство.\nЕсли вам удастся добраться до материка, возможно, у контрабандистов из Равеншора найдётся это лекарство.\nЕсли вам удастся раздобыть «Помазанное зелье», вернитесь ко мне с ним!"
  "623":
    1: "Спасибо!\nПойду-ка я расскажу об этом в службу водоснабжения!"
  "624":
    1: "Может быть, ты сможешь принести мне основные ингредиенты для зелья «Чистая скорость»?\nС их помощью я смогу приготовить это невероятное зелье и завершить своё обучение алхимии!\nЯ щедро вознагражу тебя за помощь!"
  "625":
    1: "Гильдия охотников за головами служит обществу, выплачивая достойным людям награду за устранение опасных существ и разбойников в Джадаме.\nЧтобы получить звание начинающего охотника за головами, заработайте на заданиях 10 000 золотых."
  "626":
    1: "Ингредиенты!\nСпасибо!\nПримите это в качестве награды!"
  "627":
    1: "Думаю, я знаю, как остановить разрушительную силу огненной горы!\nЯ нашел древнее заклинание, которое должно дать мне силу отправить огненную гору обратно в море! Чтобы завершить заклинание, мне нужна древняя реликвия под названием «Идол Змеи».\nС помощью этого могущественного предмета я смогу завершить заклинание."
  "628":
    1: "Спасибо, что вернулся с Идолом.\nПри более тщательном изучении я обнаружил, что всё заклинание оказалось бесполезным.\nТем не менее, это не твоя вина, и ты заслуживаешь награду за то, что вернулся ко мне!"
  "629":
    1: "Стаи ужасных волков, бродящие по этим краям, представляют угрозу для путешественников и торговли.\nКупцы из Альвара поручили мне нанять опытных людей, чтобы те выследили этих волков и, как они выразились, «проредили стаю».\nВы выглядите как опытные искатели приключений!\nЯ щедро вознагражу вас, если вы сможете уничтожить всю стаю и всех, кто находится в их логове."
  "630":
    1: "Я плачу 250 золотых за каждую неповрежденную шкуру гигантского волка, которую ты мне принесешь."
  "631":
    1: "Стая уничтожена? Отлично!\nКонечно, мне придётся найти себе новое занятие.\nСпасибо за ваши усилия.\nПожалуйста, примите эту награду."
  "632":
    1: "Купцы из Альвара взяли мою семью под то, что они назвали «защитным арестом», и используют это как средство, чтобы обеспечить себе мои услуги. Однако когда караван с моей семьёй возвращался в Альвар, на него напали огры и разбойники.\nОгр по имени Зог похитил мою семью!\nОн увез их в свою крепость в регионе Альвар.\nТеперь я должен шпионить за «Торговцами Альвара» в его интересах.\nПока я это делаю, моя семья жива.\nЕсли я перестану, они умрут.\nСможешь ли ты спасти их для меня?"
  "633":
    1: "Я периодически отправляю отчёты о деятельности «Торговцев Альвара» Грозному пирату Стэнли в таверну «Пиратский приют» на острове Регна. Теперь, когда «Торговцы» «договорились» о моей помощи, нам нужно передать поддельные отчёты, чтобы Стэнли ничего не заподозрил.\nОтнеси этот отчёт ему в Харексбург на острове Регна!"
  "634":
    1: "Ты передал отчёт Стэнли?\nЭто, по крайней мере, даст нам немного времени, прежде чем он начнёт подозревать что-то неладное в деятельности здесь, в Равеншоре, и в действиях купцов в Альваре."
  "635":
    1: "Я слышал, что вы ищете зелье из освящённой травы, чтобы очистить водопровод.\nКонтрабандисты Джадама торгуют самыми разными странными товарами.\nЕсли кто-то и знает об этом зелье или располагает им, то только они!"
  "636":
    1: "Тёмные эльфы Альвара хорошо платят за кожу, изготовленную из шкур нагов. После соответствующей обработки и дубления шкуры нагов могут прослужить почти дольше, чем проживет сам тёмный эльф!"
  "637":
    1: "Я заплачу вам 500 золотых за каждую принесённую шкуру наги."
  "638":
    1: "Много десятилетий назад легендарный Жрец Солнца Камиен Трайс возглавил крестовый поход против Гильдии некромантов в Шэдоуспайре.\nГильдии удалось разгромить войска Трайса с помощью вампиров, также обитающих в регионе Шэдоуспайра.\nКамиен Трайс взял с собой в бой священнический артефакт под названием «Затмение».\nЩит был утрачен, когда Трайс был сражен Носферату в финальной битве."
  "639":
    1: "Ты вернул щит, Эклипс?\nХрам благодарен тебе за помощь в возвращении этого могущественного артефакта.\nПожалуйста, продолжай нести щит с нашим благословением."
  "640":
    1: "Вы спасли мою семью?\nЯ не могу гарантировать, что буду и дальше оказывать свои услуги, если они не будут в безопасности!"
  "643":
    1: "Войска мага-огра Зога вторглись в эти края как раз в тот момент, когда яркая вспышка пронеслась по ночному небу.\nОни нападают и даже убивают путешественников, стремящихся добраться до города Альвар. Вы окажете Альвару огромную услугу, если уничтожите всех огров, нападающих на дорогах, ведущих в Альвар, а также огров в крепости недалеко от города Альвар.\nВернитесь ко мне, когда убьёте всех огров в этом регионе, и я вознагражу вас."
  "644":
    1: "Ты ещё не победил всех огров!\nДо тех пор, пока они не будут уничтожены, дороги не станут безопасными!"
  "645":
    1: "Отлично!\nТеперь, когда огры изгнаны с дорог и больше не обитают в крепости, дороги, ведущие в Равеншор, Железные Пески и Мурмурвуд, снова безопасны!\nПожалуйста, примите эти 5000 золотых в качестве награды!"
  "646":
    1: "Зелье чистой удачи стало бы отличным подспорьем для любого торговца.\nЕсли удача будет на высоте, можно наткнуться на множество выгодных сделок!\nПринесите мне основные ингредиенты для зелья чистой удачи, и я щедро вас вознагражу!"
  "647":
    1: "Приветствую, начинающий охотник за головами! Гильдия охотников за головами служит обществу, выплачивая достойным людям награду за устранение опасных существ и разбойников в Джадаме.\nЧтобы получить звание подмастерья, заработай на заданиях в общей сложности 30 000 золотых."
  "648":
    1: "Отлично!\nТеперь я смогу сварить ещё одно зелье чистой удачи.\nВозьми это зелье в качестве награды!"
  "649":
    1: "Жала ос!\nОт средств от простуды до травяных чаев — даже небольшое количество измельченного жала осы дает потрясающий эффект!\nНе доверяйте тем, кто продаёт этот слабый измельчённый рог виверны!\nЕсли вы хотите самое лучшее, подойдёт только жало осы!\nЯ заплачу вам за каждое жало, которое вы мне принесёте!"
  "650":
    1: "Я плачу 500 золотых за каждое жало осы, которое ты мне принесешь!"
  "651":
    1: "Тролли от природы боятся огня!\nМногие из нас погибли, когда открылись Огненные врата и из них хлынуло озеро огня! Без надлежащей защиты мы ничего не могли поделать."
  "652":
    1: "Выжившим в этом регионе нужны зелья сопротивления огню!\nС их помощью мы сможем продержаться, пока не найдём место, куда можно будет перебраться!\nВозьмите эти зелья!\nК сожалению, это всё, что у меня есть!\nДоставьте их в шесть самых южных домов, которые ещё стоят в деревне Раст!"
  "653":
    1: "Вы не доставили зелья огнестойкости во все дома!\nЕсли озеро огня увеличится в размерах, все погибнут!"
  "654":
    1: "Вы, по крайней мере, отсрочили нашу гибель на некоторое время, но нам нужно найти новый дом!\nСпасибо, что доставили зелья огнестойкости!"
  "655":
    1: "Выносливость.\nТа способность, которая позволяет воину оставаться на ногах или мягко уносит его, когда он погружается в бессознательное состояние.\nЗелье чистой выносливости может повысить способность человека выдерживать урон до легендарного уровня!\nПринесите мне основные ингредиенты для зелья чистой выносливости, и я щедро вас вознагражу."
  "656":
    1: "Приветствую, подмастерье-охотник за головами! Гильдия охотников за головами служит обществу, выплачивая достойным людям награду за устранение опасных существ и разбойников в Джадаме.\nЧтобы получить звание мастера, заработай на заданиях в общей сложности 70 000 золотых."
  "657":
    1: "Ты принёс мне ингредиенты, как я и просил!\nЯ тебе действительно благодарен.\nВозьми это зелье в качестве награды."
  "658":
    1: "Цветок «Драконобой» имеет множество лечебных свойств.\nОднако у него есть и применения, не связанные с медициной.\nИз этого цветка можно извлечь яд, смертельный для драконов.\nС его помощью мы сможем быстро расправиться с драконьей нечистью, заполонившей этот регион.\nНайди этот цветок и вернись ко мне с ним.\nМоя награда тебя не разочарует."
  "659":
    1: "Я просил принести цветок «Убийца драконов», а ты вернулся с пустыми руками.\nЗачем ты тратишь моё время?"
  "660":
    1: "Да, это действительно цветок «Драконобой».\nКак только мы извлечём яд, мы истребим всю популяцию драконов!"
  "661":
    1: "Цветок «Драконобой» имеет множество лечебных свойств.\nОднако у него есть и некоторые применения, не связанные с медициной.\nИз этого цветка изготавливают яд, смертельный для драконов, но противоядие от этого яда также содержится в его лепестках. Найди этот цветок и принеси его мне.\nМоя награда тебя не разочарует."
  "662":
    1: "Я просил принести цветок «Убийца драконов», а ты вернулся с пустыми руками.\nЗачем ты тратишь моё время?"
  "663":
    1: "Да, это действительно цветок «Драконобой».\nКак только мы проглотим лепестки, мы будем защищены от яда, который охотники на драконов могут использовать против нас."
  "664":
    1: "Хочешь заслужить расположение Чарльза Кихота?\nПомоги нам в походе против драконов ущелья Гарроты. Если перебить всех драконов в этой местности и в Драконьих пещерах, Чарльз Кихот обязательно о тебе услышит! Вернись ко мне, когда все они будут мертвы.\nЯ щедро тебя вознагражу."
  "665":
    1: "Ты уничтожил вредителей!\nВот награда, которую я тебе обещал!\nКроме того, я лично отдам должное твоей помощи Чарльзу Кихоту!"
  "666":
    1: "Ты хочешь заслужить благосклонность Дефтклоу Редревера?\nРазве не все мы этого хотим?\nЕсли бы ты убил всех охотников на драконов в дикой местности ущелья Гарроты, я обязательно рассказал бы ему о тебе.\nКроме того, я смог бы предложить тебе щедрую награду!"
  "667":
    1: "Проклятые драконоборцы Чарльза Кихота погибли? Замечательно!\nТеперь мы снова сможем без страха наслаждаться покоем ущелья Гарроты.\nВот обещанная награда!\nЯ немедленно расскажу Дефтклоу Редреверу о твоей доблести!"
  "668":
    1: "Чтобы когда-нибудь победить драконов в этом регионе, нам необходимо вернуть «Барабан Победы».\nЕсли ты вернёшь этот барабан, я щедро вознагражу тебя!"
  "669":
    1: "Барабан Победы привёз сюда Чарльз Кихот.\nЕго оглушительный грохот вселяет ужас в сердце любого дракона.\nК сожалению, барабан был утрачен в сражении с нагами, когда Чарльз Кихот пытался основать крепость здесь, в ущелье Гарроты."
  "670":
    1: "Вы вернулись с Барабаном Победы!\nЧарльз будет благодарен за его возвращение!\nВот обещанная вам награда."
  "671":
    1: "На протяжении многих лет Гильдия некромантов ведет поиски «Кости Рока».\nЭтот могущественный артефакт принес бы им огромную пользу, если бы его удалось найти.\nЕсли ты найдешь этот предмет и принесешь его мне, тебя ждет награда, превосходящая твои самые смелые мечты."
  "672":
    1: "В почти забытые времена могущественный некромант Захария едва не подчинил себе весь Джадам.\nОн в совершенстве владел некромантией и магией стихий и обладал неестественно сильной тягой к Тьме. Легионы нежити помогли ему поработить все народы, включая тёмных эльфов Альвара.\nХрам Солнца разработал план победы над Захарией.\nОбъединив силу всех жрецов Храма, они выковали меч Солкрист.\nПатриарх Храма повёл легионы Солнца против войск Захарии.\nСражения бушевали годами, пока войска Храма Солнца не подошли к подножию ужасной Шэдоуспайра.\nТам Патриарх вступил в единоборство с Захарией. В конце поединка оба лежали мёртвыми.\nПатриарх отсёк левую руку Захарии в тот самый миг, когда последнее заклинание некроманта остановило его сердце.\nСила Солкриста мгновенно убила Захарию.\nВ последовавшем хаосе Солкрист навсегда исчез, как и отсечённая рука некроманта.\nЕё кость настолько пропиталась Тёмной магией, что получила название Кость Рока."
  "673":
    1: "Ах, Кость Рока!\nЛегенда о Захарии будет жить!\nВот твоя награда!"
  "674":
    1: "Некоторые говорят, что шкатулка-головоломка Изелдира проклята и постепенно сводит владельца с ума.\nНе может быть!\nМои исследования убедительно доказали, что это лучшая игра во всём Джадаме, в отличие от нелепой карточной игры «Аркомаг».\nПоследней известной владелицей шкатулки была Зантора, известная также как Безумная некромантка из Шэдоуспайра."
  "675":
    1: "Я просил тебя найти «Коробку-головоломку», а ты вернулся с пустыми руками.\nПоэтому награды тебе не будет.\nВернись с коробкой!"
  "676":
    1: "Эта головоломка — моя!\nМеня ждут часы беззаботного удовольствия!\nВот, возьми свою награду — она ничто по сравнению с этой коробкой!"
  "677":
    1: "Величайшая способность некроманта — это его интеллект!\nБез достаточного уровня интеллекта некромант может остаться без очков заклинаний именно тогда, когда они ему нужны больше всего! Если ты принесешь мне основные ингредиенты для зелья «Чистый интеллект», я вознагражу тебя зельем, которое сам приготовлю!"
  "678":
    1: "Приветствуем вас, мастер-охотник за головами! Гильдия охотников за головами благодарит вас за ваши заслуги перед всем Джадамом. Мы к вашим услугам!"
  "679":
    1: "Ты вернулся с ингредиентами, выполнив свою часть сделки.\nВот твоё зелье «Чистый интеллект»."
  "680":
    1: "Мы стремимся успокоить душу носферату по имени Корбу.\nДо нас дошли слухи, что вампиры из Шэдоуспайра намерены воскресить это древнее зло.\nВ вампирском склепе в окрестностях Шэдоуспайра спрятана ампула с землёй из могилы, которая играет ключевую роль в воскрешении Корбу.\nНайдите эту ампулу и верните её нам.\nМы будем вечно вам благодарны и щедро вознаградим вас."
  "681":
    1: "Корбу разбросал флаконы с землёй из своей первоначальной могилы, чтобы обезопасить себя.\nТаким образом он всегда мог получить доступ к этой земле и переместить свою гробницу, если в этом возникнет необходимость."
  "682":
    1: "Ах, как только мы совершим обряды очищения над этой землёй, Корбу обретёт вечный покой.\nМы в долгу перед тобой, и вот твоя награда, как и было обещано!"
  "683":
    1: "Личность — самая настоящая сила священника.\nЕсли вы предоставите мне основные ингредиенты для зелья «Чистая личность», я с удовольствием приготовлю его для вас!\nПринесите мне ингредиенты!"
  "684":
    1: "У вас отсутствуют все или некоторые из необходимых ингредиентов.\nВернитесь, когда у вас будут все ингредиенты."
  "685":
    1: "Ах, ты узнал рецепт или тебе просто очень повезло!\nВот и твое зелье!"
  "686":
    1: "Виверны — одни из самых сильных существ континента Джадам.\nДревняя виверна способна одним ударом убить даже самого могучего искателя приключений.\nГоворят, её рог обладает множеством целебных и магических свойств.\nМногие готовы хорошо заплатить за измельчённый рог виверны."
  "687":
    1: "Я куплю у тебя рога виверн по 1500 золотых!\nЯ измельчаю их и продаю по всему Джадаму.\nНадеюсь, когда-нибудь я смогу отправлять их морем в Энрот и Эратию.\nРазумеется, для этого нужно сначала решить проблему с пиратами Регны!"
  "688":
    1: "1500 золотых!"
  "689":
    1: "Точность может решить, кто выживет, а кто погибнет в бою.\nЕсли ты не сможешь поразить противника, тебе неминуемо грозит гибель!\nЕсли ты принесешь мне ингредиенты для зелья «Чистая точность», я приготовлю его для тебя."
  "690":
    1: "Вы не нашли сокровища Грозного пирата Стэнли!"
  "691":
    1: "Ах, правильные ингредиенты всегда помогают! Вот ваше зелье."
  "692":
    1: "Ходят слухи, что легендарный пират Стэнли похитил сотни и тысячи золотых монет у купцов из Альвара.\nНикто так и не смог обнаружить, где он спрятал своё сокровище.\nНекоторые утверждают, что оно даже не спрятано на острове Регна."
  "693":
    1: "Я помню, как много-много лет назад слышал, что Стэнли отправился в Блуждающий Разор, чтобы поговорить с магом-огром Зогом о проклятии, обрушившемся на него.\nСудя по всему, его память слабела, и он был уверен, что в этом виноват злой маг."
  "694":
    1: "Тот, кто найдет сокровище Грозного пирата Стэнли, станет богачом!\nМожет быть, это будешь именно ты?"
  "695":
    1: "Плоды тоберска произрастают исключительно в на островах Кинжальной Раны.\nЗдесь мягкие зимы и влажные лета создают идеальные условия для того, чтобы плоды тоберска достигли необходимого содержания сахара и сока.\nМастера по переработке мякоти в Равеншоре платят за плоды тоберска хорошие деньги."
  "696":
    1: "Тоберский бренди — любимый напиток ящеров с Островов Кинжальной Раны.\nНекоторые считают, что к нему нужно привыкнуть.\nКак ни крути, это чистая прибыль!"
  "697":
    1: "Плоды тоберска перерабатываются в Равеншоре в тоберскую мякоть.\nИменно из этой мякоти мастера-дистилляторы в Альваре производят тоберский бренди."
  "698":
    1: "Здесь мягкие зимы и влажные лета создают идеальные условия для того, чтобы плоды тоберска достигли необходимого содержания сахара и сока.\nЗдесь вы можете приобрести плоды тоберска, чтобы наши мастера по производству мякоти могли тщательно обработать их и превратить в тоберскую мякоть."
  "699":
    1: "Тоберский бренди — любимый напиток ящеров с Островов Кинжальной Раны.\nНекоторые считают, что к нему нужно привыкнуть.\nКак бы там ни было, это чистая прибыль!\nБудьте осторожны с бутылками на обратном пути."
  "700":
    1: "Тоберская мякоть смешивается с водой из реки Альвар и постепенно перегоняется до тех пор, пока мастера-пивовары не признают напиток готовым к употреблению."
  "701":
    1: "Ядровую древесину Джадама используют вампиры региона Шэдоуспайр при изготовлении своих гробов.\nПрочность сердцевины обеспечивает владельцу гроба многолетний покой в дневное время."
  "702":
    1: "Вяленая рыба-солнечник — деликатес, которым лакомятся высшие жрецы Храма Солнца.\nОни хорошо платят за поставки этой рыбы с рассыпчатым мясом и слегка солёным вкусом."
  "703":
    1: "Пираты Регны обожают яркие украшения!\nАмулеты, на которые не действуют заклинания некромантов из Шэдоуспайра, вполне удовлетворяют эту потребность.\nПираты тратят часть своей «с трудом заработанной» добычи на приобретение этих амулетов."
  "704":
    1: "Вампиры Шэдоуспайра используют ядровую древесину Джадама для изготовления гробов.\nБлагодаря её прочности хозяин гроба может долгие годы спокойно отдыхать днём."
  "705":
    1: "Вяленая рыба-солнечник — деликатес, которым лакомятся высшие жрецы Храма Солнца.\nОни хорошо платят за поставки этой рыбы с рассыпчатым мясом и слегка солёным вкусом."
  "706":
    1: "Пираты Регны обожают яркие украшения!\nАмулеты, на которые не действуют заклинания некромантов из Шэдоуспайра, вполне удовлетворяют эту потребность.\nПираты тратят часть своей «с трудом заработанной» добычи на приобретение этих амулетов."
  "707":
    1: "Приобретите Серебряную морскую пыль, изготовленную некромантами Шэдоуспайра. Контрабандисты Равеншора используют её, чтобы скрывать свои лодки.\nОна наделяет лодки ограниченной невидимостью."
  "708":
    1: "Сообщается, что рог земного виверна является одним из самых мощных реагентов, используемых некромантами из Шэдоуспайра.\nВ отличие от реагентов, применяемых алхимиками, этим реагентом пользуются только члены Гильдии некромантов самого высокого ранга."
  "709":
    1: "Эти поддельные кредитные ваучеры используются агентами мага-огра Зога для получения золота у торговцев Альвара."
  "710":
    1: "Приобретите Серебряную морскую пыль, изготовленную некромантами Шэдоуспайра. Контрабандисты Равеншора используют её, чтобы скрывать свои лодки.\nОна наделяет лодки ограниченной невидимостью."
  "711":
    1: "Сообщается, что рог земного виверна является одним из самых мощных реагентов, используемых некромантами из Шэдоуспайра.\nВ отличие от реагентов, применяемых алхимиками, этим реагентом пользуются только высшие члены Гильдии некромантов."
  "712":
    1: "Эти поддельные кредитные ваучеры используются агентами мага-огра Зога для получения золота у торговцев Альвара."
  "713":
    1: "Пустая бочка"
  "714":
    1: "+2 к силе (постоянный эффект)"
  "715":
    1: "+2 к меткости (постоянный эффект)"
  "716":
    1: "+2 к харизме (постоянный эффект)"
  "717":
    1: "+2 к интеллекту (постоянный эффект)"
  "718":
    1: "+2 к выносливости (постоянный эффект)"
  "719":
    1: "+2 к скорости (постоянный эффект)"
  "720":
    1: "+2 к удаче (постоянный эффект)"
  "721":
    1: "Пустой котёл"
  "722":
    1: "+2 к сопротивлению огню (постоянный эффект)"
  "723":
    1: "+2 к сопротивлению воде (постоянный эффект)"
  "724":
    1: "+2 к сопротивлению воздуху (постоянный эффект)"
  "725":
    1: "+2 к сопротивлению земле (постоянный эффект)"
  "726":
    1: "Болезнь!"
  "727":
    1: "Здесь ничего нет"
  "728":
    1: "Отравлен!"
  "729":
    1: "Вы проиграли игру!"
  "730":
    1: "Вы проиграли состязание!"
  "731":
    1: "Вы не прошли тест!"
  "732":
    1: "Ты не справился с испытанием!"
  "733":
    1: "Вы уже победили!"
  "734":
    1: "Ты победил!\n+3 очка навыков"
  "735":
    1: "Ты победил!\n+5 очков навыков"
  "736":
    1: "Ты победил!\n+7 очков навыков"
  "737":
    1: "Ты победил!\n+10 очков навыков"
  "738":
    1: "Пьяный!"
  "739":
    1: "Пустая бочка"
  "740":
    1: "У тебя не хватает золота!"
  "741":
    1: "Спасибо за лекарство, но другие жители этого района всё ещё болеют!\nОбязательно доставьте лекарство и им тоже!"
  "742":
    1: "Я очень болен, и без свитка «Исцеление от болезни» я наверняка умру от желтой лихорадки!"
  "743":
    1: "Спасибо за лекарство! Обязательно передайте свитки тем, кто до сих пор страдает от желтой лихорадки."
  "744":
    1: "Эпидемия продолжается! Жители отдаленных островов погибнут!"
  "745":
    1: "Без зелья из «Помазанной травы» мы не сможем очистить нашу воду от яда!"
  "746":
    1: "Где идол?\nНе тратьте моё время, если у вас его нет!"
  "747":
    1: "Черные зелья изготавливаются из сложной смеси многих из трех основных алхимических реагентов. К красным реагентам относятся ягоды «Вдовий ветер», «Волчий глаз» и флаконы с кровью Гога.\nК синим реагентам относятся перо феникса, корень фимы, осколок метеорита и сердце блуждающего огника.\nА к желтым реагентам относятся дурман, клык драконьей черепахи, стручки мака и колючая кора."
  "748":
    1: "Ты отремонтировал Каменные Порталы?\nЭто потрясающая новость!\nСкорее, найди моего брата Истрика и скажи ему, чтобы он возвращался домой!"
  "749":
    1: "Ты нашёл Истрика и рассказал ему, как вернуться домой?\nМы действительно в долгу перед тобой, купец из Альвара!\nЯ хорошо отзовусь о тебе перед вождем клана Брекишем Одноклыком.\nПожалуйста, возьми эти зелья «Исцеление ран» в качестве награды."
  "750":
    1: "Вы нашли «Пророчества Змея»!\nВозможно, в этих писаниях можно найти подробности о нашем будущем!\nПримите, пожалуйста, эту награду за вашу помощь!"
  "751":
    1: "Мой брат Рохтнакс жив!\nИ ты восстановил Каменные Порталы?\nЯ должен вернуться домой к нему, чтобы мы могли спланировать спасение нашей семьи!"
  "752":
    1: "Ещё раз спасибо за то, что помогли мне вернуться к моей семье! Вождь клана узнает о вашей помощи!"
  "753":
    1: "Вы уничтожили всех ужасных волков в этом регионе!\nПутешественники снова в безопасности. Однако теперь мне нужно найти себе новое занятие!"
  "754":
    1: "У тебя больше нет шкур, вернись, когда у тебя их снова появится!"
  "755":
    1: "Моя семья вернулась и рассказала мне, как ты их спас.\nПередавай купцам из Альвара, что им больше не нужно полагаться на нашу «сделку».\nЯ сдержу своё слово, данное им и тебе: мои корабли всегда будут к твоим услугам!"
  "756":
    1: "У тебя нет шкур нага!\nТы тратишь моё время!"
  "757":
    1: "Где Эклипс?\nВернись ко мне, когда найдешь щит!"
  "758":
    1: "Я плачу 500 золотых за уши огра.\nТорговая гильдия Альвара готова выделить мне средства на выплату этой награды любому, кто сможет убить огра."
  "759":
    1: "Вернись ко мне с ушами огра, если хочешь получить деньги!"
  "760":
    1: "Я плачу только за жала ос!\nНи за что другое!"
  "761":
    1: "Спасибо за зелье, но другие жители этой местности остались без защиты!\nОбязательно передайте зелье и им!"
  "762":
    1: "Я беспомощен перед натиском огненного моря!\nМне нужно зелье, дающее сопротивляемость огню!"
  "763":
    1: "Спасибо за зелье!"
  "764":
    1: "Спасибо, что снабдили самые южные дома здесь, в Расте, зельями сопротивления огню.\nВозможно, нам удастся продержаться, пока для нас не найдут новый дом!"
  "765":
    1: "Вернись, когда у тебя будет больше рогов виверны, и я заплачу тебе больше!"
  "766":
    1: "Королевское осёное желе — настоящий деликатес!\nПредставители высшего сословия купцов наслаждаются этим вкусным лакомством практически при каждом приёме пищи!"
  "767":
    1: "Я заплачу 1000 золотых за королевский осный сок!"
  "769":
    1: "Вернись, когда у тебя будет желе из ос, и тогда я тебе заплачу!"
  "770":
    1: "По всей местности разбросаны испытания.\nЕсли ваши способности достаточно высоки и вы справитесь с испытанием, вы получите очки навыков, которыми сможете распоряжаться по своему усмотрению!"
  "771":
    1: "Драконы ущелья Гарроты уязвимы к яду, который можно получить из редкого цветка драконобоя.\nЭтот же цветок — единственный источник противоядия для драконов."
  "772":
    1: "Теперь, когда все драконы в дикой местности повержены, мы можем отправиться к Драконьей пещере и раз и навсегда покончить с ними!\nЕщё раз спасибо, что помогли нам их одолеть."
  "773":
    1: "Теперь, когда все охотники на драконов в дикой местности повержены, мы можем атаковать их лагерь и раз и навсегда покончить с ними!\nЕщё раз спасибо, что помогли нам их одолеть."
  "774":
    1: "Вернись, когда у тебя будет «Барабан Победы».\nИначе ты зря тратишь и своё время, и моё!"
  "775":
    1: "Я прошу «Кость», а ты возвращаешься с пустыми руками. Убирайся!"
  "776":
    1: "Мне не нужно будет видеться с тобой, пока ты не найдешь «Коробку-головоломку»!"
  "777":
    1: "Ты тут новичок, да?\nПередай Ариону Хантеру, что от его сброда я жду большего, чем от таких, как ты!\nОтдай мне отчёты и убирайся с глаз долой!\nМне от тебя тошно!"
  "778":
    1: "Вы не накопили достаточно наград, чтобы мы могли повысить вас в звании!"
  "779":
    1: "В настоящее время вы имеете звание «Начинающий охотник за головами», но у вас недостаточно наград, чтобы получить повышение до звания «Подмастерье»."
  "780":
    1: "В настоящее время вы имеете звание «Опытного охотника за головами», но у вас недостаточно наград, чтобы получить звание «Мастера»."
  "781":
    1: "В настоящее время ты имеешь звание «Мастер-охотник за головами»! Это высшее звание в нашем гильдии."
  "782":
    1: "Отношения между Гильдией некромантов и Храмом Солнца, стоящими на противоположных сторонах между Светом и Тьмой, никогда не были хорошими, но теперь они перешли к открытой войне. Оскар Тайр, главный жрец Храма, утверждает, что святое видение велело ему избавить Джадам от пятна Тьмы. Обе стороны появились на нашем континенте сравнительно недавно. Гильдия обосновалась в Шэдоуспайре, а первый и единственный храм Солнца в Джадаме находится в Мурмурвуде."
  "783":
    1: "Благодаря тому, что вы передали Жаровню Ночной Тени в их руки, Гильдия некромантов одержала верх в войне с Храмом Солнца. Магия этого артефакта создаёт постоянную тень тьмы, окутывающую регион Шэдоуспайр. Под этим прикрытием вампиры защищают эти земли днём и ночью. Это позволило гильдии выставить против армий Храма Солнца более многочисленные отряды скелетов, зомби и других нежити. Каждое поступающее ко мне сообщение свидетельствует о том, что центр сражения всё ближе и ближе подступает к порогу Храма Солнца."
  "784":
    1: "Поскольку вы уничтожили «Преобразователь скелетов» Гильдии некромантов, Храм Солнца одержал верх в войне с гильдией. Скелеты, созданные этим устройством, составляли основную часть подкрепления гильдии. Без них войска некромантов рушатся перед наступлением Храма. Каждое поступающее ко мне сообщение свидетельствует о том, что центр сражения всё ближе подступает к порогу Гильдии некромантов."
  "785":
    1: "Известный драконоборец Чарльз Кихот из Эратии организовал охотничью экспедицию в ущелье Гарроты. Это вовсе не сафари, а крупнейшая операция такого рода, о которой я слышал. У охотников есть постоянная база, где они продают шкуры, яйца, дракончат и другие товары. В ущелье Гарроты всегда обитало много драконов, но теперь им грозит вымирание — настолько эффективны охотники Кихота."
  "786":
    1: "Охотники Чарльза Кихота почти полностью истребили драконов ущелья Гарроты. Уверен, как только они закончат, путешествовать по этим горам станет безопаснее. И всё же мне интересно, каким станет Джадам без драконов."
  "787":
    1: "Спасая для Дефтклоу Редревера его наследника, вы дали ему возможность беспрепятственно атаковать лагерь Чарльза Кихота. Охотники на драконов действуют так: они изолируют отдельных членов своей добычи. Они просто не готовы сражаться с драконами, когда те собираются в большие отряды! Само собой, производство товаров из драконьих частей в лагере сократилось до минимума. Жаль. Раньше гильдия неплохо на этом зарабатывала."
  "788":
    1: "Минотавры Логова Бальтазара в Блуждающем Разоре — гордый народ. Недавняя победа над ледяными гигантами Вори лишь укрепила их стремление к независимости и уверенность в том, что они способны самостоятельно справиться с любой задачей. Тем не менее я сообщил гильдии, что они станут отличными союзниками и в нынешнем кризисе, и позднее — как торговые партнёры."
  "789":
    1: "Спасая минотавров из логова Бальтазара, вы завоевали их расположение и, соответственно, расположение нашего гильдии. Даже в условиях кризиса торговые отношения с ними значительно улучшились. Как только будут решены проблемы, связанные с катаклизмом, я уверен, что мы получим солидную прибыль — прямой результат вашей отличной работы."
  "790":
    1: "Кто знает, какова сейчас судьба Джадама.\nВозможно, тебе удастся спасти нас от гибели?"
  "791":
    1: "Джадам перед тобой в неоплатном долгу!\nТы спас весь мир от полного уничтожения!"
  "792":
    1: "Поскольку мосты были разрушены из-за извержения Огненной горы, мы не можем добраться до пристани!\nМы оказались отрезанными от материка!"
  "793":
    1: "Ты восстановил Каменные порталы?\nМы все в долгу перед тобой.\nЕсли бы только можно было безопасно пройти через Заброшенный храм!\nНу, по крайней мере, мы можем попробовать пройти оттуда к пристани."
  "794":
    1: "Раньше у нас была целая серия мостов, соединявших небольшие острова этого региона, и один большой мост, ведущий на материк.\nВулкан уничтожил их все.\nТеперь мы не можем никуда добраться, кроме как на лодке, но мы даже не можем добраться до нашего причала!"
  "795":
    1: "Знаете ли вы, что я пробыл в их плену более шести лет? Сначала я думал, что они — демоны из ада, но теперь я в этом не так уверен. Они, конечно, выглядели как демоны, но вели себя не как демоны. Нет, я думаю, что они были просто другой разновидностью чудовищной расы, вроде огров или гоблинов. В любом случае, демоны они или нет, я рад, что мир от них избавился!"
  "796":
    1: "Мы с Кэтрин имели дело с этими «повелителями» стихийных миров. Я никогда им не доверял, и теперь, похоже, я оказался прав. Недавно они были нашими союзниками в борьбе с криганами, но спустя всего несколько месяцев мы оказались в состоянии войны с ними прямо здесь! И в том, и в другом случае я не понимаю ни причин их помощи, ни причин их препятствий. В лучшем случае это непостоянные существа… «вероломные» — возможно, это слово лучше всего подходит для их описания."
  "797":
    1: "Должен сказать, что с нетерпением жду возвращения в свои земли Энрота. Уже так давно я не видел ни их, ни своего сына, принца Николая. Когда я видел его в последний раз, он был ещё мальчишкой, а теперь уже почти взрослый. Сэр Хамфри оказался хорошим выбором на роль регента, но страна слишком долго оставалась без короля у руля государства."
  "798":
    1: "После того как мы разгромили криганов в Эратии, я отреклась от престола и передала регентство одному из своих генералов, Моргану Кендалу. Я доверила ему выбор нового правителя Эратии. Уверена, что это может показаться слишком большим жертвованием, но я, прежде всего, королева Энрота. Мы плыли туда, когда разразился катаклизм, заставивший нас оказаться здесь."
  "799":
    1: "Криганы? Их больше нет; я в этом уверен. После того как мы победили Люцифера Кригана, мои войска прочесали Эофол в поисках каких-либо признаков их дальнейшего существования. Мы ничего не нашли. Нет, криганская зараза в нашем мире уничтожена."
  "800":
    1: "Я сражался бок о бок с элементалями в наших походах против криганов. Я убедился, что они — стойкие и верные союзники. Я знаю, что Роланд с этим не согласен, но я не могу назвать их враждебность здесь проявлением непостоянства. Нет, я думаю, что их подталкивает к нападению на нас что-то другое — возможно, магия? Тебе стоит поговорить с нашим мудрецом, Ксантором. Он изучает кристалл Разрушителя. Уверен, к этому моменту он уже выдвинул какую-то теорию."
  "801":
    1: "Раньше мы свободно перемещались между островами по мостам.\nЭти мосты были разрушены, когда изверглось огненное гора.\nМногие семьи оказались в ловушке на отдалённых островах.\nМы даже не знаем, живы ли ещё люди, которые там живут."
  "802":
    1: "Теперь, когда Каменные порталы отремонтированы, мы, по крайней мере, сможем проверить, как обстоят дела на внешних островах и как там живется людям.\nМы в долгу перед вами за то, что вы починили Каменные порталы."
  "803":
    1: "Пристань на самом северном острове — единственный способ добраться с Кинжальной Раны на материк.\nПоскольку мосты разрушены, мы не можем добраться до пристани, а те, кто прибывает из Равеншора, не могут попасть в деревню Блад-Дроп!"
  "804":
    1: "Мы сможем добраться до причалов?\nНо для этого нам придётся пройти через заброшенный храм?\nНу, это уже что-то.\nПо крайней мере, мы сможем добраться до лодок."
  "805":
    1: "Я отправился в эти края, чтобы составить каталог всего разнообразия сыров, которые там можно найти. Моя задача почти выполнена, но осталось ещё три сорта сыра, которые я ещё не попробовал. Это «Фреландо», «Элденбри» и «Дандук». Я готов щедро вознаградить любого, кто сможет найти для меня эти редкие и, по слухам, очень вкусные кулинарные сокровища."
  "806":
    1: "Ты говоришь, что найдёшь мне сыры, которые я хочу, но вот ты вернулся с пустыми руками! Не трать впустую моё драгоценное время! Принеси мне сыр — «Фреландо», «Элденбри» и «Дандук»! Не возвращайся, пока не найдёшь их!"
  "807":
    1: "Отлично, ты принёс мне часть того сыра, который я искал. Но теперь я очень хочу устроить полноценную дегустацию, чтобы попробовать все три сорта сразу и сравнить их между собой. Вернись, когда соберёшь их все. То, что у тебя есть сейчас, я брать не буду. Боюсь, что не удержусь и попробую то, что ты оставишь — а тогда дегустация будет испорчена!"
  "808":
    1: "Превосходно! Дайте мне сыры! Я должен их съесть! Ах… хрум-хрум… Фреландо, восхитительный… Мммм, а Элденбри — с чудесным дымным привкусом… И, хм, Дандук… Ну, это не очень-то приятно, правда? Вы сделали моё сафари по каталогизации сыров Джадемы настоящим успехом! Я могу умереть счастливым человеком! Примите скромную благодарность от человека, любящего сыр. А вот и обещанная вам награда!"
  "809":
    1: "Нет людей, более преданных искусству сыроделия, чем величественные мастера-сыроделы из Вори. Хотя ледяные гиганты из Вори и славятся своей варварской сущностью, они являются настоящим воплощением потенциала цивилизованного развития — по крайней мере, в том, что касается сыроделия. А знаете ли вы, что у них есть сорок два разных слова для обозначения «сыра»?"
  "810":
    1: "Ещё в детстве я понял, что меня связывают особые отношения с сыром. Ведь моё самое первое воспоминание — это как я откусывал кусочек фермерского чеддера прямо из руки моей мамы! С того самого дня я понял, что моей страстью станет дегустация сыра, познание всего бесконечного разнообразия его восхитительных вкусов и поиски редких и экзотических сортов сыра по всему миру. И именно этим я посвятил свою жизнь… и свою судьбу."
  "811":
    1: "Благодаря сырам, которые вы мне принесли, я теперь попробовал все известные в мире сорта сыра. Теперь никто не сможет сказать, что я, Асаэль Фромаго, не являюсь величайшим в истории ценителем сыра! Никто не может сравниться с моей славой! Ха-ха-ха…"
  "812":
    1: "В ту ночь, когда здесь появился незнакомец, в центре города взорвался кристалл.\nЯ лишь мельком заметил этого незнакомца.\nОн не выглядел таким могущественным магом, каким был на самом деле.\nМеня не было на городской площади, когда он вызвал кристалл, но я видел вспышку света, пронзившую небо.\nЭто была поистине ужасная ночь."
  "813":
    1: "В город пришел странник.\nНесколько хулиганов попытались лишить этого путешественника всего, что у него могло быть. Странник почти не обратил на них внимания.\nОдним легким движением запястья он сразил их всех.\nЗатем он направился к городской площади и вызвал гигантский кристалл, который вы найдете там сегодня."
  "814":
    1: "Среди тёмных эльфов существует древняя поговорка:\n«Вещь живет ровно до тех пор, пока о ней помнит хотя бы один человек».\nСобытия той ночи, когда кристалл ворвался в нашу жизнь, будут жить в памяти еще очень долго.\nМногие из нас были свидетелями событий той ночи.\nМаг, призвавший кристалл, не сказал ни слова никому из нас.\nКогда он смотрел на нас, казалось, что в его сердце и глазах было только сострадание."
  "815":
    1: "Когда маг появился в городе, я не придал этому особого значения.\nЭто же Равеншор.\nКаждый, кто путешествует по дорогам Джадама, рано или поздно проходит через этот город.\nНаверное, мне стоило обратить на него больше внимания.\nПохоже, он устроил настоящий переполох на городской площади."
  "816":
    1: "«Пираты Регны» властвуют на морях.\nНикто не может им противостоять!\nНесколько лет назад капитаны нескольких рыболовецких судов решили, что смогут доплыть до Эратии, чтобы обратиться за помощью в борьбе с пиратами.\nС тех пор мы их больше ни разу не видели и не слышали о них."
  "817":
    1: "Регнанцы — самые отвратительные слизни, когда-либо ступавшие на берега Джадама. Они мешают народам континента торговать с Эратией и Энротом.\nА какой у нас выбор?\nДаже купцы Альвара не смогли собрать флот, способный справиться с пиратами.\nХодят слухи, что местные контрабандисты нашли способ обходить пиратскую блокаду."
  "818":
    1: "Регнаны называют себя «Империей Бесконечного океана» — пытаясь придать себе большее значение, чем они имеют на самом деле.\nНа самом деле они — всего лишь хулиганы и бандиты.\nКонечно, только не говорите им, что я так сказал!"
  "819":
    1: "В последние несколько недель приходят сообщения, что разбойники и огры грабят путников на всех главных дорогах Джадама. Времена становятся всё хуже.\nС регнанскими пиратами в море и разбойниками на дорогах безопасного пути, похоже, вовсе не осталось."
  "820":
    1: "Несколько воинов собрались вместе, чтобы разобраться с ограми, разбившими лагерь на дороге, ведущей в Равеншор.\nИменно тогда мы впервые услышали о крепости, которую они строили к юго-западу отсюда.\nС тех пор как крепость была достроена, дороги на юг и запад стали небезопасными."
  "821":
    1: "Джадамские контрабандисты, возможно, всего лишь миф, но я так не думаю.\nПохоже, торговцы Альвара способны отправлять небольшие партии товаров морем в Эратию и Энрот.\nПри этом у них нет собственных судов.\nЭто подтверждает, что контрабандисты всё-таки существуют.\nА вот почему они работают на торговцев — для меня загадка."
  "822":
    1: "Верераты!\nЭто самая отвратительная шваль!\nПо ночам они рыщут в нашем мусоре!\nВечно снуют в темноте!\nА днём их никогда не увидишь.\nОт этого просто мурашки по коже бегут!"
  "823":
    1: "Циклопы, обитающие к юго-востоку отсюда, всегда представляли угрозу для деревни Раст!\nНо жителям деревни всегда удавалось отражать любые набеги.\nВ небольшом количестве они не так уж и сильны, но если им удастся застать вас врасплох в пустыне, вы не выживете!"
  "824":
    1: "Море огня застало нас всех врасплох.\nОно распространилось по восточной половине деревни, как лесной пожар.\nК счастью, похоже, его распространение замедлилось.\nНо я всё ещё не знаю, сколько времени нам ещё осталось."
  "825":
    1: "Нам нужно найти новое место для жизни!\nНикто не смог бы жить в таких условиях.\nДаже циклопы были бы вынуждены уйти отсюда.\nСуществуют легенды о древней родине, откуда мы сюда и пришли.\nВ этих рассказах говорится, что там было пышно и зелено.\nЕсли бы только у нас было такое место, куда можно было бы вернуться."
  "826":
    1: "В Альваре и Шэдоуспайре живут торговцы, которые обменивают различные виды руды, добываемой по всему Джадаму.\nИз неё они изготавливают предметы и с удовольствием обменивают их на новые образцы руды!"
  "827":
    1: "Знаете, говорят, что «Хранилище Времени» существовало здесь ещё до появления Равеншора; город был построен вокруг него. Считается, что в нём хранится сокровище старого императора Торна, правившего этими землями сотни лет назад. Многие приезжают сюда, чтобы попытаться открыть хранилище, но никому это не удаётся."
  "828":
    1: "Мало нам было Чарльза Кихота, так приходится иметь дело ещё и с Илсингором, Яардрейком и Старым Лоебом — отступниками из наших рядов! Они полагают, что смогут возродить нашу расу, расселившись по Джадаму и основав собственные племена. Глупцы! Покидая нас, они лишь ослабляют свой народ. Яардрейк сбежал в пустыню Железных Песков. Не знаю, куда делись остальные."
  "829":
    1: "Хотя больше всего драконов обитает в ущелье Гарроты, я слышал, что охотиться можно и в других местах. Например, говорят, что в пустыне Железных Песков живёт великий древний дракон. Ещё одного якобы видели где-то в пустошах Блуждающего Разора."
  "830":
    1: "Когда Чарльз Кихот вёз нас из Эратии, мы проплывали мимо острова Регна. Это был первый увиденный нами берег Джадама, и древний дракон, летевший к острову, показался мне предзнаменованием будущего успеха нашей экспедиции. Как бы я хотел вонзить в него копьё! Это был самый огромный дракон из всех, что я видел!"
  "831":
    1: "Да, я был здесь в тот день, когда Разрушитель прошел через Равеншор! Я был у кузнеца, затачивал нож. Он прошел прямо мимо нас, словно весь город принадлежал ему. За ним на расстоянии следовала толпа. Кто-то из них бросил камень, но тот отскочил от магического щита, окружавшего его. Похоже, он даже не заметил этого. Позже я услышал взрыв со городской площади. Я выбежал посмотреть, но Разрушитель исчез, и остались только тот кристалл и разбросанные тела."
  "832":
    1: "Да, я видел «Разрушителя» — и название ему в полную силу! Я подумал, что он богатый купец, и он выглядел как легкая добыча, так что я… ну, я попытался его ограбить. Я побежал впереди него и затаился в переулке, дожидаясь, пока он пройдет мимо. Когда он подошёл, я бросился на него. Какая ошибка! Я его даже не коснулся! Как только я подошёл к нему, его магия отбросила меня назад. Более того, меня отбросило через крышу дома на соседнюю улицу!"
  "833":
    1: "Эти проклятые крысолюды, так называемые жрецы Ипа, приносят одни неприятности. Они больше похожи на шайку воров, чем на священнослужителей! Предупреждаю тебя, путник: следи за снаряжением, когда они поблизости. Они украдут всё, что не прибито гвоздями."
  "834":
    1: "Что ж, если вы ищете сыр, то, смею заверить, вы найдёте его в церквях Ипа. Вы же знаете, что мыши любят сыр. Так вот, это правило распространяется и на крысолюдов Ипа. Говорят, что в каждом из их храмов они хранят целые сокровища этого лакомства."
  "835":
    1: "Вдобавок ко всем нашим проблемам здесь пропал повелитель нашего измерения — Гралкор Жестокий. Он — существо, обладающее огромной силой, и, без сомнения, смог бы противостоять магии Тьмы, нападающей на это измерение."
  "836":
    1: "Хотелось бы мне понять, что здесь произошло. Ещё вчера всё шло своим чередом — обычно это мирное царство. А потом вдруг все начали выть в яростном безумии, одержимые желанием сокрушить ваш Джадам. Даже сейчас мои соседи по Земному плану упорно трудятся, чтобы обрушить небосвод нашего царства на ваш мир."
  "837":
    1: "Возможно, причина того, что это безумие не затрагивает меня, заключается в том, что у меня с собой есть амулет, подаренный мне повелителем этого измерения, Шалвендом. В наших легендах говорится, что именно он и другие повелители стихий сотворили ваш мир. Несомненно, если бы Шалвенд был здесь, он смог бы остановить ползущее безумие, но его нет! Где же наш повелитель в час нашей величайшей нужды?"
  "838":
    1: "Очевидно, именно магия стала причиной безумия, охватившего моих соседей по Плану Воздуха. В тот день, когда это произошло, сразу же воцарился хаос. Все, кого это коснулось, бросили свои дела и начали выть. Это был хор ужаса! Лишь горстка из нас сохранила рассудок. И теперь, день за днём, наше славное царство всё глубже и глубже погружается в адский упадок."
  "839":
    1: "Я не чужд тайнам магии. Очевидно, на обитателей этого водного царства подействовало какое-то заклинание почти невообразимой силы. Мне прежде всего интересно узнать, почему это произошло. Понятно, что никто не рискнул бы прибегнуть к такой силе, если бы не преследовал какой-то ужасный цель. Все, что я знаю, — это то, что План Воды ведет войну против вашего царства. Отсюда я не вижу в этом никакой причины!"
  "840":
    1: "Ч-что ж п-произошло с моими р-родными водами? Все о-охвачено б-б-безумием! И что ещё хуже, наш г-господин п-пропал! Где наш п-правитель, м-могучий Акв-в-валандер! Б-без него м-мы обречены!"
  "841":
    1: "Я знаю, что в ваших глазах этот мир, наверное, выглядит как ад. Но я вам скажу: обычно это не так. До того, как началось это безумие, мы жили здесь вместе в мире и гармонии. Но потом, однажды, наступило безумие, и наш повелитель Пираннасте исчез без вести. Возможно, именно его отсутствие и стало причиной этого безумия? Вполне возможно — насколько я помню, он никогда раньше не покидал это царство."
  "842":
    1: "Хотя безумие охватило почти всех здешних обитателей, оно не лишило их хитрости. Как вы, несомненно, знаете, они ведут войну против вашего королевства, но действуют отнюдь не безрассудно. Среди заражённых появились вожди, разрабатывающие хитроумные военные планы. Уже сейчас их силы сосредоточиваются у врат Джадама, готовясь к массированному наступлению."
  "843":
    1: "Семейная усыпальница Снапфингеров — одна из самых нижних в погребальных катакомбах нашей деревни. Поскольку наша семья пользуется большим уважением, наша гробница — самая просторная. Найти её не так-то просто — даже я однажды заблудился, пытаясь её найти! Когда я ищу её, я ориентируюсь, держа руку у правой стены. В конце концов я всё-таки добираюсь до места."
  "844":
    1: "Ты нашёл щит?\nВосстановление «Эклипса» имеет огромное значение для Храма Солнца!\nТы должен помочь нам его найти!"
  "845":
    1: "Ещё раз спасибо за то, что вернули щит «Эклипс»!\nНадеюсь, он пригодился вам в ваших приключениях."
  "846":
    1: "У тебя этого никогда не было!"
  "847":
    1: "Вот ваш утерянный предмет."
  "848":
    1: "Что ж, с этим покончено. Я приму меры, чтобы отправиться в Равеншор, чтобы лично занять место в вашем совете. Честно говоря, мне не помешает небольшая перемена. Руководство я оставлю своему заместителю, Реджинальду Доррею. Ещё раз — отлично поработали."
  "849":
    1: "Извини. Да, я бы с удовольствием отправился в приключение, но ты просто не на моём уровне."
  "850":
    1: "Конечно, почему бы и нет? Я готов — осталось только забрать своё снаряжение! Я покажу гильдии, кто достоин, а кто нет!"
  "851":
    1: "Нет… нет, та жизнь для меня уже позади. К тому же, если бы я и решил снова взять в руки булаву, то только с другими товарищами. Боюсь — если можно выразиться прямо — что просто не представляю себя путешествующим с такой неопытной группой, как ваша."
  "852":
    1: "Слушай, это звучит просто великолепно! Да, я пойду с тобой, если ты меня возьмешь."
  "853":
    1: "Думаю, нет! Зачем мне путешествовать с такими, как вы? Может, вы не расслышали моё имя — «Джасп Телборн»? Да, именно тот самый «Телборн», сброд. Нет, чем бы вы там ни занимались, мне это неинтересно."
  "854":
    1: "Да, мы бы составили отличную команду! Мы все совершили столько великих дел, как же наше объединение не может привести к новым великим свершениям? Если хочешь, я пойду с тобой."
  "855":
    1: "Теперь, когда мне не нужно бояться гибели моего наследника, я отомщу Кихоту. Его лагерь подвергнется нападению огня и когтей. Те, кто охотился на нас, теперь сами стали нашей добычей. Что касается вашего союза… вы оказали мне огромную услугу. Я выполню свой долг. Как только я заставлю своих врагов бежать или отправлю их на тот свет, я присоединюсь к совету союза в Равеншоре."
  "856":
    1: "Говорю вам, при всем том, что сейчас творится, честному торговцу просто не дают вести дела! Я имею в виду, нам всегда приходилось иметь дело с набегами огров, но теперь они настолько развязались, что построили крепость прямо здесь, в Альваре! Теперь ни один караван не может проехать по западной дороге в Мурмурвуд. Хуже всего то, что большая часть моей торговли связана именно с Храмом Солнца, который находится там!"
  "857":
    1: "Вы оказали нам всем огромную услугу, очистив крепость Огра. Теперь наши караваны могут беспрепятственно добираться до Мурмурвуда. Я благодарю вас… и мой кошелек вам, безусловно, благодарен!"
  "858":
    1: "Конечно, в Альваре есть осы — причём довольно крупные, — но мы терпим их по веской причине. Многие из наших клиентов заинтересованы в товарах, связанных с осами. Скажем, если вы хотите принять участие в этом деле, то торговец Велдон является посредником по продаже частей ос. Он живёт здесь, в городе, и, как я слышал, сейчас пытается выполнить крупный заказ на жала ос."
  "859":
    1: "Об этом знают немногие, но дракона можно приручить. Это чем-то напоминает укрощение лошади, только для этого требуется больше специального снаряжения и много магии. Те прирученные драконы за пределами форта — пример моей работы. Сейчас они верны нам, но я привяжу их к их конечному заказчику — Феннису Гринвуду, мелкому лорду из Эратии. То есть, я сделаю это, как только он нам заплатит."
  "860":
    1: "Зантора — странная личность. Не то чтобы члены Гильдии некромантов не были все странными, но она — настоящая сумасшедшая. Говорят, что другие члены гильдии просто отказываются с ней работать — настолько ужасны её эксперименты. И всё же они ценят её мрачный гений. Чтобы она осталась с ними, они построили для неё собственную лабораторию на болотистых пустошах за пределами города."
  "861":
    1: "В целом Гильдия некромантов держит местных вампиров под контролем… в основном. Но есть одно место, куда вам лучше не заходить! Большинство из них спят в общей крипте к северу от гильдии. Будьте осторожны, если решите туда пойти. Они, скажем так, немного… «территориальные»."
  "862":
    1: "Гильдия некромантов? Эй, я считаю, что они просто классные. Надо было тебе увидеть это место до их прихода — тут вообще ничего не происходило! Конечно, у нас тут бродят вампиры, скелеты и прочие нежить. Но, надо признать, теперь здесь стало гораздо оживленнее!"
  "863":
    1: "Как вы можете себе представить, дела идут отлично. Ну да, некроманты из гильдии превращают большинство моих клиентов в скелетов и зомби, но вампиры — это постоянные клиенты! Хотите принять участие? В городе есть торговец древесиной по имени Майландер, который всегда ищет качественную древесину Мурмурвуда. Если у вас она есть, он заплатит за неё немалую сумму."
  "864":
    1: "В последнее время охота стала довольно опасной, но нам всё равно приходится ею заниматься, если мы хотим прокормиться! Вчера я бродил вдоль западного берега Озера Огня и наткнулся на туннель, который, судя по всему, проходит под озером. Правда, я его не исследовал. Там кишело гогами и чем-то ещё хуже… как и везде в этих краях в последнее время."
  "865":
    1: "Даже мы, те, кто здесь живёт, иногда теряемся. Если не хотите сбиться с пути, следуйте за парящими указателями. Ах… безумие возвращается… Оно возвращается!"
  "866":
    1: "Ах, я рад, что ты отправился спасать мир. В смысле, кто-то же должен этим заниматься. А я предпочитаю беззаботную жизнь. Пока у меня есть лодка и удочка, а рыба клюет, я не вижу причин заниматься чем-то ещё. Но всё равно удачи тебе!"
  "867":
    1: "Вот этот Стэнли — вот это да, настоящий регнанский парень с характером! Я слышал, что именно он наладил нам отношения с этим Зогом Шакалом — каким-то огром, гигантским троллем или кем-то в этом роде, по-моему, — настоящим королём варваров. Теперь у нас есть корабли в море и куча размахивающих дубинами чертей на суше. Говорю вам, Великая и Могущественная Регнанская Империя движется к величию, когда за нас ратуют такие, как Ужасный Пират Стэнли!"
  "868":
    1: "Конечно, нам, регнанцам, приходится мириться с небольшой конкуренцией — я имею в виду контрабандистов, понимаешь, — но, насколько я знаю, «Грозный пират Стэнли» принимает меры, чтобы положить этому конец. Насколько я понимаю, он похитил семью Ариона Хантера только для того, чтобы заставить этого человека-крысу держаться подальше от нашей территории."
  "869":
    1: "Да, я знаю, что «Ужасный» пират Стэнли сейчас здесь в моде, но я скажу: фи! Конечно, он многое сделал для Регны, но ни один человек не делает ничего, что не приносило бы ему личной выгоды. Я слышал, что старина Стэнли снимает свою долю с каждой сделки, в которой участвует — а сделок у него немало! Мне бы хотелось знать, где он хранит свою добычу. Думаю, вряд ли на территории Регны. Не прошло бы и двух недель, как кто-нибудь бы её откопал!"
  "870":
    1: "Я придумал план, как найти спрятанное сокровище. До того, как ты ворвался сюда, я усердно работал над созданием заклинания, позволяющего обнаружить золото, спрятанное под землёй. Если у меня всё получится, я планирую попросить дракона перенести меня через пустоши Блуждающий Разор, где, по слухам, зарыто сокровище Грозного пирата Стэнли. Моё заклинание поможет мне его найти, и я стану богатым человеком."
  "871":
    1: "Ты имеешь в виду тот, что чуть севернее отсюда? Ну, мы все к этому не имеем никакого отношения. Там привидения!"
  "872":
    1: "Не знаю, где они сейчас, но я уверен, что некоторые из этих крысолюдей где-то здесь поблизости. По ночам я слышу снаружи всякие писки и шуршание. А утром исчезает практически всё, что не заперто на замок или не прикручено. Если бы я знал, где находится эта церковь Ип, я бы привёл туда нескольких своих парней для небольшой… беседы."
  "873":
    1: "Я вышел вместе с одной из бригад, работающих у нового озера, чтобы поискать вещи, вынесенные из логова. Мы полагаем, что нашли источник наводнения. Посреди озера находится странный проход. У нас нет лодок, поэтому мы не исследовали его, но даже с берега ясно видно, что он ведёт в подводное царство."
  "874":
    1: "Что ж, если вы ещё не были в крепости, то это первое место, куда вам следует отправиться. Как вы уже знаете из вводного инструктажа, так называемая крепость на этом острове — всего лишь прикрытие, призванное ввести врагов в заблуждение. Вам нужно добраться до настоящего форта на острове в форме полумесяца. Просто пройдите по подземному проходу, отмеченному на вашей ориентационной карте."
  "875":
    1: "Я знаю, что в Джадаме нас называют пиратами, но на самом деле мы просто управляем своей империей. Мы не виноваты, что наши подданные в Джадаме не признают нашу власть и не платят налоги. Поэтому мы вынуждены взимать дань в виде добычи. Вообще-то нам так даже больше нравится: не приходится по-настоящему управлять континентом."
  "876":
    1: "Мы, вампиры, обычно не можем выходить на улицу днём, но Тант, глава Гильдии некромантов, создал артефакт, позволяющий решить эту проблему. Вампир, носящий один из его амулетов «Ночная Тень», может свободно передвигаться как днём, так и ночью. К сожалению, таких амулетов очень мало. У меня самого его нет, поэтому днём мне приходится оставаться в помещении."
  "877":
    1: "Обычно нам, вампирам, нужен один из амулетов «Ночной тени» Танта, чтобы свободно передвигаться днём, но раз ты принёс нам жаровню «Ночная тень», то великолепная ночь окутывает Шэдоуспайр круглосуточно! Теперь те из нас, у кого нет амулетов, могут ходить днём… ну, по крайней мере, пока мы остаёмся в этой местности."
  "878":
    1: "Хотя это не в моем стиле, но надо сказать, что многие здешние жители любят наряжаться всевозможными украшениями. Говорят, это мода, но мне это кажется просто безвкусным. В любом случае, если у вас есть что-то на продажу, обратитесь к Павлу в городе. У него оживлённая торговля всякой безвкусной безделушкой."
  "879":
    1: "Ищете солнечников? К сожалению, не могу вам помочь. Забавно, что буквально на прошлой неделе у меня был целый улов этих рыб, но торговец Павел купил их все. Может, у него у вас получится их достать."
  "880":
    1: "Много веков назад именно на этом месте произошло самое масштабное на сегодняшний день сражение между Гильдией некромантов и Храмом Солнца!\nБыло выделено столько магической энергии, что сама земля выгорела и до сих пор остаётся чёрной!"
  "881":
    1: "Очень хорошо… или настолько хорошо, насколько можно было ожидать. Тебе удалось привлечь в союз троих партнёров — по словам моих советников, этого достаточно, чтобы исполнилась часть пророчества: «…народы Джадама должны держаться вместе…» Жаль, что союзников не больше, но катаклизм явно приближается к кульминации. Пора двигаться дальше. Отправляйся в Равеншор и встреться с собравшимся там советом союза. Вместе решите, каким будет следующий шаг в борьбе с кризисом стихий."
  "882":
    1: "У нас внизу есть небольшой склад. Можете смело пользоваться сундуками, чтобы хранить там лишнее снаряжение. Кладите туда всё, что не хотите потерять!"
  "883":
    1: "Спасибо, что освободили меня. Знайте: Шалвенд, Повелитель Воздуха, благосклонен к вам. Я отправляюсь восстанавливать порядок в своём царстве и присоединюсь к другим повелителям, чтобы сделать всё, что в моих силах, для вашего царства. Будьте осторожны! Наши действия приведут к дестабилизации кристаллических ворот. Отправляйтесь домой немедленно, чтобы не оказаться здесь в ловушке навсегда.\nСообщите Ксантору о том, что здесь произошло. Прощайте"
  "884":
    1: "«Разрушитель» — вполне подходящее прозвище для того, кто решил заточить меня таким образом. Если бы не ты, я, Акваландер, Повелитель Воды, вскоре погиб бы. Моя гибель привела бы к нарушению равновесия во всех мирах. Спасибо тебе. Теперь я отправляюсь к другим повелителям. Вместе мы восстановим порядок. Будьте осторожны! Наши действия приведут к дестабилизации кристаллических ворот. Уходите домой немедленно, чтобы не оказаться здесь в ловушке навсегда. Сообщите Ксантору о том, что здесь произошло. Прощайте."
  "885":
    1: "Я свободен! Теперь тот, кто был настолько глуп, что заключил меня в тюрьму — этот Разрушитель — почувствует мой гнев. То, что меня, Повелителя Земли, называют «Гралькор Жестокий», — не случайно. Страдания, которые я испытал, вернутся к нему многократно! Сейчас я отправляюсь, чтобы присоединиться к другим повелителям. Вместе мы восстановим справедливость. Будьте осторожны! Наши действия приведут к дестабилизации кристаллических ворот. Уходите домой немедленно, чтобы не оказаться здесь в ловушке навсегда. Сообщите Ксантору о том, что здесь произошло. Прощайте"
  "886":
    1: "Наконец-то я свободен. Мои мучения закончились, но что же с моими подданными? Я знаю, что Разрушитель заставляет их выполнять ужасную работу. Моё присутствие успокоит их. Я должен отправиться, чтобы восстановить порядок в моём и твоём царствах. Прежде чем вернуться в План Огня, я соберусь с другими владыками. Вместе мы наведем порядок. Будь осторожен! Наши действия приведут к дестабилизации кристаллических ворот. Отправляйся домой сейчас же, чтобы не оказаться здесь в ловушке навсегда.\nСообщите Ксантору о том, что здесь произошло. Прощайте"
  "887":
    1: "Ой, что ты тут наделал! Когда я просил тебя найти мне свидетеля событий в пустыне Железных Песков, я думал, что само собой разумеется: ты должен вернуть его мне в целости и сохранности! Только посмотри на этого бедного тролля! Отведи его в храм и позаботься о том, чтобы его вылечили. И, пожалуйста… постарайся не забывать, что ты работаешь на гильдию. У нас ведь есть репутация людей, которые ведут себя хотя бы с минимальной компетентностью."
  "888":
    1: "Ты нашёл Эбонест?\nА как же мой отец?\nГде он?\nЯ думал, ты вернёшься, когда найдёшь и отца, и копьё."
  "889":
    1: "Вы нашли моего отца и Эбонеста?\nЯ буду вечно вам благодарен!\nНам следует отнести копье Чарльзу Кихоту, и если он согласится, он повысит в звании меня и всех рыцарей из вашей свиты!"
  "890":
    1: "Вы работаете на «Торговцев Альвара», верно? Что ж, думаю, вам стоит поговорить с Дадероссом, предводителем вашего каравана. Мое дальновидное видение подсказывает мне, что он находится на Островах Кинжальной Раны."
  "891":
    1: "Хм… Я не могу заглянуть слишком далеко в будущее — ведь сегодня эфир слишком густой. Я вижу только то, что ты должен передать письмо, которое тебе дал Дадеросс, купцу Элгару Феллмуну. Феллмун живёт в городе Равеншор."
  "892":
    1: "Мне явилось видение, в котором ты доставляешь письмо от Элгара Феллмуна из Равеншора Ариону Хантеру, главе контрабандистов Равеншора. После этого ты возвращаешься к Феллмуну. Конец видения размыт, так что, видимо, ты не прожил его до конца. Тем не менее, твоя судьба — совершить все это."
  "893":
    1: "Мне не нужно, чтобы моё видение подсказывало тебе, что делать дальше. Поступи так, как просил тебя Феллмун. Отправляйся на поиски Бастиана Лаудрина, мастера Альварианской торговой гильдии. Он находится в городе Альвар."
  "894":
    1: "Я вижу, что между настоящим и твоим будущим не установлена важная связь. Тебе нужно вернуться к Бастиану Лаудрину и продолжить беседы с ним. Он укажет тебе следующий шаг на твоём пути."
  "895":
    1: "Прошлой ночью мне приснилось, что ты отправился в пустыню Железных Песков, чтобы найти свидетеля появления огромного огненного озера, образовавшегося там во время катаклизма."
  "896":
    1: "Мне ясно, что вы должны доставить тролля по имени Овердун в торговую гильдию в Альваре."
  "897":
    1: "Сегодня я вижу далеко в пространстве, но не во времени. Великое бедствие обрушилось на минотавров Логова Бальтазара в Блуждающем Разоре. Я чувствую, что твоя судьба связана с их судьбой. Ты должен спасти их от гибели."
  "898":
    1: "В Равновесии царит великое смятение. Мне потребовалось время, чтобы понять его причину, но теперь я знаю: всё вызвано войной между жрецами Храма Солнца в Мурмурвуде и Гильдией некромантов Шэдоуспайра. Твоя судьба — положить конец смятению, выбрав одного из этих союзников."
  "899":
    1: "В Равновесии царит великое смятение. Мне потребовалось время, чтобы понять его причину, но теперь я знаю: всё вызвано войной драконов и рыцарей в ущелье Гарроты. Твоя судьба — вступить в союз с одной из сторон в ущерб другой."
  "900":
    1: "Вы проделали отличную работу, наладив эти союзы. Теперь пришло время обратиться за советом к тем союзникам, которых вы собрали. Найдите их в зале заседаний в здании торговой гильдии в Равеншоре."
  "901":
    1: "Я вижу, что между настоящим и твоей будущей судьбой не установлена важная связь. Тебе нужно вернуться в зал заседаний торговой гильдии «Равеншор». Члены совета укажут тебе следующий шаг на твоём пути."
  "902":
    1: "Вы должны выполнить поручение совета альянса. Найдите путь к острову Регна и потопите регнанский портовый флот."
  "903":
    1: "Если вы ещё не слышали, на Равеншор напали регнанские пираты. Город эвакуирован. Вы должны устранить пиратскую угрозу, прежде чем совет альянса вернётся, чтобы руководить вами."
  "904":
    1: "Теперь, когда ты потопил флот Регнана, отправляйся за советом к совету твоего альянса. Там тебе поручат следующее задание, которое определит твою судьбу."
  "905":
    1: "Вам нужно поговорить с придворным мудрецом Айронфистов Ксантором. Он находится в Равеншоре."
  "906":
    1: "Я вижу, что важная связь между настоящим и твоим будущим пока не установлена. Найди мудреца Ксантора, который обитает в Равеншоре. Он поручит тебе следующее задание, связанное с твоей судьбой."
  "907":
    1: "Понятно, что вы должны выполнить просьбу Ксантора. Отправляйтесь в четыре стихийных мира и найдите в каждом из них по одному стихийному камню сердца."
  "908":
    1: "Теперь, когда у вас есть четыре сердечных камня стихий, вам нужно отнести их Ксантору в Равеншор."
  "909":
    1: "Ваша судьба ждёт вас за хрустальными вратами в Равеншоре. Они приведут вас в Пространство между мирами. Там вы найдёте источник стихийного катаклизма."
  "910":
    1: "Вы поговорили с Разрушителем, но не смогли получить от него ключ, который откроет вам путь в будущее. Вернитесь к нему и продолжите разговор."
  "911":
    1: "Твой путь ясно виден в моём видении. Тебе предстоит найти четырёх повелителей стихий и освободить их из их темниц. Эти темницы находятся в царстве Разрушителя — в Мире между мирами."
  "912":
    1: "Отправляйся на поиски Ксантора! Хотя он и является лишь пешкой в игре Равновесия, твой следующий шаг к судьбе — это встреча с ним."
  "913":
    1: "Равновесие восстановлено. Теперь, когда твоя судьба предрешена, я больше не могу вести тебя: мой взор обращён лишь к судьбе Равновесия. Что делать дальше — решать тебе. Удачи, герой Джадама!"
  "914":
    1: "Тебя не повысят в должности, пока мы не узнаем, где находится Каури Блэкторн!\nНайди её, и она сама повысит тебя в должности.\nКак только её найдут и она вернётся в Гильдию купцов, я с удовольствием повышу в должности до уровня Патриарха всех тёмных эльфов из твоей группы."
  "915":
    1: "Каури рассказала мне, как ты помог ей справиться с проклятием василиска.\nОна поручила мне повысить до звания патриарха всех тёмных эльфов, путешествующих вместе с тобой."
  "916":
    1: "Вы не сможете получить повышение, пока не найдёте Обитель древних троллей!\nВернитесь сюда, когда найдёте её, и поговорите с Вологом."
  "917":
    1: "Перед тем как Волог уехал, он поручил мне повысить всех троллей, путешествующих с тобой, до звания «Боевого тролля».\nДеревня Раст будет тебе вечно благодарна!"
  "918":
    1: "Вы не сможете получить звание чемпиона, пока не докажете, что достойны его!"
  "919":
    1: "Спасибо за помощь в поиске копья «Эбонест»!\nЯ могу повысить до звания «Чемпион» любого рыцаря, путешествующего вместе с тобой."
  "920":
    1: "Вы не доказали, что достойны этого!\nПока вы не нанесёте удар по Охотникам за Драконами, никому из вас не будет присвоено звание!"
  "921":
    1: "Ты доказал свою ценность, и я присвою звание Великого змея всем Драконам, путешествующим вместе с тобой."
  "922":
    1: "Вы не сможете получить звание Священника Света, пока не найдёте «Пророчества Солнца»!"
  "923":
    1: "Здесь вам всегда рады!\nКонечно, я повышу всех клириков, путешествующих с вами, до звания «Священника Света»!"
  "924":
    1: "Вы ещё не нашли «Потерянную книгу Келя»!\nПовышения в звании не будет, пока вы не вернётесь с книгой!\nПоговорите с Ветринусом Тейлшире."
  "925":
    1: "А, ты вернулся, чтобы добиться повышения для других членов своей группы?\nЯ не забыл о твоей помощи в поиске «Потерянной книги Келя»!\nВсе некроманты в твоей группе будут повышены до ранга лича.\nУбедись, что у каждого некроманта есть сосуд лича."
  "926":
    1: "Вы не нашли Корбу, и пока не найдёте, я отказываюсь повышать кого-либо из вас!\nУбирайтесь!"
  "927":
    1: "Все вампиры среди вас будут повышены до ранга Носферату!\nЯ помню тех, кто помог в извлечении останков Корбу."
  "928":
    1: "Ты не нашёл Топор Бальтазара!\nТы не достоин повышения!"
  "929":
    1: "Стадо Масула в долгу перед вами.\nВсе минотавры в вашей группе получают звание «Владыка минотавров»!"
  "930":
    1: "Мой отец послал тебя, чтобы спасти меня?\nЯ тебе благодарен.\nЯ вернусь к отцу и расскажу ему о твоей помощи!"
  "931":
    1: "Где флакон с землёй из могилы?\nНе беспокойте меня, пока не найдёте его!"
  "932":
    1: "Я пока не могу отправиться в путь с тобой!\nЯ скорее присоединюсь к купеческому каравану, чем поеду с тобой.\nВернись ко мне, когда узнаешь мир получше и найдешь в нём своё место."
  "933":
    1: "Я вас помню!\n«Книга Келя» оказалась просто неоценимой, и для меня было бы большой честью путешествовать вместе с вами."
  "934":
    1: "Когда ты повзрослеешь и лучше познакомишься с жизнью, я с удовольствием отправлюсь в путешествие вместе с тобой.\nА пока мне нужно закончить учебу здесь."
  "935":
    1: "Конечно!\nПутешествовать с вами было бы для меня честью!"
  "936":
    1: "Вы оказали нам огромную услугу, искатели приключений. От имени всего стада выражаю вам искреннюю благодарность. Знайте: минотавры Логова Бальтазара относятся к вам с величайшим уважением. Вы всегда будете нашими желанными гостями."
  "937":
    1: "Отлично!\nТеперь, когда огры изгнаны с дорог и больше не обитают в крепости, дороги, ведущие в Равеншор, Железные Пески и Мурмурвуд, снова стали безопасными!"
  "939":
    1: "Изумрудный остров расположен к юго-востоку от Эратии, вдали от пиратов и прочих разбойников.\nЭто было бы идеальным местом, если бы не постоянные рои стрекоз, заполонившие остров.\nК счастью, большое количество вооружённых и опытных людей, которых привлек этот турнир, должно немного уменьшить их численность. Лорд Маркхэм для вашего удобства на время турнира дополнил эту обычно малонаселённую деревню магазином оружия, доспехов и алхимика.\nТакже доступны храм и основные магические гильдии.\nЯ бы посоветовал убедиться, что вы полностью готовы, прежде чем приступать к соревнованию."
  "940":
    1: "Добро пожаловать на Изумрудный остров!\nЯ буду вашим гидом на время вашего пребывания на острове.\nВ мои обязанности входит убедиться, что вы понимаете правила как острова, так и конкурса.\nНа время вашего пребывания на Изумрудном острове прошу вас воздерживаться от грубых нарушений норм цивилизованного поведения."
  "941":
    1: "Я уважаю ваше решение.\nОднако я человек терпеливый и буду предлагать вам эту возможность до тех пор, пока не будет объявлен победитель конкурса."
  "942":
    1: "Правила конкурса просты:\nПобедителем становится тот, кто первым вернётся с этими предметами.\nЧтобы выиграть, вам нужно всего лишь собрать в Храме Луны богатую шляпу, красное зелье, длинный лук, морскую ракушку, музыкальный инструмент и плитку для пола, а затем отнести их судье."
  "943":
    1: "Разве эта охота не захватывающая?\nЯ действительно благодарна вам за то, что вы пришли на мое небольшое мероприятие, и надеюсь, что вы хорошо проведете время, даже если не выиграете.\nМне кажется, это замечательно, что все соревнуются в духе спортивного духа и товарищества."
  "944":
    1: "Если вы победите, вам достанется управление одним из самых живописных уголков всей Эратии!\nХармондэйл находится в непосредственной близости от Туларийского леса, прямо на границе между землями эльфов и людей.\nИ я уверен, что вам понравится замок.\nЕму, конечно, требуется небольшой ремонт, но он довольно просторный и отлично проветривается.\nМне очень тяжело расставаться с этой собственностью, но я чувствую, что пришло время отдать что-то людям в ответ."
  "945":
    1: "Поздравляю!\nВы — новые лорды Хармондэйла!\nРазве это не захватывающе?\nВы даже не представляете, какое удовольствие я испытываю, передавая вам это поместье!\nВсе преимущества и награды, и, конечно же, обязанности по управлению городом Хармондэйл теперь принадлежат вам.\n(Лорд Маркхэм достаёт документ о праве собственности и договор) Просто подпишите здесь... И здесь... И если бы вы могли поставить здесь свои инициалы... Да!\nНу, вот и всё!\nВсё готово.\nИ ещё раз поздравляю!!!"
  "946":
    1: "Что ж, корабль, который доставит вас в ваши владения, ждёт вас в гавани.\nМы с моей свитой отплывём на другом корабле.\nПросто поднимайтесь на борт, когда будете готовы."
  "947":
    1: "Позвольте представиться.\nМеня зовут мистер Мальвик.\nЯ представляю группу, скажем так, «инвесторов в будущее».\nЯ наблюдаю за вами с тех пор, как вы прибыли на этот остров, и считаю, что ваши ценности и цели во многом совпадают с нашими.\nЯ уполномочен предоставить вам палочку для создания огненных шаров, которая поможет вам победить в сегодняшней Охоте, в обмен на одолжение в будущем.\nЧто вы на это скажете?"
  "948":
    1: "У нас есть основания полагать, что тот, кто будет руководить Хармондэйлом в ближайшие несколько месяцев, получит беспрецедентную возможность определить его будущее.\nИменно поэтому я сегодня здесь — чтобы убедиться, что это будущее устроит моих коллег.\nУверен, вы меня понимаете."
  "949":
    1: "Отлично.\nКогда-нибудь в будущем я или кто-то из моей группы обратится к вам с просьбой отплатить тем же.\nНадеюсь, вы нас не подведёте.\nВот ваша палочка для запуска огненных шаров.\nНам не стоит больше разговаривать на глазах у других — они могут заподозрить неладное."
  "950":
    1: "Мне очень нравится бывать на этой стороне острова — вид на океан здесь гораздо лучше, чем из города, не правда ли?"
  "951":
    1: "У меня есть несколько красивых морских ракушек на продажу — такие ракушки можно найти только на Изумрудном острове.\nМогу я продать вам одну?\nОни стоят всего по ста золотых за штуку."
  "952":
    1: "Вот, пожалуйста. Надеюсь, это напомнит вам о вашей поездке на Изумрудный остров."
  "953":
    1: "Я действительно не могу спуститься ниже 100 золотых; мне тоже нужно зарабатывать на жизнь."
  "954":
    1: "Вижу, у вас тут отличная шляпа.\nКак насчёт такой сделки:\nВы отдадите мне свою шляпу, а мы позволим вам остаться в живых?"
  "955":
    1: "Спасибо за кепку, друг!"
  "956":
    1: "Тебе следовало принять моё предложение…"
  "957":
    1: "Этот храм — довольно жуткое место.\nЗдесь, наверное, стоит быть начеку — никогда не знаешь, что может захотеть тебя убить."
  "958":
    1: "Тебе стоило меня послушать; я предупреждал, что это опасное место.\nА теперь убирайся отсюда, пока я не решил забрать у тебя ещё что-нибудь."
  "959":
    1: "Я понимаю это так, что вы не желаете принять моё предложение.\nСчитаю, что наши дела завершены."
  "960":
    1: "Похоже, самая опасная группа участников укрылась в Храме Луны.\nДумаю, они, возможно, собираются устроить засаду на любую группу, которая попытается туда пробраться."
  "961":
    1: "Я знаю, как приготовить синее зелье, но не красное... Подойдет практически любая синяя трава.\nПросто смешай её с пустой бутылкой — и вуаля!\nСинее зелье готово.\nДумаю, приготовление красного зелья происходит примерно так же, но точно не знаю.\nГоворят, что неправильное смешивание зелий может привести к очень неприятным последствиям."
  "962":
    1: "Извините, ребята, это судно останется пришвартованным до тех пор, пока не будет объявлен победитель конкурса."
  "963":
    1: "Добрый день.\nВ мои обязанности входит проверка того, что у вас есть все предметы, необходимые для победы в конкурсе.\nВам необходимо принести мне красное зелье, длинный лук, плитку пола из Храма Луны, роскошную шляпу, ракушку и музыкальный инструмент.\nВы можете принести их в любом порядке, просто показывайте их мне по одному, чтобы я мог их проверить."
  "964":
    1: "Вижу, ты нашёл ценную шляпу.\nЯ соответственно вычеркну это из твоего списка — молодец."
  "965":
    1: "Хм, вот это да, отличная лютня.\nПозвольте мне вычеркнуть этот инструмент из вашего списка."
  "966":
    1: "Настоящие искатели приключений!\nЯ не ожидал, что кто-то так быстро принесет плитку.\nОднако это, безусловно, плитка из Храма, поэтому я вычеркну её из вашего списка."
  "967":
    1: "Этот длиннолукий лук, безусловно, подходит для охоты.\nОтличная работа, я вычеркну это из твоего списка."
  "968":
    1: "Красивая ракушка, очень похожая на те, что продает Салли.\nОна, несомненно, с Изумрудного острова — я вычеркну эту ракушку из твоего списка."
  "969":
    1: "Почему ты так долго?\nК этому моменту почти все группы уже сдали красное зелье.\nЭто самый простой предмет в этой охоте, но лучше поздно, чем никогда.\nЯ отмечу его в твоём списке."
  "970":
    1: "Ну, вот и все шесть предметов.\nВы — победитель конкурса!\nРекомендую вам обратиться к лорду Маркхэму за подробностями о получении вашего феодального владения — моя работа здесь закончена."
  "971":
    1: "Извините, но ни одна из ваших вещей не нужна для охоты.\nЯ не хочу принижать значение того, что у вас есть, но мне ничего из этого не нужно."
  "972":
    1: "Вы участвуете в состязании лорда Маркхэма?\nКак здорово!\nЯ здесь, чтобы развлекать свиту лорда Маркхэма, участников состязания и всех, кому захочется послушать песню."
  "973":
    1: "У меня есть несколько инструментов, но я взял с собой только лютню.\nОна старая и не в таком хорошем состоянии, как некоторые другие, но я не хотел, чтобы пираты украли один из моих лучших инструментов или чтобы он повредился под воздействием влажного соленого воздуха."
  "974":
    1: "Ты говоришь, тебе нужен инструмент для «Охоты за сокровищами»?\nДумаю, ты мог бы купить мою лютню, но она у меня уже так давно.\nНаверное, я бы расстался с ней за 500 золотых.\nЗаинтересован?"
  "975":
    1: "Ну ладно, пообещай, по крайней мере, что будешь бережно с ним обращаться и не будешь использовать его в качестве дров.\nПохоже, мне придётся обходиться без инструмента до конца этой поездки.\nМожет, мне стоит рассказывать истории вместо того, чтобы петь, пока я не вернусь домой."
  "976":
    1: "Было бы хорошо, если бы у вас было 500 золотых.\nПожалуйста, не пытайтесь обманом отобрать у меня мой инструмент."
  "977":
    1: "Привет!\nПолагаю, ты участвуешь в конкурсе?\nРад это слышать.\nМы хотели спросить, не хотел бы ты обменять красное зелье (если оно у тебя есть) на шляпу.\nМожет, мы сможем немного помочь друг другу."
  "978":
    1: "Замечательно!\nВот шляпа, а я возьму зелье.\nОгромное спасибо, теперь мы почти завершили наш список."
  "979":
    1: "В чём дело?\nТебе не нравится работать с другими?\nНу и ладно, тогда от нас помощи не дождёшься."
  "980":
    1: "Это что, какая-то уловка?\nУ тебя даже красного зелья нет.\nТы же не думаешь, что я просто так отдам тебе шляпу, правда?"
  "981":
    1: "Отлично сработали, ребята!\nМы сейчас же отправляемся в Хармондэйл.\nПоздравляю."
  "982":
    1: "Имейте в виду, что я назначил награду в размере 1000 золотых той группе, которая доставит информацию об исчезнувших участниках."
  "983":
    1: "Есть ли уже какие-нибудь новости о пропавших людях?"
  "984":
    1: "На острове действительно есть дракон?\nЯ думал, все имели в виду тех стрекоз, которые повсюду летают.\nЯ предупрежу всех, чтобы держались подальше от той пещеры, чтобы мы больше никого не потеряли."
  "985":
    1: "Хм… По-моему, недавно у входа в Пещеру Дракона крутились какие-то незнакомцы.\nЯ не заметил, вошли ли они внутрь, но с тех пор их больше не видел.\nНаверное, они поняли, насколько опасно там, и вернулись в город."
  "986":
    1: "Пещера прямо за моим домом — это не «Заброшенный храм».\nОна принадлежит Моркараку Безжалостному, дракону Изумрудного острова.\nОн не любит гостей, поэтому я бы не советовал туда ходить.\n«Заброшенный храм» скрыт в холме к югу от моего дома.\nДобраться до него можно, войдя в пещеры на вершине холма."
  "987":
    1: "В последнее время северо-западную часть Изумрудного острова заполонили дикие стрекозы, из-за чего хранить вещи в нашем сарае там стало опасно.\nСтрекозы не обладают особой силой, но они быстры и иногда даже могут стрелять в вас огнём.\nНе стоит их недооценивать!"
  "988":
    1: "Дракон Изумрудного острова обитает в пещере на северо-востоке.\nНо я бы не советовал туда отправляться — он не любит гостей.\nОн щадит наш город, чтобы мы могли платить ему дань, а в обмен на это не пускает сюда пиратов и других нежелательных элементов."
  "989":
    1: "Вы участвуете в состязании?\nТогда я бы не советовал вам отправляться в Пещеру Дракона.\nМоркарак не слишком терпим к посторонним.\nГотов поспорить, пропавшие люди забрели туда, приняв его пещеру за Заброшенный храм. Скорее всего, они уже давно мертвы."
  "990":
    1: "Я бы попристальнее присмотрелся к остальным участникам — некоторые из них кажутся безжалостными.\nОдна особенно неприятная группа направилась на северную часть острова, и с тех пор я их больше не видел.\nМеня удивляет то внимание, которое уделяется этому конкурсу; судя по всему, люди надеются завоевать расположение участников, чтобы в случае их победы получить от них какую-то услугу в будущем."
  "991":
    1: "Вы решили, что больше не хотите получать от меня информацию о местах на Изумрудном острове.\nЕсли позже вы решите, что хотели бы услышать, что я могу рассказать, найдите меня в таверне «Две пальмы» и выберите опцию «Начать экскурсию»."
  "992":
    1: "Вы решили прослушать мою экскурсию по достопримечательностям Изумрудного острова.\nЕсли вы решите, что больше не хотите, чтобы я указывал на интересные места, выберите «Отключить экскурсию»."
  "993":
    1: "Пусть закон и решает, кто виновен, а кто нет, но я решаю, кого называть «вором», а кого — просто преступником.\nПринеси мне ту прекрасную вазу, которую я видела на каминной полке в поместье лорда Маркхэма, и я назову тебя «разбойником»."
  "994":
    1: "Обычные преступники крадут всё, что им попадается на глаза; а «разбойники» крадут то, что я им прикажу.\nЯ не буду присваивать звания неудачникам.\nВернитесь с вазой лорда Маркхэма, и я повышу всех «воров» до звания «разбойников», а всех, кто не является «ворами», — до звания «почетных разбойников»."
  "995":
    1: "Отлично.\nЧтобы украсть эту вазу, потребовались смелость и ловкость.\nЯ присваиваю тебе звание «Разбойника» и выплачиваю небольшое вознаграждение за твои услуги."
  "996":
    1: "Ты выбрал путь Тьмы, и я не буду продвигать тебя дальше.\nВозможно, убийца сможет чему-то тебя научить.\nЯ слышал, что в Дейе есть один такой."
  "997":
    1: "Ты ещё не совсем готов сделать следующий шаг.\nСкоро настанет момент, когда тебе предстоит решить: пойти по пути Света или по пути тьмы.\nЕсли ты выберешь Свет, вернись ко мне, чтобы завершить своё обучение."
  "998":
    1: "Ваше следующее задание будет несколько сложнее — оно больше подходит для шпионов, чем для разбойников.\nМеня попросили обеспечить, чтобы Сторожевая башня № 6 — единственная башня, уцелевшая после недавних войн с некромантами, — не смогла защищаться при следующем нападении.\nУбить стражников внутри бесполезно — некроманты просто снова заполнят башню своими войсками.\nБашня находится на южной окраине земель некромантов.\nЯ хочу, чтобы вы проникли внутрь и перенесли противовес из сторожки на вершине башни в сторожку у подножия башни.\nЭто тяжёлый груз, который находится в пазу у стены, к нему привязана верёвка.\nКогда наступит время атаки, о перемещённых противовесах заметят слишком поздно, и ворота не закроются.\nЕсли вам удастся это сделать, вы докажете, что достойны звания шпиона."
  "999":
    1: "Э-э... Груз нужно положить в ящик в нижней сторожевой будке, а не сюда.\nВернись к «Сторожевой башне № 6» и положи груз в нужный ящик!"
  "1000":
    1: "Хм.\nУдаление груза из верхней сторожки было первым шагом, но где он теперь?!?\nПлан не сработает, пока ты не поместишь груз в нижнюю сторожку!\nВернись к Сторожевой башне № 6 и положи груз в нужный ящик!"
  "1001":
    1: "Ты ещё не выполнил задание!\nНе забывай: тебе нужно отправиться в «Сторожевую башню № 6» и перенести груз из ящика в верхней сторожевой будке в нижнюю.\nЯ не повышу тебя в должности, пока это не будет сделано."
  "1002":
    1: "Отличная работа!\nКогда-нибудь ваш диверсионный акт против той сторожевой башни спасёт сотни жизней.\nВ знак признания ваших заслуг я настоящим присваиваю «Разбойникам» среди вас звание «Шпионов», а «Почётным разбойникам» — звание «Почётных шпионов»! Ах да, вот вам немного золота в качестве вознаграждения."
  "1003":
    1: "Так Йохан хочет получить Фейские дудки, да?\nНе могу сказать, что я удивлён — он бы сам сюда не пришёл, трус.\nНо дудки тебе обойдутся дорого — всей твоей едой.\nКонечно, у меня внизу есть отличная еда, если ты захочешь пополнить свои рюкзаки."
  "1004":
    1: "Освежает! (+50 к выносливости временно)"
  "1005":
    1: "Итак… ты хочешь стать убийцей.\nХорошо.\nЯ могу обеспечить «Разбойникам» среди вас необходимую подготовку, но прежде чем я начну уделять вам время, вы должны доказать как своё мастерство, так и свою преданность.\nМои начальники сообщили мне, что жизнь некой леди Элеоноры Кармин должна быть прервана.\nРаньше она работала на нас, но теперь обосновалась в Небесном дворе вместе с нашими врагами и снабжает их информацией, наносящей ущерб нашему делу.\nУстраните её и вернитесь с какой-нибудь её безделушкой, чтобы доказать, что задание выполнено."
  "1006":
    1: "Ты выбрал Путь Света, и поэтому никогда не сможешь стать настоящим убийцей.\nЯ не могу тебя обучать.\nВозможно, тебе стоит продолжить более мягкое обучение у Шпиона."
  "1007":
    1: "Я могу превратить простого разбойника в грозного убийцу, но только если у него подходящий для этой работы характер.\nПриближается время, когда тебе предстоит выбрать: идти по пути света или по пути тьмы.\nЕсли ты предпочитаешь тень, приходи ко мне, и я завершу твою подготовку."
  "1008":
    1: "Если ты ищешь наставника по сложным приёмам скрытности, то обратился по адресу.\nНо сначала тебе нужно освоить основы.\nВернись ко мне, когда станешь Разбойником или Почётным разбойником.\nТогда, возможно, я продолжу твоё обучение.\nИщи Мастера-вора в канализации Эратии."
  "1009":
    1: "Без доказательств я не могу считать леди Кармин мертвой.\nПринесите мне доказательства, и я удостою вас титула «Убийца»."
  "1010":
    1: "Итак, дело сделано. [Он медленно осматривает кинжал, затем вздыхает.] Она была мне очень дорога, но эмоции — враг разума.\nСам я не смог бы выполнить это задание.\nСпасибо.\nТеперь вы по-настоящему убийцы.\nТем из вас, кто проявил недисциплинированность, я проведу специальную подготовку.\nВот небольшое вознаграждение, чтобы помочь покрыть расходы, понесенные вами во время выполнения задания."
  "1011":
    1: "У тебя пока нет гобелена, а время идёт.\nБыло бы разумнее сосредоточиться на поставленной задаче, а не отвлекать меня своей болтовней."
  "1012":
    1: "Ха! Так ты хочешь пройти испытание, чтобы стать крестоносцем?\nЯ тебя не виню — чувство гордости, которое испытываешь, совершив героический поступок, просто возвышенно!\nИспытание простое.\nНужно убить дракона.\nЯ знаю как раз такого — Вромтракс Бессердечный!\nОн обитает в пещере в Таталии и, когда находится дома, терроризирует крестьян, живущих по соседству.\nВ это время года он должен быть в пещере.\nПоскольку это, вероятно, твой первый дракон, я отправлюсь с тобой, чтобы дать тебе несколько советов.\nИтак, давай немедленно отправляемся и прольём чёрную кровь этого чудовища!"
  "1013":
    1: "Ура!\nДракон пал!\nВы поистине достойные крестоносцы, совершившие великий подвиг.\nЯ бы остался и вместе с вами воспел вашу доблесть, но долг зовет.\nНесомненно, мы ещё встретимся, крестоносцы!"
  "1014":
    1: "Мы должны завершить наше приключение, прежде чем я смогу назвать вас крестоносцами, друзья."
  "1015":
    1: "Я рад видеть, что вы, крестоносцы, избрали путь Света!\nБыло совершено злодеяние, друзья, и кто, как не мы, может исправить его?\nЗлобный злодей похитил прекрасную девушку по имени Элис Харгривз.\nЕго зовут Уильям Сетаг, и он заточил её в своей башне.\nВы должны немедленно отправиться в путь, чтобы казнить этого злодея и спасти милую Алису!\nЕсли вам это удастся, вы по-настоящему станете Героями этой Земли!"
  "1016":
    1: "Я больше не хочу иметь с тобой ничего общего, негодяй!\nТеперь я вижу, что ты выбрал путь Тьмы.\nВозможно, тебе стоит найти себе наставника — такого же злодея, как и ты сам."
  "1017":
    1: "Ах, товарищи-крестоносцы!\nЯ знаю, что вы жаждете нового испытания, чтобы отточить свои навыки крестоносца, но сначала вам предстоит пройти гораздо более серьёзное испытание.\nПрежде чем я смогу помочь вам дальше, вы должны согласиться следовать Путем Света.\nВы сами поймёте, когда примете это решение.\nТогда вернитесь ко мне."
  "1018":
    1: "Ты сделала это! Я знал, что ты сможешь!\nЯ так тобой горжусь!\nЭлис освободилась из лап злобного Уильяма Сетага, зло побеждено, а добро восторжествовало.\nТам, где раньше царило зло, теперь царит добро! [Чарльз вздыхает и широко улыбается] Ну что ж.\nМоя работа здесь закончена!\nВы прошли испытания и заслужили свою награду.\nПоэтому я торжественно провозглашаю вас Героями!"
  "1019":
    1: "Хотя ваши поступки, крестоносцы, и вправду впечатляют, я не могу назвать вас героями, пока вы не спасёте девушку!"
  "1020":
    1: "Ай-ай-ай.\nВы ещё не стали крестоносцами. Я не смогу продолжить ваше обучение, пока вы не проявите должного усердия."
  "1021":
    1: "Вы не должны были увидеть это сейчас.\nЕсли вы читаете это, сообщите Брайану: в событиях или логике задания что-то сломано. Вы должны были либо выбрать сторону добра и выполнять задание Героя, либо выбрать сторону зла и выполнять задание Злодея, но, похоже, не сделали ни того ни другого."
  "1022":
    1: "Помогите!\nУильям схватил меня и запер в этой башне.\nПожалуйста, вытащите меня отсюда как можно скорее, я не хочу умирать."
  "1023":
    1: "Огромное спасибо за то, что помогли мне вырваться из лап Уильяма."
  "1024":
    1: "Простите, а кто вы, позвольте спросить?\nЭй!\nУберите от меня руки!\nНа помощь!"
  "1025":
    1: "Куда, по-твоему, ты меня ведёшь?\nУ меня богатая семья — у тебя будут большие неприятности, если ты меня не отпустишь!"
  "1026":
    1: "Перейдём к делу, не так ли?\nВы наверняка знаете, что я слыву самым отъявленным злодеем Эратии.\nЧтобы заслужить такую славу, нужны усердие и целеустремлённость. Надеюсь, у вас хватит на это духу.\nЯ бы с удовольствием годами обучал вас всем тонкостям злодейства.\nК сожалению, от меня требуют ускорить ваше обучение.\nПоэтому предлагаю сразу перейти к практике.\nЕсть одна женщина — Элис Харгривз, знатного происхождения и безупречной нравственности.\nПохитите её из покоев в замке Грифонхарт, доставьте сюда и заточите в моей башне.\nВыполните это задание, и я присвою всем крестоносцам вашего отряда звание злодеев, а остальным — почётных злодеев."
  "1027":
    1: "Я бы с удовольствием развратил ваши явно благочестивые души, но боюсь, вам не хватит духу следовать моим наставлениям до конца.\nВы избрали путь Света, так что помощи от меня не ждите."
  "1028":
    1: "Прежде чем продолжить обучение, вам предстоит сделать куда более важный выбор.\nЕсли изберёте путь Тьмы, возвращайтесь ко мне — я завершу ваше обучение искусству паладинов."
  "1029":
    1: "Великолепно!\nВы проявили преданность делу, дерзость и умение действовать грубой силой.\nЗаточив столь прекрасное и благородное создание в этом мрачном месте, вы заслужили право называться злодеями — или почётными злодеями.\nТеперь ступайте и заставьте весь мир трепетать при звуке ваших имён!"
  "1030":
    1: "Где Элис?\nЯ ведь прошу совсем немного — всего лишь похитить одну женщину.\nНеужели это так трудно?\nСоветую вам поторопиться."
  "1031":
    1: "Ах, для начинающих монахов вполне нормально спрашивать о пути к просветлению.\nЯ расскажу тебе об этом пути, хотя пройти его предстоит тебе самому.\nВ Барроу-Даунс находится целая серия курганов — один из которых был возведён на месте, обладающем огромной природной силой.\nВы узнаете нужный курган, потому что он отличается от остальных.\nДоберитесь до этого кургана и помедитируйте у воды, и ваше повышение до звания Посвящённого будет завершено."
  "1032":
    1: "[Бартоломью Хьюм связывается с вами мысленно] Поздравляю, юные ученики.\nВот мой последний урок, который я даю вам как монахам:\nпросветление достигается благодаря пути, а не конечной цели.\nВ данном случае конечная цель сыграла решающую роль, чтобы доказать, что вы способны пройти этот путь.\nТеперь я повышаю всех монахов до звания «Посвященных», а всех остальных — до звания «Почетных Посвященных» — поздравляю."
  "1033":
    1: "Ты ещё не завершил своё путешествие.\nВернись ко мне только тогда, когда выполнишь своё задание."
  "1034":
    1: "Я вижу, ты желаешь продолжить своё путешествие.\nПревосходно!\nНе бойся, ведь ты готов к следующему шагу.\nТебе предстоит уничтожить остатки злого ордена — Ордена Баа.\nПобеди их Верховного Жреца и вернись ко мне, и я завершу твоё обучение и присвою тебе звание Мастера."
  "1035":
    1: "Мне очень жаль, но я больше не имею права обучать тебя.\nТебе нужно будет найти нового Учителя, у которого ты сможешь учиться."
  "1036":
    1: "На твоём пути предстоит разветвление.\nЯ начну обучать тебя только после того, как ты выберешь более лёгкий путь."
  "1037":
    1: "Я не могу совершенствовать навыки, которых у вас ещё нет.\nСначала станьте крестоносцами, а уж потом приходите учиться злодейству."
  "1038":
    1: "Если вы хотите вступить в Гильдию Стихий, вам нужно обратиться ко мне.\nСтоимость вступления составляет 100 золотых монет.\nТолько члены гильдии могут приобретать заклинания из нашей обширной библиотеки.\nВ гильдии имеются заклинания всех четырёх стихийных дисциплин, и, как и у всех гильдий королевства, у нас есть два гильдейских зала.\nЧленство в одном из них автоматически означает членство и в другом."
  "1039":
    1: "Мой священный долг — принимать пожертвования в пользу Гильдии «Я».\nЕсли вы пожертвуете 100 золотых монет, мы предоставим вам статус члена гильдии.\nЧленам гильдии разрешается приобретать заклинания в любой Гильдии «Я» на всей территории королевства."
  "1040":
    1: "Воздух — это стихия, ради изучения которой волшебники и выбирают эту профессию!\nУ нас есть все лучшие заклинания — в том числе и великолепное заклинание «Полёт».\nНе упустите эту фантастическую возможность присоединиться к гильдии «Воздух»!\nВсего за 50 золотых!"
  "1041":
    1: "Членство в Гильдии Земли откроет вам доступ к нашей обширной библиотеке заклинаний стихии Земли.\nЭто членство действует во всех Гильдиях Земли на континенте Эратия.\nСтоимость вступления составляет всего 50 золотых монет."
  "1042":
    1: "Зачем быть сдержанным, если можно освоить магию Огня?\nВступление в нашу гильдию обойдется всего в 50 золотых за пожизненное членство."
  "1043":
    1: "Членство в Гильдии Воды дает вам право приобретать наши заклинания изменения и перемещения.\nВ мои обязанности входит набор новых членов и сбор с них членских взносов.\nСтоимость составляет 50 золотых, и в эту сумму входит членство во всех наших гильдейских залах."
  "1044":
    1: "Я — рекрутер гильдии «Гильдия Тела».\nМногие думают, что наши заклинания только исцеляют тело, но некоторые из них могут наносить урон и телам ваших противников.\nСтоимость — 50 золотых."
  "1045":
    1: "За 50 золотых можно стать членом Гильдии Разума.\nЗачем самому сражаться с монстром, если можно заставить его друзей сражаться за тебя?\nПо-моему, это как убить двух зайцев одним выстрелом.\nНу, что скажешь?"
  "1046":
    1: "Многие считают, что самая могущественная магия — это магия Света, магия Тьмы или что-то разрушительное, например, магия Огня.\nМы, члены гильдии «Дух», хотели бы отметить, что ни одна магия, кроме магии Света, не способна воскрешать мертвых, и даже в этом случае требуется мастерство уровня «Великий мастер» в данной стихии.\nЕсли вы хотите обрести власть над жизнью и смертью, выберите магию Духа.\nВступительный взнос составляет всего 50 золотых монет."
  "1047":
    1: "Магия Света — это самая могущественная магия, которой человек может владеть, не нанося ущерба своей душе.\nМы уверены, что наша плата за членство в гильдии в размере 1000 золотых монет является справедливой.\nВы не пожалеете о своём решении заняться магией Света."
  "1048":
    1: "Наконец-то у вас появилась возможность освоить магию Тьмы, вступив в Гильдию Тьмы.\nНе упустите этот шанс!\nМагия Тьмы — самая могущественная из всех.\nЧленство стоит всего 1000 золотых.\nВы знаете, что оно того стоит."
  "1049":
    1: "Вступите в Гильдию Стихий за 100 золотых"
  "1050":
    1: "Вступить в Гильдию Самости за 100 золотых"
  "1051":
    1: "Вступите в Гильдию воздушников за 50 золотых"
  "1052":
    1: "Вступите в Гильдию Земли за 50 золотых"
  "1053":
    1: "Вступите в Гильдию Огня за 50 золотых"
  "1054":
    1: "Вступите в Гильдию Воды за 50 золотых"
  "1055":
    1: "Вступите в Гильдию Тела за 50 золотых"
  "1056":
    1: "Вступите в Гильдию Ума за 50 золотых"
  "1057":
    1: "Вступите в гильдию «Дух» за 50 золотых"
  "1058":
    1: "Вступите в Гильдию Света за 1000 золотых"
  "1059":
    1: "Вступите в «Тёмную гильдию» за 1000 золотых"
  "1060":
    1: "Чтобы учиться здесь, вы должны быть членом этой гильдии"
  "1061":
    1: "Не в твоём состоянии!"
  "1062":
    1: "Вы уже состоите в этой гильдии."
  "1063":
    1: "У тебя не хватает золота!"
  "1064":
    1: "Прежде чем стать мастером этого навыка, необходимо достичь уровня эксперта!"
  "1065":
    1: "Прежде чем стать великим мастером этого навыка, необходимо достичь уровня мастера!"
  "1066":
    1: "Вы пока не отвечаете требованиям для обучения."
  "1067":
    1: "Вы уже достигли уровня эксперта в этом навыке."
  "1068":
    1: "Вы уже достигли уровня мастера в этом навыке."
  "1069":
    1: "Вы уже достигли уровня великого мастера в этом навыке."
  "1070":
    1: "Чтобы стать экспертом, сначала необходимо изучить сам навык!"
  "1071":
    1: "Отсутствующий текст 133"
  "1072":
    1: "Отличная работа.\nОрден Баа больше не будет осквернять земли Эратии.\nА теперь позвольте мне повысить всех Посвященных до звания Мастеров, а всех Почетных Посвященных — до звания Почетных Мастеров.\nПомните, что это лишь одна из остановки на пути к просветлению.\nВаш путь закончится только с вашей смертью — никогда не закрывайте свой разум."
  "1073":
    1: "Храм Баа по-прежнему стоит, а их Верховный жрец — жив.\nПока это не будет выполнено, ты не готов к званию Мастера.\nИди сейчас и не подведи."
  "1074":
    1: "Один из моих агентов прислал мне сообщение, которое нужно расшифровать.\nДля расшифровки необходимо знать, с каким словом из какой книги его сопоставить.\nЕсли ты хочешь стать ниндзя, тебе нужно сделать следующее: проникнуть в Школу волшебства и выяснить, каково третье слово в знаменитом «Свитке волн».\nИспользуй его для расшифровки сообщения, а затем выполни то, что в нём сказано.\nЭто ключ, позволяющий войти в Гробницу Мастера.\nГробницу ты найдёшь в Южной Эратии.\n[Стефан протягивает тебе клочок бумаги] Вот зашифрованное сообщение."
  "1075":
    1: "Амбиции — это хорошо, но я обучаю только опытных учеников.\nВернись, когда достигнешь статуса Посвященного, и, возможно, я буду тебя учить — ЕСЛИ у тебя будет правильный настрой.\nЕсли ты ищешь кого-то, кто готов помочь тебе стать Посвященным, возможно, тебе стоит начать с этого слабака Бартоломью Хьюма.\nУверен, он с удовольствием даст тебе начальное образование."
  "1076":
    1: "[Стефан Санд презрительно усмехается] И ТЫ хочешь, чтобы Я тебя чему-то научил?\nВы, эти плаксивые благодетели, заставляете мою руку с ножом дернуться!\nУбирайтесь с глаз долой, пока я не научил вас драться по-настоящему!"
  "1077":
    1: "Хотя ты и достиг статуса посвящённого, я не уверен, что ты сможешь вынести некоторые из моих наиболее радикальных учений.\nВернись ко мне, когда ты официально отвергнешь все философии, превращающие людей в слабаков и трусов."
  "1078":
    1: "Итак, у тебя есть ключ, но ты не выполнил указания из сообщения.\nПомни: гробница находится в Южной Эратии.\nВыполни задание и вернись ко мне, чтобы сообщить об успехе.\nЕсли не сможешь выполнить миссию, не стоит даже возвращаться ко мне.\nПровал — это жалко."
  "1079":
    1: "[Сэнд вздыхает] И снова ключ к шифру — это третье слово в первом абзаце «Свитка волн».\nТы найдёшь его где-то в Школе волшебства.\nМне всё равно, как ты туда проберёшься — убей всех, кто встанет у тебя на пути, или проникни незаметно.\nКак тебе удобнее.\nВажен только результат.\nВсё остальное — лишь оправдание личной слабости."
  "1080":
    1: "Отлично.\nС успехом не поспоришь, разве что защитники слабых и трусливых.\nНастоящим я повышаю всех Посвящённых до звания ниндзя, а всех непосвящённых — до звания почётных ниндзя.\nАх да, можешь оставить себе ту безделушку, которую украл из гробницы.\nВ конце концов, это было всего лишь учебное задание."
  "1081":
    1: "Несколько поколений назад алхимики в Туларейском лесу создали зачарованный лук, чтобы закрепить очередной мирный договор между эльфами и людьми.\nПо пути в Эратию лук был отобран у курьеров титанами в Авли.\nИм он ни к чему, так что, скорее всего, он до сих пор находится в их крепости.\nНанесите удар во имя нашей профессии и верните этот лук.\nЭто, без сомнения, лучшее изделие в своём роде, когда-либо созданное.\nАх да, и пока вы будете там, не стесняйтесь преподать этим хулиганам урок — они украли его из злобы, а не из нужды!\nЕсли вам удастся, я повышу всех боевых магов до звания мастеров-лучников или почетных мастеров-лучников, в зависимости от обстоятельств."
  "1082":
    1: "Итак, ты достиг звания «Боевой маг» и желаешь стать «Мастером-лучником»!\nДостойная цель, но я повышаю в звании только тех, чьё сердце и мужество соответствуют их мастерству.\nВернись ко мне, когда ты твёрдо присягнешь Свету.\nТогда я тебе помогу."
  "1083":
    1: "Ты выбрал путь Тьмы.\nЯ никогда не помогу тебе совершенствоваться, боясь, что ты используешь свои навыки для достижения своих эгоистичных целей!"
  "1084":
    1: "Если вы хотите стать мастерами-лучниками, вам нужно обратиться ко мне, но вы пришли слишком рано!\nЧтобы стать мастером, нужно иметь соответствующий опыт, а это значит, что сначала вам нужно стать боевым магом.\nВернитесь, когда будете готовы."
  "1085":
    1: "Ты нашёл лук!\nПозволь мне сделать несколько замеров и настроить его с учётом твоего индивидуального стиля стрельбы. Когда я закончу, ты сможешь оставить его себе и использовать для защиты земли и народа.\nЯ с радостью присваиваю всем боевым магам звание «Мастера-лучники», а всем почетным боевым магам — звание «Почетных мастеров-лучников»."
  "1086":
    1: "Не удалось добыть лук?\nЧто ж, не торопись и тщательно спланируй атаку на титанов.\nВ борьбе с такими могущественными противниками нет ничего постыдного в том, чтобы нанести удар и отступить.\nСделай всё необходимое, чтобы победить этих чудовищ."
  "1087":
    1: "[Хрип] Так вы думаете, что сможете стать боевыми магами, да?\nЭто не так просто.\nВы должны в равной степени владеть как магическими, так и физическими навыками.\nДля проверки этого существует испытание.\nОтправляйтесь в Шахты Красного Карлика.\nВнутри вы встретите два вида чудовищ: одних можно убить только магией, а других — только сталью.\nВ глубине нижней части рудников вы найдёте созданный гномами механизм, приводящий в действие лифт — единственный проход между верхней и нижней частями рудников.\nЧтобы удержать чудовищ в нижней части, вам придётся заменить ремень в механизме на этот — изношенный ремень, который продержится всего около часа, а потом порвётся.\nЭтого должно хватить, чтобы вы успели добраться до лифта и выбраться наружу, пока не оказались запертыми там, внизу.\nЗапечатайте этих существ и вернитесь ко мне — только тогда я назову вас Боевыми магами."
  "1088":
    1: "Отлично.\nВы прошли испытание.\nТеперь существа заперты и больше не смогут охотиться на гномов, а вы доказали своё мастерство как в магии, так и в обращении с оружием.\nЯ с гордостью объявляю всех лучников среди вас Боевыми магами, а всех остальных — Почётными Боевыми магами.\nПоздравляю!\nА теперь убирайтесь.\nЯ уже устал от вашей компании."
  "1089":
    1: "Ты ещё не взорвал машину.\nТы должен завершить это, прежде чем я повышу тебя до звания «Боевого мага»."
  "1090":
    1: "Стали амбициозными, да?\nДумаешь, сможешь заслужить звание снайпера?\nВозможно, и сможешь.\nВот что тебе нужно сделать:\nВ крепости Титанов находится совершенно особенный лук, который эльфы подарили людям в качестве жеста мира, чтобы уладить давно забытый конфликт.\n[Мастер Сник качает головой] Черт! От этих разговоров о мире у меня тошнота!\nВ любом случае, добудь этот лук ради блага нашей профессии, и я повышу тебя до звания снайпера.\n[Хех] вам лучше вести себя как снайперы, если вы надеетесь победить титанов.\nСражение лицом к лицу… или, вернее сказать, головой к колену, закончится для вас плохо."
  "1091":
    1: "Хочешь стать снайпером, да? Может быть.\nНо я сомневаюсь, что у тебя хватит на это духа.\nОно должно ссохнуться, как изюм, и стать твёрдым, как камень, чтобы ты смог делать то, что тебе предстоит.\nДокажи мне, что ты идёшь по Пути Тьмы, и тогда я буду учить тебя дальше."
  "1092":
    1: "Мы что, идем «Путем Света»?\nКак можно быть снайпером, если ты плачешь каждый раз, когда стреляешь кому-то в спину?\nМожет, тебе стоит попросить помощи у этого труса Лоуренса Марка?\nЯ точно не буду."
  "1093":
    1: "У тебя есть этот лук?!\nПревосходно!\nУже целые века никто не был достаточно смел, чтобы бросить вызов Титанам и попытаться вернуть этот лук!\nПозволь мне сделать несколько замеров и настроить его под твой индивидуальный стиль стрельбы.\nЯ горжусь тем, что именно я первым назвал всех Боевых магов среди вас Снайперами и объявил, что все Почетные Боевые маги являются Почетными Снайперами!\nДолжен признать, я не думал, что у тебя хватит сил добиться успеха.\nЯ рад, что ошибся."
  "1094":
    1: "Очередная неудача? [Мастер Сник зевает]\nКак неожиданно.\nСкажу проще: нет поклона — нет титула."
  "1095":
    1: "Так вы хотите стать чемпионами, да?\nХа!\nКак можно стать чемпионом, если не выигрываете ни одного турнира?\nЗнаете, я не могу просто так присвоить вам звание чемпионов — вам придётся добиться этого самим, как и всего остального.\nИдите и выиграйте пять чемпионатов на Арене на уровне «Рыцарь», а потом вернитесь ко мне.\nТогда я назову вас чемпионами, если хотите."
  "1096":
    1: "Я вижу, что вы очень хотите, чтобы вас называли «Чемпионами», но я не совсем уверен, стоит ли мне вам помогать.\nДокажите мне, что вы следуете Пути Света, и тогда мы поговорим о повышении."
  "1097":
    1: "Называть вас «чемпионами»?\nНи за что!\nЕдинственная причина, по которой я не порублю вас, злодеев, на куски, — это то, что вы пришли сюда мирно.\nУходите сейчас же, пока я не передумал и не избавил мир от ещё одной проблемы."
  "1098":
    1: "Если вы хотите стать «Чемпионами», обращайтесь ко мне.\nНо сначала вам нужно потренироваться.\nВернитесь ко мне, когда станете «Кавалерами».\nТогда, если у вас будет правильный настрой, я расскажу вам, что нужно сделать, чтобы стать «Чемпионами»."
  "1099":
    1: "Поздравляю вас с недавними победами в турнирах, друзья мои!\nС радостью объявляю «Кавалеров» среди вас чемпионами, а «Почетных кавалеров» — почетными чемпионами!\nВсегда сражайтесь за Свет, чемпионы!"
  "1100":
    1: "Ты ещё не выиграл 5 чемпионатов на Арене.\nВернись ко мне, когда выиграешь пять, и я повышу тебя в звании.\nПомни: эти сражения ДОЛЖНЫ проходить на уровне сложности «Рыцарь»."
  "1101":
    1: "Главная черта кавалера — отвага.\nЯ могу присвоить тебе звание кавалера, но прежде чем это сделать, тебе придётся доказать мне свою храбрость в бою.\nПоскольку в душе большинство людей — трусы, я сомневаюсь, что тебе это удастся.\nНо если хочешь попробовать, вот что тебе нужно сделать: уничтожить всех нежити в особняке с привидениями в Барроу-Даунс."
  "1102":
    1: "Так вы вернулись!\nИ, судя по выражению ваших лиц, я вижу, что вы справились с заданием.\nОтлично!\nНастоящим я официально повышаю всех рыцарей из вашей компании до звания кавалеров, а всех остальных — до звания почетных кавалеров.\nНосите свои звания с гордостью!"
  "1103":
    1: "Разве один маленький дом с привидениями заставил тебя сбежать в страхе?\nЯ видел шоколадные эклеры, у которых хлыба больше, чем у тебя!\nУбирайся отсюда и не возвращайся, пока не наберешься мужества!"
  "1104":
    1: "Так вы думаете, что сможете стать «Чёрными рыцарями», да?\nХорошо.\nЗнаете, я слышал, как многие говорили, что преступники — трусы.\nЭто просто неправда.\nНужно немало мужества, чтобы рисковать жизнью при ограблении или в бою.\nВы уже доказали, что вы смелые, и теперь пришло время применить эту смелость и свои навыки на практике.\nЯ хочу, чтобы вы ограбили эльфийскую сокровищницу.\nЭто одно из самых больших сокровищ в стране, и оно очень хорошо охраняется.\nСовершите это дело и сбегите с добычей.\nВернитесь ко мне, когда закончите.\nТогда я повышу вас до звания «Чёрных рыцарей»."
  "1105":
    1: "Это правда, что именно ко мне ты обращаешься, когда хочешь получить звание «Чёрного рыцаря».\nНо как ты можешь стать «Чёрным рыцарем», если даже не определился, злой ты или нет?\nВернись ко мне, когда полностью посвятишь себя Тьме.\nТолько тогда я возобновлю твоё обучение."
  "1106":
    1: "Фу!\nВы, эти «благодетели», ни на что не годитесь!\nМне больше нечего вас учить!"
  "1107":
    1: "ОТЛИЧНО!\nЭто ограбление прошло блестяще!\nЯ очень горжусь вами.\nОставьте добычу себе — это ваша награда за отлично выполненную работу.\nМогу с уверенностью сказать, что те из вас, кто был «Кавалерами», сегодня стали «Чёрными рыцарями», а остальным я присвою звание «Почётного чёрного рыцаря».\nВы отлично справились, мои ученики!"
  "1108":
    1: "Ограбление не завершено?\nНет.\nНе приходи ко мне и не сообщай о провале.\nНе приходи и не говори мне, что у тебя сдала нервы.\nИди туда и ограбь казну!\nПровал — не вариант!"
  "1109":
    1: "Что ж, похоже, ты вполне сможешь справиться с той задачей, которую я тебе приготовил.\nГлавная задача Лорда-следопыта — заботиться о земле.\nНедавно браконьеры похитили из Туларийского леса магический драгоценный камень, называемый «сердцем леса».\nЛес взбунтовался и нападает на путешественников, которые подходят слишком близко.\nЛес винит всех «Следопытов» в краже и не успокоится, пока камень не будет возвращён.\nНайди камень и верни его самому старому дереву в лесу.\nВернись ко мне, когда справишься с этой задачей."
  "1110":
    1: "Я хотел бы стать твоим учителем — действительно хотел бы, но не уверен, что ты создан для того, чтобы стать Лордом-следопытом.\nВскоре тебе предстоит принять решение, исходящее из сердца.\nЕсли ты выберешь Путь Света, вернись ко мне.\nДля меня будет честью стать твоим учителем."
  "1111":
    1: "[Лисандр мягко улыбается и качает головой] Ещё рано, нетерпеливые.\nЯ обучаю только самых опытных учеников.\nВозвращайтесь, когда получите звание охотника."
  "1112":
    1: "[Лисандр хмурится] Вы выбрали путь тьмы.\nЯ отказываюсь учить таких, как вы — вы только воспользуетесь моими уроками для достижения своих корыстных целей.\nДа помилует Небеса ваши души."
  "1113":
    1: "Если не знаешь, с чего начать, попробуй найти самое старое дерево в лесу.\nОно должно быть где-то за пределами Пирпонта, в Авли.\nСамое старое дерево умеет говорить и, возможно, знает что-то полезное.\nОно с радостью расскажет тебе всё, что ты хочешь услышать, и даже гораздо больше.\nУвидишь."
  "1114":
    1: "Что ж, ты поговорил с деревом и теперь знаешь о краже не меньше, чем я.\nЕсли тебе удастся найти камень, отнеси его прямо к дереву, а потом приходи ко мне."
  "1115":
    1: "Вы поступили правильно, вернув Сердце.\nТеперь в лесу стало тише, и он больше не нападает на путешественников.\nВы, вероятно, спасли много жизней.\nЗа заслуги перед Землёй и Светом я настоящим присваиваю всем Охотникам среди вас звание Лордов-следопытов, а всем почетным Охотникам — звание почетных Лордов-следопытов!"
  "1116":
    1: "Думаешь, сможешь стать лучше?\nУ меня для тебя есть испытание.\nОхотник должен хорошо знать лес и владеть магией не хуже, чем мечом.\nЛучшие учителя в этом деле — феи.\nВ Северном Авли есть феерический холм.\nРазберитесь, как туда попасть, и феи наделят магией настоящих следопытов из вашей компании, то есть они получат звание охотников.\nОстальные станут почетными охотниками."
  "1117":
    1: "Феи вас одурачили? [Эбеднезер хихикает, а потом начинает хохотать во весь голос над собственной остротой] Одурачили?\nФеи?\nХа-ха-ха!\nПоняли?\n«Одурачили»… ну, знаете… а-а-ахаха.\nНаверное, нет.\nЛадно, я вам уже рассказал, как стать Охотниками.\nЗайдите в Феерический курган в Авли.\nА теперь перестаньте меня беспокоить!"
  "1118":
    1: "Лучше быть охотником за головами, чем обычным охотником, да?\nНу, это испытание даже проще, чем идея с «Фери-Маунд», и тебе не придётся так сильно ломать голову.\nЗамечали ли вы, что в мэриях всегда ищут кого-нибудь, кто бы убил для них монстра?\nВсё, что вам нужно сделать, — это собрать 10 000 в виде вознаграждений от мэрий.\nКогда вы это сделаете, вернитесь ко мне, и я повышу вас до звания охотника за головами."
  "1119":
    1: "Буду откровенен.\nПохоже, ты мне не нравишься.\nТебе придётся доказать мне, что ты чего-то стоишь.\nВскоре тебе предстоит выбрать: пойдёшь ли ты по Пути Тьмы или по Пути Света.\nЕсли выберешь Свет, даже не пытайся со мной больше разговаривать.\nПонял?"
  "1120":
    1: "Фууу!\nОт тебя просто веет самодовольством!\nУбирайся от меня!\nДавай, убирайся!"
  "1121":
    1: "Ну и как это было?\nВсе эти убийства?\nМммм.\nХех.\nВы прошли испытание, друзья мои.\nВы определённо прошли испытание.\nВсе «Охотники» среди вас теперь — «Охотники за головами», а все «Почётные охотники» — «Почётные охотники за головами»!\nОтлично поработали."
  "1122":
    1: "Пока что нет, этого недостаточно!\nТебе нужно собрать больше наград и, что ещё важнее, убить больше существ.\nВ этом есть своя изюминка.\nУбивать — ну ты же знаешь."
  "1123":
    1: "Пришёл ко мне в поисках волшебства?\nОно всегда было у тебя, если бы ты знал, где его искать.\nНекоторым я говорю об этом, но они по-прежнему не могут этого увидеть, хотя это очевидно, как нос у них на лице.\nТе из вас, кто раньше были простыми следопытами, теперь стали Охотниками, а те, кто ими не был, — лишь Почётными Охотниками.\nУмны те, кто способен постучаться в мою дверь!"
  "1124":
    1: "Воры добрались до самой моей сердцевины и забрали Сердце.\nВиноградные лозы шепчут, что они прячутся в Гильдии наёмников в Таталии.\nМы бы их схватили, да ветвями туда не дотянуться.\nХодоков могут поймать только другие Ходоки.\nПоймайте их для нас.\nЛадно?"
  "1125":
    1: "А-а-ах!\n[Дерево радостно вздыхает.]\nВы принесли Сердце!\nЛес поёт от радости!\nСегодня ночью мы запоём песню предков.\nОстанетесь спеть с нами?"
  "1126":
    1: "Ох, лес всё ещё очень зол.\nЛозы шепчут, что воры так и не покинули укрытие.\nВы ведь поймаете их для нас?"
  "1127":
    1: "Священники.\nВы пришли ко мне, чтобы я стал вашим проводником на Пути Света.\nНо имейте в виду: чтобы познать его пути, вам нужно познать пути собственной души.\nЯ бы предложил нам немного помедитировать над этим, но вы, похоже, торопитесь.\nК югу от Бракады находится остров под названием Эвенморн, и на этом острове стоят старинные храмы Солнца и Луны.\nВ обоих обитают остатки двух религий: их некогда величественные церкви превратились в два старых храма, борющихся за небольшой остров. Церковь Солнца была прародительницей нашей нынешней веры — Пути Света.\nЯ предлагаю помочь им и склонить чашу весов в пользу Церкви Солнца.\nИспользуя карту, которую Дедал Фальк поручил вам найти, чтобы стать священниками, убедите морского капитана доставить вас на остров.\nТам окажите помощь и поддержку Церкви Солнца, очистив алтарь в Церкви Луны.\nЭто настолько ослабит культ Луны, что Церковь Солнца сможет одержать над ним победу в сражении.\nВернитесь ко мне, когда выполните это задание."
  "1128":
    1: "Если ты желаешь идти по Пути Света, сначала тебе нужно официально сделать свой выбор.\nВскоре тебе предстоит сделать этот выбор, и путь станет ясным.\nДо тех пор я не могу быть твоим проводником."
  "1129":
    1: "Если вы хотите стать Священниками Света, вам сначала нужно стать священниками.\nУ меня нет времени обучать священников, но у моего заклятого соперника, Дэдала Фалька, оно есть.\nНе беспокойтесь, он будет продвигать вас по службе справедливо, даже если вы не захотите пойти по страшному пути тьмы, который он олицетворяет."
  "1130":
    1: "Если ты хочешь получить повышение выше звания священника, то обратился не к тому человеку.\nЯ прекрасно знаю о твоём решении встать на Путь Тьмы и не хочу иметь с тобой ничего общего."
  "1131":
    1: "Ваша отвага внесла огромный вклад в укрепление нашей веры, Священники.\nС радостью в сердце я объявляю о повышении всех Священников до звания Священников Света, а всех почетных Священников — до звания Почетных Священников Света.\nОгромное спасибо за вашу помощь!"
  "1132":
    1: "Вы должны посетить остров Эвенморн и очистить Алтарь Тьмы в Церкви Луны.\nТолько тогда я смогу повысить вас до звания Священников Света."
  "1133":
    1: "[Фальк улыбается вам по-дедовски.] Хотите стать священниками? Я могу вам помочь, если вы окажете мне одну услугу.\nНа острове к югу от Бракады стоит старый храм. Мне нужно отыскать его снова. Думаю, пираты, что промышляют у берегов Таталии, к западу от Эратии, знают, где этот остров. Флот Эратии так и не сумел выбить их из Пещер Приливной воды.\nВозможно, у пиратов есть карта острова. Принесите её мне, и я возведу вас в сан священников."
  "1134":
    1: "Карта! Вы нашли её!\n[Фальк разворачивает карту и указывает на остров.] Вот он. Остров окутан туманом с тех пор, как больше века назад началась война между Церквями Солнца и Луны. Теперь я знаю, где его искать.\nС радостью объявляю: отныне клирики среди вас становятся священниками, а остальные получают звание почётных священников. Благодарю вас за помощь!"
  "1135":
    1: "Если у пиратов есть карта острова, ищите её в Пещерах Приливной воды в Таталии.\nПринесите мне карту, и я с радостью возведу вас в сан священников."
  "1136":
    1: "Священники.\n[Фальк холодно смотрит на тебя] Хорошо, что ты пришёл, чтобы проникнуться мудростью Пути Тьмы.\nНикогда не сожалей о своём решении и никогда не оглядывайся назад.\nК югу от Бракады находится остров под названием Эвенморн, и на этом острове стоят старинные храмы Солнца и Луны.\nВ обоих обитают остатки приверженцев этих двух религий; их некогда величественные церкви превратились в два старых храма, борющихся за небольшой остров. Церковь Луны была прародительницей нашей нынешней веры — Пути Тьмы.\nЯ предлагаю помочь им и склонить чашу весов в пользу Церкви Луны.\nВоспользуйтесь картой, которую я послал вам, чтобы найти остров, и убедите морского капитана доставить вас туда.\nТам окажите помощь и поддержку Церкви Луны, осквернив алтарь в Церкви Солнца.\nЭто настолько ослабит культ Солнца, что Церковь Луны сможет одержать над ним победу в сражении.\nВернитесь ко мне, когда выполните это задание."
  "1137":
    1: "Если ты желаешь идти по Пути Тьмы, сначала тебе нужно официально сделать свой выбор.\nВскоре тебе предстоит сделать этот выбор, и путь станет ясным.\nДо тех пор я не могу быть твоим проводником."
  "1138":
    1: "Вы должны посетить остров Эвенморн и осквернить Алтарь Света в Церкви Солнца.\nТолько тогда я смогу повысить вас до звания Священников Тьмы."
  "1139":
    1: "Если вы хотите стать Волшебниками, то вам действительно нужно обратиться ко мне.\nКаждый мой ученик должен выполнить проект, прежде чем я присвою ему звание Волшебника.\nВ этом году проект заключается в создании голема.\nЗапасные части разбросаны по всей местности отсюда до Авли.\nВам понадобятся все четыре конечности, а также туловище и голова.\nОбратите особое внимание на то, где вы найдёте голову — один из моих учеников прошлым летом допустил ошибку при изготовлении головы и в шутку отдал бракованную голову кому-то.\nКогда у вас будут все детали, приходите ко мне.\nТогда я присвою вам звание Волшебников и оживлю вашего голема.\nНу, в путь, и удачи!"
  "1140":
    1: "[Вы с гордостью демонстрируете мастеру Грей своего собранного голема, и он одобрительно кивает] Отлично.\nГолова выглядит неплохо, но уверенности в этом быть не может… Ну, в общем, хорошая работа!\nОчевидно, вы заслужили звание волшебника.\nВсе колдуны среди вас теперь — волшебники, а все, кто не является колдуном, — почетные волшебники!\n[Мастер Грей некоторое время произносит заклинание, оживляющее вашего голема] Он весь ваш!\nЗаберите его в свой замок и поставьте там, где захотите.\nОн будет безжалостно атаковать вторгшихся."
  "1141":
    1: "С возвращением, ученики.\nУрок по големам был всего лишь упражнением, но чтобы достичь звания архимага Света, вам действительно нужно сделать что-то полезное для профессии.\nКопии легендарного заклинания «Божественное вмешательство» встречаются крайне редко, и, к сожалению, в Школе его нет.\nС этим заклинанием связана целая история неудач. Оно существует с незапамятных времён, но так и не попало в наши руки.\nОно всегда остаётся вне досягаемости, и мы часто отправляем членов гильдии на его поиски, но все попытки заканчиваются неудачей.\nИногда они уже держат его в руках, но теряют по дороге обратно; в других случаях книга как будто исчезает, чтобы вновь появиться спустя 20 лет в каком-нибудь старом подземелье или на необитаемом острове.\nСейчас мы полагаем, что оно находится в зоне разведения в Яме.\nНайди заклинание и вернись с ним.\nСними проклятие!"
  "1142":
    1: "Обучение на архимага Света доступно только тем, кто посвятил себя Пути Света.\nДокажи мне, что ты выбрал верный путь, и я с гордостью стану твоим учителем."
  "1143":
    1: "Вы выбрали Тьму, мои ученики.\nЯ больше не буду вас учить."
  "1144":
    1: "Книга!\nКнига!\n[Мастер Грей зажимает уши и радостно кружится на месте] Вы справились!\nО, какой чудесный день!\nЯ так вами горжусь!\nВы все — архимаги Света!\nКонечно, если вы изначально не были волшебниками, это всего лишь почетное звание, но какая разница?\nВы нашли книгу!\n[Мастер кладёт книгу на стол рядом с пустым альбомом.\nОбе книги открываются одновременно, и с письменного стола поднимается перо, чтобы начать переписывать текст в новый альбом] Вы можете оставить себе эту копию, и вскоре вы увидите ещё больше экземпляров в гильдиях Света в Бракаде и Селесте."
  "1145":
    1: "Полагаю, что найти эту книгу будет непросто, поэтому и поручаю тебе это задание.\nЯ уверен, что ты справишься с этой миссией.\nНе сдавайся!"
  "1146":
    1: "Не боишься смерти?\nЯ могу провести ритуал над любым волшебником.\nТебе понадобится сосуд для души.\nМного лет назад волшебники похитили партию сосудов, которые везли из Найгона в Дейю.\nЭти сосуды очень трудно уничтожить, поэтому они их спрятали, полагая, что мы никогда их не найдём. К счастью для нас, мёртвые действительно рассказывают истории.\nБолее того, даже лучше, чем живые — мертвые никогда не забывают, никогда не отказываются говорить и никогда не лгут.\nИтак, мы нашли того, кто закопал сосуды, и заставили его умереть.\nПосле смерти он оказался весьма сговорчивым и рассказал, что спрятал их где-то в Стенах Тумана для волшебников из Селесты. Доставьте эти сосуды, и я проведу Ритуал над всеми волшебниками среди вас.\nОстальные могут стать Почётными Личами — насколько это имеет значение — в благодарность за то, что нашли для нас дополнительные сосуды."
  "1147":
    1: "Если вы ещё даже не стали волшебниками, то вы ещё не готовы стать личами.\nНе беспокойте меня, пока не будете готовы."
  "1148":
    1: "Только последователи Тёмного Пути могут стать личами.\nТы ещё не выбрал свой путь.\nВернись, когда выберешь Тьму."
  "1149":
    1: "Выбрав Путь Света, вы не можете стать личами.\nРитуал отвергнет вас, и вы умрете настоящей смертью.\nЕсли это именно то, чего вы хотите, то вам, безусловно, не нужна моя помощь…"
  "1150":
    1: "Кувшины.\nДаааа.\nВы нам очень помогли.\nА теперь — ритуал.\n[Лич достаёт нож и подходит к вам]\nЭто совсем не больно!\n[На самом деле ритуал довольно болезненный и длится несколько часов.\nКогда он заканчивается, Лич снова говорит]\nИтак, всё готово.\nТе из вас, кто были волшебниками, теперь, без сомнения, стали Личами.\nТе, кто ими не был, заслуживают моей благодарности за возвращение сосудов, и я буду называть вас «Почётными Личами».\nПомните: Личи должны всегда держать свои Сосуды Душ при себе во время путешествий.\nВы не можете надолго расставаться со своим Сосудом, иначе вас ждёт настоящая смерть."
  "1151":
    1: "У меня нет запасных кувшинов, чтобы провести ритуал.\nЯ не могу повысить вас в звании, пока вы не вернётесь с кувшинами.\nПомните: чтобы получить повышение, у каждого из вас должен быть свой кувшин."
  "1152":
    1: "Прохождение уровня друида довольно просто.\nТебе нужно посетить три древних храма природы, которые мы возвели много веков назад, и помолиться в их центре.\nОни находятся в Таталии, на острове Эвенморн и в Авли, и выглядят как каменные круги с водным алтарем в центре.\nГде именно — я не скажу, но исследование окрестностей этих мест — часть процесса.\nКогда ты посетишь все три круга, вернись ко мне и подробно расскажи о своих впечатлениях."
  "1153":
    1: "Посетите «Круги», а затем вернитесь ко мне.\nВот в чём заключается весь процесс."
  "1154":
    1: "Ты нашёл круг!\nОтлично, но тебе нужно найти все три, прежде чем ты будешь готов к повышению.\nПомни: найди три круга, а потом вернись ко мне."
  "1155":
    1: "Мне достаточно взглянуть в твои глаза, чтобы понять, где ты побывал.\nТы видел круги, и они оставили на тебе свой отпечаток.\nОбъявить, что все друиды среди вас теперь являются Великими друидами, — это лишь формальность.\nОбъявить остальным из вас, что вы теперь являетесь почётными великими друидами, — это проявление уважения к тому уважению, которое вы проявили ко мне и моей вере."
  "1156":
    1: "Чтобы получить звание архидруида, ты должен служить этой земле.\nЯ знаю, какую услугу ты мог бы оказать.\nВ землях к северу от Каменного города, где гномы хоронят своих мёртвых, находится курган короля Зокарра IV.\nОн погиб, защищая Каменный город во время вторжения Нигона в Эратию.\nЕго останки так и не были найдены и до сих пор лежат в тех туннелях.\n\nИзвлеките его кости и поместите их в гроб в его кургане.\nКогда вы это сделаете, король обретёт покой, и земля тоже обретёт покой.\nВернитесь ко мне, когда выполните эту службу, и я проведу Церемонию Вознесения и присвою вам звание архидруидов."
  "1157":
    1: "Я посвятил себя служению Свету.\nЯ не буду продвигать тебя дальше, пока ты не станешь таким же преданным, как я.\nВернись ко мне, когда выберешь Свет."
  "1158":
    1: "Слуги тьмы, простите, что я ранее возвысил вас.\nМне стыдно, что я не заметил тьму в ваших душах, пока не стало слишком поздно.\nОставьте меня."
  "1159":
    1: "[Мастер Грин, кажется, вне себя от радости по поводу вашего достижения] Я почувствовал, как душа Короля вернулась в царство мёртвых, когда вы вернули его кости.\nЗемля вздохнула с облегчением — вы это почувствовали?\nЦеремония Вознесения завершена.\nЯ с радостью повышаю всех Великих друидов из вашего числа до звания Архидруидов, а всех почетных Великих друидов — до звания Почетных Архидруидов.\nЭто очень счастливый день!\nВаши заслуги останутся в памяти!"
  "1160":
    1: "Это задание не из лёгких, но его необходимо выполнить.\nПомните: вам нужно перенести останки короля Зокарра IV из туннелей между Каменным Городом и Найгоном в гроб Зокарра, находящийся в тайном гробнице гномов.\nТолько тогда я смогу провести Церемонию Вознесения и повысить вас в звании."
  "1161":
    1: "Для одних стать чернокнижником — дело несложное, а для других — практически невозможное.\nВам нужно найти фамилиара, подходящего к вашему характеру.\nФамилиар поможет сфокусировать ваши магические способности и обострить концентрацию.\nИногда одним фамилиаром могут пользоваться несколько человек, а иногда — нет.\nМагические эффекты не заметит никто, кроме Великого Друида — того, кто уже находится в гармонии с природой.\nИтак, давайте посмотрим, какой фамильяр вам понадобится... [Тор берет искусно вырезанный драгоценный камень и пристально смотрит на вас сквозь него.\nОн хмурится.]\nХм.\nЧто ж, хорошая новость в том, что вам всем нужен один и тот же фамильяр, и когда вы его найдете, вы станете очень сильными.\nПлохая новость в том, что вам нужно найти дракона в качестве фамильяра.\nВы должны найти яйцо дракона.\nПринесите его сюда, и я выведу из него дракончика и наложу заклинание на фамилиара.\nДраконёнок привяжется ко всем вам, а вы — к нему.\nВозможно, вы сможете найти яйцо в пещере дракона в Стране Гигантов.\nНо остерегайтесь матери."
  "1162":
    1: "Я с удовольствием помог бы вам встать на путь становления чернокнижниками, но ничто из того, что я могу для вас сделать, не принесёт вам пользы, пока вы не станете Великими друидами.\nВернитесь, когда достигнете этого уровня понимания."
  "1163":
    1: "Хотя мне и нравится думать о чернокнижниках как о последователях Пути Сумерек или Рассвета, с технической точки зрения мы являемся последователями Пути Тьмы.\nВы должны стать преданными последователями Тьмы, прежде чем я смогу вам помочь."
  "1164":
    1: "Хм...\n[Тор внимательно смотрит на тебя]\nНет.\nЯ не могу тебя научить.\nТы выбрал Путь Света.\nЯ чувствую это в тебе.\nЯ понимаю твой выбор, но знаю, что ни одно из наших заклинаний или ритуалов не поможет тебе, раз ты уже вступил на этот путь.\nИзвини."
  "1165":
    1: "[Тор с изумлением смотрит на тебя] Ты действительно нашёл яйцо дракона!\nУже больше века ни один чернокнижник не нуждался в драконе-фамильяре и не находил его!\nЭто, без сомнения, войдёт в историю!\nМоя книга заклинаний!\nМне нужна моя книга!\nА, вот она.\n[Тор произносит заклинание из книги, а затем трижды стучит по яйцу.\nЯйцо раскрывается, и из скорлупы выползает маленький дракончик]\nВот ты где!\nОй, разве он не милый?\nПоздравляю!\nТеперь вы уже не просто Великие Друиды, а чернокнижники!\nКонечно, это всего лишь почетный титул, если вы изначально не были Великим Друидом по природе, но, тем не менее, этим стоит гордиться."
  "1166":
    1: "Тебе нужно принести мне драконье яйцо, чтобы я мог вывести твоего фамилиара.\nДругого выхода нет.\nПопробуй поискать пещеру дракона в Стране гигантов — возможно, там ты найдешь яйцо."
  "1167":
    1: "Подготовьте корпус к сборке с остальными деталями."
  "1168":
    1: "Подготовьте левую ножку к сборке с остальными деталями."
  "1169":
    1: "Подготовьте правую ножку к сборке с остальными деталями."
  "1170":
    1: "Подготовьте левую руку к сборке с остальными деталями."
  "1171":
    1: "Подготовьте правую руку к сборке с остальными деталями."
  "1172":
    1: "Подготовьте головку к сборке с остальными деталями."
  "1173":
    1: "Подготовьте головку (с вмятиной) к сборке с остальными деталями."
  "1174":
    1: "Пока вам не нужно собирать никаких деталей."
  "1175":
    1: "Вы собрали все детали!\nТеперь осталось только вернуться к Мастеру Грей для прохождения процесса анимации."
  "1176":
    1: "Снимите исправную головку и замените её помятой."
  "1177":
    1: "Снимите помятую головку и замените её на исправную."
  "1178":
    1: "Вы не должны читать это сообщение.\nЭто означает, что вы каким-то образом вызвали это событие, не держа в руках головы голема «нормального» или «нормального Эбби», что, исходя из условий данного события, абсолютно невозможно.\nПожалуйста, передайте Брайану, что он проиграл пари и должен Киту 5 баксов, поскольку это событие работает некорректно."
  "1179":
    1: "Слава небесам, вы их вычистили!\nТеперь нам нужно найти способ привести замок в порядок и восстановить поврежденные участки.\nЕдинственные, кто, на мой взгляд, мог бы взяться за это и способен это сделать, — это гномы из Каменного города, расположенного в Барроу-Даунс к югу отсюда.\nВход в Каменный город находится в центре Барроу-Даунс, на одном из самых больших холмов."
  "1180":
    1: "Боюсь, что с этими гоблинами переговоры не принесут результата, милорды.\nМогу ли я предложить прибегнуть к силе?"
  "1181":
    1: "Итак… Передо мной стоят новые правители Хармондэйла.\nНе впечатляет.\nСомневаюсь, что другие короли тоже вас высоко ценят.\nХм.\nСкорее всего, вас скоро убьют.\nНо, возможно, здесь есть нечто большее, чем кажется на первый взгляд.\nДа.\nМожет быть, вы сможете что-то сделать для меня, а я — для вас.\nМедузы захватили мои шахты в восточной Бракаде.\nПревратили нескольких моих людей в камень.\nОпасные чудовища, не хочу терять ещё больше жизней при спасательной операции.\nХотя вашу жизнь потерять не жалко.\nВозьмите этот эликсир и вылейте его на статуи.\nРазбудите их.\nТогда я отремонтирую ваш замок.\nИ вы заслужите моё уважение.\nИдите сейчас и остерегайтесь грифонов в Бракаде."
  "1182":
    1: "С возвращением, лорды Хармондэйла!\nТеперь я вам помогу.\nМой инженер будет работать на вас.\nПриведите ваш замок в порядок.\nЯ вам благодарен.\nВы всегда будете здесь желанными гостями. Хм.\nЕщё одно.\nВаша деятельность заинтересовала другие дворы.\nТеперь они пошлют к вам послов — загляните в тронный зал.\nБудьте осторожны, друзья мои."
  "1183":
    1: "Опять вернулся, да?\nТы ещё не выполнил свою часть сделки.\nПомощь не получишь, пока не закончишь."
  "1184":
    1: "Ваша королева желает поговорить с вами как можно скорее.\nПосле войны она поселилась в замке Грифонхарт в Стидвике.\nЭто исключительно по делам — всякий раз, когда новые лорды вступают в должность, она встречается с ними, чтобы избежать недоразумений.\nКоролева Кэтрин проявляет к вам особый интерес и сообщила мне, что хотела бы воспользоваться вашими услугами."
  "1185":
    1: "Мне сообщили, что вы встретились с королевой.\nНадеюсь, всё прошло хорошо."
  "1186":
    1: "Королева очень вами довольна!\nОперация по спасению прошла успешно, и Лорен больше не может служить заложницей в руках того злобного короля Парсона!\nКогда нынешний конфликт в Хармондэйле закончится, я уверен, что королева вознаградит вас за вашу помощь."
  "1187":
    1: "Королева сказала мне, что ваша преданность очень сильна.\nВы поступили правильно, сообщив королеве о предательстве, которое замышлял король Парсон.\nИ я скажу вам следующее:\nВаша преданность не только сильна, но и оправдана.\nХармондейл — законная провинция Эратии, несмотря на утверждения эльфов об обратном.\nВаша работа на благо нас помогает обеспечить, чтобы Хармондейл навсегда оставался в руках людей."
  "1188":
    1: "[Леди Эллен восторженно ахает] У вас есть «Труба Грифонхарта»!\nЭто просто чудесно!\nКогда она исчезла из сейфа, мы подумали, что её украл враг!\nСпасибо, что вернули её нам!"
  "1189":
    1: "Труба Грифонхарта, без сомнения, была похищена эльфийским отрядом набега.\nВы опоздали, чтобы спасти её.\n[Леди Эллен вздыхает] Ну, это плохо, но, полагаю, мы переживали и гораздо худшие бедствия."
  "1190":
    1: "Я узнала от королевы Кэтрин, что вы предали нас, применив старый трюк с подставным пленником.\n[Леди Эллен почтительно реверансирует] Ваше мастерство в искусстве обмана поистине впечатляет.\nЯ постараюсь больше не даться так легко обмануть вашей искренностью."
  "1191":
    1: "Хотя Авли в настоящее время не управляет Хармондэйлом, мой король, Элдрич Парсон из Авли, заявляет права на эту территорию как на наше законное владение.\nПричины сложны, но сводятся к простому факту: много лет назад Эратия отняла у нас эти земли во время Лесных войн, и мы не сдадимся, пока не вернём их обратно.\nМой король желает поговорить с вами.\nПожалуйста, отправляйтесь в Пирпонт в Туларейском лесу и встретьтесь с ним.\nМы вознаградим вас за это."
  "1192":
    1: "Посланцы сообщили мне о вашей встрече с моим королём.\nНадеюсь, теперь вы понимаете, почему именно мы являемся законными правителями Хармондэйла."
  "1193":
    1: "Я слышал о вашем смелом проникновении в форт Риверстрайд, и я впечатлён!\nНаши стратеги сейчас анализируют планы и утверждают, что эта информация будет очень полезна при любом наступлении на форт.\nАвли выражает вам свою благодарность!"
  "1194":
    1: "Из двора доносится, что вы отклонили просьбу Эратии о побеге из тюрьмы того шпиона, Лорена Стила.\nБолее того, вы помогли нам подсадить туда ложного заключённого, который с самого момента поступления туда снабжает их ложной информацией.\nАвли в вашем долгу!"
  "1195":
    1: "У вас есть «Труба Грифонхарта»!\nОтлично!\nМы потеряли её из виду во время рейда и боялись, что один из эратианцев унес её с собой.\nБольшое спасибо за помощь!"
  "1196":
    1: "Похоже, наш рейд на эратианцев закончился неудачей, и они — или кто-то другой — унесли с собой Трубу.\n[Посол Ален печально качает головой] Может быть, в следующий раз нам повезёт."
  "1197":
    1: "Я получил предупреждение от своего начальства по поводу того, что вы передали поддельные планы из Эратии.\nКороль не в восторге. Кроме того, возникли опасения, что вы готовили для нас ещё какие-то предательские уловки.\n[Ален улыбается, как и подобает его профессии] В любви и на войне все средства хороши, так что это уже в прошлом, да?\nДа, всё забыто.\n[Посол от души хихикает]."
  "1198":
    1: "[Королева Кэтрин величественно склоняет голову] Я вижу, вы — те самые, кто выиграл этот нелепый конкурс лорда Маркхэма.\nДолжна признать, я не особо в вас верила, пока Король Гномов не признал вас законными правителями Хармондэйла.\nВы, должно быть, сделали что-то, чтобы завоевать его уважение, иначе он бы с вами и не стал иметь ничего общего.\nЯ до сих пор не уверена, что он в вас увидел, но, возможно, в этом действительно есть что-то существенное.\nПосмотрим. Может быть, вы сможете сделать для меня что-то, что заставит меня подумать, что вам стоит оставить свои новые титулы.\nНедавно один из моих ценных… агентов был арестован в Туларейском лесу просто за то, что выполнял свою работу.\nЕго держат в пещере где-то за пределами Пирпонта.\nЕго зовут Лорен Стил, и ему угрожают казнью, если через 28 дней не будут выполнены определённые неприемлемые условия.\nВернитесь с ним до истечения этого срока, и вы завоюете уважение, золото и благодарность."
  "1199":
    1: "[Кэтрин встаёт и улыбается] Отлично сработано!\nТы действительно выручил меня из ужасной затруднительной ситуации.\n[Кэтрин поворачивается к Лорену и пожимает ему руку] Лорен.\nРада наконец-то с тобой познакомиться.\nПоскольку теперь все знают, кто вы такой, вы мне не особо пригодны в качестве шпиона, но я хотела бы предложить вам работу в Королевском дипломатическом корпусе.\nПожалуйста, подумайте над этим.\nЧто касается наших героев, я благодарю вас.\nМой казначей перечислит на ваш банковский счёт 5000 золотых монет за ваши услуги."
  "1200":
    1: "Жизнь Лорена висит на волоске.\nЯ не могу пойти на уступки эльфам, иначе погибнет ещё много людей.\nПожалуйста, поторопитесь.\nУверен, что Авли казнит его в назначенный срок."
  "1201":
    1: "[Кэтрин встаёт и улыбается] Молодец!\nТы действительно выручил меня из ужасной затруднительной ситуации.\n[Кэтрин поворачивается к поддельному Лорену и пожимает ему руку] Лорен.\nРада наконец-то с тобой познакомиться.\nПоскольку теперь все знают, кто ты такой, ты мне не особо пригодишься в качестве шпиона, но я хотела бы предложить тебе работу в Королевском дипломатическом корпусе.\nПожалуйста, подумай над этим.\nЧто касается наших героев, я благодарна вам."
  "1202":
    1: "[Королева прищуривает глаза] Что это значит?\nТы признаёшься в предательстве?\nКак благородно.\nСтража!\nОтрежьте им головы!"
  "1203":
    1: "Король Парсон попросил вас украсть план форта Риверстрайд?\nХм.\n[Кэтрин обращается к одному из своих советников] Пусть подготовят поддельные планы форта Риверстрайд.\nПусть это будет мучительно.\n[Она снова обращается к вам] Если он хочет планы, то планы он и получит.\nОтдайте эти планы королю.\nУверена, он будет вам благодарен.\nПостарайтесь, чтобы он не догадался, что они поддельные.\n[Через некоторое время советник возвращается с планами и передаёт их вам]\nКонечно, вам нужно будет вернуть ему эти планы вовремя.\nУверена, он планирует вскоре напасть на нас."
  "1204":
    1: "Он забрал планы?\nПревосходно!\nЯ поручу командиру «Риверстрайд» устроить им настоящий приём.\nЧто касается вас, я дал указание своему казначею зачислить на ваш счёт 5 000 золотых."
  "1205":
    1: "Сначала вам нужно поговорить с Гэвином Магнусом в Селесте и пройти его обучение.\nПосле того как вы докажете свои способности и преданность, вы узнаете больше о своей роли в будущем Эратии."
  "1206":
    1: "У каждого из советников Гэвина есть для вас задание.\nПоговорите с Резуректрой, сэром Канегемом и Крэг Хэком, чтобы узнать больше.\nНе провалите эти миссии — от их исхода зависит будущее."
  "1207":
    1: "Роберт Мудрый поручил вам выполнить задание, которое, к сожалению, является необходимым.\nЧтобы наши планы могли быть реализованы, это задание должно увенчаться успехом.\nПодготовьтесь к нему с особой тщательностью, иначе вас ждет неминуемый провал."
  "1208":
    1: "Чтобы план принёс какую-либо долгосрочную пользу, необходимо полностью уничтожить криганов, дьяволов и их лидера Ксенофекса.\nИх «улей» вы найдёте в Стране гигантов."
  "1209":
    1: "К западу от Авли находится корабль, на котором Резуректра и её соратники прибыли в Эратию.\nПосетите корабль и добудьте «Осцилляционный сверхдвигатель», чтобы обеспечить нашу победу.\nУбедитесь, что вы должным образом экипированы для этого путешествия."
  "1210":
    1: "Немедленно верните «Осцилляционный ускоритель» на «Резуректру»!\nКаждая секунда — это потеря драгоценного времени!"
  "1211":
    1: "Испытание заключается в том, чтобы войти в «парадную дверь» «Стен Тумана» и выйти через «заднюю дверь».\nЯ использую слово «дверь» в широком смысле — вы поймёте, когда доберётесь туда.\nОружие вам не понадобится.\nВы провалите испытание, если убьёте любое существо в «Стенах Тумана».\nЕсли вам удастся выполнить это задание, вы станете членом Гильдии Света. Удачи."
  "1212":
    1: "Вы прошли испытание!\nЭто настоящее достижение — немногим удаётся справиться так быстро, как вам.\nМои советники теперь с нетерпением ждут встречи с\nвами; их можно найти в четырёх домах на восточной стороне Селесты.\nЕщё раз поздравляю!"
  "1213":
    1: "Помните: вам нужно войти в «Стены Тумана» через главный вход, а выйти — через задний.\nВы не должны убивать никаких существ в «Стенах Тумана».\nКогда вы выполните это задание, вернитесь ко мне."
  "1214":
    1: "Нам нужна ваша помощь, чтобы отобрать у наших врагов — некромантов — половину ключа, открывающего доступ к очень важному месту.\nКак и мы, они хранят свою половину ключа в своем главном храме — Храме Тьмы.\nЯ не питаю никаких иллюзий: это будет нелегко.\nНе торопитесь и действуйте, когда будете готовы.\nКроме того, принесите нам и нашу половину ключа.\nОна хранится в Храме Света.\nПоскольку вы наш союзник, никто не должен мешать вам, когда вы пойдёте туда за ключом.\nТочно так же, пожалуйста, не причиняйте вреда никому из них."
  "1215":
    1: "Вижу, половинок ключа пока нет.\nНу, не торопитесь.\nРано или поздно это придётся сделать, и лучше раньше, чем позже, но позже всё же лучше, чем оказаться прикованными к алтарю и принесенными в жертву Верховным жрецом Тьмы в одном из их кровавых ритуалов.\nПросто принесите обе половинки ключа из храмов Тьмы и Света и постарайтесь при этом не погибнуть."
  "1216":
    1: "Что ж, я рад, что ты нашёл нашу половину ключа, но тебе всё ещё нужна их половина.\nДержи её при себе, пока не найдёшь вторую половину.\nКогда у тебя будут обе половины, вернись ко мне.\nЯ соединю их воедино."
  "1217":
    1: "Отлично, что вам удалось добыть их половину ключа, но вам всё ещё нужна наша.\nОна находится в Храме Света, здесь, в Селесте."
  "1218":
    1: "Я знала, что у тебя получится!\nНи на секунду в тебе не сомневалась!\n[Ты протягиваешь ей половинки ключа, и она соединяет их, проведя пальцем по щели между ними.\nКлюч срастается на глазах, становится как новый] Наконец-то!\nОдна часть плана выполнена.\nТвоя помощь оказалась неоценимой.\nМы уже в долгу перед тобой, и я полагаю, что наш долг станет ещё больше, прежде чем наш план воплотится в жизнь.\nТак что поверь в нас ещё немного — будущее, которое мы планируем, поразит тебя!"
  "1219":
    1: "Наши планы стремительно приближаются к завершению, но есть одна загвоздка.\nКриганы — также известные как «Дьяволы» или «Демоны» — должны быть уничтожены, прежде чем мы доведем наши планы до конца.\nОни представляют собой ужасную угрозу, и хотя сегодня они лишь зализывают раны, однажды они вновь обретут силу и опустошат мир.\nЕсли мы хотим, чтобы наши действия имели долгосрочный эффект, мы должны сначала уничтожить этих монстров раз и навсегда. Ты силен, но не настолько, чтобы в одиночку победить дьяволов.\nОни уязвимы для того вида магии, которым чаще всего владеют некроманты, и в меньшей степени — наши собственные волшебники.\nТебе необходимо проникнуть на базу дьяволов и убить их лидера Ксенофекса.\nЭто должно на некоторое время положить конец их угрозе для этого мира.\nКолдуны прокопали туннель от своего вулкана до Земли гигантов — земли, которую дьяволы считают своей.\nВозможно, ты сможешь этим воспользоваться."
  "1220":
    1: "ВЫ — ГЕРОИ!!!\nВаша борьба с демонами была просто блестящей!\nА спасение короля Роланда оказалось столь же восхитительным, сколь и неожиданным.\nИстория никогда не забудет ваши имена за то, что вы только что совершили!\nЯ, во всяком случае, очень горжусь тем, что знаю вас."
  "1221":
    1: "Думаю, с выполнением этой задачи можно не торопиться, но мы не хотим, чтобы некроманты заскучали, ожидая, пока мы выполним свою часть работы и уничтожим блокирующего.\nПоэтому, пожалуйста, как только почувствуете, что готовы, немедленно атакуйте дьяволов.\nПомните, что чародеи прокопали туннель от своего вулкана до земли дьяволов.\nВы должны смочь воспользоваться им, чтобы добраться туда."
  "1222":
    1: "Наши союзники в Таталии уже некоторое время жалуются на таинственное присутствие.\nЗа последние несколько месяцев произошло множество смертей и исчезновений, и они спросили нас, знаем ли мы что-нибудь об этом.\nДумаю, знаю.\nПодозреваю, что в Таталии орудует вампир.\nУ меня нет времени самостоятельно разобраться в этом вопросе, но чтобы не расстраивать наших союзников, прошу тебя разобраться в этом деле.\nВозможно, присутствие этого чудовища имеет более серьёзные последствия для Таталии, чем просто невезение."
  "1223":
    1: "Как я и подозревал!\nОтличная работа.\nС гибелью вампира Таталия теперь может спать чуть спокойнее.\nКоролева Кэтрин тоже благодарна и предпринимает шаги по дальнейшему укреплению связей между Бракадой и Эратией."
  "1224":
    1: "Продолжай искать этого вампира.\nЯ уверен, что в этом и заключается наша проблема, и он, должно быть, где-то в Таталии или поблизости."
  "1225":
    1: "План заключается в краже сосудов с душами, без которых некроманты не могут продлить свою жалкую жизнь.\nОни спрятали их где-то в замке своей гильдии и, скорее всего, не готовы к такому небольшому нападению, в котором вы так хорошо разбираетесь.\nБыстрый удар — ворваться и уйти — должен сработать.\nНе задерживайтесь у замка слишком долго, иначе прибудут подкрепления, и постарайтесь сделать всё с первого раза, иначе они навсегда удвоят количество патрулей.\nКак только вы доберётесь до сосудов с душами, принесите их сюда, чтобы мы могли избавиться от них должным образом."
  "1226":
    1: "[Сэр Канегем с любопытством смотрит на сосуды, словно рассматривая ядовитую змею за стеклом] Так вот что такое сосуды для душ.\nЯ, пожалуй, ожидал чего-то более… впечатляющего.\nОтличная работа!\n[он берет ящик с сосудами] Я позабочусь о том, чтобы эти сосуды больше никто никогда не увидел."
  "1227":
    1: "Хорошо подготовьтесь, прежде чем отправляться за банками.\nОхрана не будет вести себя так небрежно, если вам придется отступить и вернуться."
  "1228":
    1: "Наши противники — бывшие советники Арчибальда — каждый из них носит при себе предмет, называемый «кубом командования», который нам абсолютно необходимо заполучить, чтобы выполнить задачу.\nНи один из них ни за что не отдаст свой куб добровольно, а это значит, что нам придётся добыть его другим способом.\nТебе придётся отобрать его у одного из них, и мы считаем, что проще всего это сделать с Толберти.\nВ отличие от остальных, он пренебрегает надлежащими мерами безопасности и поселился в одной из квартир в «Яме».\nМне нужно, чтобы ты снова проник в «Яму» и забрал у него куб.\nБудь осторожен — он хорошо вооружен и гораздо сильнее, чем кажется.\nКогда куб будет у тебя, вернись ко мне.\nДо цели осталось совсем немного, и очень скоро всё прояснится."
  "1229":
    1: "[Роберт берет куб] Ты снова справился!\nЦель уже совсем близко!\nЯ знаю, у тебя много вопросов, и я уверен, что Резуректра ответит на все из них, как только ты выполнишь для неё ещё одну миссию.\nТы найдёшь её вместе с Гэвином Магнусом в тронном зале замка Ламбент."
  "1230":
    1: "Продолжай искать его квартиру.\nТолберти никогда по-настоящему не верил, что с ним может случиться что-то плохое, и пока что он был прав.\nНам нужно доказать, что он ошибается.\nЗабери куб любым способом.\nЕсли получится обойтись без насилия — отлично.\nЕсли придется убить его — ну, это тоже подойдет.\nГлавное — добудь куб."
  "1231":
    1: "Нам нужна ваша помощь. Наши враги, волшебники, хранят половину ключа от одного очень важного места в своём главном святилище, Храме Света.\nПроще простого. Эти так называемые добряки больше думают о том, как прикрыться да подлечиться, чем о том, как ударить в ответ. Как тут победить, если толком и не дерёшься?\nНе спешите. Подготовьтесь и беритесь за дело.\nПрихватите и нашу половину ключа из Храма Тьмы. Вы наши союзники, так что вам там никто не помешает.\nА если захочется размяться, можете и там кого-нибудь приложить. Ничего с ними не станется. Большинство оправится даже после самых тяжёлых ран. Попробуйте, это весело!"
  "1232":
    1: "Ещё ни одной половины ключа? Тьфу!\nНадеюсь, вы всё-таки на что-то способны. Что тут сложного?\nВрываетесь через парадную дверь и открываете огонь. Когда никого не останется, обыскиваете храм хоть до утра.\nПоторопитесь. Мне нужны обе половины."
  "1233":
    1: "Хорошо, половина из Храма Света у вас. Осталась наша, из Храма Тьмы.\nБерегите ту, что уже нашли. Как добудете вторую, возвращайтесь. Я соберу ключ."
  "1234":
    1: "Наконец-то! Я уж решил, что вас прикончили.\nПоловину из Храма Тьмы вы принесли. Теперь добудьте вторую, из Храма Света.\nВозвращайтесь с обеими, и я соединю их."
  "1235":
    1: "Отлично!\n[Касторе с силой ударяет половинами ключа друг о друга. Вспыхивает белый свет, и половины соединяются без шва.]\nПервую часть плана мы выполнили.\nЯ знал, что мы… э-э, что Арчибальд не ошибся, когда вам доверился!"
  "1236":
    1: "Скоро наш план принесёт плоды. Осталось уладить несколько дел.\nВ этом мире кроме нас живут кригане. Их ещё зовут дьяволами. Пока они слабы, мы можем уживаться. Стоит им набрать силу, и они перебьют всех до единого.\nА какой прок править миром, где все мертвы? Надо покончить с дьяволами, пока они не покончили с нами.\nПроберитесь в их логово и убейте вожака, Ксенофекса.\nЧернокнижники Найгона прорыли туннель от своего вулкана в Страну Великанов, где обосновались дьяволы. По нему, скорее всего, и доберётесь."
  "1237":
    1: "ВЕЛИКОЛЕПНО! Вы справились!\nГлавной угрозы нашим планам больше нет. Мы станем королями мира!\n[Касторе запрокидывает голову и заходится хохотом.] А-ха-ха-ха! Ха… Да.\nЧто ж, отличная работа. Даже прощу вам, что выпустили на волю этого короля Роланда. С ним на руках мы могли бы поторговаться, знаете ли.\n[Он пожимает плечами.] Наверное, у вас не было выбора. В любом случае сегодня счастливый день!"
  "1238":
    1: "Может, всё-таки поторопитесь с вылазкой к дьяволам?\nАрчибальд обещал выделить войска, но вечно они ждать не будут.\nА дьяволы плодятся быстрее кроликов. Чем дольше вы тянете, тем больше их придётся перебить."
  "1239":
    1: "Арчибальд велел раздобыть сосуды душ для своих некромантов. Без них не завершить ритуал, который дарует вечную жизнь, а наши запасы почти иссякли.\nЖелающих стать личами куда больше, чем сосудов. Кое-кому из наших грозит самая обыкновенная смерть.\nСосуды делают чернокнижники. Отправляйтесь к ним и убедите их отдать сосуды. Откажутся — забирайте силой. Наторговался я с ними."
  "1240":
    1: "[Максимус с довольным видом принимает ящик с сосудами.]\nХорошая работа. Даже спрашивать не стану, как вы их добыли. Главное, что добыли."
  "1241":
    1: "С чернокнижниками можете не церемониться. Добудьте сосуды любым способом.\nЕсли понадобится, снова договоримся о мире. О цене же договариваемся заново всякий раз, когда покупаем у них сосуды."
  "1242":
    1: "У лорда Арчибальда ещё одна просьба. Выгоните тварей из лаборатории Кланкера и снимите защиту от телепортации.\nЛаборатория стоит на острове к востоку от Пирпонта, в Туларейском лесу.\nБудьте осторожны. Этих чудовищ создал сам Кланкер. Некоторые куда опаснее своих сородичей за пределами лаборатории.\nЗабирайте всё, что приглянется. Лорду Арчибальду нужны только само здание и оборудование.\nКогда щит падёт, он сможет переправить туда некромантов и оборудование с помощью Маяка Ллойда."
  "1243":
    1: "Приятно знать, что на вас можно положиться.\nСреди наших союзников мало кто справился бы так же хорошо. Спасибо за помощь."
  "1244":
    1: "Дело нехитрое. Пора браться за него!\nПовторяю, лаборатория на острове к востоку от Пирпонта, в Туларейском лесу.\nСнимите щит, и на этом ваша работа закончена."
  "1245":
    1: "Как мы служим советниками у Арчибальда, так и у короля Магнуса из Бракады есть свои советники. Каждый из них, как и мы, носит при себе небольшое устройство — контрольный куб.\nНам нужен один такой куб. Добровольно они его не отдадут, так что придётся забрать. Наш выбор пал на Роберта Мудрого.\nНаш человек во дворце повредил дверной замок в покоях Роберта. Менять его они не спешат. Войдёте без труда.\nЧто делать с Робертом, решайте сами. Главное — заберите куб и сразу возвращайтесь ко мне."
  "1246":
    1: "[Толберти принимает куб.] Теперь до цели рукой подать.\nКасторе ещё не посвятил вас в подробности, но, уверен, вам понравится то, что мы задумали.\nМне велено помалкивать. Скажу одно — придёт время, и вы подниметесь куда выше лордов Хармондейла. Можете мне поверить.\nКасторе ждёт вас в тронном зале замка Глоуминг."
  "1247":
    1: "Что случилось? Неужели дрогнули?\nРоберт крепкий орешек, но смертный. Вы с ним справитесь.\nЯ бы вас туда не послал, если бы сомневался."
  "1248":
    1: "Да, испытание.\nВсё просто.\nНедалеко от центра города находится место, которое мы называем «Зоной размножения».\nВ яме полно отвратительных монстров, и они постоянно воскрешаются.\nЭто отличный источник рабов, запасных частей и мишеней для стрельбы.\nВсе наши некроманты проходят там испытание, когда хотят подняться выше уровня «посвящённого».\nЯ уверен, что ты пройдёшь испытание.\nПросто прыгни в яму и найди выход.\nУбивай там всё, что захочешь.\nНе проявляй пощады.\nКогда сбежишь, выползи из ямы и снова приходи ко мне.\nЕсли ты справишься с этим, я приму тебя в Гильдию Тьмы. *Если* ты справишься с этим..."
  "1249":
    1: "Вы показываете неплохие перспективы, друзья мои.\nОтличное выступление.\nДумаю, этого будет достаточно, чтобы доказать моим советникам ваше мастерство.\nОни уже с нетерпением ждут, чтобы поручить вам задания; их можно найти в четырёх домах в западной части Ямы.\nИ не беспокойтесь.\nНаграды, конечно же, не заставят себя ждать."
  "1250":
    1: "Я начинаю подозревать, что мои союзники были правы насчёт тебя.\nТы что, не можешь пройти этот простой тест?\nТы слишком боишься или слишком слаб, чтобы справиться?\nМожет, нам нужны новые союзники?"
  "1251":
    1: "Настало время достичь нашей Цели.\nПричина, по которой мы отправляли вас на все эти миссии, проста:\nмы были заняты сбором деталей, необходимых для открытия врата к Древним — тем, кто колонизировал этот мир много веков назад.\nК сожалению, наши бывшие соотечественники также ищут эти детали для осуществления своих мрачных замыслов.\nОни хотят восстановить Небесную Кузницу времён, предшествовавших Тишине, и использовать её для копирования оружия, которое мы привезли с собой в ваш мир.\nМы соперничали с ними за эти детали, но, наконец, у нас есть всё необходимое.\nЗа исключением одной вещи.\nНам так и не удалось найти в вашем мире Осцилляционный сверхдвигатель.\nВсё было бы потеряно, но одно такое устройство находится на борту «Линкольна» — корабля, который привёз нас в ваш мир.\nОно находится в море к западу от Авли и защищено от проникновения даже для нас самих.\nТеперь вам нужно надеть наши скафандры, проникнуть на корабль и вернуться с ускорителем; вы найдёте эти скафандры в сундуке за пределами этого тронного зала.\nЧтобы скафандр работал должным образом, вы не должны носить на себе никакого снаряжения.\nЧто касается нас, то мы должны стоять на страже у ворот и сражаться с нашими бывшими товарищами."
  "1252":
    1: "Ты вернулся!\nНаконец-то!\nУ нас есть «Овертрастер».\nА теперь пойдем с нами — мы откроем путь к Древним!"
  "1253":
    1: "Не забудьте, что для того, чтобы добраться до «Линкольна», вам понадобятся гидрокостюмы.\nЭти костюмы лежат в сундуке снаружи этого тронного зала, а «Линкольн» находится в море к западу от Авли.\nВернитесь сюда с «Овертрастером» как можно скорее."
  "1254":
    1: "Вот и пробил наш час.\nПока вы выполняли поручения, мы с соотечественниками боролись с нашими бывшими друзьями за детали, без которых не восстановить легендарную Небесную Кузницу.\nЯ говорю о четверых ближайших советниках короля Магнуса. Они задумали открыть врата к Древним. Могли бы остаться с нами, но променяли всё на смутную надежду на «лучшее будущее».\nА вы всё это время были на нашей стороне!\nОсталось одно дело. Нужен колебательный двигатель с нашего старого корабля, «Линкольна». В вашем мире мы такого больше нигде не нашли.\nКорабль лежит в море к западу от Авли. Защита не пускает на борт даже нас.\nВ сундуке у тронного зала лежат наши старые гидрокостюмы. Снимите всё снаряжение, иначе костюмы не будут работать. Наденьте их, проберитесь на корабль и привезите двигатель.\nМы останемся охранять Кузницу. Привезите двигатель, друзья мои, и мы вместе будем править миром!"
  "1255":
    1: "ПОЛУЧИЛОСЬ! Вы добыли двигатель!\nСкорее за мной, в лабораторию! Кузница готова…"
  "1256":
    1: "До «Линкольна» без гидрокостюмов не добраться. Они лежат в сундуке у тронного зала.\nКорабль в море к западу от Авли. Что ещё вам нужно знать?"
  "1257":
    1: "В этом месяце объявлена награда за %s.\nУбейте цель и вернитесь до конца месяца, чтобы получить %lu золотых."
  "1258":
    1: "Вы одолели %s! Поздравляю!\nВот обещанная награда — %lu золотых.\nВозвращайтесь в следующем месяце за новой целью."
  "1259":
    1: "В этом месяце награду уже забрали.\nВозвращайтесь в следующем месяце за новой целью."
  "1260":
    1: "Для игры вам понадобится собственная колода карт. Соперника мы предоставим.\nУсловия победы различаются в зависимости от таверны. Постройте свою башню, уничтожьте башню соперника или соберите достаточно ресурсов раньше соперника. Крупные жёлтые цифры в столбце обозначают генераторы. Это количество новых единиц того или иного ресурса, которое вы получите в следующий ход. Мелкие чёрные цифры в столбце обозначают ресурсы. Это количество единиц, которое вы можете потратить в текущем ходу. Карты: у каждой карты есть своя стоимость разыгрывания, указанная в маленьком кружке в правом нижнем углу карты. Стоимость будет вычтена из ваших ресурсов в соответствии с цветом карты.\nЩелчок левой кнопкой мыши по карте разыгрывает её. Щелчок правой кнопкой мыши по карте позволяет сбросить её, не разыгрывая. Красный цвет обозначает ваш генератор «Карьер», который производит ресурс «Кирпич», синий — генератор «Магия», который производит ресурс «Драгоценный камень», а зелёный — генератор «Зоопарк», который производит ресурс «Зверь»."
  "1261":
    1: "Во всех здешних партиях в «Аркомаг» каждый игрок начинает с башней высотой 15 и стеной высотой 5.\nДля победы нужно либо поднять башню до 30, либо накопить 100 единиц одного из ресурсов, либо разрушить башню соперника."
  "1262":
