    1: "Качество вашего снаряжения зависит от того, кто его ремонтирует.\nЕсли вы не сможете его починить, то рискуете оказаться в дикой местности без доспехов и оружия.\nЭто может обернуться крайне плачевными последствиями. Освоение навыка «Ремонт предметов» дает вам возможность не только ремонтировать оружие и доспехи, но и любые сломанные предметы прочего назначения.\nВы сможете овладеть этим навыком, если ваш уровень навыка «Эксперт» равен 7 и вы заплатите 2500 золотых."
