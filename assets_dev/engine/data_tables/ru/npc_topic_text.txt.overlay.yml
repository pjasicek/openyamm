  "1339":
    1: "Нашли древний предмет или реликвию и не знаете, как они действуют?\nВ этом случае незнание не благо: оно вполне может стоить вам жизни. На уровне великого мастера навык «Опознание предметов» позволяет опознать любую находку, включая артефакты и реликвии.\nДля обучения требуется навык уровня мастера (10) и 6000 золотых."
  "1340":
    1: "Владельцы магазинов — народ жадный.\nХотите получать более выгодные цены на товары, которые покупаете и продаете?\nТогда вам лучше как можно скорее освоить навык «Торговля». Я могу научить вас уровню «Эксперт» по навыку «Торговля», если у вас уровень навыка равен 4 и вы заплатите 2000 золотых.\nУровень «Эксперт» удваивает ваш бонус к ценам."
  "1341":
    1: "Владельцы магазинов — народ жадный.\nХотите получать более выгодные цены на товары, которые покупаете и продаёте?\nТогда вам лучше освоить навык «Торговля» и изучить все тонкости торговли. Я могу научить вас мастерству в навыке «Торговля», если у вас уровень «Эксперт» равен 7, показатель «Личность» — 50, и вы заплатите 5000 золотых.\nМастерство утраивает ваш бонус к ценам."
  "1342":
