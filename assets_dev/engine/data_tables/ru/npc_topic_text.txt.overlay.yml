rows:
  "1":
    1: |-
      Друг мой, ученик караванщика, настали тяжёлые времена.
      Надеюсь, наш наставник найдёт способ покинуть этот неспокойный край и благополучно вернуться в Альвар.
      Мне бы не хотелось окончить жизнь здесь, хотя я и родился в этих местах.
  "2":
    1: |-
      Дадеросс привёл нас сюда торговать с кланом ящеролюдов Одного Клыка — покупать у них плоды тоберска.
      Он отправился поговорить с вождём деревни Брекишем Одноклыком.
      Может быть, тебе стоит его поискать?
  "3":
    1: |-
      Пираты Регны угрожают торговле и свободному мореходству в Джадаме.
      Корабли почти не выходят в море, опасаясь быть потопленными… или чего похуже!
      В Равеншоре я слышал слухи о небольшой шайке контрабандистов, которая умудряется не попадаться пиратам на глаза.
      Интересно, как им это удаётся!
  "4":
    1: |-
      Всё происходит так, как сказано в пророчестве о Разрушении: «…и Огненная гора поднимется из моря, словно рана от быстрого удара кинжала…».
      Вы должны найти способ покинуть эти острова — если не ради каравана, то хотя бы ради себя!
      Кто-то должен сообщить Торговому совету Альвара о случившемся.
      Они должны узнать о катаклизме и нападении Регны!
  "5":
    1: |-
      Пираты с грозного острова Регна воспользовались катаклизмом и всеобщей растерянностью, чтобы захватить острова.
      Если они покорят Кинжальную Рану, то превратят её в базу для прямых нападений на Равеншор!
      Нужно предупредить Торговый совет Альвара!
      Доберитесь до лодок и расскажите им обо всём!
  "6":
    1: |-
      Чтобы переправить весь караван обратно в Равеншор, понадобится несколько лодок или множество рейсов одной лодки.
      Пока воды вокруг островов Кинжальной Раны кишат пиратами Регны, это невозможно.
      Лучше возвращайтесь в Альвар и сообщите Совету о нападении.
      Они пришлют помощь и спасут нас!
  "7":
    1: |-
      Посреди ночи земля содрогнулась!
      С неба посыпались пылающие камни!
      Многие из моего народа были ранены или погибли, деревня сильно пострадала.
      Мосты между малыми островами и главным островом разрушены. Мы не можем добраться до раненых, а многие родные и друзья пропали.
      Путь к островам с причалами отрезан, и мы не можем послать за помощью в Равеншор. Я даже не знаю, уцелела ли хоть одна лодка!
  "8":
    1: |-
      В давние времена мой народ пользовался Каменными порталами, чтобы быстро перемещаться между островами, но секрет их работы утрачен.
      Действует лишь пара порталов между деревней и юго-западными полями. Теперь, когда мосты разрушены, мы заперты на острове!
  "9":
    1: |-
      Последние несколько лет у нас живёт клирик по имени Фредрик Талимэр.
      Он изучает Каменные порталы и внешние руины Заброшенного храма.
      Возможно, он знает, как вновь запустить порталы. Найдите его и попросите помочь!
  "10":
    1: |-
      Ах да… порталы. Я много лет изучал и их, и исчезнувшую культуру, которая их создала.
      Их построила цивилизация, процветавшая задолго до прихода ящеролюдов на эти острова. Порталы позволяли мгновенно путешествовать между островами.
      К сожалению, необходимых для них камней силы осталось очень мало.
  "11":
    1: |-
      В первую ночь извержения Огненной горы я отправился на берег, надеясь увидеть происходящее.
      Не могу утверждать наверняка, но мне показалось, что среди застывающей лавы у подножия горы бродят элементали Земли.
  "12":
    1: |-
      Так вождь Одноклык отдал вам тот камень силы, который хранил!
      Он запустит портал на юго-западной оконечности острова. Чтобы воспользоваться им, представьте камень, когда вступаете на портал.
  "13":
    1: |-
      Руины храма исчезнувшей цивилизации лежат на острове к северо-западу от главного.
      Я не исследовал их: опасные рептилии устроили там логово. Полагаю, из храма можно попасть в подводный тоннель, выходящий у причалов северо-западного острова.
      Теперь, когда мосты разрушены, этот тоннель может оказаться единственным путём к лодкам и спасению!
  "14":
    1: |-
      Мой брат Истрик Язык отправился проверить посадки тоберска на одном из малых островов и не вернулся!
      Боюсь, катаклизм отрезал его от деревни. Возможно, он даже ранен!
      Если починить Каменные порталы, он сможет вернуться, а мы сумеем помочь всем нуждающимся. Найдите его, прошу вас!
  "15":
    1: |-
      Бабушка рассказывала нам о временах, когда Каменные порталы служили главным путём между островами.
      По её словам, ключи от порталов исчезли во время одного из первых набегов пиратов Регны.
      Если порталы заработают, мой брат Истрик сможет вернуться на главный остров!
  "16":
    1: "Этот грубиян?"
  "17":
    1: "Мы прогневили Древних!"
  "18":
    1: "Во многих пророчествах предрекается гибель Джадама и всего мира!"
  "19":
    1: |-
      Есть одно пророчество — Пророчество Змеи, — список которого мне так и не удалось найти.
      Полагаю, оно может многое поведать о будущем Джадама.
      Клирик Фредрик Талимэр рассказывал мне о змеиных руинах и Заброшенном храме.
      Он тоже считает, что где-то в храме может храниться список этого пророчества.
      Не могли бы вы найти его для меня?
  "20":
    1: |-
      Вы должны найти способ покинуть эти острова. Кто-то должен сообщить нашим хозяевам, Торговцам Альвара, о случившемся здесь!
      Они должны узнать о катаклизме и набеге Регны!
      Я написал письмо Элгару Феллмуну, представителю Торговцев Альвара в Равеншоре. В нём я объяснил наше положение.
      Если кто и сможет подсказать нам, что делать дальше, так это Феллмун. Немедленно отнесите ему письмо.
  "21":
    1: "Вы должны доставить моё письмо Элгару Феллмуну в Равеншор!"
  "22":
    1: |-
      Отнесите этот кристалл Фредрику Талимэру. Я знаю, что он как-то связан с Каменными порталами.
      Возможно, Фредрик сумеет объяснить, как он действует.
  "23":
    1: "Отнесите кристалл портала Фредрику Талимэру. Он поймёт, для чего тот нужен."
  "24":
    1: |-
      Торговый совет отправил нашу величайшую воительницу, Каури Блэкторн, посоветоваться со жрецами Храма Солнца о бедствиях, обрушившихся на Джадам.
      Каури отправилась в Храм Солнца в Мурмурвуде вскоре после того, как до Альвара дошли слухи о катаклизмах.
      После совета со жрецами она должна была вернуться, но до сих пор не появилась. Мы очень за неё беспокоимся.
      Что до вашего посвящения, только Каури способна как следует испытать ваши навыки и решить, достойны ли вы нового звания.
      Найдите её, окажите любую необходимую помощь, а затем вернитесь и сообщите, где она и что с ней.
  "25":
    1: |-
      Вы нашли Каури?
      Нам необходимо узнать, что с ней случилось!
      Без неё мы все стали слабее!
  "26":
    1: |-
      Благодарю за помощь с проклятием василисков.
      Обычно я без труда справляюсь с этими мерзкими ящерами, но на этот раз их оказалось слишком много.
      В Храме Солнца меня попросили разыскать нескольких паломников, которые отправились к здешнему Каменному кругу друидов.
      Увидев первую статую, я поняла, что с ними произошло.
      Я и сама не знала, что василисков в этих местах стало так много. Кажется, их что-то встревожило.
      Я собиралась осмотреть Каменный круг друидов, когда они на меня напали.
  "27":
    1: |-
      ::Каури внимательно осматривает тёмных эльфов в вашем отряде::
      Чтобы спасти меня, вам пришлось изучить мой путь и осмотреть места, где я побывала.
      Это доказывает, что вы обладаете умом, необходимым для успеха в мирских делах и торговле.
      Чтобы добраться до места нападения, вам потребовалось мастерство в борьбе с василисками и прочими угрозами — вы доказали своё воинское искусство.
      Умение сражаться необходимо, когда достойные переговоры заходят в тупик.
      Сама просьба о посвящении говорит о стремлении к успеху, а без стремления успех всегда будет ускользать от вас.
      Вы обладаете всеми качествами, необходимыми для звания патриарха.
      По возвращении я извещу Совет. Я буду рада вновь путешествовать с вами.
      Найти меня можно в таверне Равеншора.
  "28":
    1: |-
      Мне нужно продолжить исследование Каменного круга для Храма Солнца.
      Надеюсь, не всех паломников постигла судьба этих несчастных и кто-нибудь уцелел!
      Что-то встревожило здешних существ, и мне кажется, источник находится в Круге.
  "29":
    1: |-
      Знаете… у меня есть камень силы, который запустит портал в Заброшенный храм.
      А у вас — камень, с помощью которого мы доберёмся до острова с этим порталом!
      Объединившись, мы без труда достигнем храма. Что скажете?
      Фредрик Талимэр предлагает присоединиться к вашему отряду.
  "30":
    1: |-
      Каури вернулась и рассказала, какую помощь вы ей оказали.
      Она также сообщила о вашем посвящении.
      Поздравляю! Пусть ваша прибыль приносит вам много радости!
  "31":
    1: |-
      Каури Блэкторн была здесь больше недели назад, а может, и ещё раньше.
      Она много расспрашивала нас о вторжениях элементалей, и мы рассказали всё, что знали.
      Каури собиралась вернуться с этими сведениями в Альвар, но перед уходом мы попросили её об одолжении.
      На северо-восток отсюда, к старому Каменному кругу друидов, направилась группа паломников. Мы попросили Каури проведать их.
      Она заверила нас, что сделает это по пути в Альвар.
  "32":
    1: |-
      Вы утверждаете, что принесли послание от одного из глав моих караванов. Так где же оно?
      Если оно действительно было таким важным, стоило внимательнее следить за ним в дороге!
  "33":
    1: |-
      Что это? Письмо от главы каравана Дадеросса? Посмотрим… Хм… Похоже, назревают серьёзные события.
      Жаль, что Кинжальную Рану постигла такая участь. Возможно, придётся принять решительные меры, но мне нужно больше сведений… и, кажется, я знаю, как их получить!
      Не желаете мне помочь? Разумеется, за вознаграждение.
      А вот плата за доставку письма Дадеросса.
  "34":
    1: |-
      У местных контрабандистов самые быстрые лодки в Равеншоре. Если мои люди получат к ним доступ, они смогут быстро обследовать побережье и выяснить размах катаклизма, о котором пишет Дадеросс.
      Вот. Отнесите это письмо предводителю контрабандистов Ариону Хантеру. Уверен, оно «убедит» его предоставить нам свои услуги. Его убежище находится к западу отсюда, выше по побережью.
      Ах да, чуть не забыл: контрабандисты — крысолюды, а вы знаете их нрав. С Хантером можно договориться, но не удивляйтесь, если его шайка окажется не слишком вежливой.
  "35":
    1: |-
      Послушайте, нам нужны эти лодки! Доставьте моё письмо Ариону Хантеру.
      Вы забыли? Его логово находится к западу отсюда, выше по побережью!
  "36":
    1: |-
      Отлично. Вот плата, о которой мы договорились. Лодки Хантера пригодятся нам во время кризиса.
      Да-да, именно кризиса! После вашего первого визита несколько караванов не прибыли к назначенному сроку. Ходят и другие слухи: уже дважды я слышал о пылающем озере огня, возникшем посреди пустыни.
      Вулканы! Огненные озёра! Боюсь, таинственный кристалл как-то со всем этим связан.
      Как бы то ни было, мастера гильдии в Альваре должны обо всём узнать!
  "37":
    1: |-
      Как вам, вероятно, известно, штаб-квартира нашей гильдии находится в городе Альваре.
      Если вы там ещё не бывали, проще всего подняться по реке через каньон на север.
      Отправляйтесь в дом гильдии и найдите Бастиана Лаудрина. Расскажите ему о кристалле и слухах. Он будет знать, что делать.
  "38":
    1: "Вы должны добраться до Бастиана Лаудрина в Альваре. Скорее! Он должен узнать о последних событиях!"
  "39":
    1: |-
      Это дом Каури Блэкторн, величайшей воительницы тёмных эльфов.
      Сейчас её нет: она выполняет поручение Торгового совета Альвара.
      Возможно, в Совете вам подскажут, где её искать.
  "40":
    1: |-
      И вы учинили всё это с моими стражниками лишь ради того, чтобы доставить письмо! Дайте-ка взглянуть… Хм…
      Феллмуну нужны мои лодки? Никогда! Я… Что?! Он угрожает моей Ирабелль… Я… я…
      ::вздыхает:: Х-хорошо. Передайте Феллмуну, что он получит мои лодки. Похоже, Торговцам Альвара невозможно отказать.
  "41":
    1: |-
      Мои грузы не должны попадаться на глаза портовым чиновникам, поэтому мои лодки обязаны быть — и являются — самыми быстрыми на побережье Джадама.
      Они могут уйти даже от галеры Регны! Отсюда они ходят на запад, к Блуждающему Разору, и на восток, к Шэдоуспайру.
  "42":
    1: |-
      Древние предания троллей рассказывают о времени, когда мы ещё не жили в этом пустынном краю.
      В них говорится о тихом и мирном месте, откуда нас изгнало Каменное проклятие.
      Сотни лет мы обитали здесь, среди Железных Песков, но теперь, похоже, лишимся и этого дома.
      Разрастающееся огненное море уничтожило почти всю мою деревню. Многие друзья и родичи погибли. Возможно, это и вправду конец моего клана.
      У моего народа говорят: «Нечто живёт лишь до тех пор, пока о нём помнят».
      Пока я помню нашу родину, нам будет куда вернуться. Нужно лишь найти её.
  "43":
    1: |-
      Быть может, вы сумеете отыскать нашу прежнюю родину и узнать, осталось ли там Каменное проклятие. А если оно ещё действует — найти способ снять его.
      Любой тролль из вашего отряда, выполнивший это задание, будет посвящён в боевые тролли нашего клана. Этот титул окружён великим почётом, а вы навеки войдёте в наши предания как легендарные герои.
      Один из наших воинов, Дартин Дюнволкер, уже отправился на поиски. Он надеялся найти следы среди каменных полей Блуждающего Разора.
      Возможно, вы встретите его и продолжите поиски вместе — или хотя бы обнаружите подсказки, которые приведут нас к цели.
  "44":
    1: |-
      Союз должен быть заключён, а его участники — выбрать общий путь.
      Возвращайтесь в Альвар и посоветуйтесь с Торговым советом.
  "45":
    1: |-
      Вы нашли нашу древнюю родину? В западной части Мурмурвуда?
      Это чудесная новость! Возможно, ещё не поздно переселить туда мой народ.
      Но прежде необходимо справиться с угрозой элементалей, иначе ни один народ не будет в безопасности!
      Все тролли среди вас посвящены в боевые тролли, и их имена навеки останутся в наших песнях.
      Остальных я обучу всему, чему смогу. Возможно, эти знания помогут вам спасти весь Джадам.
  "46":
    1: |-
      Вас послали искать древнюю родину троллей? Я рад вашей помощи!
      Я оказался в тупике: никто здесь ничего не знает о Каменном проклятии из наших преданий.
      Огр-маг Зог тоже не пожелал помочь. Мне едва удалось выбраться из его крепости живым.
      Хотя, возможно, сам того не желая, он всё же дал мне подсказку. Когда я упомянул Каменное проклятие, Зог пригрозил посадить меня в клетку к своему ручному василиску, если я продолжу ему докучать.
      А василиски водятся в Мурмурвуде!
  "47":
    1: |-
      Ещё раз благодарю вас за помощь с проклятием василисков!
      Скорее возвращайтесь в Альвар. Мы должны сделать всё возможное, чтобы спасти Джадам.
  "48":
    1: "Благодарю, что нашли нашу древнюю родину. Когда угроза Джадаму минует, мы сможем начать переселение!"
  "49":
    1: |-
      Вы нашли древнюю родину нашего клана?
      Если мы не узнаем, где она находится, мой народ обречён!
  "50":
    1: |-
      Бедствие постигло и Кинжальную Рану? Тревожные вести. Если верить всем слухам, весь Джадам охвачен хаосом.
      Хотел бы я знать больше. Обычно новости доставляют главы караванов, но в этом месяце ни один из них не прибыл вовремя. А то, что до меня всё-таки доходит, не сулит ничего хорошего: ураганы, наводнения, а теперь ещё и вулкан!
      Хуже всего рассказы об огненном море, возникшем в пустыне Железных Песков. И об этом говорят сразу несколько источников.
      Интересно, связан ли со всем этим кристалл в Равеншоре? То, что он появился одновременно с началом бедствий, едва ли простое совпадение.
  "51":
    1: |-
      Все эти бедствия серьёзно вредят делам нашей гильдии. Мне нужны достоверные сведения, а меня заваливают сплетнями и слухами.
      Многие рассказывают об огненном море в пустыне Железных Песков. Я слышал эту историю столько раз, что почти готов поверить.
      Если вы подтвердите или опровергнете существование озера, то окажете мне большую услугу.
      Отправляйтесь в Железные Пески и найдите это озеро. Если оно действительно существует, разыщите свидетеля его появления и приведите сюда, чтобы я лично выслушал рассказ.
  "52":
    1: |-
      Я должен узнать, что происходит в пустыне Железных Песков. Новые слухи мне не нужны — их и так достаточно.
      Отправляйтесь туда сами. Пустыня лежит в нескольких днях пути к востоку отсюда.
  "53":
    1: |-
      Значит, это правда. Только представьте — огненное озеро!
      Но где свидетель? Мне нужен тот, кто видел его появление. Это важно по причинам, которые я пока не намерен вам раскрывать.
      Найдите свидетеля рождения огненного озера! Поищите в тролльской деревне Раст.
  "54":
    1: |-
      Вы должны создать союз, способный противостоять грозящему нам уничтожению!
      Заручитесь поддержкой Гильдии некромантов, Храма Солнца, минотавров Блуждающего Разора, драконов ущелья Гарроты и отряда охотников на драконов Чарльза Кихота в ущелье Гарроты.
      Уверен, заставить их всех действовать сообща невозможно, но вы всё равно должны сделать всё, что в ваших силах.
      Мои мудрецы говорят, что для спасения в эти пророческие времена необходимо объединить хотя бы три из названных мною сторон.
      Исполните это. Если вам дороги этот мир и собственные жизни — отправляйтесь!
  "55":
    1: |-
      Вы совершили то, что я считал невозможным. В эти тревожные времена объединение важнейших сил Джадама даёт нам надежду на выживание.
      Я сделал всё, что мог. Теперь защита наших земель зависит от совета союза.
      Надеюсь, предоставленное ему помещение в Равеншоре окажется приемлемым. Тамошний дом гильдии не самый роскошный, но совету лучше находиться рядом с кристаллом.
      Желаю удачи и им, и вам!
  "56":
    1: |-
      Да, я был здесь, когда впервые появилось огненное озеро.
      На равнине за деревней возникли странные врата, и из них хлынул огонь. Он растекался, словно вода, вылитая на землю.
      Волна пламени накрыла окраину деревни. Почти весь мой народ погиб в одно мгновение. От деревни осталось лишь то, что вы видите.
      В тот миг я находился на холмах и видел всё сверху — но до сих пор с трудом верю собственным глазам.
  "57":
    1: |-
      Я отправился бы с вами, если бы не мой отец. Он так глубоко скорбит по моему брату Вайлбайту, что не способен о себе позаботиться.
      Отец верит, что душа Вайлбайта не обретёт покоя, пока его останки не будут погребены в деревенской гробнице. К несчастью, после появления огненного озера гробницу заполонили гоги.
      Вот, возьмите прах моего брата. Уверен, горе отца утихнет, если прах упокоится в гробнице. Сделайте это для меня, и я отправлюсь с вами в Альвар.
  "58":
    1: "Я пойду с вами лишь после того, как прах моего брата будет погребён в деревенской гробнице."
  "59":
    1: |-
      Вы оказали моей семье великую услугу. Теперь, когда прах Вайлбайта покоится в святилище деревенской гробницы, он наконец обрёл мир.
      Моему отцу тоже намного лучше. Мы поговорили, и теперь он сможет позаботиться о себе, пока я сопровождаю вас в Альвар.
  "60":
    1: |-
      Вайлбайт был хорошим сыном. Мне будет его не хватать.
      Но теперь я хотя бы знаю, что он обрёл покой. Благодарю вас за добрый и героический поступок.
  "61":
    1: |-
      Мой отец считал, что некроманты Шэдоуспайра пытаются создать дракона-нежить.
      Это было бы поистине ужасное чудовище. Отец верил, что обязан лично остановить их.
  "62":
    1: |-
      Мой отец Блейзен много лет назад отправился в Шэдоуспайр, чтобы уничтожить драконов-скелетов, и так и не вернулся.
      Он взял с собой Эбонест — величайшее копьё для истребления драконов из всех когда-либо выкованных. Чарльз Кихот до сих пор не простил ему потерю Эбонеста.
      Мы не знаем, что случилось с отцом. Он был заместителем Чарльза и отвечал за пропавшее копьё, поэтому Чарльз отказывается посвятить меня в чемпионы, какими бы выдающимися ни были мои навыки.
      Возможно, если вы найдёте Эбонест, Чарльз посвятит в чемпионы и ваших рыцарей, и меня!
  "63":
    1: |-
      Меня захватили в самом сердце лаборатории Безумной некромантки. Там меня пытали и наложили множество проклятий.
      Должно быть, Эбонест забрали, когда я пал. Возможно, копьё до сих пор лежит в центральном зале.
      Если вы вернёте его Кихоту, доброе имя моей семьи будет восстановлено, а мою дочь больше не станет преследовать позор моей неудачи.
  "64":
    1: |-
      Возможно, жрецы Солнца знают, как меня исцелить: лишь им ведом способ противостоять поразившей меня магии Тьмы.
      В Равеншоре живёт мой друг Дервиш Шеврон. Много лет назад он покинул Храм Солнца, чтобы самостоятельно исследовать тайны Джадама.
      Быть может, он знает лекарство или даже хранит его у себя.
      Если он не сумеет помочь, обещайте вернуться и убить меня, чтобы я наконец обрёл покой!
  "65":
    1: |-
      Зантора переселилась сюда из Шэдоуспайра, чтобы продолжить опыты, начатые в Гильдии некромантов.
      Она стремилась создать величайшее из чудовищ — дракона-скелета.
      Другие некроманты испугались результата. Если созданные драконы вырвутся из-под власти Занторы, остановить их будет невозможно.
  "66":
    1: |-
      Блейзен Стормланс был моим помощником и другом.
      Я никогда не понимал его личного похода — этой одержимости слухами о драконах-скелетах.
      Он забрал с собой моё величайшее оружие. Будь Эбонест у меня в руках, я быстро решил бы проблему с драконами.
  "67":
    1: |-
      Жрецы Солнца благословили это копьё, сделав его сильнейшим из когда-либо выкованных.
      Говорят, оно способно сразить любого дракона одним ударом.
      Если это правда, я смогу быстро, чисто и решительно положить конец нашей войне.
  "68":
    1: |-
      Самоцвет восстановления может исцелить рыцаря Блейзена Стормланса от постигшего его проклятия.
      Между Храмом Солнца и Гильдией некромантов нет добрых чувств, поэтому любой их противник — наш друг.
      Верните Стормланса к жизни, чтобы он смог вновь присоединиться к Чарльзу Кихоту.
  "69":
    1: |-
      Вы нашли моего отца? А копьё Эбонест?
      Мы должны вернуть его Чарльзу Кихоту!
  "70":
    1: |-
      Вы нашли Блейзена Стормланса? А МОЁ копьё Эбонест?
      Оно тоже у вас? ВЕЛИКОЛЕПНО!
      Благодарю вас и признаю, что теперь у вас в долгу.
      Я посвящу всех рыцарей вашего отряда в чемпионы, а остальных обучу всему, чему смогу.
  "71":
    1: |-
      Что это значит? Вы заключили союз с моими смертельными врагами, а теперь хотите оказать услугу мне?
      Интересно, что об этом думают драконы. Но будь по-вашему.
      Я у вас в долгу за возвращение Эбонеста. Я посвящу рыцарей вашего отряда в чемпионы, однако на мою службу их никогда не примут.
      Остальных я обучу всему, чему смогу. Больше я не желаю вас видеть!
  "72":
    1: |-
      «Союз ради объединения Джадама», говорите? Если бы это предложение исходило не от Лудрина, я бы попросту съел вас.
      Мысль любопытная, но сейчас я не могу её рассматривать. Проклятые рыцари Чарльза Кихота нападают на нас каждый день.
      Если бы Кихот перестал быть угрозой, я смог бы исполнить просьбу Лудрина.
      Возможно, вы поможете мне разобраться с ним?
  "73":
    1: |-
      В прошлом месяце один из отрядов Кихота вторгся в наши пещеры. Они перебили многих и унесли яйцо с моим ещё не родившимся наследником.
      Пока яйцо остаётся у этих мерзких истребителей, мы не можем напасть на их лагерь.
      Верните мне яйцо — и я смогу уничтожить Кихота. Сделайте это, и я присоединюсь к вашему союзу.
  "74":
    1: |-
      Если хотите, чтобы я присоединился к союзу, помогите мне одолеть Чарльза Кихота.
      Верните драконье яйцо, которое он у меня похитил!
  "75":
    1: |-
      Чтобы получить звание великого змея, дракон должен доказать, что способен противостоять множеству врагов.
      Он должен сокрушить вредителей, которых Чарльз Кихот посылает против нас.
      К юго-западу отсюда Кихот устроил лагерь своих жалких «истребителей драконов». Ими командует Джерик Вислбон, заместитель Кихота.
      Уничтожьте этот лагерь! Убейте всех слуг Кихота в той области и возвращайтесь ко мне.
      Принесите меч Вислбона Истребителя. Этим вы докажете, что достойны нового звания.
  "76":
    1: |-
      Вы думаете, я возвышу дракона, который служит союзникам нашего смертельного врага Чарльза Кихота?
      Какая дерзость! Какое бесстыдство!
      Вам придётся доказать свою ценность — и при этом нанести сокрушительный удар собственным союзникам.
      К юго-западу отсюда Кихот устроил лагерь своих жалких «истребителей драконов». Ими командует Джерик Вислбон, заместитель Кихота.
      Уничтожьте этот лагерь! Убейте всех слуг Кихота в той области и возвращайтесь ко мне с мечом Вислбона Истребителя.
  "77":
    1: |-
      Вы уничтожили «истребителей драконов»?
      Тогда где меч Вислбона Истребителя?!
  "78":
    1: |-
      Вы уничтожили «истребителей драконов»?
      Или передумали искупать свою вину передо мной?
  "79":
    1: |-
      Вы вернулись с мечом Вислбона Истребителя!
      Вы действительно достойны моего внимания!
      Драконы вашего отряда получают звание великих змеев.
      Остальных я в награду за помощь обучу всему, чему смогу!
  "80":
    1: |-
      Вы вернулись с мечом Вислбона Истребителя!
      Есть ли предел вашему вероломству? Остался ли хоть кто-нибудь, кому вы храните верность?
      Я возвышу драконов вашего отряда до великих змеев, но под моим началом они никогда не полетят!
      Остальных предателей я обучу тем навыкам, которым их ещё можно научить.
      А теперь уходите! Не показывайтесь мне на глаза, если не хотите быть съеденными!
  "81":
    1: |-
      Вы перебили истребителей драконов, но где меч Вислбона?
      Возвращайтесь, когда добудете его!
  "82":
    1: |-
      Хм… Дела, должно быть, и вправду плохи, раз торговец Лудрин занялся чем-то помимо собственной прибыли. И должен признать: в воздухе действительно чувствуется дыхание гибели.
      Ради продолжения выгодной торговли между нами я бы обычно рассмотрел предложение Лудрина. Но здешние дела требуют всех моих людей и средств, и для вашего союза ничего не остаётся.
      Впрочем, быть может, мы поможем друг другу? Уладьте для меня одно небольшое дело — и я подумаю над вашей просьбой.
  "83":
    1: |-
      Один из моих покупателей, огр с очаровательным прозвищем Зог Шакал, серьёзно обманул моё доверие.
      Я передал ему чрезвычайно ценную вещь под обещание будущей оплаты, но немалая сумма так и не поступила. Я послал гонца потребовать возврата товара — драконьего яйца с огромным потенциалом. Гонца убили!
      Разумеется, меня это крайне беспокоит. Я уже выделил людей и деньги для мести.
      Но если вы заберёте яйцо из крепости Зога в Блуждающем Разоре, я с радостью отдам силы под начало вашего союза.
  "84":
    1: |-
      Вы забрали драконье яйцо из крепости Зога в Блуждающем Разоре?
      Впрочем, не отвечайте — по вашим смущённым лицам и так всё ясно.
      Наш уговор остаётся в силе: принесите яйцо, иначе я не стану иметь дела с вашим союзом!
  "85":
    1: |-
      Вы нашли Блейзена Стормланса? Но где Эбонест?
      Возвращайтесь с копьём — и получите посвящение!
  "86":
    1: |-
      Проклятый рыцарь Чарльз Кихот собирает лучших истребителей драконов в лагере к юго-западу отсюда.
      Должно быть, он готовит новое нападение на Драконьи пещеры!
  "87":
    1: |-
      Вы хотите, чтобы моё стадо присоединилось к союзу? Как я могу вам отказать?
      Вы спасли нас от верной гибели, а теперь мы сами пострадали от катаклизма, с которым призван бороться этот союз.
      Даю вам слово: я немедленно отправлюсь в Равеншор и займу место в совете союза.
  "88":
    1: |-
      Это был настоящий кошмар! Я стоял на страже в главном лабиринте к северу отсюда, когда пришла вода.
      Огромная волна высотой с мой рост хлынула по проходам. Мне удалось добраться до этой верхней комнаты.
      Я ждал остальных, но никто не пришёл. Боюсь, многие из стада погибли или остались заперты в логове.
  "89":
    1: |-
      В Логове Бальтазара много уровней. Есть и другие помещения, расположенные так же высоко, поэтому кто-то ещё мог выжить.
      Я долго размышлял. Хотя многие туннели затоплены, воду, возможно, удастся спустить, используя двери и воздушные шахты как клапаны.
      Более того, всё логово можно осушить через эвакуационный туннель на нижнем уровне.
      Помогите моему стаду! Мы будем вечно вам благодарны.
  "90":
    1: |-
      Я чувствую, что в логове ещё остались выжившие из моего стада.
      Если вы поймёте, как отвести воду из затопленных проходов, то сможете до них добраться.
      Умоляю, помогите им!
  "91":
    1: |-
      Бальтазар, величайший вождь в истории нашего стада, повёл воинов в великую битву против мерзких тёмных гномов, которые выбираются из-под земли и распространяются, словно чума.
      Битва сложилась для нас неудачно. Бальтазару и нескольким воинам удалось спастись, но многие погибли. Вместе с ними был утрачен Топор Бальтазара — знак власти вождя и могущественный артефакт.
  "92":
    1: |-
      Лишь Масул, вождь нашего стада, может признать кого-либо достойным звания владыки минотавров.
      Доказать свою доблесть можно, вернув топор его отца — Топор Бальтазара — из глубин шахт тёмных гномов.
      Вступите на путь этого испытания, и великое будущее откроется перед вами!
      Но мы должны убедиться, что найденное оружие действительно является Топором Бальтазара.
      Покажите топор Дадероссу, минотавру на службе Торговцев Альвара, на острове Кинжальной Раны. Он сможет подтвердить подлинность находки.
  "93":
    1: |-
      Эти мелкие вредители служат элементалям Земли — или действуют вместе с ними. Никто не знает наверняка.
      Они выбираются из глубин в поисках богатств, пищи и рабов. После этих падальщиков не остаётся ничего.
  "94":
    1: |-
      Вы нашли Топор Бальтазара!
      Вы уже показали его Дадероссу? Без его подтверждения мы не можем начать Обряд очищения.
      Найдите его, предъявите топор и возвращайтесь к нам!
  "95":
    1: |-
      Вы нашли Топор Бальтазара! Вы показали его Дадероссу? Вижу, что он подтвердил подлинность!
      Обряд очищения начнётся немедленно. Вы доказали свою доблесть и стали членами нашего стада!
      Минотавры вашего отряда получают звание владык минотавров.
      Остальных мы обучим всему, что может им пригодиться.
  "96":
    1: |-
      Для меня было честью служить лорду Бальтазару — лучшему вождю в истории нашего племени.
      К несчастью, я был связан службой Торговцам Альвара, иначе мог бы участвовать в битве, где пал Бальтазар.
      Возможно, мои умения и мой топор спасли бы господина. Теперь мы уже никогда этого не узнаем.
  "97":
    1: |-
      Разумеется, я узнаю Топор Бальтазара с первого взгляда! Он у вас? Да, это действительно тот самый топор!
      Верните его Тессалару, чтобы над оружием совершили Обряд очищения и подготовили его для Масула, сына Бальтазара.
      Возьмите это письмо с моей личной печатью. Оно подтверждает, что перед вами подлинный Топор Бальтазара!
  "98":
    1: |-
      Где Топор Бальтазара? Вы лишь тратите моё время!
      Найдите топор, отыщите Дадеросса и возвращайтесь ко мне!
  "99":
    1: |-
      Благодарю вас за возвращение Топора Бальтазара!
      Завершив Обряд очищения, мы вручим топор Масулу. Отныне он будет известен как Топор Масула, а сам Масул наверняка станет мудрым и справедливым вождём стада.
  "100":
    1: |-
      Разумеется, я узнаю Топор Бальтазара с первого взгляда!
      Он у вас? Если найдёте его, возвращайтесь ко мне, и я подтвержу, что это действительно топор моего покойного господина Бальтазара.
  "101":
    1: "Вы нашли Топор Бальтазара, и я подтвердил его подлинность!\nСкорее возвращайтесь к Тессалару, чтобы он начал Обряд очищения!"
  "102":
    1: "Вы вернули Тессалару Топор Бальтазара и моё свидетельство!\nОбряд очищения уже начался.\nСкоро лорд Масул возьмёт в руки топор своего отца!\nК моему стаду вернётся былое величие!"
  "103":
    1: "Из многочисленных пророчеств Джадама я не изучил лишь Пророчества Солнца.\nЭтот храм основал Тесиус Доунглоу, много лет назад прибывший из Эратии на поиски пророчеств.\nК сожалению, найти их ему не удалось.\nМы надеемся, что в них скрыт способ остановить бедствия, разрушающие Джадам."
  "104":
    1: "Я знаю, что Пророчества можно найти в Логове Пернатого Змея.\nОднако я понятия не имею, что это значит, поэтому эта подсказка мне не помогает."
  "105":
    1: "Вы просите посвятить сопровождающих вас клириков нашей веры в священники Света?\nЯ могу это сделать, но в последнее время не склонен доверять незнакомцам.\nНайдите утраченные Пророчества Солнца и верните их мне — тогда я соглашусь провести посвящение."
  "106":
    1: "Вы нашли Логово Пернатого Змея и Пророчества Солнца?\nНе тратьте моё время! Мир гибнет, а вы отвлекаете меня пустыми разговорами!\nВозвращайтесь, когда найдёте Пророчества и доставите их в Храм Солнца."
  "107":
    1: "Вы нашли утраченные Пророчества Солнца?\nПусть Свет вечно сияет над вами, а Пророк направляет ваши шаги.\nВозможно, теперь мы узнаем, что же случилось с Джадамом!"
  "108":
    1: "Вы вернулись и сдержали слово: нашли Пророчества Солнца и доставили их моим братьям в Храм.\nВы доказали своё достоинство. С благословения Солнца я посвящу сопровождающих вас клириков в священники Света.\nОстальных членов отряда я в награду обучу всему, чему смогу."
  "109":
    1: "Корбу был самым могущественным из вампиров.\nБолее ста лет назад он стал искать то, что нашему роду чуждо, — искупление.\nКорбу начал испытывать вину из-за необходимости питаться, а возможно, из-за самого убийства ради пропитания.\nОн больше не мог мириться с тем, что для выживания должен лишать других жизни. Многие старейшины пытались его переубедить.\nКорбу решил удалиться туда, где смог бы поразмыслить о своём существовании. Так в Блуждающем Разоре рабским трудом была возведена его крипта.\nС тех пор как Корбу ушёл туда, о нём ничего не слышали."
  "110":
    1: "В эти смутные времена нам нужна мудрость всех старейшин.\nВерните нам Корбу, а если он погиб — его останки. В таком случае принесите также его саркофаг.\nМы попытаемся оживить Корбу, чтобы обратиться к его мудрости."
  "111":
    1: "Вы принесли останки Корбу, но где его саркофаг? Без него ритуал оживления не завершить!\nВозвращайтесь, когда у вас будут и останки, и саркофаг."
  "112":
    1: "Вы принесли саркофаг Корбу, но где его останки? Без них ритуал оживления не завершить!\nВозвращайтесь, когда у вас будут и саркофаг, и останки."
  "113":
    1: "Вы стремитесь постичь вершины тёмных искусств. Некроманты вашего отряда желают стать личами — могущественнейшими из себе подобных.\nЯ могу провести превращение, но вам придётся кое-что сделать для меня и кое-что добыть для себя.\nМне нужна утраченная Книга Кхела, хранящая тайны некромантии, сокрытые с тех пор, как башня Кхела ушла под воду. Ящеролюды Кинжальной Раны ликовали, когда море поглотило Кхела вместе с его знаниями.\nПосле недавнего извержения башня могла вновь показаться над водой. Найдите книгу в её библиотеке и принесите мне!\nКроме того, каждому желающему стать личем потребуется сосуд лича. У Безумной некромантки Занторы их много — возможно, она согласится продать их. Если нет, придётся отнять силой!"
  "114":
    1: "У вас есть утраченная Книга Кхела, но нет сосудов личей, необходимых для превращения!\nВозвращайтесь, когда добудете по одному сосуду для каждого некроманта в отряде."
  "115":
    1: "У вас нет утраченной Книги Кхела!\nЯ не помогу вам, пока вы не поможете мне.\nВозвращайтесь с Книгой и сосудом для каждого некроманта вашего отряда, желающего стать личем."
  "116":
    1: "Вы принесли всё необходимое для превращения. Да будет так!\nВсе некроманты вашего отряда станут личами. Пусть тёмная энергия течёт в них вечно!\nОстальных я в награду обучу всему, чему смогу.\nНачнём! Когда мы закончим, дальнейшими посвящениями сможет заниматься мой добрый друг Латеан."
  "117":
    1: "Вы принесли саркофаг Корбу и его священные останки.\nМы попытаемся оживить Корбу и обратиться к его мудрости в эти тревожные времена!\nВампиры вашего отряда станут носферату, а остальных мы в награду обучим всему, чему сможем."
  "118":
    1: "Логово Пернатого Змея?\nВозможно, речь идёт о ядовитых коатлях, хотя их не видели уже много веков."
  "119":
    1: "«Пророчества Солнца» так и не были найдены.\nВозможно, их и вовсе не существует. Эти пророчества были написаны нашим величайшим пророком.\nЕсли их найдут, мы надеемся, что их вернут нам!"
  "120":
    1: "Спасибо, что нашли «Пророчества Солнца».\nПусть Солнце всегда освещает ваш путь и дарует вам защиту!"
  "121":
    1: "Ты вернул нам Корбу, и мы всегда будем у тебя в долгу!\nА теперь оставь меня, чтобы я мог посоветоваться со старейшинами!"
  "122":
    1: "Чтобы учиться здесь, вы должны быть членом этой гильдии."
  "123":
    1: "Не в твоём состоянии!"
  "124":
    1: "Вы уже состоите в этой гильдии."
  "125":
    1: "У тебя не хватает золота!"
  "126":
    1: "Прежде чем стать мастером этого навыка, необходимо достичь уровня эксперта!"
  "127":
    1: "Прежде чем стать великим мастером этого навыка, необходимо достичь уровня мастера!"
  "128":
    1: "Вы пока не отвечаете требованиям для обучения."
  "129":
    1: "Вы уже достигли уровня эксперта в этом навыке."
  "130":
    1: "Вы уже достигли уровня мастера в этом навыке."
  "131":
    1: "Вы уже достигли уровня великого мастера в этом навыке."
  "132":
    1: "Чтобы стать экспертом, сначала необходимо изучить сам навык!"
  "133":
    1: "В этом месяце объявлена награда за %s.\nУбейте цель и вернитесь до конца месяца, чтобы получить %lu золотых."
  "134":
    1: "Вы одолели %s! Поздравляю!\nВот обещанная награда — %lu золотых.\nВозвращайтесь в следующем месяце за новой целью."
  "135":
    1: "В этом месяце награду уже забрали.\nВозвращайтесь в следующем месяце за новой целью."
  "136":
    1: "Партии проходят на стандартной колоде «Аркомага»; соперника предоставим мы.\nУсловия победы зависят от таверны: возведите башню до требуемой высоты, разрушьте башню противника или раньше него накопите необходимое количество ресурсов.\nКрупные жёлтые числа показывают мощность генераторов — столько единиц соответствующего ресурса вы получите в следующий ход. Маленькие чёрные числа показывают текущий запас ресурсов.\nВ правом нижнем углу каждой карты указана её стоимость. При розыгрыше она вычитается из ресурса соответствующего цвета.\nЩёлкните карту левой кнопкой мыши, чтобы разыграть её, или правой, чтобы сбросить.\nКрасный цвет обозначает Каменоломню, производящую кирпичи; синий — Магию, производящую самоцветы; зелёный — Зверинец, производящий зверей."
  "137":
    1: "Здесь каждый игрок начинает партию в «Аркомаг» с башней высотой 15 и стеной высотой 5.\nЧтобы победить, доведите высоту башни до 30, накопите 100 единиц любого ресурса или разрушьте башню соперника."
  "138":
    1: "Здесь каждый игрок начинает партию в «Аркомаг» с башней высотой 20 и стеной высотой 5.\nЧтобы победить, доведите высоту башни до 50, накопите 150 единиц любого ресурса или разрушьте башню соперника."
  "139":
    1: "Здесь каждый игрок начинает партию в «Аркомаг» с башней высотой 20 и стеной высотой 5.\nЧтобы победить, доведите высоту башни до 50, накопите 150 единиц любого ресурса или разрушьте башню соперника."
  "140":
    1: "Здесь каждый игрок начинает партию в «Аркомаг» с башней высотой 25 и стеной высотой 10.\nЧтобы победить, доведите высоту башни до 75, накопите 200 единиц любого ресурса или разрушьте башню соперника."
  "141":
    1: "Здесь каждый игрок начинает партию в «Аркомаг» с башней высотой 25 и стеной высотой 10.\nЧтобы победить, доведите высоту башни до 75, накопите 200 единиц любого ресурса или разрушьте башню соперника."
  "142":
    1: "Здесь каждый игрок начинает партию в «Аркомаг» с башней высотой 30 и стеной высотой 15.\nЧтобы победить, доведите высоту башни до 100, накопите 300 единиц любого ресурса или разрушьте башню соперника."
  "143":
    1: "Здесь каждый игрок начинает партию в «Аркомаг» с башней высотой 30 и стеной высотой 15.\nЧтобы победить, доведите высоту башни до 100, накопите 300 единиц любого ресурса или разрушьте башню соперника."
  "144":
    1: "Здесь каждый игрок начинает партию в «Аркомаг» с башней высотой 20 и стеной высотой 10.\nЧтобы победить, доведите высоту башни до 150, накопите 400 единиц любого ресурса или разрушьте башню соперника."
  "145":
    1: "Здесь каждый игрок начинает партию в «Аркомаг» с башней высотой 20 и стеной высотой 10.\nЧтобы победить, доведите высоту башни до 200, накопите 500 единиц любого ресурса или разрушьте башню соперника."
  "146":
    1: "Здесь каждый игрок начинает партию в «Аркомаг» с башней высотой 20 и стеной высотой 50.\nЧтобы победить, доведите высоту башни до 100, накопите 300 единиц любого ресурса или разрушьте башню соперника."
  "147":
    1: "Здесь каждый игрок начинает партию в «Аркомаг» с башней высотой 10 и стеной высотой 20.\nЧтобы победить, доведите высоту башни до 125, накопите 350 единиц любого ресурса или разрушьте башню соперника."
  "148":
    1: "Здесь каждый игрок начинает партию в «Аркомаг» с башней высотой 10 и стеной высотой 20.\nЧтобы победить, доведите высоту башни до 125, накопите 350 единиц любого ресурса или разрушьте башню соперника."
  "149":
    1: "Здесь каждый игрок начинает партию в «Аркомаг» с башней высотой 50 и стеной высотой 50.\nЧтобы победить, доведите высоту башни до 100, накопите 300 единиц любого ресурса или разрушьте башню соперника."
  "150":
    1: "«Потерянная книга Кхела» позволит мне овладеть тёмными искусствами даже лучше, чем Сандро!\nЯ навсегда остаюсь твоим должником!"
  "151":
    1: "Нам нужно посоветоваться с Корбу!\nТы же согласился принести нам его останки и его саркофаг!\nНе беспокой нас, пока не принесешь эти предметы!"
  "152":
    1: "Корбу?\nОн был величайшим из нашего рода, и тем не менее всегда казался озабоченным.\nЕсть среди нас те, кто помнит времена до его ухода. Мне он всегда казался озабоченным."
  "153":
    1: "Корбу покинул нас после того, как заключил «Договор» с некромантами здесь, в Шэдоуспайре.\nМы помогаем им в любых исследованиях, над которыми они работают, и содействуем в защите их гильдии.\nВзамен нам разрешено беспрепятственно питаться местным населением."
  "154":
    1: "Гильдия некромантов очень скупо расстаётся с сосудами личей.\nВозможно, вам лучше обратиться к Занторе и получить один у неё."
  "155":
    1: "Ходят слухи, что в «Потерянной книге Кхела» хранятся секреты всемогущей силы тёмного искусства некромантии.\nВозможно, это даже к лучшему, что никто не знает, где она находится!"
  "156":
    1: "Бастиан Лаудрин всегда был верным другом нашей гильдии. К сожалению, на данный момент я вынужден отклонить его просьбу. Прямо сейчас моя гильдия ведёт борьбу за само выживание. Дело в том, что Храм Солнца объявил нам священную войну. Большинство наших членов находятся на поле боя — либо возглавляют армии, либо воскрешают зомби для службы в них. Хотелось бы сказать иное, но проклятый храм имеет преимущество. Если бы только чаша весов склонилась в нашу пользу."
  "157":
    1: "Если бы Жаровня Ночной Тени снова оказалась в наших руках, оборона Шэдоуспайра не представляла бы никакой проблемы. Мы смогли бы перенести эту войну прямо к воротам Храма Солнца. Мы бы их уничтожили! Понимая всю важность этого предмета, жрецы хранят жаровню в надежно защищённой камере глубоко внутри своего храма. Дайсон Лиланд считает, что сможет проникнуть в эту камеру. Отведите его в храм, добудьте жаровню и верните её мне. Вы хотите, чтобы я вступил в ваш союз? Что ж, сделайте это для меня, и я буду у вас в долгу. Если у вас есть вопросы о Жаровне Ночной Тени, обратитесь к Танту. Именно он создал это устройство."
  "158":
    1: "Я не присоединюсь к вам, пока безопасность гильдии не будет обеспечена. Принесите мне Жаровню Ночной Тени из Храма Солнца в Мурмурвуде. После этого мы снова поговорим о союзе."
  "159":
    1: "В самом начале нашего конфликта «Храм Солнца» попытался внедрить в наши ряды шпиона. Какая глупость — думать, что им так легко удастся обмануть целую армию тёмных магов! Разоблачить их агента — некоего «Дайсона Лиланда» — было детской забавой. С тех пор мы настроили его против его бывших хозяев — по крайней мере, так кажется. Честно говоря, я не до конца уверен в его лояльности. Тем не менее он оказался полезным. Пока это так, мы будем продолжать оставлять его в живых."
  "160":
    1: "Как стремление к власти может заставить человека принять участие в ужасах Тёмного Пути? И тем не менее, здесь целый дом таких! О, они назовут себя «искателями знаний», но эти маги смерти — настоящее отвращение! Воплощение отвратительной порочности! Только благодаря моему собственному страху гнусная Гильдия некромантов может называть себя «моим господином»."
  "161":
    1: "В юности я мечтал только об одном — вступить в Орден Света, чтобы стать бескорыстным слугой добра. Как только я достиг совершеннолетия, я вошёл в Храм Солнца с сердцем, наполненным огнём чистоты. Каким же я был глупцом! Если в этом мире и существует добро, я его не видел. В залах Храма Солнца его точно нет! Прикрываясь праведностью и святостью, члены Ордена совершают самые ужасные преступления, продиктованные жадностью и самоудовлетворением. Если бы это не было так ужасно, это можно было бы принять за некую иронию."
  "162":
    1: "Несколько месяцев назад меня вызвали на частную аудиенцию к верховному жрецу Храма Солнца, Оскару Тайру. Он поручил мне проникнуть в Гильдию некромантов. «Стань таким, как они, — сказал он. — Завоюй их доверие. Пока будешь выжидать подходящего момента, чтобы нанести смертельный удар, передавай нам их секреты». Слишком простой план от слишком простого лидера! О, я сделал, как он велел, погрузившись в зло, чтобы казаться злым. Но было так, будто гильдия могла заглянуть в моё сердце. Меня разоблачили как шпиона. Под угрозой смерти я теперь выполняю их приказы."
  "163":
    1: "Присоединиться к вам? Интересная идея. Но что вы можете мне предложить? После всего, что мне пришлось пережить, меня поглощает жажда мести. Я бы пошел с вами, но не хочу тратить свои силы напрасно. Дайте мне возможность нанести удар одному из моих врагов — проклятому Храму Солнца или отвратительной Гильдии некромантов — и я с радостью отправлюсь с вами."
  "164":
    1: "Теперь, когда Жаровня Ночной Тени окутывает Шэдоуспайр своей укрепляющей тьмой, Тант отправляется во главе своих приспешников."
  "165":
    1: "Безусловно, беспорядки, вызванные стихиями, вызывают у нас глубокую тревогу. Ведь достаточно пройти всего лишь небольшое расстояние к северу от нашего храма, чтобы увидеть огромный водоворот, отличающийся небывалой продолжительностью и яростью. Но, к сожалению, у нас есть и другие неотложные дела. Этот отвратительный кошмар — Гильдия некромантов — должен быть искоренен с этой земли! Мы ведем священную войну против зла в Шэдоуспайре. Всю нашу душу и силу мы вкладываем в кампанию, которую ведём против Сандро и его приспешников. Пока это не будет сделано, мы не можем рассматривать возможность участия в вашем альянсе."
  "166":
    1: "С другой стороны, мы могли бы выделить часть ресурсов вашему альянсу, если война пойдёт в нашу пользу. Возможно, вы могли бы стать нашим агентом удачи? В Гильдии некромантов находится устройство, известное как «Трансформатор скелетов». Оно превращает живых существ в скелеты, которые тёмные маги используют в качестве основной части своих подкреплений. Если бы его уничтожить, мы быстро получили бы преимущество. У нас есть агент, Дайсон Лиланд, внедренный в их гильдию. Найдите его и помогите ему уничтожить их устройство для создания скелетов. Сделайте это, и я более благосклонно рассмотрю вашу просьбу."
  "167":
    1: "Ты опять пришёл сюда с разговорами о союзе? Я уже сказал тебе, что нужно делать. Отправляйся в Гильдию некромантов в Шэдоуспайре, найди Дайсона Лиланда и помоги ему уничтожить их «Скелет-трансформер»!"
  "168":
    1: "Отличная работа! Теперь, когда «Скелетный трансформер» уничтожен, я более чем уверен, что свет праведности очистит Шэдоуспайр от зла. Гильдия некромантов фактически перестала существовать. Как мы и договорились, теперь вы можете считать Храм Солнца своим союзником в борьбе со стихийным катаклизмом. Я сам войду в состав вашего совета альянса в Равеншоре. Я как можно скорее займусь подготовкой к отправлению."
  "169":
    1: "Неужели ты относишься к пророчеству настолько легкомысленно, что уклоняешься от роли, которую оно тебе отводит? Настали мрачные времена, требующие от всех решительных действий. Отправляйся в путь по всей стране и укрепляй единство, символом которого является альянс. Иди, если, конечно, ты не предпочитаешь забвение, которое нам грозит!"
  "170":
    1: "С помощью кораблей «Арион Хантер» нам удалось собрать некоторую информацию. Я отправил одну лодку в Блуждающий Разор, а другую — на Острова Кинжальной Раны. Сообщается, что в обоих регионах появились странные порталы. Портал на островах расположен на склонах большого вулкана, возвышающегося из моря к юго-востоку от главного острова. Портал в Блуждающем Разоре находится посреди большого озера. Говорят, что вода, образовавшая озеро, хлынула из этого портала."
  "171":
    1: "Спустя всего несколько часов после нашей первой встречи произошло совершенно неожиданное событие. С нами связался великий мудрец Ксантор из двора Айронфистов в Энроте! Используя свою могущественную магию, он проецировал свой образ прямо в эту комнату. Он, Роланд и Кэтрин Айронфист находились в море у наших берегов, когда произошёл катаклизм. Они пережили разразившиеся штормы и теперь хотели бы высадиться в Равеншоре, чтобы помочь альянсу. К сожалению, им преграждает путь пиратский флот Регнана. Мы должны помочь им высадиться на берег. Ксантор утверждает, что хорошо осведомлён о том, что здесь произошло. Нам нужен его совет!"
  "172":
    1: "Наши источники полагают, что основной флот Регны находится в скрытом порту где-то на острове Регна. Если бы вам удалось потопить этот флот в доке, это значительно ослабило бы их способность патрулировать воды у наших берегов. К сожалению, у нас нет собственного флота, достаточно сильного, чтобы высадиться на Регне. Брекиш Одноклык передал нам сообщение о том, что регняне построили аванпост на атолле у берегов главного из Островов Кинжальной Раны. Он полагает, что этот аванпост снабжается таинственным образом. Его разведчики никогда не видели, чтобы туда причаливали корабли, но запасы там всегда в избытке. Возможно, вам стоит отправиться туда и разгадать эту загадку. Возможно, ответ приведёт вас в Регну? Независимо от способа, флот Регны должен быть потоплен, если Айронфисты собираются высадиться в Равеншоре."
  "173":
    1: "Ваша достойная работа по уничтожению флота Регнана уже принесла желаемые результаты. Буквально вчера утром прибыли Кэтрин и Роланд Айронфист вместе со своим мудрецом Ксантором. С их присоединением к альянсу мы стали сильнее — неизмеримо сильнее. Признаю, что период этого кризиса стал для меня одним из самых мрачных моментов в жизни. Благодаря вашим усилиям я верю, что самое худшее уже позади. У меня есть надежда, что мы действительно переживем это."
  "174":
    1: "Вы должны потопить этот регнанский флот! Крайне важно, чтобы Айронфисты смогли благополучно высадиться на берег. Их мудрец Ксантор обладает знаниями о кризисе, без которых мы не обойдемся."
  "175":
    1: "Несмотря на все их притязания на имперское величие и цивилизованные манеры, регнанцы — самая отвратительная шваль Джадама. Меня ничуть не удивляет, что они воспользовались кризисом, чтобы расширить свои пиратские операции. Больше всего меня беспокоит их новый аванпост на Островах Кинжальной Раны. Я уверен, что они намерены использовать его как базу для нападений на континент. Ведь теперь им доступен даже Равеншор!"
  "176":
    1: "Я встречался с ним лишь мельком, но убеждён, что Ксантор обладает поразительными знаниями о устройстве стихийных планов. Судя по всему, он многому научился у стихийных союзников Айронфистов во время их недавних походов против дьяволов Эратии. Даже сейчас он изучает тот странный кристалл на городской площади. Вы можете найти его там или, возможно, в соседней резиденции, которую мы для него предоставили."
  "177":
    1: "Мы, члены совета, глубоко верим в этого Ксантора. Он рассказал мне, что разрабатывает план по преодолению кризиса, связанного с стихиями. Если кто-то и способен найти решение наших проблем, то это именно он. Если вы хотите оказать нам дальнейшую помощь, прислужитесь этому великому мудрецу. Проконсультируйтесь с ним по поводу кристалла и посмотрите, чем вы могли бы ему помочь."
  "178":
    1: "Мы рассчитываем на Ксантора в определении наших дальнейших действий. Обратитесь к нему и узнайте, чем вы можете помочь."
  "179":
    1: "То, что к нам присоединился королевский двор Энрота, принесло одни только благие плоды. Я опасался, что их одолеет тяга к пышности, которая заражает многих других монархов. Я с радостью сообщаю, что это не относится к этому королю и королеве. Они сошли на берег и сразу же приступили к решению нашей проблемы. Как ключевые члены нашего альянса, вам будет легко с ними связаться. Мы разместили их в домах здесь, в Равеншоре."
  "180":
    1: "Судя по тому, что рассказал нам Ксантор, я уверен, что все стихийные миры опасны. Тем не менее я бы посоветовал вам проявлять особую осторожность при исследовании Мира Огня. Его обитатели, судя по сообщениям из Железнопесчаной пустыни, ведут себя особенно агрессивно."
  "181":
    1: "Всё, что я знаю о Плане между мирами, — это то, чему меня научили альварские хранители знаний. Тем не менее, если база Разрушителя находится там, действуйте с предельной осторожностью! Говорят, что этот план состоит из субстанции хаоса, из которой все остальные планы сформированы словно из глины. Хотя хаос и имеет форму, он текуч. Всё, что вы там увидите, будет не таким, каким кажется. И то, что там находится, может подвергаться постоянным изменениям."
  "182":
    1: "Здесь применимо то, что рассказали мне мастера знаний Альвара о «Плоскости между плоскостями». Хотя я уверен, что тюрьмы повелителей стихий являются тюрьмами во всех смыслах этого слова, я столь же уверен, что они не будут выглядеть так, как можно было бы ожидать."
  "183":
    1: "Торговая гильдия Альвара в большом долгу перед вами. В качестве скромной благодарности мы решили предоставить вам этот торговый дом в бессрочное пользование. Примите этот подарок от нас в знак нашей глубокой признательности за ваши доблестные поступки."
  "184":
    1: "Я знаю, что участие в вашем альянсе — это важная работа. Но всё же я скучаю по охоте! Я всё время представляю, как весело проводят время мои люди, пока я здесь вожусь с бумагами. Поторопитесь с этим делом с альянсом! Я хочу поскорее покончить с этой неразберихой! Без азарта охоты в моей жизни не хватает привычной искры."
  "185":
    1: "Судя по тактике, которую применяют регнанские пираты, я подозреваю, что к этому причастен Блэквелл Купер. Купер — мой старый… как бы это сказать… «партнёр». Если бы я был азартным человеком, то поставил бы золото на то, что именно он возглавляет регнанский экспедиционный отряд на Островах Кинжальной Раны."
  "186":
    1: "Я знаю, что по этому вопросу моя точка зрения является меньшинством в совете, но, честно говоря, я не понимаю, зачем нам привлекать к этому делу какого-то шарлатана-фокусника! Наверняка этот кризис, как и большинство других проблем, можно решить с помощью разумного применения куска хорошо закаленной стали."
  "187":
    1: "Фу! По-моему, эта затея Ксантора — чистая безрассудство! Я считаю, что если нам грозит нападение армий стихий, мы должны собрать собственную армию, чтобы дать им отпор. Честно говоря, все эти разговоры о пророчестве вызывают у меня беспокойство. Этот совет слишком сильно находится под влиянием любимого волшебника Айронфистов. Я предлагаю перенести сражение на стихийные планы и познакомить захватчиков с острыми лезвиями наших мечей!"
  "188":
    1: "Говорю вам, этот Ксантор гонит вас впустую. «План между планами», да еще и как! Какая чепуха! Хуже всего то, что мы не готовимся к войне на случай, если этот безумный план провалится, а я уверен, что так и будет. Это безумное следование пророчеству идет вразрез со здравым военным смыслом!"
  "189":
    1: "У меня было немало сомнений по поводу этого Ксантора, но способность человека признавать свои ошибки — верный признак его мужества. Теперь мне ясно, что он давал только дельные и полезные советы. Если он говорит тебе спасти повелителей стихий, значит, именно это ты и должен сделать. Вперед! И удачи!"
  "190":
    1: "Рад снова вас видеть, герои Джадама. Отлично поработали: спасли мир и всё такое. Я, безусловно, вам благодарен, как, уверен, и многие другие. Наверняка у вас сейчас полно других возможностей, но дайте знать, если захотите поохотиться на драконов. Для таких, как вы, это, наверное, не составит большого труда, но предложение остаётся в силе!"
  "191":
    1: "Малыши, поторопитесь с подготовкой к союзу! Моё терпение по отношению к этой земле, где нет ни пещер, ни добычи, опасно на исходе. Мне не только приходится спать в сарае, но эти люди даже скота не разводят. Мне приходится питаться рыбой! Фу! Если вам дорого моё добродушие, то поторопитесь!"
  "192":
    1: "Добраться до острова Регна — задача не из лёгких. Один из моих разведчиков доложил мне, что море густо заполнено регнскими судами. Он также сообщил, что видел, как у регнцев есть судно, способное передвигаться под водой. Говорят, что они снабжают этим судном свой аванпост на Островах Кинжальной Раны. Возможно, вы сможете воспользоваться им, чтобы добраться до Регны. Пираты либо не заметят вас, либо примут вас за одного из своих."
  "193":
    1: "Я знаю, что сейчас не время думать о мести, но я хотел бы поделиться с тобой тем, что узнал о моём враге, Чарльзе Кихоте. Король минотавров Масул упомянул, что Кихот хранит в своей крепости меч, обладающий огромной силой. Он называется «Змея». Возможно, если ты его добываешь, это поможет делу альянса?"
  "194":
    1: "Мои драконьи патрули обнаружили два входа в миры стихий. Один из них находится на склоне большого вулкана к юго-востоку от крупнейших Островов Кинжальной Раны. Другой расположен в центре большого озера в «Бродячих Руинах». Я не знаю, куда они ведут, но чтобы добраться до любого из них, вам придётся преодолеть значительное расстояние по воде."
  "195":
    1: "Незадолго до твоего прибытия в мою пещеру заглянул эратский дракон. Он сообщил мне, что в Эратии был замечен новый вид дракона, словно сложенный из кристаллической породы. Не знаю, зачем я тебе это рассказываю. Возможно, гигантский кристалл на городской площади напомнил мне об этой истории."
  "196":
    1: "Интересно, что сам Разрушитель посылает тебя, чтобы ты разрушил плоды его труда. Пожалуй, я не удивлён. Пути высших сил, мягко говоря, загадочны."
  "197":
    1: "Вы оказали этой земле и роду драконов огромную услугу. За это мы в долгу перед вами. Знайте: мы будем терпеть ваше присутствие в наших пещерах, более того, мы не будем охотиться на вас как на добычу."
  "198":
    1: "Знаете ли вы, что наш храм в Мурмурвуде — первый на земле Джадама? Наша миссия — нести Свет во все уголки мира, даже сюда. Мы с удивлением обнаружили, что наши враги из Гильдии некромантов опередили нас и уже построили здесь свой храм. Но неважно: скоро с ними будет покончено. Скажите, разве этот торговый дом не прекрасно подошёл бы для храма Солнца? Я обсужу это с Феллмуном, когда кризис минует."
  "199":
    1: "Если вы отправляетесь в Регну, вам, возможно, стоит поискать Булаву Солнца. Когда мы с братьями переправлялись из Эратии, на нас напал регнский флот. Все наши корабли, кроме одного, сумели спастись. К сожалению, на потерянном корабле находился руководитель экспедиции — брат Хоу. Оружие было у него. Я видел, как брата Хоу убили пираты, но, возможно, булава до сих пор у них."
  "200":
    1: "Как ты смеешь оскорблять меня своим присутствием?\nТы избрал Путь Света и навсегда отрекся от меня как от своего учителя.\nУходи же и валяйся в своей слабости где-нибудь в другом месте."
  "201":
    1: "Ваша отвага внесла огромный вклад в укрепление нашей веры, Священники.\nС большим удовольствием я объявляю о повышении всех Священников до звания Священников Тьмы, а всех почетных Священников — до звания Почетных Священников Тьмы.\nОгромное спасибо за вашу помощь!"
  "202":
    1: "Знаешь… У меня есть магический камень, который активирует портал в заброшенный храм. А у тебя есть камень, который позволит нам добраться до острова, где находится этот портал! Если мы объединим усилия, то без труда доберемся до храма. Что скажешь?"
  "203":
    1: "Похоже, ваша группа уже укомплектована, так что сейчас я не смогу путешествовать с вами. Но предложение по-прежнему в силе. Если я вам понадоблюсь, я буду в Гостинице искателей приключений."
  "204":
    1: "Хотите ли вы взять в свою группу рыцаря Саймона Темплара?\nЕсли вы хотите, чтобы Саймон Темплар присоединился к вам, нажмите «ДА».\nЕсли вы хотите, чтобы он подождал вас в Гостинице искателей приключений, нажмите «НЕТ»."
  "205":
    1: "Ребята, чтобы я смог создать анимацию, все детали должны быть на месте и правильно собраны!\nЯ не могу создавать анимацию для неполных големов."
  "206":
    1: "Отлично. Ты сделал то, о чём я тебя просил. Теперь я отплачу тебе тем же. Я отправлюсь с тобой, чтобы встретиться с главой твоей купеческой гильдии, а может, и дальше, если ты меня примешь. Мне здесь почти нечего делать. Пойдем?"
  "207":
    1: "Похоже, в вашей группе уже не хватает места, чтобы я мог присоединиться. Поэтому я отправлюсь один в Гостиницу искателей приключений. Встретимся там, когда у вас освободится место. А пока — до свидания."
  "208":
    1: "Хотите, чтобы Ариус-Минотавр присоединился к вам?"
  "209":
    1: "Я с удовольствием отправлюсь с вами в путь, когда ваша группа станет не такой многочисленной. Я отправлюсь в Гостиницу искателей приключений. Если я вам понадоблюсь, я буду там."
  "210":
    1: "Хотите, чтобы к вам присоединилась Рохани Осклетон, тёмная эльфийка?"
  "211":
    1: "Я рад, что ты решил взять меня с собой, но в твоей группе уже нет мест. Похоже, я начну своё приключение с поездки в Гостиницу искателей приключений. Увидимся там!"
  "212":
    1: "Ну, я готов к путешествию. Пойдем?"
  "213":
    1: "Хм. Похоже, ваша группа уже укомплектована. Я отправлюсь в Гостиницу искателей приключений. Там вы найдете меня готовым присоединиться к вам, когда у вас освободится место. Удачи."
  "214":
    1: "Примете ли вы дракона Итилгора в свою команду?"
  "215":
    1: "Хотя ваша группа и укомплектована, я всё равно присоединюсь к вашему делу. Я отправлюсь в Гостиницу искателей приключений. Встречайте меня там, если хотите, чтобы я путешествовал вместе с вами."
  "216":
    1: "Примете ли вы некромантку Каранью Меморию в свою команду?"
  "217":
    1: "Сейчас я не могу отправиться с вами в путь; в вашей группе уже слишком много людей. Если вы хотите, чтобы я путешествовал с вами, вы найдете меня в Гостинице искателей приключений."
  "218":
    1: "Согласны ли вы принять жреца Мейландера в число своих последователей?"
  "219":
    1: "Хм, я предпочитаю путешествовать с меньшей группой, чем у вас. Знаете что? Я отправлюсь в Гостиницу искателей приключений. Если я вам понадоблюсь, я буду там. До тех пор — до свидания."
  "220":
    1: "«Я всегда буду у вас в долгу за то, что вы спасли моего отца.\nДля меня было бы честью и привилегией, если бы вы позволили мне путешествовать вместе с вами»."
  "221":
    1: "Хотя для меня большая честь, что вы пригласили меня, я не смогу присоединиться к вам, так как ваша группа уже укомплектована.\nЕсли вам когда-нибудь понадобятся мои услуги, вы найдете меня в Гостинице искателей приключений."
  "222":
    1: "Деревня Раст всегда будет вам благодарна за то, что вы нашли Древнее жилище троллей.\nДля меня было бы большой честью, если бы вы позволили мне путешествовать вместе с вами."
  "223":
    1: "Для меня большая честь, что вы предложили мне путешествовать вместе с вами, однако я вижу, что ваша группа уже укомплектована.\nЯ отправлюсь в Гостиницу искателей приключений.\nВы сможете найти меня там, если захотите, чтобы я присоединился к вам в путешествии."
  "224":
    1: "Теперь, когда мое стадо в безопасности, я с радостью присоединюсь к вам. Уверен, что повелитель стада Масул не будет против того, чтобы я помог спасителям моего народа. Пойдем?"
  "225":
    1: "Я понимаю, что ваша группа слишком велика, чтобы принять меня в свои ряды. Тем не менее, ваше предложение разжигало мою жажду приключений. Я отправлюсь в Равеншор и попробую там свою удачу. Возможно, вы найдёте меня в местной таверне «Приключенец». Я буду ждать вас там!"
  "226":
    1: "Примете ли вы в свою группу Джаспа Телборна, тёмного эльфа?"
  "227":
    1: "Ну, я бы с удовольствием пошел с вами прямо сейчас, но в вашей группе уже не осталось мест. Но я готов предложить вам свои услуги. Я пойду в Гостиницу искателей приключений. Ищите меня там, если захотите, чтобы я присоединился к вам."
  "228":
    1: "Примете ли вы вампира Гетрика Меркутуру в свою группу?"
  "229":
    1: "Ах, но в вашей группе уже не осталось мест. Но теперь всё решено. Мне нужна жизнь, полная приключений! Я отправлюсь в Гостиницу искателей приключений. Если вы меня примете, я буду там."
  "230":
    1: "Вы берете дракона Фламдринга в свою команду?"
  "231":
    1: "Присоединиться к ним? Да? Но нет, их слишком много. Но я всё равно ищу приключений. Что ж, тогда мне нужно отправиться в Гостиницу искателей приключений, ведь там собираются те, кто ищет свою удачу."
  "232":
    1: "Собираетесь ли вы отправиться в путешествие вместе с некроманткой Хеватией Деверберо?"
  "233":
    1: "В вашей группе уже слишком много людей, и я не могу к вам присоединиться. Я пойду в Гостиницу искателей приключений. Там вы сможете взять меня в отряд, когда освободится место."
  "234":
    1: "Вы берете в свою группу клирика Вериша?"
  "235":
    1: "Я знаю, что, присоединившись к вам, я бы хорошо послужил Свету, но в вашей группе уже нет места. Я пойду в Гостиницу искателей приключений. Встретимся там, если у вас найдется место."
  "236":
    1: "Вы берете рыцаря Неликса Уриэля в свою команду?"
  "237":
    1: "Я не могу пойти с тобой. В твоей группе уже все места заняты. Но знаешь что? Здесь дела подходят к концу, и мне почти нечего делать. Я отправлюсь в Гостиницу искателей приключений и попробую там попытку счастья. Может, там мы и встретимся."
  "238":
    1: "Примете ли вы тролля Сетрк Тистлбоун в свою группу?"
  "239":
    1: "Хм… В твоей группе уже не осталось мест, но я всё равно хочу тебе помочь. Я пойду в Гостиницу искателей приключений. Если тебе понадобится сильный боец, ты найдёшь меня там."
  "240":
    1: "Хотите отправиться в путешествие с Рионелем-минотавром?"
  "241":
    1: "Сейчас я не могу пойти с вами. Ваша группа уже укомплектована. Но я по-прежнему буду к вашим услугам. Если я вам понадоблюсь, меня можно найти в Гостинице искателей приключений."
  "242":
    1: "Примете ли вы в свою команду Адрика Стелларе, тёмного эльфа?"
  "243":
    1: "Да, я с удовольствием присоединюсь к вам. К сожалению, ваша группа уже полна. Знаете что? Я пойду в Гостиницу искателей приключений. Если захотите путешествовать со мной, найдёте меня там."
  "244":
    1: "Примете ли вы вампира Инфаустуса в свою команду?"
  "245":
    1: "Я бы пошел с тобой, но в твоей группе уже слишком много людей. Я предпочитаю путешествовать в меньшем составе. Пойду сейчас в Гостиницу искателей приключений. Там я найду своих спутников."
  "246":
    1: "Предложить ли дракону Бримстоуну присоединиться к вам?"
  "247":
    1: "Ах, но в вашей группе уже не осталось мест. Тем не менее, вы явно те, кого я ищу. Я пойду в Гостиницу искателей приключений. Присоединяйтесь ко мне там, когда у вас освободится место."
  "248":
    1: "Гильдия «Шэдоуспайр» выражает огромную благодарность за то, что вы вернули «Потерянную книгу Кхела»! Может быть, я смогу присоединиться к вам в путешествии и оказать вам свою личную помощь?"
  "249":
    1: "Я бы хотел присоединиться к вам в путешествии, чтобы оказать вам личную помощь, но вижу, что ваша группа уже укомплектована.\nЕсли я вам понадоблюсь, вы найдёте меня в Гостинице искателей приключений."
  "250":
    1: "Это было очень благородно с вашей стороны — искать лекарство для рыцаря Блейзена Стормланса.\nЯ хотела бы присоединиться к вам в этом путешествии! Примите ли вы меня?"
  "251":
    1: "Хотелось бы присоединиться к вам прямо сейчас, но в вашей группе уже слишком много людей. Я буду ждать вас в Гостинице искателей приключений. А пока — удачи!"
  "252":
    1: "Вы берете рыцаря Темпуса в свою команду?"
  "253":
    1: "Я не могу отправиться с вами. Ваша группа слишком большая для моего вкуса. Мне нравится работать с небольшой и более мобильной группой. Вот что я вам скажу. Я пойду в Гостиницу искателей приключений. Присоединяйтесь ко мне там, как только избавитесь от лишнего балласта."
  "254":
    1: "Отправитесь ли вы в путешествие вместе с троллем Торном Андерстоуном?"
  "255":
    1: "Отлично. Послушай. Мне нужно уладить кое-какие дела, прежде чем я смогу пойти с тобой. Встретимся в Гостинице искателей приключений. Я присоединюсь к тебе там."
  "256":
    1: "Примете ли вы Ульбрехта-Минотавра в свою команду?"
  "257":
    1: "Я бы пошла с тобой прямо сейчас, но в твоей группе уже нет места. Я подготовлюсь и потом отправлюсь в Гостиницу искателей приключений. Встретимся там, когда у тебя найдётся для меня место. А пока — удачи!"
  "258":
    1: "Ещё раз спасибо за помощь!\nМожно я присоединюсь к вам?"
  "259":
    1: "Я бы с удовольствием присоединился к вашим приключениям, но ваша группа уже укомплектована!\nБуду ждать вас в Гостинице искателей приключений."
  "260":
    1: "Примете ли вы вампира Арториуса Веритаса в свою группу?"
  "261":
    1: "Я не могу пойти с тобой, в твоей группе уже слишком много людей. Я пойду в Гостиницу искателей приключений. Присоединяйся ко мне там."
  "262":
    1: "Вы берете в свою команду Дракона, Дурота Вечного?"
  "263":
    1: "Я присоединюсь к вам, но не сейчас. Мне нужно уладить несколько дел, на что у меня уйдет несколько дней. Как только я с этим разберусь, я пойду в Гостиницу искателей приключений. Встретимся там."
  "264":
    1: "Согласны ли вы отправиться в путешествие с некромантом Натаниэлем Робертсом?"
  "265":
    1: "Фу! Вы скорее толпа, чем отряд искателей приключений. Мне нужна группа поменьше. Пойду поищу их в Гостинице искателей приключений. Если хотите отправиться со мной в путь… ну, может быть, вы меня там найдёте."
  "266":
    1: "Я с радостью присоединюсь к вам. Моя жажда мести давно просит утоления. Вы подали мне чашу. Пойдем и наполним её! Дайсон Лиланд предлагает присоединиться к вашей группе. Вы согласны?"
  "267":
    1: "Ваша группа уже слишком полна, чтобы я мог к ней присоединиться, но вот мой план: я сбегу из гильдии и встречусь с вами в Гостинице искателей приключений. Мне, возможно, понадобится некоторое время, чтобы добраться туда, так как я должен путешествовать осторожно. Встречайте меня там, когда сможете. Моя месть ждала уже больше года. Она может подождать ещё несколько недель. Пожелайте мне удачи!"
  "268":
    1: "Я буду вечно вам благодарен.\nВы не только спасли меня из логова Занторы, но и помогли моей дочери получить повышение у сэра Чарльза Кихота.\nЯ хотел бы присоединиться к вам в ваших путешествиях!"
  "269":
    1: "К сожалению, в вашей группе сейчас нет места, чтобы я мог присоединиться к вам.\nЕсли я вам понадоблюсь, меня можно найти в Гостинице искателей приключений."
  "270":
    1: "Ты должен передать ему планы, прежде чем он нападет на Риверстрайд.\nЕсли ты этого не сделаешь, его войска не попадут во все ловушки, которые мы для них подготовили.\nТак что поторопись и достави эти планы!\nЯ рассчитываю на тебя!"
  "271":
    1: "Ты сказала королю, что планы поддельные?!?\n[Королева прижимает ладонь ко лбу, раскрыв рот от удивления] Я за всю свою жизнь не видела такой некомпетентности!\nПоразительно!\nУбирайся с глаз долой!\nПросто уходи!"
  "272":
    1: "[Королева с интересом поднимает брови, когда ты рассказываешь ей, как, находясь на службе у иностранного короля, проник в её крепость, похитил секретные планы и убил многих из её стражников] Хотелось бы честно сказать, что это самая шокирующая измена, которую я когда-либо видела, но, к сожалению, это не так.\nТем не менее… Стража!\nОтрежьте им головы!"
  "273":
    1: "Что ж, у бедного Лорена время истекло.\nОн был казнён за шпионаж в Авли в назначенный срок.\nНе стоит даже пытаться его спасти.\nЕго уже нет."
  "274":
    1: "Срок, в течение которого Кинг Парсон мог бы воспользоваться этими поддельными документами, уже истек.\nНе стоит даже приносить их ему — это уже не имеет значения."
  "275":
    1: "Добро пожаловать.\nНасколько я понимаю, этот идиот Маркхэм назначил вас лордами Хармондейла.\nЗнаете, я ВОССТАНОВЛЮ власть Авли над Хармондейлом — вопрос лишь в том, на моей ли вы стороне или против меня.\nЕсли вы со мной, я позабочусь о том, чтобы вы сохранили свои должности.\nЕсли против меня — я покончу с вами, как только мои войска займут ваши земли.\n[Король Парсон приветливо улыбается] Так что, конечно же, вы на моей стороне!\nВам просто нужно это доказать.\nКак однажды сказал один знаменитый полководец:\n«Доверяй, но проверяй!»\nСлова, которыми стоит руководствоваться.\nСейчас мне нужны планы форта Риверстрайд.\nЭто огромный форт, стоящий между вашими землями и самой Эратией.\nЕго невозможно не заметить.\nПроникните туда и добудьте для меня эти планы.\nЕсли тебе это удастся, я буду у тебя в долгу.\nИ не только это — тебя ждёт ещё и солидное вознаграждение в золоте.\nОднако, чтобы эти планы принесли мне хоть какую-то пользу, их нужно доставить мне в течение месяца."
  "276":
    1: "[Король широко улыбается, когда вы вручаете ему планы]\nСпасибо!\nОни будут ОЧЕНЬ полезны.\nМой управляющий перечислит 5 000 золотых монет на ваш банковский счет в качестве вознаграждения за оказанные услуги.\nКогда мы наконец выиграем эту битву с Эратией, я вас не забуду."
  "277":
    1: "Мне действительно нужно получить эти планы как можно скорее.\nЕсли ты будешь слишком долго тянуть, мне придётся готовиться к атаке без этих планов."
  "278":
    1: "[Король широко улыбается, когда ты передаёшь ему поддельные планы.\nНаивный! ]\nСпасибо!\nОни пригодятся ОЧЕНЬ сильно.\nКогда мы наконец выиграем этот раунд против Эратии, я тебя не забуду."
  "279":
    1: "Что вы имеете в виду, говоря, что эти планы — ложь?\nЗначит, вы признаёте, что замышляли заговор против меня?\n[Король с отвращением вскидывает руки] Стража!\nУведите этих предателей во двор и казните их!"
  "280":
    1: "Хитрая королева нападает на меня, да?\n[Король задумчиво хмурится, а затем его лицо проясняется] У меня есть идея!\nЯ знаю человека, который выглядит точно так же, как тот шпион, которого она хочет, чтобы ты спас.\nВозьми с собой моего человека и доставь его королеве.\nОна никогда его не видела и не заметит разницы.\nЕго «инсайдерская информация» подтолкнет её к ошибкам.\n[Король делает паузу, чтобы вызвать самозванца]\nБудь осторожен, не выдавай себя.\nНельзя, чтобы она раскрыла наш маленький план."
  "281":
    1: "Этот самозванец проник в ряды её военных и дипломатических советников и, я уверен, нанесет немалый ущерб, прежде чем его раскроют.\nСпасибо за помощь! Мой управляющий перечислит 5000 золотых на ваш счет в банке."
  "282":
    1: "Важно доставить самозванца к королеве до назначенной казни мистера Стила.\nВедь спасти мистера Стила будет невозможно, если все будут знать, что я его казнил.\nА если я отложу казнь, у неё возникнут подозрения.\nЯ ещё ни разу не откладывал казнь."
  "283":
    1: "Ты рассказал королеве Кэтрин о самозванце?!? Я не верю своим ушам!\nЗачем ты это сделал?\nЗачем?\n[Король встает и указывает на дверь] Убирайся!"
  "284":
    1: "[Король молчит, пока ты подробно перечисляешь свои преступления против Авли, а когда ты заканчиваешь, он улыбается и разводит руки] Ну что ж!\nПолагаю, эта история говорит сама за себя, не так ли?\nСтража!\nУведите этих предателей во двор и казните их!"
  "285":
    1: "Время, когда эти чертежи могли бы мне пригодиться, уже прошло.\nСпасибо за все усилия, которые вы, возможно, приложили, чтобы их найти, но эти чертежи мне больше не нужны."
  "286":
    1: "Срок казни Лорена Стила уже истек.\nНе стоит приводить самозванца к королеве — она будет слишком подозрительна, и наша уловка не сработает.\nОн сейчас уйдет от вас."
  "287":
    1: "Мои верные подданные!\nИменно вы завладели Трубой!\nОтличная работа.\nМы думали, что она безвозвратно утрачена.\nМой казначей в очередной раз зачислит золото на ваш счет.\n5 000 золотых, если быть точным."
  "288":
    1: "Ах, Труба!\nВы её захватили!\nКогда до нас дошла весть о рейде людей, мы не были уверены, чем всё закончится.\nЕщё раз спасибо, друзья мои.\nМой управляющий перечислит на ваш счёт 5 000 золотых в качестве вознаграждения за ваши услуги."
  "289":
    1: "Если бы я мог дать вам один совет, то это было бы: приведите свой замок в порядок.\nНе знаю, где вы найдёте золото и рабочих для этого, ведь только богатые дворяне и короли могут позволить себе столь масштабные проекты.\nПолагаю, это старая дилемма «курица или яйцо»… Чтобы обрести богатство и уважение, нужно выглядеть благородным, но чтобы выглядеть благородным, нужно уже обладать богатством и уважением.\nВ любом случае, если вы рассчитываете оставаться лордами Хармондэйла дольше, чем на несколько месяцев, вам нужно найти способ доказать, что вы не просто удачливые крестьяне.\nВы должны доказать, что достойны править."
  "290":
    1: "В очередной раз человеческое королевство Эратия и эльфийское королевство Хармондэйл вступили в конфликт.\nКак местному судье, мне выпала задача уладить их разногласия и заставить обе стороны сесть за стол переговоров.\nСилы сторон настолько равны, что победить может любая из них.\n[Судья наклоняется к вам ближе и понижает голос] И я скажу вам ещё кое-что — мне уже почти всё равно, кто победит.\nОни похожи на детей, сражающихся за игрушку.\nНи одна из сторон на самом деле не хочет Хармондейл — они просто хотят лишить его другую сторону.\nТак что вы остались одни.\nЛюбые действия, которые вы предпримите сейчас в поддержку той или иной стороны, могут действительно изменить ход событий.\nПросто помните: им абсолютно всё равно, что с вами случится и кто будет править в Хармондейле.\nВ первую очередь защищайте себя и свой народ.\nЭтого разговора не было."
  "291":
    1: "Вы поступили мудро, вернув мне Трубу.\nТеперь я смогу использовать её, чтобы поддержать слабую сторону в этом конфликте и способствовать установлению мира.\nСпасибо."
  "292":
    1: "Мудрое решение.\nТы об этом не пожалеешь — поверь мне.\nЯ знал, что ты примешь такое решение, и мои чемоданы уже собраны и готовы к отъезду.\nТеперь тебе остаётся только отвезти меня в мой новый дом, а об остальном я позабочусь сам."
  "293":
    1: "В первую очередь вам нужно поговорить с лордом Айронфистом и выполнить его «задание».\nКак только вы докажете свои способности и лояльность, вам разрешат помогать более «интересными» способами."
  "294":
    1: "У каждого из советников лорда Айронфиста есть для вас задание — выполните каждое из них.\nПоговорите с Кастором, Тёмной Тенью и Максимусом, чтобы узнать больше.\nВыполнение этих заданий имеет жизненно важное значение для нашего будущего."
  "295":
    1: "На Толберти возложена чрезвычайно важная миссия.\nОт её успешного выполнения зависит всё, на что мы сделали ставку до сих пор.\nТщательно подготовьтесь к выполнению этой задачи, иначе вы непременно потерпите неудачу."
  "296":
    1: "Ксенофекс и остальные криганы должны быть уничтожены; отправляйтесь в их «улей» в Стране гигантов и раз и навсегда покончите с Ксенофексом и его приспешниками."
  "297":
    1: "Чтобы продолжить, вам нужно будет посетить корабль, на котором Касторе и его люди прибыли в Эратию.\nОтправляйтесь к западу от Авли и убедитесь, что вы должным образом экипированы."
  "298":
    1: "Доставьте «Осцилляционный сверхдвигатель» обратно на Касторе со всей возможной скоростью!\nКаждая минута промедления увеличивает риск неудачи!"
  "299":
    1: "Отлично!\nТы поступил правильно!\nХотя путь света порой бывает нелегким, конечная награда того стоит.\nЯ уже готов к путешествию.\nТеперь тебе остаётся только доставить меня в мой новый дом, а об остальном я позабочусь сам."
  "300":
    1: "Итак, ты хочешь усовершенствовать свои навыки владения посохом? Прекрасно! Посохом можно атаковать и защищаться, а также сделать себя более трудноуязвимым. Мои уроки поднимут твой уровень мастерства до «Эксперта», но сначала тебе нужно достичь 4-го уровня навыка владения посохом и, конечно же, оплатить мою небольшую плату в размере 2000 золотых."
  "301":
    1: "Вы хотите продолжить путь освоения посоха? Если вы проявите себя как способный ученик и уже достигли уровня «Эксперт» (7) в владении посохом, я с удовольствием обучу вас до уровня «Мастер» за 5000 золотых.\nБлагодаря навыкам, которым я вас научу, у вас появится возможность оглушать противника!"
  "302":
    1: "Чтобы достичь уровня «Великого мастера» в владении посохом, тебе придётся сразиться со мной! Прежде чем я смогу обучить тебя, ты должен достичь 10-го уровня мастерства в владении посохом и заплатить мне 8000 золотых.\nЕсли ты соответствуешь моим требованиям, я научу тебя владеть посохом так, чтобы наносить дополнительный урон, равный уровню твоего мастерства."
  "303":
    1: "Итак, меч — ваше любимое оружие, и вы хотели бы научиться сражаться им ещё эффективнее? Тогда я могу вам помочь!\nМои уроки научат вас владеть мечом быстрее, чем раньше. Если у вас есть 2000 золотых и вы достигли 4-го уровня мастерства в владении мечом, я подниму ваш уровень до «Эксперта»."
  "304":
    1: "Фу!\nДаже самые прочные латы можно рассечь, словно дыню, если владеть мечом на уровне мастера!\nЯ могу научить тебя этому за 5000 золотых, если твой навык владения мечом достиг уровня эксперта (7).\nПосле моих уроков ты сможешь держать ещё одно оружие в левой руке и станешь вдвое опаснее."
  "305":
    1: "Даже самая дешёвая сталь может спасти жизнь воина, достигшего уровня «Великого мастера» в владении мечом. Обладая этим уровнем мастерства, вас будет сложнее поразить.\nЕсли вы достигли 10-го уровня мастерства в владении мечом и можете оплатить мою плату в размере 8000, я научу вас всем приёмам великого мастера-фехтовальщика."
  "306":
    1: "У меня есть кинжал, и я готов поспорить, что смогу убить тебя, прежде чем ты успеешь вытащить свой! Скорость может убить, а кинжал — самое быстрое оружие! Благодаря тому, чему я тебя научу, ты сможешь носить ещё одно оружие во второй руке. Два — лучше, чем одно. Ты сможешь овладеть навыками «Эксперт по кинжалу», если у тебя уровень навыка «Кинжал» равен 4 и ты сможешь заплатить мне скромную плату в размере 2000 золотых."
  "307":
    1: "Ха!\nВыживают только самые быстрые! Как Мастер кинжала я выжил и выживу! Мои уроки могут значительно повысить ваши шансы нанести критический урон! Если у вас уровень навыка «Эксперт» равен 7 и у вас есть 5000 золотых, я помогу вам достичь уровня «Мастер»!"
  "308":
    1: "Самый быстрый кинжал — тот, который никто не замечает, — является идеальным оружием.\nВы сможете нанести быструю атаку противнику, прежде чем он успеет нанести вам хотя бы один удар.\nОвладев искусством владения кинжалом на уровне «Великого мастера», вы сможете достичь этого.\nЧтобы пройти моё обучение, у вас должен быть уровень мастерства «Мастер» (10) и 8000 золотых."
  "309":
    1: "Скорость убивает, особенно когда эта скорость придаёт силу удару топором. Под моим руководством вы сможете овладеть этим умением на уровне эксперта. Вы будете наносить удары быстрее, чем раньше, и сметать врагов! Для этого вам нужно достичь 4-го уровня владения топором и заплатить мне 2000 золотых."
  "310":
    1: "Мастерское владение топором и ловкие руки позволяют расколоть голову врага, словно пудинг. После моих уроков ваши удары станут ещё разрушительнее!\nЯ обучу вас до уровня мастера за 5000 золотых, если навык владения топором достиг уровня эксперта (7)."
  "311":
    1: "Став Великим мастером владения топором, броня ваших противников перестанет иметь какое-либо значение.\nЭффективность их брони сократится вдвое, когда вы будете срубать её с их тел! Я могу научить вас этому навыку, но сначала вы должны достичь 10-го уровня мастерства в владении топором и заплатить мне 8000 золотых."
  "312":
    1: "Мастерство владения копьем позволяет вам стать единым целым со своим оружием.\nБлагодаря этому навыку вы будете наносить врагам больше урона.\nЯ могу повысить ваш уровень мастерства до «Эксперта», если ваш уровень навыка равен 4 и у вас есть 2000 золотых."
  "313":
    1: "Копьё — ваше любимое оружие? Хотите научиться держать щит или другое оружие во второй руке, чтобы повысить свою боевую эффективность?\nВы сможете овладеть этим знанием уровня «Мастер», если у вас есть навык «Эксперт» 7-го уровня в обращении с копьём и 5000 золотых."
  "314":
    1: "Итак, ты хочешь совершенствовать свои навыки владения копьем? Прекрасно! Копьё можно использовать как в нападении, так и в защите, и с его помощью тебе будет сложнее попасть. Мои уроки помогут тебе достичь уровня «Великий мастер», но сначала тебе нужно иметь уровень «Мастер» 10 в владении копьём, и, конечно же, тебе придётся заплатить мне небольшую плату в размере 8000 золотых."
  "315":
    1: "Хочешь держать врага на расстоянии вытянутой руки?\nЛук — лучший способ убить врага, прежде чем он успеет нанести тебе вред.\nБлагодаря моим урокам ты достигнешь уровня «Эксперт» и сможешь стрелять из лука быстрее, тем самым уничтожая врага на расстоянии.\nЯ научу тебя, если твой уровень навыка стрельбы из лука равен 4 и ты заплатишь 2000 золотых."
  "316":
    1: "Думаешь, ты быстро стреляешь из лука?\nТвоя нынешняя скорость — ничто по сравнению с тем, чему я могу тебя научить.\nМои уроки позволят тебе выпускать две стрелы за то время, за которое эксперт выпускает одну.\nДля обучения требуется навык стрельбы из лука уровня эксперта (7) и 5000 золотых."
  "317":
    1: "Скорость при стрельбе из лука, безусловно, может стать преимуществом, но именно сочетание этой скорости с умением наносить противнику серьёзные ранения может стать решающим фактором, определяющим жизнь или смерть.\nЯ научу вас «Великому мастерству стрельбы из лука», и вы сможете увеличить урон, наносимый каждым выстрелом.\nДля этого вам необходимо иметь уровень навыка «Мастер» (10) и заплатить 8000 золотых за обучение."
  "318":
    1: "Булава — изощрённое оружие.\nМечи и кинжалы рассекают плоть, а булава способна ломать кости и повреждать внутренние органы, не оставляя кровавых следов. Став экспертом во владении булавой, вы будете наносить больше урона.\nЕсли ваш навык достиг 4-го уровня и у вас есть 2000 золотых, я обучу вас."
  "319":
    1: "Зачем нужна деликатность, если противник без сознания?\nОвладение булавой даст вам возможность оглушить или даже парализовать врага.\nЗа 5000 золотых и подтверждение того, что вы достигли 7-го уровня мастерства в навыке «Эксперт», я научу вас владению булавой."
  "320":
    1: "Чем выше шанс победить врагов, тем меньше вероятность, что вы сами пострадаете.\nВысокий уровень мастерства в обращении с булавой увеличит ваши шансы оглушить или даже парализовать противников.\nЕсли у вас уровень мастерства «Мастер» равен 10 и вы можете заплатить мне 8000 золотых, я обучу вас."
  "321":
    1: "Что ж, похоже, наша маленькая война с Храмом Солнца наконец-то закончена. Сандро сказал, что члены гильдии могут заняться другими делами. С тех пор как я прибыл в Джадам, я почти ничего не видел, кроме земель Шэдоуспайра. Скажи… может быть, тебе пригодятся мои услуги?"
  "322":
    1: "Хотелось бы присоединиться к вам. К сожалению, наша война с Храмом Солнца отнимает у нас всё время. Гильдия сейчас не может меня отпустить."
  "323":
    1: "Да! Я с удовольствием присоединюсь к вам. Теперь, когда наша священная война против гнусной Гильдии некромантов, похоже, идет успешно, я обнаружил, что мне здесь почти нечем заняться. Я пойду с вами, если вы меня возьмете."
  "324":
    1: "Щит может стать вашим верным помощником и защитить от смертельного удара.\nНа уровне эксперта владение щитом устраняет вызванный им штраф к восстановлению после атаки.\nЯ обучу вас за 1000 золотых, если навык достиг 4-го уровня."
  "325":
    1: "Овладение искусством владения щитом удваивает его защитный бонус, благодаря чему в вас становится гораздо сложнее попасть!\nЯ научу вас искусству владения щитом, если вы достигли 7-го уровня мастерства в навыке «Эксперт» и заплатите мне 3000 золотых."
  "326":
    1: "Под руководством моего великого мастера вы научитесь превращать щит в непревзойденное средство защиты.\nОн не только защитит вас в ближнем бою, но и обеспечит вам преимущества заклинания «Щит».\nВы сможете овладеть этим навыком, если достигнете 10-го уровня мастерства в обращении со щитом и заплатите мне 7000 золотых."
  "327":
    1: "Кожаные доспехи — самая лёгкая защита.\nОни не дают врагам причинить вам вред.\nНа уровне эксперта навык ношения кожаных доспехов устраняет вызванный ими штраф к восстановлению после атаки.\nЯ обучу вас за 1000 золотых, если навык достиг 4-го уровня."
  "328":
    1: "Овладение навыком «Кожаные доспехи» удваивает их защитный бонус, благодаря чему в вас становится гораздо сложнее попасть!\nЯ научу вас навыку «Кожаные доспехи», если вы достигли 7-го уровня мастерства в навыке «Эксперт» и заплатите мне 3000 золотых."
  "329":
