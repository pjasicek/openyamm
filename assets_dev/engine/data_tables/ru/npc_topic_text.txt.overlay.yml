  "2337":
    1: "Бонус в два пункта ко всем навыкам заклинаний для всех персонажей.\n%01 получает %17 процентов от всего найденного золота."
  "2338":
    1: "Бонус в три очка ко всем навыкам заклинаний для всех персонажей.\n%01 получает %17 процентов от всего найденного вами золота."
  "2339":
    1: "Бонус в четыре очка ко всем навыкам заклинаний для всех персонажей.\n%01 получает %17 процентов от всего найденного вами золота."
  "2340":
    1: "Бонус в четыре очка к навыку «Торговля» для всех персонажей.\n%01 получает %17 процентов от всего найденного вами золота."
  "2341":
    1: "Бонус в шесть пунктов к навыку «Торговля» для всех персонажей.\n%01 получает %17 процентов от всего найденного вами золота."
  "2342":
    1: "Бонус в шесть пунктов к навыку «Восприятие» для всех персонажей.\n%01 получает %17 процентов от всего найденного вами золота."
  "2343":
    1: "Бонус в четыре очка к навыку «Дипломатия» для всех персонажей.\n%01 получает %17 процентов от всего найденного вами золота."
  "2344":
    1: "Бонус в размере восьми пунктов к навыку «Дипломатия» для всех персонажей.\n%01 получает %17 процентов от всего найденного вами золота."
  "2345":
    1: "Навык «Обезвреживание ловушек» каждого персонажа повышается на четыре пункта.\n%01 получает %17 процентов от всего найденного золота."
  "2346":
    1: "Навык «Обезвреживание ловушек» каждого персонажа повышается на шесть пунктов.\n%01 получает %17 процентов от всего найденного золота."
  "2347":
    1: "Характеристика «Удача» каждого персонажа повышается на пять пунктов.\n%01 получает %17 процентов от всего найденного золота."
  "2348":
    1: "Бонус в 20 пунктов к характеристике «Удача» для всех персонажей.\n%01 получает %17 процентов от всего найденного золота."
  "2349":
    1: "На один день меньше расхода провианта во время кемпинга (используется как минимум один день).\n%01 получает %17 процентов всего найденного вами золота."
  "2350":
    1: "В походе на два дня меньше расходуется еды (используется как минимум одна порция).\n%01 получает %17 процентов всего найденного золота."
  "2351":
    1: "Бонус в размере 10 % ко всему найденному золоту.\n%01 получает %17 процентов от всего найденного вами золота."
  "2352":
    1: "Бонус в размере 20 % ко всему найденному золоту.\n%01 получает %17 процентов от всего найденного вами золота."
  "2353":
    1: "Обеспечивает пропитание на один день (максимум на 14 дней).\n%01 получает %17 процентов всего найденного вами золота."
  "2354":
    1: "Ежедневно готовит еду на два дня (максимум на 14 дней).\n%01 получает %17 процентов всего найденного вами золота."
  "2355":
    1: "Путешествия с использованием конюшни занимают на два дня меньше (минимум один день).\n%01 получает %17 процентов всего найденного вами золота."
  "2356":
    1: "Даёт постоянный бонус к репутации одной конкретной категории.\n%01 получает %17 процентов от всего найденного вами золота."
  "2357":
    1: "Постоянно повышает защиту от стихий на 20.\n%01 получает %17 процентов всего найденного золота."
  "2358":
    1: "Постоянно поддерживает действие заклинания «Глаз волшебника» на уровне «эксперт».\n%01 получает %17 процентов от всего найденного вами золота."
  "2359":
    1: "Раз в день накладывает заклинание «Полёт» продолжительностью два часа.\n%01 получает %17 процентов от всего найденного золота."
  "2360":
    1: "Один раз в день применяет заклинание «Хождение по воде» (продолжительность — 3 часа).\n%01 получает %17 процентов от всего найденного вами золота."
  "2361":
    1: "Один раз в день применяет заклинание «Портал в город» на уровне мастера.\n%01 получает %17 процентов от всего найденного вами золота."
  "2362":
    1: "Один раз в день произносит заклинание «Благословение» (продолжительность — 2 часа) на уровне мастера.\n%01 получает %17 процентов от всего найденного вами золота."
  "2363":
    1: "Один раз в день применяет заклинание «Героизм» (продолжительность — 2 часа) на уровне мастера.\n%01 получает %17 процентов от всего найденного вами золота."
  "2364":
    1: "Все сроки путешествия сокращаются на один день (минимум на один день).\n%01 получает %17 процентов всего найденного вами золота."
  "2365":
    1: "Продолжительность всех путешествий на лодке сокращается на два дня, количество найденного золота увеличивается на десять процентов, а репутация снижается на одну полную категорию.\n%01 получает %17 процентов всего найденного вами золота."
  "2366":
    1: "Навыки владения доспехами и оружием повышаются на два пункта для каждого персонажа.\n%01 получает %17 процентов от всего найденного вами золота."
  "2367":
    1: "Навык «Восприятие» повышается на пять пунктов, а показатель «Удача» — на десять пунктов для каждого персонажа.\n%01 получает %17 процентов от всего найденного вами золота."
  "2368":
    1: "Во время отдыха (не менее одного дня) потребление провианта уменьшается на суточную норму, навык «Торговля» каждого персонажа повышается на три пункта, а репутация снижается на одну полную категорию.\n%01 получает %17 процентов от всего найденного вами золота."
  "2369":
    1: "Навыки «Торговля» и «Дипломатия» каждого персонажа повышаются на четыре пункта.\n%01 получает %17 процентов от всего найденного вами золота."
  "2370":
    1: "Навык «Торговля» каждого персонажа повышается на восемь пунктов, а репутация снижается на одну полную категорию.\n%01 получает %17 процентов от всего найденного вами золота."
  "2371":
    1: "Навык «Обезвреживание ловушек» каждого персонажа повышается на восемь пунктов, а репутация снижается на одну категорию.\n%01 не требует платы!"
  "2374":
    1: "Здравствуйте! Сейчас %05.\nМеня зовут %01.\nПриятно познакомиться!"
  "2375":
    1: "О, привет, %02.\nСейчас %05. Прекрасно, правда?"
  "2376":
    1: "Эй, я же уже говорил, что не хочу, чтобы меня видели с тобой.\nУбирайся!"
  "2377":
    1: "Всегда рад помочь, %06.\nУ тебя есть %04 для меня?"
  "2378":
    1: "Пожалуйста, не убивайте меня!\nЯ рассказал вам всё, о чём вы просили!"
  "2379":
    1: "Я общаюсь только с настоящими людьми, а не с такими незнакомцами, как вы.\nЯ сейчас занят, так что уходите."
  "2380":
    1: "О нет!\nПожалуйста, не делай мне больно, %06 %02! Я расскажу тебе всё, что угодно!"
  "2381":
    1: "Этот печально известный %06 %02!\nСлышал, ты убиваешь людей направо и налево.\nЭто здорово!\nЧем могу тебе помочь?"
  "2382":
    1: "%07 %02!\nКакая честь!\nВсе только и говорят о том, как ты %08!\nЧем я могу тебе помочь?"
  "2383":
    1: "О нет!\n%06 %02!\nЭто не я!\nЭто был тот парень!\nМеня там не было!\nЯ расскажу вам всё — что угодно, только не делайте мне больно!"
  "2384":
    1: "Ой, вы, люди.\nМне даже думать не хочется о том, что о вас говорят!\nУйдите и оставьте меня в покое!"
  "2385":
    1: "Ооо... Я разговариваю с %06, который никогда не ошибается!\nКакая честь."
  "2386":
    1: "Хотя я и не слышал о тебе, %02, много плохого, но и хороших отзывов тоже не слышал.\nЯ просто тебе не доверяю."
  "2387":
    1: "%02, да?\nСлышал, что ты, возможно, шериф под прикрытием.\nЯ не разговариваю с шерифами. Ни с охранниками… ни с королевскими людьми.\nМожет, если бы ты совершил пару преступлений, я бы тебе доверился."
  "2388":
    1: "Я слышал о тебе столько плохого.\nПочему ты не оставишь меня в покое?\nНе хочу с тобой никаких неприятностей!"
  "2389":
    1: "Возможно, я тебе раньше не говорил:\nТы мне не нравишься.\nВпрочем, я и не понимаю, зачем таким важным и влиятельным людям вообще разговаривать с таким ничтожеством, как я, так что убирайся!"
  "2390":
    1: "Я просто не впечатлён.\nТвоя репутация составляет всего %11.\nЯ не буду с тобой разговаривать, пока она не повысится."
  "2391":
    1: "Твоя репутация для меня просто слишком безупречна.\nМне это не нравится.\nЭто ненормально.\nМожет быть, если бы я услышал о тебе ещё каких-нибудь неприятных слухов, мы могли бы поговорить.\nА пока..."
  "2392":
    1: "Ладно, ладно.\nНо я действительно не хочу, чтобы меня видели с тобой.\nДавай не будем делать это привычкой."
  "2393":
    1: "н/д"
  "2394":
    1: "Спасибо, %06.\nИтак, что ты хотел?"
  "2395":
    1: "н/д"
  "2396":
    1: "<глоток> Понял. Да, %06.\nЧего ты от меня хочешь?"
  "2397":
    1: "н/д"
  "2399":
    1: "%02, да?\nЯ это запомню."
  "2400":
    1: "Снова %02.\nЧего ты хочешь?"
  "2401":
    1: "Моё терпение на исходе.\nУйди и перестань меня беспокоить."
  "2402":
    1: "Ещё!\nЕщё золота!\nДа!\nДай мне ещё %04!"
  "2403":
    1: "Оооо, %06, не нужно мне снова угрожать, я всё расскажу."
  "2404":
    1: "Я не буду разговаривать с ничтожествами.\nОставьте меня в покое."
  "2405":
    1: "Монстры!\nЯ слышал о ваших преступлениях.\nЯ бы вас убил, если бы мог."
  "2406":
    1: "Твоя дурная слава опережает тебя, %02.\nВсе, что угодно, лишь бы служить такому злодею, как ты, %06."
  "2407":
    1: "%07 %02.\nМне очень приятно познакомиться с вами.\nЧто моё — то и ваше."
  "2408":
    1: "Шшшшшш... Пожалуйста, не убивай меня.\nЯ — червь, не стоящий твоего внимания.\nЯ падаю ниц у твоих ног, могучий %10."
  "2409":
    1: "Я не разговариваю со злыми людьми.\nУходи, пока я не стал агрессивным."
  "2410":
    1: "О, ура.\nЭто же наши.\nТебе повезло, что я сейчас в хорошем настроении.\nУходи, пока оно не изменилось."
  "2411":
    1: "Большинство людей — злодеи… и одного лишь отсутствия криминального прошлого недостаточно, чтобы я тебе доверился.\nОставь меня в покое."
  "2412":
    1: "%02. Я чувствую, как из твоих пор просачиваются следы ужасной доброты.\nЯ этого не выношу!\nИди и соверши какие-нибудь деяния невыразимого зла.\nМожет, тогда я с\nтобой поговорю."
  "2413":
    1: "Опять ты, %02?\nЯ думал, ты умнее.\nОт тебя пахнет злом.\nЭто пробуждает во мне аппетит!"
  "2414":
    1: "Мое настроение портится, когда я размышляю о твоем отсутствии зла.\nМне нечего тебе сказать."
  "2415":
    1: "Рассказы, которые я слышу о тебе, — это %11, но этого недостаточно.\nИди себе."
  "2416":
    1: "Я чувствую, что в тебе есть добро, %02.\nСпустись на уровень %11, а потом вернись ко мне."
  "2417":
    1: "Твоя униженная просьба тронула меня до глубины души.\nЯ хочу поговорить с тобой на минутку."
  "2418":
    1: "н/д"
  "2419":
    1: "Да, хорошо.\nЧего ты хочешь?"
  "2420":
    1: "н/д"
  "2421":
    1: "Пожалуйста, не убивайте меня!\nЯ расскажу вам всё, что вы хотите знать!"
  "2422":
    1: "н/д"
  "2424":
    1: "Привет.\nМеня зовут %01."
  "2425":
    1: "Как дела, %02?"
  "2426":
    1: "н/д"
  "2427":
    1: "Цена всегда одинаковая — %06.\n%04 золота!"
  "2428":
    1: "Эй, э-э, мы же по-прежнему друзья, да?\nЧто тебе нужно?"
  "2429":
    1: "Уйди, парень, ты мне мешаешь.\nВернись, когда станешь поумнее."
  "2430":
    1: "Это <глоток>…%06 %02 и %09 — компания веселых шутников!\nВы здесь так хорошо известны!\nНастоящая…честь, мой %10."
  "2431":
    1: "Ах, этот печально известный %06 %02.\nРади тебя на всё, %02!"
  "2432":
    1: "О твоих подвигах известно повсюду, %06 %02.\n%01 к твоим услугам, мой %10."
  "2433":
    1: "%07 %02!\nТак приятно увидеть тебя лично!\nЧто удивительно, ведь ты такой знаменитый, могущественный и добрый, а я — такой слабый и жалкий.\nЯ не стою твоего времени, нет, совсем не стою. Ахе-хе… Хе."
  "2434":
    1: "У тебя репутация %11, %06.\nЯ не хочу иметь с тобой ничего общего."
  "2435":
    1: "<с презрительной усмешкой> Проклятые святоши.\nГоворят, что ты %08.\nНу разве это не просто чудесно?\nВы меня просто бесите.\nУбирайтесь отсюда, пока я не сделал чего-нибудь, о чём вы потом пожалеете!"
  "2436":
    1: "Ничто из того, что я слышал о вас, не вызывает у меня желания поговорить с вами, %02.\nЯ не говорю, что вы плохие люди;\nя просто говорю, что, возможно, вы не самые лучшие.\nВозможно, если бы вы улучшили свою репутацию…"
  "2437":
    1: "<прищурившись>\nХм.\nЯ слышал, что у тебя плохая репутация.\nЭто хорошее начало, но этого пока недостаточно.\nТвоя репутация должна стать намного хуже, прежде чем я тебе доверю!"
  "2438":
    1: "О вас ходит много слухов, и ни один из них не в вашу пользу.\nМеня не должны видеть с вами.\nДавайте разойдемся, ладно?"
  "2439":
    1: "О, опять вернулся, да?\nТебя уже назначили помощником шерифа?\nКороль оказал тебе милость?\nНу, вот что я тебе скажу — мэры и короли, может, и рады таким, как ты, но я — точно нет.\nБереги себя."
  "2440":
    1: "Ах, %02.\nПока слухи и сплетни о тебе не станут более позитивными, я не хочу с тобой разговаривать."
  "2441":
    1: "Послушай, все мои друзья не уверены, стоит ли тебе доверять.\nПока ты не сделаешь что-то, чтобы заслужить наше доверие — что-то противозаконное, — я просто не могу появляться с тобой на публике.\nЭто ставит меня в невыгодном свете."
  "2442":
    1: "н/д"
  "2443":
    1: "Я сделал пожертвование в Гильдию.\nМне это неинтересно. Я на мели.\nЭто не моя проблема.\nНайди себе работу.\nМне всё равно… Ты что, не понимаешь?\nУйди, я не хочу с тобой разговаривать!"
  "2444":
    1: "Было приятно иметь с вами дело, %06.\nЧем могу вам помочь?"
  "2445":
    1: "н/д"
  "2446":
    1: "Ладно, ладно!\nКак скажешь, босс."
  "2447":
    1: "н/д"
  "2449":
    1: "<поклонившись> %01, к вашим услугам."
  "2450":
    1: "Всегда рад, %06 %02."
  "2451":
    1: "н/д"
  "2452":
    1: "Ах, да.\n< %01 потирает %03 руки> Полагаю, речь пойдёт о более важных делах и обсуждениях.\nЦена, как всегда, составляет %04."
  "2453":
    1: "Ой, боже мой!\nЧего тебе ещё нужно?"
  "2454":
    1: "Мой товар отличается как редкостью, так и высоким качеством.\nТо же самое можно сказать и о моих покупателях.\nПоскольку вы — покупатели низкого качества, похоже, мы не сможем вести с вами дела."
  "2455":
    1: "Ой, боже мой, %02!\nПожалуйста, не грабь меня!\nУ меня нет ничего ценного!\nУ меня одни долги!\nПощади меня, мой %10!"
  "2456":
    1: "%07 %02!\nЭто было просто нечто — когда ты перебил всех в той маленькой деревне!\nПо-моему, они сами напросились.\nЭто был ты… верно?\nНу, ладно, чем могу помочь?"
  "2457":
    1: "Я слышал о том, как ты %08.\nДля меня это честь и удовольствие.\nРад помочь тебе, мой %10."
  "2458":
    1: "Пожалуйста, пожалуйста, не убивайте меня, ваше величество! <рыдание>\nЯ ничтожество, не стоящее того, чтобы утомлять вашу руку с мечом.\nЕсли вы оставите меня в покое, я и так скоро умру сам!\nПощадите меня, могущественный %10!\nПощадите меня!"
  "2459":
    1: "%02...\nЯ слышал о тебе кое-что, и ничего хорошего.\nПожалуйста, уйди от меня.\nНемедленно."
  "2460":
    1: "Пссс!\nЭй, хочешь купить <прищуривается>... погоди-ка... ладно, неважно."
  "2461":
    1: "Я общаюсь только с теми, кого знаю и кому доверяю.\nПоскольку я не слышал о вас ничего хорошего, у меня\nнет причин вам доверять.\nВсего хорошего."
  "2462":
    1: "%10 %02.\nЯ слышал о вас.\nГоворят, у вас репутация %11.\nЭто многое говорит, но мне нужно узнать больше, прежде чем я смогу с уверенностью иметь с вами дело.\nВернитесь ко мне, когда докажете свою надежность ещё раз."
  "2463":
    1: "Я не разговариваю с хулиганами!\nВаша репутация составляет %11, что значительно ниже моих стандартов."
  "2464":
    1: "Ты со мной разговариваешь?\nИди, помучай кого-нибудь другого.\nМне к тебе нет никакого дела."
  "2465":
    1: "То, что люди с хорошей репутацией говорят, что вы — человек с хорошей репутацией, для меня ничего не значит.\nПоскольку я имею дело только с людьми, чья репутация составляет %12 или выше, нам больше не о чем говорить."
  "2466":
    1: "Я просто не могу тебе доверять.\nМожет быть, если твоя репутация упадет до %11, или даже ниже, тогда мы сможем поговорить.\n<поклонившись> А пока — %10."
  "2467":
    1: "н/д"
  "2468":
    1: "Что в мне заставляет тебя думать, что мне небезразличны ты или твои проблемы?\nУбирайся, или я вызову городскую стражу."
  "2469":
    1: "Спасибо!\nПожалуйста, расскажите, что именно вы ищете."
  "2470":
    1: "н/д"
  "2471":
    1: "Понятно.\nНет нужды прибегать к насилию.\nЧто вам нужно?"
  "2472":
    1: "н/д"
  "2474":
    1: "Мне %01.\nЧего ты хочешь?"
  "2475":
    1: "<вздох> Так быстро вернулся?"
  "2476":
    1: "Я тебе уже говорил — у меня нет на тебя времени.\nМожет, завтра."
  "2477":
    1: "н/д"
  "2478":
    1: "Грррр… «Когда-нибудь»… Ладно, в чём дело?"
  "2479":
    1: "Возможно, вы слышали обо мне.\nНекоторые называют меня %02.\nБудучи знаменитым, я общаюсь только с другими знаменитыми и влиятельными людьми.\nВы не относитесь ни к тем, ни к другим.\nУходите."
  "2480":
    1: "Я и подумать не мог, что когда-нибудь столкнусь лицом к лицу с таким злодеем, как ты, %02.\nСегодня не самый радостный день.\nКаковы твои требования?"
  "2481":
    1: "Огромное удовольствие — наконец-то встретить великого %06 %02 во плоти.\nОбитатели подземного мира не перестают восхвалять твои подвиги и с нетерпением ждут твоего неизбежного прихода… А пока, чем могу быть полезен тебе, мой %10?"
  "2482":
    1: "Знать тебя — значит любить тебя, достопочтенный %06 %02!\nИменно вы те, кто %08.\nВам остаётся лишь попросить — и вы получите от меня!"
  "2483":
    1: "Подождите!\nПожалуйста, не нападайте на меня!\nЯ прекращу эксперименты,\nклянусь!\nБольше никакой зловещей магии... Я с этим покончил, можете на меня положиться, %10 %02."
  "2484":
    1: "Фу!\nУ меня нет времени на таких, как ты!\nЯ буду общаться только с людьми с хорошей репутацией — теми, у кого репутация составляет %12 или выше."
  "2485":
    1: "Да спасут нас тёмные боги от праведников!\nНеужели вам, люди, нет конца?\nУбирайтесь от меня, пока я не наложил на вас проклятие!"
  "2486":
    1: "Боюсь, я не могу общаться с людьми, чье очарование и репутация не дотягивают до моих.\nЭто запятнало бы мою ауру.\nИзвините."
  "2487":
    1: "%02, мне %01.\nЯ связан договорами и обещаниями, которые дал, слишком часто имея дело с невинными людьми.\nЯ говорю тебе это только потому, что слышал, что твоя репутация составляет %11.\nЭто плохо, но ещё не достаточно плохо.\nВернись, совершив ещё несколько подлых поступков.\nТогда мы поговорим."
  "2488":
    1: "Меня охватывает гнев, когда я думаю обо всех тех гадких вещах, которые ветер шепчет о тебе.\nТвоя репутация составляет %11!\nНе очень-то приятно.\nА теперь убирайся, пока мой гнев не обрушился на тебя!"
  "2489":
    1: "Разве я не был достаточно груб, когда мы последний раз разговаривали?\nЯ тебя ненавижу!\nОт ваших ангельских лиц у меня скручивает живот!\nВаша невинность вызывает у меня тошноту! Уходите!"
  "2490":
    1: "%02.\nЭто подрывает твою репутацию.\nДлительное общение с такими, как ты, ставит под угрозу чистоту моей ауры.\nЯ не хочу с тобой разговаривать."
  "2491":
    1: "В твоей ауре отсутствуют те пестрые фиолетовые и жёлтые пятна, которые я должен увидеть, прежде чем мне будет позволено поговорить с тобой.\nТебе нужно совершить ещё больше зла, %02, прежде чем мы сможем безопасно поговорить."
  "2492":
    1: "<вздох> Ладно.\nНо на сегодня всё!\nУ меня нет на тебя времени."
  "2493":
    1: "н/д"
  "2494":
    1: "н/д"
  "2495":
    1: "Одни только деньги меня не переубедят, негодяй!"
  "2496":
    1: "Хм...\nТы прав.\nЧего ты хочешь?"
  "2497":
    1: "н/д"
  "2499":
    1: "%02.\nУверен, что это очаровательно."
  "2500":
    1: "Что это, %02?"
  "2501":
    1: "Нет.\nЯ не позволю тебе больше тратить моё время.\nМожет быть, завтра."
  "2502":
    1: "н/д"
  "2503":
    1: "Что теперь?\nТы вернулся, чтобы убить меня?\nЯ обязательно успею назвать твое имя, прежде чем ты меня убьёшь!\nКто-нибудь придёт меня спасти!"
  "2504":
    1: "У меня нет времени на таких простых людей, как вы!\nВозможно, когда вы станете более утончёнными…"
  "2505":
    1: "Ой, эти печально известные %06 %02 и их пособники… Похоже, мольбы о пощаде уже недостаточно.\nЧего вы от меня хотите?"
  "2506":
    1: "Мой %10, все непредвзятые жители Королевства следят за твоим восхитительно эпатажным поведением.\nТвои поступки станут частью такой замечательной истории.\nЧем я могу тебе помочь?"
  "2507":
    1: "О твоих деяниях известно повсюду, мой %10.\nЯ с радостью буду служить тебе."
  "2508":
    1: "Я знаю, ты думаешь, что должен меня прикончить, как собаку, которой я и являюсь, %10, но, наверное, такой святой, как ты, сможет найти в своём сердце силы простить прошлые проступки… Разве нет?"
  "2509":
    1: "Люди говорят, что ты любишь совершать преступления, %02.\nМне не нравится, как это звучит, поэтому я не хочу с тобой разговаривать."
  "2510":
    1: "Сомневаюсь, что ты одобрил бы мои исследования в области магии Тьмы, так же как и я не одобрил бы твою нетерпимость.\nМне больше нечего тебе сказать."
  "2511":
    1: "Общественное мнение о вас разделилось, %02.\nОдни говорят, что вы хороший человек, другие в этом не так уверены. Что касается меня, то я подожду, пока о вас появятся ещё хорошие отзывы, прежде чем заговорить с вами."
  "2512":
    1: "Послушай — я плохая компания.\nЗло, чисто и просто, насквозь.\nКак бы это выглядело в глазах всех моих друзей, если бы их застали в компании людей, у которых нет такой репутации в %12, как у нас?\nИменно так — просто ужасно."
  "2513":
    1: "Ходят слухи, что ты и твои друзья — нехорошие люди, %02.\nЯ, во всяком случае, не хочу иметь с тобой ничего общего."
  "2514":
    1: "Мне доставляет удовольствие скрывать информацию от таких праведных благодетелей, как вы!\nПопросите меня передумать, и я, возможно, соизволю поговорить с вами."
  "2515":
    1: "<вздох>\nХотя твоя репутация составляет как минимум %11, я пообещал маме, что не буду общаться с людьми, у которых репутация ниже %12.\nИзвини."
  "2516":
    1: "Твоя репутация составляет всего %12!\nЯ не могу появляться с тобой на публике.\nВсе мои знакомые будут смеяться надо мной!\nЯ общаюсь только с теми, у кого репутация %11 или ниже."
  "2517":
    1: "Ладно, но побыстрее."
  "2518":
    1: "н/д"
  "2519":
    1: "н/д"
  "2520":
    1: "Деньги не имеют большого значения.\nДля меня знание — это сила."
  "2521":
    1: "Понял, %06.\nЯ хочу жить.\nЧто тебе нужно?"
  "2522":
    1: "н/д"
  "2524":
    1: "Здравствуйте!\nСейчас %05. Какое чудесное время!\nМеня зовут %01."
  "2525":
    1: "Рад тебя снова видеть!\nХа-ха-ха!\nЭ-э... Как, ты сказал, тебя зовут?"
  "2526":
    1: "На этом моя великодушие заканчивается.\nЯ уже помог тебе сегодня, и мне надоело тебя видеть.\nОставь меня в покое."
  "2527":
    1: "<оглядываясь по сторонам> %04, ну что ж, давайте побыстрее с этим разберемся!"
  "2528":
    1: "н/д"
  "2529":
    1: "<зевает>\nМне это неинтересно.\nУйди — я жду, когда со мной заговорит кто-то важный."
  "2530":
    1: "%02!\nЗлодей! Как ты смеешь со мной разговаривать?"
  "2531":
    1: "Печально известный %06, для меня большая честь познакомиться с вами и приятно служить вам.\nЧего вы желаете?"
  "2532":
    1: "Ах, знаменитый и почтенный %06 %02!\n<поклонившись> Все, что вы пожелаете и что в моих силах дать, я с радостью предоставлю."
  "2533":
    1: "%02.\n<плюнул на землю>"
  "2534":
    1: "О-хо!\n%13! Э-э, %13.\nПо-моему.\nНу и ладно.\nО тебе ходят слухи — и все они плохие.\nУбирайся отсюда, а то я проткну тебя острием своего меча!"
  "2535":
    1: "%13, да? <расстегивая %03 меч> Лучше беги прочь… Мне не очень по душе такие законопослушные типы, как ты."
  "2536":
    1: "Привет!\nЯ — %01!\nЯ слышал о тебе, %13, и хотя ты не совершил ничего особо плохого — по крайней мере, насколько я знаю, — но и ничего хорошего тоже не сделал.\nТак что иди и сделай что-нибудь полезное!\nМожет, тогда я с тобой поговорю."
  "2537":
    1: "%13, наконец-то приятно познакомиться.\nТвоя репутация составляет %11.\nМогло быть и хуже.\nВообще-то, это заставляет меня думать, что ты какой-то слабак!\nДа, пока не услышу чего-то похуже, я не хочу, чтобы меня видели с тобой.\nУбирайся с глаз долой!"
  "2538":
    1: "Опять ты, %13?\nЭто что, какой-то вызов?\nТы пришёл, чтобы меня оскорбить?\nДруг %13, предупреждаю тебя — ты идёшь со мной по узкому мосту, а пропасть очень глубокая… действительно очень глубокая!"
  "2539":
    1: "Я вот так близко — вот так близко к тому, чтобы отрубить твою святую голову!\nУходи, пока ещё можешь."
  "2540":
    1: "%13!\nМожет быть, когда-нибудь у меня найдётся что тебе сказать!\nМожет быть.\nНо только после того, как твоя репутация улучшится."
  "2541":
    1: "%13!\nТы вернулся!\nВернулся с репутацией %11… Хм.\nПо-моему, это слабовато.\nСделай что-нибудь, чтобы произвести на меня впечатление, потому что я не общаюсь ни со слабыми, ни с беспомощными.\nА пока что, убирайся, а?"
  "2542":
    1: "Думаю, я мог бы поговорить с вами пару минут.\nПоторопитесь."
  "2543":
    1: "н/д"
  "2544":
    1: "Да, так что же тебе нужно, %13?"
  "2545":
    1: "н/д"
  "2546":
    1: "н/д"
  "2547":
    1: "<вытаскивает %03 меч> Я не люблю, когда мне угрожают…"
  "2549":
    1: "Мир, %06.\nМеня зовут %01. Я %14."
  "2550":
    1: "Сейчас %05. Какое чудесное время, %02!\nЧем я могу вам помочь?"
  "2551":
    1: "Хотя ваша потребность, очевидно, велика, уделять внимание исключительно вашим потребностям было бы несправедливо по отношению к другим.\nВозможно, в другой раз."
  "2552":
    1: "Вы вернулись за новыми духовными советами? Размер пожертвования по-прежнему составляет %04."
  "2553":
    1: "н/д"
  "2554":
    1: "У меня есть важные дела, дитя.\nКогда-нибудь ты тоже станешь важной, но пока ты ещё не такая, так что иди сейчас, с миром."
  "2555":
    1: "Перед мной стоит сам дьявол!\nЯ не боюсь тебя и не помогу тебе!"
  "2556":
    1: "Мой Повелитель… Ваше дело во имя тьмы не имеет себе равных.\nВаше зло превосходит моё.\nСлужить Вам — моё единственное и бесконечное желание."
  "2557":
    1: "Слава Свету!\nНастоящее счастье — находиться в обществе милой и благородной %10 %06!"
  "2558":
    1: "Чем выше ты поднимаешься, тем сильнее будет падение… А ты поднялся так высоко!\nБудь уверен, святой, что меня не будет рядом, чтобы подхватить тебя, когда ты упадешь!"
  "2559":
    1: "Я слышал, что ты перестал идти по Пути Света.\nВернись ко мне, когда найдешь свой путь."
  "2560":
    1: "Убирайся, дурак!\nЯ не буду разговаривать с трусами, не желающими идти по тропе теней."
  "2561":
    1: "У тебя нет ауры зла или добра, достаточно сильной, чтобы мои заклинания смогли её уловить.\nПока я не узнаю, как обстоят дела на самом деле, я вынужден отказаться от разговора с тобой."
  "2562":
    1: "%02, твоя репутация составляет %11, что дает мне надежду на то, что ты всё-таки присоединишься к тьме!\nТем не менее, в твоей душе остались следы добра, которые вызывают беспокойство.\nИзбавься от них и вернись.\nТогда мы сможем поговорить."
  "2563":
    1: "Все еще скрываешься в тени?\nЯ знаю, что ты можешь поступить лучше, %02.\nИди с миром и вернись, когда откажешься от своих злых дел."
  "2564":
    1: "Ты испытываешь моё терпение, трус.\nМне так и хочется поэкспериментировать с силами, которыми наделил меня подземный мир…"
  "2565":
    1: "Мой дорогой %02.\nПрежде чем я смогу позаботиться о твоих нуждах, тебе нужно позаботиться о своей душе.\nУходи и возвращайся только тогда, когда твои ноги будут более твердо стоять на пути праведности."
  "2566":
    1: "%02, твоя личная тьма пронизана лучами света.\nЯ этого не допущу!\nЯ отказываюсь иметь дело с нерешительными, неуверенными и слабыми!\nВернись ко мне, когда докажешь свою злобу и запятнаешь свою душу!"
  "2567":
    1: "Как я мог не откликнуться на такой жалобный крик о помощи?\nЧто тебе нужно, %15?"
  "2568":
    1: "н/д"
  "2569":
    1: "Теперь я понимаю, что ты не злонамеренный осквернитель всего, что мне дорого, а скорее заблудшая душа, сбившаяся с пути на %09.\nЧем я могу тебе помочь, дитя?"
  "2570":
    1: "н/д"
  "2571":
    1: "н/д"
  "2572":
    1: "Я не поддамся угрозам."
  "2574":
    1: "<вздох> Да?"
  "2575":
    1: "Ах да, %02.\nЧем могу помочь?"
  "2576":
    1: "н/д"
  "2577":
    1: "Боюсь, мне понадобится второй платеж, %06.\n%04 прямо сейчас, иначе разговор на этом закончится."
  "2578":
    1: "н/д"
  "2579":
    1: "Извини, я ищу знаменитых героев, а не никому не известных простолюдинов.\nА теперь убирайся отсюда."
  "2580":
    1: "Ах, этот печально известный %02.\nДа, я слышал о тебе, и ты меня не впечатлил.\nНадеюсь, тебя скоро привлекут к ответственности!"
  "2581":
    1: "По правде говоря, ваши поступки служат вдохновением для всех нас!\nПродолжайте в том же духе — с вашей помощью Царство непременно скоро падет!"
  "2582":
    1: "Для меня большая честь, %10.\nЧем могу быть полезен?"
  "2583":
    1: "О, святые, спасите нас! Это те самые %10 Рая, пришедшие вершить правосудие! <ухмыляется> Позвольте мне поклониться вам, Ваше Высочество..."
  "2584":
    1: "Из моих источников стало известно, что вы, возможно, совершили ряд преступлений.\nПрежде чем я смогу поговорить с вами, вам необходимо уладить эти вопросы."
  "2585":
    1: "Извини, %06, но мне всё равно, если ты %08.\nПо правде говоря, я считаю твою высокомерную манеру поведения довольно оскорбительной…%06."
  "2586":
    1: "Умный чиновник общается только с людьми, пользующимися хорошей репутацией.\nВаша репутация составляет всего %11.\nДля меня этого недостаточно.\nИзвините."
  "2587":
    1: "%02.\nЯ понимаю, что ты, возможно, не совсем образцовый гражданин, но, возможно, и не простой преступник… Такие, как ты, всегда пригодятся — если не мне, то моим… партнёрам.\nНо мне нужно больше доказательств!\nСоверши ещё несколько преступлений — тогда мы сможем поговорить.\nИ никому не говори, что мы об этом говорили — если меня обвинят, я отрицаю наш маленький разговор."
  "2588":
    1: "%02? Данные по-прежнему вполне ясны:\nВаша репутация составляет %11.\nНа этом наш разговор должен закончиться."
  "2589":
    1: "<вздох> Опять?!?"
  "2590":
    1: "Я буду общаться только с теми, кто не поставит меня в неловкое положение!\nА ты — да.\nМожет быть, если люди начнут говорить мне, что твоя репутация составляет %12.\nА пока что…"
  "2591":
    1: "У меня по-прежнему есть сомнения насчет твоей приверженности жизни на темной стороне.\nЯ должен услышать, что твоя репутация составляет %12 или меньше!\nВ противном случае я не могу иметь с тобой ничего общего!"
  "2592":
    1: "н/д"
  "2593":
    1: "Молись сколько хочешь.\nЯ всё равно тебе не помогу."
  "2594":
    1: "Спасибо.\nЧем могу помочь?"
  "2595":
    1: "н/д"
  "2596":
    1: "н/д"
  "2597":
    1: "Угроза?\nТебе лучше убраться отсюда, пока я не поставил за тобой охрану!"
  "2599":
    1: "Что это такое?"
  "2600":
    1: "Снова здесь, %02?"
  "2601":
    1: "н/д"
  "2602":
    1: "%04 — это по-прежнему цена."
  "2603":
    1: "н/д"
  "2604":
    1: "%02?\nНикогда о тебе не слышал.\nА теперь уходи и перестань тратить моё время."
  "2605":
    1: "<вытаскивает %03 меч> %02! Готовься к смерти!"
  "2606":
    1: "%10 %02.<доставая фляжку из-под %03 куртки> Выпьем за тех, кто делает то, что хочет, когда хочет!"
  "2607":
    1: "%10 %02.\nДля меня это большая честь."
  "2608":
    1: "<вытаскивает %03 меч> %02!\nВо имя Зенофекса, приготовься к смерти!"
  "2609":
    1: "Я слышал, что вы, возможно, не совсем соблюдали закон в последнее время.\nЕсли бы это удалось доказать, я бы вас тут же арестовал."
  "2610":
    1: "Говорят, что ты %08.\nМне от этого тошно!\nЕсли ты не уберешься от меня как можно скорее, я сделаю с тобой гораздо больше, чем просто арестую!"
  "2611":
    1: "Мне поручено вести переговоры только с людьми с безупречной репутацией.\nВаше предложение составляет %11, а я должен требовать %12.\nМожете идти."
  "2612":
    1: "Мне приказали общаться только с людьми, у которых, э-э, соответствующая репутация.\nВаша репутация составляет всего %11.\nИдите себе."
  "2613":
    1: "Я по-прежнему считаю, что мне следует тебя арестовать."
  "2614":
    1: "Не могу поверить, что ты вернулся.\nУ меня уже чешется рука, держащая меч..."
  "2615":
    1: "Я не могу с тобой разговаривать.\nЯ знаю, что твоя репутация составляет всего %11. Она должна быть выше.\nПриказ.\nИзвини."
  "2616":
    1: "Я не могу с тобой разговаривать.\nЯ знаю, что твоя репутация составляет всего %11. Наверное, на самом деле она ещё хуже.\nПриказ.\nИзвини."
  "2617":
    1: "н/д"
  "2618":
    1: "<пинает тебя> Убирайся от меня!"
  "2619":
    1: "Спасибо.\nЧто вы хотели?"
  "2620":
    1: "н/д"
  "2621":
    1: "н/д"
  "2622":
    1: "ХА!\n<вытаскивает %03 меч> Хочешь мне пригрозить?"
  "2624":
    1: "Привет, друг! <делая забавный жест большим пальцем и носом> Бе-е-е! Конец света приближается!"
  "2625":
    1: "Ах, %16. Признаки действительно мрачные, не так ли?"
  "2626":
    1: "н/д"
  "2627":
    1: "н/д"
  "2628":
    1: "Не нужно угрожать мне второй раз — я буду сотрудничать.\nВ конце концов, Баа всё равно станет правителем Королевства.\nНичто из того, что скажем или сделаем мы с тобой, этого не изменит."
  "2629":
    1: "Хм?\nЧто? А, убирайся отсюда, у меня нет времени на мелких людей — это про тебя!\nТы недостаточно известен."
  "2630":
    1: "%02!\n<кричит> Пожалуйста, не убивайте меня! Я всё расскажу!"
  "2631":
    1: "<улыбается>\nКонец света приближается — с небольшой помощью от тебя и меня, %10 %02.\nЧем я могу тебе помочь?"
  "2632":
    1: "Замечательно, %10 %02!\nТы пришёл спасти мир!\nСлава тебе!\nНадеюсь только, что ты не опоздал."
  "2633":
    1: "Жаль, что ты на стороне проигравших, %02!\nНо послушай, я расскажу тебе всё, что захочешь — Храм Баа скоро воцарится, что бы ты ни делал!\nТолько, пожалуйста, не убивай меня."
  "2634":
    1: "Ой, боже мой!\nВсе говорят ужасные вещи о тебе и твоих друзьях, %02.\nБоюсь, я не могу с тобой разговаривать."
  "2635":
    1: "Бе-е-е! <злобно ухмыляясь> Бе-е-е! Стадо зовет, друг.\nПочему бы тебе не пойти и не сделать что-нибудь хорошее?\nДавай же!\nУбирайся!"
  "2636":
    1: "Я категорически отказываюсь общаться с людьми, у которых репутация ниже %12."
  "2637":
    1: "Бе-е-е, друг %02!\nЯ слышал, что вы, возможно, как раз те люди, которых мы ищем.\nНо я не уверен.\nВам нужно заслужить репутацию человека, способного делать то, что требует наша секта… Уверен, вы меня понимаете!"
  "2638":
    1: "<шепотом> Мне всё ещё запрещено разговаривать с тобой, %02!\nА теперь, пожалуйста, уходи, пока меня с тобой не заметили!"
  "2639":
    1: "Ты что, с ума сошёл?\nЯ же сказал: убирайся!\nМне сегодня не нужны никакие добрые дела."
  "2640":
    1: "Все в моём тайном культе говорят мне, что ты недостаточно милый, чтобы с тобой общаться.\nТак что стань помилее, и я начну с тобой разговаривать."
  "2641":
    1: "Ваша репутация не соответствует требованиям моей организации, %02, поэтому я не могу позволить себе, чтобы меня видели разговаривающим с вами.\nВернитесь, когда ваша репутация улучшится."
  "2642":
    1: "н/д"
  "2643":
    1: "Я уже говорил тебе, что ты мне не особо нравишься.\nИди досаждай кому-нибудь другому."
  "2644":
    1: "н/д"
  "2645":
    1: "Моя преданность Баа дороже любых денег.\nЯ никогда не приму твою взятку, никогда!"
  "2646":
    1: "Ладно, ладно!\nПожалуйста, не убивайте меня.\nМне ещё не пора умирать."
  "2647":
    1: "н/д"
  "2649":
    1: "Здравствуйте! Меня зовут %01, и я рад познакомиться с вами, %02."
  "2650":
    1: "Сейчас %05. Какое чудесное время, %02, правда?"
  "2651":
    1: "У меня уже не такое хорошее настроение.\nИди, досаждай кому-нибудь другому."
  "2652":
    1: "н/д"
  "2653":
    1: "н/д"
  "2654":
    1: "Не беспокой меня, простак!\nЯ уделяю своё время исключительно известным и способным Героям — а не неизвестным и некомпетентным крестьянам."
  "2655":
    1: "<раскрывая глаза> %02? Злодей!\nБез тебя мир стал бы лучше!"
  "2656":
    1: "<глубоко кланяясь> %10 %02! О твоей злобе известно по всей стране!\nСчитай меня своим самым преданным сторонником."
  "2657":
    1: "Для меня большая честь познакомиться с вами, %02.\nЯ к вашим услугам."
  "2658":
    1: "%02.\nОт твоей ослепительной доброты у меня разболелась голова. <потирает %03 виски>\nПохоже, чтобы избавиться от этой боли, мне придётся тебя убить."
  "2659":
    1: "Ходит слух, что вы — преступник.\nБоюсь, я не общаюсь с преступниками."
  "2660":
    1: "Все говорят, что твоя репутация составляет %11.\nЯ это ненавижу.\nНо, поскольку ты меня развлекаешь, я позволю тебе пожить ещё немного — при условии, что ты пойдёшь досаждать кому-нибудь другому."
  "2661":
    1: "Меня зовут %01.\nОбщение с людьми, чья репутация ниже %12, стало бы нарушением моих священных клятв.\nПоэтому я вынужден попрощаться с вами."
  "2662":
    1: "%02.\nКак Поборник зла, мне приятно слышать, что твоя репутация составляет %11, но ты просто недостаточно злой для меня!\nСтань ещё хуже!\nЯ говорю о настоящих зверствах!\nУстрой бедствие или соверши какой-нибудь подлый поступок — тогда и поговорим."
  "2663":
    1: "%02, твоя репутация составляет %11.\nМой инстинкт подсказывает мне убить тебя на месте, но из милосердия я дам тебе шанс искупить вину, пощадив тебя.\nПока что."
  "2664":
    1: "Вижу, ты вернулся, чтобы испытать моё терпение."
  "2665":
    1: "Хм.\n%02.\nЯ поклялся держаться подальше от людей с плохой репутацией.\nТвоя репутация составляет %11, а это ниже моего уровня.\nВозможно, если она улучшится..."
  "2666":
    1: "%02, твоя злоба колеблется.\nЕщё.\nЕщё, говорю я!\nТебе нужно достичь как минимум %12, чтобы я захотел с тобой поговорить, так что за работу!"
  "2667":
    1: "Хм.\nЛадно.\nНо только потому, что у меня хорошее настроение."
  "2668":
    1: "н/д"
  "2669":
    1: "н/д"
  "2670":
    1: "Думаю, нет.\nНикакие деньги не смогут изменить мое мнение о тебе."
  "2671":
    1: "н/д"
  "2672":
    1: "Ты хочешь бросить мне вызов?\nЯ готов к таким, как ты!"
  "2674":
    1: "%02.\nРад познакомиться с вами."
  "2675":
    1: "%02.\nНадеюсь, вы не собираетесь тратить моё время зря…"
  "2676":
    1: "Твоя аудитория закончилась.\nУбирайся отсюда и больше не беспокой меня сегодня."
  "2677":
    1: "н/д"
  "2678":
    1: "н/д"
  "2679":
    1: "Мне хочется поговорить с героями, а не с детьми.\nЕсли хочешь, чтобы я уделил тебе время, сделай что-нибудь героическое."
  "2680":
    1: "Хм.\nПечально известный и злобный %02. Удивительно, что ни один из Героев этой земли ещё не убил тебя.\nЯ обязательно помогу увеличить награду за ваши головы."
  "2681":
    1: "Очень приятно познакомиться с таким интригующим и предприимчивым %10 %02.\nКогда я впервые услышал о твоих проделках, я был очень впечатлён!"
  "2682":
    1: "Ах! Для меня большая честь и привилегия видеть вас, %02.\nВсе мои значительные ресурсы к вашим услугам."
  "2683":
    1: "Очевидно, ты — враг, о Защитник праведности! Твоя скорая смерть доставила бы мне удовольствие."
  "2684":
    1: "Из моих источников стало известно, что вы совершили ряд преступлений.\nГоворят, что вы, возможно, даже УБИЛИ кого-то.\nБоюсь, что с таким прошлым я не смогу вам помочь."
  "2685":
    1: "Не все ценят то, как ты %08.\nЯ — один из таких людей.\nСомневаюсь, что нам есть о чём поговорить."
  "2686":
    1: "Я не стану портить свою безупречную репутацию, общаясь с тем, чья репутация составляет всего %11."
  "2687":
    1: "Я вижу, что ты, возможно, из тех людей, с которыми я обычно общаюсь, %02, но слухи о твоем поведении расходятся.\nМне нужно узнать больше, прежде чем я смогу смириться с твоим присутствием.\nМожет быть, ты мог бы помыкать и издеваться над какими-нибудь крестьянами?"
  "2688":
    1: "Мне не прилично, чтобы меня видели разговаривающим с такими преступниками, как вы.\nА теперь убирайтесь с глаз долой!"
  "2689":
    1: "Ты мне по-прежнему не очень нравишься, %02.\nТвоя репутация среди простого народа составляет %11, что, на мой взгляд, — плохой знак."
  "2690":
    1: "Все мои друзья говорят, что твоя репутация составляет %11, %02.\nЭто недостаточно!\nВозможно, один-два добрых поступка сделают твое присутствие более приемлемым для цивилизованного общества."
  "2691":
    1: "Не могу поверить, что ты осмелился явиться ко мне с репутацией всего лишь %11!\nЭто действительно ужасное оскорбление, %10.\nУходи и вернись, когда твоя репутация достигнет %12!"
  "2692":
    1: "Сегодня я исполню твое желание. Я поговорю с тобой.\nКоротко."
  "2693":
    1: "н/д"
  "2694":
    1: "н/д"
  "2695":
    1: "Твое ничтожное богатство даже не способно меня соблазнить.\nМеня не подкупить."
  "2696":
    1: "н/д"
  "2697":
    1: "Я не поддамся вашим угрозам!"
  "2698":
    1: "Банки. Даааа! Вы нам очень помогли."
  "2699":
    1: "Вступить в гильдию"
  "2700":
    1: "Ну что, есть среди вас чародеи, жаждущие обрести силу тёмных искусств? Заплатите 10 000 банкнот и входите в наши покои."
  "2701":
    1: "Мы не позволим ни одному бездельнику проникнуть сюда. Плати и учись — или убирайся!"
  "2702":
    1: "Отлично! Теперь я называю всех колдунов среди вас некромантами — хватит притворяться добродетельными."
  "2703":
    1: "Добро пожаловать, некроманты."
  "2704":
    1: ","
  "2705":
    1: "("
  "2706":
    1: ")"
  "2707":
