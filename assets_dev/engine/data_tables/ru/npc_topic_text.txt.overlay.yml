  "1271":
    1: "Во всех здешних партиях в «Аркомаг» каждый игрок начинает с башней высотой 10 и стеной высотой 20.\nДля победы нужно либо поднять башню до 125, либо накопить 350 единиц одного из ресурсов, либо разрушить башню соперника."
  "1272":
