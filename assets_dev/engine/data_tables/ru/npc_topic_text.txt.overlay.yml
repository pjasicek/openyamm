  "1343":
    1: "Качество вашего снаряжения зависит от мастерства того, кто его ремонтирует.\nЕсли вы не сможете его починить, то рискуете оказаться в дикой местности без доспехов и оружия.\nЭто может обернуться крайне плачевно. Мастерство в навыке «Ремонт предметов» дает вам возможность ремонтировать не только оружие, но и доспехи.\nВы сможете овладеть этим навыком, если ваш уровень навыка равен 4 и вы заплатите 500 золотых."
