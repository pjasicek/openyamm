rows:
  "0":
    1: "Если вы видите этот текст, сообщите Джеймсу."
  "1":
    1: "Если пираты прорвутся сквозь ряды наших воинов, мы обречены!"
  "2":
    1: "Спасибо, что одолели пиратов! Теперь бы ещё кто-нибудь разобрался с Огненной горой!"
  "3":
    1: "Путь назад, в деревню Кровавая Капля, отрезан! Я даже не знаю, жива ли моя семья!"
  "4":
    1: "Вы прошли через Каменные порталы? Они снова работают? Теперь мы сможем вернуться к своим семьям!"
  "5":
    1: "Ар-р! Либо вступайте в бой, либо не путайтесь под ногами!"
  "6":
    1: "Кто-нибудь должен очистить пещеры, где устроили логово лютые волки. Одной бедой станет меньше — и жить станет чуть легче!"
  "7":
    1: "Ходят слухи, что близится конец света. Посмотришь на кристалл посреди города — и поневоле им поверишь!"
  "8":
    1: "Прошлой ночью за моим домом снова рыскала стая мерзких крысолюдов. Кто-нибудь должен разобраться с этими тварями. Удивительно, что наши дети ещё целы среди крыс и лютых волков!"
  "9":
    1: "Пожалуйста, не трогайте нас! Арион Охотник сказал, что теперь мы друзья!"
  "10":
    1: "Мы навеки у вас в долгу! Вы спасли Равеншор и весь Джадам!"
  "11":
    1: "Хотите выстрелить из пушек, защищая остров Кинжальной Раны?"
  "12":
    1: "Помогите! Если мы не выбьем пиратов с острова, всё будет потеряно!"
  "13":
    1: "Пиратский аванпост уничтожен, и наши дома снова в безопасности! Спасибо!"
  "14":
    1: "Огры всё сильнее отравляют нам жизнь. Если кто-нибудь разберётся с ними в крепости, всё может измениться к лучшему!"
  "15":
    1: "Боевые осы построили к юго-востоку отсюда огромное гнездо. Если оно разрастётся, городу будет грозить опасность."
  "16":
    1: "Вести из разных земель Джадама очень медленно доходят до Альвара. Интересно, знают ли торговцы, что творится в мире?"
  "17":
    1: "Огненное море уничтожило нашу деревню! Кто знает, сколько мы ещё здесь протянем."
  "18":
    1: "После гибели деревни нам только налёта циклопов не хватало! Тогда наша судьба будет решена и мы наверняка погибнем!"
  "19":
    1: "К северу от деревни появилась странная пещера. Она возникла вскоре после того, как огненное море опустошило деревню. Видели, как туда входят и оттуда выходят странные существа. Интересно, что скрывается внутри?"
  "20":
    1: "Под началом сэра Чарльза Кихота мы раз и навсегда избавим эти земли от драконьей угрозы!"
  "21":
    1: "Наги всё чаще мешают нам охотиться. Мало того что приходится следить за драконами в небе, так теперь ещё и наги выбираются из своего хранилища!"
  "22":
    1: "Сэр Чарльз Кихот отправил нас обучаться под началом Джерика Вислбона. Надеюсь, когда-нибудь и я стану таким же великим рыцарем!"
  "23":
    1: "Уже много ночей на севере видны странные вспышки. Безумная некромантка Зантора наверняка замышляет недоброе. Надеюсь только, что не против нашей Гильдии некромантов!"
  "24":
    1: "Прошлой ночью вампиры снова напали. Как же они надоели! Но Гильдия некромантов заключила союз с носферату, и мы не можем дать им отпор."
  "25":
    1: "Мы много лет не воевали с Храмом Солнца. Надеюсь, они не готовят новое нападение на Гильдию — после прошлой битвы мы восстанавливались долгие годы!"
  "26":
    1: "Слава всем, кто купается в очищающем свете Солнца! Следуете ли вы путём его света?"
  "27":
    1: "Страшная буря опустошила почти весь лес к северу отсюда! Она согнала василисков, блуждающие огни и единорогов ближе к храму!"
  "28":
    1: "Убирайтесь! Вы нам здесь ни к чему — разве что пойдёте на корм вивернам!"
  "29":
    1: "С тех пор как каньон затопило, из Логова Бальтазара не пришёл ни один путник. Интересно, удалось ли кому-нибудь пережить наводнение?"
  "30":
    1: "Берегитесь! Грозный пират Стэнли не любит, когда чужаки суют нос в дела нашего острова!"
  "31":
    1: "Если мы захватим остров Кинжальной Раны, ничто не помешает нам грабить Равеншор и даже сам Альвар!"
  "32":
    1: "Прошлой ночью я видел факелы в старом разрушенном форте за заливом. Интересно, что там делали люди?"
  "33":
    1: "Спасибо, что помогли нам осушить логово!"
  "34":
    1: "Теперь, когда вода ушла, мы можем привести жизнь в порядок. Но что, если наводнение повторится? Действительно ли мы в безопасности?"
  "35":
    1: "Наш вождь Масул наверняка захочет поговорить с вами, если вы ещё не встретились. Найдите его — возможно, он наградит вас за помощь."
  "38":
    1: "Здесь не на что смотреть… проходите дальше."
  "39":
    1: "Ступайте в Свете, друзья."
  "40":
    1: "Добро пожаловать в нашу святую обитель. Если у вас есть дело к ордену, обратитесь к верховному жрецу Оскару Тайру. Его кабинет находится в храме."
  "41":
    1: "Чего вы ко мне пристали? Поговорите с главой Гильдии Сандро — это он занимается гостями, а не я!"
  "42":
    1: "Прочь с дороги, кретин! Ты мешаешь мне думать, а я размышляю о важных вещах!"
  "43":
    1: "Надеюсь, война с драконами никогда не закончится! Чарльз Кихот щедро платит таким наёмникам, как я."
  "44":
    1: "Наш король Дефтклоу взял вас под свою защиту, но будьте осторожны. Устроите неприятности — и я вами перекушу."
  "45":
    1: "Наш король Дефтклоу взял вас под свою защиту, но будьте осторожны. Устроите неприятности — и я вами перекушу."
  "52":
    1: "Удачи в конкурсе!"
  "53":
    1: "Хотелось бы, чтобы Брент умел приготовить красное зелье."
  "54":
    1: "Тебе лучше быть осторожнее."
  "55":
    1: "Не создавай проблем."
  "56":
    1: "Поздравляем!"
  "57":
    1: "Спасибо, что выбрали нас!"
  "61":
    1: "Так вы — новые владыки Хармондэйла? Чем могу быть полезен?"
  "62":
    1: "Так вы — новые владыки Хармондэйла? Чем могу быть полезен?"
  "63":
    1: "Хотите учиться у нас под руководством мастеров?"
  "64":
    1: "Добро пожаловать в столицу Стидвика! Берегитесь грифонов!"
  "65":
    1: "Добро пожаловать в Пирпонт, столицу эльфов."
  "66":
    1: "Приветствую! Поднимайтесь по лестнице в Пирпонт и располагайтесь!"
  "67":
    1: "Остерегайтесь «Ходячих мертвецов» в этом регионе!"
  "68":
    1: "Думаю, тебе здесь рады… хотя, с другой стороны…"
  "69":
    1: "Хотите поучиться у лучших волшебников Эратии?"
  "70":
    1: "Привет. В последнее время вокруг полно големов!"
  "71":
    1: "Учитесь у лучших и осмотрите все здания здесь!"
  "72":
    1: "Здесь, в Селесте, вас ждут спокойствие и отдых."
  "73":
    1: "Добро пожаловать! Постарайтесь не «поссориться» с кем-нибудь, пока вы здесь!"
  "74":
    1: "Добро пожаловать в «Пит»! Кто сказал, что быть мертвым — это плохо?"
  "75":
    1: "«Пит» — единственное место, о котором я знаю, где мы можем жить в мире!"
  "76":
    1: "Привет! Некромантия — это зло? Это же относительное понятие, не так ли?"
  "77":
    1: "Добро пожаловать в «Малдер»! Желаем вам приятно провести время у нас."
  "78":
    1: "Вы далеко уехали?"
  "79":
    1: "Здравствуйте! Вы пришли через туннели из Каменного города?"
  "80":
    1: "Привет! А ты в последнее время заглядывала в свою сумочку? Давай я за тебя загляну…"
  "81":
    1: "У какого-нибудь чудака из этих мест наверняка есть расписание рейсов лодок!"
  "82":
    1: "Как житель города Тайдвотер, я радуюсь вашему приезду."
  "83":
    1: "Привет, а что-нибудь слышали о пиратах из Регнана?"
  "84":
    1: "Я слышал, что к Древним построили ворота! Интересно, как они выглядят."
  "85":
    1: "Я слышал слухи о гоблинах и нежити, вооруженных древним оружием, которые угрожают завоевать Эратию! Как ужасно!"
  "86":
    1: "Поздравляем с прохождением ворот! Эратия в долгу перед вами!"
  "87":
    1: "Поздравляем с завершением строительства кузницы! Победа обязательно будет за нами!"
  "88":
    1: "Здравствуйте!"
  "89":
    1: "Здравствуйте!"
  "90":
    1: "Здравствуйте!"
  "91":
    1: "Здравствуйте!"
  "92":
    1: "Здравствуйте!"
  "93":
    1: "Здравствуйте!"
  "94":
    1: "Здравствуйте!"
  "95":
    1: "Здравствуйте!"
  "96":
    1: "Здравствуйте!"
  "97":
    1: "Здравствуйте!"
  "98":
    1: "Здравствуйте!"
  "99":
    1: "Здравствуйте!"
  "100":
    1: "Здравствуйте!"
  "101":
    1: "Здравствуйте!"
  "102":
    1: "Я слышал, что в заброшенной крепости на холме теперь обитает стая гоблинов. Ведь крепость была построена именно для того, чтобы не пускать гоблинов, так как же такое могло произойти?"
    2: "«Гоблинватч»"
  "103":
    1: "В одном дне пути на запад отсюда находится новый храм, посвящённый Баа. Я слышал, что с богатыми людьми, которые путешествуют в тех краях, случаются неприятности."
    2: "Храм Баа"
  "104":
    1: "Перевалы через холмы на западе кишат разбойниками, поэтому путешествовать по ним пешком может быть опасно."
    2: "Бандиты"
  "105":
    1: "Путешествия по морю в этих краях могут быть опасными из-за морских змей и водных элементалей, обитающих в океанах."
    2: "Путешествие по морю"
  "106":
    1: "Высшему совету в Свободной гавани действительно следует обратиться к Оракулу, чтобы выяснить, почему Айронфисты утратили Мандат Небес."
    2: "Оракул"
  "107":
    1: "Принц Николай уже даже не стоит у руля — все решения принимает регент Хамфри. Несправедливо возлагать на Николая вину за все проблемы."
    2: "Принц Николай"
  "108":
    1: "Оба солнцестояния — дни, имеющие значительное магическое значение. Летнее солнцестояние приходится на 21 июня, а зимнее — на 21 декабря."
    2: "Солнцестояния"
  "109":
    1: "Из конюшен замка Айронфист вы можете попасть на Арену — древнее место, где воины могут проверить свое мастерство."
    2: "Арена"
  "110":
    1: "Гоблины — слабые существа, но они, как правило, нападают большими группами."
    2: "Гоблины"
  "111":
    1: "Хотя их физические атаки слабы, эти маги могут накладывать различные заклинания стихийной атаки."
    2: "Ученики-маги"
  "112":
    1: "«Мордред» — мощный артефакт в виде кинжала, обладающий способностью похищать здоровье жертвы и передавать эту жизненную силу своему владельцу."
    2: "Мордред"
  "113":
    1: "Альберт Ньютон в «Мисте» отвечает за продвижение чародеев до звания волшебников."
    2: "Волшебники"
  "114":
    1: "В заброшенном храме к северо-западу от города раньше размещался Храм Баа, но в один из дней прошлого года его обитатели в спешке покинули это место. Теперь там обитают только змеи, летучие мыши и огромные пауки."
    2: "Заброшенный храм"
  "115":
    1: "Когда Храм Баа переехал из того старого храма за городом, все мелкие проблемы, с которыми мы сталкивались, просто… исчезли. Говорю вам, в этих людях есть что-то нехорошее. Я рад, что они ушли."
    2: "Храм Баа"
  "116":
    1: "Мой друг-волшебник рассказал мне, что Храм Баа накладывал проклятия на наш город из заброшенного храма, расположенного прямо за его пределами. Однажды они попытались наложить на нас «Проклятие бесконечной полчища вредителей», но что-то пошло не так, и проклятие обернулось против них самих, заразив вместо этого их собственный храм. Как только это произошло, они тут же убрались оттуда."
    2: "Проклятия"
  "117":
    1: "Я слышал, что Храм Баа так поспешно покинул тот старый храм, что у них даже не успели забрать все свои вещи. Всё это, наверное, до сих пор лежит там, если ты достаточно смел, чтобы пойти и поискать. Правда, на пути встретится много опасных монстров, так что будь осторожен, если решишься пойти."
    2: "Сокровище"
  "118":
    1: "Прошло уже довольно много времени с тех пор, как Нью-Сорпигал подвергся нападению гоблинов, но раз гоблины обитают именно в том месте, которое должно было защищать нас от них, то, наверное, скоро нас снова атакуют, не так ли?"
    2: "«Гоблинватч»"
  "119":
    1: "Злобная гильдия магов прочесывает юго-восточную оконечность нашего полуострова в поисках следов легендарного Фонтана магии. Они нападают на всех, кто приближается к этому месту, чтобы отпугнуть потенциальных соперников. Будьте предельно осторожны, если будете путешествовать в том направлении!"
    2: "Волшебники"
  "120":
    1: "Говорят, что вода в трех фонтанах, которые есть у нас в городе, берёт начало из источника, коснутого богами. Каждый из них обладает магической силой, и пить из них полезно для здоровья."
    2: "Городские фонтаны"
  "121":
    1: "Отряд гоблинов устроил засаду на западном мосту, намереваясь ограбить и убить путешественников. Они не особо осторожны — их видно за милю — но они ДЕЙСТВИТЕЛЬНО опасны. Будьте осторожны!"
    2: "Набеги гоблинов"
  "122":
    1: "Наш город был основан несколько веков назад как последний крупный город в Энроте. На протяжении всей истории он служил отправной точкой, откуда колониальные корабли отправлялись в другие части мира."
    2: "Новый Сорпигал"
  "123":
    1: "Плоды на деревьях в садах нашего прекрасного городка очень вкусные, и их может сорвать любой желающий. Вам стоит их когда-нибудь попробовать!"
    2: "Плодовые деревья"
  "124":
    1: "Будьте осторожны, отправляясь на острова, расположенные недалеко от нашего северного побережья. В этих водах иногда появляются опасные чудовища, да и сами острова не отличаются особой гостеприимностью."
    2: "Острова"
  "125":
    1: "Прошло уже несколько десятилетий с тех пор, как на нас в последний раз напали пираты с островов Регна, и, пожалуй, пора нам снова подвергнуться нападению — тем более что король пропал и всё такое."
    2: "Пираты Регны"
  "126":
    1: "В «Логове пиратов» в Новом Сорпигале и Мисте можно освоить навыки «Кинжал», «Торговец», «Опознание предметов», «Восприятие» и «Обезвреживание ловушек»."
    2: "Логово «Буканьеров»"
  "127":
    1: "В службах безопасности в Серебряной бухте и Уайт-Кэп вы можете освоить навыки «Кинжал», «Торговец», «Опознание предметов», «Восприятие» и «Обезвреживание ловушек»."
    2: "Службы охраны"
  "128":
    1: "В Блэкшире и Свободной гавани находится Гильдия контрабандистов, где вы можете освоить навыки «Кинжал», «Торговля», «Опознание предметов», «Восприятие» и «Обезвреживание ловушек»."
    2: "Гильдия контрабандистов"
  "129":
    1: "В «Блейдс-Энд» — как в Уайт-Кэпе, так и в Нью-Сорпигале — преподают владение мечом, топором, копьем, посохом и изготовление кожаных изделий."
    2: "«Конец Клинков»"
  "130":
    1: "В «Учебном центре дуэлянтов» в Мисте преподают владение булавой, луком, кольчугой, щитом и бодибилдинг."
    2: "«Преимущество дуэлянтов»"
  "131":
    1: "У «Ярости берсерка» в замке Айронфист можно научиться владению луком, щитом, кольчугой, доспехами и ремонту предметов."
    2: "Ярость берсерка"
  "132":
    1: "«Братство Серебра» недавно построило крепость к югу от Миста. Раньше это были такие милые люди, но теперь они настолько увлечены борьбой со злом, что уничтожают всё, что не идеально, а это практически всё."
    2: "«Серебряные шлемы»"
  "133":
    1: "Мне очень нравится жить здесь! Лорд Ньютон никогда не вспоминает о том, чтобы повысить налоги."
    2: "Налоги"
  "134":
    1: "На островах Гавани контрабандиста обитают несколько племен каннибалов. Те, кто посещает эти острова, не возвращаются."
    2: "Гавань контрабандиста"
  "135":
    1: "«Фонтан волшебства» якобы находится к югу от Гавани контрабандиста, но мало кто его когда-либо находил."
    2: "Фонтан волшебства"
  "136":
    1: "На островах к югу от Миста находится кузница Гарика, одного из соратников Арчибальда по магии. Это место кишит элементалями — сейчас туда уже никто не ходит."
    2: "Кузница Гарика"
  "137":
    1: "На острове к северу от Миста находится замок Аламос — один из центров изучения магии в Энроте. В этом замке практикуются всевозможные виды призывания и алхимии — для случайного посетителя это опасное место."
    2: "Замок Аламос"
  "138":
    1: "Говорят, что на островах-джунглях Гавани контрабандиста до сих пор стоят несколько старинных храмов. Интересно, есть ли ещё люди, которые там молятся?"
    2: "Храмы"
  "139":
    1: "В водах около Миста бродят водные элементали. Как будто их мощных физических атак было недостаточно, они ещё и могут стрелять ледяными стрелами на расстоянии."
    2: "Водяные элементали"
  "140":
    1: "Этот топор — мечта любого героя. Он зачарован для того, чтобы убивать драконов и демонов, и справляется с этой задачей на «отлично». К сожалению, владельцам этого топора приходится сталкиваться с такими существами чаще, чем им хотелось бы."
    2: "Конан"
  "141":
    1: "Не многие добираются до звания волшебника, а до звания архимагов добираются ещё меньше. Альберт Ньютон вынужден предъявлять невыполнимые требования к тем, кто стремится получить повышение."
    2: "Архимаги"
  "142":
    1: "Изначально Мист задумывался как таможенный и торговый порт для ведения дел с восточными островами и странами. Пиратство серьезно подорвало эту торговлю, поэтому мы не так процветаем, как следовало бы."
    2: "Туман"
  "143":
    1: "Примерно в 200 милях к востоку от нас находятся Регнанские острова. Они заселены пиратами, которыми правит «император», взимающий «налог» с проходящих мимо их территории судов. Регнанцы практически ничего не производят сами, за исключением оружия и наёмников."
    2: "Регна"
  "144":
    1: "Я слышал, что можно приготовить зелье высшей защиты, смешав оранжевое зелье с зеленым."
    2: "Рецепт"
  "145":
    1: "Мелоди Сильвер недавно была заключена в тюрьму «Серебряными Шлемами» на их новом аванпосте к югу от Миста. В последнее время они ведут себя крайне странно, и просто ужасно, что они схватили такую милую молодую женщину. Кто-то должен что-то предпринять в отношении этих людей!"
    2: "Мелоди Сильвер"
  "146":
    1: "Отряд «Серебряные Шлемы», основанный Джоном Сильвером, изначально был создан для борьбы с разбойниками и убийцами, но в последнее время его члены преследуют горожан даже за самые незначительные правонарушения."
    2: "Самоуправцы"
  "147":
    1: "Большая часть международной торговли нашего острова приходится на Королевство Эратия — родину нашей доброй королевы Кэтрин. Именно из Эратии поступает большая часть наших драгоценных металлов и камней."
    2: "Торговля"
  "148":
    1: "Многолетняя практика высшего колдовства может серьезно подорвать память колдуна, и от этого нет лекарства. Даже если бы оно и существовало, вряд ли пострадавший вспомнил бы, как им воспользоваться!"
    2: "Память"
  "149":
    1: "Альберт Ньютон был назначен на свою нынешнюю должность благодаря тому, что решительно поддержал Роланда во время Войны за престол, хотя Арчибальд предлагал ему обширные знания в области магии. Лорд Ньютон, несомненно, должен быть хорошим человеком, раз отказался поддержать злобного Арчибальда, даже когда казалось, что Арчибальд одержит победу."
    2: "Война за престол"
  "150":
    1: "Хотя в последнее время лорд Ньютон выглядит слабым и забывчивым, стоит помнить, что когда-то он был одним из величайших волшебников в стране, а может быть, и величайшим волшебником всех времён! Говорят, что лорд Ньютон забыл больше знаний о магии, чем Арчибальд когда-либо знал, за исключением школы магии Тьмы."
    2: "Лорд Миста"
  "151":
    1: "В «Логове пиратов» в Новом Сорпигале и Мисте можно освоить навыки «Кинжал», «Торговец», «Опознание предметов», «Восприятие» и «Обезвреживание ловушек»."
    2: "Логово «Буканьеров»"
  "152":
    1: "Навыки «Кинжал», «Торговец», «Опознание предметов», «Восприятие» и «Обезвреживание ловушек» можно освоить в «Службе охраны» в Серебряной бухте и Уайт-Кэп."
    2: "Службы охраны"
  "153":
    1: "В Блэкшире и Свободной гавани находится Гильдия контрабандистов, где вы можете освоить навыки «Кинжал», «Торговля», «Опознание предметов», «Восприятие» и «Обезвреживание ловушек»."
    2: "Гильдия контрабандистов"
  "154":
    1: "В «Блейдс-Энд» — как в Уайт-Кэпе, так и в Нью-Сорпигале — преподают владение мечом, топором, копьем, посохом и изготовление кожаных изделий."
    2: "«Конец Клинков»"
  "155":
    1: "В Свободной гавани у «Клинка дуэлянта» можно научиться владению булавой, луком, кольчугой, щитом, а также ремонту предметов."
    2: "«Преимущество дуэлянтов»"
  "156":
    1: "У «Ярости берсерка» в Серебряной бухте можно обучиться владению мечом, луком, щитом, доспехами и бодибилдингу."
    2: "Ярость берсерка"
  "157":
    1: "Если ваш навык достаточно высок, Кальвин Блэк обучит вас владению посохом. Он живёт в доме возле «Имп-Слэппера»."
    2: "Кальвин Блэк"
  "158":
    1: "Когда Гонсало не проводит время в «Имп-Слэппере», он преподает мастерство владения копьем."
    2: "Гонсало Рамирес"
  "159":
    1: "Если вы хотите освоить навыки изготовления кожаных доспехов, Артур преподает прямо рядом с «Логовом пиратов»."
    2: "Артур О'Лири"
  "160":
    1: "Бернард обучает ремонту предметов на уровне эксперта чуть южнее «Клинка дуэлянта»."
    2: "Бернард Джейкобс"
  "161":
    1: "Странные существа, которые появились здесь, заставляют людей забыть, что Аламос когда-то был родиной одних из лучших алхимиков в мире. В том замке, наверное, хранятся могущественные предметы."
    2: "Аламос"
  "162":
    1: "На одном из островов к западу находится странный круг из камней. Думаю, он используется для «Церемонии Солнца» — одного из испытаний при продвижении по служебной лестнице друидов."
    2: "Каменный круг"
  "163":
    1: "Воды вокруг замка Аламос кишат морскими змеями, которые нападают на корабли своим ледяным дыханием."
    2: "Морской змей"
  "164":
    1: "«Персиваль» — идеальное оружие для атаки на расстоянии. Благодаря высокой скорострельности и опасной взрывной атаке оно позволяет уничтожать большое количество врагов, находясь на безопасном расстоянии."
    2: "Персиваль"
  "165":
    1: "Эти надоедливые существа невосприимчивы к магии, но не к хорошему удару мечом."
    2: "Питомец Агара"
  "166":
    1: "Старый король гномов сейчас находится в изгнании, но готов поспорить, что он очень хочет вернуть себе трон."
    2: "Роклин"
  "167":
    1: "Снергл спрятал ключ от самых потаенных комнат своих пещер в железных рудниках к западу."
    2: "Железные рудники"
  "168":
    1: "Уилбур Хамфри так боится, что с Николаем что-нибудь случится, что принцу уже несколько месяцев не разрешают выходить из замка."
    2: "Николай"
  "169":
    1: "После поражения в Войнах за престол Корлагон удалился в своё поместье в «Болоте Проклятых», чтобы заниматься магией. Ходят слухи, что он стал личем, надеясь дожить до возвращения Арчибальда."
    2: "Корлагон"
  "170":
    1: "«Гильдия Теней» — недавно возникшая гильдия воров — якобы имеет укрытие недалеко от замка Айронфист. Уверен, Энтони Стоун с удовольствием бы увидел, как это укрытие будет уничтожено."
    2: "Гильдия «Тень»"
  "171":
    1: "Меня удивляет, что Николай не обратился за советом к Оракулу; я сомневаюсь, что регент Хамфри знает все ответы."
    2: "Оракул"
  "172":
    1: "По-прежнему нет никаких новостей о том, когда Кэтрин вернётся из поездки в Эратию."
    2: "Кэтрин"
  "173":
    1: "Яхта короля Роланда «Королева Кэтрин» уже много лет не выходила из порта. А пригодная ли она вообще к плаванию?"
    2: "Яхта"
  "174":
    1: "В болотистых местностях к югу от замка Айронфист рыщут люди-ящерицы. Они вооружены луками, но самыми опасными из них являются волшебники, которые при угрозе наносят удары «Молнией»."
    2: "Люди-ящерицы"
  "175":
    1: "Добраться до Арены Энрота можно через конюшни в Айронфисте. Там можно сражаться практически с любыми монстрами, если вам нравится подобное. Многие ходили бы туда каждый день, но Арена открыта только по воскресеньям."
    2: "Арена"
  "176":
    1: "Полезный щит, который безошибочно блокирует атаки снарядами и повышает вероятность того, что его владелец нанесет удары в бою."
    2: "Валерия"
  "177":
    1: "В отсутствие Роланда Уилбур Хамфри занимается повышением всех паладинов до звания крестоносцев."
    2: "Крестоносцы"
  "178":
    1: "Лорд Корлагон был главным помощником Арчибальда во время Войны за престол, а после поражения своей стороны уединился в своём особняке где-то в болотах. Говорят, что пару лет назад он совершил «Ритуал Бесконечной Ночи» и стал личем."
    2: "Лорд Корлагон"
  "179":
    1: "Уилбур Хамфри — главный паладин королевства. Хотя многие считают его слишком наивным и неподходящим для управления страной в отсутствие короля Роланда, люди говорят, что он абсолютно бесстрашен и честен. Лично я считаю, что лучшего человека на эту должность просто не найти!"
    2: "Уилбур Хамфри"
  "180":
    1: "Великолепный «Цирк Солнца» обычно разбивает лагерь в нескольких днях пути по торговой дороге, ведущей на север от замка Айронфист. В декабре каждого года они всегда бывают там."
    2: "Цирк Солнца"
  "181":
    1: "Рядом с замком на торговой дороге бесстыдно орудуют разбойники. Регент, должно быть, сильно отвлечён, раз позволяет этим головорезам грабить ни в чем не повинных путников прямо у него под носом!"
    2: "Разбойники"
  "182":
    1: "Провидец живёт в хижине на горе, недалеко от истока Серебряной реки, которая берёт начало в Стальных горах, протекает мимо замка Айронфист и впадает в океан. Говорят, что он помогает заблудившимся."
    2: "Провидец"
  "183":
    1: "Роклин, бывший король гномов, был свергнут гномом по имени Снергл. Снергл переименовал шахты и пещеры, которые ранее находились под управлением Роклина, — как и следовало ожидать, в «Шахту Снергла» и «Пещеры Снергла». Оба этих места находятся к западу от гор, расположенных недалеко от замка Айронфист, которые называются Стальными горами."
    2: "Гномы"
  "184":
    1: "В болотах Энрота обитают всевозможные зловещие чудовища, многие из которых — нежить. Если вам когда-нибудь придется отважиться туда, возьмите с собой огонь и двигайтесь осторожно!"
    2: "Болото"
  "185":
    1: "Дорога между замком Айронфист и Новым Сорпигалом стала весьма опасной. Обычно на путешественников нападает лишь одна банда разбойников, но в последнее время их не одна, не две, а целых ТРИ! Во-первых, это отвратительный Храм Баа, во-вторых — логово драгунов, расположенное где-то у южного берега, и, наконец, несанкционированная Гильдия воров, открывшая свои двери прямо у Замка!"
    2: "Драгуны"
  "186":
    1: "Ньют обучает ношению кожаных доспехов на уровне эксперта к югу от замка Айронфист."
    2: "Ньют Хедроу"
  "187":
    1: "Вы можете освоить навык экспертное владение кольчугой у Рича, который находится чуть южнее замка Айронфист."
    2: "Рич Гамбург"
  "188":
    1: "Чуть южнее замка Айронфист стоят четыре небольших дома. В самом северном Бенито обучает ношению лат на уровне эксперта."
    2: "Бенито Теллман"
  "189":
    1: "Эдгар обучает владению щитом на уровне эксперта тех, чей навык уже достаточно высок."
    2: "Эдгар Карпентер"
  "190":
    1: "Аарон обучает владению мечом на уровне эксперта возле оружейной лавки в замке Айронфист."
    2: "Аарон Стронгмун"
  "191":
    1: "Навык «Эксперт по топору» преподаёт Стефан на тренировочной площадке."
    2: "Стефан Биггс"
  "192":
    1: "Хелен живет со своей подругой Трейси прямо между «Королевской короной» и «Орлиным глазом»."
    2: "Хелен Тил"
  "193":
    1: "Тайлер преподаёт курс «Экспертное обезвреживание» прямо напротив тренировочной площадки в замке Айронфист."
    2: "Тайлер Тейлор"
  "194":
    1: "Леон преподает курс «Опознание предметов на уровне эксперта» прямо напротив тренировочной площадки в замке Айронфист."
    2: "Леон Лазару"
  "195":
    1: "Олаф живёт в небольшом доме за замком Айронфист и обучает бодибилдингу на уровне эксперта."
    2: "Олаф Берринг"
  "196":
    1: "Элтон ведёт занятия по экспертному обучению в одной из башен замка Айронфист."
    2: "Элтон Астрогейт"
  "197":
    1: "Уолтер преподаёт курс «Дипломатия для экспертов» в одной из башен замка Айронфист."
    2: "Уолтер Харгривз"
  "198":
    1: "За королевской короной скрывается Терранс Смит. Он научит опытных мастеров владения кинжалом нескольким новым трюкам."
    2: "Терранс Смит"
  "199":
    1: "Я слышал, что объявлено вознаграждение тем, кто сможет покончить с разбойниками из банды «Драгун», орудующими на дороге у южного берега. Какой-то купец предлагает ОГРОМНУЮ сумму за возвращение его украденного товара!"
    2: "Торговцы"
  "200":
    1: "К югу от Гавани контрабандиста сформировался небольшой монашеский орден, получивший название «Орден Кулака»."
    2: "Орден Кулака"
  "201":
    1: "На островах Гавани контрабандиста спрятана целая гора пиратских сокровищ. Конечно, если вам удастся пробраться мимо каннибалов и действительно найти их..."
    2: "Пиратское сокровище"
  "202":
    1: "Местонахождение «Фонтана волшебства» до сих пор остается загадкой. По какой-то причине те, кто его находит, никогда не раскрывают, где он находится."
    2: "Фонтан волшебства"
  "203":
    1: "Когда-то у Церкви Солнца был храм на острове в Гавани контрабандиста."
    2: "Храм"
  "204":
    1: "Эта могущественная корона Артура не только повышает все физические характеристики того, кто её носит, но и увеличивает количество его магических очков."
    2: "Артур"
  "205":
    1: "Я слышал, что для повышения в звании с крестоносца до героя нужно убить старого дракона. Неудивительно, что героев так мало!"
    2: "Герои"
  "206":
    1: "Храм Цанца находится на одном из крупных островов к югу от Серебряной бухты. Жители этого острова любят приносить пленников в жертву своему зверскому богу Цанца, а затем уменьшать их головы в бассейнах с отвратительными химикатами, которые они хранят в своём храме. Островитяне настроены весьма враждебно, поэтому, если вы планируете посетить остров, не забудьте попрощаться со своими близкими."
    2: "Храм Цанца"
  "207":
    1: "Хотя храм давно был заброшен Церковью Солнца, он по-прежнему возвышается на большом острове к востоку от Свободной гавани. Небольшой орден заблудших монахов, неправильно понимающих истинную сущность храма, каким-то образом примирился с островитянами и поселился в храме, принеся с собой похищенный священный артефакт. Теперь коварная магия старого храма повлияла на их разум, заставив их поверить, что они должны защищать храм до самой смерти. В последнее время монахи ведут себя очень враждебно и нападают на всех, кто вторгся на их территорию."
    2: "Храм Солнца"
  "208":
    1: "Престон обучает экспертному владению кольчугой чуть восточнее «Зуба гоблина»."
    2: "Престон Харпер"
  "209":
    1: "Шоши может научить вас новым приёмам восприятия в своём доме, расположенном к востоку от «Зуба гоблина»."
    2: "Шоши Пертоники"
  "210":
    1: "Уинстон раньше был членом того нового духовного ордена, что здесь, но он вышел из него. По-видимому, он что-то там оставил, потому что ищет кого-нибудь, кто бы за него сходил в Храм Кулака. Сейчас он живет в одной из прихожих Дома Исцеления."
    2: "Уинстон Шезар"
  "211":
    1: "Отколовшаяся группа друидов Седрика Друтерса проводит церемонии в пещере к западу от Серебряной бухты."
    2: "Небесный орден"
  "212":
    1: "Крепость Братства Серебра расположена недалеко от Серебряной бухты. В последнее время «Серебряные Шлемы» кажутся более агрессивными — интересно, почему?"
    2: "«Серебряные шлемы»"
  "213":
    1: "Крепость Военачальника находится к северо-западу от Серебряной бухты. В его армию принимают только самых сильных воинов."
    2: "Военачальник"
  "214":
    1: "Говорят, что у «Гильдии Теней» есть большая база прямо рядом с Каменным замком. Мне удивительно, что Энтони Стоун до сих пор не обнаружил её местонахождение."
    2: "Гильдия «Тень»"
  "215":
    1: "К замку Аламос курсирует не так много кораблей. Большинство капитанов боятся странных существ, бродящих по северным морям."
    2: "Замок Аламос"
  "216":
    1: "Гильдии Света можно найти в Серебряной бухте и Блэкшире, а Гильдии Тьмы — в Уайт-Кэп и Блэкшире."
    2: "Свет и тьма"
  "217":
    1: "Алмазные горгульи — самые выносливые горгульи из всех. Их невозможно убить физическими атаками, поэтому для их уничтожения следует использовать магию."
    2: "Алмазная горгулья"
  "218":
    1: "Когда друиды впадают в ярость, они могут произносить различные заклинания стихий и зачастую обладают некоторой защитой от магических атак."
    2: "Друиды"
  "219":
    1: "Эти легендарные ботинки позволяют тому, кто их носит, двигаться быстрее и реагировать оперативнее."
    2: "Люциус"
  "220":
    1: "Чтобы получить звание Верховного друида, Великий друид должен провести «Церемонию Луны» в Храме Луны, расположенном недалеко от Свободной гавани."
    2: "Архидруиды"
  "221":
    1: "Крепость Военачальника возвышается над истоком реки Калимар, которая, извиваясь, протекает мимо Серебряной бухты и впадает в Гавань контрабандиста. Первоначально построенная для защиты города, который планировалось основать в этой местности, крепость стала притягательным центром для наемников и преступников после того, как проект строительства города провалился, а все поселенцы переселились на юг в поисках лучшей жизни."
    2: "Крепость военачальника"
  "222":
    1: "«Монолит» возвышается над Серебряной дорогой, ведущей из Серебряной бухты в Свободную гавань. На протяжении веков он был предметом восхищения и, порой, поклонения. Давным-давно группа друидов высекла жилище в гигантской скале, и с тех пор в нём проживали различные общины. Друиды, живущие там сейчас, экспериментировали с какой-то новой магией, и, по-моему, что-то пошло не так. Уже некоторое время они избегают контактов с внешним миром и не допускают посетителей в Монолит."
    2: "«Монолит»"
  "223":
    1: "Серебряная бухта возникла несколько сотен лет назад как рыбацкая и торговая деревня. Со временем наша маленькая деревня превратилась в полноценный город. У нас есть достаточно места для расширения города, а окружающие земли плодородны и легко поддаются возделыванию. Правда, мы находимся немного в стороне от остальной части Королевства."
    2: "Серебряная бухта"
  "224":
    1: "Госпожа из Серебряной бухты часто производит впечатление, будто ей больше интересно приумножать своё состояние, чем эффективно управлять городом, но я не думаю, что всё так просто. Она часто тратит значительные средства на благоустройство города и обеспечение безопасности, так что, наверное, она не может быть такой уж плохой."
    2: "Лоретта Флейз"
  "225":
    1: "Банда «Серебряных Шлемов» захватила крепость, расположенную чуть севернее Серебряной бухты. Обвиняя леди Флейз в грехе алчности, «Серебряные Шлемы» начали нападать на её караваны, курсирующие между Серебряной бухтой и Свободной гаванью. Уверен, что она от этого не в восторге..."
    2: "Самоуправцы"
  "226":
    1: "Будьте осторожны при плавании в водах к северу и востоку от Серебряной бухты — там обитают гигантские людоедские морские змеи!"
    2: "Воды, заражённые угрями"
  "227":
    1: "Весеннее равноденствие наступает 20 марта, а осеннее — 23 сентября. Говорят, что эти даты являются важными магическими событиями."
    2: "Равноденствия"
  "228":
    1: "Острова Уайт-Рок, расположенные к северу от Серебряной бухты, уже давно покинуты цивилизованными людьми и теперь стали пристанищем для чудовищ и безумцев. Друиды время от времени рискуют жизнью и отправляются на эти острова в поисках легендарного Круга камней, чтобы провести Церемонию Солнца."
    2: "Каменный круг"
  "229":
    1: "«Серебряные Шлемы» нападают на всех, кого считают не на 100 % преданными их борьбе со злом. Не знаю, как вы, но я думаю, что такая крайняя позиция не может быть чем-то хорошим… О чем только думает сэр Джон Сильвер?"
    2: "Сэр Джон Сильвер"
  "230":
    1: "Друиды «Монолита» заключили договор с Миром Теней… Я знаю об этом, потому что однажды ночью встретил друида, сбежавшего оттуда. Он говорит, что внутри «Монолита» творятся невыразимые вещи, и если в ближайшее время не принять меры, внешний мир может вскоре узнать о тайнах этого древнего места больше, чем ему когда-либо хотелось бы."
    2: "Связи с потусторонним миром"
  "231":
    1: "Тина живёт со своей дочерью чуть восточнее здания мэрии. Она обучает опытных подмастерьев основам светотехники."
    2: "Тина Шелтан"
  "232":
    1: "Сайрус Монтеблю обучает ремонту предметов на уровне эксперта к западу от Гильдии наёмников."
    2: "Сайрус Монтеблю"
  "233":
    1: "Клайд обучает экспертной медитации прямо напротив Гильдии Самости."
    2: "Клайд Даггет"
  "234":
    1: "Сигрив обучает владению копьём на уровне эксперта к югу от тренировочной площадки."
    2: "Сигрив"
  "235":
    1: "Я слышал, что Элеонора хочет изгнать злых друидов из Монолита, расположенного к западу, и готова выплатить вознаграждение тем, кто это сделает. Если хотите узнать больше, она находится в восточной части города."
    2: "Элеонора Вандербильт"
  "236":
    1: "Родина некромантов; в замок Даркмур больше никто не отправляется, разве что в поисках нежити. Не могу себе представить, что деревня Даркмур просуществует ещё долго без торговли с остальной частью Энрота."
    2: "Даркмур"
  "237":
    1: "Горы на западе не дают всем ужасным существам Драконьего Песка разгуляться по остальной части Энрота."
    2: "Драконий песок"
  "238":
    1: "Снергл — не лучший вождь, но ни один из гномов не осмеливается ему противостоять."
    2: "Снергл"
  "239":
    1: "Терракс так и не покинул Даркмур после того, как стал личем. Вполне возможно, что он до сих пор находится там и занимается разработкой новых магических заклинаний."
    2: "Терракс"
  "240":
    1: "Призраки, бродящие по «Болоту проклятых», могут одним прикосновением сделать вас гораздо старше ваших лет."
    2: "Призрак"
  "241":
    1: "Гарпии накладывают проклятия на своих несчастных жертв. К счастью, их довольно легко убить."
    2: "Гарпия"
  "242":
    1: "Несмотря на то что скелеты — самые слабые нежить-монстры, некоторые из них могут наложить на вас проклятие или наполнить ваши сердца нечеловеческим страхом."
    2: "Скелет"
  "243":
    1: "Кольцо «Игрейн», полезное как для жреца, так и для паладина, усиливает действие их заклинаний."
    2: "Игрейна"
  "244":
    1: "Осрик требует пройти испытание на мастерство для получения звания чемпиона. Лишь немногим удаётся пройти это испытание."
    2: "Чемпионы"
  "245":
    1: "Конни обучает владению топором на уровне эксперта возле деревни Даркмур."
    2: "Конни Леттеринг"
  "246":
    1: "Кейси обучает торговле на уровне эксперта на верхнем этаже дома в южной части деревни Даркмур."
    2: "Кейси Людвиг"
  "247":
    1: "Джек обучает владению булавой на уровне эксперта напротив таверны «Дым и зеркала»."
    2: "Джек Кроу"
  "248":
    1: "Авинрил был влиятельным гномом, пока новый король Снергл не изгнал его. Теперь он жаждет мести и нуждается в помощи. Я знаю, что ты сможешь найти его в «Пристанище», которое находится рядом с одной из гномских шахт."
    2: "Авинрил Смайтерс"
  "249":
    1: "У Церкви Луны к западу находился храм. Сейчас друиды Седрика Друтерса используют этот храм для проведения своих обрядов."
    2: "Старый храм"
  "250":
    1: "В канализационных туннелях под Свободной гаванью кишат воры и вредители. Не могу себе представить, чтобы кто-то ХОТЕЛ жить в канализации."
    2: "Канализация"
  "251":
    1: "Я слышал, что посреди озера Темпер плавает какой-то странный корабль."
    2: "Корабль"
  "252":
    1: "Друиды Седрика Друтерса теперь занимают старый храм Церкви Луны к западу от Свободной гавани."
    2: "Небесный орден"
  "253":
    1: "С тех пор как начались эти бедствия, Высший Совет ни разу не посещал Оракула. Сейчас мудрость Оракула, безусловно, пригодилась бы."
    2: "Оракул"
  "254":
    1: "Перевал, ведущий к Уайт-Кэп и Замку Стромгард, теперь патрулируют отступники-огры и алчные люди."
    2: "Перевал Ледяного Ветра"
  "255":
    1: "Неудивительно, что лучники будут стрелять в вас стрелами. Однако некоторые лучники предпочитают использовать зажигательные стрелы, а самые опытные из них могут даже накладывать заклинание «Огненный шар»."
    2: "Лучник"
  "256":
    1: "Этот амулет — лучший помощник волшебника или лучника — усиливает действие магии стихий."
    2: "Морган"
  "257":
    1: "Осрик Темпер курирует все церемонии посвящения в рыцари в Энроте."
    2: "«Кавальерс»"
  "258":
    1: "Высший совет собирается в Свободной гавани, чтобы представлять интересы лордов Энрота и решать важные дела королевства. Учитывая, что на западе назревают проблемы, можно было бы подумать, что они будут собираться чаще, но они по-прежнему ограничивают время заседаний, словно ничего и не происходит!"
    2: "Высший совет"
  "259":
    1: "Из всех лордов Энрота Осрик Темпер больше всех озабочен проблемой борьбы с демонами, нападающими на западные города и деревни. Лично я считаю, что он — единственный лорд, у которого в наши дни голова на плечах!"
    2: "Осрик Темпер"
  "260":
    1: "Я слышал, что в городе есть Гильдия воров, у которой есть потайной люк, ведущий в канализацию Свободной гавани. Наверное, они используют его, чтобы развозить по городу всю свою добычу."
    2: "Вход в канализацию"
  "261":
    1: "Цирк «Солнце» обычно разбивает лагерь в нескольких днях пути к югу от замка Темпер, на западном берегу реки Кресент. Они остаются там каждый год в августе."
    2: "Цирк Солнца"
  "262":
    1: "Несмотря на свои скромные размеры, деревня Рокхэм служит торговым пунктом и местом отдыха для путешественников, путешествующих по Королевству. «Хотя все дороги и ведут в Свободную гавань, почти каждому путешественнику приходится проезжать через Рокхэм, чтобы туда добраться»."
    2: "Деревня Рокхэм"
  "263":
    1: "Когда некромант Этрик умер, он оставил распоряжение о том, чтобы его тело было помещено в гробницу, которую он построил у подножия гор к югу от реки Перлблум. Говорят, что через несколько дней он воскрес из мёртвых в результате своего рода адского чуда. С тех пор гробница превратилась в духовную бездну, куда после смерти стекаются всевозможные заблудшие души. Там они томятся, бездумно нападая на живых в защиту своего нового повелителя — Этрика Безумного."
    2: "Гробница Этрика"
  "264":
    1: "Неприятная банда наемников обосновалась в укреплении, построенном Роландом во время Войны за престол, недалеко от озера Кресент. Насколько я знаю, наемники пока ничего плохого не натворили, но их присутствие вызывает тревогу, не так ли?"
    2: "Крепость наемников"
  "265":
    1: "Свободная гавань — самый старый и процветающий город в Королевстве. Благодаря естественной гавани и Оракулу люди естественным образом стали собираться здесь после наступления «Тишины»."
    2: "Свободная гавань"
  "266":
    1: "В последнее время озеро Глиммервейл стало местом многочисленных наблюдений сверхъестественных явлений. Говорят, что эти явления вызваны вмешательством Гильдии некромантов, распущенной уже десять лет назад. Кто знает, какой ущерб они нанесли, прежде чем король Роланд положил конец их злодеяниям?"
    2: "Озеро Глиммервейл"
  "267":
    1: "Храм «Темпл-Стоун» в Свободной гавани недавно был полностью сожжен группой монахов, пытавшихся похитить священный потир из храма. Они сбежали на лодке на восток, и с тех пор их никто не видел."
    2: "Храмовый камень"
  "268":
    1: "Не знаю, заметили ли вы, но эти жуткие последователи Баа то и дело появляются и исчезают из зданий по всему городу самым странным образом. Возможно, они устроили один из своих храмов в городской канализации."
    2: "Баа в канализации"
  "269":
    1: "Возможно, в представлении о том, что зло находится внизу, а добро — наверху, действительно есть доля правды. И последователи Баа, и члены Гильдии Теней обитают в городских канализационных трубах. Хотелось бы, чтобы однажды произошло сильное наводнение, которое смыло бы весь этот мусор в море!"
    2: "Принц воров"
  "270":
    1: "Остерегайтесь разбойников на дороге в Блэкшир! С тех пор как король уехал неизвестно куда, преступники разгуливают по дорогам, соединяющим все крупные города."
    2: "Бандиты"
  "271":
    1: "Личи — единственная разновидность живых мертвецов, которая сама по собственной воле выбирает такую судьбу. Лич — это гниющий скелет могущественного священника или чародея, удерживаемый в целости благодаря некромантическим обрядам, совершённым ещё при его жизни. Это относительно новое чудовище; говорят, что Этрик Безумный был первым чародеем, открывшим и совершившим «Ритуал Бесконечной Ночи», став тем самым первым в мире личем и некромантом. <Дрожь> Жутко, да?"
    2: "Личи"
  "272":
    1: "Наемники, живущие в той крепости недалеко от замка Темпер, судя по всему, обладают значительными средствами, поскольку постоянно заказывают оружие и припасы. Кто-то, должно быть, по какой-то причине платит им, но кто именно?"
    2: "Крепость наемников"
  "273":
    1: "Я слышал, что бывший король гномов прячется в какой-то местной таверне и топит свои печали после того, как его сверг Снергл. Какая печальная судьба для самого верного союзника Роланда во время войны! Готов поспорить, что если бы король Роланд был рядом, он бы ему помог."
    2: "Роклин"
  "274":
    1: "Тимоти обучает магии Тела на уровне эксперта к юго-западу от четырёх гильдий стихий."
    2: "Тимоти О’Хулихан"
  "275":
    1: "Майкл обучает владению мечом на уровне эксперта к северо-востоку от Гильдии Тела."
    2: "Майкл Огилви"
  "276":
    1: "Сильвестр может показать вам новые дипломатические приёмы к югу от Городской площади."
    2: "Сильвестр Мур"
  "277":
    1: "Ливия обучает перспективных торговцев до уровня эксперта к югу от Городской площади."
    2: "Ливия Фаррелл"
  "278":
    1: "Такао обучает навыку «Экспертный щит» чуть западнее точильного камня."
    2: "Такао"
  "279":
    1: "Миназия обучает магии Разума на уровне эксперта к юго-западу от четырёх гильдий стихий."
    2: "Миназия"
  "280":
    1: "Мишель обучает магии Духа на уровне эксперта к юго-западу от четырёх гильдий стихий."
    2: "Мишель Блэкшир"
  "281":
    1: "Иван обучает обезвреживанию ловушек на уровне эксперта возле Гильдии контрабандистов."
    2: "Иван Мадьяр"
  "282":
    1: "Логан обучает владению кинжалом на уровне эксперта к северо-востоку от Гильдии Тела."
    2: "Логан Дашер"
  "283":
    1: "Джек обучает магии Огня на уровне эксперта чуть южнее Храмового камня."
    2: "Джек Ван Имп"
  "284":
    1: "Вудроу живёт к юго-западу от Гильдии Разума и обучает ношению лат на уровне эксперта."
    2: "Вудро Олбрайт"
  "285":
    1: "Хитоми обучает магии Воды на уровне эксперта чуть южнее Храмового камня."
    2: "Хитоми Мирумото"
  "286":
    1: "Ли обучает магии Земли на уровне эксперта чуть южнее Храмового камня."
    2: "Ли Тизаре"
  "287":
    1: "Зодан обучает магии Воздуха на уровне эксперта чуть южнее Храмового камня."
    2: "Зодан Дельфи"
  "288":
    1: "Золтан недавно жаловался, что новый артефакт из его коллекции был похищен драгунами к югу отсюда. Он объявил вознаграждение за его возвращение. За более подробной информацией обратитесь к нему домой, который находится чуть южнее Городской площади."
    2: "Золтан Фелпс"
  "289":
    1: "Габриэль сказал, что работает над способом нейтрализовать какой-то странный ритуал, связанный с нежитью. Я не особо разбираюсь в ритуалах, но знаю, что Габриэль живёт чуть южнее Темпл-Стоуна — если хочешь, можешь спросить у него об этом."
    2: "Габриэль Картман"
  "290":
    1: "Хороший друг Карло, Шерелл, заблудился в Гавани контрабандиста; он ищет людей, которые могли бы ему помочь, возле причалов."
    2: "Карло Тормини"
  "291":
    1: "Ходят слухи, что главная резиденция Гильдии Теней находится совсем рядом с Каменным замком."
    2: "Гильдия «Тень»"
  "292":
    1: "Сейчас путешествовать через перевал в Замерзшие Высокогорья небезопасно из-за огров и людей, захвативших крепость Айсвинд."
    2: "Перевал Ледяного Ветра"
  "293":
    1: "Мадьяры — прямолинейные бойцы, но мадьярские матроны способны наносить смертоносные электрические удары."
    2: "Мадьяр"
  "294":
    1: "Эта, казалось бы, простая булава при использовании вспыхивает пламенем, нанося жертве сокрушительный огненный удар и одновременно защищая своего владельца от огня."
    2: "Арес"
  "295":
    1: "Энтони Стоун, помимо прочего, повышает достойных клириков до звания священников."
    2: "Священники"
  "296":
    1: "Эрик фон Стромгард — лучший лучник во всех землях, и именно поэтому ему поручено заниматься подготовкой и продвижением лучников."
    2: "Воины-маги"
  "297":
    1: "Лорд Стромгард — без сомнения, лучший лучник в стране. Он всегда участвует в крупнейших соревнованиях, и я ни разу не видел, чтобы он проиграл."
    2: "Эрик фон Стромгард"
  "298":
    1: "Лорд Стоун выполняет двойную роль: он является Верховным жрецом Королевства и надзирателем за деятельностью подземного мира. Полагаю, это весьма странное сочетание, но, судя по всему, ему действительно удаётся поддерживать мир. Да проживёт он долго!"
    2: "Энтони Стоун"
  "299":
    1: "Крепость Айсвинд когда-то была первым замком лорда Стромгарда, но около года назад он лишился его в результате нападения огров и злобных людей. Он переехал в свой второй замок к востоку от Уайт-Кэпа, но, как говорят, он до сих пор с горечью переживает эту утрату и в последнее время думает только о мести."
    2: "Крепость Айсвинд"
  "300":
    1: "«Гильдия Теней» — это новая гильдия воров, созданная с целью бросить вызов власти лорда Стоуна в преступном мире. У них есть два укрытия: одно — недалеко от замка Айронфист, а другое — в двух шагах от замка Стоуна. Мне кажется, они просто ищут повода для драки!"
    2: "Гильдия «Тень»"
  "301":
    1: "Уайт-Кэп — третий по величине город в Энроте, и он переживает тяжёлые времена с тех пор, как в прошлом году лорд Стромгард уступил крепость Айсвинд ограм. Огры продолжают нападать на караваны, пытающиеся пройти через перевал. Если караваны когда-нибудь перестанут ходить, это станет концом для города."
    2: "Уайт-Кэп"
  "302":
    1: "По-моему, с прошлого лета прошло уже очень много времени. Слишком много. С погодой что-то не так, и я начинаю думать, что боги наказывают нас за то, что мы поддерживаем династию Айронфистов!"
    2: "Долгая зима"
  "303":
    1: "Если верить слухам, «Гильдия Теней» и «Храм Баа» действуют в сговоре, чтобы разрушить Королевство. Я слышал, что Храм с помощью магии продлевает зиму в этих краях, а необходимые для ритуалов материалы ему поставляет «Гильдия Теней»."
    2: "Гильдия «Тень»"
  "304":
    1: "Если вам когда-нибудь доводилось видеть, как волшебник пытается взлететь рядом с городом, вы, возможно, стали свидетелем того, как «Башни драконов» сбили его. «Башни драконов» стреляют по всему, что летит рядом с городом, поскольку им трудно отличить человека от дракона. Будьте осторожны!"
    2: "Драконьи башни"
  "305":
    1: "Это, конечно, очень плохо, что те людоеды захватили крепость Айсвинд! Среди их союзников-людей есть лучники, и они любят стрелять в людей, проходящих через перевал. Поверьте, из-за них дела в «Уайт-Кэп» пошли совсем плохо."
    2: "Крепость Айсвинд"
  "306":
    1: "В королевстве есть несколько важных перевалов, и всё чаще они оказываются под контролем чудовищ, а не королевских воинов. Если дела будут и дальше идти так же, как сейчас, нам придётся платить налоги не королю, а чертям!"
    2: "Перевалы"
  "307":
    1: "Один из мастеров воздуха, с которым я беседовал некоторое время назад, утверждает, что кто-то манипулирует погодой с помощью ритуальной магии. Он говорит, что сумел проследить истоки этой магии до одного из тех храмов Баа, которые в последнее время появляются повсюду."
    2: "Зима от Баа"
  "308":
    1: "В окрестных горах то тут, то там обитают весьма странные отшельники. Большинство из них сумасшедшие, но некоторые отправляются туда, чтобы размышлять об истинах, которые не предназначены для знания смертным человеку."
    2: "Отшельники"
  "309":
    1: "Если внимательно присмотреться к горам этого Королевства, то можно наткнуться на перевал, который сократит ваше путешествие на несколько дней."
    2: "Тайный перевал"
  "310":
    1: "И лорд Стромгард, и лорд Стоун были ключевыми сторонниками короля Роланда во время Войн за престол. Своим нынешним положением они обязаны именно этой поддержке, и я считаю, что они входят в число самых добросовестных лордов королевства."
    2: "Война за престол"
  "311":
    1: "Диксон обучает владению булавой на уровне эксперта к западу от замка Стромгард."
    2: "Диксон Паркс"
  "312":
    1: "Джед обучает стрельбе из лука на уровне эксперта к западу от замка Стромгард."
    2: "Джед Моррисон"
  "313":
    1: "Мортон обучает магии Тьмы на уровне эксперта на юго-западе Уайт-Кэп."
    2: "Мортон Холовин"
  "314":
    1: "Я слышал, что у Абдула есть свой курорт на юге Драконьего Песка. Вот это да! Наверное, там полно драконов."
    2: "Курортный остров Абдула"
  "315":
    1: "Посреди Драконьего Песка стоит странная пирамида. Однако никто не знает, кто её построил."
    2: "Пирамида"
  "316":
    1: "Вермы очень быстро передвигаются по земле, но не умеют летать. Они нападают, выдыхая ядовитое дыхание."
    2: "Змей"
  "317":
    1: "Огненные ящерицы — лишь одно из множества драконьих существ, обитающих в Драконьем Песке."
    2: "Огненная ящерица"
  "318":
    1: "Те, кто владеет топором «Кронос», получают невероятный приток жизненной силы. Им понадобится вся возможная помощь, ведь за этим топором постоянно следуют беды и несчастья."
    2: "Кронос"
  "319":
    1: "Пещера недалеко от Блэкшира открылась примерно в то же время, когда в городе начали исчезать люди."
    2: "Логово волка"
  "320":
    1: "Жители Блэкшира оказались под действием ужасного проклятия — по ночам они превращаются в оборотней!"
    2: "Блэкшир"
  "321":
    1: "В центре Острова Звёзд стоит старинный храм. Как ни странно, с течением времени количество статуй на острове постепенно увеличивалось."
    2: "Звёздный остров"
  "322":
    1: "Оборотни — это просто люди, которые по ночам превращаются в существа, наполовину человека, наполовину зверя. Они особенно сильны в полнолуние."
    2: "Оборотень"
  "323":
    1: "В долине между Замерзшими Высокогорьями и Драконьим Песком порхают элементали воздуха. Хотя они и являются самыми слабыми из элементалей, они быстры и обладают опасной электрической атакой."
    2: "Элементаль воздуха"
  "324":
    1: "Меч могучего воина Геракла значительно повышает силу и выносливость, но за счет интеллекта владельца."
    2: "Геркулес"
  "325":
    1: "Уже целую вечность никто не получал повышения до звания первосвященника. Интересно, какие требования Энтони Стоун предъявляет к священникам для такого повышения?"
    2: "Первосвященники"
  "326":
    1: "На острове посреди Озера Звёзд обитают какие-то чудовища, пришедшие прямо из самого сердца ада! Я слышал, как однажды ночью кто-то отплыл туда на лодке с друзьями, и из-под земли вырвались огромные змееподобные существа. Им достаточно было только посмотреть тебе в глаза, чтобы превратить тебя в камень! В общем, этот парень, по его словам, был единственным, кто вернулся живым, и ему это удалось, потому что он бежал, не оглядываясь!"
    2: "Медузы"
  "327":
    1: "На жителей этих мест обрушилось страшное проклятие, и все уверены, что знают его источник — это та новая пещера, которая появилась в склоне горы к югу от города. Кто-то должен проникнуть туда и положить конец проклятию, но в эти дни в Блэкшире храбрость — большая редкость."
    2: "Логово волка"
  "328":
    1: "Драконий Песок — это родина и место размножения драконов Энрота. Вы никогда не встретите чудовища более свирепого и ужасного, чем дракон, и никогда не встретите дракона, который был бы кротким или добрым."
    2: "Драконы"
  "329":
    1: "Цирк «Солнце» любит разбивать палатки у дороги между Блэкширом и Стар-Лейком. Они бывают здесь каждый год в апреле. Это отличное представление — пойти на него определенно стоит своих денег!"
    2: "Цирк Солнца"
  "330":
    1: "Дорога, ведущая на запад от Блэкшира, превратилась из самой безопасной дороги в Королевстве в самую опасную. К западу отсюда раскинулась долина Плезант-Вэлли, и это название уже давно стало предметом насмешек. Сейчас эта долина — бесплодная и опустошённая земля, кишащая этими отвратительными новыми чудовищами — дьяволами."
    2: "Западный торговый путь"
  "331":
    1: "Просто иди на запад по дороге из Блэкшира несколько дней — и ты обязательно увидишь нескольких дьяволов. Правда, тебе лучше уметь бегать довольно быстро!"
    2: "Дьяволы"
  "332":
    1: "Лорд Килберн исчез во время патрулирования дороги, ведущей из Блэкшира в Плезант-Вэлли. По крайней мере, так говорят люди. Если вы его ищете, то, возможно, стоит начать поиски именно там."
    2: "Рейнджеры"
  "333":
    1: "Некоторое время назад мы все видели, как король бежал от демонов в сторону замка Кригспайр. С тех пор о нём ничего не слышно. Печально. Думаю, демоны скоро всех нас захватят."
    2: "Роланд"
  "334":
    1: "Эмброуз обучает магии Тьмы на уровне эксперта в Блэкшире."
    2: "Амброуз Брусс"
  "335":
    1: "Замок Кригспайр когда-то был центром магических экспериментов по созданию существ. Сейчас он заброшен, и внутри бесчинствуют эти существа. Вулкан, в котором он расположен, был создан для того, чтобы удерживать всех монстров внутри."
    2: "Кригспайр"
  "336":
    1: "Агар, один из колдунов Арчибальда, был самым опытным из экспериментаторов в Кригспайре. Именно его чудовища сейчас ползают по замку. Он ушел вместе с остальными магами, но никто не знает, куда он направился."
    2: "Агар"
  "337":
    1: "Хотя драконы и слабее драконов, с ними не стоит пренебрегать. Эти летающие рептилии обладают мощными элементальными атаками."
    2: "Пламенный дракон"
  "338":
    1: "Некоторые минотавры сбежали из Кригспайра и теперь бродят по территории вулкана, окружающего старый замок, и в его окрестностях."
    2: "Минотавр"
  "339":
    1: "Элементали земли бродят по окрестностям Кригспайра. Освободившись от магов, которые их призывали, эти элементали стремятся уничтожить всё, что попадается им на пути."
    2: "Элементаль Земли"
  "340":
    1: "Ни одна броня в мире не может сравниться с «Аполлоном» по защите от заклинаний стихий. К сожалению, эта броня черпает свою силу за счёт истощения выносливости того, кто её носит."
    2: "Аполлон"
  "341":
    1: "Верховный храм Баа был построен около года назад у подножия гор к востоку от замка Кригспайр. В отличие от большинства их храмов, он закрыт для посетителей. Если вы когда-нибудь захотите попасть внутрь, вам придётся вступить в их ряды."
    2: "Высший храм"
  "342":
    1: "Деревня Эденбрук не существовала бы сегодня, если бы не король Роланд и его воины. Некоторое время назад они спасли её от орды демонов."
    2: "Битва при Эденбруке"
  "343":
    1: "Когда король бежал в замок Кригспайр, за ним последовала огромная армия демонов. Через пару дней несколько десятков демонов были замечены выходящими из старого вулкана, на котором расположен замок, но самого короля с тех пор никто не видел."
    2: "Битва у Кригспайра"
  "344":
    1: "Люди и драконы редко ладят друг с другом, но рыцари смерти заключили некий договор с группой драконов, обитающих в крепости на северном склоне гор недалеко от Кригспайра."
    2: "Рыцари Смерти"
  "345":
    1: "Николас обучает магии Света на уровне эксперта в деревне Кригспайр."
    2: "Николас Рот"
  "346":
    1: "Титаны уступают по мощи лишь могучим драконам. Титаны не только обладают невероятной электрической атакой, но и искусно владеют магией разума, предпочитая заклинание «Психический шок»."
    2: "Титан"
  "347":
    1: "Похоже, элементали огня любят Остров Отшельника, хотя остается загадкой, кто их туда призывает."
    2: "Элементаль огня"
  "348":
    1: "Хотя эта корона сокращает время реакции того, кто её носит, она также делает его невероятно устойчивым к магии стихий."
    2: "Один"
  "349":
    1: "Остров Отшельника недавно стал местом расположения Верховного храма Баа. Они нашли древнее сооружение, в котором разместили свой храм, и, без сомнения, прямо сейчас проводят там зловещие эксперименты."
    2: "Остров Отшельника"
  "350":
    1: "Драконий Песок — великая пустыня Энрота — является пристанищем для всех самых страшных чудовищ в мире. Драконы, титаны и другие гигантские кровожадные чудовища свободно бродят по пескам, занимаясь тем, что считают важным. Люди, достаточно безрассудные, чтобы путешествовать по пустыне, очень быстро учатся бежать и прятаться — иначе им не прожить и дня."
    2: "Драконий песок"
  "351":
    1: "Когда-то «Приятная долина» была самой зелёной и плодородной землёй в Энроте, но на неё обрушилось проклятие, из-за которого растения завяли, животные заболели, а люди ушли. Теперь это бесплодная земля, и никто не хочет там жить."
    2: "Прекрасная долина"
  "352":
    1: "Вскоре после «Ночи падающих звёзд» на Плезант-Вэлли обрушилась эпидемия. За несколько коротких лет почти все растения и животные заболели и погибли, и жители деревни и фермеры, проживавшие в долине, были вынуждены переселиться на восток в поисках пропитания. Эпидемия не дает признаков ослабления — напротив, она набирает обороты и однажды охватит весь континент, если не будут приняты меры для её сдерживания."
    2: "Гниль"
  "353":
    1: "Большинство демонов, которых вы видите в Плезант-Вэлли, на самом деле являются демонами-рабочими или демонами-солдатами. Они организованы, как муравьи, только у них есть разумные вожди. Вожди умеют летать, а самые способные из них владеют человеческой речью и письменностью."
    2: "Дьяволы"
  "354":
    1: "Хотя демоны и обладают огромной силой, они далеко не непобедимы. Король Роланд сражался и одержал победу в битве у перевала Свит-Уотер, переиграв их в тактике и перехитрив их. Они крепкие, но гибнут, как и все остальное, когда в них вонзается меч!"
    2: "Перевал Свит-Уотер"
  "355":
    1: "Эти легендарные ботинки позволяют тому, кто их носит, двигаться с молниеносной скоростью и мгновенно реагировать на любую ситуацию."
    2: "Гермес"
  "356":
    1: "Похоже, демоны роятся вокруг странного здания рядом с руинами Свит-Уотер."
    2: "Улей"
  "357":
    1: "Хотя руины зданий до сих пор стоят на месте, город полностью разрушен. Там больше никто не живет."
    2: "Свит-Уотер"
  "358":
    1: "Лес Блэквуд был полностью уничтожен после той ночи, когда пролетели падающие звезды."
    2: "Блэквуд"
  "359":
    1: "Похоже, демоны предпочитают атаки огнём и любят нападать большими группами. Некоторые из самых могущественных из них могут произносить заклинания школы огня."
    2: "Дьяволы"
  "360":
    1: "Этот необычный амулет дарит своему владельцу дополнительную жизненную силу, очки заклинаний и удачу."
    2: "Гера"
  "361":
    1: "Свит-Уотер когда-то был самым красивым городом в королевстве, но с «Ночи падающих звезд» оттуда не поступало никаких известий. Думаю, падающая звезда упала прямо на город, и выживших, которые могли бы рассказать об этом, не осталось."
    2: "Свит-Уотер"
  "362":
    1: "Оракул ещё давным-давно предупреждал в своих писаниях о приходе демонов с небес. Думаю, об этом уже никто не помнит, а из тех, кто помнит, никто не связывает «Ночь падающих звёзд» с демонами."
    2: "Ночь падающих звезд"
  "363":
    1: "Я встретил человека, который отправился выяснить, что стало с городком Свит-Уотер, и он рассказал, что это место было дотла сожжено демонами. Рядом со старым городом демоны построили странную башню, из которой каждые двадцать минут доносятся жуткие звуки. Он хотел бы исследовать окрестности дальше, но возле башни было так много демонов, что он не осмелился."
    2: "Логово дьяволов"
  "364":
    1: "Вы заметили, как по всему королевству как грибы после дождя растут храмы Баа? Они повсюду, и я, например, считаю это тревожным явлением. Хотя они и предлагают бесплатное лечение, похоже, что делают это не из доброты — в их поведении наверняка есть какой-то скрытый смысл!"
    2: "Агенты Баа"
  "365":
    1: "Королева уже довольно давно отправилась в свою родную страну — Эратию. Люди начинают беспокоиться… А вдруг с ней что-то случилось во время путешествия?"
    2: "Королева Екатерина"
  "366":
    1: "Большая часть морских перевозок в Энроте осуществляется по установленному расписанию. Если вы окажетесь в нужном месте в нужное время, судоходные компании смогут быстро и недорого доставить вас на большие расстояния."
    2: "Путешествие по морю"
  "367":
    1: "Согласно легендам, великий корабль, на котором совершилось «Пересечение», покоится под гигантской каменной гробницей посреди Драконьего Песка. Должно быть, давным-давно на месте нынешней пустыни было озеро или океан, раз корабль оказался посреди пустыни!"
    2: "Гробница ВАРН"
  "368":
    1: "Если вы прикоснетесь к одному из обелисков, разбросанных по всему королевству, вы получите часть загадки, которую пока никто не разгадал. Говорят, что где-то в Энроте зарыто великое сокровище, и тот, кто найдёт ответ на загадку, найдёт и сокровище."
    2: "Обелиски"
  "369":
    1: "Остерегайтесь Башен Дракона, которые стоят рядом с каждым крупным населённым пунктом. Они будут стрелять огненными шарами в любого, кто летит. Полагаю, они призваны защищать города от драконов и других летающих чудовищ, но не могут отличить человека от чудовища."
    2: "Драконьи башни"
  "370":
    1: "Некоторые говорят, что Храм Баа и демоны действуют в сговоре! Это вполне логично — храм впервые появился через несколько месяцев после «Ночи падающих звёзд», а мы все знаем, что демоны и та ночь связаны между собой!"
    2: "Дьяволы и Баа"
  "371":
    1: "Ходят слухи, что Сликкер Сильвертонг, представитель Уилбура Хамфри в Высшем совете, — предатель. Говорят, его видели в нескольких храмах Баа, а всем известно, что храм выступает против короля!"
    2: "Предатель в Совете"
  "372":
    1: "Погода действительно испортилась с тех пор, как прошла «Ночь падающих звёзд». Каждое лето кажется холоднее предыдущего. Я бы даже сказал, что прошлым летом была самая холодная зима, которую я когда-либо переживал! Конечно, это преувеличение, но вы понимаете, о чём я. Что-то здесь не так!"
    2: "Погода"
  "373":
    1: "Не кажется ли вам, что с тех пор, как король исчез, стало больше наводнений и землетрясений? Словно боги разгневались на короля и его династию. Возможно, они утратили «Мандат Неба»."
    2: "Стихийные бедствия"
  "374":
    1: "Хотя Храм Баа и предлагает бесплатное исцеление, мне кажется, что когда один из их храмов находится поблизости, происходит больше неприятностей и больше людей получают травмы. Может быть, они накладывают проклятие на людей, находящихся рядом, а потом, по какой-то странной причине, исцеляют их?"
    2: "Проклятия"
  "375":
    1: "Вы когда-нибудь видели статую Арчибальда в библиотеке за замком Айронфист? Она поразительно реалистична — словно его не высекли, а просто превратили в камень."
    2: "Арчибальд"
  "376":
    1: "Западная провинция Плезант-Вэлли за последние несколько лет претерпела шокирующие изменения. Когда-то это был богатый и плодородный сельскохозяйственный регион. Теперь же все растения погибли от страшной болезни, а вода иссякла. Все животные заболели или погибли, и всем жителям пришлось уехать в поисках пропитания."
    2: "Гниль"
  "377":
    1: "Древние легенды гласят, что все величайшие артефакты, созданные до наступления Тишины, прибыли на корабле, на котором наши далекие предки приплыли сюда из своей родины. Говорят, что путешествие было настолько долгим, что три поколения людей родились, прожили свою жизнь и умерли прямо на борту корабля! Ну разве это не невероятная история?!"
    2: "Легенда о переправе"
  "378":
    1: "Эратия — второй по величине континент, заселённый людьми в этом мире. Он гораздо более дикий и опасный, чем Энрот, а все мелкие королевства, расположенные там, постоянно ссорятся и воюют друг с другом."
    2: "Эратия"
  "379":
    1: "Все острова к востоку от Энрота входят в состав «Королевства» Регна. Сотни лет назад их заселили самые подлые и жестокие люди, и с тех пор они ничуть не изменились. Все до единого — пираты и наемники, и им наплевать на страдания, которые они причиняют, вставая на сторону мелких тиранов и узурпаторов, каким был Арчибальд."
    2: "Регна"
  "380":
    1: "Если верить старинным преданиям, гномы когда-то были такими же, как и все мы, но до Перехода они жили в месте, где и они сами, и всё вокруг них весили гораздо больше. По преданиям, именно это сделало их очень низкорослыми и очень сильными, и с тех пор они не изменились."
    2: "Гномы"
  "382":
    1: "Лучший магазин доспехов во всем Энроте — «Зачарованный кольчужный нагрудник». Владельца зовут Тедди, но он терпеть не может, когда его так называют. Безопаснее обращаться к нему как к Теодору."
    2: "Зачарованный кольчуга"
  "383":
    1: "Лучший магазин магических товаров в королевстве — «Могучая магия». Там продаются самые необычные и могущественные зачарованные предметы."
    2: "Магазины магии"
  "384":
    1: "Будьте осторожны даже с самыми обычными предметами. Если вещь обладает магическими свойствами, обратитесь к такому эксперту, как я, чтобы определить её, прежде чем продать за гроши, которые составляют лишь малую толику её истинной ценности. Вы можете удивиться тому, что можно найти, и, возможно, продадите что-то очень полезное."
    2: "Сокровища"
  "385":
    1: "Земли на крайнем западе континента когда-то были зелеными и плодородными, но со временем превратились в мрачную местность с растрескавшейся землёй, неприятными запахами и бесплодными пейзажами."
    2: "Западные пустоши"
  "386":
    1: "Большинство цивилизованных районов расположено на востоке. Хотя на западе и есть несколько небольших городов и деревень, не стоит рассчитывать, что их будет много."
    2: "Восточное побережье"
  "387":
    1: "Это жуткое место получило своё название из-за множества нежити, бродящей по нему. Ходят слухи, что люди, погибшие в болоте, возвращаются в виде неживых стражей этого места."
    2: "Болото проклятых"
  "388":
    1: "Есть места, куда в разное время года добраться на лодке невозможно. Чтобы избежать неудобств, следует тщательно планировать свои поездки."
    2: "Сезоны путешествий"
  "389":
    1: "Во многих районах океанов обитают гигантские морские змеи. Хотя они не представляют большой опасности для судов, они могут оказаться смертельно опасными для людей, плавающих в воде или даже для случайных прохожих на побережье."
    2: "Морские змеи"
  "390":
    1: "Если вы получите достаточно серьезное ранение, то потеряете сознание. Получение ранения в состоянии без сознания почти всегда приводит к смерти."
    2: "Потеря сознания"
  "391":
    1: "Смешав «попписнапс», корень фирны или ягоды «видоуипс» с водой в пустой бутылке для зелий, можно приготовить простое зелье. Эти простые зелья обладают ограниченным благотворным действием, но действуют сильнее, чем сами травы."
    2: "Основы алхимии"
  "392":
    1: "Позвольте рассказать вам о действии простых зелий. Красные зелья обеспечивают небольшое восстановление здоровья, синие — небольшое пополнение очков заклинаний, а желтые — повышение всех семи характеристик."
    2: "Продвинутая алхимия"
  "393":
    1: "Поскольку освоить навыки становится очень сложно, когда вы уже достигли в них высокого уровня, гораздо эффективнее освоить множество навыков на умеренном уровне, чем несколько навыков на высоком уровне."
    2: "Навыки"
  "394":
    1: "Кригспайр, один из центров магических экспериментов, был поглощён огромным вулканом. Наверняка один из их экспериментов пошёл совершенно не так, как планировалось."
    2: "Кригспайр"
  "395":
    1: "Три самых важных правила, о которых нужно помнить в бою: не дайте себя окружить, сначала сосредоточьтесь на уничтожении одного врага, а уже потом переходите к следующему, и не бойтесь бежать. Нет ничего постыдного в том, чтобы прожить ещё один день!"
    2: "Тактика ведения боя"
  "396":
    1: "Искусно изготовленное оружие — это редкость, а вот магическое оружие — настоящая находка. Магическое оружие часто наносит больше урона, стреляет быстрее, а иногда в него даже встроены заклинания. Ваше мастерство имеет большое значение, но наличие отличного оружия, безусловно, тоже не помешает."
    2: "Магическое оружие"
  "397":
    1: "Если сражаетесь в месте, где очень жарко или холодно, попробуйте применить к врагам заклинания, связанные с противоположной стихией. Зачастую они обладают сопротивляемостью или иммунитетом к той стихии, в условиях которой привыкли жить."
    2: "Заклинания стихий"
  "398":
    1: "Некоторые чародеи, стремясь обрести власть, обманули саму смерть. Эти чародеи обменивают свою жизнь на вечную жизнь в образе нежити. Я не могу себе представить такую жажду власти, которая заставила бы кого-то отдать свою душу. Личи — могущественные и целеустремлённые существа; в сражении с ними следует проявлять осторожность."
    2: "Личи"
  "399":
    1: "Магия Света составляет половину «Зеркального Пути». Свет не может существовать без тьмы, а тьма — без света. Заклинания школы Света большинство людей назвали бы «священными». Найти обучение по этому пути довольно сложно, но результаты, безусловно, стоят затраченных усилий."
    2: "Светлая магия"
  "400":
    1: "Торговцы реагируют на умение покупателя торговаться. Важно привлекать к переговорам только своего лучшего переговорщика, когда вы что-либо покупаете или продаете у торговца."
    2: "Торговцы"
  "401":
    1: "Группа бандитов под названием «Драгуны» в настоящее время грабит купцов, путешествующих между Свободной гаванью и Нью-Сорпигалом."
    2: "Драгуны"
  "402":
    1: "Некоторое время назад я гулял по окрестностям Стар-Лейка и заметил на острове в центре озера целую группу статуй. Они были великолепно высечены — самые реалистичные статуи, которые я когда-либо видел. Интересно, кто их туда поставил?"
    2: "Звёздное озеро"
  "403":
    1: "Здесь действуют простые правила: не убивай, не угрожай, не давай взятки. Попрошайничество не приветствуется, как и общение с известными преступниками. Репутация — это всё."
    2: "Кодекс Айронфистов"
  "404":
    1: "Энротом правит король и совет из пяти лордов. Эти шесть человек отвечают за законы, правила и государственные дела всего Энрота."
    2: "Лорды"
  "405":
    1: "Когда у кого-то есть сундук или другой замок, к которому он не хочет, чтобы вы получили доступ, он, как правило, устанавливает ловушку, а не просто запирает его. Все знают, что решительный вор в конце концов сможет взломать замок, но не каждый решительный вор выживет, попав в ловушку после того, как откроет сундук."
    2: "Замки"
  "406":
    1: "Некоторые замки защищены магическими заклятиями. Вам не удастся их открыть, каким бы искусным слесарем вы ни были, если у вас нет необходимого магического ключа."
    2: "Волшебные замки"
  "407":
    1: "Вы слышали о Храме Баа? Они просто замечательные! Моя семья была голодна, и они накормили нас, когда больше никто не хотел этого делать. Нам нужно было лишь пообещать, что мы вернёмся!"
    2: "Храм Баа"
  "408":
    1: "Люди часто говорят, что мне очень везёт. Дело не столько в том, что мне везёт, сколько в том, что я во всём вижу положительную сторону. Вы бы удивились, насколько незначительными оказываются некоторые из ваших самых серьёзных проблем, если посмотреть на них под правильным углом."
    2: "Позитивное мышление"
  "409":
    1: "Время от времени попадается кто-то, кому нужно добраться до какого-нибудь странного места, например, к замку Кригспайр. Вот, например, недавно один парень хорошо мне заплатил за то, чтобы я помог ему и его слугам перенести вещи через край горы Кригспайр и доставить их в её центр. Его слуги тоже выглядели не слишком здоровыми, но они никогда не уставали. И пахли они тоже не очень."
    2: "Кригспайр"
  "410":
    1: "Парадайз-Вэлли больше не существует. От «Ночи падающих звёзд» осталась лишь бесплодная пустошь. Я видел её, но не набрался смелости зайти туда. Не знаю, какими грехами провинились жители Парадайз-Вэлли, чтобы заслужить такое небесное наказание, но, должно быть, их проступки были действительно ужасными."
    2: "Пустоши"
  "411":
    1: "Ах! Нет ничего лучше, чем сидеть дома у камина с бокалом вина, с собакой у ног и хорошим балансовым отчётом, над которым можно поработать. Вот это жизнь!"
    2: "Бухгалтерский учёт"
  "412":
    1: "Здесь нет двух мнений — золото нужно всегда. У всего есть своя цена; надеюсь, вы сможете её заплатить."
    2: "Золото"
  "413":
    1: "В последнее время происходят ужасные вещи. Я слышал о деревне, которую смыло во время недавних проливных дождей, когда местный ручей вышел из берегов, а новости из Свит-Уотер настолько плохие, что о них вообще ничего не сообщают — люди говорят, что весь город был полностью уничтожен!"
    2: "Плохие вести"
  "414":
    1: "Я слышал рассказы о ужине, который был устроен для отряда Роланда в ночь перед их отправлением. Интересно, ожидал ли кто-нибудь из них вернуться, судя по тем описаниям того пира, которые я слышал. Та роскошь, которой были окружены эти люди, мне, безусловно, показалась чем-то вроде последнего ужина."
    2: "Последний ужин Роланда"
  "415":
    1: "К счастью, наши местные лошади очень ручные, но по окрестностям Эратии бродят кентавры — существа, наполовину люди, наполовину лошади. Кентавры любят собираться в племена и вести войны против живущих по соседству людей и эльфов."
    2: "Кентавры"
  "416":
    1: "В канализационных туннелях под Свободной гаванью скрывается масса интересных вещей. Я слышал рассказы о тайных укрытиях, храмах, сокровищах и… ну, о сточных водах. Не знаю, чему верить, но это, безусловно, кажется интересным местом."
    2: "Свободная гавань"
  "417":
    1: "Поостерегитесь от длительных поездок на несколько дней — в этом месяце три планеты находятся в ретроградном движении, а одна из них даже проходит третью стадию эпицикла, и всё это на фоне восходящего знака Льва, противостоящего боковому движению Рыб. Не говорите потом, что я вас не предупреждал!"
    2: "Ретроградный"
  "418":
    1: "Есть некоторые места, куда в определенные периоды года нельзя добраться на лодке. Вам следует тщательно планировать свои поездки, чтобы избежать неудобств."
    2: "Сезоны путешествий"
  "419":
    1: "Магический полёт ограничен определённой высотой, поэтому некоторые высокие горы препятствуют магическому полёту. Учитывая все преимущества полёта, это действительно весьма незначительный недостаток."
    2: "Горы"
  "420":
    1: "Вода в озёрах и морях вокруг Энрота очень холодная, и даже самые опытные пловцы могут в ней утонуть. Если вы упали в воду, выбирайтесь из неё как можно быстрее! Там долго не выживешь, каким бы выносливым вы ни считали себя."
    2: "Утопление"
  "421":
    1: "Отличное заклинание, но, к сожалению, большинство городов находится на востоке, поэтому с его помощью вы не сможете далеко уйти. Конечно, если вам нужно быстро вернуться в город, это самый простой способ."
    2: "Городской портал"
  "422":
    1: "Хотя они и исповедовали еретическую религию, их намерения были благими. Церковь помогала бедным, исцеляла больных и утешала опечаленных. Но со временем она стала богатой, могущественной и гордой, а гордыня, как известно, предшествует падению. Когда она напала на своего соперника — Церковь Луны, — она погубила и врага, и саму себя."
    2: "Храм Солнца"
  "423":
    1: "В наши дни трудно зарабатывать на жизнь, играя музыку в тавернах. Я уже много лет путешествую по городам, но сейчас люди действительно напуганы. Все боятся тратить деньги."
    2: "Таверны"
  "424":
    1: "Лодки не всегда ходят по расписанию или следуют в те пункты назначения, которые вам нужны. Если вы хотите самостоятельно управлять своим путешествием по воде, заклинание «Ходьба по воде» — это то, что вам нужно."
    2: "Хождение по воде"
  "425":
    1: "Кулатс — оружие, превосходящее широкий меч по многим причинам, но главная из них — это способ его заднего маха, позволяющий ввести противника в заблуждение относительно длины досягаемости твоего оружия. Кузницы Регны производят лучшие кулатсы в мире — можешь не сомневаться, приятель!"
    2: "Сабли"
  "426":
    1: "Чадвик, ветеран Войн за престол, живет в Свободной гавани. Он — самый титулованный из ныне живущих кавалеров в Энроте и один из любимых рыцарей Осрика."
    2: "Чадвик"
  "427":
    1: "Большинство азартных игр придуманы для того, чтобы обчистить дураков. Если вы не экстрасенс или не обладаете феноменальной удачей, не тратьте на них своё с трудом заработанное золото."
    2: "Азартные игры"
  "428":
    1: "После смерти Роланда и появления слухов о крахе правления Айронфистов путешествовать по дорогам стало практически небезопасно. Разбойники и бандиты всех мастей теперь нападают на всех, кто отдаляется слишком далеко от защиты замков."
    2: "Разбойники"
  "429":
    1: "Если вам придется прибегнуть к «особым» мерам, чтобы заставить кого-то поговорить с вами, помните, что попрошайничество практически не влечет за собой никаких последствий. Однако некоторые типы людей просто не станут слушать попрошайку, что заставит вас попробовать другой подход. Воры и торговцы никогда не терпят попрошайничества."
    2: "Попрошайничество"
  "430":
    1: "Николай Айронфист — мой брат-близнец. Готов поспорить, ты об этом не знал, да? Нас давным-давно разлучил наш отец, Роланд. С помощью магии они сохранили Николя таким молодым, но на самом деле он моего возраста."
    2: "Николай"
  "431":
    1: "Большинство людей любят говорить о канализации Свободной гавани как о пристанище для всевозможных воров. Я, однако, в этом сомневаюсь. Если бы у меня был выбор, я бы, конечно же, жил в красивом доме с множеством дворецких и горничных. Зачем мне выбирать жизнь в канализации?"
    2: "Канализация"
  "432":
    1: "Вы слышали о Храме Баа? Они просто замечательные! Моя семья была голодна, и они накормили нас, когда больше никто не хотел этого делать. Нам нужно было лишь пообещать, что мы вернёмся!"
    2: "Храм Баа"
  "433":
    1: "Нам нужен настоящий король, а не ребёнок. Как Николай может быть хорошим правителем, если он ещё ребёнок?"
    2: "Николай"
  "434":
    1: "В стилях плащей нет особой разницы, за исключением общего цвета или выбора ткани. Однако есть один, который выделяется своей необычностью. Это «Плащ Судного дня», изготовленный 80 лет назад Церковью Луны. Его можно узнать по чёрной внутренней подкладке и серебряному краю. Эти плащи всегда обладают мощным магическим зарядом."
    2: "Плащи"
  "435":
    1: "Кто-то же должен выполнять всю эту черную работу. Жаль, что этим «кем-то» оказался я."
    2: "Работа"
  "436":
    1: "Эта холодная погода меня очень беспокоит. Это действительно необычно, и я переживаю за здоровье своего урожая."
    2: "Холодная погода"
  "437":
    1: "Если бы у меня была «Небесная кузница», я мог бы изготавливать сотни бочек в день, даже не вспотев. Пожалуй, эти кузницы были одним из плюсов «Времени чудес»."
    2: "Небесная кузница"
  "438":
    1: "Чтобы изготовить прочную и качественную керамику, нужен действительно сильный огонь. Если бы это не было так опасно, я бы отправился в замок Кригспайр, чтобы попробовать те огни, которые, как говорят, горят под замком."
    2: "Жар гончарной печи"
  "439":
    1: "Когда в июле обрушились штормы, я оказался совершенно не готов к спросу на зимнюю одежду. А теперь, когда я уже готов к зимнему сезону, погода оказалась не такой уж и холодной. Наверное, я чем-то разгневал Небеса!"
    2: "Погода"
  "440":
    1: "Существует несколько различных видов волшебных сапог, которые изготавливают алхимики. Большинство металлических моделей обладают тем или иным зачарованием."
    2: "Волшебные сапоги"
  "441":
    1: "Почему никто ничего не предпринимает в связи со всеми этими неприятными событиями? Разве не для этого существует совет?"
    2: "Высший совет"
  "442":
    1: "Похоже, с урожаем зерновых в этом году что-то не так. Я никак не могу найти достаточно продавцов сырой пшеницы и кукурузы, чтобы мой бизнес работал как следует. Не знаю, сколько это ещё может продолжаться, прежде чем я окажусь на мели."
    2: "Цены на зерно"
  "443":
    1: "Не только металлическое оружие подвергается зачарованию. В деревянное оружие, например в луки, тоже иногда вкладывают мощные заклинания."
    2: "Зачарование"
  "444":
    1: "Мрамор — лучший строительный материал, который только можно купить за деньги. Большая его часть добывается в холмах недалеко от Блэкшира… что очень жаль, ведь ходят слухи, будто на жителей этой местности лежит какое-то страшное проклятие. В последнее время там почти не ведётся никаких работ."
    2: "Мрамор"
  "445":
    1: "Как узнать пирата-гоблина? Это тот, у которого на обоих глазах по повязке!"
    2: "Анекдот дня"
  "446":
    1: "В последнее время монстры пожирают дичь. Монстров стало гораздо больше, чем обычно."
    2: "Монстры"
  "447":
    1: "Не могу поверить, как мало людей на самом деле готовы выделить немного денег на такого нищеброда, как я. Неужели все такие эгоистичные?"
    2: "Богатство"
  "448":
    1: "Никому не говори, но у меня есть друг-священник, который мгновенно избавляет от клейм скот, который мы, э-э, «одалживаем» у всех скотоводов. Действует как по волшебству!"
    2: "Сбыт краденого"
  "449":
    1: "Разрушение Райской долины привело к исчезновению величественного леса Энрота — Блэквудского леса. Блэквудский лес был мирным местом, где в изобилии водилась дичь. Я неплохо зарабатывал на жизнь там, среди деревьев. Теперь я не знаю, где охотиться."
    2: "Блэквуд"
  "450":
    1: "Вы даже не можете себе представить, насколько неприятно работать на аристократов. У них, может, и есть деньги, но ни один другой заказчик не бывает настолько назойливым, требовательным и безразличным к тому, как он тратит ваше время."
    2: "Назойливые аристократы"
  "451":
    1: "Островная империя Регна пока не приняла веру Баа. Я надеюсь отправиться туда, чтобы проповедовать учение Баа."
    2: "Регна"
  "452":
    1: "Все наши важные поставки поступают по вторникам."
    2: "Вторник"
  "453":
    1: "К счастью, большинство агрессивных людей вымещают свою агрессию на Арене, а не в городах."
    2: "Арена"
  "454":
    1: "Высший Совет уже много лет не обращался к Оракулу. Последним, кто пытался это сделать, был Арчибальд, но Оракул ему ничем не помог."
    2: "Оракул"
  "455":
    1: "Нет ничего хуже, чем новые религии, обещающие обездоленным золотые горы. Они подрывают устоявшийся порядок и разжигают мятеж. Этот «Храм Баа», о котором сейчас все говорят, — ни к чему хорошему не приведет. Очень хотелось бы, чтобы регент принял меры против них."
    2: "Новые религии"
  "456":
    1: "Бе-е, друг… ой. Э-э, я думал, ты член моего храма. Извини, я ошибся."
    2: "Спутники"
  "457":
    1: "Я ненавижу школу. Мой отец говорит, что мне нужно усердно учиться, чтобы потом найти хорошую работу, а может, даже научиться магии. Кому это вообще нужно? Я просто хочу играть!"
    2: "Школа"
  "459":
    1: "Не хочу подрывать свой бизнес, но, честно говоря, если вдуматься, действительно выгоднее нанимать нас, кузнецов, только тогда, когда мы нужны, а не таскать нас с собой повсюду."
    2: "Наем кузнецов"
  "460":
    1: "Если вам когда-нибудь попадётся предмет, содержащий заклинание «Маяк Ллойда», помните, что места, в которые можно переместиться, определяются индивидуально для каждого человека. Это означает, что даже у человека, не владеющего заклинаниями, может быть место, куда он сможет переместиться с помощью предмета «Маяк Ллойда»."
    2: "Предметы с заклинанием «Маяк Ллойда»"
  "461":
    1: "Существует три растения, из которых можно приготовить три основных зелья. Это маковые бутоны, корень фирны и ягоды видоуипс. Просто смешайте измельченные цветы, корни или ягоды соответственно с водой, чтобы получить зелье."
    2: "Травы"
  "462":
    1: "Замок «Кригспайр» изначально был построен для изучения потухшего вулкана, на склоне которого он расположен, но недавняя активность этой горы заставила всех людей покинуть замок. Он пока не разрушен, но теперь в нём осмеливаются жить только монстры."
    2: "Замок Кригспайр"
  "463":
    1: "Драконы из Драгонсанда воспользовались атаками демонов и распространились из пустыни на близлежащие пустоши. Ходят даже слухи, что они проникли на север, вплоть до Кригспайра."
    2: "Драконы"
  "464":
    1: "С некоторыми монстрами можно договориться. Например, если вы знаете заклинание «Очарование», то сможете на время сделать дружелюбным даже самого свирепого зверя. Помните: не обязательно убивать всех, кого встретите. Иногда достаточно просто пройти мимо них."
    2: "Враги"
  "465":
    1: "Леди Флейз — королева купцов, и она накопила огромное состояние, контролируя цены на морские перевозки."
    2: "Лоретта Флейз"
  "466":
    1: "Иногда пираты нападают на некоторые прибрежные города или медленные корабли. К счастью, пираты появляются редко, но их нападения могут повлиять на цены в тех городах, которые они грабят."
    2: "Пираты"
  "467":
    1: "Некоторые монстры и заклинания способны превратить ваше тело в пепел, что затрудняет попытки воскрешения. Мы, целители, называем это «уничтожением». Излечить от «уничтожения» можно только с помощью особых храмов и заклинаний."
    2: "Уничтожение"
  "468":
    1: "Для лечения не обязательно иметь при себе могущественного заклинателя. Во всех городах и замках есть храмы, где работают целители. Вы можете изготавливать лечебные зелья, находить предметы с заклинаниями исцеления или даже магические фонтаны и святилища, способные вас исцелить."
    2: "Альтернативные методы лечения"
  "469":
    1: "В Серебряной бухте была основана крупнейшая Гильдия «Я»."
    2: "Гильдия магии разума, духа и тела"
  "470":
    1: "При любой возможности стоит стремиться стать экспертом или мастером в том или ином деле, которым вы занимаетесь. Эксперты и мастера получают преимущества и достигают результатов, недоступных тем, кто освоил лишь азы данного дела."
    2: "Эксперты и мастера"
  "471":
    1: "Важно сражаться с противниками, представляющими для вас определенную сложность. Если вы сражаетесь со слабыми противниками, вы не получаете почти никакого опыта, а если сражаетесь с сильными — рискуете погибнуть. Наибольшую пользу для обучения приносят противники, соответствующие вашему уровню мастерства."
    2: "Противники"
  "472":
    1: "Если есть возможность, всегда надевайте доспехи! Всегда! И потратьте немного времени на то, чтобы научиться ими пользоваться, иначе в бою будете валяться, как беременный як!"
    2: "Броня"
  "473":
    1: "Не так давно к нам забрел какой-то человек, утверждавший, что обладает знаниями о древнем оружии, подобного которому не видели со времён Чудес. Мы высмеяли его и его безумные бредни и прогнали из города."
    2: "Древнее оружие"
  "474":
    1: "Это заклинание — моё самое любимое. Оно особенно эффективно против самых сильных и выносливых монстров: оно увеличивает их вес и разбивает множество важных внутренних органов. Похоже, оно сокращает их здоровье вдвое, а у сильных монстров это может быть довольно значительной потерей."
    2: "Чудеса искажения массы"
  "475":
    1: "Величайший исследователь магии со времён «Тишины» — Твиллен — наконец-то почувствовал на себе тяжесть возраста. Насколько я знаю, он искал способ вернуть себе молодость. Думаю, даже ему не под силу противостоять силам природы."
    2: "Твиллен"
  "476":
    1: "Тёмная магия составляет половину «Зеркального Пути». Тьма не может существовать без света, как и свет — без тьмы. Слово «зло» чаще всего ассоциируется со школой магии Тьмы, но это неверно. Школа, как и оружие, сама по себе не является ни доброй, ни злой — её моральный характер определяется тем, как её используют."
    2: "Тёмная магия"
  "477":
    1: "Хотя банки в Энроте не выплачивают проценты, они защищают ваши деньги от кражи и потери. Прежде чем отправляться в длительное или опасное путешествие, вам следует подумать о том, чтобы положить деньги в банк."
    2: "Банки"
  "478":
    1: "Ах, вот в чём смысл быть купцом! Золото — двигатель мира. Экономика кипит благодаря обмену золотом: от рынков до ферм, от городов до королевств — повсюду! Даже короли с большей готовностью расходуют жизни своих подданных, чем своё золото. Быть купцом — это путь к накоплению богатства, а это богатство даёт мне статус, которого у большинства людей никогда не будет."
    2: "Золото"
  "479":
    1: "Возле Пустынного курорта Абдула есть небольшая деревня, где продают одни из лучших магических принадлежностей, какие я только видел. Одному небу известно, откуда они их берут, но приятно знать, что всё это можно там купить."
    2: "Жители пустыни"
  "480":
    1: "Остерегайтесь разбойников, орудующих на дорогах между городами. Разумные путешественники воспользуются услугами многочисленных высококачественных банковских учреждений Энрота, чтобы избежать полного ограбления со стороны этих паразитов."
    2: "Бандиты"
  "481":
    1: "Существует целая культура представителей преступного мира, хотя порой её бывает трудно обнаружить. Воры и преступники имеют свои собственные организации и кодексы поведения и на удивление хорошо распространяют информацию. Хотя им не всегда можно доверять, разумно использовать их услуги, насколько это возможно."
    2: "Подземный мир"
  "482":
    1: "За свою жизнь я соорудил немало потайных дверей, и, по-моему, могу с уверенностью сказать, что некоторые из них практически неотличимы от обычной старой стены. Если у вас есть заклинание «Глаз волшебника», вы можете воспользоваться им, чтобы взглянуть на создаваемую им карту и логически вычислить, является ли тот или иной участок стены частью потайной двери."
    2: "Тайные двери"
  "483":
    1: "Эй! Я настоящий слесарь, а не какой-то подозрительный грабитель или вор. Я помогаю защищать чужое имущество, а не красть его."
    2: "Вор"
  "484":
    1: "Трубка даёт мудрецу повод для размышлений, а глупцу — что-то, что можно засунуть в рот."
    2: "Мудрецы"
  "485":
    1: "Кстати, о том, как обречь себя на гибель: бедному Роланду ни в коем случае не следовало брать на себя столько, сколько он взял. Я уверен, что он встретил свою смерть мужественно, но это произошло гораздо слишком рано."
    2: "Король Роланд"
  "486":
    1: "Не относитесь небрежно к тому, как вы складываете вещи в рюкзак! Немного упорядоченности поможет сэкономить много места и позволит вам взять с собой больше вещей. Ведь никто не сделает это за вас, вы же знаете!"
    2: "Упаковка ваших вещей"
  "487":
    1: "В некоторых местах отдыхать просто слишком опасно. Никогда не думайте, что в сложной местности можно отдохнуть. Постарайтесь сберечь достаточно сил, чтобы иметь возможность отступить в более безопасное место."
    2: "Безопасность во время отдыха"
  "488":
    1: "Знаете, мне действительно неприятно иметь дело с преступниками или слушать их рассказы. Я знаю, что они украли деньги, но что я с этим поделаю? Тюрьма предназначена только для самых жестоких или закоренелых преступников. Верните Арчибальда и старую добрую казнь — вот что я говорю! Король Роланд слишком мягок, как и его регент."
    2: "Темные делишки"
  "489":
    1: "Один из лучших способов заработать деньги — сократить расходы. Найдите самые дешёвые места, где можно приобрести снаряжение, воспользоваться услугами лекаря и пройти обучение. Не нанимайте лишних людей, не платите за поездки, если в этом нет необходимости, и не покупайте предметы, которые не собираетесь использовать. Экономия денег не менее важна, чем их зарабатывание."
    2: "Расходы"
  "490":
    1: "Существует способ приготовить мощное зелье, смешав обычные травы с водой, а простые зелья, полученные в результате этого процесса, можно превратить в более сложные. Я знаю, что если смешать оранжевое зелье с зелёным, получится белое зелье, дающее чрезвычайную защиту. Есть ещё много других комбинаций, которые можно попробовать, но экспериментировать опасно!"
    2: "Зелья"
  "491":
    1: "Я обожаю хорошо приготовленный стейк, приправленный несколькими травами и поданный с луком и грибами. Добавьте к этому немного тушеных овощей, может быть, картошку, и стакан хорошего эля — вот это да, настоящий ужин!"
    2: "Любимые блюда"
  "492":
    1: "Вообще-то, не многие любят бывать в «Болоте проклятых», и я — один из них. Лошадям там тоже не место, и вряд ли вы найдёте дилижансную компанию, готовую отвезти вас туда. Мой совет — держитесь подальше от этого места."
    2: "Путешествие по болотам"
  "493":
    1: "Во время моего последнего визита в замок Айронфист Николай с восторгом рассказывал, как ему хочется побывать в цирке. Я сыграл для него несколько цирковых мелодий, и, судя по всему, он очень оценил этот жест."
    2: "Николай"
  "494":
    1: "Не стоит с легкомыслием относиться к пророчествам, даже если, надо признать, большинство из них не сбывается. Самым важным пророчеством нашей эпохи является предсказание Апиуса Силануса, сделанное им на смертном одре 800 лет назад, когда он сказал, что «тёмный брат» вновь восстанет в тени заката «светлого брата». Это очень напоминает нашего короля Роланда и его злобного брата Арчибальда, не так ли?"
    2: "Пророчества"
  "495":
    1: "Леди Флейз — королева купцов, и она накопила огромное состояние, контролируя цены на морские перевозки."
    2: "Лоретта Флейз"
  "496":
    1: "В Аламосе проживает множество занимающихся исследованиями чародеев и их венгерских стражников. Ходят слухи, что местные чародеи изучают заклинания призыва, но никто не находит в себе смелости отправиться туда и спросить об этом."
    2: "Аламос"
  "497":
    1: "Если вам когда-нибудь придётся столкнуться с ордой мелких монстров, попробуйте применить к ним заклинание «Ледяной взрыв». Оно разрывается на десятки крошечных ледяных осколков, которые разлетаются во все стороны и разрезают врагов на куски. Поскольку осколки отскакивают от стен, в помещении это заклинание действует ещё эффективнее. Обязательно произносите его на значительном расстоянии от себя, иначе оно поразит и вас."
    2: "Ледяной взрыв"
  "498":
    1: "Если вы собираетесь телепортироваться повсюду, важно иметь под рукой хорошие карты, чтобы не заблудиться."
    2: "Карты"
  "499":
    1: "Магия света — самая могущественная магия в мире, которая не наносит вреда самому заклинателю при попытке её применения. Тёмная магия способна творить чудеса в нападении, но зачастую за её использование приходится платить определённую цену. Кроме того, многие из самых разрушительных видов магии Тьмы наносят ущерб не только врагу, но и самому заклинателю."
    2: "Светлая магия"
  "500":
    1: "Кажется, музыка на дудке оказывает странное воздействие на крыс и детей. По крайней мере, так бывает, когда я играю на своей лучшей дудке. Они следуют за тобой повсюду!"
    2: "Крысы и дети"
  "501":
    1: "Я никогда не был на Стар-Айленде, но видел статуи, стоящие снаружи. Никто никогда не возвращался с острова, и я подозреваю, что эти статуи — это преобразившиеся люди, которые добрались до острова и раскрыли там какой-то ужасный секрет."
    2: "Звёздный остров"
  "502":
    1: "В морских сражениях нет ничего лучше трезубца для борьбы с врагами. Трезубец работает как под водой, так и с поверхности в воду. Большинство видов оружия не могут хорошо прорезать воду, но трезубец пронзает её насквозь."
    2: "Трезубцы"
  "503":
    1: "Ходят слухи, что Совет на самом деле хранит запас снаряжения, оставшегося ещё до «Тишины». Однако я в это не верю. Разве Совет не использовал бы это снаряжение против демонов или даже в Войне за престол, если бы это было правдой?"
    2: "Хранилище Совета"
  "504":
    1: "Давай-ка я посмотрю на твою ладонь… <указывая на линию на твоей руке> Ах. Ну, как я и подозревал. Ты умрёшь. Скоро, могу поспорить."
    2: "Хиромантия"
  "505":
    1: "Кинжал или нож — самое полезное оружие в мире. Его можно использовать для самых разных целей: от приготовления пищи до резьбы по дереву и вскрытия замков (в крайнем случае). Кроме того, по мере того как вы становитесь всё более и более опытными, вы сможете владеть им в любой руке и даже наносить точные удары по жизненно важным точкам противников."
    2: "Кинжалы"
  "506":
    1: "Если и существовало когда-либо место, где политика и религия переплетались как в змеином гнезде, то это был Каригор. Каригор — небольшой остров к юго-востоку от «самодельного полуострова», на котором расположен Нью-Сорпигал. Именно там были основаны две соперничающие церкви — Церковь Солнца и Церковь Луны, — которые вели самую длительную войну в истории мира, пока примерно 200 лет назад им не удалось уничтожить друг друга. Их артефакты силы разбросаны по всему миру."
    2: "Каригор"
  "507":
    1: "Храм Баа кишит безумными культистами, жаждущими мирового господства! Их зло пронизывает всё вокруг, и они охотятся за нами с тобой! Наш единственный шанс спастись — убить их лидера, Уилбура Хамфри, пока он не успел ещё больше одурачить принца!"
    2: "Баа"
  "508":
    1: "Этот бандит, рыщущий на севере, печально известен тем, что вымогает «защиту» у купцов. У него неплохо налаженный бизнес, но я не уверен, как долго это продлится, пока кто-нибудь не расправится с ним."
    2: "Принц воров"
  "509":
    1: "Никому не говори, что я это сказал, но ходят слухи, что Айронфисты утратили Мандат Небес. Что ещё могло вызвать все эти бури, наводнения и бедствия? Это признаки небесного гнева, запомни мои слова!"
    2: "Мандат Небес"
  "510":
    1: "Учитывая все те беды, которые сейчас творятся, я, безусловно, рад, что меня защищает мой господин! Другим, возможно, приходится беспокоиться о своём благополучии, но мне нужно сосредоточиться лишь на той работе, которую необходимо выполнить."
    2: "Защита"
  "511":
    1: "Перчатки — это скорее сфера деятельности оружейника, чем портного, но могу сказать, что лучшие экземпляры можно найти в мастерских оружейников на крайнем севере. Самые изысканные из этих магических перчаток носятся почти так же легко, как мягкие перчатки, но при этом защищают не хуже самых прочных пластинчатых перчаток."
    2: "Рукавицы"
  "512":
    1: "Как бы мне ни не нравилось быть простым рабочим, я всё же предпочёл бы оставаться собой, чем кем-либо из Айронфистов. Проблемы, кажется, преследуют их, как муравьи на пикнике. Я веду простую, но счастливую жизнь — это лучше, чем быть несчастным дворянином."
    2: "Айронфисты"
  "513":
    1: "В последнее время наблюдается активное перемещение войск. Все эти солдаты постоянно ходят по моим полям! А теперь скажите сами: как вы думаете, что происходит, когда целая армия проходит по вашим посевам? Да, именно так! Финансовое разорение!"
    2: "Армии"
  "514":
    1: "К счастью, поблизости много таверн и гостиниц; благодаря им у меня всегда есть работа — я изготавливаю для них бочки. Гостиницу можно найти практически везде."
    2: "Таверны"
  "515":
    1: "В наши дни быть гончаром непросто — нет смысла еще больше усложнять себе жизнь. Всегда отправляйтесь на рынок, зная, какими должны быть цены, и обязательно вооружитесь здравым смыслом! Тот, кто не обладает навыками торговца, скорее всего, заключит невыгодные сделки."
    2: "Рынки"
  "516":
    1: "Если вы планируете остаться на севере надолго, не забудьте взять с собой теплую одежду. Кажется, там снег не перестает идти."
    2: "Замерзшие высокогорья"
  "517":
    1: "Кожа дракона — лучший материал для изготовления любой обуви, ремней или сапог. Она эластична, но при этом прочна и устойчива к воздействию погодных условий."
    2: "Драконья кожа"
  "518":
    1: "Учитывая, сколько я уже копал, мне стоит отправиться на острова в заливе и поискать пиратские сокровища."
    2: "Пиратское сокровище"
  "519":
    1: "Ну, несмотря на всю эту плохую погоду, по крайней мере ветер мне на руку. У меня есть две ветряные мельницы, и даже небольшой ветер позволяет мне значительно сэкономить на затратах на рабочую силу!"
    2: "Ветер"
  "520":
    1: "Может быть, мне стоит переехать в Регну. У них самый большой военно-морской флот в мире. Я без труда освоил бы судостроение. В смысле, дерево — это дерево, верно?"
    2: "Регна"
  "521":
    1: "Драгоценные камни могут стоить немалых денег, так что не выбрасывайте их и не продавайте за гроши!"
    2: "Драгоценные камни"
  "522":
    1: "Почему скелет не перешёл дорогу? У него не хватило мужества!"
    2: "Анекдот дня"
  "523":
    1: "Дубление шкур — отвратительная работа. Поэтому я занимаюсь отловом, а не дублением."
    2: "Дубление"
  "524":
    1: "Мне очень не хочется так просить, но травмы, полученные мной во время Войны за престол, не позволяют мне выполнять большинство видов физического труда."
    2: "Война за престол"
  "525":
    1: "Не смейтесь, но я слышал, что в окрестностях Нью-Сорпигала коров убивают гигантские летающие кровососы. Боги, спасите нас!"
    2: "Кровососы"
  "526":
    1: "По всей местности разбросаны святилища. Интересно, кому они посвящены и кто в них молится?"
    2: "Святыни"
  "527":
    1: "Я изготовил несколько книг заклинаний для ряда чародеев, в том числе для Альберта Ньютона. По правде говоря, он мой лучший клиент. Он продаёт самые сложные заклинания Гильдиям Света и Тьмы, расположенным где-то на западе, вероятно, недалеко от Блэкшира."
    2: "Книги"
  "528":
    1: "Эта Церковь посвящала себя поклонению небесам. Конфликт между Церквями Солнца и Луны был бессмысленным и бесполезным. Нам всем повезло, что обе они исчезли."
    2: "Храм Луны"
  "529":
    1: "Это лучше, чем копать канавы. К тому же кто-то же должен поддерживать работу государственного аппарата!"
    2: "Бумажная волокита"
  "530":
    1: "Тебе кажется, что я скучаю? Конечно, это не так. Притворяться спящим — это старый трюк старой гвардии."
    2: "Сон"
  "531":
    1: "Сразу видно, что Арчибальд — представитель рода Айронфистов — у него характерная для них неудачливость. Мало того, что его попытка захватить власть провалилась, так он ещё и превратился в статую в королевской библиотеке. По крайней мере, ему предстоит провести остаток своих дней в замке."
    2: "Арчибальд"
  "532":
    1: "Эта чепуха про «мандат Небес» действительно может привести к серьёзным неприятностям. Если кто-нибудь в ближайшее время не разберётся, что происходит с этими бедствиями, королевство развалится!"
    2: "Чепуха о Мандате Небес"
  "533":
    1: "Если вам когда-нибудь понадобится лечение, а денег не хватит, чтобы заплатить этим «акулам» в обычных храмах, почему бы не заглянуть в Храм Баа? Там лечат людей совершенно бесплатно!"
    2: "Бесплатное исцеление"
  "534":
    1: "Как бы я хотел быть Николаем! Он ещё ребёнок, но, наверное, никто ему не указывает, что делать! Он может делать всё, что захочет, потому что он король. А я — нет: мне все постоянно указывают, что делать."
    2: "Николай"
  "536":
    1: "Не стоит недооценивать защитные качества хорошего щита. Да, я знаю, что двуручное оружие бьёт гораздо сильнее, но что делать, если ты промахнёшься или если монстр просто не падет с первого удара? Вот тогда-то и пригодится хороший щит. Он однажды спасёт тебе жизнь, поверь мне!"
    2: "Щиты"
  "537":
    1: "Статистика показывает, что предметы чаще всего ломаются, когда персонаж теряет сознание из-за полученного урона или когда монстр наносит особенно сильный удар. Лучший способ избежать поломки предметов — просто не терять сознание. Восстановите здоровье, пока не стало слишком поздно."
    2: "Сломанные вещи"
  "538":
    1: "Большинство предметов, которые вы найдёте, будут повышать или усиливать какую-либо вашу базовую характеристику, но некоторые из них будут оказывать более сложное воздействие. Именно они представляют собой настоящую ценность, и их названия обычно имеют форму «предмет [название]», например, «палочка молний»."
    2: "Магические способности"
  "539":
    1: "К юго-западу от Энрота находится остров, который, как говорят, является штаб-квартирой Храма Баа. Правда, мне совершенно непонятно, зачем для столь популярной религии выбрали столь отдалённое место."
    2: "Вулканический остров"
  "540":
    1: "Ходят слухи, что самые западные районы Замерзших Высокогорий кишат могущественными существами. Может быть, там даже драконы!"
    2: "Замерзшие высокогорья"
  "541":
    1: "Теперь это уже не так! С тех пор как появились демоны, Райская долина превратилась в бесплодную пустошь, кишащую сотнями демонов. Никто, кто туда попадает, не выживает!"
    2: "Райская долина"
  "542":
    1: "Король Роланд держит свою личную королевскую яхту «Королева Кэтрин» на озере, расположенном к западу от замка Айронфист. Это могучее судно, способное быстро добраться практически куда угодно, однако только король или регент могут дать разрешение на его использование."
    2: "Королевская яхта"
  "543":
    1: "Гавань контрабандиста усеяна множеством небольших островов. Я слышал слухи о храмах на этих островах и даже о пиратских укрытиях! Я ни того, ни другого никогда не видел, но могу себе представить, какое огромное сокровище накопил бы пират."
    2: "Гавань контрабандиста"
  "544":
    1: "Если вы намерены воскресить кого-то из мёртвых, важно сделать это как можно скорее. Если вы будете слишком долго тянуть, для устранения последствий смерти может потребоваться более одного заклинания. А это может обойтись дорого!"
    2: "Смерть"
  "545":
    1: "Можно создавать более сложные зелья, смешивая простые зелья друг с другом для получения сложных зелий. Сложные зелья действуют сильнее простых и обладают несколько иными эффектами."
    2: "Основы алхимии"
  "546":
    1: "Простые зелья можно комбинировать для создания сложных зелий. Оранжевые зелья временно повышают ваш класс брони, зеленые — временно повышают ваши сопротивления, а фиолетовые служат противоядием от любого яда."
    2: "Продвинутая алхимия"
  "547":
    1: "У каждого есть книга заклинаний, но многие не умеют записывать в неё даже самые простые заклинания. Если вам каким-то образом удастся внести заклинание в свою книгу, вы сможете его произнести, при условии, что у вас достаточно силы заклинаний."
    2: "Изучение заклинаний"
  "548":
    1: "Хитрая женщина… Общаясь с ней, легко забыть, насколько она умна. Помимо того, что она накопила огромное состояние, она овладела несколькими навыками и поддерживает связи с несколькими друидскими орденами Севера."
    2: "Лоретта Флейз"
  "549":
    1: "Обратите внимание на преимущества небольшого и быстрого оружия. Если вы достаточно хорошо им владеете, то сможете наносить удары в два раза чаще, чем с помощью более крупного и тяжёлого оружия."
    2: "Инициатива"
  "550":
    1: "Некоторые воины предпочитают специализироваться на одном виде оружия, отдавая ему предпочтение перед всеми остальными. Такая подготовка делает их невероятными бойцами, но у неё есть и несколько слабых сторон. Они могут не найти подходящего оружия того типа, на котором специализируются, или столкнуться с противником, который лучше противостоит их атакам. Специалисты — отличные бойцы, но им не следует путешествовать в одиночку."
    2: "Специализация"
  "551":
    1: "Обязательно используйте защитные заклинания, если они у вас есть. Они действительно могут облегчить страдания, связанные с тем, что вас превратят в пепел драконьими пламенами или убьют разрядами молнии вражеских чародеев."
    2: "Защитные заклинания"
  "552":
    1: "Могущественный чародей Агар тщетно пытался создать сильных существ в качестве своих рабов, чтобы завоевать Энрот. Его приспешники были либо слишком глупы, чтобы приносить пользу, либо слишком умны, чтобы поддаваться контролю."
    2: "Агар"
  "553":
    1: "Когда Корлагон начал изучать искусство некромантии, он отнёс кристалл Терракса в своё поместье для исследования. Думаю, кристалл до сих пор находится там."
    2: "Кристалл Терракса"
  "554":
    1: "Дипломатия помогает расположить людей к себе. Если приходится говорить с тем, кто вам не слишком симпатизирует, поручите разговор персонажу с самым высоким навыком дипломатии."
    2: "Дипломатия"
  "555":
    1: "Хотелось бы знать, кто такой Абдул. В его магазинах всегда низкие цены — наверное, он какой-то бандит, пытающийся отмыть деньги. Не вижу никакой другой причины для таких низких цен."
    2: "Абдул"
  "556":
    1: "Я уверен, что черти разрушили город Свит-Уотер! Это был самый северо-западный город в Энроте и, безусловно, один из самых красивых. Не многие люди добирались туда, чтобы побывать там, но теперь об этом месте ничего не слышно."
    2: "Свит-Уотер"
  "557":
    1: "В стране существует две крупные гильдии воров. Одна из них, «легальная», представлена в некоторых крупных городах королевства. Другая гильдия называется «Гильдией Теней». Её члены гораздо более жестоки и безжалостны, чем члены легальных гильдий, и я уверен, что король разгромил бы их, если бы у него было на это время."
    2: "Гильдии воров"
  "558":
    1: "Сами лорды слишком заняты, чтобы заниматься большинством государственных дел, поэтому у них есть члены совета, которые от их имени участвуют в заседаниях Высшего совета в Свободной гавани. У каждого лорда есть по одному члену совета, и эти шесть человек принимают большинство законов государства от имени своих лордов."
    2: "Члены совета"
  "559":
    1: "Пластинчатые доспехи, безусловно, является самым прочным видом брони из всех существующих. Существует легендарный доспех под названием «Зевс», который может наделять своего владельца необычайной силой, но не особо благотворно сказывается на его характере."
    2: "Волшебные доспехи"
  "560":
    1: "Я слышал слухи, что Золтан Фелпс лишился ценного имущества из-за группы бандитов. Если бы он принял надлежащие меры предосторожности и воспользовался моими услугами, этого бы не случилось."
    2: "Джерард"
  "561":
    1: "Я знаю, что мои услуги стоят дорого, но я того стою! Если ты оставишь меня у себя, я поделюсь с тобой мудрыми словами, которые ты вряд ли услышишь от кого-то другого. Например, знаешь ли ты, что дурак быстро расстаётся со своими деньгами?"
    2: "Услуги дурака"
  "562":
    1: "Жаль, что храм в Свободной гавани сгорел дотла. В том храме был самый великолепный алтарь. Местные священники могли воскрешать людей из мёртвых, даже из самого пепла!"
    2: "Храм в Свободной гавани"
  "563":
    1: "Люди, которые меня нанимают, часто просят меня таскать всякую ерунду, без которой, как я знаю, они вполне могут обойтись. Худше всех, наверное, волшебники. Трубы, трубочки, стеклянная посуда, всякая ерунда… и так далее. Держите при себе только самое ценное, а всю эту старую ерунду продавайте! Но помните: в универсальном магазине всегда предложат самые низкие цены."
    2: "Коллекционеры"
  "564":
    1: "Не рекомендуется отдыхать, если вы отравлены или больны. Существует высокая вероятность того, что в таком состоянии вы никогда не проснетесь после отдыха. Перед тем как отдохнуть, вам следует излечиться от яда или болезни."
    2: "Отдых"
  "565":
    1: "В последнее время «Имперский флот Регнана» устроил настоящий налоговый бум, что привело к колоссальному удорожанию морских перевозок и транспортировки грузов. Многие предприниматели просто больше не могут себе позволить оплачивать страховку своих грузов. Кто-то должен что-то предпринять в отношении этих надоедливых регнанцев."
    2: "Пираты"
  "566":
    1: "Из-за недавних проблем люди тратят меньше денег, чем раньше. Боюсь, что экономика от этого сильно пострадает, и вскоре это почувствуют все."
    2: "Экономика"
  "567":
    1: "Мудрецы говорят, что, по их мнению, за всеми бедствиями, происходившими в последнее время, стоит Храм Баа. Думаю, они, скорее всего, правы. В храме предлагают бесплатное исцеление, но прежде чем воспользоваться этой услугой, стоит дважды подумать — люди с подозрением относятся к храму, и если вы будете иметь с ним какое-либо отношение, у вас сложится плохая репутация."
    2: "Храмы зла"
  "568":
    1: "Я слышал о фонтанах с волшебной водой, которые, как говорят, существуют в тех краях. Хотелось бы мне найти один из таких фонтанов; я бы с удовольствием приготовил блюдо, используя волшебную воду."
    2: "Фонтаны"
  "569":
    1: "Если вы путешествуете на дилижансах, вам не стоит об этом особо беспокоиться, но если вы идете пешком, обязательно отдыхайте на траве. Так гораздо удобнее, и ваши ресурсы на путешествие не будут расходоваться так быстро, как если бы вы пытались спать посреди дороги."
    2: "Отдых"
  "570":
    1: "Я не понимаю, почему ни в одном из крупных городов или замков, ни в их окрестностях нет крупных храмов Баа. По какой-то причине все они, похоже, построены в более отдалённых местах."
    2: "Храмы Баа"
  "571":
    1: "Большинство людей об этом не знают, но «Башни Дракона», установленные рядом с каждым из городов, представляют серьезную опасность для учеников, изучающих магию воздуха. Они предназначены для сбивания летающих монстров, но стреляют и по летающим волшебникам. Однажды они стреляли по мне, и мне повезло, что я остался жив и могу рассказать эту историю!"
    2: "Драконьи башни"
  "572":
    1: "Король Роланд держит свою личную королевскую яхту «Королева Кэтрин» на озере, расположенном к западу от замка Айронфист. Это могучее судно, способное быстро добраться практически куда угодно, однако только король или регент могут дать разрешение на его использование."
    2: "Королевская яхта"
  "573":
    1: "Терракс был первым архимагом Энрота и чародеем, обладавшим невероятной силой. Он заложил основы магии стихий и сделал первые фундаментальные открытия в области светлой и магии Тьмы. Говорят, что его кристалл хранит одни из самых сокровенных магических тайн."
    2: "Терракс"
  "574":
    1: "Заклинание «Городской портал» — лучшее заклинание для перемещения на огромные расстояния в Энроте. Мастера воды точно контролируют, куда они отправляются и когда могут применить это заклинание. Обучение ему обходится дорого, но оно того стоит!"
    2: "Городской портал"
  "575":
    1: "Если вы не можете научиться отступать, заклинание «Ангел-хранитель» по крайней мере даст вам возможность спастись от верной гибели. Всякий раз, когда вы отправляетесь исследовать опасную местность, лучше всего наложить это заклинание на всякий случай."
    2: "Ангел-хранитель"
  "576":
    1: "Храм Баа бросает тень на всю религию. Люди начинают думать, что именно они стоят за этими бедствиями, и я начинаю с ними соглашаться. Боги, несомненно, разгневаны их отвратительными ересями!"
    2: "Ложные пророки"
  "577":
    1: "Не стоит рассчитывать на то, что дикие звери успокоятся под музыку. Вся эта история о том, что зверей можно укротить с помощью музыки, — всего лишь миф. У меня есть шрамы, которые это доказывают!"
    2: "Дикие звери"
  "578":
    1: "В замке Даркмур, расположенном в самой глубине «Болота Проклятых», обитают самые могущественные нежить во всём мире. По крайней мере, так гласят слухи. Я сам никогда не видел этого места, не говоря уже о том, чтобы побывать внутри. Зато мне удалось выбраться из болота живым. Немногие могут похвастаться таким."
    2: "Даркмур"
  "579":
    1: "Знаю, это звучит не очень, но лучшей работой, которая у меня когда-либо была, была должность имперского сборщика налогов при Его Высочестве Хареке IX. Мы взимали налоги со множества кораблей, и старина Харек всегда позволял нам оставлять себе часть добычи… э-э, то есть доходов. <вздыхает> Ага. Вот это были времена!"
    2: "Имперское налогообложение"
  "580":
    1: "Повелитель рыцарей! Осрик в совершенстве овладел всем, что связано с боевыми искусствами — от единоборств до организации осады. В бою ему нет равных!"
    2: "Осрик Темпер"
  "581":
    1: "Я вижу на твоём лице знак гибели! Он словно туча, висящая прямо над твоей головой, затуманивающая твои черты лица и бросающая тень на твоё будущее. Тебя ждут великие и страшные приключения, мой друг!"
    2: "Гибель!"
  "582":
    1: "Священники Баа — добрые люди, даже к цыганам. Священника Баа можно узнать по украшенным плащам, которые они носят."
    2: "Плащи Баа"
  "583":
    1: "Если кто-то отказывается с вами разговаривать, а уговоры, похоже, не помогают, попробуйте предложить солидную взятку. Золото развязывает язык быстрее, чем милостыня."
    2: "Взятки"
  "584":
    1: "Все гадают, какие секреты таит в себе древняя пирамида в Драконьем Песке. Ну, а я знаю. Я отправился туда под покровительством Короля Драконов и проник внутрь пирамиды. Это хранилище всех сокровищ драконов! Оно до краев забито золотом и артефактами. Ах, одно только воспоминание об этой красоте вызывает у меня слезы на глазах."
    2: "Пирамида"
  "585":
    1: "Черт! Ничто так не испортило мне жизнь, как банки. Поскольку в них практически невозможно проникнуть, все хранят там свои ценности. Мне уже нечего приличного украсть."
    2: "Банки"
  "586":
    1: "Жаль короля — вот это исчезновение и всё такое. Должно быть, он чем-то прогневил небеса, раз ему так не повезло. Наверное, он получает то, что заслуживает."
    2: "Король Роланд"
  "587":
    1: "Хотелось бы мне быть героем с мечом и щитом, а не крестьянином с плугом."
    2: "Авантюрист"
  "588":
    1: "Эрик Эпплгейт — портной, наиболее известный тем, что сотрудничает с алхимиками в деле зачарования поясов. Эпплгейт занимается этим уже несколько десятилетий, и можно с уверенностью сказать, что у него получились по-настоящему удивительные вещи."
    2: "Ремни"
  "589":
    1: "Однажды я съел несколько «попписнапсов». Мне стало так плохо, что я пропустил день на работе."
    2: "Ягоды вдовы"
  "590":
    1: "Я слышал, что на западе урожай и растения поражает ужасная болезнь. Если она распространится сюда, я окажусь в бедственном положении!"
    2: "Гниль"
  "591":
    1: "После разрушения Блэквуда и затянувшегося противостояния в «Древесной войне» где же мне теперь брать древесину, чтобы продолжать изготавливать бочки?"
    2: "Дерево"
  "592":
    1: "Когда вы ищете хорошую глину, на пляже и в реках можно найти ракушки всех этих маленьких животных. Они, наверное, очень старые. В порту Свободной гавани много ракообразных. По-моему, это устрицы. Их так много, что они засыпают всю мою хорошую глину!"
    2: "Окаменелости"
  "593":
    1: "Нарядные шляпы и красивые рубашки — это, конечно, хорошо, но если тебе предстоит сражаться, лучше надеть доспехи и шлем."
    2: "Одежда"
  "594":
    1: "Вы когда-нибудь слышали о легендарной паре сапог под названием «Гермес»? Говорят, что эти сапоги способны увеличить скорость того, кто их носит, до божественных высот. Очень хотелось бы когда-нибудь это увидеть!"
    2: "Гермес"
  "595":
    1: "Я далеко не так искусен, как некоторые из тех, кто здесь работает. Если бы я умел произносить заклинания, лечить или чинить вещи, меня нанимали бы гораздо чаще. Кому сейчас нужны выкопанные канавы?"
    2: "Навыки"
  "596":
    1: "Хотя штормы оказались большим подспорьем для ветряных мельниц, водяные мельницы страдают от холодной погоды. Каждый раз, когда ручьи замерзают, работа на водяных мельницах полностью останавливается."
    2: "Водяные мельницы"
  "597":
    1: "Последняя «Небесная кузница» перестала работать примерно через 130 лет после «Тишины». Никому так и не удалось восстановить работу этих кузниц."
    2: "Небесные кузницы"
  "598":
    1: "Говорят, что улицы Калимара, столицы Каригора, вымощены тонким нефритом, и в строительстве зданий тоже используется именно этот материал. Звучит прекрасно, не правда ли?"
    2: "Нефрит"
  "599":
    1: "Вы слышали про орка-чревовещателя, у которого кукла ушла в поисках нового партнера?"
    2: "Анекдот дня"
  "600":
    1: "Существует множество способов установить ловушку, которая обязательно сработает, когда кто-то откроет ящик или наступит на определённое место на земле. Если вы собираетесь отправиться в приключение, вам не помешает немного научиться обезвреживать ловушки. Кто знает, может, однажды это спасёт вам жизнь."
    2: "Ловушки"
  "601":
    1: "Пожалей беднягу и пожертвуй ему пару монет! Боги будут к тебе благосклонны, если ты это сделаешь."
    2: "Пожертвования"
  "602":
    1: "Вы когда-нибудь пробовали подкрасться к корове посреди ночи? Они спят стоя. Их можно сбить с ног, просто сильно толкнув. Ой, как же она удивляется, когда просыпается!"
    2: "Опрокидывание коров"
  "603":
    1: "Кто такой Иван Селинг? Ведь это величайший мастер по изготовлению луков всех времён! Как бы я хотел иметь лук, сделанный им! Никто не смог бы стать лучшим охотником, чем я! К сожалению, после «Древесных войн» его луки стали настоящей редкостью."
    2: "Иван Селинг"
  "604":
    1: "Учитывая мизерную цену, по которой продаются свитки заклинаний, я бы просто оставил их себе и использовал в экстренных случаях. Часто они написаны с очень высоким уровнем мастерства, поэтому их использование может оказаться полезным."
    2: "Свитки"
  "605":
    1: "Смерть Роланда — доказательство того, что династия Айронфистов утратила Мандат Небес. Пришло время, чтобы у Энрота появились новые правители!"
    2: "Роланд"
  "606":
    1: "Каучук для моих штампов добывают в южной части Эратии, где царит более тропический климат. Там растёт растение, которое избавляет клерков по всему миру от необходимости многократно писать одно и то же!"
    2: "Штампы"
  "607":
    1: "Хотелось бы мне иметь возможность отправиться в экспедицию Роланда. Лучше действовать и отважно сражаться с врагом, чем просто стоять и ждать, пока нагрянут неприятности."
    2: "Роланд"
  "608":
    1: "Не могу поверить, какая странная погода у нас в последнее время. Думаю, может, мне стоит начать делать ставки на погоду. Наверное, я бы на этом неплохо заработал!"
    2: "Погода"
  "609":
    1: "Исчезновение короля — это настоящая катастрофа. Я понимаю, что трудно испытывать сочувствие к знати, но упорядоченное королевство — в интересах всех. Потеря короля не приведет к наведению порядка, да и нет никого, кто мог бы заменить его без такого кровопролития, что «Войны за престол» по сравнению с ним покажутся детской дракой школьниц!"
    2: "Король"
  "610":
    1: "Как только вы вступите в Храм Баа, вам выдадут храмовые плащи и разрешат посетить Высший храм Баа, расположенный к востоку от замка Кригспайр. Рано или поздно все присоединятся к нам, так зачем же ждать? Высший храм — это действительно впечатляющее зрелище!"
    2: "Высший храм"
  "611":
    1: "Мама сказала мне, что если я буду плохо себя вести, ко мне придут черти и заберут меня!"
    2: "Дьяволы"
  "613":
    1: "Когда вы покупаете или продаете товары через торговцев, всегда поручайте вести переговоры вашему лучшему торговцу. Если у них есть возможность выручить еще пару золотых с неосторожного покупателя, ни один из них не задумываясь этим воспользуется — поверьте мне!"
    2: "Торговцы"
  "614":
    1: "Во время ежегодных астрологических явлений, таких как два солнцестояния и равноденствия, происходят многие необычные магические явления. Затмения, полночь, полдень, кометы — всё это может иметь магическое значение. Важными датами в этом году являются: 20 марта, 21 июня, 23 сентября и 21 декабря."
    2: "Равноденствия и солнцестояния"
  "615":
    1: "В стране Энрот оттенки чёрного и белого имеют особое магическое значение. Если предмет или зелье белого цвета, это обычно означает, что оно оказывает мощное благотворное воздействие без каких-либо побочных эффектов. Если же оно чёрного цвета, то оказывает самое мощное воздействие, но сопровождается каким-либо неприятным побочным эффектом. Будьте осторожны!"
    2: "Чёрное и белое"
  "616":
    1: "Все слышали о сети дисконтных магазинов Абдула. Так вот, у него ещё есть курорт на острове, где пожилые и уставшие люди могут восстановить силы за немалую плату. Говорят, что сам Абдул живёт на своём курортном острове и редко бывает на материке."
    2: "Курорт на острове Абдула"
  "617":
    1: "В степях около Серебряной бухты процветают ордена друидов. Эти друиды часто выстраивают каменные круги для проведения церемоний или поклонения природе."
    2: "Друиды"
  "618":
    1: "Горы, образующие ущелье, ведущее в Райскую долину, называются «Стражи». Согласно народным преданиям, они защищали долину от зла; теперь же они служат предупреждением для всех, кто достаточно безрассуден, чтобы попытаться туда проникнуть."
    2: "Стражи"
  "619":
    1: "Существует множество островов, добраться до которых можно только с помощью лодки в сочетании с заклинанием «Хождение по воде». На многих из них обитают самые ужасные чудовища, но зачастую именно там можно найти самые ценные сокровища."
    2: "Острова"
  "620":
    1: "Путешествие на лодке не происходит мгновенно; на это уходит время. Не забудьте учесть время в пути, если у вас сжатые сроки."
    2: "Путешествие на лодке"
  "621":
    1: "Когда-то в городе Свободной гавани стоял храм, построенный Лордом Стоуном, но несколько лет назад он был сожжен вандалами. Качество алтаря в этом храме было настолько высоким, что позволяло жрецам воскрешать любого из мёртвых, даже те, чьи тела были полностью уничтожены."
    2: "Храм Свободной гавани"
  "622":
    1: "«Первая помощь» — заклинание низкого уровня, направленное на восстановление здоровья, которое отличается высокой эффективностью с точки зрения затрат на применение, но действует медленно. Если у вас достаточно времени, это лучший способ восстановить здоровье."
    2: "Первая помощь"
  "623":
    1: "«Божественное вмешательство» — вершина заклинаний света — делает именно это: призывает Эйлу, богиню исцеления, вмешаться в вашу пользу и полностью восстановить здоровье вашей группы. Её цена — часть вашей жизненной силы, из-за которой вы постареете на несколько лет, — порой с лихвой окупается её вниманием."
    2: "Божественное вмешательство"
  "624":
    1: "Тренировочные центры — лучший способ повысить уровень, но со временем обучение становится ужасно дорогим. Чтобы избежать лишних расходов, лично я рекомендую сеть дешёвых тренировочных центров Абдула."
    2: "Тренировочные центры"
  "625":
    1: "Ни один учитель в мире не может сравниться с Оракулом из Свободной гавани. Единственный нюанс заключается в том, что для посещения Оракула необходимо получить единогласное одобрение Высшего совета."
    2: "Оракул"
  "626":
    1: "Одно из преимуществ меча и кинжала заключается в том, что опытные воины могут держать клинок в левой руке вместо того, чтобы использовать щит. Даже такой недалекий человек, как ты, должен понимать, почему это может быть полезно."
    2: "Комбинированное оружие"
  "627":
    1: "Я знаю, как легко нам, воинам, насмехаться над слабыми магами, но порой они могут оказаться весьма полезными. Многие из их заклинаний способны повысить вашу боевую эффективность, сделав вас быстрее, повысив точность ударов или увеличив сопротивляемость урону. Если маги способны выполнять свою часть работы, они становятся отличными спутниками в путешествии."
    2: "Магия"
  "628":
    1: "Заклинания перемещения представляют собой важнейший класс заклинаний для всех, кто владеет магией. Они не только позволяют добраться до мест, недоступных без магии, но и дают возможность посещать, например, источники, восстанавливающие здоровье и магическую силу, в отдалённых районах, а также использовать эти способности в опасных подземельях и замках, где они так необходимы."
    2: "Заклинания для путешествий"
  "629":
    1: "Эти парящие головы — «лучшие» творения Агара — обладают удивительным интеллектом и огромной силой. Одного их взгляда достаточно, чтобы усыпить человека. Ходят слухи о еще более могущественных глазах, способных вызвать панику или даже полное безумие."
    2: "Летающие глаза"
  "630":
    1: "В этих землях существует несколько Гильдий Самосознания. Объединяя знания о разуме, духе и теле, эти гильдии предлагают более всестороннее обучение, чем любая из отдельных гильдий. Однако их знания об отдельных школах далеко не столь полны."
    2: "Гильдии магии разума, духа и тела"
  "631":
    1: "Пусть название вас не обманывает: дешёвые магазины Абдула предлагают отличный товар по очень низким ценам. И он вовсе не платил мне за эти слова по четвергам. Честно."
    2: "Скидки у Абдула"
  "632":
    1: "На севере бизнес контролируется несколькими монополиями, которые любыми средствами, в том числе и с помощью вымогательства, препятствуют конкуренции. «Теневая гильдия» и «Гильдия воров» уже начали борьбу за права в таких районах, как Серебряная бухта и Свободная гавань."
    2: "Гильдия «Тень»"
  "633":
    1: "Поверьте мне на слово: Болото — не лучшее место, где можно оказаться ночью. Гильдия некромантов «ушла на покой» в болото после поражения Арчибальда в Войне за престол, и свидетельства их деяний свободно разгуливают по болоту."
    2: "Болото проклятых"
  "634":
    1: "Вы можете избежать длительного тюремного заключения за любые совершенные вами преступления, получив прощение в храмах. Если вы столкнётесь с охранником до того, как получите прощение за тяжкие преступления, вам грозит год тюрьмы или даже больше."
    2: "Тюремные сроки"
  "635":
    1: "Многие монстры не пойдут на уступки, как бы красноречиво вы ни формулировали свои просьбы. Вам нужно уметь распознавать безнадежно агрессивных монстров и избавляться от них как можно быстрее."
    2: "Монстры"
  "636":
    1: "Многие люди не особо любят ремесленников, потому что мы бродяги и занимаемся мелкими подработками, за которые гильдии с удовольствием брали бы большие деньги. Но ты-то меня любишь, правда?"
    2: "Нежелательные лица"
  "637":
    1: "Несмотря на все происходящие беды, у меня дела идут просто отлично. Люди почувствовали необходимость запирать своё имущество, чтобы защитить его от мародеров и грабителей. Приятно осознавать, что я могу дать людям хотя бы небольшое чувство безопасности в эти мрачные времена."
    2: "Опасность"
  "638":
    1: "Я купил карту сокровищ у того продавца карт, с которым познакомился некоторое время назад, и на ней сказано, что грозный пиратский капитан Сильвека закопал свои сокровища под деревом на одном из островов к востоку от Свободной гавани."
    2: "Карта сокровищ"
  "639":
    1: "Лоретта — человек по моему вкусу. Она сама создаёт себе удачу, и она почти всегда сопутствует ей. Она полна уверенности в себе, а это то, что не купишь за деньги. Я уверена, что именно в этом и заключается секрет её успеха: в уверенности в себе и позитивном взгляде на жизнь."
    2: "Лоретта Флейз"
  "640":
    1: "Уверен, вы видели обелиски, разбросанные по всему Королевству. Говорят, в них скрыта загадка, которая только и ждёт, чтобы её разгадали, и которая укажет, где найти огромное сокровище, зарытое под землёй. Правда, пока что никому это не удалось. По крайней мере, я ни о ком таком не слышал."
    2: "Обелиски"
  "641":
    1: "Да, я раньше служил в армии Осрика: занимался обустройством лагеря, приготовлением еды и инвентаризацией припасов. Он справедливый человек и отличный командир. Поверь, он знает, как поддерживать боевой дух своих солдат."
    2: "Осрик Темпер"
  "642":
    1: "В жизни есть только три вещи, в которых можно быть уверенным: первая — это смерть; вторая — налоги; а третья — то, что рано или поздно вы услышите эту шутку."
    2: "Смерть и налоги"
  "643":
    1: "Банки — это безопасное место для хранения денег. Если у вас нет собственного надежного и охраняемого сейфа, лучший вариант — положить деньги в банк. Вы не будете получать проценты на свои деньги, но, поскольку банки не выдают кредиты, вам не придется беспокоиться о том, что вы их потеряете."
    2: "Банки"
  "644":
    1: "Одними из немногих экспортных товаров, которыми славятся острова Регна, помимо пиратства, являются сахар, какао и корица. Если бы не они, я бы предложил отправить Храм Баа на Регну и пусть они потопят все эти острова!"
    2: "Травы из Регны"
  "645":
    1: "В разных тавернах цены на еду различаются, но не дайте себя обмануть. Более дорогая еда, как правило, хранится дольше, чем более дешёвая. Важно запастись едой, которая долго сохранится, если вы планируете находиться вдали от дома в течение длительного времени."
    2: "Цены на продукты"
  "646":
    1: "Не могу сказать, что я много знаю о путешествиях по воде, но, насколько я слышал, добраться до островов можно либо на корабле, либо «ходя по воде». У всех кораблей сложные маршруты — перед бронированием билетов обязательно уточните у судоходной компании, когда они совершают обратные рейсы!"
    2: "Путешествия по островам"
  "647":
    1: "Очень жаль, что Кэтрин пришлось уехать на похороны отца так скоро после смерти Роланда. Эта бедная женщина пережила слишком много трагедий за слишком короткий срок. Ещё печальнее то, что она оставляет Николая здесь на время своего отсутствия. Он слишком молод, чтобы справляться со всем этим в дополнение к кризисам, поразившим королевство."
    2: "Кэтрин"
  "648":
    1: "Гильдия некромантов впервые появилась на публике во время краткого правления Арчибальда 10 лет назад. До этого они существовали, но держались в тайне, понимая, что люди не примут их с пониманием. Когда Роланд стал королём, он объявил гильдию вне закона и приказал арестовать её лидеров. Однако ни один из них не задержался достаточно долго, чтобы это произошло, и теперь их нигде не найти."
    2: "Некроманты"
  "649":
    1: "Существует множество островов, добраться до которых можно только с помощью лодки в сочетании с заклинанием «Хождение по воде». На многих из них обитают самые ужасные чудовища, но зачастую именно там можно найти самые ценные сокровища."
    2: "Острова"
  "650":
    1: "Драконы — не только искусные бойцы, но и хитрые чародеи. Мало кто осознает, насколько хорошо драконы владеют магией, и многие самонадеянные воины оказываются не готовы к столкновению с их истинной силой."
    2: "Драконы"
  "651":
    1: "Эратия находится за пределами даже максимальной дальности действия «Городского портала». Этот континент расположен на расстоянии шести недель морского путешествия. Между нами и ним расположено множество островов и субконтинентов, на которых обитают мелкие королевства и племена, стремящиеся лишить путешественников ценностей, свободы или жизни."
    2: "Эратия"
  "652":
    1: "За время своих путешествий я видел немало демонов, и вид их вызывает страх. Мне приходилось спасать нескольких человек от нападений демонов, и я был поражён их слаженностью и мастерством в бою. Должно быть, они прошли отличную подготовку, раз так искусно владеют своим делом."
    2: "Дьяволы"
  "653":
    1: "Боюсь, что «Ночь падающих звёзд» была предзнаменованием самого худшего рода. Ведь после той ночи наш добрый король очень скоро исчез, а Храм Баа появился, не так ли? И все эти разговоры о демонах на западе… это действительно зловещие предзнаменования!"
    2: "Ночь падающих звезд"
  "654":
    1: "Однажды меня нанял один дворянин, чтобы я развлекал его и его жену на озере Стар, играя музыку, пока они устраивали пикник на лодке. Когда мы приблизились к южной оконечности острова в центре озера, мы увидели на берегу острова самое отвратительное чудовище — женщину с змеями вместо волос. Она бросила один взгляд на моих благородных покровителей, и они на моих глазах превратились в камень. Я едва успел отгрести прочь, чтобы не присоединиться к ним."
    2: "Медузы"
  "655":
    1: "Заклинания полета позволяют преодолевать горы, стены и другие подобные препятствия. Однако существует ограничение на высоту, на которую можно подняться с помощью заклинания «Полёт». Некоторые вершины возвышаются слишком высоко, чтобы их можно было преодолеть с помощью магического полета."
    2: "Заклинания полета"
  "656":
    1: "Харек IX, наверное, лучший лидер в мире. Он не только единственный император в мире, но и единственный лидер, о котором я когда-либо слышал, который занимается обычной работой, как и остальные его подданные. Например, когда нужно взимать налоги с грузовых перевозок, Харек работает бок о бок с нами. Выгрузка грузов, драки, ругань, выпивка — что угодно. Харек — настоящий император с ногами на земле."
    2: "Харек IX"
  "657":
    1: "Каждый оруженосец знает, что сломанное оружие бесполезно. Каждый воин должен уметь ремонтировать своё снаряжение, иначе он будет зависеть от графика работы кузнецов. Умение ремонтировать оружие — неотъемлемая часть овладения им."
    2: "Ремонт"
  "658":
    1: "Из всех злонамеренных злодеев в мире некроманты — безусловно, самые страшные. Их «наука» появилась совсем недавно, и они знают ровно столько, чтобы навлечь беду на себя и на весь остальной мир."
    2: "Призраки"
  "659":
    1: "Отдых восстанавливает силы тела и духа. Кемпинг даёт вам возможность расслабиться, пообщаться, отпраздновать что-нибудь… просто немного отдохнуть и избавиться от стресса и забот, накопившихся за день."
    2: "Отдых"
  "660":
    1: "Один мудрый переговорщик однажды сказал: «Если речь идет о том, что лучше — быть любимым или вызывать страх, выбирай и то, и другое. Но если приходится выбирать между ними, выбирай страх». Слова, которыми стоит руководствоваться, мой друг. Слова, которыми стоит руководствоваться."
    2: "Страх и любовь"
  "661":
    1: "На севере нередко бывает, что состоятельные бизнесмены, чтобы удержать свои позиции на рынке, нанимают головорезов для устранения конкурентов. Торговые войны могут превращаться в настоящие войны. Лучше не ввязываться ни в какие коммерческие споры."
    2: "Организованная преступность"
  "662":
    1: "Некоторые из лучших учителей по восприятию и вскрытию замков можно встретить в гильдиях воров."
    2: "Гильдии воров"
  "663":
    1: "Даже если король Роланд совершил что-то плохое, из-за чего небеса отвернулись от него, я не думаю, что его сын Николай заслуживает такого. В конце концов, ему всего десять лет. Может быть, небеса проявят к нему милость и дадут ему божественное поручение править мудро. Было бы неплохо."
    2: "Николай Айронфист"
  "664":
    1: "Я не могу покинуть города и замки, не рискуя, что какой-нибудь разбойник отнимет у меня те немногие деньги, которые мне удаётся накопить. Почему стражники не могут что-нибудь сделать с этими разбойниками?"
    2: "Бандиты"
  "665":
    1: "Поставки индиго из Регны были прекращены десять лет назад, когда король запретил торговлю с этим пиратским королевством. Я понимаю, почему он так поступил, но мне уже надоела эта нехватка индиго. Я не могу покрасить ничего в синий или фиолетовый цвет!"
    2: "Индиго"
  "666":
    1: "Чего вы от меня хотите? Я всего лишь работник; я здесь не для того, чтобы вас развлекать."
    2: "Развлечения"
  "667":
    1: "В последнее время действительно много дождей. Было бы ужасно, если бы в облаках не осталось дождя, а реки пересохли из-за того, что вся вода была израсходована во время этих ливней. Если бы все реки пересохли, я бы оказался в бедственном положении!"
    2: "Реки"
  "668":
    1: "Сундуки и ящики — не единственные места, где могут храниться сокровища. В бочках тоже могут быть ценности, так что не забудьте их тоже обыскать."
    2: "Бочки"
  "669":
    1: "Задержились поставки из Эратии — именно оттуда я получаю все краски, необходимые для моей работы. Это та страна, откуда родом королева. Интересно, там что-то не так?"
    2: "Краски"
  "670":
    1: "Не знаю, кто их шьёт, но у каждого жреца Баа есть плащ с символом Баа. Хотел бы я заниматься пошивом всех этих плащей — я бы разбогател!"
    2: "Плащи Баа"
  "671":
    1: "История — это звук тапочек на мягкой подошве, спускающихся по лестнице, в то время как ботинки с гвоздиками поднимаются по ней."
    2: "Подбитые гвоздями сапоги"
  "672":
    1: "Мне бы очень хотелось научиться делать что-нибудь, кроме рытья канав, но я просто не достаточно сообразительный."
    2: "Повышение"
  "673":
    1: "В этом году мука начинает портиться раньше обычного, хотя я храню её должным образом в герметичных ёмкостях. Интересно, в чём же дело?"
    2: "Мука"
  "674":
    1: "Не забывайте, что вещи можно хранить в шкафах. Сундуки — не единственное место, где можно хранить свои сокровища."
    2: "Шкафы"
  "675":
    1: "Дороги Энрота вымощены плитняком, добытым на холмах недалеко от Кригспайра. Их уложили давным-давно первые поселенцы Энрота, и эти самые первые дороги до сих пор не подверглись ни эрозии, ни каким-либо другим разрушениям. Очень странно."
    2: "Плиты"
  "676":
    1: "Как называется нервная волшебница? «Твич»!"
    2: "Анекдот дня"
  "677":
    1: "Нас ждут мрачные дни, запомните мои слова! Никогда ещё я не видел столько монстров и так мало игрового контента."
    2: "Тёмные дни"
  "678":
    1: "Нет ничего хуже, чем пытаться попрошайничать возле Серебряной бухты. Все люди там такие жадные!"
    2: "Серебряная бухта"
  "679":
    1: "«Гильдия Теней» — лучшее место, где можно найти покупателя, готового принять украденный скот. Нет ничего, на что бы они не пошли! Они просто великолепны, да и берут меньше, чем обычная Гильдия воров. Обязательно попробуйте их услуги!"
    2: "Подземный мир"
  "680":
    1: "Учитывая нехватку животных и все эти проблемы, которые возникли в последнее время, мне, наверное, стоит просто стать охотником за головами. Наверное, я смог бы разбогатеть, выслеживая всех нарушителей закона."
    2: "Охотник за головами"
  "681":
    1: "Самым требовательным хозяином, на которого приходится работать, является Осрик Темпер. Никто другой так много не кричит и не говорит так быстро во время диктовки. Но я должен сказать: из всех лордов он — единственный, кто, похоже, держит под контролем ситуацию с дьяволами, которая, как мы все знаем, чрезвычайно серьезна. Работать на него, безусловно, неприятно, но он искренне заботится об интересах королевства."
    2: "Запись под диктовку"
  "682":
    1: "Вы сегодня разговаривали с Баа? Позвольте мне помочь вам разобраться в ваших проблемах и показать вам лучший выход из ситуации; это займет у вас совсем немного времени."
    2: "Баа"
  "683":
    1: "Многие жалуются на налоги, но я просто хочу сказать, что они мне нравятся. Как бы могли работать административные органы без налоговых поступлений? Как бы люди получали разрешения и лицензии без нас?"
    2: "Налоги"
  "684":
    1: "Башни, расположенные за пределами городов, обстреливают летающих существ, с которыми нам обычно трудно справиться."
    2: "Драконьи башни"
  "685":
    1: "Большинство людей не доверяют Николаю. Готов поспорить с тобой с коэффициентом 3 к 1, что его выгонят до его следующего дня рождения. Что скажешь?"
    2: "Династия Айронфистов"
  "686":
    1: "Я очень надеюсь, что королева скоро вернётся из поездки на родину. Даже если она и иностранная королева, она всё же привнесёт хоть какое-то подобие порядка в наше осаждённое королевство."
    2: "Королева Екатерина"
  "687":
    1: "Никто не знает, где находится Верховный храм Баа, но я слышал, что туда допускаются только полноправные жрецы и высокопоставленные храмовые чиновники."
    2: "Верховный храм"
  "688":
    1: "Есть ли у гоблинов имена? Или семьи? Почему они злые?"
    2: "Гоблины"
  "690":
    1: "Знаете, металл для оружия и доспехов раньше стоил гораздо дешевле, пока Снергл не отнял трон у Роклина, старого короля гномов. Было бы неплохо, если бы кто-нибудь устроил Снерглу хорошую взбучку."
    2: "Гномы"
  "691":
    1: "Став членом гильдии того или иного магического направления, вам не придётся постоянно приобретать членство в различных отделениях одной и той же гильдии. Например, члену Гильдии Огня не нужно приобретать членство в другой Гильдии Огня, чтобы воспользоваться её услугами."
    2: "Магические гильдии"
  "692":
    1: "Альберт Ньютон — Повелитель Тумана, и он поистине покровитель всех, кто дорожит мистическими искусствами. Если у вас есть вопрос о магии, ответ на него вы найдете именно в Тумане."
    2: "Остров тумана"
  "693":
    1: "Будьте осторожны при путешествии по болотам к югу от замка Темпер. Говорят, что там свободно бродят нежить, не боящаяся ни живых, ни солнца."
    2: "Болота"
  "694":
    1: "Я ни разу такого не видел, но слышал рассказы о волшебных порталах — дверях, — которые мгновенно переносят из одной части Энрота в другую. Это же лишило бы путешествия всего удовольствия, не так ли?"
    2: "Волшебные порталы"
  "695":
    1: "Как и следует из названия, в Драконьем Песке полно и драконов, и песка. Думаю, самые могущественные драконы вполне способны противостоять демонам, иначе те уже давно захватили бы пустыню."
    2: "Драконий песок"
  "696":
    1: "Говорят, что на одном из островов к востоку от Свободной гавани спрятан зарытый клад пирата Сильвеки. Я знаю, что таких историй пруд пруди, но клянусь, эта — правда! Если бы только удалось найти карту…"
    2: "Зарытое сокровище"
  "697":
    1: "Остров Отшельника — довольно большой вулканический остров на юго-западе Энрота. Туда никто не заходит, и он ещё более бесплоден, чем даже пустоши. Своё название он получил, когда лорд Терранс в шутку заметил, что там, наверное, живёт отшельник, уединившийся от всего мира."
    2: "Остров отшельника"
  "698":
    1: "К счастью, все некроманты в Королевстве были изгнаны, за исключением тех, кто зашел слишком далеко в своём чёрном искусстве и превратился в личей. Самый опасный из этих личей — бывший генерал Арчибальда лорд Корлагон — обосновался в юго-восточной части «Болота Проклятых»."
    2: "Некромантия"
  "699":
    1: "Действительно можно смешивать сложные зелья с простыми или другими сложными зельями, чтобы попытаться создать зелья повышенной сложности. Хотя зелья повышенной сложности являются самыми мощными из всех возможных, этот процесс сопряжён с опасностью. Смешивание неподходящих зелий может вызвать бурные реакции и привести к опасным взрывам."
    2: "Основы алхимии"
  "700":
    1: "Я знаю только один рецепт сложного зелья — это смешивание сложного зелья с простым или другим сложным зельем. Смешайте зелье сопротивления с зельем от яда, затем возьмите полученное зелье и смешайте его с зельем защиты — в результате вы получите зелье божественного исцеления."
    2: "Продвинутая алхимия"
  "701":
    1: "Гильдии воров и наемников — это места, куда можно обратиться, чтобы освоить самые разные навыки. В разных гильдиях преподают разные навыки, поэтому, если в одной из них нет того, что вам нужно, попробуйте обратиться в гильдии в другом городе."
    2: "Гильдии воров и наемников"
  "702":
    1: "Задания — это не волшебство, а возможности: возможность многому научиться или хорошо заработать. Старайтесь не упускать выпавшие шансы."
    2: "Задания"
  "703":
    1: "Постарайтесь вооружить всех членов вашей группы луком, арбалетом или каким-либо другим оружием дальнего боя. Вы сможете нанести противнику значительный урон, пока он приближается к вам, а оружие дальнего боя позволит вам атаковать летающих существ, которым иначе было бы невозможно нанести урон."
    2: "Луки"
  "704":
    1: "Большинство воинов предпочитают осваивать различные виды оружия. Как правило, один вид оружия осваивается лучше других, но практически ни один из них не игнорируется. Это обеспечивает большую гибкость в бою, поскольку позволяет использовать то оружие, которое наиболее эффективно против конкретного противника."
    2: "Обобщение"
  "705":
    1: "Некоторые монстры обладают устойчивостью практически ко всем магическим заклинаниям. Если вам встретится один из таких монстров, не отчаивайтесь — используйте свою магию, чтобы исцелить воинов и усилить их удары."
    2: "Сопротивление магии"
  "706":
    1: "Альберт Ньютон — блестящий исследователь в области магии, но его исследования, как правило, занимают очень много времени. Тем не менее, он, безусловно, знает немало о чародеях и их магии. Если у вас есть какие-либо вопросы по этому поводу, обращайтесь именно к нему."
    2: "Альберт Ньютон"
  "707":
    1: "Я слышал легенды о могущественном магическом посохе, который увеличивает магические запасы и может наносить удары так же быстро, как сам ветер."
    2: "Волшебные посохи"
  "708":
    1: "В универсальных магазинах покупают практически всё, но цены там просто ужасные. Если в окрестностях нет других магазинов, а вам нужно быстро что-то продать, то, конечно, обращайтесь туда. Но если с продажей можно подождать, то выгодно будет продать товар в специализированном магазине."
    2: "Универсальные магазины"
  "709":
    1: "Не все магазины одинаковы! В одних продаются товары низкого качества, а в магазинах других городов можно найти отличные вещи. Вам придётся посмотреть вокруг и самостоятельно найти хорошие магазины, но помните: вы получаете то, за что платите. Отличное снаряжение никогда не бывает дешёвым."
    2: "Магазины"
  "710":
    1: "Это отвратительное место — центр самых тяжких преступлений против природы, которые совершает Гильдия некромантов. Мой разведчик категорически советует: держаться подальше, держаться подальше, держаться подальше!"
    2: "Замок Даркмур"
  "711":
    1: "Городские советы всегда ищут людей, которые могли бы выполнять для них мелкие поручения. Если вам нужны небольшие дополнительные деньги, попробуйте зайти к ним и поинтересоваться работой. Есть большая вероятность, что у них найдется для вас что-нибудь подходящее."
    2: "Городские советы"
  "712":
    1: "Ваша репутация влияет на то, как люди к вам относятся. Большинство людей не будут вам доверять и не станут делиться с вами секретами, если у вас плохая репутация. У вас будут только друзья из числа воров и им подобных, и действительно ли вы хотите, чтобы они были вашими друзьями? Чтобы укрепить свою репутацию, вам нужно помогать другим и соблюдать законы."
    2: "Репутация"
  "713":
    1: "Постарайтесь держаться поближе к трубочистам — они приносят удачу!"
    2: "Трубочисты"
  "714":
    1: "Судя по всему, появилась новая гильдия воров под названием «Гильдия Теней», которая составляет конкуренцию уже существующим гильдиям по всей стране."
    2: "Гильдия воров"
  "715":
    1: "Я только что купил право собственности на мост через реку Уайт-Форест. Это платный мост! Скоро я стану богатым, ведь мои профессиональные управляющие мостом будут зарабатывать деньги на сборах за проезд и перечислять их на мой банковский счет!"
    2: "Договор о мосте"
  "716":
    1: "Мне никак не удаётся устроиться на работу в замке Айронфист. Не понимаю, почему. Создается впечатление, будто они не хотят, чтобы люди ползали по замку. Может, они что-то скрывают?"
    2: "Замок «Айронфист»"
  "717":
    1: "Я путешествую с самыми разными людьми, перевозя тяжёлые грузы из одного места в другое. Но скажу вам: если вы не обладаете достаточной силой, все разбойники на дорогах облегчат ваш груз за вас. Держитесь подальше от дорог между городами, если знаете, что для вас лучше."
    2: "Дороги"
  "718":
    1: "По всей территории Энрота разбросано множество гостиниц, и, насколько я знаю, даже в западных краях есть несколько, которые с трудом сводят концы с концами. Именно в них можно без труда перекусить и безопасно переночевать."
    2: "Гостиницы"
  "719":
    1: "Вы когда-нибудь замечали, что стоимость заклинания «Воскрешение» в храме точно равна всему золоту, которое было у вас при смерти?"
    2: "Счета за воскрешение"
  "720":
    1: "Если вы найдете отличное оборудование по низкой цене, обязательно купите его. Позже вы сможете продать его с прибылью, а до тех пор, возможно, даже сможете им воспользоваться."
    2: "Инвестирование"
  "721":
    1: "За свою жизнь я приготовил немало рыбы, но ни разу не готовил одного из тех смертоносных угрей, которые кишат в водах к северу от Серебряной бухты. Я бы с удовольствием попробовал это сделать, но мало кто, вступив в схватку с этими угрями, остается в живых. Но, о, как же хочется их попробовать! Говорят, эти угри — лучший деликатес на свете!"
    2: "Рыба"
  "722":
    1: "Никогда не оставайтесь без еды! Без еды отдых не приносит никакой пользы, а в дикой местности очень легко умереть от голода, если у вас нет еды."
    2: "Продовольственное снабжение"
  "723":
    1: "Где-то там есть набор подков, которые идеально защищают копыта ваших лошадей и никогда не дают им устать! Куда бы вы только ни смогли отправиться, если бы у вас были лошади с такими качествами! Ну, что ж. Скорее всего, это всего лишь легенда."
    2: "Подковы"
  "724":
    1: "Вскоре после поражения Арчибальда мне удалось заглянуть в Королевскую библиотеку после одного из моих многочисленных выступлений в замке Айронфист. Там я увидел статую Арчибальда, выполненную с поразительной детализацией. Наверное, он заказал эту статую, когда был уверен в победе своего восстания, а Роланд сохранил её как своего рода памятный сувенир."
    2: "Статуя Арчибальда"
  "725":
    1: "Каждый маг знает — или должен знать — что некоторые заклинания и магические эффекты проявляются на рассвете и на закате. Например, «Божественное вмешательство» невозможно в любое другое время."
    2: "Рассвет и закат"
  "726":
    1: "Говорят, что на одном из островов к востоку от Свободной гавани спрятан зарытый клад пирата Сильвеки. Я знаю, что таких историй пруд пруди, но клянусь, эта — правда! Если бы только удалось найти карту…"
    2: "Зарытое сокровище"
  "727":
    1: "Старые «Башни Дракона» были построены для защиты городов от летающих существ, но они сбивают всё, что летит в пределах их досягаемости."
    2: "Драконьи башни"
  "728":
    1: "Хотя Церковь Луны прославляла тёмную сторону человеческой натуры, это не значит, что из их зла не могло родиться добро, точно так же, как из добра Церкви Солнца родилось зло. В период своего расцвета Церковь сумела создать артефакты огромной силы — «Плащи Судного дня». Если вам когда-нибудь попадётся один из них, не выбрасывайте его! Все они обладают огромной силой и имеют огромную ценность."
    2: "Храм Луны"
  "729":
    1: "«Маяк Ллойда» — отличное заклинание для выполнения поручений: оно позволяет устанавливать маяки, к которым можно телепортироваться обратно. Хотя маяки действуют не бесконечно, при правильном планировании их действия хватает на то, чтобы успеть выполнить все дела."
    2: "Маяк Ллойда"
  "730":
    1: "Приготовить целебное зелье — дело несложное, если у вас есть ингредиенты. Все, что вам понадобится, — это ягоды «видвипс» и фляжка с водой. Просто смешайте ягоды с водой — и вуаля! Готово: мгновенное целебное зелье! Если под рукой нет воды, можно просто съесть ягоды, но эффект будет не таким сильным."
    2: "Целебные зелья"
  "731":
    1: "До «Ночи падающих звёзд» Свит-Уотер был отличным местом для моих выступлений. Теперь дорога в этот город кишит дьяволами, и говорят, что самого города уже нет."
    2: "Гибель Свит-Уотер"
  "732":
    1: "На остров Отшельника, названный лордом Террансом так из-за его удаленности, трудно добраться из-за бурных вод к югу от Энрота."
    2: "Остров отшельника"
  "733":
    1: "Многие хотели бы вторгнуться в Регну и захватить её пряности, металлы и сокровища. Единственное, что все эти годы позволяло Регне оставаться свободной, — это её внимание к науке о металлообработке и продажа оружия во все страны мира. Все критикуют Регну за это, но при этом все покупают регнское оружие. Говорят одно, а делают другое — вот чем занимаются эти лицемеры!"
    2: "Кузницы Регны"
  "734":
    1: "Как бы я хотел принять участие в экспедиции Роланда! Вот что такое настоящая отвага… Как великолепно, наверное, выглядел тот отряд — в доспехах и с оружием, сверкающим на солнце. Лучше умереть доблестно на поле боя вместе со своим господином, чем скончаться ночью, замерзшим и в одиночестве."
    2: "Экспедиция Роланда"
  "735":
    1: "Над астрологией часто насмехаются, но я вам говорю: это очень реальная и важная наука. Самым значительным астрологическим событием за последнее время стала та падающая звезда, которая упала с неба из созвездия Стрельца. Это предвещает потрясения, бедствия и новые возможности для всего мира."
    2: "Астрология"
  "736":
    1: "Торговцы на северо-востоке не гнушаются нанимать людей, чтобы их конкуренты не были слишком сильными. Мы стараемся обходить эти районы стороной и не ввязываться в какие-либо мелкие местные разборки."
    2: "Организованная преступность"
  "737":
    1: "Обратите внимание на то, как человек вас приветствует, чтобы понять, как с ним поступать, если он окажется не склонным к сотрудничеству. Вы обнаружите, что многие люди, у которых схожие интересы и профессии, будут одинаково реагировать на ваши попытки — будь то просьбы, подкуп или угрозы."
    2: "Умение слушать"
  "738":
    1: "Никому не говори, что я тебе это рассказал, но Роланд не умер. Ему просто понадобился отдых от всех тягот королевской жизни, и сейчас он скрывается на курортном острове Абдула под вымышленным именем."
    2: "Роланд"
  "739":
    1: "Чтобы такие, как я, не добрались до их вещей, люди часто устанавливают на сундуках замки."
    2: "Обезвреживание ловушек"
  "740":
    1: "Погода в последнее время действительно странная. Ведь в июне прошлого года даже выпал снег! Снег в июне — кто бы мог такое предположить? Снег летом — это дурной знак."
    2: "Погода"
  "741":
    1: "Несмотря на все мои проблемы, по крайней мере Храм Баа заботится обо мне и помогает мне. В отличие от нашего нынешнего правительства."
    2: "Храм Баа"
  "742":
    1: "Сапоги — это прерогатива сапожников, и я не слишком в них разбираюсь, но скажу, что не стоит недооценивать их полезность. Они могут значительно повысить ваш общий уровень защиты в бою. Каждый должен носить сапоги."
    2: "Сапоги"
  "743":
    1: "Полагаю, что в ближайшем будущем большая часть моей работы будет заключаться в том, чтобы копать могилы людям, убитым демонами."
    2: "Могилы"
  "744":
    1: "Я даже не знаю, с чего начать, чтобы описать, насколько ужасно в последнее время выросли цены на овощи и фрукты на рынке. Мне кажется, кто-то искусственно занижает цены! Если так будет продолжаться ещё долго, я разорюсь!"
    2: "Цены на сельскохозяйственную продукцию"
  "745":
    1: "Будьте осторожны, пья жидкости, оставшиеся в бочках; никогда не знаешь, сколько времени они там простояли. От такого можно заболеть."
    2: "Жидкости"
  "746":
    1: "Колесо вращается самым удивительным образом. Иногда мне кажется, что если бы все нашли минутку и понаблюдали за тем, как вращается колесо, они успокоились бы и реже ссорились друг с другом. Но никто меня не слушает. Я всего лишь скромный гончар."
    2: "Узоры вращения"
  "747":
    1: "Одно дело — сшить одежду, но настоящая красота, как правило, заключается в том, чтобы окрасить её в интересные цвета."
    2: "Красители"
  "748":
    1: "То, что наш король пропал, — это ужасно, но, должно быть, такова воля богов. Ведь как может произойти что-то, что не является волей богов?"
    2: "Воля богов"
  "749":
    1: "Лорд Темпер даже не разрешает мне стать рыцарем. Он сказал, что я недостаточно умен, чтобы выполнять указания."
    2: "Осрик Темпер"
  "750":
    1: "Мыши и крысы — это настоящая беда для человечества! Я слышал, что в крепости недалеко от Нью-Сорпигала обитают самые огромные крысы в мире. <вздрогнув> Да не придется мне никогда в жизни видеть такие ужасы!"
    2: "Мыши"
  "751":
    1: "Теперь, когда весь Блэквуд разрушен, в Энроте начнётся острая нехватка древесины. Возможно, вскоре разразится новая «Древесная война»."
    2: "Блэквуд"
  "752":
    1: "Гробница Этрика Безумного — настоящее чудо искусства резьбы по камню. Мой дед участвовал в её строительстве. Он говорит, что в гробнице есть несколько очень искусно замаскированных потайных дверей. Почему Этрику было дело до того, потайная дверь или нет, мне непонятно, но, ну что ж… он был и богат, и безумен. Наверное, он мог делать всё, что ему заблагорассудится."
    2: "Гробница Этрика"
  "753":
    1: "Почему у гоблинов не получается разводить кур? Они зарывают яйца слишком глубоко!"
    2: "Анекдот дня"
  "754":
    1: "Единственное, что можно назвать хорошим в эти дни, — это холодная погода. У всех животных действительно густая и ценная шерсть. Проблема только в том, чтобы их найти. По-моему, монстры съели большую часть животных с хорошей шерстью."
    2: "Мех"
  "755":
    1: "Между нами говоря, я видел оборотня, когда сам был оборотнем в Блэкшире! Я верю во все слухи об их проклятии."
    2: "Блэкшир"
  "756":
    1: "Когда кража скота становится слишком рискованной, я обычно провожу время, охотясь на землях какого-нибудь лорда. Поскольку большинство людей боятся там охотиться, эти леса не подвергались чрезмерной охоте. Однако в последнее время дичи стало все меньше. Возможно, это как-то связано с западной гнилью."
    2: "Браконьерство"
  "757":
    1: "В некоторых местах охотиться на дичь бывает сложно. Например, путешествуя по болотам, пустыням или снегу, нужно брать с собой больше еды."
    2: "Дичь"
  "758":
    1: "Уилбур Хамфри несколько раз нанимал меня для ведения записей о сообщениях о бедствиях, поступающих со всех концов королевства. Мне кажется, что с момента исчезновения короля количество бедствий резко возросло."
    2: "Записи"
  "759":
    1: "Принц слишком молод, чтобы управлять королевством. Уилбур Хамфри должен править королевством самостоятельно, а не от имени ребёнка."
    2: "Николай"
  "760":
    1: "Если вам когда-нибудь понадобится работа, просто загляните в офис городского совета в одном из крупных городов. Там обычно найдется какая-нибудь работа, которую нужно выполнить."
    2: "Городские советы"
  "761":
    1: "Слухи о крахе династии и все эти бедствия пробудили в людях самое худшее. Мне нужно быть ещё более бдительным, чем обычно, чтобы сохранить мир."
    2: "Беспорядки"
  "762":
    1: "Поверьте мне: если вам нужен талисман на удачу, держитесь поближе к трубочисту. Конечно, их шутки могут раздражать, но это самые удачливые люди, которых я знаю."
    2: "Трубочист"
  "763":
    1: "Я слышал слухи, что недавние явления «зимы летом» были вызваны озорными колдунами, которые научились вмешиваться в погоду. Думаю, это часть заговора, цель которого — вызвать массовую истерию и открытое восстание против короля."
    2: "Саботаж лета"
  "764":
    1: "Те «дьяволы», о которых все говорят, что они сеют хаос на Западе, просто неправильно поняты. Баа говорит, что они — наши друзья. Просто нужно относиться к ним с уважением и убегать от них, если увидишь, что они приближаются. Им нужно много личного пространства, и они злятся, если его не получают. Но это только потому, что они — высшие существа. Если бы мы были высшими, всё это было бы легче понять."
    2: "Дьяволы"
  "765":
    1: "Я бы с удовольствием поплавал по океанам на большом корабле. Я мог бы побывать на всех островах и просто отдохнуть от школы, домашних дел и родителей. Это было бы просто замечательно!"
    2: "Лодки"
  "767":
    1: "Практически любой дракон, у которого есть логово, просто завален золотом. Они добывают его у всех тех паладинов, которые пытаются убить их, чтобы прославиться."
    2: "Золото драконов"
  "768":
    1: "Некоторые из магических предметов, которые вы найдёте по всему миру, прокляты. Почти ни один из них не является чистым проклятием, но у многих есть побочные эффекты, которые вам вряд ли понравятся. Прежде чем использовать какой-либо предмет, вам следует тщательно взвесить его побочные эффекты и преимущества."
    2: "Проклятые предметы"
  "769":
    1: "Конечно, вы знаете, что заклинания, произносимые в полдень, черпают свою силу непосредственно из солнца. Именно благодаря этому самые могущественные маги могут позволить себе зарядить магической энергией предметы, которые вы находите по всей земле Энрот."
    2: "Полдень"
  "770":
    1: "Пустыня — это земля, которую следует избегать всем, кроме самых могущественных волшебников и рыцарей. Здесь полно великанов и драконов, и почти все, кто туда отправляется, не возвращаются. Ходят слухи, что в странной пирамиде, расположенной в пустыне, хранятся невообразимые богатства и тайны, которые ждут, когда их раскроют отважные души."
    2: "Пустыня"
  "771":
    1: "Перевал, ведущий к Уайт-Кэпу и Касте-Стромгарду, недавно был захвачен группой огров и алчных людей, действующих сообща."
    2: "Перевал Ледяного Ветра"
  "772":
    1: "Я слышал рассказы об ужасном проклятии, которое обрушилось на этот город. Однако каждый раз, когда я бываю здесь, всё выглядит совершенно нормально."
    2: "Блэкшир"
  "773":
    1: "Хотя в настоящее время ни одна судоходная компания не предлагает такую услугу, до Эратии — родины королевы Кэтрин Айронфист — можно добраться за три недели или около того, в зависимости от сезона. Я там никогда не был, но, как говорят, там неплохо."
    2: "Эратия"
  "774":
    1: "Плыть по воде — это, конечно, неплохо, но ничто не сравнится с хорошим кораблём и хорошей командой. Вы не только движетесь медленнее, чем корабль, но и должны беспокоиться о том, что действие заклинания может закончиться, а также опасаться атак морских змей. Лодки — лучший способ путешествовать по воде."
    2: "Ходьба по воде"
  "775":
    1: "По-настоящему хорошо отдохнуть можно только в уютном месте, например, в гостинице. Там вы сможете восстановить утраченные силы и магию, а также залечить большинство ран. Если вам приходится отдыхать в дикой местности, обязательно запаситесь достаточным количеством еды! Голодные люди не получают никакой пользы от отдыха."
    2: "Отдых"
  "776":
    1: "Хотя «Целебное прикосновение» и не столь эффективно, как другие заклинания исцеления, оно относится к школе духа, что облегчает его изучение для паладинов. Кроме того, заклинания, воздействующие на тело, не действуют в определённых местах, поэтому вам придётся использовать «Целебное прикосновение» вместо таких заклинаний, как «Первая помощь» или «Мощное исцеление»."
    2: "Целебное прикосновение"
  "777":
    1: "«Общая жизнь» — отличный способ сохранить жизнь слабым членам отряда, когда на ваш отряд обрушиваются заклинания с зоной действия. Это заклинание в сочетании с «Мощным исцелением» поможет сохранить всех в живых, когда ситуация выходит из-под контроля."
    2: "Общая жизнь"
  "778":
    1: "Многие наставники не хотят отбиваться от толп учеников и потому селятся в глуши. Возможно, вам придётся долго их искать. Обычно наставники-эксперты знают, где найти наставников-мастеров."
    2: "Учителя"
  "779":
    1: "Слава — это, во многом, совокупность пережитых вами приключений и того, как вам удалось поделиться ими с другими. Задания и отважные поступки в борьбе с монстрами могут принести вам славу."
    2: "Слава"
  "780":
    1: "Лично для меня любимым оружием является булава. Когда освоишь её, научишься наносить удары по твёрдым частям тела противника так, чтобы удар отскакивал, а не вонзался. Это экономит время. В любом случае, когда кого-то ударяют булавой, он может оказаться настолько оглушённым, что перестаёт сопротивляться. И это прекрасно."
    2: "Слава булавы"
  "781":
    1: "Никогда не стоит недооценивать посох! Большинство людей ассоциируют посох с магом, но это не всегда так. Хотя с посохом нельзя использовать щит, по мере роста вашего мастерства вы поймёте, что посох — лучшее защитное оружие из всех существующих. Более того, он достаточно тяжёлый, чтобы оглушать противников при ударе. Это одно из лучших универсальных видов оружия."
    2: "Посохи"
  "782":
    1: "Во всех школах магии насчитывается по одиннадцать заклинаний, но в гильдиях тьмы можно найти лишь десять. Пропавшее одиннадцатое заклинание называется примерно так: «Тёмное удержание» или «Тёмное сдерживание». Похоже, ни один из ныне живущих не овладел им, и гильдии очень стремятся его найти."
    2: "Тёмное сдерживание"
  "783":
    1: "Элементали — это существа, созданные магами для охраны определённых территорий или предметов и состоящие из одной из четырёх основных стихий: воздуха, земли, огня или воды. Элементали могут свободно использовать магию своей стихии, поэтому будьте осторожны, если вам придётся сражаться с ними."
    2: "Элементали"
  "784":
    1: "Арчибальд, брат Роланда, овладел многими видами магии и до своей смерти стал могущественным чародеем. Однако, похоже, никто не знает, где он похоронен. Словно он исчез после вступления Роланда на престол."
    2: "Арчибальд"
  "785":
    1: "Многие магазины в Энроте принадлежат опытным торговцам. При покупке и продаже товаров следует быть осторожным, чтобы вас не обманули."
    2: "Цены"
  "786":
    1: "Носить с собой большие суммы денег опасно. Банки предоставляют безопасное место для хранения крупных сумм. Хотя они и не начисляют проценты, зато не нужно беспокоиться о карманниках. Мне этого вполне достаточно."
    2: "Банки"
  "787":
    1: "В центре Драконьего Песка можно найти пирамиду, обозначающую «Гробницу Корабля» — так, по крайней мере, говорят. Я тщательно обшарил пустыню и не нашёл там ничего, кроме драконов и титанов, от которых приходилось спасаться бегством. Но это не значит, что её там нет… Мне пришлось убираться из той пустыни, пока ещё было как-то можно. Очень опасное место!"
    2: "Пирамида"
  "788":
    1: "Я не люблю убийц и людей с низкими нравственными качествами. И, похоже, в наши дни оба эти типа преступников распространяются по стране, как чума."
    2: "Низкий уровень нравственности"
  "789":
    1: "С некоторыми существами, с которыми вам придётся столкнуться, можно договориться, если у вас есть заклинание «Устрашение». Вы сможете избежать ненужных и бесполезных ранений, отпугнув врагов, а не вступая с ними в прямой бой."
    2: "Монстры"
  "790":
    1: "Иногда бандиты и разбойники принимают вас в свои ряды, если не считают вас «законопослушными гражданами». А вот слабых грабят всегда."
    2: "Разбойники"
  "791":
    1: "При открывании некоторых замков следует проявлять осторожность. Многие люди не считают замок достаточным сдерживающим фактором, поэтому устанавливают на дверях или сундуках ловушки, чтобы отпугнуть или убить потенциального вора."
    2: "Ловушки"
  "792":
    1: "Все по-настоящему страшные бедствия начали происходить после «Ночи падающих звёзд» два года назад. С тех пор почти ничего хорошего не происходило, за исключением Храма Баа. Там действительно помогают людям. Ещё говорят, что король Роланд, должно быть, совершил что-то ужасное, ведь те звёзды были ангелами-мстителями, спустившимися с Небес, чтобы наказать нечестивых."
    2: "Падающие звезды"
  "793":
    1: "Позвольте мне раскрыть вам секрет. Такого понятия, как «удача», не существует. Вы сами создаете себе удачу, исходя из своего мировоззрения. Если вы ожидаете, что произойдет самое худшее, то, скорее всего, так и будет, и вам придется несладко. Если же вы смотрите на жизнь с оптимизмом и надеетесь на лучшее, то, как правило, оно и сбывается."
    2: "Удача"
  "794":
    1: "В снегу трудно передвигаться. Хорошо, что рядом есть такие люди, как я!"
    2: "Снег"
  "795":
    1: "Отдых позволяет встретить новый день с энергией и энтузиазмом. Отдых залечит ваши раны и восполнит ваши магические силы. Ничто так не завершает тяжёлый день, как уютный лагерь, вкусный ужин и тлеющий костёр."
    2: "Польза отдыха"
  "796":
    1: "Вы когда-нибудь мечтали найти огромное сокровище? Я — да. Говорят, что существует три по-настоящему грандиозных сокровища: первое — это знания, хранящиеся в Королевской библиотеке; второе — сокровище, к которому ведут обелиски; а третье — в подвале Лоретты Флейз!"
    2: "Фортуна"
  "797":
    1: "Я не уверен, что города на западе вообще ещё существуют. Торговцы туда не ездят, и из тех краёв пока никто не возвращался. По-моему, цивилизация заканчивается в Блэкшире, да и люди там порой ведут себя довольно странно."
    2: "Западные районы"
  "798":
    1: "Возможно, это и не кажется чем-то особенным, но я люблю дополнять свои блюда свежими фруктами. Если присмотреться, их можно найти почти везде — они просто растут на деревьях. Фруктовые деревья выручали меня, когда я был голоден и у меня не было денег, и они могут помочь и вам."
    2: "Плодовые деревья"
  "799":
    1: "По-моему, существует заклинание, которое позволит тебе создавать еду для себя из воздуха, но я не могу себе представить, чтобы еда, приготовленная с помощью магии, была особенно вкусной."
    2: "Заклинание создания пищи"
  "800":
    1: "Наверное, у тебя нет никаких новостей о Свит-Уотере, да? Никто из моих знакомых уже целый год ничего не слышал об этом городке! Он, конечно, далеко отсюда… но целый год? Должно быть, что-то не так."
    2: "Свит-Уотер"
  "801":
    1: "Иногда я задумываюсь о совете. Принятые им решения и некоторые законы, принятие которых они затягивают, действительно привели к хаосу в нашем районе. Они затягивают любое официальное расследование смерти Роланда, и я не понимаю, почему."
    2: "Члены совета"
  "802":
    1: "На первый взгляд занятия медитацией могут показаться делом не таким уж и важным, но для опытных практиков они могут стать источником огромной магической энергии. Мастера медитации могут обладать в разы большей силой для произнесения заклинаний, чем их менее просветленные собратья."
    2: "Медитация"
  "803":
    1: "Хотя в настоящее время ни одна судоходная компания не предлагает такую услугу, до Эратии — родины королевы Кэтрин Айронфист — можно добраться за три недели или около того, в зависимости от сезона. Я там никогда не был, но, как говорят, там неплохо."
    2: "Эратия"
  "804":
    1: "Лучшее, что может быть после полёта, если вы упали со скалы или с подобной высоты: заклинание «Пёренчатое падение» не даёт вам возможности управлять падением, но, безусловно, спасает вам жизнь."
    2: "Плавное падение"
  "805":
    1: "Легенде о Переправе уже более тысячи лет, но это не мешает людям время от времени её повторять. Согласно легенде, все мы — включая эльфов, гномов и гоблинов — прибыли из одного и того же места на великом корабле, который перенёс нас через пустоту между звёздами."
    2: "Переправа"
  "806":
    1: "Я слышал, что в Энроте существуют порталы, позволяющие перемещаться между двумя фиксированными точками. Знание о них открыло бы ещё один отличный и быстрый способ передвигаться по миру."
    2: "Волшебные порталы"
  "807":
    1: "Боги следят за нашей жизнью и постоянно ведут нас к небесам и свету. Чтобы попасть на небеса, нужно лишь прислушаться к своему сердцу и поступать так, как оно подсказывает. Имей веру. Боги помогут тебе добраться туда, если ты будешь прислушиваться к ним."
    2: "Боги"
  "808":
    1: "Говорят, что в последний раз короля видели бегущим в сторону замка Кригспайр, а за ним следовала армия демонов. Он так и не вернулся. Думаю, нам, возможно, придётся смириться с тем, что наш добрый король был убит этими чудовищами."
    2: "Падение Роланда"
  "809":
    1: "Телепортация — лучший способ сократить время в пути. Конечно, на лодке или верхом на лошади тоже можно передвигаться довольно быстро, если вас ведёт опытный проводник."
    2: "Время в пути"
  "810":
    1: "Я прибыл в Энрот в то время, когда король Арчибальд пригласил регнанцев доставить партию оружия, чтобы помочь ему в борьбе против Роланда. Когда Арчибальд проиграл войну, Роланд конфисковал все корабли с оружием и запретил путешествия в Регну. С тех пор я застрял здесь."
    2: "Поставки оружия"
  "811":
    1: "Щит — самый простой элемент доспехов рыцаря — обеспечивает отличную защиту при небольшом утяжелении и весе. Ни один воин не должен обходиться без хорошего щита в бою."
    2: "Щиты"
  "812":
    1: "Съезд ведьм 638 года стал величайшим собранием колдунов и алхимиков за всю историю. С тех пор популярность магических искусств пошла на спад, а преследования таких групп, как наша… то есть, как их… значительно усилились. Это действительно ужасно."
    2: "Ведьмы"
  "813":
    1: "Торговцы — это, прежде всего, предприниматели. Они всегда будут стремиться покупать по низкой цене и продавать по высокой. Не стоит слишком на них обижаться — им тоже нужно зарабатывать на жизнь. Чтобы добиться самых выгодных цен как при покупке, так и при продаже, нужно пробовать разные рынки."
    2: "Торговцы"
  "814":
    1: "Если вы пришли к выводу, что ни уговоры, ни подкуп не помогают, и вам просто необходимо поговорить с человеком, то придется прибегнуть к едва завуалированной угрозе. Но помните: к этому средству следует прибегать с осторожностью, ведь только самые опытные дипломаты смогут предотвратить ущерб, который вы нанесете своей репутации, если угрозы станут для вас привычкой."
    2: "Угрозы"
  "815":
    1: "Николай заказал строительство моста из Нью-Сорпигала в Мист. Я работаю на него, предлагая состоятельным представителям общества возможность стать почетными членами «Братства моста Николая Айронфиста». Базовое членство предполагает размещение вашего имени на плите моста и стоит 50 000 золотых — небольшая цена за бессмертие. Вас это интересует?"
    2: "Мост"
  "816":
    1: "Фетзил, правая рука «Принца воров», — умный парень; он достаточно сообразителен, чтобы спрятаться, когда дело доходит до горячего. Его не так-то просто поймать."
    2: "Фетзил"
  "817":
    1: "Все по-настоящему страшные бедствия начали происходить после «Ночи падающих звёзд» два года назад. С тех пор почти ничего хорошего не происходило, за исключением Храма Баа. Там действительно помогают людям. Ещё говорят, что король Роланд, должно быть, совершил что-то ужасное, ведь те звёзды были ангелами-мстителями, спустившимися с Небес, чтобы наказать нечестивых."
    2: "Падающие звезды"
  "818":
    1: "Ненавижу налоги! И зачем нам вообще платить налоги? Мало того, что мне приходится всю жизнь работать на других, так я ещё и должен платить им за эту «честь»?"
    2: "Налоги"
  "819":
    1: "Хлопок растёт на Каригоре — острове, где расположены Церковь Солнца и Церковь Луны. Нигде больше он не растёт, его сложно собирать и высевать, но из него получается чудесная мягкая одежда — если, конечно, вы можете себе её позволить."
    2: "Хлопок"
  "820":
    1: "Если бы я действительно умел обращаться с оружием, мне, наверное, было бы лучше присоединиться к банде разбойников. Готов поспорить, что у них жизнь легкая."
    2: "Разбойники"
  "821":
    1: "В последнее время действительно трудно найти помощников. Что же делать добросовестному фермеру, если он не может найти крепких рабочих в период уборки урожая? Объявить банкротство и обречь себя на гибель, вот что! О, горе мне!"
    2: "Помощь на ферме"
  "822":
    1: "Мне очень хотелось бы узнать, что скажет Оракул о демонах, Храме Баа и принце Николае. Почему совет не обращается к Оракулу за советом?"
    2: "Оракул"
  "823":
    1: "Перемены витают в воздухе и несут их ветры. Их можно почувствовать и уловить. Скоро произойдёт что-то важное. Я всегда это чувствую."
    2: "Изменения"
  "824":
    1: "Даже теплая одежда не поможет вам противостоять холоду замка Даркмур. Нежить, обитающая там, одним прикосновением высасывает тепло из вашего тела."
    2: "Даркмур"
  "825":
    1: "Болезнь, поражающая сельскохозяйственные культуры и животных на западе, постепенно распространяется на восток. В первую очередь от нее страдают коровы, что приводит к очень серьезной нехватке кожи. Можно ожидать, что цены на сапоги, ремни и другие кожаные изделия будут расти!"
    2: "Гниль"
  "826":
    1: "Это не самая лучшая работа на свете, но, по крайней мере, она стабильная."
    2: "Труд"
  "827":
    1: "При этом короле налоги были вполне сносными. Арчибальд был ужасен, гораздо хуже своего отца. Я думал, что жестокие налоги Арчибальда приведут меня к разорению. Пусть ни он, ни такие, как он, больше никогда не займут престол!"
    2: "Налоги"
  "828":
    1: "Позвольте вам сказать: некоторые книжные полки, письменные столы и другая мебель могут быть сконструированы так, чтобы скрывать секретный проход. Можно пройти через комнату и даже не догадаться, что там было ещё два или три скрытых выхода."
    2: "Тайные ходы"
  "829":
    1: "Если вам когда-нибудь доведется побывать в окрестностях Стар-Лейка, обязательно посмотрите на прекрасные статуи на острове в центре озера. Они настолько реалистичны, что просто захватывают дух!"
    2: "Статуи у Звёздного озера"
  "830":
    1: "Что такое большое, красное и ест камни? Большой красный пожиратель камней!"
    2: "Анекдот дня"
  "831":
    1: "Если подумать, животные начали исчезать как раз тогда, когда стали появляться рассказы о дьяволах на Западе. Ага. Наверное, в этом и дело. Надоедливые тварьки!"
    2: "Испуганные животные"
  "832":
    1: "Я такой жалкий, что даже разбойники, рыщущие по дорогам, смеются надо мной!"
    2: "Несчастный"
  "833":
    1: "Если тебе кажется, что твоя репутация ухудшилась настолько, что люди уже не могут тебя терпеть, тебе стоит обратиться в храм и начать делать пожертвования, друг мой. Храм разнесет весть о твоей щедрости на все стороны, и люди благодаря этому изменят о тебе мнение в лучшую сторону."
    2: "Плохая слава"
  "834":
    1: "Если ты собираешься на что-нибудь поохотиться, тебе понадобится лук. Не думаю, что ты достаточно быстр, чтобы догнать оленя с мечом в руках."
    2: "Луки"
  "835":
    1: "Когда я был гораздо моложе, мне довелось увидеть руины библиотеки Церкви Луны в Каригоре. Она была построена исключительно из нефрита и мрамора, и когда-то в её священных залах хранилась мудрость веков. Если у вас когда-нибудь появится возможность побывать там, обязательно воспользуйтесь ею!"
    2: "Библиотека в Каригоре"
  "836":
    1: "Главный храм Баа находится к северо-западу от Блэкшира. Внутрь допускаются только члены культа Баа."
    2: "Храм"
  "837":
    1: "Высший совет — это не просто обычный городской совет; это орган, представляющий интересы феодалов этой земли. Его члены голосуют по важным государственным вопросам, которые необходимо выносить на рассмотрение короля. Кроме того, они контролируют доступ к Оракулу."
    2: "Высший совет"
  "838":
    1: "Охранникам важно проявлять терпение. Мы не должны сами искать неприятности; нужно ждать, пока они найдут нас."
    2: "Терпение"
  "839":
    1: "Бедная королева потеряла и отца, и мужа. Надеюсь, с Николаем ничего не случится."
    2: "Кэтрин"
  "840":
    1: "Мне интересно, действительно ли в ту ночь два года назад с неба упало что-то злобное. Однако я не считаю, что это был ангел-мститель! По-моему, скорее дьявол!"
    2: "Метеоры"
  "841":
    1: "Я в порядке! А почему ты спрашиваешь?"
    2: "Безумие"
  "842":
    1: "Почему взрослые всегда должны ссориться? Почему люди не могут просто уживаться друг с другом?"
    2: "Бой"
  "844":
    1: "Существует два вида магических доспехов: доспехи, повышающие защиту, и доспехи, которые легче и удобнее носить. Некоторые редкие виды доспехов обладают обоими этими свойствами."
    2: "Волшебные доспехи"
  "845":
    1: "Когда в палочке заканчиваются заряды, она теряет свою ценность. Их невозможно перезарядить, но обычно удаётся найти лоха, готового купить палочку по полной цене как раз перед тем, как заряды закончатся."
    2: "Восстановление зарядов жезлов"
  "846":
    1: "Смешивая зелья в правильных пропорциях, можно получить рецепты, которые позволяют добиться весьма необычных результатов. Гильдия алхимиков тщательно хранит секреты того, какие зелья обладают какими свойствами."
    2: "Зелья"
  "847":
    1: "Я не особо люблю цивилизацию, но можете быть уверены: на восточном побережье Энрота будет больше товаров и услуг, чем где-либо еще — особенно в Свободной гавани."
    2: "Цивилизация"
  "848":
    1: "Лошади — отличное средство передвижения, если вы можете себе это позволить. Во всех городах и замках на материке есть конюшни, где можно взять лошадей напрокат."
    2: "Лошади"
  "849":
    1: "Маги настолько ленивы, что придумали несколько заклинаний, позволяющих мгновенно переносить людей из одного места в другое. Эти заклинания — дело хорошее, но ничто не сравнится с НАСТОЯЩИМ путешествием."
    2: "Волшебный транспорт"
  "850":
    1: "Я слышал, что есть колдуны, которых можно нанять, чтобы они наложили заклинание «Хождение по воде», если ты сам не можешь этого сделать. Правда, они берут за это немало."
    2: "Заклинания для хождения по воде"
  "851":
    1: "При планировании путешествий на лодке следует проявлять осторожность. В определённые периоды года в некоторые районы плавать слишком опасно."
    2: "Сезоны путешествий"
  "852":
    1: "Важно своевременно лечить болезни и отравления. Чем дольше они остаются без лечения, тем сложнее их вылечить. Повторные отравления или заболевания ухудшают ваше состояние."
    2: "Болезни и яды"
  "853":
    1: "«Силовое исцеление» — заклинание высшего уровня в школе «Тело» — представляет собой эффективный способ быстрого исцеления всей группы. Одно заклинание «Силовое исцеление» восстанавливает больше здоровья быстрее, чем 4 заклинания меньшей силы."
    2: "Великое исцеление"
  "854":
    1: "Как правило, у вас больше очков здоровья, чем очков магии, поэтому часто быстрее сначала максимально восстановить здоровье с помощью магии, а потом отдохнуть. Таким образом можно значительно сократить время отдыха."
    2: "Отдых"
  "855":
    1: "По мере роста вашего уровня опыта растёт и количество опыта, необходимое для дальнейшего развития. Благодаря этому правилу в дальнейшем вы будете извлекать больше пользы из магических эффектов или наград, которые напрямую повышают ваш уровень."
    2: "Опыт"
  "856":
    1: "Принц Николай демонстрирует невероятную проницательность и творческий подход для своего юного возраста, совсем как когда-то его отец. Мне кажется, люди недооценивают его — они больше обращают внимание на его возраст, чем на его способности."
    2: "Николай"
  "857":
    1: "Ребёнок, стоит научиться обращаться с двумя-тремя видами оружия. Тогда ты сможешь менять тактику в бою, если твой любимый «рыбный нож» не наносит урона противнику — ну, ты меня понимаешь!"
    2: "Оружие"
  "858":
    1: "Осрик — не только мастер-воин, но и гениальный полководец. Я рад видеть, что он не относится к недавним нападениям демонов легкомысленно. Он уже разрабатывает способы дать отпор, но ситуация выглядит довольно мрачной. Однако если кто-то и способен придумать, как с ними бороться, то это именно Осрик."
    2: "Осрик Темпер"
  "859":
    1: "Если вы столкнулись с противником, которого невозможно победить заклинаниями, наносящими прямой урон, попробуйте использовать заклинание психической атаки или что-нибудь, что заставит его застыть на месте. Часто это дает воинам вашей группы время, чтобы разгромить врага, пока он отвлечен вашим заклинанием."
    2: "Психические атаки"
  "860":
    1: "Гхарик пытался воссоздать в своей кузнице некоторые виды оружия из «Эпохи чудес». Ему это так и не удалось, но ряд его экспериментов дал полезную информацию о зачаровании оружия и призыве существ."
    2: "Гхарик"
  "861":
    1: "Существует несколько Гильдий Стихий. Хотя их знания об отдельных стихиях не столь обширны, как у более специализированных гильдий, они являются отличным источником информации для расширения ваших знаний обо всех стихиях."
    2: "Гильдии магии стихий"
  "862":
    1: "Суть жизни! Золото смазывает скрипучее колесо, заставляет свидетеля замолчать или развязывает ему язык. Золото наполняет стол едой и топит огонь дровами. Как я люблю тебя, о могущественное золото! Пусть у тебя никогда не кончится золото, мой друг. Никогда!"
    2: "Золото"
  "863":
    1: "Самого важного в профессии торговца научить невозможно. Нужно научиться распознавать выгодную покупку, когда она попадается на глаза, и заключать выгодные сделки, когда представляется такая возможность. Если вы купите что-то по низкой цене в одном городе, есть большая вероятность, что сможете продать это в другом месте с прибылью."
    2: "Спекуляция"
  "864":
    1: "Недавно я побывал в землях к западу от Блэкшира, и то, что я там увидел, заставило мою кровь застыть в жилах. Дьяволы бегали по разрушенному, опустошённому ландшафту, убивая всех людей, которые попадались им на пути. Что-то здесь явно не так. Я просто не понимаю, почему никто ничего не предпринимает, чтобы это исправить!"
    2: "Дьяволы"
  "865":
    1: "По сравнению со многими странами Энрот — очень терпимое королевство. Тем не менее, если вы совершите достаточное количество преступлений и будете настолько глупы, что покажетесь на глаза охраннику, то можете оказаться за решёткой."
    2: "Закон и тюрьма"
  "866":
    1: "Дипломатия — это ключ к переговорам, а переговоры — ключ ко многим закрытым дверям в этом мире. Если вы хотите добиться успеха, вы должны уметь и потягивать шампанское в компании самых высокопоставленных вельмож, и пить эль в компании самой низшей шпаны."
    2: "Ведение переговоров"
  "867":
    1: "Найди пенни — подними его, и весь день тебе будет сопутствовать удача!"
    2: "Найди пенни"
  "868":
    1: "Большая часть найденных вами сокровищ будет заперта в сундуке или ящике. Защищать свои ценности — это вполне разумно."
    2: "Сундуки"
  "869":
    1: "Лучше говорить и дать им повод считать тебя дураком, чем молчать и доказать это!"
    2: "Разговор"
  "870":
    1: "Настроение бедного Эрика соответствует погоде в его королевстве. Увидеть улыбку на его лице — столь же редкое явление, как и солнце в Уайт-Кэпе. У старого Эрика просто неверный взгляд на вещи."
    2: "Эрик фон Стромгард"
  "871":
    1: "Леди Флейз — самая сложная хозяйка во всем Энроте, в этом можете быть уверены! Она скуповатая и у неё сердце из камня!"
    2: "Лоретта Флейз"
  "872":
    1: "На разных типах местности легче добывать пищу и охотиться. Например, на лугах вам потребуется гораздо меньше еды, чем в пустыне. Имейте это в виду, выбирая место для лагеря."
    2: "Продовольственное снабжение"
  "873":
    1: "Времена тяжелые, и в последнее время банки перестали выплачивать проценты по вкладам. Не ждите ничего, кроме безопасности, когда кладете деньги в банк — проценты остались в прошлом!"
    2: "Время"
  "874":
    1: "Лоретте удалось разбогатеть, завоевав и удерживая лидирующие позиции в судоходной отрасли. Она способна манипулировать ценами на перевозки по всему королевству, что приносит ей немалые доходы. Как бы я хотел заниматься её бухгалтерией!"
    2: "Лоретта Флейз"
  "875":
    1: "Более качественные и свежие продукты, которые дольше хранятся, также стоят дороже. Жители западных штатов научились готовить блюда, которые хранятся в течение длительного времени."
    2: "Стоимость продуктов питания"
  "876":
    1: "Из трав можно приготовить волшебные зелья. Я не знаю, как это делается, но знаю, что это возможно. Интересно, а на вкус они какие?"
    2: "Алхимия"
  "877":
    1: "Хотя это может обойтись дорого, путешествие с помощью конюшни быстрее, чем почти любой другой способ, за исключением магии, а ею владеют далеко не все! Если вы на мели, придётся идти пешком, но не забудьте учесть расходы на еду при пешем путешествии!"
    2: "Стоимость верховой езды"
  "878":
    1: "Я обожаю выступать! Я обожаю путешествовать! Нет жизни лучше, чем жизнь барда. Лучшие сплетни, лучшая еда и, главное, лучшие напитки — зачем мне вообще хотеть быть кем-то другим?"
    2: "Песни"
  "879":
    1: "Хотя вы этого и не слышите, звезды и планеты поют, пролетая по небу. Это и есть «Музыка сфер» — величайшая симфония во вселенной!"
    2: "Музыка сфер"
  "880":
    1: "Я слышал, что есть колдуны, которых можно нанять, чтобы они наложили заклинание «Хождение по воде», если ты сам не можешь этого сделать. Правда, они берут за это немало."
    2: "Заклинания для хождения по воде"
  "881":
    1: "Летать, безусловно, проще, чем ходить. В большинстве случаев это ещё и безопаснее. Единственная проблема заключается в том, что заклинание «Полёт» постоянно расходует вашу магическую энергию, поэтому вам нужно тщательно планировать свои перелёты, чтобы заклинание не иссякло."
    2: "Полёт"
  "882":
    1: "«Хождение по воде» — моя специальность — позволяет вам переходить через большинство водоёмов, как будто вы идёте по суше. Однако нужно быть осторожным, иначе действие заклинания закончится, пока вы ещё над водой."
    2: "Заклинания для хождения по воде"
  "883":
    1: "Мне приходилось спасать немало обреченных экспедиций, и позвольте мне поделиться с вами одним важным уроком. Если вы отправляетесь туда, где, по вашему мнению, не сможете справиться, ОТСТУПАЙТЕ. Никто не станет за это вас осуждать."
    2: "Отступление"
  "884":
    1: "Магия разума, тела и духа — это магия души и «я». Лучше понять их — значит укрепить своё положение в глазах богов."
    2: "Самосовершенствование"
  "885":
    1: "Многие пренебрежительно относятся к простой музыке странствующего менестреля, но чтобы достичь мастерства в своём деле, мне пришлось посвятить этому всю свою жизнь."
    2: "Музыка"
  "886":
    1: "По всему миру разбросано множество мест, обладающих магической силой. Чаще всего они находятся в труднодоступных местах. Вам будет очень выгодно постараться обнаружить и использовать как можно больше таких мест."
    2: "Особые места"
  "887":
    1: "Люди постоянно говорят плохо о моей родине, Регне, но они не знают, о чём говорят. Нигде вы не найдёте более весёлого и счастливого народа, чем на Регне, да и более яростно независимого народа тоже."
    2: "Регна"
  "888":
    1: "Лучший способ научиться — это обязательно сражаться с сильными противниками. Вы не станете сильнее, если будете избирать себе противников, слабее вас. Настоящий путь к славе лежит через победы в всё более сложных сражениях."
    2: "Противники"
  "889":
    1: "Существует мистическая колода карт Таро, которую, как утверждают некоторые, им доводилось видеть. Никто никогда не видит эту колоду дважды. Сыграть карту из этой колоды — значит разыграть новую руку в игре под названием «жизнь»."
    2: "Карты Таро"
  "890":
    1: "Большинство оставшихся в мире опасных зон расположено на западе. Наиболее известными из них являются Райская долина и Драконьи пески, хотя западные части Замерзших высокогорий и Болото проклятых также представляют собой серьезную сложность. Как правило, чем дальше на запад, тем сложнее."
    2: "Запад"
  "891":
    1: "Я не могу переоценить важность дипломатии. Хороший дипломат способен оправдать любое действие, каким бы гнусным оно ни было."
    2: "Дипломатия"
  "892":
    1: "Дьяволы! Фу! Это всего лишь иллюзии, созданные магами, которые где-то в Райской долине прячут огромные сокровища. Я, видите ли, лично знаком с несколькими из этих колдунов. Это кольцо, которое я ношу, — подарок от одного из них."
    2: "Дьяволы"
  "893":
    1: "Некоторые люди рождены для того, чтобы торговать, вести переговоры, сражаться или учиться. А я рожден для того, чтобы воровать, и у меня это неплохо получается. Сейчас времена стали гораздо тяжелее из-за всех этих бедствий; уже трудно найти что-то, что стоило бы украсть… Люди слишком осторожно относятся к тому, что у них есть."
    2: "Кража"
  "894":
    1: "Слава Богу за воскресенья! Если бы мне приходилось работать каждый день, я, пожалуй, взбунтовался бы против своих благородных угнетателей и заменил бы их квазидемократическим обществом, управляемым капиталистической буржуазией, где мне всё равно пришлось бы работать по много часов за мизерную зарплату."
    2: "Труд"
  "895":
    1: "Интересно, какой была жизнь до «Тишины», когда всем заправлял губернатор? Наверное, не очень хорошей, иначе бы не произошло восстание."
    2: "Губернатор"
  "896":
    1: "В наши дни популярны три стиля головных уборов: от тканевых шляп до изысканных и дорогих моделей, сшитых мастерами высочайшего класса. Волшебники любят зачаровывать качественные головные уборы, поскольку они легче шлемов и не ограничивают обзор. Кроме того, один из видов конических шляп, похоже, зачаровывается легче, чем другие."
    2: "Шляпы"
  "897":
    1: "До наступления Тишины было Время Чудес. Всё тяжёлое дело выполняли волшебные творения… Хотелось бы, чтобы у меня было такое, которое бы делало за меня всю работу по дому."
    2: "Время чудес"
  "898":
    1: "Перед величием закона все равны: и богатому, и бедному запрещено спать под мостами, воровать хлеб и просить милостыню. — Вольтер"
    2: "Величие закона"
  "899":
    1: "Легче позволить бочке скатиться с холма, чем толкать её в гору. Иногда лучше просто плыть по течению."
    2: "Совет"
  "900":
    1: "Не вся глина одинакова. Лучшую глину можно найти на дне рек и ручьев, протекающих мимо Свободной гавани."
    2: "Глина"
  "901":
    1: "Некоторые предметы одежды зачарованы. Ношение такой волшебной одежды принесет вам пользу."
    2: "Волшебная одежда"
  "902":
    1: "Обувь должны носить все, а не только знатные и богатые люди! Что ты будешь делать, если поранишь ноги? Как ты тогда будешь продолжать работать?"
    2: "Обувь"
  "903":
    1: "Если бы я был умным, думаешь, я бы зарабатывал на жизнь рытьем канав? Будь серьезным, пожалуйста."
    2: "Интеллект"
  "904":
    1: "Точильные камни так сложно изготовить и найти, что удивительно, как вообще кто-то решается стать мельником. Я слышал, что в Каригоре есть отличный карьер, где добывают такие вещи, как мельничные камни, сотнями."
    2: "Точильные камни"
  "905":
    1: "Можете ли вы представить, чтобы эльфы развязали войну из-за вырубки лесов? Откуда же брать древесину, если не из деревьев? Как я буду зарабатывать на жизнь, если у меня не будет пиломатериалов, из которых можно что-то вырезать и строить?"
    2: "Войны за древесину"
  "906":
    1: "Церкви и короли, похоже, уделяют много времени размышлениям о брусчатке и прочем подобном. Если бы не они, у меня едва ли была бы какая-то работа."
    2: "Устройство храмов"
  "907":
    1: "Почему в гоблинском дне всего двадцать часов? Вы когда-нибудь видели гоблина с двадцатью четырьмя пальцами на руках и ногах?"
    2: "Анекдот дня"
  "908":
    1: "Раньше на западе было много дичи. Сейчас же её уже не так много. Возможно, это как-то связано с болезнью, которая уничтожает растения в Плезант-Вэлли."
    2: "Дичь"
  "909":
    1: "У большинства людей и так хватает собственных проблем, чтобы помогать такому бедному нищему, как я, но у священников Храма Баа, кажется, всегда найдутся время, деньги или еда для меня. Я им очень благодарен за то, что они мне помогают."
    2: "Храм Баа"
  "910":
    1: "Эта болезнь, о которой все так много говорят, убивает всех коров! Так скажи мне. Как же человеку зарабатывать на жизнь кражей скота, если красть нечего?"
    2: "Нехватка коров"
  "911":
    1: "В Энроте могреды вымерли, а в Каригоре — практически вымерли. Их чрезмерно истребляли из-за того, что их рога очень ценятся при зачаровании."
    2: "Вымирание"
  "912":
    1: "В последнее время возник дефицит бумаги, и могу вам сказать, что моим клиентам это совсем НЕ нравится. Удивительно слышать, как какая-то богатая аристократка вроде Лоретты Флейз жалуется на стоимость бумаги. У неё, наверное, самая большая куча золота во всём королевстве, а может, и во всём мире, а она всё равно жалуется."
    2: "Бумага"
  "913":
    1: "Основываясь на поклонении природе и окружающему миру, эта церковь уделяла меньше внимания людям, а больше — своим корыстным целям."
    2: "Храм Солнца"
  "914":
    1: "Мне бы точно не помешал отпуск. Сколько вы знаете клерков, которые работают каждый день в году?"
    2: "Праздники"
  "915":
    1: "Я знаю, что большинство людей не считают нашу работу важной. Однако в свете недавних событий для нас чрезвычайно важно поддерживать порядок. Мы будем бдительны, как никогда!"
    2: "Охранники"
  "916":
    1: "Надеюсь, тебе повезет больше, чем мне. В последнее время я потерял кучу денег на «безопасных ставках». Похоже, неудача Айронфистов перекинулась и на меня."
    2: "Удача"
  "917":
    1: "Ненавижу воскресенья! Так трудно найти хороших работников, готовых работать в воскресенье. Как будто это какой-то особенный день! Хм."
    2: "Воскресенья"
  "918":
    1: "Баа изменил мою жизнь к лучшему! Подчините свою волю Баа, и вы навсегда избавитесь от сомнений и боли!"
    2: "Поклонение Баа"
  "919":
    1: "Не могу дождаться, когда к нам приедет «Цирк Солнца». Я весь год вел себя хорошо, так что, надеюсь, родители отведут меня на представление!"
    2: "Цирк"
  "920":
    1: "Заполнитель"
