rows:
  "0":
    1: "Если вы видите этот текст, сообщите Джеймсу."
  "1":
    1: "Если пираты прорвутся сквозь ряды наших воинов, мы обречены!"
  "2":
    1: "Спасибо, что одолели пиратов! Теперь бы ещё кто-нибудь разобрался с Огненной горой!"
  "3":
    1: "Путь назад, в деревню Кровавая Капля, отрезан! Я даже не знаю, жива ли моя семья!"
  "4":
    1: "Вы прошли через Каменные порталы? Они снова работают? Теперь мы сможем вернуться к своим семьям!"
  "5":
    1: "Ар-р! Либо вступайте в бой, либо не путайтесь под ногами!"
  "6":
    1: "Кто-нибудь должен очистить пещеры, где устроили логово лютые волки. Одной бедой станет меньше — и жить станет чуть легче!"
  "7":
    1: "Ходят слухи, что близится конец света. Посмотришь на кристалл посреди города — и поневоле им поверишь!"
  "8":
    1: "Прошлой ночью за моим домом снова рыскала стая мерзких крысолюдов. Кто-нибудь должен разобраться с этими тварями. Удивительно, что наши дети ещё целы среди крыс и лютых волков!"
  "9":
    1: "Пожалуйста, не трогайте нас! Арион Охотник сказал, что теперь мы друзья!"
  "10":
    1: "Мы навеки у вас в долгу! Вы спасли Равеншор и весь Джадам!"
  "11":
    1: "Хотите выстрелить из пушек, защищая остров Кинжальной Раны?"
  "12":
    1: "Помогите! Если мы не выбьем пиратов с острова, всё будет потеряно!"
  "13":
    1: "Пиратский аванпост уничтожен, и наши дома снова в безопасности! Спасибо!"
  "14":
    1: "Огры всё сильнее отравляют нам жизнь. Если кто-нибудь разберётся с ними в крепости, всё может измениться к лучшему!"
  "15":
    1: "Боевые осы построили к юго-востоку отсюда огромное гнездо. Если оно разрастётся, городу будет грозить опасность."
  "16":
    1: "Вести из разных земель Джадама очень медленно доходят до Альвара. Интересно, знают ли торговцы, что творится в мире?"
  "17":
    1: "Огненное море уничтожило нашу деревню! Кто знает, сколько мы ещё здесь протянем."
