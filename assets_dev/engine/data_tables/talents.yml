# The special skills (talents) of an augmented solo run under MAW (devdocs/solo_action/TALENTS.md, design in
# devdocs/solo_action/BALANCE_AND_TALENTS.md §5.0). Only a MAW solo run reads them; a ruleset may replace this table
# like any other. Numbers are first guesses to tune in play.
#
# Each talent:
#   id, name, tree (melee, ranged, caster), kind (passive, active), max_rank.
#   icon_item (an inventory icon name) or icon_spell (a spell id): placeholder art until talents have icons of their own.
#   requires: the mastery the tree's skill needs before the talent can be learned (none, expert, master). The tree's skill
#     is the equipped melee weapon's skill or Armsmaster for melee, Bow for ranged, the best magic school for caster.
#   per_rank: a passive's percent (or amount) per rank.
#   cooldown, cooldown_per_rank (added per rank above the first; negative shortens), duration, duration_per_rank: seconds.
#   targets, share (percent of a normal blow or shot), distance (world units), arc (degrees either side of the view).
#   text: the effect line on the Talents page; {value} is the current rank's number.
levels_per_point: 10
talents:
  - id: weapon_training
    name: Weapon Training
    tree: melee
    kind: passive
    max_rank: 5
    icon_item: item004
    per_rank: 2
    text: "+{value} % Might, Endurance and Speed"
  - id: cleave
    name: Cleave
    tree: melee
    kind: active
    max_rank: 3
    icon_item: 7item024
    requires: expert
    cooldown: 12
    cooldown_per_rank: -2
    targets: 5
    share: 60
    arc: 60
    text: "A sweep: the target and up to four more in the arc take a blow at 60 %"
  - id: whirlwind
    name: Whirlwind
    tree: melee
    kind: active
    max_rank: 3
    icon_spell: 93
