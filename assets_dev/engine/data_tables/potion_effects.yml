  283:
    name: Potion of the Gods
    once_per_character: true
    effects:
      - permanent_stat: {stats: [might, intellect, personality, endurance, accuracy, speed, luck], amount: 20}
      - age: {years: 10}
  284:
    name: Pure Fire Resistance
    once_per_character: true
    effects:
      - permanent_resistance: {resistances: [fire], amount: 40}
  285:
    name: Pure Air Resistance
    once_per_character: true
    effects:
      - permanent_resistance: {resistances: [air], amount: 40}
  286:
    name: Pure Water Resistance
    once_per_character: true
    effects:
      - permanent_resistance: {resistances: [water], amount: 40}
  287:
