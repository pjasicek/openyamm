      - permanent_stat: {stats: [accuracy], amount: -5}
  279:
    name: Potion of Doom
    effects:
      - permanent_stat: {stats: [might, intellect, personality, endurance, accuracy, speed, luck], amount: 1}
      - permanent_resistance: {resistances: [fire, air, water, earth, mind, body], amount: 1}
      - age: {years: 5}
  280:
    name: Divine Boost
    effects:
      - buff: {id: TempMight, strength: {linear: [0, 3]}}
      - buff: {id: TempIntellect, strength: {linear: [0, 3]}}
      - buff: {id: TempPersonality, strength: {linear: [0, 3]}}
      - buff: {id: TempEndurance, strength: {linear: [0, 3]}}
      - buff: {id: TempSpeed, strength: {linear: [0, 3]}}
      - buff: {id: TempAccuracy, strength: {linear: [0, 3]}}
      - buff: {id: TempLuck, strength: {linear: [0, 3]}}
  281:
    name: Divine Protection
    effects:
      - buff: {id: FireResistance, strength: {linear: [0, 3]}}
      - buff: {id: AirResistance, strength: {linear: [0, 3]}}
      - buff: {id: WaterResistance, strength: {linear: [0, 3]}}
      - buff: {id: EarthResistance, strength: {linear: [0, 3]}}
      - buff: {id: MindResistance, strength: {linear: [0, 3]}}
      - buff: {id: BodyResistance, strength: {linear: [0, 3]}}
  282:
    name: Divine Transcendence
    effects:
