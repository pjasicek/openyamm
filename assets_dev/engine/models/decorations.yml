# Outdoor map decorations drawn as static 3D models instead of their sprites, for every world (engine content, like
# the models in engine/models/). Matched by decoration name (the merged engine decoration table); the decoration keeps
# its native collision, events and picking. The sprite a decoration currently shows picks the model, so an event
# SetSprite to another bound decoration switches models (a picked food tree), and one to an unbound sprite draws it.
# A map loads the models of the decorations it places, their lit/unlit counterparts and its events' SetSprite targets.
# A world extends this file with worlds/<world>/models/decorations.yml: its entry for a name replaces every entry of
# that name here, and an entry with model: null keeps the decoration a sprite in that world. Outdoor bakes made with
# decoration shadows depend on this file (tools/lighting/stale_bakes.py).
#   height: world height of the model (the native sprite's world height); height_jitter: +- fraction per placement
#   yaw: random (seeded by map position) or facing (the map's facing angle) plus yaw_offset radians
#   lod_pixels: projected sizes below which LOD 1..3 take over (default 500, 200, 80)
#   z_offset: world units added to the placement height; still: see indoor_decorations.yml
#   maps: optional list limiting the binding to those maps
# Projects: level_generation/decorations/ (mm6_new_sorpigal_3d, mm7_3d, mm8_3d).
