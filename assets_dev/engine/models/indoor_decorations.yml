# Indoor (BLV) map decorations drawn as static 3D models instead of their sprites, for every world; the same fields
# and world extension as decorations.yml (outdoor maps), kept apart because decorations.yml is a dependency of baked
# outdoor maps. Matched by decoration name; the decoration keeps its native collision, events, lights and picking.
#   mount: wall turns the model's back (asset -z) onto the nearest steep face within reach (torch brackets: their map
#     facing is always 0); ground (default) uses yaw as in decorations.yml. free_model stands where no wall is in reach.
#   swing: [angle degrees, period seconds] swings the model about its top (chandeliers, hanging cages).
#   still: true records that a natively animated sprite is drawn by a model without animation on purpose.
# Animated decorations (still ground bindings only; evt.PlayDecorationClip(cog, clip[, once | loop | end]) plays a clip,
# a chest's lid opens and closes with its chest, idle: <clip> loops without one):
#   parts: [<model>, ...] moving pieces drawn with the decoration (a coffin's lid, a bell and its clapper): each
#     authored in the decoration's asset space on one rigid mesh node its clips move; the binding's model is the rest
#     and its height that rest's own. A binding model with clips on its one rigid mesh node moves as a whole.
#   animated: <model> a skinned copy (a banner, a statue made from a creature) drawn as a model instance in the
#     model's place and posed by its clips; the binding's static model stays for picking.
# Lit/unlit pairs that events toggle (TrchB00/nwtrchnf, brazir2f/brzier00) switch models with the sprite.
# Without maps, a binding applies to every dungeon.
