# MAW in the World of Xeen: the single source of every Xeen number MAW uses (devdocs/maw/XEEN_SUPPORT.md).
# Edit this file, not anything derived from it; run `python3 tools/maw/xeen_balance.py` after each edit (it checks this
# file against Xeen's map table, monsters and quest bits and writes item_bases.yml and new_game_continents.yml beside
# it) and add a changelog line. Testers quote the version.
#
# maps: every Xeen map (worlds/xeen/data_tables/map_stats.txt), by file name, in route order (the Standard party level
# of devdocs/xeen/MAPS.md and source/maps.yml). The fields are MM9's (worlds/mm9/balance.yml):
#   band             MAW's low/mid/high B levels: the 1st/2nd/3rd native family (the map's encounter pictures, sorted
#                    by B level) is pinned to them, other families pulled halfway into [low, high]
#   horizontal_starter, madness_start, madness_level    as data/map_levels.yml's lists
#   natives          up to three families (pictures without the tier letter) in place of the map table's encounter
#                    pictures: set on the maps whose table lists none, from the families their scenes place most
#   story_bands, density, completion_exclude    as in worlds/mm9/balance.yml
# Bands: `xeen_balance.py --draft` suggests each from the map's Standard party level on MAW's MM7 stages (the curve
# MM9's acts were put on) and the spread of its natives: the curve's value is where the natives meet the party (one
# native: the band's low; two or three: the mean of low and high, D-84); the comments name each map's act, Standard
# party and monster levels and its natives' B levels. Beyond Madness: one ladder for both faces, 500 x (route position / 79)^1.2; the
# start maps X1 and XD-01 at 4, the Warzone at 1 (an arena, as MM9's).

version: 2
changelog:
  - {version: 1, date: 2026-11-21, note: "first bands: Xeen's acts on MAW's MM7 stages by Standard party level; one Beyond Madness ladder over both faces; the Warzone as MAW's arenas; octopods and X2's lake dragons left out of clearing"}
  - {version: 2, date: 2026-11-21, note: "D-84 MX-8: a map with one native has the curve's value as its band's low (MAW pins a single native there; it read 15-20 % low), the maps with natives of their own take their natives' spread; X7's natives are the north's three families (an Act V map under MAW). Gem gear on Xeen's tiers as MAW rungs (MX-6)"}

# The water's guards: D4's lake octopods and P4's sea octopods; X2's lake dragons below (the user's MM9 rule: monsters
# that guard water do not count toward a map's clearing).
completion_exclude: ["Xeen Octopod"]

# Monster density by difficulty (MM9's figures, MM9_BALANCE_DESIGN.md section 7): the share of Xeen's placed monsters
# an indoor map holds, its pack reserve (rulesets/maw/maps/<stem>_zz_maw.scene.yml, tools/maw/xeen_pack_reserve.py)
# adding up to 2x. Xeen's outdoor maps grow by MAW's group sizes on their spawn points instead. A challenge mode's
# factor replaces the difficulty's; a map's own `density` multiplies either.
density:
  difficulty: {easy: 1.0, normal: 1.0, maw: 1.0, hard: 1.2, hell: 1.2, nightmare: 1.4}
  challenge: {doom: 1.6, road_to_insanity: 1.8, beyond_madness: 2.0}

