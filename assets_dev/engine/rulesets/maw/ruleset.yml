  # Written by hand in content/ (the patch tool rewrites patches/ and tables/), applied after the generated ones:
  # the skill reset topics of the Oracle, Judge Grey and the Seer (events/Global_maw.lua); no class picks Learning
  # (Ascension) at creation; the texts of Ascension and the four new skills; the new classes' starting skills and
  # descriptions; free class selection at creation; what each potion does (potion_effects.yml); the crafting
  # materials' rows (1041-1070), the top reagents' power (MAW's 30, gray 45) and the
  # potions' descriptions.
  # MAW's special texts set at start-up (zzMaw-Items.lua GameInitialized2): keys are table rows, special id + 3.
  - table: special_item_enchants.txt
    mode: override
    path: content/special_item_enchants_patch.txt
    keyColumn: "row"
    headerRow: 2
  # Costs the name-keyed patch cannot reach, by spell id: Mind Charm 5 (both Charms share a name; MAW's Spells2.txt),
  # Chain Lightning 20/30 and Lifedrain 10/15 at Master and Grandmaster (zzMaw-Spells.lua:1879-1885).
  - table: spells.txt
    mode: override
    path: content/spells_patch.txt
    keyColumn: 0
    headerRow: 0
  - table: npc.txt
    mode: override
    path: content/npc_respec_patch.txt
    keyColumn: 0
    headerRow: 1
  # MAW's quests (QBits from 10001): the Druid Circlet for Dantillion in Murmurwoods (events/Global_maw.lua).
  - table: english/quests.txt
    mode: override
    path: content/quests_patch.txt
    append: content/quests_maw.txt
    keyColumn: 0
    headerRow: 0
  # MAW's own monster names (map content, devdocs/maw/MAPS_CONTENT.md): the Naga Empress (d18), the Temple of Baa's
  # clergy (d04) and the Goblin King and his Lieutenant (7d29, 7out02).
  - table: english/place_mon.txt
