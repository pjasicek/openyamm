# The MAW ruleset (devdocs/maw/HANDOFF.md): behaviour of MAW commit ef23ee17, reimplemented for OpenYAMM.
# Tables below engine/data_tables/ are changed by the patches listed under `tables` (RulesetDefinition.h describes the
# override and replace formats); the engine tables themselves stay the Standard ruleset.
id: maw
name: MAW
description: >-
  Might and Magic rebalance: monsters scale with the expected party, difficulty from Easy to Nightmare, free or
  horizontal progression, new loot rarities, skills, spells, classes and crafting.
credits:
  - Malekith, lead developer and designer
  - Rawsugar, co-lead designer
  - Eksekk, senior contributor
  - Yuji Sakai/Knightmarevive, contributor
  - 2D (Perduelion), alchemy design
  - Thor Thunderfist, skill limit removal
  - With thanks to GrayFace and Rodril
contentSchemaVersion: 1
# The player's guide, linked from the Rules panel and the journal's Progress tab.
guide_url: https://jasicek.net/openyamm/maw-guide/
# The ids MAW's own rows take (the quests and topics it adds, its boss names, the Lich Troll portrait); a world may not
# claim them too.
idRanges:
  qbits: {begin: 10001, end: 10099}
  npc_topics: {begin: 10001, end: 10099}
  monster_names: {begin: 205, end: 301}
  portraits: {begin: 78, end: 78}
options:
  difficulties: [easy, normal, maw, hard, hell, nightmare]
  defaultDifficulty: maw
  progressions: [free, horizontal]
  defaultProgression: free
  # Phase 9 (devdocs/maw/PHASE9_SCOPE.md): the modes are offered while their rules are completed. MAW's randomizer is
  # not ported (DEVIATIONS 138).
  challengeModes: [none, doom, road_to_insanity, beyond_madness, austerity]
  randomizer: false
  preferences: true
# Skills shown under another name: Learning no longer gives experience but powers spells (CLASSES_SPELLS_SPEC.md §2).
skillNames:
  Learning: Ascension
# The new-game Rules panel. Monster HP and damage are relative to MAW for a level-100 party
# (devdocs/maw/data/difficulty.yml relative_to_maw.level_100); groups are monster group sizes, loot the rarity weight
# bonus. Normal uses MAW's otherwise unreachable difficulty index 2 (devdocs/maw/DEVIATIONS.md item 1).
rulesPanel:
  title: MAW Rules
  subtitle: Might and Magic rebalance
  summary: MAW rebalances monsters, items, skills and spells.
  difficultyColumns: [Monster HP, Monster dmg, Groups, Loot]
  difficulties:
    easy:
      values: [×0.50, ×0.50, 1–3, —]
      description: No bosses. Monsters have half the health and deal half the damage of MAW.
    normal:
      values: [×0.75, ×0.70, 1–3, —]
      description: No bosses. A gentler start for players new to MAW.
    maw:
      values: [×1.00, ×1.00, 1–3, —]
      description: The intended experience. Every map has bosses with special abilities.
    hard:
      values: [×1.27, ×1.12, 1–4, +10 %]
      description: Larger groups and better loot. Attacking while flying ends Fly on most maps.
    hell:
      values: [×1.55, ×1.24, 1–4, +20 %]
      description: As Hard; melee monsters outdoors can also gain a ranged attack.
    nightmare:
      values: [×1.90, ×1.45, 2–4, +40 %]
      description: >-
        Saving costs food, and Lloyd's Beacon and Town Portal fail near enemies; dungeons left below 65 % cleared
        revive their dead.
      warning: Cannot be lowered later.
  progressions:
    free: >-
      Monsters on a new continent gain the levels you earned elsewhere. Suits playing one continent at a time.
      Masteries need skill 4, 7 and 10.
    horizontal: >-
      Every map has a fixed level, about 2.5× its original band; travel between continents to progress. Suits clearing
      the whole game. Masteries need skill 6, 12 and 20.
  challengeModes:
    none: MAW's rules with no extra challenge.
    doom: >-
      Monster hits cause conditions, more and stronger monsters spawn, items must be identified before wearing and
      hirelings are limited. Masteries need skill 6, 12 and 20. Starts with 5,000 gold and bonus experience.
    road_to_insanity: >-
      Doom's monsters, no map refills, and masteries need skill 8, 16 and 25. Starts with 5,000 gold and bonus
      experience.
    beyond_madness: >-
      Insanity, and the party restarts at level 1, maps reach level 500, bosses are seeded and every death counts,
      including loading during combat. No mercenaries. Horizontal progression; masteries need skill 10, 24 and 40.
    austerity: >-
      No Legendary or Celestial items and no crafting rewards, weaker enchantments and reagents, flatter bosses and a
      minimum armour value from the armour skills. Combines with any difficulty.
