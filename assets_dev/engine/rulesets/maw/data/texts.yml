# MAW's spell names and spellbook texts (devdocs/maw/CLASSES_SPELLS_SPEC.md §1-5), written for OpenYAMM's MAW rules
# after zzMaw-Spells.lua (ascension, adjustSpellTooltips) and zzClasses.lua (dkSkills, assassinSkills). Each part
# replaces the spell table's; a mastery line set to "" is not shown. `classes:` gives a class line's own text, part by
# part over the ruleset's.
#
# Placeholders, filled with the caster's numbers ({name*factor} scales, {name:1} keeps one decimal). The description
# reads the caster's school mastery; each mastery line reads its own mastery.
#   add, dice                 a damage spell's flat damage and dice per point after Ascension and Empower Magic
#   mastery_add, mastery_dice the same at the line's mastery share (Fire Spike, Lifedrain)
#   cost                      the spell points a cast costs at the line's mastery
#   heal_base, heal_per       a heal's base and per-point healing after Ascension (Personality adds more)
#   cc_seconds                a control spell's seconds on a monster without resistance, before diminishing returns
#   aura_flat, aura_stat      a flat aura's strength and its stat percent at the caster's skill and level
#   aura_percent              a percent aura's strength (Haste, Shield, Heroism, Fate, Hammerhands, Empower Magic)
#   dop_flat, dog_stat        Day of Protection's resistances and Day of the Gods' stat percent
#   hop_haste, hop_shield, hop_armor, hop_fate   Hour of Power's parts
#   percent, combo            a class spell's share of a weapon blow at the line's mastery and its combo points
#   blood_leech               a Death Knight's Blood Leech heal per hit at the line's mastery
#   hp_share                  Mass Distortion's percent of the target's current hit points
#   level, skill              the caster's level and school skill
# The rules add the aura's reservation and holder, the combo points a spell needs and the cast's recovery time.

spells:
  # Fire
  1:
    description: >-
      An aura: increases the radius of light surrounding your party in the dark, brighter with each mastery of Fire
      Magic.
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  2:
    description: >-
      Launches a burst of fire at a single target. Damage is {add} + 1-{dice} points per point of skill in Fire Magic.
      Fire Bolt is safe, effective and has a low casting cost.
  3:
    description: >-
      An aura: raises your party's Fire Resistance by <good>{aura_flat}</> and Intellect by <good>{aura_stat}</> %. Grows with your
      Fire Magic skill (counted up to 50) and with your level.
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  4:
    description: >-
      An aura: your party's weapons burn with a magical fire on top of their other enchantments. Every blow and arrow
      adds a share of the weapon's level damage as fire, more on slow weapons, and the weapons in hand add it to every
      damage spell (40 % of it on area spells). The minimum is doubled on two-handed weapons.
    normal: "10 % of the weapon's level damage, at least 3"
    expert: "15 % of the weapon's level damage, at least 6"
    master: "20 % of the weapon's level damage, at least 12"
    grandmaster: "25 % of the weapon's level damage, at least 24"
  5:
    description: >-
      An aura: your characters recover <good>{aura_percent:1}</> % faster from attacks and spells. Grows with your Fire Magic
      skill (counted up to 50).
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  6:
    description: >-
      Fires a ball of fire at a single target. When it hits, the ball explodes damaging all those nearby, including
      your characters if they're too close. Fireball does 1-{dice} points of damage per point of skill in Fire Magic.
  7:
    description: >-
      Drops a Fire Spike on the ground that waits for a creature to get near it before exploding. Fire Spikes last
      until you leave the map or they are triggered.
    expert: "Causes 1-<good>{mastery_dice}</> points of damage per point of skill, 5 spikes maximum"
    master: "Causes 1-<good>{mastery_dice}</> points of damage per point of skill, 5 spikes maximum"
    grandmaster: "Causes 1-<good>{mastery_dice}</> points of damage per point of skill, 5 spikes maximum"
  8:
    description: >-
      An aura: surrounds your characters with a very hot fire that is only harmful to others. It deals {add} + 1-{dice}
      points of damage per point of skill in Fire Magic to every nearby monster for as long as they remain in the area.
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  9:
    description: >-
      Summons flaming rocks from the sky which fall in a large radius surrounding your chosen target. Try not to be
      near the victim when you use this spell. A single meteor does {add} points of damage plus {dice} per point of
      skill in Fire Magic. This spell only works outdoors.
  10:
    description: >-
      Inferno burns all monsters in sight when cast, excluding your characters. Each monster takes {add} points of
      damage plus 1-{dice} per point of skill in Fire Magic. This spell only works indoors.
  11:
    description: >-
      Among the strongest direct damage spells available, Incinerate inflicts massive damage on a single target. Damage
      is {add} points plus 1-{dice} per point of skill in Fire Magic.

  # Air
  12:
    description: >-
      An aura: the minimap shows the locations of monsters and other points of interest, more of them with each
      mastery of Air Magic.
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  14:
    description: >-
      An aura: raises your party's Air Resistance by <good>{aura_flat}</> and Speed by <good>{aura_stat}</> %. Grows with your Air Magic
      skill (counted up to 50) and with your level.
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  15:
    description: >-
      Sparks fires small balls of lightning into the world that bounce around until they hit something or dissipate.
      Each spark does 1-{dice} points of damage per point of skill in Air Magic.
  17:
    description: >-
      An aura: magic damage your characters take is reduced by <good>{aura_percent:1}</> % (at most 30 %). Grows with your Air
      Magic skill (counted up to 50).
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  18:
    name: Chain Lightning
    description: >-
      Discharges electricity from the caster's hand to a single target. It always hits and does {add} points plus
      1-{dice} points of damage per point of skill in Air Magic, then leaps to the nearest monster within reach.
    normal: "Hits one monster"
    expert: "Hits up to 2 monsters"
    master: "Hits up to 3 monsters"
    grandmaster: "Hits up to 4 monsters"
  19:
    master: "Duration 22.5 minutes + 1.5 minutes per point of skill"
    grandmaster: "Duration 45 minutes + 3 minutes per point of skill"
  20:
    description: >-
      Implosion destroys the air around a single target, causing a sudden inrush from the surrounding air, a
      thunderclap, and {add} points plus 1-{dice} points of damage per point of skill in Air Magic.
  21:
    description: >-
      Grants the power of flight to your characters! This spell is very expensive and only works outdoors, but it is
      very useful. Fly will drain one spell point every five minutes it is in use (i.e. when you aren't touching the
      ground). On Hard and harder difficulties, and in Austerity, attacking a monster ends it, except on a few maps.
  22:
    description: >-
      Calls stars from the heavens to smite and burn your enemies. Twenty stars are called, and the damage for each
      star is {add} points plus {dice} per point of skill in Air Magic. Try not to get caught in the blast! This spell
      only works outdoors.

  # Water
  24:
    description: >-
      Sprays poison at monsters directly in front of your characters. Damage is low, but few monsters have resistance
      to Water Magic, so it usually works. Each shot does {add} points of damage plus 1-{dice} per point of skill.
  25:
    description: >-
      An aura: raises your party's Water Resistance by <good>{aura_flat}</> and Luck by <good>{aura_stat}</> %. Grows with your Water
      Magic skill (counted up to 50) and with your level.
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  26:
    description: >-
      Fires a bolt of ice at a single target. The missile does {add} + 1-{dice} points of damage per point of skill in
      Water Magic.
  27:
    description: >-
      An aura: only useful outdoors, Water Walk lets your characters walk along the surface of water without sinking.
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  28:
    name: Empower Magic
    description: >-
      An aura: your party's damage spells deal <good>{aura_percent:1}</> % more damage. Grows with your Water Magic skill
      (counted up to 50).
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  29:
    description: >-
      Acid Burst squirts a jet of extremely caustic acid at a single victim. It always hits and does {add} points of
      damage plus 1-{dice} per point of skill.
  32:
    description: >-
      Fires a ball of ice in the direction the caster is facing. The ball shatters when it hits something, launching 7
      shards of ice in all directions except the caster's. Each shard does {add} points of damage plus 1-{dice} per
      point of skill in Water Magic.

  # Earth
  34:
    description: >-
      Slaps a monster with magical force, forcing it to recover from the stun spell before it can do anything else.
      Stun also knocks monsters back a little. The greater your skill in Earth Magic, the more likely it takes hold of
      strong monsters.
  35:
    description: >-
      Halves the walking speed and doubles the recovery rate of a single monster. Ascension lengthens it; the
      monster's Earth resistance shortens it.
    normal: "Lasts <good>{cc_seconds:1}</> seconds"
    expert: "Lasts <good>{cc_seconds:1}</> seconds"
    master: "Lasts <good>{cc_seconds:1}</> seconds, monster slows to 1/4 speed"
    grandmaster: "Lasts <good>{cc_seconds:1}</> seconds, monster slows to 1/8 speed"
  36:
    description: >-
      An aura: raises your party's Earth Resistance by <good>{aura_flat}</> and Endurance by <good>{aura_stat}</> %. Grows with your
      Earth Magic skill (counted up to 50) and with your level.
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  37:
    description: >-
      Summons a swarm of biting, stinging insects to bedevil a single target. The swarm does {add} points of damage
      plus 1-{dice} per point of skill in Earth Magic.
  38:
    description: >-
      An aura: raises your party's Armor Class by <good>{aura_flat}</>. Grows with your Earth Magic skill (counted up to 50)
      and with your level.
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  39:
    description: >-
      Fires a rotating, razor-thin metal blade at a single monster. The blade does {add} + 1-{dice} points of damage
      per point of skill in Earth Magic. Blades is the only spell that deals physical damage.
  41:
    description: >-
      Releases a magical stone that explodes when it comes into contact with a creature or enough time passes. The
      explosion causes {add} points of damage plus 1-{dice} per point of skill in Earth Magic.
  43:
    description: >-
      Launches a magical stone which bursts in air, sending shards of explosive earth raining to the ground. Each shard
      does {add} + 1-{dice} points of damage per point of skill in Earth Magic. This spell only works outdoors.
  44:
    description: >-
      Increases the weight of a single target enormously for an instant, causing internal damage of <good>{hp_share:1}</> % of
      the monster's current hit points: 15 % plus 0.5 % per point of skill in Earth Magic. Harder difficulties lessen
      it. The bigger they are, the harder they fall.

  # Spirit
  46:
    description: >-
      An aura: raises your party's attack by <good>{aura_flat}</> and Accuracy by <good>{aura_stat}</> %, and their chance to hit. Grows
      with your Spirit Magic skill (counted up to 50) and with your level.
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  47:
    description: >-
      An aura: raises your party's chance of a critical hit by <good>{aura_percent:1}</> %. Grows with your Spirit Magic skill
      (counted up to 50).
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  48:
    description: >-
      Forces all visible undead monsters to flee. Ascension lengthens it; the monsters' Spirit resistance shortens it.
    normal: "Lasts <good>{cc_seconds:1}</> seconds"
    expert: "Lasts <good>{cc_seconds:1}</> seconds"
    master: "Lasts <good>{cc_seconds:1}</> seconds"
    grandmaster: "Lasts <good>{cc_seconds:1}</> seconds"
  49:
    description: >-
      Heals a character and removes the cursed condition if you cast it in time: Expert works if cursed less than one
      hour per point of skill, Master one day per point, Grandmaster at any time.
    normal: ""
    expert: "Heals <good>{heal_base}</> + <good>{heal_per}</> hit points per point of skill"
    master: "Heals <good>{heal_base}</> + <good>{heal_per}</> hit points per point of skill"
    grandmaster: "Heals <good>{heal_base}</> + <good>{heal_per}</> hit points per point of skill"
  50:
    description: >-
      An aura: tightly binds every character's soul to the body. This delays death due to massive hit point loss, but
      will not stop a character from going unconscious.
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  51:
    description: >-
      An aura: your characters' melee attacks deal <good>{aura_percent:1}</> % more damage. Grows with your Spirit Magic skill
      (counted up to 50).
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  52:
    description: >-
      Weakens the link between a target's body and soul, causing {add} + 2-{dice} points of damage per point of skill
      in Spirit Magic to all monsters near the caster.
  53:
    grandmaster: "Removes death and eradication with no time limit"
  54:
    master: "Adds <good>{heal_base}</> + <good>{heal_per}</> hit points per two points of skill to the pool"
    grandmaster: "Adds <good>{heal_base}</> + <good>{heal_per}</> hit points per two points of skill to the pool"
  55:
    grandmaster: "Heals <good>{heal_base}</> + <good>{heal_per}</> hit points per point of skill"
  56:
    name: Meditation
    description: >-
      An aura: your party regains spell points over time. The rate grows with each character's mana pool, with your
      level and with your Mind Magic skill (counted up to 50), and quickens out of combat.
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""

  # Mind
  58:
    description: >-
      An aura: raises your party's Mind Resistance by <good>{aura_flat}</> and Personality by <good>{aura_stat}</> %. Grows with your
      Mind Magic skill (counted up to 50) and with your level.
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  59:
    description: >-
      Fires a bolt of mental force which damages a single target's nervous system. Mind Blast does {add} points of
      damage plus 1-{dice} per point of skill in Mind Magic.
  60:
    description: >-
      Calms a single targeted creature and removes any hostile feelings it has towards your characters. If it takes
      damage, it becomes hostile again. Ascension lengthens it; the monster's Mind resistance shortens it.
    normal: ""
    expert: "Lasts <good>{cc_seconds:1}</> seconds"
    master: "Lasts <good>{cc_seconds:1}</> seconds"
    grandmaster: "Lasts <good>{cc_seconds:1}</> seconds"
  62:
    description: >-
      Causes a single monster to go mad with battle lust, attacking the nearest living creature until the spell wears
      off. Ascension lengthens it; the monster's Mind resistance shortens it.
    normal: ""
    expert: "Lasts <good>{cc_seconds:1}</> seconds"
    master: "Lasts <good>{cc_seconds:1}</> seconds"
    grandmaster: "Lasts <good>{cc_seconds:1}</> seconds"
  63:
    description: >-
      All creatures in the caster's sight fear the caster and flee. Ascension lengthens it; the monsters' Mind
      resistance shortens it.
    normal: ""
    expert: ""
    master: "Lasts <good>{cc_seconds:1}</> seconds"
    grandmaster: "Lasts <good>{cc_seconds:1}</> seconds"
  65:
    description: >-
      Targets a single creature with mind damaging magic. Psychic Shock does {add} points of damage plus 1-{dice} per
      point of skill in Mind Magic.
  66:
    description: >-
      Takes control of a target's mind; enslaved creatures fight monsters that are hostile to the caster. Ascension
      lengthens it; the monster's Mind resistance shortens it.
    grandmaster: "Lasts <good>{cc_seconds:1}</> seconds"

  # Body
  68:
    description: >-
      Heals a single character. Your Personality adds to every heal.
    normal: "Heals <good>{heal_base}</> + <good>{heal_per}</> hit points per point of skill"
    expert: "Heals <good>{heal_base}</> + <good>{heal_per}</> hit points per point of skill"
    master: "Heals <good>{heal_base}</> + <good>{heal_per}</> hit points per point of skill"
    grandmaster: "Heals <good>{heal_base}</> + <good>{heal_per}</> hit points per point of skill"
  69:
    description: >-
      An aura: raises your party's Body Resistance by <good>{aura_flat}</> and Might by <good>{aura_stat}</> %. Grows with your Body
      Magic skill (counted up to 50) and with your level.
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  70:
    description: >-
      Directly inflicts magical damage upon a single creature. Harm does {add} points of damage plus 1-{dice} per
      point of skill in Body Magic.
  71:
    description: >-
      An aura: your party regains hit points over time. The rate grows with each character's hit points, with your
      level and with your Body Magic skill (counted up to 50), and quickens out of combat.
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  73:
    description: >-
      An aura: your characters' unarmed blows deal <good>{aura_percent:1}</> % more damage. Grows with your Body Magic skill
      (counted up to 50).
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  74:
    name: Greater Heal
    description: >-
      Heals a single character and cures disease if you cast it in time: Master works if diseased less than one day
      per point of skill, Grandmaster at any time.
    normal: ""
    expert: ""
    master: "Heals <good>{heal_base}</> + <good>{heal_per}</> hit points per point of skill"
    grandmaster: "Heals <good>{heal_base}</> + <good>{heal_per}</> hit points per point of skill"
  75:
    description: >-
      An aura: your whole party is immune to spells and monster abilities that cause Poison, Disease, Stone,
      Paralysis, Weakness, Death and Eradication.
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  76:
    description: >-
      Flying Fist throws a heavy magical force at a single opponent that does {add} points of damage plus 1-{dice} per
      point of skill in Body Magic.
  77:
    description: >-
      Heals every character in your party at once. Your Personality adds to every heal.
    grandmaster: "Heals <good>{heal_base}</> + <good>{heal_per}</> hit points per point of skill"

  # Light
  78:
    description: >-
      Fires a bolt of light at a single target that does {add} + 1-{dice} points of damage per point of skill in Light
      Magic. Damage against undead is doubled.
  79:
    description: >-
      Undoes the evil magic that extends the lives of the undead, inflicting {add} points of damage plus 1-{dice} per
      point of skill in Light Magic upon a single target. This spell only works on the undead.
  81:
    description: >-
      Paralyze prevents a monster from moving or attacking. Ascension lengthens it; the monster's Light resistance
      shortens it; bosses are held half as long.
    normal: "Lasts <good>{cc_seconds:1}</> seconds"
    expert: "Lasts <good>{cc_seconds:1}</> seconds"
    master: "Lasts <good>{cc_seconds:1}</> seconds"
    grandmaster: "Lasts <good>{cc_seconds:1}</> seconds"
  83:
    description: >-
      An aura: raises all seven stats of your characters by <good>{dog_stat:1}</> %. Grows with your Light Magic skill
      (counted up to 75); the resistance auras' stat bonuses do not add to it.
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  84:
    description: >-
      Inflicts {add} points of damage plus {dice} per point of skill in Light Magic on all creatures in sight. This
      spell can only be cast indoors.
  85:
    description: >-
      An aura: raises all six of your party's resistances by <good>{dop_flat}</>. Grows with your Light Magic skill (counted up
      to 75) and with your level; a stronger resistance aura counts instead.
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  86:
    description: >-
      An aura: gives your party Haste (<good>{hop_haste:1}</> %), Shield (<good>{hop_shield:1}</> %), Stone Skin (+<good>{hop_armor}</> Armor
      Class) and Fate (<good>{hop_fate:1}</> %) at two thirds of your Light Magic skill (counted up to 75); a stronger aura of
      its own counts instead.
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  87:
    description: >-
      Concentrates the light of the sun on one unfortunate creature, doing {add} points of damage plus 1-{dice} per
      point of skill in Light Magic. Indoors it can be cast at any time; outdoors it only works during the day.

  # Dark
  90:
    description: >-
      A poisonous cloud of noxious gases is formed in front of the caster and moves slowly away from your characters.
      The cloud does {add} points of damage plus 1-{dice} per point of skill in Dark Magic and lasts until something
      runs into it.
  91:
    name: Vampiric Aura
    description: >-
      An aura: your party's attacks heal the attacker by part of the damage they deal, up to his or her normal hit
      point maximum: 5 % of melee damage, 2.5 % of missile and spell damage.
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  92:
    description: >-
      Shrinks even the grandest of monsters down to more manageable sizes. Ascension lengthens it; the monster's Dark
      resistance shortens it.
    normal: "Lasts <good>{cc_seconds:1}</> seconds"
    expert: "Lasts <good>{cc_seconds:1}</> seconds, also shrinks 1 more monster near the target"
    master: "Lasts <good>{cc_seconds:1}</> seconds, also shrinks 2 more monsters near the target"
    grandmaster: "Lasts <good>{cc_seconds:1}</> seconds, also shrinks 3 more monsters near the target"
  93:
    description: >-
      Fires a blast of hot, jagged metal in front of the caster, striking any creature that gets in the way. Each piece
      inflicts {add} + 1-{dice} points of damage per point of skill in Dark Magic.
  94:
    description: >-
      Takes control of an undead target's mind; controlled undead fight monsters that are hostile to the caster.
      Ascension lengthens it; the monster's Dark resistance shortens it.
    normal: ""
    expert: "Lasts <good>{cc_seconds:1}</> seconds"
    master: "Lasts <good>{cc_seconds:1}</> seconds"
    grandmaster: "Lasts <good>{cc_seconds:1}</> seconds"
  95:
    description: >-
      An aura: when a monster hits a character, the monster takes damage equal to what it inflicted.
    normal: ""
    expert: ""
    master: ""
    grandmaster: ""
  96:
    description: >-
      Surrounds its target with the power of raw darkness, rendering it unable to fire missile attacks or cast spells,
      and slowing it. Ascension lengthens it; the monster's Dark resistance shortens it.
    master: "Lasts <good>{cc_seconds:1}</> seconds"
    grandmaster: "Lasts <good>{cc_seconds:1}</> seconds"
  97:
    description: >-
      Dragon Breath empowers the caster to exhale a cloud of toxic vapors that targets a single monster and damages all
      creatures nearby, doing {add} + 1-{dice} points of damage per point of skill in Dark Magic.
  98:
    description: >-
      This spell is the town killer. Armageddon inflicts {add} points of damage plus {dice} for every point of Dark
      skill to every creature on the map, including all your characters. It can only be cast three times per day and
      only outdoors.
  99:
    description: >-
      Sucks the life from all creatures in sight, friend or enemy, and gives it to your party in much the same fashion
      as Shared Life. Damage and healing are {add} + 1-{dice} per point of skill.

  # Racial abilities
  103:
    description: >-
      Grants the Dark Elf the power to wield Darkfire, a combination of the powers of Dark and Fire. The target resists
      with its Fire or Dark resistance, whichever is lower. Damage is {add} points plus 1-{dice} per point of skill.
  111:
    description: >-
      Lifedrain damages the target and heals the vampire by a third of the damage done. It does {add} + 1-{dice}
      points of damage per point of skill.
    master: "Damage {mastery_add} + 1-<good>{mastery_dice}</> per point of skill"
    grandmaster: "Damage {mastery_add} + 1-<good>{mastery_dice}</> per point of skill"
  113:
    description: >-
      A vampire using this ability can charm a small group of targets in close proximity. Ascension lengthens it; the
      monsters' resistance shortens it.
    master: "Lasts <good>{cc_seconds:1}</> seconds"
    grandmaster: "Lasts <good>{cc_seconds:1}</> seconds"
  114:
    description: >-
      Mistform cuts the physical damage the vampire takes by 75 %. A vampire in Mistform cannot perform physical
      attacks but can use spells and abilities.
  122:
    description: >-
      Strikes fear into the dragon's opponents, which flee in panic.
    normal: "Lasts <good>{cc_seconds:1}</> seconds"
    expert: "Lasts <good>{cc_seconds:1}</> seconds"
    master: "Lasts <good>{cc_seconds:1}</> seconds, affects all creatures nearby"
    grandmaster: "Lasts <good>{cc_seconds:1}</> seconds, affects all creatures within view"
  123:
    description: >-
      An upgraded version of the dragon's breath. It acts much like a fireball, striking its target and exploding out
      to hit everything near it.
    normal: "Deals 70 % of breath damage"
    expert: "Deals 70 % of breath damage"
    master: "Deals 85 % of breath damage"
    grandmaster: "Deals the full breath damage"

classes:
  # Death Knights know their spells by school mastery (Frost, Blood and Unholy) and pay fixed costs.
  death_knight:
    26:
      description: >-
