# Stat popups (zzMaw-Stats.lua BuildStatInformationBox), keyed by the character screen's stat names. `append` adds a
# paragraph to the stat table's text, `description` replaces it. Numbers are measured against the party's total level
# (<value>{reference_level}</>), as MAW's are:
#   might_bonus, spell_bonus, spell_crit_damage, crit_damage, crit_chance   percents
#   heal_bonus, cost_cut      Personality's healing bonus and spell cost cut, in percent
#   endurance_bonus           the percent of maximum hit points Endurance adds; endurance_levels and
#                             personality_levels, the levels' worth of hit points or spell points their effects add
#   attack_haste, spell_haste the percents Speed takes off attack and spell recovery
#   avoid_chance              the chance a physical blow misses because of Speed
#   hit_chance                the chance a melee blow lands
#   physical_cut, total_cut   the percent of a physical blow armour takes off, and with avoiding blows
#   fire_cut ... body_cut     the percent each resistance takes off a hit
#   hp_regen, sp_regen        hit points and spell points regained per second (faster out of combat)
#   levels_mm6, levels_mm7, levels_mm8, levels_mm9, levels_total   the levels banked in each world
stats:
  Might:
    append: "Melee and bow damage +<good>{might_bonus:1}</> %."
  Intellect:
    description: >-
      Intellect represents a character's ability to reason and understand complex, abstract concepts. Spell damage
      grows with Intellect or Personality, whichever is higher, and spell critical damage with Intellect.
    append: "Spell damage +<good>{spell_bonus:1}</> %. Spell critical damage +<good>{spell_crit_damage:1}</> %."
  Personality:
    description: >-
      Personality represents both a character's strength of will and personal charm. Maximum spell points, spell
      costs and healing power are based on Personality.
    append: >-
      Healing +<good>{heal_bonus:1}</> %. Spell costs -<good>{cost_cut:1}</> %. Personality adds <value>{personality_levels}</> levels' worth of
      spell points.
  Endurance:
    append: >-
      Hit points +<good>{endurance_bonus:1}</> %, and Endurance adds <value>{endurance_levels}</> levels' worth of hit points.
  Accuracy:
    append: "Critical melee and bow damage +<good>{crit_damage:1}</> %."
  Speed:
    append: >-
      Speed changes attack recovery by <good>{attack_haste:1}</> % and spell recovery by <good>{spell_haste}</> %. Physical blows of
      level <value>{reference_level}</> monsters miss <good>{avoid_chance:1}</> % of the time. Grandmaster Dodging dodges
      <good>{dodge_chance:1}</> % of monster attacks.
  Luck:
    append: "Critical chance against level <value>{reference_level}</> monsters: <good>{crit_chance:1}</> %."
  HitPoints:
    append: >-
      Regenerates <good>{hp_regen:1}</> hit points per second; twice that 20 seconds after the last hit taken, four times more
      again with no enemy near.
  SpellPoints:
    append: >-
      Regenerates <mana>{sp_regen:1}</> spell points per second; twice that 20 seconds after spell points last dropped,
      four times more again with no enemy near.
  ArmorClass:
    append: >-
      Against level <value>{reference_level}</> monsters armour takes <good>{physical_cut:1}</> % off physical blows; with the blows
      Speed avoids, <good>{total_cut:1}</> % on average.
  Attack:
    append: "Melee hit chance against level <value>{reference_level}</> monsters: <good>{hit_chance:1}</> %."
  Level:
    append: >-
      Levels banked: <value>{levels_total:1}</> in all; <value>{levels_mm6:1}</> in Enroth, <value>{levels_mm7:1}</> in Antagarich, <value>{levels_mm8:1}</>
      in Jadame, <value>{levels_mm9:1}</> in Chedian. Monsters grow with the levels banked in the other worlds: bolster
      level <value>{bolster_mm6}</> in Enroth, <value>{bolster_mm7}</> in Antagarich, <value>{bolster_mm8}</> in Jadame,
      <value>{bolster_mm9}</> in Chedian.
  FireResistance:
    append: "Against level <value>{reference_level}</> monsters it takes <good>{fire_cut:1}</> % off fire hits."
  AirResistance:
    append: "Against level <value>{reference_level}</> monsters it takes <good>{air_cut:1}</> % off air hits."
  WaterResistance:
    append: "Against level <value>{reference_level}</> monsters it takes <good>{water_cut:1}</> % off water hits."
  EarthResistance:
    append: "Against level <value>{reference_level}</> monsters it takes <good>{earth_cut:1}</> % off earth hits."
  MindResistance:
    append: "Against level <value>{reference_level}</> monsters it takes <good>{mind_cut:1}</> % off mind hits."
  BodyResistance:
    append: "Against level <value>{reference_level}</> monsters it takes <good>{body_cut:1}</> % off body hits."

