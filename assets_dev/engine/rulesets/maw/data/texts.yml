# Skill popups (TRAINERS_SKILLS.md §7, zzMAW-Skills.lua and SkillTooltip.lua), keyed by canonical skill name. `append`
# adds a paragraph to the skill table's description, `description` replaces it; mastery lines replace the table's, and
# {table} stands for the table's own line. Placeholders as for spells, plus:
#   regen_now, regen_next     Regeneration's HP per second now and with one more point (out of combat it is faster)
#   med_now, med_next         Meditation's SP per second now and with one more point
#   asc_damage_base, asc_damage_scaling, asc_heal_base, asc_heal_scaling, asc_mana, asc_cc_mana, asc_cast   Ascension's
#                             percents; asc_mana_change and asc_cc_mana_change the mana ones signed and coloured
#   cover_chance              the chance to cover an ally now
#   mana_efficiency           damage one spell point absorbs
#   ladder_expert, ladder_master, ladder_grandmaster   the levels a self-taught skill gains its masteries at
#   school_cut                the share of hits a Death Knight's Blood or Unholy (or a Shaman's Air) takes off
#   school_damage             a class's flat melee damage from the school
#   elemental_progress_line   an Elementalist's progress to the next spell of the school, naming it (a line)
#   dragon_leech              a dragon's bite leech from Regeneration (its own paragraph; empty for other races)
#   armor_items               the worn armour's Armor Class and the skill's bonuses (a paragraph; empty without it)
#   guard_line                Staff, Sword, Spear: what the weapons of the skill in hand give now (a paragraph; empty
#                             without one)
skills:
  Staff:
    append: >-
      Each point raises the damage of the staff by 2 % (never less than 1 per point). At Grandmaster, Unarmed adds half
      its skill to a staff's damage. From Expert, a staff in hand also adds Armor Class, and as much to the whole
      party's resistances: the percent below of the staff's guard (it grows with the staff's power) for each point of
      skill, counted as if you had 10 more points. {stun_line}{guard_line}
    normal: "Attack +1 per point"
    expert: "Attack +2 per point; Armor Class and party resistances 2 % of the guard per point"
    master: "Attack +3 per point; Armor Class and party resistances 3 % of the guard per point; a chance to paralyse
      for 2 s"
    grandmaster: "Attack +4 per point; Armor Class and party resistances 4 % of the guard per point; usable with
      Unarmed, paralysis lasts 4 s"
  Sword:
    append: >-
      Each point raises the damage of the sword, Armsmaster and special abilities by 2 % (never less than 1 per
      point). From Master, a sword in hand also adds Armor Class: the percent below of the sword's guard (it grows
      with the sword's power) for each point of skill, counted as if you had 10 more points.{guard_line}
    normal: "Attack +1 per point"
    expert: "Attack +2, speed +1 % per point"
    master: "Attack +3, speed +1 % per point; Armor Class 1 % of the guard per point; can dual wield"
    grandmaster: "Attack +4, speed +2 % per point; Armor Class 2 % of the guard per point"
  Dagger:
    append: >-
      Each point raises the damage of the dagger, Armsmaster and special abilities by 2 % (never less than 1 per
      point). Critical chance falls as monsters grow stronger, up to level 600.
    normal: "Attack +1 per point"
    expert: "Attack +2 per point; can dual wield"
    master: "Attack +3 per point; critical chance 5 % + 1 % per point"
    grandmaster: "Attack +4, speed +1 % per point"
  Axe:
    append: >-
      Each point raises the damage of the axe, Armsmaster and special abilities by 2 % (never less than 1 per point).
      Dwarves and Minotaurs can wield a one-handed axe in the off hand from Expert; Minotaurs hold a two-handed axe in
      one hand, and in the off hand from Master.
    normal: "Attack +1 per point"
    expert: "Attack +2, speed +1 % per point"
    master: "Attack +3, speed +1 % per point"
    grandmaster: "Attack +4, speed +1 % per point; critical damage +1 % per point"
  Spear:
    append: >-
      Each point raises the damage of the spear, Armsmaster and special abilities by 2 % (never less than 1 per
      point). From Expert, a spear in hand also adds Armor Class: the percent below of the spear's guard (it grows
      with the spear's power) for each point of skill, counted as if you had 10 more points.{guard_line}
    normal: "Attack +2 per point"
    expert: "Attack +4 per point; Armor Class 4 % of the guard per point"
    master: "Attack +6 per point; Armor Class 6 % of the guard per point; can hold with one hand"
    grandmaster: "Attack +8 per point; Armor Class 8 % of the guard per point; each blow makes the target take {spear_stack}% more physical damage,
      stacking until it dies (half again with a halberd)"
  Bow:
    append: >-
      Each point adds 1 to the bow's damage and raises it by 4 % (never less than 1 per point).
    normal: "Attack +1 per point"
    expert: "Attack +2, speed +1 % per point"
    master: "Attack +3, speed +1 % per point; shoots 2 arrows"
    grandmaster: "Attack +4, speed +2 % per point; shoots fire arrows, dealing the higher of fire and physical damage"
  Mace:
    append: >-
      Each point raises the damage of the mace, Armsmaster and special abilities by 2 % (never less than 1 per point).
      {stun_line}
    normal: "Attack +1 per point"
    expert: "Attack +2 per point"
    master: "Attack +3 per point; a chance to paralyse for 2 s"
    grandmaster: "Attack +4 per point; paralysis lasts 4 s"
  Blaster:
    append: >-
      Each point raises the blaster's damage by 4 % (never less than 1 per point).
    normal: "Attack +1 per point"
    expert: "Attack +2 per point"
    master: "Attack +3 per point"
    grandmaster: "Attack +4 per point"
  Unarmed:
    append: >-
      Unarmed blows deal 2 extra damage per point.
    normal: "Attack +2 per point"
    expert: "Attack +2, speed +1 % per point"
    master: "Attack +3, speed +1 % per point"
    grandmaster: "Attack +3, speed +2 % per point"
  Shield:
    append: >-
      Shield skill raises the Armor Class and resistances your shield gives by a percent per point.{armor_items}
    normal: "Armor Class +4 %, resistances +4 % per point"
    expert: "Armor Class +6 %, resistances +6 % per point; no recovery penalty"
    master: "Armor Class +8 %, resistances +8 % per point"
    grandmaster: "Armor Class +10 %, resistances +10 % per point; 15 % less damage taken"
  LeatherArmor:
    append: >-
      Wearing leather armor, the skill raises the Armor Class and resistances of all the armor you wear by a percent
      per point.{armor_items}
    normal: "Armor Class +3 %, resistances +2 % per point"
    expert: "Armor Class +4 %, resistances +3 % per point; no recovery penalty"
    master: "Armor Class +5 %, resistances +4 % per point"
    grandmaster: "Armor Class +6 %, resistances +5 % per point"
  ChainArmor:
    append: >-
      Wearing chain armor, the skill raises the Armor Class and resistances of all the armor you wear by a percent
      per point.{armor_items}
    normal: "Armor Class +3 %, resistances +1 % per point"
    expert: "Armor Class +4 %, resistances +2 % per point; recovery penalty halved"
    master: "Armor Class +5 %, resistances +3 % per point; no recovery penalty"
    grandmaster: "Armor Class +6 %, resistances +4 % per point"
  PlateArmor:
    append: >-
      Wearing plate armor, the skill raises the Armor Class and resistances of all the armor you wear by a percent per
      point.{armor_items}
    normal: "Armor Class +3 % per point"
    expert: "Armor Class +4 %, resistances +1 % per point; recovery penalty halved"
    master: "Armor Class +5 %, resistances +2 % per point"
    grandmaster: "Armor Class +6 %, resistances +3 % per point; no recovery penalty"
  Dodging:
    normal: "Armor Class +4 per point"
    expert: "Armor Class +5 per point"
    master: "Armor Class +6 per point; usable with leather armor"
    grandmaster: "Armor Class +6 per point; a chance to dodge a blow, growing with the skill; usable with leather armor"
  Armsmaster:
    description: >-
      Armsmaster represents a warrior's tricks of the trade with every weapon but staves: faster, smoother attacks
      and more powerful blows. Its damage grows with the weapon skill. Knights reach Supreme Armsmaster by
      themselves at a high skill: Supreme Armsmaster comes at <value>{supreme_level}</> points with Grandmaster, and each
      10 points of Armsmaster then raise every melee weapon skill by 1, up to double its base. Supreme Armsmaster
      adds 2 damage per point.
    normal: "Each point adds 1 attack"
    expert: "Each point adds 1 damage, 1 attack"
    master: "Each point adds 1 damage, 1 attack, 1 % speed"
    grandmaster: "Each point adds 1.5 damage, 1 attack, 1 % speed"
  Bodybuilding:
    append: >-
      Hit points also grow by 0.5 %, 1 %, 1.5 % or 2 % per point, by mastery.
  Regeneration:
    append: >-
      Current regeneration: <good>{regen_now:1}</> hit points per second (<good>{regen_next:1}</> with one more
      point).{dragon_leech}
    normal: "Regains hit points over time"
    expert: "Half again as much"
    master: "Twice as much"
    grandmaster: "Twice as much, more the more hit points are lost"
  Meditation:
    append: >-
      Current meditation: <mana>{med_now:1}</> spell points per second (<mana>{med_next:1}</> with one more point); twice that 20
      seconds after spell points last dropped, four times more again with no enemy near.
    normal: "Regains spell points over time"
    expert: "A quarter more"
    master: "Half again as much"
    grandmaster: "Twice as much"
  Learning:
    append: |-
      Current bonuses:
      Spell damage: +<good>{asc_damage_base}</> % base, +<good>{asc_damage_scaling}</> % per point of skill
      Healing: +<good>{asc_heal_base}</> % base, +<good>{asc_heal_scaling}</> % per point of skill
      Mana cost: {asc_mana_change}; control spells: {asc_cc_mana_change}
      Cast time: <bad>+{asc_cast} %</>
  Perception:
    normal: "{table}; traps and lava hurt 10 % less"
    expert: "{table}; traps and lava hurt 30 % less"
    master: "{table}; traps and lava hurt 50 % less"
    grandmaster: "{table}; traps and lava hurt 70 % less"
  Merchant:
    append: >-
      The party's best merchant prices every deal: skill times mastery, plus Glamour; a Grandmaster or a total of 45
      buys and sells at cost. Reputation does not change prices.
  IdentifyMonster:
    append: >-
      The party knows a monster when its best skill times mastery reaches the monster's level less the party's
      average level, or anyone is a Grandmaster; the best mastery decides how much it learns.
  Alchemy:
    append: >-
      A Master finds random reagents on 1 % of slain monsters, a Grandmaster on 2 %.
    # zzAlchemy.lua:708-709.
    master: "Can mix white potions; potions you mix get 1.5 power per point of skill"
    grandmaster: "Can mix black potions; potions you mix get 2 power per point of skill and last 6 minutes longer per
      point. Monsters can drop Endless potions, whose power depends on your Alchemy skill"
  Cover:
    append: >-
      Current cover chance: <good>{cover_chance}</> %. Mastery comes by itself at <value>{ladder_expert}</>, <value>{ladder_master}</> and
      <value>{ladder_grandmaster}</> points. The gem beside its name on the skills page (or P) switches it:
      {cover_state}.
  ManaShield:
    append: >-
      Now each spell point absorbs <mana>{mana_efficiency:2}</> damage. The gem beside its name on the skills
      page (or M) switches it: {mana_shield_state}.
  Enlightenment:
    append: >-
      Mastery comes by itself at <value>{ladder_expert}</>, <value>{ladder_master}</> and <value>{ladder_grandmaster}</> points.
  Retaliation:
    append: >-
      Mastery comes by itself at <value>{ladder_expert}</>, <value>{ladder_master}</> and <value>{ladder_grandmaster}</> points.
      Its damage is the skill times two coefficients: Melee Power <bad>{retaliation_power}</> and Vitality
      <bad>{retaliation_vitality}</>, now <bad>{retaliation_damage}</> damage. Balancing power and vitality gives the most.

class_skills:
  death_knight:
    WaterMagic:
      description: >-
        Frost, only for Death Knights: melee damage +0.5, +0.75 or +1 per point (Novice, Expert, Master; Grandmaster
        adds nothing more) and attack speed +1 % per point. Its mastery unlocks Icy Touch, Water Walk, Frostbite and
        Ice Bomb.
      normal: "Effects vary per spell"
      expert: "Effects vary per spell"
      master: "Effects vary per spell"
      grandmaster: "Effects vary per spell"
    BodyMagic:
      description: >-
        Blood, only for Death Knights: physical damage taken falls by <good>{school_cut:1}</> %. Its mastery unlocks Blood
        Leech, Regeneration, Asphyxiate and Superior Blood Leech; while Blood Leech is on, your blows leech life.
      normal: "Effects vary per spell"
      expert: "Effects vary per spell"
      master: "Effects vary per spell"
      grandmaster: "Effects vary per spell"
    DarkMagic:
      description: >-
        Unholy, only for Death Knights: melee damage +0.5, +0.75 or +1 per point (Novice, Expert, Master) and magic
        damage taken falls by <good>{school_cut:1}</> %. Its mastery unlocks Vampiric Aura, Death Coil, Death Grasp and Death
        Breath.
      normal: "Effects vary per spell"
      expert: "Effects vary per spell"
      master: "Effects vary per spell"
      grandmaster: "Effects vary per spell"
  assassin:
    FireMagic:
      description: >-
        Combat lets an Assassin endure long fights: each blow has a 10 % chance, plus 1 % per point, to restore 15
        energy.
      normal: "Melee attack costs 45 energy"
      expert: "Melee attack costs 40 energy"
      master: "Melee attack costs 35 energy"
      grandmaster: "Melee attack costs 30 energy"
    AirMagic:
      description: >-
        Subtlety: each blow that spends energy grants a stack (up to 5) raising attack speed by 0.5 % per point, and
        kills restore energy.
      normal: "Killing a monster restores 10 energy"
      expert: "Killing a monster restores 15 energy"
      master: "Killing a monster restores 20 energy"
      grandmaster: "Killing a monster restores 25 energy"
    WaterMagic:
      description: >-
        Poisons: each blow deals extra water damage of 0.1 % of the target's hit points per point, and energy
        regenerates faster.
      normal: "You regenerate 8 energy per second"
      expert: "You regenerate 10 energy per second"
      master: "You regenerate 12 energy per second"
      grandmaster: "You regenerate 14 energy per second"
    EarthMagic:
      description: >-
        Assassination: blows that spend energy, and spells, deal 2, 3, 4 or 5 more damage per point by mastery, 20 %
        less for each other monster near the target (up to 4). Such blows grant a combo point for offensive spells;
        arrows half as often. Higher levels also give more energy.
      normal: "Maximum energy +10"
      expert: "Maximum energy +20"
      master: "Maximum energy +30"
      grandmaster: "Maximum energy +40"
  dragon:
    DragonAbility:
      description: >-
        Dragons are powerful creatures with innate abilities. Like the racial abilities of Dark Elves and Vampires,
        Dragon abilities are cast like spells but acquired like skills: Fear from the start, then Breath Weapon, Flight
        and Wing Buffet at Expert, Master and Grandmaster.

        Breath damage is 20 + 2 per level (up to level {dragon_level_cap}), raised by 3, 4, 5 or 6 % per point of
        Dragon Ability at Novice, Expert, Master or Grandmaster. Each point also makes the breath 1.5 % slower and
        1.5 % stronger. While Dragon Ability is at least as high as Fangs, bites throw monsters back.
    Unarmed:
      description: >-
        Dragons use their fangs to deal atrocious damage to enemies. Damage is 30 + 2 per level (up to level
        {dragon_level_cap}); the Fangs skill raises it by a percentage of mastery and skill level. Each point also
        makes the bite 1.5 % slower and 1.5 % stronger, so fewer, heavier bites deal the same damage over time. While
        Dragon Ability is at least as high as Fangs, each bite also throws the monster back.
      normal: "Attack +2, damage +4 % per point"
      expert: "Attack +3, damage +6 % per point"
      master: "Attack +4, damage +8 % per point"
      grandmaster: "Attack +5, damage +10 % per point"
    Dodging:
      description: >-
        Dragon scales are hard enough to work as natural armour: 40 + 1 Armor Class per level (up to level
        {dragon_level_cap}). The Scales skill raises that toughness, and the resistance to magic, by a percentage per
        point. Dragons cannot dodge.
      normal: "Armor Class +2 %, resistances +1 % per point"
      expert: "Armor Class +3 %, resistances +1 % per point"
      master: "Armor Class +3 %, resistances +2 % per point"
      grandmaster: "Armor Class +4 %, resistances +3 % per point"
  shaman:
    FireMagic:
      append: >-
        Shaman: your melee blows also deal fire damage equal to <good>{school_share:1}</> % of the monster's
        current hit points (0.1 % per point, at least 1 damage per point).

        Every point in any of the seven schools also adds 0.5 % to a Shaman's spell damage and 0.25 % to
        healing, and every 7 points across the seven schools count as 1 point of Ascension for spell costs
        and healing.
    AirMagic:
      append: >-
        Shaman: all damage you take is reduced by <good>{school_cut:1}</> %.

        Every point in any of the seven schools also adds 0.5 % to a Shaman's spell damage and 0.25 % to
        healing, and every 7 points across the seven schools count as 1 point of Ascension for spell costs
        and healing.
    WaterMagic:
      append: >-
        Shaman: every hit you take is reduced by a further <good>{school_flat_cut}</> damage after
        resistances.

        Every point in any of the seven schools also adds 0.5 % to a Shaman's spell damage and 0.25 % to
        healing, and every 7 points across the seven schools count as 1 point of Ascension for spell costs
        and healing.
    EarthMagic:
      append: >-
        Shaman: your melee blows deal 0.5, 1, 1.5 or 2 extra damage per point at Novice, Expert, Master or
        Grandmaster.

        Every point in any of the seven schools also adds 0.5 % to a Shaman's spell damage and 0.25 % to
        healing, and every 7 points across the seven schools count as 1 point of Ascension for spell costs
        and healing.
    SpiritMagic:
      append: >-
        Shaman: your melee damage is raised by <good>{school_percent:1}</> % (1 % per point).

        Every point in any of the seven schools also adds 0.5 % to a Shaman's spell damage and 0.25 % to
        healing, and every 7 points across the seven schools count as 1 point of Ascension for spell costs
        and healing.
    MindMagic:
      append: >-
        Shaman: each of your melee blows restores <mana>{mind_sp}</> spell points.

        Every point in any of the seven schools also adds 0.5 % to a Shaman's spell damage and 0.25 % to
        healing, and every 7 points across the seven schools count as 1 point of Ascension for spell costs
        and healing.
    BodyMagic:
      append: >-
        Shaman: each of your melee blows restores <good>{body_hp}</> hit points.

        Every point in any of the seven schools also adds 0.5 % to a Shaman's spell damage and 0.25 % to
        healing, and every 7 points across the seven schools count as 1 point of Ascension for spell costs
        and healing.
  seraphim:
    SpiritMagic:
      append: >-
        Seraphim: every hit you take is reduced by <good>{school_flat_cut}</> damage after resistances, which shrugs off
        light hits and softens heavy ones.
    MindMagic:
      append: >-
        Seraphim: Mind adds <good>{school_damage}</> damage to each blow, growing with Might, weapon speed and the weapon's
        damage multiplier.
      normal: "Damage +1 per point"
      expert: "Damage +1.5 per point"
      master: "Damage +2 per point"
      grandmaster: "Damage +2 per point"
    BodyMagic:
      append: >-
        Seraphim: Body heals the party member with the lowest share of hit points on each blow, growing with
        Personality and weapon speed. Current heal: <good>{seraph_heal}</> hit points.
      normal: "Melee blows heal"
      expert: "Twice the healing"
      master: "Three times the healing"
      grandmaster: "Three times the healing"
    LightMagic:
      append: >-
        Seraphim: Light quickens the Seraph's strikes and lightens the blade so a two-handed sword fits in one hand,
        freeing the other for a shield.
      normal: "Attack speed +0.5 % per point"
      expert: "Attack speed +1 % per point"
      master: "Attack speed +1.5 % per point"
      grandmaster: "Attack speed +2 % per point"
  elementalist:
    FireMagic:
      append: >-
        Offensive spells cast from the quick or attack spell build Elemental stacks, and each cast turns that spell
        into another known one of the same kind: single target, shotgun or area. Each stack adds 10 % spell damage
        and 5 % casting speed, and raises the mana cost by 7.5 % (Elementalists cast half again as slowly without
        stacks). A weapon hit spends them all, a cast from the spellbook starts again at one, and they halve once
        you stop casting. The Rotation gem on the skills page's Magic heading (or R) turns the rotation and stacks on or off: {rotation}.

        Elementalists learn spells by casting them at monsters instead of from books. {elemental_progress_line}
    AirMagic:
      append: >-
        Offensive spells cast from the quick or attack spell build Elemental stacks, and each cast turns that spell
        into another known one of the same kind: single target, shotgun or area. Each stack adds 10 % spell damage
        and 5 % casting speed, and raises the mana cost by 7.5 % (Elementalists cast half again as slowly without
        stacks). A weapon hit spends them all, a cast from the spellbook starts again at one, and they halve once
        you stop casting. The Rotation gem on the skills page's Magic heading (or R) turns the rotation and stacks on or off: {rotation}.

        Elementalists learn spells by casting them at monsters instead of from books. {elemental_progress_line}
    WaterMagic:
      append: >-
        Offensive spells cast from the quick or attack spell build Elemental stacks, and each cast turns that spell
        into another known one of the same kind: single target, shotgun or area. Each stack adds 10 % spell damage
        and 5 % casting speed, and raises the mana cost by 7.5 % (Elementalists cast half again as slowly without
        stacks). A weapon hit spends them all, a cast from the spellbook starts again at one, and they halve once
