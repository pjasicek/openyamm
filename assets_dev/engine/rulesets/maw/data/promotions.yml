# MAW promotions (devdocs/maw/data/promotions.yml, CL:7-155): the quest bits that count as a class kind's
# promotion completed on each world, and for MAW's own kinds the first-tier bits that promote step 0 to step 1.
# mm6: either bit; mm7: any bit; mm8: the bit, or the award (any party member) or second bit; mm9 (Chedian, the user
# 2026-11-09: as MM6-MM8, by the closest MM9 promotion quest): any of the done keys (QBit 90000 + key) of MM9's
# second-tier quests of the line's theme: Gladiator 221 (knights, monks, minotaurs, trolls, dragons), Assassin 227
# (thieves, vampires), Paladin 237, Ranger 249 (rangers, archers), Priest 261, Druid 280 (druids, dark elves), Mage 294
# and Lich 299 (sorcerers, necromancers). MAW's own kinds take MM9's first tier as `mid` too: Healer 213 (Seraphim,
# Shaman), Mercenary 127 (Death Knight), Scholar 205 (Elementalist). Chedian counts as a fourth world: two worlds make
# a final class Elder (x1.25 HP and SP per level), three Ultimate (x1.5), all four Supreme (x1.75; ours, DEVIATIONS 183).
