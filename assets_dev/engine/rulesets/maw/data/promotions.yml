# MAW promotions (devdocs/maw/data/promotions.yml, CL:7-155): the quest bits that count as a class kind's
# promotion completed on each world, and for MAW's own kinds the first-tier bits that promote step 0 to step 1.
# mm6: either bit; mm7: any bit; mm8: the bit, or the award (any party member) or second bit; mm9 (Chedian, the user
# 2026-11-09: as MM6-MM8, by the closest MM9 promotion quest): any of the done keys (QBit 90000 + key) of MM9's
# second-tier quests of the line's theme: Gladiator 221 (knights, monks, minotaurs, trolls, dragons), Assassin 227
# (thieves, vampires), Paladin 237, Ranger 249 (rangers, archers), Priest 261, Druid 280 (druids, dark elves), Mage 294
# and Lich 299 (sorcerers, necromancers). MAW's own kinds take MM9's first tier as `mid` too: Healer 213 (Seraphim,
# Shaman), Mercenary 127 (Death Knight), Scholar 205 (Elementalist). Chedian counts as a fourth world: two worlds make
# a final class Elder (x1.25 HP and SP per level), three Ultimate (x1.5), all four Supreme (x1.75; ours, DEVIATIONS 183).
# xeen (the World of Xeen, MAW's fifth world, devdocs/maw/XEEN_SUPPORT.md; MM9's rule): any of the quest bits that open
# the line's Xeen tier-2 promotion, Light or Dark (Xeen.Promotions; the bit each later promoter's topic waits for):
# Champion 114522 / Black Knight 113344 (knights, Death Knights), Hero 113127 / Villain 113344 (paladins), Ranger Lord
# 113201 / Bounty Hunter 113228 (rangers), Master Archer 113407 / Sniper 113384 (archers), Priest of Light 113127 /
# Dark 113462 (clerics, Seraphim), Arch Druid 114560 / Warlock 113449 (druids, Shamans), Master 113066 / Ninja 114540
# (monks), Spy 113281 / Assassin 113384 (thieves), Archmage 113365 / Lich 113462 (sorcerers, necromancers;
# Elementalists Archmage only), and the racial ones: Minotaur Lord 113500, War Troll 113262, Nosferatu 112141, Great
# Wyrm 112507, Patriarch 112341 (the dark elves). MAW's own kinds take Xeen's first tier as `mid` too: Seasons 112201
# (Seraphim, Shaman), Crusade 110047 (Death Knight), Pendant 110204 (Elementalist). Xeen counts as one more world:
# Supreme stays at four worlds (any four of the five), the factor at x1.75.
