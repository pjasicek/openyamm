# Item data of the MAW ruleset (MAW ef23ee17), generated from devdocs/maw/data/legendary_affixes.yml, loot.yml and
# devdocs/maw/data/artifacts.yml. legendary_affixes: the tooltip text of each affix by MAW id (11-35).
# artifacts: the artifacts a drop can turn into, with their drop weight (list slots), base model
# (weapon: a top-rung weapon at the party's level; armor: printed AC + reference AC x power / 40; flat: printed AC),
# and stat budget in units of one perfect Epic enchant at the party's level (see ITEMS.md section 4.2).
# guard: a weapon artifact's flat damage as Staff, Sword and Spear guard by it, its printed Mod2 after MAW's artifact
# upscaler (x2 for artWeap1h, x3 for artWeap2h, zzMaw-Items.lua:2330-2346; audit FITM-2-2).

legendary_affixes:
  11: "Killing a monster with a single-target attack halves the recovery time"
  12: "Might and accuracy enchantments give 40% bonus to intellect and personality. Intellect and personality enchantments give 40% bonus to might and accuracy"
  13: "Immunity to all status effects from monsters"
  14: "Crit chance increased by 10% and crit chance over 100% increases total damage"
  15: "Divine protection (instead of dying you go back to 25% HP, once every 5 minutes)"
  16: "Increase the effect of resistances base enchants by 50%"
  17: "Your hits deal 2% of current monster HP as physical damage (1% for AoE, multi-hit spells and arrows). Damage is increased by weapon base attack speed or Ascensions for spells."
  18: "Reduce all damage taken by 10%"
  19: "Increases damage from weapon enchants by 50%"
  20: "Meditation restores 1% more mana for each 1% of your mana reserved by buffs"
  21: "Increase melee damage by 5% for each enemy in the nearbies"
  22: "Reduces damage by 3% for each enemy in the nearbies"
  23: "Successfully covering an ally restores 3% of your HP"
  24: "Killing a Monster restores 10% of Health and 5% of Mana, counted on the pool left after buffs reserve theirs"
  25: "Increases Ascension Skill level by 10"
  26: "Your weapon enchants can deal critical damage"
  27: "Leech overhealing heals the most injured party member instead"
  28: "AC gained from armors is increased by 50%"
  29: "Each attack makes the monster take 1% more damage of any kind, stacking until it dies"
  30: "Threshold HP to determine death/eradication is the higher of HP and SP, multiplied by mana shield efficiency"
  31: "Leech also restores Mana, but its effect is halved"
  32: "Buffs reserve Hit Points instead of Mana and Hit Point coefficient is used instead. Enlightenment bonus still apply."
  33: "Increase Melee weapon skill by 10"
  34: "Overhealing refunds mana"
  35: "Overhealing reduces recovery time equal to half overhealing amount"

