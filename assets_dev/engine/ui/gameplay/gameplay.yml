# Native Obsidian UI; see level_generation/ui/obsidian_engine_handoff_20260928/NATIVE_INTEGRATION.md
screen: OutdoorHud
elements:
- id: OutdoorBasebar
  anchor: bottom_center
  width: 640
  height: 114
  z_index: 200
  scale:
    min: 1.0
    max: 8.0
  asset:
    default: obsidian_hud_fullscreen_basebar
  notes: Carved Obsidian status revision from 2116. Fixed 640x114; clear status/input rail, 22.4 high.
  children:
  - id: OutdoorPartyStrip
    anchor: top_left
    width: 483
    height: 114
    notes: Shared gameplay split arcs and indicators, fitted to the fixed 4:3 carved frame and clear status rail.
