        offset_x: 16.333333
        offset_y: 8.0
        width: 45.333333
        height: 60.266667
        notes: Existing overlay portrait size and animated expressions; ellipse clip.
      - id: ObsidianOverlayPc1Rim
        anchor: top_left
        offset_x: 15.033333
        offset_y: 6.7
        width: 47.933333
        height: 62.866667
        meter_arc:
          start_degrees: -90
          sweep_degrees: 360
          stroke_width: 0.85
      - id: ObsidianOverlayPc1Selection
        anchor: top_left
        offset_x: 29
        offset_y: -5.5
        width: 20
        height: 20
        asset:
          default: obsidian_hud_selection_diamond
      - id: ObsidianOverlayPc1Health
        anchor: top_left
        offset_x: 9.893333
        offset_y: 1.573333
        width: 58.213333
        height: 73.12
        meter_arc:
          start_degrees: 100
          sweep_degrees: 160
          stroke_width: 4.6
        notes: Shared gameplay HP arc, colours and damage trail; left side fills upward.
