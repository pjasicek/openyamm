        offset_x: 9.893333
        offset_y: 1.573333
        width: 58.213333
        height: 73.12
        meter_arc:
          start_degrees: 80
          sweep_degrees: -160
          stroke_width: 4.6
        notes: Shared blue SP arc; omit the entire gauge when maximum SP is zero.
      - id: ObsidianOverlayPc1Readiness
        anchor: top_left
        offset_x: 4.2
        offset_y: 63.3
        width: 11.6
        height: 13.2
