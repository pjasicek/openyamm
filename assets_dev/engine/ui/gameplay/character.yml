# Native Obsidian UI; see level_generation/ui/obsidian_engine_handoff_20260928/NATIVE_INTEGRATION.md
screen: Character
elements:
- id: CharacterRoot
  anchor: center
  width: 640
  height: 480
  scale:
    min: 1.0
    max: 8.0
  notes: Character screen rooted to the classic MM8 composition from the reference screenshot.
  children:
  - id: CharacterTopBar
    anchor: top_center
    width: 640
    height: 29
    z_index: 50
    asset:
      default: obsidian_topbar
    notes: Duplicated from the gameplay HUD so character pages can layer independently above it.
    children:
    - id: CharacterGoldFoodIcon
      anchor: top_left
      offset_x: 0
      width: 180
      height: 29
      notes: Gold and food background art.
      offset_y: 0
      children:
      - id: CharacterGoldArt
        anchor: top_left
        offset_x: 18
        offset_y: 7
        width: 22
        height: 14
        asset:
          default: scorebg_gold
      - id: CharacterFoodArt
        anchor: top_left
        offset_x: 107
        offset_y: 7
        width: 22
        height: 14
        asset:
          default: scorebg_food
    - id: CharacterGoldLabel
      anchor: top_left
      offset_x: 44
      width: 59
      height: 29
      text:
        value: '{gold}'
        font: Lucida
        align_x: center
        align_y: middle
        color: '#e5dcc7'
        scale: 0.6588235294117647
      notes: Gold counter.
      offset_y: 0
