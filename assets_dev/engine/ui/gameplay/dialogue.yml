# Native Obsidian UI; see level_generation/ui/obsidian_engine_handoff_20260928/NATIVE_INTEGRATION.md
screen: Dialogue
elements:
- id: DialogueRoot
  anchor: center
  width: 640
  height: 480
  scale:
    min: 1.0
    max: 8.0
  notes: Shared dialogue root for common scaling and grouping.
  children:
  - id: DialogueTopBar
    anchor: top_center
    width: 640
    height: 29
    z_index: 50
    asset:
      default: obsidian_topbar
    notes: Duplicated from the gameplay HUD so character pages can layer independently above it.
    children:
    - id: DialogueGoldFoodIcon
      anchor: top_left
      offset_x: 0
      width: 180
      height: 29
      notes: Gold and food background art.
      offset_y: 0
      children:
      - id: DialogueGoldArt
        anchor: top_left
        offset_x: 18
        offset_y: 7
        width: 22
        height: 14
        asset:
          default: scorebg_gold
      - id: DialogueFoodArt
        anchor: top_left
        offset_x: 107
        offset_y: 7
        width: 22
        height: 14
        asset:
          default: scorebg_food
    - id: DialogueGoldLabel
      anchor: top_left
      offset_x: 44
      width: 59
      height: 29
      text:
        value: '{gold}'
        font: Lucida
        align_x: center
        align_y: middle
        color: '#e5dcc7'
        scale: 0.6588235294117647
      notes: Gold counter.
      offset_y: 0
    - id: DialogueFoodLabel
      anchor: top_left
      offset_x: 132
      width: 40
      height: 29
      text:
        value: '{food}'
        font: Lucida
        align_x: center
        align_y: middle
        color: '#e5dcc7'
        scale: 0.6588235294117647
      notes: Food counter.
      offset_y: 0
  - id: DialogueFrame
    anchor: bottom_left
    offset_x: 3
    offset_y: 0
    width: 470
    height: 0
    z_index: -20
    asset:
      default: obsidian_reading_surface
    notes: Body-only sheet. Runtime measures text/height, samples the surface, draws top/side frame slices; open bottom
      meets party bar.
    children:
    - id: DialogueFrameEndCap
      anchor: above
      width: 470
      height: 8
      notes: Retired decorative end cap; shared alpha frame owns the top edge.
      visible: false
    - id: DialogueText
      anchor: top_left
      offset_x: 16
      offset_y: 15
      width: 450
      height: 112
      text:
        value: '{text}'
        font: Arrus
        align_x: left
        align_y: top
        color: '#e5dcc7'
      notes: Body only; preserve native formatting. Arrus 19→18, then Create 18→17, scroll only if still too long.
        No topic heading or Continue.
  - id: DialogueLeftBar
    anchor: top_left
    width: 8
    height: 347
    bottom_to: OutdoorBasebar
    z_index: -5
    asset:
      default: obsidian_left_edge
    notes: Left vertical dialogue chrome.
  - id: DialogueVideoArea
    anchor: top-left
    offset_x: 8
    offset_y: 28
    width: 460
    height: 344
    bottom_to: OutdoorBasebar
    z_index: -50
    notes: Video playback area
  - id: DialogueShopOverlayFrame
    anchor: top_left
    offset_x: 8
    offset_y: 28
    width: 460
    height: 344
    bottom_to: OutdoorBasebar
    z_index: 20
    notes: Shop display geometry; the shop profile owns its required background illustration.
  - id: DialogueEventDialog
    anchor: top_right
    width: 172
    height: 368
    bottom_to: OutdoorBasebar
    z_index: 200
    asset:
      default: obsidian_house_sidebar
    notes: Right-side event dialog panel for house/NPC talk state.
    children:
    - id: DialogueHouseTitle
      anchor: top_center
      offset_x: 0
      offset_y: 10
      width: 150
      height: 24
      text:
        value: '{house_name}'
        font: Create
        color: '#e5dcc7'
        align_x: center
        align_y: middle
      notes: House title label.
    - id: DialogueNpcPortrait
      anchor: top_center
      offset_x: 0
      offset_y: 20
      width: 71
      height: 81
      asset:
        default: obsidian_frame_tl
      notes: Shared carved Obsidian NPC frame at 0.35 border scale. Retains the 63x73 portrait and four-unit inset.
      children:
      - id: DialogueNpcName
        anchor: below
        offset_x: -14
        offset_y: -4
        width: 100
        height: 24
        text:
          value: '{name}'
          font: Create
          color: '#e4c793'
          align_x: center
          align_y: middle
        notes: NPC name label.
    - id: DialogueTopicRow_1
      anchor: top_center
      offset_y: 80
      width: 140
      height: 36
      interactive: true
      text:
        value: '{topic1}'
        font: Lucida
        align_x: center
        align_y: middle
        color: '#e8d1a4'
        scale: 1
      notes: Fondamento open topic row; no plate. Keep live choices and action conditions.
    - id: DialogueTopicRow_2
      anchor: top_center
      offset_y: 120
      width: 140
      height: 36
      interactive: true
      text:
        value: '{topic2}'
        font: Lucida
        align_x: center
        align_y: middle
        color: '#e8d1a4'
        scale: 1
      notes: Fondamento open topic row; no plate. Keep live choices and action conditions.
    - id: DialogueTopicRow_3
      anchor: top_center
      offset_y: 160
      width: 140
      height: 36
      interactive: true
      text:
        value: '{topic3}'
        font: Lucida
        align_x: center
        align_y: middle
        color: '#e8d1a4'
        scale: 1
      notes: Fondamento open topic row; no plate. Keep live choices and action conditions.
    - id: DialogueTopicRow_4
      anchor: top_center
      offset_y: 200
      width: 140
      height: 36
      interactive: true
      text:
        value: '{topic4}'
        font: Lucida
        align_x: center
        align_y: middle
        color: '#e8d1a4'
        scale: 1
      notes: Fondamento open topic row; no plate. Keep live choices and action conditions.
    - id: DialogueTopicRow_5
      anchor: top_center
      offset_y: 240
      width: 140
      height: 36
      interactive: true
      text:
        value: '{topic5}'
        font: Lucida
        align_x: center
        align_y: middle
        color: '#e8d1a4'
        scale: 1
      notes: Fondamento open topic row; no plate. Keep live choices and action conditions.
  # Reset popup of a map transition whose rules offer to reset the cleared dungeon (MAW), centred over the scene;
  # GameplayDialogueRenderer draws it only then, above the ordinary OK and Close.
  - id: DialogueResetPopup
    anchor: top_left
    offset_x: 83
    offset_y: 113
    width: 310
    height: 172
    z_index: 300
    notes: 'Obsidian panel frame of the reset popup.'
  - id: DialogueResetPopupTitle
    anchor: top_left
    offset_x: 93
    offset_y: 123
    width: 290
    height: 22
    z_index: 300
    text:
      value: Reset Dungeon
      font: Fondamento
      color: '#e8d1a4'
      align_x: center
      align_y: top
      scale: 0.5
  - id: DialogueResetPopupText
    anchor: top_left
    offset_x: 97
    offset_y: 150
    width: 282
    height: 88
    z_index: 300
    text:
      value: '{reset_prompt}'
      font: Create
      color: '#e5dcc7'
      align_x: center
      align_y: top
      scale: 1
    notes: 'The ruleset''s reset offer, wrapped and centred.'
  - id: DialogueResetPopupResetButton
    anchor: top_left
    offset_x: 118
    offset_y: 245
    width: 110
    height: 30
    z_index: 300
    interactive: true
    asset:
      default: obsidian_button_close_normal
      highlighted: obsidian_button_close_hover
      pressed: obsidian_button_close_pressed
      selected: obsidian_button_close_selected
    text:
      value: Reset
      font: Fondamento
      color: '#e8d1a4'
      align_x: center
      align_y: middle
      scale: 0.416667
  - id: DialogueResetPopupCancelButton
    anchor: top_left
    offset_x: 248
    offset_y: 245
    width: 110
    height: 30
    z_index: 300
    interactive: true
    asset:
      default: obsidian_button_close_normal
      highlighted: obsidian_button_close_hover
      pressed: obsidian_button_close_pressed
      selected: obsidian_button_close_selected
    text:
      value: Cancel
      font: Fondamento
      color: '#e8d1a4'
      align_x: center
      align_y: middle
      scale: 0.416667
  - id: DialogueGoodbyeButton
    anchor: bottom_right
    offset_x: -37
    offset_y: -27
    width: 83
    height: 30
    z_index: 300
    interactive: true
    asset:
      default: obsidian_button_close_normal
      highlighted: obsidian_button_close_hover
      pressed: obsidian_button_close_pressed
      selected: obsidian_button_close_selected
    notes: 'Native action/hit target with live Fondamento label and shared hover, pressed, selected and disabled states.'
    text:
      value: Close
      font: Fondamento
      color: '#e8d1a4'
      align_x: center
      align_y: middle
      scale: 0.416667
  - id: DialogueShopRerollButton
    anchor: bottom_right
    offset_x: -4
    offset_y: -62
    width: 150
    height: 30
    z_index: 300
    interactive: true
    asset:
      default: obsidian_button_rest_normal
      highlighted: obsidian_button_rest_hover
      pressed: obsidian_button_rest_pressed
      selected: obsidian_button_rest_selected
    notes: 'Shop stock reroll of a ruleset that has one (MAW); drawn by the shop overlay with its live price.'
    text:
      value: New stock
      font: Fondamento
      color: '#e8d1a4'
      align_x: center
      align_y: middle
      scale: 0.416667
  # Sell trash's buttons in the merchant panel's free space, under the name: Sell trash where Cancel comes, so that a
  # double click does not sell the pick at once, and the two-line "Sell N items / for G gold" above it.
  - id: DialogueShopSellTrashConfirmButton
    anchor: bottom_right
    offset_x: -32
    offset_y: -238
    width: 120
    height: 42
    z_index: 300
    interactive: true
    asset:
      default: obsidian_button_rest_normal
      highlighted: obsidian_button_rest_hover
      pressed: obsidian_button_rest_pressed
      selected: obsidian_button_rest_selected
    notes: 'Sells the Sell trash pick, two lines with its live count and price; drawn while picking.'
    text:
      value: Sell trash
      font: Fondamento
      color: '#e8d1a4'
      align_x: center
      align_y: middle
      scale: 0.416667
  - id: DialogueShopSellTrashButton
    anchor: bottom_right
    offset_x: -32
    offset_y: -202
    width: 120
    height: 30
    z_index: 300
    interactive: true
    asset:
      default: obsidian_button_rest_normal
      highlighted: obsidian_button_rest_hover
      pressed: obsidian_button_rest_pressed
      selected: obsidian_button_rest_selected
    notes: 'Sell trash on the sell screen of a ruleset with item rarities (MAW): starts the pick; Cancel while
      picking ends it without selling.'
    text:
      value: Sell trash
      font: Fondamento
      color: '#e8d1a4'
      align_x: center
      align_y: middle
      scale: 0.416667
  # Text styles of a Ledger shop's Buy list (HouseShopLedger, MM9's merchant list); GameplayHouseShopLedgerRenderer
  # places them inside DialogueShopOverlayFrame. Design: level_generation/ui/mm9_shop_buy_study_20261105/.
  - id: DialogueShopLedgerName
    anchor: top_left
    visible: false
    width: 240
    height: 16
    text:
      value: '{name}'
      font: Arrus
      color: '#e5dcc7'
      align_x: left
      align_y: top
      scale: 0.85
  - id: DialogueShopLedgerDetail
    anchor: top_left
    visible: false
    width: 240
    height: 12
    text:
      value: '{detail}'
      font: SMALLNUM
      color: '#a59d8b'
      align_x: left
      align_y: top
      scale: 0.85
  - id: DialogueShopLedgerStat
    anchor: top_left
    visible: false
    width: 76
    height: 36
    text:
      value: '{stat}'
      font: SMALLNUM
      color: '#e5dcc7'
      align_x: left
      align_y: middle
      scale: 0.85
  - id: DialogueShopLedgerPrice
    anchor: top_left
    visible: false
    width: 56
    height: 36
    text:
      value: '{price}'
      font: Arrus
      color: '#e6c36c'
      align_x: right
      align_y: middle
      scale: 0.85
  - id: DialogueShopLedgerCount
    anchor: top_left
    visible: false
    width: 30
    height: 16
    text:
      value: '{count}'
      font: SMALLNUM
      color: '#e6c36c'
      align_x: left
      align_y: top
      scale: 0.85
  - id: DialogueShopLedgerColumn
    anchor: top_left
    visible: false
    width: 60
    height: 10
    text:
      value: '{column}'
      font: SMALLNUM
      color: '#a59d8b'
      align_x: left
      align_y: middle
      scale: 0.75
  - id: DialogueShopLedgerChip
    anchor: top_left
    visible: false
    width: 60
    height: 14
    text:
      value: '{tab}'
      font: Fondamento
      color: '#a59d8b'
      align_x: center
      align_y: middle
      scale: 0.27
  - id: DialogueShopLedgerLane
    anchor: top_left
    visible: false
    width: 120
    height: 14
    text:
      value: '{lane}'
      font: Fondamento
      color: '#e4c793'
      align_x: right
      align_y: middle
      scale: 0.3
  - id: DialogueShopLedgerFooter
    anchor: top_left
    visible: false
    width: 200
    height: 11
    text:
      value: '{footer}'
      font: SMALLNUM
      color: '#a59d8b'
      align_x: left
      align_y: middle
      scale: 0.75
  - id: DialogueOkButton
    anchor: bottom_right
    offset_x: -37
    offset_y: -62
    width: 83
    height: 30
    z_index: 300
    interactive: true
    asset:
      default: obsidian_button_close_normal
      highlighted: obsidian_button_close_hover
      pressed: obsidian_button_close_pressed
      selected: obsidian_button_close_selected
    notes: 'Native action/hit target with live Fondamento label and shared hover, pressed, selected and disabled states.'
    text:
      value: OK
      font: Fondamento
      color: '#e8d1a4'
      align_x: center
      align_y: middle
      scale: 0.416667
  - id: DialogueResponseHint
    anchor: bottom_left
    offset_x: 24
    offset_y: -22
    width: 300
    height: 20
    text:
      value: '{hint}'
      font: Lucida
      align_x: left
      align_y: middle
      color: '#e5dcc7'
    notes: Optional footer hint or status text.
