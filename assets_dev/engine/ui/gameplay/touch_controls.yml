# Obsidian Android supplement: retain the original thumb controls and clear the shared dynamic party HUD.
screen: OutdoorHud
elements:
- id: OutdoorMobileSystemPanel
  anchor_space: screen
  anchor: bottom_left
  offset_x: 24
  offset_y: -16
  width: 80
  height: 256
  z_index: 240
  scale:
    min: 0.6
    max: 8.0
    reference_width: 965
  children:
  - id: OutdoorMobileButtonPause
    anchor: top_left
    offset_x: 0
    offset_y: 176
    width: 80
    height: 80
    interactive: true
    asset:
      default: obsidian_action_pause
  - id: OutdoorMobileButtonInventory
    anchor: top_left
    offset_x: 0
    offset_y: 88
    width: 80
    height: 80
    interactive: true
    asset:
      default: obsidian_action_pouch
  - id: OutdoorMobileInspectButton
    anchor: top_left
    offset_x: 0
    offset_y: 0
    width: 80
    height: 80
    z_index: 240
    interactive: true
    asset:
      default: obsidian_action_magnifier
    notes: Hold for momentary right-click; long-press without a second touch to toggle sticky inspect mode.
  notes: One bottom-left column, bottom to top Turn Mode, Inventory, Inspect. Retain
    80-unit thumb targets with eight-unit gaps; the narrow group clears the full party
    frame and end ornament even at 4:3.
- id: OutdoorMobileActionPanel
  anchor_space: screen
  anchor: bottom_right
  offset_x: -24
  offset_y: -16
  width: 220
  height: 104
  z_index: 240
  scale:
    min: 0.6
    max: 8.0
    reference_width: 1024
  children:
  - id: OutdoorMobileButtonAttack
    anchor: top_left
    offset_x: 0
    offset_y: 0
    width: 104
    height: 104
    interactive: true
    asset:
      default: obsidian_action_attack
  - id: OutdoorMobileButtonCast
    anchor: top_left
    offset_x: 116
    offset_y: 0
    width: 104
    height: 104
    interactive: true
    asset:
      default: obsidian_action_cast
  - id: OutdoorMobileButtonQuickCast
    anchor: top_left
    offset_x: 100
    offset_y: -10
    width: 56
    height: 56
    z_index: 241
    interactive: true
    asset:
      default: obsidian_action_quickcast
  - id: OutdoorMobileContextActionButton
    anchor: top_left
    offset_x: 0
    offset_y: -56
    width: 220
    height: 42
    z_index: 240
    interactive: true
    notes: Right-thumb context action above Attack/Spell, with four units of clearance above Quick Cast.
  notes: Slightly reduced width scaling keeps this thumb group beside all five portraits
    at 2:1. Wider phones retain full size; narrower screens lift the whole group only
    when it would overlap the party basebar.
- id: OutdoorMobileFlightPanel
  anchor_space: screen
  anchor: top_right
  offset_x: -32
  offset_y: 156
  width: 96
  height: 44
  z_index: 240
  scale:
    min: 0.5
    max: 8.0
  notes: Renderer and touch input expose these controls only outdoors while the Fly party buff is active.
  children:
  - id: OutdoorMobileButtonFlyUp
    anchor: top_left
    offset_x: 0
    offset_y: 0
    width: 44
    height: 44
    interactive: true
    asset:
      default: obsidian_action_up
  - id: OutdoorMobileButtonFlyDown
    anchor: top_left
    offset_x: 52
    offset_y: 0
    width: 44
    height: 44
    interactive: true
    asset:
      default: obsidian_action_down
- id: OutdoorMobileOverlayInspectButton
