screen: TownPortal

elements:
  - id: TownPortalRoot
    anchor: center
    width: 640
    height: 480
    z_index: 440
    visible: true
    scale:
      min: 1.0
      max: 8.0
    children:
      - id: TownPortalBackground
        anchor: top_left
        offset_x: 0
        offset_y: 0
        width: 640
        height: 480
        z_index: 0
        asset:
          default: townport

      - id: TownPortalDestinationLabel
        anchor: bottom_right
        offset_x: -60
        offset_y: -50
        width: 240
        height: 28
        z_index: 250
        text:
          value: "{destination}"
          font: Book2
          align_x: center
          align_y: middle
          scale: 1.0

      # Continent buttons, one per continent with towns in this installation (Chedian only with MM9), always shown;
      # a continent with no unlocked town shows its map with nothing to choose.
      - id: TownPortalContinentButton1
        anchor: bottom_left
        offset_x: 6
        offset_y: -5
        width: 82
        height: 26
        z_index: 300
        interactive: true
        asset:
          default: obsidian_button_tab_normal
          highlighted: obsidian_button_tab_hover
          pressed: obsidian_button_tab_pressed
          selected: obsidian_button_tab_selected
        text:
          value: "{continent}"
          font: Fondamento
          color: "#e8d1a4"
          align_x: center
          align_y: middle
          scale: 0.41666665625

      - id: TownPortalContinentButton2
        anchor: bottom_left
        offset_x: 91
        offset_y: -5
        width: 82
        height: 26
        z_index: 300
        interactive: true
        asset:
          default: obsidian_button_tab_normal
          highlighted: obsidian_button_tab_hover
          pressed: obsidian_button_tab_pressed
          selected: obsidian_button_tab_selected
        text:
          value: "{continent}"
          font: Fondamento
          color: "#e8d1a4"
          align_x: center
          align_y: middle
          scale: 0.41666665625

      - id: TownPortalContinentButton3
        anchor: bottom_left
        offset_x: 176
        offset_y: -5
        width: 82
        height: 26
        z_index: 300
        interactive: true
        asset:
          default: obsidian_button_tab_normal
          highlighted: obsidian_button_tab_hover
          pressed: obsidian_button_tab_pressed
          selected: obsidian_button_tab_selected
        text:
          value: "{continent}"
          font: Fondamento
          color: "#e8d1a4"
          align_x: center
          align_y: middle
          scale: 0.41666665625

      - id: TownPortalContinentButton4
        anchor: bottom_left
        offset_x: 261
        offset_y: -5
        width: 82
