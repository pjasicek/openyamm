sections:
- id: gameplay
  name: Gameplay
  title: Gameplay
  subtitle: Information, feedback, and exploration
- id: video
  name: Video
  title: Video
  subtitle: Display and appearance
- id: audio
  name: Audio
  title: Audio
  subtitle: Volume 0–9 · Zero mutes a channel
- id: controls
  name: Mouse & Controls
  title: Mouse & Controls
  subtitle: Choose how you explore
- id: keyboard
  name: Keyboard
  title: Keyboard
  subtitle: Find an action. Choose a key.
settings:
- id: bolster_monsters
  section: gameplay
  group: Challenge
  name: Monster scaling
  type: toggle
  desc: Scale monsters with the party. Apply when entering an area.
- id: quest_markers
  section: gameplay
  group: Exploration
  name: Quest markers
  type: toggle
  desc: Show quest markers where the game provides them.
- id: combat_text
  section: gameplay
  group: Combat feedback
  name: Floating combat text
  type: toggle
  desc: Show damage and combat messages in the world.
- id: enemy_health_bars
  section: gameplay
  group: Combat feedback
  name: Enemy health bars
  type: select
  options:
  - ['off', 'Off']
  - [target, Target only]
  - [combat, Combat]
  - [nearby, Nearby]
  desc: Show the target, recent combatants, or nearby visible enemies.
- id: enemy_health_bar_values
  section: gameplay
  group: Combat feedback
  name: Enemy HP values
  type: select
  options:
  - ['off', 'Off']
  - [target, Target only]
  - [all, All bars]
  desc: Show current and maximum health above enemy bars.
- id: enemy_health_bar_damage_trail
  section: gameplay
  group: Combat feedback
  name: Enemy damage trail
  type: toggle
  desc: Briefly show recently lost health behind the current fill.
- id: show_hits
  section: gameplay
  group: Combat feedback
  name: Hit messages
  type: toggle
  desc: Report attacks in the status text.
- id: context_action_popup
  section: gameplay
  group: Interaction
  name: Context action menu
  type: toggle
  desc: Offer contextual actions for the object under the pointer.
- id: skip_event_cutscenes
  section: gameplay
  group: Story
  name: Skip event cutscenes
  type: toggle
  desc: Skip event movies. Leave off for a first adventure.
- id: window_mode
  section: video
  group: Display
  name: Display mode
  type: select
  options:
  - - windowed
    - Windowed
  - - windowed_fullscreen
    - Borderless
  - - fullscreen
    - Fullscreen
  desc: Changes must be confirmed within 15 seconds.
- id: resolution
  section: video
  group: Display
  name: Resolution
  type: select
  desc: Borderless uses your desktop resolution.
- id: vsync
  section: video
  group: Display
  name: Vertical sync
  type: toggle
  desc: Reduce screen tearing by syncing frames to the display.
- id: view_distance
  section: video
  group: World detail
  name: View distance
  type: select
  options:
  - - default
    - World default
  - - '32768'
    - Extended
  - - unlimited
    - Unlimited
  desc: Longer distances can reduce performance outdoors.
- id: texture_filtering
  section: video
  group: World detail
  name: Smooth textures
  type: toggle
  desc: Filter texture pixels instead of showing sharp texel edges.
- id: terrain_anisotropy
  section: video
  group: World detail
  name: Ground texture clarity
  type: select
  options:
  - - 'off'
    - 'Off'
  - - 2x
    - 2×
  - - 4x
    - 4×
  - - 8x
    - 8×
  - - 16x
    - 16×
  desc: Keep distant ground textures sharper. Uses anisotropic terrain filtering.
  depends: texture_filtering
- id: model_lods
  section: video
  group: World detail
  name: Scale distant creature detail
  type: toggle
  desc: Use simpler creature shapes at a distance while retaining full detail nearby.
- id: model_shadow_quality
  section: video
  group: World detail
  name: Creature shadows
  type: select
  options:
  - - '0'
    - Off
  - - '1'
    - Low
  - - '2'
    - Medium
  - - '3'
    - High
  desc: Animated shadows on creatures and their surroundings. Higher quality improves detail and range.
- id: terrain_decorations
  section: video
  group: World detail
  name: Terrain details
  type: toggle
  desc: Draw extra terrain decorations where available.
- id: sky_style
  section: video
  group: World detail
  name: Sky
  type: select
  options:
  - - enhanced
    - Enhanced
  - - classic
    - Classic
  desc: Enhanced adds a living sky and fades the distance into it; Classic keeps the original.
- id: weather_quality
  section: video
  group: World detail
  name: Weather
  type: select
  options:
  - - high
    - High
  - - medium
    - Medium
  - - low
    - Low
  - - 'off'
    - 'Off'
  desc: Density of falling rain and snow; Off hides them while the weather itself goes on.
- id: wet_surfaces
  section: video
  group: World detail
  name: Wet surfaces
  type: toggle
  desc: Rain darkens the ground and buildings, which dry slowly after it stops.
- id: water_shader
  section: video
  group: Water
  name: Enhanced water
  type: toggle
  desc: Animate water waves with sunlight highlights and angle-dependent reflections.
- id: water_reflections
  section: video
  group: Water
  name: Scenery reflections
  type: toggle
  depends: water_shader
  desc: Reflect the sky, ground and buildings in visible water. Requires extra rendering.
- id: water_reflection_size
  section: video
  group: Water
  name: Reflection detail
  type: select
  depends: water_reflections
  options:
  - - '128'
    - Very low
  - - '256'
    - Low
  - - '512'
    - Medium
  - - '1024'
    - High
  - - '2048'
    - Very high
  desc: Higher detail makes scenery reflections sharper and costs more rendering time.
- id: water_sprite_reflections
  section: video
  group: Water
  name: Reflect nearby objects
  type: toggle
  depends: water_reflections
  desc: Include nearby creatures, trees and decorations in water reflections.
- id: water_movement_ripples
  section: video
  group: Water
  name: Movement ripples
  type: toggle
  depends: water_shader
  desc: Small ripples from creatures moving on water.
- id: rain_ripples
  section: video
  group: Water
  name: Rain ripples
  type: toggle
  depends: water_shader
  desc: Raindrop rings on still water while it rains.
- id: ambient_occlusion
  section: video
  group: Colour & effects
  name: Ambient occlusion
  type: toggle
  desc: Add soft shading where solid surfaces meet.
- id: ambient_occlusion_strength
  section: video
  group: Colour & effects
  name: Occlusion intensity
  type: range
  min: 0
  max: 100
  unit: '%'
  depends: ambient_occlusion
  desc: Adjust the strength of contact shading.
- id: cinematic_grading
  section: video
  group: Colour & effects
  name: Cinematic colour
  type: toggle
  desc: Apply the cinematic colour treatment.
- id: cinematic_strength
  section: video
  group: Colour & effects
  name: Colour intensity
  type: range
  min: 0
  max: 100
  unit: '%'
  depends: cinematic_grading
  desc: Adjust the strength of cinematic colour.
- id: colored_lights
  section: video
  group: Colour & effects
  name: Coloured lighting
  type: toggle
  desc: Use the colours of nearby light sources.
- id: tinting
  section: video
  group: Colour & effects
  name: Colour tinting
  type: toggle
  desc: Retain the original tinting option.
- id: blood_splats
  section: video
  group: Colour & effects
  name: Blood splats
  type: toggle
  desc: Show blood splat effects.
- id: melee_hit_blood_effects
  section: video
  group: Colour & effects
  name: Melee blood effects
  type: toggle
  desc: Add blood effects when melee attacks connect.
- id: corpses
  section: video
  group: Colour & effects
  name: Slain creatures
  type: select
  options:
  - - keep
    - Keep bodies
  desc: Slain creatures keep their bodies, as in the original games.
- id: sound_volume
  section: audio
  group: Volume
  name: Sound effects
  type: range
  min: 0
  max: 9
  unit: / 9
  desc: Weapons, spells, interface sounds, and the world.
- id: music_volume
  section: audio
  group: Volume
  name: Music
  type: range
  min: 0
  max: 9
  unit: / 9
  desc: Music in menus, towns, and dungeons.
- id: voice_volume
  section: audio
  group: Volume
  name: Voices
  type: range
  min: 0
  max: 9
  unit: / 9
  desc: Spoken character reactions and dialogue.
- id: walksound
  section: audio
  group: World sounds
  name: Footsteps
  type: toggle
  desc: Play walking and running sounds.
- id: control_scheme
  section: controls
  group: Input style
  name: Control preset
  type: select
  options:
  - - modern
    - Modern
  - - classic
    - Classic
  desc: 'Modern: WASD, left-click attack, E to use. Classic: arrow keys, A to attack, left-click to use.'
- id: mouse_sensitivity
  section: controls
  group: Look & movement
  name: Mouse sensitivity
  type: range
  min: 0
  max: 100
  unit: '%'
  desc: The response of mouse movement. Zero disables mouse look movement.
- id: invert_mouse_y
  section: controls
  group: Look & movement
  name: Invert mouse Y
  type: toggle
  desc: Move the mouse up to look down, and down to look up.
- id: turn_rate
  section: controls
  group: Look & movement
  name: Turn rate
  type: select
  options:
  - - 16x
    - 16×
  - - 32x
    - 32×
  - - smooth
    - Smooth
  desc: Preserve the original turning-speed choices.
- id: always_run
  section: controls
  group: Look & movement
  name: Always run
  type: toggle
  desc: Use running movement by default.
- id: flip_on_exit
  section: controls
  group: Look & movement
  name: Face away on exit
  type: toggle
  desc: Turn the party away from the doorway when leaving a house.
