# Settings menu: sections (tabs), their settings in display order and the keyboard bindings.
# Rows appear in catalog order; a new `group` value starts a new heading. After editing, regenerate the tab layouts
# with `python3 tools/generate_settings_layouts.py`. An empty `desc` gives a compact row, used for the intensity
# sliders that follow their own toggle; `depends` rows are indented under the setting they depend on.
# An `action` row stores no setting: the game fills its label, description and button (update_now: the installed
# version, the update status and Check Now). `updater_only` sections and rows exist only where the game updates itself.
# `ruleset_desc` replaces a row's description in the pause menu of a game with a ruleset (keep it no longer than `desc`,
# whose length the layout measures).
# The `game` section's rows are the ruleset options of the game in progress, not settings.ini values: the menu fills
# their choices from the ruleset and leaves out what it does not offer.
sections:
- id: gameplay
  name: Gameplay
- id: interface
  name: Interface
- id: video
  name: Video
- id: audio
  name: Audio
- id: controls
  name: Controls
- id: keyboard
  name: Keyboard
# The rules of the game in progress: only in the pause menu of a game with a ruleset. It never shows beside Updates
# (main menu only), so both use the seventh tab.
- id: game
  name: Rules
  game_only: true
- id: updates
  name: Updates
  updater_only: true
  slot: 6
settings:
- id: bolster_monsters
  section: gameplay
  group: Difficulty
  name: Monster scaling
  type: toggle
  desc: Monsters keep pace with the party's level. Takes effect on entering an area.
  ruleset_desc: Standard games only; this game's ruleset scales its monsters itself.
- id: melee_hit_feedback
  section: gameplay
  group: Combat
  name: Melee impact feedback
  type: toggle
  desc: Impact sounds by what was struck, and a brief pause of the struck creature.
- id: melee_camera_kick
  section: gameplay
  group: Combat
  name: Camera kick
  type: toggle
  desc: Nudge the view along the blow on critical hits and kills.
- id: turn_based_monster_speed
  section: gameplay
  group: Turn-based combat
  name: Monster turns speed
  type: steps
  options:
  - ['1', 1x]
  - ['1.5', 1.5x]
  - ['2', 2x]
  - ['3', 3x]
  - ['4', 4x]
  desc: Play the monsters' turns faster.
- id: turn_based_party_speed
  section: gameplay
  group: Turn-based combat
  name: Party attacks speed
  type: steps
  options:
  - ['1', 1x]
  - ['1.5', 1.5x]
  - ['2', 2x]
  - ['3', 3x]
  - ['4', 4x]
  desc: Play the party's attacks and spells in flight faster. Walking in the movement phase keeps its pace.
- id: skip_event_cutscenes
  section: gameplay
  group: Story
  name: Skip event cutscenes
  type: toggle
  desc: Skip event movies. Leave off for a first adventure.
- id: combat_text
  section: interface
  group: Combat messages
  name: Floating combat text
  type: toggle
  desc: Show damage numbers and combat messages in the world.
- id: combat_log
  section: interface
  group: Combat messages
  name: Combat log
  type: toggle
  desc: A button beside the followers' head opens a log of recent hits, each with its damage steps.
  desktop_only: true
- id: show_hits
  section: interface
  group: Combat messages
  name: Hit messages
  type: toggle
  desc: Describe each attack in the status bar.
- id: enemy_health_bars
  section: interface
  group: Enemy health bars
  name: Show health bars
  type: select
  options:
  - ['off', 'Off']
  - [target, Target only]
  - [combat, Combat]
  - [nearby, Nearby]
  desc: Over the target, recent combatants, or all nearby visible enemies.
- id: enemy_health_bar_values
  section: interface
  group: Enemy health bars
  name: Health values
  type: select
  options:
  - ['off', 'Off']
  - [target, Target only]
  - [all, All bars]
  desc: Show current and maximum health above the bars.
- id: enemy_health_bar_damage_trail
  section: interface
  group: Enemy health bars
  name: Damage trail
  type: toggle
  desc: Briefly show recently lost health behind the current fill.
- id: quest_markers
  section: interface
  group: Exploration
  name: Quest markers
  type: toggle
  desc: Mark characters with quests to offer or complete, where the world has them.
- id: context_action_popup
  section: interface
  group: Exploration
  name: Context action menu
  type: toggle
  desc: Offer actions for the object under the pointer.
- id: party_frame
  section: interface
  group: Party
  name: Portrait frame
  type: toggle
  desc: Draw the frame behind the party portraits during play. Other screens always keep it.
- id: item_buttons
  section: interface
  group: Party
  name: Potion and scroll buttons
  type: toggle
  desc: The buttons on the ends of the party frame. Each opens a paused list of what the party carries.
- id: quick_item_rings
  section: interface
  group: Party
  name: Quick item rings
  type: toggle
  desc: A button at each portrait opens its ring of six quick slots; the Potions key opens the ring, not the list.
- id: rarity_glow
  section: interface
  group: Items
  name: Item rarity glow
  type: select
  options:
  - ['off', 'Off']
  - [hold, Hold key]
  - [always, Always]
  desc: Outline items in their rarity colour (rulesets with rarities, such as MAW).
  game_ruleset: maw
- id: update_now
  section: updates
  group: Version
  name: Installed version
  type: action
  updater_only: true
  desc: Check Now looks for a new version on jasicek.net. Nothing downloads without asking.
- id: check_for_updates
  section: updates
  group: Automatic checks
  name: Check for updates
  type: select
  updater_only: true
  options:
  - [auto, At start]
  - ['off', Never]
  - [ask, Ask me]
  desc: Look for a new version on jasicek.net when OpenYAMM starts. Nothing downloads without asking.
- id: window_mode
  section: video
  group: Display
  name: Display mode
  type: select
  options:
  - [windowed, Windowed]
  - [windowed_fullscreen, Borderless]
  - [fullscreen, Fullscreen]
  desc: Changes must be confirmed within 15 seconds.
- id: resolution
  section: video
  group: Display
  name: Resolution
  type: select
  desc: Borderless uses your desktop resolution.
- id: vsync
  section: video
  group: Display
  name: Vertical sync
  type: toggle
  desc: Prevent screen tearing by matching frames to the display.
- id: graphics_quality
  section: video
  group: Quality
  name: Graphics quality
  type: steps
  options:
  - [low, Low]
  - [medium, Medium]
  - [high, High]
  desc: Sets most options below at once; changing one of them shows Custom.
- id: antialiasing
  section: video
  group: Quality
  name: Anti-aliasing
  type: select
  options:
  - ['off', 'Off']
  - [2x, 2x MSAA]
  - [4x, 4x MSAA]
  desc: Smooth jagged edges and shimmering foliage.
  # Android renders without multisampling (game/render/CinematicGrading.cpp).
  desktop_only: true
- id: view_distance
  section: video
  group: Quality
  name: View distance
  type: select
  options:
  - [default, World default]
  - ['32768', Extended]
  - [unlimited, Unlimited]
  desc: Longer distances can reduce performance outdoors.
- id: model_lods
  section: video
  group: Quality
  name: Distant creature detail
  type: toggle
  desc: Draw simpler creature shapes far away; nearby creatures keep full detail.
- id: texture_filtering
  section: video
  group: Textures
  name: Smooth textures
  type: toggle
  desc: Off keeps the sharp, pixelated texels of the original.
- id: terrain_anisotropy
  section: video
  group: Textures
  name: Ground texture clarity
  type: select
  options:
  - ['off', 'Off']
  - [2x, 2×]
  - [4x, 4×]
  - [8x, 8×]
  - [16x, 16×]
  desc: Keep distant ground textures sharp (anisotropic filtering).
  depends: texture_filtering
- id: model_shadow_quality
  section: video
  group: Lighting & shadows
  name: Creature shadows
  type: select
  options:
  - ['0', 'Off']
  - ['1', Low]
  - ['2', Medium]
  - ['3', High]
  desc: Animated shadows of creatures; higher quality adds detail and range.
- id: light_grid
  section: video
  group: Lighting & shadows
  name: Light detail
  type: select
  options:
  - [high, High]
  - [low, Low]
  desc: How finely torches, spells and other lights are sorted; Low suits phones.
- id: colored_lights
  section: video
  group: Lighting & shadows
  name: Coloured lighting
  type: toggle
  desc: Lights tint their surroundings with their own colour.
- id: warm_torch_light
  section: video
  group: Lighting & shadows
  name: Warm torch light
  type: toggle
  desc: Torch Light glows firelight orange instead of the original white.
- id: ambient_occlusion
  section: video
  group: Lighting & shadows
  name: Ambient occlusion
  type: toggle
  desc: Add soft shading where solid surfaces meet.
  # Android renders without ambient occlusion (game/render/CinematicGrading.cpp).
  desktop_only: true
- id: ambient_occlusion_strength
  section: video
  group: Lighting & shadows
  name: Intensity
  type: range
  min: 0
  max: 100
  unit: '%'
  depends: ambient_occlusion
  desc: ''
  # Android renders without ambient occlusion (game/render/CinematicGrading.cpp).
  desktop_only: true
- id: terrain_decorations
  section: video
  group: Environment
  name: Terrain details
  type: toggle
  desc: Draw extra ground decorations where available.
- id: weather_quality
  section: video
  group: Environment
  name: Weather
  type: select
  options:
  - [high, High]
  - [medium, Medium]
  - [low, Low]
  - ['off', 'Off']
  desc: Density of falling rain and snow; Off hides them but the weather goes on.
- id: wet_surfaces
  section: video
  group: Environment
  name: Wet surfaces
  type: toggle
  desc: Rain darkens the ground and buildings, which dry slowly afterwards.
- id: terrain_specular
  section: video
  group: Environment
  name: Ground highlights
  type: toggle
  desc: Smooth rock and wet ground catch the sun and nearby lights.
- id: water_reflections
  section: video
  group: Water
  name: Reflections
  type: toggle
  desc: Reflect the sky, ground and buildings in water. Costs extra rendering.
- id: water_reflection_size
  section: video
  group: Water
  name: Reflection detail
  type: select
  depends: water_reflections
  options:
  - ['128', Very low]
  - ['256', Low]
  - ['512', Medium]
  - ['1024', High]
  - ['2048', Very high]
  desc: Higher detail gives sharper reflections at a higher cost.
- id: water_sprite_reflections
  section: video
  group: Water
  name: Reflect nearby objects
  type: toggle
  depends: water_reflections
  desc: Include nearby creatures, trees and decorations.
- id: water_movement_ripples
  section: video
  group: Water
  name: Movement ripples
  type: toggle
  desc: Small ripples from creatures moving on water.
- id: rain_ripples
  section: video
  group: Water
  name: Rain ripples
  type: toggle
  desc: Raindrop rings on still water while it rains.
- id: bloom
  section: video
  group: Post-processing
  name: Glow
  type: toggle
  desc: Flames, glowing crystals and spell light bloom softly into their surroundings.
- id: bloom_strength
  section: video
  group: Post-processing
  name: Intensity
  type: range
  min: 0
  max: 100
  unit: '%'
  depends: bloom
  desc: ''
- id: cinematic_grading
  section: video
  group: Post-processing
  name: Cinematic colour
  type: toggle
  desc: Bring out shadow detail and soften over-saturated earth tones.
- id: cinematic_strength
  section: video
  group: Post-processing
  name: Intensity
  type: range
  min: 0
  max: 100
  unit: '%'
  depends: cinematic_grading
  desc: ''
- id: sharpening
  section: video
  group: Post-processing
  name: Sharpening
  type: range
  min: 0
  max: 100
  unit: '%'
  desc: Sharpen the 3D view; the interface is unaffected. Zero turns it off.
- id: melee_hit_effects
  section: video
  group: Combat effects
  name: Melee hit effects
  type: toggle
  desc: Show a slash, thrust or crush where melee attacks connect.
- id: melee_hit_flash
  section: video
  group: Combat effects
  name: Melee hit flash
  type: toggle
  desc: Briefly brighten a creature struck in melee.
- id: melee_hit_blood_effects
  section: video
  group: Combat effects
  name: Melee blood
  type: toggle
  desc: Add blood effects when melee attacks connect.
- id: blood_splats
  section: video
  group: Combat effects
  name: Blood splats
  type: toggle
  desc: Leave a pool of blood beneath slain creatures.
- id: surface_materials
  section: video
  group: Experimental
  name: Surface materials
  type: toggle
  desc: Walls, floors and doors show their relief, metal, glass and glowing windows. Takes effect on the next map.
- id: surface_parallax
  section: video
  group: Experimental
  name: Surface depth
  type: toggle
  desc: Nearby bricks, stones and carvings show their depth. Costs a little extra rendering.
- id: surface_reflections
  section: video
  group: Experimental
  name: Surface reflections
  type: toggle
  desc: Marble, glass, metal and puddles reflect the buildings around them. Needs surface materials.
- id: sound_volume
  section: audio
  group: Volume
  name: Sound effects
  type: range
  min: 0
  max: 9
  unit: / 9
  desc: Weapons, spells, the interface and the world. Zero mutes.
- id: music_volume
  section: audio
  group: Volume
  name: Music
  type: range
  min: 0
  max: 9
  unit: / 9
  desc: Music in menus, towns and dungeons. Zero mutes.
- id: voice_volume
  section: audio
  group: Volume
  name: Voices
  type: range
  min: 0
  max: 9
  unit: / 9
  desc: Spoken character reactions and dialogue. Zero mutes.
- id: walksound
  section: audio
  group: Sounds
  name: Footsteps
  type: toggle
  desc: Play walking and running sounds.
- id: repeated_voice_lines
  section: audio
  group: Sounds
  name: Repeated voice lines
  type: steps
  options:
  - ['0', 'Off']
  - ['500', 0.5 s]
  - ['1000', 1 s]
  - ['2000', 2 s]
  - ['3000', 3 s]
  - ['5000', 5 s]
  - ['10000', 10 s]
  desc: A character says the same line at most once in this time, such as a cry when hurt or a remark on an item.
- id: control_scheme
  section: controls
  group: Preset
  name: Control preset
  type: select
  options:
  - [modern, Modern]
  - [classic, Classic]
  desc: 'Modern: WASD, left-click attack, E to use. Classic: arrow keys, A to attack, left-click to use.'
- id: smart_click
  section: controls
  group: Mouse
  name: Smart left click
  type: toggle
  desc: Left-click talks, opens, picks up or uses what is under the cursor, and attacks anywhere else.
  desktop_only: true
- id: mouse_sensitivity
  section: controls
  group: Mouse
  name: Mouse sensitivity
  type: range
  min: 0
  max: 100
  unit: '%'
  desc: How fast the view follows the mouse. Zero turns mouse look off.
- id: turn_rate
  section: controls
  group: Mouse
  name: Turn rate
  type: select
  options:
  - [16x, 16×]
  - [32x, 32×]
  - [smooth, Smooth]
  desc: Base turning speed, from the original 16× and 32× to the faster Smooth.
- id: invert_mouse_y
  section: controls
  group: Mouse
  name: Invert mouse Y
  type: toggle
  desc: Move the mouse up to look down, and down to look up.
- id: always_run
  section: controls
  group: Movement
  name: Always run
  type: toggle
  desc: Run by default instead of walking.
- id: bag_number_keys
  section: controls
  group: Inventory
  name: Number keys
  type: select
  options:
  - [member, Pick member]
  - [bag, Open bag]
  desc: 'Number keys on the inventory page and in shops and chests; Shift with a number does the other. A party of one opens bags.'
  game_ruleset: maw
- id: ruleset_name
  section: game
  group: Ruleset
  name: Ruleset
  type: select
  desc: Chosen at the start of the adventure. The rules of each part follow below.
- id: ruleset_difficulty
  section: game
  group: Ruleset
  name: Difficulty
  type: select
  options:
  - [easy, Easy]
  - [normal, Normal]
  - [maw, MAW]
  - [hard, Hard]
  - [hell, Hell]
  - [nightmare, Nightmare]
  desc: Monster health and damage, how many come, loot and bosses. Nightmare can never be lowered again.
- id: ruleset_progression
  section: game
  group: Ruleset
  name: Progression
  type: select
  options:
  - [free, Free]
  - [horizontal, Horizontal]
  desc: Free lets monsters grow with the levels you gain elsewhere; Horizontal fixes each map's level.
- id: ruleset_challenge
  section: game
  group: Ruleset
  name: Challenge mode
  type: select
  options:
  - [none, None]
  - [doom, Doom]
  - [road_to_insanity, Road to Insanity]
  - [beyond_madness, Beyond Madness]
  - [austerity, Austerity]
  desc: Chosen once at the start; fixed for the whole adventure.
- id: ruleset_randomizer
  section: game
  group: Ruleset
  name: Randomizer
  type: toggle
  desc: Chosen once at the start; fixed for the whole adventure.
- id: ruleset_homing
  section: game
  group: Preferences
  name: Homing projectiles
  type: toggle
  desc: Your missiles follow their target.
- id: ruleset_friendly_fire
  section: game
  group: Preferences
  name: Friendly fire
  type: toggle
  desc: Your attacks and spells can hurt peaceful townsfolk and guards.
- id: ruleset_trainer_hints
  section: game
  group: Preferences
  name: Trainer hints
  type: toggle
  desc: Skill popups name the nearest teacher of the next mastery.
- id: ruleset_bow
  section: game
  group: Preferences
  name: Bow
  type: toggle
  desc: 'Off: bows, crossbows and dragon breath do not shoot. A melee-only challenge.'
- id: ruleset_loot_filter
  section: game
  group: Preferences
  name: Loot filter
  type: window
  options:
  - ['off', 'Off']
  - [soft, Soft]
  - [regular, Regular]
  - [strict, Strict]
  - [very_strict, Very strict]
  - [custom, Custom]
  desc: Drops you would rather not carry turn into gold. Opens the filter with its presets.
# Shown only in Road to Insanity and Beyond Madness, where it happens; last, so the rows
# above keep their places when it is hidden.
- id: ruleset_disintegrate
  section: game
  group: Preferences
  name: Disintegration
  type: toggle
  desc: A companion slain far past death leaves the party for the Adventurer's Inn.
