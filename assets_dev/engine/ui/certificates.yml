# The grand completion certificate: given once every world it names is finished, after that world's own certificate
# (CompletionCertificates.h). Each world's certificate is the completion block of its world.yml.
grand:
  worlds: [mm6, mm7, mm8]
  art: hud_x2/certificates/grand.png
  headline: The Three Worlds Are Saved
  text: >-
    Enroth, Antagarich and Jadame each stood at the edge of ruin, and each was saved by the same hands. Few heroes have
    walked so far or carried so much; this certificate honours a journey across all three worlds.
