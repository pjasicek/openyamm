<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenYAMM Decoration Review</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-title">
      <div>
        <h1>Decoration review</h1>
        <p>Native sprite and restored sprite on matching 2× canvases. Scroll to play visible animations.</p>
      </div>
      <button id="export-button" class="primary" type="button">Copy flags <span id="flag-count">0</span></button>
    </div>
    <div class="toolbar-controls">
      <label class="search-label">Search <input id="search" type="search" placeholder="Name, ID, or image" autocomplete="off"></label>
      <label>Show <select id="filter"><option value="all">All decorations</option><option value="animated">Animated / multiple views</option><option value="flagged">Flagged only</option></select></label>
      <label>Background <select id="background"><option value="dark">Dark</option><option value="light">Light</option><option value="checker">Checker</option></select></label>
      <label class="check-label"><input id="play-all" type="checkbox" checked> Play visible</label>
      <label class="check-label"><input id="rotate-views" type="checkbox" checked> Rotate views</label>
      <span id="progress" class="progress" aria-live="polite"></span>
    </div>
  </header>

  <main>
    <p id="empty" class="empty" hidden>No decorations match this search.</p>
    <div id="cards" class="cards"></div>
    <div id="load-more" class="load-more" aria-hidden="true"></div>
  </main>

  <dialog id="export-dialog">
    <div class="dialog-heading">
      <div><h2>Review flags</h2><p>Copy this JSON and paste it into our chat. It includes decoration IDs, view or frame targets, reasons and notes.</p></div>
      <button id="close-export" type="button" aria-label="Close">×</button>
    </div>
    <textarea id="export-json" readonly spellcheck="false"></textarea>
    <div class="dialog-actions">
      <span id="copy-status" role="status"></span>
      <button id="download-json" type="button">Download JSON</button>
      <button id="copy-json" class="primary" type="button">Copy JSON</button>
    </div>
  </dialog>

  <script src="catalog.js"></script>
  <script src="app.js"></script>
</body>
</html>
