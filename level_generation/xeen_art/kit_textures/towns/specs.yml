# New face textures of the Xeen town building kits (A6): cloudside_town (xc), darkside_town (xl), sandcaster (xs).
# Made with level_generation/textures_xeen/xtex.py --project level_generation/xeen_art/kit_textures/towns; the kits
# themselves (shipped textures by role, and these) are level_generation/xeen_art/kits/<kit>.yml.
# Format as level_generation/textures_xeen/specs.yml. One entry per texture:
#   size: [w, h]     logical texels (the project's `size`); the master is 4x that, x2 and x1 are reductions.
#   art: [w, h]      the aspect the picture is seen at in the map, when the face stretches it (`fit`).
#   kind:            sign (a board on grey, cropped), picture, tile (full-bleed, made seamless by a seam pass), edit,
#                    cutout
#   refs:            family masters sent as references (level_generation/textures_x4/masters/<world>/<name>.png); a
#                    sign's first ref also gives its layout guide's board colour
#   tone:            {like: [names], factor: f} the linear mean luma of those masters times f; or {luma: L}
#   family:          the family in words (prompt and kit notes)
#   what:            the content, in the prompt's words
# `dungeon:` names the kit (xtex.py reads the kit's family_words from `dungeons:`).
dungeons:
  cloudside_town:
    family_words: >-
      Harmondale, the home town of Might and Magic VII: half-timbered houses of cream and ochre plaster between dark
      brown oak beams, grey weathered plank walls, rough fieldstone, thatch and wooden shingle roofs, and the town's
      hanging shop signs of painted wooden boards in iron-cornered frames; warm, cheerful and bright
  darkside_town:
    family_words: >-
      the stone towns of Might and Magic VIII (Ravenshore's dock quarter and Regna): low houses of grey rounded
      boulder-stone between dark weathered timber posts, grey dressed ashlar with carved friezes, plank doors with
      iron straps and dark blue-grey slate roofs; cool, desaturated and dry
  sandcaster:
    family_words: >-
      the sandstone towns of Might and Magic VIII (Ravage Roaming) and the merchant houses of Might and Magic VI:
      smooth warm ochre sandstone walls with brick quoins, pointed windows and round iron grilles, arched plank
      doors, terracotta tile and gravel roofs, striped market-tent cloth and painted wooden shop signs; sun-baked,
      warm and dry
textures:
  # ================================================================ cloudside_town: named shop signs (Xeen's shops)
  # A board over a shop door or hanging from a bracket, 128 x 64 (a face of 128 x 64 units shows it 1:1).
  xcnorman:
    dungeon: cloudside_town
    size: [128, 64]
    kind: sign
    refs: [mm7/7sgtvrn, mm7/hhm1d, mm7/sgweapon]
    tone: {like: [mm7/7sgtvrn], factor: 1.2}
    family: MM7 Harmondale shop signs and hh timber
    where: Vertigo (X1), the weaponsmith, over the door
    standin: sgweapon
    what: >-
      Norman's weapon shop sign: a signboard of three horizontal dark brown oak planks like the first reference,
      in a thin oak frame with small iron corner plates. At the left end a painted black iron anvil with a
      smith's hammer resting on it and three orange sparks. Beside it, painted by hand in thick cream-white
      sign-painter's capitals with a dark red shadow, the small word "NORMAN'S" on a first line and the large word
      "IRONWORKS" under it. The paint slightly worn where the wood grain shows through.
  xcgilbert:
    dungeon: cloudside_town
    size: [128, 64]
    kind: sign
    refs: [mm7/7sgtvrn, mm7/sgmagi, mm7/hhm1d]
