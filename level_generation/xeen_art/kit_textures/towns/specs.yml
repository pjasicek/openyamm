    family: MM7 Harmondale shop signs and hh timber
    where: Vertigo (X1), the magic shop
    standin: sgmagi
    what: >-
      Gilbert's magic shop sign: a wooden signboard painted deep midnight blue, in a thin dark oak frame with
      small iron corner plates. At the left end a painted crooked purple wizard's hat under a pale crescent moon and
      two small gold stars. Beside it, painted in curly gold capitals with a thin dark outline, "GILBERT'S" on a
      first line and the larger word "HEXES" under it. The blue paint a little faded and chipped at the edges.
  xcgeraldn:
