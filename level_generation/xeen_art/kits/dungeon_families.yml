# Xeen dungeon families (A6, 2026-11-20): per dungeon style the shipped BLV families the next acts should use, with
# their textures by role and which Xeen dungeon (MAPS.md ids) takes which. Shipped only; contact sheet:
# kits/dungeon_families_sheet.png (landmark_sheet.py). Built dungeons' choices from devdocs/xeen/briefs/*/L4/NOTES.md.
title: Shipped indoor families per dungeon style for the next acts (selection only, nothing generated)
rule: 'Each dungeon (or each area of one) takes one shipped BLV whose purpose fits and lays its textures as that map does
  (the lead''s rule of 2026-11-13, XD-01..XD-03 NOTES). A second dungeon of a style takes a different family so the two
  read apart. Roles: wall, floor, ceiling, trim, door, pillar, liquid; role shares measured on the shipped BLV (face area
  by facet type).'
styles:
  mines:
    covered:
      XD-02 Red Dwarf Mines: MM6 Snergle's Caverns 6d05 + Snergle's Iron Mines 6d09 (red and dark rock, plank lagging)
      XD-03 Deep Mine: MM7 Red Dwarf Mines 7d34 + MM6 Gharik's Forge 6d18 (lava, soot brick)
      DD-25 Bosco's Hall (D5; D-62 Q35, A6 s16): 'MM7 Stone City 7d24''s town quarter (its timber house fronts no map uses),
        the dwarves'' walk-in throne hall; XD-09 uses 7d24''s rock hub, another face, far apart; new xdbosban; the
        gate MM8''s t09a03a/t09a03b pair (shipped, left and right leaves; D5''s outside door t09a03a mirrored)'
      XD-09 Golem Dungeon (X5): 'one shipped family per area, 0 new (A8, briefs/xd09/L4/NOTES): MM7 Stone City 7d24
        (hub, entry, stone level; cwb, cwb1, cfb1, 7tfb1, hdr1dl), MM6 Warlord''s Fortress 6d16 (wood level; cbeam5,
        bemdk4, bemstrt1, d8ceild, d2smldor), MM6 Gharik''s Forge 6d18 (iron level, a forge as its own purpose; d2wlactr,
        vlcwl3a, 6voltyl, d2ceil1, cvdor1, orfyrlga, vlcwl1, gset05; XD-03 has its lava and soot brick on another face;
        the world''s xwiron for the three bolts and the great lock''s lid, 6d18 having no plain dark iron),
        MM8 Prison of the Lord of Fire d37 (diamond level; gtempw3, gtempw1, gtempflr, gtemprf, gtempdor1, gcrysc3)'
      DD-10 Gemstone Mines (D1 west, D2 east, D6 third pocket; D-27): 'MM7 Nighon Tunnels 7d35 for all three pockets
        (cwb1 walls, cfb1 floors, 7wtrtyl water, cwb1gold, trim9_32); MM6 Gharik''s Forge 6d18 lava for C''s seam
        (6voltyl, vlcwl3a); four new veins in one style on cwb1 (map_textures/darkside, A6): xdvruby and xdvemrld (A),
        xdvsaph (B), xdvdiam (C). 7d35 is XD-09''s cwb1 rock too (its hub), another face, far apart'
  caves (trolls, gargoyles, dragons):
    covered:
      DD-04 The Gremlin Court (D1; D-26): 'court, waiting room and wall cellar in D1''s own t09 grey ashlar (the
        Darkside town kit: t09a01, t09b01, t09c01) with shipped floors and ceilings; burrows, barracks and the
        sappers'' tunnel in MM7 Tularean Caves 7d08 earth; one new picture: xdmayor, the Mayor with a moustache added,
        behind the throne (map_textures/darkside, A6)'
