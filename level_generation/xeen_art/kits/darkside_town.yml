# Xeen town building kit (A6, 2026-11-20). Shipped MM6-MM8 textures by role, then the new ones made for the kit
# (level_generation/xeen_art/kit_textures/towns: specs.yml, finished/<name>.png at 4x). Sizes are logical texels
# (the x4 masters in level_generation/textures_x4/masters/<world>/<name>.png are 4x). `maps`: the shipped outdoor maps
# that use the texture. Contact sheet: kits/darkside_town_sheet.png (kit_sheet.py). Roles follow Map Studio's house kits
# (openyamm-studio/core/OutdoorBuildings.cpp: wall, window, door, post_left, post_right, roof, trim, gable, ridge).
kit: darkside_town
title: Darkside stone and slate towns (Castleview, Lakeside, Darkside hamlets)
look:
- Low houses of grey rounded boulder-stone between dark weathered timber posts, under dark slate;
- the better streets and civic buildings in grey dressed ashlar with carved friezes. Desaturated, dry, cool.
family_sources:
- source: MM8 Ravenshore out02, the dock/ogre quarter's t06 set
  why: 'the only shipped stone-and-slate house set: boulder walls, timber posts, plank doors and shutters, slate roof t06a05
    and its eave course t06b05, with plain and carved-frieze (b, c, d, e) variants of each piece; grey and low by construction'
- source: MM8 Regna out13 (and Shadowspire out06) t09 set
  why: 'grey dressed ashlar of the same grey, with friezes, pilasters, slit and pointed windows and a carved double door:
    the rich/civic quarter, the jail, the bank and Castleview''s walls. Its red tile roof (t09a05) is replaced by slate
    (t06a05 or the new xlslate)'
- source: MM7 grey plank decks (7trimd*), MM8 dock beams (btrima2) and the MM8 shop signs (sg*)
  why: Lakeside quays and jetties; the pictorial signs every MM8 town uses
- source: Rejected
  why: 'MM8 Shadowspire t19 (gothic, teal and green-scale roofs: too ornate, a candidate for Necropolis); MM8 Ravenshore
    t14 (warm brown fieldstone and thatch); MM6 cs (purple brick castle); MM7 Deyja cn (castle only)'
grades:
  poor: t06 plain pieces (a) under xlslatemos
  middle: t06 with the carved frieze (b, c, d, e) under t06a05
  rich: t09 ashlar under xlslate
  service: t09 ashlar with the carved double door, pilasters and panels
