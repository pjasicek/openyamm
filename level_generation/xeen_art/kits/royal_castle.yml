arms: 'From the source''s castle wall sets (decision D-3.1, 2026-11-20): Burlock a gold griffin rampant on red
  (reference/mm4_5_world_of_xeen/unpacked/sprites/xeen/fcstl2.fwl/frame_0006.png, a red shield with a gold griffin);
  Kalindra her silver crescent and rose on purple (sprites/dark/fcstl2.fwl/frame_0006.png, a purple banner; the
  crescent and rose are ours, the colour is the source''s); Newcastle a white tower on blue (the kit''s first Burlock
  art without the crown). The kit has 9 new textures.'
