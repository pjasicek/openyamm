# Xeen landmark kit: royal castles of white stone (A6, 2026-11-20). Shipped MM6-MM8 textures by role, then the new
# ones made for the kit (level_generation/xeen_art/kit_textures/landmarks: specs.yml, finished/<name>.png at 4x).
# Sizes are logical texels (the x4 masters in level_generation/textures_x4/masters/<world>/<name>.png are 4x).
# `maps`: the shipped maps that use the texture (outdoor first; `maps_more` counts the rest). Contact sheet:
# kits/royal_castle_sheet.png (landmark_sheet.py).
kit: royal_castle
title: Royal castles of white stone (Castle Burlock, Castle Kalindra restored, Castleview walls, Newcastle)
look:
- 'Castle Ironfist (MM6): pale cream ashlar with orange-tan crenels, quoins and carved frames, Gothic green-glass windows,'
- carved oak gates; grey MM6 castle stone for curtain walls and footings, slate cones; inside, cream marble halls of MM7.
family_sources:
- source: 'MM6 Castle Ironfist outd3 (bmodels IrTop, IrGate, IrWallFt, IrTwrLt/Rt, IrBkLt, IrHall; temples TempleW/S): the
    hc set'
  why: the only shipped royal castle of white stone, and MM6 is Xeen lineage (the Ironfist line, King Roland); 19 pieces
    cut as one canvas (plain wall, crenellated band, quoined ends, windows, balcony, triple window, statue niches, three
    gates), so walls, towers and gatehouses tile without steps. Used only in outd3, so it reads as new in Xeen.
- source: 'MM6 castle stone cs set (Frozen Highlands outc1, Misty Islands oute2, outd3 bridges and the D11 tower): grey
    ashlar'
  why: 'the matching grey stone of MM6 castles: curtain and town walls (Castleview), footings, bridges, the coping trims
    cstr128/256 and a grey arrow slit; the white hc faces sit on it as Ironfist does (bridges, docks)'
- source: 'MM7 Harmondale 7out02 player castle (PC01-PC16): ch1b1 ruin pieces, and Castle Harmondale 7d29'
  why: 'the shipped precedent of a castle rebuilt in stages (MM7 swaps ruin and restored models): Newcastle''s stages 0-1
    wear the ch1b1 ruin set, stage 2+ the hc set; 7d29 gives royal furnishing (tapestries, doors, cabinets)'
- source: 'MM7 The Titans'' Stronghold 7d09 and Temple of the Light t01 (also Castle Lambent 7d30, Castle Navan 7d32): the
    t3s2 marble'
  why: 'the interior hall family: cream marble panels with a carved knotwork dado, marble pilasters and ceiling, marble
    floors with a dark border and a rug; a white castle inside matches its white outside (Castle Gloaming, the dark castle,
    is XD-12 Darzog''s)'
per_castle:
  XD-07 Castle Burlock (X4): hc exterior on cs footings, xtslate cones; Burlock crest xkburcrst (gold griffin on red) at the gatehouse and keep,
    xkportc on the Crusaders' gate; interior the t3s2 hall set with xkburban banners and Harmondale tapestries
  DD-03 Castle Kalindra (D1, staged): the same hc and t3s2 sets with Kalindra crest xkkalcrst and banner xkkalban; its out-of-phase
    (unrestored) wings in MM7 Castle Gryphonheart 7d33 (chb1, dchb1, tfb2), see dungeon_families castles
  Castleview walls (D1): cs grey curtain walls, csaro128 and xkarrow slits, cstr coping, hc gate towers with xkkalcrst;
    xtslate roofs (Darkside stone and slate)
  XD-13 Newcastle Keep (X3, staged): 'stage 0-1: ch1b1 ruin pieces, rubble; stage 2+: hc walls and gate with Newcastle''s
    arms xkncscrst (a white tower on blue, no crown: the first Burlock art without its crown, D-3.1) and its banner
    xkncsban in the hall'
