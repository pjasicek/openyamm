# Xeen landmark kit: witch and wizard towers (A6, 2026-11-20). Shipped MM6-MM8 textures by role, then the new ones
# (level_generation/xeen_art/kit_textures/landmarks: specs.yml, finished/<name>.png at 4x). Sizes are logical texels;
# `maps` the shipped maps using the texture (outdoor first). Contact sheet: kits/towers_sheet.png (landmark_sheet.py).
kit: towers
title: Witch and wizard towers of dark timber and slate (Witch Tower, Darzog's, High Magic, Ellinger's, the Towers of Mok)
look:
- 'Cloudside: Bracada''s wizard towers (MM7): grey rubble under black-timber friezes and posts, carved dark oak, black roofs;'
- 'Darkside: Nighon''s slate-blue coursed stone and black rubble with skull friezes; new slate cones and slate-hung storeys.'
family_sources:
- source: 'MM7 Bracada Desert 7out06 (Tower1N, tower15E, tower5N, Tower 4S), Evenmorn out09, Celeste 7d25: the hwm2/hwm1
    set'
  why: 'MM7''s wizard towers: grey rubble stone hwm2wall under a black timber frieze (hwm2b), windows, a runic door and
    black plank roofs; carved dark-oak timbering hwm1. It is the same family as XD-04 Witch Tower''s interior (7d12 Clanker''s
    Laboratory lays hwm2wall/hwm2b/hwm2rf inside), so a tower''s outside matches its inside.'
- source: 'MM7 Mount Nighon out10 (Fort_E*, Tower1_E*, Tower2_E*): the hkm set'
  why: 'dark timber and slate for the Darkside towers: hkm3 slate-blue coursed stone over a rubble footing under a carved
    skull frieze, hkm2 black rubble in black timbers with a green-glass window, carved doors; used only on out10, so it
    reads as new'
- source: 'MM8 Shadowspire out06 / Regna out13 (watchtwr_W*): t19 and t09 ashlar towers (optional third)'
  why: crenellated grey-violet ashlar (t19b01) and a Gothic window (t19b04c) for one Mok tower that should read apart; MM8
    green scale roofs t19a05b for a copper cone
- source: 'Interiors: MM7 Clanker''s Laboratory 7d12 (XD-04 already), Celeste 7d25, MM6 Agar''s Laboratory 6d19, MM8 Castle
    of Air d27 and Castle of Fire d29'
  why: one shipped tower or wizard building per kind of tower, chosen so no two Xeen towers share one (see dungeon_families
    towers)
per_tower:
  XD-04 Witch Tower (X1, built): outside hwm2 + hwm1 under xtslate; inside 7d12 and 7d06 (as built)
  XD-12 Darzog's Tower (X2, built): inside Castle Gloaming d03 and School of Sorcery 7d14 (as built); outside hkm3/hkm2
    (dark, the villain's) with xtslate
  XD-11 Tower of High Magic (X3): outside hwm2 base with the pale hwp1 plaster storeys of Celeste; inside Celeste 7d25
  DD-02 Ellinger's Tower (D1): outside hkm1 dressed stone with hkm3 base and xtslatew storeys; inside Agar's Laboratory
    6d19
  FD-03 Darkstone Tower (X5): outside hkm3 under xtslate, blackened; inside MM8 Castle of Fire d29
  DD-05 to DD-08 Towers of Mok: 'one family for the four: hkm3/hkm2 outside with xtslate cones; inside MM8''s Castle of
    Air d27 (Escaton''s gnec stone is kept for Castle Xeen); the Northern Tower may take t19 crenellated ashlar outside
    to read apart'
