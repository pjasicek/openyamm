# Xeen landmark kit: Ancient technology (A6, 2026-11-20). Shipped MM6-MM8 textures by role, Hesper candidates, then
# the new ones (level_generation/xeen_art/kit_textures/landmarks). Sizes are logical texels; `maps` the shipped maps
# using the texture. Contact sheet: kits/ancient_sheet.png (landmark_sheet.py).
kit: ancient
title: Ancient technology (Castle Alamar, the crashed pods, Castle Xeen's machines, the Parabolic Barrier, travel pyramids)
look:
- 'MM6''s Control Center: dark teal-grey and verdigris steel, rust, riveted plates and pipes, green and red energy grids;'
- 'MM7''s crashed Lincoln for the pods: dark hull steel with green light strips and consoles; new outer plating and fields.'
family_sources:
- source: 'MM6 Control Center sci-fi.blv (the sw set; also the Hive''s swfloor2b): main family'
  why: 'the Ancients'' own installation in the series that Xeen begins (the Guardian''s control centre of MM6): Xeen''s
    Ancients are the same makers, so Castle Alamar and Castle Xeen''s machines read as their work. Dark teal steel walls,
    rusted girders, glowing green lattices, red grates, consoles; 60 textures, used in no other shipped dungeon, so it reads
    as new'
- source: 'MM7 The Lincoln 7d23 (the a and sfw sets): the pods'
  why: 'MM7''s crashed Ancient starship: grey hull steel with green light strips, capsule panels and screen consoles (sfpnlon/sfpnloff);
    the escape pods are small ships of the same makers. Kept to the pods so they read apart from Alamar'
- source: 'MM8 Plane between Planes pbp.odm (gn_mtl01-03: the Large Shield, the elemental prisons)'
  why: plain brushed metal at outdoor scale for big surfaces (the Parabolic Barrier's frame, pyramid cladding); too plain
    for walls alone, hence the new panelled plating xahull
- source: 'Hesper (Kreegan world) kits K1/K3/K9, design/kreegan_world/art: NOT shipped, reuse candidates only'
  why: Hesper's Ancients are white ceramic and tarnished gold; beside MM6's teal steel they read as another civilisation,
    so they are not the base. Reusable where a whole area can take that cleaner look, counted in Xeen's new-texture budget
    (450) since no shipped world carries them; see hesper_reuse
per_site:
  DD-17 Castle Alamar (D6, L): outside xahull on gn_mtl, xaenergy pylons; inside the sw set (swll4dk main, swll5dk, swall1-5,
    swfloor2b), conveyor halls swr2dk/swr4dk, energy fields xafield, the true-name gate swdoora
  DD-16 Corak's Pod, DD-22 Sheltem's Pod (D6): outside xahullbn (burnt, in the lava field); Corak's inside the Lincoln set
    (a3b, sfw7a, consoles sfpnlon); Sheltem's inside the sw set (swll5dk main walls, D-67; red accents swrdk2, swared),
    so the two read apart
  XD-19 Castle Xeen (X9): its machines (guard-making machines, elemental generators) as sw panels with xaenergy, barriers
    xafield; the castle itself is MM8 Escaton's Palace (dungeon_families castles)
  Parabolic Barrier, travel pyramids: gn_mtl frames, xahull cladding, xafield curtain, xaenergy pylons
  FD-01 Alamar Depths: the sw set's braced panels (swall4 in the galleries and passages, swall2 in the halls) on swankdk
    plate floors, with xahullbn where the castle came down; no swll5dk main walls, no red accents (D-69). Confirmed at
    the 08:28 install: 17 shipped textures (sw set, swgirder ribs, swceilf, swdoora/b/c, xafield, gn_mtl02/03), 0 new
