# Xeen town building kit (A6, 2026-11-20). Shipped MM6-MM8 textures by role, then the new ones made for the kit
# (level_generation/xeen_art/kit_textures/towns: specs.yml, finished/<name>.png at 4x). Sizes are logical texels
# (the x4 masters in level_generation/textures_x4/masters/<world>/<name>.png are 4x). `maps`: the shipped outdoor maps
# that use the texture. Contact sheet: kits/sandcaster_sheet.png (kit_sheet.py). Roles follow Map Studio's house kits
# (openyamm-studio/core/OutdoorBuildings.cpp: wall, window, door, post_left, post_right, roof, trim, gable, ridge).
kit: sandcaster
title: Sandcaster, the sandstone merchant city, and the Crossroads market
look:
- Smooth ochre sandstone with brick quoins, pointed windows, round grilles and arched plank doors, flat gravel and
- terracotta roofs; a pink ashlar wizard quarter with statues and balconies; striped stall cloth. Sun-baked, warm.
family_sources:
- source: MM8 Ravage Roaming out08, the t07 set
  why: a complete ochre sandstone house set in three grades (a ochre with quoins and cornice, b orange plain, c ochre with
    brick quoins), with pointed, square, slit and round windows and single and double arched doors; reads as a dry desert-edge
    town at MM8 brightness
- source: MM6 Castle Ironfist outd3, the hc set (the city's high houses)
  why: 'pink-beige ashlar with gothic leaded windows, a balcony, statue niches and a grand double door: the wizard quarter
    (closed until Astra''s quest) and the guild buildings'
- source: MM8 Garrote Gorge/Ravage Roaming t30
  why: 'sandstone rubble and block walls, gate and paving: the city wall and the streets'
- source: MM6 market tents (tentwal*, tentrf*, tentdor*)
  why: the striped stall cloth for the Crossroads market and Sandcaster's awnings
- source: Rejected
  why: 'MM6 desert de* (red rock, rough); MM6 egy* (Egyptian temple, wrong culture); MM8 Alvar t05 (brown stucco, grey brick:
    a temperate town); MM8 Ironsand t13 (troll fieldstone huts); MM7 Bracada hw (white plaster, not sandstone)'
grades:
  poor: t07 b (orange plain, slit and square windows) under t07b02 gravel
  middle: t07 a (ochre, pointed windows, cornice) under t07b02 or t07a05
  rich: t07 c (brick quoins, double doors) with desrf2a terracotta on pitched parts
  service: hc (wizard quarter, guilds), t30 (walls, gate), MM6 tents (market)
