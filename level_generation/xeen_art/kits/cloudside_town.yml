# Xeen town building kit (A6, 2026-11-20). Shipped MM6-MM8 textures by role, then the new ones made for the kit
# (level_generation/xeen_art/kit_textures/towns: specs.yml, finished/<name>.png at 4x). Sizes are logical texels
# (the x4 masters in level_generation/textures_x4/masters/<world>/<name>.png are 4x). `maps`: the shipped outdoor maps
# that use the texture. Contact sheet: kits/cloudside_town_sheet.png (kit_sheet.py). Roles follow Map Studio's house kits
# (openyamm-studio/core/OutdoorBuildings.cpp: wall, window, door, post_left, post_right, roof, trim, gable, ridge).
kit: cloudside_town
title: Cloudside half-timbered towns (Vertigo, Rivercity, Asp, Winterkill, Nightshadow, hamlets)
look:
- 'Harmondale''s half-timbered houses: cream and ochre plaster, grey daub and grey planks between dark oak beams,'
- thatch, shingle and red-brown slate roofs, fieldstone for service buildings and walls; warm, MM6/MM7 brightness.
family_sources:
- source: 'MM7 Harmondale 7out02 (also Erathia 7out03, Tatalia 7out13, Emerald Isle 7out01): the hh set'
  why: one human half-timber family in three grades (poor hhp, middle hhm1-3, rich 7hhr1), 61 pieces cut as composed facades
    that abut cleanly (end, window and door pieces on each base wall); already the built X1 Vertigo stand-in, so Vertigo
    needs no change. MM6 pxstr has the same idea but only 10 pieces and no grades.
- source: 'MM7 Harmondale/Erathia ch: chb1 fieldstone and ch1b1 castle stone'
  why: Harmondale's own stone kit for service buildings (guilds, bank, temple base), town walls, bridges' piers
- source: MM7 shared trims (trim*_32, 7trimd/7trimda planks) and the MM7 hanging signs (sg*)
  why: the beams, posts, plank decks and pictorial shop signs every MM7 town uses with hh
- source: 'Optional second family for one quarter: MM6 pxstr (New Sorpigal oute3, Free Haven outc2, Blackshire outb2)'
  why: MM6-lineage white plaster and orange timber, for one old quarter of Rivercity (the riverside or skill row); keep
    it to that quarter (TOWN_FEEL 1)
grades:
  poor: hhp1 (grey plaster) and hhp2 (rubble, poles); thatch hhp2rf
  middle: hhm1 (grey planks, hhm1rf), hhm2 (ochre plaster, hhm2rf), hhm3 (grey daub, hhm3rf)
  rich: 7hhr1 (cream plaster, oak bands, carved doors, oriels); 7hhr1rf
  service: chb1 fieldstone with the hh doors; guild towers and temples may break the style
