# Map textures of X4 Burlock Savannah made by A6 (2026-11-20, decision D-15): Asp's two pedestal caps.
# Made with level_generation/textures_xeen/xtex.py --project level_generation/xeen_art/map_textures/x4; registered in
# assets_dev/worlds/xeen/source/textures.yml. Same format as level_generation/textures_xeen/specs.yml.
# The caps replace XD-02's xnbasred/xnbasblu on X4 (they read as grey-teal cave rock). The pattern is a lattice of
# 2 x 2 slabs, so the tile pass's roll by half leaves it as painted, and the cap (176 x 176) shows whole slabs.
# Red is darker and blue lighter (tone factors), so the two read apart without colour (colour-blind players).
dungeons:
  x4_asp:
    family_words: >-
      the dressed brown sandstone of Might and Magic VII's Harmondale and Castle Harmondale (chb1s, chb1): warm
      brown and tan dressed blocks with rounded worn edges, fine pitted grain and pale sandy mortar joints
textures:
  xnpedred:
    dungeon: x4_asp
    size: [128, 128]
    kind: tile
    wrap: uv
    refs: [mm7/chb1s, mm7/chb1]
    tone: {like: [mm7/chb1s], factor: 0.72}
    family: map X4; MM7 chb1s (Asp's pedestal stone, red inlay)
    where: the red caps of Asp's eight pedestals (Q-C5), shown when a pedestal is touched
    standin: xnbasred
    what: >-
      The top of a stone pedestal cap, repeating: a grid of exactly two by two square dressed slabs of the references'
      warm brown sandstone, the slabs' worn rounded edges and pitted grain as in the first reference's top course.
      Every joint between the slabs, along the vertical and horizontal centre lines and along all four canvas edges,
      is a straight inlaid strip of glossy deep blood-red enamel, as wide as a finger, set flush in the stone with a
      thin dark line on each side. In the middle of each slab one round inlaid boss of the same deep saturated red
      enamel, about a third of the slab's width, with a thin bronze rim. The red is dark and strong, like garnet or
      oxblood glaze, unmistakably red, never orange or pink. All four slabs alike.
  xnpedblu:
    dungeon: x4_asp
    size: [128, 128]
    kind: tile
    wrap: uv
    refs: [mm7/chb1s, mm7/chb1]
    tone: {like: [mm7/chb1s], factor: 1.25}
    family: map X4; MM7 chb1s (Asp's pedestal stone, blue inlay)
    where: the blue caps of Asp's eight pedestals (Q-C5), shown before a pedestal is touched
    standin: xnbasblu
    what: >-
      The top of a stone pedestal cap, repeating: a grid of exactly two by two square dressed slabs of the references'
      warm brown sandstone, paler and sun-bleached, the slabs' worn rounded edges and pitted grain as in the first
      reference's top course. Every joint between the slabs, along the vertical and horizontal centre lines and along
      all four canvas edges, is a straight inlaid strip of glossy clear mid-blue enamel, as wide as a finger, set
      flush in the stone with a thin dark line on each side. In the middle of each slab one round inlaid boss of the
      same bright clear blue enamel, about a third of the slab's width, with a thin bronze rim. The blue is light and
      clean, like cornflower or lapis glaze, unmistakably blue, never teal, green or grey. All four slabs alike.
