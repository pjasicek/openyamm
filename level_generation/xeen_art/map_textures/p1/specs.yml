# P1 Plane of Fire's own textures (A6's planes sub-agent, sixteenth session, 2026-11-21; D-58 P1 Q2 and the ROWS line:
# Dungeon S, at most 4 new, two named). Made with level_generation/textures_xeen/xtex.py --project
# level_generation/xeen_art/map_textures/p1; registered by the A6 lead from output/studio_cal/p1/tex/REGISTER_A6.yml.
dungeons:
  p1:
    family_words: >-
      the volcanic rock of Might and Magic VIII's Plane of Fire and Might and Magic VI's Gharik's Forge (gcav2flr,
      orfyrlga): cooled black-brown lava crust with dark cracks, molten orange lava with a glowing crust, hand-painted
      in the games' soft painted manner under flat even light
textures:
  xpfvent:
    dungeon: p1
    size: [128, 128]
    kind: picture
    refs: [mm8/gcav2flr, mm6/orfyrlga]
    tone: {like: [mm8/gcav2flr], factor: 1.1}
    family: map P1; MM8 Plane of Fire gcav2flr (black lava crust) with MM6 orfyrlga's molten lava
    where: P1's nine vent faces (PressurePlate floor plates, 192 x 192, once per face, fit; planes.vent)
    standin: gcav2flr
    what: >-
      The black lava crust of the first reference seen from above, its colour, cracks and grain unchanged at the
      edges of the picture, split in the middle by a ragged vent: a jagged branching fissure about a third of the
      picture wide, glowing from inside with the molten orange and yellow lava of the second reference, the crust
      round its lips scorched dull red and grey with a little pale ash. The glow stays inside the fissure and fades
      quickly into the dark crust; the outer quarter of the picture on every side is plain crust that matches the
      first reference, so the face sits in a crust floor without a seam. No smoke, no flames standing up, no sparks.
  xpfglass:
    dungeon: p1
    size: [128, 128]
    kind: tile
    wrap: uv
    refs: [mm8/gcav2flr, mm6/orfyrlga]
    tone: {like: [mm8/gcav2flr], factor: 0.9}
    family: map P1; obsidian in MM8 Plane of Fire's palette (gcav2flr's black, orfyrlga's reds)
    where: the Crucible's black-glass ring, the Sleeper's gate leaves (fit, once per leaf) and its bridge's deck
    standin: gcav2flr
    what: >-
      Obsidian: smooth black volcanic glass laid as a floor of large irregular fused slabs, its surface glossy and
      nearly black, with soft conchoidal ripples and a few fine pale fracture lines, and deep inside the glass dim
      smoky red and dark orange depths as if lava glowed far beneath, strongest in a few slow swirls and fading to pure
      black elsewhere. Hand-painted in the manner of the references, flat even light, no bright highlights, no sparkles,
      no pattern centred, seamless in both directions.
