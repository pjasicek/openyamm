# Cloudside map and dungeon textures made by A6 (2026-11-20, session 11): the river-gorge panorama for XD-27's gorge
# (A8's request in devdocs/xeen/briefs/xd27/L4/NOTES.md, "For A6"), reusable in any indoor gorge or river view.
# Made with level_generation/textures_xeen/xtex.py --project level_generation/xeen_art/map_textures/cloudside;
# registered in assets_dev/worlds/xeen/source/textures.yml. Same format as level_generation/textures_xeen/specs.yml.
# pics/7plansky1.png is MM7's sky (assets_source/worlds/mm7/textures_x4), the roof XD-27 lays over the gorge.
dungeons:
  gorge:
    family_words: >-
      Might and Magic VII's painted fair-weather sky (7plansky1: a deep saturated blue with soft warm cream
      clouds), the green hills of the Xeen daylight view painted for this game (xodaylt), and the dark brown cave
      rock of Might and Magic VIII's Dire Wolf Den (gcav1wal) that forms the gorge's cliffs
textures:
  xogorge:
    dungeon: gorge
    size: [512, 256]
    art: [1600, 600]
    kind: picture
    refs: [pic/7plansky1, xeen/xodaylt, mm8/gcav1wal]
    tone: {luma: 118}
    family: map XD-27; MM7 7plansky1 sky over XD-05's xodaylt hills, MM8 d08 gcav1wal cliffs (river gorge view)
    where: XD-27's gorge, the east (far) wall's panel over the far cliff (1600 x 600, up to the sky roof)
    standin: xodaylt
    what: >-
      A wide landscape panorama seen from a ledge high in a river bluff, looking straight across a deep river gorge
      on a fair day. The upper part of the picture, down to about 38 percent from the top, is open sky: at the very
      top the same deep saturated blue as Reference 1, the whole width, then a little paler and softly hazy towards
      the horizon, with a few soft warm cream clouds like Reference 1's. The horizon is a line of far blue-green
      rolling hills about 38 percent down from the top. Below it, in the middle distance, a broad river winds away
      into the distance between green wooded hills and pale grey rocky bluffs, its water catching the sky's blue,
      bending from the right of the picture's middle towards the far left hills. Nearer, the far bank of the gorge:
      grassy slopes with clumps of trees and grey-brown rock outcrops. The lowest third of the picture, across its
      whole width, is the top of the gorge's far cliff, close by: rough dark brown fractured rock in the colours of
      Reference 3, its broken upper edge with a few tufts of grass, running unbroken from the left edge to the right
      edge. No path, no road, no buildings, no people, no boats, no birds, no text.
