    pieces: {L: mm7/hhm1b2le, R: mm7/hhm1b2re, D: mm7/hhm1d, E: mm7/hhm1d2, w: mm7/hhm1bw, roof: mm7/hhm1rf,
             gable: mm7/hhm1b1, sign: mm7/7sgstabl}
