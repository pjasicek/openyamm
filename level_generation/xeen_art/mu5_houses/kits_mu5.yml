# MU-5 house kit boards (houses.py): per town kit the pieces (codes) and 6-10 house types in front elevation.
# Pieces are the kits' shipped textures (world/name, level_generation/xeen_art/kits/<kit>.yml) and their new
# textures (bare names, level_generation/xeen_art/kit_textures/towns). Storeys bottom first, one code per 128 units.
# Left ends (L) carry the post, quoin or pilaster on their left edge, right ends (R) on their right edge.
cloudside_town:
  title: Cloudside half-timbered town (Vertigo, Rivercity, Asp)
  look: >-
    Warm, cheerful MM6/MM7 daylight: half-timbered houses of cream and ochre plaster, grey daub and grey planks between
    dark oak beams, thatch, shingle and red-brown slate roofs, painted wooden shop signs, flower boxes and a green lawn.
  pieces: {L: mm7/hhm2el, R: mm7/hhm2er, W: mm7/hhm2b2, w: mm7/hhm2bw, D: mm7/hhm2d, roof: mm7/hhm2rf,
           gable: mm7/hhm2b2, chimney: mm7/hhm3ch, plinth: mm7/hhp2b2}
  houses:
  - name: poor cottage
    storeys: ["L w D R"]
    roof: eaves
    roof_height: 192
    extras: [chimney]
    pieces: {L: mm7/hhp1el, R: mm7/hhp1er, w: mm7/hhp1bw, D: mm7/hhp1d, roof: mm7/hhp2rf, chimney: mm7/hhp2b2}
