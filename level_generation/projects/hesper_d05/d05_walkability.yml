# Each fight crosses a repaired stair, landing, lift lip or cleared pack position before melee range.
# Each defender takes two energy hits: the first only breaks its energy shield (overflow is lost), the second
# (skip_dead) kills it, so no surviving defender charges or blocks the party during a pursuit.
