# Rolls use the deterministic new-game seed (1 gold, 2 item, 3 empty); item delivery remains a desktop check.
# Native picking in each stat supply group and two separated satchel spots; used state survives save/reload.
id: hesper.d01.pickups
world: hesper
mode: faithful
steps:
- new_game_flow: {start_map: hes_d01.blv}
- assert: {state_dump_named_map_var: {name: HesperPickups.Rolled, value: 1}}
- set_pose: {map: hes_d01.blv, x: 7930, y: 4680, z: 0, yaw: 2.41495, pitch: -0.4}
- press_interact: {expect: {kind: event_target, target_kind: 2, name: "Stim canister"}}
- assert: {state_dump_named_map_var: {name: HesperPickups.701, value: 8}}
- set_pose: {map: hes_d01.blv, x: 1850, y: 4500, z: 0, yaw: 1.5707963, pitch: -0.4}
- press_interact: {expect: {kind: event_target, target_kind: 2, name: "Stim canister"}}
- assert: {state_dump_named_map_var: {name: HesperPickups.706, value: 8}}
- set_pose: {map: hes_d01.blv, x: 5550, y: 4500, z: 0, yaw: 1.5707963, pitch: -0.4}
- press_interact: {expect: {kind: event_target, target_kind: 2, name: "Stim canister"}}
- assert: {state_dump_named_map_var: {name: HesperPickups.709, value: 8}}
- set_pose: {map: hes_d01.blv, x: 1630, y: 3400, z: 0, yaw: 3.1415927, pitch: -0.7}
- press_interact: {expect: {kind: event_target, target_kind: 2, name: "Colony satchel"}}
- assert: {state_dump_named_map_var: {name: HesperPickups.751, value: 2}}
- set_pose: {map: hes_d01.blv, x: 3100, y: 630, z: -768, yaw: -1.5707963, pitch: -0.7}
- press_interact: {expect: {kind: event_target, target_kind: 2, name: "Colony satchel"}}
- assert: {state_dump_named_map_var: {name: HesperPickups.765, value: 2}}
- save_game: {name: d01_pickups}
- load_game: {name: d01_pickups}
- assert: {state_dump_named_map_var: {name: HesperPickups.Rolled, value: 1}}
- assert: {state_dump_named_map_var: {name: HesperPickups.701, value: 8}}
- assert: {state_dump_named_map_var: {name: HesperPickups.706, value: 8}}
- assert: {state_dump_named_map_var: {name: HesperPickups.709, value: 8}}
- assert: {state_dump_named_map_var: {name: HesperPickups.751, value: 2}}
- assert: {state_dump_named_map_var: {name: HesperPickups.765, value: 2}}
- set_pose: {map: hes_d01.blv, x: 3100, y: 630, z: -768, yaw: -1.5707963, pitch: -0.7}
- press_interact: {}
- assert: {state_dump_named_map_var: {name: HesperPickups.765, value: 2}}
