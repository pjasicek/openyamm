# Explicit conversion choices for Anskram Keep (convert.py reads this; a rerun keeps them).
#
# models: what each DAT world model becomes. static: its faces join the room geometry as they are
# (authored pose); skip: left out; a mover: {group, motion}. motion dat: MM9's own linear Door motion
# (MoveDir, MoveDist, Speed); rotate: MM9's own swing, one rotating mover per leaf (RotationPoint, RotationAngles,
# Speed, CloseWaitTime; devdocs/INDOOR_ROTATING_MOVERS_AND_LADDERS.md); sink: a breakable wall plug drops by its height
# into the floor or wall below (the cages). bodies/carry: what the mover does to the party and monsters in its way.
# falls/falls_point: the trap's trigger, which its open swing must take down (the build checks the sign); rises: a hatch.
# doorway: the mover closes a doorway (a portal), with a click event unless click: false (the gate's leaves open
# only by its switches, the cages by their triggers; content.py wires those). authored_open: MM9 authors the
# leaves apart and its open slides them shut; built shut and starting open (the outer gate).
