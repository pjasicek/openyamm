# Archway portals beyond the doorways: a cut through the air of the voxel slice perpendicular to `axis` (x or z) at
# `point` (LithTech units), sealing the opening the point stands in, at most `span` (default 256) to either side
# along the cut. Chosen on work/rooms_large.png.
portals:
  - {name: north_hall_5140, axis: z, points: [[-800, -150, 5140], [0, -150, 5140], [800, -150, 5140]], span: 600}  # north of the stair pit
  - {name: north_hall_5650, axis: z, points: [[-560, -150, 5650], [0, -150, 5650], [560, -150, 5650]], span: 200}
  - {name: central_hall_2700, axis: z, point: [0, -150, 2700], span: 600}
  - {name: south_hall_600, axis: z, point: [0, -150, 600], span: 500}
  - {name: hall_south_passage, axis: z, point: [0, -150, 1600]}
  - {name: west_corridor_north, axis: z, point: [-1730, -150, 2700]}
  - {name: west_corridor_hall, axis: x, point: [-1280, -150, 2496]}
  - {name: west_corridor_south, axis: z, point: [-1730, -150, 1150]}
  - {name: west_diagonal, axis: x, point: [-1500, -150, 1060]}
  - {name: south_corridor_west, axis: x, point: [-1300, -150, 704]}
  - {name: south_vestibule_west, axis: x, point: [-330, -150, 64]}
  - {name: south_vestibule_east, axis: x, point: [330, -150, 64]}
  - {name: south_corridor_east, axis: x, point: [1180, -150, 704]}
  - {name: east_diagonal, axis: x, point: [1500, -150, 1068]}
  - {name: east_corridor_south, axis: z, point: [1728, -150, 1150]}
# Exit volumes (map_transitions.txt rows of this map): MM9's spiral stair to Sturmford has risers of 24 (61 native),
# more than the party climbs (50), so the exit volume reaches down to the foot of the stair.
exits:
  Sturmfordexit: {bottom_lt: -196}

# Explicit portal rectangles: the traps' floor openings and the hatches' holes, which the rotating covers close.
# The portals stand in the floors' plane; the movers keep their faces in both rooms.
rect_portals:
  - {name: TrapPit1, min_lt: [1272, -196, 504], max_lt: [1416, -196, 768]}
  - {name: TrapPit2, min_lt: [-1792, -196, 1268], max_lt: [-1528, -196, 1412]}
  - {name: TrapPit3, min_lt: [-1792, -196, 3146], max_lt: [-1528, -196, 3290]}
  - {name: TrapHatch1, min_lt: [1208, -196, 672], max_lt: [1272, -196, 736]}
  - {name: TrapHatch2, min_lt: [-1760, -196, 1204], max_lt: [-1696, -196, 1268]}
  - {name: TrapHatch3, min_lt: [-1760, -196, 3082], max_lt: [-1696, -196, 3146]}

# MM9's Ladder volumes. facing_lt: (x, z) toward the ladder; surface_lt: where a climber stops along it (the
# LadderBlocker's face); top_exit_lt: where the party stands after climbing out through the hatch.
ladders:
  Ladder4: {facing_lt: [-1, 0], surface_lt: 1220, top_exit_lt: [1240, -192, 752]}
  Ladder5: {facing_lt: [0, -1], surface_lt: 1216, top_exit_lt: [-1678, -192, 1240]}
