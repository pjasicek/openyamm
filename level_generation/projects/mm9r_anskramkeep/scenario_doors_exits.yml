id: mm9r.anskramkeep_doors_exits
title: Anskram Keep (native BLV pilot) - the south door swings open, the party walks through it, and both exits ask to leave
world: mm9
mode: faithful
tags: [mm9, mm9_rework, draft]
steps:
  - load_map: {map: anskramkeep.blv}
  - note: {text: "Sturmfordexit (DAT object 988): the volume reaches down to the foot of MM9's spiral stair."}
  - movement_segment:
      input: forward
      seconds: 0.6
      actor_collision: false
      actor_ai: false
      start: {map: anskramkeep.blv, x: 0, y: 102, z: -491, yaw_degrees: 270, pitch: 0}
      expect_stop: {map: anskramkeep.blv, x: 0, y: -180, z: -491, yaw_degrees: 270, pitch: 0}
      loose_tolerance: true
      tolerance_xy: 200
      tolerance_z: 200
  - assert: {map_transition_requested: {source_kind: mm9_exit_trigger, source_id: 988}}
  - load_map: {map: anskramkeep.blv}
  - note: {text: "DoubleDoor15 (leaves 21, 22; event 107) closes the entrance vestibule; its leaves swing as in MM9 (rotating movers)."}
  - assert: {mechanism: {id: 21, state: closed}}
  - movement_segment:
      input: forward
      seconds: 1.5
      actor_collision: false
      actor_ai: false
      start: {map: anskramkeep.blv, x: 0, y: 102, z: -491, yaw_degrees: 90, pitch: 0}
      expect_stop: {map: anskramkeep.blv, x: 0, y: 420, z: -491, yaw_degrees: 90, pitch: 0}
      loose_tolerance: true
      tolerance_xy: 60
      tolerance_z: 16
  - execute_event: {id: 107}
  - advance_runtime: {seconds: 3}
  - assert: {mechanism: {id: 21, state: open}}
  - movement_segment:
      input: forward
      seconds: 1.5
      actor_collision: false
      actor_ai: false
      start: {map: anskramkeep.blv, x: 0, y: 102, z: -491, yaw_degrees: 90, pitch: 0}
      expect_stop: {map: anskramkeep.blv, x: 0, y: 1254, z: -491, yaw_degrees: 90, pitch: 0}
      loose_tolerance: true
      tolerance_xy: 60
      tolerance_z: 16
  - movement_segment:
      input: forward
      seconds: 2.0
      actor_collision: false
      actor_ai: false
      start: {map: anskramkeep.blv, x: 0, y: 15500, z: -491, yaw_degrees: 90, pitch: 0}
      expect_stop: {map: anskramkeep.blv, x: 0, y: 15958, z: -491, yaw_degrees: 90, pitch: 0}
      loose_tolerance: true
      tolerance_xy: 60
      tolerance_z: 16
  - note: {text: "Abandonedfortexit (DAT object 987), the north door to Sturmford."}
  - assert: {map_transition_requested: {source_kind: mm9_exit_trigger, source_id: 987}}
