schema: openyamm.effectLibrary.v1
effects:
- id: hesper:fx/d13_steam
  display_name: Deepwell steam vent
  duration_seconds: 2
  compatibility_profile: predictable
  components:
  - id: 1
    type: sprite_system
    start_seconds: 0
    end_seconds: 1.3
    sprite_resource: openyamm:effect-sprite/smoke
    blend: alpha
    particle_space: world
    offset:
    - 0
    - 0
    - 24
    color_keys:
    - time: 0
      rgb:
      - 235
      - 245
      - 255
      transparency: 255
    - time: 0.15
      rgb:
      - 235
      - 245
      - 255
      transparency: 65
    - time: 1
      rgb:
      - 210
      - 230
      - 255
      transparency: 255
    scale_keys:
    - time: 0
      value: 0.6
    - time: 1
      value: 1.8
    motion_keys: []
    particle_lifetime_seconds: 0.7
    emission_shape: plane
    radius: 90
    velocity: 550
    plane_direction:
    - 0
    - 0
    - 1
    sprites_per_emission: 4
    emission_interval_seconds: 0.06
- id: hesper:fx/d13_dust
  display_name: Deepwell falling dust
  duration_seconds: 2
  compatibility_profile: predictable
  components:
  - id: 1
    type: sprite_system
    start_seconds: 0
    end_seconds: 1.3
    sprite_resource: openyamm:effect-sprite/smoke
    blend: alpha
    particle_space: world
    offset:
    - 0
    - 0
    - 24
    color_keys:
    - time: 0
      rgb:
      - 195
      - 180
      - 155
      transparency: 255
    - time: 0.15
      rgb:
      - 195
      - 180
      - 155
      transparency: 65
    - time: 1
      rgb:
      - 195
      - 180
      - 155
      transparency: 255
    scale_keys:
    - time: 0
      value: 0.6
    - time: 1
      value: 1.8
    motion_keys: []
    particle_lifetime_seconds: 0.7
    emission_shape: plane
    radius: 250
    velocity: 120
    plane_direction:
    - 0
    - 0
    - -1
    sprites_per_emission: 4
    emission_interval_seconds: 0.06
