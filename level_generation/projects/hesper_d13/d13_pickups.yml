# Click every placed pickup. Shared reward/refill rules: hesper_pickups_test/pickups.yml.
id: hesper.d13.pickups
world: hesper
mode: faithful
steps:
- new_game_flow:
    start_map: hes_d13.blv
    party:
      food: 200
      members:
