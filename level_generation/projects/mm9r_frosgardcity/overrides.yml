  DestructableBrush17: {group: Ice17, motion: slide, move_lt: [0, -382, 0], speed: 256}
  DestructableBrush18: {group: Ice18, motion: slide, move_lt: [0, -382, 0], speed: 256}
  DestructableBrush19: {group: Ice19, motion: slide, move_lt: [0, -374, 0], speed: 256}
