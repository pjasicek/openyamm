textures:
  'textures\skybox\skymarker.dtx': {alias: sky04, width: 512, height: 512}   # the sky shell: IndoorSky faces (scene override)
  # greenscreen: 10 solid polygons (two small boxes on the western mountain, MM9's renderer zones); dropped in convert.py
  'textures\leveltextures\misc\greenscreen.dtx': {alias: sky04, width: 512, height: 512}
# MM9's window panes (the magic shop's: Invisible boxes with one translucent pane, flag 0x8; convert.py keeps glass to
# translucent faces: frosgardwindow2 also paints 12 opaque facade windows)
glass:
  frosgardwindow2.dtx: {opacity: 1.0, tint: [1.0, 1.0, 1.0], two_sided: true}
# The city settings (../mm9r_common/city): no street structure here (convert.py FrosgardCity.extra_portals: the town
# has no wall and no corridor streets; the open air is one room), the sky and the half steps.
city:
  weather: snow                    # the outdoor weather over the open sky (MM9's Snow brushes fill its streets; city.hooks.apply_weather)
  merged_top_portals: true          # no roof line here (one open-air room): no effect; set as in every city
  daylight: true                     # sun and sky light on the sectors open to the sky (CITY_PLAYBOOK "Daylight and fog")
  sky_texture: plansky3              # the old import's sky: legacy_plansky3 preset
  half_steps: true                   # invisible half steps onto standable raised floors 50-66 high (CITY_PLAYBOOK "Raised floors")
# The cinematics' camera gate (mm9r_common/camera_gate.py): cameras checked by eye that it cannot pass.
cinematics_gate:
  "break_ice shot 4": "Camera2 hangs high over the harbour at the map's edge (two level rays leave the map); its view looks inward over the floes (captures_break_ice/05-camera2-waves.png)"
