# Explicit conversion choices for MM9's Frosgard City (convert.py reads this through the shared converter
# ../mm9r_common/dungeon and the city module ../mm9r_common/city; a rerun keeps them). Rules and keys:
# ../mm9r_common/DUNGEON_PLAYBOOK.md and ../mm9r_common/CITY_PLAYBOOK.md.
map:
  fog: lithtech                      # MM9's own fog model and its WeatherMan night fog (CITY_PLAYBOOK "Daylight and fog")
  sky_fog: true                      # the open sky in the fog colour where MM9's fog covers its sky box (INDOOR_FOG.md)
  bright_scale_lights: true          # BLV light colour x MM9's BrightScale, as its lightmaps (CITY_PLAYBOOK "Street lights")
  stem: frosgardcity
  display_name: Frosgard City
  # start index = the old map's: 0 FallingStart (thrown out of Yanmir's Fort: MM9 drops the party from 2 560 LT into
  # the harbour; here on the surface under it), 1 the north gate (from the Frosgard wilderness), 2 the docks,
  # 3 Town Portal
  starts: [FallingStart, FrosgardCityStart, StartPoint0, TownPortal]
  monster_classes: [TownElfMaleA, TownElfFemaleA, ShopkeeperHuman2FemaleA, ShopkeeperHuman2MaleB, ShopkeeperElfMaleB,
                    CommonerHumanMaleB, TownElfMaleB, TownHuman2FemaleB, TownHuman2MaleA, ShopkeeperElfMaleA,
                    TownHumanMaleA, CommonerHumanMaleA, TownHuman2MaleB, CommonerHuman2MaleA, TownElfFemaleB,
                    CommonerHuman2MaleB, ForadDarre, TamurLeng, TryggvaRavenlocks]
  painted_minimap: true               # MM9's painted city map (catalog entry kept); no outline pass (CITY_PLAYBOOK.md)
  offset: [0, 0, 0]                   # the old map's frame; geometry past the int16 frame is clipped (convert.py)
  ambient: 20
  model_lighting: false
  split_minor_rooms: true
  split_retry: true
  thin_walls: true
# FallingStart hangs 2 560 LT over the harbour, outside the voxel box (convert.py NEAR_BOX): its column is seeded on
# the ice below instead
seed_exclude: [FallingStart]
seeds:
  - [-4544, -100, -3840]             # under FallingStart, over the ocean surface
# Light0: MM9's white fill over the whole bay (LightRadius 15 000 LT = 38 400 native at 2 752 LT over the harbour, a
# stand-in sun); a BLV light's radius is 16-bit, and the open sky's daylight is the sky pass's job (README)
skip_lights: [Light0]
plan_levels:
  harbour: [-200, 40]
  street: [-20, 140]
  upper: [140, 700]
model_patterns:
  Snow: skip                          # weather volumes (greenscreen boxes): MM9's snowfall, no geometry
  WorldObject: static                 # hanging chains (ChainLink in invisible boxes), ice slabs
  Carpet: static                      # carpets (CarpetOld03, AmazingTrim1b)
models:
  SkyBox0: skip                       # DemoSkyWorldModel: MM9's sky box (SnowMtns_*), drawn by the sky, not geometry
  TOD_Sky0: skip                      # TOD_Sky: the night starfield shell
  BlueWater0: skip                    # the harbour's water volume (Visible 0, ShowSurface 0): the Ocean brush is its top
  Ocean: static                       # the harbour's surface (Ocean4.spr, Alpha 0.8, non-solid): swum over its bed (convert.py)
  Terrain0: static                    # the mountains and shore round the town (4 133 polygons)
  ToothTerrain: static                # the ice tooth in the harbour's south-west
  InvisibleBrush0: static             # the invisible wall behind the north exit
  InvisibleBrush1: static             # the harbour's fence (Firethrough): the party stays on the ice and the docks
  DestructableBrush12: static         # the magic shop's two window panes (frosgardwindow2, translucent): glass
  DestructableBrush13: static
  Bankwindow: static                  # a Door with no MoveDir (a 16 x 8 LT grille over the bank's hatch): never moves
  # --- the harbour's ice floes (DestructableBrush, frosgardice 16 LT thick at -136): BreakIce.scr breaks them (the
  # dockmaster's cannon); here each sinks to rest on what lies under it (citylua.py), one mover each: the harbour's
  # bed (PhysicsBSP at -528 LT, Terrain0's slopes) or, for 27, 34 and 35, the sunken frosgardwood crib (top -192);
  # move_lt = the highest floor under the floe's footprint (9 x 9 samples) + 2 - its bottom (-144), rounded up
  DestructableBrush6: {group: Ice6, motion: slide, move_lt: [0, -377, 0], speed: 256}
  DestructableBrush7: {group: Ice7, motion: slide, move_lt: [0, -377, 0], speed: 256}
  DestructableBrush8: {group: Ice8, motion: slide, move_lt: [0, -378, 0], speed: 256}
  DestructableBrush9: {group: Ice9, motion: slide, move_lt: [0, -382, 0], speed: 256}
  DestructableBrush14: {group: Ice14, motion: slide, move_lt: [0, -382, 0], speed: 256}
  DestructableBrush15: {group: Ice15, motion: slide, move_lt: [0, -382, 0], speed: 256}
