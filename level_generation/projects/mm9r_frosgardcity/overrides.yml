  # --- doors (work/draft_rules.py, edited): every swing door is a doorway
  Trainingdoor: {group: Trainingdoor, motion: rotate, doorway: true, portal: Trainingportal}
  Taverndoor: {group: Taverndoor, motion: rotate, doorway: true, portal: Tavernportal}
  Apothdoor: {group: Apothdoor, motion: rotate, doorway: true, portal: Apothportal}
  WAdoorL: {group: WAdoorL, motion: rotate, doorway: true, portal: WAportal}
  WAdoorR: {group: WAdoorL, motion: rotate, doorway: true, portal: WAportal}
  TownhallR: {group: TownhallL, motion: rotate, doorway: true, portal: Townhallportal}
  TownhallL: {group: TownhallL, motion: rotate, doorway: true, portal: Townhallportal}
  RDoor0: {group: RDoor0, motion: rotate, doorway: true, portal: RDoor0portal}
  Door7: {group: Door7, motion: rotate, doorway: true, portal: Door7portal}
  Door13: {group: Door13, motion: rotate, doorway: true, portal: Door13portal}
  TempledoorL: {group: TempledoorL, motion: rotate, doorway: true, portal: Templeportal}
  TempledoorR: {group: TempledoorL, motion: rotate, doorway: true, portal: Templeportal}
  Magidoor: {group: Magidoor, motion: rotate, doorway: true}   # a single leaf in a wall opening: its leaves' rectangle is the doorway portal
  # The bank's counter hatch (Door, MoveDir -x, MoveDist 14, Sticky; its OpenTrigger sends the banker "bank", which
  # opens his dialogue 206): a click opens it and the banker's dialogue (citylua.py)
  Bankdoor: {group: Bankdoor, motion: dat}
  Door0: {group: Door0, motion: dat, move_dist_lt: 2}   # locked, MoveDist 0: a facade door that never opens (click: locked)
  Door1: {group: Door1, motion: dat, move_dist_lt: 2}   # locked, MoveDist 0: a facade door that never opens (click: locked)
  Door2: {group: Door2, motion: dat, move_dist_lt: 2}   # locked, MoveDist 0: a facade door that never opens (click: locked)
