# Doorways that lead nowhere (the gates out of the city, a locked sewer door, a back door into the same room): no portal
skip_user_portals: [Towngateportal2, Sewerportal2, SewerP1, SewerP5]
# Air under the sewer hatches and the grate (the exit volumes to Beethoven stand in the shafts; nothing else seeds them)
seeds:
  - [420, 7600, 20]       # ExitS, under the hatch SewerP1
  - [-2170, 7600, 4932]   # ExitW, under the hatch SewerP5
  - [2152, 7424, 664]     # GrateExit, the shaft under BeetHovengrate
# MM9's dock exit volume floats 21 LT over the dock's planks: reach it down to them (the party's centre is tested)
exits:
  ExitDock: {bottom_lt: 7690}
# The well's rope (Ladder7, ChainLink WorldObject35 at z 6512): the way out of the well (the treasure bags lie at its bottom)
ladders:
  Ladder7: {facing_lt: [0, 1], surface_lt: 6496, top_exit_lt: [2225, 7730, 6640]}
# The sewer shafts' ladders (rungs WorldObject5/7/8/20/9; measured 2026-11-05): Ladder4/6 up to the landings, Ladder2/5
# up to the hatches (ExitS / ExitW fire on the way), Ladder3 up the shaft to Beethoven's grate (GrateExit on the way).
  Ladder2: {facing_lt: [-1, 0], surface_lt: 398, top_exit_lt: [480, 7700, 20]}
  Ladder4: {facing_lt: [-1, 0], surface_lt: 398, top_exit_lt: [420, 7380, -150]}
  Ladder5: {facing_lt: [-1, 0], surface_lt: -2190, top_exit_lt: [-2120, 7708, 4932]}
  Ladder6: {facing_lt: [-1, 0], surface_lt: -2190, top_exit_lt: [-2168, 7380, 4770]}
  Ladder3: {facing_lt: [1, 0], surface_lt: 2170, top_exit_lt: [2100, 7716, 660]}
textures:
  'textures\skybox\skymarker.dtx': {alias: sky04, width: 512, height: 512}   # the sky shell: IndoorSky faces (scene override)
  'textures\leveltextures\misc\soundonly.dtx': {alias: INVIZVJN7N, width: 32, height: 32}   # sound-only brushes: invisible collision
# MM9's window panes (DestructableBrush windows, the tavern's iron window): translucent faces, portals between rooms,
# where MM9's surface has the Translucent flag (dungeon/rooms.py Glass; the user, 2026-11-07); these entries only
# tune those faces, a window without the flag is opaque.
glass:
  window_frame_trans.dtx: {opacity: 1.0, tint: [1.0, 1.0, 1.0], two_sided: true}
  windowlead1.dtx: {opacity: 1.0, tint: [1.0, 1.0, 1.0], two_sided: true}
  sturmwindow.dtx: {opacity: 1.0, tint: [1.0, 1.0, 1.0], two_sided: true}
  iron_window_03.dtx: {opacity: 1.0, tint: [1.0, 1.0, 1.0], two_sided: true}
  iron_window.dtx: {opacity: 1.0, tint: [1.0, 1.0, 1.0], two_sided: true}
  windowrose.dtx: {opacity: 1.0, tint: [1.0, 1.0, 1.0], two_sided: true}
  windowknight.dtx: {opacity: 1.0, tint: [1.0, 1.0, 1.0], two_sided: true}
# The city's open air (../mm9r_common/city/structure.py): street air under the roof line, the air over the roofs one
# room per district, street cuts found automatically.
city:
  weather: rain                    # the outdoor weather over the open sky (the user's decision 2026-11-06; city.hooks.apply_weather)
  merged_top_portals: true          # few large convex top portals over walls and roofs (CITY_PLAYBOOK "The open air" step 3)
  daylight: true                     # sun and sky light on the sectors open to the sky (CITY_PLAYBOOK "Daylight and fog")
  street_top_lt: 7968                # 256 LT over the streets (7712): under the lowest eaves along them
  extra_cuts:                        # by hand where the automatic search found no plain corridor
    - {axis: z, point: [2400, 7800, 1000]}   # the lane from the docks up to the palace ring
    - {axis: z, point: [3300, 7800, 2700]}   # the palace ring's east side
  sky_preset: cloudy                 # the outdoor maps' high-definition sky (was sky_texture plansky3, the old import's)
  outdoor_view: true                 # view distance and haze as an outdoor map's, not MM9's grey fog (INDOOR_OPEN_SKY.md)
  view_distance_scale: 0.5           # 8 096 units at the default view distance setting (16 192), the user's choice
  half_steps: true                   # invisible half steps up standable 50-66 rises: one here (CITY_PLAYBOOK "Raised floors")
