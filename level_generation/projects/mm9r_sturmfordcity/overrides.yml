# Explicit conversion choices for MM9's Sturmford City (convert.py reads this through the shared converter
# ../mm9r_common/dungeon and the city module ../mm9r_common/city; a rerun keeps them). Rules and keys:
# ../mm9r_common/DUNGEON_PLAYBOOK.md and ../mm9r_common/CITY_PLAYBOOK.md.
map:
  fog: lithtech                      # MM9's own fog model and its WeatherMan night fog (CITY_PLAYBOOK "Daylight and fog")
  bright_scale_lights: true          # BLV light colour x MM9's BrightScale, as its lightmaps (CITY_PLAYBOOK "Street lights")
  stem: sturmfordcity
  display_name: Sturmford City
  # start index = the old map's: 0 docks, 1-3 sewers, 4 the north gate (from the Sturmford wilderness), 5 Town Portal
  starts: [SturmfordDocks, SewerS, SewerW, SewerE, Sturmford, TownPortal]
  monster_classes: [CommonerElfFemaleA, CommonerHumanMaleA, CommonerElfMaleA, CommonerHumanFemaleA, CommonerHuman2MaleA,
                    CommonerChildHumanChildA, CommonerChildElfChildA, ShopkeeperHuman2MaleA, Dog, Cat,
                    CommonerElfFemaleB, ShopkeeperElfFemaleA, CommonerHalfOrcMaleA, ShopkeeperHuman2MaleB,
                    CommonerHalfOrcFemaleA, CommonerChildHuman2ChildA, PrisonerHumanMaleA, ShopKeeperDwarfFemaleB,
                    ShopkeeperElfMaleA, CommonerDwarfFemaleA, CommonerDwarfMaleB, PoorTownGuard1]
  # RUDEProps (talking props in a pose: the innkeeper, Ludwig, Bjarni...) are actors looping their MM9 pose on the HD
  # townsfolk bodies (props.json kind npc, ../mm9r_common/rude_props.py, citylua.py)
  painted_minimap: true               # MM9's painted city map (catalog entry kept); no outline pass (CITY_PLAYBOOK.md)
  offset: [0, 0, 0]                   # the old map's frame (x -5 773..16 294, y -1 541..20 145, z 17 746..21 873): fits int16
  ambient: 20
  model_lighting: false
  split_minor_rooms: true
  split_retry: true
  thin_walls: true
  corner_samples: true               # face votes sample over each polygon's corners: the magic shop's ceiling (M11)
plan_levels:
  sewers: [6900, 7700]
  street: [7700, 8000]
  upper: [8000, 8560]
models:
  SkyBox0: skip                       # DemoSkyWorldModel: MM9's sky box (SnowMtns_*), drawn by the sky, not geometry
  TOD_Sky0: skip                      # TOD_Sky: the night starfield shell
  Wellwater: skip                     # BlueWater volume in the well shaft: its top face is added by convert.py
  Tavernzone: skip                    # PortalZone (greenscreen): MM9's renderer zone that opens Tavernportal
