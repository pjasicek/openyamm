# Sturmford City's barks (citylua.py, TryggvaSpeech.scr / ErccSpeech.scr): Trigger1 and Trigger2 fire once each;
# Tryggva says one of his four lines, Ercc gives key 113 and rants (ercc01, then ercc02).
id: mm9r.sturmfordcity_barks
title: 'Sturmford City (native BLV): Tryggva''s and Ercc''s barks'
world: mm9
mode: faithful
tags:
- mm9
- mm9_rework
steps:
- load_map:
    map: sturmfordcity.blv
- set_pose: {map: sturmfordcity.blv, x: -327, y: -909, z: 19900, yaw: 0.0, pitch: 0.0}
- advance_runtime: {seconds: 2.5}
- assert:
    state_dump_named_map_var: {name: BarkedTrigger1, value: 1}
- assert:
    qbit_clear: [90113]
- set_pose: {map: sturmfordcity.blv, x: -205, y: 95, z: 19900, yaw: 0.0, pitch: 0.0}
- advance_runtime: {seconds: 2.5}
- assert:
    state_dump_named_map_var: {name: BarkedTrigger2, value: 1}
- assert:
    qbit_set: [90113]
# Ercc passes out once his ercc01 rant (66 s, ercc01a-c) is over: ercc02 then.
- advance_runtime: {seconds: 60.0}
- assert:
    state_dump_named_map_var: {name: ErccDue, value: 1}
- advance_runtime: {seconds: 7.0}
- assert:
    state_dump_named_map_var: {name: ErccDue, value: 0}
