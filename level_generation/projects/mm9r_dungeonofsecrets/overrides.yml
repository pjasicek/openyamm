# Explicit conversion choices for MM9's Dungeon of Secrets (convert.py reads this through the shared converter
# ../mm9r_common/dungeon; a rerun keeps them). Rules and keys: ../mm9r_common/DUNGEON_PLAYBOOK.md.
map:
  stem: dungeonofsecrets
  display_name: Dungeon of Secrets
  starts: [StartPoint0]                # the only start: the arrival from Frosgard (MovePlayerToFloor)
  monster_classes: [CommonerHuman2MaleA]   # CHADWICK, Chadwick Boorsley (NPC417.scr, RUDE 417): the trial's warden
  offset: [0, 0, 0]                    # the old map's frame
  ambient: 30
  split_minor_rooms: true
  thin_walls: true
  # model_lighting: off. Compared on six prop views (review/props_compare.jpg): with it the plate room's sconces draw black (MM9 lit them with the capped red fills, which model lighting never sees: Klusos House lesson); the old path draws them red like their walls. Torches read alike either way.
models:
  # --- the nine sections' end doors (RotatingDoor, PushOpen, CloseWaitTime 4): their OpenTrigger swings the axe
  #     trap unless the section's timer lever still holds it locked
  axe door 01: {group: axe_door_01, motion: rotate, doorway: true}
  axe door 02: {group: axe_door_02, motion: rotate, doorway: true}
  axe door 03: {group: axe_door_03, motion: rotate, doorway: true}
  axe door 04: {group: axe_door_04, motion: rotate, doorway: true}
  axe door 05: {group: axe_door_05, motion: rotate, doorway: true}
  axe door 06: {group: axe_door_06, motion: rotate, doorway: true}
  axe door 08: {group: axe_door_08, motion: rotate, doorway: true}
  axe door 09: {group: axe_door_09, motion: rotate, doorway: true}
  axe door 10: {group: axe_door_10, motion: rotate, doorway: true}
  # --- the axe traps (RotatingDoor 180 deg at 650/s, non-solid blades; MM9 swings them through the doorway)
  axe trap 01: {group: axe_trap_01, motion: rotate, click: false, bodies: push}
  axe trap 02: {group: axe_trap_02, motion: rotate, click: false, bodies: push}
  axe trap 03: {group: axe_trap_03, motion: rotate, click: false, bodies: push}
  axe trap 04: {group: axe_trap_04, motion: rotate, click: false, bodies: push}
  axe trap 05: {group: axe_trap_05, motion: rotate, click: false, bodies: push}
  axe trap 06: {group: axe_trap_06, motion: rotate, click: false, bodies: push}
  axe trap 08: {group: axe_trap_08, motion: rotate, click: false, bodies: push}
  axe trap 09: {group: axe_trap_09, motion: rotate, click: false, bodies: push}
  axe trap 10: {group: axe_trap_10, motion: rotate, click: false, bodies: push}
  # --- the timer levers (Door 18 LT, PushOpen; closing at 2-9 LT/s is the section's clock)
  timer lever 01: {group: timer_lever_01, motion: dat}
  timer lever 02: {group: timer_lever_02, motion: dat}
  timer lever 03: {group: timer_lever_03, motion: dat}
  timer lever 03a: {group: timer_lever_03a, motion: dat}
  timer lever 04: {group: timer_lever_04, motion: dat}
  timer lever 05: {group: timer_lever_05, motion: dat}
  timer lever 06: {group: timer_lever_06, motion: dat}
  timer lever 08: {group: timer_lever_08, motion: dat}
  timer lever 09: {group: timer_lever_09, motion: dat}
  timer lever 10: {group: timer_lever_10, motion: dat}
