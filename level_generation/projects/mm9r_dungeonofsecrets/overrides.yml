textures:
  "water:pool": {alias: WATEZWECUN, width: 128, height: 128}   # ClearWater0's surface: Water115.spr, SurfaceAlpha 0.3
  # 3 PhysicsBSP faces carry MM9's skymarker (sky through an opening): drawn with MM9's Clouds1 sky (CLOUVKSJD0), as the
  # Training Hall does; WorldObject0's own face already uses Clouds1.
  'textures\skybox\skymarker.dtx': {alias: CLOUVKSJD0, width: 256, height: 256}
# Seeds: relay triggers MM9 parks outside the walls (only messages reach them), the BUS trigger and its timer in the
# sealed pocket under the stairs, and CHADWICK, whose origin stands a voxel into the floor (a 29-voxel pocket).
