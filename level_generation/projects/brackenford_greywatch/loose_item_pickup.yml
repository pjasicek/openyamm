    start_map: lg01.odm
- set_pose:
    map: lg01.odm
    x: 21344
    y: 3200
    z: 1098
    yaw: 1.5707963267948966
    pitch: -0.78
- assert:
    world_item_state:
      item_id: 5
      present: true
- press_interact: {}
- assert:
    inventory_any_member:
    - item_id: 5
- assert:
    world_item_state:
