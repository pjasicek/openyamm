# Walkability pass (2026-10-24): a Drudge Brute spawned where the old geometry stopped monsters reaches the party at
# each spot of the user's D8 play (review/user_play_20261024 in hesper_stage): a smelting-floor bridge (user_65), the
# middle belt's top (user_66), the Forgemaster's Hall's raised west edge (user_67) and, with the jam cleared, the main
# belt's mouth over the lowered crates (user_68-70). Monsters melee from an edge distance of 307
# (IndoorWorldRuntime.cpp ActorMeleeRange), about 400 between centres, so each spot sets the party where a monster
# gets that close only by crossing the fixed geometry. The map's own 72 actors keep indices 0-71 (pack order in
# author_d08_blender.py); each fight restarts and first clears the packs around its spot.
# Each defender takes two energy hits: the first only breaks its energy shield (overflow is lost), the second
# (skip_dead) kills it, so no surviving defender charges or blocks the party during a pursuit.
id: hesper.d08.walkability
world: hesper
mode: faithful
steps:
- &start
  new_game_flow:
    start_map: hes_d08.blv
    party:
      members:
      - {name: Foundry tester, class: Knight, level: 1000, equipment: {}, skills: [{name: Sword, level: 1, mastery: 1}]}
# user_65: the bridges are flush with the floor; a Drudge north of channel C2 walks onto the bridge to the party at
# its south end.
- damage_actor: {actor_index: 8, amount: 1000000, tier: kreegan_energy}
- damage_actor: {actor_index: 8, amount: 1000000, tier: kreegan_energy, skip_dead: true}
