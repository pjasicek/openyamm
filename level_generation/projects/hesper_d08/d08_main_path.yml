    duration_ms: 1180
    delta_game_minutes: 0
    start: {map: hes_d08.blv, x: 3400, y: 1900, z: 0, yaw: 1.5707963, pitch: 0}
    expect_stop: {map: hes_d08.blv, x: 3400, y: 2800, z: 0, yaw: 1.5707963, pitch: 0}
    loose_tolerance: true
    tolerance_xy: 150
    tolerance_z: 40
    actor_collision: false
    actor_ai: false
- movement_segment:
