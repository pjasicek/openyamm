# Written by make_scenarios.py from the built map; rerun it after convert.py.
id: mm9r.1000terrors_finale
title: Thousand Terrors (native BLV) - the end demon's death opens Door0/Door1; the party walks through to the win switch
  and leaves for the Hall of the Gods
world: mm9
mode: faithful
tags:
- mm9
- mm9_rework
- draft
steps:
- load_map:
    map: 1000terrors.blv
- console:
    line: qbit set 90108
- console:
    line: qbit set 90497
- note:
    text: 'Door0/Door1 shut: a walk north through the gate stops at it.'
- assert:
    mechanism:
      id: 3
      state: closed
- assert:
    mechanism:
      id: 4
      state: closed
- movement_segment:
    input: forward
    seconds: 1.5
    actor_collision: false
    actor_ai: false
    start:
      map: 1000terrors.blv
      x: 8294
      y: -9681
      z: 2807
      yaw_degrees: 90
      pitch: 0
    expect_stop:
      map: 1000terrors.blv
      x: 8294
      y: -9477
      z: 2807
      yaw_degrees: 90
      pitch: 0
    loose_tolerance: true
    tolerance_xy: 80
    tolerance_z: 60
- note:
    text: The three counted deaths ([68, 69, 70]) bring the end demon (actor 210).
- damage_actor:
    actor_index: 68
    amount: 100000
- advance_runtime:
    seconds: 1.0
- damage_actor:
    actor_index: 69
    amount: 100000
- advance_runtime:
    seconds: 1.0
- damage_actor:
    actor_index: 70
    amount: 100000
- advance_runtime:
    seconds: 1.0
- assert:
    state_dump_named_map_var:
      name: EndCount
      value: 3
- assert:
    state_dump_named_map_var:
      name: EndDemon210
      value: 1
- assert:
    mechanism:
      id: 3
      state: closed
- damage_actor:
    actor_index: 210
    amount: 1000000
- advance_runtime:
    seconds: 1.0
- assert:
    state_dump_named_map_var:
      name: EndDemonDead
      value: 1
- advance_runtime:
    seconds: 4.0
- assert:
    mechanism:
      id: 3
      state: open
- assert:
    mechanism:
      id: 4
      state: open
- note:
    text: The party walks through the open gate to the switch's side of the wall.
- movement_segment:
    input: forward
    seconds: 0.62
    actor_collision: false
    actor_ai: false
    start:
      map: 1000terrors.blv
      x: 8294
      y: -9681
      z: 2807
      yaw_degrees: 90
      pitch: 0
    expect_stop:
      map: 1000terrors.blv
      x: 8294
      y: -9201
      z: 2807
      yaw_degrees: 90
      pitch: 0
    loose_tolerance: true
    tolerance_xy: 120
    tolerance_z: 60
- set_pose:
    map: 1000terrors.blv
    x: 8928
    y: -9258
    z: 2776
    yaw: -1.5708
    pitch: -0.4896
- advance_runtime:
    seconds: 0.2
- press_interact: {}
- advance_runtime:
    seconds: 0.5
- console:
    line: cinematic list
    expect_contains: playing njam_freeze_win
- advance_runtime:
    seconds: 37
    follow_map_move: true
- assert:
    qbit_set:
    - 90109
- assert:
    map_arrived:
      map: hallofthegods.blv
