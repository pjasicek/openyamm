# Explicit conversion choices for MM9's Thousand Terrors (convert.py reads this through the shared converter
# ../mm9r_common/dungeon; a rerun keeps them). Rules and keys: ../mm9r_common/DUNGEON_PLAYBOOK.md.
map:
  stem: 1000terrors
  display_name: Thousand Terrors
  starts: [StartPoint0]               # start 0: by the Arslegard exit (ArslegardCity ExitTrigger1 arrives here)
  monster_classes: [DesertTerror, LesserDemon, Oculus, Orbus, ReptilianTerror, Eye, SeaMonsterMale, GreaterDemon,
                    AmphibiousTerror, FlyingIcky, NjamtheMeddler]
  offset: [0, 0, 0]                   # the old map's frame fits int16
  ambient: 31                         # sector minimum light 31: no frame ambient is subtracted from the decorations' light
  model_lighting: {light_scale: 1.2}  # MM9's model lighting for props and actors (brief "Prop lighting"): the old path drew
                                      # the skull head black (review/ml_new_compare.jpg); BLV lights carry colour x
                                      # BrightScale (0.75-0.9 on the blue lights), so light_scale about 1/0.85
  split_minor_rooms: true
  thin_walls: true
  # Forced arrivals (pack growth, ../mm9r_common/dungeon/density.py): where the party is put down keeps MM9's monsters
  # plus at most `copies` grown ones within `radius` (height counted double), so a party is not set down among a grown
  # pack (user, 2026-11-09). The map has no teleporters: the walk-in from Arslegard City (StartPoint0) and the drop
  # through the trap doors into the water pit (Rotating Lever 17; the doors' boxes span x 937-1920, y -12396..-11412).
  density_arrivals:
  - {name: StartPoint0, at: [5202, -16630, -142], radius: 2400, copies: 2}
  - {name: TrapDoorPit, at: [1428, -11904, -2946], radius: 2400, copies: 1}
