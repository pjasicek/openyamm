# chess_capture_2 skipped at once: the hit stays (it is the poll's), the cinematic ends.
id: mm9r.1000terrors.cinematic_chess_capture_skip
world: mm9
mode: faithful
steps:
- new_game_flow: {start_map: 1000terrors.blv}
- set_pose: {map: 1000terrors.blv, x: 8312, y: -15122, z: -2740, yaw: 3.1416, pitch: 0.0}
- advance_runtime: {seconds: 0.6}
- console: {line: cinematic list, expect_contains: playing chess_capture_2}
- console: {line: cinematic skip, expect_contains: Skipping}
- advance_runtime: {seconds: 0.5}
- assert: {state_dump_named_map_var: {name: ChessHits, value: 1}}
