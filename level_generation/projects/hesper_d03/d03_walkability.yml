world: hesper
mode: faithful
steps:
- &start
  new_game_flow:
    start_map: hes_d03.blv
    party:
      members:
      - {name: Quarry tester, class: Knight, level: 1000, equipment: {}, skills: [{name: Sword, level: 1, mastery: 1}]}
