# Walkability pass (2026-10-24): at the spots of the user's D3 play (review/user_play_20261024 in hesper_stage) a
# Drudge reaches the party: out of the crusher's throat, now one 32 step deep (user_71), and past the Lower Storage's
# ore bins (user_72, which replaced three plain blocks). The original 59 actors keep indices 0-58, with eight R5 Ashkites appended;
# spawned Drudges use the runtime's last-actor selector; each fight restarts and first clears the Lower Workings' packs nearby. Monsters melee from
# about 400 between centres (ActorMeleeRange 307 plus the radii): the throat's nearest edge is 461 from the party.
