# The hard rock's tenth block frees Ebora (tm_hardrock.scr "10 36 5000" -> EboraMines.scr :FreeAtLast): the cinematic
# ebora_free (thjoradmine.cinematics.yml) plays; no save while it plays; the column of fire at 10 s (EboraFree 3), she
# is removed at 13 s (EboraFree 4, hidden). See README "Cinematics".
id: mm9r.thjoradmine.cinematic_ebora_free_play
world: mm9
mode: faithful
steps:
- new_game_flow: {start_map: thjoradmine.blv}
- set_pose: {map: thjoradmine.blv, x: 24467, y: -1326, z: -1390, yaw: 3.1416, pitch: 0.0}
- console: {line: cinematic list, expect_contains: ebora_free}
- assert: {actor_visible: {actor_index: 46, hidden: false}}
- note: {text: "ten blocks of hard rock (db12-db21, events 90-99) broken"}
- execute_event: {id: 90}
- execute_event: {id: 91}
- execute_event: {id: 92}
- execute_event: {id: 93}
- execute_event: {id: 94}
- execute_event: {id: 95}
- execute_event: {id: 96}
- execute_event: {id: 97}
- execute_event: {id: 98}
- execute_event: {id: 99}
- assert: {qbit_set: [90036]}
- advance_runtime: {seconds: 0.5}
- console: {line: cinematic list, expect_contains: playing ebora_free}
- assert: {state_dump_named_map_var: {name: EboraFree, value: 1}}
- save_game: {name: mid_cinematic, expect_failure: true}
- advance_runtime: {seconds: 9.0}
- note: {text: "9.5 s: before SpellDone"}
- assert: {state_dump_named_map_var: {name: EboraFree, value: 1}}
- assert: {actor_visible: {actor_index: 46, hidden: false}}
- advance_runtime: {seconds: 1.0}
- note: {text: "10.5 s: SpellDone, the column of fire"}
- assert: {state_dump_named_map_var: {name: EboraFree, value: 3}}
- console: {line: cinematic list, expect_contains: playing ebora_free}
- advance_runtime: {seconds: 3.0}
- note: {text: "13.5 s: EboraDone, she is removed and the cinematic ended"}
- assert: {state_dump_named_map_var: {name: EboraFree, value: 4}}
- assert: {actor_visible: {actor_index: 46, hidden: true}}
- console: {line: cinematic list, expect_contains: "ebora_free (13 s)"}
- save_game: {name: after_cinematic}
