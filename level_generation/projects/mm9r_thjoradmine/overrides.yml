# Explicit conversion choices for MM9's Thjorad Mine (convert.py reads this through the shared converter
# ../mm9r_common/dungeon; a rerun keeps them). Rules and keys: ../mm9r_common/DUNGEON_PLAYBOOK.md.
map:
  stem: thjoradmine
  display_name: Thjorad Mine
  starts: [StartPoint0]               # the mine's entrance from Thjorgard (ThjoradMineExit)
  monster_classes: [Troglodyte, TroglodyteGnoll, TroglodyteWren, SuccEbora, Cat, CommonerDwarfMaleA,
                    CommonerDwarfMaleB, PrisonerDwarfMaleA, TownDwarfMaleA]
  offset: [0, 0, 0]                   # the old map's frame: x -13 760..31 290, y -19 330..9 260, z -3 600..2 290 fit int16
  ambient: 20
  model_lighting: true                # MM9 model lighting for decorations and actors (devdocs/INDOOR_MODEL_LIGHTING.md)
  split_minor_rooms: true
  split_retry: true
  thin_walls: true
plan_levels:
  deep: [-1200, -600]
  mine: [-600, -250]
  upper: [-250, 150]
  top: [150, 1000]
models:
  # --- the entrance door (locked in MM9: the exit volume stands in front of it)
  Door2: {group: Door2, motion: rotate}   # locked for good (MM9 Locked 1); nothing is built behind it, so no portal
  # --- the refinery's sliding door with its handle and deadbolts (switch05 turns, the bolts draw, the door slides)
  slidingdoor05: {group: slidingdoor05, motion: dat, doorway: true, portal: doorportal05, click: false}
  deadboltbottom05: {group: deadboltbottom05, motion: dat, click: false}
  deadbolttop05: {group: deadbolttop05, motion: dat, click: false}
  switch05: {group: switch05, motion: rotate, click: false}
  handletrigger05: {group: handletrigger05, motion: dat}
  # --- the two lift-gates and the levers either side of each (Switch2/3 -> Door0, Switch4/5 -> Door1)
  Door0: {group: Door0, motion: dat, doorway: true, portal: Portal0, click: false}
  Door1: {group: Door1, motion: dat, doorway: true, portal: Portal1, click: false}
  Switch2: {group: Switch2, motion: rotate, start_open: true}   # MM9 StartOpen 1
  Switch3: {group: Switch3, motion: rotate, start_open: true}   # MM9 StartOpen 1
  Switch4: {group: Switch4, motion: rotate, start_open: true}   # MM9 StartOpen 1
  Switch5: {group: Switch5, motion: rotate, start_open: true}   # MM9 StartOpen 1
  # --- barred walls nailed shut by six spikes each (SpikeDoorA/B.scr, SpikeDoorOpen.scr): locked until pulled
  BarWall0: {group: BarWall0, motion: rotate}
  BarWall1: {group: BarWall1, motion: rotate}
  ABDoorBoards0: {group: ABDoorBoards0, motion: rotate}
  FallingBoard0: {group: FallingBoard0, motion: rotate}
  SteamValve0: {group: SteamValve0, motion: rotate}
  RotatingDoor0: {group: RotatingDoor0, motion: rotate}
  RotatingDoor61: {group: RotatingDoor61, motion: rotate}
  RotatingDoor62: {group: RotatingDoor62, motion: rotate}
  RotatingDoor63: {group: RotatingDoor63, motion: rotate}
  Stalagtite: {group: Stalagtite, motion: dat, click: false}
  # --- the spikes (BoardSpike.scr: a click pulls one; it is gone): dropped out of sight
  Spike0: {group: Spike0, motion: slide, move_lt: [0, -1000, 0], speed: 20000, click: false}
  Spike1: {group: Spike1, motion: slide, move_lt: [0, -1000, 0], speed: 20000, click: false}
  Spike2: {group: Spike2, motion: slide, move_lt: [0, -1000, 0], speed: 20000, click: false}
  Spike3: {group: Spike3, motion: slide, move_lt: [0, -1000, 0], speed: 20000, click: false}
  Spike4: {group: Spike4, motion: slide, move_lt: [0, -1000, 0], speed: 20000, click: false}
  Spike5: {group: Spike5, motion: slide, move_lt: [0, -1000, 0], speed: 20000, click: false}
  Spike6: {group: Spike6, motion: slide, move_lt: [0, -1000, 0], speed: 20000, click: false}
  Spike7: {group: Spike7, motion: slide, move_lt: [0, -1000, 0], speed: 20000, click: false}
  Spike8: {group: Spike8, motion: slide, move_lt: [0, -1000, 0], speed: 20000, click: false}
  Spike9: {group: Spike9, motion: slide, move_lt: [0, -1000, 0], speed: 20000, click: false}
  Spike10: {group: Spike10, motion: slide, move_lt: [0, -1000, 0], speed: 20000, click: false}
  Spike11: {group: Spike11, motion: slide, move_lt: [0, -1000, 0], speed: 20000, click: false}
  Spike12: {group: Spike12, motion: slide, move_lt: [0, -1000, 0], speed: 20000, click: false}
  Spike13: {group: Spike13, motion: slide, move_lt: [0, -1000, 0], speed: 20000, click: false}
  Spike14: {group: Spike14, motion: slide, move_lt: [0, -1000, 0], speed: 20000, click: false}
  Spike15: {group: Spike15, motion: slide, move_lt: [0, -1000, 0], speed: 20000, click: false}
  Spike16: {group: Spike16, motion: slide, move_lt: [0, -1000, 0], speed: 20000, click: false}
  Spike17: {group: Spike17, motion: slide, move_lt: [0, -1000, 0], speed: 20000, click: false}
  # --- the hard rock (tm_hardrock.scr "10 36 5000"): twelve blocks of 1 HP, scene destructibles (dungeon/destructibles.py
  #     `break`): weapons break them, a click still does (the shared click: 38000 + the DAT index)
  db12: {group: db12, motion: break}
  db13: {group: db13, motion: break}
  db14: {group: db14, motion: break}
  db15: {group: db15, motion: break}
  db16: {group: db16, motion: break}
  db17: {group: db17, motion: break}
  db18: {group: db18, motion: break}
  db19: {group: db19, motion: break}
  db20: {group: db20, motion: break}
  db21: {group: db21, motion: break}
  db22: {group: db22, motion: break}
  db23: {group: db23, motion: break}
  # --- breakable walls and blockers (DestructableBrush): scene destructibles; the machinery's scripts destroy the boards,
  #     the cart's blocker and the second torch's holder (evt.DestroyDestructible); MM9's weapons break any of them. The
  #     five cave-wall pieces keep one click for all (event 102), the cage walls (TriggerDestroyOnly) their clicks 111-113,
  #     TorchHolder0 the falling torch's click 108; the boards, blocker and holder 1 had no click and take none
  CaveWall0: {group: CaveWall, motion: break, click: 102}
  CaveWall1: {group: CaveWall, motion: break, click: 102}
  CaveWall2: {group: CaveWall, motion: break, click: 102}
  CaveWall3: {group: CaveWall, motion: break, click: 102}
  CaveWall4: {group: CaveWall, motion: break, click: 102}
  CaveIn: {group: CaveIn, motion: break, click: false}            # CanDamage 0: Trigger7 destroys it
  ABMineBoards0: {group: ABMineBoards0, motion: break, click: false}
  ABMineBoards1: {group: ABMineBoards1, motion: break, click: false}
  ABMineBoards2: {group: ABMineBoards2, motion: break, click: false}
  ABMineBoards3: {group: ABMineBoards3, motion: break, click: false}
  MCarBlocker1: {group: MCarBlocker1, motion: break, click: false}
  TorchHolder0: {group: TorchHolder0, motion: break, click: 108}
  TorchHolder1: {group: TorchHolder1, motion: break, click: false}
  # the falling torches (WorldObject, TM_FallingTorch.scr / TM_FirstFallingTorch.scr): movers dropped out of sight; a
  # missile on the torch drops it too (their OnDamage MoveToMarker; the torch stands in front of its 1 HP holder)
  FallingWallTorch0: {group: FallingWallTorch0, motion: slide, move_lt: [0, -1000, 0], speed: 20000, click: false,
                      shoot: true}
  FallingWallTorch1: {group: FallingWallTorch1, motion: slide, move_lt: [0, -1000, 0], speed: 20000, click: false,
                      shoot: true}
  BustOutBrush0: {group: BustOutBrush0, motion: break, click: 111}
  BustOutBrush1: {group: BustOutBrush1, motion: break, click: 112}
  BustOutBrush2: {group: BustOutBrush2, motion: break, click: 113}
  DestructableBrush0: {group: DestructableBrush0, motion: break}   # the stalactite's holder (1 HP)
  # --- static world objects
  InvisibleBrush0: static
  InvisibleBrush1: static
  InvisibleBrush2: static
  InvisibleBrush3: static
  InvisibleBrush4: static
  InvisibleBrush5: static
  # --- volumes: their surfaces are the map's own faces (convert.py)
  DirtyWater1: skip
  BlueWater0: skip
  molten steel0: skip
# Seeds whose centre lies in the rock (relay triggers high in the rock, touch boxes centred under the floor, a
# troglodyte and a mine-car chest sunk into the floor): they would flood the rock and the outside (work/leaks.py).
seed_exclude: [DBEffectsTrigger1, DBEffectsTrigger0, DBEffectsTrigger2, DBEffectsTrigger3, TorchTrigger0, DBEffectsTrigger4, DBEffectsTrigger5, TriggerSpawn, TriggerLocation1A, TriggerLocation2A, TriggerLocation2B, TriggerLocation3A, TriggerLocation3B, TriggerLocation4C, TriggerLocation4A, TriggerLocation5B, TriggerLocation5C, TriggerLocation0, plightofftrigger, AB_Troglodyte24, MineCar14]
skip_user_portals: [Portal2]       # the locked entrance door: nothing is built behind it
model_patterns: {}
