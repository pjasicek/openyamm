# Starport Reach's hostile monsters (spawns.py places them; build_out1.py calls it). The design's monster groups
# (design/kreegan_world/zone1/STARPORT_REACH.md "Monsters", make_starport_detail.py PLACES) are the anchors; the
# extra spawn points follow the MM6-MM8 study (README "How MM6-MM8 populate their outdoor maps", spawn_density.py):
# about 0.07 hostile monsters per million square units of land on the first visit, groups of 1-4 about 1 500 apart,
# off the roads, a guard near most chests and every dungeon entrance, nothing within 5 000 of the crash site or
# 2 500 of Landfall's wall, and the harder groups (Hunters, the Bull, the Kreegans) toward the far north and east.
#
# at: [cell, fx, fy] as in make_starport_detail.py (fx east, fy south within the cell; 5 760 units a cell), or
# near: an earlier spawn point (as placed) and offset: [dx, dy] from it, for the second points of a cluster.
# Spawn points: slot (the map_stats encounter slot), tier (empty: random by the slot's difficulty; A/B/C: fixed),
# group (actor group, for events). Placed squads: monster rows and counts, a formation, facing.

# The map's encounter slots are its map_stats row's (hesper_stage/maps.yml `slots`): slot 1 the Drones (difficulty 0,
# all Seekers), slot 2 the Glassbacks (difficulty 2: 70 % Pup, 20 % Glassback, 10 % Bull). The stage gives these
# monsters MM-style "<family> A/B/C" pictures (hesper_stage/monsters.yml `picture`): an encounter slot finds its
# tiers by its picture and the tier letter.

# Relations are world data since 2026-10-23: the stage's relations.yml (hesper_stage/relations.yml, staged as
# worlds/hesper/relations.yml) makes the drones, the Trooper and the glassbacks hostile and the Ashrunners hostile
# until S1 (QBit 100101, S1 done), so the map's load event no longer calls evt.SetMonsterRelation.
hide_after_qbit:                       # groups made invisible once the QBit is set
  - {group: 50, qbit: 100002, quest: M2 (the Terminal stops hunting along Landfall's walls)}

quiet:                                 # no spawn point or squad within (the arrival's scripted drones are not here)
  crew_door: 5000
  landfall_wall: 2500

