# Landfall's posted guards and wall turrets (engine tactics, hesper_stage/monsters.yml `tactics`; README "Landfall's
# defenders"). Run from output/hesper_stage/scenario_run (its settings.ini mounts the stage):
#   ../../../build/game/openyamm --headless-run-scenario ../../../level_generation/projects/hesper_out1/landfall_defenders.yml
# Actors (build_out1.py order): 11 the East Gate's south guard (posted, faces east), 15 a Lift Head sergeant (posted,
# faces east), 3 the East Gate's south Gate Bastion (wall turret, faces east). The party is friendly to all of them,
# so the scenario strikes the guard and the turret to start a fight. Idle, the turret scans (tactics `scan`); having
# lost the party it holds that aim for its hold time, then returns to the scan.
id: hesper.out1.landfall_defenders
world: hesper
mode: faithful
steps:
- load_map:
    map: hes_out1.odm
- set_pose: {map: hes_out1.odm, x: -8200, y: -15820, z: 1400, yaw: 3.14159, pitch: 0}
- note: {text: "At peace the posts hold their spot and their facing (no wandering) for 20 seconds."}
- advance_runtime: {seconds: 20}
- assert:
    actor_visible:
      actor_index: 11
      report_state: true
      hostile_to_party: false
      near: {x: -9740, y: -15820, max_distance: 60}
      faces: {x: -8740, y: -15820, within_degrees: 3}
- assert:
    actor_visible:
      actor_index: 15
      report_state: true
      near: {x: -15050, y: -16540, max_distance: 60}
      faces: {x: -14050, y: -16540, within_degrees: 3}
- assert:
    actor_visible:
      actor_index: 3
      report_state: true
      has_aim_target: false
      faces: {x: -9200, y: -15930, within_degrees: 41}
- note: {text: "Idle, the turret scans: an eased sweep within its 40 degrees either side of its placement facing."}
- advance_runtime: {seconds: 7}
- assert:
    actor_visible:
      actor_index: 3
      report_state: true
      has_aim_target: false
      faces: {x: -9200, y: -15930, within_degrees: 41}
- note: {text: "Struck, the guard fights from its rifle band within its leash and the turret tracks the party."}
- damage_actor: {actor_index: 11, amount: 1}
- damage_actor: {actor_index: 3, amount: 1}
- advance_runtime: {seconds: 4}
- assert:
    actor_visible:
      actor_index: 11
      report_state: true
      hostile_to_party: true
      has_aim_target: true
      near: {x: -9740, y: -15820, max_distance: 1600}
      far: {x: -8200, y: -15820, min_distance: 600}
- assert:
    actor_visible:
      actor_index: 11
      far: {x: -9740, y: -15820, min_distance: 150}
- assert:
    actor_visible:
      actor_index: 3
      report_state: true
      hostile_to_party: true
      has_aim_target: true
      near: {x: -10200, y: -15930, max_distance: 1}
      faces: {x: -8200, y: -15820, within_degrees: 6}
- note: {text: "The party closes on the gate: the guard backs off instead of closing to melee; the turret follows."}
- set_pose: {map: hes_out1.odm, x: -9500, y: -15820, z: 1400, yaw: 3.14159, pitch: 0}
- advance_runtime: {seconds: 3}
- assert:
    actor_visible:
      actor_index: 11
      report_state: true
      near: {x: -9740, y: -15820, max_distance: 1600}
      far: {x: -9500, y: -15820, min_distance: 600}
- assert:
    actor_visible:
      actor_index: 3
      report_state: true
      faces: {x: -9500, y: -15820, within_degrees: 6}
- note: {text: "The party leaves: the turret holds its last aim for its 4 s hold, then eases back into its scan."}
- set_pose: {map: hes_out1.odm, x: -1200, y: -15820, z: 1400, yaw: 0, pitch: 0}
- advance_runtime: {seconds: 2}
- assert:
    actor_visible:
      actor_index: 3
      report_state: true
      has_aim_target: true
      faces: {x: -9500, y: -15820, within_degrees: 6}
- advance_runtime: {seconds: 14}
- assert:
    actor_visible:
      actor_index: 3
      report_state: true
      has_aim_target: false
      faces: {x: -9200, y: -15930, within_degrees: 41}
