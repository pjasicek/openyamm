- press_action: {action: cancel_dialog}
- speak_npc: {source_id: 9224}
- select_topic: {kind: npc_topic, action_id: 9756}
- press_action: {action: cancel_dialog}
- note: {text: "The Re-entry Emitter fitted (D0, 100043): Garrow closes M12 (100012), and Dace teaches (topic 9224)."}
