# The five sky faces (skymarker) of the shaft over the engine's crown, seen through its glass skylight (WorldObject0,
# a glass portal): no sky indoors; they draw MM9's Clouds1 sky as the Temple of Honk's skylights do (2026-10-30; they
# drew the bronze ceiling before), and the bake makes them the crown's sky light (profile `emitters`).
textures:
  'textures\skybox\skymarker.dtx': {alias: CLOUVKSJD0, width: 256, height: 256}
# MM9's glass: Translucent surfaces blended at the texture's alpha times the brush's Alpha
# (devdocs/mm9_rework/MM9_VISUAL_PROPERTIES.md): the pale blue Lichwindow (alpha 43-138 of 255; brushes 0.7, 0.8, 1:
# the atrium and observation windows, the transformer and mutation windows, the cages) and the blue ice glass of the
# engine's pods and crown (yanmirsolidice1, alpha 191; brushes 0.5, 0.6, 1). A pane between two rooms becomes a portal
# shaped as the pane plus the pane itself as a translucent solid face (the scene's translucent_faces,
# devdocs/INDOOR_TRANSLUCENT_FACES.md); a pane inside one room only the translucent face; a mover's panes a
# translucent mover part; a pane with air on its front only is glass when a face stands behind it to be seen through,
# else opaque (the shared converter's `glass`). Per texture: opacity (times texture alpha and brush Alpha), tint,
# two_sided: MM9's panes are often single quads seen from both rooms.
glass:
  lichwindow.dtx: {opacity: 1.0, tint: [1.0, 1.0, 1.0], two_sided: true}
  yanmirsolidice1.dtx: {opacity: 1.0, tint: [1.0, 1.0, 1.0], two_sided: true}
# Seeds of the air flood that stand outside the built air: the relay triggers TriggerUnlock/0 and the script holder
# PromoTrigger (outside the walls), the auto-resurrecting SkeletonMaster52 (under the floor), two bat trigger boxes
# whose centres lie under the north corridor's floor, and SpawnMgr (inside the summoning pedestal: a sealed pocket).
seed_exclude: [PromoTrigger, TriggerUnlock, TriggerUnlock0, SkeletonMaster52, RightWingBatTrigger1, LeftWingBatTrigger0,
               SpawnMgr, Oculus10]           # Oculus10 floats inside the east lab's wall (a sealed cavity; convert.py hides it)
# Air no seeded object reaches: the two transformer chambers and the closets the peasants come from.
seeds:
  - [1120, 580, 1792]                 # chamber of SkeletonTransformer (behind skeletondoora)
  - [960, 990, 768]                   # chamber of SkeletonTransformer0 (behind skeletondoora0)
  - [1104, 570, 2104]                 # MarkerSpawn closet (behind peasant door)
  - [960, 990, 1074]                  # MarkerSpawn0 closet (behind peasant door0)
