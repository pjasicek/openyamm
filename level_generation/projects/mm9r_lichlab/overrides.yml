  display_name: Lich Lab
  starts: [StartPoint0]               # the only start: the entrance from Yorwick (ExitTrigger0 beside it)
  monster_classes: [SkeletonMaster, FlyingIcky, Oculus, Dagrell, PowerLich, LichKing, VenomousDagrell, Eye, Lich,
                    Revenant, Ghast, SpectreDagrell]
  offset: [0, 0, 0]                   # the old map's frame: x -9503..7864, y -5284..12452, z -1229..3768 fit int16
  ambient: 20
  model_lighting: true                # re-light 2026-10-31: MM9 model lighting (AmbientLight 60, ModelAdd 30); the old path drew props under x0.6 of their view in 14 of 25 views: work/relight/model_lighting_props.txt
  split_minor_rooms: true             # every polygon is split at a portal plane it crosses (playbook gotchas)
  extra_seed_classes: [ScriptObject, Shooter, Fire]
plan_levels:
  basement: [-500, -150]              # engine hall and the summoner's ghost pools (floor -256)
  ground: [-150, 350]                 # the cross hall, wings, labs, cages (floor 0)
  upper: [350, 800]                   # entrance, lobby, ring corridor round the atrium, ranges (floor 512)
  top: [800, 1500]                    # kitchen, transformer 0, offices (floor 928)
models:
