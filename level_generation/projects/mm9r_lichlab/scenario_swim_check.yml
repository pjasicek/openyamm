# Written by mm9r_common/dungeon/swim_check.py from the built map; rerun it after convert.py.
id: mm9r.lichlab_swim_check
title: 'Lich Lab (native BLV) - swim check: the party on each volume''s bed, up to its surface; swimmers stay in their water'
world: mm9
mode: faithful
tags:
- mm9
- mm9_rework
- draft
steps:
- load_map:
    map: lichlab.blv
- note:
    text: 'BlueWater0: on its bed at -1167, 225 under its top -942.1'
- set_pose:
    map: lichlab.blv
    x: -795
    y: -4821
    z: -1166
    yaw: 0.0
    pitch: 0.0
- advance_runtime:
    seconds: 1.0
- assert:
    water:
      state: bed
      eye_under: true
      foot_z_max: -1155.4
- movement_segment:
    input: none
    fly_up: true
    seconds: 1.1
    actor_collision: false
    actor_ai: false
    start:
      map: lichlab.blv
      x: -795
      y: -4821
      z: -1166
      yaw: 0.0
      pitch: 0.0
    expect_stop:
      map: lichlab.blv
      x: -795
      y: -4821
      z: -1075
      yaw: 0.0
      pitch: 0.0
    loose_tolerance: true
    tolerance_xy: 2000
    tolerance_z: 2000
- assert:
    water:
      state: surface
      eye_under: false
      breath_min: 0.99
