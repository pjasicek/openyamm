# Written by make_scenarios.py from the built map; rerun it after convert.py.
id: mm9r.templeofhonk_hostility
title: 'Temple of Honk (native BLV): the Honks are friends until the party hurts one'
world: mm9
mode: faithful
tags:
- mm9
- mm9_rework
- draft
steps:
- load_map:
    map: templeofhonk.blv
- note:
    text: '18 Honks, all friends of the party (HonkHostility.inc: AddFriend Player).'
- assert:
    actor_visible:
      actor_index: 0
      hostile_to_party: false
- assert:
    actor_visible:
      actor_index: 17
      hostile_to_party: false
- note:
    text: Hurting Honk0 turns every Honk hostile (BigHonk0 too).
- damage_actor:
    actor_index: 0
    amount: 5
- advance_runtime:
    seconds: 1
- assert:
    state_dump_named_map_var:
      name: HonksHostile
      value: 1
- assert:
    actor_visible:
      actor_index: 17
      hostile_to_party: true
