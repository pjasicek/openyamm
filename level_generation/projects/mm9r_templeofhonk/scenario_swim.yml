- draft
steps:
- load_map:
    map: templeofhonk.blv
- note:
    text: 'The pool''s water volume: surface -517.1, channel bed -532.5 (15 units of water). The party walks off the hall
      floor over the rim into it and wades.'
- set_pose:
    map: templeofhonk.blv
    x: -3213
    y: 6645
    z: -521
    yaw: 0.0
    pitch: 0.0
- advance_runtime:
    seconds: 0.5
- assert:
    water:
      state: dry
      eye_under: false
- movement_segment:
