model_patterns: {}
# Archway portals beyond the doorways (chosen on work/rooms_large.png).
portals:
  - {name: south_corridor_north, axis: z, point: [-255, 50, 60], span: 160}      # the corridor north to room 4's door
  - {name: south_hall_west_arc, axis: x, point: [-1640, 50, -60], span: 200}     # the west ring arc
  - {name: south_hall_east_arc, axis: x, point: [300, 50, 100], span: 200}       # the arc east of the long corridor
  - {name: east_box_arcs, axis: z, points: [[600, 50, 230], [760, 50, 230]], span: 220}   # both arcs under the east corridor
  - {name: southeast_arc, axis: x, point: [1100, 50, -60], span: 200}            # the arc rising to the east upper corridor
  - {name: hall_stair_top, axis: z, point: [-8, 60, 890], span: 100}             # the stair from the main hall to the basement
  - {name: west_wing_diagonal, axis: x, point: [-1750, 50, 560], span: 200}
  - {name: west_wing_north, axis: x, point: [-1900, 50, 1300], span: 200}
  - {name: northeast_arc, axis: z, point: [790, 80, 2440], span: 150}            # the arc rising to the upper floor
exits: {}
# No `glass`: the skylight glass (window_03: leaded panes, alpha 0-255, brush Alpha 1) stays opaque. Tried as
# translucent faces (2026-10-30, devdocs/INDOOR_TRANSLUCENT_FACES.md): 8 of its 20 faces have the sky faces behind them,
# the rest nothing; through the panes the shaft showed holes (black) and a clear cloud texture where MM9 shows frosted
# glass, at the same brightness (123.9 / 123.9). The opaque panes are the profile's sky emitters.
# MM9 source textures without an alias in the old import: the skylights' sky markers (MM9 draws its sky box through
# them) draw MM9's Clouds1 sky (worlds/mm9/textures/CLOUVKSJD0.bmp).
textures:
  "TEXTURES\\Skybox\\skymarker.dtx": {alias: CLOUVKSJD0, width: 256, height: 256}
  # The entrance channel's water surface (convert.py pool(): BlueWater0's top face): MM9's own Water115.spr, first frame.
  "water:pool": {alias: WATEQOBX0Z, width: 128, height: 128}
plan_levels:
  low: [-300, -60]
  main: [-60, 200]
  upper: [200, 700]

# Ground treasure hints (dungeon/treasure.py, devdocs/mm9_rework/GROUND_TREASURE_PLAN.md section 4): DAT
# objects whose surroundings count as secrets or bosses (bonus markers), rewarding set dressing, and places
# to keep clear.
treasure:
  bonus_near: [CollectionChest]
  themed_near: [Bookcase0, Bookcase4, Bookcase8]
