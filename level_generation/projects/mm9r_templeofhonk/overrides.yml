# Explicit conversion choices for the Temple of Honk (convert.py and the shared converter read this; a rerun
# keeps them). Keys: ../mm9r_common/DUNGEON_PLAYBOOK.md (overrides.yml).
map:
  stem: templeofhonk
  display_name: Temple of Honk
  starts: [StartPoint0]
  monster_classes: [Honk, Honk2, ElderHonk, Goose, Fish]   # geese and the pool's fish on their own rows 293, 227
  offset: [0, 0, 0]               # the old bmodel_world map's frame (fits int16): transitions and bounds stay valid
  ambient: 14                     # brighter than Anskram (20): MM9 lights the temple evenly (its fill lights are over the cap)
  model_lighting: false           # re-light 2026-10-31: tried (AmbientLight 80, ModelAdd 30), props x0.74 of their view against the old path x1.15 (capture x0.80): work/relight/model_lighting_props.txt
  split_minor_rooms: true         # split at a crossing portal from 3 samples of the second room (vault floor strips)
# What every DAT world model becomes (motions: ../mm9r_common/dungeon/movers.py).
models:
  NCornerStone: {group: NCornerStone, motion: dat}   # Door: rises 48 out of the pool corner when NButton is pressed
  OCornerStone: {group: OCornerStone, motion: dat}   # Door: rises 48 out of the pool corner when OButton is pressed
  HCornerStone: {group: HCornerStone, motion: dat}   # Door: rises 48 out of the pool corner when HButton is pressed
  KCornerStone: {group: KCornerStone, motion: dat}   # Door: rises 48 out of the pool corner when KButton is pressed
  KButton: {group: KButton, motion: dat}   # Door: pushed 4 into the button wall
  NButton: {group: NButton, motion: dat}   # Door: pushed 4 into the button wall
  OButton: {group: OButton, motion: dat}   # Door: pushed 4 into the button wall
  HButton: {group: HButton, motion: dat}   # Door: pushed 4 into the button wall
  DoubleDoorL1: {group: DoubleDoor1, motion: rotate, doorway: true, portal: DoubleDoorPortal1}
  DoubleDoorR1: {group: DoubleDoor1, motion: rotate, doorway: true, portal: DoubleDoorPortal1}
  DoubleDoorL2: {group: DoubleDoor2, motion: rotate, doorway: true, portal: DoubleDoorPortal2}
  DoubleDoorR2: {group: DoubleDoor2, motion: rotate, doorway: true, portal: DoubleDoorPortal2}
