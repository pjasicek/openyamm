# Explicit conversion choices for MM9's Thjorgard City (convert.py reads this through the shared converter
# ../mm9r_common/dungeon and the city module ../mm9r_common/city; a rerun keeps them). Rules and keys:
# ../mm9r_common/DUNGEON_PLAYBOOK.md and ../mm9r_common/CITY_PLAYBOOK.md.
map:
  fog: lithtech                      # MM9's own fog model and its WeatherMan night fog (CITY_PLAYBOOK "Daylight and fog")
  bright_scale_lights: true          # BLV light colour x MM9's BrightScale, as its lightmaps (CITY_PLAYBOOK "Street lights")
  stem: thjorgardcity
  display_name: Thjorgard City
  # start index = the old map's: 0 from the Arena, 1 the docks (StartPoint0), 2 the west gate (from the Thjorgard
  # wilderness), 3 Town Portal (the palace terrace)
  starts: [ArenaExit, StartPoint0, StartPointTerrain, TownPortal]
  monster_classes: [TownDwarfMaleA, TownHuman2MaleA, TownElfFemaleB, CommonerHumanMaleA, ShopkeeperElfMaleA,
                    TownElfFemaleA, CommonerElfMaleA, TownElfMaleA, TownHuman2MaleB, TownHuman2FemaleA,
                    ShopkeeperHuman2MaleA, CommonerHuman2FemaleA, CommonerElfMaleB, ShopkeeperHuman2MaleB,
                    ShopkeeperDwarfMaleB, TownHumanFemaleA, TownDwarfMaleB, TownHumanMaleA, ShopkeeperHumanMaleA,
                    ShopkeeperHumanFemaleA, ShopkeeperElfFemaleB, CommonerDwarfFemaleB, CommonerHuman2MaleA,
                    CommonerElfFemaleB, TownDwarfFemaleB, SvenSvenssen, CommonerHumanFemaleA, CommonerElfFemaleA,
                    CommonerHuman2MaleB]
  painted_minimap: true               # MM9's painted city map (catalog entry kept); no outline pass (CITY_PLAYBOOK.md)
  offset: [0, 0, 0]                   # the old map's frame (x -9 640..9 700, y -8 100..23 190 native): fits int16
  ambient: 20
  model_lighting: false
  split_minor_rooms: true
  split_retry: true
  thin_walls: true
plan_levels:
  street: [-100, 160]
  upper: [160, 600]
  palace: [900, 1700]
model_patterns:
  WorldObject: static                 # hanging chains (ChainLink in invisible boxes), window panes, porch slabs
  DestructableBrush: static           # window panes in Invisible boxes (MM9 breaks them; not breakable here)
  InvisibleBrush: static              # invisible collision (Firethrough / Invisible)
  Carpet: static                      # carpets and runners (AmazingTrim, CarpetOld, tapestry)
  BlueWater: static                   # the palace terrace's four basins (Water115 top in an Invisible box)
models:
  SkyBox0: skip                       # DemoSkyWorldModel: MM9's sky box (SnowMtns_*), drawn by the sky, not geometry
  TOD_Sky0: skip                      # TOD_Sky: the night starfield shell
  Terrain1: static                    # the hillside up to the palace (abndfortgrass, cobblestone path)
  Apothzone: skip                     # PortalZones (greenscreen): MM9's renderer zones that open the window portals
  Apothzone0: skip
  Genzone: skip
  Genzone0: skip
  RH1pz1: skip
  RH1pz0: skip
  Magipz: skip
  TPZ2: skip
  TPZ1: skip
  # --- doors (work/draft_rules.py, edited): pairs share a group; every swing door is a doorway
