# The air over the north town wall (z 5 900-5 995, its top at 368) up to the sky lid: one archway cut divides the
# open air over the town's roofs from the hillside and the palace terrace (each was 5 300 faces in one sector)
portals:
  - {name: north_wall_sky, axis: z, point: [0, 1000, 5960], span: 4200}
# The window UserPortals of MM9's PortalZones (greenscreen zones behind the shop windows): the window panes are glass
# portals here
skip_user_portals: [Apothpz, Apothpz0, Genpz, Genpz0, RH1p0, Magip, TP1, TP2]
textures:
  'textures\skybox\skymarker.dtx': {alias: sky04, width: 512, height: 512}   # the sky shell: IndoorSky faces (scene override)
  # greenscreen: 7 sky-flagged (0x111) polygons are the library's skylight and its upper windows' backs (sky faces);
  # the 6 solid ones behind the facade doors are retextured to a wall in convert.py
  'textures\leveltextures\misc\greenscreen.dtx': {alias: sky04, width: 512, height: 512}
# MM9's window panes (Invisible boxes with one translucent pane, flag 0x8): translucent faces (dungeon/rooms.py Glass:
# glass per face from MM9's Translucent flag). The houses' window boxes without the flag (0x1081) are opaque, as in MM9
# (the user, 2026-11-07, superseding the see-through panes of 2026-11-01). These entries only tune the flagged faces.
glass:
  thjorwindow4.dtx: {opacity: 1.0, tint: [1.0, 1.0, 1.0], two_sided: true}
  thjorwindow2.dtx: {opacity: 1.0, tint: [1.0, 1.0, 1.0], two_sided: true}
  thjorbars.dtx: {opacity: 1.0, tint: [1.0, 1.0, 1.0], two_sided: true}
# The city's open air (../mm9r_common/city/structure.py): street air under the roof line, the air over the roofs one
# room per district, street cuts found automatically.
city:
  weather: rain                    # the outdoor weather over the open sky (the user's decision 2026-11-06; city.hooks.apply_weather)
  merged_top_portals: true          # few large convex top portals over walls and roofs (CITY_PLAYBOOK "The open air" step 3)
  daylight: true                     # sun and sky light on the sectors open to the sky (CITY_PLAYBOOK "Daylight and fog")
  street_top_lt: 224                 # 224 LT over the streets (0): under the eaves, and under the gatehouse's side
                                     # passages (240) so the town wall is crossed below it only by the gate
  # The walled town only (the north wall stands at z 5 900-5 995): the hillside and Sven's palace terrace north of it
  # stay one room with the air over the roofs (a roof line there cuts the slope into ~1 300 rectangles)
  street_box_lt: [[-4000, -2000], [4500, 5952]]
  extra_cuts:
    - {axis: z, point: [-1024, 100, 5944]}   # the north gate, the only opening of the wall below the roof line
  sky_preset: cloudy                 # the outdoor maps' high-definition sky (was sky_texture plansky3, the old import's)
  outdoor_view: true                 # view distance and haze as an outdoor map's, not MM9's grey fog (INDOOR_OPEN_SKY.md)
  view_distance_scale: 0.5           # 8 096 units at the default view distance setting (16 192), the user's choice
  half_steps: true                   # invisible half steps onto standable raised floors 50-66 high (CITY_PLAYBOOK "Raised floors")
