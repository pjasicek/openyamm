      map: oute3.odm
  - press_interact:
      pose: {map: oute3.odm, x: 2168, y: -10432, z: 89, yaw: -1.57079633, pitch: 0}
      expect: {can_activate: true, target_index: 87, face_index: 42, triggered_event: 29}
