      expect_stop: {map: oute3.odm, x: 1631, y: -10208, z: 161, yaw: 3.14159265, pitch: 0}
      seconds: 1.25
      input: forward
      shift: true
      actor_ai: false
      tolerance_xy: 16
      tolerance_z: 3
