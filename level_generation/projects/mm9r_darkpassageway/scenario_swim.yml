# Written by make_scenarios.py from the built map; rerun it after convert.py.
id: mm9r.darkpassageway_swim
title: 'Dark Passageway (native BLV) - swimming: into the lake and up, down the flooded tube into the ocean, onto the island;
  the female sea monster stays in the ocean'
world: mm9
mode: faithful
tags:
- mm9
- mm9_rework
- draft
steps:
- load_map:
    map: darkpassageway.blv
- note:
    text: 'The bridge lake (BlueWater0, top -1536.0, bed -2621 here): dropped over the open water the party falls in, its
      eye goes under, it sinks.'
- set_pose:
    map: darkpassageway.blv
    x: -19905
    y: -2115
    z: -1386
    yaw: 0.0
    pitch: 0.0
- advance_runtime:
    seconds: 2.5
- assert:
    water:
      eye_under: true
      foot_z_max: -1696.0
- note:
    text: 'Up (Fly Up held): it rises at 384 a second and holds at the surface, its eye out, breath full.'
- movement_segment:
    input: none
    seconds: 2.0
    actor_collision: false
    actor_ai: false
    start:
      map: darkpassageway.blv
      x: -19905
      y: -2115
      z: -1936
      yaw: 0.0
      pitch: 0.0
    expect_stop:
      map: darkpassageway.blv
      x: -19905
      y: -2115
      z: -1669
      yaw: 0.0
      pitch: 0.0
    loose_tolerance: true
    tolerance_xy: 2000
    tolerance_z: 2000
    fly_up: true
- assert:
    water:
      state: surface
      eye_under: false
      breath_min: 1.0
      foot_z_min: -1673.4
      foot_z_max: -1665.4
- note:
    text: 'The flooded tube (TubeRoomWater, MM9''s current 90 LT/s down): under water in the tube room''s end, the party swims
      east along the tube to the shaft and sinks down it with the current; at its bottom (ShaftExit) it is moved under the
      ocean hall''s non-solid sky and falls into the ocean.'
- set_pose:
    map: darkpassageway.blv
    x: -10487
    y: -21568
    z: -1824
    yaw: 0.0
    pitch: 0.0
- advance_runtime:
    seconds: 0.3
- assert:
    water:
      eye_under: true
- movement_segment:
    input: forward
    seconds: 3.0
    actor_collision: false
    actor_ai: false
    start:
      map: darkpassageway.blv
      x: -10487
      y: -21568
      z: -1824
      yaw: 0.0
      pitch: 0.0
    expect_stop:
      map: darkpassageway.blv
      x: -9587
      y: -21568
      z: -1884
      yaw: 0.0
      pitch: 0.0
    loose_tolerance: true
    tolerance_xy: 2000
    tolerance_z: 2000
- advance_runtime:
    seconds: 5.0
    follow_map_move: true
- assert:
    state_dump_named_map_var:
      name: ShaftDrops
      value: 1
- advance_runtime:
    seconds: 4.0
- assert:
    water:
      eye_under: true
      foot_z_max: -3498.7
- note:
    text: 'Out onto the island: at the surface 160 off the sand''s lowest edge the party swims at it with a fresh Jump (the
      surface jump) and lands on the sand.'
- movement_segment:
    input: forward
    seconds: 0.6
    actor_collision: false
    actor_ai: false
    start:
      map: darkpassageway.blv
      x: -7858
      y: -20989
      z: -3492
      yaw: 5.1051
      pitch: 0.0
    expect_stop:
      map: darkpassageway.blv
      x: -7739
      y: -21275
      z: -3324
      yaw: 5.1051
      pitch: 0.0
    loose_tolerance: true
    tolerance_xy: 450
    tolerance_z: 60
    jump: true
- assert:
    water:
      state: dry
      eye_under: false
      foot_z_min: -3358.7
- note:
    text: 'SeaMonsterFemale0 (a swimmer: its box centre at MM9''s position, under the surface), hit by the party on the island,
      stays in the ocean (bound to its volume).'
- set_pose:
    map: darkpassageway.blv
    x: -7739
    y: -21275
    z: -3323
    yaw: -0.32766965943116344
    pitch: 0.0
- damage_actor:
    actor_index: 4
    amount: 1
- advance_runtime:
    seconds: 8.0
- assert:
    actor_visible:
      actor_index: 4
      report_state: true
      near:
        x: -6164
        y: -21811
        max_distance: 2600
        min_z: -4260.0
- assert:
    water:
      state: dry
