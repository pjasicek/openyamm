# Explicit conversion choices for MM9's Wizard's Lab (convert.py reads this through the shared converter
# ../mm9r_common/dungeon and the city module ../mm9r_common/city; a rerun keeps them). Rules and keys:
# ../mm9r_common/DUNGEON_PLAYBOOK.md and ../mm9r_common/CITY_PLAYBOOK.md. Built like the cities (user, 2026-11-04,
# devdocs/mm9_rework/REGIONS_FINISH.md step 3): CityHooks, the open sky behind MM9's sky faces, daylight; no terrain
# block and no street structure (README "The sky, daylight and no terrain").
map:
  stem: wizardslab
  display_name: Wizard's Lab
  # one start: StartPoint0 by the exit portal (Yorwick's WizardLabExit row 7 arrives there; map_transitions.txt)
  starts: [StartPoint0]
  # MM9's monsters (all resolve to MM9 rows 9xxx). Left out: ReverendMonk (ReverendMonk0 is Robinssen, NPC55.scr,
  # RUDE 55: convert.py places him as a friendly dialogue actor, OUTDOOR_BLV_ALL.md "NPC classes that resolve to
  # monster rows") and GreaterDemon (GreaterDemonCACHEONLY, CacheOnly 1: WizardMaster.scr spawns the demon; citylua
  # summons row 9242). The seven SummoningGuy* (WizardSummoner.scr, WizardMaster.scr) are placed friendly.
  monster_classes: [WingedAberration, WingedOddity, SeaMonsterMale, SeaMonsterFemale, EvilApprentice,
                    EvilGrandSorcerer, EvilSorcerer, Skeleton, Eye, Oculus]
  # No `painted_minimap`: the lab is an ordinary interior, so it keeps the outline pass and the Map style setting
  # chooses its line map or MM9's painted one (catalog entry wizardslab kept) (user, 2026-11-10).
  offset: [0, 0, 0]                   # the old map's frame (native x -22 077..5 578, y -717..17 323): fits int16
  ambient: 20
  model_lighting: false
  # Forced arrivals (pack growth, ../mm9r_common/dungeon/density.py): the teleporter stations' landings keep MM9's
  # monsters plus at most `copies` grown ones within `radius` (height counted double); the rest go to other packs
  # (user, 2026-11-09).
  density_arrivals:
  - {name: TeleporterAtGreen, at: [-17654, 12431, -563], radius: 2000, copies: 3}
  - {name: TeleporterAtWhite, at: [-41, 7168, 246], radius: 2000, copies: 2}
  - {name: TeleporterAtRed, at: [-2949, 3236, 246], radius: 2000, copies: 2}
  - {name: TeleporterAtYellow, at: [492, 10629, 246], radius: 2000, copies: 2}
  bright_scale_lights: true           # BLV light colour x BrightScale, as the cities (CITY_PLAYBOOK "Street lights")
  # No `fog`: WorldProperties EnableFog 0 and no Fog object (Source.fog writes nothing).
  swim: true                          # DirtyWater0 (the sea monsters' pool), DirtyWater1-3, the power waters
  split_minor_rooms: true
  split_retry: true
  thin_walls: true
plan_levels:
  cells: [-800, -100]                 # the cell block (floor -216) and the pool under it (-736..-360)
  main: [-100, 300]                   # the lab floor (0..96): the start, the halls, the bedrooms, the eye rooms
  upper: [300, 1700]                  # the cloud room's upper air and the summoning tower (576..1600)
model_patterns:
  AITrack: skip                       # AIRail helpers: MM9's walkable graph, not built
models:
  'power water': skip                                       # ClearWater (Visible 0): a water volume, no geometry
  'power water0': skip                                      # ClearWater (Visible 0): a water volume, no geometry
