textures:
  # The five sky faces (flags 0x111, texture "Default": the summoning tower's open top) are retextured by convert.py
  # (sky_faces) to this marker, which CityHooks turns into IndoorSky faces with the open sky behind them.
  'textures\skybox\skymarker.dtx': {alias: sky04, width: 512, height: 512}
# The super eye's force field (super eye door: Perception.spr, Alpha 0.35): drawn translucent (0.35 by the brush)
glass:
  perception.spr: {opacity: 1.0, tint: [1.0, 1.0, 1.0], two_sided: true}
# The open sky (city/hooks.py CityHooks.scene). No street structure (convert.py extra_portals: the tower's open air is
# one room), no outdoor view (an indoor lab: the scene's own view; MM9 has no fog here), no half steps.
city:
  daylight: false                     # MM9: AmbientLight 35 and no StaticSunLight; night at every hour
  sky_preset: night_stars             # MM9's starfield sky box (user, 2026-11-05)

# Ground treasure hints (dungeon/treasure.py, devdocs/mm9_rework/GROUND_TREASURE_PLAN.md section 4): DAT
# objects whose surroundings count as secrets or bosses (bonus markers), rewarding set dressing, and places
# to keep clear.
treasure:
  bonus_near: [EvilGrandSorcerer0, EvilGrandSorcerer1, EvilGrandSorcerer2]
  themed_near: [BonePile0, BonePile1, BonePile2, BonePile3]

# MM9's .spr surfaces (../mm9r_common/dungeon/spr_surfaces.py): their frames animated, translucent where MM9's are.
# The stations' sheets and crystals are translucent in convert.py (SPR_SURFACES); Ocean.spr, the power water's
# Water115 and the cloud room's water123flowing get their frames.
spr_surfaces:
  # Left opaque for now (2026-11-10): the spheres (Alpha 0.85, 1 088 faces: as many translucent draws for a 15 %
  # difference) and the energy bolts (Alpha 0.15), whose slime faces are liquids (a retexture, not this rule).
  skip: [spheres, energy bolts]
