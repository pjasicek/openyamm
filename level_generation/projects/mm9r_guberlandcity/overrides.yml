# Explicit conversion choices for MM9's Guberland City (convert.py reads this through the shared converter
# ../mm9r_common/dungeon and the city module ../mm9r_common/city; a rerun keeps them). Rules and keys:
# ../mm9r_common/DUNGEON_PLAYBOOK.md and ../mm9r_common/CITY_PLAYBOOK.md.
map:
  ambient_triggers: true             # touch Triggers switch AmbientSounds (dungeon/objects.py ambient_triggers)
  fog: lithtech                      # MM9's own fog model and its WeatherMan night fog (CITY_PLAYBOOK "Daylight and fog")
  bright_scale_lights: true          # BLV light colour x MM9's BrightScale, as its lightmaps (CITY_PLAYBOOK "Street lights")
  stem: guberlandcity
  display_name: Guberland City
  # start index = the old map's: 0 the city gate (from the Guberland wilderness), 1 Town Portal
  starts: [StartPoint0, TownPortal]
  monster_classes: [CommonerHalfOrcMaleA, ShopkeeperHuman2MaleA, CommonerHuman2MaleB, ShopkeeperHuman2MaleB,
                    CommonerHumanMaleA, ShopKeeperHalfOrcFemaleA, PoorTownGuard1, CommonerHuman2MaleA,
                    ShopkeeperElfMaleA, ShopkeeperHumanMaleA, MarkeltheGreat, ShopKeeperHalfOrcMaleA,
                    CommonerHumanFemaleA]
  painted_minimap: true               # MM9's painted city map (catalog entry kept); no outline pass (CITY_PLAYBOOK.md)
  offset: [0, 0, 0]                   # the old map's frame: fits int16
  ambient: 20
  model_lighting: false
  split_minor_rooms: true
  split_retry: true
  thin_walls: true
plan_levels:
  street: [0, 200]
  upper: [200, 640]
models:
  SkyBox0: skip                       # DemoSkyWorldModel: MM9's sky box (SnowMtns_*), drawn by the sky, not geometry
  TOD_Sky0: skip                      # TOD_Sky: the night starfield shell
  BlueWater0: skip                    # BlueWater volume in the magic shop's fish tank: its top face is added by convert.py
  # --- static world objects
  DestructableBrush0: static          # window panes (Invisible boxes with one pane): glass
  DestructableBrush1: static
  DestructableBrush2: static
  DestructableBrush3: static
  DestructableBrush6: static
  DestructableBrush7: static
  DestructableBrush8: static
  DestructableBrush9: static
  DestructableBrush10: static
  DestructableBrush11: static
  DestructableBrush13: static
  DestructableBrush14: static         # skylight panes (Windowlead2x lying flat, 304 LT long) of the apothecary's hall
  DestructableBrush15: static
  DestructableBrush16: static
  DestructableBrush17: static
  DestructableBrush18: static
  DestructableBrush19: static
  Stainedglass: static                # the temple's stained glass (fleur-tall)
  WorldObject0: static                # the palace's rose windows (WindowRose)
  WorldObject1: static                # the bank's counter bars (MetalBar in an invisible shell)
  WorldObject2: static                # the fish tank's glass (yanmiricenoise, Alpha 0.5)
  WorldObject3: static                # window panes (window_frame_trans)
  WorldObject5: static
  WorldObject7: static                # hanging chains (ChainLink in invisible boxes): the signs' and lamps' chains
  WorldObject8: static
  WorldObject9: static
  WorldObject10: static
  WorldObject11: static
  WorldObject12: static
  WorldObject13: static
  WorldObject14: static
  WorldObject15: static
  WorldObject16: static
  WorldObject17: static
  WorldObject18: static
  WorldObject19: static
  WorldObject53: static
  WorldObject54: static
  WorldObject55: static
  WorldObject58: static
  WorldObject59: static
  WorldObject60: static
  Carpet10: static                    # the throne room's carpets (AmazingTrim1c)
  Carpet11: static
  InvisibleBrush0: static             # Firethrough lids 255-512 LT over the four quarters' roofs (MM9 keeps the player off the roofs)
  InvisibleBrush1: static
  InvisibleBrush2: static
  InvisibleBrush3: static
