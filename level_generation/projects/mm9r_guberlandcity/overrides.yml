textures:
  'textures\skybox\skymarker.dtx': {alias: sky04, width: 512, height: 512}   # the sky lid: IndoorSky faces (scene override)
  'textures\leveltextures\misc\greenscreen.dtx': {alias: sky04, width: 512, height: 512}   # 218 sky-flagged (0x111) walls of the sky shell
  "water:tank": {alias: WATEQOBX0Z, width: 128, height: 128}   # BlueWater0's surface: MM9's Water115flowing.spr at SurfaceAlpha 0.7 (Water115's first frame; liquids.py w115 at 0.7)
  'textures\leveltextures\misc\soundonly.dtx': {alias: INVIZVJN7N, width: 32, height: 32}   # sound-only brushes: invisible collision
# MM9's window panes (flag 0x8 only: convert.py): translucent faces, portals between rooms
glass:
  window_frame_trans.dtx: {opacity: 1.0, tint: [1.0, 1.0, 1.0], two_sided: true}
  windowlead2x.dtx: {opacity: 1.0, tint: [1.0, 1.0, 1.0], two_sided: true}
  iron_window.dtx: {opacity: 1.0, tint: [1.0, 1.0, 1.0], two_sided: true}
  windowrose.dtx: {opacity: 1.0, tint: [1.0, 1.0, 1.0], two_sided: true}
  windowknight.dtx: {opacity: 1.0, tint: [1.0, 1.0, 1.0], two_sided: true}
  fleur-tall.dtx: {opacity: 1.0, tint: [1.0, 1.0, 1.0], two_sided: true}
  yanmiricenoise.dtx: {opacity: 1.0, tint: [1.0, 1.0, 1.0], two_sided: true}
# The city's open air (../mm9r_common/city/structure.py): street air under the roof line, the air over the roofs one
# room per district, street cuts found automatically.
city:
  weather: rain                    # the outdoor weather over the open sky (the user's decision 2026-11-06; city.hooks.apply_weather)
  merged_top_portals: true          # few large convex top portals over walls and roofs (CITY_PLAYBOOK "The open air" step 3)
  daylight: true                     # sun and sky light on the sectors open to the sky (CITY_PLAYBOOK "Daylight and fog")
  street_top_lt: 192                 # 176 LT over the streets (0-16): under the houses' eaves; the gates (to 160) stay under it
  sky_preset: cloudy                 # the outdoor maps' high-definition sky (was sky_texture plansky3, the old import's)
  outdoor_view: true                 # view distance and haze as an outdoor map's, not MM9's grey fog (INDOOR_OPEN_SKY.md)
  view_distance_scale: 0.5           # 8 096 units at the default view distance setting (16 192), the user's choice
  half_steps: true                   # invisible half steps up standable 50-66 rises (CITY_PLAYBOOK "Raised floors")

# Markel's awards (Prize0-5, the Stuffed Dragon on the shelf of his hall) are world items (dungeon/pickups.py
# NAMED_PICKUPS): drawn standing and facing the hall as MM9 placed them (yaw 180), not at a random turn.
pickups:
  Prize0: {pose: [180, 0, 0]}
  Prize1: {pose: [180, 0, 0]}
  Prize2: {pose: [180, 0, 0]}
  Prize3: {pose: [180, 0, 0]}
  Prize4: {pose: [180, 0, 0]}
  Prize5: {pose: [180, 0, 0]}
