- assert: {inventory_any_member: [{item_id: 11483}]}
- set_pose: {map: hes_d04.blv, x: 3580, y: 700, z: 0, yaw: 0, pitch: 0}
- press_interact: {}
- answer_input: {text: 'Yes'}
- assert: {qbit_set: [100027]}
