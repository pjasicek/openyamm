    start_map: hes_d04.blv
    party:
      members:
      - {name: Ada, class: Knight, level: 75, skills: [], equipment: {}}
- set_pose: {map: hes_d04.blv, x: 3580, y: 700, z: 0, yaw: 0, pitch: 0}
- press_interact: {}
- assert: {qbit_clear: [100027]}
- damage_actor: {actor_index: 36, amount: 100000, tier: kreegan_energy}
- damage_actor: {actor_index: 36, amount: 100000, tier: kreegan_energy}
- advance_runtime: {seconds: 3}
- assert: {actor_visible: {actor_index: 36, dead: true, hp: 0}}
