- set_pose: {map: hes_d04.blv, x: 3180, y: -700, z: -512, yaw: 3.14159265, pitch: -0.72}
- press_interact:
    kind: world_item
    world_item_index: 1
    item_id: 11483
    pose: {map: hes_d04.blv, x: 3180, y: -700, z: -512, yaw: 3.14159265, pitch: -0.72}
