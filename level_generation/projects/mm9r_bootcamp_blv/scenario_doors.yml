# Bootcamp's sliding double doors (MM9 Door pairs Door0/Door1, Door2/Door3 named by DoubleDoorName): one click moves
# both leaves (overrides.yml puts each pair in one mover group; 2026-11-07, before which only one leaf opened).
# Run: ./build/game/openyamm --asset-root output/mm9_rework/isleofashes_blv_root \
#   --headless-run-scenario level_generation/projects/mm9r_bootcamp_blv/scenario_doors.yml --scenario-no-color
id: mm9.bootcamp_double_doors
title: "Bootcamp: a click on a sliding double door opens both leaves"
world: mm9
mode: faithful
tags: [mm9, mm9_rework, doors]
steps:
  - load_map:
      map: bootcamp.blv
  - assert:
      mechanism: {id: 1, state: closed}
  - assert:
      mechanism: {id: 2, state: closed}
  - execute_event: {id: 101}
  - advance_runtime: {seconds: 2.0}
  - assert:
      mechanism: {id: 1, state: open}
  - assert:
      mechanism: {id: 2, state: open}
  - execute_event: {id: 102}
  - advance_runtime: {seconds: 2.0}
  - assert:
      mechanism: {id: 3, state: open}
  - assert:
      mechanism: {id: 4, state: open}
