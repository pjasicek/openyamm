# D5 Relay Spire's map discovery and Vhorrax encounter; P4 owns the mended-ring note 10404.
autonotes:
  - {id: 10220, category: Misc, text: "The Relay Spire stands west of the fork beyond Spinefall Pass, in the southern Brood Spires. The Kreegans grew it around an Ancient relay to watch the sky for their guns."}
  - {id: 10221, category: Misc, text: "Lord Vhorrax, a Kreegan Noble, fought us at the top of the Relay Spire and left laughing at half strength. He means to finish it elsewhere."}
