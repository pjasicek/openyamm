     topics: [9844]}
  - {id: 9599, name: Oda, portrait: design/kreegan_world/art/portraits/x2/hes_pip.png,
     greeting: ["The ring's ours now. We use it for drying cloth.", "The ring's ours now. We use it for drying cloth."],
     topics: [9845]}

topics:
  # Thrix (9509), at his cave (row 10263) and his stall (house 9300).
  - id: 9718
    title: "Who are you"
    lua: |
      -- S5 done: the stall opens; an Engram Core, 20 000 experience, autonote 10415 (P4's SCOUR.md).
      if IsQBitSet(QBit(100105)) then
        evt.SetMessage("Thrix is Thrix. That is new.")
        return
      end
      SetQBit(QBit(100105))
      ClearQBit(QBit(100225))
      AddValue(InventoryItem(11332), 11332)
      AddValue(Experience, 20000)
      SetAutonote(10415)
      evt.SetMessage("Thrix was a digger: dig, carry, die, the song said. One day the song had a hole in it, and Thrix heard the Kept talking through it. Thrix learned, and walked away. Here, a shiny core from the Overseer's box. It is for friends.")
  - id: 9719
    title: "The song"
    lua: |
      evt.SetMessage("The black ones hear the song all the time: the Voice in the Crown, singing. Thrix does not hear it much now. Too far. The quiet is strange. Thrix likes it.")
  - id: 9720
    title: "Vhorrax's Token"
    show_after: 100031
    show_until: 100407
    lua: |
      -- With the Token (11482) Thrix asks which weapon it buys: the three answers are topics 9721-9723 (100406).
      if HasItem(11482) then
        SetQBit(QBit(100406))
        evt.SetMessage("A lord's token! Thrix gives a weapon for it, the best Thrix has. Which? A gun, a blade, or a heavy one?")
      else
        evt.SetMessage("Lord Vhorrax gives tokens to ones who beat him. Thrix would like to see one. Once.")
      end
  - id: 9721
    title: "A gun"
    show_after: 100406
    show_until: 100407
    lua: |
      if not HasItem(11482) then
        evt.SetMessage("The token, friend. Thrix trades for the token.")
        return
      end
      RemoveItem(11482)
      AddValue(InventoryItem(11003), 11003)
      SetQBit(QBit(100407))
      evt.SetMessage("A Lancer Carbine. Thrix will put the token on the wall. Every drudge who walks past will see.")
  - id: 9722
    title: "A blade"
    show_after: 100406
    show_until: 100407
    lua: |
      if not HasItem(11482) then
        evt.SetMessage("The token, friend. Thrix trades for the token.")
        return
      end
      RemoveItem(11482)
      AddValue(InventoryItem(11023), 11023)
      SetQBit(QBit(100407))
      evt.SetMessage("A Plasma Longblade. Thrix will put the token on the wall. Every drudge who walks past will see.")
  - id: 9723
    title: "A heavy one"
    show_after: 100406
    show_until: 100407
    lua: |
      if not HasItem(11482) then
        evt.SetMessage("The token, friend. Thrix trades for the token.")
        return
      end
      RemoveItem(11482)
      AddValue(InventoryItem(11027), 11027)
      SetQBit(QBit(100407))
      evt.SetMessage("A Phase Cleaver. Thrix will put the token on the wall. Every drudge who walks past will see.")
  # Tarro (9514), at his lean-to (house 9301).
  - id: 9739
    title: "The Scour"
    lua: |
      evt.SetMessage("Strip mines, all of it, from the canyon to the Foundry. Five work camps full of collared Kept, troopers in squads on the roads, Overseers over the pit. The quarry fort on the mesa east of here. The Pens in the pit to the south-east. The Foundry north, by their road to the city. Don't go up that road yet.")
  - id: 9740
    title: "The canyon"
    lua: |
      evt.SetMessage("Up the west canyon there's a cave, and a black one lives in it who talks like a person. Lorn at the Last Lamp tells it as a tale. It isn't one. I've traded with him, and he's never shot at me.")
  - id: 9741
    title: "Tablets"
    lua: |
      evt.SetMessage("Three of the colony's log tablets out here that I know of: one by the old mine road past the mesa, one at the edge of the slag field to the east, one among the old survey markers in the south. Pell will want them.")
  # Ansel (9221, skills.yml's Grandmaster Energy Blades teacher), camp 5.
  - id: 9754
    title: "The ring"
    lua: |
      evt.SetMessage("I fought their nobles in the ring for years. They like a long fight; I learned to end one. Their shields have a seam. When all five camps are free, come back and I'll show you where to strike.")
  # The freed Kept of the camps (one topic each).
  - {id: 9836, title: "The wreck", lua: 'evt.SetMessage("The dead ship by the road. We cut plate off it for the black ones. They would not go inside it themselves.")'}
  - {id: 9837, title: "Down below", lua: 'evt.SetMessage("One of us has gone down to the old town already. The rest stay till the camps are all free.")'}
  - {id: 9838, title: "The Foundry", lua: 'evt.SetMessage("Every cart we filled went north up the conveyors to the Foundry. The heat comes off it like a wall.")'}
  - {id: 9839, title: "Overseers", lua: 'evt.SetMessage("Kill the one on the perch and the collars die with it. They never told us that. We learned it watching.")'}
  - {id: 9840, title: "The pit", lua: 'evt.SetMessage("Down on the floor there''s a machine bigger than a house, eating the ground. It stops to dig, now and then, and opens up. That''s when you hit it.")'}
  - {id: 9841, title: "Thrix", lua: 'evt.SetMessage("There''s a black one in a cave up the west canyon that talks. Talks! He threw us food once, over the fence. Don''t kill him.")'}
  - {id: 9842, title: "The depot", lua: 'evt.SetMessage("The supply depot past the terraces is full of crates and troopers. And a pylon. They''ll ring it if they see you.")'}
  - {id: 9843, title: "The road north", lua: 'evt.SetMessage("The Kreegan Road goes north to their city. Nobody we sent up it came back down.")'}
  - {id: 9844, title: "Ansel", lua: 'evt.SetMessage("They made him fight in the ring for the Overseers to watch. He never lost. Not once. Ask him to teach you.")'}
  - {id: 9845, title: "The camps", lua: 'evt.SetMessage("Five camps on the Scour. Every one you free, the black ones have fewer hands. And we have more.")'}

autonotes:
  - {id: 10100, category: Misc, text: "The Scour: the Kreegans' strip mines. Five work camps hold the Kept; the Foundry smokes in the north."}
  - {id: 10101, category: Misc, text: "The Harvester is dead; its core, the lander's Energy Core, lay in the pit."}
  - {id: 10103, category: Misc, text: "The supply depot's pylon calls drop pods."}
  - {id: 10105, category: Misc, text: "All five work camps on the Scour are free."}

