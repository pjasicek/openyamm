# The Scour's people (hes_out2; stage.py merges npcs_*.yml with npcs.yml): Thrix the deserter at his cave and stall
# (house 9300, from S5), Tarro the scout at his lean-to (house 9301), and the ten freed Kept of the five work camps
# (street actors of rows 10260/10261, shown from their camp's bit). Ansel (9221) is a Grandmaster teacher row of
# skills.yml; his extra topic (9754) is here. Texts: P4's design/kreegan_world/quests/dialogue/SCOUR.md; places:
# design/kreegan_world/zone2/THE_SCOUR.md section 16. Placed by level_generation/projects/hesper_out2/build_out2.py.
#
# QBits: 100105 S5 done (Thrix's first topic), 100225 S5 given, 100031 Vhorrax's token given (D5); P1's map state
# 100406 Thrix asked which weapon the token buys, 100407 the token traded (the three choices are topics 9721-9723,
# MM-style, as the dialogue has no choice buttons); the camps' bits 100115-100119; 100106 S6 done.

npcs:
  - id: 9509
    name: Thrix
    portrait: design/kreegan_world/art/portraits/x2/hes_thrix.png
    house: 9300
    greeting:
      - "Do not shoot. Thrix does not shoot. You are the soft ones from the sky. Thrix heard."
      - "Friends! Thrix is glad. Trade?"
    topics: [9718, 9719, 9720, 9721, 9722, 9723]
  - id: 9514
    name: Tarro
    portrait: design/kreegan_world/art/portraits/x2/hes_scout_2.png
    house: 9301
    greeting:
      - "Take the dry path over. The slag beside it is still hot. Tarro's the name; I have supplies from Landfall."
      - "Still breathing? Good. Buying?"
    topics: [9739, 9740, 9741]
  # The freed Kept, two at each camp (the second of a pair shares the first's face, NPCS.md).
  - {id: 9590, name: Dunn, portrait: design/kreegan_world/art/portraits/x2/hes_dunn.png,
