  - {id: 9591, name: Marra, portrait: design/kreegan_world/art/portraits/x2/hes_dunn.png,
     greeting: ["We'll stay. Somebody has to keep the road.", "We'll stay. Somebody has to keep the road."], topics: [9837]}
  - {id: 9592, name: Gorse, portrait: design/kreegan_world/art/portraits/x2/hes_gorse.png,
     greeting: ["Free. Wire in my hair and nothing round my neck.", "Free. Wire in my hair and nothing round my neck."],
