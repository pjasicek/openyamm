  - {id: 9595, name: Sae, portrait: design/kreegan_world/art/portraits/x2/hes_ruck.png,
     greeting: ["I have nothing to give you yet. If you come back, I'll try to have food.", "I have nothing to give you yet. If you come back, I'll try to have food."], topics: [9841]}
  - {id: 9596, name: Harl, portrait: design/kreegan_world/art/portraits/x2/hes_harl.png,
