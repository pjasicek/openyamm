skills:
  - name: EnergyGuns
    description: "Kreegan ranged guns: pistols, carbines, rifles, the scatter lance and the cannon, on top of Blaster, the way Armsmaster works. Raised with tech points from Engrams; taught by Landfall's teachers."
    novice: "+1% damage per rank with Kreegan guns (Expert 4%, Master 7%, Grandmaster 10%)"
    expert: "Shots deal +25% damage to shields (with the shield system)"
    master: "Shots deal +20% damage to exposed bodies (with the shield system)"
    grandmaster: "+1 projectile on every third shot (with the shield system)"
  - name: EnergyBlades
    description: "Kreegan melee weapons, on top of their classic weapon skill, the way Armsmaster works. Raised with tech points from Engrams."
    novice: "+2% damage per rank with Kreegan melee weapons (Expert 6%, Master 10%, Grandmaster 15%)"
    expert: "Hits deal +25% damage to shields (with the shield system)"
    master: "Shield cleave (with the shield system)"
    grandmaster: "Overload: 10% chance per hit to halve the target's shield (with the shield system)"
  - name: ShieldTech
    description: "Off-hand emitters and the personal shield. Raised with tech points from Engrams. Its effects come with the shield system."
    novice: "Can use emitters; an emitter's pool x (1 + rank x 10%)"
    expert: "Regeneration delay -1 s"
    master: "The shield also absorbs elemental damage"
    grandmaster: "Hardened: Energy hits deal x1.25 instead of x1.5 while the shield is down"
  - name: Hacking
    description: "Terminals, collar nodes, turret consoles, alarm pylons and Ancient locks; never monsters. Event checks use the party's best hacker. Raised with tech points from Engrams."
    novice: "Level-1 terminals, collar nodes, pylons"
    expert: "Level-2 terminals, Grid Control"
    master: "Level-3 terminals; turn a room's turrets"
    grandmaster: "Ancient root locks and mech consoles"
  - name: Cybernetics
    description: "Implants: the sockets that hold them and how strongly they work. Raised with tech points from Engrams; learned at the Clinic and the Sim Hall, taught by Landfall's teachers and Doctor Ilse."
    novice: "1 implant socket; implants +5% per rank"
    expert: "2 implant sockets"
    master: "3 implant sockets"
    grandmaster: "4 implant sockets"
