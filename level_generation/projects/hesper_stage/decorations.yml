# The Hesper 3D decorations the stage cooks and binds (stage.py): one decoration_data row and one
# worlds/hesper/models/decorations.yml binding each. Sources are the project exports in
# level_generation/props/hesper_decorations/work/ (models in metres, 1 m = 100 world units: the binding's height is
# the model's height x 100). radius: collision radius in world units (0: the party walks through it).
# light: [radius, r, g, b] for a decoration that is also a light (the native decoration light).
# model: the model of another entry, for a variant with its own light (the outdoor fixtures).
# mount: wall hangs the model's back (its -z in glTF, Blender +y) on the nearest wall within 64.
# turn_in: [degrees, seconds] turns a model into its pose when a script swaps a decoration to it.
source_dirs:
  - level_generation/projects/hesper_d07/standins
  - level_generation/projects/hesper_nodes_common/standins
  - level_generation/projects/hesper_d04/standins
  - level_generation/creatures/hes_ion_cannon_codex/export   # the great ion cannon's seven states, over the stand-in
  - level_generation/props/hesper_decorations/work/hard_surface
  - level_generation/props/hesper_decorations/work/codex_tex
  - level_generation/props/hesper_pickups_claude/work/export   # the pickups (PICKUPS.md)
  - level_generation/projects/hesper_out3/standins           # the Brood Spires' greybox stand-ins, last
  - level_generation/creatures/hes_machines_claude/export        # the colony turret's pedestal (D0)
  - level_generation/creatures/hes_noble_bosses_claude/export   # the Hierarch's throne (D12)
