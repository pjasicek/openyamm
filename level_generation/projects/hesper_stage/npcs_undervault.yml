  title: Sell salvage
  lua: |
    HesperWorkshop.buySalvage()
- id: 9700
  title: Pressure
  show_until: 100114
  lua: |
    -- S2: given here (100222), done in D2 (its filter console, 100102), Odo's thanks (100114).
    if IsQBitSet(QBit(100102)) then
      ClearQBit(QBit(100222))
      SetQBit(QBit(100114))
      AddValue(InventoryItem(11332), 11332)          -- an Engram Core (an Engram until CR-INT-1)
      AddValue(Experience, 10000)
      AddValue(ReputationInCurrentLocation, -1)
      evt.SetMessage("Water's running! Clean as the founders drank it. Here: a training engram core my grandfather found in the pipes. Never knew what to do with it.")
      return
    end
    if IsQBitSet(QBit(100222)) then
      evt.SetMessage("Three valves, one big glassy beast, one console. The canyon south-east of your crater.")
      return
    end
    SetQBit(QBit(100222))
    evt.SetMessage("The Pumping Station in the canyon feeds us and Landfall both, and it's choked: glass growing in the filters, the cistern flooded, and something big nesting in the beds. Drain it, clear the beds, run the filter console. You'll find the old door through the Water Works opens from the far side.")
- id: 9766
  title: The walls
  lua: |
    evt.SetMessage("Four bastions on the gates, seven wards on the wall. Old guns, kept up. They don't like seekers and they don't like anything bigger either.")
- id: 9767
  title: Ashrunners
  lua: |
    if IsQBitSet(QBit(100101)) then
      evt.SetMessage("You brought the crawler home? Then you have a camp of friends who shoot straight. Treasure that.")
      return
    end
    evt.SetMessage("The camp north-west of Landfall lost a crawler to the scrapyard east of the apron. Bring it home and Garrow will call you friend. He means it, too.")
- id: 9830
  title: The Pens
  lua: |
    evt.SetMessage("They fed us once a day and the collar did the rest. If you go back there, burn it.")
- id: 9831
  title: Work
  lua: |
    evt.SetMessage("I can carry, dig and shoot straight. Pay me and I will walk behind you anywhere but back.")
- id: 9832
  title: The wreck
  lua: |
    evt.SetMessage("We cut plate off the dead ship by the road. Old bones, gray. The black ones were afraid of it.")
- id: 9833
  title: The Foundry
  lua: |
    evt.SetMessage("Every load we cut went north to the Foundry. Every gun that came back pointed at us.")
- id: 9834
  title: The pit
  lua: |
    evt.SetMessage("The Harvester ate the ground and we ate dust. When it stopped grinding I slept a whole night.")
- id: 9835
  title: Overseers
  lua: |
    evt.SetMessage("They fly, they shout, they never get tired. But they bleed like anyone. Kill the one on the perch first.")
