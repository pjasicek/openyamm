topics:
- id: 9660
  title: The Council
  lua: |
    evt.SetMessage("Seven families sit on the Council, as the founders' seven crews did. We keep the water, the light, the Archive and the peace. Landfall keeps the walls. The Guardian keeps us. It has been enough to live on. It has not been enough to win.")
- id: 9661
  title: Borrowed Shields
  show_until: 100005
  lua: |
    -- M5: given here (100205), Krav killed in D3 (P1's 100024), done here (100005).
    if IsQBitSet(QBit(100024)) then
      ClearQBit(QBit(100205))
      SetQBit(QBit(100005))
      AddValue(InventoryItem(11332), 11332)
      AddValue(Experience, 20000)
      AddValue(ReputationInCurrentLocation, -1)
      evt.SetMessage("Krav is dead. The crews went out this morning; two of them sang. Keep the bucklers, and take this: a training core from the founders' academy, the Council's to give.")
      return
    end
    if IsQBitSet(QBit(100205)) then
      evt.SetMessage("Krav still holds the Quarry. The Scour, east of the Reach, on the mesa.")
      return
    end
    SetQBit(QBit(100205))
    evt.SetMessage("Our salvage crews go out to the old colony sites for alloy and cells; it is how we eat. For a year the devils of the Quarry Outpost, on the Scour east of the Reach, have taken them: the crews, their gear, their bucklers. Their Overseer is called Krav. Kill him, and the crews go out again. Whatever shields you find in his stores, keep them. Consider them borrowed.")
- id: 9662
  title: The Kept
  show_after: 100003
  show_until: 100006
  lua: |
    -- M6: given here (100206), Tamsin (100025) and Ilse (100026) freed in D4 (P1's events 72, 73), done here (100006).
    local tamsin, ilse = IsQBitSet(QBit(100025)), IsQBitSet(QBit(100026))
    if tamsin and ilse then
      ClearQBit(QBit(100206))
      SetQBit(QBit(100006))
      AddValue(InventoryItem(11332), 11332)
      AddValue(Experience, 20000)
      AddValue(ReputationInCurrentLocation, -1)
      SetAutonote(10405)
      evt.SetMessage("They are home, both of them, and thin as wire. Tamsin is already arguing with the Refuge's pumps; Ilse has taken the Clinic. The Council owes you this: the founders' last training core.")
      return
    end
    if not IsQBitSet(QBit(100206)) then
      SetQBit(QBit(100206))
      evt.SetMessage("The devils keep our taken in the Labor Pens, a pit on the Scour with cages round it. They call them the Kept. Two of them we need above all: Tamsin, who could mend anything the founders built, and Doctor Ilse, who could mend us. Bring them home. Free whoever else you can; the collars are worked from a control room inside.")
    elseif tamsin then
      evt.SetMessage("Tamsin is home. Ilse is still in that place.")
    elseif ilse then
      evt.SetMessage("Ilse is home. Tamsin is still in that place.")
    else
      evt.SetMessage("The Labor Pens, on the Scour. Tamsin and Ilse.")
    end
- id: 9670
  title: The Pens
  lua: |
    evt.SetMessage("Four years of cutting resin for the black ones. They kept me because I could make their stolen machines run. I made them run badly, quietly, when I could. The collars sing to the Lattice. Break the song and the collar is just a ring of metal.")
- id: 9671
  title: Collars Off
  lua: |
    -- S6: given here (100226), the five camps freed on the Scour (P1's 100115-100119, all five 100106), the reward 100120.
    if IsQBitSet(QBit(100120)) then
      evt.SetMessage("Five free camps. The Refuge is full of names again.")
      return
    end
    if IsQBitSet(QBit(100106)) then
      ClearQBit(QBit(100226))
      SetQBit(QBit(100120))
      AddValue(InventoryItem(11332), 11332)
      -- Not staged yet (hesper_stage/items.yml): the Combat Reflex II (11211), an implant: AddValue(InventoryItem(11211), 11211)
      AddValue(Experience, 20000)
      evt.SetMessage("All five camps free. Here, take this training core the devils were keeping, and a reflex graft I took off an Overseer's bench. And Ansel at the pit-fighters' camp says he will teach you the blade, the way he learned it. He means it kindly.")
      return
    end
    if IsQBitSet(QBit(100226)) then
      local free = 0
      for _, bit in ipairs({100115, 100116, 100117, 100118, 100119}) do
        if IsQBitSet(QBit(bit)) then
          free = free + 1
        end
      end
      evt.SetMessage(({[0] = "None", "One", "Two", "Three", "Four", "Five"})[free] .. " of the five camps free.")
      return
    end
    SetQBit(QBit(100226))
    SetAutonote(10406)
    evt.SetMessage("There are five work camps on the Scour, full of people like me. Every camp has a collar node, a post the collars listen to. Open it with a hacker's hands and every collar in that camp falls off. Or kill the camp's Overseer: the collars die with him. Do it for all five.")
- id: 9672
  title: The Lattice
  show_after: 100006
  lua: |
    -- The nodes' hearts (P3's 100009 East, 100010 West, 100014 North); the three node quests as Aster's 9633 gives them.
    local down = 0
    for _, bit in ipairs({100009, 100010, 100014}) do
      if IsQBitSet(QBit(bit)) then
        down = down + 1
      end
    end
    if down == 3 then
      evt.SetMessage("The Lattice is dead. I watched the collar-light in the Refuge go out in every scar at once.")
    elseif down > 0 then
      evt.SetMessage(({[0] = "None", "One", "Two", "Three", "Four", "Five"})[down] .. " down. Same trick for the rest.")
    else
      if not IsQBitSet(QBit(100209)) and not IsQBitSet(QBit(100210)) and not IsQBitSet(QBit(100214)) then
        SetQBit(QBit(100209))
        SetQBit(QBit(100210))
        SetQBit(QBit(100214))
        SetAutonote(10410)
      end
      evt.SetMessage("I grafted resin onto Node North for a year; I know how they're built. Each heart hangs on three couplings. A master hacker shuts them at their terminals and nothing knows you were there. Without one, a Breach Charge on each coupling: loud, and it wrecks the vault, but the heart dies the same.")
    end
- id: 9673
  title: Node North
  show_after: 100014
  show_until: 100051
  lua: |
    AddValue(InventoryItem(11332), 11332)
    SetQBit(QBit(100051))
    evt.SetMessage("You took Node North. I fused cells into that thing with a collar on my neck. Here. A training core I stole off their bench the week before you came. I was saving it for something good.")
- id: 9680
  title: Implants
  lua: |
    evt.SetMessage("Four sockets in the body, if you let me cut. The Ancients made the ports; the devils grow parts that fit them, because they took the patterns from us. Two of the same family do not add up; the better one counts. I will name what you bring me, and mend it if it is cracked.")
- id: 9681
  title: Glass Hunt
  show_after: 100006
  show_until: 100104
  lua: |
    -- S4: given here (100224), three Glassback Hearts (11485, the Glassfields' drops) handed in at once (100104).
    local hearts = 0
    for _, member in ipairs(PartyMembers()) do
      hearts = hearts + PlayerItemCount(member, 11485)
    end
    if hearts >= 3 then
      RemoveItem(11485)
      RemoveItem(11485)
      RemoveItem(11485)
      ClearQBit(QBit(100224))
      SetQBit(QBit(100104))
      -- Not staged yet (hesper_stage/items.yml): the Ablative Lattice II (11205), an implant: AddValue(InventoryItem(11205), 11205)
      -- An Engram Core (11332; an Engram until CR-INT-1's larger supply).
      AddValue(InventoryItem(11332), 11332)
      AddValue(Experience, 10000)
      AddValue(ReputationInCurrentLocation, -1)
      evt.SetMessage("These hearts are sound. I can use them. Take this ablative lattice and an engram core I took off a Kreegan surgeon's tray.")
      return
    end
    if IsQBitSet(QBit(100224)) then
      evt.SetMessage(({[0] = "None", "One", "Two", "Three", "Four", "Five"})[hearts] .. " of three hearts.")
      return
    end
    SetQBit(QBit(100224))
    evt.SetMessage("The glassbacks in the Glassfields grow a crystal heart that takes an energy hit and spreads it thin. Three of those and I can grow you an ablative lattice: energy runs off you like rain. They shrug off your guns; take blades.")
- id: 9734
  title: The bay
  show_until: 100006
  lua: |
    evt.SetMessage("The Ancients built this bay to fit implants. I can sell them and set them in. I cannot tell you what an unknown one does, or mend a broken one. There was a surgeon who could. The devils took her to the Pens.")
- id: 9735
  title: Doctor Ilse
  show_after: 100006
  lua: |
    evt.SetMessage("She is back, and she has taken over, and I have never been so glad to be ordered about.")
- id: 9685
  title: The Sim Hall
  lua: |
    evt.SetMessage("The hall makes enemies out of light: they hit like the real ones and die like them, and nobody stays dead. I train your levels here, the old way. And for anyone who joins you late, the rigs teach the first steps of the four disciplines, free.")
- id: 9686
  title: The Ranks
  lua: |
    -- S8: given here (100228); the ranks won in the arena (100121 Bronze, 100122 Silver, 100123 Gold): the arena's waves
    -- are not built yet (hesper_undervault README).
    if IsQBitSet(QBit(100123)) then
      evt.SetMessage("Gold. I've seen it done twice. You're the second.")
    elseif IsQBitSet(QBit(100122)) then
      evt.SetMessage("Silver. The masters up top will hear of it.")
    elseif IsQBitSet(QBit(100121)) then
      evt.SetMessage("Bronze. Not bad.")
    else
      if not IsQBitSet(QBit(100228)) then
        SetQBit(QBit(100228))
        SetAutonote(10416)
      end
      evt.SetMessage("Three ranks in the ring. Bronze pits you against the Reach's creatures, Silver against the Scour's, and Gold against what waits in the Crown. Each has a prize. Win Silver and the masters up top give you half-price lessons; they owe me.")
    end
- id: 9690
  title: The Archive
  lua: |
    evt.SetMessage("The founders' records, the colony's laws, a thousand years of the Hesperians' births and deaths: all here, or most. The oldest records are in the founders' dome on the surface, sealed since the fall. And the colony's log tablets lie all over the four lands, where the colonists set them; I would give a great deal for every one.")
- id: 9691
  title: The Old Line
  show_after: 100050
  show_until: 100017
  lua: |
    if IsQBitSet(QBit(100217)) then
      evt.SetMessage("The Deep Stair, behind the Lift Gate. A Grandmaster's hands.")
      return
    end
    SetQBit(QBit(100217))
    SetAutonote(10411)
    evt.SetMessage("The founders' record names it: the Old Line, the freight line the Ancients ran under the planet, from our Deep Stair to the core of what is now the Crownspire. It is sealed with a root lock, the deepest kind. A Grandmaster's hands would open it; Iver teaches that, if the Guardian has given him the codes. At its far end, Grid Control could kill the cannons from inside.")
- id: 9692
  title: After the line
  show_after: 100017
  lua: |
    evt.SetMessage("You rode the Old Line. The Ancients built it and we forgot it was there for a thousand years. Write it all down for me, every station.")
- id: 9694
  title: Dead Letters
  show_until: 100109
  lua: |
    -- S9: given here (100229); every tablet carried (11360-11371) taken at once, each its bit (100124-100135) and Pell's
    -- line (READABLES); the twelfth closes it (100109, the Old Line known 100050).
    local lines = {
      "The Starport, busy! I have never seen a green board in my life.",
      "She knew. Or the other one did.",
      "The Glassfields. I always thought they were older than that.",
      "The Kept began on the second day. Two days.",
      "Ilka Mar, of Sesha's line. Her name is in our families' book.",
      "The collars, on the sixth day. Tamsin should read this.",
      "The Brood Spires were a marsh. A marsh! With birds, the old books say.",
      "The ninth day. Aster remembers the ninth day.",
      "The going below. My family's book starts here.",
      "So that is what the Crown is. It was our core. It was ours.",
      "The Old Line! Here it is, in his own words.",
      "Sel Ek, of Torvan Ek's line, kept this Archive before me. I know his name. Now I know what he saw."
    }
    local text, taken, held = "", 0, 0
    for k = 1, 12 do
      if not IsQBitSet(QBit(100123 + k)) and HasItem(11359 + k) then
        RemoveItem(11359 + k)
        SetQBit(QBit(100123 + k))
        text = text .. lines[k] .. " "
        taken = taken + 1
      end
      if IsQBitSet(QBit(100123 + k)) then
        held = held + 1
      end
    end
    if held == 12 then
      ClearQBit(QBit(100229))
      SetQBit(QBit(100109))
      SetQBit(QBit(100050))
      -- Not staged yet (hesper_stage/items.yml): the Last Light of Hesper (11428): AddValue(InventoryItem(11428), 11428)
      AddValue(InventoryItem(11332), 11332)
      SetAutonote(10417)
      AddValue(Experience, 40000)
      AddValue(ReputationInCurrentLocation, -1)
      evt.SetMessage(text .. "All twelve. Now we know how it ended, and where the Old Line goes. Take the Last Light of Hesper from our vault, and a training core. You've brought our history home.")
      return
    end
    if not IsQBitSet(QBit(100229)) then
      SetQBit(QBit(100229))
      if taken == 0 then
        evt.SetMessage("The colony set log tablets on plinths across the four lands: twelve, the old inventory says. Each is a page of the colony's last year. Bring them to me as you find them; read them first, if you like. Together they tell how we fell.")
        return
      end
    end
    evt.SetMessage(text .. held .. " of twelve.")
- id: 9695
  title: The founder's head
  show_after: 100301
  lua: |
    evt.SetMessage("You set the founder's head back on the statue. A thousand years a trophy in their palace, and now the founder looks at the Starport again. I'll put it in the record.")
- id: 9731
  title: The Workshop
  lua: |
    evt.SetMessage("The Ancients' fabricator still runs, if you feed it. I fit one mod to a weapon, a body piece, a helm, a cloak or an emitter: two kinds from the start, two more once the devils start losing. Gold and salvage, and you know what you get before I start. And I buy alloy and cells at full weight; no one up top pays you better.")
# The Workshop's four mods (ITEMS "Workshop mods"; HesperWorkshop.fit, common/workshop.lua; the world's
# workshop_mods table ids 1-4).
