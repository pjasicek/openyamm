# The maps' music (map_stats Track; GameAudioSystem plays Music/<N>.mp3 on map entry and loops it): the music jobs'
# 320 kbit/s MP3s (out/<job>/<job>.mp3, from the FLAC masters) as worlds/hesper/music/<N>.mp3. MAPS.md, Music: the
# Undervault gets the warm town track. Music is per map: Landfall's own district on hes_out1 cannot have it until the
# engine has per-area music. The ambience beds stay installed as sounds; the engine has no ambience loop under the
# music, so they play nowhere for now (AUDIO.md, Engine needs).
music:
  101: hes_music_starport          # Starport Reach, the surface
  102: hes_music_facility          # the Ancient facilities
  103: hes_music_landfall          # Landfall's people: the Undervault
  104: hes_music_kreegan           # the Kreegan hives and works
  105: hes_music_lattice           # the Lattice power cores
  106: hes_music_undercroft        # deep Ancient transit and archives
  107: hes_music_crownspire        # the Crownspire, the final dungeon
  108: hes_music_crown             # the Crown, the Kreegan fortress-city plateau (2026-10-24)
# Every Hesper map, built or not: a map not yet in maps.yml is skipped until it is registered, then gets its track
# the moment it is built. No Hesper map may keep its reference row's MM6/MM7 track (sci-fi.blv plays 46, the Control
# Center's).
map_tracks:
  hes_out1.odm: 101                # Starport Reach
  hes_out2.odm: 101                # The Scour (MAPS.md: the surface is low synth drones under a sparse orchestra)
  hes_out3.odm: 101                # Brood Spires
  hes_out4.odm: 108                # The Crown (its own grim martial theme since 2026-10-24; was 101)
  hes_undervault.blv: 103          # the Undervault (MAPS.md: warm strings, hand percussion)
  hes_d00.blv: 102                 # D0 Hangar Nine
  hes_d01.blv: 102                 # D1 Starport Terminal
  hes_d02.blv: 102                 # D2 Pumping Station
  hes_d03.blv: 104                 # D3 Quarry Outpost
  hes_d04.blv: 104                 # D4 Labor Pens
  hes_d05.blv: 104                 # D5 Relay Spire (Kreegan grafted)
  hes_d06.blv: 105                 # D6 Lattice Node West
  hes_d07.blv: 105                 # D7 Lattice Node East
  hes_d08.blv: 104                 # D8 The Foundry
  hes_d09.blv: 104                 # D9 Brood Pits (organic: a brood track would fit better, AUDIO.md)
  hes_d10.blv: 106                 # D10 Colony Archive (lonelier than D0-D2's 102, and heard after them)
  hes_d11.blv: 104                 # D11 The Seedship (organic: a brood track would fit better, AUDIO.md)
