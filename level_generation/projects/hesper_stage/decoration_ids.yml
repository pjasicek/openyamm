# The Hesper decorations' ids (decoration_data.txt row numbers, '#'), append-only (the integrator, 2026-10-23). Built
# maps store these numbers less one (decoration_list_id), so a decoration keeps its id for good: stage.py gives a new
# decoration the next free id and appends it here, and refuses to drop one (a removed decoration would shift or orphan
# the ids maps were built with). The rows are the hesper world's own decorations contribution (world.yml range
# 3001-3999, devdocs/WORLD_DECORATION_CONTRIBUTIONS.md); until 2026-10-29 they were 674-934, appended to the engine's.
