topics:
  # Garrow (9507), from S1.
  - id: 9705
    title: "The Foundry"
    show_after: 100101
    show_until: 100012
    lua: |
      -- M12 (Re-entry) from Garrow: given here or by the Pilot (100212), done once the emitter is fitted in D0 (100043).
      if IsQBitSet(QBit(100043)) then
        ClearQBit(QBit(100212))
        SetQBit(QBit(100012))
        AddValue(Experience, 30000)
        evt.SetMessage("You gutted the Foundry. My people will sleep tonight. Dace wants a word; he says you've earned the trick of holding a field under fire.")
      elseif IsQBitSet(QBit(100212)) then
        evt.SetMessage("The Foundry, north on the Scour, by the Kreegan Road. The plate stores are at the back.")
      else
        SetQBit(QBit(100212))
        evt.SetMessage("North on the Scour the black have a Foundry, and every gun that hunts my people comes out of it. They keep old emitters in its plate stores, big ones, the kind a ship wears. Your Pilot wants one, they say. Go take it, and burn the place if you can.")
      end
  - id: 9706
    title: "The crawler"
    show_after: 100101
    show_until: 100113
    lua: |
      -- S1's reward: an Engram Core (11332; an Engram until CR-INT-1's larger supply), once (100113).
      SetQBit(QBit(100113))
      AddValue(InventoryItem(11332), 11332)
      AddValue(Experience, 10000)
      evt.SetMessage("That crawler is my grandmother's. We were three days digging her out of the ash after the black ones took her. You brought her home without a scratch on her that wasn't there before. Here: a colony engram core, out of her old locker. Fair trade.")
  - id: 9707
    title: "The derelict"
    show_after: 100101
    lua: |
      evt.SetMessage("On the Scour, by the north-west rim, there's a dead ship half buried in the spoil: one of theirs, old as the comet, gray as bone. The black ones won't go inside it; their Kept cut plate off it. My people go in. The salvage is good, if you don't mind the drudges.")
  - id: 9708
    title: "Ashrunners"
    show_after: 100101
    lua: |
      evt.SetMessage("Our ancestors walked out of the old town when the Council said stay below. We've lived on the surface ever since. We call ourselves Ashrunners; we go where the salvage is and shoot what shoots first.")
  # Kesh (9508), in her stall (house 9458).
  - id: 9715
    title: "Breach Charges"
    lua: |
      evt.SetMessage("Three of these on a node's couplings and the heart dies loud. One opens a door that won't. Don't stand next to it.")
  - id: 9716
    title: "Couplers"
    lua: |
      evt.SetMessage("An arc coupler in the arm, and your old iron bites their shields. Not much. Enough.")
  - id: 9717
    title: "EMP"
    lua: |
      evt.SetMessage("Rare. Throw it, and every shield near the blast loses half what it had. Machines stop for a breath. Don't waste them on drudges.")
  # The camp folk (P4's ASHRUNNERS, The camp folk).
  - id: 9854
    title: "The shout"
    lua: |
      evt.SetMessage("I warn once. Garrow's rule. The second time I don't shout.")
  - id: 9855
    title: "The old days"
    lua: |
      evt.SetMessage("My grandmother said the old town had a lamp for every door. We have a fire for every crawler. Ours is warmer.")
  - id: 9856
    title: "The crawler"
    lua: |
      evt.SetMessage("Three hundred years old and she still climbs a dune. They don't make anything like her any more. Nobody makes anything any more.")
  # Brask (9516), in Salvage & Arms (house 9201).
  - id: 9745
    title: "Kreegan arms"
    lua: |
      evt.SetMessage("Their guns are our guns, grown over. Pull the resin off a pulse pistol and there's colony work under it; that's why they fire in your hands at all. The first lesson's at my counter: how to hold one and not lose your fingers. Past that, Corra and Halder for guns, Edda and Rusk for blades, all on Main Street.")
  - id: 9746
    title: "Salvage"
    lua: |
      evt.SetMessage("Kreegan alloy and ion cells: I buy them, the Workshop below buys them better. Everything else, I pay what I can, and it isn't much. Gold's scarce up here. We weigh it.")
  # Ysel (9517), in the Emitters (house 9202).
  - id: 9747
    title: "Shields"
    lua: |
      evt.SetMessage("Everything you wear out there should carry a field: armor, emitter, an implant if you can afford it. They all add up to one shield, and it grows back if you get out of the line of fire for a few breaths. A shield cell refills it at once. A buckler on the arm is the big one. Learn to hold it here; Fenna and Tove teach the rest.")
  - id: 9748
    title: "The devils' shields"
    lua: |
      evt.SetMessage("Theirs come in three strengths. Light, our bolts and blades still bite. Standard, barely. The nobles' kind, not at all: you need their own weapons or a coupler on yours. And no spell touches a raised shield. Break it, then hit what's under it.")
  # Mother Ama (9518), in Provisions (vendor 9450). Food: Hesk's rations from S10 (100110).
  - id: 9749
    title: "Food"
    show_until: 100110
    lua: |
      evt.SetMessage("Fungus bread, cave fish, algae cake. Everything we eat we grow in the dark or haul from the Garden past the pass, so it costs. I don't like the prices any more than you do. If Hesk's garden ever grew enough, we'd all eat cheaper.")
  - id: 9750
    title: "Food"
    show_after: 100110
    lua: |
      evt.SetMessage("Hesk's rations come down the pass by the crate now. You'll find them at the Last Lamp. Thank you for that; the children are fatter for it.")
  # Lorn (9519), in the Last Lamp (house 9451). Water: the pumps cleared (S2, 100102). Rumors: S5 given (100225)
  # until Thrix has been found (100105, his first topic, npcs_scour.yml).
  - id: 9751
    title: "The Last Lamp"
    lua: |
      evt.SetMessage("When the sky was lost, the founders' people went below. The last ones out lit a lamp on this spot so the scouts could find the lift in the ash. The lamp's still lit. So is the inn.")
  - id: 9752
    title: "Water"
    lua: |
      if IsQBitSet(QBit(100102)) then
        evt.SetMessage("The water's running clean since you cleared the pumps. First clean water this inn has poured in years. Don't tell the Warden; she'll want to tax it.")
        return
      end
      evt.SetMessage("Everything costs double up here, water most of all. The pumps in the canyon went sour years ago; we buy what the old town can spare. Odo the plumber says he could fix it, if somebody cleared the Pumping Station.")
  - id: 9770
    title: "Rumors"
    lua: |
      if IsQBitSet(QBit(100105)) then
        evt.SetMessage("Thrix, they call him now. A devil with a shop. What a world.")
        return
      end
      SetQBit(QBit(100225))
      evt.SetMessage("There's a story the scouts tell: a black one living in a cave up the Scour's west canyon, who talks like you and me and has never shot at anyone. Tarro swears it's true. Tarro also swears he once outran a Harvester.")

