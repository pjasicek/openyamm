# Starport Reach's people beyond the arrival (stage.py merges npcs_*.yml with npcs.yml): the Ashrunner camp from S1,
# Kesh's stall and Venn's shop (vendors), the keepers of Landfall's houses 1-4 (Salvage & Arms 9201, the Emitters 9202,
# Provisions 9450, the Last Lamp 9451), Landfall's home residents (houses 9461-9470) and its six street people (on
# villager actors). Texts: P4's design/kreegan_world/quests (dialogue/ASHRUNNERS.md, LANDFALL.md, NPCS.md, QUESTS.md
# S1), wired by the integrator's follow-ups 24, 36, 39-41 (WORK_PACKAGES/requests/P4.md). Built and placed by
# level_generation/projects/hesper_out1/build_out1.py (actor npc ids, house doors, the camp's events).
#
# Dace (9224, Grandmaster Shield Tech) is a teacher row of skills.yml, his topic 9756 in npcs.yml; Venn (9513) is in
# npcs.yml (her shop is vendor 9460 below). The news topics 9771-9790 are npcs.yml's.
# The home residents and street people have one short greeting each (LANDFALL.md, "Street people and home residents:
# greetings"); their talk is two News items each (one opening, 9771-9774; one later, 9775-9790), neighbours different.
#
# QBits: 100101 S1 done (the scrapyard crawler's console, hes_out1 event 26), 100221 S1 given (the camp's shout, event
# 27), 100113 Garrow's reward given, 100212 M12 given, 100012 M12 done, 100043 the Re-entry Emitter fitted (D0).

