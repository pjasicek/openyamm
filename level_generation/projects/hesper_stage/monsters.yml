# Each monster: its draft row (id), the descriptor row (named by the row's Picture column) copied from the engine
# descriptor `reference` (sounds, a sprite family the game falls back to with actor models off, hit material) with
# the model's height and collision radius, and its actor binding: the creature project's staged binding
# (integration/actors.yml) entry `entry`, its skin replaced by `skin` and keys of `animation` set where given (the
# turrets' bindings lack stride_length and upper_body_root, which the engine requires of every binding: a Stationary
# turret never walks, so any stride does, and its upper body is the whole turret, B_Root).
# Relations: the Hesper ids lie past the relation table (hostile.txt); their relations are relations.yml (staged as
# worlds/hesper/relations.yml) and their energy shields shields.yml with the design's monster_hesper.txt.
# `tactics` (optional): the monster's declarative combat tactics, written to the world's worlds/hesper/behaviors.yml
# (engine: ActorBehaviorCatalog, devdocs/ACTOR_SCRIPTING_INVESTIGATION.md, Tactics). traverse_degrees_per_second and
# fire_within_degrees: turn to the target at that rate, keep on it between shots and fire once on it; post: an actor
# the map places `immobile` holds that spot (no wandering; back to it and its facing after a fight) but leaves it to
# fight within `leash`; ranged_band: [min, max] edge distances it shoots from, backing off inside, closing in beyond
# and circling between shots, with melee (the guards' 25 % rifle butt) only against an adjacent target. scan: an idle
# turret's sweep either side of its placement facing (peak rate, pauses, barrel pitch wander) and how long it holds a
# lost target's aim before it eases back into it; lead_seconds: it aims (and shoots) that far ahead of a moving target.
monsters:
  # Hound rest bounds: 1.091 m tall, 0.824 m wide; A shoulder 0.95 m.
  - {id: 10300, picture: hes_hound A, reference: Dire Wolf A, height: 110, radius: 42,
     binding: {entry: hes_hound A, from: level_generation/creatures/hes_hound_codex/integration/actors.yml}}
  - {id: 10301, picture: hes_hound B, reference: Dire Wolf B, height: 127, radius: 49,
     binding: {entry: hes_hound B, from: level_generation/creatures/hes_hound_codex/integration/actors.yml}}
  - {id: 10302, picture: hes_hound C, reference: Dire Wolf C, height: 143, radius: 55,
     binding: {entry: hes_hound C, from: level_generation/creatures/hes_hound_codex/integration/actors.yml}}
  # Landfall's wall turrets (stationary; the mounts are decorations under them). v2 (Meshy) models: the Ward 1.58 m
  # tall in all, the Bastion 2.10 m with a 2.95 x 2.66 m plinth (hes_turrets_claude/README.md).
  - {id: 10065, reference: Robot B, height: 160, radius: 60,
     binding: {from: level_generation/creatures/hes_turrets_claude/integration/actors.yml, entry: hes_ward_turret,
               animation: {stride_length: 1.0, upper_body_root: B_Root}},
     tactics: {traverse_degrees_per_second: 120, fire_within_degrees: 5, post: {}, lead_seconds: 0.25,
               scan: {half_width_degrees: 55, degrees_per_second: 16, pause_seconds: [0.8, 2.6], pitch_degrees: 5,
                      hold_seconds: 3.5}}}
  - {id: 10066, reference: Robot C, height: 210, radius: 120,
     binding: {from: level_generation/creatures/hes_turrets_claude/integration/actors.yml, entry: hes_gate_bastion,
               animation: {stride_length: 1.0, upper_body_root: B_Root}},
     tactics: {traverse_degrees_per_second: 75, fire_within_degrees: 5, post: {}, lead_seconds: 0.25,
               scan: {half_width_degrees: 40, degrees_per_second: 10, pause_seconds: [1.2, 3.5], pitch_degrees: 3,
