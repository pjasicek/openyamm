# The Hesper monsters the stage installs (stage.py): rows of the design's draft tables
# (design/kreegan_world/data/monster_data.txt, generated by make_monster_tables.py; edit that script, not the rows)
# become the hesper world's monster_data and monster_descriptors contributions (world.yml idRanges monsters
# 10000-10999); the 3D models are cooked into worlds/hesper/models and bound in worlds/hesper/models/actors.yml.
#
# models: the one place where each installed model's source export is named (installed file name: source GLB).
# The guard and villagers are the approved reduced exports (level_generation/creatures/hes_*_reduce_claude,
# REDUCTION_LEDGER.md; their bindings equal the source projects'). Re-run stage.py after a re-export.
