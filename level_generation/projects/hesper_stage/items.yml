  # Readables (2026-10-23, follow-up 37; P4's READABLES.md, the texts as `readable`, read by the readText use action):
  # Starport Reach's three colony log tablets (on their plinths, hes_out1) and D1's Drone Control Duty Log (chest A).
  - {id: 11360, icon: hes_colony_log_tablet, ground: scroll1, readable: "I. Harbormaster Dal Oren, Year 211.\n\nFour landers in today and two out, the busiest day since the founders' festival. The Starport's boards are green from end to end. The Guardian keeps the sky for us, as she has for two hundred years, and the Lattice hums along every road. I have asked the Council for a second harbor crew. We are outgrowing the founders' town."}
  - {id: 11361, icon: hes_colony_log_tablet, ground: scroll1, readable: "II. Astronomer Ysa Penn, Year 211.\n\nA new light in the south-east, low over the Ash Sea. A comet, the Guardian says, on a long road from beyond the old charts. She watches it more closely than she watches anything; she has moved the outer guns to track it. The children are naming it. I have asked her why she is afraid of a comet. She did not answer."}
  - {id: 11362, icon: hes_colony_log_tablet, ground: scroll1, readable: "III. A field ranger, Year 212, day 1.\n\nThe comet passed in the night, closer than anyone said it would. Things fell from its tail: dozens of them, burning. Where they struck the plain the ground turned to black glass. The rangers went to look at the nearest. It was an empty pod. Something had already climbed out."}
  - {id: 11373, icon: hes_data_slate, ground: scroll2, readable: "Drone Control Duty Log\n\nDay 1. The seekers came down with the comet's pods. Drone Control does not answer our codes.\n\nDay 2. It answers theirs. Something in the grid has given the devils our own maintenance drones, and the Custodian with them. It locked the duty crew out of the control room.\n\nDay 3. We are leaving the Terminal. If anyone reads this, the Custodian's shield breaks before its body does. Hit the shield. Then run."}
