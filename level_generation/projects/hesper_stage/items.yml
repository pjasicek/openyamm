# The Hesper items the stage installs (stage.py): rows of the design's draft item table
# (design/kreegan_world/data/items.txt, generated by make_item_tables.py; edit that script, not the rows) become the
# hesper world's `items` contribution (worlds/hesper/data_tables/items.txt, world.yml idRanges items 11000-11999).
# Only items whose behaviour the engine already has are staged: quest items and loot that is only carried. The
# draft rows name icons that are not painted yet (visual_status needs_art), so each staged item names a stand-in
# engine icon (`icon`, an icons_x2 picture) until its own exists. An item whose own icon is approved
# (design/kreegan_world/art/item_icons/x2, P4's icons approved 2026-10-23) names it as `icon` and names in `ground`
# the engine icon whose ground object and 3D model it borrows when it lies on the ground (no Hesper item model yet).
