  # The Crown's colony log tablets X-XII (S9; P4's READABLES), on their plinths (hes_out4 events 14-16).
  - {id: 11369, icon: hes_colony_log_tablet, ground: scroll1, readable: "X. Councilor Neda Tam, day 11.\n\nThe Core District has fallen. Their lords flew down on the Guardian's hall at the foot of the mast and wired her into something of their own; they are building over her as I write. Whatever is left of her runs the guns now, and the guns are pointed at the sky, so that no one may come and help us."}
  - {id: 11370, icon: hes_colony_log_tablet, ground: scroll1, readable: "XI. Engineer Oss Varo, day 12.\n\nThe freight line under the planet still runs from the Ancients' halls to the Core District, right under their feet. The Council has ordered it sealed. We locked it at our end with the founders' root lock, the deepest kind the Guardians know, and left it whole. One day someone may need to ride it to the core."}
  - {id: 11371, icon: hes_colony_log_tablet, ground: scroll1, readable: "XII. Sel Ek, keeper of the Archive, Year 213.\n\nI write this for the plinth by the old road, where the devils will not think to look. We live below. The Hesperians, the children call us now. The Archive's dome is sealed with the founders' records inside. The Old Line runs from our Deep Stair to the core of their city, sealed with the root lock. The twin sleeps in the chapel; if she wakes, she will remember the way. Remember us."}
  # The Brood Spires' colony log tablets VII-IX (S9; P4's READABLES), given by their plinths (hes_out3 events 13-15),
  # and Hale's Last Note (11376) on the dead scout's belt by the acid lake (a ground item beside his helm).
  - {id: 11366, icon: hes_colony_log_tablet, ground: scroll1, readable: "VII. Scout Tem Sorvik, day 8.\n\nIn the marsh to the north they are growing something: towers out of the ground like bone, with eggs at their feet the size of a man. They are building a nest here. They mean to stay. I am sending this by the mast and going back for my partner."}
  - {id: 11367, icon: hes_colony_log_tablet, ground: scroll1, readable: "VIII. Weather keeper Ansa Dil, day 9.\n\nAt dawn the Guardian's song changed. Every relay in the station sang a note I had never heard, and every shield on the grid opened at once, like hands. The devils walked through the Lattice as if it were not there. She is singing their song now. The other Guardian, the twin, is silent; they say the founders kept her apart for a day like this."}
  - {id: 11368, icon: hes_colony_log_tablet, ground: scroll1, readable: "IX. Farm steward Corin Vale, day 10.\n\nWe have left the domes. The water is in the fields and the eggs are in the water. The Council says everyone goes below, into the Ancients' halls under the Starport, where the old shielding keeps the song out. We take the seed stock and the children first. The twin goes with us; the colony's engineers are carrying her core themselves."}
  - {id: 11376, icon: hes_data_slate, ground: scroll2, readable: "Hale's Last Note\n\nWren, if this reaches you: the rain got under my hood on the Spire road and I cannot breathe right. Don't come for me. The Spire's ear points at the pass; they see everything that comes up it. Tell Hesk the nest by the west wall is growing. Keep the rebreather, it still works; it was me that didn't. - Hale"}
