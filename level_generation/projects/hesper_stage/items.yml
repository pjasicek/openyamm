  - {id: 11363, icon: hes_colony_log_tablet, ground: scroll1, readable: "IV. Quarry foreman Brun Voss, day 2.\n\nThey came out of the pods in the dark: tall, black, winged, with fire in their hands. They took the quarry in an hour. My crew ran for the town; not all of us made it. They do not kill the ones who stop running. They take them."}
  - {id: 11364, icon: hes_colony_log_tablet, ground: scroll1, readable: "V. Grid warden Ilka Mar, day 4.\n\nThe Lattice holds. Every shield on the grid is up and drawing hard, and the Guardian sings through the relays day and night to keep it so. Their guns break on it. Sesha Mar, my ancestor, drew this grid to keep us. It is keeping us. We will hold until they starve."}
  - {id: 11365, icon: hes_colony_log_tablet, ground: scroll1, readable: "VI. A militia corporal, day 6.\n\nWe found the quarry crews in a pen east of the town, with rings round their necks that glow when the devils speak. They walked to the fence and did not know us. When we cut a ring off, the man woke up screaming. The ring is listening to something. The Guardian says it is listening to her grid."}
