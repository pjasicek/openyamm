  - {id: 11377, icon: hes_data_slate, ground: scroll2, readable: "A Noble's Letter\n\nFrom Lady Ssekh to Lord Vhorrax, in the court hand:\n\nYour duels bore the Hierarch, cousin. The colonists you spared at the Spire are walking toward the Seedship. When they reach you, kill them quickly, for once. Honor is for worlds we have already eaten.\n\nAster: He kept the letter. And he still offered you terms."}


