  - {id: 11374, icon: hes_data_slate, ground: scroll2, readable: "Doctor Ilse's Notes\n\nFourth year in the Pens. They bring me the broken ones and I mend them so they can break again. The collar listens to the Lattice and forces the body to obey. Cut the song and the collar is jewelry. I have seen it once, when a storm took the node for an hour: every one of them looked up at once, like waking. If you can work a console, try the control room above the sorting pens."}
