# MM9's translucent textures (devdocs/mm9_rework/MM9_VISUAL_PROPERTIES.md): the two pale blue Lichwindow pillars beside
# the coffin (alpha 43-138) and their blue ice caps (yanmirsolidice1, alpha 191, LIGHTDEFS teal: a bake-only light per
# polygon, the bake profile's texture_lights). Brush Alpha 1; the texture alpha multiplies at run time (Lich Lab's).
glass:
  lichwindow.dtx: {opacity: 1.0, tint: [1.0, 1.0, 1.0], two_sided: true}
  yanmirsolidice1.dtx: {opacity: 1.0, tint: [1.0, 1.0, 1.0], two_sided: true}

# Ground treasure hints (dungeon/treasure.py, devdocs/mm9_rework/GROUND_TREASURE_PLAN.md section 4): DAT
# objects whose surroundings count as secrets or bosses (bonus markers), rewarding set dressing, and places
# to keep clear.
treasure:
  bonus_near: [Vampir0, Vampir1, Vampir2]
  themed_near: [BonePile0, BonePile1, BonePile2, BonePile3, BonePile4, BonePile5, BonePile6, BonePile7, BonePile8]
