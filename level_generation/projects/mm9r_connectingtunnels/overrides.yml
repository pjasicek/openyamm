# Explicit conversion choices for MM9's Connecting Tunnels (convert.py reads this through the shared converter
# ../mm9r_common/dungeon; a rerun keeps them). Rules and keys: ../mm9r_common/DUNGEON_PLAYBOOK.md.
map:
  stem: connectingtunnels
  display_name: Connecting Tunnels
  starts: [StartPoint0, StartPoint1, StartPoint2]   # 0: from Thronheim (east), 1: Yorwick's lower exit (west), 2: Yorwick's upper exit
  monster_classes: [SkeletonWarrior, SkeletonMaster, SpectreDagrell, VenomousDagrell, Annelid, Bloodsucker, Vampir]
  # The DAT spans LT x -1 184..14 512 (native -3 031..37 151): over int16. The x offset centres it (native
  # -20 031..20 151); y -15 565..12 001 and z -1 925..7 352 fit. convert.py shifts the transition rows (README).
  offset: [17000, 0, 0]
  ambient: 20
  model_lighting: true
  split_minor_rooms: true
  split_retry: true
  thin_walls: true
plan_levels:
  low: [-800, 300]
  mid: [300, 1600]
  high: [1600, 2900]
models:
  # --- the coffin's lid leaves (RotatingDoor pair, no portal): they open the coffin; open unlocks TreasureChest1
  #     inside, close locks it (coffin door right's OpenTriggerTarget0/CloseTriggerTarget0)
  coffin door left: {group: coffin, motion: rotate}
  coffin door right: {group: coffin, motion: rotate}
  # --- the rock fall in the west tunnel (DestructableBrush0, HitPoints 10, its death destroys DestructableBrush1,
  #     TriggerDestroyOnly): scene destructibles (dungeon/destructibles.py `break`); weapons break DestructableBrush0, a
  #     click on either still does (DestructableBrush1's click is DestructableBrush0's: 38000 + 127)
  DestructableBrush0: {group: RockFall, motion: break}
  DestructableBrush1: {group: RockFall, motion: break, click: 38127}
model_patterns:
  AITrack: skip                       # AIRail helpers: MM9's walkable graph, not built
portals:   # archway cuts: work/cuts/manual.yml by hand, t* from work/cuts/tunnel_cuts.py (README)
  - {name: t00, axis: z, point: [14360, 320, -1368], span: 160}
