# Written by make_scenarios.py from the built map; rerun it after convert.py.
id: mm9r.chasmofthedead_pivot
title: Chasm of the Dead (native BLV) - the pivot trap, its spike pit, ladder and hatch
world: mm9
mode: faithful
tags:
- mm9
- mm9_rework
- draft
steps:
- load_map:
    map: chasmofthedead.blv
- note:
    text: 'PivotWallTrap1: the floor half tips the party into the pit.'
- assert:
    mechanism:
      id: 55
      state: closed
- movement_segment:
    input: forward
    seconds: 0.6
    actor_collision: false
    actor_ai: false
    start:
      map: chasmofthedead.blv
      x: 2580
      y: -4797
      z: -4422
      yaw_degrees: 90
      pitch: 0
    expect_stop:
      map: chasmofthedead.blv
      x: 2580
      y: -4547
      z: -4424
      yaw_degrees: 90
      pitch: 0
    loose_tolerance: true
    tolerance_xy: 400
    tolerance_z: 900
- advance_runtime:
    seconds: 2.5
- assert:
    mechanism:
      id: 55
      state: open
- assert:
    state_dump_named_map_var:
      name: PivotTrap
      value: 1
- note:
    text: The trap turns back after 5 s.
- advance_runtime:
    seconds: 8
- assert:
    mechanism:
      id: 55
      state: closed
- note:
    text: TrapExitDoor1 opens on its click; the party climbs Ladder4 out beside it.
- execute_event:
    id: 240
- advance_runtime:
    seconds: 2
- assert:
    mechanism:
      id: 93
      state: open
- movement_segment:
    input: forward
    seconds: 3.7
    actor_collision: false
    actor_ai: false
    start:
      map: chasmofthedead.blv
      x: 2580
      y: -4299
      z: -5038
      yaw_degrees: 90
      pitch: 0
    expect_stop:
      map: chasmofthedead.blv
      x: 2580
      y: -4122
      z: -4424
      yaw_degrees: 90
      pitch: 0
    loose_tolerance: true
    tolerance_xy: 1500
    tolerance_z: 100
- note:
    text: The hatch shuts itself after 5 s.
- advance_runtime:
    seconds: 7
- assert:
    mechanism:
      id: 93
      state: closed
