# Hand-written (2026-11-06, scr_audit "Implicit engine semantics"): a dead AI takes no message (object.lto
# 0x10019e90). The Desert Terror killed in its cell before the party crosses BadAssTrigger: the plane's Breakout reaches
# a corpse and is dropped (MM9.receives): no breakout, the prison wall stands, Shmoe lives, no guards loosed.
# Before the rule the port's breakout fell back to freed() at once (the dead Terror's walk failed) and killed Shmoe.
id: mm9r.thronheimcity_breakout_dead
title: 'Thronheim City (native BLV): a dead Desert Terror takes no Breakout (Thronheimcity_BadAss.scr, MM9.receives)'
world: mm9
mode: faithful
tags:
- mm9
- mm9_rework
- draft
steps:
- load_map:
    map: thronheimcity.blv
- advance_runtime:
    seconds: 1.0
- damage_actor: {actor_index: 10, amount: 100000000}
- advance_runtime:
    seconds: 1.0
- assert:
    actor_visible:
      actor_index: 10
      dead: true
- movement_segment:
    input: forward
    seconds: 2.0
    actor_collision: false
    actor_ai: false
    start:
      map: thronheimcity.blv
      x: 11439
      y: 246
      z: 3114
      yaw_degrees: 180
      pitch: 0
    expect_stop:
      map: thronheimcity.blv
      x: 9939
      y: 246
      z: 3114
      yaw_degrees: 180
      pitch: 0
    loose_tolerance: true
    tolerance_xy: 800
    tolerance_z: 80
- advance_runtime:
    seconds: 15
- assert:
    named_map_var_changed:
      name: BadAssOut
      current: 0
- assert:
    named_map_var_changed:
      name: BadAssStage
      current: 0
- assert:
    actor_visible:
      actor_index: 14
      dead: false
