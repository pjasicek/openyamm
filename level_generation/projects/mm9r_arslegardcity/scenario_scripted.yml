    kind: set_qbit
    id: 90098
    value: true
- assert:
    actor_visible:
      actor_index: 34
      hostile_to_party: false
- execute_event:
    id: 240
- assert:
    qbit_clear:
    - 90470
- setup_shortcut:
    kind: set_qbit
    id: 90108
    value: true
- execute_event:
    id: 240
- assert:
    qbit_set:
    - 90470
- advance_runtime:
    seconds: 0.5
- assert:
    actor_visible:
      actor_index: 34
      hostile_to_party: true
- execute_event:
    id: 232
- advance_runtime:
    seconds: 3
- assert:
    mechanism:
      id: 20
      state: open
- note:
    text: 'NjamDoor0/1 (Doorlock.scr 576): locked without Njam''s Key, opens with it.'
- execute_event:
    id: 231
- advance_runtime:
    seconds: 2
- assert:
