# Written by make_scenarios.py from the built map; rerun it after convert.py.
id: mm9r.arslegardcity_scripted
title: Arslegard City (native BLV) - the Great Gate scene, Njam's chase, Hanndl, Sven, letters
world: mm9
mode: faithful
tags:
- mm9
- mm9_rework
- draft
steps:
- load_map:
    map: arslegardcity.blv
- note:
    text: 'FateMan.scr: the first arrival: after about 3 s the cinematic gate_fate (key 98 at once), then at its end (71 s)
      the move to the Dark Passageway (ExitTrigger2''s row). cinematic_gate_fate_play.yml checks it step by step.'
- advance_runtime:
    seconds: 1.0
- assert:
    qbit_clear:
    - 90098
- advance_runtime:
    seconds: 3.5
- assert:
    qbit_set:
    - 90098
- console:
    line: cinematic list
    expect_contains: playing gate_fate
- advance_runtime:
    seconds: 72
    follow_map_move: true
- assert:
    map_arrived:
      map: darkpassageway.blv
- note:
    text: 'WritMan.scr: with the Writ shown (key 100): key 9515, 170 000 experience, Hanndl (the gate''s actor) removed, the
      Great Gate opens.'
- load_map:
    map: arslegardcity.blv
- setup_shortcut:
    kind: set_qbit
    id: 90100
    value: true
- assert:
    mechanism:
      id: 22
      state: closed
- advance_runtime:
    seconds: 4.5
- assert:
    qbit_set:
    - 99515
- console:
    line: cinematic list
    expect_contains: playing gate_writ
- assert:
    mechanism:
      id: 22
      state: closed
- advance_runtime:
    seconds: 22
- assert:
    mechanism:
      id: 22
      state: opening
- note:
    text: 'NjamChase.scr: Trigger0 in Njam''s house with the chase on (key 108): key 470, his door unlocked, Njam hostile.'
- load_map:
    map: arslegardcity.blv
- &id001
