# dark/cavern1: first orchestration by orchestrate.py (hand-tune freely; it is never overwritten).
# 31.2 s a pass. GM programs are 0-based; drums: 0 standard kit, 48 orchestral.
# A channel's `slots` give the notes it plays with those FM instrument slots their own instrument.
reverb: {seconds: 2.4, level: 0.32}
channels:
  0:   # pad: slow strings; median 55, 1.55 s notes, sounding 99%
    program: 49
    pan: -0.4
    width: 0.9
    reverb: 0.4
    gain_db: -3
  1:   # pad2: brass section; median 64, 1.55 s notes, sounding 99%
    program: 61
    pan: 0.4
    width: 0.9
    reverb: 0.4
    gain_db: -3
  2:   # pad2: brass section; median 59, 1.55 s notes, sounding 99%
    program: 61
    pan: -0.25
    width: 0.9
    reverb: 0.4
    gain_db: -3
  3:   # bass_long: contrabass; median 42, 3.12 s notes, sounding 100%
    program: 43
    pan: 0.0
    width: 0.25
    reverb: 0.06
    gain_db: 0
  4:   # pad2: brass section; median 67, 1.55 s notes, sounding 99%
    program: 61
    pan: -0.5
    width: 0.9
    reverb: 0.4
    gain_db: -3
  6:   # lead_high: flute; median 69, 0.08 s notes, sounding 16%
    program: 73
    pan: 0.0
    width: 0.6
    reverb: 0.28
    gain_db: 0
  8:   # drums (standard kit), notes [70]
    program: 0
    pan: 0.0
    width: 0.5
    reverb: 0.15
    gain_db: -3
