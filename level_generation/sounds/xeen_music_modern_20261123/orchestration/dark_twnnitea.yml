# dark/twnnitea: first orchestration by orchestrate.py (hand-tune freely; it is never overwritten).
# 60.2 s a pass. GM programs are 0-based; drums: 0 standard kit, 48 orchestral.
# A channel's `slots` give the notes it plays with those FM instrument slots their own instrument.
reverb: {seconds: 2.4, level: 0.32}
channels:
  0:   # counter_low: cello; median 45, 0.22 s notes, sounding 29%
    program: 42
    pan: -0.4
    width: 0.6
    reverb: 0.28
    gain_db: 0
  1:   # pad: slow strings; median 65, 1.92 s notes, sounding 60%
    program: 49
    pan: 0.4
    width: 0.9
    reverb: 0.4
    gain_db: -3
  2:   # pad2: brass section; median 64, 1.96 s notes, sounding 53%
    program: 61
    pan: -0.25
    width: 0.9
    reverb: 0.4
    gain_db: -3
  3:   # pad2: brass section; median 58, 1.68 s notes, sounding 62%
    program: 61
    pan: 0.25
    width: 0.9
    reverb: 0.4
    gain_db: -3
  4:   # arpeggio: harp; median 57, 0.25 s notes, sounding 93%
    program: 46
    pan: -0.5
    width: 0.6
    reverb: 0.28
    gain_db: -3
  5:   # lead_mid: oboe; median 65, 0.16 s notes, sounding 47%
    program: 68
    pan: 0.0
    width: 0.6
    reverb: 0.28
    gain_db: 0
  6:   # arpeggio: harp; median 64, 0.15 s notes, sounding 69%
    program: 46
    pan: 0.15
    width: 0.6
    reverb: 0.28
    gain_db: -3
  8:   # drums (standard kit), notes [36, 43, 45, 46, 49]
    program: 0
    pan: 0.0
    width: 0.5
    reverb: 0.15
    gain_db: -3
