# dark/sf05: first orchestration by orchestrate.py (hand-tune freely; it is never overwritten).
# 49.1 s a pass. GM programs are 0-based; drums: 0 standard kit, 48 orchestral.
# A channel's `slots` give the notes it plays with those FM instrument slots their own instrument.
