# dark/cavern2: first orchestration by orchestrate.py (hand-tune freely; it is never overwritten).
# 31.2 s a pass. GM programs are 0-based; drums: 0 standard kit, 48 orchestral.
# A channel's `slots` give the notes it plays with those FM instrument slots their own instrument.
reverb: {seconds: 2.4, level: 0.32}
channels:
  0:   # pluck: pizzicato strings; median 65, 0.08 s notes, sounding 16%
    program: 45
    pan: -0.4
    width: 0.6
    reverb: 0.28
    gain_db: 0
  1:   # pluck: pizzicato strings; median 60, 0.16 s notes, sounding 22%
    program: 45
    pan: 0.4
    width: 0.6
    reverb: 0.28
    gain_db: 0
  2:   # pluck: pizzicato strings; median 55, 0.16 s notes, sounding 22%
    program: 45
    pan: -0.25
    width: 0.6
    reverb: 0.28
    gain_db: 0
  3:   # bass_long: contrabass; median 38, 3.12 s notes, sounding 100%
    program: 43
    pan: 0.0
    width: 0.25
    reverb: 0.06
    gain_db: 0
  4:   # pluck: pizzicato strings; median 56, 0.16 s notes, sounding 22%
    program: 45
    pan: -0.5
    width: 0.6
    reverb: 0.28
    gain_db: 0
  6:   # lead_high: flute; median 77, 0.78 s notes, sounding 96%
    program: 73
    pan: 0.0
    width: 0.6
    reverb: 0.28
    gain_db: 0
  8:   # drums (standard kit), notes [42]
    program: 0
    pan: 0.0
    width: 0.5
    reverb: 0.15
    gain_db: -3
