# dark/scifi2: first orchestration by orchestrate.py (hand-tune freely; it is never overwritten).
# 30.0 s a pass. GM programs are 0-based; drums: 0 standard kit, 48 orchestral.
# A channel's `slots` give the notes it plays with those FM instrument slots their own instrument.
reverb: {seconds: 2.0, level: 0.32}
channels:
  0:   # bells: crystal; median 95, 0.08 s notes, sounding 14%
    program: 98
    pan: -0.4
    width: 0.6
    reverb: 0.4
    gain_db: -6
  1:   # lead_high: saw lead; median 71, 0.64 s notes, sounding 90%
    program: 81
    pan: 0.0
    width: 0.6
    reverb: 0.28
    gain_db: 0
  2:   # pad: warm pad; median 78, 1.96 s notes, sounding 85%
    program: 89
    pan: -0.25
    width: 0.9
    reverb: 0.4
    gain_db: -3
  3:   # pad2: sweep pad; median 49, 1.81 s notes, sounding 61%
    program: 95
    pan: 0.25
    width: 0.9
    reverb: 0.4
    gain_db: -3
  4:   # pad2: sweep pad; median 62, 1.81 s notes, sounding 61%
    program: 95
    pan: -0.5
    width: 0.9
    reverb: 0.4
    gain_db: -3
  5:   # pad2: sweep pad; median 84, 3.23 s notes, sounding 100%
    program: 95
    pan: 0.5
    width: 0.9
    reverb: 0.4
    gain_db: -3
  6:   # counter_mid: fifths lead; median 62, 0.19 s notes, sounding 45%
    program: 86
    pan: 0.15
    width: 0.6
    reverb: 0.28
    gain_db: 0
  8:   # drums (standard kit), notes [41, 43, 45, 47, 49, 69]
    program: 0
    pan: 0.0
    width: 0.5
    reverb: 0.15
    gain_db: -3
