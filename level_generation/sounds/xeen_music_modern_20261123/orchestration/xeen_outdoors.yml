# xeen/outdoors: first orchestration by orchestrate.py (hand-tune freely; it is never overwritten).
# 156.0 s a pass. GM programs are 0-based; drums: 0 standard kit, 48 orchestral.
# A channel's `slots` give the notes it plays with those FM instrument slots their own instrument.
reverb: {seconds: 2.4, level: 0.32}
channels:
  0:   # pluck: pizzicato strings; median 67, 0.07 s notes, sounding 12%
    program: 45
    pan: -0.4
    width: 0.6
    reverb: 0.28
    gain_db: 0
    slots:
      0: {program: 42, pan: 0.25, width: 0.6, reverb: 0.28, gain_db: 0}   # counter_low: cello; median 56, 0.05 s notes, sounding 8%
      9: {program: 49, pan: 0.25, width: 0.9, reverb: 0.4, gain_db: -3}   # pad: slow strings; median 65, 1.22 s notes, sounding 9%
  1:   # pluck: pizzicato strings; median 62, 0.08 s notes, sounding 13%
    program: 45
    pan: 0.4
    width: 0.6
    reverb: 0.28
    gain_db: 0
    slots:
      1: {program: 42, pan: -0.5, width: 0.6, reverb: 0.28, gain_db: 0}   # counter_low: cello; median 50, 0.07 s notes, sounding 9%
      10: {program: 61, pan: -0.5, width: 0.9, reverb: 0.4, gain_db: -3}   # pad2: brass section; median 60, 1.23 s notes, sounding 9%
  2:   # counter_mid: clarinet; median 61, 0.25 s notes, sounding 14%
    program: 71
    pan: -0.25
    width: 0.6
    reverb: 0.28
    gain_db: 0
    slots:
      11: {program: 33, pan: 0.0, width: 0.25, reverb: 0.06, gain_db: 0}   # bass_short: fingered bass; median 41, 0.12 s notes, sounding 7%
  3:   # lead_low: french horn; median 50, 0.55 s notes, sounding 47%
    program: 60
    pan: 0.0
    width: 0.6
    reverb: 0.28
    gain_db: 0
    slots:
      8: {program: 9, pan: 0.15, width: 0.6, reverb: 0.4, gain_db: -6}   # bells: glockenspiel; median 84, 0.08 s notes, sounding 7%
  4:   # counter_mid: clarinet; median 66, 0.21 s notes, sounding 26%
    program: 71
    pan: -0.5
    width: 0.6
    reverb: 0.28
    gain_db: 0
  5:   # bass_long: contrabass; median 43, 1.29 s notes, sounding 53%
    program: 43
    pan: 0.0
    width: 0.25
    reverb: 0.06
    gain_db: 0
  6:   # bass_short: fingered bass; median 40, 0.48 s notes, sounding 36%
    program: 33
    pan: 0.0
    width: 0.25
    reverb: 0.06
    gain_db: 0
    slots:
      13: {program: 71, pan: -0.25, width: 0.6, reverb: 0.28, gain_db: 0}   # counter_mid: clarinet; median 65, 0.12 s notes, sounding 7%
      6: {program: 61, pan: -0.25, width: 0.9, reverb: 0.4, gain_db: -3}   # pad2: brass section; median 53, 3.63 s notes, sounding 18%
  8:   # drums (orchestral kit), notes [38, 49]
    program: 48
    pan: 0.0
    width: 0.5
    reverb: 0.15
    gain_db: -3
