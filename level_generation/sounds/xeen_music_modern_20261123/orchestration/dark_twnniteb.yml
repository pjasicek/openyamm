# dark/twnniteb: first orchestration by orchestrate.py (hand-tune freely; it is never overwritten).
# 71.0 s a pass. GM programs are 0-based; drums: 0 standard kit, 48 orchestral.
# A channel's `slots` give the notes it plays with those FM instrument slots their own instrument.
reverb: {seconds: 2.4, level: 0.32}
channels:
  0:   # counter_high: violin; median 71, 0.45 s notes, sounding 24%
    program: 40
    pan: -0.4
    width: 0.6
    reverb: 0.28
    gain_db: 0
  1:   # counter_mid: clarinet; median 67, 0.12 s notes, sounding 29%
    program: 71
    pan: 0.4
    width: 0.6
    reverb: 0.28
    gain_db: 0
  2:   # counter_high: violin; median 71, 0.28 s notes, sounding 22%
    program: 40
    pan: -0.25
    width: 0.6
    reverb: 0.28
    gain_db: 0
  3:   # counter_mid: clarinet; median 63, 0.34 s notes, sounding 60%
    program: 71
    pan: 0.25
    width: 0.6
    reverb: 0.28
    gain_db: 0
  4:   # lead_low: french horn; median 52, 0.15 s notes, sounding 45%
    program: 60
    pan: 0.0
    width: 0.6
    reverb: 0.28
    gain_db: 0
  5:   # counter_low: cello; median 54, 0.54 s notes, sounding 18%
    program: 42
    pan: 0.5
    width: 0.6
    reverb: 0.28
    gain_db: 0
  6:   # counter_mid: clarinet; median 64, 0.12 s notes, sounding 29%
    program: 71
    pan: 0.15
    width: 0.6
    reverb: 0.28
    gain_db: 0
  8:   # drums (standard kit), notes [46, 49, 54, 60, 62, 63, 64, 69, 75]
    program: 0
    pan: 0.0
    width: 0.5
    reverb: 0.15
    gain_db: -3
