# dark/outday1: first orchestration by orchestrate.py (hand-tune freely; it is never overwritten).
# 62.6 s a pass. GM programs are 0-based; drums: 0 standard kit, 48 orchestral.
# A channel's `slots` give the notes it plays with those FM instrument slots their own instrument.
reverb: {seconds: 2.4, level: 0.32}
channels:
  0:   # lead_mid: oboe; median 66, 0.47 s notes, sounding 77%
    program: 68
    pan: 0.0
    width: 0.6
    reverb: 0.28
    gain_db: 0
  1:   # counter_mid: clarinet; median 67, 0.52 s notes, sounding 15%
    program: 71
    pan: 0.4
    width: 0.6
    reverb: 0.28
    gain_db: 0
  2:   # bass_long: contrabass; median 42, 0.89 s notes, sounding 80%
    program: 43
    pan: 0.0
    width: 0.25
    reverb: 0.06
    gain_db: 0
  3:   # counter_high: violin; median 72, 0.11 s notes, sounding 56%
    program: 40
    pan: 0.25
    width: 0.6
    reverb: 0.28
    gain_db: 0
  4:   # counter_low: cello; median 46, 1.00 s notes, sounding 91%
    program: 42
    pan: -0.5
    width: 0.6
    reverb: 0.28
    gain_db: 0
  5:   # pad: slow strings; median 68, 1.45 s notes, sounding 72%
    program: 49
    pan: 0.5
    width: 0.9
    reverb: 0.4
    gain_db: -3
  6:   # counter_high: violin; median 76, 0.22 s notes, sounding 9%
    program: 40
    pan: 0.15
    width: 0.6
    reverb: 0.28
    gain_db: 0
  8:   # drums (standard kit), notes [36, 46, 54]
    program: 0
    pan: 0.0
    width: 0.5
    reverb: 0.15
    gain_db: -3
