# intro/outday3: first orchestration by orchestrate.py (hand-tune freely; it is never overwritten).
# 65.2 s a pass. GM programs are 0-based; drums: 0 standard kit, 48 orchestral.
# A channel's `slots` give the notes it plays with those FM instrument slots their own instrument.
reverb: {seconds: 2.4, level: 0.32}
channels:
  0:   # lead_low: french horn; median 52, 0.37 s notes, sounding 100%
    program: 60
    pan: 0.0
    width: 0.6
    reverb: 0.28
    gain_db: 0
  1:   # counter_high: violin; median 76, 0.37 s notes, sounding 31%
    program: 40
    pan: 0.4
    width: 0.6
    reverb: 0.28
    gain_db: 0
  2:   # pad: slow strings; median 57, 1.46 s notes, sounding 88%
    program: 49
    pan: -0.25
    width: 0.9
    reverb: 0.4
    gain_db: -3
  3:   # pad2: brass section; median 60, 1.46 s notes, sounding 89%
    program: 61
    pan: 0.25
    width: 0.9
    reverb: 0.4
    gain_db: -3
  4:   # pad2: brass section; median 64, 1.46 s notes, sounding 97%
    program: 61
    pan: -0.5
    width: 0.9
    reverb: 0.4
    gain_db: -3
  5:   # counter_high: violin; median 71, 0.37 s notes, sounding 47%
    program: 40
    pan: 0.5
    width: 0.6
    reverb: 0.28
    gain_db: 0
  6:   # counter_high: violin; median 79, 0.18 s notes, sounding 12%
    program: 40
    pan: 0.15
    width: 0.6
    reverb: 0.28
    gain_db: 0
  8:   # drums (standard kit), notes [36, 54, 62]
    program: 0
    pan: 0.0
    width: 0.5
    reverb: 0.15
    gain_db: -3
