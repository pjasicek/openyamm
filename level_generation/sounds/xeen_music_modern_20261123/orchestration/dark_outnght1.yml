# dark/outnght1: first orchestration by orchestrate.py (hand-tune freely; it is never overwritten).
# 61.3 s a pass. GM programs are 0-based; drums: 0 standard kit, 48 orchestral.
# A channel's `slots` give the notes it plays with those FM instrument slots their own instrument.
reverb: {seconds: 2.4, level: 0.32}
channels:
  0:   # counter_high: violin; median 78, 0.32 s notes, sounding 32%
    program: 40
    pan: -0.4
    width: 0.6
    reverb: 0.28
    gain_db: 0
  1:   # counter_mid: clarinet; median 64, 0.52 s notes, sounding 64%
    program: 71
    pan: 0.4
    width: 0.6
    reverb: 0.28
    gain_db: 0
  2:   # counter_mid: clarinet; median 67, 0.52 s notes, sounding 38%
    program: 71
    pan: -0.25
    width: 0.6
    reverb: 0.28
    gain_db: 0
  3:   # pad: slow strings; median 52, 2.87 s notes, sounding 71%
    program: 49
    pan: 0.25
    width: 0.9
    reverb: 0.4
    gain_db: -3
  4:   # pad2: brass section; median 59, 3.23 s notes, sounding 85%
    program: 61
    pan: -0.5
    width: 0.9
    reverb: 0.4
    gain_db: -3
  5:   # bass_long: contrabass; median 38, 1.59 s notes, sounding 79%
    program: 43
    pan: 0.0
    width: 0.25
    reverb: 0.06
    gain_db: 0
  6:   # lead_mid: oboe; median 59, 0.32 s notes, sounding 100%
    program: 68
    pan: 0.0
    width: 0.6
    reverb: 0.28
    gain_db: 0
  8:   # drums (standard kit), notes [60, 61, 62, 63, 64]
    program: 0
    pan: 0.0
    width: 0.5
    reverb: 0.15
    gain_db: -3
