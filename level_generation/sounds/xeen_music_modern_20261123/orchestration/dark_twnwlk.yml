# dark/twnwlk: first orchestration by orchestrate.py (hand-tune freely; it is never overwritten).
# 62.9 s a pass. GM programs are 0-based; drums: 0 standard kit, 48 orchestral.
# A channel's `slots` give the notes it plays with those FM instrument slots their own instrument.
reverb: {seconds: 2.4, level: 0.32}
channels:
  0:   # arpeggio: harp; median 56, 0.26 s notes, sounding 90%
    program: 46
    pan: -0.4
    width: 0.6
    reverb: 0.28
    gain_db: -3
  1:   # counter_mid: clarinet; median 62, 0.58 s notes, sounding 47%
    program: 71
    pan: 0.4
    width: 0.6
    reverb: 0.28
    gain_db: 0
  2:   # pad: slow strings; median 69, 2.86 s notes, sounding 100%
    program: 49
    pan: -0.25
    width: 0.9
    reverb: 0.4
    gain_db: -3
  3:   # pad2: brass section; median 64, 2.57 s notes, sounding 99%
    program: 61
    pan: 0.25
    width: 0.9
    reverb: 0.4
    gain_db: -3
  4:   # pad2: brass section; median 60, 2.57 s notes, sounding 99%
    program: 61
    pan: -0.5
    width: 0.9
    reverb: 0.4
    gain_db: -3
  5:   # lead_high: flute; median 72, 0.29 s notes, sounding 54%
    program: 73
    pan: 0.0
    width: 0.6
    reverb: 0.28
    gain_db: 0
  6:   # counter_high: violin; median 76, 0.12 s notes, sounding 16%
    program: 40
    pan: 0.15
    width: 0.6
    reverb: 0.28
    gain_db: 0
  8:   # drums (standard kit), notes [46, 54]
    program: 0
    pan: 0.0
    width: 0.5
    reverb: 0.15
    gain_db: -3
