# xeen/guild: first orchestration by orchestrate.py (hand-tune freely; it is never overwritten).
# 45.6 s a pass. GM programs are 0-based; drums: 0 standard kit, 48 orchestral.
# A channel's `slots` give the notes it plays with those FM instrument slots their own instrument.
reverb: {seconds: 2.4, level: 0.32}
channels:
  0:   # counter_mid: clarinet; median 59, 1.09 s notes, sounding 76%
    program: 71
    pan: -0.4
    width: 0.6
    reverb: 0.28
    gain_db: 0
  1:   # counter_high: violin; median 71, 0.58 s notes, sounding 79%
    program: 40
    pan: 0.4
    width: 0.6
    reverb: 0.28
    gain_db: 0
  2:   # counter_high: violin; median 71, 0.36 s notes, sounding 95%
    program: 40
    pan: -0.25
    width: 0.6
    reverb: 0.28
    gain_db: 0
  3:   # lead_mid: oboe; median 59, 0.37 s notes, sounding 92%
    program: 68
    pan: 0.0
    width: 0.6
    reverb: 0.28
    gain_db: 0
  4:   # counter_mid: clarinet; median 66, 1.12 s notes, sounding 98%
    program: 71
    pan: -0.5
    width: 0.6
    reverb: 0.28
    gain_db: 0
  6:   # pluck: pizzicato strings; median 83, 0.19 s notes, sounding 25%
    program: 45
    pan: 0.15
    width: 0.6
    reverb: 0.28
    gain_db: 0
