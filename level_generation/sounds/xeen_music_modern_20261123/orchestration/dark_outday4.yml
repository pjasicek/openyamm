# dark/outday4: first orchestration by orchestrate.py (hand-tune freely; it is never overwritten).
# 60.1 s a pass. GM programs are 0-based; drums: 0 standard kit, 48 orchestral.
# A channel's `slots` give the notes it plays with those FM instrument slots their own instrument.
reverb: {seconds: 2.4, level: 0.32}
channels:
  0:   # counter_high: violin; median 81, 0.32 s notes, sounding 23%
    program: 40
    pan: -0.4
    width: 0.6
    reverb: 0.28
    gain_db: 0
  1:   # pluck: pizzicato strings; median 62, 0.10 s notes, sounding 26%
    program: 45
    pan: 0.4
    width: 0.6
    reverb: 0.28
    gain_db: 0
  2:   # lead_high: flute; median 70, 0.25 s notes, sounding 28%
    program: 73
    pan: 0.0
    width: 0.6
    reverb: 0.28
    gain_db: 0
  3:   # pluck: pizzicato strings; median 61, 0.19 s notes, sounding 62%
    program: 45
    pan: 0.25
    width: 0.6
    reverb: 0.28
    gain_db: 0
  4:   # arpeggio: harp; median 47, 0.14 s notes, sounding 44%
    program: 46
    pan: -0.5
    width: 0.6
    reverb: 0.28
    gain_db: -3
  5:   # bass_short: fingered bass; median 40, 0.38 s notes, sounding 69%
    program: 33
    pan: 0.0
    width: 0.25
    reverb: 0.06
    gain_db: 0
  6:   # pluck: pizzicato strings; median 46, 0.16 s notes, sounding 42%
    program: 45
    pan: 0.15
    width: 0.6
    reverb: 0.28
    gain_db: 0
  8:   # drums (standard kit), notes [36, 41, 43, 45, 46, 47, 48, 49]
    program: 0
    pan: 0.0
    width: 0.5
    reverb: 0.15
    gain_db: -3
