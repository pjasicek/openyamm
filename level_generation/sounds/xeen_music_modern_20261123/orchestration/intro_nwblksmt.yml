    program: 33
    pan: 0.0
    width: 0.25
    reverb: 0.06
    gain_db: 0
  2:   # counter_high: violin; median 74, 0.27 s notes, sounding 55%
    program: 40
    pan: -0.25
    width: 0.6
    reverb: 0.28
    gain_db: 0
  3:   # lead_mid: oboe; median 60, 0.27 s notes, sounding 79%
    program: 68
    pan: 0.0
    width: 0.6
    reverb: 0.28
    gain_db: 0
  4:   # arpeggio: harp; median 69, 0.14 s notes, sounding 46%
    program: 46
    pan: -0.5
    width: 0.6
    reverb: 0.28
    gain_db: -3
  5:   # arpeggio: harp; median 57, 0.14 s notes, sounding 27%
