# dark/cstl3rev: first orchestration by orchestrate.py (hand-tune freely; it is never overwritten).
# 33.6 s a pass. GM programs are 0-based; drums: 0 standard kit, 48 orchestral.
# A channel's `slots` give the notes it plays with those FM instrument slots their own instrument.
reverb: {seconds: 2.4, level: 0.32}
channels:
  0:   # counter_mid: clarinet; median 64, 0.91 s notes, sounding 25%
    program: 71
    pan: -0.4
    width: 0.6
    reverb: 0.28
    gain_db: 0
  1:   # counter_low: cello; median 47, 0.30 s notes, sounding 27%
    program: 42
    pan: 0.4
    width: 0.6
    reverb: 0.28
    gain_db: 0
  2:   # counter_mid: clarinet; median 61, 0.28 s notes, sounding 66%
    program: 71
    pan: -0.25
    width: 0.6
    reverb: 0.28
    gain_db: 0
  3:   # lead_low: french horn; median 54, 0.29 s notes, sounding 67%
    program: 60
    pan: 0.0
    width: 0.6
    reverb: 0.28
    gain_db: 0
  4:   # bass_short: fingered bass; median 25, 0.08 s notes, sounding 21%
    program: 33
    pan: 0.0
    width: 0.25
    reverb: 0.06
    gain_db: 0
  5:   # bass_short: fingered bass; median 25, 0.08 s notes, sounding 22%
    program: 33
    pan: 0.0
    width: 0.25
    reverb: 0.06
    gain_db: 0
  6:   # pluck: pizzicato strings; median 49, 0.19 s notes, sounding 58%
    program: 45
    pan: 0.15
    width: 0.6
    reverb: 0.28
    gain_db: 0
  8:   # drums (standard kit), notes [42, 43, 46, 48, 49, 54]
    program: 0
    pan: 0.0
    width: 0.5
    reverb: 0.15
    gain_db: -3
