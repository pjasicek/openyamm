# dark/temple: first orchestration by orchestrate.py (hand-tune freely; it is never overwritten).
# 36.7 s a pass. GM programs are 0-based; drums: 0 standard kit, 48 orchestral.
# A channel's `slots` give the notes it plays with those FM instrument slots their own instrument.
reverb: {seconds: 2.4, level: 0.32}
channels:
  0:   # lead_mid: oboe; median 63, 0.19 s notes, sounding 38%
    program: 68
    pan: 0.0
    width: 0.6
    reverb: 0.28
    gain_db: 0
  1:   # pad: slow strings; median 77, 1.66 s notes, sounding 43%
    program: 49
    pan: 0.4
    width: 0.9
    reverb: 0.4
    gain_db: -3
  2:   # counter_mid: clarinet; median 61, 0.04 s notes, sounding 14%
    program: 71
    pan: -0.25
    width: 0.6
    reverb: 0.28
    gain_db: 0
  3:   # bass_short: fingered bass; median 32, 0.22 s notes, sounding 27%
    program: 33
    pan: 0.0
    width: 0.25
    reverb: 0.06
    gain_db: 0
  4:   # bass_short: fingered bass; median 44, 0.37 s notes, sounding 22%
    program: 33
    pan: 0.0
    width: 0.25
    reverb: 0.06
    gain_db: 0
  5:   # counter_low: cello; median 56, 0.25 s notes, sounding 19%
    program: 42
    pan: 0.5
    width: 0.6
    reverb: 0.28
    gain_db: 0
  6:   # counter_mid: clarinet; median 63, 0.19 s notes, sounding 34%
    program: 71
    pan: 0.15
    width: 0.6
    reverb: 0.28
    gain_db: 0
  8:   # drums (standard kit), notes [46, 49, 60, 61, 62, 63, 64]
    program: 0
