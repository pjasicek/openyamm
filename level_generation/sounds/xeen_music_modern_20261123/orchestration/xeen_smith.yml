# xeen/smith: first orchestration by orchestrate.py (hand-tune freely; it is never overwritten).
# 30.9 s a pass. GM programs are 0-based; drums: 0 standard kit, 48 orchestral.
# A channel's `slots` give the notes it plays with those FM instrument slots their own instrument.
reverb: {seconds: 2.4, level: 0.32}
channels:
  0:   # counter_high: violin; median 70, 0.44 s notes, sounding 68%
    program: 40
    pan: -0.4
    width: 0.6
    reverb: 0.28
    gain_db: 0
  1:   # lead_mid: oboe; median 62, 0.16 s notes, sounding 50%
    program: 68
    pan: 0.0
    width: 0.6
    reverb: 0.28
    gain_db: 0
  2:   # counter_mid: clarinet; median 58, 0.16 s notes, sounding 50%
    program: 71
    pan: -0.25
    width: 0.6
    reverb: 0.28
    gain_db: 0
  3:   # arpeggio: harp; median 53, 0.16 s notes, sounding 50%
    program: 46
    pan: 0.25
    width: 0.6
    reverb: 0.28
    gain_db: -3
  4:   # bass_short: fingered bass; median 41, 0.18 s notes, sounding 65%
    program: 33
    pan: 0.0
    width: 0.25
    reverb: 0.06
    gain_db: 0
  5:   # bass_short: fingered bass; median 29, 0.18 s notes, sounding 65%
    program: 33
    pan: 0.0
    width: 0.25
    reverb: 0.06
    gain_db: 0
  6:   # bass_short: fingered bass; median 40, 0.10 s notes, sounding 40%
    program: 33
    pan: 0.0
    width: 0.25
    reverb: 0.06
    gain_db: 0
  8:   # drums (orchestral kit), notes [38]
    program: 48
    pan: 0.0
    width: 0.5
    reverb: 0.15
    gain_db: -3
