# dark/outnght2: first orchestration by orchestrate.py (hand-tune freely; it is never overwritten).
# 82.0 s a pass. GM programs are 0-based; drums: 0 standard kit, 48 orchestral.
# A channel's `slots` give the notes it plays with those FM instrument slots their own instrument.
reverb: {seconds: 2.4, level: 0.32}
channels:
  0:   # lead_low: french horn; median 55, 0.32 s notes, sounding 80%
    program: 60
    pan: 0.0
    width: 0.6
    reverb: 0.28
    gain_db: 0
  1:   # counter_high: violin; median 69, 0.60 s notes, sounding 57%
    program: 40
    pan: 0.4
    width: 0.6
    reverb: 0.28
    gain_db: 0
  2:   # pad: slow strings; median 54, 1.30 s notes, sounding 45%
    program: 49
    pan: -0.25
    width: 0.9
    reverb: 0.4
    gain_db: -3
  3:   # pad2: brass section; median 61, 1.28 s notes, sounding 43%
    program: 61
    pan: 0.25
    width: 0.9
    reverb: 0.4
    gain_db: -3
  4:   # pad2: brass section; median 50, 1.28 s notes, sounding 97%
    program: 61
    pan: -0.5
    width: 0.9
    reverb: 0.4
    gain_db: -3
  5:   # counter_mid: clarinet; median 66, 0.65 s notes, sounding 57%
    program: 71
    pan: 0.5
    width: 0.6
    reverb: 0.28
    gain_db: 0
  6:   # bass_short: fingered bass; median 43, 0.19 s notes, sounding 20%
    program: 33
    pan: 0.0
    width: 0.25
    reverb: 0.06
    gain_db: 0
