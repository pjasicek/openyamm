# dark/cstl1rev: first orchestration by orchestrate.py (hand-tune freely; it is never overwritten).
# 28.8 s a pass. GM programs are 0-based; drums: 0 standard kit, 48 orchestral.
# A channel's `slots` give the notes it plays with those FM instrument slots their own instrument.
reverb: {seconds: 2.4, level: 0.32}
channels:
  2:   # lead_high: flute; median 76, 0.22 s notes, sounding 73%
    program: 73
    pan: 0.0
    width: 0.6
    reverb: 0.28
    gain_db: 0
  3:   # counter_mid: clarinet; median 66, 0.22 s notes, sounding 72%
    program: 71
    pan: 0.25
    width: 0.6
    reverb: 0.28
    gain_db: 0
  4:   # counter_low: cello; median 54, 0.34 s notes, sounding 72%
    program: 42
    pan: -0.5
    width: 0.6
    reverb: 0.28
    gain_db: 0
  6:   # counter_high: violin; median 69, 0.21 s notes, sounding 65%
    program: 40
    pan: 0.15
    width: 0.6
    reverb: 0.28
    gain_db: 0
