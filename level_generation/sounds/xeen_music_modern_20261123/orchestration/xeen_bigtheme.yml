# xeen/bigtheme: first orchestration by orchestrate.py (hand-tune freely; it is never overwritten).
# 69.0 s a pass. GM programs are 0-based; drums: 0 standard kit, 48 orchestral.
# A channel's `slots` give the notes it plays with those FM instrument slots their own instrument.
reverb: {seconds: 2.4, level: 0.32}
channels:
  0:   # bass_short: fingered bass; median 31, 0.30 s notes, sounding 71%
    program: 33
    pan: 0.0
    width: 0.25
    reverb: 0.06
    gain_db: 0
  1:   # counter_mid: clarinet; median 67, 0.18 s notes, sounding 35%
    program: 71
    pan: 0.4
    width: 0.6
    reverb: 0.28
    gain_db: 0
  2:   # arpeggio: harp; median 67, 0.11 s notes, sounding 27%
    program: 46
    pan: -0.25
    width: 0.6
    reverb: 0.28
    gain_db: -3
    slots:
      1: {program: 71, pan: 0.5, width: 0.6, reverb: 0.28, gain_db: 0}   # counter_mid: clarinet; median 62, 0.10 s notes, sounding 11%
  3:   # counter_high: violin; median 82, 0.81 s notes, sounding 34%
    program: 40
    pan: 0.25
    width: 0.6
    reverb: 0.28
    gain_db: 0
  4:   # lead_mid: oboe; median 64, 0.11 s notes, sounding 26%
    program: 68
    pan: 0.0
    width: 0.6
    reverb: 0.28
    gain_db: 0
  5:   # pluck: pizzicato strings; median 45, 0.10 s notes, sounding 35%
    program: 45
    pan: 0.5
    width: 0.6
    reverb: 0.28
    gain_db: 0
  6:   # counter_high: violin; median 72, 0.21 s notes, sounding 36%
    program: 40
    pan: 0.15
    width: 0.6
    reverb: 0.28
    gain_db: 0
    slots:
      8: {program: 45, pan: -0.25, width: 0.6, reverb: 0.28, gain_db: 0}   # pluck: pizzicato strings; median 54, 0.05 s notes, sounding 0%
  8:   # drums (standard kit), notes [46, 49, 54, 63, 86]
    program: 0
    pan: 0.0
    width: 0.5
    reverb: 0.15
    gain_db: -3
