# xeen/tavern: first orchestration by orchestrate.py (hand-tune freely; it is never overwritten).
# 27.5 s a pass. GM programs are 0-based; drums: 0 standard kit, 48 orchestral.
# A channel's `slots` give the notes it plays with those FM instrument slots their own instrument.
reverb: {seconds: 2.4, level: 0.32}
channels:
  0:   # counter_high: violin; median 76, 0.26 s notes, sounding 77%
    program: 40
    pan: -0.4
    width: 0.6
    reverb: 0.28
    gain_db: 0
  1:   # counter_high: violin; median 71, 0.19 s notes, sounding 40%
    program: 40
    pan: 0.4
    width: 0.6
    reverb: 0.28
    gain_db: 0
  2:   # lead_mid: oboe; median 63, 0.18 s notes, sounding 47%
    program: 68
    pan: 0.0
    width: 0.6
    reverb: 0.28
    gain_db: 0
  3:   # counter_low: cello; median 50, 0.10 s notes, sounding 42%
    program: 42
    pan: 0.25
    width: 0.6
    reverb: 0.28
    gain_db: 0
  4:   # counter_low: cello; median 50, 0.16 s notes, sounding 41%
    program: 42
    pan: -0.5
    width: 0.6
    reverb: 0.28
    gain_db: 0
  5:   # counter_high: violin; median 76, 0.26 s notes, sounding 77%
    program: 40
    pan: 0.5
    width: 0.6
    reverb: 0.28
    gain_db: 0
  6:   # counter_high: violin; median 71, 0.19 s notes, sounding 40%
