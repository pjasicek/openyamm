# dark/tavern: first orchestration by orchestrate.py (hand-tune freely; it is never overwritten).
# 33.2 s a pass. GM programs are 0-based; drums: 0 standard kit, 48 orchestral.
# A channel's `slots` give the notes it plays with those FM instrument slots their own instrument.
reverb: {seconds: 2.4, level: 0.32}
channels:
  0:   # arpeggio: harp; median 65, 0.08 s notes, sounding 35%
    program: 46
    pan: -0.4
    width: 0.6
    reverb: 0.28
    gain_db: -3
  1:   # counter_high: violin; median 72, 0.40 s notes, sounding 44%
    program: 40
    pan: 0.4
    width: 0.6
    reverb: 0.28
    gain_db: 0
  2:   # bass_short: fingered bass; median 43, 0.11 s notes, sounding 19%
    program: 33
    pan: 0.0
    width: 0.25
    reverb: 0.06
    gain_db: 0
  3:   # arpeggio: harp; median 78, 0.08 s notes, sounding 20%
    program: 46
    pan: 0.25
    width: 0.6
    reverb: 0.28
    gain_db: -3
  4:   # counter_mid: clarinet; median 62, 0.77 s notes, sounding 58%
    program: 71
    pan: -0.5
    width: 0.6
    reverb: 0.28
    gain_db: 0
  5:   # lead_mid: oboe; median 68, 1.18 s notes, sounding 88%
    program: 68
    pan: 0.0
    width: 0.6
    reverb: 0.28
    gain_db: 0
  8:   # drums (standard kit), notes [36, 54]
    program: 0
    pan: 0.0
    width: 0.5
    reverb: 0.15
    gain_db: -3
