  # === (d) Voice lines (D-38, devdocs/xeen/DECISIONS.md; the sheet: devdocs/xeen/AUDIO.md (d)) =====================
  # One Voice Design per speaker (eleven_ttv_v3, one request = three previews; the saved preview keeps the five voices
  # as far apart as possible by a log-mel measure: voices.py), each line read three times with eleven_v3 (stability
  # 0.5), a light treatment (size by formants, not pitch), and a take picked only if both local Whisper models read it
  # (whisper_check.py). Texts are the locked `voice:` lines of the quest YAMLs (m5, m32, m33, m35, m42). Cap: 4 000
  # credits committed for the voice work.

  # --- The voices -----------------------------------------------------------------------------------------------------
  - id: vd_burlock
    group: "Voices: designs"
    kind: voice_design
    title: "King Burlock: the voice design"
    use: "Voice Design previews (three); the chosen one is saved as the voice"
    voice_name: "Xeen King Burlock"
    model: eleven_ttv_v3
    variants: 1
    text: "Ah, more adventurers! I charge you with the quest of finding the Sixth Mirror. No mirror? Get out of my sight! Thank you for rescuing Xeen from that foul spirit."
    prompt: "A blustering, pompous old king: a plump, hearty, chesty mid-low male voice, loud and self-important, easily flustered and quick to splutter with indignation, comic and a little ridiculous but never silly-voiced, crisp diction, no accent. Close, dry studio recording."
  - id: vd_lord_xeen
    group: "Voices: designs"
    kind: voice_design
    title: "Lord Xeen: the voice design"
    use: "Voice Design previews (three); the chosen one is saved as the voice"
    voice_name: "Xeen Lord Xeen"
    model: eleven_ttv_v3
    variants: 1
    text: "The King's little crusaders, all this way up. Kneel, and I may let you fall gently. You have no idea what you have broken. None at all."
    prompt: "A cold, amused usurper lord: a very deep, smooth, dark bass voice, slow and unhurried, quietly mocking, a cruel smile in every word, never raised, velvet and menace, no accent. Close, dry studio recording."
  - id: vd_sheltem
    group: "Voices: designs"
    kind: voice_design
    title: "Sheltem: the voice design"
    use: "Voice Design previews (three); the chosen one is saved as the voice"
    voice_name: "Xeen Sheltem"
    model: eleven_ttv_v3
    variants: 1
    text: "Chosen Ones. You have nothing I need to fear. Corak. You took your time. I have kept this world since before your kind had names."
    prompt: "An ancient, dry, contemptuous guardian gone wrong: an old man's thin, papery, clipped tenor-baritone, cold and exact, bored disdain, every word bitten off, a faint flat mechanical edge as if a machine were speaking through him, no accent. Close, dry studio recording."
  - id: vd_corak
    group: "Voices: designs"
    kind: voice_design
    title: "Corak: the voice design"
    use: "Voice Design previews (three); the chosen one is saved as the voice"
    voice_name: "Xeen Corak"
    model: eleven_ttv_v3
    variants: 1
    text: "Ah! A Soulbox! You have done well. I will hide in the box while you take me to him. Sheltem. The Cube! Take it and run!"
    prompt: "A warm, measured ancient guardian: a calm, kind, resonant mid-low baritone, steady and reassuring, gentle authority, unhurried, with a faint smooth synthetic sheen like a wise machine that cares, no accent. Close, dry studio recording."
  - id: vd_pharaoh
    group: "Voices: designs"
    kind: voice_design
    title: "The Dragon Pharaoh: the voice design"
    use: "Voice Design previews (three); the chosen one is saved as the voice"
    voice_name: "Xeen Dragon Pharaoh"
    model: eleven_ttv_v3
    variants: 1
    text: "Let the two faces of Xeen be one world again. You must have the Cube of Power and the Scepter, and the four sleepers must be awakened."
    prompt: "An ancient dragon king: a very old, warm, slow and solemn male voice, deep and breathy, kind, a soft dry hiss drawn out on the s sounds and a low reptilian rasp in the throat, enormous and gentle. Close, dry studio recording."
  # Second requests for Corak and the Pharaoh: the first previews sat at 67-85 Hz beside Lord Xeen's (69-79 Hz), the
  # closest pairs of the set; these ask for a lighter Corak and an older, thinner Pharaoh.
  - id: vd_corak_2
    group: "Voices: designs"
    kind: voice_design
    title: "Corak: the voice design, second request (lighter)"
    use: "Voice Design previews (three); the chosen one is saved as the voice"
    voice_name: "Xeen Corak"
    model: eleven_ttv_v3
    variants: 1
    text: "Ah! A Soulbox! You have done well. I will hide in the box while you take me to him. Sheltem. The Cube! Take it and run!"
    prompt: "A warm, measured ancient guardian: a clear, kind, mid-range baritone, lighter and brighter than a bass, steady and reassuring, gentle authority, unhurried, with a faint smooth synthetic sheen like a wise machine that cares, no accent. Close, dry studio recording."
  - id: vd_pharaoh_2
    group: "Voices: designs"
    kind: voice_design
    title: "The Dragon Pharaoh: the voice design, second request (older, thinner)"
    use: "Voice Design previews (three); the chosen one is saved as the voice"
