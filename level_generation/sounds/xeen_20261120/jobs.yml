# Xeen's ElevenLabs sound jobs (lane AU, devdocs/xeen/lanes/AU.md; the sound list is devdocs/xeen/AUDIO.md), run with
# tools/run_elevenlabs.sh (tools/audio/README.md). Output names are the engine's sound names: install.py copies
# out/<id>/<output>.wav to assets_dev/worlds/xeen/audio/xeen/<output>.wav and writes the world's sound rows
# (assets_dev/worlds/xeen/audio/sounds.txt, ids 62000-63999: devdocs/xeen/AUDIO.md) from install.yml.
# Prompts describe the sound; they never name a game, film or artist.
#
# Loudness (as Hesper's batch 3, design/kreegan_world/AUDIO.md): creature attack, wince and death lifted until their
# loudest 100 ms reaches -9 dBFS, idle fidgets -11, heavy bodies (golems, worms) -8 with a 30 Hz high-pass and a low
# shelf, picked toward loudness and low end; event one-shots -9 (quiet ones -11, the gong -7); peaks at -1 dBFS by a
# look-ahead limiter, boost capped at 10 dB. Beds are loops levelled to -20 dBFS RMS, mono (they play as placed,
# positional ambient sounds, devdocs/AMBIENT_SOUNDS.md).
schema: openyamm.elevenlabs.jobs.v1
budget: 140000                    # session 5 (2026-11-21): raised by the user's word ("use however much you need, if it makes sense")
music: false                      # music stays MM6-MM8 tracks by number (ROADMAP Q9, devdocs/xeen/MUSIC.md)
defaults:
  kind: sfx
  model: eleven_text_to_sound_v2
  prompt_influence: 0.45
  variants: 3
  max_boost_db: 10
  formats: [wav_48000, mp3_44100_192]
jobs:
  # === (a) Monster voices: the new creatures first ==================================================================
  # One set per family (attack, wince, death, idle fidget); bigger tiers and bosses are the set pitched down (derived
  # jobs), never a new generation.

  # --- Toads (11450-11452; X1 Toad Meadow, X3) -----------------------------------------------------------------------
  - id: xeen_toad_attack
    group: "Monsters: toads"
    use: Giant and Bog Toad attack (a tongue lash)
    duration: 0.9
    loudness_db: -9
    prompt: >-
      A huge toad lunging at its prey: a wet sticky tongue lashing out with a whip-like snap and a heavy slapping
      smack, a short throaty croaking grunt, close
  - id: xeen_toad_wince
    group: "Monsters: toads"
    use: toads hurt
    duration: 0.6
    loudness_db: -9
    prompt: "A giant toad struck in a fight: a short strangled croak and a wet squelch, close"
  - id: xeen_toad_death
    group: "Monsters: toads"
    use: toads' death
    duration: 1.6
    loudness_db: -9
    prompt: >-
      A huge toad dying: a long deflating gurgling croak that breaks off, its heavy wet body flopping onto mud
  - id: xeen_toad_fidget
    group: "Monsters: toads"
    use: toads' idle fidget
    duration: 1.6
    loudness_db: -11
    prompt: >-
      A huge toad sitting in a marsh: two deep resonant bassy croaks with a throaty wet ribbit, slow breathing, close
  - {id: xeen_toad_c_attack, kind: derived, from: [xeen_toad_attack], pitch: -2, group: "Monsters: toads", use: "Swamp Toad (C) attack, the set two semitones down"}
  - {id: xeen_toad_c_wince, kind: derived, from: [xeen_toad_wince], pitch: -2, group: "Monsters: toads", use: "Swamp Toad hurt"}
  - {id: xeen_toad_c_death, kind: derived, from: [xeen_toad_death], pitch: -2, group: "Monsters: toads", use: "Swamp Toad death"}
  - {id: xeen_toad_c_fidget, kind: derived, from: [xeen_toad_fidget], pitch: -2, group: "Monsters: toads", use: "Swamp Toad fidget"}

