# Player stand-in bodies: roster (plan of 2026-11-20). Nothing in this file exists as a model yet.
# Read README.md beside this file first. Values marked "estimate" are judgement, not measurement.
schema: openyamm.playerBodies.plan.v1
status: planned

# The one rig layout every skinned player body uses.
rig:
  id: humanoid_set_b56
  family: Humanoid set layout (B_* bones), the source-frame rig of level_generation/creatures/CLAUDE_HUMANOID_NPC_PLAYBOOK.md
  joints: 56
  joint_list_reference: assets_source/worlds/mm6/models/mm6_bar1.glb   # its 57 joints minus the bone "Sword"
  template_project: level_generation/creatures/mm6_natm_claude        # scripts to copy (playbook: best current template)
  fit: joints fitted to each body's own mesh (gate G3); names and hierarchy identical on every body
  clips: baked into each body file from one clip list by rebuild.sh; the engine reads clips from the model's own file
  facing: -Y in Blender, yaw_offset -1.570796327 in the binding (as every MM6-MM8 humanoid)

# Plain nodes under the bones. Names and axes are those of the first-person arms (assets_dev/engine/view_model/arms.glb),
# so game/render/HeldWeapons.h (heldWeaponMatrix) and the w_*.glb templates work unchanged. The templates are in
# Oblivion units (about 1.43 cm), so each mount node carries that scale against the body's units.
mount_nodes:
  - {node: Weapon, parent: B_R_Hand, holds: "main-hand weapon; crossbow stock", axes: "palm at origin, head +Y, edge +X"}
  - {node: OffHandWeapon, parent: B_L_Hand, holds: "second weapon when dual wielding", axes: "mirror of Weapon"}
  - {node: Torch, parent: B_L_Hand, holds: "bow in use", axes: "limbs along Y, riser at origin, tips toward -X"}
  - {node: Shield, parent: B_L_Forearm, holds: shield, axes: "face toward -Y, top along -Z"}
  - {node: BackWeapon, parent: B_Spine2, holds: "stowed bow while a melee weapon is in the hand"}
  - {node: Quiver, parent: B_Spine2, holds: "reserved, unused in the first release"}
  - {node: Helm, parent: B_Head, holds: "the worn helm's ground item model"}
  - {node: B_Head, parent: B_Neck, holds: "the race head (a static model)"}

# animation.sockets of the binding.
sockets:
  palm_left: Socket_Palm_Left        # spell charge and release
  palm_right: Socket_Palm_Right
  arrow: Socket_Arrow                # arrow release, on the bow hand
  weapon_tip: {node: Weapon, offset: "set per weapon length at run time"}
  head_top: Socket_Head_Top          # name label

# Clip names are <Set><Action>. Sets follow FirstPersonViewModel::WeaponSet.
# source: library = git-ignored anim_library/ (humanoid set, Mixamo), chosen at gate G1;
#         authored = mm6_natm_claude/scripts/author_attack.py or author_carry.py; mm9 = retargeted MM9 clip (untested).
clip_set:
  id: player_v1
  count: 48
  locomotion_per_set: [Standing, Walking, Running]
  sets:
    - {set: Unarmed, when: "nothing in the hands", attacks: [UnarmedAttack, UnarmedAttack2], source: "library: Unarmed set; upright idle and walk from Mixamo"}
    - {set: Onehand, when: "one-handed weapon with a free off hand; wand; blaster", attacks: [OnehandAttack, OnehandAttack2], source: "library: 1Hand attacks; carry authored (the set's own idle is a low guard)"}
    - {set: Shield, when: "one-handed weapon and a shield", attacks: [ShieldAttack], source: "library: Armed-Shield set, Mixamo sword-and-shield"}
    - {set: Dual, when: "a weapon in each hand", attacks: [DualAttack, DualAttack2], source: "to be made: one-handed attacks mirrored onto the left arm"}
    - {set: Twohand, when: "two-handed sword, axe or hammer", attacks: [TwohandAttack, TwohandAttack2], source: "library: 2Hand Sword and 2Hand Axe sets"}
    - {set: Pole, when: "spear, trident, halberd or poleaxe in two hands", attacks: [PoleAttack, PoleAttack2], source: "library: 2Hand Spear locomotion; thrust authored (underhand)"}
    - {set: Staff, when: staff, attacks: [StaffAttack, StaffCast], source: "library: 2Hand Staff set"}
    - {set: Bow, when: "bow in the hands", attacks: [BowAttack], source: "library: 2Hand Bow set, Mixamo bow clips"}
    - {set: Crossbow, when: "crossbow in the hands", attacks: [CrossbowAttack], source: "library: 2Hand Crossbow set"}
  shared:
    - {clip: Cast, source: "library: Unarmed and Armed casts (left open hand, release forward)"}
    - {clip: Cast2, source: "library (raise, for spells on oneself)"}
    - {clip: Hit, source: "library: Unarmed set"}
    - {clip: Death, source: "library: Unarmed set"}
    - {clip: Dead, source: "last key of Death"}
    - {clip: Fidget, source: library}
  later_optional:
    - {clips: [Taunt, Bow, Applause, Cower, Sit], source: "mm9 townsfolk and soldiers, retargeted; needs a player emote command in the engine"}

armour_looks: [cloth, leather, chain, plate]     # defined in armour_looks_manifest.yml; every skinned body carries all four

# ---------------------------------------------------------------------------------------------------------------------
# Skinned bodies. One model file per body with four looks as material variants.
# Native art is in assets_legacy/icons_20260926/engine/icons/<name>.bmp; restored x2 copies in assets_dev/engine/icons_x2/.
# Worn armour art per doll type: <armour icon>v<doll type + 1>.bmp and ...a.bmp (arm piece), e.g. item096v1.bmp.
bodies:
  - id: pb_male
    kind: skinned_body
    race: shared
    sex: male
    doll_type: 0
    base_rig: humanoid_set_b56
    model_file: engine/models/player_male.glb
    source_references:
      paperdoll_bodies: [pc01bod, pc03bod, pc05bod, pc07bod, mlabod, mlbbod, 7pc01bod, 7pc02bod, 7pc04bod]
      worn_armour_art: "v1 variants: cloth none; leather item084v1-item088v1; chain item089v1-item093v1; plate item094v1-item098v1"
      portraits: "pc01-, pc03-, pc05-, pc07- (face reference for ph_human_male)"
      existing_models_for_reference: [mm7_m222 (Fighter Chain, 57 joints), mm6_bar1, mm6_natm, mm9_guard (three armour paints on one mesh)]
      start_from: "new Meshy mesh; scripts from mm6_natm_claude"
    clip_set: player_v1
    sockets: all
    armour_looks: [cloth, leather, chain, plate]
    head: separate (ph_* by race)
    wave: 1
    status: planned

  - id: pb_female
    kind: skinned_body
    race: shared
    sex: female
    doll_type: 1
    base_rig: humanoid_set_b56
    model_file: engine/models/player_female.glb
    source_references:
      paperdoll_bodies: [pc02bod, pc04bod, pc06bod, pc08bod, grlabod, grlbbod, 7pc05bod, 7pc07bod, 7pc08bod]
      worn_armour_art: "v2 variants (item084v2 ... item098v2)"
      portraits: "pc02-, pc04-, pc06-, pc08-"
      existing_models_for_reference: [mm6_pfem (woman's proportions, skirt strips), mm6_natf, mm6_dru1, mm8_m416 (pirate woman)]
      start_from: "new Meshy mesh; clip list and scripts from pb_male"
    clip_set: player_v1
    sockets: all
    armour_looks: [cloth, leather, chain, plate]
    head: separate (ph_* by race)
    wave: 3
    status: planned

  - id: pb_dwarf_male
    kind: skinned_body
    race: dwarf
    sex: male
    doll_type: 4
    base_rig: humanoid_set_b56
    model_file: engine/models/player_dwarf_male.glb
    source_references:
      paperdoll_bodies: [7pc13bod, 7pc14bod]
      worn_armour_art: "v5 variants (item084v5 ... item098v5)"
      portraits: "7pc13-, 7pc14-"
      existing_models_for_reference: [mm7_m190 (Dwarf A, 57 joints, same joint set as mm6_bar1), mm6_dwa1, mm9_dwarf]
      start_from: "new Meshy mesh; clip list and scripts from pb_male"
    clip_set: player_v1
    sockets: all
    armour_looks: [cloth, leather, chain, plate]
    head: separate (ph_dwarf_male, ph_dwarf_female, ph_lich)
    wave: 5
    status: planned

  - id: pb_dwarf_female
    kind: skinned_body
    race: dwarf
    sex: female
    doll_type: 4
    base_rig: humanoid_set_b56
    model_file: engine/models/player_dwarf_female.glb
    optional: true
    until_built: "pb_dwarf_male with ph_dwarf_female"     # the original game also draws both sexes on one dwarf doll type
    source_references:
      paperdoll_bodies: [7pc15bod, 7pc16bod]
      worn_armour_art: "v5 variants (shared with dwarf men in the original)"
      portraits: "7pc15-, 7pc16-"
      start_from: "new Meshy mesh; clip list and scripts from pb_male"
    clip_set: player_v1
    sockets: all
    armour_looks: [cloth, leather, chain, plate]
    head: separate (ph_dwarf_female)
    wave: 6
