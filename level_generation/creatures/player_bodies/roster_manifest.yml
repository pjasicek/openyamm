      start_from: "new Meshy mesh; clip list and scripts from pb_male"
    clip_set: player_v1
    sockets: all
    armour_looks: [cloth, leather, chain, plate]
    head: part of the body (own 1K head texture set)
    until_built: {keeps_monster_model: true, descriptors: [Troll A, ATroll A, Troll Pesant A]}
    wave: 5
    status: planned

