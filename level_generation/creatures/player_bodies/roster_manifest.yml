  - id: pb_minotaur
    kind: skinned_body
    race: minotaur
    sex: male
    doll_type: 2
    base_rig: humanoid_set_b56
    model_file: engine/models/player_minotaur.glb
    source_references:
      paperdoll_bodies: [pc21bod, pc22bod, lminbod, zminbod]
      worn_armour_art: "v3 variants (item084v3 ... item098v3)"
      portraits: "pc21-, pc22-"
      existing_models_for_reference: [mm7_m286 (AMinotaur A, 57 joints, same joint set as mm6_bar1), mm8_m484 (Minotaur A), mm6_min1]
      start_from: "new Meshy mesh; clip list and scripts from pb_male"
