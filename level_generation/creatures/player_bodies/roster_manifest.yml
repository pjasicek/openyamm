# ---------------------------------------------------------------------------------------------------------------------
# Races that keep an existing monster model (bindings in assets_dev/worlds/<world>/models/actors.yml).
kept_monster_models:
  - race: dragon
    race_id: 5
    doll_type: 5
    permanent: true
    descriptors: [Wimpy Dragon A, Dragon A, ADragon A, DragonLand A]     # today's order in game/coop/CoopBodies.cpp
    models: [mm8_m492, mm7_m182, mm6_wyrm]
    why: "doll type 5 equips nothing (doll_types.txt), the body is not humanoid, first person has its own forelegs"
    also_covers: ["lich dragon (portrait 68)", "dragon ghost (portrait 69)"]
  - race: minotaur
    race_id: 3
    permanent: false
    descriptors: [Minotaur A, BMinotaur A, AMinotaur A, Minotaur Pesant A]
    why: "stands in until pb_minotaur is built (wave 5)"
  - race: troll
    race_id: 4
    permanent: false
    descriptors: [Troll A, ATroll A, Troll Pesant A]
    why: "stands in until pb_troll is built (wave 5)"
  - race: any
    permanent: false
    descriptors: "the tables of game/coop/CoopBodies.cpp as they are today"
    why: "fallback whenever a planned body or head is not installed in the mounted packages"

# ---------------------------------------------------------------------------------------------------------------------
# Skin colours (region R ramps), chosen by race and form. Colours are to be measured from the portraits; none exist yet.
