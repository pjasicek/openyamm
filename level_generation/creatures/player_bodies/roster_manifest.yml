not_player_bodies:
  - {portrait_rows: [29, 30, 31], why: "no race in the table (two unused rows and the wetsuit row)"}

# The rule that turns a character into an appearance, in the order to check.
selection_rule:
  - "doll type 5 (dragon), whatever the race: the kept dragon model"
  - "body by doll type and sex: 0 pb_male, 1 pb_female, 2 pb_minotaur, 3 pb_troll, 4 pb_dwarf_male or pb_dwarf_female"
  - "head by race and sex; race id 8 is a half-orc when the portrait row's World is mm9, else a goblin; a lich takes ph_lich"
  - "skin ramp by race; a lich or zombie form replaces it"
  - "a body or head that is not installed: today's monster table in game/coop/CoopBodies.cpp"
