<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MM9 creature review</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#181b20;color:#edf0f4;--line:#3b424d;--muted:#aab4c0;--card:#21262d;--accent:#80b5ed;--ok:#7fcf98;--warn:#e8c26a;--bad:#ef8a80}
*{box-sizing:border-box}body{margin:0;background:#181b20}
header{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
h1{font-size:19px;margin:0}h2{font-size:17px;margin:0 0 8px}h3{font-size:14px;margin:14px 0 6px;color:#d7dee7}
p{margin:6px 0;line-height:1.45;color:#cfd6df}small,.muted{color:var(--muted);font-size:12.5px}
a{color:#a6cfff}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 50px)}
nav{border-right:1px solid var(--line);padding:10px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
nav .group{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 6px 4px}
nav button{display:flex;justify-content:space-between;gap:6px;align-items:center;width:100%;text-align:left;font:inherit;font-size:14px;color:inherit;background:none;border:1px solid transparent;border-radius:6px;padding:6px 8px;cursor:pointer}
nav button:hover{background:#262c35}nav button.active{background:#2b3f57;border-color:#4e7aa6}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:#5b6573}
.dot.ok{background:var(--ok)}.dot.work{background:var(--bad)}.dot.open{background:var(--warn)}.dot.blocked{background:#5b6573;outline:1px dashed #8b95a3}
main{padding:16px 20px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:0 0 14px}
.status{display:inline-block;font-size:12px;border-radius:10px;padding:2px 9px;margin-left:8px;vertical-align:2px;border:1px solid}
.status.ok{color:var(--ok);border-color:#3f7a52}.status.open{color:var(--warn);border-color:#7d6a37}.status.blocked{color:var(--muted);border-color:#56606d}
iframe{width:100%;height:calc(100vh - 66px);min-height:520px;border:1px solid var(--line);border-radius:8px;background:#181b20;display:block;margin:0 0 14px}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pics figure{margin:0;background:#2a2f37;border-radius:6px;overflow:hidden}
.pics img{width:100%;height:190px;object-fit:contain;background:#45484b;display:block;cursor:zoom-in}
.pics figcaption{font-size:12px;padding:5px 8px;color:var(--muted)}
ul{margin:4px 0;padding-left:20px}li{margin:4px 0;line-height:1.4}
.verdict{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.verdict button,.opts label,.tools button{font:inherit;font-size:14px;color:inherit;background:#292e36;border:1px solid #566170;border-radius:6px;padding:6px 12px;cursor:pointer}
.verdict button:hover,.tools button:hover{background:#3d4755}
.verdict button.on.ok{background:#25492f;border-color:var(--ok)}.verdict button.on.work{background:#55302c;border-color:var(--bad)}
textarea{width:100%;font:inherit;font-size:14px;color:inherit;background:#1c2026;border:1px solid #566170;border-radius:6px;padding:7px;resize:vertical}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid #91c8ff;outline-offset:1px}
.q{border-top:1px solid var(--line);padding:12px 0}.q:first-of-type{border-top:0}
.q .title{font-weight:600}.q .who{font-size:12px;color:var(--muted);margin-left:6px}
.opts{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.opts label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;padding:7px 10px;line-height:1.35}
.opts input{margin-top:3px}.opts label:has(input:checked){background:#2b3f57;border-color:#6d9fd0}
.rec{color:var(--ok);font-size:12px;margin-left:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#answers{font:12px ui-monospace,monospace;min-height:120px}
.summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0}
.summary div{background:#1c2026;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.summary b{display:block;font-size:20px}
.overlay{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
.overlay img{max-width:96vw;max-height:94vh;object-fit:contain}
.viewerpick{display:flex;gap:8px;margin:0 0 8px}
.viewerpick button{font:inherit;font-size:13px;color:inherit;background:#292e36;border:1px solid #566170;border-radius:6px;padding:4px 10px;cursor:pointer}
.viewerpick button.active{background:#315f8c;border-color:#a6d3ff}
@media(max-width:820px){.layout{grid-template-columns:1fr}nav{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}iframe{height:85vh}main{padding:12px 16px}}
</style>
<header><h1>MM9 creature review</h1><span class="muted" id="headcount"></span></header>
<div class="layout">
<nav id="nav"></nav>
<main id="main"></main>
</div>
<div class="overlay" id="overlay"><img alt=""></div>
<script>
const P = d => `../../${d}/`;

// Every 3D creature built for the MM9 rework, grouped by route. Paths are relative to this page.
const CREATURES = [
  // Villagers: the humanoid route (v2 after your v1 review).
  {id:'forad', group:'Villagers (humanoid route, v2)', name:'Forad Darre', dir:'mm9_forad_claude', status:'ok', rework:'Texture pass applied after your approval: body 26 -> 54 % used (+46 % density), head repainted sharper (same face, scar, beard); arm skin pulled back to the approved tone; abs and bracer band now follow the reference. Sheets: v2/review/texpass_compare.png, texpass_head_closeups.png', approved:'"forad darre - OK" (2026-10-30, v3.2)',
   summary:'Rebuilt on the humanoid playbook after your v1 review: new rig, five-finger hands, a separate head texture and Mixamo clips (idle, walk, run, examine, talk, formal bow, punch, hit, dying).',
   look:['Head and chin: the new head texture, and the chin that tore on v1 (the tearing came from the MM9 weights and is gone).',
         'Hands in Talk and Bow: on v1 the right arm sank into the torso. The arm and hand gate now finds no hand or forearm inside the body on any frame.',
         'Bow: a quick formal bow with the spine bent 1.8× deeper so it reads as courtly.'],
   pics:[['references_hd/mm9_views.png','MM9 original'],['references_hd/00_three_quarter.png','HD master'],['v2/review/clips_final.png','v2 clips'],['v2/review/ingame_sheet.png','In game: all three villagers']]},
  {id:'yrsa', group:'Villagers (humanoid route, v2)', name:'Yrsa the Troll', dir:'mm9_yrsa_claude', status:'ok', rework:'Boots attached after your approval: each boot now reaches up into the skirt and moves with it (was 5 cm off / opening in Hit); clips, textures and look unchanged. Sheets: v2/review/texpass_shoes_compare_tex.png, texpass_shoes_compare_xray.png', approved:'"good, including the animations" (2026-10-30)',
   summary:'You approved the animations on v1, so the MM9 clips stay. New five-finger hands follow MM9\'s finger curl. New head set: face, white hair, hood and braids are painted in one pass, so there is no patch seam.',
   look:['Face and hair: v1 had skin colour leaking into the hair and a hard seam at the jaw.',
         'Fidget: one in-between frame still puts a hand 3.8 cm into the body. The wide sleeves brush the dress (cloth on cloth).'],
   pics:[['references_hd/mm9_views.png','MM9 original'],['references_hd/00_three_quarter.png','HD master'],['v2/review/fidget_final.png','Fidget after the fix'],['../mm9_forad_claude/v2/review/ingame_sheet.png','In game: all three villagers']]},
  {id:'annud', group:'Villagers (humanoid route, v2)', name:'Annud Redeye', dir:'mm9_annud_claude', status:'ok', rework:'Texture pass applied after your approval: body texture 25 -> 59 % used (+57 % density), head repainted sharper (same face); tunic lost its dark blotches, trim a brighter gold. Sheets: v2/review/texpass_compare.png, texpass_head_closeups.png', approved:'"anud - ok" (2026-10-30, after the face fix)',
   summary:'You said v1 was good overall, so the body and MM9 clips stay. New five-finger hands and a new head texture.',
   look:['Head texture and hands.',
         'Talk: one in-between frame puts a fingertip 5.5 cm into the tunic skirt. The wide sleeves brush the tunic (cloth on cloth).'],
   pics:[['references_hd/mm9_views.png','MM9 original'],['references_hd/00_three_quarter.png','HD master'],['v2/review/heads_all_v2.png','v2 heads'],['../mm9_forad_claude/v2/review/ingame_sheet.png','In game: all three villagers']]},

  // Approved earlier on the MM9 rig-reuse route.
  {id:'dfly', group:'Monsters, approved', name:'Dragonfly', dir:'mm9_dfly_claude', status:'ok', rework:'Texture pass applied after your approval: wing texture now fills 57 % of its image (was 13 %), veins about 2x sharper, colours pinned to the approved tiers. Sheets: review/texpass_closeups_sheet.png, texpass_tiers_sheet.png', approved:'"dragonfly - very good" (2026-10-29)',
   summary:'Reference for the MM9 rig-reuse route: a new HD mesh on the original MM9 skeleton, playing MM9\'s own clips.',
   look:[], pics:[['references_hd/mm9_views_tier1.png','MM9 original'],['references_hd/00_three_quarter.png','HD master'],['review/ingame_tiers_sheet.png','In game'],['review/texture_classes_tiers.png','Tiers']]},
  {id:'lobber', group:'Monsters, approved', name:'Lobber', dir:'mm9_lobber_claude', status:'ok', rework:'Texture pass applied after your approval: sharper Lobber and Pod, same colours and animation.', approved:'"lobber / lobber pod - good" (2026-10-30)',
   summary:'Stands upright instead of hanging from the ceiling. The pods are a separate model: switch viewers above the viewer.',
   viewers:[['review/viewer/index.html','Lobber'],['review/viewer_pod/index.html','Lobber Pod']],
   look:[], pics:[['references_hd/mm9_views_tier1.png','MM9 original'],['references_hd/00_three_quarter.png','HD master'],['review/ingame_lobber_sheet.png','In game: Lobber'],['review/ingame_pods_sheet.png','In game: pods'],['review/lobber_texture_classes_tiers.png','Lobber tiers'],['review/pod_texture_classes_tiers.png','Pod tiers']]},

  // New: built on the MM9 rig-reuse route, waiting for your artistic acceptance.
  {id:'icky', group:'Monsters, new', name:'Flying Icky', dir:'mm9_icky_claude', status:'ok', rework:'Texture pass applied after your approval: sharper skin, same colours and animation.', approved:'"flying icky - good" (2026-10-30)',
   summary:'Airborne, Flying and Astral Icky. MM9 gives all three one skin, so the tiers differ only in size (0.5 / 1 / 2).',
   look:['The bite flares the mouth into a wide red funnel, as MM9 does.',
         'Wings are our own closed leaves (as on the Dragonfly). The left half is a mirror of the right, because Meshy built only one full leg.'],
   pics:[['references_hd/mm9_views_tier1.png','MM9 original'],['references_hd/00_three_quarter.png','HD master'],['review/ingame_sheet.png','In game']]},
  {id:'wmut', group:'Monsters, new', name:'Winged Mutant', dir:'mm9_wingedmutant_claude', status:'ok', rework:'Texture pass applied after your approval: body/wing texture used 8 % of the image, now 52 % (2.5x sharper); the face unchanged. The wing membrane is a few shades lighter with more visible grain; check it. Sheets: review/texpass_closeups_sheet.png, texpass_tiers_sheet.png', approved:'"winged mutant - ok" (2026-10-30, after the rework)',
   summary:'Winged Oddity, Winged Mutant and Winged Aberration.',
   look:['Winged Aberration: MM9 paints silver armour plates on its torso. Ours takes only its colours, with no plate pattern.',
         'The face reads at game distances but not in extreme close-up; it has no separate head texture.'],
   pics:[['references_hd/mm9_views_tier1.png','MM9 original'],['references_hd/00_three_quarter.png','HD master'],['review/ingame_sheet.png','In game'],['review/wmut_texture_classes_tiers.png','Tiers']]},
  {id:'gdemon', group:'Monsters, new', name:'Greater Demon', dir:'mm9_greaterdemon_claude', status:'ok', approved:'"greater demon - ok" (2026-10-30, v2)',
   summary:'One skin, no tiers. The wings use MM9\'s own wing shape, painted by the retexture.',
   look:['The wing outline is MM9\'s low-poly silhouette with flat panels.',
         'Not exported: MM9\'s emergence from the Lesser Demon (the engine has no spawn role), block, dodge and taunt.'],
   pics:[['references_hd/mm9_views_tier1.png','MM9 original'],['references_hd/00_three_quarter.png','HD master'],['review/ingame_demon_models_sheet.png','In game'],['review/anim_textured_sheet.png','Clips']]},
  {id:'eye', group:'Monsters, new', name:'Eye', dir:'mm9_eye_claude', status:'ok', rework:'Texture pass applied after your approval: 55 % atlas. The pebbled hide is restored from the approved paint, with relief; a few pink flecks on tier B are gone.', approved:'"eye - ok" (2026-10-30, after the leg fix)',
   summary:'Eye, Orbus and Oculus.',
   look:['The eyelid does not blink.',
         'Meshy painted a black pupil with a brown ring instead of MM9\'s blue-grey iris. Tiers B and C turn it into MM9\'s fiery eye.',
         'Standing floats 0.43 m above the floor, so the lowest point of the lunge stays clear.'],
   pics:[['references_hd/mm9_views_tier1.png','MM9 original'],['references_hd/00_three_quarter.png','HD master'],['review/ingame_sheet.png','In game'],['review/eye_texture_classes_tiers.png','Tiers']]},
  {id:'magreeb', group:'Monsters, new', name:'Magreeb', dir:'mm9_magreeb_claude', status:'ok', approved:'"magreeb - ok" (2026-10-30, after the texture pass)',
   summary:'Magreeb Spawn, Magreeb, Magreeb Baby and Armored Magreeb. As in MM9, the first three share one skin and differ only in size.',
   look:['Meshy\'s arms were shorter than MM9\'s and are stretched along the MM9 arm, so the upper arm and claw are thicker.',
         'Each pincer is one piece, so the web between the blades stretches when the claw opens.'],
   pics:[['references_hd/mm9_views_tier1.png','MM9 original'],['references_hd/00_three_quarter.png','HD master'],['review/ingame_lindisfarne_sheet.png','In game'],['review/magreeb_texture_classes_tiers.png','Tiers']]},
  {id:'basilisk', group:'Monsters, new', name:'Basilisk', dir:'mm9_basilisk_claude', status:'ok', rework:'Texture pass applied after your approval: atlas 35 to 58 %. Scales read as a fine dark net, frill rays slightly dotted up close.', approved:'"basilisk - ok" (2026-10-30)',
   summary:'Basilisk and Fibrase Basilisk share one look, as in MM9. The King Basilisk is blue-black.',
   look:['Meshy\'s legs were tucked in, so the upper segments are stretched up to 2.5× to match MM9\'s sprawl.',
         'Death is MM9\'s own: the lizard rears up and turns onto its back.'],
   pics:[['references_hd/mm9_views_tier1.png','MM9 original'],['references_hd/00_three_quarter.png','HD master'],['review/ingame_basilisk_sheet.png','In game'],['review/basilisk_texture_classes_tiers.png','Tiers']]},
  {id:'terror', group:'Monsters, new', name:'Terror', dir:'mm9_terror_claude', status:'ok', rework:'Texture pass applied after your approval: 60 % atlas, same colours and animation.', approved:'"terror - ok" (2026-10-30, after the head fix)',
   summary:'Amphibious, Desert and Reptilian Terror. Two legs, no arms, six head tentacles.',
   look:['The tentacle roots sit up to about 0.15 m from MM9\'s pivots, and the long tentacles are stretched about 1.3×.',
         'Teeth take a slight pink tint in tiers B and C.',
         'No in-game capture was made for this one; the sheet below is from the viewer.'],
   pics:[['references_hd/mm9_views_tier1.png','MM9 original'],['references_hd/00_three_quarter.png','HD master'],['review/viewer_shots_sheet.png','Viewer shots'],['review/terror_texture_classes_tiers.png','Tiers']]},
  {id:'jelly', group:'Monsters, new', name:'Jellyspore', dir:'mm9_jelly_claude', status:'ok', approved:'"jellyspore - good" (2026-10-30)',
   summary:'Jellyspore, Gelatinous Spore and Nettle Spore. MM9 has only water clips for this body; they play as its flight.',
   look:['Opaque: MM9 draws it see-through (see the translucency question).',
         'Death is ours, because MM9 has none: it recoils, goes limp and tips onto its side.',
         'MM9\'s iridescent B/C bell becomes violet-blue. The Nettle Spore\'s white flicker is not reproduced, so it reads like B.',
         'In the inverted-bell poses the top and the dark underside show as a double rim.'],
   pics:[['references_hd/mm9_views_tier1.png','MM9 original'],['references_hd/00_three_quarter.png','HD master'],['review/ingame_sheet.png','In game'],['review/jelly_texture_classes_tiers.png','Tiers']]},
  {id:'seamon', group:'Monsters, new', name:'Sea Monster', dir:'mm9_seamon_claude', status:'ok', approved:'"sea monster ok" (2026-10-30; stray polygons under the tail being removed)', rework:'Stray shards removed (r5): two flat flaps under the tail, not in MM9. Sheets: review/mouth_20261030/shards_viewer_shots.png, shards_viewer_closeups.png',
   summary:'Male and Female. A water monster without water: it is an ordinary ground actor (see the Sea Monster question).',
   look:['The lunge and wince lift the body by up to about 1 m, where MM9\'s limbs would reach below it.',
         'Its only placements are two in the Wizard\'s Lab pool.'],
   pics:[['references_hd/mm9_views_tier1.png','MM9 original'],['references_hd/00_three_quarter.png','HD master'],['review/ingame_sheet.png','In game'],['review/sea_texture_classes_tiers.png','Tiers']]},
  {id:'nagate', group:'Monsters, new', name:'Nagate', dir:'mm9_nagate_claude', status:'ok', rework:'Texture pass applied after your approval: atlas 39 to 66 %, finer shell pattern, gold claws slightly brighter.', approved:'"nagate - good" (2026-10-30)',
   summary:'Nagate Hatchling, Nagate and Nagate Elder.',
   look:['Legs are Meshy\'s thin jointed legs, stretched and widened; MM9\'s are flat blades.',
         'Tier B: MM9\'s crisp stripes read as yellow-orange patches on the violet wing cases.'],
   pics:[['references_hd/mm9_views_tier1.png','MM9 original'],['references_hd/00_three_quarter.png','HD master'],['review/ingame_sheet.png','In game'],['review/nagate_texture_classes_tiers.png','Tiers']]},
  {id:'dagrell', group:'Monsters, new', name:'Dagrell', dir:'mm9_dagrell_claude', status:'ok', rework:'Texture pass applied after your approval: atlas 12 to 53 %, sharp veining. Misses two targets on purpose: thin bones trade tiny pieces against stretch.', approved:'"dagrell - ok" (2026-10-30, after the joint fix)',
   summary:'Dagrell, Venomous Dagrell and Spectre Dagrell.',
   look:['Opaque: MM9 draws Dagrells see-through (see the translucency question).',
         'MM9 has no death clip; ours is a wince, a crouch and a roll onto the side.',
         'The left arm mirrors the right. The mandible edge is ragged, and the skull is rounder than MM9\'s.',
         'Tier B is a lighter green than MM9\'s.'],
   pics:[['references_hd/mm9_views_tier1.png','MM9 original'],['references_hd/00_three_quarter.png','HD master'],['review/ingame_sheet.png','In game'],['review/dagrell_texture_classes_tiers.png','Tiers']]},
  {id:'wolf', group:'Monsters, new', name:'Wolf', dir:'mm9_wolf_claude', status:'ok', approved:'"wolf - ok" (2026-10-30, r5)',
   summary:'Grey, Red and Black Wolf. Third revision, on a cleaned body.',
   look:['The muzzle is paler than MM9\'s dark mask. The Red Wolf reads saturated red in bright light.',
         'Faint ridges at the shoulder and tail base, where fur layers fused.'],
   pics:[['references_hd/mm9_views_tier1.png','MM9 original'],['references_hd/00_three_quarter.png','HD master'],['review/ingame_sheet.png','In game'],['review/wolf_texture_classes_tiers.png','Tiers']]},
  {id:'crow', group:'Monsters, new', name:'Bird (crow)', dir:'mm9_crow_claude', status:'ok', approved:'"bird is good" (2026-10-30, r10)',
   summary:'Bird A, B and C. MM9 gives all three the crow skin, so they differ only in size (see the bird question).',
   look:['The beak stays closed, so the bite reads as a peck.',
         'The body reads slightly scaly, and the wing tops are softer than the HD master.'],
   pics:[['references_hd/mm9_views_tier1.png','MM9 original'],['references_hd/00_three_quarter.png','HD master'],['review/ingame_sheet.png','In game'],['review/crow_texture_classes_tiers.png','Tiers']]},
  {id:'dragonking', group:'Monsters, new', name:'Dragon King', dir:'mm9_dragonking_claude', status:'ok', rework:'Texture pass applied after your approval: body atlas 36 to 56 %, head 31 to 51 %, same colours, mouth strip unchanged.', approved:'"dragon king - ok" (2026-10-30, after the head/jaw rework)',
   summary:'Final boss of the Dragon\'s Lair. 11,350 triangles, one skin.',
   look:['It flies: the monster table marks it a flier, so its ground attacks play in the air (see the Dragon King question).',
         'The wings are slightly larger than MM9\'s and set about 15° higher.',
         'The mouth interior is painted; there is no tongue or palate geometry.'],
   pics:[['references_hd/mm9_views_tier1.png','MM9 original'],['references_hd/00_three_quarter.png','HD master'],['review/ingame_sheet.png','In game'],['review/ingame_hostile_sheet.png','In game, hostile']]},

  // Animals: MM9 NPC rows on the rig-reuse route.
  {id:'goose', group:'Animals', name:'Goose', dir:'mm9_goose_claude', status:'ok', approved:'"goose - good" (2026-10-30)',
   summary:'Goose (white) and The Great Honk (Canada goose, 1.5x). Bill shortened to real goose proportions; MM9 has no jaw bone, so it stays closed.',
   look:['Bill is shorter than MM9\'s. A hairline UV seam shows up close on the black neck.'],
   pics:[['review/compare_viewer_sheet.png','MM9 vs ours'],['review/compare_tiers_sheet.png','Tiers'],['review/texture_sheet.png','Texture']]},
  {id:'pig', group:'Animals', name:'Pig', dir:'mm9_pig_claude', status:'ok', approved:'"pig - fine" (2026-10-30)',
   summary:'One skin. Ears hinge on two added helper bones at their own roots.',
   look:['MM9\'s ear flick is dropped: it crumpled the flap. Attack roles play the Fidget, since the pig never fights.'],
   pics:[['review/compare_viewer_sheet.png','MM9 vs ours'],['review/texture_sheet.png','Texture']]},

  {id:'mouse', group:'Animals', name:'Mouse', dir:'mm9_mouse_claude', status:'ok', approved:'"mouse - ok" (2026-10-30)',
   summary:'Mouse and evil mouse. MM9\'s skins for it do not exist in the game data and nothing places it, so both looks are ours; MM9\'s body is a legless blob, so the legs and paws are ours too.',
   look:['Fur is rebuilt with hair strokes: Meshy\'s paint rippled like zebra stripes.', 'Paws slip at full speed: MM9\'s speed is far more than a leg cycle can match, so the clip rate is capped.', 'A stretched paw stub on single frames of the run.'],
   pics:[['review/sheets/mouse_a_closeup.png','Close-up'],['review/sheets/mouse_a_body.png','Body'],['review/sheets/mouse_a_legs.png','Legs'],['review/sheets/mouse_c_tier.png','Evil mouse'],['review/sheets/mouse_mm9_vs_ours.png','MM9 vs ours']]},
  {id:'fish', group:'Animals', name:'Fish', dir:'mm9_fish_claude', status:'ok', approved:'"fish - ok" (2026-10-30)',
   summary:'One skin. Own closed fins with MM9\'s cut-outs. A ground actor until swimming exists; the README says how to bind it then.',
   look:['MM9 has only a swim clip, so the other clips are built from it; Death rolls it onto its side.', 'A small grey notch at the right pectoral root at some swim phases.'],
   pics:[['review/sheet_final_clips.png','Clips'],['review/sheet_viewer_mouth.png','Mouth'],['review/sheet_mm9_vs_ours.png','MM9 vs ours']]},

  {id:'sheep', group:'Animals', name:'Sheep', dir:'mm9_sheep_claude', status:'ok', approved:'"sheep ram ok" (2026-10-30)',

  {id:'imp', group:'Humanoids, new', name:'Imp', dir:'mm9_imp_claude', status:'ok', approved:'"imp - good" (2026-10-30)',

  {id:'skelwar', group:'Humanoids, new', name:'Skeleton Warrior / Master', dir:'mm9_skeletonwarrior_claude', status:'ok', approved:'"skele warrior - very good", then "ok this is fine" after the skirt fix (2026-10-30)', rework:'Skirt plates rebuilt on hinges: thighs clear them in Walking and Running; the plates part and flare.',

   look:['Bones are much paler cream than MM9\'s dark olive. Cuirass and gauntlets read soft and blobby up close. Warrior keeps a lamellar pattern where MM9 has plain mail. Side skirt plates part from the front plate when walking. Elbow and hand gates have small exceptions in Attack and Death. Playback and LODs not watched; no in-game run.'],

  {id:'lich', group:'Humanoids, new', name:'Lich', dir:'mm9_lich_claude', status:'ok', approved:'"lich - very good" (2026-10-30)',
   summary:'Lich and Power Lich on the MM9 skeleton and clips. Bone hands rigged from the mesh, a skull-only head with its own texture, torn sleeves and hem as geometry, and glowing eyes as a gain. Handedness corrected.',
   look:['Fingertips enter the thigh in Fidget, Taunt and the resurrect spell, because our fingers are longer than MM9\'s. The corpse rides about 12 cm high on its sleeves, and dying sinks slightly. A few pale strokes remain on the hood and cape. Power Lich hand sparkles use the engine charge glow. No in-game run.'],

  {id:'mummy', group:'Humanoids, new', name:'Mummy', dir:'mm9_mummy_claude', status:'ok', approved:'"mummy - ok" (2026-10-31)',
   summary:'Canopic, Embalmed and Petrified Mummy on one body with MM9 clips and true handedness. The Canopic is fully bound with a bearded face, the Embalmed is torn open over flesh with a skull, the Petrified is criss-crossed strips over dark flesh. Two passes done: strips now lie on the skin, and folds are much reduced.',
   look:['Three gates stay open after the second pass. The band goes through the chest in the attacks (5.9 cm in AttackMelee, 9.4 cm in AttackMelee2), because its tip is pinned on a forearm that crosses the chest.','Hands enter the body by 2.2 and 2.4 cm in the attacks. That is the price of a smoother arm correction, which still fails jitter (2.24 against 1.0 deg/f).','The right shoulder crease in AttackMelee (16 folded faces).','Hood seams and blotches at the back of tier A\'s head. Forearm reach is 7 cm shorter than MM9. Tier tone is lighter than MM9. The Canopic face is a projection.','MM9\'s two strip spikes are gone from the silhouette, since they now lie on the skin.','Per-tier body images (35.4 MB cooked, 23.4 MB of it extra) because the three designs differ. That departs from the shared-texture rule: your call.'],
   pics:[['review/mm9_vs_ours.png','MM9 vs ours'],['review/sheet_tiers.png','Tiers'],['review/sheet_hide_mm9.png','Wraps vs MM9'],['review/sheet_closeups.png','Close-ups'],['review/sheet_closeups2.png','Close-ups 2'],['review/sheet_strips_a.png','Clips A'],['review/sheet_strips_b.png','Clips B'],['review/sheet_strips_c.png','Clips C'],['review/sheet_playback.png','Playback'],['review/ingame_sheet.png','In game']]},
  {id:'guard', group:'Humanoids, new', name:'Guard', dir:'mm9_guard_claude', status:'ok', approved:'"guard - good" (2026-10-31)',
   summary:'Guard, Guard Segeant and Guard Captain on MM9\'s skeleton and clips, with five-finger hands painted as gloves and the halberd in the true right hand. Leather, chain with a mantle, and chain with steel. A closed tunic skirt on hinge bones keeps the thighs inside it in Walking and Running. Two passes done: the fist wraps the shaft and the corpse is clean.',
   look:['Your helmet note is fixed on all tiers, see the head sheets: one pair of eyes, and the eye mask and cheek returns are now real geometry. Dark patches remain in the outer eye-window corners on B and C, with streaks on the cheek plates and a dark patch under the chin.','The clip set is complete: sleep (he dozes on his feet leaning on the halberd), aware, cower start and end, second death, backpedal run.','The fist: the gate says the fingers wrap the shaft, but in the hand close-ups (ahA_0, chA_0) they still read straight across it rather than curled round. Please judge this one.','The left hand still enters the right forearm in AttackMelee2 (4.0 cm for 3 frames) and the hip in AttackMelee (3.2 cm for 10 frames). Stronger pushes failed the jitter gate.','Armpits under the raised arm: 51 and 49 folded faces in the attacks, mostly hidden. Cower L 25 is the one you can really see.','Tier A is much closer to MM9\'s dark brown, but still about 1.4x MM9\'s value so the quilting reads in game light.','One speck and one sliver remain on the white shaft. Halberd paint is plainer than the body. The helmet crown stretches near the top.','Town Guard rows 107 and 109 share this body but have no descriptors, so they are not bound.','Per-tier body images (30.0 MB cooked, +40.8 MB of GPU memory even with one tier on a map) because the three designs differ. That departs from the shared-texture rule: your call.'],
   pics:[['review/head_a.png','Head A'],['review/head_b.png','Head B'],['review/head_c.png','Head C'],['review/sheet_mm9_vs_ours.png','MM9 vs ours'],['review/sheet_tiers.png','Tiers'],['review/sheet_closeups_a.png','Close-ups A'],['review/sheet_closeups_c.png','Close-ups C'],['review/close_hands.png','Hands'],['review/close_neck.png','Neck'],['review/strips_a.png','Clips A'],['review/strips_b.png','Clips B'],['review/strips_c.png','Clips C'],['review/sheet_playback.png','Playback'],['review/ingame_sheet.png','In game']]},
  {id:'honkm', group:'Humanoids, new', name:'Honk (male)', dir:'mm9_honkmale_claude', status:'ok', approved:'"male can be accepted" (2026-10-31)',
   summary:'Honk, Elder Honk and Honk Seer on MM9\'s skeleton and clips with five-finger hands, and the goose and elder hats from MM9\'s object files. The robe has a closed dark underside like MM9\'s, and legs stay inside it in all ten clips. Two passes done.',
   look:['Third pass: the same hand fix. Hand length 18.5 cm (MM9 17.9). Trades: the arm gate reads Standing L 2.7 cm and R 2.5 cm, possibly false (the sheets show the hand clear), and sleeve see-through rose to 55 px. His left cuff moved further off the forearm line. A few degrees of upper-arm lean should settle it.','Short dark lines low on the robe in Standing and Running: lining edges cross the outer wall.','Hands: Fidget L 5.8 cm, Hit L 5.8, Death L 3.5 and R 4.5. The Death contact is the same sleeve overlap fixed on the female, and could be fixed the same way.','A few tiny dark specks low on the robe in game (in-game sheet, left panel), not in the viewer: cause unconfirmed.','The Elder\'s skin is closer to MM9 but not equal, and his central face has no wrinkles.','Cuffs and hands read mottled. The weave reads as pebble rather than thread.','Collapse gate is not zero: Fidget elbow 27. Not symmetric as MM9 is (p95 12.7 mm), since that needs a repaint. Body atlas 50.1 % (target 55) and head fragments 4.5 % (target 3).','The egg in the in-game sheet (right panel) reads as a large flat grey disc in flight: I think that is the egg, and it is worth a look.','Which row wears which hat, and Cast as Hattack2, are our reading of the data.'],
   pics:[['review/hands/accept_honk_a.png','Hands A'],['review/hands/accept_honk_b.png','Hands B'],['review/hands/accept_honk_c.png','Hands C'],['review/sheet_compare.png','MM9 vs ours'],['review/sheet_tiers.png','Tiers'],['review/sheet_joints.png','Joints'],['review/sheet_impact.png','Egg release'],['review/sheet_close_honk_a.png','Close A'],['review/sheet_close_honk_b.png','Close B'],['review/sheet_close_honk_c.png','Close C'],['review/sheet_cuffs.png','Cuffs'],['review/strips_left.png','All clips'],['review/ingame_v3/sheet_final.png','In game']]},
  {id:'honkf', group:'Humanoids, new', name:'Honk (female)', dir:'mm9_honkfemale_claude', status:'ok', approved:'"honk female - good" (2026-10-31)',
   summary:'Both female Honk tiers on MM9\'s skeleton and clips with five-finger hands. The Elder has her own face and dark hair from a fresh head paint. The robe has a closed dark underside, and legs stay inside it in all ten clips. Two passes done: the hand no longer comes through the robe in the corpse.',
   look:['Your sleeve note is fixed: poke frames are 0 on both arms in all ten clips. Still visible: a skin-coloured sliver on the right cuff edge, the right forearm reads as a pointed tip from below, and a thin cloth spike on the left cuff.','Short dark lines and a small brown spot on the robe: lining edges cross the outer wall.','Braids still cross the robe in motion (Death 26 of 73 frames, AttackRanged and Cast 7 of 29), and they kink a little in the bow (joint sheet j8). Standing, Walking, AttackMelee and Dead are clean.','A thin spike by the sleeve (j4), and faint smudges below the trim (j12).','The weave reads as burlap close up, and the knot bands are bolder than MM9\'s.','Collapse gate is not zero: Death elbow 28. Not symmetric as MM9 is (p95 16.5 mm).','The egg leaves near the beak of her hat, 3.8 cm from the socket at release. Not caught in game.'],
   pics:[['review/hands/poke_fixed_arms.png','Sleeves (fixed)'],['review/hands/accept_honkf_a.png','Hands A'],['review/hands/accept_honkf_b.png','Hands B'],['review/sheet_compare.png','MM9 vs ours'],['review/sheet_tiers.png','Tiers'],['review/sheet_joints.png','Joints'],['review/sheet_impact.png','Egg release'],['review/sheet_close_honkf_a.png','Close A'],['review/sheet_close_honkf_b.png','Close B'],['review/sheet_cuffs.png','Cuffs'],['review/strips_left.png','All clips'],['review/ingame_sheet_v3.png','In game']]},
  {id:'banshee', group:'Humanoids, new', name:'Banshee', dir:'mm9_banshee_claude', status:'ok', approved:'"Banshee - OK", with a note that the head graft may need more polish later (2026-10-31)',
   summary:'Fright, Dread and Terror: a see-through screaming banshee on MM9\'s clips, with a torn cloak and dress on MM9\'s chains, four-digit clawed hands, spiked hair, and three tiers decaying from a woman to a rotting skull to a green-eyed skull. Two passes done: the scream is now a jaw drop, and throat and sleeves are clean.',
   look:['Head graft polished: no mouth bag under the chin and no neck seam in the shots. Two or three tiny dark slivers remain at the jaw crease at very close zoom.','Your call: her head is now opaque, because a blended head drew its own faces out of order (the cheek marks and shard). It loses MM9\'s 8-19 % see-through, and it may cast a shadow while the rest of her does not.','The jaw opens 24 degrees against MM9\'s 34, on one hinge. Skin at the jaw corner still stretches up to 7x where MM9 hides it with a black flap.','Thin black curves beside the neck in the head-back poses, and a black mark at the throat in Taunt: I can see them on the head sheet. Probably burnt hair-spike tips, not confirmed.','Hands: Taunt 5.9 cm is her hand passing the other hand, as in MM9. Fidget2 hand in hair 2.9 cm for 47 frames.','The cloak turning in Walking and Fidget2. Limbs against blended cloth sort wrongly in 9-20 % of overlaps (Death up to 82 %), which needs engine work.','MM9 decays her on melee hits, which needs a runtime skin switch, so the decay became the tiers. The rows are canFly N although her script uses FlyRange, so she stays on the ground and hovers 18 cm. MM9\'s hand sparkle effect is not bound.','One 1K head image per tier (about 2.8 MB extra), because woman, rotting skull and clean skull are different paintings.'],
   pics:[['review/sheet_graft_banshee_a.png','Graft A'],['review/sheet_graft_banshee_b.png','Graft B'],['review/sheet_graft_banshee_c.png','Graft C'],['review/user_feedback_head_graft_20261031.png','Your note'],['review/sheet_mm9_vs_ours.png','MM9 vs ours'],['review/sheet_ingame.png','In game'],['review/sheet_tier_banshee_a.png','Fright'],['review/sheet_tier_banshee_b.png','Dread'],['review/sheet_tier_banshee_c.png','Terror'],['review/sheet_head_banshee_a.png','Head Fright'],['review/sheet_head_banshee_b.png','Head Dread'],['review/sheet_head_banshee_c.png','Head Terror'],['review/sheet_closeups_arms.png','Arms'],['review/sheet_closeups_neck.png','Neck'],['review/sheet_closeups_drape.png','Drape'],['review/sheet_clips_banshee_a_az35.png','Clips Fright'],['review/sheet_clips_banshee_b_az35.png','Clips Dread'],['review/sheet_clips_banshee_c_az35.png','Clips Terror']]},
  {id:'thrall', group:'Humanoids, new', name:'Thrall', dir:'mm9_thrall_claude', status:'ok', approved:'"thrall - ok" (2026-10-31)',
   summary:'Field Thrall, Thrall and Thrall Master: an old man in a tunic, a sandy-haired man in a half pelt with a headband, and a bare-chested dark-haired master, each with his own face on one head mesh. A jagged hide skirt on eight solved hinges keeps the thighs inside it in Walking and Running. Silhouette and clips match MM9 closely, and this is one of the cleanest bodies of the night.',
   look:['Hands pass through loose skirt flaps: Hit L 4.6 cm, Death R 2.0, Walking R 1.6. Moving the flaps helped, but arm corrections failed jitter, so it stopped after two tries.','The skirt points read as separate shards up close in the corpse, though the detached audit gives 0.','The shoulder ring on tiers A and B from under the arm: colour matches, the grain differs. Tier B\'s pelt up close. The nape in AttackMelee2 (33 folded faces). Two faint dimples on tier A\'s forehead.','Script clips Hit2, Death2 and Fidget2 are worse (thighs 15 cm in Death2), but it was not traced whether anything plays them.','One torso and head image per tier (35.2 MB cooked, 9.6 MB per extra tier), because the designs differ. That departs from the shared-texture rule: your call.'],
   pics:[['review/mm9_vs_ours_tiers.png','MM9 vs ours'],['review/mm9_vs_ours_clips.png','Clips vs MM9'],['review/sheet_closeups_a.png','Close-ups A'],['review/sheet_closeups_b.png','Close-ups B'],['review/sheet_closeups_c.png','Close-ups C'],['review/sheet_strips_a_1.png','Clips A1'],['review/sheet_strips_a_2.png','Clips A2'],['review/sheet_strips_b_1.png','Clips B1'],['review/sheet_strips_b_2.png','Clips B2'],['review/sheet_strips_c_1.png','Clips C1'],['review/sheet_strips_c_2.png','Clips C2'],['review/ingame_sheet.png','In game']]},
  {id:'evilsorcerer', group:'Humanoids, new', name:'Evil Sorcerer', dir:'mm9_evilsorcerer_claude', status:'ok', approved:'"evil sorcerer - OK" (2026-10-31)',
   summary:'Evil Apprentice, Evil Sorcerer and Evil Grand Sorcerer: a tall sorcerer with crown, pauldrons and long panels on MM9\'s own clips. Panels ride over the legs and fall under gravity when he dies. Three clear tiers with sharp faces, carried by one paint plus masks and ramps, with a separate image only for tier A\'s lower body.',
   look:['Hands enter the body in Fidget2 crossed arms (4.9 and 4.0 cm for about 50 frames), AttackRanged2 4.3 cm, Death 2.6 cm. Fixed as far as jitter allowed, after two passes.','Trim is a much brighter yellow, and tier B a brighter red, than MM9\'s darker gold and crimson. Tier C reads paler. Tier A plates are near black where MM9 is navy.','Red paint bleeds onto the grey calf in a few close-ups (joint sheet B), and the groin has pale fuzzy patches.','The filigree is clean dragon work where MM9 has blurred knotwork. The crown leaves the face more open than MM9\'s tall helm.','Armpits with arms raised (up to 30 folded faces in Death). A thin dark line under the jaw from the side.'],
   pics:[['review/sheet_mm9_vs_ours.png','MM9 vs ours'],['review/sheet_tiers.png','Tiers'],['review/sheet_close_a.png','Close A'],['review/sheet_close_b.png','Close B'],['review/sheet_close_c.png','Close C'],['review/sheet_joints_a.png','Joints A'],['review/sheet_joints_b.png','Joints B'],['review/sheet_joints_c.png','Joints C'],['review/strips_a_1.png','Clips A1'],['review/strips_a_2.png','Clips A2'],['review/strips_b_1.png','Clips B1'],['review/strips_b_2.png','Clips B2'],['review/strips_b_3.png','Clips B3'],['review/strips_c_1.png','Clips C1'],['review/strips_c_2.png','Clips C2'],['review/sheet_ingame.png','In game']]},
  {id:'troglodyte', group:'Humanoids, new', name:'Troglodyte', dir:'mm9_troglodyte_claude', status:'ok', approved:'"troglodyte - good" (2026-10-31)',
   summary:'Troglodyte, Wren and Gnoll: a hunched cave frog on MM9\'s skeleton and clips, with three long clawed fingers as in MM9 and a real opening mouth with palate, tongue and teeth. Three tiers: violet ribbed and blind, green, and leather-clad.',
   look:['Your chest spike is fixed on all tiers, and the jaw rim is smooth, see the chest sheet. A small nub remains on the jaw\'s rear rim, and about 96 neck faces still fold with the head thrown back.','The mouth in Taunt and Hit: it opens 63 degrees as in MM9. The neck join behind the cheek has stretched folds (up to 96 faces, 56 seen). The right armpit in Hit (31 faces).','The arms\' pale net pattern is much stronger than MM9\'s plain arms. The chin is heavier than MM9\'s shelf.','Hands enter the body briefly in the attacks (3.1 cm for 1 frame), and the head dips into the chest by 5 cm in AttackRanged and Hit2.','Tier C has its own painted leather images (10.7 of 22.9 MB cooked), a deviation from the shared-texture rule.'],
   pics:[['review/sheet_chest_fix.png','Chest (fixed)'],['review/mm9_vs_ours_a.png','MM9 vs ours A'],['review/mm9_vs_ours_b.png','MM9 vs ours B'],['review/mm9_vs_ours_c.png','MM9 vs ours C'],['review/sheet_tiers.png','Tiers'],['review/sheet_closeups_a.png','Close-ups A'],['review/sheet_closeups_b.png','Close-ups B'],['review/sheet_closeups_c.png','Close-ups C'],['review/sheet_strips_a.png','Clips A'],['review/sheet_strips_b.png','Clips B'],['review/sheet_strips_c.png','Clips C'],['review/sheet_lod.png','LODs'],['review/ingame_sheet.png','In game']]},

   summary:'Cutpurse, Burglar and Bandit: rogues with a sword in the true right fist and a dagger in the left, on MM9\'s skeleton and all 21 clips. Headband and green yoke; blond with gold piping and bracers; red hair, eye patch and studded trousers. Fingers really close round the grips. Limb lengths are fixed.',
   look:['Your head note is fixed on all tiers, see the new head sheet. Cheeks are smoother than the front of the face, faint oval ripples show in the hair, and the hair curls in under the jaw like a collar.','Faces and hair of each tier, the fists on the grips, and the AttackRanged throw. The dagger hides at the hip, then is thrown at 0.5 s, which differs a little from MM9.','Bracers read as busy gold coral close up, and the Burglar\'s diamond stitching reads bright.','The wrist and cuff edge is slightly ragged, with a dark notch. The boot flare corner behind the knee in Dead.','Neck folds in Death and Dead (45 faces, under the jaw; 24 seen). Armpit 43 in Death.','Floor: Running dips 2.7 cm against a 2.5 cm tolerance. Tighter smoothing brought back a pelvis bob.','Per-tier torso and head images (29.1 MB cooked, 21 images): your call. LOD0 is high at 13,094 triangles.'],

  {id:'ghoul', group:'Humanoids, new', name:'Ghoul', dir:'mm9_ghoul_claude', status:'ok', approved:'"ghoul OK" (2026-10-31)',
   summary:'Ghast, Ghoul and Revenant: a pointy-eared ghoul on MM9\'s skeleton and clips, very close to MM9\'s design and poses. Claws are built on MM9\'s own finger chains and black-tipped, the snarl has a real cavity, and all three tiers share one texture set, with no per-tier images. 9,988 triangles. The loincloth drapes over the thighs instead of passing through as in MM9.',
   look:['Overall tone: much lighter and yellower than MM9\'s olive in the viewer, less so in game. Feet read pale on the two blue tiers.','Ghoul veins read as a soft mottle, not MM9\'s crisp lines. The hide is still slightly pebbled up close. The Revenant\'s nose hollow is paint only.','The front flap in Running: back flap 24 folded faces, thumb roots 20. A faint line from jaw to neck.','Cloth 1.1 cm through in Fidget and Death. Jitter flags on the two death clips, because removing the hand correction puts the hand 8 cm in the body.'],

  {id:'gezzampt', group:'Humanoids, new', name:'Gezzampt', dir:'mm9_gezzampt_claude', status:'ok', approved:'"gezzampt OK" (2026-10-31)',
   summary:'Gezzamptling, Gezzampt and Gezzampt Elder: a hoofed, horned beast-man on MM9\'s skeleton and clips, with a detailed face, mane, fists and goat legs. All three tiers share one texture set at 11.6 MB, and the body cost only 20 credits.',
   look:['Your head note is fixed: one pair of eyes and one set of teeth on all tiers. See the new head sheet; the older sheets still show the previous head.','Tone: the three colours follow MM9, but ours are brighter and more saturated, especially the Elder\'s blue. MM9 is much darker, with a darker chest.','Collapse is not zero: head 32 in AttackMelee, shoulders 18-21, and script clip Death2 head 93. Moving the pivots made Death2 worse, so it stopped there.','Fists on the palm side, the throat and nape under the mane in Fidget2 and Death2, and the repainted neck seam at the chin.','Fur grain near the wrist is finer than the rest of the arm. Tier A horn paint is blotchy up close. The wrap fuses the mane to the back of the neck.','Rows keep sprite heights 300/350/450 against a 256-unit model, so the health bar floats above B and C. Running feet differ from MM9 by 7.6 degrees on average, probably timing.','Backpedal, BackpedalRun and MM9\'s death velocity events were not carried over.'],

  {id:'nosferatu', group:'Humanoids, new', name:'Nosferatu', dir:'mm9_nosferatu_claude', status:'ok', approved:'"nosferatu good" (2026-10-31)', approved:'"nosferatu OK" (2026-10-31)',
   summary:'Bloodsucker, Annelid and Vampir: a bald goblin-faced vampire in a floor-length robe, with a tall collar, big ears, a fixed snarl and long black claws. Green, red and black tiers come from one paint with ramps (8.2 MB cooked, 20 credits). The robe sways on a lattice driven by MM9\'s legs and tail, and settles flat on a corpse.',
   look:['Redrawn in r16, please re-check: the sleeve is now a straight tube from under the yoke corner to the elbow, like MM9\'s, with no notch or puff, and it enters the chest behind the trim instead of lying on it (Fix sheets). From the side a small sleeve corner shows in front of the shoulder. With the arm forward the back of the yoke folds a little at the shoulder. Inside a raised cuff, the wrist shows a pale patch at the cuff edge: not fixed.','Your call: there are no legs or feet, because MM9\'s mesh has none and ours went 13.9 cm through the cloth. Check the bare hem from below.','Sleeves are puffy with narrow cuffs, where MM9 has straight sleeves ending in big angular flared cuffs. That changes the silhouette.','Raised-arm shoulders in AttackRanged (25 folded faces, 22 seen). Hands enter by 2.1 cm there, the forearm by 4.9 cm where the hands meet, and 1.2-1.4 cm in Fidget and Taunt.','A small neck bump on the collar front, orange flecks beside the centre panel, faint creases on top of the skull, and posterised damask close up on the dark tiers.','Robe lining reaches past the wall on the floor only (Death 2.9 cm, Dead 2.3 cm).'],
   pics:[['review/shots/fix_sleeve3/st_q.png','Fix: Standing'],['review/shots/fix_sleeve3/st_front.png','Fix: turned'],['review/shots/fix_sleeve3/st_left.png','Fix: side'],['review/shots/fix_sleeve3/st_back.png','Fix: back'],['review/shots/fix_sleeve3/ru_f.png','Fix: Running'],['review/shots/fix_sleeve3/ar_q.png','Fix: raised'],['review/mm9_vs_ours.png','MM9 vs ours'],['review/mm9_vs_ours_clips.png','Clips vs MM9'],['review/sheet_heads.png','Heads'],['review/sheet_closeups_a.png','Close-ups A'],['review/sheet_closeups_b.png','Close-ups B'],['review/sheet_closeups_c.png','Close-ups C'],['review/strip_a.png','Clips A'],['review/strip_b.png','Clips B'],['review/strip_c.png','Clips C'],['review/ingame_sheet.png','In game']]},
  {id:'monk', group:'Humanoids, new', name:'Monk', dir:'mm9_monk_claude', status:'ok', approved:'"monk OK" (2026-10-31)',
   summary:'Initiate, Monk and Reverend Monk: a hooded robed monk in brown, grey and navy, each with his own face, on MM9\'s own skeleton, cloth chains and 34 clips. Legs stay inside the robe in all 35 clips, the robe flares in the run and kneels in Pray, and elbows and armpits are clean. One painted robe with ramps, 20 credits.',
   look:['Shoulders are broader and bulkier than MM9\'s, and the hood and head are smaller. Faces are sharper and harsher than MM9\'s: tier A\'s heavy brows, tier C\'s thinner beard.','Mantle corners stand off as thin points with arms raised, and could read as shards.','The corpse from the feet and under the jaw: shoes hang free in the robe as in MM9, and the audit flags the soles (7.9 cm in 12 of 1,543 poses).','Fingers spread a little in Standing, with finger stretch up to 3.63. The cast has the left hand 2.2 cm in the body for 3 frames.','Work props (hoe, broom, hammer) are not built, so those script clips hold air. Which cast clip MM9 plays for which spell is our judgement.'],

  {id:'clansoldier', group:'Humanoids, new', name:'Clan Soldier', dir:'mm9_clansoldier_claude', status:'ok', approved:'"clan soldier - good" (2026-10-31)',
   summary:'Horde Grunt, Warrior and Leader: the Beldonian Horde with sword and coffin shield in three full costumes, with fur, laminated and painted helmets. Poses match MM9 clip for clip, the fist and shield arm hold their grips, and the skirt lifts on hinges so thighs stay inside it in Walking and Running.',
   look:['Your notes are fixed, see the Fix sheets: the shield back draws, the waist hole is closed, the skirt hangs with a lit lining. The trade: thighs now pass through the skirt, Running 4.0 cm (18 of 25 frames), Walking 1.4 cm. The other sheets still show the fanned skirt.','Thighs pass the skirt mid-fall in Death (9.7 cm for 30 frames) and Death2. The shield enters the thigh in Death (4.0 cm for 4 frames).','The nasal bar from the side: it fused to the nose bridge and reads as a thick plate. Paint improved it, but the geometry was not rebuilt.','The skirt flares a lot in Running and AttackMelee. Elbow 35 and neck 73 folded faces at worst (Death, behind the curtain).','Mail rings read brighter than MM9\'s, upper-arm lamellar is softer than the torso, and the shield and body read larger and brighter next to MM9.','Data decision: the rows carry a thrown axe at 100 %, but the body has no throw clip, so ranged plays Hattack2 and the missile leaves the sword.','Per-tier torso, head and weapons (34.9 MB cooked, all uploaded for any tier), because the designs differ: your call.'],

  {id:'nobleman', group:'Humanoids, new', name:'Nobleman', dir:'mm9_nobleman_claude', status:'ok', approved:'"nobleman - good" (2026-10-31)',
   summary:'Baron in burgundy brocade and fur mantle, Viscount in a blue-black fur coat with a broad smile, Count in gold brocade with a painted cap. MM9\'s bare-hand clips on MM9\'s skeleton, five-finger hands, and a doublet skirt that clears the thighs in every clip.',
   look:['Your nose note is fixed on all tiers: one nose, and beards end at the jaw. New small marks: a crease mid-forehead and a dark nick at each jaw corner. The Viscount\'s smile is wider than the mesh mouth.','Shoulders and flank with the arm raised are the worst joint (76 folded faces in Death2, 38 in Death, 33 in AttackMelee, mostly visible), and the brocade stretches there.','From my read of the heads sheet: the hair ends in a blocky flat bob with a hard cut, a pale edge runs down the cheek, and under the arm the coat paint reads as reptile scales. The heads sheet crops the crowns off.','The Count\'s chest boss has a small dark mark and faint seam. A pale net on the back of the hands, and a thin pale line where hair meets cheek.','The Baron\'s red is more saturated than MM9\'s. Check the fur up close on all tiers.','Jitter flags 3 clips, and the right hand is 3.7 cm in the body in script clip Hit2.','Per-tier torso and head images (27.1 MB cooked), because the costumes differ: your call.'],

  {id:'dwarf', group:'Humanoids, new', name:'Dwarf', dir:'mm9_dwarf_claude', status:'ok', approved:'"dwarf - ok" (2026-10-31)', rework:"Second run after your approval (r18): the skirt and wrist cuffs were worked on (run2/sheet_skirt_b.png, run2/sheet_wrists.png). Still open: in Death2 the thigh comes 2.1 cm through the skirt for 4 frames, and a thin dark cuff rim shows at the hardest wrist bends",
   summary:'Dwarven Guard, Soldier and Commander: a stocky horned dwarf on MM9\'s skeleton and all 16 clips, with five-finger hands closed on an axe and one texture set with ramps (20 credits). MM9 has one skin for all three rows, so the tiers darken from A to C and C gets a grey beard.',
   look:['Standing shoulder pop at frames 19-21 fixed in r15: it was ours, not MM9\'s.','Fixed in r14, please re-check: the skirt now hangs (Fix: skirt and Fix: tier B sheets), and the beard no longer stretches. In Running and AttackMelee the upper skirt bunches into a shiny roll under the belt: that one is still open. Thighs reach 2.4 cm through in Death2 and 2.5 cm in AttackMelee2.','Older sheets still show the fanned skirt.','Your call on tiers: to match MM9 exactly, all three can share tier A\'s look.','The axe enters the upper arm in Fidget (6 cm or more for 11 frames). The helmet rim enters the shoulders when the head tips.','Fidget corrections are large, so the hand stands further off the hip than MM9\'s. The skirt flares in Running: compare with the Clan Soldier note.','Shoulder plates and neck tube fold (up to 46 and 45 faces). Plate paint smears at the seam, a jagged cuff lining behind the knee in Dead, and a flat dark helmet interior from below.','Most sheets are from earlier builds with the same mesh. The head sheets are final.'],

  {id:'trellborg', group:'Humanoids, new', name:'Trellborg', dir:'mm9_trellborg_claude', status:'ok', approved:'"trellborg - fine I guess" (2026-10-31)',
   summary:'Trellborg, Kin Trellborg and Ancient Trellborg: a big orc-like tribesman with a 1.35 m spiked club on MM9\'s skeleton and clips. Three real outfits: leather harness, fur vest with claw necklace, and mail with lamellar and steel boots. Clean joints, and the club swings in its true direction with the fist closed round it.',
   look:['r10, please re-check: blending the join failed (the mesh there is too sparse), so a flared cuff on the forearm now covers it and the hand turns inside it. This is an addition: MM9 has no cuff, and it reads heavy from the front. Hard paint steps show on the cuff at texture seams. The hand passes over the lip at extreme wrist bends (AttackMelee2 12.6 cm, Fidget 10.4 cm).','Before the cuff: r5: the wrists join without a gap and the club handle runs through the closed fist, on all tiers (Fix sheets first). The hands read a bit mitten-like and smoother than the forearm. Skin webbing inside the handle is hidden by the club. Fidget2 still has the hand in the body (6.0 cm).','Older strips and close-ups still show the old fists.','The wrist in AttackMelee2, which bends 138 degrees and stretches the skin.','Smeared wedges on the shoulder tops by the neck, and facet lines under the jaw. A red remnant and pale slivers at the beard on B and C, and a forehead smudge on C.','Skin is brighter and more orange than MM9, with near-white studs and strap edges on A.','Script clip Fidget2 is the one failure: hand 6.0 cm in the body and the club 5.7 cm in the skin.','Per-tier body images (43.6 MB of PNG in the export, cooked size not measured), because the outfits differ: your call.'],

  {id:'halforc', group:'Humanoids, new', name:'Half-Orc', dir:'mm9_dookmilitia_claude', status:'ok', approved:'"half-orc - fine" (2026-10-31)', rework:"Second run after your approval (r19): neck smoothing was reverted where it lifted the hood back hem (sheet_hood_back_a.png). The shoulder pad and hood hem collapse gate still fails (sheet_shoulders_final.png)",

   look:['The right cheek bar (a mirror of the left, flagged as detached by 5.0 cm in 29 of 706 poses).','Cower is the worst clip: the hilt goes through the head and hood (5.6 cm), and the right hand is 2.5 cm in. Running sinks 4.5 units against a 2.5 tolerance.','Tier A reads more orange than MM9\'s dark leather, and the sword looks larger than MM9\'s. In AttackRanged the left arm reaches along the blade: compare with MM9.','Neck and head fold up to 65 faces (Hit2, Sleep, Death), shoulders 53 in Death and Dead.','No in-game run, and the agent did not read its strips or final close-ups.'],

  {id:'lizardorc', group:'Humanoids, new', name:'Lizard-Orc', dir:'mm9_lizardorc_claude', status:'ok', approved:'"lizard orc - ok" (2026-10-31)', rework:"Second run after your approval (r18): neck and throat work (review/run2/sheet_neck_r17.png, sheet_throat_a.png). Still open: thigh plates, and a pale stretch band on the throat in Hit2. Strips, close-ups and in game were not reshot on r18",
   summary:'Lizard-Orc, Warrior and Mage: an armoured reptile warrior with a steel skull helm, a real open mouth with teeth and a forked tongue, spiked pauldrons and a curved gold-hilted cutlass in the right fist. One shared texture set, 30 credits. Not finished: plate and floor gates fail.',
   look:['Fixed in r15, please re-check (Fix: breastplate sheets first): the skin chevron is off the breastplate and the smear beside the neck is gone. The plate\'s top edge is now a plain cut with no trim, and bright wavy stripes remain just under the neck-side patch.','r13: (Fix: all tiers) the neck joins the body with no ring, the body texture is twice as sharp, and the fingers close on a thicker grip.','Still open: plates reach into the thighs (Walking 1.7 cm, Running 3.3 cm, AttackMelee 6.1 cm), a rectangular chest plate edge, a thin crease under the chin, and the R fist 5.5 cm into its tasset in Fidget. Clip sheets predate the last arm corrections.','Before the fix, armour plates passed through the legs in every frame (Walking up to 5.9 cm, Running up to 7 cm). Shots look clean, but the numbers do not. The front flap tilts 25 degrees at Standing.','Floor: AttackMelee sinks 9.5 units against a 2.5 tolerance, cause not traced.','A thin sliver stands off at the neck ring under the jaw. Seven pauldron spikes flag as detached (up to 4.6 cm in 2 of 528 poses). The thumb does not reach the grip.','MM9 shows all three rows alike: tiers B and C (teal, rust) are our own ramps. Steel reads whiter than MM9 and hide yellower.','Close-ups are tier A only, and most do not frame their joint well. Nobody read the strips.'],
   pics:[['review/sheet_plate_a.png','Fix: breastplate A'],['review/sheet_plate_b.png','Fix: breastplate B'],['review/sheet_plate_c.png','Fix: breastplate C'],['review/sheet_fix_tiers.png','Fix: all tiers'],['review/mm9_vs_ours.png','MM9 vs ours'],['review/sheet_tiers.png','Tiers'],['review/sheet_head_front.png','Heads'],['review/sheet_closeups.png','Close-ups'],['review/sheet_strips_a.png','Clips A'],['review/sheet_strips_b.png','Clips B'],['review/sheet_strips_c.png','Clips C'],['review/ingame_sheet.png','In game']]},
  {id:'bigfoot', group:'Humanoids, new', name:'Bigfoot', dir:'mm9_bigfoot_claude', status:'ok', approved:'"bigfoot - ok" (2026-10-31)', rework:"Second run after your approval (r9): neck and shoulder collapse roughly halved (sheet_collapse_r7_r9.png). The head turn while walking is capped at 74 degrees, against MM9's 96: a deviation, your call. The red belly band and pale collar specks are gone (sheet_tier_heads_r9.png). Still open: folds where the chin meets the chest or shoulder, and jitter 22 flags (21 from the accepted 12 degree abduction)",
   summary:'Bigfoot, Sasquatch and Yeti: a tall-crested ape-man on MM9\'s skeleton and clips, with a sculpted gorilla face and ape hands. Red-brown, dark with a soft silver saddle, and a white Yeti with its own snarling face. Not finished: it got one gate run before the stop.',
   look:['Hands enter the body in Fidget2, Taunt, the attacks and Hit2 (up to 6 cm), and jitter is flagged on 10 clips.','The saddle on tier B\'s back reads as a hard-edged patch on the compare sheet, softened in the last build. The Yeti\'s hard-edged blue chest patch and painted mouth.','A smooth reddish neck band at the head seam on A and B, pale specks at the collar, and the nape in Hit2.','Tier A is redder and C whiter than MM9. The health bar sits low because the rows keep height 163-165 against a 256-unit model.','Five clips left out: walkfidget, Backpedal, BackpedalRun, JumpingDown, LyingDown.'],

  {id:'zombie', group:'Humanoids, new', name:'Zombie', dir:'mm9_zombie_claude', status:'ok', approved:'"zombie - ok" (2026-10-31)',
   summary:'Rotter, Dripper and Zombie share one gaunt corpse on MM9\'s skeleton and clips, with a grinning head and a bare shin on the true right leg. Fingers are built from the mesh. Each tier has its own torso part: bare chest, vest, mail. Two passes done: hands clear the thigh in every bound clip, and the hide is pulled toward MM9\'s olive.',
   look:['Your head graft note is fixed: you were right about the colour (neck and chest were up to 1.6x apart), and the grain and hair mask also differed. Now within about 6 %. A thin dark lip remains where the head rim sits proud of the torso.','Arms, shins and knees are softer than the first pass but still more contrasted than MM9, and the pale knee patches still show.','Dripper keeps the shared hair shape, recoloured to grey, where MM9\'s head is bald. A little of the neck flap remains.','Collapse is not zero: neck and head 20 in Death, body 20 in AttackMelee, on thin faces I could not find in the close-ups. Jitter flags 5 clips, worst upper arm 1.9 deg/f against a limit of 1.0.','Running is Walking at 1.5x because MM9 has no run clip for this body.','Skin stays slightly pebbled up close. A short seam shows on the refilled chest in extreme close-up.','One torso image per tier (6.3 MB of 18.7 MB cooked), because no ramp can draw those designs. That departs from the shared-texture rule: your call.'],

  {id:'skeleton', group:'Humanoids, new', name:'Skeleton', dir:'mm9_skeleton_claude', status:'ok', approved:'"skeleton OK" (2026-10-31)',
   summary:'Skeleton, Bone Thrasher, Skeletoid and Skull Thrower, plus the L40 Skeleton row. A tall big-skulled skeleton of 170+ rigid pieces with a torn leather vest, rope belt and collar, and a magic dagger in the true right hand. Two tiers: brown with one green eye, and red tunic with blue leg cloth and two red eyes. MM9\'s own lively clips.',
   look:['The strongest first pass so far: collapse is 0 in 15 clips. Please look at the skull, eyes and jaw, the back of the vest, hip strips in Walking and Running, the fist on the dagger, and Death and Dead.','Bones are much paler and more golden than MM9\'s dark olive, as on the Skeleton Warrior you approved.','Vest panels are stiff and can read as boards in Death. The strap lost its studs and buckle, and a thin grey band remains on the upper ribs. Bones read softer than the skull up close.','Half-size rows 183-185 keep the sprite row height, so the health bar floats above them. Fixing that means rebuilding the maps.','The jitter gate fails the same way as the Skeleton Warrior (shoulder excess against raw MM9 keys, Running 20 mm/f2), though hand acceleration is close to MM9. Four small parts drift by 4-10 mm in some poses. LODs stop at LOD2, because LOD3 lost the legs.','The red tier and row 192 have not been seen in game.'],
   pics:[['review/mm9_vs_ours.png','MM9 vs ours'],['review/sheet_tier_skel_a.png','Brown'],['review/sheet_tier_skel_r.png','Red'],['review/sheet_closeups_a.png','Close-ups brown'],['review/sheet_closeups_r.png','Close-ups red'],['review/sheet_closeups_poses.png','Poses'],['review/sheet_strips_all_clips_a.png','All clips'],['review/sheet_lod.png','LODs']]},
  {id:'ghost', group:'Humanoids, new', name:'Ghost', dir:'mm9_ghost_claude', status:'ok', approved:'"if thats intended then OK": the flying head is MM9\'s own (2026-10-31)',
   summary:'Shadow, Apparition and Specter, now truly see-through: scenery shows through the body and robe, and the torn hem fades out. MM9\'s flying, spinning head and MM9\'s clips, five-finger hands, one clean robe, and three painted faces (plaster mask, old man, skull). MM9 has no death clip, so Death is a new whirl upward into nothing.',
   look:['See-through in the in-game sheet, and the new Death clip: the ghost shrinks away, and the Dead pose is an empty speck with the loot bag.','Shadow\'s face is a plain mask with goggle-dark eyes, plainer than its master. A pale flat shard shows at Shadow\'s wrist near the hip: I saw it on the tier sheet, and its cause is not found.','Hair stays: MM9 has hair on all three skins, recoloured to MM9\'s values. Our heads are a fuller, rounder mass than MM9\'s faceted egg.','The neck opening is now a dark bowl, with a few pale flap edges just inside the rim up close.','Renderer limit: a blended limb stays in its rest layer, so arms sort wrongly in 6-12 % of overlaps (worst 42 %), and the head in 50-100 % of a small overlap when it flies low. Nothing vanishes. No shadow is cast. A fix needs per-frame centres or a blended depth prepass in the engine.','Collapse is not zero: robe front tip 20 (sampled faces read alpha 0) and the armpit crease 13-14. Body atlas 54.4 % against 55.','Size indoors: the head left the frame at close range and the body sat in a corridor wall.','Head colour is per tier, because the three faces are different paintings.'],
   pics:[['review/sheet_mm9_vs_ours.png','MM9 vs ours'],['review/sheet_seethrough.png','See-through'],['review/sheet_ingame.png','In game'],['review/sheet_tier_ghost_a.png','Shadow'],['review/sheet_tier_ghost_b.png','Apparition'],['review/sheet_tier_ghost_c.png','Specter'],['review/sheet_closeups.png','Close-ups'],['review/sheet_clips_ghost_a.png','Clips Shadow'],['review/sheet_clips_ghost_b.png','Clips Apparition'],['review/sheet_clips_ghost_c.png','Clips Specter'],['review/sheet_playback.png','Playback']]},

  {id:"giant", group:'Humanoids, new', name:"Giant", dir:"mm9_giant_claude", status:'ok', approved:"\"giant ok\" (2026-11-01, r23)", rework:"r23 (2026-11-01 evening, your pinky note): every finger now wraps the shaft on both hands. The pinky tips pointed back out on the palm side, 1.4-1.7 cm off the shaft (the MPFB pinky rests curled into the shaft and the solve could only close joints); now all four fingertips reach 127-173 deg round the shaft, 0.2-0.3 cm off it. Also: Fidget left hand no longer in the body, one jitter fail fewer. Still open: the corpse mallet in the thigh (Dead 4.2 cm), the AttackMelee windup left fingers, tier B steel head. Sheet: Grip r23",
   summary:"Plain Giant (A) and Forest Giant (B): a bare-chested barbarian with a steel mallet on MM9's skeleton and clips, scale 333. Per-tier head images. Two passes, 20 credits.",
   look:["Look at the left hand in Standing, Walking and Aware (Hands sheet). It is an open palm under the shaft, not a fist round it, and the right fingers drape over the shaft. The orchestrator saw this; the gates did not flag it.","AttackMelee: MM9's swing is one-handed, so the two-handed grip is held only at the start and end. At the top the fists meet (4.6 cm, 3 frames), and the shaft touches the left palm heel (3.2 cm, 4 frames).","Jitter fails 3 times, all in the two attacks.","Fixed in r16: the mallet between the thighs, fingers in the shaft, mallet UV stretch (23.7 to 1.02, a hand layout), the collar wedges and Death2 jitter.","The full-body in-game frame is at a Guberland jetty. The giants stand on the water only because of where they spawned.","Per-tier head images: your call. The mallet atlas is 51 %. The tier B belly is smoother than the chest.","Not read on r16: the tier B strips, close-ups A, heads and fists."],
   pics:[["review/sheet_grip_r23.png","Grip r23"],["review/sheet_grip_std.png","Grip r21"],["review/sheet_mm9_vs_ours.png","MM9 vs ours"],["review/sheet_hands2.png","Hands"],["review/sheet_fists.png","Fists"],["review/sheet_heads.png","Heads"],["review/sheet_tex.png","Textures"],["review/sheet_closeups_a.png","Close-ups A"],["review/sheet_closeups_b.png","Close-ups B"],["review/sheet_strips_a_1.png","Clips A1"],["review/sheet_strips_a_2.png","Clips A2"],["review/sheet_strips_b_1.png","Clips B1"],["review/sheet_strips_b_2.png","Clips B2"],["review/ingame_sheet2.png","In game"]]},
  {id:"lichking", group:'Humanoids, new', name:"Lich King", dir:"mm9_lichking_claude", status:'ok', approved:"\"lich king good\" (2026-11-01, r13); staff in the palm: \"lich king ok\" (2026-11-01, r19)",
   summary:"A crowned skeleton king in dark blue-steel armour with silver knotwork, a navy open coat on hinge sectors, and a skull-topped staff at MM9's angle. The skull and eyes come from the approved Lich. All 19 of its own MM9 clips are carried. Two passes, 15 credits.",
   look:["Your call: in AttackMelee the head ducks 30 degrees sideways for 0.25 s, so the left hand clears our taller crown (Duck sheet). Pushing the arm away failed jitter. This changes MM9's motion.","Death2: the back coat still stands up like a wall mid-fall, and the Dead2 coat lies bunched up high.","Running: the coat flares cleanly, but the heel pokes into the back hem in 7 of 21 frames (4.9 cm).","Shoulders crease with the arms raised: AttackMelee torso 51 (Taunt and ResurrectSpell are down to 25).","The staff matches MM9 within 0.6 degrees, and its skull is yellow-green. A small seam shows where the skull meets the crown's side plate.","No in-game check on the final build (r13). MM9's DoFX and DoResurrection effects are not carried."],
   pics:[["review/sheet_grip_r19_after.png","Staff grip r19"],["review/sheet_grip_r13_before.png","Staff grip r13"],["review/sheet_hit_headturn_r19.png","Hit head turn"],["review/sheet_mm9_vs_ours.png","MM9 vs ours"],["review/sheet_attackmelee_duck_r12.png","Duck"],["review/strips_r13_run_death2.png","Run / Death2"],["review/sheet_shoulders_r13.png","Shoulders"],["review/sheet_head_r13.png","Head"],["review/sheet_joints_a.png","Joints A"],["review/sheet_joints_b.png","Joints B"],["review/strips_1.png","Clips 1"],["review/strips_2.png","Clips 2"],["review/strips_3.png","Clips 3"],["review/sheet_ingame.png","In game (r1)"]]},
  {id:"colloidal", group:'Humanoids, new', name:"Colloidal Warrior", dir:"mm9_colloidalwarrior_claude", status:'ok', approved:"\"colloidal warrior ok\" (2026-11-01, r9)",
   summary:"Colloidal Soldier, Warrior and Guardian: a squat glossy slime man with toad-like throat folds, a slit-eyed toothy grin and webbed feet, on MM9's skeleton and all 15 clips. One shared texture set. Two passes, 20 credits.",
   look:["Tone against MM9's own models under the same light (Tone sheet): clay-brown mud, olive slime, dark red-brown. Saturation now matches MM9. The Soldier is darker than MM9's pale tan, because at MM9's value it looked grey-mauve in game.","The armpit in AttackMelee is now a closed crease with a small dark slit, no longer a torn notch.","The head turn is softly capped at 35-50 degrees to cut throat folds (Hit2 89 to 41, Death2 116 to 93): a deviation from MM9's motion, your call.","Still open: in script clip Death2 the right hand is 6.0 cm inside the chest. Jitter fails in 5 clips. Throat folds when Death2 drops the head onto the shoulder.","The body stays a smaller toad-man than MM9's slab: thicker arms sank into the belly, and a lower head added folds. Recorded as a deviation.","The viewer shows stronger gloss than the game (specular 0.4 is not applied there). LOD2 and LOD3 are the default ones."],
   pics:[["review/tone_cmp.png","Tone vs MM9"],["review/sheet_armpit.png","Armpit"],["review/mm9_vs_ours_tiers.png","MM9 vs ours"],["review/sheet_heads.png","Heads"],["review/sheet_closeups_b.png","Close-ups B"],["review/sheet_strips_b_1.png","Clips B1"],["review/sheet_strips_b_2.png","Clips B2"],["review/sheet_strips_b_3.png","Clips B3"],["review/ingame_sheet.png","In game"]]},
  {id:"lesserdemon", group:'Humanoids, new', name:"Lesser Demon", dir:"mm9_stage1demon_claude", status:'ok', approved:"\"lesser demon aswell i think\" (2026-11-01, r10 as installed; the neck pass was dropped)",

  {id:"ebora", group:'Humanoids, new', name:"Ebora / Concubine", dir:"mm9_ebora_claude", status:'ok', approved:"\"besides that [PeasantDM2] every other is ok\" (2026-11-02)", prev_approved:"\"ebora - accepted\" (2026-11-01 evening, Head fixes 3)", rework:"Ear sweep (cf10): the Concubine's s2 throat had an olive tint from a clipped skin ramp, now peach; the wing-coloured patch under the chin in low views is the wings behind the neck, not a hole (review/throat_wings_check.png). Ebora's face unchanged. Concubine face and hair fixed after your note 'ugly face + spaces in the hair' (0 Meshy credits, one Codex run): the hair was single-sided sheets, so the inside vanished past the face edge (grey gaps at the temple, a lone strand, dark slivers by the eye); every visible hair face now has a back side, on all tiers. The s1 face is repainted calm and symmetric (level brows, open green eyes, dark red lips, no frown, no brown patch under the chin); s2-s4 carry it. Ebora's face is unchanged (pixel-checked). Look at: a faint zigzag at the base of the neck; a shaded wedge under the chin from below; s2's jaw turns olive; a small skin nub at the hairline centre. Sheets: Concubine before/after, Four sirens, Ebora unchanged.",
   summary:"Ebora, a red-skinned winged demoness in a black corset with skull cups, and her Concubines on the same body (siren1, plus siren2-4 as ramps for the script). The wings are built on MM9's wing bones. All 21 clips. Two passes, 25 credits.",
   look:["Folded wings, from behind and the side: MM9's clips close the fan from 68 to 13 degrees and flatten it, as MM9's own wing does. About 155 folded faces per wing: a partial pleat is the compromise.","The spread wings now show the tier colour from both sides (red, orange, blue). The membrane normals tilt with the wing.","Ebora and siren1 have separate paints, because they are different designs on one mesh. Your call.","Siren3 and siren4 faces read stark pale. The Concubine skin and lips now match MM9.","The Death fall puts the left arm 1.3 cm into the wing for a moment. The corpse is clean.","In game: spawned on map 9021, not the bathhouse. Her camera cut, launch, flight and landing are script work for later."],
   pics:[["review/sheet_ear_before_after.png","Throat/ears (cf10)"],["review/sheet_cf_s1_before_after.png","Concubine before/after"],["review/sheet_cf_sirens.png","Four sirens"],["review/sheet_cf_ebora_face.png","Ebora unchanged"],["review/sheet_cf_hair_sides.png","Hair sides"],["review/sheet_face_compare.png","Face compare"],["review/sheet_head_sides.png","Head sides"],["review/sheet_head_clips.png","Head in clips"],["review/sheet_mm9_vs_ours.png","MM9 vs ours"],["review/sheet_tiers.png","Tiers"],["review/sheet_siren_faces.png","Faces"],["review/sheet_wing_pleat_final.png","Wing fold"],["review/sheet_wing_web.png","Wing web"],["review/sheet_joints_1.png","Joints 1"],["review/sheet_joints_2.png","Joints 2"],["review/sheet_joints_3.png","Joints 3"],["review/strips_eb_1.png","Clips 1"],["review/strips_eb_2.png","Clips 2"],["review/sheet_ingame_p2.png","In game"]]},
