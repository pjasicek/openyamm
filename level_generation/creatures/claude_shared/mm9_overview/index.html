// Open decisions. Each option's first entry is its key in the copied answers.
const DECISIONS = [
  {id:'humanoid', answered:'Approved: the Yrsa route (MM9 skeleton and clips, five-finger hands, own head texture) for all MM9 humanoids.', area:'Creatures', title:'Villager v2: approve the humanoid route?',
   text:'Forad, Yrsa and Annud v2 are the first MM9 humanoids on the humanoid playbook. Approving them makes it the route for the Banshee, the Ghost, the Imp and the humanoid monsters of the Temple of Honk and the Lich Lab. 82 Lich Lab actors draw untextured until then.',
   who:'Forad, Yrsa, Annud', opts:[['approve','Approve, use it for the other MM9 humanoids'],['changes','Needs changes first (say what in the note)']]},
  {id:'dragonking', answered:'Grounded with a boss script, as in MM9.', area:'Creatures', title:'Dragon King: flying or grounded?',
   text:'In MM9 the dragon stays on the ground and flies only in a scripted landing. Our monster table marks it a flier, so the engine flies it at the party and plays its ground attacks in the air. Keeping it grounded needs a small boss script, which can also use MM9\'s landing and taunt clips.',
   who:'Dragon King', opts:[['grounded','Grounded with a boss script, as in MM9',true],['flying','Keep it flying']]},
  {id:'bird', answered:'Bird A stays a crow; Birds B and C get the eagle skin.', area:'Creatures', title:'Bird tiers: give the bigger birds a different look?',
   text:'MM9 gives Bird A, B and C the same crow skin, so ours differ only in size. MM9 also ships an unused eagle skin (BIRD.dtx) on the same texture layout.',
   who:'Bird (crow)', opts:[['same','Keep all three as crows, as in MM9'],['eagleC','Eagle look for Bird C only'],['eagleBC','Eagle look for Birds B and C']]},
  {id:'translucent', answered:'See-through for the spectral ones (Banshee, Ghost, Spectre Dagrell).', area:'Creatures', title:'See-through monsters',
   text:'MM9 draws the Jellyspore, the Dagrell, the Banshee and the Ghost see-through. Ours are opaque. The engine can already draw a blended creature mesh (the air elemental uses one), so this is model work, not engine work. Blended meshes are drawn after the opaque ones and are not instanced, so they cost a little more.',
   who:'Jellyspore, Dagrell, Banshee, Ghost', opts:[['spectral','See-through for the spectral ones (Banshee, Ghost, Spectre Dagrell); others opaque',true],['all','See-through for all four families'],['none','Keep everything opaque']]},
  {id:'seamon', answered:'Engine support for swimming and diving (needed anyway); the Sea Monster stays a ground actor until then.', area:'Creatures', title:'Sea Monster without water',
   text:'The engine has no swimming or diving, so the Sea Monster is a ground actor standing in the Wizard\'s Lab pool, its only placement. Drawing it at the waterline with its limbs under the surface would need engine support.',
   who:'Sea Monster', opts:[['ground','Keep it as a ground actor for now',true],['water','Plan engine support for monsters at the water surface']]},
  {id:'lich', answered:'Any member one promotion from Lich (Wizard, Necromancer). Done.', area:'Maps and story', title:'Lich Lab: who can become a Lich?',
   text:'In MM9 the Transmutation Engine never works: its script waits for a message nothing sends. The agent made it work: with the Lich Instructions quest, a Wizard carrying an Elixir of Defedation becomes a Lich, completes "Become a Lich" and gets 63,000 experience. Wizard-only was the agent\'s own choice.',
   who:'Lich Lab', opts:[['wizard','Wizard only (as built)'],['any','Any class'],['broken','Leave it broken, as in MM9']]},
  {id:'softlock', answered:'Saves stay allowed; Yrsa now stays until the cinema, so a reload can no longer lose the Turret Key. Done.', area:'Maps and story', title:'Isle of Ashes soft-lock',
   text:'As in MM9, Yrsa disappears on any re-entry once Forad has joined. If the party leaves the isle between Forad joining and getting the Turret Key, the bunker key can no longer be obtained. MM9 avoided this by forbidding saves on the isle; the remade map allows saving.',
   who:'Isle of Ashes', opts:[['aftercinema','Remove Yrsa and Forad only after the cinema',true],['nosave','Forbid saves on the isle, as MM9 did']]},
  {id:'threejs', answered:'Move it to claude_shared/vendor/ (after the running agents finish, so their viewer checks do not break).', area:'Housekeeping', title:'Shared three.js for the viewers',
   text:'All creature viewers (MM6–MM9) load three.js from level_generation/creatures/mm6_goblin/review_20261006/vendor/. When that folder was deleted on 2026-10-29, 55 viewers broke until it was restored.',
   who:'All viewers', opts:[['move','Move it to claude_shared/vendor/ and point every viewer there',true],['leave','Leave it where it is']]},
  {id:'hesperbackup', answered:'Keep it.', area:'Housekeeping', title:'Hesper backup (1.3 GB)',
   text:'output/hesper_stage/deco_renumber_before/ is the pre-migration backup from the Hesper decoration renumbering, which has finished.',
   who:'Disk space', opts:[['delete','Delete it'],['keep','Keep it']]},
];

const KEY = 'mm9_creature_review_v1';
let state = {verdicts:{}, notes:{}, decisions:{}, dnotes:{}};
try { const saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved) state = Object.assign(state, saved); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);

function dotClass(c)
{
  if (c.status === 'blocked') return 'blocked';
  if (c.status === 'ok' || state.verdicts[c.id] === 'ok') return 'ok';
  if (state.verdicts[c.id] === 'work') return 'work';
  return 'open';
}

function openCount()
{
  const reviews = CREATURES.filter(c => c.status === 'open' && !state.verdicts[c.id]).length;
  const decisions = DECISIONS.filter(d => !d.answered && !state.decisions[d.id]).length;
  return {reviews, decisions};
}

function renderNav(active)
{
  const n = openCount();
  let html = `<button data-id="decisions" class="${active === 'decisions' ? 'active' : ''}"><span>Your decisions</span><small>${n.decisions} open</small></button>`;
  html += `<button data-id="answers" class="${active === 'answers' ? 'active' : ''}"><span>Copy all answers</span></button>`;
  let group = '';
  for (const c of CREATURES)
  {
    if (c.group !== group) { group = c.group; html += `<div class="group">${esc(group)}</div>`; }
    html += `<button data-id="${c.id}" class="${active === c.id ? 'active' : ''}"><span>${esc(c.name)}</span><span class="dot ${dotClass(c)}"></span></button>`;
  }
  $('nav').innerHTML = html;
  $('headcount').textContent = `${CREATURES.length - 2} built, 2 waiting · ${n.reviews} creatures to review · ${n.decisions} decisions open`;
}

function picsHtml(c)
{
  return `<div class="pics">${c.pics.map(([src, cap]) => `<figure><img loading="lazy" src="${P(c.dir)}${src}" alt="${esc(cap)}"><figcaption>${esc(cap)}</figcaption></figure>`).join('')}</div>`;
}

// The embedded viewers are same-origin pages: hide their own header and let the 3D stage fill the frame.
function fitViewer(frame)
{
  try
  {
    const doc = frame.contentDocument;
    const style = doc.createElement('style');
    style.textContent = 'header{display:none}main{padding:8px 10px}#stage{height:calc(100vh - 170px);min-height:320px}';
    doc.head.appendChild(style);
  }
  catch (e) {}
}

function renderCreature(c)
{
  const viewers = c.viewers || [['review/viewer/index.html', 'Viewer']];
  const statusText = {ok:'Approved', open:'Waiting for your review', blocked:'Not built: humanoid, waits for the humanoid route'}[c.status];
  let html = '';
  if (!c.noViewer)
  {
    if (viewers.length > 1) html += `<div class="viewerpick">${viewers.map(([src, label], i) => `<button data-src="${src}" class="${i === 0 ? 'active' : ''}">${esc(label)}</button>`).join('')}</div>`;
    html += `<iframe id="viewer" title="${esc(c.name)} viewer" src="${P(c.dir)}${viewers[0][0]}"></iframe>`;
  }
  html += `<div class="card"><h2>${esc(c.name)}<span class="status ${c.status}">${statusText}</span></h2>`;
  html += `<p>${esc(c.summary)}</p>`;
  if (c.approved) html += `<p class="muted">Your verdict: ${esc(c.approved)}</p>`;
  if (c.rework) html += `<p style="color:var(--warn)">Your feedback is being worked on. ${esc(c.rework)}.</p>`;
  html += `<p class="muted">Project: <a href="${P(c.dir)}README.md" target="_blank">${esc(c.dir)}/README.md</a>`;
  if (!c.noViewer) html += ` · <a href="${P(c.dir)}${viewers[0][0]}" target="_blank">open the viewer in its own tab</a>`;
  html += `</p>`;
  if (c.look.length) html += `<h3>Worth a look</h3><ul>${c.look.map(l => `<li>${esc(l)}</li>`).join('')}</ul>`;
  if (c.status === 'open')
  {
    const v = state.verdicts[c.id];
    html += `<h3>Your verdict</h3><div class="verdict"><button data-v="ok" class="${v === 'ok' ? 'on ok' : ''}">Approve</button><button data-v="work" class="${v === 'work' ? 'on work' : ''}">Needs work</button>${v ? '<button data-v="">Clear</button>' : ''}</div>`;
    html += `<textarea id="note" rows="2" placeholder="Optional note, e.g. muzzle too pale, run looks stiff">${esc(state.notes[c.id] || '')}</textarea>`;
    html += `<p class="muted">For a note on one exact frame, use "Frame feedback" in the viewer above and paste its text here.</p>`;
  }
  html += `</div>`;
  html += `<div class="card"><h3 style="margin-top:0">Pictures</h3>${picsHtml(c)}<p class="muted">Click a picture to enlarge it.</p></div>`;
  $('main').innerHTML = html;
  const frame = $('viewer');
  if (frame) frame.onload = () => fitViewer(frame);
  for (const b of $('main').querySelectorAll('.verdict button'))
    b.onclick = () => { if (b.dataset.v) state.verdicts[c.id] = b.dataset.v; else delete state.verdicts[c.id]; save(); show(c.id); };
  const note = $('note');
  if (note) note.oninput = () => { state.notes[c.id] = note.value; save(); };
  for (const b of $('main').querySelectorAll('.viewerpick button'))
    b.onclick = () => { $('viewer').src = P(c.dir) + b.dataset.src; for (const o of $('main').querySelectorAll('.viewerpick button')) o.classList.toggle('active', o === b); };
}

function renderDecisions()
{
  const n = openCount();
  let html = `<div class="card"><h2>What needs your input</h2>`;
  html += `<div class="summary"><div><b>${n.reviews}</b>creatures waiting for your verdict</div><div><b>${n.decisions}</b>decisions open</div><div><b>2</b>creatures blocked on the humanoid route</div></div>`;
  html += `<p>Pick an answer for each question and give each creature a verdict in the list on the left. Your choices stay in this browser. When you are done, open <a href="#" data-go="answers">Copy all answers</a> and paste the text to me. Recommended options are marked.</p></div>`;
  let area = '';
  for (const d of DECISIONS)
  {
    if (d.area !== area) { if (area) html += `</div>`; area = d.area; html += `<div class="card"><h2>${esc(area)}</h2>`; }
    if (d.answered)
    {
      html += `<div class="q"><span class="title">${esc(d.title)}</span><span class="who">${esc(d.who)}</span><p style="color:var(--ok)">Decided: ${esc(d.answered)}</p></div>`;
      continue;
    }
    html += `<div class="q"><span class="title">${esc(d.title)}</span><span class="who">${esc(d.who)}</span><p>${esc(d.text)}</p><div class="opts">`;
    for (const [key, label, rec] of d.opts)
      html += `<label><input type="radio" name="${d.id}" value="${key}" ${state.decisions[d.id] === key ? 'checked' : ''}><span>${esc(label)}${rec ? '<span class="rec">recommended</span>' : ''}</span></label>`;
    html += `</div><textarea data-d="${d.id}" rows="1" placeholder="Optional note">${esc(state.dnotes[d.id] || '')}</textarea></div>`;
  }
  html += `</div>`;
  $('main').innerHTML = html;
  for (const r of $('main').querySelectorAll('input[type=radio]'))
    r.onchange = () => { state.decisions[r.name] = r.value; save(); renderNav('decisions'); };
  for (const t of $('main').querySelectorAll('textarea[data-d]'))
    t.oninput = () => { state.dnotes[t.dataset.d] = t.value; save(); };
  for (const a of $('main').querySelectorAll('[data-go]'))
    a.onclick = e => { e.preventDefault(); show(a.dataset.go); };
}

function answersText()
{
  const lines = ['MM9 creature review answers'];
  lines.push('', 'Decisions:');
  for (const d of DECISIONS)
  {
    const pick = d.opts.find(o => o[0] === state.decisions[d.id]);
    lines.push(`- ${d.title} ${pick ? pick[1] : '(no answer)'}${state.dnotes[d.id] ? ' | note: ' + state.dnotes[d.id] : ''}`);
  }
  lines.push('', 'Creatures:');
  for (const c of CREATURES.filter(x => x.status === 'open'))
  {
    const v = {ok:'approve', work:'needs work'}[state.verdicts[c.id]] || '(no verdict)';
    lines.push(`- ${c.name} (${c.dir}): ${v}${state.notes[c.id] ? ' | note: ' + state.notes[c.id] : ''}`);
  }
  return lines.join('\n');
}

function renderAnswers()
{
  let html = `<div class="card"><h2>Copy all answers</h2><p>Paste this text to me in the terminal.</p>`;
  html += `<div class="tools"><button id="copy">Copy to clipboard</button><button id="reset">Clear all answers</button><span id="copied" class="muted"></span></div>`;
  html += `<p></p><textarea id="answers" rows="24" readonly></textarea></div>`;
  $('main').innerHTML = html;
  $('answers').value = answersText();
  $('copy').onclick = async () =>
  {
    try { await navigator.clipboard.writeText($('answers').value); $('copied').textContent = 'Copied.'; }
    catch (e) { $('answers').select(); $('copied').textContent = 'Clipboard blocked: the text is selected, press Ctrl+C.'; }
  };
  $('reset').onclick = () =>
  {
    if (!confirm('Clear every verdict, note and answer on this page?')) return;
    state = {verdicts:{}, notes:{}, decisions:{}, dnotes:{}}; save(); show('answers');
  };
}

function show(id)
{
  renderNav(id);
  if (id === 'decisions') renderDecisions();
  else if (id === 'answers') renderAnswers();
  else renderCreature(CREATURES.find(c => c.id === id));
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
  for (const b of $('nav').querySelectorAll('button')) b.onclick = () => { show(b.dataset.id); window.scrollTo(0, 0); };
}

document.addEventListener('click', e =>
{
  const img = e.target.closest('.pics img');
  if (!img) return;
  $('overlay').querySelector('img').src = img.src;
  $('overlay').style.display = 'flex';
});
$('overlay').onclick = () => { $('overlay').style.display = 'none'; };
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('overlay').style.display = 'none'; });

const start = location.hash.slice(1);
show(start === 'answers' || start === 'decisions' || CREATURES.some(c => c.id === start) ? start : 'decisions');
</script>
</html>
