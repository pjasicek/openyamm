function draw(){
  const seq=sequence(),step=seq[Math.min(index,seq.length-1)],frame=DATA.frames[step.frame],page=DATA.pages[frame.page];
  const variant=$('variant').value,original=getImage('native_variants/'+step.frame+'_'+variant+'.png');
  const enhanced=getImage($('mask').checked?page.mask_overlay:page.variant_previews[variant]);
  for(const [id,im] of [['original',original],['restored',enhanced]]){
    const ctx=setup($(id));ctx.save();ctx.translate(144,144);if(step.mirrored)ctx.scale(-1,1);
    ctx.imageSmoothingEnabled=id!=='original';
    if(im.complete&&im.naturalWidth){
      if(id==='original')ctx.drawImage(im,-128,-128,256,256);
      else{
        const [x,y,w,h]=frame.atlas_xywh,[ox,oy]=frame.crop_origin_px;
        ctx.drawImage(im,x,y,w,h,ox/2-128,oy/2-128,w/2,h/2);
        if($('bounds').checked){ctx.strokeStyle='#ffc64b';ctx.lineWidth=.5;ctx.strokeRect(ox/2-128,oy/2-128,w/2,h/2);}
      }
    }
    if($('bounds').checked){ctx.strokeStyle='#67dce5';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(6,0);ctx.moveTo(0,-6);ctx.lineTo(0,6);ctx.stroke();}
    ctx.restore();
  }
  $('status').textContent=step.frame+' — '+(index+1)+' / '+seq.length+' — '+step.duration_ms+' ms'+(step.mirrored?' — native mirror':'');
  $('note').textContent=DATA.animations[$('action').value].single_view?
    'This action has one native view, used at every angle. No extra views were invented.':
    'The center pivot and native logical canvas remain fixed. Crops and mirrored views use their recorded offsets.';
}
function tick(now){
  const ready=sequenceReady();
  if(last&&!paused&&ready){elapsed+=Math.min(now-last,250);let seq=sequence();
    while(elapsed>=seq[index].duration_ms){elapsed-=seq[index].duration_ms;
      if(index+1<seq.length)index++;else if($('loop').checked)index=0;else{elapsed=0;break;}
    }
  }
  last=now;draw();requestAnimationFrame(tick);
}
for(const id of ['action','view'])$(id).onchange=reset;
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Play':'Pause';};
$('step').onclick=()=>{paused=true;$('pause').textContent='Play';index=(index+1)%sequence().length;elapsed=0;};
$('restart').onclick=reset;
requestAnimationFrame(tick);
</script></html>
