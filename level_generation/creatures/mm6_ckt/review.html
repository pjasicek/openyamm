if(params.has('frame')){playing=false;frame=Math.max(0,Math.min(seq().length-1,Number(params.get('frame'))||0));elapsed=seq().slice(0,frame).reduce((s,f)=>s+f.duration_ms,0);$('play').textContent='Play'}
function reset(){elapsed=0;frame=0}for(const id of ['action','view','palette'])$(id).onchange=reset;
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play'};
$('step').onclick=()=>{playing=false;$('play').textContent='Play';frame=(frame+1)%seq().length;elapsed=seq().slice(0,frame).reduce((s,f)=>s+f.duration_ms,0)};$('restart').onclick=reset;
function draw(canvas,step,original){const c=canvas.getContext('2d'),z=+$('zoom').value,x=350,y=530;
 c.fillStyle=$('bg').value;c.fillRect(0,0,700,600);c.fillStyle='#e8eee8';c.font='18px system-ui';c.fillText(original?'Original native palette':'Enhanced 2× atlas',20,28);
 c.strokeStyle='#77918a';c.beginPath();c.moveTo(20,y);c.lineTo(680,y);c.moveTo(x,y-6);c.lineTo(x,y+6);c.stroke();
 const f=manifest.frames[step.frame],p=manifest.pages[f.page];c.save();c.translate(x,y);c.scale(step.mirrored?-z:z,z);c.imageSmoothingEnabled=!original;
 if(original){const image=img(`native_variants/${step.frame}_${$('palette').value}.png`);if(image.complete&&image.naturalWidth)c.drawImage(image,-manifest.logical_pivot[0],-manifest.logical_pivot[1],...manifest.logical_canvas)}
 else{const image=img($('mask').checked?p.mask_overlay:p.variant_previews[$('palette').value]);const [sx,sy,w,h]=f.atlas_xywh,dx=f.crop_origin_px[0]/2-manifest.logical_pivot[0],dy=f.crop_origin_px[1]/2-manifest.logical_pivot[1];
 if(image.complete&&image.naturalWidth)c.drawImage(image,sx,sy,w,h,dx,dy,w/2,h/2);
 if($('crop').checked){c.lineWidth=1/z;c.strokeStyle='#ffd558';c.strokeRect(dx,dy,w/2,h/2)}}c.restore();}
function tick(now){const a=actions()[$('action').value],steps=seq(),total=steps.reduce((s,f)=>s+f.duration_ms,0);if(playing)elapsed+=Math.min(now-last,100);last=now;
 if(elapsed>=total){if($('loop').checked||a.playback==='loop')elapsed%=total;else elapsed=total-.001}let sum=0;frame=steps.length-1;for(let i=0;i<steps.length;i++){sum+=steps[i].duration_ms;if(elapsed<sum){frame=i;break}}
 const s=steps[frame];draw($('native'),s,true);draw($('enhanced'),s,false);$('status').textContent=`${s.frame} · frame ${frame+1}/${steps.length} · ${s.duration_ms} ms · native scale ${s.native_scale} · ${s.mirrored?'mirrored':'stored'}${a.single_view?' · native front-only action':''}`;requestAnimationFrame(tick)}
const initial=seq()[frame];draw($('native'),initial,true);draw($('enhanced'),initial,false);
requestAnimationFrame(tick);
</script></html>
