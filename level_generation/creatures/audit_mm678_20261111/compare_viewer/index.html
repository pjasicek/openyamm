const $ = id => document.getElementById(id);

const ROLES = [['standing', 'Stand'], ['walking', 'Walk'], ['run', 'Run'], ['attack_melee', 'Attack'],

function makeScene() {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x3a3f44);
  scene.add(new THREE.HemisphereLight(0xdfe6ee, 0x3a3226, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(2, 4, 3); scene.add(sun);
  const fill = new THREE.DirectionalLight(0xbfd0ff, 0.6); fill.position.set(-3, 2, -2); scene.add(fill);
  const grid = new THREE.GridHelper(4, 16, 0x56606a, 0x464d55); grid.name = 'grid'; scene.add(grid);
  return scene;
}

// Region ramps: the engine's fs_model.sc maths. Inside each mask channel the linear base colour moves to that region's
// 16-stop linear ramp, indexed by luminance normalised to the region's range.
function regionMaterial(material, parser) {
  const ramps = material.userData && material.userData.openyamm_region_ramps;
  const mask = material.userData && material.userData.openyamm_region_mask;
  if (!ramps || !mask || material.userData.regionPatched || new URLSearchParams(location.search).get('noregion')) return;
  material.userData.regionPatched = true;
  const data = new Float32Array(16 * 4 * 4);
  const lo = new THREE.Vector4(0, 0, 0, 0), hi = new THREE.Vector4(1, 1, 1, 1), on = new THREE.Vector4(0, 0, 0, 0);
  ramps.slice(0, 4).forEach((r, row) => {
    lo.setComponent(row, r.range[0]); hi.setComponent(row, r.range[1]); on.setComponent(row, 1);
    r.colors.forEach((c, i) => { const o = (row * 16 + i) * 4; data[o] = c[0]; data[o + 1] = c[1]; data[o + 2] = c[2]; data[o + 3] = 1; });
  });
  const rampTex = new THREE.DataTexture(data, 16, 4, THREE.RGBAFormat, THREE.FloatType);
  rampTex.magFilter = THREE.LinearFilter; rampTex.minFilter = THREE.LinearFilter; rampTex.needsUpdate = true;
  const uniforms = material.userData.regionUniforms = { regionMask: { value: null }, regionRamp: { value: rampTex }, regionLo: { value: lo },
    regionHi: { value: hi }, regionOn: { value: on } };
  parser.getDependency('texture', mask.index).then(t => { t.colorSpace = THREE.NoColorSpace; uniforms.regionMask.value = t;
    material.needsUpdate = true; });
  material.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, uniforms);
    shader.fragmentShader = shader.fragmentShader.replace('#include <map_fragment>', `#include <map_fragment>
#ifdef USE_MAP
{
  vec4 rm = texture2D(regionMask, vMapUv) * regionOn;
  float lum = dot(diffuseColor.rgb, vec3(0.2126, 0.7152, 0.0722));
  vec4 p = clamp((vec4(lum) - regionLo) / max(regionHi - regionLo, vec4(0.0001)), 0.0, 1.0);
  vec4 u = (p * 15.0 + 0.5) / 16.0;
  diffuseColor.rgb = mix(diffuseColor.rgb, texture2D(regionRamp, vec2(u.x, 0.125)).rgb, rm.r);
  diffuseColor.rgb = mix(diffuseColor.rgb, texture2D(regionRamp, vec2(u.y, 0.375)).rgb, rm.g);
  diffuseColor.rgb = mix(diffuseColor.rgb, texture2D(regionRamp, vec2(u.z, 0.625)).rgb, rm.b);
  diffuseColor.rgb = mix(diffuseColor.rgb, texture2D(regionRamp, vec2(u.w, 0.875)).rgb, rm.a);
}
#endif`).replace('void main() {', `uniform sampler2D regionMask; uniform sampler2D regionRamp;
uniform vec4 regionLo; uniform vec4 regionHi; uniform vec4 regionOn;
void main() {`);
  };
  material.customProgramCacheKey = () => 'region' + material.uuid;
}

async function applyVariant(side, skin) {
  const gltf = side.gltf; if (!gltf) return;
  const parser = gltf.parser, json = parser.json;
  const variants = (json.extensions && json.extensions.KHR_materials_variants || {}).variants || [];
  const vi = variants.findIndex(v => v.name === skin);
  const jobs = [];
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    const assoc = parser.associations.get(o);
    if (!assoc || assoc.meshes === undefined) return;
    const prim = json.meshes[assoc.meshes].primitives[assoc.primitives || 0];
    let index = prim.material;
    const mappings = prim.extensions && prim.extensions.KHR_materials_variants && prim.extensions.KHR_materials_variants.mappings;
    if (vi >= 0 && mappings) { const m = mappings.find(x => x.variants.includes(vi)); if (m) index = m.material; }
    if (index === undefined) return;
    if (!o.userData.defaultMaterial) o.userData.defaultMaterial = o.material;
    jobs.push(parser.getDependency('material', index).then(mat => {
      regionMaterial(mat, parser);
      if (o.isSkinnedMesh && mat.isMaterial) o.material = mat; else o.material = mat;
    }));
  });
  await Promise.all(jobs);
}

function sanitize(name) { return THREE.PropertyBinding.sanitizeNodeName(name || ''); }

function hideHelpers(root) {
  root.traverse(o => { if (o.isMesh && /shadow|lod[1-3]/i.test(o.name)) o.visible = false; });
}

async function loadSide(key, url, binding) {
  const side = sides[key];
  if (side.root) { side.scene.remove(side.root); side.root.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
  side.root = null; side.gltf = null; side.mixer = null;
  const gltf = await loader.loadAsync(url);
  side.gltf = gltf;
  const root = new THREE.Group();
  root.add(gltf.scene);
  hideHelpers(gltf.scene);
  gltf.scene.traverse(o => { if (o.isMesh) { o.frustumCulled = false; } });
  for (const att of binding.attachments || []) {
    try {
      const a = await loader.loadAsync(att.url);
      hideHelpers(a.scene);
      const node = gltf.scene.getObjectByName(sanitize(att.node)) || gltf.scene.getObjectByName(att.node);
      if (node) node.add(a.scene); else console.warn('attachment node missing', att.node);
      a.scene.traverse(o => { if (o.isMesh) { o.frustumCulled = false; } });
      side.attach = (side.attach || []).concat([a]);
    } catch (e) { console.warn('attachment', att.url, e); }
  }
  side.root = root;
  side.mixer = new THREE.AnimationMixer(gltf.scene);
  side.clips = Object.fromEntries(gltf.animations.map(c => [c.name, c]));
  side.scene.add(root);

function tier() { return current.tiers[Number($('modelRevision').value) || 0]; }

async function applyTier() {
  const t = tier();
  for (const key of ['before', 'after']) {
    const s = sides[key], b = t[key];
    if (!s.root) continue;
    const scale = b.scale || 1;
    s.root.scale.setScalar(scale / (t.before.scale || 1));
    s.root.rotation.y = key === 'after' ? (t.after.yaw - t.before.yaw) : 0;
    await applyVariant(s, b.skin);
  }
}

function clipFor(key) {
  const s = sides[key];
  if (!s.clips) return null;
  if (clipName) return s.clips[clipName] ? clipName : null;
  const bound = tier()[key].clips || {};
  const name = bound[role] || (role === 'run' ? bound.walking : null);
  if (name && s.clips[name]) return name;
  const fallback = { standing: 'Standing', walking: 'Walking', run: 'Running', attack_melee: 'Attack', cast: 'Cast',
    hit: 'Hit', dying: 'Death', fidget: 'Fidget', attack_ranged: 'Attack' }[role];
  return s.clips[fallback] ? fallback : null;
}

function startClips() {
  for (const key of ['before', 'after']) {
    const s = sides[key];
    if (!s.mixer) continue;
    s.mixer.stopAllAction();
    const name = clipFor(key);
    s.clipName = name;
    $(key === 'before' ? 'cb' : 'ca').textContent = name ? `${name} · ${s.clips[name].duration.toFixed(2)} s` : 'no such clip';
    if (name) { s.action = s.mixer.clipAction(s.clips[name]); s.action.play(); } else s.action = null;
  }

function frameCamera(view) {
  const box = new THREE.Box3();
  for (const key of ['before', 'after']) { const s = sides[key]; if (!s.root) continue;
    if (s.mixer) s.mixer.update(0);
    s.root.updateMatrixWorld(true);
    s.root.traverse(o => {
      if (!o.isMesh) return;
      for (let p = o; p; p = p.parent) if (!p.visible) return;
      if (o.isSkinnedMesh) o.skeleton.update();
      const b = new THREE.Box3();
      if (o.isSkinnedMesh) { o.computeBoundingBox(); b.copy(o.boundingBox).applyMatrix4(o.matrixWorld); }
      else { if (!o.geometry.boundingBox) o.geometry.computeBoundingBox(); b.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld); }
      if (!b.isEmpty() && isFinite(b.min.x)) box.union(b);
    }); }
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3()), centre = box.getCenter(new THREE.Vector3());
  const h = Math.max(size.y, size.x * 0.6, size.z * 0.6);
  for (const key of ['before', 'after']) { const g = sides[key].scene.getObjectByName('grid');
    g.scale.setScalar(Math.max(size.x, size.z, h) / 3); g.position.y = box.min.y; }
  let target = centre.clone(), dist = h * 2.2, dir;
  switch (view) {
    case 'three-quarter': dir = new THREE.Vector3(0.7, 0.15, 0.7); break;
    case 'side': dir = new THREE.Vector3(1, 0.05, 0); break;
    case 'back': dir = new THREE.Vector3(0, 0.1, -1); break;
    case 'head close-up': dir = new THREE.Vector3(0.35, 0.05, 1); target.y = box.max.y - size.y * 0.12; dist = h * 0.55; break;
    default: dir = new THREE.Vector3(0, 0.1, 1);
  }

  camera.position.copy(target).addScaledVector(dir.normalize(), dist);
  controls.target.copy(target); controls.update();
}

        mask: o.material.userData.regionUniforms.regionMask.value && [o.material.userData.regionUniforms.regionMask.value.image.width,
          o.material.userData.regionUniforms.regionMask.value.uuid === (o.material.map && o.material.map.uuid)],
        ramp0: Array.from(o.material.userData.regionUniforms.regionRamp.value.image.data.slice(0, 8)) } : null, o.name, o.material.name, !!o.material.map, o.material.color.getHexString(), o.material.metalness, o.material.roughness,
        !!o.material.metalnessMap, o.material.vertexColors, o.material.transparent, o.material.opacity]); }); return [k, out]; });

function pickDefaultRole(entry) {

  renderRoles();

function fillClips() {
  const names = new Set([...Object.keys(sides.before.clips || {}), ...Object.keys(sides.after.clips || {})]);
  $('clip').innerHTML = '<option value="">(by role)</option>' + [...names].sort().map(n =>
    `<option value="${n}">${n}${sides.before.clips[n] ? '' : ' (after only)'}${sides.after.clips[n] ? '' : ' (before only)'}</option>`).join('');
}

  $('roles').innerHTML = ROLES.map(([r, label]) => `<button data-role="${r}" class="${!clipName && r === role ? 'on' : ''}">${label}</button>`).join('');

$('chips').innerHTML = STREAMS.map(s => `<button class="chip ${s === stream ? 'on' : ''}" data-s="${s}">${s} (${
  s === 'all' ? manifest.models.length : manifest.models.filter(e => e.streams.includes(s)).length})</button>`).join('');

  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const items = [...$('list').children]; const i = items.findIndex(b => b.classList.contains('sel'));
  if (e.key === 'ArrowDown' && i < items.length - 1) { items[i + 1].click(); items[i + 1].scrollIntoView({ block: 'nearest' }); e.preventDefault(); }
  if (e.key === 'ArrowUp' && i > 0) { items[i - 1].click(); items[i - 1].scrollIntoView({ block: 'nearest' }); e.preventDefault(); }
  if (e.key === ' ') { $('play').click(); e.preventDefault(); }
});

function setFraction() {
  for (const key of ['before', 'after']) { const s = sides[key]; if (s.action) s.mixer.setTime(fraction * s.action.getClip().duration); }
}

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.floor(w * renderer.getPixelRatio()) || canvas.height !== Math.floor(h * renderer.getPixelRatio()))
    renderer.setSize(w, h, false);
  camera.aspect = (w / 2) / h; camera.updateProjectionMatrix();
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  resize();
  const dt = clock.getDelta() * Number($('speed').value);
  if (playing) {
    if ($('sync').checked) {
      const d = (sides.after.action || sides.before.action);
      if (d) { fraction = (fraction + dt / d.getClip().duration) % 1; setFraction(); }
    } else {
      for (const key of ['before', 'after']) { const s = sides[key]; if (s.mixer) s.mixer.update(dt); }
      const a = sides.after.action || sides.before.action;
      if (a) fraction = (a.time % a.getClip().duration) / a.getClip().duration;
    }
    $('scrub').value = fraction;
  }
  controls.update();
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setViewport(0, 0, w / 2, h); renderer.setScissor(0, 0, w / 2, h); renderer.render(sides.before.scene, camera);
  renderer.setViewport(w / 2, 0, w / 2, h); renderer.setScissor(w / 2, 0, w / 2, h); renderer.render(sides.after.scene, camera);
  $('readout').textContent = current ? `${current.tiers.length} tier(s) · time ${(fraction * 100).toFixed(0)} % · ` +
    `drag to orbit, wheel to zoom, ↑/↓ next model, space play/pause` : '';
});

renderList();
const start = manifest.models.find(m => m.stem === location.hash.slice(1)) || manifest.models[0];
select(start);
</script>
