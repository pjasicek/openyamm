  # ---------------------------------------------------------------- XD-04 Witches' Tower (2026-11-13, second pass)
  xwface:
    dungeon: xd04
    size: [256, 256]
    kind: picture
    refs: [mm7/hwm2d, mm7/7t1cab, mm7/t1d1a]
    tone: {like: [mm7/hwm2d], factor: 1.15}
    family: MM7 Clanker's Laboratory carved dark wood (hwm2d, 7t1cab)
    where: the Rosebud door (door:rosebud), cut by face_quarters.py into xwface1-4 for its two leaves
    standin: t1d1a-d (the Moon seal)
    what: >-
      A door of dark carved wood seen straight on, the whole canvas: carved in deep relief in the middle of it, filling
      most of the door, the face of a sleeping old woman, a witch: eyes shut, heavy lids, a long hooked nose, a wide
      thin mouth closed in a faint smile, deep wrinkles, wisps of carved hair and a pointed hood framing the face; a
      small carved rosebud under her chin. Dark brown-black wood like the references, worn smooth on the raised parts,
      dark in the recesses, a plain moulded border round the edge. The face is centred and symmetric about the
      vertical centre line.
  xwward:
    dungeon: xd04
    # Finished at the leaf's own 192 x 320; xd04_derive.py pads it to 256 x 512 (the leaf shows its top-left window).
    size: [192, 320]
    art: [192, 320]
    kind: cutout
    refs: [mm7/tws1a, mm7/t1d1a, mm7/7tws2]
    tone: {luma: 150}
    family: MM7 Temple of the Moon sigils (tws1a, the Moon seal t1d1a)
    where: the coven's ward over the roof stair (door:ward)
    standin: tws1a
    what: >-
      A witch's magic ward seen straight on, filling the whole canvas: a shimmering lattice of glowing violet and
      acid-green light lines woven across the canvas like a spider's web, thick and dense, with one large glowing
      sigil in the middle (a crescent moon inside a circle with a toad's eye and angular witch runes round it),
      glowing brightest at its lines, a soft glow along each strand. The strands touch all four edges. Everything
      that is not a glowing line is pure flat magenta #FF00FF.
  xwiron:
    dungeon: xd04
    size: [128, 128]
    kind: tile
    wrap: uv
    refs: [mm7/trim11_32, mm7/hwm2rf, mm7/7t1cab]
    tone: {like: [mm7/hwm2rf], factor: 0.75}
    family: MM7 Clanker's Laboratory black timber and iron (trim11_32, hwm2rf)
    where: the great cauldron's sides (platform:cauldron); the cage bars (xwcage, derived)
    standin: trim11_32
    what: >-
      Black cast iron plates of a huge cauldron, repeating: dark sooty black-grey iron with large rounded rivet heads in
      neat rows along the plate seams, a slight hammered texture, faint dull brown rust and green verdigris stains and
      soot, a little worn grey metal on the rivets.
  xwbrew:
    dungeon: xd04
    size: [128, 128]
    kind: tile
    wrap: uv
    refs: [mm7/7slimywtr, mm7/hwm2wall]
    tone: {luma: 95}
    family: MM7 Clanker's Laboratory liquid (7slimywtr), the witches' brew
    where: the great cauldron's top (platform:cauldron), the larder trough
    standin: 7slimywtr
    what: >-
      A thick bubbling witch's brew seen from straight above, repeating: bright opaque poison-green liquid, glowing
      lighter yellow-green at the bubbles, with many round bubbles of different sizes, some bursting, swirls of darker
      green and a little scum; no bottom visible. Bubbles spread evenly over the canvas.
  xwslate:
    dungeon: xd04
    size: [256, 128]
    art: [384, 192]
    kind: sign
    refs: [mm7/7tfb11, mm7/7t1books1, mm7/hwm1b]
    tone: {like: [mm7/7tfb11], factor: 1.05}
    family: MM7 Clanker's Laboratory furniture wood (7t1books1) round a slate (7tfb11)
    where: the schoolroom's east wall (panel:slate), the lower edge at a child's reading height
    standin: 7tfb11
    what: >-
      A schoolroom slate board: a wide board of smooth dark grey-black slate in a thick plain frame of dark brown wood
      like the second reference, with a narrow wooden chalk ledge along the bottom of the frame holding a stub of
      chalk. On the slate in a teacher's neat white chalk handwriting, large and readable: the heading
      "HOW TO BE A PROPER GOBLIN" and under it three lines "1. Never say please." "2. Never wash." "3. Forget your
      name." In the lower right corner of the slate, small and half rubbed out, scratched by a child in wobbly
      letters: "Rosebud", with a tiny drawn flower bud. Chalk smudges and old wiped marks on the slate.
  xwrecipe:
    dungeon: xd04
    size: [64, 128]
    art: [64, 128]
    kind: sign
    refs: [mm7/t2bedsht, mm7/hwm2rf, mm7/7t1books1]
    tone: {like: [mm7/t2bedsht], factor: 0.8}
    family: MM7 Clanker's Laboratory cloth and paper (t2bedsht)
    where: the herb loft's north wall (panel:recipe)
    standin: t2bedsht at scale 0.5
    what: >-
      A tall recipe card of old yellowed stained parchment, pinned at the top by a black iron nail, the corners curled.
      At the top a heading in brown ink, "STRENGTH BREW", under it a small neat ink drawing of a fat toad sitting on a
      barrel lid, and under that a few short lines of cramped brown handwriting, and at the bottom a big crossed-out
      bubbling pot.
  xwsky:
    dungeon: xd04
    size: [512, 512]
    kind: tile
    wrap: uv
    refs: [sky/sky05, sky/7sky01]
    tone: {luma: 170}
    family: the MM6-MM7 outdoor skies (sky05, 7sky01)
    where: the roof's walls above the parapet and its ceiling (theme:roof)
    standin: sky_clo1
    what: >-
      An open bright daytime sky seen straight up, repeating: clear light blue sky with soft white and pale grey
      fair-weather clouds of many sizes spread evenly over it, painted like the references, no sun, no horizon.
  xwcloudst:
    dungeon: xd04
    size: [512, 512]
    kind: picture
    refs: [sky/sky05, sky/cloudsabove]
    tone: {luma: 175}
    family: the MM6-MM7 outdoor skies (sky05)
    where: the cloud stair (exit:cloud_stair) on the roof's west wall
    standin: sky_clo1
    what: >-
      Seen straight on, an open bright blue daytime sky with soft white clouds, and in it a magical staircase made of
      thick white cloud: broad soft cloud steps starting at the bottom middle of the canvas and climbing up and away
      into the sky, getting smaller as they rise, glowing faintly gold at their edges, with a few wisps. Sky reaches
      every edge.
  # ---------------------------------------------------------------- XD-05 Orc Caves
  xopalis:
    dungeon: xd05
    size: [128, 256]
    kind: tile
    wrap: uv
    refs: [mm8/t66abc10a, mm8/gkp1ceil, mm8/gkp103a]
    tone: {like: [mm8/gkp1ceil], factor: 0.95}
    family: MM8 Ogre Fortress timber (t66abc10a posts, gkp1ceil planks)
    where: the palisade's outer face and the gate passage (theme:palisade)
    standin: gkp1ceil
    what: >-
      A palisade wall of rough upright logs seen straight on, repeating: four whole tree trunks side by side filling
      the width, each about a quarter of the width, dark brown wood with rough bark left in strips and pale axe-cut
      patches, narrow dark gaps between the logs, two horizontal bands of thick hemp rope lashing the logs together
      at one quarter and three quarters of the height, a few iron spikes. Logs run vertically through the whole
      height without ends.
  xodrumtp:
    dungeon: xd05
    size: [128, 128]
    kind: picture
    refs: [mm8/gkp1flr, mm8/t66abc10a, mm8/gcav1flr]
    tone: {luma: 120}
    family: MM8 Ogre Fortress (hide and timber)
    where: the tops of the three war drums (platform:drum_*), stretched once over the head
    standin: t66d13tb
    what: >-
      The head of a big war drum seen from straight above, filling the canvas edge to edge: a taut stretched hide of
      pale greyish tan leather, a little stained and scuffed from beating, with a large crude war sigil painted on it
      in dark red ochre and black: a tusked brutish skull with two crossed bones, in thick daubed strokes. Near the
      edges the hide is pierced by a ring of leather thongs that run outward to the edges. Even flat light.
  xodrumsd:
    dungeon: xd05
    size: [128, 128]
    kind: tile
    wrap: uv
    refs: [mm8/t66abc10a, mm8/gkp1ceil, mm8/gkp1flr]
    tone: {like: [mm8/t66abc10a], factor: 1.05}
    family: MM8 Ogre Fortress timber (t66abc10a)
    where: the sides of the three war drums
    standin: t66abc10a
    what: >-
      The side of a big wooden war drum's shell seen straight on, repeating left to right: dark brown vertical wooden
      staves, and over them tight rawhide thongs criss-crossing in a zig-zag between a thick hoop of rope near the top
      edge and one near the bottom edge, with pale bone pegs where the thongs turn. The hoops run straight across the
      whole width.
  xoburn:
    dungeon: xd05
    size: [128, 128]
    kind: tile
    wrap: uv
    refs: [mm8/t66abc10a, mm8/gcav1flr]
    tone: {luma: 115}
    family: MM8 Ogre Fortress timber, burning
    where: a war drum while it burns (set_texture on the drum's faces)
    standin: none
    what: >-
      Burning wood and hide seen straight on, repeating: blackened charred wooden staves cracked into squares of
      glowing orange embers, bright yellow-orange flames licking up across the whole surface, curling scorched hide,
      sparks. Flames spread evenly over the canvas.
  xochar:
    dungeon: xd05
    size: [128, 128]
    kind: tile
    wrap: uv
    refs: [mm8/t66abc10a, mm8/gcav1flr, mm8/gcav2flr]
    tone: {like: [mm8/gcav2flr], factor: 0.8}
    family: MM8 Ogre Fortress timber, burnt out
    where: a war drum after it has burnt (set_texture on the drum's faces)
    standin: none
    what: >-
      Charred burnt-out wood seen straight on, repeating: black charcoal staves cracked into a grid of small squares
      (alligator char), grey and white ash in the cracks, a few faint dull red ember spots, curled black scraps of
      burnt hide.
  xodaylt:
    dungeon: xd05
    size: [256, 128]
    kind: picture
    refs: [sky/sky05, mm8/gcav1flr]
    tone: {luma: 175}
    family: the outdoor daylight of the MM6-MM8 meadows seen from a cave
    where: the cave mouth's daylight (exit:x1_hills), stretched once over the mouth's south wall
    standin: none
    what: >-
      The view out of a dark cave mouth into bright daylight, filling the whole canvas: a hillside of green grass and
      grey rocks falling away, a dirt track winding down between them, rolling green meadows and small trees far
      below, distant blue hills and a pale bright sky with soft clouds; bright and slightly hazy, as if dazzling seen
      from the dark. No cave rock in the picture.
  xobones:
    dungeon: xd05
    size: [128, 256]
    kind: tile
    wrap: uv
    refs: [mm8/gcav1flr, mm8/gkp1-bs1]
    tone: {like: [mm8/gcav1flr], factor: 1.15}
    family: MM8 Ogre Fortress cave rock (gcav1flr)
    where: the shaman's den, the wall behind the spirit drum
    standin: gcav1flr
    what: >-
      A wall of dark grey rough cave rock like the first reference, with many old yellowed skulls and long bones
      pressed and wedged into it all over, as in an ossuary: human skulls, big tusked skulls, thigh bones, ribs,
      some pointing out, rock showing between them. Bones spread evenly over the canvas.
  xohide:
    dungeon: xd05
    size: [128, 256]
    kind: picture
    refs: [mm8/gkp1flr, mm8/t66abc10a, mm8/gcav1flr]
    tone: {like: [mm8/t66abc10a], factor: 1.2}
    family: MM8 Ogre Fortress (hide and timber)
    where: the hide curtain on the shaman's steps (platform:hide_curtain)
    standin: none
    what: >-
      A hanging curtain of crude stitched animal hides seen straight on, filling the canvas: patches of brown, tan and
      grey fur and leather sewn together with thick thongs in big crude stitches, hanging from a pole along the top
      edge, a few small bones and feathers tied to it, the fur hanging straight down.
  xopoles:
    dungeon: xd05
    size: [128, 128]
    kind: cutout
    refs: [mm8/t66abc10a, mm8/gkp1ceil]
    tone: {like: [mm8/t66abc10a], factor: 1.1}
    family: MM8 Ogre Fortress timber (t66abc10a)
    where: the cage gate over the prisoner pit's rim (door:cage_gate)
    standin: gkp1ceil
    what: >-
      A gate of rough wooden poles seen straight on, filling the whole canvas: four thick upright poles and three
      cross poles in a square lattice, dark brown bark, lashed together with rope where they cross; a straight pole
      along each of the four edges as the frame. Everything that is not wood or rope is pure flat magenta #FF00FF.
  xobackgt:
    dungeon: xd05
    size: [128, 256]
    kind: picture
    refs: [mm8/gkp103a, mm8/gkp1ceil, mm8/t66abc10a]
    tone: {like: [mm8/gkp103a], factor: 0.9}
    family: MM8 Ogre Fortress plank door (gkp103a)
    where: the back gate to X7 (exit:x7_slopes)
    standin: gkp103a
    what: >-
      A heavy door of thick dark brown planks like the first reference, seen straight on, filling the whole canvas:
      three wide iron straps across it, big rivets, two small square windows of crossed iron bars in its upper half
      through which bright yellow daylight shines, and a thin bright line of daylight along the bottom edge.
  xodrag:
    dungeon: xd05
    size: [128, 128]
    kind: tile
    wrap: uv
    refs: [mm8/gcav2flr, mm8/gkp1flr]
    tone: {like: [mm8/gcav2flr], factor: 1.1}
    family: MM8 Ogre Fortress cave floor (gcav2flr) and straw (gkp1flr)
    where: drag marks on the sleeping hollows' floor leading to the boulder (plates)
    standin: gcav2flr
    what: >-
      Dark blue-black rough cave floor rock like the first reference seen from straight above, repeating, with two
      parallel shallow scrape grooves running straight from the top edge to the bottom edge, about a third of the width
      apart, pale scratched rock and pushed-aside bits of straw along them.
