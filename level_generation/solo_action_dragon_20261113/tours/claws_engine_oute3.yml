  # The live fight: Attack held down on a MAW boss goblin in claw reach until it dies; the combo runs right, left,
  # right, left, bite. Fangs one above Dragon Ability, so the blows do not throw it out of reach (MAW's dragon
  # knockback), where the next press would breathe.
