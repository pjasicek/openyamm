# The installed forelegs in the engine (devdocs/solo_action/DRAGON.md "Built in the engine"): a MAW solo run whose
# party becomes one dragon, held poses, then a live fight (real Attack presses) and a live breath at range.
# cd /home/pjasicek/github/OpenYAMM && SDL_AUDIODRIVER=dummy ./tools/run_game.sh --isolated claws_engine_oute3 \
#   --world mm6 --map oute3.odm --ruleset maw:solo --set video.resolution=1600x900 --set video.window_mode=windowed \
#   --set debug.console=true --set gameplay.enemy_health_bars=off \
#   --set debug.menu_input_tour_path=/home/pjasicek/github/OpenYAMM/level_generation/solo_action_dragon_20261113/tours/claws_engine_oute3.yml \
#   --seconds 90
# The first capture is the default solo knight's arms; `testparty apply early solo_dragon` then swaps the party for a
# level-20 dragon, which draws the forelegs (the swap from the arms to the forelegs within one session).
output_dir: /home/pjasicek/github/OpenYAMM/level_generation/solo_action_dragon_20261113/renders/engine/oute3
exit: true
steps:
  - wait: 3
  - console: render hud off
  - console: loc
  - wait: 1
  - capture: 00_knight_arms
  - console: testparty apply early solo_dragon
  - wait: 3
  - console: loc
  - console: viewmodel clips
  - console: actor spawn 271 1 -9728 -11080 161
  - console: actor immobile last on
  - wait: 2
  - capture: 01_idle
  - console: viewmodel pose clawsattackright 0.2
  - wait: 0.5
  - capture: 02_right_rake_hit
  - console: viewmodel pose clawsattackleft 0.2
