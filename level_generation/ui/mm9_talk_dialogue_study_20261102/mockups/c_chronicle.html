<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MM9 talk C - chronicle</title>
<!-- Proposal C: a tall Obsidian chronicle at the right edge. The conversation so far scrolls in the upper part
     (NPC lines in Arrus, the party's sentences in Create, right-aligned); the current choices dock at the bottom and
     scroll on their own beyond six. ?state=typical|many|long&w=1600|1200|1950&touch=1 -->
<link rel="stylesheet" href="common.css">
<style>
#shade { position: absolute; top: 0; bottom: 0; right: 0; width: 760px; pointer-events: none;
  background: linear-gradient(90deg, #0000, #0007 40%, #000b); }
#panel { position: absolute; top: 8px; height: 708px; width: 560px; right: 12px; display: flex; flex-direction: column;
  padding: 2px 6px 6px 8px; }
#panel .head { display: flex; align-items: center; gap: 14px; }
#panel .head .portrait { width: 74px; height: 74px; flex: 0 0 auto; }
#panel .head .portrait.mono span { font-size: 32px; }
#panel .head .place { margin-top: 4px; }
#panel .rule { margin: 8px 0 4px; flex: 0 0 auto; }
#log { position: relative; flex: 1 1 auto; overflow: hidden; display: flex; flex-direction: column;
  justify-content: flex-end; gap: 10px; padding: 8px 14px 8px 4px;
  -webkit-mask-image: linear-gradient(#0000, #000 70px); mask-image: linear-gradient(#0000, #000 70px); }
#log .npc { font: 21px/1.3 Arrus, serif; color: var(--ivory); padding-left: 12px; border-left: 2px solid #6f5f3a88;
  text-shadow: 0 2px 1px #000; }
#log .npc.now { border-left-color: var(--gold); }
#log .party { align-self: flex-end; max-width: 86%; font: 18px/1.3 Create, serif; color: var(--heading);
  text-align: right; padding-right: 12px; border-right: 2px solid #8ebcfa55; }
#log .day { align-self: center; font: 12px Lucida, sans-serif; color: var(--muted); letter-spacing: 2px; }
#scroll { position: absolute; right: 2px; width: 4px; background: #29382a; }
#scroll i { position: absolute; left: -1px; width: 6px; background: #8c815f; }
#dock { flex: 0 0 auto; position: relative; }
#dock .list { position: relative; display: grid; gap: 1px; overflow: hidden; }
#dock .choice { font-size: 19px; min-height: 34px; }
#dock .more { font: 13px Lucida, sans-serif; color: var(--muted); text-align: center; padding: 3px 0 0; }
#dock .more b { font-weight: normal; color: var(--heading); }
#dock .exitrow { margin-top: 4px; border-top: 1px solid var(--line); padding-top: 4px; }
#dock .hint { text-align: right; padding: 4px 4px 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="shade"></div>
  <div id="panel" class="obsidian thin"></div>
</div>
<script src="data.js"></script>
<script>
const stage = setupStage();
const panel = document.getElementById('panel');
const panelWidth = stageWidth <= 1200 ? 500 : stageWidth >= 1900 ? 620 : 560;
panel.style.width = panelWidth + 'px';
document.getElementById('shade').style.width = (panelWidth + 200) + 'px';
const exitIndex = state.choices.findIndex((choice) => choice.exit);
const rows = state.choices.map((choice, index) => ({choice, index})).filter((entry) => !entry.choice.exit);
const maxRows = 6;
const shown = rows.slice(0, maxRows).map((entry) => choiceHtml(entry.choice, entry.index, state.hot)).join('');
const hidden = rows.length - Math.min(rows.length, maxRows);
// The conversation so far: an earlier visit collapsed above, then this visit, ending with the current NPC line.
const history = stateName === 'long'
  ? '<div class="day">EARLIER · 3 DAYS AGO</div>'
    + '<div class="party">We will accept this task.</div><div class="npc">Good luck.</div>'
    + '<div class="day">TODAY</div>'
  : '';
const log = state.log.map((entry) => `<div class="${entry.who}">${clean(entry.t)}</div>`)
  .join('');
const current = state.echo ? `<div class="npc now">${clean(state.text)}</div>` : '';
panel.innerHTML = `
  <div class="head">${portraitHtml()}<div><div class="name">${state.npc}</div><div class="place">${state.place}</div></div></div>
  <div class="rule"></div>
  <div id="log">${history}${log}${current}</div>
  <div class="rule"></div>
  <div id="dock">
    <div class="list">${shown}</div>
    ${hidden ? `<div class="more">scroll for <b>${hidden} more</b></div>` : ''}
    ${exitIndex >= 0 ? `<div class="exitrow">${choiceHtml(state.choices[exitIndex], exitIndex, -1)}</div>` : ''}
    <div class="hint keys"><b>1-${Math.min(9, rows.length)}</b> choose · <b>Wheel</b> read back · <b>Esc</b> leave</div>
  </div>`;
if (!state.echo)
{
  document.querySelector('#log > .npc:last-child').classList.add('now');
}
// Scrollbars only where content overflows: the log when history is present, the dock beyond six rows.
if (history)
{
  const logBox = document.getElementById('log');
  logBox.insertAdjacentHTML('beforeend', '<div id="scroll" style="top:8px;bottom:8px"><i style="bottom:0;height:55%"></i></div>');
}
if (hidden)
{
  const list = document.querySelector('#dock .list');
  list.insertAdjacentHTML('beforeend', `<div id="scroll" style="top:0;bottom:0"><i style="top:0;height:${Math.round(100 * maxRows / rows.length)}%"></i></div>`);
}
</script>
</body>
</html>
