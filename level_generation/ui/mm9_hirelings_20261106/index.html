<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MM9 hirelings HUD study</title>
<style>
  :root { --u: 2.25px; --brass: #b59a63; --brass-dark: #5d4a28; --stone: #18201c; --stone-hi: #26302a; }
  html, body { margin: 0; background: #0d0f0e; }
  .screen { position: relative; overflow: hidden; background-size: 100% 100%; }
  .layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  /* Obsidian panel: dark green-black stone, a brass border and an inner shadow, as the party basebar */
  .rail {
    position: absolute; box-sizing: border-box;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.05), transparent 60%),
      url("assets/stone_noise.svg"), linear-gradient(160deg, var(--stone-hi), var(--stone) 60%, #101512);
    border: calc(var(--u) * 2.2) solid transparent;
    border-image: linear-gradient(180deg, #d8c28e, var(--brass) 30%, var(--brass-dark) 70%, #9c8454) 1;
    box-shadow: inset 0 0 calc(var(--u) * 6) rgba(0,0,0,0.85), 0 0 calc(var(--u) * 3) rgba(0,0,0,0.6);
  }
  .cap { position: absolute; background: url("assets/endcap_lying.png") center / contain no-repeat; }
  .cap.flip { transform: scaleY(-1); }
  .plate {
    position: absolute; box-sizing: border-box; border-radius: calc(var(--u) * 6);
    background: url("assets/stone_noise.svg"), linear-gradient(160deg, var(--stone-hi), var(--stone));
    border: calc(var(--u) * 1.6) solid var(--brass);
    box-shadow: inset 0 0 calc(var(--u) * 5) rgba(0,0,0,0.85), 0 0 calc(var(--u) * 3) rgba(0,0,0,0.7);
  }
  .slot { position: absolute; }
  .face { position: absolute; border-radius: 50%; overflow: hidden; background-size: cover; background-position: center 20%; }
  .face.down { filter: grayscale(1) brightness(0.45); }
  svg.meter { position: absolute; overflow: visible; }
  .label { position: absolute; font: 600 13px/1.3 system-ui, sans-serif; color: #f3e6c4; background: rgba(0,0,0,0.72);
           padding: 4px 8px; border: 1px solid #7d6a43; white-space: nowrap; }
  .callout { position: absolute; border: 2px dashed rgba(255, 70, 70, 0.9); }
  /* gallery */
  .gallery { color: #ddd; font: 15px/1.45 system-ui, sans-serif; padding: 16px; max-width: 1500px; margin: auto; }
  .gallery img { width: 100%; border: 1px solid #333; }
  .gallery h2 { margin: 28px 0 6px; font-size: 18px; }
  .gallery .pair { display: grid; grid-template-columns: 16fr 12fr; gap: 12px; }
  @media (max-width: 900px) { .gallery .pair { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<script>
// MM9 hirelings at the right screen edge (study 2026-11-06): HUD units of 1/480 of the screen height (2.25 px at 1080p),
// over real captures of the five-member party at 16:9 and 4:3. ?variant=A|B|C&aspect=16x9|4x3&n=1|2&states=1&callouts=1
const params = new URLSearchParams(location.search);
const VARIANTS = {
  A: 'Rail over the right edge: one Obsidian rail flush with the right edge, its foot level with the basebar top',
  B: 'Medallions: each hireling a free-standing framed oval, HP as a bar under the face (MM9 style)',
  C: 'Corner rail: the rail of A flush with the right and bottom edges, beside the basebar',
};
const HIRELINGS = [
  {face: 'assets/npc15.png', hp: 0.82, name: 'melee hireling'},
  {face: 'assets/npc07.png', hp: 0.28, name: 'healer hireling', ability: true},
];

function hpColour(f) { return f >= 0.66 ? '#4fae5c' : f > 0.33 ? '#d9a93c' : '#d2543f'; }

// The party's HP arc geometry (gameplay.yml ObsidianPc1Health: start 100 degrees, sweep 160, the left side, filling
// from the bottom up) on a smaller ellipse; no mana arc.
function arcPath(cx, cy, rx, ry, startDeg, sweepDeg) {
  const p = d => [cx + rx * Math.cos(d * Math.PI / 180), cy + ry * Math.sin(d * Math.PI / 180)];
  const [x0, y0] = p(startDeg), [x1, y1] = p(startDeg + sweepDeg);
  const large = Math.abs(sweepDeg) > 180 ? 1 : 0, sweep = sweepDeg > 0 ? 1 : 0;
  return `M${x0} ${y0} A${rx} ${ry} 0 ${large} ${sweep} ${x1} ${y1}`;
}

function slotHtml(h, x, y, u, style, states) {
  // slot 62 x 76: face 40 x 54 (84 % of the party's 47.5 x 64)
  const fw = 40, fh = 54, fx = 11, fy = 9;
  const hp = states ? h.hp : 1;
  let html = `<div class="slot" style="left:${x*u}px;top:${y*u}px;width:${62*u}px;height:${76*u}px">`;
  html += `<div class="face" style="left:${fx*u}px;top:${fy*u}px;width:${fw*u}px;height:${fh*u}px;background-image:url(${h.face})"></div>`;
  const cx = (fx + fw / 2) * u, cy = (fy + fh / 2) * u;
  html += `<svg class="meter" style="left:0;top:0" width="${62*u}" height="${76*u}">`;
  // rim
  html += `<ellipse cx="${cx}" cy="${cy}" rx="${(fw/2+1.2)*u}" ry="${(fh/2+1.2)*u}" fill="none" stroke="#c9b27a" stroke-width="${1.1*u}"/>`;
  if (style === 'arc') {
    const rx = (fw/2 + 5) * u, ry = (fh/2 + 5) * u, w = 4 * u;
    html += `<path d="${arcPath(cx, cy, rx, ry, 100, 160)}" fill="none" stroke="#0b0d0c" stroke-width="${w+1.5*u}" stroke-linecap="round"/>`;
    html += `<path d="${arcPath(cx, cy, rx, ry, 100, 160 * hp)}" fill="none" stroke="${hpColour(hp)}" stroke-width="${w}" stroke-linecap="round"/>`;
    // the right side: a thin brass hairline in place of the mana arc
    html += `<path d="${arcPath(cx, cy, rx, ry, 80, -160)}" fill="none" stroke="#3b3324" stroke-width="${1*u}"/>`;
  } else {
    const bx = fx * u, by = (fy + fh + 4) * u, bw = fw * u, bh = 4 * u;
    html += `<rect x="${bx-u}" y="${by-u}" width="${bw+2*u}" height="${bh+2*u}" rx="${u}" fill="#0b0d0c" stroke="#7d6a43" stroke-width="${0.6*u}"/>`;
    html += `<rect x="${bx}" y="${by}" width="${bw*hp}" height="${bh}" rx="${0.6*u}" fill="${hpColour(hp)}"/>`;
  }
  if (states && h.ability) {
    // a daily ability ready (heal once a day): the personal-buff medallion's place, lower right
    const mx = (fx + fw + 3) * u, my = (fy + fh - 4) * u, r = 5.2 * u;
    html += `<circle cx="${mx}" cy="${my}" r="${r}" fill="#1a231e" stroke="#c9b27a" stroke-width="${0.9*u}"/>`;
    html += `<path d="M${mx-2.6*u} ${my}H${mx+2.6*u}M${mx} ${my-2.6*u}V${my+2.6*u}" stroke="#e9e2c8" stroke-width="${1.3*u}" stroke-linecap="round"/>`;
  }
  html += `</svg></div>`;
  return html;
}

function scene(variant, aspect, n, states, callouts) {
  const u = 2.25, H = 480, W = aspect === '4x3' ? 640 : 853.333;
  const hire = HIRELINGS.slice(0, n);
  let html = `<div class="screen" style="width:${W*u}px;height:${H*u}px;background-image:url(assets/capture_${aspect}.png)"><div class="layer">`;
  const slotH = 76, gap = variant === 'B' ? 8 : 2;
  const stackH = n * slotH + (n - 1) * gap;
  if (variant === 'A' || variant === 'C') {
    const railW = 70, pad = 7, railH = stackH + 2 * pad;
    const bottom = variant === 'A' ? 370 : 480;        // A: the foot on the basebar's top line; C: flush bottom
    const top = bottom - railH, left = W - railW + (variant === 'C' ? 0 : 0);
    html += `<div class="rail" style="left:${left*u}px;top:${top*u}px;width:${(railW+4)*u}px;height:${railH*u}px"></div>`;
    // end ornaments: the basebar's compact cap lying down, on the rail's top (and its foot for A)
    const capW = 66, capH = 26;
    html += `<div class="cap" style="left:${(left+railW/2-capW/2)*u}px;top:${(top-capH+7)*u}px;width:${capW*u}px;height:${capH*u}px"></div>`;
    if (variant === 'A') {
      html += `<div class="cap flip" style="left:${(left+railW/2-capW/2)*u}px;top:${(bottom-7)*u}px;width:${capW*u}px;height:${capH*u}px"></div>`;
    }
    hire.forEach((h, i) => { html += slotHtml(h, left + 4, top + pad + i * (slotH + gap), u, 'arc', states); });
    if (callouts) {
      html += `<div class="callout" style="left:${(left-3)*u}px;top:${(top-15)*u}px;width:${(railW+3)*u}px;height:${(railH+(variant==='A'?30:15))*u}px"></div>`;
    }
  } else {
    const plateW = 62, plateH = 80, bottom = 370, left = W - plateW - 5;
    const top = bottom - (n * plateH + (n - 1) * gap);
    hire.forEach((h, i) => {
      const y = top + i * (plateH + gap);
      html += `<div class="plate" style="left:${left*u}px;top:${y*u}px;width:${plateW*u}px;height:${plateH*u}px"></div>`;
      html += slotHtml(h, left, y + 1, u, 'bar', states);
    });
    if (callouts) {
      html += `<div class="callout" style="left:${(left-3)*u}px;top:${(top-3)*u}px;width:${(plateW+6)*u}px;height:${(bottom-top+6)*u}px"></div>`;
    }
  }
  html += `</div></div>`;
  return html;
}

// Revision 1 (the user, 2026-11-06): A, with the basebar's own panel (GameplayUiSkin renderPanel: obsidian_frame_*
// pieces at border scale 0.75 over obsidian_reading_surface), no end ornaments, each slot symmetric in the rail
// (equal space from the rail's inner edges to the HP arc on the left and to the rim on the right), the party's aggro
// diamond with its recovery arc (lower left) and buff medallion (lower right), the combat-log and followers buttons
// gone (MM9), the rail moved up under the minimap.
function panelHtml(x, y, w, h, u) {
  const c = 30.933333 * 0.75, t = 48.286179 * 0.75;     // corner and edge tile, units
  const piece = (name, px, py, pw, ph, rep) =>
    `<div style="position:absolute;left:${px*u}px;top:${py*u}px;width:${pw*u}px;height:${ph*u}px;` +
    `background:url(assets/frame/obsidian_frame_${name}.png) 0 0 / ${rep === 'x' ? `${t*u}px ${c*u}px` : rep === 'y' ? `${c*u}px ${t*u}px` : '100% 100%'} ${rep ? (rep === 'x' ? 'repeat-x' : 'repeat-y') : 'no-repeat'}"></div>`;
  let html = `<div style="position:absolute;left:${x*u}px;top:${y*u}px;width:${w*u}px;height:${h*u}px;` +
    `background:url(assets/frame/obsidian_reading_surface.png) 0 0 / ${640*u}px ${480*u}px"></div>`;
  html += piece('top', x + c, y, w - 2 * c, c, 'x') + piece('bottom', x + c, y + h - c, w - 2 * c, c, 'x');
  html += piece('left', x, y + c, c, h - 2 * c, 'y') + piece('right', x + w - c, y + c, c, h - 2 * c, 'y');
  html += piece('tl', x, y, c, c) + piece('tr', x + w - c, y, c, c);
  html += piece('bl', x, y + h - c, c, c) + piece('br', x + w - c, y + h - c, c, c);
  return html;
}

function slotR(h, x, y, w, u, g = {fw: 40, fh: 54, arcGap: 5, stroke: 4, top: 6}) {
  // the face, the HP arc (party geometry: left side, 160 degrees, filling upward) and the rim; the group is centred
  const fw = g.fw, fh = g.fh, arcOut = fw / 2 + g.arcGap + g.stroke / 2;   // the arc's outer edge from the centre
  const groupW = arcOut + fw / 2 + 1.2;                  // arc outer edge .. rim
  const cxU = x + (w - groupW) / 2 + arcOut, cyU = y + g.top + fh / 2;
  const cx = cxU * u, cy = cyU * u;
  let html = `<div class="face" style="left:${(cxU-fw/2)*u}px;top:${(cyU-fh/2)*u}px;width:${fw*u}px;height:${fh*u}px;background-image:url(${h.face})"></div>`;
  html += `<svg class="meter" style="left:0;top:0" width="100%" height="100%">`;
  html += `<ellipse cx="${cx}" cy="${cy}" rx="${(fw/2+1.2)*u}" ry="${(fh/2+1.2)*u}" fill="none" stroke="#c9b27a" stroke-width="${1.1*u}"/>`;
  const rx = (fw/2 + g.arcGap) * u, ry = (fh/2 + g.arcGap) * u, sw = g.stroke * u;
  html += `<path d="${arcPath(cx, cy, rx, ry, 100, 160)}" fill="none" stroke="#0b0d0c" stroke-width="${sw+1.4*u}" stroke-linecap="round"/>`;
  html += `<path d="${arcPath(cx, cy, rx, ry, 100, 160 * h.hp)}" fill="none" stroke="${hpColour(h.hp)}" stroke-width="${sw}" stroke-linecap="round"/>`;
  html += `</svg>`;
  // the aggro diamond under the arc's foot, its recovery arc while recovering; the buff medallion at the rim's foot
  const gx = cxU - arcOut + 1, gy = cyU + fh / 2 - 3, gs = 12.4;
  html += `<img src="assets/aggro_gem.png" style="position:absolute;left:${(gx-gs/2)*u}px;top:${(gy-gs/2)*u}px;width:${gs*u}px;height:${gs*1.07*u}px">`;
  if (h.recovery) {
    html += `<svg class="meter" style="left:0;top:0" width="100%" height="100%"><path d="${arcPath(gx*u, (gy+0.4)*u, 8*u, 8*u, -90, 360 * h.recovery * 0.999)}" fill="none" stroke="#e8dcb4" stroke-width="${1.2*u}"/></svg>`;
  }
  if (h.buffed) {
    const bx = cxU + fw / 2 - 1, by = cyU + fh / 2 - 3, bs = 13.6;
    html += `<img src="assets/buff_medallion.png" style="position:absolute;left:${(bx-bs/2)*u}px;top:${(by-bs/2)*u}px;width:${bs*u}px;height:${bs*0.94*u}px">`;
  }
  return html;
}

function sceneR(aspect, n) {
  const u = 2.25, H = 480, W = aspect === '4x3' ? 640 : 853.333;
  const hire = [
    {face: 'assets/npc15.png', hp: 0.82, buffed: true},
    {face: 'assets/npc07.png', hp: 0.28, recovery: 0.6},
  ].slice(0, n);
  const band = 8, slotH = 70, gap = 4;
  const w = 76, h = 2 * band + n * slotH + (n - 1) * gap;
  const x = W - w, y = 146;                              // under the minimap (its zoom buttons end at 136)
  let html = `<div class="screen" style="width:${W*u}px;height:${H*u}px;background-image:url(assets/capture_${aspect}_nobuttons.png)"><div class="layer">`;
  html += panelHtml(x, y, w + 0.5, h, u);
  hire.forEach((hh, i) => { html += slotR(hh, x + band, y + band + i * (slotH + gap), w - 2 * band, u); });
  return html + `</div></div>`;
}

// Revision 2 (the user, 2026-11-06): up to three hirelings (two paid plus Forad or Tamur, as MM9), the rail under the
// row of the combat-log and followers buttons (kept free for a combat log switched on in the settings), so three fit
// above the basebar's right ornament at 4:3 (its top at 377 units, its outer edge at 579): faces 34 x 46 (72 % of a
// party face), the arc 4 units out, 3.6 wide; 58 units a slot, a 70-unit rail.
function sceneR2(aspect, n, buttons) {
  const u = 2.25, H = 480, W = aspect === '4x3' ? 640 : 853.333;
  const hire = [
    {face: 'assets/npc15.png', hp: 0.82, buffed: true},
    {face: 'assets/npc07.png', hp: 0.28, recovery: 0.6},
    {face: 'assets/npc14.png', hp: 0.55},
  ].slice(0, n);
  const g = {fw: 34, fh: 46, arcGap: 4, stroke: 3.6, top: 6};
  const band = 8, slotH = 58, gap = 2;
  const w = 70, h = 2 * band + n * slotH + (n - 1) * gap;
  const x = W - w, y = 178;                              // under the combat-log / followers row (it ends at 172)
  const bg = buttons ? `capture_${aspect}.png` : `capture_${aspect}_nobuttons.png`;
  let html = `<div class="screen" style="width:${W*u}px;height:${H*u}px;background-image:url(assets/${bg})"><div class="layer">`;
  html += panelHtml(x, y, w + 0.5, h, u);
  hire.forEach((hh, i) => { html += slotR(hh, x + band, y + band + i * (slotH + gap), w - 2 * band, u, g); });
  return html + `</div></div>`;
}

const variant = params.get('variant');
if (variant === 'R2') {
  document.body.innerHTML = sceneR2(params.get('aspect') || '16x9', Number(params.get('n') || 3), params.get('buttons') === '1');
} else if (variant === 'R') {
  document.body.innerHTML = sceneR(params.get('aspect') || '16x9', Number(params.get('n') || 2));
} else if (variant) {
  document.body.innerHTML = scene(variant, params.get('aspect') || '16x9', Number(params.get('n') || 2),
    params.get('states') !== '0', params.get('callouts') === '1');
} else {
  let g = `<div class="gallery"><h1>MM9 hirelings at the right screen edge</h1>
  <p>Study for the MM9 hireling HUD (2026-11-06). At most two hirelings beside a party of five. Real captures of the
  current Obsidian HUD; the hireling frames are drawn here. Hireling faces are MM9's own NPC portraits (60 x 80,
  upscaled for the study; the game would use x2 restorations like the MM9 PC portraits). Each face is 84 % of a party
  face, HP only (no mana), on the party's HP arc or as MM9's bar. The cross medallion marks a daily ability ready
  (the healer's heal once a day). No names under the faces, as for the party.</p>`;
  g += `<h2>Revision 2 (current): up to three hirelings, under the combat-log row</h2>
    <p>Two paid hirelings plus Forad or Tamur at most, as in MM9. The rail starts under the row of the combat-log and
    followers buttons (hidden in MM9 and Standard, kept free for a combat log switched on in the settings), so the
    faces are 72 % of a party face to fit three above the basebar's right ornament at 4:3.</p>
    <div class="pair"><img src="images/R2_16x9.png" alt="Revision 2 at 16:9, three hirelings"><img src="images/R2_4x3.png"
    alt="Revision 2 at 4:3, three hirelings"></div><div class="pair" style="margin-top:12px"><img
    src="images/R2_16x9_buttons.png" alt="Revision 2 with the combat log on"><img src="images/R2_4x3_two.png"
    alt="Revision 2 at 4:3, two hirelings"></div>`;
  g += `<h2>Revision 1: A with the basebar's own frame, symmetric slots, the aggro diamond and buff medallion</h2>
    <p>The Obsidian panel of the basebar (same frame pieces and stone, border scale 0.75); no end ornaments; each slot
    centred so the space from the rail to the HP arc on the left equals the space from the rim to the rail on the right;
    the aggro diamond with its recovery arc (lower left; the second hireling is recovering) and the buff medallion (lower
    right; the first is buffed); the combat-log and followers buttons are gone in MM9, so the rail sits under the
    minimap.</p><div class="pair"><img src="images/R_16x9.png" alt="Revision 1 at 16:9"><img src="images/R_4x3.png"
    alt="Revision 1 at 4:3"></div><div class="pair" style="margin-top:12px"><img src="images/R_16x9_one.png"
    alt="Revision 1, one hireling"></div><h2>First round</h2>`;
  for (const v of ['A', 'B', 'C']) {
    g += `<h2>${v}. ${VARIANTS[v]}</h2><div class="pair"><img src="images/${v}_16x9.png" alt="${v} at 16:9">
      <img src="images/${v}_4x3.png" alt="${v} at 4:3"></div>`;
  }
  g += `<h2>One hireling</h2><div class="pair"><img src="images/A_16x9_one.png" alt="A, one hireling"><img src="images/C_4x3_one.png" alt="C, one hireling at 4:3"></div></div>`;
  document.body.innerHTML = g;
}
</script>
</body>
</html>
