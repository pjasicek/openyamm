status: Integration contract, not engine font descriptors or UiLayoutManager input
design: Carved Obsidian menus r03, approved 2026-09-28
canvas:
  browser_pixels:
  - 1600
  - 900
  logical_units:
  - 853.3333
  - 480
  pixel_to_logical: 0.5333333333333333
  fit: min(screenWidth / 853.333333, screenHeight / 480); center; same transform for input.
  aspect: Keep content visible at 4:3 and ultrawide; extend the background beyond fitted canvas.
fonts:
  fondamento:
    file: engine/fonts/truetype/fondamento_regular.ttf
    role: Actions, headings, wordmark
    proposed_layout_cell_height: 32
    requires: Standalone TrueType loading/metrics. Current FontAsset replacement requires legacy FNT metrics.
  arrus:
    file: engine/fonts/truetype/openyamm_arrus_faithful.ttf
    role: Body, values, skills, save names
    existing_descriptor: arrus.yml
    logical_height: 19
    baseline: 14
    browser_size_adjust: 1.2
  lucida:
    file: engine/fonts/truetype/openyamm_lucida_faithful.ttf
    role: Metadata, help, keys, form labels
    existing_descriptor: lucida.yml
    logical_height: 17
    baseline: 13
    browser_size_adjust: 1.2
live_text: All labels and the wordmark remain text. Preserve per-face advance widths; no bitmap-label fallback.
wordmark:
  gradient:
  - '#fff0c9'
  - '#ceb483'
  - '#8d754e'
  - '#ebd9ad'
  fallback_solid: '#e9d4a6'
text_states:
  normal: '#e8d1a4'
  primary: '#ffe4ac'
  hover: '#fff0c0'
  disabled_opacity: 0.34
  pressed_offset_browser_pixels:
  - 0
  - 1
focus: Gold 2px outline, offset 4px. Preserve keyboard navigation/focus separately from selected state.
button_drawing: Element rect is the hit/text content box. Expand image destination by recorded padding and retain
  corner/edge sizes with nine-slice; convert image pixels by pixel_to_logical.
panel_drawing: Panel elements already include image padding; do not expand twice. Reference-size exports can draw
  as one quad. Modal resizing uses source border slices, not stretched carved corners.
source_panel_slices:
  file: source/stone-panel.png
  source_pixels_trbl:
  - 72
  - 65
  - 75
  - 65
  target_browser_pixels: 23
range_controls:
  track: '#0d1713'
  track_border: '#766747'
  fill: '#ac935c'
  thumb: '#d8ba7b'
  instruction: Draw native range/scroll primitives at the measured rectangles.
