# MM9 worn equipment drawn on the paperdoll, repainted from the new MM7/MM8-style icons (prototype, 2026-11-05).
# Same fields as level_generation/ui/hesper_paperdoll/pieces.yml. The key is the item's Pic File, so the doll files
# are mm9_item_<id><suffix>.png as the engine looks them up.
#
#   reference  the engine item whose fitted MM7/MM8 files own canvas, pose, placement and silhouette: the reviewed
#              choice of tools/mm9_import_discovery/mm9_equipment_legacy_base_mappings.yml
#   coverage   armour: that table's geometry_profile (the reviewed cut of the reference's legs)
#   smooth_crown  helms whose table entry asks for smooth_upper_protrusions
#   facts      the design facts read from the NEW icon (items/<id>/icon_a_x2.png), not the table's older
#              transfer_focus
# Gauntlets: one glove (the inventory icon) drawn in the jewellery panel's 40x72 cell, centred by its
# complex_item_pictures row (all six doll types alike).
