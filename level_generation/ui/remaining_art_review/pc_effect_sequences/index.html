<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenYAMM · PC effect animations</title>
  <style>
    :root{color-scheme:dark;font:15px/1.45 system-ui,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:#11171d;color:#ecf2ee}
    a{color:#8bdac4}
    button,input,select{font:inherit}
    button,select{border:1px solid #657981;border-radius:6px;background:#dfeae6;color:#17262b;padding:6px 10px;cursor:pointer}
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f8ca70;outline-offset:2px}
    header{padding:18px 25px;border-bottom:1px solid #42535c}
    h1{font-size:27px;margin:0 0 3px}
    header p{margin:0;color:#b8c9cb}
    .layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 100px)}
    aside{border-right:1px solid #42535c;background:#19232b;padding:15px;min-width:0}
    aside label{display:block;color:#c1d0d0;font-size:13px;margin-bottom:7px}
    aside input{width:100%;border:1px solid #6a7f87;border-radius:6px;padding:8px;background:#10171d;color:#edf5f1}
    #group-list{display:grid;gap:5px;margin-top:13px}
    #group-list button{width:100%;text-align:left;background:#26343d;color:#e3efea;border-color:#435862}
    #group-list button.selected{background:#235a53;border-color:#8ee0c3}
    #group-list small{display:block;color:#aebfc0;font-size:12px}
    main{min-width:0;padding:18px 23px 35px}
    .title-row{display:flex;align-items:start;justify-content:space-between;gap:12px;flex-wrap:wrap}
    h2{font-size:24px;margin:0}
    .subhead{margin:2px 0 0;color:#b9c9c9}
    .badge{display:inline-block;background:#3d493c;color:#efe1ac;border:1px solid #786f4b;
      border-radius:999px;padding:3px 9px;font-size:12px;white-space:nowrap}
    .badge.new{background:#19483f;border-color:#3a9b83;color:#c1f1df}
    .controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:18px 0 13px;
      padding:12px;background:#20303a;border:1px solid #425660;border-radius:9px}
    .controls label{display:flex;align-items:center;gap:7px}
    .controls input[type=range]{width:min(190px,38vw);accent-color:#80dbc3}
    .controls select{padding:5px}
    .current{min-width:145px;color:#e6eeee;font-weight:650}
    .view-options{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 12px;color:#c6d4d4}
    .view-options input{accent-color:#7bd7bd}
    .compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
    figure{margin:0;border:1px solid #435963;border-radius:9px;overflow:hidden;background:#26343e}
    figcaption{padding:9px 13px;background:#1d2b34;border-bottom:1px solid #435963;font-weight:650}
    .stage{height:350px;display:flex;align-items:center;justify-content:center;overflow:auto;background:#38454d}
    body[data-backdrop=dark] .stage,body[data-backdrop=dark] .thumb{background:#26343d}
    body[data-backdrop=light] .stage,body[data-backdrop=light] .thumb{background:#bdc7c5}
    body[data-backdrop=checker] .stage,body[data-backdrop=checker] .thumb{
      background-color:#48545b;background-image:linear-gradient(45deg,#708087 25%,transparent 25%),
      linear-gradient(-45deg,#708087 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#708087 75%),
      linear-gradient(-45deg,transparent 75%,#708087 75%);background-size:24px 24px;
      background-position:0 0,0 12px,12px -12px,-12px 0}
    .art{position:relative;flex:none}
    .art img{display:block;width:100%;height:100%;object-fit:contain}
    .art img.native{image-rendering:pixelated}
    .guide .art::before{content:"";position:absolute;pointer-events:none;box-sizing:border-box;
      left:var(--guide-left);top:var(--guide-top);width:var(--guide-width);height:var(--guide-height);
      border:2px dashed #eec964;border-radius:50%;opacity:.85}
    .guide .art[data-guide-shape=rect]::before{border-radius:2px}
    .guide .art::after{content:"";position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(to right,transparent calc(var(--guide-x) - .5px),
        #eec964 var(--guide-x),transparent calc(var(--guide-x) + .5px)),
      linear-gradient(to bottom,transparent calc(var(--guide-y) - .5px),
        #eec964 var(--guide-y),transparent calc(var(--guide-y) + .5px));opacity:.75}
    .detail{padding:9px 13px;color:#bdcdcf;min-height:42px;overflow-wrap:anywhere}
    .frame-links{display:flex;gap:15px;flex-wrap:wrap;margin:14px 0 4px}
    .frame-links a{font-weight:650}
    h3{font-size:18px;margin:23px 0 9px}
    #strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
    .thumb{min-height:125px;background:#26343d;color:#e9f0ed;border:1px solid #4d636d;
      display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px}
    .thumb.selected{border:2px solid #f0c76c;padding:5px}
    .thumb img{height:82px;max-width:100%;object-fit:contain}
    .thumb span{font-size:12px;overflow-wrap:anywhere}
    .hint{color:#afc0c1;font-size:13px;margin:14px 0 0}
    @media(max-width:850px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #42535c}
      #group-list{display:flex;overflow-x:auto}#group-list button{min-width:130px}}
    @media(max-width:620px){.compare{grid-template-columns:1fr}main{padding:14px}.stage{height:330px}}
  </style>
</head>
<body data-backdrop="dark">
  <header>
    <h1>PC effect animations</h1>
    <p id="summary">Loading sequences…</p>
  </header>
  <div class="layout">
    <aside>
      <label for="search">Find a sequence or frame</label>
      <input id="search" type="search" placeholder="sp05e, spell68e, spboost…">
      <nav id="group-list" aria-label="Effect sequences"></nav>
    </aside>
    <main>
      <div class="title-row">
        <div><h2 id="title"></h2><p class="subhead" id="subtitle"></p></div>
        <span class="badge" id="status"></span>
      </div>
      <div class="controls">
        <button id="prev-sequence" type="button" title="Previous sequence">◀ Sequence</button>
        <button id="prev-frame" type="button" title="Previous frame">◀ Frame</button>
        <button id="play" type="button">Pause</button>
        <button id="next-frame" type="button" title="Next frame">Frame ▶</button>
        <button id="next-sequence" type="button" title="Next sequence">Sequence ▶</button>
        <label>Frame <input id="scrub" type="range" min="1" value="1"></label>
        <span class="current" id="current"></span>
        <label>Speed <select id="fps"><option value="4">4 fps</option><option value="8" selected>8 fps</option>
          <option value="12">12 fps</option></select></label>
      </div>
      <div class="view-options">
        <label>Backdrop <select id="backdrop"><option value="dark">Dark</option><option value="checker">Checker</option>
          <option value="light">Light</option></select></label>
        <label><input id="guide" type="checkbox"> Show native effect envelope and center</label>
      </div>
      <div class="compare" id="compare">
        <figure><figcaption>Native original · pixel zoom</figcaption><div class="stage">
          <div class="art" id="native-art"><a id="native-link" target="_blank" rel="noopener">
            <img class="native" id="native" alt="Native animation frame"></a></div></div>
          <div class="detail" id="native-detail"></div></figure>
        <figure><figcaption>Current 2× review candidate</figcaption><div class="stage">
          <div class="art" id="candidate-art"><a id="candidate-link" target="_blank" rel="noopener">
            <img id="candidate" alt="Restored animation frame"></a></div></div>
          <div class="detail" id="candidate-detail"></div></figure>
      </div>
      <div class="frame-links"><a id="review-link">Review this frame</a>
        <a id="contact-link">View this sequence's contact sheet</a>
        <a href="../review_repairs/full_sequences/index.html">Compare the four kept sequences</a></div>
      <h3>Frames in engine order</h3>
      <div id="strip" aria-label="Animation frames"></div>
      <p class="hint">Click a frame to inspect it. Space pauses; arrow keys step frames or switch sequences.
        The review link opens the matching approval card.</p>
    </main>
  </div>
  <script src="sequences.js"></script>
  <script>
    (() => {
      'use strict';
      const data = window.PC_EFFECT_SEQUENCES;
      const groups = data.sequences;
      const $ = selector => document.querySelector(selector);
      const params = new URLSearchParams(location.search);
      let groupIndex = Math.max(0, groups.findIndex(group => group.family === params.get('sequence')));
      let frameIndex = Math.max(0, Math.min(groups[groupIndex].frames.length - 1,
        (Number(params.get('frame')) || 1) - 1));
      let playing = params.get('pause') !== '1';
      let timer;
      const list = $('#group-list');
      const strip = $('#strip');
      $('#summary').textContent = `${data.summary.sequences} sequences · ${data.summary.frames} engine frames · ` +
        `${data.summary.approved_sequences} approved · ` +
        `${data.summary.supplemental_frames} frame outside the main art catalog`;

      function syncUrl() {
        const url = new URL(location.href);
        url.searchParams.set('sequence', groups[groupIndex].family);
        url.searchParams.set('frame', String(frameIndex + 1));
        if (playing) url.searchParams.delete('pause');
        else url.searchParams.set('pause', '1');
        history.replaceState(null, '', url);
      }
      function renderList() {
        const query = $('#search').value.trim().toLowerCase();
        list.replaceChildren();
        groups.forEach((group, index) => {
          if (query && ![group.family, group.animation, ...group.frames.map(frame => frame.name)]
            .some(value => value.toLowerCase().includes(query))) return;
          const button = document.createElement('button');
          button.type = 'button';
          button.dataset.sequence = group.family;
          button.classList.toggle('selected', index === groupIndex);
          button.textContent = group.family;
          const detail = document.createElement('small');
          detail.textContent = `${group.frames.length} frames · ${group.animation}`;
          button.append(detail);
          button.onclick = () => selectGroup(index);
          list.append(button);
        });
      }
      function showFrame() {
        const group = groups[groupIndex];
        const frame = group.frames[frameIndex];
        $('#native').src = frame.original;
        $('#candidate').src = frame.candidate;
        $('#native-link').href = frame.original;
        $('#candidate-link').href = frame.candidate;
        $('#native-detail').textContent = `${frame.name} · ${group.native_size.join('×')} native pixels`;
        $('#candidate-detail').textContent = `${frame.candidate_origin} · ${group.native_size.map(n => n * 2).join('×')} pixels`;
        $('#review-link').href = frame.review;
        $('#review-link').textContent = frame.approved ? 'View accepted frame' : frame.status === 'hud_pending'
          ? 'Review first frame' : frame.kept_approved
            ? 'View kept frame' : 'Review this frame';
        $('#current').textContent = `${frameIndex + 1} / ${group.frames.length} · ${frame.name}`;
        $('#scrub').value = String(frameIndex + 1);
        strip.querySelectorAll('.thumb').forEach((button, index) =>
          button.classList.toggle('selected', index === frameIndex));
        $('#status').textContent = frame.approved ? 'Accepted · recorded in effect ledger' : frame.status === 'hud_pending' ? 'Supplemental frame with fixed core · review'
          : frame.kept_approved ? 'Kept approved sequence'
            : group.idle_core_locked ? 'Idle core fixed in place · review'
            : frame.full_sequence_repair ? 'Complete sequence repair · review' : 'Current candidate · review';
        $('#status').classList.toggle('new', Boolean(frame.full_sequence_repair)
          || frame.kept_approved);
        if (!playing) syncUrl();
      }
      function selectGroup(index, initialFrame = 0) {
        groupIndex = (index + groups.length) % groups.length;
        frameIndex = initialFrame;
        const group = groups[groupIndex];
        $('#title').textContent = group.family;
        $('#subtitle').textContent = `${group.animation} in icon_frame_data.txt · ` +
          `${group.frames.length} frames · ${group.native_size.join('×')} native canvas`;
        $('#scrub').max = String(group.frames.length);
        $('#contact-link').hidden = Boolean(group.frames[0].kept_approved);
        $('#contact-link').href = `../review_repairs/remaining_sequences/contacts/index.html#${group.family}`;
        $('#contact-link').textContent = group.idle_core_locked
          ? 'Compare native and fixed-core frames' : 'View this sequence’s contact sheet';
        for (const art of [$('#native-art'), $('#candidate-art')]) {
          art.style.width = `${group.native_size[0] * 4}px`;
          art.style.height = `${group.native_size[1] * 4}px`;
          const [left, top, right, bottom] = group.native_envelope;
          art.style.setProperty('--guide-left', `${left / group.native_size[0] * 100}%`);
          art.style.setProperty('--guide-top', `${top / group.native_size[1] * 100}%`);
          art.style.setProperty('--guide-width', `${(right - left) / group.native_size[0] * 100}%`);
          art.style.setProperty('--guide-height', `${(bottom - top) / group.native_size[1] * 100}%`);
          art.style.setProperty('--guide-x', `${group.guide_center[0] / group.native_size[0] * 100}%`);
          art.style.setProperty('--guide-y', `${group.guide_center[1] / group.native_size[1] * 100}%`);
          art.dataset.guideShape = group.guide_shape;
        }
        strip.replaceChildren();
        group.frames.forEach((frame, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'thumb';
          button.dataset.frame = String(index + 1);
          const image = document.createElement('img');
          image.src = frame.candidate;
          image.alt = '';
          const label = document.createElement('span');
          label.textContent = frame.name;
          button.append(image, label);
          button.onclick = () => { frameIndex = index; setPlaying(false); showFrame(); };
          strip.append(button);
          if (index < 2) { const preload = new Image(); preload.src = frame.original; }
        });
        renderList();
        showFrame();
        syncUrl();
      }
      function setPlaying(value) {
        playing = value;
        $('#play').textContent = playing ? 'Pause' : 'Play';
        clearInterval(timer);
        syncUrl();
        if (playing) timer = setInterval(() => {
          frameIndex = (frameIndex + 1) % groups[groupIndex].frames.length;
          showFrame();
        }, 1000 / Number($('#fps').value));
      }
      $('#search').oninput = renderList;
      $('#play').onclick = () => setPlaying(!playing);
      $('#prev-frame').onclick = () => { frameIndex = (frameIndex - 1 + groups[groupIndex].frames.length) %
        groups[groupIndex].frames.length; setPlaying(false); showFrame(); };
      $('#next-frame').onclick = () => { frameIndex = (frameIndex + 1) % groups[groupIndex].frames.length;
        setPlaying(false); showFrame(); };
      $('#prev-sequence').onclick = () => selectGroup(groupIndex - 1);
      $('#next-sequence').onclick = () => selectGroup(groupIndex + 1);
      $('#scrub').oninput = event => { frameIndex = Number(event.target.value) - 1; setPlaying(false); showFrame(); };
      $('#fps').onchange = () => setPlaying(playing);
      $('#backdrop').onchange = event => { document.body.dataset.backdrop = event.target.value; };
      $('#guide').onchange = event => $('#compare').classList.toggle('guide', event.target.checked);
      document.onkeydown = event => {
        if (event.target.closest('input,select,button,a')) return;
        const command = {'ArrowLeft':'#prev-frame', 'ArrowRight':'#next-frame',
          'ArrowUp':'#prev-sequence', 'ArrowDown':'#next-sequence', 'Space':'#play'}[event.code];
        if (command) { event.preventDefault(); $(command).click(); }
      };
      selectGroup(groupIndex, frameIndex);
      setPlaying(playing);
    })();
  </script>
</body>
</html>
