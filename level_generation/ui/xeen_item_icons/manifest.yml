note: 'Icons the Xeen item rows wait for (source/items.yml icon_needed). New art in the MM6-MM8 inventory icon style (method
  as level_generation/ui/mm9_item_icons_20261104: one Codex image per design on flat magenta, keyed and fitted by scripts/finish.py).
  box_x2 is the fit box at the x2 icon scale: weapons take the MM9 icon pass''s family boxes (MM6-MM8 sizes; grips recomputed
  by scripts/install.py --grips), jewellery its engine row''s icon size, carried items a 1x1 or 1x2 inventory footprint.
  Owner: A2. Installed by scripts/install.py into assets_dev/worlds/xeen/icons_x2/<file>.png.'
