# Where the doll holds each Hesper weapon and emitter: the item's Equip X / Equip Y (items.txt columns 15-16), a point
# in the inventory icon's logical pixels (half its x2 size) that the engine puts on the doll's hand (main hand: the
# right hand's fingers; an emitter, as a shield: the left hand plus the doll's shield offset). The draft rows have
# 0,0, which hangs the icon's top-left corner from the hand. stage.py writes these into the staged item rows.
# Bows need none: the engine centres a bow on the doll's bow point.
#
# Melee grips: on the icon's own shaft at MM's median grip height for the weapon type (measured over every MM6-MM8
# weapon: sword 0.85 of the height, dagger 0.81, axe and mace 0.80, spear 0.48, staff 0.40); emitters at their
# centre, as MM's shields.
#
# Guns are held as MM6 and MM7 hold their blasters (the engine draws a held weapon as its inventory icon, and
# Hesper's guns lie horizontal, muzzle right, which points across the doll's body):
# - `up`, the long guns: stood muzzle-up with the grip and stock toward the body, as MM6's and MM7's Blaster Rifles
#   (a quarter turn counter-clockwise), held at mid-length on the barrel line as they are (MM6 0.50 and MM7 0.56 of
#   the gun from the muzzle; here 0.53, the barrel line read at the muzzle). Points below are on the horizontal icon.
# - `out`, the pistols: horizontal, muzzle pointing away from the body, held by the handle, as MM7's Blaster (the icon
#   mirrored). The stage installs the turned or mirrored icon (a turned gun also stands upright in the pack, as MM's
#   rifles do) and turns the grip with it.
