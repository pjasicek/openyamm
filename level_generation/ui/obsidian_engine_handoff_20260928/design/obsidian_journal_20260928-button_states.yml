# Approved design specification; not live UI schema.
schema: Design contract; disabled/state text styles are not UiLayoutManager asset keys
state_priority:
- disabled
- pressed
- hover
- selected
- normal
labels:
  normal: '#e8d1a4'
  hover: '#fff0c0'
  pressed: '#d7bc86'
  selected: '#ffe3a8'
  disabled: '#888b7b'
label_pressed_shift_y: 0.5333333333333333
transition_ms: 110
pressed_transition_ms: 0
preserve_selection_while_hovering: true
families:
  main:
    normal: obsidian_journal_main_normal
    hover: obsidian_journal_main_hover
    pressed: obsidian_journal_main_pressed
    selected: obsidian_journal_main_selected
    disabled: obsidian_journal_main_disabled
  category:
    normal: obsidian_journal_category_normal
    hover: obsidian_journal_category_hover
    pressed: obsidian_journal_category_pressed
    selected: obsidian_journal_category_selected
    disabled: obsidian_journal_category_disabled
  page:
    normal: obsidian_journal_page_normal
    hover: obsidian_journal_page_hover
    pressed: obsidian_journal_page_pressed
    selected: obsidian_journal_page_selected
    disabled: obsidian_journal_page_disabled
  close:
    normal: obsidian_journal_close_normal
    hover: obsidian_journal_close_hover
    pressed: obsidian_journal_close_pressed
    selected: obsidian_journal_close_selected
    disabled: obsidian_journal_close_disabled
renderer: Use parent input/selection state for its plate, noninteractive label and icon children
disabled: No activation or page/zoom overflow; select explicit disabled PNG in renderer
text_shadow_recipe: masters/review_source/button-theme.css
