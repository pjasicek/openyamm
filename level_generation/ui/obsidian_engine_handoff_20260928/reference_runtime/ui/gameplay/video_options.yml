screen: VideoOptions

elements:
  - id: VideoOptionsRoot
    anchor: center
    width: 640
    height: 480
    z_index: 440
    visible: true
    scale:
      min: 1.0
      max: 8.0
    children:
      - id: VideoOptionsBackground
        anchor: top_left
        offset_x: 0
        offset_y: 0
        width: 640
        height: 480
        z_index: 0
        asset:
          default: optvid

      - id: VideoOptionsCinematicTitle
        anchor: top_left
        offset_x: 70
        offset_y: 153
        width: 227
        height: 28
        z_index: 25
        text:
          value: "COLOR GRADING"
          font: Create
          color: "#ffff9b"
          align_x: center
          align_y: middle

      - id: VideoOptionsCinematicButton
        anchor: top_left
        offset_x: 66
        offset_y: 198
        width: 235
        height: 36
        z_index: 25
        interactive: true
        text:
          value: "Cinematic grading: Off"
          font: Arrus
          color: "#ffff9b"
          align_x: center
          align_y: middle

      - id: VideoOptionsCinematicStrengthLabel
        anchor: top_left
        offset_x: 66
        offset_y: 252
        width: 235
        height: 28
        z_index: 25
        text:
          value: "Strength"
          font: Arrus
          color: "#ffff9b"
          align_x: center
          align_y: middle

      - id: VideoOptionsCinematicStrengthTrack
        anchor: top_left
        offset_x: 66
        offset_y: 286
        width: 235
        height: 22
        z_index: 25
        interactive: true

      - id: VideoOptionsPreviewTitle
        anchor: top_left
        offset_x: 351
        offset_y: 153
        width: 227
        height: 28
        z_index: 20
        asset:
          default: bl_prevu

      - id: VideoOptionsBloodSplatsButton
        anchor: top_left
        offset_x: 66
        offset_y: 354
        width: 235
        height: 24
        z_index: 20
        interactive: true
        asset:
          default: bl_blspU
          pressed: bl_blspD

      - id: VideoOptionsColoredLightsButton
        anchor: top_left
        offset_x: 66
        offset_y: 383
        width: 235
        height: 24
        z_index: 20
        interactive: true
        asset:
          default: bl_coltU
          pressed: bl_coltD

      - id: VideoOptionsTintingButton
        anchor: top_left
        offset_x: 66
        offset_y: 412
        width: 235
        height: 24
        z_index: 20
        interactive: true
        asset:
          default: bl_tintU
          pressed: bl_tintD

      - id: VideoOptionsReturnButton
        anchor: top_left
        offset_x: 350
        offset_y: 381
        width: 227
        height: 50
        z_index: 20
        interactive: true
        asset:
          default: bv_rtrnU
          highlighted: bv_rtrnH
          pressed: bv_rtrnD
