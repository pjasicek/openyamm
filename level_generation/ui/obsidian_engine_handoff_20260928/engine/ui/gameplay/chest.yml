# STAGED CANDIDATE; requires the renderer/input work in INTEGRATION.md.
screen: Chest
elements:
- id: ChestRoot
  anchor: center
  offset_y: 0
  width: 640
  height: 480
  scale:
    min: 1.0
    max: 8.0
  notes: Shared root for the chest overlay shell.
  children:
  - id: ChestBackground
    anchor: top_left
    offset_x: 8
    offset_y: 28
    width: 460
    height: 344
    z_index: -50
    asset:
      default: chest01
    notes: Chest background art. Runtime should override the asset from the active chest type.
    children:
    - id: ChestGridArea
      anchor: top_left
      offset_x: 0
      offset_y: 0
      width: 288
      height: 288
      z_index: 20
      interactive: true
      notes: Chest item grid hook. Runtime should position it from the chest UI offset table.
  - id: ChestNestedInventoryPage
    anchor: top_left
    offset_x: 0
    offset_y: 24
    width: 468
    height: 346
    z_index: 180
    asset:
      default: obsidian_inventory_surface
    notes: Nested inventory frame used for chest transfer and later service-house inventory interactions.
    children:
    - id: ChestNestedInventoryGrid
      anchor: top_left
      offset_x: 7
      offset_y: 8
      width: 448
      height: 288
      z_index: 190
      interactive: true
      notes: 14 x 9 nested inventory grid.
  - id: ChestTopBar
    anchor: top_center
    width: 640
    height: 29
    z_index: 50
    asset:
      default: obsidian_topbar
    notes: Duplicated from the gameplay HUD so pages can layer independently above it.
    children:
    - id: ChestGoldFoodIcon
      anchor: top_left
      offset_x: 0
      width: 180
      height: 29
      notes: Gold and food background art.
      offset_y: 0
      children:
      - id: ChestGoldArt
        anchor: top_left
        offset_x: 18
        offset_y: 7
        width: 22
        height: 14
        asset:
          default: scorebg_gold
      - id: ChestFoodArt
        anchor: top_left
        offset_x: 107
        offset_y: 7
        width: 22
        height: 14
        asset:
          default: scorebg_food
    - id: ChestGoldLabel
      anchor: top_left
      offset_x: 44
      width: 59
      height: 29
      text:
        value: '{gold}'
        font: Lucida
        align_x: center
        align_y: middle
        color: '#e5dcc7'
        scale: 0.6588235294117647
      notes: Gold counter.
      offset_y: 0
    - id: ChestFoodLabel
      anchor: top_left
      offset_x: 132
      width: 40
      height: 29
      text:
        value: '{food}'
        font: Lucida
        align_x: center
        align_y: middle
        color: '#e5dcc7'
        scale: 0.6588235294117647
      notes: Food counter.
      offset_y: 0
  - id: ChestLeftBar
    anchor: top_left
    width: 8
    height: 347
    bottom_to: OutdoorBasebar
    z_index: -5
    asset:
      default: obsidian_left_edge
    notes: Left vertical dialogue chrome.
  - id: ChestRightFrame
    anchor: top_right
    width: 172
    height: 368
    bottom_to: OutdoorBasebar
    z_index: 200
    asset:
      default: obsidian_house_sidebar
    notes: Right-side frame reusing dialogue chrome.
    children:
    - id: ChestIconBackground
      anchor: top
      offset_y: 18
      width: 71
      height: 81
      z_index: 260
      notes: Icon now sits directly on the carved sidebar, without the legacy plaque.
    - id: ChestIcon
      anchor: top
      offset_y: 22
      width: 63
      height: 73
      z_index: 270
      asset:
        default: ticonCH
  - id: ChestCloseButton
    anchor: bottom_right
    offset_x: -42
    offset_y: -42
    width: 83
    height: 30
    z_index: 300
    interactive: true
    asset:
      default: obsidian_button_close_normal
      highlighted: obsidian_button_close_hover
      pressed: obsidian_button_close_pressed
    notes: Shared blank plate at the native hit rectangle; preserve end caps, render localized label.
    text:
      value: Close
      font: Fondamento
      align_x: center
      align_y: middle
      color: '#e8d1a4'
      scale: 0.41666665625
