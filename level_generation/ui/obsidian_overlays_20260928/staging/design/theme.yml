# DESIGN CONTRACT, not a UiLayoutManager input. Hex colours are sRGB RGBA, not packed ABGR integers.
design: obsidian-overlays-r03
approval: user-approved-2026-09-28
space:
  fullscreen_logical: [640, 480]
  review_workspace: [200, 0, 1200, 900]
  review_pixels_per_logical: 1.875
  fixed_plate_pixels_per_logical: 2
  raster_rule: Enclose fractional browser clip, crop excess pixels only; never resize an inventory grid.
palette:
  ordinary: '#e5dcc7'
  muted: '#bdb6a2'
  heading_and_class: '#e4c793'
  above_base_and_available_points: '#85df8b'
  below_base_or_harmful_condition: '#ee8275'
  low_resource: '#e6c36c'
  upgradeable_skill: '#8ebcfa'
  upgradeable_skill_hover: '#c5e0ff'
  awards_priority: ['#f86ca0', '#70dcf8', '#c0c0f0', '#40f460', '#e8f460', '#f0fcc0']
semantics:
  comparison: Colour current half only; above base jade, below coral, equal ivory. Base and slash stay ivory.
  resource: At or below zero coral; positive below half maximum amber; otherwise ivory.
  skills: Blue only if the entire row can be upgraded with available points; ordinary text otherwise.
  condition: Keep existing good/harmful classification; ordinary good condition stays ivory.
  points: Available points jade; zero ordinary ivory.
fonts:
  buttons: {face: Fondamento, logical_height: 13.333333, synthesize_bold_or_italic: false}
  character_header: {face: Create, logical_height: 18}
  stats: {face: Lucida, logical_height: 18, native_height: 17, scale: 1.0588235294}
  skills: {face: Lucida, logical_height: 17, row_pitch: 14}
  group_headings_awards_quickref: {face: Arrus, logical_height: 19}
  item_title: {face: Arrus, logical_height: 19}
  item_type_details_value: {face: Comic, logical_height: 19}
  descriptions: {face: SMALLNUM, logical_height: 14}
  inspector_title_and_monster_subheading: {face: Create, logical_height: 18}
  rest_time_date: {face: Create, logical_height: 19}
  character_detail_body: {face: Create, note: Preserve this existing exception; do not force Smallnum everywhere.}
button_states:
  normal: {text: '#e8d1a4', plate_suffix: normal}
  hover: {text: '#fff0c0', plate_suffix: hover, transition_ms: 110}
  pressed: {text: '#d7bc86', plate_suffix: pressed, label_shift_y: 0.533333, transition_ms: 0}
  selected: {text: '#ffe3a8', plate_suffix: selected}
  disabled: {text: '#888b7b', plate_suffix: disabled}
  focus: {outline: '#f0d5a1', logical_width: 0.533333, logical_offset: 1.6}
  label_shadow: 'Normal: top highlight #fff0cf32, lower brown #36280e, black shadow. See frozen CSS reference.'
  topics: Fondamento text and open row underline; no full plate.
  localization: Labels remain live/localized; do not bake text into plates.
  scaling: Plates are exported for their recorded rectangles. For other sizes use the CSS recipe or add explicit slicing; do not stretch rivets.
selection:
  fullscreen_portrait_and_bars_shift_logical: [1.6, 2.666667]
  note: The approved +3 right/+5 down is in the 1.875× browser reference, not +3/+5 logical units.
  empty_banner_review_size: [98, 136]
  empty_banner_treatment: 'saturate(.7) brightness(.86), opacity .88; dark shadow (1,3,3) review px.'
buffs:
  master_px: [128, 128]
  hud_box_logical: [19.2, 19.2]
  timer: Separate text; never baked into the illustration.
  ordering: Soonest expiry first, stable tie order; permanent effects after timed effects.
  default: Four visible plus a counted overflow button; clicking opens the remaining buffs.
  alternative: Two rows is an approved review option; default remains compact.
  individual: Use obsidian_personal_buffs medallion on affected portrait; retained existing effect data.
