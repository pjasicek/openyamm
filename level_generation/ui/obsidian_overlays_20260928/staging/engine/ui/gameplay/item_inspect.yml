    anchor: left
    offset_x: 28
    offset_y: 0
    width: 100
    height: 144
    notes: 'Left-centered item preview image region. The runtime should fit the hovered item''s icon within this area
      while keeping aspect ratio.

      '
  - id: ItemInspectName
