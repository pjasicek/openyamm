      align_y: middle
    notes: Combined type line.
  - id: ItemInspectDetailRow
    anchor: top_left
    offset_x: 115
    offset_y: 62
    width: 238
    height: 18
    notes: 'Optional single dynamic detail line under Type, for example "Armor: +34". Runtime can hide this whole
      row when not applicable.

      '
    children:
