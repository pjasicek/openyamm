  - id: DialogueResponseHint
    anchor: bottom_left
    offset_x: 24
    offset_y: -22
    width: 300
    height: 20
    text:
      value: '{hint}'
      font: Lucida
      align_x: left
      align_y: middle
      color: '#e5dcc7'
    notes: Optional footer hint or status text.
