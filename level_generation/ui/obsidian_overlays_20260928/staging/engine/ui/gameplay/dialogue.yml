# APPROVED VISUAL DESIGN / RUNTIME DRAFT. Not mounted. See staging/INTEGRATION.md.
# Keep existing IDs, actions and dynamic content. New bindings are explicitly noted.
screen: Dialogue
elements:
- id: DialogueRoot
  anchor: center
  width: 640
  height: 480
  scale:
    min: 1.0
    max: 8.0
  notes: Shared dialogue root for common scaling and grouping.
  children:
  - id: DialogueTopBar
    anchor: top_center
    width: 640
    height: 29
    z_index: 50
    asset:
      default: obsidian_topbar
    notes: Duplicated from the gameplay HUD so character pages can layer independently above it.
    children:
    - id: DialogueGoldFoodIcon
      anchor: center_in
      offset_x: -165
      width: 134
      height: 21
      asset:
        default: scoreBG
      notes: Gold and food background art.
    - id: DialogueGoldLabel
      anchor: center_in
      offset_x: -85
      width: 28
      height: 14
      text:
        value: '{gold}'
        font: SMALLNUM
        align_x: center
        align_y: middle
        color: '#e5dcc7'
      notes: Gold counter.
    - id: DialogueFoodLabel
      anchor: center_in
      offset_x: -180
      width: 28
      height: 14
      text:
        value: '{food}'
        font: SMALLNUM
        align_x: center
        align_y: middle
        color: '#e5dcc7'
      notes: Food counter.
  - id: DialogueFrame
    anchor: bottom_left
    offset_x: 3
    offset_y: 0
    width: 470
    height: 0
    z_index: -20
    asset:
      default: obsidian_reading_surface
    notes: Body-only sheet. Runtime measures text/height, samples the surface, draws top/side frame slices; open bottom
      meets party bar.
    children:
    - id: DialogueFrameEndCap
      anchor: above
      width: 470
      height: 8
      asset:
        default: endcap
      notes: Main dialogue frame end-cap art.
      visible: false
    - id: DialogueText
      anchor: top_left
      offset_x: 12
      offset_y: 0
      width: 450
      height: 112
      text:
        value: '{text}'
        font: Arrus
        align_x: left
        align_y: top
        color: '#e5dcc7'
      notes: Body only; preserve native formatting. Arrus 19→18, then Create 18→17, scroll only if still too long.
        No topic heading or Continue.
  - id: DialogueLeftBar
    anchor: top_left
    width: 8
    height: 347
    bottom_to: OutdoorBasebar
    z_index: -5
    asset:
      default: obsidian_left_edge
    notes: Left vertical dialogue chrome.
  - id: DialogueVideoArea
    anchor: top-left
    offset_x: 8
    offset_y: 28
    width: 460
    height: 344
    bottom_to: OutdoorBasebar
    z_index: -50
    asset:
      default: evt
    notes: Video playback area
  - id: DialogueShopOverlayFrame
    anchor: top_left
    offset_x: 8
    offset_y: 28
    width: 460
    height: 344
    bottom_to: OutdoorBasebar
    z_index: 20
    asset:
      default: evt
    notes: Minimal reusable shop buy overlay drawn over the house video area.
  - id: DialogueEventDialog
    anchor: top_right
    width: 172
    height: 368
    bottom_to: OutdoorBasebar
    z_index: 200
    asset:
      default: obsidian_house_sidebar
    notes: Right-side event dialog panel for house/NPC talk state.
    children:
    - id: DialogueHouseTitle
      anchor: top_center
      offset_x: 0
      offset_y: 10
      width: 150
      height: 24
      text:
        value: '{house_name}'
        font: Create
        color: '#e5dcc7'
        align_x: center
        align_y: middle
      notes: House title label.
    - id: DialogueNpcPortrait
      anchor: top_center
      offset_x: 0
      offset_y: 20
      width: 71
      height: 81
      notes: Left-side portrait area for simple dialogue presentation.
      children:
      - id: DialogueNpcName
        anchor: below
        offset_x: -14
        offset_y: -4
        width: 100
        height: 24
        text:
          value: '{name}'
          font: Create
          color: '#e4c793'
          align_x: center
          align_y: middle
        notes: NPC name label.
    - id: DialogueTopicRow_1
      anchor: top_center
      offset_y: 80
      width: 140
      height: 36
      interactive: true
      text:
        value: '{topic1}'
        font: Fondamento
        align_x: center
        align_y: middle
        color: '#e8d1a4'
        scale: 0.4166666666666667
      notes: Fondamento open topic row; no plate. Keep live choices and action conditions.
