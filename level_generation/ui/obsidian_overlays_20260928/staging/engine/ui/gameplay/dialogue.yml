  - id: DialogueGoodbyeButton
    anchor: bottom_right
    offset_x: -37
    offset_y: -27
    width: 83
    height: 30
    z_index: 300
    interactive: true
    asset:
      default: obsidian_button_close_normal
      highlighted: obsidian_button_close_hover
      pressed: obsidian_button_close_pressed
      selected: obsidian_button_close_selected
    notes: 'Draft: retain the existing action/hit target. Draw a live localized Fondamento label. Font registration,
      state text colours and disabled plate selection require renderer wiring; see design/theme.yml and INTEGRATION.md.'
    text:
      value: Close
      font: Fondamento
      color: '#e8d1a4'
      align_x: center
      align_y: middle
      scale: 0.416667
  - id: DialogueOkButton
    anchor: bottom_right
