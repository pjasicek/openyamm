# The promotion quests of Enroth, Antagarich and Jadame for the MAW guide (tools/maw_site/classes.py).
#
# One entry per quest that promotes. classes.py works out which MAW class lines each quest counts for from MAW's own
# table (rulesets/maw/data/promotions.yml: the quest bits that count as a kind's promotion on each world, and the
# first-tier bits of MAW's four new lines), so this file only says what each quest is:
#   continent   Enroth, Antagarich or Jadame
#   npc         the NPC who promotes (npc.txt id); classes.py finds the house and map from the tables and scripts
#   map         the map, when the NPC has no house door (met through a map script) or the tables place it wrongly
#   promotes    what the quest itself does to a member of these classes (class names as class_extra.txt's notes):
#               from -> to. Members of other classes get the "Honorary" bit, which also counts for MAW.
#   bits        the quest bits the promotion sets (promoted, honorary)
#   award       MM8's award for the promotion (MAW counts it like the bit)
#   quest       the journal quest bit whose text is the task (english/quests.txt)
#   task        the task in words, when the journal's text is missing or misleading
#   path        MM7's Light or Dark path the quest needs
#
# Sources: Enroth, worlds/mm6/events/Global_mm6_mmmerge.lua promotionFamilies; Antagarich,
# worlds/mm7/events/Global_mm7_mmmerge.lua (MM7.CompletePromotion calls); Jadame,
# worlds/mm8/events/Global_mm8_promotions.lua. Chedian's promotions come from the MM9 guide's data.

