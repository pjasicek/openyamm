# Walled towns and castles of the Xeen world: the enclosures tools/xeen/wall_check.py tests (F19, 2026-11-22).
# Per map stem, a list of enclosures:
#   name     what it is
#   inside   [x, y] cells: points inside it (each must not reach the box's edge but through a seal)
#   seals    [[x, y], [x, y]] cells: the ways in (gate passages, a bridge into town, a door), closed for the test
#   box      [x0, y0, x1, y1] cells: the ground looked at; its edge counts as outside
#   circuit  thing ids (glob) of the walls that close it: their ends must not stand on walkable land
#   joints_ok thing ids (glob) of pieces meant to stand proud of the wall they meet (a bastion): no walls.step for them
# Keep the seals to real ways in; a wall that needs a seal to pass is open.
# A circuit that ends in water ends in a water end piece (thing:water_end*, tools/xeen/kit_pieces.py, D-94), checked
# for every map by walls.water_end.
xeen_x1:
  - name: Vertigo
    inside: [[53.5, 46.6], [44.0, 40.0], [60.5, 47.5]]
    seals:
      - [[51.6, 38.0], [53.4, 38.0]]      # north gate (P2 F28: the gates on their roads' middles, x.5)
      - [[62.5, 45.6], [62.5, 47.4]]      # east gate
      - [[41.5, 43.6], [41.5, 45.4]]      # west gate
      - [[51.7, 52.0], [53.3, 52.0]]      # the bridge from the south gate over the creek
    box: [37, 33, 68, 57]
    circuit: ['thing:wall_run_*', 'thing:gate_arch_*']   # the creek ends: water end piers (D-94, walls.water_end)
    # P2 F26: the terrace's retaining wall ends flank the town hall's steps; the hall's clock tower stands proud
    # into the gap between them by design (its door over the steps), the rest of each end face is the steps' side
    joints_ok: ['thing:terrace_wall_2', 'thing:terrace_wall_3']
