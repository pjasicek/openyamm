  hhm2er: {storey_stack: module}
  hhm3b: {storey_stack: module}
  hhm3bw2: {storey_stack: module}
  hhm3el2: {storey_stack: module}
  hhm3er2a: {storey_stack: module}
  gbwin: {storey_stack: module}
  strwin1: {storey_stack: module}
  deswin1: {storey_stack: module}
  whwin: {storey_stack: module}
  pgwino: {storey_stack: module}
