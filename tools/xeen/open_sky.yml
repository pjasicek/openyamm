# The Xeen BLVs' places deliberately open to the sky (D-97; tools/xeen/check_open_sky.py reads it).
# map key -> room id (L4/ids.lock.yml; `sector:<n>` for a sector no room names) -> {kind, why}.
# Kinds: courtyard, battlements, wall_walk, terrace, shaft, pit, bridge, open_ground, garden, ruin, deck, crater,
# arena, ravine (a slot between rock walls), canopy (walls of foliage), skylight (a hole in a roof: smoke hole, crack, open hatch, oculus; the sky over at
# most 35 % of the floor). Every other sky sector is an error: an enclosed room or corridor has a ceiling.
# A room open overhead must also read open: a low opening (a parapet over a courtyard, a wall drawn as sky over a
# parapet) or a floor wider than its walls are high; else check_open_sky.py calls it a roofless enclosure.
# `why` quotes or sums up the map's brief (devdocs/xeen/briefs/<map>/L4/rooms.yml notes, plan.yml).

