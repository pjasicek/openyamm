  - expect: {class: [2, Sorcerer]}
  - expect: {class: [3, Hunter]}
  - talk: [4044, Children]
  - expect: {qbit: m4.children_home, xp: 12800}
  - hidden: [4044, Promotion]
  - class: [2, Knight]
  - talk: [4044, Promotion]
  - expect: {class: [2, Cavalier], xp: 12800}
  # Q-C20, Q-C21, Q-C22, Oslo's son
  - talk: [4047, q-c20]
  - hook: m4.tower_door
  - give: bone_whistle   # D-167: a ground item in the creek's shallows (q-c20.whistle is a map_gives record)
