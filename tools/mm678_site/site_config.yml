# Hand-kept presentation data for the MM6, MM7 and MM8 guides (tools/mm678_site/build_site.py). Everything else comes
# from the merged engine tables (assets_dev/engine/data_tables) and the world packages (assets_dev/worlds/mm6-mm8).
#
# Per book:
#   site        the page texts (GUIDE.site; the shared front end's defaults are the MM9 guide's)
#   regions     one per outdoor map, the start first (the Maps list follows this order), placed on the schematic
#               world map (grid cells, x to the east, y to the south; the cells follow outdoor_travels.txt's edges);
#               dungeons join the region whose map leads into them, `region_of` places the rest by hand
#   chapters    the main story: quest bits (english/quests.txt) per chapter; every other quest of the continent is a
#               side quest, or a promotion when tools/maw_site/promotions.yml names it
#   stages_of   journal lines shown as stages of another quest (MM6's stable price notes)
#   skip_quests journal lines that are not quests

books:
  mm6:
    site:
      title: MM6 Enroth Guide
      storeKey: "mm6guide."
      homeTitle: Enroth
      homeLead: "Might and Magic VI as OpenYAMM plays it under the Standard ruleset: every map of Enroth with its
        teachers, shops, guilds, quest givers, chests, wells, fountains, shrines and exits; {npcs} people placed. Data
        comes straight from the game's tables and map scripts."
      worldName: Enroth
      travelFrom: oute3
      travelTo: outc2
      tocSections: []
      hideShopColumns: [tiers, enchanted, restock]
      leads:
        maps: "Journal maps of the outdoor maps and floor plans drawn from the geometry of every dungeon, castle and
          temple, with every point of interest from the maps' scripts. Pick a map; toggle marker types in its legend."
        travel: "How the maps of Enroth connect: walking borders with their travel days, coaches and boats by weekday,
          and the ways into dungeons. The world map is a schematic; each tile is the map's own journal map."
        teachers: "Every Expert, Master and Grandmaster lesson in Enroth. A lesson needs the skill at 4 (Expert), 7
          (Master) or 10 (Grandmaster), the previous mastery and the class's cap; prices are before the Merchant
          skill. \"Learn\" is the first lesson, sold by guilds, shops, temples, taverns and training halls."
        promotions: "Enroth's six lords promote: each sets two quests, the second after the first. A member of the
          right class is promoted; the others become honorary members of the class."
        shops: "Weapon, armour, magic and alchemy shops stock by their house's quality: a standard shelf and a special
          one, each at a treasure level (1-6) that decides the items' power and enchantments. Guilds sell the
          spellbooks of their school up to the guild's rank. Prices are the item's value times the house's
          multiplier, before the Merchant skill."
        bestiary: "Monsters placed on the maps of Enroth by family, weakest to strongest; A, B and C are a family's
          three tiers. Outdoor maps and dungeons place groups at spawn points (a group of any tier when no tier is
          given). Click a row for its attacks, spells, resistances, loot and where it lives."
      itemNotes:
        artifacts: "Artifacts and relics of the three continents: one table holds MM6, MM7 and MM8's items, and every
          continent's treasure may hold any of them."
    regions:
      - {id: oute3, name: New Sorpigal, hub: oute3, pos: [4.4, 2.2]}
      - {id: outa1, name: Sweet Water, hub: outa1, pos: [0.0, 0.0]}
      - {id: outb1, name: Kriegspire, hub: outb1, pos: [1.1, 0.0]}
      - {id: outc1, name: Frozen Highlands, hub: outc1, pos: [2.2, 0.0]}
      - {id: outd1, name: Silver Cove, hub: outd1, pos: [3.3, 0.0]}
      - {id: oute1, name: Eel Infested Waters, hub: oute1, pos: [4.4, 0.0]}
      - {id: outa2, name: Paradise Valley, hub: outa2, pos: [0.0, 1.1]}
      - {id: outb2, name: Blackshire, hub: outb2, pos: [1.1, 1.1]}
      - {id: outc2, name: Free Haven, hub: outc2, pos: [2.2, 1.1]}
      - {id: outd2, name: Bootleg Bay, hub: outd2, pos: [3.3, 1.1]}
      - {id: oute2, name: Misty Islands, hub: oute2, pos: [4.4, 1.1]}
      - {id: outa3, name: Hermit's Isle, hub: outa3, pos: [0.0, 2.2]}
      - {id: outb3, name: Dragonsand, hub: outb3, pos: [1.1, 2.2]}
      - {id: outc3, name: Mire of the Damned, hub: outc3, pos: [2.2, 2.2]}
      - {id: outd3, name: Castle Ironfist, hub: outd3, pos: [3.3, 2.2]}
    region_of:
      sci-fi: outc2  # the Control Center, reached through the Oracle beneath Free Haven
    other_pos: [5.5, 1.1]
    chapters:
      - {id: 1, name: "I: Sulman's Letter", quests: [1105, 1106]}
      - {id: 2, name: "II: The High Council", quests: [1110, 1122, 1134, 1137, 1140, 1144, 1224, 1225]}
      - {id: 3, name: "III: The Oracle", quests: [1186, 1187, 1188, 1189, 1190]}
      - {id: 4, name: "IV: The Hive", quests: [1120, 1259]}
    stages_of:
      1140: [1515, 1516, 1517, 1518, 1519, 1520, 1521, 1522, 1523]
    skip_quests: []
    # Who or what starts a quest that no placed person gives, and the conditions of routes and lessons, in words.
    giver_text:
      1105: "Sulman's letter, in the party's pack from the start"
      1119: "Prince Nicolai's disappearance, after the party entertains him"
    gate_text:
      1192: after the traitor on the High Council is exposed
      1202: once the party has been to Free Haven
      1203: once the party has been to Silver Cove

