  - quest: find-gungnir
    from: {map: arslegardcity, npc: "Hanndl"}
    to: {map: arslegardcity, npc: "Hanndl"}
    summary: "Hanndl the gatekeeper lost his spear Gungnir; it lies in the Inventa Storca, the old storehouse in Thronheim."
    requires: "Access to Arslegard City (the Writ of Fate)."
    steps:
      - "Talk to Hanndl by Arslegard's gate: 'You don't seem to like us very much', 'That's unfortunate. You must have really upset Krohn', 'What's Gungnir?', 'Maybe we could help?' and 'We could find it for you'."
      - "Optional: in the Hall of the Gods, ask Fre 'What happened to Hanndl's spear?'. Ursanian soldiers took it to their storehouse in western Chedian."
      - "Leave Arslegard by the Thjorgard exit just north of where the dead wake, and go to Thronheim. Enter the Inventa Storca. The spear is on the lower level: open the trapdoor (the Ladder Door, Perception shows it) in the small room in the south-east of the upper floor and climb down the ladder."
      - "In the room of tall bookcases, don't pull the Falling Bookcase Switch book: the bookcases topple one after another. Pull Secret Switch 1, a book on the south face of the fourth bookcase from the south (Perception shows it): Secret Panel 1 opens over two chests."
      - "Gungnir is in the black chest (trapped: a Thief with Disarm Traps 14 or better disarms it)."
      - "No road or boat leads back to Arslegard: return by your Lloyd's Beacon, or let the party be defeated (it wakes at Arslegard's Great Gate without its gold). Click Hanndl while you carry the spear and say 'We found your spear'."
    tips:
      - "Gungnir is a very strong spear. If your party lacks good weapons, you can keep it and return it later."
      - "A Lich and two Skeletons drop from the ceiling near one of the Orbs of Linking, and Liches haunt the deeper rooms."
    reward: "40,000 gold and 5,000 experience."
    points:
      - {map: thronheim, name: "To Inventa Storca"}
      - {map: inventastorca, name: "Chest L6"}
      - {map: inventastorca, name: "Secret Switch 1"}
      - {map: inventastorca, name: "Falling Bookcase Switch"}
      - {map: inventastorca, name: "Ladder Door"}
      - {map: hallofthegods, name: "Fre"}
    maps:
      - {map: inventastorca, focus: "Chest L6", caption: "The trapdoor and ladder (south-east) and Gungnir's chest behind Secret Panel 1."}
