  - quest: get-the-orbs-of-linking
    from: {map: thronheimcity, npc: "Brynhildr the Money-wise"}
    summary: "Fetch Orbs of Linking from the Inventa Storca and install one in each of Chedian's six town banks."
    steps:
      - "In the bank of Thronheim City, ask Brynhildr 'What can we help you with?', 'So what's the problem?', 'Sounds easy. Where are these Orbs of Linking?' and 'We will find these orbs for you.'."
      - "The Inventa Storca opens off the eastern edge of the Thronheim map, north-east of the city. Seven Orbs of Linking lie in it; you need six. On the upper floor: one at the north end of the pillared hall in the north, one in the great hall in the far west, one beside the spiral stair in the middle (from the map room to its west, break the cracked wall), and one in the room in the south, where a Lich and two Skeletons drop through the ceiling when you reach the orb's table."
      - "The other three are on the lower floor. Open the trapdoor in the small room in the south-east of the upper floor and climb down the ladder. One orb is in the south-east room with the book switches, one in the east room, and one in the cave under the entrance, behind a cracked wall at the north end of the north room (break it)."
      - "Talk to each banker with an orb in your packs and pick the Orb of Linking topic: Brynhildr (Thronheim), Ragnar Gjalpssen (Thjorgard), Herdis the Stout (Sturmford), Hlif Ingimundssen (Drangheim), Ottar Gizurssen (Guberland) and Fiachna A'Lanth (Frosgard). The orb goes in when the talk ends."
      - "The sixth installed orb pays the reward, wherever you install it."
    tips:
      - "A banker only offers the topic if you click them with an orb already in your packs."
      - "Frosgard's harbour is frozen until the docks are freed in Chapter I. Walk there from Thronheim (5 days)."
    reward: "12,500 experience and 15,000 gold for the sixth orb."
    points:
      - {map: thronheim, name: "To Inventa Storca"}
      - {map: thjorgardcity, name: "Ragnar Gjalpssen"}
      - {map: sturmfordcity, name: "Herdis the Stout"}
      - {map: drangheimcity, name: "Hlif Ingimundssen"}
      - {map: guberlandcity, name: "Ottar Gizurssen"}
      - {map: frosgardcity, name: "Fiachna A'Lanth"}
    maps:
      - {map: inventastorca, focus: "To Thronheim", caption: "Entrance stair in the north-east; the trapdoor and ladder to the lower floor in the south-east."}
      - {map: thronheim, focus: "Inventa", caption: "The Inventa Storca opens off the east edge of the Thronheim map."}
