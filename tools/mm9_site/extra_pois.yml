# Points the generator cannot find on its own: quest props and puzzle pieces named by their MM9 DAT objects
# (assets_editor_dev/worlds/mm9/maps/<map>.raw_objects.yml). A point sits at the mean position of its objects; a
# rename relabels generated points whose name matches the regular expression. Found while writing story/*.yml.

points:
  # Lindisfarne Monastery: Thjorad and the bell puzzle (ring the bells 1, 5, 2, 4, 3).
  - {map: lindisfarnemonastery, type: objective, label: Thjorad, objects: [thjorad], quests: [retrieve-thjorad-from-lindisfarne]}
  - {map: lindisfarnemonastery, type: lever, label: Bell ropes, objects: [Rope1, Rope2, Rope3, Rope4, Rope5],
     detail: "pull in the order 1, 5, 2, 4, 3", quests: [retrieve-thjorad-from-lindisfarne]}
