# Content packs of the release packages (packaging/UPDATER_PLAN.md, part B; tools/runtime_packs.py).
#
# Every top-level folder (domain) of a package is either in the package's core pack or listed under domains, or
# packaging fails. Bucket counts are committed: changing one reshuffles that domain's files once, so raise a count only
# when `tools/package_runtime_assets.py --report` shows a pack over max_mib, or well over target_mib.
#
# Group rules keep files that change together in one bucket:
#   stem       the file name up to its first dot (oute3.odm, oute3.scene.yml, oute3.bake.json)
#   first_dir  the first sub-folder (one sprite family)
#   model      a GLB together with the cooked textures it references
# A split routes files by extension into their own bucket set, so large, rarely changed files do not ride along with
# small, often changed ones.
schema: 1
target_mib: 64
max_mib: 128
core_max_mib: 24
# The worlds a release ships.
worlds: [mm6, mm7, mm8, mm9]
packages:
  engine:
    # Small and changed in almost every release.
    core: [behaviors, branding, data_tables, events, fonts, hud_x2, liquids, licenses, music, scripts, ui]
    domains:
      effects:           {buckets: 1}
      rendering:         {buckets: 1}
      _legacy:           {buckets: 1}
      audio:             {buckets: 2}
      terrain_materials: {buckets: 4, group: first_dir}
      icons_x2:          {buckets: 10}
      models:            {buckets: 8, group: model}
      sprites:           {buckets: 3}
      sprites_new:       {buckets: 1, group: first_dir}
      world_items:       {buckets: 3, group: model}
      # The optional rulesets (engine/rulesets/<id>, devdocs/maw/HANDOFF.md): small text and YAML, one pack. They
      # live in the engine package because releases up to 1.10 accept only /engine and /worlds/<id> mounts.
      rulesets:          {buckets: 1}
      # The text of every language pack (languages/<id>/language.yml and text/): small, always installed.
      languages:         {buckets: 1}
  # Every world; a world entry below replaces single domains or the core list.
  world:
    core: [audio, behaviors, effects, events, terrain_decorations, terrain_materials, textures]
    domains:
      maps:
        buckets: 2
        split:
          lighting: {extensions: [.lighting], buckets: 4}
      icons_x2:          {buckets: 1}
      models:            {buckets: 10, group: model}
      music:             {buckets: 2}
      videos:            {buckets: 2}
      sprites:           {buckets: 1}
      textures_x4:       {buckets: {desktop: 14, android: 1}}
      textures_x2:       {buckets: {desktop: 1, android: 6}}
      surface_materials_x4: {buckets: {desktop: 20, android: 1}}
  mm7:
    domains:
      textures_x4:       {buckets: {desktop: 9, android: 1}}
      textures_x2:       {buckets: {desktop: 1, android: 3}}
      surface_materials_x4: {buckets: {desktop: 14, android: 1}}
  mm8:
    domains:
      textures_x4:       {buckets: {desktop: 9, android: 1}}
      textures_x2:       {buckets: {desktop: 1, android: 3}}
      surface_materials_x4: {buckets: {desktop: 14, android: 1}}
  # MM9 (Chedian, from 2.0): its own core list (its audio is too large for a core pack) and the folders the other
  # worlds lack (data_tables, dialogue, journal, state, ui, world_items, import). Its creature GLBs travel with their
  # textures, so some model packs stay over target_mib (2.0: 78 desktop packs, 2.8 GiB; android 72, 1.6 GiB).
  mm9:
    core: [behaviors, data_tables, dialogue, events, journal, rendering, terrain_decorations, terrain_materials, textures]
    domains:
      audio:             {buckets: 6}
      import:            {buckets: 1}
      state:             {buckets: 1}
      ui:                {buckets: 3}
      icons_x2:          {buckets: 2}
      maps:
        buckets: 4
        split:
          lighting: {extensions: [.lighting], buckets: 4}
      models:            {buckets: 40, group: model}
      world_items:       {buckets: 2, group: model}
      textures_x4:       {buckets: {desktop: 9, android: 1}}
      textures_x2:       {buckets: {desktop: 1, android: 3}}
      surface_materials_x4: {buckets: {desktop: 14, android: 1}}
# A language pack's fonts, sounds and videos (assets_dev/languages/<id>/engine and worlds/<world>): optional packs
# "lang-<id>.<package>.<folder>[.<bucket>]" with a language field, downloaded only for a language the player chose.
# ship: false leaves a folder out of releases. Sounds and videos ship from 2.0 (the user's decision, 2026-11-11); desktop
# manifests list these packs apart (language_packs), so updaters before 2.0, which know no optional packs, skip them.
languages:
  overlays:
    fonts:               {buckets: 1}
    audio:               {buckets: 2}
    videos:              {buckets: 1}
    # Images with text in them (the Arcomage card sheet), replacing the game's icons of the same name.
    icons_x2:            {buckets: 1}
