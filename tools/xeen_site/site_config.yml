# Hand-kept presentation data for the Xeen guide (tools/xeen_site/build_site.py). Everything else comes from the world
# package assets_dev/worlds/xeen.

site:
  title: Xeen Guide
  storeKey: "xeenguide."
  homeTitle: World of Xeen
  homeLead: "The World of Xeen as built in OpenYAMM: Clouds of Xeen and Darkside of Xeen on one world of 82 maps, with
    every teacher, shop, quest giver, chest, well and exit; {npcs} people placed. Data comes straight from the game's
    world package. The World of Xeen is an Experimental world, still being built: the guide follows the current
    build."
  worldName: the World of Xeen
  travelFrom: xeen_x1
  travelTo: xeen_d1
  tocSections: [1, 2, 3, 4, 5, 6]
  hideShopColumns: [tiers, enchanted, restock]
  leads:
    maps: "Journal maps of the surface maps and floor plans drawn from the geometry of every other map, with every point
      of interest from the built maps. Pick a map; toggle marker types in its legend."
    travel: "How the maps of Xeen connect: Cloudside above, Darkside below, the sky maps and the Elemental Planes; walking
      edges with their travel days, coaches and boats by weekday, mirrors, travel pyramids and Town Portal. The world
      map is a schematic; each tile is the map's own journal map."
    teachers: "Every Expert, Master and Grandmaster lesson in the World of Xeen: three places per skill, Grandmasters
      late or remote. A lesson needs the skill at 4 (Expert), 7 (Master) or 10 (Grandmaster), the previous mastery and
      the class's cap; prices are before the Merchant skill. \"Opens\" is the quest or stage that opens the teacher's
      house or the lesson."
    promotions: "Promotions are attached to Xeen quests: a first tier on Cloudside, then a Light or a Dark second tier
      on Darkside (each character takes one; a class with both offered chooses by the quest route), and the racial
      promotions. Every eligible party member is promoted at once; members who join later are promoted by the same
      person."
    shops: "Weapon, armour, magic and alchemy shops stock by their house's quality as MM6-MM8 shops do: a standard shelf
      and a special one (treasure levels 1-6), enchanted items among them. The stock rises town by town: Vertigo's
      shops sell mostly plain gear, the late towns magic gear. Xeen's shops and treasure are MM6-MM8 items; the
      setting \"MM9 loot in MM6-MM8\" does not apply to Xeen. Guilds sell the spellbooks of their school up to the guild's level
      (Xeen's own copies of MM8's books, which also turn up in chests and on monsters); a Xeen guild needs no membership. Prices are the item's value times the house's multiplier, before the Merchant
      skill. Every shop, guild and service hangs a sign by its door showing its kind, as in MM7 and MM8 (a guild its
      school's sign, an Adventurer's Inn a key and a heart)."
    bestiary: "Monsters of the World of Xeen by family, weakest to strongest; A, B and C are a family's three tiers,
      bosses are listed apart. Outdoor maps place groups by family (spawn points); dungeons place each monster. Click
      a row for its picture, attacks, spells, resistances, loot and where it lives."
  itemNotes:
    artifacts: "Xeen's own artifacts and relics: quest rewards and the treasure of named places. Random artifacts drop
      as in MM6-MM8 (treasure level 6)."
    quest: "Keys, passes and quest items of the World of Xeen. Ordinary weapons, armour and potions are the MM6-MM8
      items."

# The world map of the Travel section: one region per surface map, sky map and plane (grid cells, x to the east, y to
# the south); dungeons join the region whose map leads into them (or `maps` below). `face` groups the nav.
regions:
  - {id: x8, name: Cloudreach, hub: xeen_x8, pos: [1.0, 0], face: Sky}
  - {id: x9, name: Clouds of Xeen, hub: xeen_x9, pos: [2.2, 0], face: Sky}
  - {id: x6, name: Desert of the Sphinx, hub: xeen_x6, pos: [0.0, 1.1], face: Cloudside}
  - {id: x4, name: Burlock Savannah, hub: xeen_x4, pos: [1.6, 1.1], face: Cloudside}
  - {id: x7, name: Mount Firestone, hub: xeen_x7, pos: [3.2, 1.1], face: Cloudside}
  - {id: x5, name: Winterkill Tundra, hub: xeen_x5, pos: [0.0, 2.2], face: Cloudside}
  - {id: x3, name: Lifeforce Lagoon, hub: xeen_x3, pos: [1.0, 2.2], face: Cloudside}
  - {id: x2, name: Rivercity, hub: xeen_x2, pos: [2.1, 2.2], face: Cloudside}
  - {id: x1, name: Vertigo Meadows, hub: xeen_x1, pos: [3.2, 2.2], face: Cloudside}
  - {id: d6, name: The Forbidden Zone, hub: xeen_d6, pos: [0.0, 3.6], face: Darkside}
  - {id: d5, name: Desert of Doom, hub: xeen_d5, pos: [1.1, 3.6], face: Darkside}
  - {id: d4, name: Lakeside and Blackfang, hub: xeen_d4, pos: [2.2, 3.6], face: Darkside}
  - {id: d1, name: Castleview Vale, hub: xeen_d1, pos: [0.0, 4.7], face: Darkside}
  - {id: d2, name: Sprite Forest, hub: xeen_d2, pos: [1.1, 4.7], face: Darkside}
  - {id: d3, name: Sandcaster, hub: xeen_d3, pos: [2.2, 4.7], face: Darkside}
  - {id: d7, name: The Skyroads, hub: xeen_d7, pos: [3.3, 3.6], face: Darkside}
  - {id: planes, name: Elemental Planes, hub: xeen_p1, pos: [3.3, 4.7], face: Planes, maps: [xeen_p1, xeen_p2, xeen_p3, xeen_p4, xeen_p5]}
  - {id: arena, name: The Warzone, hub: xeen_xd20, pos: [4.3, 2.2], face: Cloudside, maps: [xeen_xd20]}

