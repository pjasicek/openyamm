# Quest files that are not quests (systems the guide does not list).
skip_quests: [world]

# The main story's acts (devdocs/xeen/QUESTS.md section 1): the chapters; their titles win over the story files'.
chapters:
  - {id: 1, name: "Act I: Vermin"}
  - {id: 2, name: "Act II: The King's Crusaders"}
  - {id: 3, name: "Act III: The Land Below"}
  - {id: 4, name: "Act IV: Unmasking"}
  - {id: 5, name: "Act V: Two Thrones"}
  - {id: 6, name: "Act VI: One World"}

