      - {map: xeen_x6, focus: "mound", caption: "The Cloudside hoard: the mound between the Sphinx's paws. The desert's obelisk is south-west of it."}
      - {map: xeen_d5, focus: "capstone", caption: "The Darkside hoard: the broken travel pyramid in the east. The desert's obelisk is in the west."}

  # ---- The optional finale: the Dragon Tower ----------------------------------------------------------------------------
  - quest: q-f1
    from: {map: xeen_fd04, npc: "Alister"}
    to: {map: xeen_fd04, npc: "Alister"}
    summary: "Steal a dragon egg in the Dragon Tower for Alister the Druid, then climb to the Dragon Clouds and answer the Eye of the Dragon for the Elder Staff."
    requires: "Prince Roland freed. The Key to the Dragon Tower is found in the key vault of the Alamar Depths, on Prince Roland's path. The Ancient Books on the Dragon Clouds can be read only after the Book of Languages in Castle Burlock. It is for a party of level 62 and up."
    steps:
      - "On Mount Firestone, the Dragon Tower stands on the crag in the north-west. Click its gate with the Key to the Dragon Tower. The key opens it and stays with you."
      - "In the gate hall, Alister the Druid waits in the west alcove. Ask him about 'Quest'."
      - "Go up the ramp in the west wall to floor 1. In the bone alcove at its east end, two dead adventurers' notes say Alister is a fraud and that 'the secret of the dragon has something to do with forever'."
      - "Take the ramp in the north wall up to floor 2. Click the nest of black rock in the middle of the floor and lift out one egg. One is enough."
      - "On floor 2, the last climber's bones in the west dead end hold a note ('The eye of the Dragon holds the Elder Staff.') and a potion (+2 Endurance for the member who drinks it, once per character). The hatchery's bones in the east hold a note about the crystal balls."
      - "Go back down to Alister and ask about 'Quest'. He pays, drinks the egg and turns into a lizard."
      - "Take the ramp in the east wall to floor 3. Read the Tome of Great Experience in the tome room in the north-west corner with each member. Then open the roof stair's door, climb to the hatch and answer Yes to 'Climb up through the hatch?'."
      - "On the Dragon Clouds, at the tower's foot in the north-east: read the four Ancient Books of the Dragon (their runes are IN, FI, NI, TY), then click the Eye of the Dragon in the dragon-head rock. To 'What is the secret of the Dragon?' answer INFINITY. The Eye gives you the Elder Staff."
    tips:
      - "A wrong answer to the Eye ('Die fools!') costs everyone about 70 hit points. You can answer again."
      - "Each of the three Dragon Power Crystals by the Eye gives the member who clicks it 3,000, 4,000 or 5,000 XP once, and an Energy shock."
      - "The crystal balls (Mind, Past and Future of the Dragon) repeat the hint to a member with 60 or more Intellect. A member with less takes Mind damage and is weakened."
      - "The Well of Fantastic Skill gives every member +20 to every statistic until you rest, once a day."
    reward: "Alister: 5,000 XP for each member. The Eye: 8,000 XP for each member and the Elder Staff (an artifact). The Tome: 4,000 XP once per character. The potion: +2 Endurance once per character."
    points:
      - {map: xeen_fd01, name: "Key vault box"}
      - {map: xeen_x7, name: "Dragon Tower and the Dungeon of Death"}
      - {map: xeen_fd04, name: "Dragon eggs"}
      - {map: xeen_fd04, name: "Potion"}
      - {map: xeen_fd04, name: "Tome of Great Experience"}
      - {map: xeen_fd04, name: "Clouds of Xeen"}
      - {map: xeen_x9, name: "The Eye of the Dragon"}
      - {map: xeen_x9, name: "Ancient Book of the Dragon"}
      - {map: xeen_x9, name: "Well of Fantastic Skill"}
    maps:
      - {map: xeen_fd04, focus: "Alister", caption: "The tower floors are drawn over one another in the south part of the plan: Alister in the gate hall, the eggs, the bones, the tome room and the roof hatch."}
      - {map: xeen_x9, focus: "Eye of the Dragon", caption: "The Eye, the books, the balls, the crystals and the well are at the Dragon Tower's foot in the north-east of the Dragon Clouds."}

  - quest: q-f2
    summary: "Open Sandro's old home under the Dragon Tower, solve its walk-in crossword and destroy the Lord Xeen Machine."
    requires: "Sandro released at the end of Sandro's Heart (either route), which gives the Key to the Dungeon of Death. The Key to the Dragon Tower from Prince Roland opens the tower. The terminal's code comes from the four heads in Darkstone Tower. It is for a party of about level 64."
    steps:
      - "Enter the Dragon Tower from Mount Firestone. In the middle of the gate hall, click the black iron door in the cellar well with Sandro's key. It opens for good and you keep the key."
      - "Go down the stair to the crossword hall. Click each clue plaque and type its answer. 1 Across King's Staff: SCEPTER. 5 Across Count Blackfang: VAMPIRE. 6 Across Imprisoned Queen: KALINDRA. 13 Across Freed from spaceship: CORAK. 21 Across Castle beyond the Forbidden Zone: ALAMAR. 24 Across City of the undead: NECROPOLIS."
      - "40 Across City of sorcerers: SANDCASTER. 44 Down Ellinger's Tower is located here: CASTLEVIEW. 45 Down City of Ghosts: WINTERKILL. 47 Down You need an amulet to gain entry: SPHINX. 76 Down Way of transportation in the Land of Xeen: MIRROR. 77 Down He had a pet dragon: XEEN. Each right answer lights its word on the floor."
      - "With all twelve words lit, click the gate at the hall's north end. It pays the puzzle's reward and opens the way down to Sandro's halls."
      - "Open the ballroom's double doors and go through the west game room to the Shrines of Minor and Lesser Evil. Destroy both (Yes to 'Destroy?'). The Throne of the Dead in the middle hall holds Sandro's note. Destroy the Shrine of Great Evil in the east room."
      - "Take the bone stair north of the throne hall down to the gong hall. Ring all four gongs, then pull the lever. The iron shutter to the machine hall rises."
      - "Optional: in the control room, beyond the machine hall to the west, type COMPUTER at the main terminal. Then click the Lord Xeen Machine in the machine hall and answer Yes to 'Lord Xeen Machine. Destroy?'."
    tips:
      - "Do not open the gong hall's chest before pulling the lever: it silences the gongs, and you have to ring all four again. Loot it afterwards."
      - "The Shrine of Ultimate Evil, in the east room beside the Great one, gives nothing. Destroying it costs everyone 70 Fire damage and throws you out onto Mount Firestone. The dungeon stays as it was, so leave it until last or leave it alone."
      - "The coffins behind the Do Not Disturb door never open, and their vampires never wake."
      - "A wrong code at the terminal only calls you a Goober."
      - "Power Liches, Lich Lords and Skeletal Liches guard the shrine rooms, and Autobots guard the machine floor."
    reward: "6,000 XP for each member for the crossword. The shrines: 1,000 (Minor), 2,000 (Lesser) and 3,000 (Great) for each member. The terminal code: 2,000 for each member. The machine: 10,000 for each member. 24,000 for each member in all."
    figures:
      - img: sandro_shrines.webp
        caption: "Sandro's halls: the Shrines of Minor, Lesser and Great Evil give experience; the Shrine of Ultimate Evil only throws you out onto Mount Firestone."
      - img: sandro_gongs.webp
        caption: "The gong hall below the throne hall: ring the four gongs, then pull the lever."
    points:
      - {map: xeen_fd04, name: "Black iron door"}
      - {map: xeen_fd04, name: "1 Across"}
      - {map: xeen_fd04, name: "Gate"}
      - {map: xeen_fd04, name: "The Throne of the Dead"}
      - {map: xeen_fd04, name: "Lever"}
      - {map: xeen_fd04, name: "Main Terminal"}
      - {map: xeen_fd04, name: "Lord Xeen Machine"}
    maps:
      - {map: xeen_fd04, focus: "Black iron door", caption: "From Sandro's door in the gate hall (south), the crossword hall, Sandro's halls with the shrines, then the gong hall, the control room and the machine hall in the north."}

