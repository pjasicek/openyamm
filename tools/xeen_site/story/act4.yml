chapters:
  - id: 4
    title: "Act IV: Queen and Pharaoh"
    intro: "Two halves that do not depend on each other. On the Darkside you cheer up Dimitri with the Songbird, fly Ambrose's griffin into Castle Blackfang, finish Castle Kalindra with the last ten Energy Disks and cure Queen Kalindra, who gives you the key to the Great Pyramid (Act V). On Cloudside, any time after the Skeleton Key, you storm Darzog's Tower and free Crodo, dig out Newcastle's dungeon and take the Xeen Slayer Sword, which Slick's carnival and Castle Xeen (Act V) need. This guide follows the tested order: the Darkside half first, then the Cloudside half after Castle Alamar; the Cloudside half can just as well come first."
    sections:
      - title: "Castle Kalindra: Dimitri and the Songbird"
        intro: "Act III ends with Megan's key to the Songbird's cage in the Dungeon of Lost Souls (The Songbird of Serenity). The dungeon lies on the Isle of Lost Souls off Lakeside, north of Sandcaster."
        giver: {map: xeen_dd03, npc: "Dimitri"}
        quests:
          - quest: m24
            requires: "Megan's key to the Songbird's cage (The Songbird of Serenity) and Castle Kalindra's second floor (10 disks)."
            steps:
              - "Go to Lakeside: east from Castleview Vale through Sprite Forest to Sandcaster, then north off Sandcaster and the Aging Forest by the road up to Lakeside and Blackfang. Lakeside Yachts is the jetty north-west of where the road comes in. Captain Ferris Gull sails 'to the Isle of Lost Souls' every day (1 day, 250 gold), but only between 6 AM and 6 PM: if you arrive at night, rest until morning."
              - "On the Isle, follow the path north past the sign to the ruined tower. Its two iron-bound leaves are not locked: click them, and OK in the entrance window takes you into the Dungeon of Lost Souls. The carving over the first gate says what to do: NEVER UNDERESTIMATE THE POWER OF POSITIVE THINKING. Answer gladly and the way opens."
              - "Five gates bar the way down, one per floor, and each asks a yes/no question. Answer Yes every time: 'Will you find what you came for?' (the first floor, north of the entrance hall), 'Is the glass half full?' (the west end of the second floor), 'Will tomorrow be better than today?' (the east end of the third floor), 'Are your friends glad you came?' (the east end of the fourth floor) and 'Is the Songbird waiting for you?' (the west end of the fifth floor). No just leaves the gate shut; click it again and say Yes."
              - "The way: from the first gate the hall of storage leads east to the stair down at its east end. The second floor runs west from the stair's foot, where a statue tells you to think positive, to its gate; the third floor runs east to its gate and the stair down to the fourth; the fourth floor's gate is at its far east end, with the stair to the fifth beyond it."
              - "The fifth floor is the Soul Maze, a corridor shaped like the letters of a name that you walk from the M at its east end to the S at its west end. The gate stands past the S. Behind it is the aviary: the Songbird of Serenity's cage is in its south-west corner. Click it: Megan's key opens it, and the status line says the bird hops onto your hand (you keep it)."
              - "With the Songbird freed, the cage lift beside the aviary (Lift: up) carries you straight up to the first floor; leave by the double doors to the Isle. Tern's Isle Ferry at the Isle's jetty takes you back to Lakeside (1 day, 250 gold)."
              - "Return to Castle Kalindra (its gate is on the rise south-west of Castleview). Take the Cloud Stairs at the west end of the north wing up to the second floor; Dimitri is in the Captain's Quarters on the corridor. With the Songbird in your packs he has a new topic, 'Quest': he tells you the Queen's story, gives the disk safes' combination 64-52-31 and sends you to Ambrose (The Griffin). Afterwards his 'The Songbird' topic repeats where Ambrose is."
              - "Megan, in her room further east on the same corridor, now has 'Thanks' and gives you a gift. Then go south from the corridor through the Sleeping Chambers to the Vaults and click the safe at the east end: answer 64-52-31 (or 645231). It holds four Energy Disks."
            tips:
              - "Optional riches on the way down: on the first floor, turn over all four hour glasses in the hall of storage and a panel opens on a chest; on the second floor, three levers along the cell row open the cells (bones with gold, a chest in the third cell). On the third floor the statue's plinth says 'Turn all dials up, pull lever & drink the souls of adventurers past!': click each of the four dials until it reads 4, pull the lever beside them, and each member who drinks the Soul Waters gets 1,000 experience once. Avoid the Negative Soul Waters (they cost HP and SP)."
              - "On the fourth floor, a plaque reads 'Start from the North and go to the South; third from the top and far to the East pull the lever you suspected least.' Of the twelve levers in four rows of three, pull the east lever of the third row from the north. It lifts the portcullis of the Minotaur's Private Reserve (south of the levers): a Minotaur Lord, a chest and Soul Waters worth 2,000 experience to each member who drinks. The barracks' straw hides 800 gold."
              - "In the Soul Maze the hedge under the second E (counting from the M) is an illusion that hides a dead end with bones and a chest. The horned throne in the L belongs to a side quest (The Minotaur's Labyrinth)."
              - "Free the other birds in the aviary: five cages give +2 Luck, Endurance, Speed, Personality, Might or Accuracy to the whole party (once each); the Parrot of Prophecy recites a verse about Alamar."
              - "The dungeon is full of minotaurs (level 38), gorgons (level 45) and three Minotaur Lords (level 55). The lift does not move until the Songbird is out of its cage, so you walk down."
              - "The safe answers only after Dimitri has given you the combination."
            reward: "Dimitri: 7,000 experience, an item (treasure level 5) and the award 'Cheered Dimitri'; Megan: 4,000 experience and an item (treasure level 5); four Energy Disks from the safe. You keep the Songbird."
            maps:
              - map: xeen_dd12
                show: [exit, objective, lever, door, sign]
                focus: "Songbird"
                caption: "Five floors stacked over one another: the entrance in the south, the gates marked on each floor, the aviary and its lift in the west."
              - map: xeen_dd03
                show: [exit, door, objective]
                focus: "Dimitri"
                caption: "The second floor: Dimitri's and Megan's rooms on the north corridor, the Vaults' safe to the south-east."

      - title: "Griffin Pass: Ambrose, the Queen's Knight"
        intro: "Ambrose camps with a tethered griffin at Griffin Pass, near the south edge of the Forbidden Zone. Leave Castleview by its north gate and follow the mountain road north off Castleview Vale; the camp is a short way north-west of where the road enters the map."
        giver: {map: xeen_d6, npc: "Ambrose"}
        quests:
          - quest: m25
            requires: "Dimitri's 'Quest' talk with the Songbird (The Songbird of Serenity)."
            steps:
              - "Talk to Ambrose and choose 'Quest': once Dimitri has sent you, he gives you a plain bridle: the griffin will not take it until it is enchanted, and Natasha in Sandcaster can do that."
              - "Go back down the mountain road to Castleview Vale and east through Sprite Forest to Sandcaster. Natasha the Enchantress lives in the city between Aladdin's Lamps and Omar's remedy shop (Vulture Repellant and Other Remedies)."
              - "Ask Natasha 'Quest' with 5,000 gold in your packs. She takes the gold and the bridle and gives you the enchanted bridle. With less gold she only quotes the price."
              - "Return to Ambrose at Griffin Pass and choose 'Quest' again. He takes the enchanted bridle and pays you from the Queen's purse."
              - "When you are ready for Castle Blackfang, ask him 'Fly to Blackfang'. The griffin sets you down on the castle's battlements (The Queen of the Darkside)."
            tips:
              - "Castle Blackfang's gate on Lakeside's north shore never opens on foot, and flying over its crag does not work: bats beat you out of the sky. The griffin is the only way in."
              - "After the first flight Ambrose leaves Griffin Pass. He waits beside his griffin on Blackfang's battlements ('Fly us out') and at the castle gate on Lakeside's north shore, which then offers the griffin flight inside."
            reward: "5,000 experience and 4,000 gold from Ambrose (Natasha's fee is 5,000 gold)."
            maps:
              - map: xeen_d6
                show: [exit]
                focus: "Ambrose"
                caption: "Griffin Pass is near the south edge of the Forbidden Zone, west of the mountain road from Castleview."
              - map: xeen_d3
                show: [exit, sign]
                focus: "Natasha"
                caption: "Natasha's house is in Sandcaster, in the north-west of the map."

      - title: "Ellinger's Tower: the last ten Energy Disks"
        intro: "Ellinger, in his study at the top of his tower in Castleview, takes the disks five at a time as in Act III (Castle Kalindra Returns). The lift just inside the tower door runs straight up to the study and back."
        giver: {map: xeen_dd02, npc: "Ellinger"}
        quests:
          - quest: m26
            requires: "Castle Kalindra's second floor (10 disks). Where the disks are: The Energy Disks in Act III."
            steps:
              - "Bring five Energy Disks to Ellinger and ask 'Quest'. He takes exactly five: with one to four he takes none and tells you how many he needs."
              - "Fifteen disks (stage 3): Castle Kalindra's dungeon returns. Its stair at the east end of the ground floor's south wing now leads down to the cell block: Guido the convict, the prisoner ledger and the imprisoned liches of Dimitri's Champion promotion, and Scraps, the castle's pet dragon (level 70), behind the kennel portcullis in Maximum Security. The notes by its lever say 'Don't let Scraps out!'."
              - "Twenty disks (stage 4): the castle is whole. The upper stair, north off the second floor's corridor near the top of the Cloud Stairs, climbs to the third floor: the Chapel of the Queen (Mother Seraphine), The Queen's Forge (Haldor), Sir Roderic of the Queen's Guard, The Queen's Proving Hall (Lady Brienne, training up to level 200), The Royal Treasury, and the Royal Bed Chamber with the Queen's safe (The Queen of the Darkside). The shimmering wall on the ground floor fades and opens the yard with the Kalindra Stables and the Mirror of Castle Kalindra; Gem and Errol in the throne room now teach Grandmaster."
              - "The Darkside's mirrors wake with the twentieth disk: from now on every Darkside mirror you have touched can carry you to the others. Near the Queen's mirror in the Royal Bed Chamber a Button asks 'Activate Mirror Portals?': answering Yes only confirms it."
            tips:
              - "Both new floors bring their own residents: tomb terrors, liches and bone dragons in the dungeon, vampires and gnome vampires on the third floor."
              - "Stage 4 is also where Ellinger tells you to find the key to the Great Pyramid: the Queen gives it to you once she is cured (The Queen of the Darkside)."
            reward: "4,000 experience at fifteen disks and 6,000 at twenty."
            maps:
              - map: xeen_dd02
                show: [exit, objective]
                focus: "Lift: up"
                caption: "The lift is just inside the tower door; it runs up to Ellinger's study."
              - map: xeen_dd03
                show: [exit, door, objective]
                focus: "Royal Bed Chamber"
                caption: "Castle Kalindra: the dungeon stair (stage 3) in the south wing; the third floor, the Queen's bedroom and its Button (stage 4)."

      - title: "Castle Blackfang: the Queen of the Darkside"
        intro: "Two visits: first to kill Count Blackfang and find the Queen, then, after Castle Kalindra is whole, to bring her the crown from her own safe."
        giver: {map: xeen_dd14, npc: "Queen Kalindra"}
        quests:
          - quest: m27
            requires: "Ambrose's griffin (The Griffin). The crown safe needs Castle Kalindra's stage 4 (20 disks)."
            steps:
              - "Ambrose's griffin lands you on the battlements in the south of the castle. Go west into the south-west tower and down its stair to the upper floor; walk north through the sleeping hall full of coffins and past the Countess's rooms to the grand stair at the north end, and take it down to the ground floor."
              - "The double doors north of the stair's foot open on the Count's hall. At its west end a black iron bar blocks the stair to the dungeon: a force pushes you back while the Count lives. Count Blackfang (level 70, 2,100 HP) waits in the hall with three Royal Vampires. When he dies every coffin lid slams shut and the bar lifts."
              - "Take the dungeon stair (west of the hall) down, then follow the cells south to the last cell in the south of the dungeon. Queen Kalindra sits there, a vampire. Talk to her ('Quest'): her crown can cure her, and it is in the safe in her bedroom at Castle Kalindra, combination 3-31-62."
              - "To leave, draw the bolt in the shaft just south-west of her cell: the trapdoor at the top of the ladder opens into the cellar. Go up through the kitchen to the courtyard, lift the bar on its gate and climb the stair to the battlements. Ambrose, beside his griffin, flies you down to Lakeside's north shore ('Fly us out')."
              - "When Castle Kalindra is whole (20 disks), go up to its third floor and into the Royal Bed Chamber. The safe is behind the Queen's mirror: answer 3-31-62 (or 33162) and take the crown."
              - "Back at Castle Blackfang's gate on Lakeside's north shore, Ambrose offers to fly you inside: say Yes. Walk the same way to the Queen's cell (the bar stays lifted) and give her the crown ('Quest'). She gives you the key to the Great Pyramid, and Ambrose's griffin flies everyone home to Castle Kalindra's gate. From now on she sits on her throne in Castle Kalindra."
            tips:
              - "The safe stays shut until the Queen has told you the combination."
              - "Coffins hold gold, and some hold a vampire that rises when you open it. The Count's crypt, north of his hall, holds the castle's best chest. A bones' diary in the south-west tower warns that the Queen cannot be brought out into daylight: the griffin carries her home after nightfall."
              - "Fire leaps from slits in the merlons along the battlements' east wall walk; the way down is in the west."
            reward: "12,000 experience, the key to the Great Pyramid and the award 'Saved the Queen'. The Darkside's sun grows weaker."
            maps:
              - map: xeen_dd14
                show: [exit, objective, door, lever]
                focus: "Queen cell"
                caption: "The landing in the south, the Count's hall in the north, the dungeon below it running south to the Queen's cell."
              - map: xeen_dd03
                show: [exit, door, objective]
                focus: "The Queen's mirror"
                caption: "The crown safe is behind the Queen's mirror in the Royal Bed Chamber on the third floor."

      - title: "Darzog's Tower: Crodo"
        intro: "Darzog's Tower stands on the island in Lake Darzog, west of Rivercity. Medin rows you across from his jetty on Rivercity's west shore (once the Lake Beasts are dead, a side quest), and the Skeleton Key opens the tower door on the island's east side."
        quests:
          - quest: m21
            requires: "The Skeleton Key from the Tower of High Magic."
            steps:
              - "No spell works anywhere in the tower: fight with steel, and bring potions for healing. A solo run is the exception: a lone character casts here, but every spell, its own and the monsters', deals half its damage. The tower is four floors round an open Well, plus the roof; the stairs climb the west and east stair halls in turn."
              - "On the gate floor, walk round the cloister to the west stair hall and climb to the works. The gate to the east stair is chained shut; its winch is in the assembly hall in the works' south-west corner. Turn it, go back east through the open works gate and take the east stair hall up to the library floor."
              - "A note at the head of the stair warns: MIND THE CRACKED FLAGS. Cracked trapdoor flags on this floor drop you back to the works; walk round them. In the great library south of the Well, kill the Chief Librarian and open his cabinet: it holds the library key."
              - "Walk round the trapdoor on the west walk to the library stair door at its north end. The library key opens it; climb to Darzog's floor and go north to Darzog's doors."
              - "Baron Darzog (level 55) waits in his hall among six clones that wear his face. When he falls the tower shudders and the grille in front of his disc in the Well opens."
              - "His study west of the hall holds Darzog's journal: Crodo sits behind the Baron's own portrait in his bedchamber. The bedchamber door is in the hall's east wall, behind the dais. Click Darzog's portrait: with the Baron dead it slides up on Crodo's cell. Step in and Crodo tells you who stands at the King's side, gives you the vault's word 'laboratory' (The Xeen Slayer Sword) and sends you to Artemus (The Excavation Permit) before he goes home."
              - "The east stair hall climbs from Darzog's floor to the roof, where a stair of cloud now leads up to the Clouds of Xeen (Slick's Carnival). To leave, ride Darzog's disc down the Well to the gate floor and go out by the tower door."
            tips:
              - "Six study books on the library floor raise one stat each by 5, once per character. Each lies past cracked flags."
              - "Walking off the battlements or the roof drops you onto the island beside the tower door."
              - "The disc answers only after Darzog's death. The grille on his floor stands open while the disc is up there and shuts while it is down the Well: call it up at the grille, step on and touch it to ride down. The stone button at the bottom of the Well calls it from the gate floor."
            reward: "35,000 experience when Crodo is freed; the cloud stair to the Clouds of Xeen opens."
            maps:
              - map: xeen_xd12
                show: [exit, door, lever, objective]
                focus: "Darzog's portrait"
                caption: "All five levels round the central Well: the works gate winch in the south-west, the library stair door in the west, Darzog's hall in the north, his portrait in the north-east."
              - map: xeen_x2
                show: [exit, transport]
                focus: "Medin's boat"
                caption: "Medin's boat leaves from his jetty on Rivercity's west shore; the tower door is on the island's east side."

      - title: "Castle Burlock and Newcastle: the Xeen Slayer Sword"
        intro: "Back to Castle Burlock in Burlock Savannah, north of Rivercity. Artemus's study and Emerson's office are off the gallery of arms, east of the throne room."
        giver: {map: xeen_xd07, npc: "Artemus"}
        quests:
          - quest: m22
            requires: "Crodo freed (Darzog's Tower) and Newcastle's keep (The Keep of Newcastle). You need five King's Megacredits (16 exist in the three places of King's Megacredits; the walls and the keep took ten)."
            steps:
              - "Talk to Artemus in the Royal Advisor's Study and choose his fourth 'Quest' topic, the new one below the other three. He believes Crodo and quietly gives you an Excavation Permit for Newcastle's dungeon."
              - "Next door, in the Master Builder's Office, ask Emerson about his fourth 'Quest' topic (the dungeon) with the permit and five Megacredits in your packs. He takes both and digs out the caved-in dungeon under Newcastle Keep. Without the permit he refuses; without five Megacredits he waits."
              - "Newcastle's stage 3 is ready at once: in the keep (the stair into the foundations on the Newcastle site, in the north-east of Lifeforce Lagoon), the Chapel of Newcastle (Father Cuthbert) and the Newcastle Counting Room (Lyle Ledger) open in the statue court's north wall, YOUR well in the court gives Armour class +20 until you rest, and the old dungeon stair beyond the court leads down to the sword vault (The Xeen Slayer Sword)."
            reward: "1,000 experience from Artemus and 2,000 from Emerson."
            maps:
              - map: xeen_xd07
                show: [exit, door]
                focus: "Artemus"
                caption: "Artemus and Emerson are off the gallery of arms, east of the throne room."
              - map: xeen_xd13
                show: [exit, sign]
                focus: "Chapel of Newcastle"
                caption: "Newcastle Keep at stage 3: the chapel and counting room in the court's north wall, YOUR well in the court."

          - quest: m23
            requires: "Newcastle's dungeon dug out (The Excavation Permit)."
            steps:
              - "The vault door wants a password. Crodo gave it to you ('laboratory', also in your autonotes), and Elona the Explorer in Shangri-La says it too. The keep also spells it out in five numbered syllables scratched into the stone, should you want them: '1: la' on the great hall's north wall, '2: bo' under the pantry sack in the north-west, '3: ra' in the statue court by the stair, '4: to' on the flooded cellar's shelf and '5: ry' on the laboratory's last wall."
              - "Enter Newcastle Keep by the stair into the foundations on the Newcastle site. Cross the great hall north to the statue court in the east and take the dug-out stair at its south-east corner down into the flooded cellar (bog things and marsh horrors)."
              - "From the cellar go west into the old laboratory, guarded by iron golems (level 40). The steel vault door is at the laboratory's west end. Click its grille; to 'What is the password?' answer laboratory. The door slides open."
              - "Open the chest on the rack inside the vault and take the Xeen Slayer Sword. It is the only weapon that can harm Lord Xeen (Castle Xeen): keep it."
            tips:
              - "The scientists' notebooks in the laboratory say the password was changed to 'something we will all remember'."
            reward: "10,000 experience and the Xeen Slayer Sword."
            maps:
              - map: xeen_xd13
                show: [exit, objective, sign]
                focus: "Vault door"
                caption: "The great hall and court above; the cellar, the laboratory and the sword vault below in the south."
              - map: xeen_x3
                show: [exit, mirror]
                focus: "Newcastle Keep"
                caption: "The stair into Newcastle's foundations is in the north-east of Lifeforce Lagoon."
