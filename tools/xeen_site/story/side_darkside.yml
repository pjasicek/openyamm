# Side quests of Darkside (Q-D1 ... Q-D28). Format: BRIEF.md (flat quests: list).
quests:
  # ---- Castleview Vale (D1): the Gremlin Court, Jasper, the Drawkcab monks, Public Storage, Rooka --------------------
  - quest: q-d1
    from: {map: xeen_d1, npc: "Mayor Snarfblad"}
    to: {map: xeen_d1, npc: "Mayor Snarfblad"}
    summary: "Gremlins are sabotaging Castleview. Stop them at their king Gettlewaithe's court in the burrow under the town wall, by talk or by force."
    requires: "Nothing. You can start it outside the walls, without a pass: this is one of the two ways into Castleview (the other is a pass)."
    steps:
      - "Read the Mayor's notice nailed beside Castleview's north gate, outside, next to the gatewarden's hatch. That starts the quest. Inside the walls, Mayor Snarfblad in the Town Hall gives the same job under 'Gremlins'."
      - "Walk east along the outside of the wall to a burrow under it, The Gremlin Court. Click it and choose OK in the entrance window to crawl in."
      - "Walk north through the hall of pranks and the waiting room (open its door), then through the court's door. Gettlewaithe sits on his throne of chairs at the north end with three Gremlin Guards before him. The gremlins of the burrow, the hall of pranks, the waiting room and the court leave you alone unless you attack them; those in the wall's old cellar, the larder and the army below are hostile anyway."
      - "Peace route: click the throne to talk to him. Say 'We come in peace' first, then 'The Mayor's demand'. He refuses and calls his guards, and the court turns on you. Kill the three guards (Gettlewaithe stays on his dais and does not fight unless struck). When the last guard falls he 'has gone a much paler shade of green'. Click the throne again and say 'Submit or die': he submits and the court is won."
      - "Fight route: kill Gettlewaithe himself (level 24) and his guards. 'He topples off his throne of chairs' and the court is won. Then open the treasury chest beside the throne: it holds 3 Energy Disks and his gold. While he lives, the chest is 'occupied'."
      - "Leave by the tiny door at the south end of the burrow ('OK'). The north gate now opens for you. Go to the Town Hall, north of the bank, and ask Mayor Snarfblad 'Gremlins' to be paid."
      - "Peace route only: Snarfblad then has a second topic, 'Gettlewaithe's gift': three Energy Disks the gremlins sent as an apology."
    tips:
      - "Order matters on the peace route. 'Submit or die' before 'We come in peace' or before the guards are dead makes him order your heads off and the court attacks, but you can still finish by the fight route."
      - "After a peace the gremlins of the court and the vale stay friendly. The broken bridge and burned mill by the river are mended once the court is won, whichever way."
      - "The disks count toward Castle Kalindra. You get three either way, never both the gift and the treasury."
    reward: "Snarfblad: 5,000 XP for each member, 2,500 gold and a Castleview Pass. Plus 3 Energy Disks: his gift (peace) or the treasury chest under the throne, which also holds 600 gold and an item (fight)."
    points:
      - {map: xeen_d1, name: "The Mayor's notice"}
      - {map: xeen_d1, name: "The Gremlin Court"}
      - {map: xeen_dd04, name: "Gettlewaithe"}
      - {map: xeen_dd04, name: "Gettlewaithe's throne"}
      - {map: xeen_dd04, name: "Castleview Vale"}
    maps:
      - {map: xeen_dd04, focus: "Gettlewaithe", show: [exit, door], caption: "The burrow runs north from the tiny door to the throne room at the far end."}
      - {map: xeen_d1, focus: "Gremlin Court", caption: "The notice is at the north gate; the burrow is under the wall just east of it."}

  - quest: q-d2
    from: {map: xeen_d1, npc: "Jethro"}
    to: {map: xeen_d1, npc: "Jethro"}
    summary: "Jethro's brother Jasper sits in Castleview Jail, framed by Joe the map seller. Get him out."
    steps:
      - "Jethro's Maps is in the west of Castleview. Ask Jethro 'Jasper' to start."
      - "Castleview Jail is just inside the north gate. Warden Krupp says Jasper stole a map from Joe and asks for proof. Jasper himself, under 'Joe', says Joe sells fake maps and that the back window's bars are old."
      - "Proof route: buy one of Joe's maps from his stall outside the north gate (Joe's Second Business, 1,000 gold) and ask Warden Krupp 'Jasper' with it in your packs. He reads it, sets Jasper free and hands the map back."
      - "Force route: click the barred window in the alley behind the jail. With the quest started you wrench the bars out and Jasper runs for his brother's house. Before you have talked to Jethro the bars do not move."
      - "Return to Jethro's Maps (Jasper now lives there too) and ask Jethro 'Jasper'."
    tips:
      - "Show Krupp the map before you give it to Jethro under 'Joe's map': Jethro keeps it."
    reward: "4,000 XP for each member and 1,000 gold."
    points:
      - {map: xeen_d1, name: "Warden Krupp and Jasper"}
      - {map: xeen_d1, name: "A barred window"}
      - {map: xeen_d1, name: "Joe"}
    maps:
      - {map: xeen_d1, focus: "Warden Krupp", caption: "The jail is just inside the north gate, its barred window in the alley behind. Jethro's shop is in the west of town."}

  - quest: q-d3
    from: {map: xeen_d1, npc: "Brother Otto"}
    to: {map: xeen_d1, npc: "Brother Reger"}
    summary: "Take the four Drawkcab monks' lessons in order, then say the word they study at Brother Reger's door."
    requires: "The lessons and the word any time. Reger promotes only once Megan, on Castle Kalindra's second floor, has asked you for the Songbird of Serenity (The Songbird of Serenity, after the second stage of disks). Promotes Initiates to Masters: the Light path. The Dark path for an Initiate is the Ninja clan (The Clan's Return, at the Ninja Pagoda). The choice is per character: a member promoted on one path cannot take the other."
    steps:
      - "The four monks live in a row of cells in the west of Castleview, under a sign that reads 'The Drawkcab Monks study the Palindrome.' From west to east: Brother Otto, Sister Hannah, Brother Bob, Sister Ada."
      - "Ask each 'Lesson' in that order: Otto, Hannah, Bob, Ada. A monk asked out of turn says 'Order wrong the. Otto first, Brother. Lesson one.'"
      - "Sister Ada makes the party members of the Drawkcab and names the word: palindrome."
      - "Brother Reger's cell stands alone far south of Castleview, outside the walls. Click its door. It asks 'What's the word?': type palindrome. The door opens ('Ni emoc')."
      - "Inside, ask Reger 'The word'. If the Queen's castle is not far enough along yet, he says Masters are 'ready not yet' and you come back after Megan's request. Then he promotes your Initiates."
    tips:
      - "Without the Drawkcab award the door only says 'Wrong. Go visit the monks...'. A wrong word gets 'WRONG!!!' and you can try again."
      - "Otto teaches Dodging and Hannah Unarmed (Master) in the same cells."
      - "Initiates who join later or are promoted later: Reger's topic 'Masters' promotes them, unpaid."
    reward: "Sister Ada: 2,000 XP for each member and the award 'A member of the Drawkcab'. Reger: 9,000 XP for each member and the Master promotion for every Initiate."
    points:
      - {map: xeen_d1, name: "Sign"}
      - {map: xeen_d1, name: "Sister Hannah"}
      - {map: xeen_d1, name: "Brother Bob"}
      - {map: xeen_d1, name: "Sister Ada"}
      - {map: xeen_d1, name: "Brother Reger"}
    maps:
      - {map: xeen_d1, focus: "Brother Otto", caption: "The four cells are in a row in the west of town; Reger's cell is far to the south, outside the walls."}

  - quest: q-d4
    from: {map: xeen_d1, npc: "Dyson"}
    to: {map: xeen_d1, npc: "Dyson"}
    summary: "Close all eighteen chests in Castleview's Public Storage yards, each row in the right order."
    steps:
      - "Dyson the puzzlemaster is at Public Storage in the middle of Castleview. Ask him 'The chests': close the numbered chests from 1 to 9, and the lettered ones so they spell PITCHFORK."
      - "Two rows of nine chests stand in the yard south of his door, the numbered row to the west and the lettered row to the east. Use a chest to work its lid."
      - "Numbered row. The lids, west to east, read 3 7 1 9 5 2 8 4 6. Close them 1, 2, 3 ... 9: that is the 3rd, 6th, 1st, 8th, 5th, 9th, 2nd, 7th and 4th chest from the west. A chest out of turn 'will not shut' and all nine spring open again. The ninth lid drops 'with a satisfying clunk'."
      - "Lettered row. Using a chest shows its letter ('A letter on the lid reads: ...'). West to east they are F T K P O C R I H. Close them P, I, T, C, H, F, O, R, K: the 4th, 8th, 2nd, 6th, 9th, 1st, 5th, 7th and 3rd from the west. The last lid ends with 'A pitchfork, spelled in chests.'"
      - "Return to Dyson and ask 'The chests' again. With only one row done he pays nothing."
    tips:
      - "The lettered row says nothing when a lid shuts in turn, and a wrong letter silently starts the row over. If the finishing line does not come, start again from P."
      - "Dyson also teaches Disarm Trap (Master)."
    reward: "2,000 XP for each member, 500 gold and two random items (treasure level 3)."
    points:
      - {map: xeen_d1, name: "A chest with a 1 on its lid"}
      - {map: xeen_d1, name: "A chest with a letter on its lid"}
    maps:
      - {map: xeen_d1, focus: "Dyson", caption: "Public Storage is in the middle of town; the two rows of chests are in the yard south of it."}

  - quest: q-d5
    from: {map: xeen_dd01, npc: "Valio"}
    to: {map: xeen_dd01, npc: "Valio"}
    summary: "Valio the Simple, who lives in a bed in the Castleview Sewer, wants Rooka the Queen Rat dead."
    steps:
      - "Climb down the iron hatch in Castleview's square, just south-west of the Castleview Strongroom (the bank)."
      - "Go west through the door at the drain cross and follow the west drain to Valio's niche. Click his bed and ask 'Rats'."
      - "Rooka's nest is in the east of the sewer, beyond the flooded culvert in the deep cistern (down the overflow stair beside Valio's bed). The culvert is 'flooded to its roof' while the sluice runs."
      - "To drain it, go back up and north to the sluice lever in the north-west of the sewer and pull it. 'The gate drops shut', and after a few seconds the culvert drains."
      - "Go back down the overflow stair, through the drained culvert and up the nest ramp. Kill Rooka the Rat Queen (level 24) and her wererats. 'Down the tunnel, someone in a bed cheers.'"
      - "Return to Valio and ask 'Rats': the chest beside his bed is yours. Open it then."
    tips:
      - "Do not open Valio's chest before he has paid. He yells that it is his, and Valio, a level-45 graduate of the School of Evil Wizardry, gets out of bed to fight."
      - "Leave by the ladder under the hatch ('OK')."
    reward: "3,000 XP for each member at Rooka's death. Valio's chest: 300 gold, an item (treasure level 2) and his diploma."
    points:
      - {map: xeen_dd01, name: "Rooka the Rat Queen"}
      - {map: xeen_dd01, name: "Sluice lever"}
      - {map: xeen_dd01, name: "The chest beside Valio's bed"}
      - {map: xeen_d1, name: "Castleview Sewer"}
    maps:
      - {map: xeen_dd01, focus: "Rooka", show: [exit, lever, door], caption: "Valio's bed is in the west, the sluice lever in the north-west, Rooka's nest in the east."}

  - quest: q-d6
    from: {map: xeen_d1, npc: "Dreyfus"}
    to: {map: xeen_d1, npc: "Dreyfus"}
    summary: "Heretics have thrown Dreyfus, High Priest of Mok, out of the Western Tower. Climb in from the top, kill their Cult Leader and open the ground door with his key."
    requires: "Promotes Crusaders to Heroes and Priests to Priests of Light: the Light path. The Dark path for a Crusader is the Voweless Knights (The Chalice of Protection, Villain), for a Priest Sandro the Lich (Sandro's Heart, Priest of Dark). The choice is per character: a member promoted on one path cannot take the other. The tower is built for a party of about level 35."
    steps:
      - "Dreyfus is in the Temple of Mok in the east of Castleview. Ask him 'Heretics'."
      - "The Western Tower of Mok stands in the north-west of the vale, south of the gemsmiths' row. Its ground door is warded and locked. Walk round to the north wall, where a rope hangs from a window near the top. Click it and choose OK in the entrance window to climb: you arrive on the tower's top floor."
      - "Top floor: open the door out of the hoist room, cross the bone gallery and go through the chapel's double doors. Kill the Cult Leader (level 45). The Key to the Western Tower lies on the altar at the chapel's west end: pick it up like any item."
      - "Take the altar stair down. On the third floor Pious the Cleric begs for his life, and on the second floor Humble the Cleric does the same: 'Slay him anyway?'. Answer 'No' to spare them (they leave), 'Yes' to kill them. Sparing them costs nothing."
      - "Go down the east stair to the ground floor. The disc alcoves hold 2 Energy Disks. Unlock the front door at the south end from inside with the key ('a small, sulky pop') and leave by it."
      - "Report to Dreyfus: 'Heretics'. If you spared either cleric, he also has 'The clerics'."
    tips:
      - "With the key you can also open the ground door from outside."
      - "Each of the four fountains on the second and third floors gives every member who drinks +5 to one resistance (Fire, Air, Water, Body), once per character."
      - "The Golden Pegasus Statuette for Luna's Statuettes lies in the north alcove of the ground floor's hall of alcoves."
      - "Crusaders or Priests who join later or are promoted later: Dreyfus's topic 'Mok's blessing' promotes them, unpaid."
    reward: "9,000 XP for each member, 3,000 gold, the award 'Helped Dreyfus, High Priest of Mok', and the promotions: Crusader to Hero, Priest to Priest of Light. Plus the 2 Energy Disks from the alcoves."
    points:
      - {map: xeen_d1, name: "Western Tower of Mok"}
      - {map: xeen_dd05, name: "Key to the Western Tower"}
      - {map: xeen_dd05, name: "Pious the Cleric"}
      - {map: xeen_dd05, name: "Humble the Cleric"}
      - {map: xeen_dd05, name: "Disc"}
      - {map: xeen_dd05, name: "Castleview Vale"}
    maps:
      - {map: xeen_d1, focus: "Western Tower", caption: "The tower is in the north-west of the vale; the rope hangs on its north wall."}
      - {map: xeen_dd05, focus: "Key to the Western Tower", show: [exit, door], caption: "All four floors drawn as one plan: the key is on the altar in the top floor's chapel, the front door at the south end of the ground floor."}

  - quest: q-d7
    from: {map: xeen_d1, npc: "Linus"}
    to: {map: xeen_d1, npc: "Linus"}
    summary: "Four gemsmiths outside Castleview each make a piece of gem gear from five rocks of their gem and a few gems. Repeatable."
    requires: "Rocks from the Gemstone Mines. Diamonds come only from the north pocket, reached from the Forbidden Zone (Act V)."
    steps:
      - "The gemsmiths' row is in the north-west of the vale, west to east: Linus (ruby, 2 gems), Simon (emerald, 4 gems), Toby (sapphire, 6 gems), Hector (diamond, 10 gems). Ask any of them about his work to start the note."
      - "Rubies and emeralds: the timbered adit just east of Hector's leads into the Gemstone Mines' west pocket. Five ruby veins and five emerald veins give one rock each; click a vein to work it."
      - "Sapphires: the east pocket's adit is on the Sprite Forest map (D2), in the hills of its north-west. Go through the adit's door and follow the upper drift north, then east into the sapphire hall: its five sapphire veins are in the walls (a sixth glint is no vein)."
      - "Diamonds: the north pocket's adit is in the Forbidden Zone (D6). It has five diamond veins."
      - "Bring five rocks of one kind to its smith and ask about his work again. Any gem items count as the fee; the cheapest are taken first."
      - "To refill the veins, pay the God of Minerals at the bottom of the east pocket 10,000 gold. He takes it only after you have dug something ('The mountains are full. Empty them first.'). Each pocket refills the next time you enter it; leave and come back in."
    tips:
      - "A spent vein says 'You've got all this vein has to offer.'"
      - "Each smith makes one fixed item, again for every five rocks. Ruby Broadsword: +10 Might, +20 Fire resistance. Emerald Leather: +15 Endurance, +20 Earth resistance. Sapphire Staff: +15 Intellect, +20 Water resistance. Diamond Plate: +10 Armor Class, +15 all resistances."
      - "The west pocket's far drift has spiders."
    reward: "No experience. One gem item per five rocks: Ruby Broadsword, Emerald Leather, Sapphire Staff or Diamond Plate."
    points:
      - {map: xeen_d1, name: "Simon"}
      - {map: xeen_d1, name: "Toby"}
      - {map: xeen_d1, name: "Hector"}
      - {map: xeen_d1, name: "Gemstone Mines, west pocket"}
      - {map: xeen_d2, name: "Gemstone Mines, east pocket"}
      - {map: xeen_d6, name: "Gemstone Mines, north pocket"}
      - {map: xeen_dd10b, name: "God of Minerals"}
    maps:
      - {map: xeen_d1, focus: "Linus", caption: "The four smiths stand in a row in the north-west of the vale, the west pocket's adit just east of them."}
      - {map: xeen_dd10b, focus: "God of Minerals", caption: "The east pocket: the God of Minerals at the bottom, the sapphire veins in the north."}

  # ---- Castleview Vale and Sandcaster: Vespar's Staff ----------------------------------------------------------------
  - quest: q-d8
    from: {map: xeen_d1, npc: "Vespar"}
    to: {map: xeen_d1, npc: "Vespar"}
    summary: "Find the emerald handle that fell off Vespar's staff on the road from Sandcaster. In return he gives you the mended staff."
    requires: "Nothing."
    steps:
      - "Vespar's House stands alone in the north-east of Castleview Vale, well outside Castleview's walls. Click the door and pick 'Emerald handle'. He asks you to find it."
      - "Go to Sandcaster and the Aging Forest. Kramer's Caravans in Castleview run there on Tuesdays and Fridays (3 days), or walk east through Sprite Forest."
      - "The handle lies in a roadside ruin south-east of Sandcaster's walls, on the way to the Crossroads stalls. Click the Rubble: 'You found an emerald handle.'"
      - "Go back to Vespar and pick 'Emerald handle' again. He takes the handle and gives you his staff."
    tips:
      - "The rubble gives the handle only once. If you click it again it says 'Rubble, and nothing green in it.'"
    reward: "5,000 XP for each member and Vespar's Staff (an artifact)."
    points:
      - {map: xeen_d3, name: "Rubble"}
      - {map: xeen_d3, name: "Sandcaster's south gate"}
      - {map: xeen_d3, name: "Sandcaster's east gate"}
    maps:
      - {map: xeen_d1, focus: "Vespar", caption: "Vespar's house is alone in the north-east of the vale."}
      - {map: xeen_d3, focus: "Rubble", caption: "The rubble is south-east of Sandcaster's walls. The city has gates on the south and east sides."}

  # ---- Sprite Forest: Nibbler's Melons ---------------------------------------------------------------------------------
  - quest: q-d9
    from: {map: xeen_d2, npc: "Nibbler"}
    to: {map: xeen_d2, npc: "Nibbler"}
    summary: "Bring Nibbler the monkeydog three Monga melons for something shiny."
    requires: "Nothing."
    steps:
      - "Nibbler's Hollow is in the west of Sprite Forest, beside the great tree with a door in its trunk. Click it and pick 'Monga melons'. He wants three."
      - "Walk off Sprite Forest's west edge to Castleview Vale."
      - "The wild melon patch is in the vale's southern meadows, south-east of Castleview, among centipede nests. Click the Melon vines to pick three Monga Melons. Something with many legs objects, so be ready for centipedes."
      - "One more melon grows at the edge of Pip Melonby's field, just outside Castleview's south wall. Click it if you want a spare."
      - "Go back east to Nibbler and pick 'Monga melons'. He takes three and gives you something shiny he found in the Temple of Bark, a random item."
      - "The door in the great tree's trunk next to his hollow is the Temple of Bark, where Princess Sheewana is held (Princess Sheewana). Nobody locks it."
    tips:
      - "If you bring Nibbler a melon after the quest is done, he eats it."
    reward: "1,000 XP for each member and a random item (treasure level 3)."
    points:
      - {map: xeen_d1, name: "Melon vines"}
      - {map: xeen_d1, name: "Pip Melonby's field"}
      - {map: xeen_d2, name: "Temple of Bark"}
    maps:
      - {map: xeen_d2, focus: "Nibbler", caption: "Nibbler's hollow is next to the great tree, the door of the Temple of Bark."}
      - {map: xeen_d1, focus: "Melon vines", caption: "The melon patch is in the southern meadows, south-east of Castleview. Pip's field is by the south wall."}

  # ---- Sprite Forest: Princess Sheewana (Ranger Lord, Light) -----------------------------------------------------------
  - quest: q-d10
    from: {map: xeen_d2, npc: "Sharla"}
    to: {map: xeen_d2, npc: "Sharla"}
    summary: "Free Princess Sheewana of the Sprites from Shaalth's Orcs in the Temple of Bark."
    requires: "Nothing. The temple's door is not locked. The polite route is the Light tier-2 promotion for Hunters: each Hunter becomes a Ranger Lord. Light and Dark are chosen per character. A Hunter promoted here can no longer become a Bounty Hunter (Kramer's bounty, Graalg's Ogres), and the reverse is also true."
    steps:
      - "Sharla's Treehouse is in the sprites' treehouse village in the south-west of Sprite Forest. Pick 'Sheewana'. She asks for help, then you choose how to answer."
      - "Choose one answer. 'Certainly' is the polite route: 2 Energy Disks, 1,000 gold and the Ranger Lord promotion. 'What's in it for us?' is the mercenary route: 2 Energy Disks and 3,000 gold, but no promotion. 'This is a stick up!' is the robbery route: the village sprites turn hostile for good."
      - "Enter the temple through the door in the great tree's trunk, next to Nibbler's Hollow (OK in the entrance window). Past the entrance a voice booms: 'Feed the roots and the tree shall bear fruit! Feed the limbs and suffer the wrath of BARKMAN!'"
      - "Take the root stair west down to the root cellar. Each of the two root alcoves there asks 'Feed me! Give gem?'. Pay one gem at each and get an Energy Disk from each. Feed only the roots. A gem in a limb alcove higher up wakes Barkman, an optional level-60 fight."
      - "Optional: in the pens south-west of the root cellar, pull the lever to open the cages. Talk to Nathan and Sky ('Thanks'). Then go back up to the entrance hall, north and then east through the guardroom door, and up the back stair to the cell row, and talk to Snog and Alicia the Just. Each prisoner gives 500 XP for each member."
      - "Shaalth's hall is south of the cell row. Click the cage: it is locked, and Shaalth carries the key. Kill Shaalth the Orc King (level 30) and his shamans and captains. Then click the cage again: 'Shaalth's key turns in the cage lock.'"
      - "Talk to Princess Sheewana ('Home'). That frees her and gives the quest's experience. She goes home to Sharla's treehouse."
      - "Leave by the trunk door and go back to Sharla: pick 'Sheewana' and she pays according to the answer you gave."
    tips:
      - "Optional, east of Shaalth's hall: the Book of Ascension in the Disciples' chapel gives the dial order. Set the West dial to 1, the North dial to 2 and the East dial to 3. Each dial starts at 1, and every 'Turn? Yes' adds one. Then pull the lever and drink the Crystal Water: the whole party becomes Disciples of Bark, and the Disciples' door to a treasure vault opens."
      - "Don't drink the Dark Water or the Orc Shaman's tea. Both poison you."
      - "Robbery route: kill every sprite in the treehouse village to open the chest in Sharla's tree, which holds 2 Energy Disks. The village is hostile afterwards. Robbers get the chest's 2 disks and nothing from Sharla."
      - "The four fountains in the south-east corner of the temple give +5 to a resistance, once per character."
      - "A Hunter who joins later can still be promoted on the polite route: Sharla then has a 'Forest lords' topic."
    reward: "Sheewana freed: 6,000 XP for each member. Sharla: 2 Energy Disks, plus 1,000 gold and Hunter to Ranger Lord on the polite route, or 3,000 gold on the mercenary route; nothing on the robbery route. The two root alcoves give 2 more Energy Disks."
    figures:
      - img: bark_dials.webp
        caption: "The Disciples' chapel east of Shaalth's hall: set the west, north and east dials to 1, 2 and 3, pull the lever, then drink the Crystal Water."
    points:
      - {map: xeen_d2, name: "Temple of Bark"}
      - {map: xeen_d2, name: "A sprite's chest"}
      - {map: xeen_dd09, name: "Root alcove"}
      - {map: xeen_dd09, name: "Cage"}
      - {map: xeen_dd09, name: "Shaalth"}
      - {map: xeen_dd09, name: "Princess Sheewana"}
      - {map: xeen_dd09, name: "Book of Ascension"}
      - {map: xeen_dd09, name: "Crystal Water"}
    maps:
      - {map: xeen_dd09, show: [exit, lever, door], focus: "Cage", caption: "Trunk door in the centre-west, root cellar and pens to the west, cells to the north, Shaalth's hall and the chapels to the east."}
      - {map: xeen_d2, focus: "Sharla", caption: "Sharla's treehouse village is in the south-west. The temple door is the great tree by Nibbler's Hollow."}

  # ---- Castleview and Ogre Pass: Graalg's Ogres (Bounty Hunter, Dark) -------------------------------------------------
  - quest: q-d11
    from: {map: xeen_d1, npc: "Kramer"}
    to: {map: xeen_d1, npc: "Kramer"}
    summary: "Stop Graalg's Ogres robbing Kramer's caravans in Ogre Pass, either by making peace with Graalg or by burning both ogre forts."
    requires: "Nothing. Burning both forts is the Dark tier-2 promotion for Hunters: each Hunter becomes a Bounty Hunter. Light and Dark are chosen per character. A Hunter promoted here can no longer become a Ranger Lord (Princess Sheewana's polite route), and the reverse is also true."
    steps:
      - "Kramer's Caravans is on the east side of Castleview. Pick 'Ogres'. He pays to be rid of the ogres, and adds a bounty if both their forts burn."
      - "Walk off Castleview Vale's east edge to Sprite Forest. Ogre Pass is in the north-east, with Graalg's west and east forts. Graalg stands between them and talks while you are at peace."
      - "Peace route: talk to Graalg and pick 'Bow low, slave!'. It makes him laugh and calls you friends. 'Gifts' does the same but costs 1,000 gold. Then pick 'Energy disks': he gives you two and lets the caravans pass. Do not pick 'Pharaoh's oath', which starts a fight at once."
      - "War route: enter each fort through its gate. In the west fort, go through the blockhouse's double door to the fire pit at the north end of the hall. In the east fort, the pit is at the south end. At each pit the game asks 'You've found an Ogre fort, but the Ogres are out hunting. Burn?'. Answer Yes."
      - "On the war route, also open Graalg's strongbox in the east fort. It holds 2 Energy Disks, but only if you have not made peace."
      - "Go back to Kramer and pick 'Ogres'. If both forts burned, he also offers 'Bounty'. Pick it for the bounty and the promotion."
    tips:
      - "You can still burn the forts after making peace. Graalg and the pass ogres then turn hostile, and you keep the disks he gave you. This lets a peaceful party's Hunters become Bounty Hunters."
      - "Burning a fort turns Graalg and every ogre in the pass hostile."
      - "A Hunter who joins later can still be promoted: Kramer's 'Guild title' topic promotes him after the bounty."
    reward: "Kramer: 4,000 XP for each member and 1,500 gold. The bounty adds 1,000 XP for each member, 1,000 gold and Hunter to Bounty Hunter. Either route also gives 2 Energy Disks, from Graalg or from his strongbox."
    points:
      - {map: xeen_d2, name: "Graalg"}
      - {map: xeen_d2, name: "Ogre Forts"}
      - {map: xeen_dd13, name: "Fire pit"}
      - {map: xeen_dd13, name: "Graalg's strongbox in the east fort"}
    maps:
      - {map: xeen_d2, focus: "Graalg", caption: "Ogre Pass is in the north-east of Sprite Forest. Graalg stands between the two fort gates."}
      - {map: xeen_dd13, show: [exit, door], focus: "Fire pit", caption: "West fort on the left (pit to the north), east fort on the right (pit to the south, strongbox in the middle)."}

  # ---- Castleview Vale: Yog's Barbarians -------------------------------------------------------------------------------
  - quest: q-d12
    from: {map: xeen_d1, npc: "Yog"}
    summary: "Yog, chief of the Sardaj barbarians, asks whether you came to his lands for battle. Answer with peace or war."
    steps:
      - "The Sardaj camp is on the north edge of Castleview Vale, north-east of Castleview. Talk to Yog among the tents."
      - "Peace: pick 'We come in peace'. The Sardaj become your friends and the quest is done. Then pick 'Help against Alamar': he fills your packs with food and later says 'Tell Gurodel that Yog sent you.'"
      - "War: pick 'Battle!'. The Sardaj turn on you. Kill them, then click a Sardaj tent: 'You have found a Barbarian camp. Destroy?' Answer Yes to burn the camp and take its small hoard of gold."
    tips:
      - "Gurodel's giants are friendly unless you fight the Sardaj. War, or a burnt camp, turns them hostile as well: Gurodel will not talk, and only the bloody throne in the Giants' Hall gives his two disks."
      - "Yog's 'Energy disks' topic gives nothing: the ogres stole them (Graalg's Ogres)."
      - "After 'Battle!', the Sardaj around you may stay peaceful until you leave the map and come back."
    reward: "Peace: 1,000 XP for each member and 10 food. War: no experience, 800 gold from the burned camp, plus whatever the barbarians drop."
    points:
      - {map: xeen_d1, name: "A Sardaj tent"}
    maps:
      - {map: xeen_d1, focus: "Yog", caption: "The Sardaj camp is on the vale's north edge, north-east of Castleview."}

  # ---- Sprite Forest: Hobstadt's Trolls (War Troll, racial) ------------------------------------------------------------
  - quest: q-d13
    from: {map: xeen_dd11c, npc: "Hobstadt"}
    to: {map: xeen_dd11c, npc: "Hobstadt"}
    summary: "The Thieves' Guild wants back the gold the trolls stole. Hobstadt the Troll King lets you take it for gold, for one of your number, or after a fight."
    requires: "Nothing. This is the racial promotion for Trolls: each Troll in the party becomes a War Troll."
    steps:
      - "The troll holes are three pits in the floor of Sprite Forest, south of the centre. Click one and choose OK in the entrance window to drop into its pocket of the Troll Holes. Each pocket has one way out, a sod hatch at its west end."
      - "Optional, in the first pocket (the northern hole): push the boulder aside and climb the bone slope to a dead thief. His letter starts the quest: 'The Trolls have stolen our gold. Get it back no matter the cost!'"
      - "Hobstadt is in the third pocket (the southern hole). Walk east through the gate into his hall. When you step onto the plate across the hall he talks to you without being clicked. You can also click him while you are at peace."
      - "Give gold: he takes 2,000 gold, and you need at least that much. Sacrifice one: works only with a Troll in the party, who spends the night with him and comes back a War Troll. Without a Troll he refuses. Fight to the death: he and his court attack."
      - "After gold or the sacrifice you are his friends. He says 'Thief gold in back. Hobstadt not like thieves. Take.' Click the Sacks in the hoard room behind the throne, through the hall's east wall."
      - "If you fought him: when he dies, a Troll in your party can sit on the vacant throne and stands up a War Troll. The hoard is open to his killers too."
    tips:
      - "The Troll Juice vat in the second pocket gives each member +2 Endurance once, and poisons them."
      - "A Troll who joins later is still promoted. After a sacrifice, pick 'Sacrifice one' again. After the fight, have him sit on the throne."
      - "The hoard room's strongbox holds more treasure."
    reward: "The hoard: 4,000 XP for each member and 2,500 gold. Each Troll becomes a War Troll by the sacrifice or the throne."
    points:
      - {map: xeen_d2, name: "Troll Holes, third pocket"}
      - {map: xeen_d2, name: "Troll Holes, first pocket"}
      - {map: xeen_dd11a, name: "Dead thief"}
      - {map: xeen_dd11c, name: "Sacks"}
      - {map: xeen_dd11c, name: "The vacant throne after Hobstadt's death"}
    maps:
      - {map: xeen_dd11c, show: [exit, door], focus: "Hobstadt", caption: "Hobstadt's throne is at the east end of the third pocket. The hoard sacks are just behind it."}
      - {map: xeen_d2, focus: "Troll Holes", caption: "The three troll holes are south of the centre of Sprite Forest. The southern one leads to Hobstadt."}

  # ---- Sandcaster: the Wizard Quarter (Spy, Light) ---------------------------------------------------------------------
  - quest: q-d14
    from: {map: xeen_d3, npc: "Astra"}
    to: {map: xeen_d3, npc: "Astra"}
    summary: "Kill Xenoc the Wizard and Morgana the Sorceress, who seized Sandcaster's guilds from behind the guild gate."
    requires: "Nothing. This is the Light tier-2 promotion for Rogues: each Rogue becomes a Spy. Light and Dark are chosen per character. The Dark choice for Rogues is Assassin, in The Southern Tower, and a Rogue promoted on one path cannot take the other."
    steps:
      - "Astra's House is in the north of Sandcaster, next to the guild gate. Pick 'Xenoc and Morgana', then 'We will help'. ('Not our affair' only makes her ask again later.)"
      - "Click the guild gate a few steps away and choose OK in the entrance window. This takes you into the Wizard Quarter, a court with iron golems."
      - "Xenoc: go through the Mirage Guild's double doors west of the court, through the foyer and the hall of illusions, and up the Mirage stair to the gallery. At the gallery's west end, click the mirror: 'In the mirror, the blank wall behind you has a door in it.' Walk east through that blank wall into the Hall of Mirages and kill Xenoc (level 60)."
      - "Draw the bolt on the wall beside the bridge door, north-east of Xenoc's hall. The door opens. Cross the covered bridge east to the scrying room, on the upper floor of the Sorceress HQ's side."
      - "A ward of light seals Morgana's door and draws on two lamps, one above and one below. Snuff the lamp in the scrying room ('Snuff it? Yes'). Then go down the HQ stair, through the Robing room door, and snuff the second lamp. 'The ward flickers and goes out.'"
      - "Go back up the stair into Morgana's sanctum in the north-east and kill Morgana (level 60) and her Grand Sorceresses."
      - "Leave by the guild gate, south of the court, and pick 'Xenoc and Morgana' at Astra's."
    tips:
      - "In the Guild Common, Blastem's 'Boots licked' gives the mirror hint. 'The lesson' turns him into a hostile Sorcerer."
      - "The Orange and Purple Potions in two alcoves at the foot of the Mirage stair give each member +2 Intellect and +2 Speed, once per character."
      - "The Font gives 2,000 spell points."
      - "A Rogue who joins later can still be promoted: Astra then has 'The guilds' word'."
    reward: "10,000 XP for each member and Rogue to Spy. The quarter's houses open: the Guild of Night, Esoterica, and the Mindwright's, Appraiser's and Alembic towers (Grandmaster teachers of Mind Magic, Identify Item and Alchemy)."
    points:
      - {map: xeen_d3, name: "Wizard Quarter"}
      - {map: xeen_d3, name: "The Guild of Night"}
      - {map: xeen_dd19, name: "Mirage Guild"}
      - {map: xeen_dd19, name: "Xenoc"}
      - {map: xeen_dd19, name: "Bolt"}
      - {map: xeen_dd19, name: "Robing room"}
      - {map: xeen_dd19, name: "Morgana"}
    maps:
      - {map: xeen_dd19, show: [exit, door, lever], focus: "Xenoc", caption: "Xenoc's guild is to the west, Morgana's HQ and sanctum to the east. The guild gate is at the south."}
      - {map: xeen_d3, focus: "Astra", caption: "Astra lives beside the guild gate in the north of Sandcaster."}

  # ---- The Crossroads and Magic Mountain: Caleb's Magnifying Glass -----------------------------------------------------
  - quest: q-d15
    from: {map: xeen_d3, npc: "Caleb"}
    to: {map: xeen_d3, npc: "Caleb"}
    summary: "Recover Caleb the Inventor's magnifying glass from the gargoyles' lair on Magic Mountain, and destroy the lair."
    steps:
      - "Caleb's Workshop is a stall at the Crossroads, east of Sandcaster's walls. Pick 'Magnifying glass'."
      - "Go north to Lakeside and Blackfang: walk off the north edge (7 days), or take the caravan from inside Sandcaster to Lakeside on Sundays (3 days). The lair is a cave in the crags of Magic Mountain, north-west of Lakeside, under the gargoyles' perches. Click it and choose OK in the entrance window."
      - "Inside, go north up the guano slope into the perch hall. Climb the rock ramp behind its west wall to the upper perches and follow the ledge north to the roost, or go east through the still gallery and up the rock steps north to the roost."
      - "Click a roosting rock: 'Do you wish to destroy the Gargoyle Lair?' Answer Yes to pound the rocks to powder."
      - "The gargoyles' nest of shiny things is just north of the roost. Click the Nest to take the glass, with 'CALEB' scratched on the handle."
      - "Go back down the rock steps to the cave mouth, return to Caleb and pick 'Magnifying glass'."
    tips:
      - "The nest gives up the glass only after the roost is destroyed: before that, every gargoyle on the rocks turns its head as you reach for it."
      - "Mountain gargoyles, sentinels and overlords (levels 30-45) circle the crags outside the cave."
    reward: "5,000 XP for each member, 2,000 gold and a random item (treasure level 4)."
    points:
      - {map: xeen_d4, name: "Gargoyle Lair"}
      - {map: xeen_dd23, name: "Roosting rock"}
      - {map: xeen_dd23, name: "Nest"}
    maps:
      - {map: xeen_dd23, show: [exit], focus: "Nest", caption: "Enter at the south. The roost and the nest are at the top of the climb, in the north-east."}
      - {map: xeen_d4, focus: "Gargoyle Lair", caption: "The lair's cave is in Magic Mountain's crags, north-west of Lakeside."}

  # ---- Desert of Doom: Gurodel's giants ------------------------------------------------------------------------------
  - quest: q-d16
    from: {map: xeen_d5, npc: "Gurodel"}
    to: {map: xeen_d5, npc: "Gurodel"}
    summary: "Gurodel, King of the People, can give you two Energy Disks in friendship, or you can take them from the bloody throne in his hall by force."
    requires: "Nothing. If you went to war with Yog's Sardaj barbarians in Castleview Vale (Yog's Barbarians: 'Battle!' or a burned camp), the People are already your enemies, and only the war route is left."
    steps:
      - "Gurodel sits by the giants' fire in the north-east of the Desert of Doom, east of Bosco's Hall and the Northern Tower. The Giants' Hall doors are just north of his fire. The giants around him are peaceful. Do not strike one of them."
      - "Ask 'The People'. Gurodel asks what you want of the People, and you choose a route."
      - "Peace: choose 'Friendship'. Gurodel gives you two Energy Disks on the spot. The People stay friendly, and you can walk through the Giants' Hall in peace. Its throne and hoard chest refuse you ('Gurodel would notice.')."
      - "War: choose 'Your hall'. All the People turn hostile, on the desert and in the hall. Enter the Giants' Hall by its great doors. The giants shout their challenge at the threshold."
      - "War, continued: fight up the long hall and the Great Stair to the throne hall at the north end. Cyclopes and Giants guard the hall, with Elder Giants (level 58) around the throne."
      - "War, continued: click the bloody throne: 'You search the bloody throne and find two energy disks.' The People's hoard chest, behind the door north-west of the throne, opens at war and holds 5,000 gold and treasure."
      - "Take the disks to Ellinger for Castle Kalindra (The Four Stages)."
    tips:
      - "The law stone in the long hall, west of the entrance, only carries the People's law. Reading it does nothing."
      - "Do not take Gurodel's gift and then attack. One blow at any of the People turns them all hostile, and the throne then gives a friend nothing ('they gave you in friendship')."
      - "The larder chest in the west wing opens at peace too."
    reward: "Peace: 2 Energy Disks and 12,000 XP for each member. War: 2 Energy Disks and 14,000 XP for each member from the throne, plus the hoard's 5,000 gold and treasure and the kills."
    points:
      - {map: xeen_d5, name: "Giants' Hall"}
      - {map: xeen_dd24, name: "The bloody throne"}
      - {map: xeen_dd24, name: "Law stone"}
    maps:
      - {map: xeen_d5, focus: "Gurodel", caption: "Gurodel's fire is in the north-east of the desert, with the Giants' Hall doors just north of it."}
      - {map: xeen_dd24, show: [exit, door], focus: "The bloody throne", caption: "In from the south, up the Great Stair to the throne at the north end. The hoard chest is in the room north-west of the throne."}

  # ---- Desert of Doom: Bosco and the Voweless Knights (Dark promotion: Black Knight, Villain) --------------------------
  - quest: q-d17
    from: {map: xeen_dd25, npc: "Bosco"}
    to: {map: xeen_dd25, npc: "Bosco"}
    summary: "Fetch the Chalice of Protection from the Voweless Knights' Northern Tower for Bosco the Dwarf King, or swear the knights' oath and give it back to them."
    requires: "Nothing gates it (Act V, level about 50). The two routes exclude each other: the Chalice goes to Bosco or to the knights. The oath route is the Dark tier-2 promotion for a Cavalier (to Black Knight) and a Crusader (to Villain). The Light choices for those lines are Dimitri's Test in Castle Kalindra (Cavalier to Champion) and The Heretics of Mok (Crusader to Hero). The choice is per character: a member promoted on one path cannot take the other path's promotion."
    steps:
      - "Bosco's Hall opens north of the Great Pyramid in the Desert of Doom, south-west of the Northern Tower. Bosco is in the King's Hall at the far west end, beyond the gate hall, the great hall and the throne hall. Ask 'Chalice'. He tells you the knights' door stands open and how to answer their voice: without vowels, 'Chlc'."
      - "Optional: in Castleview, Librarian Ormond (Castleview Library) sells 'The Voweless Knights' answers' for 500 gold. The autonote spells out the seven proverbs of the tower's books and the voice's answer."
      - "The Northern Tower stands north-east of Bosco's Hall. Its door is not locked. The Dark Knights inside are hostile until you swear the oath."
      - "Climb the tower: the great stair from the Hall of Arms to the second floor, through the west armoury's door, the west wall stair to the drill floor, then the Stair of Silence to the top floor. Go through the chapter hall's double door."
      - "In the antechamber north of the chapter hall, click the mask. It asks 'Wht d y sk?'. Type Chlc ('aie', the missing vowels, also works). 'Chalice' with its vowels sends you away; nothing is lost, so ask again. The iron door beside the mask opens."
      - "In the chalice room behind the iron door, click the stand to take the Chalice of Protection."
      - "Light route: go back down, leave by the gate, and give the Chalice to Bosco ('Chalice'). He makes you his Royal Taste Testers. Nobody is promoted."
      - "Dark route: instead, click the plaque 'In honor of the Grand Order of Voweless Knights' in the chapter hall while you carry the Chalice, and answer Yes to 'Swear the Voweless oath?'. The knights take the Chalice back, give you two Energy Disks and become friendly. Every Cavalier becomes a Black Knight and every Crusader a Villain. Bosco then turns you away."
    tips:
      - "The tower's seven books each show a proverb without vowels and want it back. Type the whole proverb, or just its vowels in order, for a permanent +1 to one statistic for every member present (once per character). The answers are: Let sleeping dogs lie (Endurance). He who laughs last, laughs best (Personality). The needs of the many outweigh the needs of the few (Might). Love of money is the root of all evil (Luck). Don't look a gift horse in the mouth (Accuracy). A fool and his money are soon parted (Intellect). If wishes were horses, beggars would ride (Speed). A wrong answer only slams the book; try again. The 'Cliff Notes' under the dormitory pillows give the vowels."
      - "In the Hall of Thrones, on the east side of the top floor, sit on the four Emotion Thrones first (depressed, confused, heart broken, insane: each gives its sitter a bad condition), then on the Euphoria Throne. The sitter gets +1 to every statistic, permanently, once per character, and the next member must sit through the four again. A pillow note hints at the order: 'to appreciate the highs one must experience the lows'. The Throne of the Dunce does 50 damage to the party."
      - "A member who becomes a Cavalier or Crusader later can say the oath at the plaque again and is promoted (no pay)."
      - "The roof trapdoor leads up to the Skyroads."
    reward: "Light (Bosco): 2 Energy Disks, 5,000 gold, 14,000 XP for each member and the award Royal Taste Tester. Dark (the oath): 2 Energy Disks, 14,000 XP for each member, Cavalier to Black Knight and Crusader to Villain."
    points:
      - {map: xeen_d5, name: "Bosco's Hall"}
      - {map: xeen_d5, name: "Northern Tower"}
      - {map: xeen_d1, name: "Librarian Ormond"}
      - {map: xeen_dd08, name: "Mask"}
      - {map: xeen_dd08, name: "Chalice"}
      - {map: xeen_dd08, name: "Plaque"}
    maps:
      - {map: xeen_dd08, show: [exit, door], focus: "Mask", caption: "Top floor: the plaque in the chapter hall (west), the mask in the antechamber, the Chalice behind the iron door to the north."}
      - {map: xeen_d5, focus: "Northern Tower", caption: "Bosco's Hall is north of the Great Pyramid. The Northern Tower is north-east of it."}

  # ---- Sandcaster: Thaddeus's jewel (Light promotion: Archmage) --------------------------------------------------------
  - quest: q-d18
    from: {map: xeen_d3, npc: "Thaddeus"}
    to: {map: xeen_d3, npc: "Thaddeus"}
    summary: "Recover the Jewel of Ages from the mages of the Great Eastern Tower so that Thaddeus can restore the Fountain of Youth."
    requires: "The Southern Tower started first. Its thieves' ledger says where the jewel went, and Thaddeus names the place once you have read it. The Great Eastern Tower itself is not locked. Ellinger's letter on the tower's top floor is the Light tier-2 promotion for a Wizard (to Archmage). The Dark choice for Wizards is Sandro's Heart (Lich). The choice is per character."
    steps:
      - "Thaddeus lives in the Fountain Keeper's Hut by Venom Pond, south-east of the middle of the Sandcaster map. Ask 'Jewel of Ages'. Until you have read the ledger, he only points you to the Great Southern Tower. Once you have read it, he names the Eastern Tower."
      - "The Great Eastern Tower stands on a knoll near the eastern rim of the map, north-east of Thaddeus's hut. Its door is not locked: click it and choose OK in the entrance window."
      - "Inside, take the first stair up to the second floor and the second stair to the third. The vault is shut by a door of light fed by two beams: shatter the west pylon in the conjury, then go through the wall passage and shatter the east pylon in the scrying room. The door fades."
      - "In the vault, the Jewel of Ages lies on its stand: pick it up like any item. Click the disc in the alcoves beyond it to take two Energy Disks."
      - "Take the third stair to the top floor. In the study, open the writing box on the desk, a chest: it holds Ellinger's Sealed Letter, addressed 'To the Guildmaster of Sandcaster'."
      - "Leave the tower (on the top floor, the floating disc in the well takes you back down to the ground floor; the exit is the west door). Show Thaddeus the jewel ('Jewel of Ages'). He dips it in the fountain, and you keep the jewel."
      - "For the promotion, take the letter to Nasir in the Sandcaster Guild of Light in the north-west of the map. Choose Nasir, then 'Ellinger's letter': every Wizard becomes an Archmage."
    tips:
      - "On the second floor, the Golden Griffin Statuette for Luna's Statuettes is in the chest in the mages' curio cabinet at the east end of the gallery."
      - "Top floor, once per character: the Book of Fantastic Knowledge in the study gives +2 Intellect, and the Fountain of Minimal Abilities in the laboratory gives +1 to every statistic. Each member must click them himself. The Book of Great Power refuses everyone, always. The Fountain of Life heals."
      - "Afterwards the Fountain of Youth beside Thaddeus's hut removes magical aging, for example the years the hornets of the Aging Forest take. Before that, its water is venom."
      - "A Wizard who joins later can still ask Nasir: the 'Archmage's robes' topic promotes him (no pay)."
    reward: "8,000 XP for each member (Thaddeus), the Jewel of Ages (kept), 2 Energy Disks, and Wizard to Archmage from Nasir."
    points:
      - {map: xeen_d3, name: "Eastern Tower"}
      - {map: xeen_d3, name: "The Fountain of Youth"}
      - {map: xeen_d3, name: "Sandcaster Guild of Light"}
      - {map: xeen_dd07, name: "Jewel of Ages"}
      - {map: xeen_dd07, name: "The top floor's study"}
      - {map: xeen_dd07, name: "Door of light"}
    maps:
      - {map: xeen_d3, focus: "Thaddeus", caption: "Thaddeus's hut by Venom Pond. The Eastern Tower is north-east, near the rim. Sandcaster's Guild of Light is in the north-west."}
      - {map: xeen_dd07, show: [exit, door, lever], focus: "Jewel of Ages", caption: "One plan for all floors: the vault and its disc on the third floor (east), the study and books on the top floor (north-west)."}

  # ---- Sprite Forest: the thieves' tower (Dark promotion: Sniper, Assassin) --------------------------------------------
  - quest: q-d19
    from: {map: xeen_d3, npc: "Thaddeus"}
    to: {map: xeen_d3, npc: "Thaddeus"}
    summary: "Search the thieves' Great Southern Tower and find out who bought the stolen Jewel of Ages and Luna's statuettes."
    requires: "Nothing. The Master Thief at the top is the Dark tier-2 promotion for a Warrior Mage (to Sniper) and a Rogue (to Assassin). The Light choices are Luna's Statuettes (Warrior Mage to Master Archer) and The Wizard Quarter (Rogue to Spy). The choice is per character."
    steps:
      - "Ask Thaddeus 'Southern Tower' in the Fountain Keeper's Hut by Venom Pond (Sandcaster map). A fleeing thief bragged of the Great Southern Tower, and Thaddeus sends you there."
      - "The tower is in the south-east of Sprite Forest, in the woods south of Ogre Pass. Its door says NO THIEVES, but it is not locked: click it and choose OK in the entrance window."
      - "Ground floor: go through the tapestry hall and the kennel gate to the west room. A memo by the first gong gives both secrets: ring each gong three times, and the Ali Baba chest's word is 'open sesame'. Click the gong and answer 3. The stair door beside it opens."
      - "Second floor (the den): in the fence's room, the lockbox holds the Strongroom Key. In the treasury in the south-east corner, click the Ali Baba chest and answer open sesame. Among the thieves' takings is a receipt: 'One jewel. Delivered to the Eastern Tower.' Ring the second gong (east side) three times."
      - "Third floor (the practice floor): the pressure plates on the trap walk are disarmed. The Strongroom Key opens the strongroom's iron door, and its chest holds two Energy Disks. Ring the third gong (west side) three times."
      - "Top floor: the Master Thief waits in the counting room. For the promotion, ask 'Inner circle': every Rogue becomes an Assassin and every Warrior Mage a Sniper. Without such members he lets you go, and the topic stays for later. Do not attack him: once he is dead, the Dark promotion is gone."
      - "Read the ledger on the counting-room desk. The Jewel of Ages and the Griffin went to the mages of the Eastern Tower, the Dragon to the Head Witch of Lakeside, the Pegasus to the head heretical cleric of the Western Tower."
      - "Take the getaway hatch beside the counting room: a chute drops you into the straw by the front door. Tell Thaddeus ('Southern Tower')."
    tips:
      - "The answer '3' works on each gong. A wrong count only makes the gong boom, so try again."
      - "In the library, the Manual of Master Thievery gives each member who reads it 1,500 XP, once. The Prince Book gives +2 Luck to a member who sat on the Prince of Thieves' throne in the Sphinx (The Sphinx)."
      - "A button behind the tapestry on the ground floor opens an illusory wall."
      - "Members who become Rogues or Warrior Mages later can ask the Master Thief 'New members' (no pay), as long as he lives."
      - "The disks go to Ellinger (The Four Stages)."
    reward: "5,000 XP for each member and 1,500 gold from Thaddeus, 2 Energy Disks, and Rogue to Assassin and Warrior Mage to Sniper from the Master Thief."
    points:
      - {map: xeen_d2, name: "Southern Tower"}
      - {map: xeen_dd06, name: "Memo"}
      - {map: xeen_dd06, name: "Gong"}
      - {map: xeen_dd06, name: "Ledger"}
      - {map: xeen_dd06, name: "The Master Thief"}
    maps:
      - {map: xeen_d2, focus: "Southern Tower", caption: "The Southern Tower is in the south-east woods of Sprite Forest."}
      - {map: xeen_dd06, show: [exit, door, lever], focus: "Gong", caption: "One plan for all floors: the gongs by the stair doors, the Ali Baba chest in the south-east corner, the Master Thief and the ledger in the middle."}

  # ---- Castleview Vale: Luna's altar (Light promotion: Master Archer) ---------------------------------------------------
  - quest: q-d20
    from: {map: xeen_d1, npc: "Luna"}
    to: {map: xeen_d1, npc: "Luna"}
    summary: "Bring Luna the Druid the three golden statuettes stolen from her altar: the Pegasus, the Dragon and the Griffin."
    requires: "Each statuette lies in another quest's dungeon. For the Pegasus, the Western Tower of Mok (The Heretics of Mok). For the Dragon, the Lakeside sewer (The Coven). For the Griffin, the Great Eastern Tower (The Jewel of Ages). The altar is the Light tier-2 promotion for a Warrior Mage (to Master Archer). The Dark choice is the Master Thief's inner circle in The Southern Tower (Sniper). The choice is per character."
    steps:
      - "Luna stands in her grove in the west of Castleview Vale, south of the Western Tower of Mok. Ask 'Statuettes'. She sends you to the thieves of the Great Southern Tower, whose ledger says who bought each statuette."
      - "Pegasus: in the Western Tower of Mok, the Golden Pegasus Statuette lies in the north alcove of the ground floor's hall of alcoves (the west and east alcoves hold the disks). Pick it up like any item. The front door opens once you have unlocked it from inside with the Cult Leader's key (The Heretics of Mok). Until then, the only way in is the heretics' rope on the north wall, which takes you to the top floor."
      - "Dragon: in Lakeside, give a wrong answer at the Guild's door (for example 'broom'). The floor drops you into the sewer's sump. Follow the main drain east past the cross, where you are ambushed, then the east drain and the outfall north to a niche near the map's east edge. A dead man's journal lies two steps short of it. The Golden Dragon Statuette lies at the foot of the niche: pick it up like any item."
      - "Dragon, continued: go back along the ledge to the outfall and south into the jetty shaft. Its ladder climbs to the grate by Lakeside's jetty."
      - "Griffin: in the Great Eastern Tower near Sandcaster, take the first stair up and follow the second floor's gallery east to the mages' curio cabinet. Open the chest in it and take the Golden Griffin Statuette."
      - "Give each statuette to Luna ('Statuettes'). Each one pays on its own."
      - "With all three on the altar, choose 'The altar'. Every Warrior Mage becomes a Master Archer."
    tips:
      - "Rhett, freed from the coven's cells (The Coven), also says the dragon statuette is in the sewer below them."
      - "A Warrior Mage who joins later can ask Luna 'The altar's light' (no pay)."
    reward: "For each statuette, 3,000 XP for each member and a random item (treasure level 5): 9,000 XP each in all. The altar: Warrior Mage to Master Archer."
    points:
      - {map: xeen_d1, name: "Western Tower of Mok"}
      - {map: xeen_dd05, name: "Golden Pegasus Statuette"}
      - {map: xeen_dd20, name: "Golden Dragon Statuette"}
      - {map: xeen_dd07, name: "Cabinet"}
      - {map: xeen_d4, name: "Lakeside Guild"}
    maps:
      - {map: xeen_d1, focus: "Luna", caption: "Luna's grove is in the west of the vale. The Western Tower of Mok is north of it."}
      - {map: xeen_dd20, show: [exit], focus: "Golden Dragon", caption: "The sump lies under the square before the Guild's door, in the west of the sewer. The Dragon's niche is at its east end, past the outfall, with the jetty shaft's ladder just south."}

  # ---- Lakeside and Blackfang: Ector the Woodsman -----------------------------------------------------------------------
  - quest: q-d21
    from: {map: xeen_d4, npc: "Ector"}
    to: {map: xeen_d4, npc: "Ector"}
    summary: "Find the ring Ector the Woodsman lost in a woodpile on Magic Mountain."
    steps:
      - "Ector stands by his cabin in the Forest of Peril, in the west of the Lakeside map. Ask 'The ring'."
      - "The woodpile is north-east of him, on the lower slopes of Magic Mountain. Mountain Gargoyles (levels 30 to 45) roost on the crags above it."
      - "Click the woodpile: 'Under the third log you find a heavy iron ring.' Before Ector has asked you, the pile is only firewood."
      - "Show Ector the ring ('The ring'). He lets you keep it."
    tips:
      - "Ector's Ring: +10 Might, +10 Endurance and regeneration."
    reward: "Ector's Ring, 3,000 XP for each member and a random item (treasure level 5)."
    points:
      - {map: xeen_d4, name: "Woodpile"}
    maps:
      - {map: xeen_d4, focus: "Ector", caption: "Ector's cabin in the Forest of Peril. The woodpile is north-east, under the gargoyle crags."}

  # ---- Lakeside: the coven (Dark promotion: Warlock) --------------------------------------------------------------------
  - quest: q-d22
    from: {map: xeen_d4, npc: "Naomi"}
    to: {map: xeen_d4, npc: "Naomi"}
    summary: "Free the four prisoners in the coven's cells under the Lakeside Guild and kill the Head Witch to liberate Lakeside, or join the coven."
    requires: "Nothing. Joining is the Dark tier-2 promotion for a Great Druid (to Warlock). The Light choice is Leafpoint's Grove (Arch Druid), which needs Thickbark's trolls cleared on Cloudside (Troll Problem). The choice is per character. A party that has joined can still break the coven later."
    steps:
      - "Naomi is in the stocks on Lakeside's square, by the Guild, in the south-middle of the Lakeside map. Ask 'The coven', then 'Necropolis pass'. She gives you the riddle's answer, 'witch', and says the Head Witch's chest is in her room in the coven's north-west corner."
      - "Click the Lakeside Guild's door. It reads a riddle and asks 'What am I?'. Answer witch (the first letters of the riddle's clues spell it). You get free membership, and from now on the door opens. Go down by the Guild's back stair, the cellar door round the back, into the coven hall."
      - "A wrong answer drops you through the porch into the sewer's sump ('Wrong! Begone fools!'). This bars nothing: from the sewer you can walk up the drain stair past the cells to the coven, or go east past the drain cross to the jetty shaft, climb its ladder to Lakeside and try the door again."
      - "To join (optional, before the Head Witch dies): click the initiation cauldron at the foot of the Guild's stair and answer Yes to 'Drink?'. Every Great Druid becomes a Warlock, and the witches turn friendly. Members may open the Head Witch's chest."
      - "The cells are east of the hall, through the gaol and down the cell stair. Click each of the four cages: Camilla, Aretha, Isabella and Rhett walk out."
      - "Through the double doors north of the hall (the Moon seal), the Head Witch is in her room in the north-west corner. Kill her: Naomi's stocks fall open, and the coven turns hostile. Her chest holds the Pass to Necropolis."
      - "With the Head Witch dead and all four prisoners free, go back up the back stair and talk to Naomi ('The coven'). Lakeside is liberated, and its tavern and other houses open."
    tips:
      - "The cauldron promotes later Great Druids too, but only while the Head Witch lives. Once she is dead, no more Warlocks can be made."
      - "In the coven's brewery, each of the three cauldrons gives the member who tastes it a permanent bonus once: +2 Personality, +2 Endurance, +2 Speed."
      - "Rhett, in the last cage, says the dragon statuette for Luna's Statuettes is in the sewer below."
      - "Keep the Necropolis pass: it opens Necropolis for Sandro's Heart."
    reward: "500 XP for each member per prisoner. From Naomi: 6,000 XP for each member, 2,000 gold and the award Liberated Lakeside (8,000 XP each in all). The Necropolis pass on either route. Joining: Great Druid to Warlock."
    points:
      - {map: xeen_d4, name: "Lakeside Guild"}
      - {map: xeen_dd20, name: "Initiation cauldron"}
      - {map: xeen_dd20, name: "The first cage in the coven's cells"}
      - {map: xeen_dd20, name: "The second cage in the coven's cells"}
      - {map: xeen_dd20, name: "The third cage in the coven's cells"}
      - {map: xeen_dd20, name: "The fourth cage, at the cells' sewer end"}
      - {map: xeen_dd20, name: "Chest"}
    maps:
      - {map: xeen_d4, show: [exit], focus: "Naomi", caption: "Naomi's stocks are by the Lakeside Guild. The back stair down to the coven is the cellar door round the back."}
      - {map: xeen_dd20, show: [exit, door], focus: "Initiation cauldron", caption: "The coven hall and its cauldron, the cells to the east, the Head Witch's room and chest in the north-west corner."}

  # ---- The Forbidden Zone: Sandro's Heart (Dark promotion: Priest of Dark, Lich) -------------------------------------
  - quest: q-d23
    from: {map: xeen_d6, npc: "Master Morbius"}
    to: {map: xeen_dd21, npc: "Sandro's bier"}
    summary: "Fight Sandro the Lich in the sewer under Necropolis, then find the heart he cut out of himself and give it back so he can die."
    requires: "The Necropolis Pass from the Head Witch's chest in the Lakeside Coven (The Coven). Without it Necropolis's gate stays shut. Dark promotion: Sandro's ritual makes Priests into Priests of Dark and Wizards and Necromancers into Liches. The Light routes for these classes are The Heretics of Mok (Priest of Light) and The Jewel of Ages (Archmage). Each character takes one or the other."
    steps:
      - "Necropolis is in the Forbidden Zone, which you reach by following Castleview's north road off the edge of Castleview Vale. Show the pass at Necropolis's gate in the north wall."
      - "Optional: in the Necromancers' House in the south-east of town, ask Master Morbius about 'Sandro'. He tells you where Sandro lives and that a Priest, Wizard or Necromancer who asks nicely might learn his ritual."
      - "Take the crypt stair at the south-east corner of town down into the Necropolis Sewer. Walk south through the Hall of Biers, where two Greater Liches wait, and open the double doors into Sandro's crypt. Sandro rises from his bier and attacks you as soon as you step in."
      - "Kill him (level 65, about 1,850 HP). He falls, then gets up again, peaceful and unkillable. Step onto the dais at the south end of the crypt and he asks for his heart. The grille on the crypt's east side stays locked for now."
      - "Go back north into the hall, take the passage west and the stair down to the lower sewer. Follow it west past the Cinder Roaches, then south and east to the culvert gate south-west of the crypt. It is shut. Go back to the sluice room on the west side, through its door, and turn the sluice wheel on its north wall. The culvert gate rises and stays open."
      - "Go through the culvert gate and down the steps to the lowest culvert at the far south. Click the jar of green glass to take Sandro's Heart."
      - "Come back by the eastern arm of the lower sewer, which loops north and then west to the same stair up. Return to the crypt and step onto the dais. Sandro asks 'Give Sandro his heart?': answer Yes."
      - "If anyone in the party can learn his ritual, he then asks 'Ask Sandro for his ritual first?'. Yes is the Dark route: every Priest becomes a Priest of Dark and every Wizard and Necromancer a Lich, and then he is released. No releases him and promotes nobody. Either way the grille opens. Take the chest behind it and leave by the stair at the north end (Climb up to the Necropolis)."
    tips:
      - "The ritual promotes every eligible member at once. Before you hand in the heart, take any Priest or Wizard who should go the Light way to Dreyfus or Nasir first, or answer No."
      - "After the release, Master Morbius's 'Sandro' topic promotes Priests, Wizards and Necromancers to the Dark classes, unpaid, even if you said No to the ritual. Don't ask him while a member is still waiting for a Light promotion."
      - "The Dead Food barrel in the sewer's east wing gives each member +2 Endurance (permanent, once each). The member who clicks it needs 30 Might to pry the lid off, and the first time two roaches come out."
      - "You can pick up the heart before the fight as well. Sandro still has to be beaten once before he will talk."
    reward: "12,000 XP for each member, the Key to the Dungeon of Death (opens The Dungeon of Death under the Dragon Tower, Mount Firestone) and the reliquary chest (3,000 gold and a random item, treasure level 5). The ritual adds the Dark promotions and no extra pay."
    points:
      - {map: xeen_d6, name: "Necropolis's gate"}
      - {map: xeen_d6, name: "Necropolis Sewer"}
      - {map: xeen_dd21, name: "Dais"}
      - {map: xeen_dd21, name: "Sluice wheel"}
      - {map: xeen_dd21, name: "Culvert gate"}
      - {map: xeen_dd21, name: "Jar of green glass"}
      - {map: xeen_dd21, name: "Grille"}
      - {map: xeen_dd21, name: "Dead Food"}
    maps:
      - {map: xeen_d6, focus: "Master Morbius", caption: "Necropolis: the gate in the north wall, Morbius's house and the crypt stair at the south-east corner."}
      - {map: xeen_dd21, focus: "Jar", caption: "The stair arrives at the north end. Sandro's crypt is in the middle, the sluice wheel to the west, and the heart in the lowest culvert at the far south."}

  # ---- The Desert of Doom: the Enchanted Boulders -------------------------------------------------------------------
  - quest: q-d24
    summary: "Answer the riddle of the seven Enchanted Boulders to claim a dead paladin's armour, then collect the rest of his things from the other boulders."
    steps:
      - "The boulders stand in two clusters in the Desert of Doom. Boulders 3 to 6 and a weathered sign are south-east of the Great Pyramid. Boulders 1, 2 and 7 are far to the west, west of the obelisk."
      - "Read the sign: 'A dying paladin gave all his magical armor to the enchanted boulders of the land for safekeeping.' This is the answer."
      - "Each boulder you click speaks one line of the riddle, one letter each: apple and pear (P), cave and lair (A), fable and tale (L), lark and quail (A), wind but not gale (D), glimpse and sight (I), night but not light (N)."
      - "Click the seventh boulder, the one in the west cluster that asks 'What am I?'. Type PALADIN. You don't need to read the other boulders first."
      - "The boulder crumbles and leaves the Dead Paladin's Armour. Then click each of the other six boulders once more: each one crumbles and leaves one more of the paladin's things."
    tips:
      - "A wrong answer costs nothing ('It is, after all, a boulder'). Click the boulder again to answer again."
      - "The guide's map marks all seven boulders with the same name. The seventh is in the west cluster, with the first and second."
    reward: "10,000 XP for each member and the Dead Paladin's Armour (artifact plate armour), then a random item (treasure level 5) from each of the other six boulders."
    points:
      - {map: xeen_d5, name: "A weathered sign"}
      - {map: xeen_d5, name: "An Enchanted Boulder"}
      - {map: xeen_d5, name: "Great Pyramid"}
    maps:
      - {map: xeen_d5, focus: "weathered sign", caption: "The east cluster and the sign are south-east of the Great Pyramid. The west cluster, with the seventh boulder, is far to the west."}

  # ---- Lakeside and Blackfang: the Minotaur's Labyrinth (racial: Minotaur -> Minotaur Lord) ---------------------------
  - quest: q-d25
    from: {map: xeen_dd12, npc: "Horned throne"}
    summary: "Walk the Soul Maze on the deepest floor of the Dungeon of Lost Souls to the horned throne, which honours Minotaurs."
    requires: "Nothing to reach the throne: the ruined tower's door is not locked. To leave by the aviary's lift at the end you need the Key to the Dungeon of Lost Souls that Megan gives you in Castle Kalindra at the start of the main story's The Songbird of Serenity; without it, go back up the way you came. Racial promotion: every Minotaur in the party becomes a Minotaur Lord. Other classes can sit on the throne too and are paid the same."
    steps:
      - "Take the boat from Lakeside Yachts in Lakeside to the Isle of Lost Souls. Click the ruined tower's door: its two iron-bound leaves groan apart, and OK in the entrance window takes you in."
      - "Go down the dungeon's five floors as in the main story's Songbird of Serenity chapter. Answer Yes at every gate ('Will you find what you came for?'). The statues tell you to Think Positive, and No keeps the gate shut."
      - "The fourth gate takes you down to the Soul Maze. Its corridors are the giant letters of a name (the statues: 'my name in walls for all to see'), and you enter at the M in the east."
      - "Work west letter by letter: the M, an E, then a dead end where a wall is an illusion (click it), with bones and a chest behind it, then the T, and then the L. The horned throne sits in the L, guarded by Minotaur Lords."
      - "Click the throne. The first sitting pays every member and turns each Minotaur into a Minotaur Lord."
      - "Go on west through the last letters, E, H and S, to the fifth gate. Megan's key opens the Songbird's cage beyond it; free the Songbird (the aviary's lift won't move until you do), then ride the lift up to the first floor and leave by the doors to the Isle."
    tips:
      - "A Minotaur who joins later is promoted when he sits on the throne, unpaid. Anyone else who sits again just gets a sore back."
      - "Read from west to east, the letters spell SHELTEM; you walk them backwards. That is the answer to the statues' 'The name found within is the clue to my past'."
    reward: "3,000 XP for each member (first sitting only) and the Minotaur Lord promotion for every Minotaur."
    points:
      - {map: xeen_d4, name: "Lakeside Yachts"}
      - {map: xeen_d4, name: "Dungeon of Lost Souls"}
      - {map: xeen_dd03, name: "Megan"}
      - {map: xeen_dd12, name: "Songbird of Serenity"}
    maps:
      - {map: xeen_dd12, focus: "Horned throne", caption: "The horned throne is in the Soul Maze's L, in the north of the floor plan. The fifth gate and the Songbird are at the maze's west end."}
      - {map: xeen_d4, focus: "Dungeon of Lost Souls", caption: "The boat from Lakeside Yachts lands on the Isle of Lost Souls, just south of the ruined tower."}

  # ---- The Skyroads: the Megadragon (optional superboss) -------------------------------------------------------------
  - quest: q-d26
    summary: "Kill the Megadragon that sleeps on Castle Alamar's roof hatch at the end of its own road on the Skyroads, and take its hoard and the key to the hatch."
    requires: "Optional, for a party near the top of the game. The Skyroads open after the Dragon Pharaoh names you the Chosen Ones."
    steps:
      - "On the Skyroads, follow the dead-end road marked by the 'DANGER! Mega Dragon' signs to the roost on Castle Alamar's roof, in the north-west quarter of the map. The Megadragon (level 125, about 7,750 HP) lies on the hatch and stays within about 1,024 units of it."
      - "If you click the hatch while the dragon lives, you get 'The door is locked. Scratched on the surface are some words: The Megadragon has the key!'"
      - "Kill the Megadragon. It never comes back, even when the map refills."
      - "Open the hoard chest among the bones just north-east of the hatch: Wyrmfang (an artifact two-handed sword), the Key to Castle Alamar's Roof, gold and a random item (treasure level 6)."
      - "Click the hatch: 'Descend to Castle Alamar?' Yes. The key turns and stays in the lock, and from now on the hatch opens both ways. Until the main story's Castle Alamar is done, it leads into Alamar's hatch room, the story's way in by the roof (you need Corak's Soul Box, or you are thrown back up). After that it leads down the shaft into the Alamar Depths."
    tips:
      - "There is no quest experience. The Megadragon's own 16,875 kill experience is shared by the party: 4,218 each in a party of four."
      - "From inside Castle Alamar or the Alamar Depths, the hatch reads 'Bolted from above.' until the key has been used from the roof."
    reward: "Wyrmfang, the Key to Castle Alamar's Roof, the hoard chest (treasure level 6) and the Megadragon's kill experience."
    points:
      - {map: xeen_d7, name: "Megadragon"}
      - {map: xeen_d7, name: "Alamar Depths"}
      - {map: xeen_d7, name: "DANGER!  Mega Dragon"}
      - {map: xeen_dd17, name: "The Skyroads"}
    maps:
      - {map: xeen_d7, focus: "Megadragon", caption: "The roost is at the dead end of the dragon road in the north-west. The hoard chest is just north-east of the hatch."}

  # ---- Darkside: the genie lamps --------------------------------------------------------------------------------------
  - quest: q-d27
    summary: "Rub the genie lamps hidden across the Darkside wilds. Most grant a wish, one tests your greed and one is a trap."
    steps:
      - "Wish lamps grant one of three wishes, once each: Experience (2,000 XP for each member), Gold (10,000 gold) or Gems (ten gems, the Darkside's second currency). There are two in the Desert of Doom: in a ruined hill shrine in the far south-west, south-west of the Shrine of Great Power, and half buried on a high dune crest in the sand sea, south of the east cluster of Enchanted Boulders. There are two in the Forbidden Zone: on the basalt pinnacle between Castle Alamar's moat and the north rim, south-east of the Fountain of Super Resilience, and on the black islet in Corak's lake at the centre of the map, between the travel pyramid and Corak's Pod."
      - "The greedy lamp is on the crag above the broken pyramid in the south-east of the Forbidden Zone, south of Necropolis. The genie offers all of its 10,000 gold. Answer No and it shares 5,000 gold with you. Answer Yes and it takes back up to 5,000 of your own gold."
      - "The Skyroads have three lamps (after the Chosen Ones). The tired genie's lamp is in a crack of the cloud at the Griffin Watch, in the north-west by the 'DANGER! Mega Dragon' signs. The kind genie's is on the East Rest Stop's bench in the north-east. Both are wish lamps like the ones above."
      - "The third Skyroads lamp, on the Genie's Rock east of the Broken Launch, holds an angry genie who strikes the member who clicked it whatever you answer. 'Take me' knocks that member unconscious and gives everyone 500 XP. 'Take my friends' curses and weakens the speaker. 'Make me king' turns the speaker to stone. Answer 'Take me', or leave the lamp alone."
      - "Three small lamps grant one fixed wish when rubbed. In Sprite Forest and Ogre Pass, one is in the north-east, north-west of the milestone that warns of the ogres (5,000 gold). On Magic Mountain in Lakeside and Blackfang, one is south-west of the Gargoyle Lair's cave (5,000 gold). Another is on a skerry in the lake, north-west of Mirabeth's statue (8,000 gold)."
    tips:
      - "Each genie appears once. Afterwards its lamp is cold."
      - "Aladdin in Sandcaster ('Genies') warns: 'Never take all of a genie's money. It's greedy.' A bottle in the Broken Launch's planks on the Skyroads warns about the angry genie: 'Evil Genies NEVER let their victims off the hook.'"
      - "Experience is the best wish early on. Gold is better if you are saving for Castle Kalindra or the Skyroads' tolls."
    reward: "For each wish lamp, 2,000 XP for each member, 10,000 gold or ten gems. The greedy lamp gives 5,000 gold, or costs 5,000. The small lamps give 5,000 to 8,000 gold."
    points:
      - {map: xeen_d2, name: "A genie's lamp"}
      - {map: xeen_d4, name: "A genie's lamp"}
      - {map: xeen_d3, name: "Aladdin's Lamps"}
      - {map: xeen_d5, name: "The Shrine of Great Power"}
      - {map: xeen_d6, name: "Travel pyramid"}
      - {map: xeen_d6, name: "Corak's Pod"}
    maps:
      - {map: xeen_d6, focus: "Corak's Pod", caption: "The Forbidden Zone: the islet lamp lies between the travel pyramid and Corak's Pod. The greedy lamp's crag is south of Necropolis."}
      - {map: xeen_d5, focus: "Shrine of Great Power", caption: "The Desert of Doom: the hill-shrine lamp is south-west of the Shrine of Great Power. The dune lamp is south of the east boulders."}

  # ---- The Skyroads: Cyrano's Tribble ---------------------------------------------------------------------------------
  - quest: q-d28
    from: {map: xeen_dd26, npc: "Cyrano Jones"}
    to: {map: xeen_dd26, npc: "Cyrano Jones"}
    summary: "Buy a tribble from Cyrano Jones in the Olympus Sewer, and piece together the password that opens the bronze doors to his offering vault."
    requires: "The Skyroads (after the Chosen Ones) and 25,000 gold if you want the tribble. The vault needs only the password."
    steps:
      - "In Olympus on the Skyroads, click the marble grate on the gods' row, just north of the House of Adonis, and choose OK in the entrance window. The scroll pinned by the stair says 'Search the drains.'"
      - "Cyrano Jones's den, Pets Unlimited, is north of the stair, behind a plank door. Ask him about 'Tribbles'. He offers one for 25,000 gold: Yes buys it, No (or too little gold) is 'Maybe some other time.'"
      - "Search the four drains in the marble ring around the den. Each holds one piece of a note: TR on the ring's west side, IB at the spillway's weir beyond the west grate, BL on the cistern's walkway in the north, and ES at the east outfall beyond the east grate. When you find the last piece, the four are written into your autonotes."
      - "Put the pieces together: TRIBBLES. If you bought a tribble, Cyrano's 'Companions' topic says the word outright: 'TRIBBLES are great companions but you'll be surprised what doors they can open for you!'"
      - "Go to the bronze doors at the east end of the cistern. A voice asks 'What's the password?': type TRIBBLES (TRIBBLE also works). The doors open for good. The offering vault's chest is beyond them."
      - "Search Cyrano's bed in the den once for an item, then leave by the marble stair (Climb up to Olympus)."
    tips:
      - "The tribble does nothing. It is a joke and a gold sink. You can buy as many as you can afford."
      - "A wrong password only gets 'Wrong! You may not pass!'. Click the doors again to try again."
      - "The vault's chest (treasure level 6) usually holds more gold than the tribble costs."
    reward: "No experience. The vault's chest (treasure level 6), a random item (treasure level 6) from Cyrano's bed and, for 25,000 gold each, as many tribbles as you like."
    points:
      - {map: xeen_d7, name: "Olympus Sewer"}
      - {map: xeen_dd26, name: "Scroll"}
      - {map: xeen_dd26, name: "Drain"}
      - {map: xeen_dd26, name: "Cyrano's bed in the den"}
      - {map: xeen_dd26, name: "Bronze doors"}
    maps:
      - {map: xeen_dd26, focus: "Cyrano", caption: "The stair arrives in the south and the den is in the middle. The four drains ring it, and the bronze doors are at the cistern's east end."}
      - {map: xeen_d7, focus: "Olympus Sewer", caption: "The marble grate is on the gods' row in Olympus, just north of the House of Adonis."}

