# Hand-kept map points of the Xeen guide (tools/xeen_site/build_site.py reads this after the generated points).
#
# rename: <map id>: <point id>: {n: name, d: detail, t: type}  -- a generic point the scripts name poorly ("Lava
#   Head" four times, "Button"); point ids are the generated ones (e<event>, a<actor>, c<chest>).
# add: <map id>: - {id, t, x, y, z, n, d, quests}  -- a puzzle piece the scripts cannot place or name (world
#   coordinates; z picks the storey indoors).
#
# solutions: <map id>: {map: [phrases], <point id>: [pieces]}  -- what the map's puzzles check (D-79): phrases no
#   point of the map may say again, and short pieces (rune syllables, obelisk words) that only that point may not say.
#   A phrase of three letters or fewer matches only as written ("THE", "FI"); longer ones in any case.
#
# Player text only, as everywhere in the guide (D-76, D-79): no developer wording and no puzzle answers or solutions; a
# point says what a thing is, what it asks and what it does, never how to solve it (no value, order, pairing, route,
# word or pieces of one). A cut clue keeps its lead-in and ends with a full stop. The build stops on any of them.

