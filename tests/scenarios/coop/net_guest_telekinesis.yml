id: coop.net_guest_telekinesis
title: "Co-op - a guest's Telekinesis opens the host's chest for that guest"
world: mm8
mode: faithful
tags: [coop, regression]
steps:
  - note:
      text: >-
        A guest's game tries its own cast before it asks the host for it. Nothing is activated on a guest's copy
        of the map, so before 2026-11-20 the try of Telekinesis (and of Stone to Flesh on a thing in the world)
        always failed and the host was never asked. The try now answers whether the thing could be reached; the
        host opens the chest for that player, whose game shows it. The host's own player has no chest open.
  - new_game_flow:
      start_map: out01.odm
  - advance_runtime: {seconds: 1}
  - coop_guest: {}
  - new_game_flow:
      start_map: out02.odm
      party:
        gold: 0
        food: 10
        members:
          - {name: B, class: Necromancer, level: 30, skills: [{name: EarthMagic, level: 10, mastery: 3}], equipment: {}}
    game: guest
  - coop_join: {expect: joined}
  - advance_runtime: {seconds: 1}
  - cast_spell: {member_index: 0, spell_id: 42, skill: 10, mastery: 3, telekinesis_chest: 2, expect: applied}
    game: guest
  - advance_runtime: {seconds: 2}
  - console: {line: "coop chest 1", expect_contains: "player 1 has chest 2 open"}
  - console: {line: "coop chest 0", expect_contains: "player 0 has chest 2 open"}
    game: guest
  - console: {line: "coop chest 0", expect_contains: "player 0 has no chest open"}
  - console: {line: coop net, expect_contains: "joined as player 1"}
    game: guest
