id: coop.net_guest_immolation
title: "Co-op - a guest's Immolation burns the monsters near that guest"
world: mm8
mode: faithful
tags: [coop, regression]
steps:
  - note:
      text: >-
        The aura's tick read the world's own party alone, so before 2026-11-20 a guest's Immolation burned
        nothing: the host's party did not hold it. Now every player's aura burns what stands near that player.
        The guest stands 2700 units from the host with a pirate beside it; the pirate burns to death, and the
        blows are in the guest's combat log.
  - new_game_flow:
      start_map: out01.odm
  - advance_runtime: {seconds: 1}
  - coop_guest: {}
  - new_game_flow:
      start_map: out02.odm
      party:
        gold: 0
        food: 10
        members:
          - {name: G, class: Necromancer, level: 50, skills: [{name: FireMagic, level: 10, mastery: 3}], equipment: {}}
    game: guest
  - coop_join: {expect: joined}
  - damage_actor: {all: true, amount: 1000000}
  - advance_runtime: {seconds: 1}
  - console: {line: "coop pose 1 3656 4950 545", expect_contains: "player 1 at 3656"}
  - advance_runtime: {seconds: 2}
  - console: {line: "actor spawn 181 1 3756 4950 200"}
  - console: {line: "actor immobile last on"}
  - cast_spell: {member_index: 0, spell_id: 8, skill: 10, mastery: 4, scroll: true, expect: applied}
    game: guest
  - advance_runtime: {seconds: 1}
  - console: {line: "actor count 181", expect_contains: "remaining=1"}
  # Long enough for a bad line, where the cast reaches the host late (tools/coop_bad_line).
  - advance_runtime: {seconds: 34}
  - console: {line: "actor count 181", expect_contains: "remaining=0"}
  - assert:
      combat_log: {dealt_min: 1}
    game: guest
  - console: {line: coop net, expect_contains: "joined as player 1"}
    game: guest
