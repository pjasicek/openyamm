id: coop.net_world_copy
title: "Co-op - a guest keeps a copy of the host's world and plays on in it alone"
world: mm8
mode: faithful
tags: [coop, regression]
steps:
  - note:
      text: >-
        Quests are a world's and are not carried into a guest's own game. A guest who wants the progress keeps a
        copy of the host's whole world instead: a save of its own with the host's quests and maps as they are and
        its own character in the party. The host's world has quest bit 9000 set and has paid everyone 100 gold.
        The guest keeps a copy, leaves (its own game is back, untouched), and loads the copy: it stands on the
        host's map with its own character, its gold and the host's quest bit.
  - new_game_flow:
      start_map: out01.odm
      party:
        gold: 0
        food: 10
        members:
          - {name: A, class: Knight, level: 10, skills: [{name: Sword, level: 4, mastery: 1}], equipment: {}}
  - advance_runtime: {seconds: 1}
  - coop_guest: {}
  - new_game_flow:
      start_map: out02.odm
      party:
        gold: 55
        food: 10
        members:
          - {name: B, class: Cleric, level: 7, skills: [{name: Mace, level: 4, mastery: 1}], equipment: {}}
    game: guest
  - coop_join: {expect: joined}
  - lua_event:
      source: "AddValue(Gold, 100) SetQBit(QBit(9000))"
  - advance_runtime: {seconds: 0.5}
  - console: {line: "coop check 1 gold = 155"}
  - console: {line: coop keep kept_world replace, expect_contains: "asked the host"}
    game: guest
  - advance_runtime: {seconds: 1}
  - console: {line: coop leave, expect_contains: "left the network session"}
    game: guest
  - advance_runtime: {seconds: 0.5}
  # The guest's own game, as it was: its own map, and none of the host's quests.
  - assert: {map: out02.odm, qbit_clear: [9000]}
    game: guest
  # The copy: the host's map and quests, the guest's own character.
  - load_game: {path: saves/kept_world.oysav}
    game: guest
  - advance_runtime: {seconds: 0.5}
    game: guest
  - assert: {map: out01.odm, gold: 155, qbit_set: [9000]}
    game: guest
  - console: {line: "coop check 0 max_hp > 0"}
    game: guest
