id: coop.net_guest_console
title: "Co-op - a guest's console cannot change the host's world"
world: mm8
mode: faithful
tags: [coop, regression]
steps:
  - note:
      text: >-
        A guest's game is a copy of the host's world. A console command that changes the world, the quests, the
        clock or the map would change only the copy (or take the game to another map alone), so a guest's
        console refuses those. What only shows something still works there, and so do the commands that change
        the guest's own character, which reaches the host with it. The host's console does everything, and what
        it does reaches the guest.
  - new_game_flow:
      start_map: out01.odm
      party:
        gold: 0
        food: 10
        members:
          - {name: H, class: Knight, level: 20, skills: [{name: Sword, level: 4, mastery: 1}], equipment: {}}
  - advance_runtime: {seconds: 1}
  - coop_guest: {}
  - new_game_flow:
      start_map: out02.odm
      party:
        gold: 0
        food: 10
        members:
          - {name: G, class: Knight, level: 20, skills: [{name: Sword, level: 4, mastery: 1}], equipment: {}}
    game: guest
  - coop_join: {expect: joined}
  - advance_runtime: {seconds: 1}
  - console: {line: "goto out02.odm", expect_refusal: "Only the host's console"}
    game: guest
  - console: {line: "time set 12 0", expect_refusal: "Only the host's console"}
    game: guest
  - console: {line: "qbit set 1", expect_refusal: "Only the host's console"}
    game: guest
  - console: {line: "actor kill all", expect_refusal: "Only the host's console"}
    game: guest
  - console: {line: "reload map", expect_refusal: "Only the host's console"}
    game: guest
  # Still on the host's map, and what shows something answers.
  - console: {line: loc, expect_contains: "position="}
    game: guest
  - console: {line: time}
    game: guest
  # The guest's own character is the guest's to change, and the host has the change.
  - console: {line: "gold set 500"}
    game: guest
  - advance_runtime: {seconds: 1.5}
  - console: {line: "coop check 1 gold = 500"}
  - console: {line: coop net, expect_contains: "joined as player 1"}
    game: guest
