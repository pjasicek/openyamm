id: coop.net_guest_party
title: "Co-op - a guest brings its whole party: the host has all of it, heals the member who needs it, and it goes home whole"
world: mm8
mode: faithful
tags: [coop, regression]
steps:
  - note:
      text: >-
        Since 2026-11-21 a player brings its party, not its first character alone (a solo run still takes one).
        The guest joins with three: the host's copy has three. The host's Upkeep Heal goes to the guest's member
        who is hurt, whichever of the three it is. The guest leaves and its own game has its three again; before,
        a party that joined came home as its first member alone.
  - new_game_flow:
      start_map: out01.odm
      party:
        gold: 0
        food: 10
        members:
          - name: H
            class: Cleric
            level: 20
            skills: [{name: BodyMagic, level: 10, mastery: 2}]
            spells: [68]
            equipment: {}
            battle_orders: {fallback: weapon, orders: [], upkeep: [{spell: Heal}]}
  - advance_runtime: {seconds: 1}
  - coop_guest: {}
  - new_game_flow:
      start_map: out02.odm
      party:
        gold: 100
        food: 10
        members:
          - {name: A, class: Knight, level: 10, skills: [{name: Sword, level: 4, mastery: 1}], equipment: {}}
          - {name: B, class: Knight, level: 10, skills: [{name: Sword, level: 4, mastery: 1}], equipment: {}}
          - {name: C, class: Knight, level: 10, skills: [{name: Sword, level: 4, mastery: 1}], equipment: {}}
    game: guest
  - coop_join: {expect: joined}
  - damage_actor: {all: true, amount: 1000000}
  - advance_runtime: {seconds: 2}
  - console: {line: "coop check 1 members = 3"}
  - console: {line: "coop check 0 members = 3"}
    game: guest
  - console: {line: "coop check 1 hurt = 0"}
  - console: {line: "coop damage 1 30"}
  - advance_runtime: {seconds: 1}
  - console: {line: "coop check 1 hurt = 1"}
  - press_action: {action: upkeep}
  - advance_runtime: {seconds: 3}
  - press_action: {action: upkeep}
  - advance_runtime: {seconds: 3}
  - press_action: {action: upkeep}
  - advance_runtime: {seconds: 3}
  - console: {line: "coop check 1 hurt = 0"}
  - console: {line: "coop check 0 hurt = 0"}
    game: guest
  - console: {line: "coop leave", expect_contains: "left the network session"}
    game: guest
  - advance_runtime: {seconds: 2}
  - console: {line: "coop check 0 members = 3"}
    game: guest
  - assert: {map: out02.odm}
    game: guest
