id: coop.net_quest_items
title: "Co-op - a guest's own quest items stay at home, and one it gains in the host's world stays with that world"
world: mm8
mode: faithful
tags: [coop, regression]
steps:
  - note:
      text: >-
        Quest items are a world's. The guest carries a quest item of its own world (733) in its bags. Joining, the
        item stays behind with the guest's own game and the host's world does not get it. In the host's world the
        guest's game puts another quest item (732) into the world's quest pouch, as it does when its player takes
        one out of a chest; the host has it then. The guest leaves: its own item is in its bags again, and 732
        stayed with the host's world.
  - new_game_flow:
      start_map: out01.odm
      party:
        gold: 0
        food: 10
        members:
          - {name: A, class: Knight, level: 10, skills: [{name: Sword, level: 4, mastery: 1}], equipment: {}}
  - advance_runtime: {seconds: 1}
  - coop_guest: {}
  - new_game_flow:
      start_map: out02.odm
      party:
        gold: 0
        food: 10
        members:
          - {name: B, class: Knight, level: 10, skills: [{name: Sword, level: 4, mastery: 1}], equipment: {}}
    game: guest
  - grant_item: {item_id: 733, member_index: 0}
    game: guest
  - console: {line: "coop check 0 bag_items = 1"}
    game: guest
  - coop_join: {expect: joined}
  - console: {line: "coop check 0 quest_items = 0"}
  - console: {line: "coop check 1 bag_items = 0"}
  - grant_item: {item_id: 732, member_index: 0}
    game: guest
  - advance_runtime: {seconds: 0.5}
  - console: {line: "coop check 0 quest_items = 1"}
  - console: {line: "coop check 0 quest_items = 1"}
    game: guest
  - lua_event: {source: "if not evt.HasItemAnywhere(732) then error('the host lacks the item') end"}
  - console: {line: coop leave, expect_contains: "left the network session"}
    game: guest
  - advance_runtime: {seconds: 0.5}
  - console: {line: "coop check 0 bag_items = 1"}
    game: guest
  - console: {line: "coop check 0 quest_items = 0"}
    game: guest
  - console: {line: "coop check 0 quest_items = 1"}
