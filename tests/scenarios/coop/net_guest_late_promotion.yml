id: coop.net_guest_late_promotion
title: "Co-op - a guest who joins after the host's world finished a promotion quest is promoted by the promoter, and takes it home"
world: mm8
mode: faithful
tags: [coop, regression]
steps:
  - note:
      text: >-
        Quests are the host's world's, and a promotion is a character's. The host's world has the Dark Elf
        promotion quest done (quest bit 1537). A Dark Elf joins afterwards and asks Relburn Jeebes, whose "Promote
        Dark Elves" promotes whoever travels with a party that finished the quest: the guest is a Patriarch in
        both games, and still one in its own game when it has left, where that quest was never done.
  - new_game_flow:
      start_map: out01.odm
  - advance_runtime: {seconds: 1}
  - lua_event:
      source: "SetQBit(QBit(1537))"
  - coop_guest: {}
  - new_game_flow:
      start_map: out02.odm
      party:
        gold: 0
        food: 10
        members:
          - {name: Dask, class: DarkElf, level: 10, skills: [], equipment: {}}
    game: guest
  - coop_join: {expect: joined}
  - advance_runtime: {seconds: 1}
  - console: {line: coop net, expect_contains: "player 1 Dask (DarkElf 10)"}
  - lua_event:
      player: 1
      source: "evt.SpeakNPC(39)"
  - advance_runtime: {seconds: 0.5}
  - console: {line: "coop dialog 1", expect_contains: "2: Promote Dark Elves"}
  - console: {line: "coop dialog 1 2"}
  - advance_runtime: {seconds: 1}
  - console: {line: coop net, expect_contains: "player 1 Dask (Patriarch 10)"}
  - console: {line: "player sheet", expect_contains: "Dask (Patriarch)"}
    game: guest
  - console: {line: "coop dialog 1 close"}
  - console: {line: coop leave, expect_contains: "left the network session"}
    game: guest
  - advance_runtime: {seconds: 1}
  - assert: {map: out02.odm, qbit_clear: [1537]}
    game: guest
  - console: {line: "player sheet", expect_contains: "Dask (Patriarch)"}
    game: guest
