id: coop.net_guest_armageddon
title: "Co-op - a guest's Armageddon is that guest's: its blows are in its combat log, and it strikes both players"
world: mm8
mode: faithful
tags: [coop, regression]
steps:
  - note:
      text: >-
        Armageddon goes off two seconds after the cast, when the host's game no longer acts for the guest who cast
        it. Before 2026-11-20 it then counted as the host's (the host's skill, the host's kills) and struck the
        host's party alone. Now the caster's party sets the damage, its blows are recorded for the guest, and
        every player's party on the map is struck.
  - new_game_flow:
      start_map: out01.odm
      party:
        gold: 0
        food: 10
        members:
          - {name: A, class: Knight, level: 50, skills: [{name: Sword, level: 5, mastery: 1}], equipment: {}}
  - advance_runtime: {seconds: 1}
  - coop_guest: {}
  - new_game_flow:
      start_map: out02.odm
      party:
        gold: 0
        food: 10
        members:
          - {name: G, class: Necromancer, level: 50, skills: [{name: DarkMagic, level: 10, mastery: 3}], equipment: {}}
    game: guest
  - coop_join: {expect: joined}
  - damage_actor: {all: true, amount: 1000000}
  - advance_runtime: {seconds: 2}
  - console: {line: "actor spawn 11 1 3656 7950 545"}
  - console: {line: "actor immobile last on"}
  - advance_runtime: {seconds: 1}
  - cast_spell: {member_index: 0, spell_id: 98, skill: 10, mastery: 3, expect: applied}
    game: guest
  - advance_runtime: {seconds: 4}
  - assert:
      combat_log: {dealt_min: 1}
    game: guest
  - console: {line: "coop check 0 hurt = 1"}
  - console: {line: "coop check 1 hurt = 1"}
  - console: {line: "coop check 0 hurt = 1"}
    game: guest
  - console: {line: coop net, expect_contains: "joined as player 1"}
    game: guest
