id: coop.net_guest_buys_ride
title: "Co-op - a guest buys a boat ride: the host is asked, both pay their fare and both arrive"
world: mm8
mode: faithful
tags: [coop, regression]
steps:
  - note:
      text: >-
        The fare rule between two games (fares_wait_for_the_vote.yml has it in one). The guest buys the four
        days' ride from Dagger Wound to Ravenshore in its own game. It is that player's proposal to the others:
        nobody has paid while the host has not answered. The host agrees, each player pays its own 75 gold, four
        days pass once, and both games are in Ravenshore with the guest still joined.
  - new_game_flow:
      start_map: out01.odm
  - advance_runtime: {seconds: 1}
  - coop_guest: {}
  - new_game_flow:
      start_map: out02.odm
      party:
        gold: 50000
        food: 10
        members:
          - {name: G, class: Knight, level: 1, skills: [{name: Sword, level: 1, mastery: 1}], equipment: {}}
    game: guest
  - coop_join: {expect: joined}
  - advance_runtime: {seconds: 0.5}
  - lua_event:
      player: 1
      source: "evt.EnterHouse(479)"
  - advance_runtime: {seconds: 0.3}
  - select_topic: {match_label: "4 days to Ravenshore for 75 gold"}
    game: guest
  - advance_runtime: {seconds: 1, follow_map_move: true}
  - assert: {map: out01.odm}
  - console: {line: coop show, expect_contains: "proposed by player 1, 0 accepted"}
  - console: {line: "coop check 1 gold = 50000"}
  - console: {line: "coop check 0 gold = 10000"}
  # The guest is asked first whether it goes with the party or alone; with the party puts the trip to the host.
  - assert:
      dialog: {active: true, action_label_present: "Travel with the Party"}
    game: guest
  - select_topic: {match_label: "Travel with the Party"}
    game: guest
  - advance_runtime: {seconds: 1}
  - console: {line: "coop vote 0 yes", expect_contains: "player 0 voted yes"}
  - advance_runtime: {seconds: 3, follow_map_move: true}
  - advance_runtime: {seconds: 3}
  - assert: {map: out02.odm}
  - console: {line: "coop check 0 gold = 9925"}
  - console: {line: "coop check 1 gold = 49925"}
  - console: {line: "coop check 0 day = 4"}
  - assert: {map: out02.odm}
    game: guest
  - console: {line: coop net, expect_contains: "joined as player 1, map revision 2"}
    game: guest
  - console: {line: "coop check 0 gold = 49925"}
    game: guest
