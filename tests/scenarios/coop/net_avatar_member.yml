id: coop.net_avatar_member
title: "Co-op - a player picks which member of its party the others see, and a heal still finds the hurt member"
world: mm8
mode: faithful
tags: [coop, regression]
steps:
  - note:
      text: >-
        Since 2026-11-21 a player chooses which member of its party stands for it in the others' games (its body
        and its face in their players panel): `coop avatar <member>`, or the Multiplayer screen. The guest joins
        with a Knight, a Sorcerer and a Cleric and is shown as the Knight; it picks its second member and the host
        sees the Sorcerer. The members a spell is aimed at are still counted in the party's order: the host's
        Upkeep Heal reaches the guest's hurt member with another member shown. The gear that makes a body glow is
        the whole party's.
  - new_game_flow:
      start_map: out01.odm
      party:
        gold: 0
        food: 10
        members:
          - name: H
            class: Cleric
            level: 20
            skills: [{name: BodyMagic, level: 10, mastery: 2}]
            spells: [68]
            equipment: {}
            battle_orders: {fallback: weapon, orders: [], upkeep: [{spell: Heal}]}
  - advance_runtime: {seconds: 1}
  - coop_guest: {}
  - new_game_flow:
      start_map: out02.odm
      party:
        gold: 100
        food: 10
        members:
          - {name: A, class: Knight, level: 10, skills: [{name: Sword, level: 4, mastery: 1}], equipment: {}}
          - {name: B, class: Sorcerer, level: 11, skills: [{name: Staff, level: 4, mastery: 1}], equipment: {}}
          - {name: C, class: Cleric, level: 12, skills: [{name: Mace, level: 4, mastery: 1}], equipment: {}}
    game: guest
  - coop_join: {expect: joined}
  - damage_actor: {all: true, amount: 1000000}
  - advance_runtime: {seconds: 2}
  - console: {line: coop net, expect_contains: "player 1 A (Knight 10)"}
  - console: {line: coop net, expect_contains: "member 1 gear 0"}
  - console: {line: "coop avatar", expect_contains: "the others see member 1: A (Knight)"}
    game: guest
  - console: {line: "coop avatar 2", expect_contains: "the others see member 2: B (Sorcerer)"}
    game: guest
  - advance_runtime: {seconds: 2}
  - console: {line: coop net, expect_contains: "player 1 B (Sorcerer 11)"}
  - console: {line: coop net, expect_contains: "member 2 gear 0"}
  - console: {line: "coop check 1 members = 3"}
  - console: {line: "coop check 1 hurt = 0"}
  - console: {line: "coop damage 1 30"}
  - advance_runtime: {seconds: 1}
  - console: {line: "coop check 1 hurt = 1"}
  - press_action: {action: upkeep}
  - advance_runtime: {seconds: 3}
  - press_action: {action: upkeep}
  - advance_runtime: {seconds: 3}
  - press_action: {action: upkeep}
  - advance_runtime: {seconds: 3}
  - console: {line: "coop check 1 hurt = 0"}
  - console: {line: "coop check 0 hurt = 0"}
    game: guest
  - console: {line: "coop avatar 1", expect_contains: "the others see member 1: A (Knight)"}
    game: guest
  - advance_runtime: {seconds: 2}
  - console: {line: coop net, expect_contains: "player 1 A (Knight 10)"}
