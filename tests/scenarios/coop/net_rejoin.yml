id: coop.net_rejoin
title: "Co-op - a guest leaves with what it gained, is home in its own game, and joins again with it"
world: mm8
mode: faithful
tags: [coop, regression]
steps:
  - note:
      text: >-
        Leaving and joining again. The guest gains 300 gold in the host's world and leaves: it is back on its own
        map in its own game with the 5300 gold, and the host has no connection. Joining again is a new join with
        the character as the guest's game has it: the host sees player 1 with 5300 gold.
  - new_game_flow:
      start_map: out01.odm
  - advance_runtime: {seconds: 1}
  - coop_guest: {}
  - new_game_flow:
      start_map: out02.odm
      party:
        gold: 5000
        food: 10
        members:
          - {name: G, class: Knight, level: 10, skills: [{name: Sword, level: 4, mastery: 1}], equipment: {}}
    game: guest
  - coop_join: {expect: joined}
  - advance_runtime: {seconds: 2}
  - console: {line: "gold add 300", expect_contains: "5300"}
    game: guest
  - advance_runtime: {seconds: 2}
  - console: {line: "coop check 1 gold = 5300"}
  - console: {line: "coop leave", expect_contains: "left the network session"}
    game: guest
  - advance_runtime: {seconds: 2}
  - console: {line: coop net, expect_contains: "no network session"}
    game: guest
  - console: {line: "gold get", expect_contains: "5300"}
    game: guest
  - assert: {map: out02.odm}
    game: guest
  - console: {line: coop net, expect_contains: "hosting, map revision 1, 0 connection(s)"}
  - coop_join: {expect: joined}
  - advance_runtime: {seconds: 2}
  - console: {line: "coop check 1 gold = 5300"}
  - console: {line: coop net, expect_contains: "joined as player 1"}
    game: guest
  - assert: {map: out01.odm}
    game: guest
  - note:
      text: >-
        The second join syncs as the first did: what the guest gains reaches the host, and what the host does to
        the guest reaches the guest. Before 2026-11-20 the guest's count of its changes ran on from the first
        join, and after a second one the character stood still in both games.
  - console: {line: "gold add 100", expect_contains: "5400"}
    game: guest
  - advance_runtime: {seconds: 2}
  - console: {line: "coop check 1 gold = 5400"}
  - console: {line: "coop damage 1 5"}
  - advance_runtime: {seconds: 2}
  - console: {line: "coop check 1 hurt = 1"}
  - console: {line: "coop check 0 hurt = 1"}
    game: guest
