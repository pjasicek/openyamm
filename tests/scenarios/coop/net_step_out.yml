id: coop.net_step_out
title: "Co-op - a guest steps out into its own game, its seat is kept, and it comes back as the player it was"
world: mm8
mode: faithful
tags: [coop, regression]
steps:
  - note:
      text: >-
        Stepping out is leaving with the seat kept: the guest's game asks the host, the host answers, the
        connection ends and the guest's game is its own again, with its character as the session left it. The
        host keeps the seat (the others see the player greyed, "away"). What the guest gains at home it brings
        back: joining again names the seat's key, and the host gives it the player it was.
  - new_game_flow:
      start_map: out01.odm
  - advance_runtime: {seconds: 1}
  - coop_guest: {}
  - new_game_flow:
      start_map: out02.odm
      party:
        gold: 5000
        food: 10
        members:
          - {name: G, class: Knight, level: 10, skills: [{name: Sword, level: 4, mastery: 1}], equipment: {}}
    game: guest
  - coop_join: {expect: joined}
  - advance_runtime: {seconds: 2}
  - console: {line: "coop away", expect_contains: "0 seat(s) kept"}
  - console: {line: "coop stepout", expect_contains: "asked the host to keep the seat"}
    game: guest
  - advance_runtime: {seconds: 2}
  - console: {line: coop net, expect_contains: "no network session"}
    game: guest
  - assert: {map: out02.odm}
    game: guest
  - console: {line: "coop away", expect_contains: "away from Ariel's game"}
    game: guest
  - console: {line: "coop away", expect_contains: "1 seat(s) kept"}
  - console: {line: coop net, expect_contains: "hosting, map revision 1, 0 connection(s)"}
  - console: {line: coop net, expect_contains: "player 1 G (Knight 10) hp 90/90 away"}
  - console: {line: "gold add 100", expect_contains: "5100"}
    game: guest
  - coop_join: {expect: joined}
  - advance_runtime: {seconds: 2}
  - console: {line: "coop away", expect_contains: "0 seat(s) kept"}
  - console: {line: "coop check 1 gold = 5100"}
  - console: {line: coop net, expect_contains: "joined as player 1"}
    game: guest
  - assert: {map: out01.odm}
    game: guest
