id: coop.net_password
title: "Co-op - a game with a password refuses a join without it or with a wrong one, and takes the right one"
world: mm8
mode: faithful
tags: [coop, regression]
steps:
  - note:
      text: >-
        A hosted game may ask for a password. A join that gives none is refused with the reason, one that gives
        a wrong one too, and the right one joins. A refused guest is back in its own game each time.
  - new_game_flow:
      start_map: out01.odm
  - advance_runtime: {seconds: 1}
  - console: {line: "coop password host tea", expect_contains: "host password set"}
  - coop_guest: {}
  - new_game_flow:
      start_map: out02.odm
    game: guest
  - coop_join: {expect: refused}
  - advance_runtime: {seconds: 1}
  - console: {line: coop net, expect_contains: "this game asks for a password"}
    game: guest
  - assert: {map: out02.odm}
    game: guest
  - console: {line: "coop password join coffee", expect_contains: "join password set"}
    game: guest
  - coop_join: {expect: refused}
  - advance_runtime: {seconds: 1}
  - console: {line: coop net, expect_contains: "the password is wrong"}
    game: guest
  - console: {line: "coop password join tea"}
    game: guest
  - coop_join: {expect: joined}
  - console: {line: coop net, expect_contains: "joined as player 1"}
    game: guest
  - console: {line: coop net, expect_contains: "1 connection(s)"}
