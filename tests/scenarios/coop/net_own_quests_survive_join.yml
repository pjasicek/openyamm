id: coop.net_own_quests_survive_join
title: "Co-op - on a slow line the host's quests never land in the guest's own game"
world: mm8
mode: faithful
tags: [coop, regression]
steps:
  - note:
      text: >-
        The messages' channels do not wait for each other, so on a slow line the host's quests can reach a joining
        game before the host's world does. Until that world is loaded the joining game is still its player's own:
        the host's quests wait (CoopSession::m_guestHeldGameNews). Here the host's world has quest bit 9001 and the
        guest's own game has 9002 and a quest item of its own. After joining over a slow line and leaving, the
        guest's own game has its own bit, its own item, and not the host's bit. While joined it had the host's.
  - new_game_flow:
      start_map: out01.odm
      party:
        gold: 0
        food: 10
        members:
          - {name: A, class: Knight, level: 10, skills: [{name: Sword, level: 4, mastery: 1}], equipment: {}}
  - lua_event: {source: "SetQBit(QBit(9001))"}
  - advance_runtime: {seconds: 1}
  - coop_guest: {}
  - coop_network: {delay_ms: 100, jitter_ms: 40, loss_permille: 100}
  - new_game_flow:
      start_map: out02.odm
      party:
        gold: 0
        food: 10
        members:
          - {name: B, class: Knight, level: 10, skills: [{name: Sword, level: 4, mastery: 1}], equipment: {}}
    game: guest
  - lua_event: {source: "SetQBit(QBit(9002))"}
    game: guest
  - grant_item: {item_id: 733, member_index: 0}
    game: guest
  - coop_join: {expect: joined}
  - advance_runtime: {seconds: 1}
  - assert: {qbit_set: [9001], qbit_clear: [9002]}
    game: guest
  - console: {line: coop leave, expect_contains: "left the network session"}
    game: guest
  - advance_runtime: {seconds: 1}
  - assert: {map: out02.odm, qbit_set: [9002], qbit_clear: [9001]}
    game: guest
  - console: {line: "coop check 0 bag_items = 1"}
    game: guest
  - assert: {qbit_set: [9001], qbit_clear: [9002]}
