id: coop.net_guest_house_services_indoor
title: "Co-op - on an indoor map too, a house's lesson is for the guest who asked"
world: mm8
mode: faithful
tags: [coop, regression]
steps:
  - note:
      text: >-
        The indoor twin of net_guest_house_services.yml: the indoor dialogue took the host's own party as the
        outdoor one did (found by reading, 2026-11-20). The two games are on an indoor map; the guest, a knight
        who knows only the sword, is shown the weaponsmith's lessons for its own character, learns the bow and
        pays its own 500 gold. The host's gold does not change.
  - new_game_flow:
      start_map: d05.blv
  - advance_runtime: {seconds: 1}
  - coop_guest: {}
  - new_game_flow:
      start_map: out02.odm
      party:
        gold: 50000
        food: 3
        members:
          - {name: G, class: Knight, level: 1, skills: [{name: Sword, level: 1, mastery: 1}], equipment: {}}
    game: guest
  - coop_join: {expect: joined}
  - advance_runtime: {seconds: 0.5}
  - console: {line: "coop check 0 gold = 10000"}
  - lua_event:
      player: 1
      source: "evt.EnterHouse(1)"
  - advance_runtime: {seconds: 0.3}
  - select_topic: {match_label: "Learn Skills"}
    game: guest
  - advance_runtime: {seconds: 0.5}
  - console: {line: "coop dialog 1", expect_contains: "Learn Bow for 500 gold"}
  - select_topic: {match_label: "Learn Bow for 500 gold"}
    game: guest
  - advance_runtime: {seconds: 1}
  - console: {line: "coop check 1 gold = 49500"}
  - console: {line: "coop check 0 gold = 10000"}
  - console: {line: "coop dialog 1", expect_not_contains: "Learn Bow"}
  - console: {line: "skill get Bow", expect_not_contains: "has no Bow"}
    game: guest
  - console: {line: coop net, expect_contains: "joined as player 1"}
    game: guest
