id: coop.net_character
title: "Co-op - a guest's character is the host's to hurt and the guest's own to change"
world: mm8
mode: faithful
tags: [coop, regression]
steps:
  - note:
      text: >-
        The host keeps every guest's character and the guest's game shows a mirror of it. What the world does to
        the character happens on the host and shows in the guest's game (a wound, gold found). What the player does
        with the character happens in the guest's game and reaches the host (gold spent here by the console). Both
        at once keep both - the host's change is added to the guest's.
  - new_game_flow:
      start_map: out01.odm
  - advance_runtime: {seconds: 1}
  - coop_guest: {}
  - new_game_flow:
      start_map: out02.odm
    game: guest
  - coop_join: {expect: joined}
  - damage_actor: {all: true, amount: 1000000}
  - advance_runtime: {seconds: 0.5}
  - console: {line: "coop check 1 hurt = 0"}
  - console: {line: "coop check 0 hurt = 0"}
    game: guest
  - console: {line: "coop damage 1 1500", expect_contains: "player 1"}
  - advance_runtime: {seconds: 0.5}
  - console: {line: "coop check 1 hp < 1000"}
  - console: {line: "coop check 0 hp < 1000"}
    game: guest
  - note:
      text: >-
        The guest's game takes 300 gold from its own purse. The host's copy follows.
  - console: {line: "coop check 0 gold = 10000"}
    game: guest
  - console: {line: "gold add -300"}
    game: guest
  - advance_runtime: {seconds: 0.5}
  - console: {line: "coop check 0 gold = 9700"}
    game: guest
  - console: {line: "coop check 1 gold = 9700"}
  - console: {line: coop net, expect_contains: "hosting"}
