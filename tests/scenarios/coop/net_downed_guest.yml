id: coop.net_downed_guest
title: "Co-op - a guest struck down is not defeated in its own game; after ten seconds its Use key returns it"
world: mm8
mode: faithful
tags: [coop, regression]
steps:
  - note:
      text: >-
        "A downed player" between two games (downed_player_returns.yml shows the rule in one game). The host's
        game decides a defeat, for everyone; a guest's game has no other party to look at and must not take its
        own party's fall for one. The guest is struck down while the host stands: twelve seconds later it is
        still down and has its gold in both games. It then asks the host for the return (its Use key in the
        game, the console here), keeps its gold (since 2026-11-21 a return costs none), and it is still joined. The headless run plays no defeat
        screen, so that a guest's game starts none is checked by tools/coop_two_machines/run.sh session, which
        found on 2026-11-20 that it did.
  - new_game_flow:
      start_map: out01.odm
  - advance_runtime: {seconds: 1}
  - coop_guest: {}
  - new_game_flow:
      start_map: out02.odm
      party:
        gold: 5000
        food: 10
        members:
          - {name: G, class: Knight, level: 10, skills: [{name: Sword, level: 4, mastery: 1}], equipment: {}}
    game: guest
  - coop_join: {expect: joined}
  - damage_actor: {all: true, amount: 1000000}
  - advance_runtime: {seconds: 2}
  - console: {line: "coop check 1 gold = 5000"}
  - console: {line: "coop damage 1 1000000", expect_contains: "down"}
  - advance_runtime: {seconds: 12}
  - console: {line: "coop check 1 down = 1"}
  - console: {line: "coop check 1 gold = 5000"}
  - console: {line: "coop check 0 down = 1"}
    game: guest
  - console: {line: "coop check 0 gold = 5000"}
    game: guest
  - console: {line: coop net, expect_contains: "joined as player 1"}
    game: guest
  - console: {line: "coop return 0", expect_contains: "asked the host"}
    game: guest
  - advance_runtime: {seconds: 2}
  - console: {line: "coop check 1 down = 0"}
  - console: {line: "coop check 1 gold = 5000"}
  - console: {line: "coop check 0 down = 0"}
    game: guest
  - console: {line: "coop check 0 gold = 5000"}
    game: guest
  - console: {line: coop net, expect_contains: "joined as player 1"}
    game: guest
