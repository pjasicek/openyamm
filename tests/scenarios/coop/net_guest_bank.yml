id: coop.net_guest_bank
title: "Co-op - a guest deposits and withdraws at the bank: the amount typed in its game is the host's to carry out"
world: mm8
mode: faithful
tags: [coop, regression]
steps:
  - note:
      text: >-
        The bank asks for an amount. For a guest the asking is told to its game, the amount is typed there and
        sent to the host, which deposits or withdraws it for that player. The guest deposits 300 of its 5000 gold
        and takes 100 back: 4800 in hand in both games, and the host's own gold untouched. Before 2026-11-20 the
        bank's Deposit and Withdraw did nothing in a guest's game.
  - new_game_flow:
      start_map: out01.odm
  - advance_runtime: {seconds: 1}
  - coop_guest: {}
  - new_game_flow:
      start_map: out02.odm
      party:
        gold: 5000
        food: 10
        members:
          - {name: G, class: Knight, level: 1, skills: [{name: Sword, level: 1, mastery: 1}], equipment: {}}
    game: guest
  - coop_join: {expect: joined}
  - advance_runtime: {seconds: 0.5}
  - lua_event:
      player: 1
      source: "evt.EnterHouse(281)"
  - advance_runtime: {seconds: 0.3}
  - select_topic: {match_label: "Deposit"}
    game: guest
  - advance_runtime: {seconds: 0.5}
  - answer_input: {text: "300"}
    game: guest
  - advance_runtime: {seconds: 1}
  - console: {line: "coop check 1 gold = 4700"}
  - console: {line: "coop check 0 gold = 4700"}
    game: guest
  - console: {line: "coop check 0 gold = 10000"}
  - select_topic: {match_label: "Withdraw"}
    game: guest
  - advance_runtime: {seconds: 0.5}
  - answer_input: {text: "100"}
    game: guest
  - advance_runtime: {seconds: 1}
  - console: {line: "coop check 1 gold = 4800"}
  - console: {line: "coop check 0 gold = 4800"}
    game: guest
  - console: {line: "coop check 0 gold = 10000"}
  - console: {line: coop net, expect_contains: "joined as player 1"}
    game: guest
