id: coop.net_guest_shops
title: "Co-op - a guest buys from the host's shop: the host sells, the stock and the gold change in both games"
world: mm8
mode: faithful
tags: [coop, regression, shops]
steps:
  - note:
      text: >-
        A shop's stock is the host's. The guest walks into True Mettle (house 1, the weapon shop of Dagger Wound);
        the host presents the shop to it, the guest's game shows the same, and "Buy Standard" opens the stock in
        the guest's game because the host opened it for that player. The guest buys the first weapon - the host
        takes the gold from the guest's character and the weapon off the shelf, and both games show one thing
        fewer and less gold.
  - new_game_flow:
      start_map: out01.odm
      party:
        gold: 0
        food: 10
        members:
          - {name: A, class: Knight, level: 10, skills: [{name: Sword, level: 4, mastery: 1}], equipment: {}}
  - advance_runtime: {seconds: 1}
  - coop_guest: {}
  - new_game_flow:
      start_map: out02.odm
      party:
        gold: 50000
        food: 10
        members:
          - {name: B, class: Knight, level: 10, skills: [{name: Sword, level: 4, mastery: 1}], equipment: {}}
    game: guest
  - coop_join: {expect: joined}
  - advance_runtime: {seconds: 0.3}
  - lua_event:
      player: 1
      source: "evt.EnterHouse(1)"
  - advance_runtime: {seconds: 0.3}
  - assert:
      dialog: {active: true, action_label_present: Buy Standard}
    game: guest
  - select_topic: {match_label: "Buy Standard"}
    game: guest
  - advance_runtime: {seconds: 0.3}
  - console: {line: coop shop, expect_contains: "stock of True Mettle: 6 things, the party has 50000 gold"}
    game: guest
  - console: {line: coop shop buy 0}
    game: guest
  - advance_runtime: {seconds: 0.5}
  - console: {line: coop shop, expect_contains: "stock of True Mettle: 5 things"}
    game: guest
  - console: {line: coop shop, expect_not_contains: "50000 gold"}
    game: guest
  - console: {line: "coop check 1 gold < 50000"}
  - console: {line: "coop check 0 gold = 0"}
  - note:
      text: Escape leaves the stock screen, on the host too; a second Escape leaves the shop.
  - press_action: {action: escape}
    game: guest
  - advance_runtime: {seconds: 0.3}
  - console: {line: coop shop, expect_contains: "no stock screen is open"}
    game: guest
  - console: {line: "coop dialog 1", expect_contains: "player 1 has a dialogue open"}
  - press_action: {action: escape}
    game: guest
  - advance_runtime: {seconds: 0.3}
  - console: {line: "coop dialog 1", expect_contains: "player 1 has no dialogue open"}
