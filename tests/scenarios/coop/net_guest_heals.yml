id: coop.net_guest_heals
title: "Co-op - a guest's spell raises the host's fallen character"
world: mm8
mode: faithful
tags: [coop, regression]
steps:
  - note:
      text: >-
        A guest's game tries a spell on a copy of its character, to see what the spell needs and what to show, and
        the host casts it. The host's character lies dead; the guest's Cleric casts Resurrection (55) on it from
        its own game, and the host's character stands again. The guest pays the spell points.
  - new_game_flow:
      start_map: out01.odm
      party:
        gold: 0
        food: 10
        members:
          - {name: A, class: Cleric, level: 30, skills: [{name: BodyMagic, level: 8, mastery: 2}], equipment: {}}
  - advance_runtime: {seconds: 1}
  - coop_guest: {}
  - new_game_flow:
      start_map: out02.odm
      party:
        gold: 0
        food: 10
        members:
          - {name: B, class: HighPriest, level: 30, skills: [{name: SpiritMagic, level: 10, mastery: 4}], equipment: {}}
    game: guest
  - coop_join: {expect: joined}
  - damage_actor: {all: true, amount: 1000000}
  - console: {line: "coop damage 0 1000000", expect_contains: "down"}
  - console: {line: "coop check 0 down = 1"}
  - advance_runtime: {seconds: 0.5}
  - cast_spell: {member_index: 0, spell_id: 55, skill: 10, mastery: 4, target_member: 0, target_player: 0, expect: applied}
    game: guest
  - advance_runtime: {seconds: 0.5}
  - console: {line: "coop check 0 down = 0"}
  - console: {line: "coop check 1 down = 0"}
  - console: {line: coop net, expect_contains: "joined as player 1"}
    game: guest
