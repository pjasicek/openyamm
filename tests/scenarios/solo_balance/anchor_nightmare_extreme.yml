id: solo_balance.anchor_nightmare_extreme
title: "Solo balance - lone Champion, extreme stage, nightmare: damage dealt and taken"
world: mm8
mode: faithful
tags: [solo_balance, maw, measurement]
# A measurement for devdocs/solo_action/BALANCE_AND_TALENTS.md, not a regression test. Generated by
# model/gen_anchor.py; model/parse_anchor.py reads the CONSOLE and "party_attack report" lines. Each map:
# the C-tier native takes 60 attacks (healed after each), then 3 B-tier natives hit the
# character in 1- and 3-second windows from full hit points, after a 2-second approach.
steps:
  - new_game_flow:
      start_map: out01.odm
      member_count: 1
      ruleset: {id: maw, difficulty: nightmare, progression: horizontal}
  - console: {line: "testparty apply extreme solo", expect_contains: "items worn"}
  # Plane of Fire: Greater Fire Elemental / Fire Elementals
  - load_map: {map: elemf.odm}
  - console: {line: "actor kill 200000"}
  - console: {line: "player sheet"}
  - console: {line: "hp show"}
  - spawn_actor: {monster_id: 75, near_party: true}
  - party_attack: {actor_index: last, count: 60, report: true}
  - console: {line: "actor kill 200000"}
  - spawn_actor: {monster_id: 74, near_party: true, count: 3}
  - setup_shortcut: {kind: immortal, value: true}
  - advance_runtime: {seconds: 2}
  - setup_shortcut: {kind: immortal, value: false}
  - console: {line: "hp full"}
  - advance_runtime: {seconds: 1}
  - console: {line: "hp show"}
  - console: {line: "hp full"}
  - advance_runtime: {seconds: 1}
  - console: {line: "hp show"}
  - console: {line: "hp full"}
  - advance_runtime: {seconds: 1}
  - console: {line: "hp show"}
  - console: {line: "hp full"}
  - advance_runtime: {seconds: 3}
  - console: {line: "hp show"}
  - console: {line: "hp full"}
  - advance_runtime: {seconds: 3}
  - console: {line: "hp show"}
  - console: {line: "actor kill 200000"}
  - console: {line: "hp full"}
