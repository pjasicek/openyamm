  - load_map: {map: xeen_d7.blv}
  - set_pose: {map: xeen_d7.blv, x: 11424, y: 2560, z: 1408, yaw: 3.1416, pitch: 0.0}
  - advance_runtime: {seconds: 1.0}
  - assert: {map: xeen_d7.blv}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}

  # ---- Out to D1 and 673 days on (D7's refill is 672 days, map_stats), re-entered: the tolls ask again, every pair
  # peaceful, the Megadragon still hidden, the riddles and lamps still done.
  - load_map: {map: xeen_d1.odm}
  - play_lua: {source: "wait(1); for _ = 1, 3 do if not close() then break end end"}
  - assert: {map: xeen_d1.odm}
