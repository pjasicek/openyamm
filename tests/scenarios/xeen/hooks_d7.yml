  - assert: {actor_count: {monster_id: 11116, hostile: false, min: 8, max: 8}}
  - assert: {qbit_set: [113520, 113521, 116260, 116261, 113545, 113546, 113547]}
  - play_lua: {source: "click(118); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "You have invaded our territory."}}
  - select_topic: {match_label: "Bow down before us!"}
  - advance_runtime: {seconds: 0.5}
  - assert: {actor_count: {monster_id: 11116, hostile: true, near: [28160, 6656, 1024], min: 2, max: 2}}
  - assert: {actor_count: {monster_id: 11116, hostile: true, min: 2, max: 2}}

  # ---- The Fire Corner (event 38), walked onto: "Fire" moves the party onto P1's Cinder Shelf.
  - load_map: {map: xeen_d7.blv, pos: "-29388, 19558, 1288"}
