# Xeen FD-04 (the Dragon Tower and the Dungeon of Death) quest hooks in the installed map, with their amounts, not
# only their texts. A level-70 party from a new game on FD-04, placed beside each thing (set_pose on A7's floors).
# - Q-F1: Alister's first talk (114020); the bone alcove's notes (fraud, forever), the hatchery's (balls), the last
#   climber's (eye); the nest's egg (118146, once: "Two eggs are left"); the potion (+2 base Endurance to the drinking
#   member only, player bit 11360; refused for that member, then another member drinks); Alister takes the egg
#   (5,000 to each, 118147) and is hidden the second after; the Tome (4,000 to the reader only, bit 11361; refused
#   again, then another member reads).
# - Q-F2: Sandro's door without his key (the fail line names it), with it (118130, 114040, the key kept), again (the
#   else line); the descent refused; the twelve clues (a wrong answer "Wrong!" and nothing lit; spelling variants;
#   a solved plaque's status line); the descent (6,000 each, 118143, once); the four coffins; Sandro's note; the
#   shrines Minor/Lesser/Great (No leaves one; 1,000/2,000/3,000 each, once: "The shrine lies broken.");
#   the gongs, the lever refused, the chest's reset ("The gongs fall silent."), the four gongs and the lever; the
#   terminal (Goober, SUPER Goober, COMPUTER 2,000 each once, its else line); the machine (10,000 each, 118145, 114041).
# - A save and load: the potion, the Tome, the egg, the descent, the shrines, the terminal and the machine still
#   refuse a second use and pay nothing. Last, the Ultimate shrine: No, then Yes: 70 Fire damage to each member and
#   its status line, 118148, out to X7's entrance:fd04_door; back in FD-04 the shrine stays broken.
# - 1 Across with a trailing full stop ("Scepter."): q-f2.yml says punctuation is ignored, the map's answer lists are
#   exact (an ISSUE line while they differ; no failure).
# Places: devdocs/xeen/briefs/fd04/L4/rooms.yml (room outlines, floors), playtest_alister.yml, playtest_crossword.yml,
# playtest_shrine.yml, playtest_gongs.yml, playtest_terminal.yml (A7's poses and steps).
# Quest logic: source/quests/q-f1.yml, q-f2.yml (hooks in events/common/xeen_quests.lua); map events in
# events/maps/xeen_fd04.lua.
#   build-xeen/game/openyamm --headless-run-scenario tests/scenarios/xeen/hooks_fd04.yml --scenario-no-color
id: xeen.hooks_fd04
title: "Xeen FD-04 hooks: Alister, the egg, notes, potion, Tome, Sandro's door, crossword, shrines, gongs, terminal, machine"
world: xeen
mode: faithful
tags: [xeen, quests]
steps:
  - new_game_flow:
      start_map: xeen_fd04.blv
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 70, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 70, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 70, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 70, skills: [], equipment: {}}
  - setup_shortcut: {kind: immortal}
  - play_lua: {source: "wait(2); for _ = 1, 3 do if not close() then break end end"}
  - assert: {map: xeen_fd04.blv}
  - assert: {qbit_clear: [114020, 114021, 114040, 114041, 114043, 114044, 114045, 118130, 118143, 118145, 118146, 118147, 118148, 118149]}
  - assert: {actor_visible: {actor_index: 0, name: "Alister, Druid", hidden: false}}
  - press_action: {action: select_member, member_index: 0}

  # ---- The gate hall. Alister's first talk starts Q-F1.
  - set_pose: {map: xeen_fd04.blv, x: -640, y: -768, z: 0, yaw: 3.1416, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - interact_actor: {actor_index: 0}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - select_topic: {match_label: Dragon egg}
  - assert: {dialog: {active: true, text_contains: "If you bring me one I will reward you."}}
  - play_lua:
      source: |
        close(); close(); wait(0.5); close()
        if not qbit(114020) then error("q-f1.started 114020 not set") end
        if qbit(118147) then error("alister_gone set by the first talk") end
  # Sandro's door (event 75) without the key: the fail line names it.
  - set_pose: {map: xeen_fd04.blv, x: 0, y: -720, z: 0, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - play_lua: {source: "click(75); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "It answers only to his key, the Key to the Dungeon of Death."}}
  - play_lua:
      source: |
        close(); wait(0.5)
        if door_state(8) ~= "closed" then error("Sandro's door opened without the key: " .. door_state(8)) end
        if qbit(118130) or qbit(114040) then error("the refused door set its qbits") end
  - grant_item: {item_id: 12354, member_index: 0}
  - play_lua: {source: "click(75); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "The Key to the Dungeon of Death turns in the skull's eye."}}
  - play_lua:
      source: |
        close(); wait(3)
        if not qbit(118130) then error("q-f2.door_open 118130 not set") end
        if not qbit(114040) then error("q-f2.started 114040 not set") end
        if door_state(8) ~= "open" then error("Sandro's door not open: " .. door_state(8)) end
        if not has_item(12354) then error("the door took the key") end
        click(75); wait(0.5)
  - assert: {dialog: {active: true, text_contains: "Sandro's door stands open."}}
  - play_lua: {source: "close(); wait(0.3)"}

  # ---- Floor 1, the bone alcove: the two diaries (events 12, 11).
  - set_pose: {map: xeen_fd04.blv, x: 1152, y: 1280, z: 1280, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - play_lua: {source: "log('cleared ' .. clear_hostiles(2500)); click(12); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "I don't trust that druid guy. He seemed too eager to get his hands on a dragon egg, and he sure didn't look like he had ten million gold pieces!"}}
  - play_lua: {source: "close(); wait(0.3); click(11); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "I think the secret of the dragon has something to do with forever, or really, really big..."}}
  - play_lua: {source: "close(); wait(0.3)"}

  # ---- Floor 2. The nest's egg (event 56): once.
  - set_pose: {map: xeen_fd04.blv, x: -416, y: 384, z: 2560, yaw: -1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - play_lua: {source: "log('cleared ' .. clear_hostiles(3000)); click(56); wait(0.5)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[You lift one of the eggs out of the nest.]], 1, true) then error("status line: " .. s) end
  - play_lua:
      source: |
        close(); wait(0.5)
        if held() ~= 12375 then error("the egg is not in hand: held " .. held()) end
        while held() ~= 0 do stow() end
        if item_count(12375) ~= 1 then error("Dragon Egg count " .. item_count(12375)) end
        if not qbit(118146) then error("q-f1.egg_taken 118146 not set") end
        click(56); wait(0.5)
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[Two eggs are left in the nest. Taking another would be pushing your luck.]], 1, true) then error("status line: " .. s) end
  - play_lua:
      source: |
        close(); wait(0.3)
        if held() ~= 0 or item_count(12375) ~= 1 then
          error("the second click gave another egg: held " .. held() .. ", packs " .. item_count(12375))
        end
  # The hatchery's bones (event 9).
  - set_pose: {map: xeen_fd04.blv, x: 1152, y: 0, z: 2560, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - play_lua: {source: "log('cleared ' .. clear_hostiles(3000)); click(9); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "You have to be pretty smart to survive a look in one of the crystal balls on the Dragon Cloud."}}
  - play_lua: {source: "close(); wait(0.3)"}
  # The last climber: the note (event 10) and the potion (event 74).
  - set_pose: {map: xeen_fd04.blv, x: -1024, y: 1280, z: 2560, yaw: 3.1416, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - play_lua: {source: "log('cleared ' .. clear_hostiles(3000)); click(10); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "A note amongst the bones reads: The eye of the Dragon holds the Elder Staff."}}
  - play_lua: {source: "close(); wait(0.3); status()"}
  # Each member's base Endurance and player bits 11360 (potion) and 11361 (Tome).
  - console: &endb {line: "lua local out = '' for p = 0, 3 do evt.ForPlayer(p) local v = 0 while v < 400 and IsAtLeast(BaseEndurance, v + 1) do v = v + 1 end local a = 0 if IsPlayerBitSet(PlayerBit(11360)) then a = 1 end local b = 0 if IsPlayerBitSet(PlayerBit(11361)) then b = 1 end out = out .. v .. '/' .. a .. '/' .. b .. ' ' end evt.ForPlayer(Players.Current) evt.StatusText('endb ' .. out)", expect_contains: "Lua ran."}
  - play_lua:
      source: |
        local line = nil
        for m in string.gmatch(status() or "", "endb ([%d/ ]+)") do line = m end
        if line == nil then error("no endb line") end
        log("before the potion: " .. line)
        local i = 0
        for e, a, b in string.gmatch(line, "(%d+)/(%d)/(%d)") do
          remember("e" .. i, tonumber(e))
          if a ~= "0" or b ~= "0" then error("member " .. i .. " starts with bits " .. a .. b) end
          i = i + 1
        end
        if i ~= 4 then error("endb parsed " .. i) end
        click(74); wait(0.5)
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[Potion. It is thick, bitter and faintly warm, and your bones seem to set harder as it goes down. (+2 Endurance, permanent)]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "close(); wait(0.3); click(74); wait(0.5)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[The flask has been drained. By you, as it happens.]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "close(); wait(0.3); status()"}
  - press_action: {action: select_member, member_index: 1}
  - play_lua: {source: "click(74); wait(0.5)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[(+2 Endurance, permanent)]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "close(); wait(0.3); status()"}
  - press_action: {action: select_member, member_index: 0}
  - console: *endb
  - play_lua:
      source: |
        local line = nil
        for m in string.gmatch(status() or "", "endb ([%d/ ]+)") do line = m end
        if line == nil then error("no endb line") end
        log("after the potion: " .. line)
        local i = 0
        for e, a, b in string.gmatch(line, "(%d+)/(%d)/(%d)") do
          local gain = tonumber(e) - recall("e" .. i)
          local want = (i <= 1) and 2 or 0
          if gain ~= want then error("member " .. i .. " Endurance +" .. gain .. ", wanted +" .. want) end
          local wantBit = (i <= 1) and "1" or "0"
          if a ~= wantBit then error("member " .. i .. " potion bit " .. a) end
          i = i + 1
        end

  # ---- Back to the gate hall: Alister takes the egg, 5,000 to each, gone the second after.
  - set_pose: {map: xeen_fd04.blv, x: -640, y: -768, z: 0, yaw: 3.1416, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - play_lua: {source: "for i = 0, 3 do remember('x' .. i, experience(i)) end; close()"}
  - interact_actor: {actor_index: 0}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - select_topic: {match_label: Dragon egg}
  - assert: {dialog: {active: true, text_contains: "Now I'll just drink this egg potion and..."}}
  - play_lua:
      source: |
        close(); close(); wait(0.3); close(); wait(2)
        if not qbit(118147) then error("q-f1.alister_gone 118147 not set") end
        if has_item(12375) then error("Alister did not take the egg") end
        for i = 0, 3 do
          local d = experience(i) - recall("x" .. i)
          if d ~= 5000 then error("Alister paid member " .. i .. " " .. d) end
        end
  - assert: {actor_visible: {actor_index: 0, hidden: true}}

  # ---- Floor 3, the tome room (event 101): 4,000 to the reader only, once per character.
  - set_pose: {map: xeen_fd04.blv, x: -1312, y: 1152, z: 3840, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - play_lua: {source: "log('cleared ' .. clear_hostiles(3000)); for i = 0, 3 do remember('x' .. i, experience(i)) end; click(101); wait(0.5)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[Tome of Great Experience. You read it cover to cover, and several of its chapters read you. (+4,000 experience)]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "close(); wait(0.3); click(101); wait(0.5)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[You learn nothing new from the Tome.]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "close(); wait(0.3)"}
  - press_action: {action: select_member, member_index: 2}
  - play_lua: {source: "click(101); wait(0.5)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[(+4,000 experience)]], 1, true) then error("status line: " .. s) end
  - play_lua:
      source: |
        close(); wait(0.3)
        for i = 0, 3 do
          local d = experience(i) - recall("x" .. i)
          local want = (i == 0 or i == 2) and 4000 or 0
          if d ~= want then error("the Tome gave member " .. i .. " " .. d .. ", wanted " .. want) end
        end
        status()
  - press_action: {action: select_member, member_index: 0}
  - console: *endb
  - play_lua:
      source: |
        local line = nil
        for m in string.gmatch(status() or "", "endb ([%d/ ]+)") do line = m end
        local i = 0
        for e, a, b in string.gmatch(line, "(%d+)/(%d)/(%d)") do
          local wantBit = (i == 0 or i == 2) and "1" or "0"
          if b ~= wantBit then error("member " .. i .. " Tome bit " .. b) end
          i = i + 1
        end

  # ---- The crossword hall (z -1,024): the descent (event 47) refused before the twelve words.
  - set_pose: {map: xeen_fd04.blv, x: 0, y: 1400, z: -1024, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - play_lua: {source: "log('cleared ' .. clear_hostiles(4000)); for i = 0, 3 do remember('x' .. i, experience(i)) end; click(47); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "Sorry, the crossword puzzle is not done yet. You may not descend!"}}
  - play_lua:
      source: |
        close(); wait(0.5)
        if qbit(118143) then error("crossword_done set early") end
        if door_state(5) ~= "closed" then error("the descent opened: " .. door_state(5)) end
  # 45 Down (event 30): the replaced clue's answer is wrong, then Winterkill.
  - play_lua: {source: "click(30); wait(0.5)"}
  - answer_input: {text: "Darkstone"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Wrong!"}}
  - play_lua: {source: "close(); wait(0.3); if qbit(118139) then error('a wrong answer lit 45 Down') end; click(30); wait(0.5)"}
  - answer_input: {text: "WINTERKILL"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Correct!"}}
  - play_lua: {source: "close(); wait(0.3); if not qbit(118139) then error('word_45d 118139 not set') end; status(); click(30); wait(0.5)"}
  - play_lua:
      source: |
        local s = status() or ""
        if not string.find(s, "45 Down: City of Ghosts. Winterkill.", 1, true) then error("solved plaque: " .. s) end
  - assert: {dialog: {active: false}}
  # 1 Across (event 20): a wrong answer, then the spelling variant with the apostrophe.
  - play_lua: {source: "click(20); wait(0.5)"}
  - answer_input: {text: "Staff"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Wrong!"}}
  - play_lua: {source: "close(); wait(0.3); if qbit(118131) then error('a wrong answer lit 1 Across') end; click(20); wait(0.5)"}
  # q-f2.yml says punctuation is ignored; the map's answer lists are exact (trimmed, any case).
  - answer_input: {text: "Scepter."}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - play_lua:
      source: |
        if qbit(118131) then
          log("NOTE 1 Across accepted 'Scepter.' (punctuation ignored, as q-f2.yml says)")
        else
          log("ISSUE 1 Across refused 'Scepter.' ('Wrong!'): q-f2.yml says punctuation is ignored; the map's lists are exact")
        end
        close(); wait(0.3)
  - console: {line: "qbit clear 118131"}
  - play_lua: {source: "click(20); wait(0.5)"}
  - answer_input: {text: "Xeen's Sceptre"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Correct!"}}
  - play_lua: {source: "close(); wait(0.3); if not qbit(118131) then error('word_1a 118131 not set') end; click(34); wait(0.5)"}
  # 5 Across (34): Vampires.
  - answer_input: {text: "Vampires"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Correct!"}}
  - play_lua: {source: "close(); wait(0.3); if not qbit(118132) then error('word_5a 118132 not set') end; click(36); wait(0.5)"}
  # 6 Across (36): Queen Kalindra.
  - answer_input: {text: "queen kalindra"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Correct!"}}
  - play_lua: {source: "close(); wait(0.3); if not qbit(118133) then error('word_6a 118133 not set') end; click(18); wait(0.5)"}
  # 13 Across (18): Corak.
  - answer_input: {text: "Corak"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Correct!"}}
  - play_lua: {source: "close(); wait(0.3); if not qbit(118134) then error('word_13a 118134 not set') end; click(22); wait(0.5)"}
  # 21 Across (22): Castle Alamar.
  - answer_input: {text: "Castle Alamar"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Correct!"}}
  - play_lua: {source: "close(); wait(0.3); if not qbit(118135) then error('word_21a 118135 not set') end; click(24); wait(0.5)"}
  # 24 Across (24): the Necropolis.
  - answer_input: {text: "The Necropolis"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Correct!"}}
  - play_lua: {source: "close(); wait(0.3); if not qbit(118136) then error('word_24a 118136 not set') end; click(26); wait(0.5)"}
  # 40 Across (26): Sandcaster.
  - answer_input: {text: "sandcaster"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Correct!"}}
  - play_lua: {source: "close(); wait(0.3); if not qbit(118137) then error('word_40a 118137 not set') end; click(28); wait(0.5)"}
  # 44 Down (28): Castle View.
  - answer_input: {text: "Castle View"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Correct!"}}
  - play_lua: {source: "close(); wait(0.3); if not qbit(118138) then error('word_44d 118138 not set') end; click(32); wait(0.5)"}
  # 47 Down (32): the Southern Sphinx.
  - answer_input: {text: "southern sphinx"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Correct!"}}
  - play_lua: {source: "close(); wait(0.3); if not qbit(118140) then error('word_47d 118140 not set') end; click(38); wait(0.5)"}
  # 76 Down (38): Mirrors.
  - answer_input: {text: "Mirrors"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Correct!"}}
  - play_lua: {source: "close(); wait(0.3); if not qbit(118141) then error('word_76d 118141 not set') end; click(40); wait(0.5)"}
  # 77 Down (40): Lord Xeen.
  - answer_input: {text: "Lord Xeen"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Correct!"}}
  - play_lua:
      source: |
        close(); wait(0.3)
        for b = 118131, 118142 do if not qbit(b) then error("word " .. b .. " not set") end end
        for i = 0, 3 do
          if experience(i) ~= recall("x" .. i) then error("a clue paid member " .. i) end
        end
        click(47); wait(0.5)
  # The descent: 6,000 each, once.
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[You may pass. For completing the puzzle, here is your reward. (+6,000 experience)]], 1, true) then error("status line: " .. s) end
  - play_lua:
      source: |
        close(); wait(4)
        if not qbit(118143) then error("q-f2.crossword_done 118143 not set") end
        if door_state(5) ~= "open" then error("the descent shut: " .. door_state(5)) end
        for i = 0, 3 do
          local d = experience(i) - recall("x" .. i)
          if d ~= 6000 then error("the crossword paid member " .. i .. " " .. d) end
        end
        click(47); wait(0.5)
  - assert: {dialog: {active: false}}
  - play_lua:
      source: |
        for i = 0, 3 do
          if experience(i) - recall("x" .. i) ~= 6000 then error("the descent paid again") end
        end

  # ---- Sandro's halls (z -1,792). The crypt's four coffins (events 42-45).
  - set_pose: {map: xeen_fd04.blv, x: -1312, y: 4800, z: -1792, yaw: 3.1416, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - play_lua: {source: "log('cleared ' .. clear_hostiles(4000)); click(42); wait(0.5)"}
  - assert: &coffin {dialog: {active: true, text_contains: "You try to open the lid of the coffin, but it is too heavy and you are too weak. From inside, someone turns over."}}
  - play_lua: {source: "close(); wait(0.3); click(43); wait(0.5)"}
  - assert: *coffin
  - play_lua: {source: "close(); wait(0.3); click(44); wait(0.5)"}
  - assert: *coffin
  - play_lua: {source: "close(); wait(0.3); click(45); wait(0.5)"}
  - assert: *coffin
