# Xeen's X2 (D-54): Lake Darzog's north-west Water Dragon (11640, a flyer, leash 1,024) sees an immortal party on the
# north shore 2,816 from its home and must stay within its leash while it fights. Before merge point 24 it circled the
# party at ~2,800 and was 4,347 from home after 30 s: the post's leash checked the line to the target, not the
# flyer's offset pursuit, so the step the world took left the circle (keepStepOnLeash now holds that step). A5's repro
# (devdocs/xeen/briefs/x2/L4/playtest_lake_dragons_leash.yml). Needs assets_dev's Xeen world (git-ignored). A1.
