# The two arched gates of Burlock's village wall (X4) were walled up: on a wall whose top follows the land, Map
# Studio built the lintel over an arched gate from the land up (fixed in OutdoorThings.cpp, 2026-11-24). The party
# walks from two cells outside each gate to two cells inside and back.
