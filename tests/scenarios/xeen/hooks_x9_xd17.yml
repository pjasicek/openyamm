  # XD-17, Shangri-La: the well in the court (event 21), once per character.
  - load_map: {map: xeen_xd17.blv}
  - advance_runtime: {seconds: 2.5, present_dialogs: true}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - assert: {map: xeen_xd17.blv}
  - set_pose: {map: xeen_xd17.blv, x: 320, y: 0, z: 0, yaw: 3.1416, pitch: -0.25}
  - advance_runtime: {seconds: 0.5}
  - press_action: {action: select_member, member_index: 0}
