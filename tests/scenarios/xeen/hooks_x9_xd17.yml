# Xeen hooks on X9 (the Clouds of Xeen) and XD-17 (Shangri-La): the amounts D-50 and D-53 set, in the installed maps
# (A5's playtests check the texts). X9 from a new game at the cloud stair's head with a level-46 party (as A5's
# x9/L4/playtest.yml, whose walk points this uses): the five roc nests (Yes: 2,000 experience to every member, once);
# the first offering statue strikes a party that is not Crusaders (80 Air to everyone: the party is hurt with the
# Immortal cheat off) and gives a Crusader party one item, once (map variable), then "empty"; Slick's high-striker
# (100 gold a swing: a member under 60 Might loses the gold, a member at 60 or more wins the doll and rings the bell,
# xeen_striker_ding; a winner is refused) and the race (1,000 gold a try, lost by a slow member). XD-17: the well gives
# 15,000 experience and the award Found Shangri-La (421) once per character: member 0, refused for member 0, then
# member 1.
# Quest logic: source/npcs/x9.yml, source/quests/m34.yml, source/npcs/xd17.yml.
#   build-xeen/game/openyamm --headless-run-scenario tests/scenarios/xeen/hooks_x9_xd17.yml --scenario-no-color
id: xeen.hooks.x9_xd17
title: "Xeen X9 and XD-17: the nests' 2,000, the offering statue, Slick's striker and race, the well's 15,000 once each"
world: xeen
mode: faithful
tags: [xeen, quests]
steps:
  - new_game_flow:
      start_map: xeen_x9.blv
      party:
        gold: 20000
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 46, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 46, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 46, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 46, skills: [], equipment: {}}
  - setup_shortcut: {kind: immortal, value: true}
  - play_lua: {source: "wait(3); close()"}
  - assert: {map: xeen_x9.blv}
  - assert: {party_position: {x: 0, y: -17920, radius: 160, z_min: 290, z_max: 360}}
  - assert: {qbit_clear: [110047, 116220, 116221, 116222, 116223, 116224, 111680]}
