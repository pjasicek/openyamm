  # A Crusader party (M4 done in the Witch Tower, Act I): one gift (treasure level 5), then empty hands.
  - setup_shortcut: {kind: set_qbit, id: 110047, value: true}
  - play_lua:
      source: |
        local before = pack_items()
        click(29); wait(0.5)
        local gift = held()
        if gift == 0 then error("the statue's gift did not reach the cursor") end
        stow()
        remember("gift", gift)
        log("OFFERING gift item " .. gift .. "; pack before: " .. before)
