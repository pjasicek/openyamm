  - play_lua: {source: "remember('xp0', experience(0)); remember('xp3', experience(3)); click(26); wait(0.5)"}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - play_lua:
