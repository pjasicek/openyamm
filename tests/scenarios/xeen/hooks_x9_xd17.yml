  - play_lua:
      source: |
        close(); wait(0.3)
        if recall("gold") - gold() ~= 100 then error("the winning swing cost " .. (recall("gold") - gold())) end
        if not qbit(111681) then error("might_won 111681 not set") end
        log("STRIKER doll item " .. recall("doll"))
        click(5); wait(0.5)
  - assert: {dialog: {active: true, text_contains: "You've already won the prize."}}
  - play_lua: {source: "close(); wait(0.3)"}
