  - play_lua:
      source: |
        close(); wait(0.3)
        if not has_item(recall("gift")) then error("the gift " .. recall("gift") .. " is not in the packs") end
        remember("pack", pack_items())
        click(29); wait(0.5)
        if held() ~= 0 then error("the empty statue gave item " .. held()) end
  - assert: {dialog: {active: true, text_contains: "The statue's hands are empty."}}
  - play_lua: {source: "close(); wait(0.3); if pack_items() ~= recall('pack') then error('the empty statue gave an item') end"}
