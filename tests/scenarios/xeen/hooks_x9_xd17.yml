  # Slick's high-striker (event 5): the members' current Might first (the hook asks IsAtLeast(ActualMight, 60)).
  - console: {line: "lua local out = '' for p = 0, 3 do evt.ForPlayer(p) local v = 0 while v < 255 and IsAtLeast(ActualMight, v + 1) do v = v + 1 end out = out .. v .. ' ' end evt.StatusText('might ' .. out)", expect_contains: "Lua ran."}
  - play_lua: {source: "log('MIGHT ' .. status())"}
  # The Sorcerer (member 3, weak): 100 gold and a thunk, no doll; she may swing again.
  - press_action: {action: select_member, member_index: 3}
  - play_lua: {source: "remember('gold', gold()); click(5); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "(thunk.) Oh! Too bad."}}
  - play_lua:
      source: |
        close(); wait(0.3)
        if recall("gold") - gold() ~= 100 then error("the losing swing cost " .. (recall("gold") - gold())) end
        if qbit(111681) then error("might_won set by a losing swing") end
  # The Knight (member 0) made strong enough to ring the bell (a console boost of his base Might to 60 or more; no
  # level-46 starting member has it): 100 gold, the DING, the doll, might_won; then Slick refuses him.
  - console: {line: "lua evt.ForPlayer(0) local v = 0 while v < 255 and IsAtLeast(ActualMight, v + 1) do v = v + 1 end if v < 60 then AddValue(BaseMight, 60 - v) end", expect_contains: "Lua ran."}
