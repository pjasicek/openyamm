  - press_interact: {expect: {kind: event_target}}
  - advance_runtime: {seconds: 0.6}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[Congratulations, You found Shangri-La!]], 1, true) then error("status line: " .. s) end
  - assert: {award_acquired: [{id: 421, member_index: 0}]}
  - play_lua:
      source: |
        close(); wait(0.3)
        local a, b = experience(0) - recall("xp0"), experience(1) - recall("xp1")
        if a ~= 15000 then error("the well gave member 0 " .. a .. " experience, not 15,000") end
        if b ~= 0 then error("the well gave member 1 " .. b .. " experience while member 0 drank") end
