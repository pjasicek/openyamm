# D-200 (U-19, 2026-11-26): P4's Great Octopods (11474: classic AI, the Swimmer kind with Fly Y, the Water ink, no MM9
# profile, no Aggressor bit) are bound to the plane's water volume (water:sea, bed -1,024, surface -64) and leashed
# (1,280). The plane's other monsters are killed on load (they shoot the arrival within 2 s: check_arrivals's
# arrival.open_seen, P4's own design), so only the octopods can hurt the solo hero (level 50):
#   1. the landing (the arrival) and the Whirlpool Court for 30 s each: full health, no attack_ranged by any octopod
#      (the north group's home moved to (0, 5120): its leash plus 2,560 stays off both);
#   2. after the court, every octopod within its leash (+150) of home and above the bed (report_state z: in the sea);
#   3. the reef terrace's west rim (floor 32), 844 to 1,522 from the east group: the octopod with a clear line (actor
#      12, 1,522 off; actor 11, nearer, is under the terrace's lip and sees nothing) rises to the surface, comes to
#      within its leash and shoots its ink (attack_ranged on the party): the hero is hurt within 30 s; every octopod
#      still within its leash (in the run of 2026-11-26 it stood at z -111, under the surface -64).
# Written by hand (A2/A6 octopods agent, D-200); run with tools/heavy.sh 6 build-xeen/game/openyamm --world xeen
