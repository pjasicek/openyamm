# Rotating doors (`mover: rotation`, open_away) through a save and load: FD-04's door 10 (event 55, the Tome's room)
# saved open, and door 7 (event 54, the roof stair) saved closed and then open. After each load the party walks
# through the open doorway or past the closed leaf, inside its swing. A3's 37th-session report (q-f1 --reload stuck
# beside door 7 after a load) was a hostile Phase Dragon (actor 9, radius 200) that the reload's half second of
# dismissal time brought into the walk's path, not the door; this keeps the doors' saved poses covered. Needs
# assets_dev's Xeen world (git-ignored). A1, merge point 44.
id: xeen.fd04.rotating_door_reload
title: FD-04's rotating doors keep their collision through a save and load, closed and open
world: xeen
mode: faithful
tags: [xeen, mechanisms, save_load, regression]
steps:
  - new_game_flow:
      start_map: xeen_fd04.blv
  - setup_shortcut: {kind: immortal}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - clear_hostiles: {radius: 30000}
  - set_pose: {map: xeen_fd04.blv, x: -882, y: 1125, z: 3840, yaw: 3.1416, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  # Door 10 opens away from the party (east of it), so its leaf swings west, out of the doorway.
  - play_lua: {source: "open_door(55, 10)"}
  - reload: {}
  - play_lua: {source: "if door_state(10) ~= 'open' then error('door 10 is ' .. door_state(10) .. ' after the load') end"}
  - walk_to: {x: -1312, y: 1300, z: 3840, radius: 64, timeout_seconds: 15, close_dialogs: true}
  - reload: {}
  - walk_to: {x: -943, y: 1167, z: 3840, radius: 64, timeout_seconds: 15, close_dialogs: true}
  # Door 7 shut: the walk south passes inside its swing (pivot (-1056, -104), leaf 256 long).
  - reload: {}
  - play_lua: {source: "if door_state(7) ~= 'closed' then error('door 7 is ' .. door_state(7) .. ' after the load') end"}
  - walk_to: {x: -900, y: 24, z: 3840, radius: 48, timeout_seconds: 15, close_dialogs: true}
  # Door 7 opens away from the party (east of it): its leaf swings west and the doorway is clear after a load.
  - play_lua: {source: "open_door(54, 7)"}
  - reload: {}
  - play_lua: {source: "if door_state(7) ~= 'open' then error('door 7 is ' .. door_state(7) .. ' after the load') end"}
  - walk_to: {x: -1150, y: 24, z: 3840, radius: 64, timeout_seconds: 15, close_dialogs: true}
