id: xeen.nystor_boats_back
title: "Xeen D-150: Captain Nystor's boats run both ways (Rivercity - Vertigo, Rivercity - the upriver landing)"
world: xeen
mode: faithful
tags: [xeen, houses, transport]
steps:
  - note:
      text: >-
        D-150 (X1 p30, 2026-11-25): each landing of Nystor's boat has a boat back to Rivercity, its own boats house.
        X1's Nystor's Landing (house 4042, Rudd, route 433 to rivercity_dock mon/wed/fri/sun, 1 day) and X4's
        (house 4187, Marla, route 434 tue/sat, 2 days, after q-c23.done). The houses are entered by evt.EnterHouse,
        not by their map doors (thing:nystor_post on X1 and X4, the map lane's), so this holds before and after the
        maps' rebuilds. A new game starts on a Monday at 9:00.
  - new_game_flow:
      start_map: xeen_x2.odm
      party:
        gold: 5000
        food: 20
        members:
          - {name: Hilda, class: Knight, level: 1, skills: [], equipment: {}}
  - setup_shortcut: {kind: immortal}
  # Round trip 1, Monday: Rivercity to Vertigo's creek bank (route 403), Tuesday there.
  - lua_event: {source: "evt.EnterHouse(4063)"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - select_topic: {match_label: "1 day to Vertigo Meadows for 100 gold"}
  - advance_runtime: {seconds: 2, follow_map_move: true}
  - assert: {map: xeen_x1.odm}
  - assert: {party_position: {x: -7168, y: 4506, radius: 128}}
  # Tuesday: no boat back today; Wednesday: route 433 to Rivercity's dock.
  - lua_event: {source: "evt.EnterHouse(4042)"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {text_absent: "to Rivercity and Lake Darzog"}}
  - play_lua: {source: "close(); close()"}
  - advance_game_time: {hours: 24}
  - advance_runtime: {seconds: 1}
  - lua_event: {source: "evt.EnterHouse(4042)"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, house_title: "Nystor's Landing"}}
  - select_topic: {match_label: "1 day to Rivercity and Lake Darzog for 100 gold"}
  - advance_runtime: {seconds: 2, follow_map_move: true}
  - assert: {map: xeen_x2.odm}
  - assert: {party_position: {x: 6660, y: 4240, radius: 128}}
  - assert: {dialog: {active: false}}
  # Round trip 2: the upriver boat runs once Q-C23 has ended the ogres' boulders (route 407 up, 434 back).
  - setup_shortcut: {kind: set_qbit, id: 112461}
  # Thursday: Nystor's boat upriver sails on Tuesdays and Saturdays; to Saturday.
  - advance_game_time: {hours: 48}
  - advance_runtime: {seconds: 1}
  - lua_event: {source: "evt.EnterHouse(4063)"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - select_topic: {match_label: "2 days to Burlock Savannah for 100 gold"}
  - advance_runtime: {seconds: 2, follow_map_move: true}
  - assert: {map: xeen_x4.odm}
  - assert: {party_position: {x: 9728, y: -18944, radius: 128}}
  # Monday: no boat back today; Tuesday: route 434 down to Rivercity's dock.
  - lua_event: {source: "evt.EnterHouse(4187)"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {text_absent: "to Rivercity and Lake Darzog"}}
  - play_lua: {source: "close(); close()"}
  - advance_game_time: {hours: 24}
  - advance_runtime: {seconds: 1}
  - lua_event: {source: "evt.EnterHouse(4187)"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, house_title: "Nystor's Landing"}}
  - select_topic: {match_label: "2 days to Rivercity and Lake Darzog for 100 gold"}
  - advance_runtime: {seconds: 2, follow_map_move: true}
  - assert: {map: xeen_x2.odm}
  - assert: {party_position: {x: 6660, y: 4240, radius: 128}}
  - assert: {dialog: {active: false}}
