# Xeen side quest Q-D27, Genie Lamps: D2's small lamp (the map lane's own, one small wish, no choice; source/quests/
# q-d27.yml's header). From a new game on D2, a level-20 party placed on the genie's ledge (outdoors, PLAYBOOK.md
# section 2): event 46, 5,000 gold and its status line, once (map variable 9); a second rub pays nothing and says
# "The lamp is cold. Its genie has gone back in for good." (A6, 2026-11-21 14:31-14:35).
# Places: devdocs/xeen/briefs/d2/L4/playtest.yml (the genie's ledge). Map Lua: events/maps/xeen_d2.lua event 46.
#   build-xeen/game/openyamm --headless-run-scenario tests/scenarios/xeen/side_quests/q-d27_genie_lamps_d2.yml --scenario-no-color
id: xeen.side_quests.q-d27.d2
title: "Xeen Q-D27: D2's small genie lamp"
world: xeen
mode: faithful
tags: [xeen, side_quest]
steps:
  - new_game_flow:
      start_map: xeen_d2.odm
      party:
        gold: 0
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 20, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 20, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 20, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 20, skills: [], equipment: {}}
  - setup_shortcut: {kind: immortal}
  - advance_runtime: {seconds: 4, present_dialogs: true}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - assert: {map: xeen_d2.odm}
  - set_pose: {map: xeen_d2.odm, x: 18432, y: 16640, z: 2288, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - play_lua:
      source: |
        remember("gold", gold()); status(); click(46); wait(0.5)
        local s = status() or ""
        if not string.find(s, "grants you a small wish: 5,000 gold. 'Small wishes come true,'", 1, true) then error("D2's lamp said: " .. s) end
        if gold() - recall("gold") ~= 5000 then error("D2's lamp paid " .. (gold() - recall("gold"))) end
        click(46); wait(0.5)
        if gold() - recall("gold") ~= 5000 then error("D2's lamp paid twice") end
        local again = status() or ""
        if not string.find(again, "The lamp is cold. Its genie has gone back in for good.", 1, true) then error("D2's lamp again said: " .. again) end
