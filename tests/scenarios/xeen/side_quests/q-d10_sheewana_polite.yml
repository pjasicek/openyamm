  - heal_at_temple: {house: 4455, min: 0}
  - travel: {map: xeen_d2.odm, days: 1}
  - play_lua: {source: "wait(1); for _ = 1, 3 do if not close() then break end end"}
  # Sharla's house (now two residents): Sharla, Sheewana (done: two Energy Disks, 1,000 gold, Hunter -> Ranger Lord),
  # again; Sheewana: Home.
  - set_pose: {map: xeen_d2.odm, x: -19300, y: -10839, z: 992, yaw: 2.2513, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - play_lua: {source: "for _, i in ipairs({0}) do local c = conditions(i); for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious', 'Asleep'}) do if c:find(n, 1, true) then error('member ' .. i .. ' cannot act before Sharla and Sheewana: ' .. c) end end end"}
  - play_lua: {source: "remember('gold', gold()); remember('disks2', item_count(12334)); for i = 0, 3 do remember('xp' .. i, experience(i)) end"}
