  - play_lua:
      source: |
        for _ = 1, 3 do if not close() then break end end
        while held() ~= 0 do if not stow() then error("cannot stow " .. held()) end end
        if item_count(12334) ~= recall("disks2") + 2 then error("Sharla's disks: " .. item_count(12334)) end
        if item_count(12334) ~= 4 then error("Energy Disks in all: " .. item_count(12334)) end
        if gold() - recall("gold") ~= 1000 then error("Sharla paid " .. (gold() - recall("gold"))) end
        for i = 0, 3 do
          local gain = experience(i) - recall("xp" .. i)
          if gain ~= 0 then error("member " .. i .. " Sharla's pay gave " .. gain .. " XP") end
        end
        if classes() ~= "RangerLord Knight Cleric Sorcerer" then error("the polite route: " .. classes()) end
        log("Q-D10 polite done: " .. classes() .. "; gold " .. gold() .. "; Energy Disks " .. item_count(12334))
  # started stays set; its journal line ends with done (the quest file's until).
  - assert: {qbit_set: [113200, 113201, 113204, 113205, 113206, 113207, 113210, 113211, 113212, 113213, 113214, 113215, 113216]}
