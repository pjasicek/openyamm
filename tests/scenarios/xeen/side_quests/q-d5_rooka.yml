# Xeen side quest Q-D5, Rooka (D1, DD-01), from a new game on D1 with a level-19 party. Down the iron hatch in
# Castleview's square (D1 event 145) into the Castleview Sewer. The drain cross, the west drain, Valio in his bed (bed
# event 3): Rats (started, the Rooka autonote 4450), again ("No reward for you yet!"). The overflow stair to the deep
# cistern and the rat runs: the culvert is flooded (event 9); back up to the jammed sluice (lever event 34: the culvert
# drains); down through the drained culvert and up the nest ramp: Rooka the Rat Queen (actor 36) struck down, the
# hook's line (rooka_slain, 3,000 XP each on top of her kill's share); the rest of the nest cleared. Back the same way to
# Valio: Rats (done: "my chest"), his chest (event 8: the diploma line, chest_opened, no anger; 300 gold and T2
# random treasure); Rats again ("good to see you again"). Back to the hatch's ladder (event 17, OK) and up to the square.
# The other way (the chest opened before he pays: Valio turns) is not played; DD-01's playtest_valio.yml checks it.
# Routes: devdocs/xeen/briefs/dd01/L4/playtest.yml, playtest_exit_hatch.yml; the chain's segment 45 (which also plays
# M16's necklace, not this quest's). Quest logic: source/quests/q-d5.yml. Prep: prep/q-d5.md.
#   python3 tests/scenarios/xeen/side_quests/run.py q-d5_rooka.yml
id: xeen.side_quests.q-d5
title: "Xeen Q-D5: Rooka the Queen Rat killed in the Castleview Sewer; Valio pays with his chest"
world: xeen
mode: faithful
tags: [xeen, side_quest]
steps:
  - new_game_flow:
      start_map: xeen_d1.odm
      party:
        gold: 200
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 19, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 19, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 19, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 19, skills: [], equipment: {}}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d1.odm}
  - advance_runtime: {seconds: 4, present_dialogs: true}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; log('classes: ' .. classes())"}
  - assert: {qbit_clear: [113100, 113101, 113102, 113103, 113104]}
  - assert: {autonote: {id: 4450, present: false}}
  # The iron hatch in Castleview's square (D1 event 145): the ladder down into the sewer.
  - set_pose: {map: xeen_d1.odm, x: 1024, y: 3328, z: 1160, yaw: 0.0, pitch: 0.0}
  - clear_hostiles: {radius: 2000}
  - advance_runtime: {seconds: 0.5}
  - play_lua: {source: "click(145)"}
  # F16: the standard entrance window.
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_dd01.blv}
  - assert: {party_position: {x: 0, y: -1088, radius: 96, z_min: -8, z_max: 8}}
  - advance_runtime: {seconds: 3, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "THE CASTLEVIEW SEWER"}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; wait(0.5)"}
  # The drain cross and the west drain to Valio's niche.
  - walk_to: {x: 0, y: -500, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -480, y: 0, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "open_door(11, 2)"}
  - walk_to: {x: -1000, y: -240, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: -2880, y: -200, z: 0, radius: 64, timeout_seconds: 40, clear_hostiles: 2500, close_dialogs: true}
  - walk_to: {x: -2880, y: -1728, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 2500, close_dialogs: true}
  - walk_to: {x: -2240, y: -1700, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  # Valio in his bed: Rats (started, the autonote), again.
  - play_lua: {source: "click(3); wait(1)"}
  - select_topic: {match_label: Rats}
  - assert: {dialog: {text_contains: "Maybe you could kill the Queen Rat for me. I'll give you something if you do."}}
  - select_topic: {match_label: Rats}
  - assert: {dialog: {text_contains: "The Queen Rat is still alive. I can hear her awful chittering"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - assert: {qbit_set: [113100]}
  - assert: {autonote: {id: 4450}}
  # The overflow stair, the deep cistern, the rat runs: the culvert is flooded to its roof.
  - walk_to: {x: -2040, y: -1728, z: 0, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "open_door(16, 7)"}
  - walk_to: {x: -1600, y: -1728, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - walk_to: {x: -1152, y: -2200, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1152, y: -3500, z: -430, z_tolerance: 120, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1152, y: -4000, z: -512, radius: 64, timeout_seconds: 20, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: -200, y: -4288, z: -512, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 600, y: -4100, z: -512, radius: 64, timeout_seconds: 20, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: 1280, y: -3360, z: -512, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua:
      source: |
        status()
        click(9); wait(0.5)
        local seen = status()
        if not string.find(seen, "flooded to its roof", 1, true) then error("the culvert said: " .. seen) end
  # Back up to the jammed sluice: its lever shuts the gate and the culvert drains.
  - walk_to: {x: 600, y: -4100, z: -512, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1152, y: -4000, z: -512, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1152, y: -2200, z: 0, z_tolerance: 120, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1600, y: -1728, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -2880, y: -1728, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -2880, y: -200, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1408, y: 200, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1408, y: 800, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: -1280, y: 1900, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - play_lua: {source: "click(34); wait(1)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "The gate drops shut"}}
  - play_lua:
      source: |
        close(); wait(7)
        if door_state(10) ~= "open" then error("the culvert did not drain: " .. door_state(10)) end
  # Down again, through the drained culvert and up the nest ramp.
  - walk_to: {x: -1408, y: 200, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -2880, y: -200, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -2880, y: -1728, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1600, y: -1728, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1152, y: -2200, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1152, y: -4000, z: -512, z_tolerance: 120, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 600, y: -4100, z: -512, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 1280, y: -3360, z: -512, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 1280, y: -2496, z: -512, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 1280, y: -1600, z: -420, z_tolerance: 150, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 2100, y: -1408, z: -240, z_tolerance: 80, radius: 64, timeout_seconds: 20, clear_hostiles: 1200, close_dialogs: true}
  # Rooka (actor 36) struck down: rooka_slain, 3,000 XP each from the hook and 204 from her kill (level 24: 816 / 4).
  - play_lua: {source: "if qbit(113101) then error('rooka_slain set before her death') end; for i = 0, 3 do remember('xp' .. i, experience(i)) end"}
  - damage_actor: {actor_index: 36, amount: 100000}
  - advance_runtime: {seconds: 3, present_dialogs: true}
  - play_lua:
      source: |
        close()
        if not qbit(113101) then error("rooka_slain not set") end
        for i = 0, 3 do
          local gain = experience(i) - recall("xp" .. i)
          if gain ~= 3204 then error("member " .. i .. " Rooka's death gave " .. gain) end
        end
  - clear_hostiles: {radius: 4000}
  # Back the same way, through the drained culvert, to Valio.
  - walk_to: {x: 1280, y: -1600, z: -420, z_tolerance: 150, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 1280, y: -2496, z: -512, z_tolerance: 120, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 1280, y: -3360, z: -512, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 600, y: -4100, z: -512, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1152, y: -4000, z: -512, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1152, y: -2200, z: 0, z_tolerance: 120, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1600, y: -1728, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -2240, y: -1700, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  # Valio: Rats (done: his chest); the chest (the diploma, no anger); Rats again.
  - play_lua: {source: "click(3); wait(1)"}
  - select_topic: {match_label: Rats}
  - assert: {dialog: {text_contains: "You've killed the Queen Rat! Here is your reward: my chest."}}
  - select_topic: {match_label: Rats}
  - assert: {dialog: {text_contains: "It's good to see you again."}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - assert: {qbit_set: [113102]}
  - play_lua: {source: "remember('gold', gold()); local n = 0; for c in pack_items():gmatch('x(%d+)') do n = n + tonumber(c) end; remember('items', n); click(8); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "Valio Magnus, graduated 787 cum laude, School of Evil Wizardry. Valio smiles simply."}}
  - play_lua:
      source: |
        close(); wait(0.5)
        if not take_chest() then error("Valio's chest is not open after the diploma") end
        close(); wait(0.5)
        while held() ~= 0 do if not stow() then error("cannot stow " .. held()) end end
        if not qbit(113103) then error("chest_opened not set") end
        if qbit(113104) then error("Valio was angered by a paid chest") end
        local n = 0
        for c in pack_items():gmatch("x(%d+)") do n = n + tonumber(c) end
        local gold_gain, items_gain = gold() - recall("gold"), n - recall("items")
        -- the chest: its 300 gold and T2 random treasure (more gold, items: random, so only the gold's floor).
        if gold_gain < 300 then error("Valio's chest gave " .. gold_gain .. " gold and " .. items_gain .. " items") end
        log("Q-D5 done: chest " .. gold_gain .. " gold and " .. items_gain .. " item")
  - assert: {actor_visible: {actor_index: 46, monster_id: 11193, hidden: true}}
  # Back to the hatch's ladder and up into Castleview's square.
  - walk_to: {x: -2880, y: -1728, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -2880, y: -200, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1000, y: -240, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -480, y: 0, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 0, y: -1000, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(17); wait(0.5)"}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d1.odm}
  - play_lua: {source: "wait(1); for _ = 1, 3 do if not close() then break end end"}
  # started stays set; its journal line ends with done (the quest file's until).
  - assert: {qbit_set: [113100, 113101, 113102, 113103]}
  - assert: {qbit_clear: [113104]}
