# Xeen side quest Q-C6, Ghosts of Winterkill (X5), from a new game in Winterkill's square. The signboard spells the
# loop ("1) Destroy all ghosts. 2) Bang southern gong. 3) Re-visit Randon."); Mayor Randon by the gongs starts it; the
# southern gong rung over a live wave only mocks; then three times: the wave destroyed round the town's streets (the
# map's kill timer sets its `laid` bit), the southern gong (q-c6.gong: rung), Randon (Spirit Bones, then Polter-Fools,
# then Ghost Riders; the next wave appears on his word). At the end: Ghostslayers Extraordinaire (award 405), 2,000 gold;
# the northern gongs twice each and the old well (+25 Might), and the cursed chest opens. Outdoors the party is placed
# at Randon (PLAYBOOK.md section 2); the waves are fought on foot.
# Route: devdocs/xeen/briefs/x5/L4/playtest.yml (Winterkill). Quest logic: source/quests/q-c6.yml.
#   build-xeen/game/openyamm --headless-run-scenario tests/scenarios/xeen/side_quests/q-c6_ghosts_of_winterkill.yml --scenario-no-color
id: xeen.side_quests.q-c6
title: "Xeen Q-C6: three waves of ghosts, the southern gong and Mayor Randon"
world: xeen
mode: faithful
tags: [xeen, side_quest]
