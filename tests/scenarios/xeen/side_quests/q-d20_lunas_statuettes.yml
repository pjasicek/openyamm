        if not qbit(113407) then error("done 113407 not set") end
        if item_count(12350) ~= 0 or item_count(12351) ~= 0 then error("Luna did not take the statuettes") end
        if experience(0) ~= recall("xp_after") then error("the altar paid experience") end
        if gold() ~= recall("gold") then error("Luna paid gold") end
        if classes() ~= "MasterArcher Knight Cleric Sorcerer" then error("the altar's promotion: " .. classes()) end
        local before, gained = {}, 0
        for id in string.gmatch(recall("items"), "(%d+)x") do before[id] = true end
        for id, n in string.gmatch(pack_items(), "(%d+)x(%d+)") do if not before[id] then gained = gained + tonumber(n) end end
        if gained < 2 then error("fewer than two T5 items for the Dragon and the Griffin: " .. pack_items()) end
        log("Q-D20 done: " .. classes())
  - assert: {qbit_set: [113404, 113405, 113406, 113407]}
