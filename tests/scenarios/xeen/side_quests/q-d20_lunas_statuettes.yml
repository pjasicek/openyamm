  - walk_to: {x: 15350, y: 1850, z: -512, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "click(42); wait(0.5)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "still haven't a clue where that statuette is"}}
  # D-90 (c), DD-20 rebuilt 2026-11-22 (A8): the Golden Dragon lies at the niche's foot as a ground item.
  - play_lua: {source: "close(); if ground_items(12350) ~= 1 then error('the Golden Dragon is not in the niche') end"}
  - walk_to: {x: 15560, y: 1856, z: -512, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - pick_up: {item_id: 12350}
  - play_lua: {source: "if held() ~= 0 then stow() end; if item_count(12350) ~= 1 then error('no Golden Dragon') end; if ground_items(12350) ~= 0 then error('a second dragon') end"}
  # Back by the warren and the cross to the sump, and up its ladder (DD-20 event 34) to D4. (The outfall walks back
