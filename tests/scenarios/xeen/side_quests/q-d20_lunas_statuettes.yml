  - walk_to: {x: 6400, y: -560, z: -512, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 4400, y: -500, z: -512, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 3700, y: -450, z: -512, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 3456, y: -640, z: -512, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - clear_hostiles: {radius: 1500}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; click(34); wait(0.5)"}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d4.odm}
  - assert: {party_position: {x: 3072, y: -9728, radius: 160}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Overland to D3: the Eastern Tower (D3 event 104) with Q-D19's key (that side quest's Ali Baba chest in DD-06).
  - travel: {map: xeen_d3.odm, days: 1}
  - assert: {map: xeen_d3.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - play_lua: {source: "log('CONVENTION prerequisite q-d19 Eastern Tower key 12340: from Q-D19 s Ali Baba chest in DD-06 (its own side quest), given here as q-d18_jewel_of_ages.yml does')"}
  - grant_item: {item_id: 12340, member_index: 0}
  - play_lua: {source: "for _ = 1, 3 do if held() ~= 0 then stow() end end"}
