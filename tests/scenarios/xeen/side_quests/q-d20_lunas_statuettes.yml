  # Overland to D1: Luna: the Dragon and the Griffin back; all three on the altar; The altar; Statuettes again.
  - travel: {map: xeen_d1.odm, days: 2}
  - assert: {map: xeen_d1.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - set_pose: {map: xeen_d1.odm, x: -16691, y: 717, z: 1190, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - play_lua: {source: "for _, i in ipairs({0}) do local c = conditions(i); for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious', 'Asleep'}) do if c:find(n, 1, true) then error('member ' .. i .. ' cannot act before the altar: ' .. c) end end end"}
  - play_lua: {source: "remember('items', pack_items()); remember('gold', gold()); for i = 0, 3 do remember('xp' .. i, experience(i)) end"}
  - interact_actor: {actor_index: 32}
  - advance_runtime: {seconds: 0.5}
  - assert: {dialog: {active: true, source_id: 4952, action_label_present: "Quest"}}
