  - play_lua: {source: "if door_state(9) ~= 'open' then open_door(30, 9) end"}
  - walk_to: {x: 0, y: -1300, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 600, close_dialogs: true}
  - walk_to: {x: 0, y: -1600, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; click(35); wait(0.5)"}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d1.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Luna: the Pegasus back (3,000 XP per member, a T5 item).
  - set_pose: {map: xeen_d1.odm, x: -16691, y: 717, z: 1190, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - play_lua: {source: "remember('items', pack_items()); for i = 0, 3 do remember('xp' .. i, experience(i)) end"}
  - interact_actor: {actor_index: 32}
  - advance_runtime: {seconds: 0.5}
  - assert: {dialog: {active: true, source_id: 4952}}
  - select_topic: {action_id: 45001, match_label: "Quest"}
  - assert: {dialog: {text_contains: "The Pegasus! You are truly great adventurers"}}
  - press_action: {action: cancel_dialog}
  - play_lua:
      source: |
        for _ = 1, 3 do if not close() then break end end
        if held() ~= 0 then stow() end
        if not qbit(113404) or item_count(12349) ~= 0 then error("the Pegasus not returned") end
        for i = 0, 3 do
          if experience(i) - recall("xp" .. i) ~= 3000 then error("member " .. i .. " got " .. (experience(i) - recall("xp" .. i)) .. " XP") end
        end
        local before, gained = {}, nil
        for id in string.gmatch(recall("items"), "(%d+)x") do before[id] = true end
        for id in string.gmatch(pack_items(), "(%d+)x") do if not before[id] then gained = id end end
        if gained == nil then error("no T5 item for the Pegasus: " .. pack_items()) end
        log("the Pegasus' item: " .. gained)
