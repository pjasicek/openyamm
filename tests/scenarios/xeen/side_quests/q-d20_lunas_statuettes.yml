  - assert: {map: xeen_dd07.blv}
  - assert: {party_position: {x: -2496, y: 0, radius: 96, z_min: -8, z_max: 8}}
  - play_lua: {source: "wait(2); for _ = 1, 3 do if not close() then break end end"}
  # DD-07: the first stair hall up to L2, round the second gallery to the cabinet of curiosities.
