  - select_topic: {action_id: 45001, match_label: "Quest"}
  - assert: {dialog: {text_contains: "The Griffin! You are truly great adventurers"}}
  - play_lua:
      source: |
        if classes() ~= "WarriorMage Knight Cleric Sorcerer" then error("promoted before the altar: " .. classes()) end
        for i = 0, 3 do
          if experience(i) - recall("xp" .. i) ~= 6000 then error("member " .. i .. " got " .. (experience(i) - recall("xp" .. i)) .. " XP for two statuettes") end
