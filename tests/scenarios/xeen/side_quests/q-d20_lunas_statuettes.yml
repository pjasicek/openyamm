  - walk_to: {x: 1760, y: 320, z: 640, radius: 48, clear_hostiles: 1500, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(31); wait(0.8)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[A golden griffin in a mage's curio cabinet]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "if take_chest() then close() end; if held() ~= 0 then stow() end; if not qbit(113403) then error('griffin_found 113403 not set') end; if not has_item(12351) then error('no Golden Griffin') end; click(31); wait(0.8)"}
  # D-90 (b): the emptied chest opens again, with no line of its own.
  - play_lua: {source: "close(); if held() ~= 0 then stow() end; if item_count(12351) ~= 1 then error('a second griffin') end"}
