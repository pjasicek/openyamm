# Xeen side quest Q-D20, Luna's Statuettes (D1, DD-05, D4, DD-20, D3, DD-07), from a new game on D1 with a Warrior Mage
# in a level-34 party. Luna in her grove (D1, actor 32, NPC 4952): Statuettes (started 113400, autonote 4600), and
# again. The Western Tower by its front door (Q-D6's tower_opened, a CONVENTION prerequisite: Q-D6 is its own side
# quest): L1's north ledge (the Golden Pegasus, a ground item since D-90); out. Luna: the
# Pegasus back (3,000 XP per member, a T5 item). Overland to D4: the Guild's riddle answered wrong ("broom"), the
# trapdoor into DD-20's sump; the sewer walked to the Dragon's niche (the dead man's journal; event 1: the Golden
# Dragon, dragon_found 113402; again empty); back to the sump and up its ladder. Overland to D3: the Eastern Tower with
# Q-D19's key (a CONVENTION prerequisite); DD-07's L2 cabinet (event 31: the Golden Griffin, griffin_found 113403);
# back down and out. Overland to D1: Luna: the Dragon and the Griffin back (3,000 XP and a T5 item each), all three on
# the altar; The altar (done 113407, the Warrior Mage a Master Archer, nothing else); Statuettes again.
# Routes: devdocs/xeen/briefs/d1/L4/playtest.yml (Luna), q-d6_heretics_of_mok.yml (DD-05's front door and L1),
# q-d22_the_coven.yml and briefs/dd20/L4/playtest.yml (the trapdoor, the sewer), q-d18_jewel_of_ages.yml (DD-07).
# Quest logic: source/quests/q-d20.yml.
#   build-xeen/game/openyamm --headless-run-scenario tests/scenarios/xeen/side_quests/q-d20_lunas_statuettes.yml --scenario-no-color
id: xeen.side_quests.q-d20
title: "Xeen Q-D20: Luna's three golden statuettes; the Warrior Mage a Master Archer"
world: xeen
mode: faithful
tags: [xeen, side_quest]
steps:
  - new_game_flow:
      start_map: xeen_d1.odm
      party:
        gold: 200
        food: 20
        members:
          - {name: Mira, class: WarriorMage, level: 34, skills: [], equipment: {}}
          - {name: Hilda, class: Knight, level: 34, skills: [], equipment: {}}
          - {name: Aldric, class: Cleric, level: 34, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 34, skills: [], equipment: {}}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d1.odm}
  - advance_runtime: {seconds: 4, present_dialogs: true}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; if classes() ~= 'WarriorMage Knight Cleric Sorcerer' then error('party: ' .. classes()) end"}
  - assert: {qbit_clear: [113400, 113401, 113402, 113403, 113404, 113405, 113406, 113407]}
  # Luna in her grove: Statuettes (started), and again.
  - set_pose: {map: xeen_d1.odm, x: -16691, y: 717, z: 1190, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - interact_actor: {actor_index: 32}
  - advance_runtime: {seconds: 0.5}
  - assert: {dialog: {active: true, source_id: 4952, action_label_present: "Quest"}}
  - select_topic: {action_id: 45001, match_label: "Quest"}
  - assert: {dialog: {text_contains: "Start with the thieves of the Great Southern Tower"}}
  - select_topic: {action_id: 45001, match_label: "Quest"}
  - assert: {dialog: {text_contains: "I see you haven't found all of the statuettes yet."}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - assert: {qbit_set: [113400]}
  - assert: {autonote: {id: 4600}}
  # The Western Tower's front door (D1 event 118). Q-D6's tower_opened stands for that side quest's front door, opened
  # from inside with the cult's key (q-d6_heretics_of_mok.yml plays it); without it the way in is the heretics' rope
  # to the top floor and the whole tower down.
  - play_lua: {source: "log('CONVENTION prerequisite q-d6.tower_opened (113125): the Western Tower s front door, opened in Q-D6 (its own side quest, q-d6_heretics_of_mok.yml)')"}
  - console: {line: "qbit set 113125"}
  - set_pose: {map: xeen_d1.odm, x: -16896, y: 14234, z: 1600, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - play_lua: {source: "click(118)"}
  # F16: the standard entrance window.
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_dd05.blv}
  - play_lua: {source: "wait(1); for _ = 1, 3 do if not close() then break end end"}
  - assert: {party_position: {x: 0, y: -1536, radius: 96, z_min: -16, z_max: 16}}
  # DD-05 L1: the door hall, the hall's door, the statuette alcove.
  - walk_to: {x: 0, y: -1300, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 600, close_dialogs: true}
  - play_lua: {source: "clear_hostiles(600); if door_state(9) ~= 'open' then open_door(30, 9) end"}
  - walk_to: {x: 0, y: -1000, z: 0, radius: 48, timeout_seconds: 20, clear_hostiles: 600, close_dialogs: true}
  - walk_to: {x: -300, y: -850, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 600, close_dialogs: true}
  - walk_to: {x: 0, y: -300, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 600, close_dialogs: true}
  - clear_hostiles: {radius: 600}
  - walk_to: {x: 400, y: 1000, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 600, close_dialogs: true}
  # D-90 (c), DD-05 rebuilt 2026-11-22 (A8): the Golden Pegasus stands on the north ledge as a ground item.
  - play_lua: {source: "if ground_items(12349) ~= 1 then error('the Golden Pegasus is not on its ledge') end"}
  - walk_to: {x: 0, y: 1000, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - pick_up: {item_id: 12349}
  - play_lua: {source: "if held() ~= 0 then stow() end; if item_count(12349) ~= 1 then error('no Golden Pegasus') end; if ground_items(12349) ~= 0 then error('a second Pegasus') end"}
  # Back to the door hall and out by the front door (event 35).
  - walk_to: {x: 0, y: -300, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 600, close_dialogs: true}
  - walk_to: {x: -300, y: -850, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 600, close_dialogs: true}
