# Xeen side quest Q-D27, Genie Lamps, D6's three (from a new game on D6, a level-42 party carrying 6,000 gold; outdoors
# the party is placed, PLAYBOOK.md section 2). The pinnacle lamp (event 89, q-d27.d6_pinnacle): Gold (10,000); the islet
# lamp in Corak's lake (event 90, q-d27.d6_islet): Gems (ten); each then cold. The crag's greedy lamp (event 91,
# q-d27.d6_crag), saved before it: Yes, greed punished (the genie takes 5,000 back, "with interest" when cold); the save
# loaded: No, the genie shares 5,000 (Aladdin's advice, D3).
# Places: tests/scenarios/xeen/hooks_d5_d6.yml. Quest logic: source/quests/q-d27.yml, Xeen.genieLamp in xeen_common.lua.
#   build-xeen/game/openyamm --headless-run-scenario tests/scenarios/xeen/side_quests/q-d27_genie_lamps_d6.yml --scenario-no-color
id: xeen.side_quests.q-d27.d6
title: "Xeen Q-D27: D6's genie lamps, Gold and Gems, and the greedy genie both ways"
world: xeen
mode: faithful
tags: [xeen, side_quest]
steps:
  - new_game_flow:
      start_map: xeen_d6.odm
      party:
        gold: 6000
        food: 20
        members:
          - {name: Brokk, class: Knight, level: 42, skills: [], equipment: {}}
          - {name: Hild, class: Cleric, level: 42, skills: [], equipment: {}}
          - {name: Ivar, class: Archer, level: 42, skills: [], equipment: {}}
          - {name: Sefa, class: Sorcerer, level: 42, skills: [], equipment: {}}
  - setup_shortcut: {kind: immortal}
  - advance_runtime: {seconds: 4, present_dialogs: true}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - assert: {map: xeen_d6.odm}
  - assert: {qbit_clear: [113542, 113543, 113544]}
  # The pinnacle lamp (event 89): Gold.
  - set_pose: {map: xeen_d6.odm, x: -14464, y: 12288, z: 1696, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - play_lua: {source: "remember('gold', gold()); click(89); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "I will grant you one of three wishes."}}
  - assert: {dialog: {active: true, action_label_present: "Gems"}}
  - answer_input: {text: "Gold"}
  - advance_runtime: {seconds: 0.5}
  - assert: {dialog: {active: true, text_contains: "gold pours out of the lamp's spout until it doesn't. (10,000 gold)"}}
  - play_lua:
      source: |
        close(); wait(0.3)
        if gold() - recall("gold") ~= 10000 then error("d6_pinnacle: Gold paid " .. (gold() - recall("gold"))) end
        if not qbit(113542) then error("q-d27.d6_pinnacle 113542 not set") end
        remember('gold', gold())
        click(89); wait(0.5)
  - assert: {dialog: {active: true, text_contains: "The lamp is cold. Its genie has gone."}}
  - play_lua: {source: "close(); wait(0.3); if gold() ~= recall('gold') then error('d6_pinnacle: the cold lamp paid gold') end"}
  # The islet lamp in Corak's lake (event 90): Gems.
  - set_pose: {map: xeen_d6.odm, x: 896, y: 512, z: 1504, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - play_lua: {source: "remember('gems', item_count(180)); click(90); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "I will grant you one of three wishes."}}
  - assert: {dialog: {active: true, action_label_present: "Gems"}}
  - answer_input: {text: "Gems"}
  - advance_runtime: {seconds: 0.5}
  - assert: {dialog: {active: true, text_contains: "ten gems roll out of the lamp, still warm."}}
  - play_lua:
      source: |
        close(); wait(0.3)
        for _ = 1, 3 do if held() ~= 0 then stow() end end
        if item_count(180) - recall("gems") ~= 10 then error("d6_islet: Gems gave " .. (item_count(180) - recall("gems"))) end
        if not qbit(113543) then error("q-d27.d6_islet 113543 not set") end
        remember('gems', item_count(180))
        click(90); wait(0.5)
  - assert: {dialog: {active: true, text_contains: "The lamp is cold, and warm on one side from the lava. Its genie has gone."}}
  - play_lua: {source: "close(); wait(0.3); for _ = 1, 3 do if held() ~= 0 then stow() end end; if item_count(180) ~= recall('gems') then error('d6_islet: the cold lamp gave gems') end"}
  # The crag's greedy lamp (event 91): a save first; Yes, the genie takes 5,000 of the party's gold.
  - set_pose: {map: xeen_d6.odm, x: 12160, y: -18944, z: 3456, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - save_game: {name: "Q-D27 at the crag lamp", path: output/xeen_sidequests/darkside_e/q-d27_d6_crag.oysav}
  - play_lua: {source: "remember('gold', gold()); click(91); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "My powers are low. I can give you 10,000 gold, but it is all that I have. Do you want it?"}}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 0.5}
  - assert: {dialog: {active: true, text_contains: "I'm taking my gold back, plus interest!"}}
  - play_lua:
      source: |
        close(); wait(0.3)
        if gold() - recall("gold") ~= -5000 then error("greed changed gold by " .. (gold() - recall("gold"))) end
        if not qbit(113544) then error("q-d27.d6_crag 113544 not set") end
        click(91); wait(0.5)
  - assert: {dialog: {active: true, text_contains: "The lamp is cold. Its genie has gone, with interest."}}
  - play_lua: {source: "close(); wait(0.3)"}
  # The save loaded: No, the genie shares.
  - load_game: {path: output/xeen_sidequests/darkside_e/q-d27_d6_crag.oysav}
  - setup_shortcut: {kind: immortal}
  - advance_runtime: {seconds: 1}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - assert: {map: xeen_d6.odm}
  - assert: {qbit_clear: [113544]}
  - play_lua: {source: "remember('gold', gold()); click(91); wait(0.5)"}
  - answer_input: {text: "No"}
  - advance_runtime: {seconds: 0.5}
  - assert: {dialog: {active: true, text_contains: "why don't we share it, since neither of us seem to be greedy.\" (5,000 gold)"}}
  - play_lua:
      source: |
        close(); wait(0.3)
        if gold() - recall("gold") ~= 5000 then error("sharing changed gold by " .. (gold() - recall("gold"))) end
        if not qbit(113544) then error("q-d27.d6_crag 113544 not set") end
  - assert: {qbit_set: [113542, 113543, 113544]}
