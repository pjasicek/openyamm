# Xeen own quest OBELISKS, the Darkside face (D1-D6): "DIG BENEATH THE BROKEN TRAVEL PYRAMID", from a new game in
# Castleview Vale with a level-40 party (the quest is level 40). Each map's obelisk read in map order (the party
# placed beside it, PLAYBOOK §2; overland between maps by `travel`, as the side quests do): its word in a message, its
# bit (115050-115055) and its autonote (4707-4712). On D5 the broken travel pyramid (event 4) before the sixth
# word: "The pyramid portal has been destroyed.", nothing given. After D6's PYRAMID, back to D5: the fallen
# capstone (event 6) gives the hoard (115057, 20,000 gold and two level-6 items, drawn at random: counted, not
# named); the pyramid again: "Under its capstone: rubble."
# Quest logic: source/quests/obelisks.yml. Prep: prep/obelisks.md. The Cloudside face: obelisks_cloudside.yml.
#   python3 tests/scenarios/xeen/side_quests/run.py obelisks_d
id: xeen.side_quests.obelisks.darkside
title: "Xeen OBELISKS, Darkside: six words on D1-D6 and the hoard under D5's broken pyramid"
world: xeen
mode: faithful
tags: [xeen, side_quest]
steps:
  - new_game_flow:
      start_map: xeen_d1.odm
      party:
        gold: 100
        food: 40
        members:
          - {name: Hilda, class: Knight, level: 40, skills: [], equipment: {}}
          - {name: Aldric, class: Cleric, level: 40, skills: [], equipment: {}}
          - {name: Brann, class: Ranger, level: 40, skills: [], equipment: {}}
          - {name: Mirel, class: Sorcerer, level: 40, skills: [], equipment: {}}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d1.odm}
  - advance_runtime: {seconds: 4, present_dialogs: true}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - assert: {qbit_clear: [115050, 115051, 115052, 115053, 115054, 115055, 115057]}
  # Castleview Vale (D1 event 190): the first word, DIG (115050, autonote 4707).
  - set_pose: {map: xeen_d1.odm, x: -18944, y: -6656, z: 1249, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 4000}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; click(190); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "Carved into the obelisk, the first of six words: DIG."}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; if not qbit(115050) then error('d1 obelisk bit 115050 not set') end"}
  - assert: {autonote: {id: 4707}}
  - travel: {map: xeen_d2.odm, days: 2}
  - assert: {map: xeen_d2.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # the Sprite Forest (D2 event 43): the second word, BENEATH (115051, autonote 4708).
  - set_pose: {map: xeen_d2.odm, x: -14336, y: 6144, z: 1249, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 4000}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; click(43); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "Carved into the obelisk, the second of six words: BENEATH."}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; if not qbit(115051) then error('d2 obelisk bit 115051 not set') end"}
  - assert: {autonote: {id: 4708}}
  - travel: {map: xeen_d3.odm, days: 2}
  - assert: {map: xeen_d3.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # by Sandcaster (D3 event 134): the third word, THE (115052, autonote 4709).
  - set_pose: {map: xeen_d3.odm, x: -6912, y: 18176, z: 1569, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 4000}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; click(134); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "Carved into the obelisk, the third of six words: THE."}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; if not qbit(115052) then error('d3 obelisk bit 115052 not set') end"}
  - assert: {autonote: {id: 4709}}
  - travel: {map: xeen_d4.odm, days: 2}
  - assert: {map: xeen_d4.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # by Lakeside (D4 event 78): the fourth word, BROKEN (115053, autonote 4710).
  - set_pose: {map: xeen_d4.odm, x: -3584, y: -9216, z: 1185, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 4000}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; click(78); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "Carved into the obelisk, the fourth of six words: BROKEN."}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; if not qbit(115053) then error('d4 obelisk bit 115053 not set') end"}
  - assert: {autonote: {id: 4710}}
  - travel: {map: xeen_d5.odm, days: 2}
  - assert: {map: xeen_d5.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # the Desert of Doom (D5 event 49): the fifth word, TRAVEL (115054, autonote 4711).
  - set_pose: {map: xeen_d5.odm, x: -9088, y: -4736, z: 1473, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 4000}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; click(49); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "Carved into the obelisk, the fifth of six words: TRAVEL."}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; if not qbit(115054) then error('d5 obelisk bit 115054 not set') end"}
  - assert: {autonote: {id: 4711}}
  # Before the last word: the broken travel pyramid and its fallen capstone (D5 events 4 and 6) refuses; nothing given.
  - set_pose: {map: xeen_d5.odm, x: 16589, y: -5837, z: 1576, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 4000}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; remember('gold', gold()); local function packed() local n = 0; for c in string.gmatch(pack_items(), '%d+x(%d+)') do n = n + tonumber(c) end; return n end; remember('packed', packed()); click(4); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "The pyramid portal has been destroyed."}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; local function packed() local n = 0; for c in string.gmatch(pack_items(), '%d+x(%d+)') do n = n + tonumber(c) end; return n end; if gold() ~= recall('gold') or packed() ~= recall('packed') then error('the hoard gave before the last word') end; if qbit(115057) then error('hoard bit 115057 set before the last word') end"}
  - travel: {map: xeen_d6.odm, days: 2}
  - assert: {map: xeen_d6.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # the Forbidden Zone (D6 event 85): the last word, PYRAMID (115055, autonote 4712).
  - set_pose: {map: xeen_d6.odm, x: -17408, y: 512, z: 2049, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 4000}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; click(85); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "Carved into the obelisk, the last of six words: PYRAMID."}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; if not qbit(115055) then error('d6 obelisk bit 115055 not set') end"}
  - assert: {autonote: {id: 4712}}
  - assert: {qbit_set: [115050, 115051, 115052, 115053, 115054, 115055]}
  # Every word read: back to the hoard.
  - travel: {map: xeen_d5.odm, days: 2}
  - assert: {map: xeen_d5.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - set_pose: {map: xeen_d5.odm, x: 16589, y: -5837, z: 1576, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 4000}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; remember('gold', gold()); local function packed() local n = 0; for c in string.gmatch(pack_items(), '%d+x(%d+)') do n = n + tonumber(c) end; return n end; remember('packed', packed()); click(6); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "You dig beneath the broken pyramid's capstone. A chest of old Darkside coin waits there, dry as the day it was buried."}}
  - play_lua:
      source: |
        for _ = 1, 3 do if not close() then break end end
        for _ = 1, 4 do if held() ~= 0 then stow() end end
        local function packed() local n = 0; for c in string.gmatch(pack_items(), '%d+x(%d+)') do n = n + tonumber(c) end; return n end
        if gold() - recall('gold') ~= 20000 then error('the hoard gave ' .. (gold() - recall('gold')) .. ' gold') end
        if packed() - recall('packed') ~= 2 then error('the hoard gave ' .. (packed() - recall('packed')) .. ' items') end
        if not qbit(115057) then error('hoard bit 115057 not set') end
        log('darkside hoard: +' .. (gold() - recall('gold')) .. ' gold, +2 items: ' .. pack_items())
        remember('gold', gold()); remember('packed', packed()); click(4); wait(0.5)
  - assert: {dialog: {active: true, text_contains: "The pyramid portal has been destroyed. Under its capstone: rubble."}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; local function packed() local n = 0; for c in string.gmatch(pack_items(), '%d+x(%d+)') do n = n + tonumber(c) end; return n end; if gold() ~= recall('gold') or packed() ~= recall('packed') then error('the hoard gave twice') end"}
  - assert: {qbit_set: [115050, 115051, 115052, 115053, 115054, 115055, 115057]}
