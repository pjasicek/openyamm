# Xeen side quest Q-D25, The Minotaur's Labyrinth (D4, DD-12), from a new game on D4 with two Minotaurs in a level-38
# party. The Isle of Lost Souls (outdoors, placed); the ruined tower's door opens with Megan's key (M20's, given here)
# into DD-12, walked as the main chain's segment 57: the carving, gates 1-4 answered Yes, L1's hall of storage, L2's
# cells, L3's dials and Soul Waters, L4's Reserve; L5's Soul Maze from the M to the S (the illusion, the dead end's
# chest) to the horned throne in the L (DD-12 event 90, q-d25.throne: done 113500, 3,000 XP per member, both Minotaurs
# Minotaur Lords, the Knight and the Cleric unchanged). Sat on again with nobody to promote (the else line), then a later
# Minotaur (D-74: a member made a Minotaur by a logged test setup, standing for one recruited later): the throne
# promotes him unpaid. On through gate 5, the Songbird's cage (the lift needs it open) and the aviary's lift up to
# L1, out by the double door to the Isle.
# Routes: tests/playthrough/xeen/57_lost_souls.yml (the Isle's door, the DD-12 walk, the lift and the exit),
# devdocs/xeen/briefs/dd12/L4/playtest.yml. Quest logic: source/quests/q-d25.yml (m24.yml for the gates and the door).
#   build-xeen/game/openyamm --headless-run-scenario tests/scenarios/xeen/side_quests/q-d25_minotaurs_labyrinth.yml --scenario-no-color
id: xeen.side_quests.q-d25
title: "Xeen Q-D25: the Soul Maze's horned throne: two Minotaur Lords, and a later Minotaur unpaid"
world: xeen
mode: faithful
tags: [xeen, side_quest]
steps:
  - new_game_flow:
      start_map: xeen_d4.odm
      party:
        gold: 200
        food: 20
        members:
          - {name: Gorn, class: Minotaur, level: 38, skills: [], equipment: {}}
          - {name: Hilda, class: Knight, level: 38, skills: [], equipment: {}}
          - {name: Taur, class: Minotaur, level: 38, skills: [], equipment: {}}
          - {name: Aldric, class: Cleric, level: 38, skills: [], equipment: {}}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d4.odm}
  - advance_runtime: {seconds: 4, present_dialogs: true}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; log('classes: ' .. classes()); if classes() ~= 'Minotaur Knight Minotaur Cleric' then error('party: ' .. classes()) end"}
  - assert: {qbit_clear: [113500, 117440, 117441, 117442, 117443, 117444, 117445]}
  # M20: Megan gives the party the key to the Dungeon of Lost Souls (12344) in Castle Kalindra (segment 57).
  - console: {line: "qbit set 111400"}
  - grant_item: {item_id: 12344, member_index: 1}
  # The Isle of Lost Souls (outdoors: placed on its path, as after Lakeside Yachts' ride); the ruined tower's door.
