# AI arena: MM9 townsfolk and town guards (NPCBase.inc, PoliceMan.inc; MM9_MONSTER_AI_PLAN.md phase 4b). Monster 0, a
# Commoner, is hit by the party (the scenario's damage_actor): it runs to the Town Guard north (monster 1, the one
# guard within 1 600 LT that stands farther than 500 LT from the party), calling for help every 1.5 s; the help call
# about the party turns the guard on it (OnHelp: AddEnemy Player). The guard sees only 600 LT ahead (north) and hears
# 40 LT. The party's hits on a guard are guards.arena.yml's. See README.md.
name: mm9_civilians
world: mm9
map: thearena.blv
asset_root: output/mm9_rework/assets_dev
party:
  position: [0, -1300, 1]
  yaw_degrees: 90
  pitch_degrees: -8
  invulnerable: true
trace: true
monsters:
  - monster_id: 9015
    position: [-500, -700, 1]
    yaw_degrees: 270
    hostile: false
    mm9_ai: {runaway_chance: 0}
  - monster_id: 9107
    position: [400, 900, 1]
    yaw_degrees: 90
    hostile: false
    mm9_ai: {sight: 1536, hearing: 100}
