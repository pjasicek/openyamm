# AI arena: MM9's town guards and monsters at war (PoliceMan.inc AddEnemy AIBase; MM9_MONSTER_AI_PLAN.md phase 4b,
# worlds/mm9/relations.yml, generated). A Town Guard facing west, friendly to the party, notices a Bandit (hostile to
# the party) and fights it; the Bandit takes the guard, the nearer of its two enemies (IsFriend asks both sides: the
# guard counts it an enemy, so it is not the guard's friend either). A second guard beside the party (facing east,
# seeing 600 units) takes the Bandit from the first guard's alert (PoliceAlert: a fellow guard) and counts the party's
# hits: the third makes the party its enemy (PoliceMan.inc OnDamage). See README.md.
