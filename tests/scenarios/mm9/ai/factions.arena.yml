# AI arena: MM9 factions (MM9_MONSTER_AI_PLAN.md phase 4b). MM9 monsters are friends unless a script sets hate
# (IsFriend's default). A Grey Wolf and a Horde Grunt, not hostile to the party, stand side by side as friends until a
# timed event (evt.SetMonsterRelation, MM9's HateAll as The Arena's bouts write it) sets the wolf on the grunt at 8 s;
# the grunt takes its attacker. See README.md.
name: mm9_factions
world: mm9
map: thearena.blv
asset_root: output/mm9_rework/assets_dev
party:
  position: [0, -1300, 1]
  yaw_degrees: 90
  pitch_degrees: -8
  invulnerable: true
trace: true
monsters:
  - monster_id: 9114
    position: [-200, 900, 1]
    yaw_degrees: 90
    hostile: false
    mm9_ai: {hearing: 50, runaway_chance: 0}
  - monster_id: 9129
    position: [-200, 1100, 1]
    yaw_degrees: 90
    hostile: false
    mm9_ai: {hearing: 50, runaway_chance: 0}
events:
  - {at: 8, relation: [9114, 9129, 2], note: the wolf hates the grunt (HateAll)}
