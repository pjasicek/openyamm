# AI arena: the reposition modifier (an OpenYAMM addition, devdocs/MONSTER_MODIFIERS.md) on an Evil Sorcerer (9157,
# EvilSorcerer.scr: a ranged holder). The east pen's doors (3, 4) open at once; the sorcerer, posted at (600, -600),
# casts at the party in the pit, then the party walks into the pen and stops just past where the pen's west wall hides
# it (out of sight; it still hears it). 2 s later the sorcerer looks for a spot within its 1 024 leash that sees where it
# last saw the party (it does not know where the party went), walks there, sees the party, which stayed where it
# vanished, and casts again. See README.md.
name: mm9_reposition_lost_sight
world: mm9
map: thearena.blv
asset_root: output/mm9_rework/assets_dev
party:
  position: [0, -900, 1]
  # Faces south-west, so that from the pen the window shows the pit (the party's facing does not matter to the AI).
  yaw_degrees: 200
  pitch_degrees: -8
  invulnerable: true
trace: true
monsters:
  - monster_id: 9157
    position: [600, -600, 1]
    yaw_degrees: 90
events:
  # The pen's doors held open: since the 2026-11-05 rebuild they shut 5 s after opening (MM9's CloseWaitTime).
  - {at: 0, door: {id: 3, hold: true}}
  - {at: 0, door: {id: 4, hold: true}}
  # Round the north of the pit, never closing on the monster: no back-off on the way.
  - {at: 4, party_walk: {to: [-300, 300, 1], seconds: 1.5}}
  - {at: 5.5, party_walk: {to: [1700, 100, 1], seconds: 2}}
  - {at: 7.5, party_walk: {to: [1860, -90, 1], seconds: 1}}
