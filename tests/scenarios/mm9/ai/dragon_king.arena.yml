# AI arena: the Dragon King (MM9_MONSTER_AI_PLAN.md phase 5, worlds/mm9/behaviors/dragon_king.lua) on his own map.
# Monster 0, the Dragon King, stands at his DAT place in the bowl, hidden until the map's trigger (a dormant start):
# woken at 1 s he lands (5.8 s) and taunts (2.2 s), then takes the party, which stands within his fire-bolt range.
# Monster 1, a Winged Mutant, idles high over the bowl at MutantMarker0, out of everyone's sight: after 6 s on the
# party he switches to it (he hates every AI: worlds/mm9/relations.yml), and the mutant fights back. The scenario
# steps the party in close (wing buffet and breath), hits him, and walks off beyond his 1 800 LT (TargetTooFar).
name: mm9_dragon_king
world: mm9
map: dragonstadium.blv
asset_root: output/mm9_rework/assets_dev
party:
  position: [1864, -1800, -163]
  yaw_degrees: 90
  pitch_degrees: 8
  invulnerable: true
# MM9's own perception of the party (the boss sequence), not the world's actorAwareness.
party_awareness: mm9
trace: true
monsters:
  - monster_id: 9212
    position: [1864, 737, -163]
    yaw_degrees: 270
    mm9_ai: {runaway_chance: 0, dormant: {until: trigger, pose: hidden}}
  - monster_id: 9160
    position: [3141, -1669, 3259]
    yaw_degrees: 180
    mm9_ai: {runaway_chance: 0}
events:
  - {at: 1, wake: 0, note: DragonTrigger's Trigger (the map's evt.WakeActor)}
