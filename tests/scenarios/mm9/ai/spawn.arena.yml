# AI arena: MM9 spawn-ins and death spawns (GreaterDemon.scr, LesserDemon.scr; MM9_MONSTER_AI_PLAN.md phase 4b), the
# 1000 Terrors spawners' demons ("LesserDemon ScriptParams 1"). Monster 0, a Greater Demon spawned with ScriptParams 1
# (placement script_params "1"), starts hidden, shows its Spawn clip a second later facing the party, then Aware
# (its Taunt), and only then notices the party. Monster 1, a Lesser Demon spawned so, is killed by the scenario: once
# its death clip ends a Greater Demon spawns at its corpse, itself spawned with ScriptParams 1 (it spawns in too).
# Monster 2, a Lesser Demon placed without ScriptParams, dies without one. See README.md.
name: mm9_spawn
world: mm9
map: thearena.blv
asset_root: output/mm9_rework/assets_dev
party:
  position: [0, -1300, 1]
  yaw_degrees: 90
  pitch_degrees: -8
  invulnerable: true
trace: true
monsters:
  - monster_id: 9242
    position: [-500, 600, 1]
    yaw_degrees: 270
    mm9_ai: {runaway_chance: 0, script_params: "1"}
  - monster_id: 9241
    position: [500, 600, 1]
    yaw_degrees: 270
    mm9_ai: {runaway_chance: 0, script_params: "1"}
  - monster_id: 9241
    position: [900, 0, 1]
    yaw_degrees: 270
    mm9_ai: {runaway_chance: 0}
