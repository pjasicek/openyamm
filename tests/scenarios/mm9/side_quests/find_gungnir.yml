# MM9 side quest "Find Gungnir" (guide: Side quests, Arslegard; tools/mm9_site/story/side_b.yml, quest find-gungnir).
# Hanndl the gatekeeper (RUDE 334, actor 9 by Arslegard's Great Gate) lost his spear Gungnir (item 10189); it lies in
# the Inventa Storca under Thronheim, in the black chest (Chest1, trapped) of the lower library's floor compartment that
# the book Secret Switch 1 opens. The party leaves Arslegard by the Thjorgard exit in front of the Great Gate, sails to
# Thronheim (travel), walks the Inventa Storca (upper halls to the south-east room, down through the trapdoor over
# Ladder5, the book, the chest; back up the ladder and out), and returns the only way a living party reaches Arslegard:
# it dies (party_defeat). Hanndl takes the spear: key 357, 40 000 gold, 5 000 experience (NPC334.scr :Gungnir).
# Played per tests/playthrough/PLAYBOOK.md §2. Research: prep/D_inventa_storca_arslegard.md.
#   python3 tests/scenarios/mm9/side_quests/run.py find_gungnir [--repeat 2] [--reload]
id: mm9.side_quests.find_gungnir
title: "MM9 side quest: Hanndl's spear Gungnir from the Inventa Storca's lower library"
world: mm9
mode: faithful
tags: [mm9, side_quests]
steps:
  # A party of the classes Chedian offers, at the level a party reaches Arslegard with; the Thief's Disarm Traps
  # (8, Master: 24) is over twice the Inventa Storca's trap difficulty (map_stats 7), so she disarms the black chest.
  - new_game_flow:
      start_map: arslegardcity.blv
      party:
        gold: 0
        food: 40
        members:
          - {name: Ragnar, class: Knight, level: 28, skills: [{name: Sword, level: 10, mastery: 2}, {name: Shield, level: 6, mastery: 2}, {name: ChainArmor, level: 6, mastery: 2}], equipment: {main_hand: 1, off_hand: 99}}
          - {name: Hrothgar, class: Cleric, level: 28, skills: [{name: Mace, level: 8, mastery: 2}, {name: BodyMagic, level: 8, mastery: 2}, {name: SpiritMagic, level: 8, mastery: 2}], equipment: {main_hand: 66}}
          - {name: Grisha, class: Thief, level: 28, skills: [{name: Dagger, level: 8, mastery: 2}, {name: DisarmTraps, level: 8, mastery: 3}, {name: Perception, level: 8, mastery: 3}, {name: Bow, level: 6, mastery: 2}], equipment: {main_hand: 21, bow: 56}}
          - {name: Aelwen, class: Sorcerer, level: 28, skills: [{name: Staff, level: 6, mastery: 2}, {name: FireMagic, level: 8, mastery: 2}, {name: AirMagic, level: 8, mastery: 2}], equipment: {main_hand: 79}}
  - setup_shortcut: {kind: immortal}
  # Story state: the party is among Arslegard's dead with the gate scenes behind it. Keys 97 and 29: Sven fell at
  # Yorwick and Forad joined (with them, and the Writ, a defeat wakes the party in Arslegard: world.yml partyDeath,
  # MM9's rule; the return below). Key 98: Hanndl's first refusal
  # (FateMan.scr; without it gate_fate starts 3 s after the arrival and moves the party to the Dark Passageway). Keys
  # 100 and 9515: the Writ of Fate shown and the Great Gate opened (WritMan.scr; without 9515 gate_writ would play): in
  # MM9 the dead are let into Arslegard only with the Writ (a defeat before it is a game over), which is the
  # guide's "requires". Set before the arrival scenes' third poll (about 3 s).
  - lua_event: {source: "evt.SetQuestBit(90097) evt.SetQuestBit(90029) evt.SetQuestBit(90098) evt.SetQuestBit(90100) evt.SetQuestBit(99515)"}
  - advance_runtime: {seconds: 4}
  - assert: {map: arslegardcity.blv, qbit_set: [90098, 99515], qbit_clear: [90353, 90354, 90356, 90357]}

  # Hanndl by the gate (actor 9; the peephole's Hanndl is another actor): the errand (key 353).
  - set_pose: {map: arslegardcity.blv, x: 14240, y: 2674, z: -491, yaw: 3.1416, pitch: 0}
  - advance_runtime: {seconds: 0.5}
  - interact_actor: {actor_index: 9}
  - select_topic: {match_label: "You don't seem to like us very much."}
  - select_topic: {match_label: "That's unfortunate.  You must have really upset Krohn."}
  - select_topic: {match_label: "What's Gungnir?"}
  - select_topic: {match_label: "Maybe we could help?"}
  - select_topic: {match_label: "We could find it for you."}
  - press_action: {action: cancel_dialog}
  - advance_runtime: {seconds: 0.5}
  - assert: {qbit_set: [90353]}

  # Out of Arslegard: the Thjorgard exit (ExitTrigger4) lies just north of the wake point, in front of the Great Gate.
  - set_pose: {map: arslegardcity.blv, x: 14400, y: 2525, z: -491, yaw: 1.5708, pitch: 0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 14418, y: 3043, z: -491, plan: false, timeout_seconds: 20, expect: dialog}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.0, follow_map_move: true}
  - assert: {map: thjorgard.blv}

  # Thjorgard to Thronheim (boat or the Mountain Pass), then the Inventa Storca's door at the map's east edge
  # (ExitTrigger5), walked into from its arrival point.
  - travel: {map: thronheim.blv, days: 2}
  - set_pose: {map: thronheim.blv, x: -22416, y: -6100, z: 2573, yaw: -1.5708, pitch: 0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: -22416, y: -6538, z: 2724, timeout_seconds: 20, expect: dialog, clear_hostiles: 2000}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.0, follow_map_move: true}
  - assert: {map: inventastorca.blv}

  # The upper floor, every double door clicked (they shut about 7 s after opening): DoubleDoor13 and 14 west from the
  # entrance hall into the pillared hall, DoubleDoor10 and 9 west through the reading room, the long west hall south,
  # east along the south corridor, DoubleDoor6 into the south room (a pad on its orb table drops a Lich and two
  # Skeletons through the ceiling when the party brushes it, KingKong.scr; they die), DoubleDoor5 east into the small
  # south-east room with the trapdoor.
  - walk_to: {x: -1560, y: 246, z: -891, timeout_seconds: 60, clear_hostiles: 1500}
  - play_lua: {source: 'for i = 1, 40 do local s = door_state(11); if s ~= "closing" and s ~= "opening" then break end; wait(0.25) end; if door_state(11) == "closed" then click(105); wait(1.5) end; log("DoubleDoor13: " .. door_state(11))'}
  - walk_to: {x: -2390, y: 471, z: -891, timeout_seconds: 60, clear_hostiles: 1500}
  - play_lua: {source: 'for i = 1, 40 do local s = door_state(13); if s ~= "closing" and s ~= "opening" then break end; wait(0.25) end; if door_state(13) == "closed" then click(106); wait(1.5) end; log("DoubleDoor14: " .. door_state(13))'}
  - walk_to: {x: -4480, y: 0, z: -860, timeout_seconds: 60, clear_hostiles: 1500}
  - play_lua: {source: 'for i = 1, 40 do local s = door_state(5); if s ~= "closing" and s ~= "opening" then break end; wait(0.25) end; if door_state(5) == "closed" then click(102); wait(1.5) end; log("DoubleDoor10: " .. door_state(5))'}
  - walk_to: {x: -6400, y: 328, z: -860, timeout_seconds: 60, clear_hostiles: 1500}
  - play_lua: {source: 'for i = 1, 40 do local s = door_state(29); if s ~= "closing" and s ~= "opening" then break end; wait(0.25) end; if door_state(29) == "closed" then click(120); wait(1.5) end; log("DoubleDoor9: " .. door_state(29))'}
  - walk_to: {via: [[-6700, 328, -860], [-8500, 300, -860], [-8500, -6800, -860]], x: -5450, y: -6799, z: -860, timeout_seconds: 90, clear_hostiles: 1500}
  - play_lua: {source: 'for i = 1, 40 do local s = door_state(23); if s ~= "closing" and s ~= "opening" then break end; wait(0.25) end; if door_state(23) == "closed" then click(111); wait(1.5) end; log("DoubleDoor6: " .. door_state(23))'}
  - walk_to: {via: [[-5100, -6799, -860]], x: -3932, y: -7150, z: -860, timeout_seconds: 60, clear_hostiles: 1500}
  - advance_runtime: {seconds: 2}
  - clear_hostiles: {radius: 2500}
  - play_lua: {source: 'log("the south room ceiling broken (its pad lies on the orb table): " .. mapvar("BustOut1"))'}
  - walk_to: {x: -3400, y: -7209, z: -860, timeout_seconds: 60, clear_hostiles: 1500}
  - play_lua: {source: 'for i = 1, 40 do local s = door_state(21); if s ~= "closing" and s ~= "opening" then break end; wait(0.25) end; if door_state(21) == "closed" then click(110); wait(1.5) end; log("DoubleDoor5: " .. door_state(21))'}
  # The trapdoor (LadderDoor, event 156; Perception shows it) opens over Ladder5's shaft; the party climbs down the ladder
  # from its top exit on the south side of the hole (grab_at_top: walking from there toward the shaft takes it down).
  - walk_to: {via: [[-3100, -7209, -860]], x: -2300, y: -7180, z: -860, timeout_seconds: 60, clear_hostiles: 1500}
  - play_lua: {source: 'click(156); wait(2); log("the trapdoor: " .. door_state(76))'}
  - climb: {ladder: Ladder5, down: true}
  - advance_runtime: {seconds: 1}

  # The lower library: DoubleDoor4 north out of the ladder room, up the steps through the red room into the hall,
  # DoubleDoor3 south into the book room.
  - walk_to: {x: -1843, y: -6100, z: -1472, timeout_seconds: 30, clear_hostiles: 1500}
  - play_lua: {source: 'for i = 1, 40 do local s = door_state(19); if s ~= "closing" and s ~= "opening" then break end; wait(0.25) end; if door_state(19) == "closed" then click(109); wait(1.5) end; log("DoubleDoor4: " .. door_state(19))'}
  - walk_to: {via: [[-1950, -5000, -1500], [-1950, -4150, -1638], [-1500, -3800, -1638]], x: -614, y: -3800, z: -1638, timeout_seconds: 60, clear_hostiles: 1500}
  - play_lua: {source: 'for i = 1, 40 do local s = door_state(17); if s ~= "closing" and s ~= "opening" then break end; wait(0.25) end; if door_state(17) == "closed" then click(108); wait(1.5) end; log("DoubleDoor3: " .. door_state(17))'}
  # Secret Switch 1, a book on the south face of the fourth bookcase from the south (Perception shows it), opens
  # Secret Panel 1 in the floor at the room's north end over two chests. (The Falling Bookcase Switch on the first
  # bookcase topples them all: not touched.)
  - walk_to: {via: [[-200, -4300, -1638]], x: -200, y: -4956, z: -1638, timeout_seconds: 60, clear_hostiles: 1500}
  - walk_to: {x: -725, y: -4956, z: -1638, plan: false, timeout_seconds: 20}
  - play_lua:
      source: |
        click(171); wait(2)
        log("Secret Switch 1: Secret Panel 1 " .. door_state(79) .. ", the bookcases still (" .. mapvar("Domino") .. ")")
        if door_state(79) ~= "open" then error("Secret Panel 1 did not open") end
  # The black chest (Chest1, event 42; trapped: the Thief disarms it) holds Gungnir.
  - walk_to: {via: [[-200, -4956, -1638], [-200, -4300, -1638]], x: -650, y: -4060, z: -1638, timeout_seconds: 60}
  - play_lua:
      source: |
        click(42); wait(1)
        take_chest(); wait(0.5); close()
        if not has_item(10189) then error("no Gungnir from the black chest") end
        log("Gungnir from the black chest " .. status())

  # Back north through DoubleDoor3, west through the hall and down the red room's steps, DoubleDoor4, and up Ladder5
  # through the open trapdoor (a click from below opens it if it has been shut).
  - walk_to: {via: [[-200, -4300, -1638]], x: -450, y: -4060, z: -1638, timeout_seconds: 60, clear_hostiles: 1500}
  - play_lua: {source: 'for i = 1, 40 do local s = door_state(17); if s ~= "closing" and s ~= "opening" then break end; wait(0.25) end; if door_state(17) == "closed" then click(108); wait(1.5) end; log("DoubleDoor3: " .. door_state(17))'}
  - walk_to: {via: [[-614, -3800, -1638], [-1500, -3800, -1638], [-1950, -4150, -1638]], x: -1843, y: -5800, z: -1472, timeout_seconds: 60, clear_hostiles: 1500}
  - play_lua: {source: 'for i = 1, 40 do local s = door_state(19); if s ~= "closing" and s ~= "opening" then break end; wait(0.25) end; if door_state(19) == "closed" then click(109); wait(1.5) end; log("DoubleDoor4: " .. door_state(19))'}
  - play_lua: {source: 'if door_state(76) ~= "open" then click(156); wait(2) end; log("the trapdoor: " .. door_state(76))'}
  - climb: {ladder: Ladder5}
  # The upper floor back the way the party came, to the exit on the entrance's spiral stair: west from the ladder's top
  # exit (walking from it toward the open shaft takes the ladder down again).
  - walk_to: {via: [[-2900, -7209, -860]], x: -3100, y: -7209, z: -860, timeout_seconds: 60, clear_hostiles: 1500}
  - play_lua: {source: 'for i = 1, 40 do local s = door_state(21); if s ~= "closing" and s ~= "opening" then break end; wait(0.25) end; if door_state(21) == "closed" then click(110); wait(1.5) end; log("DoubleDoor5: " .. door_state(21))'}
  - walk_to: {via: [[-3400, -7209, -860]], x: -5200, y: -6799, z: -860, timeout_seconds: 60, clear_hostiles: 1500}
  - play_lua: {source: 'for i = 1, 40 do local s = door_state(23); if s ~= "closing" and s ~= "opening" then break end; wait(0.25) end; if door_state(23) == "closed" then click(111); wait(1.5) end; log("DoubleDoor6: " .. door_state(23))'}
  - walk_to: {via: [[-5450, -6799, -860], [-8500, -6800, -860], [-8500, 300, -860]], x: -6680, y: 328, z: -860, timeout_seconds: 90, clear_hostiles: 1500}
  - play_lua: {source: 'for i = 1, 40 do local s = door_state(29); if s ~= "closing" and s ~= "opening" then break end; wait(0.25) end; if door_state(29) == "closed" then click(120); wait(1.5) end; log("DoubleDoor9: " .. door_state(29))'}
  - walk_to: {via: [[-6400, 328, -860]], x: -4730, y: 0, z: -860, timeout_seconds: 60, clear_hostiles: 1500}
  - play_lua: {source: 'for i = 1, 40 do local s = door_state(5); if s ~= "closing" and s ~= "opening" then break end; wait(0.25) end; if door_state(5) == "closed" then click(102); wait(1.5) end; log("DoubleDoor10: " .. door_state(5))'}
  - walk_to: {via: [[-4480, 0, -860]], x: -2580, y: 471, z: -891, timeout_seconds: 60, clear_hostiles: 1500}
  - play_lua: {source: 'for i = 1, 40 do local s = door_state(13); if s ~= "closing" and s ~= "opening" then break end; wait(0.25) end; if door_state(13) == "closed" then click(106); wait(1.5) end; log("DoubleDoor14: " .. door_state(13))'}
  - walk_to: {via: [[-2390, 471, -891]], x: -1780, y: 246, z: -891, timeout_seconds: 60, clear_hostiles: 1500}
  - play_lua: {source: 'for i = 1, 40 do local s = door_state(11); if s ~= "closing" and s ~= "opening" then break end; wait(0.25) end; if door_state(11) == "closed" then click(105); wait(1.5) end; log("DoubleDoor13: " .. door_state(11))'}
  - walk_to: {via: [[-1560, 246, -891]], x: 451, y: -676, z: -732, timeout_seconds: 60, clear_hostiles: 1500, expect: dialog}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.0, follow_map_move: true}
  - assert: {map: thronheim.blv}

  # Back to Arslegard as the dead go: the party falls (the game's defeat; the save's party cannot lose a fight) and
  # wakes at the Great Gate.
  - setup_shortcut: {kind: immortal, value: false}
  - party_defeat: {knock_out: true, wait_seconds: 5, expect_map: arslegardcity.blv}
  - setup_shortcut: {kind: immortal}
  - advance_runtime: {seconds: 4}
  - play_lua: {source: 'if not has_item(10189) then error("Gungnir lost in the defeat") end; log("Gungnir still carried")'}

  # Hanndl: a click with Gungnir unlocks "We found your spear." (key 354); the talk's exit pays (key 357).
  - set_pose: {map: arslegardcity.blv, x: 14240, y: 2674, z: -491, yaw: 3.1416, pitch: 0}
  - advance_runtime: {seconds: 0.5}
  - interact_actor: {actor_index: 9}
  - assert: {qbit_set: [90354]}
  - select_topic: {match_label: "We found your spear."}
  - press_action: {action: cancel_dialog}
  - advance_runtime: {seconds: 0.5}
  - assert: {qbit_set: [90356, 90357], gold: 40000}
  - play_lua: {source: 'if has_item(10189) then error("Hanndl did not take Gungnir") end; log("Hanndl has his spear; experience " .. experience(0))'}
