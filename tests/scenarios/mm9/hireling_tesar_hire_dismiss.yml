# MM9 hirelings, phase 7 (devdocs/mm9/MM9_HIRELINGS_PLAN.md): Tesar Olin (RUDE 43) in the rebuilt Sturmford City.
# Run with the MM9 rework review root:
#   ./build/game/openyamm --asset-root "$PWD/output/mm9_rework/assets_dev" \
#       --headless-run-scenario tests/scenarios/mm9/hireling_tesar_hire_dismiss.yml --scenario-no-color
id: mm9.hireling_tesar_hire_dismiss
title: "MM9 hirelings: Tesar Olin refuses a short purse, joins for 500 gold (key 451, his body gone), is dismissed (key cleared); Ake the Righteous, a posed talking prop, joins and his body vanishes"
world: mm9
mode: faithful
tags: [mm9, mm9_rework, hirelings]
steps:
  - load_map:
      map: sturmfordcity.blv
  - advance_runtime:
      seconds: 1.5
  - console: {line: gold set 400}
  - set_pose:
      map: sturmfordcity.blv
      x: 12861
      y: 17835
      z: 19723
      yaw: -1.5708
      pitch: -0.6142
  - advance_runtime:
      seconds: 0.2
  - press_interact: {}
  - assert:
      actor_dialog_started:
        kind: mm9_rude
        source_id: 43
  - select_topic: {action_id: 5, match_label: "What do you mean?"}
  - select_topic: {action_id: 2, match_label: "We're sure it is."}
  - select_topic: {action_id: 3, match_label: "Ah, you're for hire.  How much?"}
  - select_topic: {action_id: 4, match_label: "Alright Tesar.  You're hired."}
  # Short of his 500 gold fee: nothing changes and the talk goes on.
  - assert:
      gold: 400
      qbit_clear: [90451]
      dialog:
        active: true
        source_id: 43
  - console: {line: gold set 600}
  - select_topic: {action_id: 4, match_label: "Alright Tesar.  You're hired."}
  - advance_runtime:
      seconds: 0.3
  - assert:
      gold: 100
      qbit_set: [90451]
      dialog:
        active: false
  - console: {line: hireling list, expect_contains: "43 Tesar Olin (110 HP)"}
  # His body left his post at once (a press_interact from the same pose now picks no target; not a step, since an
  # interaction without a target fails the scenario).
  # His own dialogue from the portrait: the hired rows; dismissal clears the key.
  - console: {line: hireling talk 43}
  - assert:
      dialog:
        active: true
        source_id: 43
        action_label_present: We will no longer be needing your services.
  - select_topic: {action_id: 17, match_label: "We will no longer be needing your services."}
  - select_topic: {action_id: 7, match_label: "You're fired."}
  - advance_runtime:
      seconds: 0.3
  - assert:
      gold: 100
      qbit_clear: [90451]
      dialog:
        active: false
  - console: {line: hireling list, expect_contains: "With the party: Table:"}
  # Ake the Righteous (RUDE 86) is a posed talking prop: an actor sitting on his pew (actor 52, a RUDEProp looping its
  # pose, level_generation/projects/mm9r_common/rude_props.py). Hired, his body leaves at once, as Tesar's.
  - console: {line: gold set 1500}
  - interact_actor: {actor_index: 52}
  - advance_runtime:
      seconds: 0.3
  - assert:
      dialog:
        active: true
        source_id: 86
  - select_topic: {action_id: 6, match_label: "That we are."}
  - select_topic: {action_id: 3, match_label: "We must unite the clans against Tamur Leng and his Hordes."}
  - select_topic: {action_id: 2, match_label: "Are you saying you would like to come with us?"}
  - select_topic: {action_id: 1, match_label: "Consider us benefactors.  Welcome aboard."}
  - advance_runtime:
      seconds: 0.3
  - assert:
      gold: 500
      qbit_set: [90454]
      actor_visible: {actor_index: 52, hidden: true}
      dialog:
        active: false
  - console: {line: hireling list, expect_contains: "86 Ake the Righteous (525 HP)"}
