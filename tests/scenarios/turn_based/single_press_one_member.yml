id: turn_based.single_press_one_member
title: Turn-based - one Attack press acts for one member, also when the key stays down as long as an ordinary tap
world: mm8
mode: faithful
tags: [turn_based, regression]
steps:
  - note:
      text: >-
        TB-1 in devdocs/TURN_BASED_COMBAT_AUDIT.md. Attack and Quick Cast repeat while held every 0.14 s in real
        time (GameplayActionController::HeldActionRepeatDebounceSeconds), and a melee swing leaves nothing in flight,
        so the next member is ready in the same frame: a press held a little longer swung for two members. In
        turn-based mode both act on the press only. Four Knights with swords, so every attack is a melee swing that
        the queue spends at once.
  - new_game_flow:
      start_map: out01.odm
      party:
        gold: 0
        food: 10
        members:
          - {name: A, class: Knight, level: 10, skills: [{name: Sword, level: 5, mastery: 1}], equipment: {}}
          - {name: B, class: Knight, level: 10, skills: [{name: Sword, level: 5, mastery: 1}], equipment: {}}
          - {name: C, class: Knight, level: 10, skills: [{name: Sword, level: 5, mastery: 1}], equipment: {}}
          - {name: D, class: Knight, level: 10, skills: [{name: Sword, level: 5, mastery: 1}], equipment: {}}
  - grant_item: {item_id: 1, member_index: 0, equip: main_hand}
  - grant_item: {item_id: 1, member_index: 1, equip: main_hand}
  - grant_item: {item_id: 1, member_index: 2, equip: main_hand}
  - grant_item: {item_id: 1, member_index: 3, equip: main_hand}
  - press_action: combat
  # Room for a nearby monster that rolled initiative 1 to finish its action (3 s at most).
  - advance_runtime: {seconds: 4}
  - assert: {turn_based: {active: true, stage: attack, front_member: "0", report: true}}
  # Control: a press of one frame swings for the front member only.
  - press_action: {action: attack, seconds: 0.034}
  # A monster whose roll ties it into the party's order may act between two members.
  - advance_runtime: {seconds: 4}
  - assert: {turn_based: {stage: attack, front_member: "1", report: true}}
  # An ordinary tap of 0.2 s must also swing for one member only, leaving member 2 to act next.
  - press_action: {action: attack, seconds: 0.2}
  - advance_runtime: {seconds: 4}
  - assert: {turn_based: {stage: attack, front_member: "2", report: true}}
