# A1's world regression (devdocs/xeen/lanes/A1.md): MM8 starts, changes map, saves and loads back, and Town Portal
# opens its window. Cast from a scroll, so no member needs the mana.
#   ./build/game/openyamm --headless-run-scenario tests/scenarios/worlds/mm8_roundtrip.yml
id: worlds.mm8_roundtrip
title: "MM8: start, map change, save, load and Town Portal"
world: mm8
mode: faithful
tags: [mm8, worlds]
steps:
  - new_game_flow:
      start_map: out01.odm
  - save_game: worlds_mm8
  - load_map: {map: d05.blv}
  - assert: {map: d05.blv}
  - load_game: worlds_mm8
  - assert: {map: out01.odm}
  - cast_spell: {member_index: 0, spell_id: 31, skill: 10, mastery: 4, scroll: true, expect: refused, expect_status: needs_window}
