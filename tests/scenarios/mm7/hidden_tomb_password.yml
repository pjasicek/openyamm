id: mm7.hidden_tomb_password
title: Hidden Tomb password buttons follow the aim from one position
world: mm7
mode: faithful
tags: [mm7, regression, interaction]
steps:
  - new_game_flow:
      start_map: 7out03.odm
  - press_interact:
      pose: {map: 7out03.odm, x: 14180, y: -21620, z: 127, yaw: 0, pitch: 0.09}
      expect: {triggered_event: 402}
  - press_interact:
      pose: {map: 7out03.odm, x: 14180, y: -21620, z: 127, yaw: -0.247, pitch: -0.153}
      expect: {triggered_event: 403}
  - press_interact:
      pose: {map: 7out03.odm, x: 14180, y: -21620, z: 127, yaw: 0, pitch: -0.388}
      expect: {triggered_event: 404}
  - press_interact:
      pose: {map: 7out03.odm, x: 14180, y: -21620, z: 127, yaw: 0.247, pitch: -0.153}
      expect: {triggered_event: 405}
  - press_interact:
      pose: {map: 7out03.odm, x: 14180, y: -21620, z: 127, yaw: 0, pitch: -0.158}
      expect: {triggered_event: 406}
  - assert:
      qbit_set: [569]
