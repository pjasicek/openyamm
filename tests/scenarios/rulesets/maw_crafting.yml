id: rulesets.maw_crafting
title: Ruleset - MAW crafting on the Workbench (gems, Hourglass, Pearl, cubes, Mirror, merge, Endless Potion, worn items), kept by save and load
world: mm6
mode: faithful
tags: [rulesets, maw, crafting]
steps:
  - new_game_flow:
      start_map: oute3.odm
      ruleset:
        id: maw
        difficulty: maw
        progression: free
      party:
        gold: 1000
        food: 10
        members:
          - name: Smith
            class: Knight
            level: 40
            skills:
              - {name: Sword, level: 4, mastery: 1}
            equipment: {main_hand: 1}
  # A carried Iron Longsword with Might +10: six tier-8 gems raise it in one Apply All.
  - grant_item: {item_id: 1, enchant: [1, 10], rarity: 2, drop_level: 1}
  - grant_item: {item_id: 1048, count: 6}
  - craft: {target_item_id: 1, material_item_id: 1048, all: true}
  - assert:
      inventory_any_member: [{item_id: 1048, count: 0}]
      ruleset: {id: maw, crafted_items_min: 1}
  # Creator's Hourglass adds a second enchantment; Pandora's Cube refines the sword and refuses a ring.
  - grant_item: {item_id: 1062}
  - craft: {target_item_id: 1, material_item_id: 1062}
  # The Pearl of Memory removes the enchantment picked (the second), then the Hourglass adds one again.
  - grant_item: {item_id: 1066}
  - craft: {target_item_id: 1, material_item_id: 1066, choice: 1}
  - grant_item: {item_id: 1062}
  - craft: {target_item_id: 1, material_item_id: 1062}
  - grant_item: {item_id: 1063, count: 2}
  - grant_item: {item_id: 137}
  - craft: {target_item_id: 137, material_item_id: 1063, expect: refused}
  - craft: {target_item_id: 1, material_item_id: 1063}
  - assert:
      inventory_any_member: [{item_id: 1062, count: 0}, {item_id: 1063, count: 1}, {item_id: 1066, count: 0}]
  # Archibald's Mirror becomes a second carried sword (the worn one counts too).
  - grant_item: {item_id: 1064}
  - craft: {target_item_id: 1, material_item_id: 1064}
  - assert:
      inventory_any_member: [{item_id: 1, count: 3}, {item_id: 1064, count: 0}]
  # Six tier-1 gems merge into two tier-2 gems.
  - grant_item: {item_id: 1041, count: 6}
  - combine_gems: {item_id: 1041, all: true}
  - assert:
      inventory_any_member: [{item_id: 1041, count: 0}, {item_id: 1042, count: 2}]
  # The Endless Potion refills a Protection potion, not Cure Wounds.
  - grant_item: {item_id: 231, power: 50}
  - grant_item: {item_id: 222, power: 50}
  - grant_item: {item_id: 1069, count: 2, state: 20}
  - craft: {target_item_id: 222, material_item_id: 1069, expect: refused}
  - craft: {target_item_id: 231, material_item_id: 1069}
  - assert:
      inventory_any_member: [{item_id: 1069, count: 1}]
  # The worn sword: Enchant Item gives it a first enchantment (power 100: strength 20), then a tier-10 gem raises it.
  - grant_item: {item_id: 238, power: 100}
  - craft: {target_item_id: 1, worn_slot: main_hand, material_item_id: 238}
  - grant_item: {item_id: 1050}
  - craft: {target_item_id: 1, worn_slot: main_hand, material_item_id: 1050}
  - assert:
      inventory_any_member: [{item_id: 238, count: 0}, {item_id: 1050, count: 0}]
      ruleset: {id: maw, crafted_items_min: 2}
  - save_game: maw_crafting
  - load_game: maw_crafting
  - assert:
      inventory_any_member: [{item_id: 1, count: 3}, {item_id: 1042, count: 2}]
      ruleset: {id: maw, crafted_items_min: 2}
