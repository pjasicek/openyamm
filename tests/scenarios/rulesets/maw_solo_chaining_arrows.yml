id: rulesets.maw_solo_chaining_arrows
title: "Ruleset - solo run: a Chaining Arrows shot leaps from monster to monster within the talent's distance"
world: mm6
mode: faithful
tags: [rulesets, maw, solo, combat]
steps:
  - note:
      text: >-
        Chaining Arrows (talent id piercing_arrows, distance 1024): an ordinary bow shot's arrow strikes its target,
        then turns to the nearest other hostile monster within 1024 of the one it struck, up to the rank's count
        (GameplayProjectileService::chainArrow). None of the other monsters stands in the shot's line, and the
        fourth stands farther than 1024 from the third, so the arrow ends there with a leap to spare. Accuracy 500
        makes every hit roll certain under MAW (a monster the arrow misses is passed over).
  - new_game_flow:
      start_map: oute3.odm
      ruleset: "maw:solo"
      party:
        gold: 0
        food: 10
        members:
          - name: Ariel
            class: Archer
            level: 20
            accuracy: 500
            skills:
              - {name: Bow, level: 8, mastery: 2}
            equipment: {}
  - grant_item: {item_id: 56, equip: bow}
  - console: {line: "talent piercing_arrows 3", expect_contains: "piercing_arrows"}
  - set_pose: {map: oute3.odm, x: -9728, y: -11319, z: 200, yaw_degrees: 0, pitch: 0}
  - clear_hostiles: {radius: 6000}
  # Mercenary Captains. The first 700 east of the party at (-9728, -11319); the second 364 from it, well off the
  # shot's line; the third 350 from the second (707 from the first); the fourth 1400 from the third.
  - spawn_actor: {monster_id: 195, x: -9028, y: -11319, z: 200}
  - spawn_actor: {monster_id: 195, x: -8928, y: -10969, z: 200}
  - spawn_actor: {monster_id: 195, x: -8928, y: -10619, z: 200}
  - spawn_actor: {monster_id: 195, x: -8928, y: -9219, z: 200}
  - advance_runtime: {seconds: 0.1}
  - press_action: {action: attack}
  - assert:
      projectiles: {source: party, min_count: 1, report: true}
  - advance_runtime: {seconds: 1.5}
  - assert:
      actor_visible: {actor_index: last-3, report_state: true}
  - assert:
      actor_visible: {actor_index: last-2, report_state: true}
  - assert:
      actor_visible: {actor_index: last-1, report_state: true}
  - assert:
      actor_visible: {actor_index: last, report_state: true}
  - assert:
      actor_count: {name: Mercenary Captain, hurt: true, min: 3, max: 3}
