id: rulesets.maw_dimension_maps
title: Ruleset - MAW dimension maps open a cleared dungeon with new monsters, give the next map when cleared, and the Dimensional Maps quest
world: mm6
mode: faithful
tags: [rulesets, maw]
steps:
  - new_game_flow:
      start_map: oute3.odm
      ruleset: {id: maw, difficulty: maw, progression: free}
      party:
        gold: 0
        food: 10
        members:
          - name: Seer
            class: Knight
            level: 120
            skills:
              - {name: Sword, level: 4, mastery: 1}
            equipment: {main_hand: 1}
  - ruleset_banks: {mm6: 0, completed_maps: [6d01.blv]}
  # The Oracle's topic: the first tier's map (party level 80), kept until its rift is cleared.
  - execute_event: {id: 10040}
  - assert:
      inventory_any_member: [{item_id: 290, count: 1}]
      ruleset: {id: maw, dimension_quest: {tier: 80, given: true, cleared: false, done: false}}
  - execute_event: {id: 10040}
  - assert:
      inventory_any_member: [{item_id: 290, count: 1}]
  # Using the map opens its dungeon with three new families, and the run counts for the quest.
  - use_item: {item_id: 290}
  - advance_runtime: {seconds: 1}
  - assert:
      map: 6d01.blv
      inventory_any_member: [{item_id: 290, count: 0}]
  - save_game: maw_dimension_maps
  - load_game: maw_dimension_maps
  - advance_runtime: {seconds: 1}
  # Clearing the rift: the quest is cleared; the drops stay locked until the quest's last tier, so no new map yet.
  - damage_actor: {all: true, amount: 100000000}
  - advance_runtime: {seconds: 2}
  - assert:
      ruleset: {id: maw, dimension_run: {map: 6d01.blv, completed: true}}
  - assert:
      ruleset: {id: maw, dimension_quest: {tier: 80, given: true, cleared: true}}
      inventory_any_member: [{item_id: 290, count: 0}]
  - execute_event: {id: 10040}
  - assert:
      ruleset: {id: maw, dimension_quest: {tier: 110, given: false, cleared: false, done: false}}
  # With the quest done, a map of power 10 and two of four affixes active: the dungeon opens at monster level 120 and
  # up, and clearing it gives the next map.
  - ruleset_banks: {mm6: 0, completed_maps: [6d02.blv], dimension_quest_done: true}
  - load_map: {map: oute3.odm}
  - grant_item: {item_id: 290, dimension_map: {map_id: 153, affixes: [15, 11, 1, 16], active: 2, power: 10}}
  - use_item: {item_id: 290}
  - advance_runtime: {seconds: 1}
  - assert:
      map: 6d02.blv
      ruleset: {id: maw, dimension_run: {map: 6d02.blv, power: 10, affix_count: 2, completed: false,
        min_family_actors: 5}}
  - damage_actor: {all: true, amount: 100000000}
  - advance_runtime: {seconds: 2}
  - assert:
      ruleset: {id: maw, dimension_run: {map: 6d02.blv, completed: true}}
      inventory_any_member: [{item_id: 290, count: 1}]
  # A reset of the dungeon ends the run: the next load refills it with its own monsters.
  - save_game: maw_dimension_maps_cleared
  - load_game: maw_dimension_maps_cleared
  - assert:
      ruleset: {id: maw, dimension_run: {map: 6d02.blv, completed: true}}
      inventory_any_member: [{item_id: 290, count: 1}]
