id: carnage_arrow_blast
title: A Carnage bow's arrow explodes where it strikes and burns the monster beside its target
world: mm6
mode: faithful
tags: [combat, items, regression]
steps:
  - note:
      text: >-
        MM8 turns a Carnage arrow (bow special 3) into the explosion object 600 where it strikes; its blast deals every
        monster within 512 in sight the shooter's ranged damage as fire, with no hit roll (0x46bd3a, 0x4373e5,
        0x4378ec).
  - new_game_flow:
      start_map: oute3.odm
      party:
        gold: 0
        food: 10
        members:
          - name: Ariel
            class: Archer
            level: 30
            skills:
              - {name: Bow, level: 10, mastery: 2}
            equipment: {}
  # A Hunting Bow of Carnage.
  - grant_item: {item_id: 56, special: 3, equip: bow}
  - set_pose: {map: oute3.odm, x: -9728, y: -11319, z: 200, yaw_degrees: 0, pitch: 0}
  - clear_hostiles: {radius: 6000}
  # Two Mercenary Captains side by side, 700 east of the party at (-9728, -11319), out of a blow's reach.
  - spawn_actor: {monster_id: 195, x: -9028, y: -11319, z: 200}
  - spawn_actor: {monster_id: 195, x: -9028, y: -11219, z: 200}
  - advance_runtime: {seconds: 0.1}
  - assert:
      actor_visible: {actor_index: last-1, report_state: true}
  - press_action: {action: attack}
  - assert:
      projectiles: {source: party, min_count: 1}
  - advance_runtime: {seconds: 1.5}
  - assert:
      actor_visible: {actor_index: last-1, report_state: true}
  - assert:
      actor_visible: {actor_index: last, report_state: true}
  - assert:
      actor_count: {name: Mercenary Captain, hurt: true, min: 2}
