        click(269); wait(0.5)
        local coded = "Blf xzm urmw gsv Yllp lu Ifovh yvsrmw gsv ilgzgrmt yllphsvou rm gsv mvcg illn."
        local plain = coded:gsub("%a", function(c)
          local base = c:match("%l") and 97 or 65
          return string.char(base + 25 - (c:byte() - base))
        end)
