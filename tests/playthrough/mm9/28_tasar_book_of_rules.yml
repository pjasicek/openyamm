# MM9 playthrough, segment 28: the Book of Rules (guide: Chapter I, "Get the Book of Rules from the Ta'Sar Academy").
# Lindisfarne's north-east corner (not the south-west, as the guide has it): the academy, whose soldiers and students
# are hostile to the party (the user's decision, 2026-11-08: they die as the party passes). South past the arena, down
# the corridor to the east hall, west into the round library tower. The note on the middle table says to put the books
# back where they belong; four textbooks are taken one at a time (the next only once the one before is on its table)
# and laid on the tables whose signs name their subjects: Offense (first gallery, north), Strategy (top gallery, west),
# Defense (first gallery, south), Intelligence (top gallery, east). The ladders up the central column are climbed with
# the `climb` step (CLIMB lines); the way down is a drop through the holes beside them. With the
# fourth book the top gallery's south door opens: a scroll in a reversed alphabet points to the rotating bookshelf in
# the next room; the south hall's bookcase turns on its sticking-out book, and the Book of Rules lies on its podium
# (a world item: picked up; key 59). Out the way the party came. Research: prep/20_34_thjorgard_guberland.md (29 there).
#   python3 tests/playthrough/mm9/run.py 28
id: mm9.playthrough.28_tasar_book_of_rules
title: "MM9 playthrough 28: the Ta'Sar Academy's library puzzle and the Book of Rules"
world: mm9
mode: faithful
tags: [mm9, playthrough]
steps:
  - load_game: {path: output/playthrough/mm9/checkpoints/27_monastery_thjorad.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: lindisfarne.blv, qbit_set: [90057], qbit_clear: [90059, 90166, 99516]}

  # The academy's front door (ExitTrigger1) at the island's north-east.
