  - play_lua:
      source: |
        local a, b = door_state(19), door_state(20)
        if a == "closed" and b == "closed" then click(109); wait(2)
        elseif a ~= "open" or b ~= "open" then
          log("ISSUE the trophy room's door's leaves out of step (" .. a .. ", " .. b .. "); waiting for both to shut")
          for i = 1, 20 do if door_state(19) == "closed" and door_state(20) == "closed" then break end; wait(0.5) end
          click(109); wait(2)
        end
        if door_state(19) ~= "open" or door_state(20) ~= "open" then error("the trophy room's door did not open") end
