# MM9 playthrough, segment 37: Frosgard's pledge (guide: Chapter I, Frosgard, the reports). Back into Frosgard City by the
# road gate; Tryygva hears of Yanmir's fall (keys 70, 172: 18 500 experience, 10 000 gold) and, both tasks done,
# pledges Frosgard (key 74). The council is not called yet: Thronheim has not joined. Five of the six clans have pledged.
#   python3 tests/playthrough/mm9/run.py 37
id: mm9.playthrough.37_tryygva_pledge
title: "MM9 playthrough 37: Yanmir reported, Tryygva pledges Frosgard"
world: mm9
mode: faithful
tags: [mm9, playthrough]
steps:
  - load_game: {path: output/playthrough/mm9/checkpoints/36_yanmirs_fort.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: frosgard.blv, qbit_set: [90069, 90073], qbit_clear: [90070, 90074, 90178]}

  - set_pose: {map: frosgard.blv, x: 1783, y: 3700, z: 1738, yaw: -1.5708, pitch: 0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 1783, y: 3250, z: 1738, timeout_seconds: 20, expect: dialog}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.0, follow_map_move: true}
  - assert: {map: frosgardcity.blv}

  - set_pose: {map: frosgardcity.blv, x: -3568, y: -1638, z: 45, yaw: 3.1416, pitch: 0}
  - advance_runtime: {seconds: 0.5}
  - interact_actor: {actor_index: 5}
  - select_topic: {match_label: "Yanmir the Frost Giant is dead."}
  - select_topic: {match_label: "Perhaps they were not strong enough."}
  - select_topic: {match_label: "Now that we have done as you asked, will you join us?"}
  - select_topic: {match_label: "We shall be having a war council soon."}
  - select_topic: {match_label: "We have more to do, but when that is done, we shall."}
  - select_topic: {match_label: "Goodbye."}
  - advance_runtime: {seconds: 0.5}
  # Kira has not pledged: Tryygva's all-clans check (82, 38, 51, 63, 34) gives no key 178 yet.
  - assert: {qbit_set: [90070, 90074, 90172], qbit_clear: [90178]}
  - save_game: {name: "37 Frosgard pledged", path: output/playthrough/mm9/checkpoints/37_tryygva_pledge.oysav}
