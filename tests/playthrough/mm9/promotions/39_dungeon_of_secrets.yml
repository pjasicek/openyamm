# MM9 promotion playthrough, segment 39: the Dungeon of Secrets, Fenja's second trial (guide: side_c.yml
# "pass-through-dungeon-of-secrets"; Fenja's "Tell us about the second task." names this dungeon, and Chadwick
# Boorsley's "We are here for the trial." needs her key 239: the trap course is the second trial). From Guberland by sea
# to Frosgard (outdoors the party is moved), west along the road to the dungeon (ExitTrigger0 at (16260, 5578)).
# Chadwick in his booth: "Hello.", "We are here for the trial.", "Okay.", "Yes" (key 243). The entrance button opens
# the gate and clears the trap mark; then each section's lever and axe door as the timer allows, as a player runs it
# (dungeonofsecrets.lua: a lever locks its axe until it creeps shut; the door opened in time leaves the axe still).
# Every trap (an axe, a fire plate, a gauntlet plate, a double-axe plate, the blade's panels) gives key 244, which the
# play checks after each section (what a player sees: the axe swinging, the plate going down). Hops and the swim are
# movement steps from where the party stands (JUMP and SWIM lines). Past axe door 6 the exit gate opens: key 245.
# Chadwick's reward ("We'd like our reward", key 246: 10 000 experience on the talk's close, key 247); out.
# The trial resets on every load of the map (dungeonofsecrets.lua handlers[1], NPC417.scr :Init; MM9's :Init2 kept it
# on a full load), so the dungeon forbids saving (2026-11-09): the whole run is this one segment, and the save-and-load
# run skips the saves in here.
#   python3 tests/playthrough/mm9/promotions/run.py 39
id: mm9.promotions.39_dungeon_of_secrets
title: "MM9 promotions 39: Chadwick's trial run clean through the Dungeon of Secrets"
world: mm9
mode: faithful
tags: [mm9, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/mm9/promotions/checkpoints/38_dook_everstrike.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: guberland.blv, qbit_set: [90238, 90239], qbit_clear: [90243, 90245, 90247]}

  # By sea to Frosgard; the road west to the Dungeon of Secrets.
  - travel: {map: frosgard.blv, days: 6}
  - set_pose: {map: frosgard.blv, x: 15441, y: 5578, z: 2151, yaw: 0, pitch: 0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 16300, y: 5578, z: 1925, z_tolerance: 600, plan: false, timeout_seconds: 20, expect: dialog}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.0, follow_map_move: true}
  - assert: {map: dungeonofsecrets.blv}

  # Chadwick Boorsley (actor 0) in the booth, through its bars.
  - walk_to: {x: 4336, y: -1065, z: -40, plan: false, timeout_seconds: 20}
  - interact_actor: {actor_index: 0}
  - select_topic: {match_label: "Hello."}
  - select_topic: {match_label: "We are here for the trial."}
  - select_topic: {match_label: "Okay."}
  - select_topic: {match_label: "Yes"}
  - advance_runtime: {seconds: 0.5}
  - assert: {qbit_set: [90243], qbit_clear: [90244]}

  # The entrance button (from its push side): the gate opens; standing there turns the knockbacks off.
  - walk_to: {x: 4442, y: -471, z: -40, radius: 20, plan: false, timeout_seconds: 20}
  - play_lua:
      source: |
        click(240); wait(4)
        if mapvar("Sentrance_gate") < 1 then error("the entrance gate did not open") end
        log("the entrance button opens the gate")

  # Section 10: the lever corner behind the gate (lever 10, then axe door 10 within 3.1 s).
  - walk_to: {x: 4129, y: -363, z: -40, radius: 20, plan: false, timeout_seconds: 20}
  - play_lua: {source: 'click(218); wait(0.5)'}
  - walk_to: {x: 4104, y: -410, z: -40, radius: 20, plan: false, timeout_seconds: 10}
  - play_lua:
      source: |
        click(208); wait(1.0)
        if mapvar("Saxe_door_10") ~= 2 then error("axe door 10 did not open") end
        if qbit(90244) then error("axe door 10: the axe swung (a trap)") end
        log("section 10: axe door 10 open, its axe held")

  # Section 9 (3.5 s).
  - walk_to: {via: [[3789, -410, -40]], x: 3569, y: -668, z: -40, radius: 20, plan: false, timeout_seconds: 20}
  - play_lua: {source: 'click(217); wait(0.5)'}
  - walk_to: {x: 3305, y: -983, z: -40, radius: 20, plan: false, timeout_seconds: 10}
  - play_lua:
      source: |
        click(207); wait(1.0)
        if mapvar("Saxe_door_09") ~= 2 then error("axe door 09 did not open") end
        if qbit(90244) then error("axe door 09: the axe swung (a trap)") end
        log("section 9: axe door 9 open")

  # Section 8 (5.4 s): the U room.
  - walk_to: {via: [[2944, -845, -40]], x: 2913, y: -402, z: -40, radius: 20, plan: false, timeout_seconds: 20}
  - play_lua: {source: 'click(216); wait(0.5)'}
  - walk_to: {x: 1536, y: -376, z: -40, radius: 20, timeout_seconds: 10}
  - play_lua:
      source: |
        click(206); wait(1.0)
        if mapvar("Saxe_door_08") ~= 2 then error("axe door 08 did not open") end
        if qbit(90244) then error("axe door 08: the axe swung (a trap)") end
        log("section 8: axe door 8 open")

  # On to section 1: the flooded pool room's lower corridor holds the double axe's lower plate (x 164..492: a trap;
  # wading, the party cannot jump it). MM9's way round it: the water grate east of the plate opens on a click; down
  # its shaft, west along the submerged tunnel, up the west shaft and out of the water.
  - walk_to: {via: [[1536, 154, -40], [1460, 1260, -40], [1100, 1260, -61]], x: 960, y: 1260, z: -61, z_tolerance: 200, radius: 15, plan: false, timeout_seconds: 60}
  - play_lua:
      source: |
        click(241); wait(3.5)
        if mapvar("Swater_grate") ~= 2 then error("the water grate did not open") end
        log("the water grate opens over the east shaft")
  - walk_to: {x: 820, y: 1260, z: -61, z_tolerance: 900, radius: 30, plan: false, timeout_seconds: 5}
  - advance_runtime: {seconds: 1.0}
  - play_lua: {source: 'log("SWIM down the east shaft, west along the submerged tunnel, up the west shaft")'}
  - movement_segment:
      input: none
      fly_down: true
      seconds: 1.5
      start: {map: dungeonofsecrets.blv, x: 845, y: 1260, z: -64, yaw_degrees: 180, pitch: 0}
      expect_stop: {map: dungeonofsecrets.blv, x: 845, y: 1260, z: -600, yaw_degrees: 180, pitch: 0}
      loose_tolerance: true
      tolerance_xy: 900
      tolerance_z: 900
  - movement_segment:
      input: forward
      seconds: 4.0
      start: {map: dungeonofsecrets.blv, x: 803, y: 1260, z: -600, yaw_degrees: 180, pitch: 0}
      expect_stop: {map: dungeonofsecrets.blv, x: -730, y: 1260, z: -600, yaw_degrees: 180, pitch: 0}
      loose_tolerance: true
      tolerance_xy: 2000
      tolerance_z: 2000
  - movement_segment:
      input: none
      fly_up: true
      seconds: 2.0
      start: {map: dungeonofsecrets.blv, x: -730, y: 1260, z: -600, yaw_degrees: 180, pitch: 0}
      expect_stop: {map: dungeonofsecrets.blv, x: -730, y: 1260, z: -60, yaw_degrees: 180, pitch: 0}
      loose_tolerance: true
      tolerance_xy: 900
      tolerance_z: 900
  - play_lua: {source: 'log("JUMP out of the west shaft onto the pool room floor")'}
  - movement_segment:
      input: forward
      jump: true
      seconds: 0.8
      start: {map: dungeonofsecrets.blv, x: -760, y: 1260, z: -174, yaw_degrees: 180, pitch: 0}
      expect_stop: {map: dungeonofsecrets.blv, x: -1000, y: 1260, z: -61, yaw_degrees: 180, pitch: 0}
      loose_tolerance: true
      tolerance_xy: 2000
      tolerance_z: 2000
  - advance_runtime: {seconds: 0.5}
  - play_lua: {source: 'if qbit(90244) then error("a trap went off: the pool room") end'}

  # Section 1 (9.5 s): the hall of fire plates. Rows of plates (all traps) alternate with rows of big safe octagons;
  # in the lane at x -2048 every second row (y 2560, 2867 ...) leaves the octagons free and the rows between (y 2714,
  # 3021, 3328, 3635) are plates wall to wall: each is hopped (a short running jump, 192 units).
  - walk_to: {x: -2022, y: 2158, z: 1, radius: 20, timeout_seconds: 120}
  - play_lua: {source: 'click(209); wait(0.3)'}
  - walk_to: {x: -2048, y: 2600, z: 1, radius: 15, plan: false, timeout_seconds: 5}
  - walk_to: {x: -2048, y: 2620, z: 1, radius: 15, z_tolerance: 100, plan: false, timeout_seconds: 5}
  - play_lua: {source: 'log("JUMP over plate row 1 of the fire-plate hall")'}
  - movement_segment:
      input: forward
      jump: true
      seconds: 0.25
      start: {map: dungeonofsecrets.blv, x: -2048, y: 2620, z: 1, yaw_degrees: 90, pitch: 0}
      expect_stop: {map: dungeonofsecrets.blv, x: -2048, y: 2812, z: 1, yaw_degrees: 90, pitch: 0}
      loose_tolerance: true
      tolerance_xy: 300
      tolerance_z: 300
  - advance_runtime: {seconds: 0.3}
  - walk_to: {x: -2048, y: 2940, z: 1, radius: 15, z_tolerance: 100, plan: false, timeout_seconds: 5}
  - play_lua: {source: 'log("JUMP over plate row 2 of the fire-plate hall")'}
  - movement_segment:
      input: forward
      jump: true
      seconds: 0.25
      start: {map: dungeonofsecrets.blv, x: -2048, y: 2940, z: 1, yaw_degrees: 90, pitch: 0}
      expect_stop: {map: dungeonofsecrets.blv, x: -2048, y: 3132, z: 1, yaw_degrees: 90, pitch: 0}
      loose_tolerance: true
      tolerance_xy: 300
      tolerance_z: 300
  - advance_runtime: {seconds: 0.3}
  - walk_to: {x: -2048, y: 3250, z: 1, radius: 15, z_tolerance: 100, plan: false, timeout_seconds: 5}
  - play_lua: {source: 'log("JUMP over plate row 3 of the fire-plate hall")'}
  - movement_segment:
      input: forward
      jump: true
      seconds: 0.25
      start: {map: dungeonofsecrets.blv, x: -2048, y: 3250, z: 1, yaw_degrees: 90, pitch: 0}
      expect_stop: {map: dungeonofsecrets.blv, x: -2048, y: 3442, z: 1, yaw_degrees: 90, pitch: 0}
      loose_tolerance: true
      tolerance_xy: 300
      tolerance_z: 300
  - advance_runtime: {seconds: 0.3}
  - walk_to: {x: -2048, y: 3560, z: 1, radius: 15, z_tolerance: 100, plan: false, timeout_seconds: 5}
  - play_lua: {source: 'log("JUMP over plate row 4 of the fire-plate hall")'}
  - movement_segment:
      input: forward
      jump: true
      seconds: 0.25
      start: {map: dungeonofsecrets.blv, x: -2048, y: 3560, z: 1, yaw_degrees: 90, pitch: 0}
      expect_stop: {map: dungeonofsecrets.blv, x: -2048, y: 3752, z: 1, yaw_degrees: 90, pitch: 0}
      loose_tolerance: true
      tolerance_xy: 300
      tolerance_z: 300
  - advance_runtime: {seconds: 0.3}
  - walk_to: {via: [[-2048, 4000, 1]], x: -2376, y: 4416, z: 1, radius: 20, plan: false, timeout_seconds: 10}
  - play_lua:
      source: |
        click(200); wait(1.0)
        if mapvar("Saxe_door_01") ~= 2 then error("axe door 01 did not open") end
        if qbit(90244) then error("axe door 01: the axe swung (a trap)") end
        log("section 1: axe door 1 open, no plate pressed")
  - play_lua: {source: 'local n = 0; for i = 1, 61 do n = n + mapvar(string.format("Firedtrigger%02d", i)) end; if n ~= 0 then error(n .. " fire plates pressed") end'}

  # Section 2 (9.9 s): the corridor and the stair over the hidden blade (its box lies under the stair).
  - walk_to: {via: [[-2376, 4762, 1]], x: -404, y: 4800, z: 1, radius: 20, timeout_seconds: 60}
  - play_lua: {source: 'click(210); wait(0.3)'}
  - walk_to: {x: -655, y: 3884, z: 615, radius: 20, z_tolerance: 100, timeout_seconds: 15}
  - play_lua:
      source: |
        click(201); wait(1.0)
        if mapvar("Saxe_door_02") ~= 2 then error("axe door 02 did not open") end
        if qbit(90244) then error("axe door 02: the axe swung (a trap)") end
        log("section 2: axe door 2 open, the blade still")

  # Section 3 (3.0 s): the lever room; the real lever is the ninth from the south end of the west wall (the guide;
  # Perception 17 shows it), the other 21 do nothing.
  - walk_to: {via: [[-655, 4224, 656]], x: 896, y: 2834, z: 656, radius: 20, z_tolerance: 100, timeout_seconds: 60}
  - play_lua: {source: 'click(211); wait(0.3)'}
  - walk_to: {x: 1536, y: 2219, z: 656, radius: 20, z_tolerance: 100, timeout_seconds: 10}
  - play_lua:
      source: |
        click(202); wait(1.0)
        if mapvar("Saxe_door_03") ~= 2 then error("axe door 03 did not open") end
        if qbit(90244) then error("axe door 03: the axe swung (a trap)") end
        log("section 3: axe door 3 open")

  # Section 4 (5.4 s): the upper corridor over the pool room: the double axe's upper plate (x 287..410) is hopped,
  # then the gap in the corridor's floor (x -573..-163, over the lower corridor) is jumped.
  - walk_to: {via: [[1536, 1894, 656]], x: 771, y: 1193, z: 656, radius: 20, z_tolerance: 100, timeout_seconds: 60}
  - play_lua: {source: 'click(213); wait(0.3)'}
  - walk_to: {x: 520, y: 1208, z: 656, radius: 15, z_tolerance: 100, plan: false, timeout_seconds: 5}
  - play_lua: {source: 'log("JUMP over the double axe upper plate")'}
  - movement_segment:
      input: forward
      jump: true
      seconds: 0.35
      start: {map: dungeonofsecrets.blv, x: 520, y: 1208, z: 656, yaw_degrees: 180, pitch: 0}
      expect_stop: {map: dungeonofsecrets.blv, x: 250, y: 1208, z: 656, yaw_degrees: 180, pitch: 0}
      loose_tolerance: true
      tolerance_xy: 300
      tolerance_z: 300
  - walk_to: {x: -110, y: 1208, z: 656, radius: 15, z_tolerance: 100, plan: false, timeout_seconds: 5}
  - play_lua: {source: 'log("JUMP over the gap in the upper corridor floor")'}
  - movement_segment:
      input: forward
      jump: true
      seconds: 0.8
      start: {map: dungeonofsecrets.blv, x: -110, y: 1208, z: 656, yaw_degrees: 180, pitch: 0}
      expect_stop: {map: dungeonofsecrets.blv, x: -700, y: 1208, z: 656, yaw_degrees: 180, pitch: 0}
      loose_tolerance: true
      tolerance_xy: 300
      tolerance_z: 300
  - walk_to: {x: -1221, y: 1208, z: 656, radius: 20, z_tolerance: 100, plan: false, timeout_seconds: 10}
  - play_lua:
      source: |
        click(203); wait(1.0)
        if mapvar("Saxe_door_04") ~= 2 then error("axe door 04 did not open") end
        if qbit(90244) then error("axe door 04: the axe swung (a trap)") end
        log("section 4: axe door 4 open, the double axe untouched")

  # The octagon's elevator: up the steps onto its column, which carries the party down.
  - walk_to: {via: [[-1434, 1254, 656]], x: -1761, y: 307, z: 656, radius: 20, z_tolerance: 100, timeout_seconds: 30}
  - walk_to: {x: -1761, y: -461, z: 860, radius: 30, z_tolerance: 100, plan: false, timeout_seconds: 10}
  - play_lua:
      max_seconds: 30
      source: |
        wait(10.5)    -- the column takes 9.1 s to sink; a player waits until it stops
        if mapvar("Selevator") ~= 2 then error("the elevator did not go down") end
        log("the elevator carries the party down")

  # Section 5 (3.1 s).
  - walk_to: {x: -1761, y: -486, z: -40, radius: 30, z_tolerance: 100, plan: false, timeout_seconds: 15}
  - play_lua: {source: 'click(214); wait(0.5)'}
  - walk_to: {x: -1761, y: -1221, z: -40, radius: 20, z_tolerance: 100, plan: false, timeout_seconds: 10}
  - play_lua:
      source: |
        click(204); wait(1.0)
        if mapvar("Saxe_door_05") ~= 2 then error("axe door 05 did not open") end
        if qbit(90244) then error("axe door 05: the axe swung (a trap)") end
        log("section 5: axe door 5 open")

  # Section 6 (9.9 s): the gauntlet. Its ten plates (each a trap) are walked round, three hopped (the wheels'
  # gtrigger7, the saws' gtrigger8a/8b, the saw arm's gtrigger9 span the corridor).
  - walk_to: {via: [[-1761, -1536, -40]], x: -1733, y: -1848, z: -40, radius: 20, z_tolerance: 100, timeout_seconds: 20}
  - play_lua: {source: 'click(215); wait(0.3)'}
  - walk_to: {via: [[-1300, -1720, -40], [-700, -1720, -40], [-470, -1580, -40], [-150, -1580, -40], [0, -1880, -40], [139, -1880, -40], [300, -1720, -40]], x: 810, y: -1720, z: -40, radius: 15, z_tolerance: 100, plan: false, timeout_seconds: 10}
  - play_lua: {source: 'log("JUMP over the wheels plate")'}
  - movement_segment:
      input: forward
      jump: true
      seconds: 0.25
      start: {map: dungeonofsecrets.blv, x: 810, y: -1720, z: -40, yaw_degrees: 0, pitch: 0}
      expect_stop: {map: dungeonofsecrets.blv, x: 1010, y: -1720, z: -40, yaw_degrees: 0, pitch: 0}
      loose_tolerance: true
      tolerance_xy: 300
      tolerance_z: 300
  - walk_to: {x: 1170, y: -1720, z: -40, radius: 15, z_tolerance: 100, plan: false, timeout_seconds: 5}
  - play_lua: {source: 'log("JUMP over the saws plates")'}
  - movement_segment:
      input: forward
      jump: true
      seconds: 0.55
      start: {map: dungeonofsecrets.blv, x: 1170, y: -1720, z: -40, yaw_degrees: 0, pitch: 0}
      expect_stop: {map: dungeonofsecrets.blv, x: 1600, y: -1720, z: -40, yaw_degrees: 0, pitch: 0}
      loose_tolerance: true
      tolerance_xy: 300
      tolerance_z: 300
  - walk_to: {x: 1810, y: -1720, z: -40, radius: 15, z_tolerance: 100, plan: false, timeout_seconds: 5}
  - play_lua: {source: 'log("JUMP over the saw arm plate")'}
  - movement_segment:
      input: forward
      jump: true
      seconds: 0.4
      start: {map: dungeonofsecrets.blv, x: 1810, y: -1720, z: -40, yaw_degrees: 0, pitch: 0}
      expect_stop: {map: dungeonofsecrets.blv, x: 2120, y: -1720, z: -40, yaw_degrees: 0, pitch: 0}
      loose_tolerance: true
      tolerance_xy: 300
      tolerance_z: 300
  - walk_to: {x: 2532, y: -1720, z: -40, radius: 20, z_tolerance: 100, plan: false, timeout_seconds: 10}
  - play_lua:
      source: |
        click(205); wait(1.0)
        if mapvar("Saxe_door_06") ~= 2 then error("axe door 06 did not open") end
        if qbit(90244) then error("axe door 06: the axe swung (a trap)") end
        log("section 6: axe door 6 open, no gauntlet plate pressed")

  # The exit gate opens as the party comes up to it and tells Chadwick "done": with no trap, key 245.
  - walk_to: {via: [[2790, -1766, -40]], x: 3374, y: -1766, z: -40, radius: 30, z_tolerance: 100, plan: false, timeout_seconds: 10}
  - advance_runtime: {seconds: 2.5}
  - assert: {qbit_set: [90243, 90245], qbit_clear: [90244], state_dump_named_map_var: {name: Sexit_gate, value: 2}}

  # Chadwick's reward, then out to Frosgard.
  - walk_to: {x: 4336, y: -1065, z: -40, timeout_seconds: 60}
  - play_lua: {source: 'remember("xp0", experience(0))'}
  - interact_actor: {actor_index: 0}
  - select_topic: {match_label: "We'd like our reward."}
  - press_action: {action: cancel_dialog}
  - advance_runtime: {seconds: 1.0}
  - assert: {qbit_set: [90245, 90246, 90247]}
  - play_lua: {source: 'if experience(0) - recall("xp0") < 10000 then error("no 10 000 experience from Chadwick") end; log("Chadwick: 10 000 experience")'}
  - walk_to: {x: 5600, y: -1065, z: -40, z_tolerance: 400, plan: false, timeout_seconds: 20, expect: dialog}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.0, follow_map_move: true}
  - assert: {map: frosgard.blv}
  - save_game: {name: "39 the Dungeon of Secrets", path: output/playthrough/mm9/promotions/checkpoints/39_dungeon_of_secrets.oysav}
