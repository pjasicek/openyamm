  - load_game: {path: output/playthrough/mm9/promotions/checkpoints/37_fenja_trials.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: frosgardcity.blv, qbit_set: [90238, 90239], qbit_clear: [90241]}
  - play_lua: {source: 'if has_item(10184) then error("the party already has Everstrike") end'}

  # By sea to Guberland; the Dook's Castle gate.
