  - walk_to: {x: 13120, y: 4330, z: -2580, z_tolerance: 60, plan: false, timeout_seconds: 10}

  # Everstrike's chest: the trap goes off on the first click, the second opens it.
  - play_lua:
      source: |
        click(46); wait(1)
        if not take_chest() then
          log("the chest's trap goes off (" .. status() .. "); opening it again")
          click(46); wait(1)
          if not take_chest() then error("the chest did not open") end
        end
        close()
        if not has_item(10184) then error("no Everstrike in the chest") end
        log("Everstrike (10184) is the party's")

