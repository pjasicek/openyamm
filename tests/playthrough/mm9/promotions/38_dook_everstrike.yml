  - walk_to: {x: 10050, y: 3660, z: -3235, z_tolerance: 60, radius: 40, plan: false, timeout_seconds: 20, clear_hostiles: 2000}
  - play_lua: {source: 'log("JUMP east 1: a running jump up the 92-unit step onto the next bridge")'}
  - movement_segment:
      input: forward
      jump: true
      seconds: 0.55
      start: {map: dookscastle.blv, x: 10050, y: 3660, z: -3235, yaw_degrees: 8, pitch: 0}
      expect_stop: {map: dookscastle.blv, x: 10450, y: 3720, z: -3143, yaw_degrees: 8, pitch: 0}
      loose_tolerance: true
      tolerance_xy: 300
      tolerance_z: 400
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 10930, y: 3890, z: -3143, z_tolerance: 60, radius: 40, plan: false, timeout_seconds: 20, clear_hostiles: 2000}
