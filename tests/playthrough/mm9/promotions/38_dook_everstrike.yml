  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.0, follow_map_move: true}
  - assert: {map: dookscastle.blv}

  # The gate hall and the west corridor; round the guards by the east hall (doors 03 and 02); the north-east room.
  - walk_to: {x: 0, y: 4382, z: 450, timeout_seconds: 120}
