# MM9 promotion playthrough, segment 38: Everstrike, Fenja's first trial (guide: side_c.yml "find-everstrike"). From
# Frosgard by sea to Guberland (outdoors the party is moved), the Dook's Castle in the north-west of Guberland (its
# gate, ExitTrigger0 at (-13341, 17189)). The castle and its caverns are walked:
# - the gate hall, north along the west corridor, round by the east hall (doors 03 and 02: the Dook's friendly guards
#   stand and wander in the narrow corridor and stop a walk past them), north to the north-east room (door 04);
# - the shield on its north wall (event 70): the secret door (doorslide) slides open on the room's south-west corner and
#   every guard turns hostile (dookscastle.lua: the shield removes DOOK_HOSTILITY); the enemies near the party die;
# - through the secret door, down the stair behind it into the caverns, round the loop cave and down the long winding
#   caves to the lake cavern; across its rope bridges to the chest at the far east edge (TreasureChest0, event 46,
#   trap 14): the first click sets the trap off (the party cannot disarm it), the second opens it; Everstrike
#   (10184) taken with Take All;
# - back over the bridges and up the caves, the secret door, the north-east room, the west corridor, the gate.
# The rope bridges climb in steps of 82-110 units at each junction (rows of PhysicsBSP planks: -3235, -3143, -3041,
# -2949, -2856, -2744, -2652, -2580 east of the hub; -3184, -3102, -3020, -2938, -2846, -2764 west of it). The party
# steps 51 and walks off the side of each one; each is crossed with a running jump (JUMP lines; ISSUE logged: MM9's
# player climbed such steps, see prep/D_mage_scholar_ranger.md). Where the Dook's business is concerned the party does
# not need it: the shield opens the way whatever the Dook has said (side_b.yml convince-the-dook-to-leave-guberland is
# not needed).
#   python3 tests/playthrough/mm9/promotions/run.py 38
id: mm9.promotions.38_dook_everstrike
title: "MM9 promotions 38: the Dook's Castle and its caverns walked; Everstrike from the chest across the rope bridges"
world: mm9
mode: faithful
tags: [mm9, playthrough, promotions]
