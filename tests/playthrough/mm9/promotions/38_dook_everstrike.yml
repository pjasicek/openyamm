  # The shield: the secret door opens and the guards turn hostile.
  - play_lua:
      source: |
        click(70); wait(2)
        if mapvar("SecretOpen") ~= 1 then error("the shield did not open the secret door") end
        log("the shield turns: the secret door slides open; the guards turn hostile (Hostile " .. mapvar("Hostile") .. ")")
  - clear_hostiles: {radius: 5000}

  # Through the secret door, down the stair into the caverns, the caves down to the lake cavern's bridges.
