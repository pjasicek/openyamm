# MM9 promotion playthrough 95, the class table in bulk (README "What is checked" 5): Frosgard City: Fenja Tree-friend (Ranger).
# Each round gives the members a row's "from" classes (a logged test setup through SetPlayerClass, not a cheat
# for a quest), picks the promoter's "Promote our eligible characters." (his quest is done) and asserts every
# member's class; picked again, it has nobody left. Written by class_table.py for a 4-member party
# (a four-class round is played in chunks of the party's size). The party's own classes are
# put back at the end.
#   python3 tests/playthrough/mm9/promotions/run.py 95
id: mm9.promotions.95_frosgard_fenja
title: "MM9 promotions 95: the class table at Frosgard City"
world: mm9
mode: faithful
tags: [mm9, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/mm9/promotions/checkpoints/94_thjorgard_tymon_johannes.oysav}
  - setup_shortcut: {kind: immortal}
  # The party's own classes, kept for the end (class ids in global variables; the names remembered for the check).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}

  # To the region, then into frosgardcity through its gate (outdoors the party is placed).
  - travel: {map: frosgard.blv, days: 3}
  - set_pose: {map: frosgard.blv, x: 1783, y: 3700, z: 1738, yaw: -1.5708, pitch: 0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 1783, y: 3250, z: 1738, timeout_seconds: 20, expect: dialog}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.0, follow_map_move: true}
  - assert: {map: frosgardcity.blv}

  # Ranger: RUDE 181, actor 45.
  - set_pose: {map: frosgardcity.blv, x: 4260, y: 4274, z: -5, yaw: 1.5708, pitch: 0}
  - advance_runtime: {seconds: 0.5}
  # Round 1: Hunter WarriorMage Ranger Archer -> RangerLord MasterArcher Ranger Archer.
  - lua_event: {source: "if not SetPlayerClass(0, 'Hunter') then error('SetPlayerClass(0, Hunter)') end if not SetPlayerClass(1, 'WarriorMage') then error('SetPlayerClass(1, WarriorMage)') end if not SetPlayerClass(2, 'Ranger') then error('SetPlayerClass(2, Ranger)') end if not SetPlayerClass(3, 'Archer') then error('SetPlayerClass(3, Archer)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES Ranger round 1 set: " .. c) if c ~= "Hunter WarriorMage Ranger Archer" then error("expected Hunter WarriorMage Ranger Archer, got " .. c) end'}
  - interact_actor: {actor_index: 45}
  - assert: {dialog: {active: true, source_id: 181, action_label_present: "Promote our eligible characters."}}
  - select_topic: {match_label: "Promote our eligible characters."}
  - assert: {dialog: {active: true, text_contains: "is now a"}}
  - play_lua: {source: 'local c = classes() log("CLASSES Ranger round 1 promoted: " .. c) if c ~= "RangerLord MasterArcher Ranger Archer" then error("expected RangerLord MasterArcher Ranger Archer, got " .. c) end'}
  # Picked again: nobody left to promote.
  - select_topic: {match_label: "Promote our eligible characters."}
  - assert: {dialog: {active: true, text_contains: "No one among you can take this promotion now."}}
  - play_lua: {source: 'local c = classes() log("CLASSES Ranger round 1 again: " .. c) if c ~= "RangerLord MasterArcher Ranger Archer" then error("expected RangerLord MasterArcher Ranger Archer, got " .. c) end'}
  - press_action: {action: cancel_dialog}
  - advance_runtime: {seconds: 0.3}

  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - save_game: {name: "P95 class table", path: output/playthrough/mm9/promotions/checkpoints/95_frosgard_fenja.oysav}
