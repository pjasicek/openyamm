# MM9 promotion playthrough 92, the class table in bulk (README "What is checked" 5): Drangheim City: Keith Bloodaxe (Crusader) and Atli the Quick (Assassin).
# Each round gives the members a row's "from" classes (a logged test setup through SetPlayerClass, not a cheat
# for a quest), picks the promoter's "Promote our eligible characters." (his quest is done) and asserts every
# member's class; picked again, it has nobody left. Written by class_table.py for a 4-member party
# (a four-class round is played in chunks of the party's size). The party's own classes are
# put back at the end.
#   python3 tests/playthrough/mm9/promotions/run.py 92
id: mm9.promotions.92_drangheim_keith_atli
title: "MM9 promotions 92: the class table at Drangheim City"
world: mm9
mode: faithful
tags: [mm9, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/mm9/promotions/checkpoints/91_thronheim_thorfinn.oysav}
  - setup_shortcut: {kind: immortal}
  # The party's own classes, kept for the end (class ids in global variables; the names remembered for the check).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}

  # To the region, then into drangheimcity through its gate (outdoors the party is placed).
  - travel: {map: drangheim.blv, days: 3}
  - set_pose: {map: drangheim.blv, x: 11458, y: -4164, z: 757, yaw: 0, pitch: 0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 12032, y: -4164, z: 963, timeout_seconds: 30, expect: dialog, clear_hostiles: 2000}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.0, follow_map_move: true}
  - assert: {map: drangheimcity.blv}

  # Crusader: RUDE 89, actor 7.
  - set_pose: {map: drangheimcity.blv, x: 14909, y: -6097, z: 1486, yaw: 1.5708, pitch: 0}
  - advance_runtime: {seconds: 0.5}
  # Round 1: Paladin Ranger Monk Knight -> Crusader Hunter Initiate Knight.
  - lua_event: {source: "if not SetPlayerClass(0, 'Paladin') then error('SetPlayerClass(0, Paladin)') end if not SetPlayerClass(1, 'Ranger') then error('SetPlayerClass(1, Ranger)') end if not SetPlayerClass(2, 'Monk') then error('SetPlayerClass(2, Monk)') end if not SetPlayerClass(3, 'Knight') then error('SetPlayerClass(3, Knight)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES Crusader round 1 set: " .. c) if c ~= "Paladin Ranger Monk Knight" then error("expected Paladin Ranger Monk Knight, got " .. c) end'}
  - interact_actor: {actor_index: 7}
  - assert: {dialog: {active: true, source_id: 89, action_label_present: "Promote our eligible characters."}}
  - select_topic: {match_label: "Promote our eligible characters."}
  - assert: {dialog: {active: true, text_contains: "is now a"}}
  - play_lua: {source: 'local c = classes() log("CLASSES Crusader round 1 promoted: " .. c) if c ~= "Crusader Hunter Initiate Knight" then error("expected Crusader Hunter Initiate Knight, got " .. c) end'}
  # Picked again: nobody left to promote.
  - select_topic: {match_label: "Promote our eligible characters."}
  - assert: {dialog: {active: true, text_contains: "No one among you can take this promotion now."}}
  - play_lua: {source: 'local c = classes() log("CLASSES Crusader round 1 again: " .. c) if c ~= "Crusader Hunter Initiate Knight" then error("expected Crusader Hunter Initiate Knight, got " .. c) end'}
  - press_action: {action: cancel_dialog}
  - advance_runtime: {seconds: 0.3}

  # Assassin: RUDE 88, actor 33.
  - set_pose: {map: drangheimcity.blv, x: 16220, y: -3304, z: 431, yaw: 1.5708, pitch: 0}
  - advance_runtime: {seconds: 0.5}
  # Round 1: Rogue Vampire Thief Cavalier -> Assassin Nosferatu Thief Cavalier.
  - lua_event: {source: "if not SetPlayerClass(0, 'Rogue') then error('SetPlayerClass(0, Rogue)') end if not SetPlayerClass(1, 'Vampire') then error('SetPlayerClass(1, Vampire)') end if not SetPlayerClass(2, 'Thief') then error('SetPlayerClass(2, Thief)') end if not SetPlayerClass(3, 'Cavalier') then error('SetPlayerClass(3, Cavalier)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES Assassin round 1 set: " .. c) if c ~= "Rogue Vampire Thief Cavalier" then error("expected Rogue Vampire Thief Cavalier, got " .. c) end'}
  - interact_actor: {actor_index: 33}
  - assert: {dialog: {active: true, source_id: 88, action_label_present: "Promote our eligible characters."}}
  - select_topic: {match_label: "Promote our eligible characters."}
  - assert: {dialog: {active: true, text_contains: "is now a"}}
  - play_lua: {source: 'local c = classes() log("CLASSES Assassin round 1 promoted: " .. c) if c ~= "Assassin Nosferatu Thief Cavalier" then error("expected Assassin Nosferatu Thief Cavalier, got " .. c) end'}
  # Picked again: nobody left to promote.
  - select_topic: {match_label: "Promote our eligible characters."}
  - assert: {dialog: {active: true, text_contains: "No one among you can take this promotion now."}}
  - play_lua: {source: 'local c = classes() log("CLASSES Assassin round 1 again: " .. c) if c ~= "Assassin Nosferatu Thief Cavalier" then error("expected Assassin Nosferatu Thief Cavalier, got " .. c) end'}
  - press_action: {action: cancel_dialog}
  - advance_runtime: {seconds: 0.3}

  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - save_game: {name: "P92 class table", path: output/playthrough/mm9/promotions/checkpoints/92_drangheim_keith_atli.oysav}
