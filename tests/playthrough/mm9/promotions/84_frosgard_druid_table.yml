# MM9 promotion playthrough 84, block E's class table (README "What is checked" 5): the Green Man (Druid,
# RUDE 221, actor 36) in his clearing in Frosgard, beside whom segment 82 ended. The block's last checkpoint.
# Each round gives the members a row's "from" classes (a logged test setup through SetPlayerClass, not a cheat
# for a quest), picks the promoter's "Promote our eligible characters." (his quest is done) and asserts every
# member's class; picked again, it has nobody left. Written by class_table.py for a 4-member party
# (a four-class round is played in chunks of the party's size). The party's own classes are
# put back at the end.
#   python3 tests/playthrough/mm9/promotions/run.py 84
id: mm9.promotions.84_frosgard_druid_table
title: "MM9 promotions 84: the class table at the Green Man"
world: mm9
mode: faithful
tags: [mm9, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/mm9/promotions/checkpoints/82_frosgard_green_man_done.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: frosgard.blv, qbit_set: [90280]}
  - set_pose: {map: frosgard.blv, x: -18078, y: 22132, z: 1773, yaw: 1.5708, pitch: 0}
  - advance_runtime: {seconds: 0.5}
  # The party's own classes, kept for the end (class ids in global variables; the names remembered for the check).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}

  # Druid: RUDE 221, actor 36.
  # Round 1: GreatDruid DarkElf Druid Priest -> ArchDruid Patriarch Druid Priest.
  - lua_event: {source: "if not SetPlayerClass(0, 'GreatDruid') then error('SetPlayerClass(0, GreatDruid)') end if not SetPlayerClass(1, 'DarkElf') then error('SetPlayerClass(1, DarkElf)') end if not SetPlayerClass(2, 'Druid') then error('SetPlayerClass(2, Druid)') end if not SetPlayerClass(3, 'Priest') then error('SetPlayerClass(3, Priest)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES Druid round 1 set: " .. c) if c ~= "GreatDruid DarkElf Druid Priest" then error("expected GreatDruid DarkElf Druid Priest, got " .. c) end'}
  - interact_actor: {actor_index: 36}
  - assert: {dialog: {active: true, source_id: 221, action_label_present: "Promote our eligible characters."}}
  - select_topic: {match_label: "Promote our eligible characters."}
  - assert: {dialog: {active: true, text_contains: "is now a"}}
  - play_lua: {source: 'local c = classes() log("CLASSES Druid round 1 promoted: " .. c) if c ~= "ArchDruid Patriarch Druid Priest" then error("expected ArchDruid Patriarch Druid Priest, got " .. c) end'}
  # Picked again: nobody left to promote.
  - select_topic: {match_label: "Promote our eligible characters."}
  - assert: {dialog: {active: true, text_contains: "No one among you can take this promotion now."}}
  - play_lua: {source: 'local c = classes() log("CLASSES Druid round 1 again: " .. c) if c ~= "ArchDruid Patriarch Druid Priest" then error("expected ArchDruid Patriarch Druid Priest, got " .. c) end'}
  - press_action: {action: cancel_dialog}
  - advance_runtime: {seconds: 0.3}

  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - save_game: {name: "P84 Druid class table", path: output/playthrough/mm9/promotions/checkpoints/84_frosgard_druid_table.oysav}
