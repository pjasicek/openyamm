# MM9 promotion playthrough 94, the class table in bulk (README "What is checked" 5): Thjorgard City: Tymon the Nord (Scholar) and Johannes Bem (Mage).
# Each round gives the members a row's "from" classes (a logged test setup through SetPlayerClass, not a cheat
# for a quest), picks the promoter's "Promote our eligible characters." (his quest is done) and asserts every
# member's class; picked again, it has nobody left. Written by class_table.py for a 4-member party
# (a four-class round is played in chunks of the party's size). The party's own classes are
# put back at the end.
#   python3 tests/playthrough/mm9/promotions/run.py 94
id: mm9.promotions.94_thjorgard_tymon_johannes
title: "MM9 promotions 94: the class table at Thjorgard City"
world: mm9
mode: faithful
tags: [mm9, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/mm9/promotions/checkpoints/93_guberland_tjolnir_slemnir.oysav}
  - setup_shortcut: {kind: immortal}
  # The party's own classes, kept for the end (class ids in global variables; the names remembered for the check).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}

  # To the region, then into thjorgardcity through its gate (outdoors the party is placed).
  - travel: {map: thjorgard.blv, days: 3}
  - set_pose: {map: thjorgard.blv, x: -9300, y: 4392, z: 1951, yaw: 0, pitch: 0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: -8790, y: 4392, z: 1951, z_tolerance: 600, plan: false, timeout_seconds: 20, expect: dialog, clear_hostiles: 2000}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.0, follow_map_move: true}
  - assert: {map: thjorgardcity.blv}

  # Scholar: RUDE 161, actor 13.
  - set_pose: {map: thjorgardcity.blv, x: 4915, y: 12630, z: 1, yaw: 1.5708, pitch: 0}
  - advance_runtime: {seconds: 0.5}
  # Round 1: Sorcerer Cleric Wizard Knight -> Wizard Cleric Wizard Knight.
  - lua_event: {source: "if not SetPlayerClass(0, 'Sorcerer') then error('SetPlayerClass(0, Sorcerer)') end if not SetPlayerClass(1, 'Cleric') then error('SetPlayerClass(1, Cleric)') end if not SetPlayerClass(2, 'Wizard') then error('SetPlayerClass(2, Wizard)') end if not SetPlayerClass(3, 'Knight') then error('SetPlayerClass(3, Knight)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES Scholar round 1 set: " .. c) if c ~= "Sorcerer Cleric Wizard Knight" then error("expected Sorcerer Cleric Wizard Knight, got " .. c) end'}
  - interact_actor: {actor_index: 13}
  - assert: {dialog: {active: true, source_id: 161, action_label_present: "Promote our eligible characters."}}
  - select_topic: {match_label: "Promote our eligible characters."}
  - assert: {dialog: {active: true, text_contains: "is now a"}}
  - play_lua: {source: 'local c = classes() log("CLASSES Scholar round 1 promoted: " .. c) if c ~= "Wizard Cleric Wizard Knight" then error("expected Wizard Cleric Wizard Knight, got " .. c) end'}
  # Picked again: nobody left to promote.
  - select_topic: {match_label: "Promote our eligible characters."}
  - assert: {dialog: {active: true, text_contains: "No one among you can take this promotion now."}}
  - play_lua: {source: 'local c = classes() log("CLASSES Scholar round 1 again: " .. c) if c ~= "Wizard Cleric Wizard Knight" then error("expected Wizard Cleric Wizard Knight, got " .. c) end'}
  - press_action: {action: cancel_dialog}
  - advance_runtime: {seconds: 0.3}

  # Mage: RUDE 4, actor 0.
  - set_pose: {map: thjorgardcity.blv, x: 5079, y: 12302, z: 1, yaw: 1.5708, pitch: 0}
  - advance_runtime: {seconds: 0.5}
  # Round 1: Wizard Sorcerer Lich Priest -> ArchMage Sorcerer Lich Priest.
  - lua_event: {source: "if not SetPlayerClass(0, 'Wizard') then error('SetPlayerClass(0, Wizard)') end if not SetPlayerClass(1, 'Sorcerer') then error('SetPlayerClass(1, Sorcerer)') end if not SetPlayerClass(2, 'Lich') then error('SetPlayerClass(2, Lich)') end if not SetPlayerClass(3, 'Priest') then error('SetPlayerClass(3, Priest)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES Mage round 1 set: " .. c) if c ~= "Wizard Sorcerer Lich Priest" then error("expected Wizard Sorcerer Lich Priest, got " .. c) end'}
  - interact_actor: {actor_index: 0}
  - assert: {dialog: {active: true, source_id: 4, action_label_present: "Promote our eligible characters."}}
  - select_topic: {match_label: "Promote our eligible characters."}
  - assert: {dialog: {active: true, text_contains: "is now a"}}
  - play_lua: {source: 'local c = classes() log("CLASSES Mage round 1 promoted: " .. c) if c ~= "ArchMage Sorcerer Lich Priest" then error("expected ArchMage Sorcerer Lich Priest, got " .. c) end'}
  # Picked again: nobody left to promote.
  - select_topic: {match_label: "Promote our eligible characters."}
  - assert: {dialog: {active: true, text_contains: "No one among you can take this promotion now."}}
  - play_lua: {source: 'local c = classes() log("CLASSES Mage round 1 again: " .. c) if c ~= "ArchMage Sorcerer Lich Priest" then error("expected ArchMage Sorcerer Lich Priest, got " .. c) end'}
  - press_action: {action: cancel_dialog}
  - advance_runtime: {seconds: 0.3}

  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - save_game: {name: "P94 class table", path: output/playthrough/mm9/promotions/checkpoints/94_thjorgard_tymon_johannes.oysav}
