# MM9 promotion playthrough 78, block E: the Druid promotion's start (guide: side_c.yml find-the-green-man).
# Lindisfarne to Frosgard by sea, the city's road gate (Chapter V: the battle of segment 59 is over, key 377).
# Menja Ketildotir (actor 46, RUDE 182) in the city's west part sends the party to find the Green Man (key 262; MM9
# sent only Healers who had the Healer promotion, key 213, waived: dialogue/promotions.yml). Out of the city;
# Fland de Allasan the tracker (actor 35 in the region, RUDE 189) on the road south of the gate gives his advice
# (optional); the Green Man (actor 36, RUDE 221) at his tree in the south-east clearing gives his three tasks: the
# maypole (264), six pledges (265) and Tryygva's runestone (266). Research: prep/E_paladin_druid.md.
#   python3 tests/playthrough/mm9/promotions/run.py 78
id: mm9.promotions.78_frosgard_menja_green_man
title: "MM9 promotions 78: Menja sends the party to the Green Man; his three tasks"
world: mm9
mode: faithful
tags: [mm9, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/mm9/promotions/checkpoints/77_lindisfarne_paladin_table.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: lindisfarne.blv, qbit_set: [90108, 90377], qbit_clear: [90262, 90264, 90265, 90266]}

  # The boat to Frosgard; the city's road gate.
  - travel: {map: frosgard.blv, days: 4}
  - set_pose: {map: frosgard.blv, x: 1783, y: 3700, z: 1738, yaw: -1.5708, pitch: 0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 1783, y: 3250, z: 1738, timeout_seconds: 20, expect: dialog}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.0, follow_map_move: true}
  - assert: {map: frosgardcity.blv}

  # Menja in the city's west part.
  - set_pose: {map: frosgardcity.blv, x: 12042, y: 219, z: 1, yaw: 1.5708, pitch: 0}
  - advance_runtime: {seconds: 0.5}
  - interact_actor: {actor_index: 46}
  - select_topic: {match_label: "Our Healers are looking for promotion."}
  - select_topic: {match_label: "Yes."}
  - select_topic: {match_label: "How do we find the Green Man?"}
  - select_topic: {match_label: "We will find the Green Man."}
  - select_topic: {match_label: "Goodbye."}
  - advance_runtime: {seconds: 0.5}
  - assert: {qbit_set: [90262]}

  # Out of the city by its gate.
  - set_pose: {map: frosgardcity.blv, x: 11983, y: 7600, z: 1, yaw: 1.5708, pitch: 0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 11983, y: 8146, z: 1, z_tolerance: 600, plan: false, timeout_seconds: 20, expect: dialog}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.0, follow_map_move: true}
  - assert: {map: frosgard.blv}

  # Fland the tracker on the road south of the gate: keep going, always turn left, not into the tunnel.
  - set_pose: {map: frosgard.blv, x: 3551, y: 6162, z: 1329, yaw: 1.5708, pitch: 0}
  - advance_runtime: {seconds: 0.5}
  - interact_actor: {actor_index: 35}
  - select_topic: {match_label: "We need your help."}
  - select_topic: {match_label: "We've been charged with finding the Green Man."}
  - select_topic: {match_label: "Thank you."}
  - select_topic: {match_label: "Yes."}
  - select_topic: {match_label: "Goodbye."}
  - advance_runtime: {seconds: 0.5}

  # The Green Man at his tree in the clearing.
  - set_pose: {map: frosgard.blv, x: -18078, y: 22132, z: 1773, yaw: 1.5708, pitch: 0}
  - advance_runtime: {seconds: 0.5}
  - interact_actor: {actor_index: 36}
  - select_topic: {match_label: "We've come on behalf of Frosgard."}
  - select_topic: {match_label: "We think the Frosgardians are eager for your return."}
  - select_topic: {match_label: "How can we help?"}
  - select_topic: {match_label: "We can do that."}
  - select_topic: {match_label: "That can be done."}
  - select_topic: {match_label: "We will do that."}
  - select_topic: {match_label: "Goodbye."}
  - advance_runtime: {seconds: 0.5}
  - assert: {qbit_set: [90264, 90265, 90266]}
  - save_game: {name: "P78 the Green Man's tasks", path: output/playthrough/mm9/promotions/checkpoints/78_frosgard_menja_green_man.oysav}
