# MM9 promotion playthrough 90, the class table in bulk (README "What is checked" 5): Sturmford City: Fridleif Gjukissen (Gladiator), two rounds: the five racial and Cavalier/Initiate lines.
# Each round gives the members a row's "from" classes (a logged test setup through SetPlayerClass, not a cheat
# for a quest), picks the promoter's "Promote our eligible characters." (his quest is done) and asserts every
# member's class; picked again, it has nobody left. Written by class_table.py for a 4-member party
# (a four-class round is played in chunks of the party's size). The party's own classes are
# put back at the end.
#   python3 tests/playthrough/mm9/promotions/run.py 90
id: mm9.promotions.90_sturmford_fridleif
title: "MM9 promotions 90: the class table at Sturmford City"
world: mm9
mode: faithful
tags: [mm9, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/mm9/promotions/checkpoints/63_johannes_no_one.oysav}
  - setup_shortcut: {kind: immortal}
  # The party's own classes, kept for the end (class ids in global variables; the names remembered for the check).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}

  # To the region, then into sturmfordcity through its gate (outdoors the party is placed).
  - travel: {map: sturmford.blv, days: 4}
  - set_pose: {map: sturmford.blv, x: 8090, y: -3312, z: 252, yaw: 3.1416, pitch: 0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 7300, y: -3312, z: 400, z_tolerance: 500, radius: 10, plan: false, timeout_seconds: 20, expect: dialog}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.0, follow_map_move: true}
  - assert: {map: sturmfordcity.blv}

  # Gladiator: RUDE 61, actor 31.
  - set_pose: {map: sturmfordcity.blv, x: 5775, y: 4453, z: 20565, yaw: 1.5708, pitch: 0}
  - advance_runtime: {seconds: 0.5}
  # Round 1: Cavalier Initiate Minotaur Troll -> Champion Master MinotaurLord WarTroll.
  - lua_event: {source: "if not SetPlayerClass(0, 'Cavalier') then error('SetPlayerClass(0, Cavalier)') end if not SetPlayerClass(1, 'Initiate') then error('SetPlayerClass(1, Initiate)') end if not SetPlayerClass(2, 'Minotaur') then error('SetPlayerClass(2, Minotaur)') end if not SetPlayerClass(3, 'Troll') then error('SetPlayerClass(3, Troll)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES Gladiator round 1 set: " .. c) if c ~= "Cavalier Initiate Minotaur Troll" then error("expected Cavalier Initiate Minotaur Troll, got " .. c) end'}
  - interact_actor: {actor_index: 31}
  - assert: {dialog: {active: true, source_id: 61, action_label_present: "Promote our eligible characters."}}
  - select_topic: {match_label: "Promote our eligible characters."}
  - assert: {dialog: {active: true, text_contains: "is now a"}}
  - play_lua: {source: 'local c = classes() log("CLASSES Gladiator round 1 promoted: " .. c) if c ~= "Champion Master MinotaurLord WarTroll" then error("expected Champion Master MinotaurLord WarTroll, got " .. c) end'}
  # Picked again: nobody left to promote.
  - select_topic: {match_label: "Promote our eligible characters."}
  - assert: {dialog: {active: true, text_contains: "No one among you can take this promotion now."}}
  - play_lua: {source: 'local c = classes() log("CLASSES Gladiator round 1 again: " .. c) if c ~= "Champion Master MinotaurLord WarTroll" then error("expected Champion Master MinotaurLord WarTroll, got " .. c) end'}
  - press_action: {action: cancel_dialog}
  - advance_runtime: {seconds: 0.3}
  # Round 2: Dragon Knight Rogue Champion -> GreatWyrm Knight Rogue Champion.
  - lua_event: {source: "if not SetPlayerClass(0, 'Dragon') then error('SetPlayerClass(0, Dragon)') end if not SetPlayerClass(1, 'Knight') then error('SetPlayerClass(1, Knight)') end if not SetPlayerClass(2, 'Rogue') then error('SetPlayerClass(2, Rogue)') end if not SetPlayerClass(3, 'Champion') then error('SetPlayerClass(3, Champion)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES Gladiator round 2 set: " .. c) if c ~= "Dragon Knight Rogue Champion" then error("expected Dragon Knight Rogue Champion, got " .. c) end'}
  - interact_actor: {actor_index: 31}
  - assert: {dialog: {active: true, source_id: 61, action_label_present: "Promote our eligible characters."}}
  - select_topic: {match_label: "Promote our eligible characters."}
  - assert: {dialog: {active: true, text_contains: "is now a"}}
  - play_lua: {source: 'local c = classes() log("CLASSES Gladiator round 2 promoted: " .. c) if c ~= "GreatWyrm Knight Rogue Champion" then error("expected GreatWyrm Knight Rogue Champion, got " .. c) end'}
  # Picked again: nobody left to promote.
  - select_topic: {match_label: "Promote our eligible characters."}
  - assert: {dialog: {active: true, text_contains: "No one among you can take this promotion now."}}
  - play_lua: {source: 'local c = classes() log("CLASSES Gladiator round 2 again: " .. c) if c ~= "GreatWyrm Knight Rogue Champion" then error("expected GreatWyrm Knight Rogue Champion, got " .. c) end'}
  - press_action: {action: cancel_dialog}
  - advance_runtime: {seconds: 0.3}

  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - save_game: {name: "P90 class table", path: output/playthrough/mm9/promotions/checkpoints/90_sturmford_fridleif.oysav}
