# MM9 playthrough, segment 09: Anskram Keep cleared of its eight Imp gates (guide: Chapter I, Sturmford, "Clear out
# Anskram Keep"). Out of Sturmford City by its north gate; outside the keep the party is placed at the weak section of
# the SE tower's sea wall and breaks it with its weapons (destructible 199, 100 HP), walks up the tower's spiral stair
# to the east wall walk, over the bridge to the keep's east terrace and in by the high door. The keep is walked:
# every double and round door is clicked from outside its swing (they shut by themselves); each gate starts when the
# party steps on its pad and sends five Imps one by one, which die (combat is not tested); the west corridor's
# pivot trap (PivotWallTrap3, before gate 2) is sprung with one step onto its edge and back, and crossed on its turned
# floor during its five-second wait, both ways; the airlock opens with its two levers. Eight gates: key 39. Out by
# the ground-level door into the gate passage. Research: prep/01_19_prologue_sturmford_drangheim.md.
