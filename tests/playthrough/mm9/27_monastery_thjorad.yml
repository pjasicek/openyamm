# MM9 playthrough, segment 27: Thjorad (guide: Chapter I, "Retrieve Thjorad from Lindisfarne"). The Sea's Fang from
# Thjorgard to Lindisfarne (four days; outdoors the party is moved; the monastery lies at the island's far south, not
# north as the guide has it). The monastery is walked: the nave (its monks stand about: never hurt one), the
# crossing, the west transept's ladder to the gallery, the gallery's ladder to the attic, the attic's ladder beside the
# crossing to the bell floor. Ladders are climbed with the `climb` step (the movement keys and the game's
# ladder rules; CLIMB lines). The five ropes, numbered from the east, are pulled 1, 5, 2, 4, 3: the bells
# peal (key 9507) and Thjorad's four guards go to pray. Down by dropping through the holes beside the ladders (the
# ladders cannot be taken from their tops), east to the east wing's end: Thjorad (item 10197, key 31). Out by the
# narthex. Research: prep/20_34_thjorgard_guberland.md (segment 25 there).
#   python3 tests/playthrough/mm9/run.py 27
id: mm9.playthrough.27_monastery_thjorad
title: "MM9 playthrough 27: Lindisfarne Monastery's bells and Thjorad"
world: mm9
mode: faithful
tags: [mm9, playthrough]
steps:
  - load_game: {path: output/playthrough/mm9/checkpoints/26_mine_slag_extractor.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: thjorgard.blv, qbit_set: [90002], qbit_clear: [99507, 90031, 90162]}

  # The Sea's Fang to Lindisfarne; the monastery's door (ExitTrigger0) at the island's south end.
  - travel: {map: lindisfarne.blv, days: 4}
  - set_pose: {map: lindisfarne.blv, x: -11250, y: -21240, z: 2734, yaw: 3.1416, pitch: 0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: -11749, y: -21240, z: 2734, z_tolerance: 600, plan: false, timeout_seconds: 20, expect: dialog}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.0, follow_map_move: true}
  - assert: {map: lindisfarnemonastery.blv}

  # The narthex, the nave (east of its centre line: monks stand on it), the crossing, the west transept.
  - walk_to: {x: -330, y: 1000, z: 1, z_tolerance: 200, plan: false, timeout_seconds: 60}
  - play_lua: {source: 'click(101); wait(2)'}
  - walk_to: {via: [[-100, 1700, 1]], x: -100, y: 5600, z: 1, z_tolerance: 200, plan: false, timeout_seconds: 60}
  - play_lua: {source: 'click(102); wait(2)'}
  - walk_to: {via: [[-100, 6300, 1]], x: -330, y: 6900, z: 1, z_tolerance: 200, plan: false, timeout_seconds: 60}
  - walk_to: {via: [[-700, 7650, 1], [-2150, 7650, 1]], x: -2278, y: 7690, z: 1, z_tolerance: 200, plan: false, timeout_seconds: 60}

  # Ladder4 up to the gallery.
  - climb: {ladder: Ladder4}
  # Ladder1 up to the attic (from its south side: its back faces the way the party came).
  - walk_to: {via: [[-1800, 7300, 983], [-1800, 6700, 983], [-2094, 6700, 983]], x: -2094, y: 6800, z: 983, z_tolerance: 100, plan: false, timeout_seconds: 30}
  - climb: {ladder: Ladder1}
  # Ladder3 to the bell floor: its foot is reached along the crossing attic's west side (the roof slopes to the floor
  # elsewhere).
  - walk_to: {via: [[-1300, 7000, 2294], [-860, 7000, 2294], [-860, 6400, 2294]], x: -880, y: 6025, z: 2294, z_tolerance: 100, plan: false, timeout_seconds: 30}
  - climb: {ladder: Ladder3}

  # The bell ropes hang in a row at the bell floor's south side; numbered from the east, pulled 1, 5, 2, 4, 3.
  - walk_to: {x: -330, y: 6090, z: 3236, z_tolerance: 100, plan: false, timeout_seconds: 30}
  - play_lua:
      source: |
        local ROPE = {91, 92, 93, 94, 95}   -- Rope1 (east) .. Rope5 (west)
        for _, n in ipairs({1, 5, 2, 4, 3}) do click(ROPE[n]); wait(1.0) end
        wait(5)   -- a bell reports to BellControl 5 s after its pull (Ring 2 s, then Wait 1,3,StopDone)
        if not qbit(99507) then error("the bells did not peal") end
        log("ropes 1, 5, 2, 4, 3: the bells peal; Thjorad's guards go to pray")
  - assert: {state_dump_named_map_var: {name: AtPrayer, value: 1}}

  # Down through the holes beside the ladders: the bell floor's into the attic, the attic's onto the gallery (then
  # east, away from Ladder1's foot), the gallery's to the floor.
  - walk_to: {via: [[-882, 6150, 3236]], x: -882, y: 6000, z: 2294, z_tolerance: 2000, radius: 10, plan: false, timeout_seconds: 30}
  - advance_runtime: {seconds: 2}
  - walk_to: {via: [[-880, 7000, 2294], [-1300, 7000, 2294], [-2078, 7000, 2294]], x: -2078, y: 6780, z: 986, z_tolerance: 2000, radius: 10, plan: false, timeout_seconds: 30}
  - advance_runtime: {seconds: 2}
  - walk_to: {via: [[-1750, 6785, 986], [-1750, 7690, 986]], x: -2263, y: 7720, z: 0, z_tolerance: 2000, radius: 10, plan: false, timeout_seconds: 30}
  - advance_runtime: {seconds: 2}
  - assert: {party_position: {x: -2263, y: 7720, radius: 100, z_min: -10, z_max: 20}}

  # East through the crossing and the east transept's door into the east wing; Thjorad at its end.
  - walk_to: {x: 2350, y: 6390, z: 1, z_tolerance: 200, timeout_seconds: 300}
  - play_lua: {source: 'click(105); wait(2.5)'}
  - walk_to: {x: 3000, y: 6390, z: 1, z_tolerance: 200, plan: false, timeout_seconds: 30}
  - walk_to: {x: 6950, y: 6150, z: 1, z_tolerance: 200, timeout_seconds: 300}
  - play_lua:
      source: |
        click(75); wait(1)
        if not has_item(10197) then error("no Thjorad") end
        log("Thjorad, the hammer, is in the pack")
  - assert: {qbit_set: [90031]}

  # Out the way the party came: the east wing, the crossing between its pillars, the nave, the narthex.
  - walk_to: {x: 3000, y: 6390, z: 1, z_tolerance: 200, timeout_seconds: 120}
  - walk_to: {via: [[2350, 6390, 1], [600, 6700, 1]], x: -100, y: 6700, z: 1, z_tolerance: 200, plan: false, timeout_seconds: 60}
  - walk_to: {x: -100, y: 6300, z: 1, z_tolerance: 200, plan: false, timeout_seconds: 30}
  - play_lua:
      source: |
        log("crossing doors (102): " .. door_state(3) .. ", " .. door_state(4))
        if door_state(3) ~= "open" or door_state(4) ~= "open" then click(102); wait(2) end
  - walk_to: {via: [[-100, 5600, 1]], x: -100, y: 1700, z: 1, z_tolerance: 200, plan: false, timeout_seconds: 60}
  - play_lua:
      source: |
        log("nave doors (101): " .. door_state(1) .. ", " .. door_state(2))
        if door_state(1) ~= "open" or door_state(2) ~= "open" then click(101); wait(2) end
  - walk_to: {via: [[-330, 1000, 1]], x: -328, y: -1000, z: 1, z_tolerance: 200, plan: false, timeout_seconds: 60}
  - walk_to: {x: -328, y: -1393, z: 1, z_tolerance: 400, plan: false, timeout_seconds: 20, expect: dialog}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.0, follow_map_move: true}
  - assert: {map: lindisfarne.blv}
  - play_lua: {source: 'if qbit(90031) and has_item(10197) then log("out of the monastery with Thjorad; no monk was hurt") end'}
  - save_game: {name: "27 Thjorad", path: output/playthrough/mm9/checkpoints/27_monastery_thjorad.oysav}
