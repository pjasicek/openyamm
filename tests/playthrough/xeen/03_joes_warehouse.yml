# Xeen playthrough, segment 03: Joe's Warehouse (XD-01) and the invoice (M2). From Joe's yard (the party placed at
# the loading doors, PLAYBOOK §2) into the warehouse with the key from under the rain barrel; walked: the street
# doors, Joe's office (the pen key in his cabinet), the grain hall, the aisle and the KEEP OUT door, down the cellar
# stair, past the pens to the shipping room and the invoice crate; out by the culvert, whose grate is lifted from
# inside, onto X1's riverbank. Mayor Gunther takes the invoice: M2 done, the citizenship award, M3 started.
# Route: devdocs/xeen/briefs/xd01/L4/playtest.yml. Quest logic: source/quests/m2.yml, m3.yml.
#   python3 tests/playthrough/xeen/run.py 03
id: xeen.playthrough.03_joes_warehouse
title: "Xeen playthrough 03: Joe's Warehouse walked for the invoice, and Mayor Gunther paid"
world: xeen
mode: faithful
tags: [xeen, playthrough]
steps:
  - load_game: {path: output/playthrough/xeen/checkpoints/01_vertigo.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_x1.odm}
  - assert: {qbit_set: [111040]}
  - play_lua: {source: "if not has_item(12001) then error('no warehouse key') end"}
  # Joe's yard: the warehouse's loading doors (X1 event 69, m2.warehouse_door wants the key).
  - set_pose: {map: xeen_x1.odm, x: -1818, y: 2918, z: 640, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - press_interact: {expect: {kind: event_target}}
  # F16: the standard entrance window.
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_xd01.blv}
  - assert: {party_position: {x: 768, y: -900, radius: 96, z_min: 112, z_max: 144}}
  # The street doors: barred from inside, and the warehouse key opens them.
  - play_lua:
      source: |
        click(31); wait(3)
        if door_state(16) ~= "open" or door_state(17) ~= "open" then error("the warehouse key did not open the street doors: " .. door_state(16) .. " " .. door_state(17)) end
  - walk_to: {x: 768, y: -300, z: 64, radius: 96, timeout_seconds: 60, clear_hostiles: 1500}
  - walk_to: {x: 768, y: 400, z: 0, radius: 96, timeout_seconds: 60, clear_hostiles: 1500}
  # Joe's office: the door, and the pen key in his cabinet.
  - walk_to: {x: 0, y: 344, z: 0, radius: 64, timeout_seconds: 60, clear_hostiles: 1500}
  - play_lua: {source: "open_door(16, 6)"}
  - walk_to: {x: -300, y: 400, z: 64, radius: 64, timeout_seconds: 60, clear_hostiles: 1500}
  - walk_to: {x: -300, y: 1000, z: 64, radius: 64, timeout_seconds: 60, clear_hostiles: 1500}
  - play_lua:
      source: |
        loot_chest(32)
        if not has_item(12003) then error("Joe's cabinet did not give the pen key") end
        log("the pen key from Joe's cabinet")
  - walk_to: {x: -300, y: 400, z: 64, radius: 64, timeout_seconds: 60, clear_hostiles: 1500}
  - walk_to: {x: 0, y: 344, z: 0, radius: 64, timeout_seconds: 60, clear_hostiles: 1500}
  # The barn doors into the grain hall, across it to the aisle.
  - walk_to: {x: 896, y: 1150, z: 0, radius: 64, timeout_seconds: 60, clear_hostiles: 1500}
  - play_lua: {source: "open_door(1, 1)"}
  - walk_to: {x: 896, y: 1560, z: 0, radius: 96, timeout_seconds: 60, clear_hostiles: 1500}
  - walk_to: {x: 700, y: 1946, z: -24, radius: 64, timeout_seconds: 60, clear_hostiles: 1500}
  - walk_to: {x: 1000, y: 2086, z: 0, radius: 48, timeout_seconds: 60, clear_hostiles: 1500}
  - walk_to: {x: 2144, y: 2000, z: 0, radius: 64, timeout_seconds: 60, clear_hostiles: 1500}
  - walk_to: {x: 2368, y: 3200, z: 0, radius: 64, timeout_seconds: 60, clear_hostiles: 600}
  # KEEP OUT: the pen key opens it.
  - play_lua: {source: "open_door(10, 5)"}
  # Down the cellar stair into the cistern; the pens' rats are fought where they come out.
  - walk_to: {x: 2368, y: 3612, z: -96, radius: 64, timeout_seconds: 60, clear_hostiles: 300}
  - walk_to: {x: 2368, y: 4032, z: -192, radius: 32, timeout_seconds: 60, clear_hostiles: 300}
  - walk_to: {x: 2368, y: 4512, z: -360, radius: 64, timeout_seconds: 60, clear_hostiles: 300}
  - walk_to: {x: 2368, y: 4912, z: -384, radius: 64, timeout_seconds: 60, clear_hostiles: 600}
  - walk_to: {x: 2368, y: 6112, z: -384, radius: 64, timeout_seconds: 60, clear_hostiles: 1000}
  # The shipping room and the invoice crate (m2.invoice_crate): the invoice, its note, the quest bit.
  - walk_to: {x: 2856, y: 5962, z: -384, radius: 64, timeout_seconds: 60, clear_hostiles: 1500}
  - play_lua: {source: "open_door(26, 14)"}
  - walk_to: {x: 3880, y: 6990, z: -384, radius: 64, timeout_seconds: 60, clear_hostiles: 1500}
  # The crate opens with the invoice's message over it (since 2026-11-21): read it, then take all and close both.
  - play_lua:
      source: |
        if qbit(110010) then error("joe_invoice_found is set before the crate is opened") end
        click(9)
        wait(1)
  - assert:
      dialog: {text_contains: "Mayor Gunther will want to hear about this"}
  - play_lua:
      source: |
        if not take_chest() then error("the invoice crate did not open") end
        close()
        wait(0.5)
        close()
        if not has_item(12002) then error("the invoice crate did not give the invoice") end
        if not qbit(110010) then error("the invoice crate did not set joe_invoice_found") end
  # Out by the culvert: the iron door, the slope, the outfall, the grate lifted from inside (m2.culvert).
  - walk_to: {x: 2956, y: 5472, z: -384, radius: 64, timeout_seconds: 60, clear_hostiles: 1500}
  - play_lua: {source: "open_door(3, 3)"}
  - walk_to: {x: 3406, y: 5472, z: -384, radius: 64, timeout_seconds: 60, clear_hostiles: 1500}
  - walk_to: {x: 3726, y: 5472, z: -384, radius: 64, timeout_seconds: 60, clear_hostiles: 1500}
  - walk_to: {x: 3728, y: 5112, z: -384, radius: 64, timeout_seconds: 60, clear_hostiles: 1500}
  - walk_to: {x: 3728, y: 4312, z: -620, radius: 64, timeout_seconds: 60, clear_hostiles: 1500}
  - walk_to: {x: 3956, y: 4000, z: -640, radius: 64, timeout_seconds: 60, clear_hostiles: 1500}
  - walk_to: {x: 4556, y: 4000, z: -640, radius: 64, timeout_seconds: 60, clear_hostiles: 1500}
  - play_lua:
      source: |
        click(25); wait(6)
        if door_state(13) ~= "open" then error("the river grate did not lift: " .. door_state(13)) end
        if not qbit(110012) then error("lifting the grate did not set culvert_grate_open") end
  - walk_to: {x: 4856, y: 4000, z: -640, radius: 48, timeout_seconds: 60, clear_hostiles: 1500}
  # Out onto X1's riverbank; the exit asks first.
  - execute_event: {id: 24}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.0, follow_map_move: true}
  - assert: {map: xeen_x1.odm}
  - assert: {party_position: {x: -1536, y: 4900, radius: 128, z_min: 540, z_max: 700}}
  - walk_to: {x: -2560, y: 4608, z: 640, z_tolerance: 200, radius: 128, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  # The town hall (event 9, house 4003): Gunther takes the invoice (M2 done, M3 started).
  - execute_event: {id: 9}
  - select_topic: {match_label: "Joe's invoice"}
  - assert:
      dialog: {text_contains: "outstanding citizenship award"}
  - press_action: {action: cancel_dialog}
  - assert: {qbit_set: [111041, 111060, 110010, 110012]}
  - assert: {qbit_clear: [111040, 111020]}
  - play_lua:
      source: |
        if has_item(12002) then error("Gunther did not take the invoice") end
        log("M2 done: experience " .. experience(0) .. ", gold " .. gold())
  - save_game: {name: "03 Joe's Warehouse", path: output/playthrough/xeen/checkpoints/03_joes_warehouse.oysav}
