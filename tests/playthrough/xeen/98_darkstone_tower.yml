  - assert: {qbit_set: [111780, 111801]}
  - assert: {qbit_clear: [111820]}
  - play_lua: {source: "log('98 start: ' .. classes() .. '; experience ' .. experience(0) .. '; gold ' .. gold()); for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end; if not has_item(12373) then error('no Chime of Opening (12373)') end"}
  # South off X6's edge to Winterkill Tundra (as segment 85).
