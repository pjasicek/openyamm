  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: -7168, y: -24064, z: 1472, z_tolerance: 1500, radius: 128, timeout_seconds: 60, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_x5.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Darkstone Tower's door (X5 event 59, m41.tower_door: the black key).
  - set_pose: {map: xeen_x5.odm, x: -4608, y: 2560, z: 1504, yaw: -1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 4000}
  # The door's line in the click's step (a --reload save and load after it would drop the status line).
  - play_lua: {source: "status(); click(59); wait(0.5); local s = status() or ''; log('tower door: ' .. s); if not string.find(s, 'The black key turns without a sound', 1, true) then error('no tower door line: ' .. s) end"}
