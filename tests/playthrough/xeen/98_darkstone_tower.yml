# Xeen playthrough, segment 98: Darkstone Tower (X6, X5, FD-03), M41, up to the Clouds of the Ancients (P5).
# On X6 before the Southern Sphinx with the Chime of Opening (12373) and the Darkstone Tower key (m39.darkstone_key
# 111780). South off X6's edge to Winterkill Tundra (X5); Darkstone Tower's door (X5 event 59, m41.tower_door: the black
# key turns, a status line) into FD-03's entrance:x5_door. FD-03 walked along A7's path
# (devdocs/xeen/briefs/fd03/L4/playtest.yml): the arrival line, the way out's window (cancelled); every storey's gong
# with its guards and slab ("No Sound No Ground!", m41.gong_voice; the daises rise), the plaques (one storey's fourth
# read gives the columns), the Onyx Golem and the skull vault; the top floor's four heads (m41.plaques_l4: autonote
# 4720); the invisible seal at the foot of the roof stair: the Chime of Opening breaks it (m41.seal: seal_broken 111820,
# the Chime taken, 27,000 each); up the roof stair to the hatch: "Climb to the Clouds of the Ancients?" Yes, onto P5's
# entrance:fd03_roof. Ends on P5.
# Routes: segment 85 (the X6/X5 edge), devdocs/xeen/briefs/fd03/L4/playtest.yml and playtest_roof.yml.
# Quest logic: source/quests/m41.yml.
#   python3 tests/playthrough/xeen/run.py 98
id: xeen.playthrough.98_darkstone_tower
title: "Xeen playthrough 98: Darkstone Tower, the gongs, the seal broken by the Chime, the roof to the clouds"
world: xeen
mode: faithful
tags: [xeen, playthrough]
