# Xeen playthrough, segment 57: Megan's key and the Dungeon of Lost Souls (DD-03, D1-D4, DD-12), M20 and M24's
# dungeon. Into Castle Kalindra (stage 2) and up to the Captain's corridor: Megan (Father: the key to the Dungeon of
# Lost Souls, M20). Out, east off D1's edge to Sprite Forest, along the caravan road to Sandcaster (D3), north off D3's
# edge to Lakeside (D4). Lakeside Yachts to the Isle of Lost Souls; the ruined tower's door opens with Megan's key.
# DD-12 walked: the carving (m24.arrival), five gates answered Yes (the map's gate bits 117441-117445), the hall of
# storage and its hourglasses, the cells, the dials and the Soul Waters, the Reserve, the Soul Maze and the horned
# throne (Q-D25), the aviary: the Songbird (m24.songbird: bird_freed). The lift up to L1 and out by the double door to
# the Isle; Tern's ferry back to Lakeside's jetty. Segment 59 takes the Songbird to Dimitri.
# Routes: devdocs/xeen/briefs/dd03/L4/playtest.yml (stage 2), d1/L4, d2/L4, d3/L4 (the edges, as segment 55),
# d4/L4/playtest.yml (the Isle, Lakeside Yachts, the D3 edge), dd12/L4/playtest.yml, playtest_exit.yml.
# Quest logic: source/quests/m20.yml, m24.yml, q-d25.yml.
#   python3 tests/playthrough/xeen/run.py 57
id: xeen.playthrough.57_lost_souls
title: "Xeen playthrough 57: Megan's key; the Dungeon of Lost Souls' five gates and the Songbird"
world: xeen
mode: faithful
tags: [xeen, playthrough]
steps:
  - load_game: {path: output/playthrough/xeen/checkpoints/55_southern_tower.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d1.odm}
  - assert: {qbit_set: [111382]}
  - assert: {qbit_clear: [111400, 111480, 111481]}
  - play_lua: {source: "log('57 start: ' .. classes() .. '; experience ' .. experience(0) .. '; gold ' .. gold() .. '; Energy Disks ' .. item_count(12334))"}
  # The packs are full of loot again (the Songbird would stay on the cursor, and the next reward put on the cursor
  # replaces it): the party drops what it will not use, keeping quest items, gems, potions and boosts.
  - play_lua:
      source: |
        local function keep(id)
          return id >= 12000 or (id >= 177 and id <= 186) or (id >= 220 and id <= 299)
            or (id >= 988 and id <= 998) or (id >= 2056 and id <= 2065)
        end
        local dropped = 0
        for entry in string.gmatch(pack_items(), "(%d+)x%d+") do
          local id = tonumber(entry)
          if not keep(id) then
            while discard(id) do dropped = dropped + 1 end
          end
        end
        log("dropped " .. dropped .. " loot items to make room")
