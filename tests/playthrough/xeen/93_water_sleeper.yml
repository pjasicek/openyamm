# Xeen playthrough, segment 93: the Water Sleeper (D7, P4), M38 The Elemental Sleepers done.
# On the Skyroads (D7) at the Earth Corner's Rest Stop (entrance:p3_return), the Fire, Air and Earth Sleepers awake
# (111760-111762). West along the south road: the South Rest Stop, the Steam Post, the south toll (event 122: the Sky
# Bandits' 10,000 gold, paid: d7.toll_paid), the Skywaymen's camp, to the Water Corner; its tip asks "What do you
# seek?": "Water" (m38.corner_water) drops the party onto P4's arrival. P4 walked: along the colonnades to the statue of
# Water and its plaque (Step Four); the Whirlpool Court's test ("Accept the test of Water?" Yes: m38.test_water, the
# three guardians rise); the guardians die (m38.test_water_passed: water_test 111767, the Veil stills); through the
# Veil to the Water Sleeper's couch on the shelf (m38.sleeper_water: awake, 111763, the award Awakened the Water Sleeper
# 415, 10,500 each); the return dais rises: "Step onto the dais and return to the Skyroads?" Yes, back to D7's
# entrance:p4_return by the Water Corner's Rest Stop. M38 done: all four sleepers awake. Ends on D7.
# Routes: devdocs/xeen/briefs/d7/L4/plan.yml (the south road), tests/scenarios/xeen/hooks_d7.yml (the south toll),
# segment 89 (the corner's tip, mirrored), devdocs/xeen/briefs/p4/L4/playtest.yml, playtest_test.yml,
# playtest_sleeper.yml. Quest logic: source/quests/m38.yml.
#   python3 tests/playthrough/xeen/run.py 93
id: xeen.playthrough.93_water_sleeper
title: "Xeen playthrough 93: the south road and its toll, the Water Corner, the test of Water, the Water Sleeper"
world: xeen
mode: faithful
tags: [xeen, playthrough]
steps:
  - load_game: {path: output/playthrough/xeen/checkpoints/91_earth_sleeper.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d7.blv}
  - assert: {party_position: {x: 27136, y: -17408, radius: 256}}
  - assert: {qbit_set: [111600, 111740, 111741, 111742, 111743, 111760, 111761, 111762]}
  - assert: {qbit_clear: [111763, 111767]}
  - play_lua: {source: "log('93 start: ' .. classes() .. '; experience ' .. experience(0) .. '; gold ' .. gold()); for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end"}
  # West along the south road: the South Rest Stop, the Steam Post, to the south toll's line.
  - walk_to: {x: 22528, y: -18432, z: 768, z_tolerance: 400, radius: 192, timeout_seconds: 120, clear_hostiles: 3000, close_dialogs: true}
  - walk_to: {x: 16384, y: -18432, z: 768, z_tolerance: 400, radius: 192, timeout_seconds: 120, clear_hostiles: 3000, close_dialogs: true}
  - walk_to: {x: 5632, y: -18432, z: 768, z_tolerance: 400, radius: 192, timeout_seconds: 120, clear_hostiles: 3000, close_dialogs: true}
  - walk_to: {x: -4096, y: -18432, z: 768, z_tolerance: 400, radius: 192, timeout_seconds: 120, clear_hostiles: 3000, close_dialogs: true}
  - walk_to: {x: -5888, y: -18432, z: 768, z_tolerance: 400, radius: 128, timeout_seconds: 120, clear_hostiles: 3000, close_dialogs: true}
  # The south toll (event 122, its line at x -6912), walked onto: the Sky Bandits ask 10,000 gold; paid ("Here you are").
  - play_lua: {source: "remember('gold', gold())"}
  - walk_to: {x: -8192, y: -18432, z: 768, z_tolerance: 400, radius: 192, timeout_seconds: 60, expect: dialog}
  - assert: {dialog: {active: true, text_contains: "Many apologies, good folks, but this is a robbery."}}
  - select_topic: {match_label: "Here you are"}
  - advance_runtime: {seconds: 0.5}
  - assert: {dialog: {active: true, text_contains: "The Sky Bandits count the gold twice and wave you on."}}
  - play_lua:
      source: |
        for _ = 1, 3 do if not close() then break end end
        if recall("gold") - gold() ~= 10000 then error("the south toll took " .. (recall("gold") - gold())) end
        if mapvar("d7_toll_south") ~= 1 then error("d7_toll_south " .. tostring(mapvar("d7_toll_south"))) end
  - assert: {actor_count: {monster_id: 11116, hostile: false, near: [-6912, -18432, 1024], min: 2, max: 2}}
  # On past the Skywaymen's camp to the Water Corner.
  - walk_to: {x: -8192, y: -18432, z: 768, z_tolerance: 400, radius: 192, timeout_seconds: 120, clear_hostiles: 3000, close_dialogs: true}
  - walk_to: {x: -16384, y: -18432, z: 768, z_tolerance: 400, radius: 192, timeout_seconds: 120, clear_hostiles: 3000, close_dialogs: true}
  - walk_to: {x: -24576, y: -18432, z: 768, z_tolerance: 400, radius: 192, timeout_seconds: 120, clear_hostiles: 3000, close_dialogs: true}
  - walk_to: {x: -28672, y: -18944, z: 768, z_tolerance: 400, radius: 192, timeout_seconds: 120, clear_hostiles: 3000, close_dialogs: true}
  - walk_to: {x: -29978, y: -20063, z: 776, z_tolerance: 400, radius: 128, timeout_seconds: 60, clear_hostiles: 3000, close_dialogs: true}
  # The Water Corner's tip (event 39): stepped onto, the sky asks "What do you seek?"
  - movement_segment:
      input: forward
      seconds: 0.8
      actor_collision: true
      actor_ai: true
      start: {map: xeen_d7.blv, x: -29978, y: -20063, z: 776, yaw_degrees: -139, pitch: 0}
      expect_stop: {map: xeen_d7.blv, x: -29978, y: -20063, z: 776, yaw_degrees: -139, pitch: 0}
      loose_tolerance: true
      tolerance_xy: 2000
      tolerance_z: 400
  - advance_runtime: {seconds: 0.5}
  - answer_input: {text: "Water"}
  - advance_runtime: {seconds: 2.0, follow_map_move: true}
  - play_lua:
      source: |
        wait(1)
        local s = status() or ""
        log("corner: " .. s)
        if not string.find(s, "the nothing heaves like the sea", 1, true) then error("no corner line: " .. s) end
        for _ = 1, 3 do if not close() then break end end
  - assert: {map: xeen_p4.blv}
  - setup_shortcut: {kind: immortal}
  - assert: {party_position: {x: 3968, y: 3968, radius: 160, z_min: -8, z_max: 40}}
  # P4: along the colonnades to the statue of Water and its plaque (Step Four).
  - walk_to: {x: 3240, y: 3367, z: 6, z_tolerance: 160, radius: 128, timeout_seconds: 60, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2542, y: 2759, z: 16, z_tolerance: 160, radius: 128, timeout_seconds: 60, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1844, y: 2151, z: 26, z_tolerance: 160, radius: 128, timeout_seconds: 60, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1246, y: 1630, z: 34, z_tolerance: 160, radius: 128, timeout_seconds: 60, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 756, y: 1528, z: 32, z_tolerance: 160, radius: 128, timeout_seconds: 60, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 256, y: 1300, z: 32, z_tolerance: 160, radius: 128, timeout_seconds: 60, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(20); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "Step Four: Travel to the shrine on the Cloud above Darkstone Tower."}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # On to the Whirlpool Court.
  - walk_to: {x: -244, y: 1528, z: 32, z_tolerance: 160, radius: 128, timeout_seconds: 60, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1037, y: 1003, z: 46, z_tolerance: 160, radius: 128, timeout_seconds: 60, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1646, y: 1113, z: 76, z_tolerance: 160, radius: 128, timeout_seconds: 60, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -2255, y: 1224, z: 107, z_tolerance: 160, radius: 128, timeout_seconds: 60, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -2520, y: 1664, z: 136, z_tolerance: 160, radius: 128, timeout_seconds: 60, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "clear_hostiles(3000); if qbit(111767) then error('water_test set before the test') end"}
  # The test's plate: "Accept the test of Water?" Yes; the three guardians rise and die.
  - walk_to: {x: -2880, y: 1664, z: 132, z_tolerance: 60, radius: 48, timeout_seconds: 20, expect: dialog}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 1.5}
  - assert: {dialog: {active: true, text_contains: "You accept the test of Water."}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; if qbit(111767) then error('water_test set before the guardians die') end"}
  - assert: {actor_visible: {actor_index: 2, hidden: false}}
  - assert: {actor_visible: {actor_index: 3, hidden: false}}
  - assert: {actor_visible: {actor_index: 4, hidden: false}}
  # The party fights its way on towards the way through; the last guardian's fall stops it with its line.
  - walk_to: {x: -3300, y: 1000, z: 128, z_tolerance: 160, radius: 128, timeout_seconds: 60, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true, text_contains: "The last guardian falls back into the pit."}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; if not qbit(111767) then error('water_test 111767 not set after the guardians died') end"}
  - advance_runtime: {seconds: 2}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Through the stilled Veil to the Water Sleeper's shelf.
  - walk_to: {x: -3300, y: 1000, z: 128, z_tolerance: 160, radius: 128, timeout_seconds: 60, close_dialogs: true}
  - walk_to: {x: -4096, y: 185, z: 128, z_tolerance: 160, radius: 128, timeout_seconds: 60, close_dialogs: true}
  - walk_to: {x: -4096, y: -934, z: 148, z_tolerance: 160, radius: 128, timeout_seconds: 60, close_dialogs: true}
  - walk_to: {x: -4096, y: -2675, z: 192, z_tolerance: 160, radius: 128, timeout_seconds: 90, close_dialogs: true}
  - walk_to: {x: -3796, y: -3724, z: 192, z_tolerance: 160, radius: 128, timeout_seconds: 60, close_dialogs: true}
  - walk_to: {x: -4480, y: -4188, z: 200, z_tolerance: 160, radius: 96, timeout_seconds: 60, close_dialogs: true}
  # The Water Sleeper (event 21): awake, the Grunfeld field active (m38.sleeper_water's second state).
  - play_lua: {source: "clear_hostiles(3000); remember('xp', experience(0)); remember('xp3', experience(3)); remember('gold', gold()); click(21); wait(0.5)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[Water Sleeper: I am awake and my confidence is at 100%. Grunfeld field generator is active]], 1, true) then error("status line: " .. s) end
  - play_lua:
      source: |
        for _ = 1, 3 do if not close() then break end end
        for _ = 1, 3 do if held() ~= 0 then stow() end end
        local xp, xp3 = experience(0) - recall("xp"), experience(3) - recall("xp3")
        if xp ~= 10500 or xp3 ~= 10500 then error("the Water Sleeper paid " .. xp .. " / " .. xp3 .. " experience, not 10,500 each") end
        if gold() ~= recall("gold") then error("the Water Sleeper paid gold " .. (gold() - recall("gold"))) end
  - assert: {qbit_set: [111763]}
  - assert: {award_acquired: [{id: 415, member_index: 0}, {id: 415, member_index: 3}]}
  # Asked again, he only repeats it (no second payment).
  - play_lua: {source: "remember('xp', experience(0)); click(21); wait(0.5)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[Grunfeld field generator is active and reports 100% confidence.]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; if experience(0) ~= recall('xp') then error('the Water Sleeper paid twice') end"}
  # The return dais rises (evt:dais_show): "Step onto the dais and return to the Skyroads?" Yes, to D7.
  - advance_runtime: {seconds: 2.5}
  - assert: {sprite_shown: [1]}
  - walk_to: {x: -4700, y: -3900, z: 200, z_tolerance: 160, radius: 128, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(4); wait(0.5)"}
  # F16: the standard entrance window.
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 2.0, follow_map_move: true}
  - assert: {map: xeen_d7.blv}
  - assert: {party_position: {x: -27456, y: -17728, radius: 256}}
  - play_lua: {source: "wait(1); for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end"}
  - assert: {qbit_set: [111740, 111741, 111742, 111743, 111760, 111761, 111762, 111763, 111764, 111765, 111766, 111767]}
  - play_lua:
      source: |
        if not has_item(12366) then error("no Scepter (12366) at the end") end
        if not has_item(12365) then error("no Cube of Power (12365) at the end") end
        log("93 done (M38 done): " .. classes() .. "; experience " .. experience(0) .. "; gold " .. gold())
  - save_game: {name: "93 The Water Sleeper", path: output/playthrough/xeen/checkpoints/93_water_sleeper.oysav}
