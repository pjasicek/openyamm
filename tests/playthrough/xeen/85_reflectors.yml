# Xeen playthrough, segment 85: the Pharaoh's checklist and the four Reflectors (X4, X7, X1, D1, D6, D5, DD-15, X6, X5),
# M36 The Destiny of Xeen and M37 The Reflectors.
# On X4 outside Castle Burlock with the Cube of Power (12365) and the Scepter (12366). East off X4's edge to Mount
# Firestone (X7), south off X7's edge to Vertigo Meadows (X1); X1's travel pyramid on the knoll (event 103, m7.sigil) to
# D1 by Castleview; up D1's north road off the edge into the Forbidden Zone (D6), east over the border pass off D6's edge
# to the Desert of Doom (D5); the Great Pyramid's green doors into DD-15, walked as segment 73: the entrance hall, the
# atrium, the stair door, the Pharaoh's lift up, the antechamber, the throne hall. The Dragon Pharaoh: The destiny of
# Xeen (m36.started 111720, the checklist autonote 4136, 4,000 each), The sleepers (the corners autonote 4137); down by
# the lift and out by the green doors. West off D5's edge to D6, down the mountain road off D6's south edge to D1, D1's
# pyramid back to X1. The four Reflectors (8,000 each, once; a click since D-144): X1's Water Reflector on the
# south-east rim (m37.water 111743); north off X1's edge to X7, the Fire Reflector on the north-east rim spit
# (m37.fire 111741); west off X7's edge to X4, west off X4's edge to the Desert of the Sphinx (X6), the Air Reflector on
# the north-west rock spit (m37.air 111740); south off X6's edge to Winterkill Tundra (X5), the Earth Reflector on its
# spur at the glacier's lip (m37.earth 111742). Ends on X5.
# M38 (the sleepers) follows in segments 87-93, M39 in 95. Current Quests (A3 s38): `journal:` steps (README).
# Routes: segments 69 and 73 (DD-15), 61 and 79 (D1, D6, the pyramids), tests/scenarios/xeen/x7_edges.yml and
# data_tables/edge_spans.yml (the X edges and their arrivals), devdocs/xeen/briefs/<map>/L4/sketch.yml (the Reflectors).
# Quest logic: source/quests/m36.yml, m37.yml.
#   python3 tests/playthrough/xeen/run.py 85
id: xeen.playthrough.85_reflectors
title: "Xeen playthrough 85: the Dragon Pharaoh's checklist, the four Reflectors at Cloudside's corners"
world: xeen
mode: faithful
tags: [xeen, playthrough]
steps:
  - load_game: {path: output/playthrough/xeen/checkpoints/83_castle_xeen.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_x4.odm}
  - assert: {qbit_set: [111662, 111707, 111708, 111600, 111563]}
  - assert: {qbit_clear: [111720, 111740, 111741, 111742, 111743]}
  # A3 s38: Current Quests before the Pharaoh: M33's and M35's lines are up, the checklist's are not
  - journal: {shown: [111662], gone: [111707], unstarted: [111720, 111740, 111760]}
  - assert: {autonote: {id: 4136, present: false}}
  - assert: {autonote: {id: 4137, present: false}}
  - play_lua: {source: "log('85 start: ' .. classes() .. '; experience ' .. experience(0) .. '; gold ' .. gold()); for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end; if not has_item(12365) then error('no Cube of Power (12365)') end; if not has_item(12366) then error('no Scepter (12366)') end"}
