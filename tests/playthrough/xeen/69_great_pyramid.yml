  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Access denied!"}}
  - play_lua: {source: "close(); if door_state(22) ~= 'closed' then error('the stair door is not shut') end"}
  - walk_to: {x: 0, y: -2816, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1800, y: -2816, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2816, y: -2816, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2816, y: -3450, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "clear_hostiles(1200); status(); click(77); wait(0.5)"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "The fourth torch catches"}}
  - play_lua: {source: "close(); clear_hostiles(2500); wait(3); if not qbit(117564) or not qbit(111561) then error('torch_se or m28.torches not set') end; if door_state(22) ~= 'open' then error('the stair door did not open: ' .. door_state(22)) end"}
  - walk_to: {x: 2816, y: -2816, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1000, y: -2816, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1024, y: -2900, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  # L1 to L2: through the stair door, up the grand stair.
  - walk_to: {x: -1024, y: -3550, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1696, y: -4790, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1696, y: -3560, z: 768, z_tolerance: 120, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -640, y: -3500, z: 768, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -640, y: -2900, z: 768, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  # The processional to the registry: the plaque, then 1701.
  - walk_to: {x: -896, y: -2300, z: 768, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -896, y: 0, z: 768, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -896, y: 2400, z: 768, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1350, y: 3200, z: 768, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "clear_hostiles(2500); close(); click(57); wait(0.5)"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "NCC-1701"}}
  - play_lua: {source: "close(); click(55); wait(0.5)"}
  - answer_input: {text: "1701"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "smug tune"}}
  - play_lua: {source: "close(); wait(8); if not qbit(111562) then error('m28 registry 111562 not set') end; if door_state(18) ~= 'open' then error('the registry door did not open: ' .. door_state(18)) end"}
  # Up the registry stair to the pad hall: m28.maze.
  - walk_to: {x: -1900, y: 3200, z: 768, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -2720, y: 3580, z: 768, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -2720, y: 1560, z: 1536, z_tolerance: 120, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -2000, y: 1472, z: 1536, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1300, y: 1472, z: 1536, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -960, y: 1500, z: 1536, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -960, y: 900, z: 1536, radius: 64, timeout_seconds: 20, expect: dialog}
  - assert: {dialog: {active: true, text_contains: "Every pad in this hall"}}
  - play_lua: {source: "close(); if not qbit(117576) then error('maze_arrived 117576 not set') end; clear_hostiles(3000)"}
  # L3: the eye pad to the eye cell, the Overseer's lost map of the pads; its pad back to the landing.
  - walk_to: {x: 2432, y: -512, z: 1536, via: [[128, -250, 1536], [128, -640, 1536]], radius: 40, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - assert: {party_position: {x: 2432, y: -512, radius: 250, z_min: 1528, z_max: 1550}}
  - play_lua: {source: "clear_hostiles(1500); close(); click(51); wait(0.5)"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "The bird, then the second bird."}}
  - play_lua: {source: "close()"}
  - walk_to: {x: -960, y: 640, z: 1536, via: [[2944, -1024, 1536]], radius: 40, timeout_seconds: 30, close_dialogs: true}
  # The bird to its cell, the second bird to the far cell.
  - walk_to: {x: -128, y: -1920, z: 1536, via: [[-300, 640, 1536], [128, 640, 1536]], radius: 40, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - assert: {party_position: {x: -128, y: -1920, radius: 250, z_min: 1528, z_max: 1550}}
  - play_lua: {source: "clear_hostiles(1500); close()"}
  - walk_to: {x: 1280, y: -1920, z: 1536, via: [[-128, -2432, 1536]], radius: 40, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - assert: {party_position: {x: 1280, y: -1920, radius: 250, z_min: 1528, z_max: 1550}}
  - play_lua: {source: "clear_hostiles(1500); close()"}
  # The far cell's door and the apex stair to L4.
  - walk_to: {x: 1880, y: -2432, z: 1536, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "open_door(18, 3)"}
  - walk_to: {x: 2400, y: -2432, z: 1536, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 2880, y: -2630, z: 1536, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 2880, y: -1680, z: 2304, z_tolerance: 120, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2624, y: -1250, z: 2304, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2624, y: -700, z: 2304, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 1500}
  - walk_to: {x: 2350, y: -1024, z: 2304, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "open_door(17, 2)"}
  - walk_to: {x: 1700, y: -1024, z: 2304, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  # The book on its stand: the Prime Directive.
  - play_lua: {source: "click(7); wait(0.5)"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Prime Directive: Obey the Ancients."}}
  - play_lua: {source: "close(); if not qbit(111565) then error('m28.directive_read 111565 not set') end"}
  # The great doors and the throne hall (the audience, 117577); the Pharaoh: The orb.
  - walk_to: {x: 448, y: -950, z: 2304, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "if qbit(117577) then error('throne_reached set too early') end; open_door(30, 24)"}
  - walk_to: {x: 448, y: -300, z: 2304, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "wait(0.5); if not qbit(117577) then error('throne_reached 117577 not set') end"}
  - walk_to: {x: -384, y: 1300, z: 2304, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "remember('xp', experience(0)); if not has_item(12331) then error('no orb (12331)') end"}
  - interact_actor: {actor_index: 49}
  - advance_runtime: {seconds: 0.6, present_dialogs: true}
  - assert: {dialog: {active: true, source_id: 5453}}
  - select_topic: {match_label: "The orb"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Alamar is not a king. He is Sheltem"}}
  - play_lua:
      source: |
        close(); close()
        if has_item(12331) then error("the Pharaoh did not take his orb") end
        if experience(0) - recall("xp") ~= 15000 then error("M28 paid " .. (experience(0) - recall("xp"))) end
  - assert: {qbit_set: [111563, 111564, 111580]}
  # Back to the antechamber; the Pharaoh's lift (it answers his guests now) down to the grand stair.
  - walk_to: {x: 448, y: -300, z: 2304, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 448, y: -1100, z: 2304, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 256, y: -3000, z: 2304, radius: 64, timeout_seconds: 20, close_dialogs: true}
