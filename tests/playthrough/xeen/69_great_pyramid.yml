# Xeen playthrough, segment 69: the Great Pyramid (D1, D2, D3, D4, D5, DD-15), M28 The Dragon Pharaoh done.
# From Castle Kalindra's gate on D1 east off D1's edge to D2, east off D2's edge to Sandcaster (D3), north off D3's edge
# to Lakeside (D4) and west off D4's edge along the desert road to the Desert of Doom (D5): the edges a player walks
# (5 days each), no mirror. D5: the Great Pyramid's green doors with the Queen's key (12348): m28.door (111560, the
# autonote 4128), and the door takes the party in to DD-15's entrance:d5_door (A6's D5 of 05:53). DD-15 walked along A8's
# critical path: the welcome statue; the four torches (the north-east chapel through Information and its plaque, the
# north-west through Reception, the south-west by the west gallery, the stair door's "Access denied!" after three, the
# south-east: m28.torches 111561, the stair door opens); up the grand stair, the processional; the registry's plaque
# (NCC-1701), the lock: 1701 (111562); up the registry stair to the pad hall (m28.maze); the eye pad to the Overseer's
# lost map ("The bird, then the second bird."), its pad back, the bird, the second bird to the far cell; the apex stair;
# the Prime Directive (111565); the great doors and the throne hall (117577); the Dragon Pharaoh: The orb (Zelda's orb
# 12331 taken, M28 done 111563, lava_cooled 111564, m29.started 111580, 15,000 experience each); back to the
# antechamber, the Pharaoh's lift called up and down to the grand stair; out through the atrium and the entrance hall
# by the green doors to D5 (entrance:dd15_door). The optional niches, the safe and the Brew are left alone.
# Routes: segment 67 (the D1-D2-D3 edges, D3's north edge), devdocs/xeen/briefs/dd15/L4/playtest.yml (A8's path).
# Quest logic: source/quests/m28.yml.
#   python3 tests/playthrough/xeen/run.py 69
id: xeen.playthrough.69_great_pyramid
title: "Xeen playthrough 69: the desert road to the Great Pyramid, its torches, registry and pads, the Dragon Pharaoh's orb"
world: xeen
mode: faithful
tags: [xeen, playthrough]
steps:
  - load_game: {path: output/playthrough/xeen/checkpoints/67_queens_crown.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d1.odm}
  - assert: {qbit_set: [111542]}
  - assert: {qbit_clear: [111560, 111563]}
  - play_lua: {source: "log('69 start: ' .. classes() .. '; experience ' .. experience(0) .. '; gold ' .. gold() .. '; orb ' .. item_count(12331) .. '; key ' .. item_count(12348)); for _ = 1, 3 do if not close() then break end end"}
  # East off D1's edge to D2, east off D2's edge to D3, north off D3's edge to Lakeside (D4).
  - set_pose: {map: xeen_d1.odm, x: 21504, y: 2048, z: 1088, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 24064, y: 2048, z: 1088, z_tolerance: 600, radius: 128, timeout_seconds: 60, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d2.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - set_pose: {map: xeen_d2.odm, x: 29696, y: 10240, z: 1408, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 32512, y: 10240, z: 1376, z_tolerance: 600, radius: 128, timeout_seconds: 60, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d3.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # The Temple of the Desert Sun (house 4605) up Sandcaster's street, the first temple after Sprite Forest (D2), whose
  # Gorgon and Medusa Sprites can leave a member Petrified (A3 sessions 30-32): it heals whoever is down (D-82).
  - set_pose: {map: xeen_d3.odm, x: -16916, y: 19072, z: 1504, yaw: 3.1416, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - heal_at_temple: {house: 4605, min: 0}
  - set_pose: {map: xeen_d3.odm, x: 12288, y: 20480, z: 1760, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 12288, y: 32512, z: 1760, z_tolerance: 900, radius: 128, timeout_seconds: 150, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d4.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # West off D4's edge on the desert road (y 80) to the Desert of Doom (D5's entrance:d4_road).
  - set_pose: {map: xeen_d4.odm, x: -30208, y: -8192, z: 1504, yaw: 3.1416, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: -32512, y: -8192, z: 1504, z_tolerance: 900, radius: 128, timeout_seconds: 90, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d5.odm}
  - assert: {party_position: {x: 20992, y: -8192, radius: 300}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # The Great Pyramid's green doors (D5 event 1): the key (12348) passes m28.door (111560) and the door moves the party in.
  - set_pose: {map: xeen_d5.odm, x: 0, y: -7168, z: 1248, yaw: -1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - play_lua: {source: "status(); if not has_item(12348) then error('no key to the Great Pyramid (12348)') end; click(1)"}
  # F16: the standard entrance window.
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_dd15.blv}
  - assert: {party_position: {x: 0, y: 4736, radius: 48, z_min: -8, z_max: 8}}
  - advance_runtime: {seconds: 2.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Welcome to the Royal Pyramid!"}}
  - play_lua: {source: "close(); if not qbit(117560) then error('arrived_once 117560 not set') end"}
  # L1: the four torches.
  # The north-east torch: Information, the chapel, the plaque, the lever.
  - walk_to: {x: 900, y: 3200, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "open_door(24, 13)"}
  - walk_to: {x: 1800, y: 3200, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - walk_to: {x: 3840, y: 3250, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "open_door(20, 5)"}
  - walk_to: {x: 3840, y: 4000, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 3840, y: 4850, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(76); wait(0.5)"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Light all four"}}
  - play_lua: {source: "close(); status(); click(72); wait(0.5); local s = status(); if not string.find(s, 'The torch flares up.', 1, true) then error('status: ' .. s) end; if not qbit(117561) then error('torch_ne not set') end; clear_hostiles(2500)"}
  # The north-west torch: back through Information and the entrance hall, Reception, the chapel.
  - walk_to: {x: 3840, y: 4000, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 3840, y: 3250, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1800, y: 3200, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "open_door(24, 13)"}
  - walk_to: {x: 900, y: 3200, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -900, y: 3200, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "open_door(27, 17)"}
  - walk_to: {x: -1800, y: 3200, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - walk_to: {x: -3840, y: 3250, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "open_door(21, 7)"}
  - walk_to: {x: -3840, y: 4000, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -3840, y: 4850, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "status(); click(74); wait(0.5); local s = status(); if not string.find(s, 'The torch flares up.', 1, true) then error('status: ' .. s) end; if not qbit(117562) then error('torch_nw not set') end; clear_hostiles(2500); close()"}
  # The south-west torch: Reception's south arch, the west gallery, the chapel.
  - walk_to: {x: -3840, y: 4000, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -3840, y: 3250, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -2816, y: 1600, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -2816, y: 0, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -2816, y: -2000, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -2816, y: -3450, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "clear_hostiles(1200); status(); click(81); wait(0.5); local s = status(); if not string.find(s, 'The torch flares up.', 1, true) then error('status: ' .. s) end; if not qbit(117563) then error('torch_sw not set') end; clear_hostiles(2500); close()"}
  # The south gallery: the stair door still refuses after three; the south-east torch.
  - walk_to: {x: -2816, y: -2816, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1700, y: -2816, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
