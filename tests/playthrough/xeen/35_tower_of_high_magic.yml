# Xeen playthrough, segment 35: the Tower of High Magic (X5, X3, XD-11), M13's key. East along the lagoon road and
# over X5's edge into Lifeforce Lagoon; the tower's door on its islet opens to the Enchanted Key (m13.tower_door); the
# tower walked: the brews on each floor, the lift's gate levers, the steam valve that thaws the west stair's door, the
# Head Sorceress and her Librarian's Key, the quarters' chest, the Librarian's door, the library, the cabinet of
# Mysteries of Light, the Archmage's chest (m13.skeleton_key: the Skeleton Key), the observatory's box, the roof, the
# cages down to the ground floor and out by the enchanted door.
# Routes: devdocs/xeen/briefs/x5/L4/playtest.yml (the east edge), xd11/L4/playtest.yml, playtest_in.yml,
# playtest_exit_x3.yml. Quest logic: source/quests/m13.yml.
#   python3 tests/playthrough/xeen/run.py 35
id: xeen.playthrough.35_tower_of_high_magic
title: "Xeen playthrough 35: the Tower of High Magic: the Skeleton Key"
world: xeen
mode: faithful
tags: [xeen, playthrough]
steps:
  - load_game: {path: output/playthrough/xeen/checkpoints/33_cave_of_illusion.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_x5.odm}
  - assert: {qbit_set: [111240]}
  - assert: {qbit_clear: [111260]}
  # The packs fill with loot: the party drops what it will not use (keeps quest items, gems and potions).
  - play_lua:
      source: |
        local dropped = 0
        for entry in string.gmatch(pack_items(), "(%d+)x%d+") do
          local id = tonumber(entry)
          if id < 12000 and not (id >= 177 and id <= 186) and id ~= 240 then
            while discard(id) do dropped = dropped + 1 end
          end
        end
        log("dropped " .. dropped .. " loot items to make room")
  # East along the lagoon road to X5's edge: the travel prompt names Lifeforce Lagoon.
  - set_pose: {map: xeen_x5.odm, x: 21504, y: 2560, z: 896, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 24576, y: 2560, z: 864, z_tolerance: 600, radius: 128, timeout_seconds: 60, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_x3.odm}
  - play_lua: {source: "close()"}
  # The Tower of High Magic's door on its islet in the lagoon (X3): the Enchanted Key opens it (m13.tower_door).
  - set_pose: {map: xeen_x3.odm, x: 256, y: -1874, z: 992, yaw: -1.5708, pitch: 0.0}
  - clear_hostiles: {radius: 3000}
  - advance_runtime: {seconds: 0.5}
  - press_interact: {expect: {kind: event_target}}
  # F16: the standard entrance window.
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_xd11.blv}
  - assert: {party_position: {x: -1408, y: -1792, radius: 64, z_min: -8, z_max: 8}}
  - advance_runtime: {seconds: 3, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "THE TOWER OF HIGH MAGIC"}}
  - play_lua: {source: "close()"}
  # The foyer, the door to the athanor, the Fire Brew.
  - walk_to: {x: -1408, y: -1100, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1088, y: 750, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - play_lua: {source: "open_door(15, 6)"}
  - walk_to: {x: -1088, y: 1260, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 640, y: 1260, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - walk_to: {x: 768, y: 1460, z: 0, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "status(); click(8); wait(1)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[+5 Fire resistance]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "close()"}
  # The lightning coils: the Electric Brew.
  - walk_to: {x: 640, y: 1150, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 640, y: 760, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: 270, y: 330, z: 0, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(6); wait(1)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[+5 Air resistance]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "close()"}
  # The foot of the lift shaft: the cage hangs above and refuses before its gate is unbolted.
  - walk_to: {x: 640, y: 0, z: 0, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "open_door(12, 4)"}
  - walk_to: {x: 640, y: -420, z: 0, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        status()
        click(26); wait(1)
        local seen = status()
        if not string.find(seen, "will not come down", 1, true) then error("the call button said nothing: " .. seen) end
        if door_state(1) ~= "open" then error("lift 0-1 moved before its gate: " .. door_state(1)) end
  # Up the east stair to the east landing: gate 1 is bolted until its lever.
  - walk_to: {x: 640, y: 0, z: 0, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1150, y: 704, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1792, y: 560, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1792, y: -1600, z: 640, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1600, y: -1760, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1100, y: -1760, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: 760, y: -1150, z: 640, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        status()
        click(17); wait(1)
        local seen = status()
        if not string.find(seen, "bolted", 1, true) then error("the bolted gate said nothing: " .. seen) end
        if door_state(8) ~= "closed" then error("gate 1 opened before its lever") end
        click(18); wait(3)
        if door_state(8) ~= "open" then error("the lever did not open gate 1: " .. door_state(8)) end
  # Into the first-floor core, onto the cage: down to the ground floor and up again.
  - walk_to: {x: 640, y: -800, z: 640, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 448, y: -576, z: 640, radius: 40, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "click(25); wait(6)"}
  - assert: {party_position: {x: 448, y: -576, radius: 160, z_min: -10, z_max: 60}}
  - play_lua: {source: "click(27); wait(6)"}
  - assert: {party_position: {x: 448, y: -576, radius: 160, z_min: 600, z_max: 700}}
  - walk_to: {x: 640, y: -800, z: 640, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua:
      source: |
        status()
        click(29); wait(1)
        local seen = status()
        if not string.find(seen, "will not come down", 1, true) then error("lift 1-2's call button said nothing: " .. seen) end
  # The cold still: the Cold Brew.
  - walk_to: {x: 640, y: -1300, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 400, y: -1536, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -100, y: -1536, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: -128, y: -1790, z: 640, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(5); wait(1)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[+5 Water resistance]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "close()"}
  # The poison garden: the west stair's door is frozen shut.
  - walk_to: {x: -256, y: -800, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -256, y: -300, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: -1140, y: -320, z: 640, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(16); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "frozen shut"}}
  - play_lua:
      source: |
        close()
        if door_state(7) ~= "closed" then error("the frozen door opened before the valve") end
  # The reagent store: the steam valve thaws the door; the Pandorian Box is empty.
  - walk_to: {x: -256, y: -800, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1100, y: -1600, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "open_door(38, 13)"}
  - walk_to: {x: -1600, y: -1600, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 1500}
  - walk_to: {x: -1600, y: -1300, z: 640, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(40); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "steam valve"}}
  - play_lua:
      source: |
        close(); wait(3)
        if door_state(7) ~= "open" then error("the valve did not thaw the frozen door: " .. door_state(7)) end
  - play_lua:
      source: |
        status()
        loot_chest(37)
        local seen = status()
        if held() ~= 0 then stow() end
        close()
        if not string.find(seen, "The box is empty.", 1, true) then error("the Pandorian Box said nothing: " .. seen) end
  # The Poison Brew in the garden's north-west corner.
  - walk_to: {x: -1600, y: -1600, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1100, y: -1600, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -256, y: -800, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -256, y: -300, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1140, y: -320, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1140, y: 1100, z: 640, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(10); wait(1)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[+5 Body resistance]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "close()"}
  # Through the thawed door and up the west stair to the west landing.
  - walk_to: {x: -1140, y: -320, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1550, y: -320, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1728, y: -200, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1728, y: 1550, z: 1280, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1600, y: 1728, z: 1280, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1100, y: 1728, z: 1280, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  # The energy lab: the Energy Brew.
  - walk_to: {x: -768, y: 1500, z: 1280, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -768, y: 1000, z: 1280, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: -990, y: 160, z: 1280, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(7); wait(1)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[+5 Earth resistance]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "close()"}
  # The magic lab: the Head Sorceress dies and her corpse holds the Librarian's Key; the Magic Brew on its dais.
  - walk_to: {x: 250, y: 960, z: 1280, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "open_door(14, 5)"}
  - walk_to: {x: 700, y: 960, z: 1280, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - assert: {actor_visible: {actor_index: 0, dead: true}}
  - walk_to: {x: 1200, y: 1300, z: 1280, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - interact_actor: {actor_index: 0}
  - play_lua: {source: "wait(1); if held() ~= 0 then stow() end; close(); if not has_item(12260) then error('the Head Sorceress\\'s corpse did not hold the Librarian\\'s Key') end"}
  - walk_to: {x: 1344, y: 1540, z: 1312, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(9); wait(1)"}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[+5 Mind resistance]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "close()"}
  # The quarters: a bed, the chest, gate 2's lever, the Librarian's door.
  - walk_to: {x: 896, y: 760, z: 1280, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 896, y: 200, z: 1280, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: 1472, y: 150, z: 1280, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        status()
        click(3); wait(0.5)
        local seen = status()
        if not string.find(seen, "nothing on, in, or under the bed", 1, true) then error("the bed said nothing: " .. seen) end
  - walk_to: {x: 1820, y: 128, z: 1280, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "local g = gold(); loot_chest(36); if held() ~= 0 then stow() end; close(); log('the quarters chest: +' .. (gold() - g) .. ' gold')"}
  - walk_to: {x: 900, y: 0, z: 1280, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        click(20); wait(3)
        if door_state(9) ~= "open" then error("the lever did not open gate 2: " .. door_state(9)) end
  - walk_to: {x: 1728, y: 0, z: 1280, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        click(23); wait(3)
        if door_state(11) ~= "open" then error("the Librarian's Key did not open the door: " .. door_state(11)) end
  # Up the library stair to the top landing: gate 3's lever.
  - walk_to: {x: 1728, y: -360, z: 1280, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1792, y: -1780, z: 1920, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1600, y: -1856, z: 1920, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1100, y: -1856, z: 1920, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: 900, y: -1150, z: 1920, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        click(22); wait(3)
        if door_state(10) ~= "open" then error("the lever did not open gate 3: " .. door_state(10)) end
  # The library: The Art of Magic; the cabinet of Mysteries of Light holds the Prismatic Light spellbook.
  - walk_to: {x: 400, y: -1536, z: 1920, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -100, y: -1536, z: 1920, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: -512, y: -1260, z: 1920, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "click(2); wait(1)"}
  - assert: {dialog: {active: true, text_contains: "THE ART OF MAGIC"}}
  - play_lua: {source: "close()"}
  - walk_to: {x: -500, y: 0, z: 1920, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -704, y: 1060, z: 1920, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "loot_chest(34); if held() ~= 0 then stow() end; close(); log('the cabinet: Prismatic Light spellbook ' .. tostring(has_item(483)))"}
  # The Archmage's study: the chest gives the Skeleton Key once (A3's hook), and holds no second key.
  - walk_to: {x: -500, y: 0, z: 1920, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1000, y: -1344, z: 1920, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "open_door(24, 12)"}
  - walk_to: {x: -1500, y: -1344, z: 1920, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: -1820, y: -1100, z: 1920, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        status()
        loot_chest(39)
        if held() ~= 0 then stow() end
        close(); wait(1); close()
        if not has_item(12100) then error("the Archmage's chest did not give the Skeleton Key") end
        log("the Archmage's chest: the Skeleton Key")
        if not qbit(111260) then error("qbit 111260 not set") end
        if item_count(12100) ~= 1 then error("more than one Skeleton Key: " .. item_count(12100)) end
        loot_chest(39)
        if held() ~= 0 then stow() end
        close(); wait(1); close()
        if item_count(12100) ~= 1 then error("a second Skeleton Key: " .. item_count(12100)) end
  # The observatory's Pandorian Box (trapped).
  - walk_to: {x: -1664, y: -760, z: 1920, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1664, y: -300, z: 1920, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: -1820, y: 980, z: 1920, radius: 48, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "local g = gold(); loot_chest(35); if held() ~= 0 then stow() end; close(); log('the observatory box: +' .. (gold() - g) .. ' gold')"}
  # The Stairway to Heaven to the roof, to the foot of the cloud stair (the climb to X8 is playtest_exit.yml).
  - walk_to: {x: -1856, y: 1500, z: 1920, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1620, y: 1792, z: 1920, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
