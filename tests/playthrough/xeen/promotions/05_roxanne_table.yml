# Xeen promotion playthrough 05, the class table (README "What is checked" 5): XD-07: Princess Roxanne's Rogues (T1-E), after segment 21; walked in and out.
# Written by class_table.py (do not edit by hand): per row of Xeen.Promotions, round 1 gives the members the
# row's "from" classes and classes it must leave alone (a logged test setup through SetPlayerClass), picks the
# promote and asserts every class; round 2 has nobody eligible and the promote is not offered. The party's own
# classes are put back at the end.
#   python3 tests/playthrough/xeen/promotions/run.py 05
id: xeen.promotions.05_roxanne_table
title: "Xeen promotions 05: the class table, XD-07"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/00_main_21.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_x4.odm, qbit_set: [112061]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end"}
  # The party's own classes, kept for the end (class ids in global variables; the names remembered for the check).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}

  - assert: {map: xeen_x4.odm}
  - set_pose: {map: xeen_x4.odm, x: -1024, y: 6707, z: 1760, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - press_interact: {expect: {kind: event_target}}
  # F16: the standard entrance window.
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_xd07.blv}
  - advance_runtime: {seconds: 3, present_dialogs: true}
  - play_lua: {source: "close()"}
  - walk_to: {x: 0, y: 700, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(40); wait(8); if door_state(11) ~= 'open' then error('the portcullis did not open: ' .. door_state(11)) end"}
  - walk_to: {x: 0, y: 2304, z: 0, radius: 96, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 0, y: 3300, z: 0, radius: 96, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {via: [[0, 5376, 0]], x: 1100, y: 5376, z: 0, radius: 64, plan: false, timeout_seconds: 40, close_dialogs: true}
  - play_lua: {source: "open_door(19, 5)"}
  - walk_to: {x: 2048, y: 5376, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 4300, y: 5376, z: 640, radius: 64, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 4900, y: 5376, z: 640, radius: 64, timeout_seconds: 30, close_dialogs: true}
  # D-82 point 5: no member down before the rounds (each reads every member's class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 05 before the class table: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before the class table (D-82 5): ' .. table.concat(down, ' | ')) end"}

  # tiara: Thief -> Rogue. Princess Roxanne (T1-E): "Promotion".
  # Round 1: Thief Rogue Peasant Knight -> Rogue Rogue Peasant Knight.
  - lua_event: {source: "if not SetPlayerClass(0, 'Thief') then error('SetPlayerClass(0, Thief)') end if not SetPlayerClass(1, 'Rogue') then error('SetPlayerClass(1, Rogue)') end if not SetPlayerClass(2, 'Peasant') then error('SetPlayerClass(2, Peasant)') end if not SetPlayerClass(3, 'Knight') then error('SetPlayerClass(3, Knight)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES tiara round 1 set: " .. c) if c ~= "Thief Rogue Peasant Knight" then error("expected Thief Rogue Peasant Knight, got " .. c) end'}
  - play_lua: {source: "click(42); wait(1)"}
  - assert: {dialog: {active: true, source_id: 4404, action_label_present: "Promotion"}}
  - select_topic: {match_label: "Promotion"}
  - assert: {dialog: {active: true, text_contains: "Rise, Rogue."}}
  - play_lua: {source: 'local c = classes() log("CLASSES tiara round 1 promoted: " .. c) if c ~= "Rogue Rogue Peasant Knight" then error("expected Rogue Rogue Peasant Knight, got " .. c) end'}
  # Nobody left: the promote is no longer offered.
  - assert: {dialog: {active: true, action_label_absent: "Promotion"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Round 2: Rogue Peasant Knight Sorcerer, none of them eligible: the promote is not offered.
  - lua_event: {source: "if not SetPlayerClass(0, 'Rogue') then error('SetPlayerClass(0, Rogue)') end if not SetPlayerClass(1, 'Peasant') then error('SetPlayerClass(1, Peasant)') end if not SetPlayerClass(2, 'Knight') then error('SetPlayerClass(2, Knight)') end if not SetPlayerClass(3, 'Sorcerer') then error('SetPlayerClass(3, Sorcerer)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES tiara round 2 set: " .. c) if c ~= "Rogue Peasant Knight Sorcerer" then error("expected Rogue Peasant Knight Sorcerer, got " .. c) end'}
  - play_lua: {source: "click(42); wait(1)"}
  - assert: {dialog: {active: true, source_id: 4404, action_label_absent: "Promotion"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - play_lua: {source: 'local c = classes() log("CLASSES tiara round 2 kept: " .. c) if c ~= "Rogue Peasant Knight Sorcerer" then error("expected Rogue Peasant Knight Sorcerer, got " .. c) end'}

  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - walk_to: {x: 4300, y: 5376, z: 640, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 2048, y: 5376, z: 0, radius: 64, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 1100, y: 5376, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 0, y: 3300, z: 0, radius: 96, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 0, y: 700, z: 0, radius: 64, timeout_seconds: 60, close_dialogs: true}
  - walk_to: {x: 0, y: 300, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - execute_event: {id: 8}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_x4.odm}
  - save_game: {name: "P05 class table", path: output/playthrough/xeen/promotions/checkpoints/05_roxanne_table.oysav}
