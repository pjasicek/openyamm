# Xeen promotion playthrough 01, the class table (README "What is checked" 5): X1: Old Valia's Crusaders (T1-A), after the main chain's segment 09.
# Written by class_table.py (do not edit by hand): per row of Xeen.Promotions, round 1 gives the members the
# row's "from" classes and classes it must leave alone (a logged test setup through SetPlayerClass), picks the
# promote and asserts every class; round 2 has nobody eligible and the promote is not offered. The party's own
# classes are put back at the end.
#   python3 tests/playthrough/xeen/promotions/run.py 01
id: xeen.promotions.01_valia_table
title: "Xeen promotions 01: the class table, X1"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/00_main_09.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_x1.odm, qbit_set: [110047]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end"}
  # The party's own classes, kept for the end (class ids in global variables; the names remembered for the check).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}

  # D-82 point 5: no member down before the rounds (each reads every member's class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 01 before the class table: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before the class table (D-82 5): ' .. table.concat(down, ' | ')) end"}

  # crusade: Knight -> Cavalier, Paladin -> Crusader, Ranger -> Hunter. Old Valia (T1-A): "Promotion".
  # Round 1: Knight Paladin Ranger Cavalier -> Cavalier Crusader Hunter Cavalier.
  - lua_event: {source: "if not SetPlayerClass(0, 'Knight') then error('SetPlayerClass(0, Knight)') end if not SetPlayerClass(1, 'Paladin') then error('SetPlayerClass(1, Paladin)') end if not SetPlayerClass(2, 'Ranger') then error('SetPlayerClass(2, Ranger)') end if not SetPlayerClass(3, 'Cavalier') then error('SetPlayerClass(3, Cavalier)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES crusade round 1 set: " .. c) if c ~= "Knight Paladin Ranger Cavalier" then error("expected Knight Paladin Ranger Cavalier, got " .. c) end'}
  - set_pose: {map: xeen_x1.odm, x: 7552, y: -4332, z: 625, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - press_interact: {expect: {kind: event_target}}
  - assert: {dialog: {active: true, source_id: 4044, action_label_present: "Promotion"}}
  - select_topic: {match_label: "Promotion"}
  - assert: {dialog: {active: true, text_contains: "Kneel, then. Knights rise as Cavaliers"}}
  - play_lua: {source: 'local c = classes() log("CLASSES crusade round 1 promoted: " .. c) if c ~= "Cavalier Crusader Hunter Cavalier" then error("expected Cavalier Crusader Hunter Cavalier, got " .. c) end'}
  # Nobody left: the promote is no longer offered.
  - assert: {dialog: {active: true, action_label_absent: "Promotion"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Round 2: Cavalier Crusader Hunter Peasant, none of them eligible: the promote is not offered.
  - lua_event: {source: "if not SetPlayerClass(0, 'Cavalier') then error('SetPlayerClass(0, Cavalier)') end if not SetPlayerClass(1, 'Crusader') then error('SetPlayerClass(1, Crusader)') end if not SetPlayerClass(2, 'Hunter') then error('SetPlayerClass(2, Hunter)') end if not SetPlayerClass(3, 'Peasant') then error('SetPlayerClass(3, Peasant)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES crusade round 2 set: " .. c) if c ~= "Cavalier Crusader Hunter Peasant" then error("expected Cavalier Crusader Hunter Peasant, got " .. c) end'}
  - set_pose: {map: xeen_x1.odm, x: 7552, y: -4332, z: 625, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - press_interact: {expect: {kind: event_target}}
  - assert: {dialog: {active: true, source_id: 4044, action_label_absent: "Promotion"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - play_lua: {source: 'local c = classes() log("CLASSES crusade round 2 kept: " .. c) if c ~= "Cavalier Crusader Hunter Peasant" then error("expected Cavalier Crusader Hunter Peasant, got " .. c) end'}

  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - save_game: {name: "P01 class table", path: output/playthrough/xeen/promotions/checkpoints/01_valia_table.oysav}
