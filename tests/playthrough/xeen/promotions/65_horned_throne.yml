# Xeen promotion playthrough 65, racial: the horned throne again (Q-D25 The Minotaur's Labyrinth, Minotaur -> Minotaur
# Lord), the walk to it for the minotaur row's class table. From a copy of the main chain's 57 (D4, Lakeside's jetty;
# Q-D25 done there by a party with no Minotaur: 3,000 each, nobody promoted, README check 3). Lakeside Yachts to the
# Isle of Lost Souls (a party that comes after 5PM camps by the jetty until six, as main 57); the ruined tower's door
# into DD-12 (Megan's key). DD-12 walked: the entrance hall, gate 1 (open since 57: clicked only if shut), the hall of
# storage to the lift head; the cage (up since 57, the Songbird freed) ridden down the shaft (event 80) to the aviary
# on L5; gate 5 (open since 57); the Soul Maze from the S back to the L (57's route reversed) and the horned throne
# (event 90). Clicked by this party, nobody a Minotaur: `q-d25.throne` (once, done) says its else line, "The horned
# throne waits. It honours Minotaurs...", and `q-d25.throne_again` (requires done + a Minotaur) is silent: no class
# changes, no experience (check 3: the later path is not offered while nobody is eligible). Ends on the throne's
# square (2464, 2048, -2560) for the minotaur row's table segment, which starts from this checkpoint.
# Quest logic: source/quests/q-d25.yml; DD-12 events/maps/xeen_dd12.lua events 24 and 90 (throne, then throne_again).
# Routes: main 57 (devdocs/xeen/briefs/dd12/L4/playtest.yml). Prep: prep/F_racial.md.
#   python3 tests/playthrough/xeen/promotions/run.py 65
id: xeen.promotions.65_horned_throne
title: "Xeen promotions 65: the horned throne again (Q-D25), nobody a Minotaur"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/00_main_57.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d4.odm}
  - assert: {qbit_set: [113500, 111480, 117441, 117442, 117443, 117444, 117445]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end; if classes() ~= 'Cavalier Crusader Wizard RangerLord' then error('party: ' .. classes()) end"}
  # Lakeside Yachts (house 4655, route 420, daily 6AM to 6PM); after 5PM the party camps by the jetty until six.
  - lua_event:
      source: |
        local day = CurrentGameMinutes() % 1440
        if day < 360 or day >= 1020 then
            AdvanceGameMinutes((360 - day) % 1440)
            RestAndHealParty()
            evt.StatusText("CAMP until 6AM by Lakeside's jetty")
        end
  - play_lua: {source: "local s = status(); if string.find(s, 'CAMP until', 1, true) then log('CAMP: the yachts were shut; rested until 6AM') end"}
  - set_pose: {map: xeen_d4.odm, x: 4096, y: -9732, z: 1120, yaw: -1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - press_interact: {expect: {kind: event_target}}
  - assert:
      dialog: {active: true, house_dialog: false, source_id: 5305}
  - select_topic: {match_label: "1 day to the Isle of Lost Souls for 250 gold"}
  - advance_runtime: {seconds: 2.0, follow_map_move: true}
  - assert: {map: xeen_d4.odm}
  - assert: {party_position: {x: 4096, y: -4096, radius: 300}}
  - advance_runtime: {seconds: 0.5}
  - assert: {dialog: {active: false}}
  # Up the Isle's path to the ruined tower; its door into DD-12.
  - walk_to: {x: 4095, y: -2963, z: 1376, z_tolerance: 700, radius: 160, timeout_seconds: 60, clear_hostiles: 3000, close_dialogs: true}
  - set_pose: {map: xeen_d4.odm, x: 4095, y: -2843, z: 1376, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - press_interact: {expect: {kind: event_target}}
  # F16: the standard entrance window.
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_dd12.blv}
  - assert: {party_position: {x: 0, y: -352, radius: 160}}
  - advance_runtime: {seconds: 2, present_dialogs: true}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Gate 1 (event 37): answered in 57; a click only toggles its leaves, so it is clicked only if they are shut.
  - walk_to: {x: 0, y: 300, z: 0, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "log('gate 1: ' .. door_state(6) .. ' ' .. door_state(7)); if door_state(6) ~= 'open' then click(37); wait(3) end; if door_state(6) ~= 'open' or door_state(7) ~= 'open' then error('gate 1 is shut: ' .. door_state(6) .. ' ' .. door_state(7)) end"}
  # The hall of storage west to the lift head; the cage stands at the top (ridden up in 57).
  - walk_to: {x: 0, y: 780, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 2500, close_dialogs: true}
  - walk_to: {x: -1900, y: 780, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - walk_to: {x: -2320, y: 800, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "log('cage: ' .. door_state(1)); if door_state(1) ~= 'open' then status(); click(18); wait(8) end; if door_state(1) ~= 'open' then error('the cage is not at the top: ' .. door_state(1)) end"}
  - walk_to: {x: -2304, y: 1312, z: 0, radius: 48, timeout_seconds: 20, close_dialogs: true}
  # Down the shaft (event 80, the button in reach of a rider on the raised cage) to the aviary.
  - play_lua: {source: "status(); click(80); wait(9); local s = status(); log('ride down: ' .. s); if door_state(1) ~= 'closed' then error('the cage did not sink: ' .. door_state(1)) end"}
  - assert: {party_position: {x: -2304, y: 1312, radius: 200, z_min: -2600, z_max: -2500}}
  # The aviary, gate 5 (open since 57), and the Soul Maze from the S to the L (57's way out, reversed).
  - walk_to: {x: -2304, y: 1700, z: -2560, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -2100, y: 2112, z: -2560, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "log('gate 5: ' .. door_state(14)); if door_state(14) ~= 'open' then click(49); wait(3) end; if door_state(14) ~= 'open' then error('gate 5 is shut: ' .. door_state(14)) end"}
  - walk_to: {x: -1100, y: 1920, z: -2560, radius: 64, timeout_seconds: 20, clear_hostiles: 2500, close_dialogs: true}
  - walk_to: {x: -736, y: 1920, z: -2560, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -224, y: 1920, z: -2560, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -224, y: 2432, z: -2560, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -736, y: 2432, z: -2560, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -736, y: 2944, z: -2560, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 288, y: 2944, z: -2560, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 288, y: 2432, z: -2560, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 800, y: 2432, z: -2560, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 800, y: 2176, z: -2560, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1312, y: 2176, z: -2560, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1312, y: 2944, z: -2560, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2336, y: 2944, z: -2560, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 2464, y: 2048, z: -2560, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  # D-82 point 5: no member down before the horned throne (it reads every member's experience or class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 65 before the horned throne: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before the horned throne (D-82 5): ' .. table.concat(down, ' | ')) end"}
  # The horned throne (event 90): done, nobody a Minotaur: the else line, nothing else; no class or experience change.
  - play_lua: {source: "for i = 0, 3 do remember('xp' .. i, experience(i)) end; click(90); wait(0.5)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[The horned throne waits. It honours Minotaurs, and anyone else who sits gets a sore back.]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "close(); wait(0.5)"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: false}}
  - play_lua:
      source: |
        for i = 0, 3 do
          local xp = experience(i) - tonumber(recall("xp" .. i))
          if xp ~= 0 then error("member " .. i .. ": the throne paid " .. xp .. " experience") end
        end
        if classes() ~= "Cavalier Crusader Wizard RangerLord" then error("the throne changed classes: " .. classes()) end
        if not qbit(113500) then error("q-d25.done 113500 lost") end
        log("Q-D25 throne again: " .. classes() .. "; nothing paid, nobody promoted")
  - assert: {map: xeen_dd12.blv}
  - assert: {party_position: {x: 2464, y: 2048, radius: 128, z_min: -2600, z_max: -2500}}
  - save_game: {name: "P65 The horned throne", path: output/playthrough/xeen/promotions/checkpoints/65_horned_throne.oysav}
