# Xeen promotion playthrough 93, the class table (README "What is checked" 5): D1: Brother Reger's Masters (Q-D3, T2-LATER), after 91.
# Written by class_table.py (do not edit by hand): per row of Xeen.Promotions, round 1 gives the members the
# row's "from" classes and classes it must leave alone (a logged test setup through SetPlayerClass), picks the
# promote and asserts every class; round 2 has nobody eligible and the promote is not offered. The party's own
# classes are put back at the end.
#   python3 tests/playthrough/xeen/promotions/run.py 93
id: xeen.promotions.93_reger_table
title: "Xeen promotions 93: the class table, D1"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/91_drawkcab_way.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d1.odm, qbit_set: [113066]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end"}
  # The party's own classes, kept for the end (class ids in global variables; the names remembered for the check).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}

  # D-82 point 5: no member down before the rounds (each reads every member's class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 93 before the class table: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before the class table (D-82 5): ' .. table.concat(down, ' | ')) end"}

  # drawkcab: Initiate -> Master. Brother Reger (Q-D3, T2-LATER): "Promotion".
  # Round 1: Initiate Ninja Master Monk -> Master Ninja Master Monk.
  - lua_event: {source: "if not SetPlayerClass(0, 'Initiate') then error('SetPlayerClass(0, Initiate)') end if not SetPlayerClass(1, 'Ninja') then error('SetPlayerClass(1, Ninja)') end if not SetPlayerClass(2, 'Master') then error('SetPlayerClass(2, Master)') end if not SetPlayerClass(3, 'Monk') then error('SetPlayerClass(3, Monk)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES drawkcab round 1 set: " .. c) if c ~= "Initiate Ninja Master Monk" then error("expected Initiate Ninja Master Monk, got " .. c) end'}
  - set_pose: {map: xeen_d1.odm, x: -3328, y: -15892, z: 1023, yaw: -1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - press_interact: {expect: {kind: event_target}}
  - assert: {dialog: {active: true, source_id: 4950, action_label_present: "Promotion"}}
  - select_topic: {match_label: "Promotion"}
  - assert: {dialog: {active: true, text_contains: "Master you are now. Backwards, naturally."}}
  - play_lua: {source: 'local c = classes() log("CLASSES drawkcab round 1 promoted: " .. c) if c ~= "Master Ninja Master Monk" then error("expected Master Ninja Master Monk, got " .. c) end'}
  # Nobody left: the promote is no longer offered.
  - assert: {dialog: {active: true, action_label_absent: "Promotion"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Round 2: Ninja Master Monk Peasant, none of them eligible: the promote is not offered.
  - lua_event: {source: "if not SetPlayerClass(0, 'Ninja') then error('SetPlayerClass(0, Ninja)') end if not SetPlayerClass(1, 'Master') then error('SetPlayerClass(1, Master)') end if not SetPlayerClass(2, 'Monk') then error('SetPlayerClass(2, Monk)') end if not SetPlayerClass(3, 'Peasant') then error('SetPlayerClass(3, Peasant)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES drawkcab round 2 set: " .. c) if c ~= "Ninja Master Monk Peasant" then error("expected Ninja Master Monk Peasant, got " .. c) end'}
  - set_pose: {map: xeen_d1.odm, x: -3328, y: -15892, z: 1023, yaw: -1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - press_interact: {expect: {kind: event_target}}
  - assert: {dialog: {active: true, source_id: 4950, action_label_absent: "Promotion"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - play_lua: {source: 'local c = classes() log("CLASSES drawkcab round 2 kept: " .. c) if c ~= "Ninja Master Monk Peasant" then error("expected Ninja Master Monk Peasant, got " .. c) end'}

  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - save_game: {name: "P93 class table", path: output/playthrough/xeen/promotions/checkpoints/93_reger_table.oysav}
