# Xeen promotion playthrough 95, block I (tier 2, Light): Q-D14 The Wizard Quarter, nobody promoted (README check 3:
# the party has no Rogue). From a copy of the main chain's 65 (D3, Sandcaster, at the Guild of Light; Q-D18 done).
# Astra in her house (house 4618, a residence of one: the door opens her talk): Xenoc and Morgana (her story, asked),
# We will help (started, autonote 4540); asked again, her nag. The quarter's Guild of Night is still sealed. The guild
# gate (D3 event 124): its line ends "Enter?", Yes: DD-19 at the gate's inside (0, 384, 0), the arrival window. DD-19
# walked by A8's playtest (devdocs/xeen/briefs/dd19/L4/playtest.yml): the Mirage Guild's doors, the hall of illusions,
# up the Mirage stair to the gallery, the mirror ("a door in it"), through the mirage: Xenoc (actor 49, immobile) falls
# ("Xenoc falls", xenoc_slain); the bolt and over the covered bridge; the ward ("two lamps"), the scrying room's lamp
# (Yes: "thins"), down the HQ stair, the robing room's lamp (Yes: "goes out", the ward sinks); up into the sanctum:
# Morgana (actor 30) falls ("Morgana is dead", morgana_slain). The two wizards die through the damage path (the party is
# immortal, PLAYBOOK 2), their escorts by clear_hostiles. Out by the HQ's doors, the court and the gate's inside face
# (DD-19 event 23, OK) to D3. Astra: Xenoc and Morgana (done, autonote 4541, 10,000 each, no gold; nobody walks unseen,
# so nobody rises, classes kept); again, her thanks; her later topic The guilds' word (T2-LATER) is not offered with
# nobody eligible. The quarter's Guild of Night opens its house screen. Saved at Astra's door (the table, 97).
# Quest logic: source/quests/q-d14.yml, t2-later.yml. Routes: devdocs/xeen/briefs/d3/L4/playtest.yml (Astra's door,
# the gate, the quarter's houses), devdocs/xeen/briefs/dd19/L4/playtest.yml (the walk); A3-side's
# tests/scenarios/xeen/side_quests/q-d14_wizard_quarter.yml plays the same route from a new game with a Rogue.
#   python3 tests/playthrough/xeen/promotions/run.py 95
id: xeen.promotions.95_wizard_quarter
title: "Xeen promotions 95: the Wizard Quarter (Q-D14), Xenoc and Morgana defeated, nobody promoted"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/00_main_65.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d3.odm, qbit_set: [113365]}
  - assert: {qbit_clear: [113280, 113281, 113282, 113283, 113284, 117520]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end; remember('classes', classes()); log('95 start: ' .. classes()); if string.find(classes(), 'Rogue', 1, true) then error('the party has a Rogue: ' .. classes()) end"}
  # Astra in her house: her story, We will help.
  - set_pose: {map: xeen_d3.odm, x: -12800, y: 20756, z: 1519, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - press_interact: {expect: {kind: event_target}}
  - advance_runtime: {seconds: 0.5}
  - assert: {dialog: {active: true, source_id: 5217, action_label_absent: "We will help"}}
  - select_topic: {match_label: "Xenoc and Morgana"}
  - assert: {dialog: {text_contains: "Now I am dethroned, and the guilds are wicked. Will you help right the wrong?"}}
  - select_topic: {match_label: "We will help"}
  - assert: {dialog: {text_contains: "you will have to defeat them in battle"}}
  - assert: {dialog: {action_label_absent: "We will help"}}
  - select_topic: {match_label: "Xenoc and Morgana"}
  - assert: {dialog: {text_contains: "Everyone is relying on you to put matters right."}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - assert: {qbit_set: [113280, 113282]}
  - assert: {autonote: {id: 4540}}
  # The quarter's Guild of Night, sealed while the wizards rule.
  - set_pose: {map: xeen_d3.odm, x: -10820, y: 21760, z: 1728, yaw: 3.1416, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - press_interact: {expect: {kind: event_target}}
  - advance_runtime: {seconds: 0.5}
  - assert: {dialog: {active: true, text_contains: "Sealed with a wizard's lock."}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # The guild gate (D3 event 124): "... Enter?", Yes: into DD-19.
  - set_pose: {map: xeen_d3.odm, x: -10752, y: 22016, z: 1728, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - play_lua: {source: "click(124); wait(0.5)"}
  - advance_runtime: {seconds: 0.3, present_dialogs: true}
  # F16: the standard entrance window.
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_dd19.blv}
  - advance_runtime: {seconds: 3, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "THE WIZARD QUARTER"}}
  - play_lua: {source: "close(); wait(0.5); if not qbit(117520) then error('dd19_arrived_once 117520 not set') end"}
  - assert: {party_position: {x: 0, y: 384, radius: 64, z_min: -8, z_max: 8}}
  # The Mirage Guild: the double doors, the foyer, the hall of illusions, up the Mirage stair to the gallery.
  - walk_to: {x: -700, y: 768, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "click(17); for _ = 1, 20 do if door_state(7) == 'open' and door_state(8) == 'open' then break end; wait(0.5) end; if door_state(7) ~= 'open' or door_state(8) ~= 'open' then error('the leaves did not open: ' .. door_state(7) .. ' ' .. door_state(8)) end"}
  - walk_to: {x: -1700, y: 768, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 480, close_dialogs: true}
  - walk_to: {x: -2000, y: 896, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 480, close_dialogs: true}
  - walk_to: {x: -3000, y: 896, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 480, close_dialogs: true}
  - clear_hostiles: {radius: 500}
  - walk_to: {x: -2752, y: 1350, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -3300, y: 1450, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -3350, y: 1850, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -3350, y: 2840, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -3008, y: 2840, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -3008, y: 1900, z: 640, z_tolerance: 120, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -2752, y: 1800, z: 640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -2752, y: 1350, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 700, close_dialogs: true}
  - clear_hostiles: {radius: 700}
  - walk_to: {x: -3000, y: 700, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 700, close_dialogs: true}
  - clear_hostiles: {radius: 700}
  # The mirror, then through the mirage into the Hall of Mirages: Xenoc.
  - walk_to: {x: -3000, y: 896, z: 640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "click(28); wait(0.5)"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "the blank wall behind you has a door in it"}}
  - play_lua: {source: "close()"}
  - walk_to: {x: -2100, y: 896, z: 640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - assert: {party_position: {x: -2100, y: 896, radius: 96, z_min: 632, z_max: 680}}
  - damage_actor: {actor_index: 49, amount: 100000}
  - advance_runtime: {seconds: 3, present_dialogs: true}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[Xenoc falls, still in the middle of a sentence about his betters.]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "close(); wait(0.5); if not qbit(113283) then error('xenoc_slain 113283 not set') end; if qbit(113284) then error('morgana_slain with Morgana alive') end; clear_hostiles(1600)"}
  # The bolt beside the bridge door, and over the covered bridge to the scrying room.
  - walk_to: {x: -1300, y: 1856, z: 640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "status(); click(5); wait(0.5); local seen = status(); if not string.find(seen, 'You draw the bolt', 1, true) then error('the bolt said: ' .. seen) end; for _ = 1, 20 do if door_state(3) == 'open' then break end; wait(0.5) end; if door_state(3) ~= 'open' then error('the bridge door did not open: ' .. door_state(3)) end"}
  - walk_to: {x: 0, y: 1856, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 1500}
  - walk_to: {x: 1600, y: 1856, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 1600}
  # The ward before Morgana's sanctum, and its first lamp in the scrying room.
  - walk_to: {x: 2100, y: 1344, z: 640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 2750, y: 1344, z: 640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "status(); click(43); wait(0.5); local seen = status(); if not string.find(seen, 'The ward draws on two lamps, one above and one below.', 1, true) then error('the ward said: ' .. seen) end"}
  - walk_to: {x: 2100, y: 1344, z: 640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 1728, y: 920, z: 640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "status(); click(26); wait(0.5)"}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 1}
  - play_lua: {source: "local seen = status(); if not string.find(seen, 'The ward thins, but holds.', 1, true) then error('lamp 1 said: ' .. seen) end; close()"}
  # Down the HQ stair, the robing room's lamp: the ward goes out.
  - walk_to: {x: 2100, y: 1344, z: 640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 3008, y: 1250, z: 640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 3008, y: 360, z: 0, z_tolerance: 120, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 3400, y: 640, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "open_door(21, 13)"}
  - walk_to: {x: 4200, y: 1100, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 1500}
  - walk_to: {x: 4544, y: 1340, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "status(); click(25); wait(0.5)"}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 1}
  - play_lua: {source: "local seen = status(); if not string.find(seen, 'The ward flickers and goes out.', 1, true) then error('lamp 2 said: ' .. seen) end; close(); for _ = 1, 20 do if door_state(16) == 'open' then break end; wait(0.5) end; if door_state(16) ~= 'open' then error('the ward did not sink: ' .. door_state(16)) end"}
  # Up again and into the sanctum: Morgana.
  - walk_to: {x: 3400, y: 640, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 3008, y: 360, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 3008, y: 1300, z: 640, z_tolerance: 120, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 3008, y: 2000, z: 640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - damage_actor: {actor_index: 30, amount: 100000}
  - advance_runtime: {seconds: 3, present_dialogs: true}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[Morgana is dead. Her robes keep glowing for a while, out of habit.]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "close(); wait(0.5); if not qbit(113284) then error('morgana_slain 113284 not set') end; if qbit(113281) then error('done before the hand-in') end; clear_hostiles(1800)"}
  # Out: down the HQ stair, through the HQ's doors and the court to the guild gate (DD-19 event 23).
  - walk_to: {x: 3008, y: 1250, z: 640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 3008, y: 360, z: 0, z_tolerance: 120, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 2600, y: 640, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 1700, y: 700, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 1500}
  - walk_to: {x: 1450, y: 768, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "open_door(16, 5)"}
  - walk_to: {x: 600, y: 900, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 0, y: 200, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; click(23); wait(0.5)"}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d3.odm}
  - assert: {party_position: {x: -10752, y: 22016, radius: 128}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Astra: the hand-in (done, autonote, 10,000 each, no gold); nobody walks unseen, so nobody rises.
  - set_pose: {map: xeen_d3.odm, x: -12800, y: 20756, z: 1519, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  # D-82 point 5: no member down before Astra's hand-in (it reads every member's experience or class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 95 before Astra\\'s hand-in: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before Astra\\'s hand-in (D-82 5): ' .. table.concat(down, ' | ')) end"}
  - play_lua: {source: "remember('gold', gold()); for i = 0, 3 do remember('xp' .. i, experience(i)) end"}
  - press_interact: {expect: {kind: event_target}}
  - advance_runtime: {seconds: 0.5}
  - assert: {dialog: {active: true, source_id: 5217, action_label_absent: "The guilds' word"}}
  - select_topic: {match_label: "Xenoc and Morgana"}
  - assert: {dialog: {text_contains: "You have done both me and Sandcaster a great service. The quarter is open again."}}
  - play_lua:
      source: |
        if classes() ~= recall("classes") then error("Astra promoted the party: " .. classes()) end
        for i = 0, 3 do
          if experience(i) - recall("xp" .. i) ~= 10000 then error("member " .. i .. " got " .. (experience(i) - recall("xp" .. i)) .. " XP") end
        end
        if gold() ~= recall("gold") then error("Astra paid gold") end
        log("Q-D14 done: 10,000 each, classes kept: " .. classes())
  - select_topic: {match_label: "Xenoc and Morgana"}
  - assert: {dialog: {text_contains: "I am pleased to see you! Sandcaster will not forget your great deeds!"}}
  - assert: {dialog: {action_label_absent: "The guilds' word"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for i = 0, 3 do if experience(i) - recall('xp' .. i) ~= 10000 then error('paid twice: member ' .. i) end end"}
  - assert: {qbit_set: [113281, 113283, 113284]}
  - assert: {autonote: {id: 4541}}
  # The quarter is open: the Guild of Night's house screen.
  - set_pose: {map: xeen_d3.odm, x: -10820, y: 21760, z: 1728, yaw: 3.1416, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - press_interact: {expect: {kind: event_target}}
  - advance_runtime: {seconds: 0.5}
  - assert: {dialog: {active: true, house_dialog: true, source_id: 4613}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; if classes() ~= recall('classes') then error(classes()) end"}
  - set_pose: {map: xeen_d3.odm, x: -12800, y: 20756, z: 1519, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - save_game: {name: "P95 the Wizard Quarter", path: output/playthrough/xeen/promotions/checkpoints/95_wizard_quarter.oysav}
