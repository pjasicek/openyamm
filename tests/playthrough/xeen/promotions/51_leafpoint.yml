# Xeen promotion playthrough 51, block E (tier 2, Light): T2-LEAFPOINT, Leafpoint's Grove (D4, the Forest of Peril).
# From a copy of the main chain's 57 (Lakeside's jetty on D4; M20 started). Leafpoint the tree in his grove (actor 22,
# the party placed beside him: outdoors, PLAYBOOK 2). He talks only to Thickbark's "Civilized Ones" (q-c15.done):
# first the stranger's line. Q-C15 (Cloudside's Troll Forest) is not in the main chain; it is played by A3-side's
# tests/scenarios/xeen/side_quests/q-c15_troll_problem.yml, and its done bit is a logged CONVENTION prerequisite here
# (D-75; proven by that scenario). Then the Civilized Ones' line with no Great Druid in the party: nothing
# paid, done stays clear (the first promotion pays, D-16). One member is given the Great Druid class by a logged test
# setup (SetPlayerClass, as the class table; the party has no druid): Leafpoint promotes him an Arch Druid, pays 3,000
# each and sets done; the other three are kept (Crusader, Wizard and Ranger Lord: no crossing, D-74 2). Asked again:
# Thickbark's new ring, nothing paid. The party's classes are put back.
# Quest logic: source/quests/t2-leafpoint.yml. Pose: devdocs/xeen/briefs/d4/L4/playtest.yml ("Leafpoint in his grove").
#   python3 tests/playthrough/xeen/promotions/run.py 51
id: xeen.promotions.51_leafpoint
title: "Xeen promotions 51: Leafpoint's Grove (T2-LEAFPOINT), a Great Druid an Arch Druid"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/00_main_57.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d4.odm, qbit_set: [111400]}
  - assert: {qbit_clear: [112302, 114560]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end; if classes() ~= 'Cavalier Crusader Wizard RangerLord' then error('party: ' .. classes()) end"}
  # A stranger: Leafpoint does not talk.
  - set_pose: {map: xeen_d4.odm, x: -11264, y: 819, z: 1504, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - interact_actor: {actor_index: 22}
  - assert: {dialog: {active: true, source_id: 5319, action_label_present: "Civilized ones"}}
  - select_topic: {match_label: "Civilized ones"}
  - assert: {dialog: {active: true, text_contains: "A tree does not talk to strangers"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Thickbark's Civilized Ones (Q-C15, Cloudside).
  - play_lua: {source: "log('CONVENTION prerequisite q-c15.done (112302): Q-C15 The Troll Problem is Cloudside side content outside the main chain; proven by tests/scenarios/xeen/side_quests/q-c15_troll_problem.yml')"}
  - console: {line: "qbit set 112302"}
  # D-82 point 5: no member down before Leafpoint's hand-in (it reads every member's experience or class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 51 before Leafpoint\\'s hand-in: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before Leafpoint\\'s hand-in (D-82 5): ' .. table.concat(down, ' | ')) end"}
  # Civilized, but nobody walks the green ways: nothing paid, done stays clear.
  - play_lua: {source: "for i = 0, 3 do remember('xp' .. i, experience(i)) end"}
  - interact_actor: {actor_index: 22}
  - assert: {dialog: {active: true, source_id: 5319}}
  - select_topic: {match_label: "Civilized ones"}
  - assert: {dialog: {active: true, text_contains: "If a druid among you ever wants the last lesson, come back."}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for i = 0, 3 do if experience(i) ~= tonumber(recall('xp' .. i)) then error('paid with nobody promoted') end end"}
  - assert: {qbit_clear: [114560]}
  # The party's own classes, kept for the end; member 0 a Great Druid (a logged test setup: the party has no druid).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}
  - lua_event: {source: "if not SetPlayerClass(0, 'GreatDruid') then error('SetPlayerClass(0, GreatDruid)') end"}
  - play_lua: {source: "log('CLASSES test setup: ' .. classes()); if classes() ~= 'GreatDruid Crusader Wizard RangerLord' then error(classes()) end"}
  # Leafpoint: the Great Druid rises an Arch Druid; 3,000 each.
  - interact_actor: {actor_index: 22}
  - assert: {dialog: {active: true, source_id: 5319}}
  - select_topic: {match_label: "Civilized ones"}
  - assert: {dialog: {active: true, text_contains: "A tree's patience is the last lesson"}}
  - play_lua:
      source: |
        for i = 0, 3 do
          local xp = experience(i) - tonumber(recall("xp" .. i))
          if xp ~= 3000 then error("member " .. i .. ": Leafpoint paid " .. xp .. " experience, not 3000") end
        end
        if classes() ~= "ArchDruid Crusader Wizard RangerLord" then error("T2-LEAFPOINT: " .. classes()) end
        log("T2-LEAFPOINT done: " .. classes())
  - assert: {qbit_set: [114560]}
  # Asked again: nobody left, Thickbark's new ring, nothing paid.
  - play_lua: {source: "remember('xp', experience(0))"}
  - select_topic: {match_label: "Civilized ones"}
  - assert: {dialog: {active: true, text_contains: "The wind says Thickbark has grown a new ring"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; if experience(0) ~= tonumber(recall('xp')) then error('paid twice') end; if classes() ~= 'ArchDruid Crusader Wizard RangerLord' then error(classes()) end"}
  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - save_game: {name: "P51 Leafpoint", path: output/playthrough/xeen/promotions/checkpoints/51_leafpoint.oysav}
