# Xeen promotion playthrough 87, the class table (README "What is checked" 5): D1: Luna's The altar's light (Q-D20, T2-LATER), after 85.
# Written by class_table.py (do not edit by hand): per row of Xeen.Promotions, round 1 gives the members the
# row's "from" classes and classes it must leave alone (a logged test setup through SetPlayerClass), picks the
# promote and asserts every class; round 2 has nobody eligible and the promote is not offered. The party's own
# classes are put back at the end.
#   python3 tests/playthrough/xeen/promotions/run.py 87
id: xeen.promotions.87_luna_table
title: "Xeen promotions 87: the class table, D1"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/85_luna_statuettes.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d1.odm, qbit_set: [113407]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end"}
  # The party's own classes, kept for the end (class ids in global variables; the names remembered for the check).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}

  # D-82 point 5: no member down before the rounds (each reads every member's class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 87 before the class table: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before the class table (D-82 5): ' .. table.concat(down, ' | ')) end"}

  # statuettes: WarriorMage -> MasterArcher. Luna (Q-D20, T2-LATER): "The altar's light".
  # Round 1: WarriorMage Sniper MasterArcher Archer -> MasterArcher Sniper MasterArcher Archer.
  - lua_event: {source: "if not SetPlayerClass(0, 'WarriorMage') then error('SetPlayerClass(0, WarriorMage)') end if not SetPlayerClass(1, 'Sniper') then error('SetPlayerClass(1, Sniper)') end if not SetPlayerClass(2, 'MasterArcher') then error('SetPlayerClass(2, MasterArcher)') end if not SetPlayerClass(3, 'Archer') then error('SetPlayerClass(3, Archer)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES statuettes round 1 set: " .. c) if c ~= "WarriorMage Sniper MasterArcher Archer" then error("expected WarriorMage Sniper MasterArcher Archer, got " .. c) end'}
  - set_pose: {map: xeen_d1.odm, x: -16691, y: 717, z: 1190, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - interact_actor: {actor_index: 32}
  - assert: {dialog: {active: true, source_id: 4952, action_label_present: "The altar's light"}}
  - select_topic: {match_label: "The altar's light"}
  - assert: {dialog: {active: true, text_contains: "Rise, Master Archer."}}
  - play_lua: {source: 'local c = classes() log("CLASSES statuettes round 1 promoted: " .. c) if c ~= "MasterArcher Sniper MasterArcher Archer" then error("expected MasterArcher Sniper MasterArcher Archer, got " .. c) end'}
  # Nobody left: the promote is no longer offered.
  - assert: {dialog: {active: true, action_label_absent: "The altar's light"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Round 2: Sniper MasterArcher Archer Peasant, none of them eligible: the promote is not offered.
  - lua_event: {source: "if not SetPlayerClass(0, 'Sniper') then error('SetPlayerClass(0, Sniper)') end if not SetPlayerClass(1, 'MasterArcher') then error('SetPlayerClass(1, MasterArcher)') end if not SetPlayerClass(2, 'Archer') then error('SetPlayerClass(2, Archer)') end if not SetPlayerClass(3, 'Peasant') then error('SetPlayerClass(3, Peasant)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES statuettes round 2 set: " .. c) if c ~= "Sniper MasterArcher Archer Peasant" then error("expected Sniper MasterArcher Archer Peasant, got " .. c) end'}
  - set_pose: {map: xeen_d1.odm, x: -16691, y: 717, z: 1190, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - interact_actor: {actor_index: 32}
  - assert: {dialog: {active: true, source_id: 4952, action_label_absent: "The altar's light"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - play_lua: {source: 'local c = classes() log("CLASSES statuettes round 2 kept: " .. c) if c ~= "Sniper MasterArcher Archer Peasant" then error("expected Sniper MasterArcher Archer Peasant, got " .. c) end'}

  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - save_game: {name: "P87 class table", path: output/playthrough/xeen/promotions/checkpoints/87_luna_table.oysav}
