# Xeen promotion playthrough 61, racial: Q-C7 The Count of Nightshadow (X3, XD-24; Vampire -> Nosferatu) played by the
# chain's party, nobody a Vampire. From a copy of the main chain's 35 (X3 after the Tower of High Magic: the last time
# the party stands on Lifeforce Lagoon before the Darkside; Q-C7 not started; Cavalier Crusader Wizard Hunter). The
# quest completes without a Vampire (Draco's death pays it), so no test setup is needed. Nightshadow's square (the party
# placed on it, PLAYBOOK section 2): the rhyme board (started), the sign at the dial walk, the two plinths' clues, the
# coffin's plinth; the well before the liberation; the coffin refuses while the dials are wrong; the three sundials
# turned to 9 by their Turn? questions (3, 6 and 12 as the town left them: checked first); the coffin refuses by day;
# the party camps on the square until 9PM; the lid slides aside (coffin_opened) and its stair goes down into the
# Nightshadow Crypt (XD-24), walked as A3-side's standalone (its L4 playtest): the niches, the ossuary, the chapel, the
# west catacomb, the gallery, the vault stair, the iron door at night (vault_open), Count Draco and his household killed
# (q-c7.draco: done, 10,000 experience each, measured apart from the kills' own experience); the sarcophagus's rhyme, the
# hoard, up the Count's stair and out by the coffin. The well after: "faintly of garlic". Du Monay Manor (house 4105,
# Count Du Monay 4205): "The Count" thanks the party; "Nosferatu" (show: done and a Vampire) is not offered, and nobody's
# class changes (README check 3).
# Quest logic: source/quests/q-c7.yml. Routes: tests/scenarios/xeen/side_quests/q-c7_count_of_nightshadow.yml,
# devdocs/xeen/briefs/x3/L4/playtest.yml, xd24/L4/playtest.yml. Prep: prep/F_racial.md.
#   python3 tests/playthrough/xeen/promotions/run.py 61
id: xeen.promotions.61_nightshadow_count
title: "Xeen promotions 61: the Count of Nightshadow (Q-C7), nobody a Vampire"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
