  - walk_to: {x: 0, y: 1800, z: 384, z_tolerance: 60, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(17); wait(0.5)"}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_x3.odm}
  - play_lua: {source: "wait(1); for _ = 1, 3 do if not close() then break end end"}
  # The town well after the liberation.
  - play_lua: {source: "status(); click(56); wait(0.5); local seen = status(); if not string.find(seen, 'tastes faintly of garlic', 1, true) then error('the well said: ' .. seen) end"}
  # Du Monay Manor (house 4105, Count Du Monay 4205): The Count; no Nosferatu with nobody a Vampire.
  - set_pose: {map: xeen_x3.odm, x: 19204, y: -1920, z: 960, yaw: 0.0, pitch: 0.0}
  - clear_hostiles: {radius: 3000}
  - advance_runtime: {seconds: 0.5}
  # D-82 point 5: no member down before the Count (it reads every member's experience or class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 61 before the Count: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before the Count (D-82 5): ' .. table.concat(down, ' | ')) end"}
  - play_lua: {source: "for i = 0, 3 do remember('xp' .. i, experience(i)) end"}
  - press_interact: {expect: {kind: event_target}}
  - assert:
      dialog: {active: true, source_id: 4205, action_label_present: "The Count"}
  - assert:
      dialog: {active: true, action_label_absent: "Promotion"}
  - select_topic: {match_label: "The Count"}
  - assert:
      dialog: {text_contains: "Draco is gone. The town breathes."}
  - assert:
      dialog: {active: true, action_label_absent: "Promotion"}
  - press_action: {action: cancel_dialog}
  - play_lua:
      source: |
        for _ = 1, 3 do if not close() then break end end
        for i = 0, 3 do
          if experience(i) ~= tonumber(recall("xp" .. i)) then error("Du Monay paid member " .. i) end
        end
        if classes() ~= "Cavalier Crusader Wizard Hunter" then error("classes after Du Monay: " .. classes()) end
        log("Q-C7 done: " .. classes() .. "; experience " .. experience(0) .. "; gold " .. gold())
  - assert: {qbit_set: [112140, 112141, 112142, 112143, 110940]}
  - save_game: {name: "P61 The Count of Nightshadow", path: output/playthrough/xeen/promotions/checkpoints/61_nightshadow_count.oysav}
