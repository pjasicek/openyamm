  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_x3.odm}
  - assert: {qbit_clear: [112140, 112141, 112142, 112143, 110940]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end; if classes() ~= 'Cavalier Crusader Wizard Hunter' then error('party: ' .. classes()) end"}
  # Nightshadow's square: the rhyme board (event 49, started), the signs and the clues.
  - set_pose: {map: xeen_x3.odm, x: 17920, y: -4352, z: 992, yaw: 1.5708, pitch: 0.0}
  - clear_hostiles: {radius: 3000}
  - advance_runtime: {seconds: 0.5}
  - play_lua: {source: "click(49); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "If the dials are properly set, the count will definitely be upset."}}
  - play_lua: {source: "close(); wait(0.3)"}
  - assert: {qbit_set: [112140]}
  - play_lua: {source: "click(50); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "The Count wakes at nine and sleeps at nine."}}
  - play_lua: {source: "close(); wait(0.3); click(54); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "A stitch in time."}}
  - play_lua: {source: "close(); wait(0.3); click(55); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "Lives of a cat."}}
  - play_lua: {source: "close(); wait(0.3); click(48); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "Only at night can you put up a fight."}}
  - play_lua: {source: "close(); wait(0.3)"}
  # The well before the liberation (event 56): black water.
  - play_lua: {source: "status(); click(56); wait(0.5); local seen = status(); if not string.find(seen, 'black and tastes of iron', 1, true) then error('the well said: ' .. seen) end"}
  # The coffin (event 46) with the dials wrong.
  - play_lua: {source: "click(46); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "none of them set as they should be"}}
  - play_lua: {source: "close(); wait(0.3)"}
  # The dial walk: each sundial shows its hour in its Turn? question (the town left them at 3, 6 and 12); each turned
  # on to 9 (6, 3 and 9 turns).
  - play_lua: {source: "click(51); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "The sundial is set to 3."}}
  - play_lua: {source: "close(); wait(0.3); click(52); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "The sundial is set to 6."}}
  - play_lua: {source: "close(); wait(0.3); click(53); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "The sundial is set to 12."}}
  - play_lua: {source: "close(); wait(0.3)"}
  - play_lua: {source: "click(51); wait(0.5)"}
  - answer_input: {text: "Yes"}
