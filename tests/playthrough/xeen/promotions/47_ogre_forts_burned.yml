# Xeen promotion playthrough 47, block D (tier 2, Dark): Q-D11's burning route after the peace (D-12.3), the chain
# party's Hunter -> Bounty Hunter (README check 2). From a copy of the main chain's 43 (D1 at Kramer's Caravans; the
# peace route done: Graalg's disks, Kramer's Ogres paid). East off D1's edge to Sprite Forest (D2; main 43's edge).
# The west fort's gate (D2 event 49) into DD-13: the blockhouse's double door, the empty hall, its fire pit: Burn? Yes
# (q-d11.fort_west: west_burned, hostile); back out by the west gate (DD-13 event 15). The east fort's gate (D2 event
# 52): its gateway, the east hall's pit: Yes (q-d11.fort_east: east_burned); out by the east gate (event 14). A7's
# walk: devdocs/xeen/briefs/dd13/L4/playtest.yml. Back west to Castleview and Kramer: Bounty (1,000 experience each,
# 1,000 gold; the Hunter rises a Bounty Hunter, the others kept); asked again the topic is gone, and his later topic
# Guild title (T2-LATER) is not offered with nobody eligible. The Hunter is now on the Dark path: Sharla's Ranger Lord
# (Light, Q-D10) no longer applies to him (README check 4; the main chain takes the Light path in 49 instead).
# Quest logic: source/quests/q-d11.yml.
#   python3 tests/playthrough/xeen/promotions/run.py 47
id: xeen.promotions.47_ogre_forts_burned
title: "Xeen promotions 47: Ogre Pass's forts burned (Q-D11), the Hunter a Bounty Hunter"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/00_main_43.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d1.odm, qbit_set: [113223, 113227]}
  - assert: {qbit_clear: [113224, 113225, 113228]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end; if classes() ~= 'Cavalier Crusader Wizard Hunter' then error('party: ' .. classes()) end"}
  # East off D1's edge into Sprite Forest.
  - set_pose: {map: xeen_d1.odm, x: 21504, y: 2048, z: 1088, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 24064, y: 2048, z: 1088, z_tolerance: 600, radius: 128, timeout_seconds: 60, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d2.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # The west fort (D2 event 49): the hall's pit, Burn? Yes.
  - set_pose: {map: xeen_d2.odm, x: 4096, y: 13824, z: 2016, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - execute_event: {id: 49}
  # F16: the standard entrance window.
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_dd13.blv}
  - advance_runtime: {seconds: 3, present_dialogs: true}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - walk_to: {x: 0, y: 380, z: 0, radius: 40, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "open_door(11, 9)"}
  - walk_to: {x: 0, y: 900, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 0, y: 1520, z: 0, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "click(20); wait(0.5)"}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 1}
  - assert: {dialog: {active: true, text_contains: "collapses in a heap of burning timbers"}}
  - play_lua: {source: "close(); if not qbit(113224) then error('west_burned 113224 not set') end; if not qbit(113222) then error('hostile 113222 not set') end"}
  - clear_hostiles: {radius: 2500}
  # Back out by the west gate (event 15).
  - walk_to: {x: 0, y: 900, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 0, y: 380, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 0, y: -64, z: 0, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - execute_event: {id: 15}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d2.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # The east fort (D2 event 52): the gateway, the east hall's pit, Yes.
  - set_pose: {map: xeen_d2.odm, x: 11776, y: 11776, z: 2048, yaw: -1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - execute_event: {id: 52}
  # F16: the standard entrance window.
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_dd13.blv}
  - advance_runtime: {seconds: 2, present_dialogs: true}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - walk_to: {x: 7552, y: -760, z: 0, radius: 40, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "open_door(10, 7)"}
  - walk_to: {x: 6900, y: -992, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - walk_to: {x: 7552, y: -1480, z: 0, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(19); wait(0.5)"}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 1}
  - assert: {dialog: {active: true, text_contains: "collapses in a heap of burning timbers"}}
  - play_lua: {source: "close(); if not qbit(113225) then error('east_burned 113225 not set') end"}
  - clear_hostiles: {radius: 2500}
  # Out by the east gate (event 14).
  - walk_to: {x: 6900, y: -992, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 7552, y: -760, z: 0, radius: 40, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "if door_state(7) ~= 'open' then open_door(10, 7) end"}
  - walk_to: {x: 7552, y: 60, z: 0, radius: 40, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "if door_state(2) ~= 'open' then open_door(7, 2) end"}
  - walk_to: {x: 7552, y: 470, z: 0, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - execute_event: {id: 14}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d2.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # West off D2's edge to Castleview Vale; Kramer: Bounty.
  - set_pose: {map: xeen_d2.odm, x: -22016, y: 2048, z: 992, yaw: 3.1416, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: -24400, y: 2048, z: 992, z_tolerance: 600, radius: 128, timeout_seconds: 60, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d1.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - set_pose: {map: xeen_d1.odm, x: 3844, y: 5376, z: 1152, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  # D-82 point 5: no member down before Kramer's bounty (it reads every member's experience or class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 47 before Kramer\\'s bounty: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before Kramer\\'s bounty (D-82 5): ' .. table.concat(down, ' | ')) end"}
  - play_lua: {source: "remember('gold', gold()); for i = 0, 3 do remember('xp' .. i, experience(i)) end"}
  - press_interact: {expect: {kind: event_target}}
  - assert: {dialog: {active: true, action_label_present: "Promotion"}}
  - select_topic: {action_id: 44552, match_label: "Promotion"}
  - assert: {dialog: {active: true, text_contains: "the caravan guild has a title for hunters like you"}}
  - play_lua:
      source: |
        for i = 0, 3 do
          local xp = experience(i) - tonumber(recall("xp" .. i))
          if xp ~= 1000 then error("member " .. i .. ": the bounty paid " .. xp .. " experience, not 1000") end
        end
        if gold() - recall("gold") ~= 1000 then error("the bounty paid " .. (gold() - recall("gold")) .. " gold") end
        if classes() ~= "Cavalier Crusader Wizard BountyHunter" then error("Q-D11 bounty: " .. classes()) end
        log("Q-D11 bounty paid: " .. classes())
  - assert: {qbit_set: [113228]}
  - assert: {dialog: {active: true, action_label_absent: "Promotion"}}
  - select_topic: {match_label: "Ogres"}
  - assert: {dialog: {active: true, text_contains: "The caravans run through Ogre Pass on time."}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - save_game: {name: "P47 Ogre forts burned", path: output/playthrough/xeen/promotions/checkpoints/47_ogre_forts_burned.oysav}
