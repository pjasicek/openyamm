# Xeen promotion playthrough 43, the class table (README "What is checked" 5): D1: Dreyfus's Mok's blessing (Q-D6, T2-LATER), after the main chain's 63.
# Written by class_table.py (do not edit by hand): per row of Xeen.Promotions, round 1 gives the members the
# row's "from" classes and classes it must leave alone (a logged test setup through SetPlayerClass), picks the
# promote and asserts every class; round 2 has nobody eligible and the promote is not offered. The party's own
# classes are put back at the end.
#   python3 tests/playthrough/xeen/promotions/run.py 43
id: xeen.promotions.43_dreyfus_table
title: "Xeen promotions 43: the class table, D1"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/00_main_63.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d1.odm, qbit_set: [113127]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end"}
  # The party's own classes, kept for the end (class ids in global variables; the names remembered for the check).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}

  # D-82 point 5: no member down before the rounds (each reads every member's class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 43 before the class table: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before the class table (D-82 5): ' .. table.concat(down, ' | ')) end"}

  # heretics: Crusader -> Hero, Priest -> PriestLight. Dreyfus (Q-D6, T2-LATER): "Mok's blessing".
  # Round 1: Crusader Priest Villain PriestDark -> Hero PriestLight Villain PriestDark.
  - lua_event: {source: "if not SetPlayerClass(0, 'Crusader') then error('SetPlayerClass(0, Crusader)') end if not SetPlayerClass(1, 'Priest') then error('SetPlayerClass(1, Priest)') end if not SetPlayerClass(2, 'Villain') then error('SetPlayerClass(2, Villain)') end if not SetPlayerClass(3, 'PriestDark') then error('SetPlayerClass(3, PriestDark)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES heretics round 1 set: " .. c) if c ~= "Crusader Priest Villain PriestDark" then error("expected Crusader Priest Villain PriestDark, got " .. c) end'}
  - set_pose: {map: xeen_d1.odm, x: 3092, y: 2048, z: 1152, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - press_interact: {expect: {kind: event_target}}
  - assert: {dialog: {active: true, action_label_present: "Mok's blessing"}}
  - select_topic: {match_label: "Mok's blessing"}
  - assert: {dialog: {active: true, text_contains: "Crusaders rise as Heroes"}}
  - play_lua: {source: 'local c = classes() log("CLASSES heretics round 1 promoted: " .. c) if c ~= "Hero PriestLight Villain PriestDark" then error("expected Hero PriestLight Villain PriestDark, got " .. c) end'}
  # Nobody left: the promote is no longer offered.
  - assert: {dialog: {active: true, action_label_absent: "Mok's blessing"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Round 2: Villain PriestDark Hero PriestLight, none of them eligible: the promote is not offered.
  - lua_event: {source: "if not SetPlayerClass(0, 'Villain') then error('SetPlayerClass(0, Villain)') end if not SetPlayerClass(1, 'PriestDark') then error('SetPlayerClass(1, PriestDark)') end if not SetPlayerClass(2, 'Hero') then error('SetPlayerClass(2, Hero)') end if not SetPlayerClass(3, 'PriestLight') then error('SetPlayerClass(3, PriestLight)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES heretics round 2 set: " .. c) if c ~= "Villain PriestDark Hero PriestLight" then error("expected Villain PriestDark Hero PriestLight, got " .. c) end'}
  - set_pose: {map: xeen_d1.odm, x: 3092, y: 2048, z: 1152, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - press_interact: {expect: {kind: event_target}}
  - assert: {dialog: {active: true, action_label_absent: "Mok's blessing"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - play_lua: {source: 'local c = classes() log("CLASSES heretics round 2 kept: " .. c) if c ~= "Villain PriestDark Hero PriestLight" then error("expected Villain PriestDark Hero PriestLight, got " .. c) end'}

  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - save_game: {name: "P43 class table", path: output/playthrough/xeen/promotions/checkpoints/43_dreyfus_table.oysav}
