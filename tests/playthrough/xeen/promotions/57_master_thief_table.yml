# Xeen promotion playthrough 57, the class table (README "What is checked" 5): DD-06: the Master Thief's New members (Q-D19's inner circle, T2-LATER), after 55; out.
# Written by class_table.py (do not edit by hand): per row of Xeen.Promotions, round 1 gives the members the
# row's "from" classes and classes it must leave alone (a logged test setup through SetPlayerClass), picks the
# promote and asserts every class; round 2 has nobody eligible and the promote is not offered. The party's own
# classes are put back at the end.
#   python3 tests/playthrough/xeen/promotions/run.py 57
id: xeen.promotions.57_master_thief_table
title: "Xeen promotions 57: the class table, DD-06"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/55_inner_circle.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_dd06.blv, qbit_set: [113385]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end"}
  # The party's own classes, kept for the end (class ids in global variables; the names remembered for the check).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}

  # D-82 point 5: no member down before the rounds (each reads every member's class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 57 before the class table: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before the class table (D-82 5): ' .. table.concat(down, ' | ')) end"}

  # southern: WarriorMage -> Sniper, Rogue -> Assassin. the Master Thief (Q-D19, T2-LATER): "Promotion".
  # Round 1: WarriorMage Rogue MasterArcher Spy -> Sniper Assassin MasterArcher Spy.
  - lua_event: {source: "if not SetPlayerClass(0, 'WarriorMage') then error('SetPlayerClass(0, WarriorMage)') end if not SetPlayerClass(1, 'Rogue') then error('SetPlayerClass(1, Rogue)') end if not SetPlayerClass(2, 'MasterArcher') then error('SetPlayerClass(2, MasterArcher)') end if not SetPlayerClass(3, 'Spy') then error('SetPlayerClass(3, Spy)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES southern round 1 set: " .. c) if c ~= "WarriorMage Rogue MasterArcher Spy" then error("expected WarriorMage Rogue MasterArcher Spy, got " .. c) end'}
  - interact_actor: {actor_index: 29}
  - advance_runtime: {seconds: 0.6, present_dialogs: true}
  - assert: {dialog: {active: true, source_id: 5109, action_label_present: "Promotion"}}
  - select_topic: {match_label: "Promotion"}
  - assert: {dialog: {active: true, text_contains: "Inner circle. Don't touch the chest on your way out."}}
  - play_lua: {source: 'local c = classes() log("CLASSES southern round 1 promoted: " .. c) if c ~= "Sniper Assassin MasterArcher Spy" then error("expected Sniper Assassin MasterArcher Spy, got " .. c) end'}
  # Nobody left: the promote is no longer offered.
  - assert: {dialog: {active: true, action_label_absent: "Promotion"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Round 2: MasterArcher Spy Sniper Assassin, none of them eligible: the promote is not offered.
  - lua_event: {source: "if not SetPlayerClass(0, 'MasterArcher') then error('SetPlayerClass(0, MasterArcher)') end if not SetPlayerClass(1, 'Spy') then error('SetPlayerClass(1, Spy)') end if not SetPlayerClass(2, 'Sniper') then error('SetPlayerClass(2, Sniper)') end if not SetPlayerClass(3, 'Assassin') then error('SetPlayerClass(3, Assassin)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES southern round 2 set: " .. c) if c ~= "MasterArcher Spy Sniper Assassin" then error("expected MasterArcher Spy Sniper Assassin, got " .. c) end'}
  - interact_actor: {actor_index: 29}
  - advance_runtime: {seconds: 0.6, present_dialogs: true}
  - assert: {dialog: {active: true, source_id: 5109, action_label_absent: "Promotion"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - play_lua: {source: 'local c = classes() log("CLASSES southern round 2 kept: " .. c) if c ~= "MasterArcher Spy Sniper Assassin" then error("expected MasterArcher Spy Sniper Assassin, got " .. c) end'}

  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - walk_to: {x: 600, y: 192, z: 1920, radius: 64, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 1100, y: 192, z: 1920, radius: 48, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(22); wait(1)"}
  - assert: {party_position: {x: 1760, y: 1780, radius: 120, z_min: 0, z_max: 64}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - walk_to: {x: 640, y: 1880, z: 0, radius: 48, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(17); wait(0.5)"}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d2.odm}
  - save_game: {name: "P57 class table", path: output/playthrough/xeen/promotions/checkpoints/57_master_thief_table.oysav}
