# Xeen promotion playthrough 81, block F (tier 2, Dark; Q-D20's second statuette): Lakeside's coven (D4, DD-20),
# Q-D22's joining route, and the Golden Dragon. From a copy of the main chain's 65 (D3 at the Guild of Light; Q-D18
# done, the Golden Griffin in the pack). North off D3's edge to Lakeside (D4; main 57's edge). The Guild's door
# (D4 event 1): the riddle, a wrong answer first ("broom": q-d22.guild_wrong's trapdoor into DD-20's sump, as a player
# who guesses). DD-20 walked along A8's playtest (devdocs/xeen/briefs/dd20/L4/playtest.yml): the main drain, the cross
# and its ambush, the east drain and the outfall to the Dragon's niche (q-d20.dragon: the Golden Dragon), back by the
# warren and up the drain stair past the cells (the cages are Q-D22's other route, left shut) and the gaol to the coven
# hall: the initiation cauldron is cold (no riddle yet). Up the back stair (event 33) to D4; the door again, "witch"
# (riddle_answered); down the Guild's back stair (D4 event 49) into the hall: the cauldron, Yes: joined, the coven
# friendly, and nobody promoted (the party has no Great Druid: README check 3); again: "still toad". Through the Moon
# seal to the Head Witch's room among friendly witches: her chest opens to a member (the Necropolis pass). Back and up
# the back stair. The Head Witch lives, so the cauldron keeps its later path (D-74 4; table: segment 83).
# Quest logic: source/quests/q-d22.yml, q-d20.yml. Routes: the side quest q-d22_the_coven.yml (D4, the Moon seal).
#   python3 tests/playthrough/xeen/promotions/run.py 81
id: xeen.promotions.81_lakeside_coven
title: "Xeen promotions 81: Lakeside's coven joined (Q-D22), the Golden Dragon (Q-D20)"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/00_main_65.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d3.odm, qbit_set: [113365, 113403]}
  - assert: {qbit_clear: [113442, 113447, 113449, 113448]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end; if not has_item(12351) then error('no Golden Griffin from main 65') end; remember('classes', classes()); log('81 start: ' .. classes())"}
  # North off D3's edge to Lakeside (D4).
  - set_pose: {map: xeen_d3.odm, x: 12288, y: 20480, z: 1760, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 12288, y: 32512, z: 1760, z_tolerance: 900, radius: 128, timeout_seconds: 150, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d4.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # The Guild's door: the riddle, a wrong guess: the trapdoor into DD-20's sump.
  - set_pose: {map: xeen_d4.odm, x: 2028, y: -12800, z: 1120, yaw: 3.1416, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - play_lua: {source: "status(); click(1); wait(0.5)"}
  - answer_input: {text: "broom"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_dd20.blv}
  - play_lua:
      source: |
        local seen = status()
        if not string.find(seen, "Wrong! Begone fools!", 1, true) then error("the wrong answer's status line: " .. seen) end
  - advance_runtime: {seconds: 2, present_dialogs: true}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - assert: {party_position: {x: 3456, y: -640, radius: 128, z_min: -544, z_max: -480}}
  # The main drain to the cross (the ambush), the hideout's turn, the east drain and the outfall to the Dragon's niche.
  - walk_to: {x: 3700, y: -450, z: -512, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 4400, y: -500, z: -512, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 6400, y: -560, z: -512, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 8400, y: -500, z: -512, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 8900, y: -420, z: -512, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - advance_runtime: {seconds: 1}
  - play_lua: {source: "close()"}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: 9600, y: -900, z: -512, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 10100, y: -832, z: -512, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 11000, y: -900, z: -512, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 13400, y: -900, z: -512, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 14100, y: -1152, z: -512, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 14208, y: -400, z: -512, radius: 64, timeout_seconds: 20, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: 14550, y: 0, z: -512, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 14600, y: 1728, z: -512, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 15350, y: 1850, z: -512, radius: 64, timeout_seconds: 20, close_dialogs: true}
  # The Golden Dragon at the niche's foot: a ground item since D-90 (c) (DD-20 rebuilt 2026-11-22, A8).
  - play_lua: {source: "if ground_items(12350) ~= 1 then error('the Golden Dragon is not in the niche') end"}
  - walk_to: {x: 15560, y: 1856, z: -512, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - pick_up: {item_id: 12350}
  - play_lua: {source: "for _ = 1, 3 do if held() ~= 0 then stow() end end; if not has_item(12350) then error('no Golden Dragon from the niche') end"}
  # Back by the warren to the cross, the slop pit, up the drain stair past the cells and the cell stair to the gaol.
  - walk_to: {x: 14600, y: 1900, z: -512, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 12600, y: 1950, z: -512, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 12500, y: 832, z: -512, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 11900, y: 900, z: -512, radius: 64, timeout_seconds: 20, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: 10500, y: 448, z: -512, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 9600, y: 450, z: -512, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 9600, y: 1100, z: -512, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - walk_to: {x: 9250, y: 1280, z: -512, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 7600, y: 1280, z: -256, z_tolerance: 120, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 4400, y: 1344, z: -256, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 2700, y: 1344, z: 0, z_tolerance: 120, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 1500}
  - walk_to: {x: 1300, y: 1344, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "open_door(27, 5)"}
  - walk_to: {x: 600, y: 1344, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 1500}
  # The initiation cauldron (event 39): cold, nobody here has answered the riddle.
  - walk_to: {x: -128, y: -100, z: 0, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "click(39); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "Drink"}}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "The cauldron is cold."}}
  - play_lua: {source: "close(); if qbit(113449) then error('joined without the riddle') end"}
  # Up the back stair (event 33) to D4; the riddle right this time.
  - walk_to: {x: -640, y: -384, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - execute_event: {id: 33}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d4.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - set_pose: {map: xeen_d4.odm, x: 2028, y: -12800, z: 1120, yaw: 3.1416, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - play_lua: {source: "click(1); wait(0.5)"}
  - answer_input: {text: "witch"}
  - advance_runtime: {seconds: 0.5}
  - assert: {dialog: {active: true, text_contains: "free membership to the guild"}}
  - play_lua: {source: "close(); wait(0.3); if not qbit(113442) then error('riddle_answered 113442 not set') end"}
  # The Guild's back stair (D4 event 49) into the coven hall; the cauldron: joined, nobody promoted.
  - execute_event: {id: 49}
  # F16: the standard entrance window.
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_dd20.blv}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - assert: {party_position: {x: -640, y: -384, radius: 128, z_min: -32, z_max: 32}}
  - clear_hostiles: {radius: 1500}
  - walk_to: {x: -128, y: -100, z: 0, radius: 48, timeout_seconds: 20, close_dialogs: true}
  # D-82 point 5: no member down before the coven's cauldron (it reads every member's experience or class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 81 before the coven\\'s cauldron: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before the coven\\'s cauldron (D-82 5): ' .. table.concat(down, ' | ')) end"}
  - play_lua: {source: "click(39); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "Drink"}}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "The brew tastes of toad and ambition."}}
  - play_lua: {source: "close(); if not qbit(113449) then error('joined 113449 not set') end; if classes() ~= recall('classes') then error('the coven promoted the party: ' .. classes()) end"}
  - play_lua: {source: "click(39); wait(0.5)"}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "It is still toad."}}
  - play_lua: {source: "close()"}
  - advance_runtime: {seconds: 2}
  - assert: {actor_count: {monster_id: 11170, hostile: true, max: 0}}
  - assert: {actor_count: {monster_id: 11173, hostile: true, max: 0}}
  # Through the Moon seal to the Head Witch's room: her chest opens to a member (the Necropolis pass).
  - walk_to: {x: -640, y: 1750, z: 0, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "open_door(28, 6)"}
  - walk_to: {x: -640, y: 2350, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -2880, y: 2450, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "open_door(30, 9)"}
  - walk_to: {x: -2880, y: 3200, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "open_door(23, 1)"}
  - walk_to: {x: -2880, y: 4000, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -3550, y: 4300, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua:
      source: |
        loot_chest(54); close()
        for _ = 1, 3 do if held() ~= 0 then stow() end end
        if not qbit(113448) then error("pass_found 113448 not set by her chest") end
        if not has_item(12336) then error("no Necropolis pass") end
  - assert: {actor_count: {monster_id: 11173, hostile: false, min: 1}}
  # Back the way in (the Head Witch alive: the coven stays) and up the back stair.
  - walk_to: {x: -2880, y: 4000, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -2880, y: 3200, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "if door_state(9) ~= 'open' then open_door(30, 9) end"}
  - walk_to: {x: -2880, y: 2450, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -640, y: 2350, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "if door_state(6) ~= 'open' then open_door(28, 6) end"}
  - walk_to: {x: -640, y: 1500, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -128, y: -100, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -640, y: -384, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - execute_event: {id: 33}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d4.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; if classes() ~= recall('classes') then error(classes()) end; log('81 done: ' .. classes())"}
  - assert: {qbit_set: [113442, 113448, 113449]}
  - assert: {qbit_clear: [113447]}
  - save_game: {name: "P81 Lakeside coven", path: output/playthrough/xeen/promotions/checkpoints/81_lakeside_coven.oysav}
