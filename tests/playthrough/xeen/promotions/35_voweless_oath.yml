  - walk_to: {x: 1280, y: 1100, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 128, y: 1100, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 128, y: 500, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -800, y: 400, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1600, y: 0, z: 64, z_tolerance: 120, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1820, y: 0, z: 128, z_tolerance: 120, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "if door_state(1) ~= 'open' then open_door(12, 1) end"}
  - walk_to: {x: -2400, y: 0, z: 128, radius: 64, timeout_seconds: 20, close_dialogs: true}
