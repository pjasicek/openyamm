# Xeen promotion playthrough 35, block D (tier 2, Dark): Q-D17 The Chalice of Protection on the oath route (the
# Voweless Knights: Cavalier -> Black Knight, Crusader -> Villain). From segment 31's checkpoint (D1 outside Castle
# Kalindra; the party Champion Crusader Wizard RangerLord). The edges a player walks (main 69's: D1 east to D2, D2 east
# to Sandcaster, D3 north to Lakeside, D4 west on the desert road to the Desert of Doom); Bosco's Hall (DD-25, D5
# event 85) walked to the King's Hall: Bosco (Chalice: started, the tower's key). The Northern Tower's door (D5 event
# 28, q-d17.tower_door); DD-08 walked up (A8's route, devdocs/xeen/briefs/dd08/L4/playtest.yml): the great stair, the
# west armoury, the west wall stair, the drill floor, the Stair of Silence, the chapter hall; the voice's mask
# ("Wht d y sk?": Chlc, the iron door opens), the Chalice; the plaque: "Swear the Voweless oath?" Yes (q-d17.oath):
# the Chalice given back, two Energy Disks, 14,000 experience each, the Crusader rises a Villain (README check 2) and
# the Champion, promoted on the Light path by Dimitri, stays a Champion (check 4, the Light or Dark rule as it works
# today). The plaque again: the oath is sworn, nobody else promoted. Down and out by the gate; Bosco again: after the
# oath his Chalice line turns the party away (nothing paid). Ends on D5 outside Bosco's Hall.
# Quest logic: source/quests/q-d17.yml. Prep: prep/D_voweless_oath.md.
#   python3 tests/playthrough/xeen/promotions/run.py 35
id: xeen.promotions.35_voweless_oath
title: "Xeen promotions 35: the Voweless oath (Q-D17), the Crusader a Villain, the Champion kept"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/31_dimitri_test.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d1.odm}
  - assert: {qbit_clear: [113340, 113341, 113342, 113343, 113344, 113345]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end; if classes() ~= 'Champion Crusader Wizard RangerLord' then error('party: ' .. classes()) end"}
  # East off D1's edge to D2, east off D2's edge to D3, north off D3's edge to Lakeside (D4) (main 69's edges).
  - set_pose: {map: xeen_d1.odm, x: 21504, y: 2048, z: 1088, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 24064, y: 2048, z: 1088, z_tolerance: 600, radius: 128, timeout_seconds: 60, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d2.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - set_pose: {map: xeen_d2.odm, x: 29696, y: 10240, z: 1408, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 32512, y: 10240, z: 1376, z_tolerance: 600, radius: 128, timeout_seconds: 60, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d3.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - set_pose: {map: xeen_d3.odm, x: 12288, y: 20480, z: 1760, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 12288, y: 32512, z: 1760, z_tolerance: 900, radius: 128, timeout_seconds: 150, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d4.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # West off D4's edge on the desert road to the Desert of Doom (D5).
