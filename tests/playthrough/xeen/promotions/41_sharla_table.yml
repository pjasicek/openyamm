# Xeen promotion playthrough 41, the class table (README "What is checked" 5): D2: Sharla's Forest lords (Q-D10, T2-LATER), after the main chain's 49.
# Written by class_table.py (do not edit by hand): per row of Xeen.Promotions, round 1 gives the members the
# row's "from" classes and classes it must leave alone (a logged test setup through SetPlayerClass), picks the
# promote and asserts every class; round 2 has nobody eligible and the promote is not offered. The party's own
# classes are put back at the end.
#   python3 tests/playthrough/xeen/promotions/run.py 41
id: xeen.promotions.41_sharla_table
title: "Xeen promotions 41: the class table, D2"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/00_main_49.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d2.odm, qbit_set: [113207, 113201]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end"}
  # The party's own classes, kept for the end (class ids in global variables; the names remembered for the check).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}

  # D-82 point 5: no member down before the rounds (each reads every member's class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 41 before the class table: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before the class table (D-82 5): ' .. table.concat(down, ' | ')) end"}

  # sprites: Hunter -> RangerLord. Sharla (Q-D10, T2-LATER): "Forest lords".
  # Round 1: Hunter BountyHunter RangerLord Ranger -> RangerLord BountyHunter RangerLord Ranger.
  - lua_event: {source: "if not SetPlayerClass(0, 'Hunter') then error('SetPlayerClass(0, Hunter)') end if not SetPlayerClass(1, 'BountyHunter') then error('SetPlayerClass(1, BountyHunter)') end if not SetPlayerClass(2, 'RangerLord') then error('SetPlayerClass(2, RangerLord)') end if not SetPlayerClass(3, 'Ranger') then error('SetPlayerClass(3, Ranger)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES sprites round 1 set: " .. c) if c ~= "Hunter BountyHunter RangerLord Ranger" then error("expected Hunter BountyHunter RangerLord Ranger, got " .. c) end'}
  - set_pose: {map: xeen_d2.odm, x: -19300, y: -10839, z: 992, yaw: 2.2513, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - press_interact: {expect: {kind: event_target}}
  - select_topic: {action_id: 5101, match_label: "Sharla"}
  - assert: {dialog: {active: true, action_label_present: "Forest lords"}}
  - select_topic: {match_label: "Forest lords"}
  - assert: {dialog: {active: true, text_contains: "Walk it as its lord."}}
  - play_lua: {source: 'local c = classes() log("CLASSES sprites round 1 promoted: " .. c) if c ~= "RangerLord BountyHunter RangerLord Ranger" then error("expected RangerLord BountyHunter RangerLord Ranger, got " .. c) end'}
  # Nobody left: the promote is no longer offered.
  - assert: {dialog: {active: true, action_label_absent: "Forest lords"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Round 2: BountyHunter RangerLord Ranger Peasant, none of them eligible: the promote is not offered.
  - lua_event: {source: "if not SetPlayerClass(0, 'BountyHunter') then error('SetPlayerClass(0, BountyHunter)') end if not SetPlayerClass(1, 'RangerLord') then error('SetPlayerClass(1, RangerLord)') end if not SetPlayerClass(2, 'Ranger') then error('SetPlayerClass(2, Ranger)') end if not SetPlayerClass(3, 'Peasant') then error('SetPlayerClass(3, Peasant)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES sprites round 2 set: " .. c) if c ~= "BountyHunter RangerLord Ranger Peasant" then error("expected BountyHunter RangerLord Ranger Peasant, got " .. c) end'}
  - set_pose: {map: xeen_d2.odm, x: -19300, y: -10839, z: 992, yaw: 2.2513, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - press_interact: {expect: {kind: event_target}}
  - select_topic: {action_id: 5101, match_label: "Sharla"}
  - assert: {dialog: {active: true, action_label_absent: "Forest lords"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - play_lua: {source: 'local c = classes() log("CLASSES sprites round 2 kept: " .. c) if c ~= "BountyHunter RangerLord Ranger Peasant" then error("expected BountyHunter RangerLord Ranger Peasant, got " .. c) end'}

  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - save_game: {name: "P41 class table", path: output/playthrough/xeen/promotions/checkpoints/41_sharla_table.oysav}
