# Xeen promotion playthrough 83, the class table (README "What is checked" 5): DD-20: the coven's cauldron (Q-D22 joined), after 81; the hall walked in and out.
# Written by class_table.py (do not edit by hand): per row of Xeen.Promotions, round 1 gives the members the
# row's "from" classes and classes it must leave alone (a logged test setup through SetPlayerClass), picks the
# promote and asserts every class; round 2 has nobody eligible and the promote is not offered. The party's own
# classes are put back at the end.
#   python3 tests/playthrough/xeen/promotions/run.py 83
id: xeen.promotions.83_cauldron_table
title: "Xeen promotions 83: the class table, DD-20"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/81_lakeside_coven.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d4.odm, qbit_set: [113449]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end"}
  # The party's own classes, kept for the end (class ids in global variables; the names remembered for the check).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}

  - execute_event: {id: 49}
  # F16: the standard entrance window.
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_dd20.blv}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - walk_to: {x: -128, y: -100, z: 0, radius: 48, timeout_seconds: 20, close_dialogs: true}
  # D-82 point 5: no member down before the rounds (each reads every member's class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 83 before the class table: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before the class table (D-82 5): ' .. table.concat(down, ' | ')) end"}

  # coven: GreatDruid -> Warlock. the coven's cauldron (Q-D22) (a map hook).
  # Round 1: GreatDruid ArchDruid Warlock Druid -> Warlock ArchDruid Warlock Druid.
  - lua_event: {source: "if not SetPlayerClass(0, 'GreatDruid') then error('SetPlayerClass(0, GreatDruid)') end if not SetPlayerClass(1, 'ArchDruid') then error('SetPlayerClass(1, ArchDruid)') end if not SetPlayerClass(2, 'Warlock') then error('SetPlayerClass(2, Warlock)') end if not SetPlayerClass(3, 'Druid') then error('SetPlayerClass(3, Druid)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES coven round 1 set: " .. c) if c ~= "GreatDruid ArchDruid Warlock Druid" then error("expected GreatDruid ArchDruid Warlock Druid, got " .. c) end'}
  - play_lua: {source: "click(39); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "Drink"}}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Another of the green ways drinks."}}
  - play_lua: {source: 'local c = classes() log("CLASSES coven round 1 promoted: " .. c) if c ~= "Warlock ArchDruid Warlock Druid" then error("expected Warlock ArchDruid Warlock Druid, got " .. c) end'}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Nobody left: used again, the line for a party with nobody to promote.
  - play_lua: {source: "click(39); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "Drink"}}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "You have had some. It is still toad."}}
  - play_lua: {source: 'local c = classes() log("CLASSES coven round 1 again: " .. c) if c ~= "Warlock ArchDruid Warlock Druid" then error("expected Warlock ArchDruid Warlock Druid, got " .. c) end'}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Round 2: ArchDruid Warlock Druid Peasant, none of them eligible: nobody is promoted.
  - lua_event: {source: "if not SetPlayerClass(0, 'ArchDruid') then error('SetPlayerClass(0, ArchDruid)') end if not SetPlayerClass(1, 'Warlock') then error('SetPlayerClass(1, Warlock)') end if not SetPlayerClass(2, 'Druid') then error('SetPlayerClass(2, Druid)') end if not SetPlayerClass(3, 'Peasant') then error('SetPlayerClass(3, Peasant)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES coven round 2 set: " .. c) if c ~= "ArchDruid Warlock Druid Peasant" then error("expected ArchDruid Warlock Druid Peasant, got " .. c) end'}
  - play_lua: {source: "click(39); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "Drink"}}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "You have had some. It is still toad."}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - play_lua: {source: 'local c = classes() log("CLASSES coven round 2 kept: " .. c) if c ~= "ArchDruid Warlock Druid Peasant" then error("expected ArchDruid Warlock Druid Peasant, got " .. c) end'}

  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - walk_to: {x: -640, y: -384, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - execute_event: {id: 33}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d4.odm}
  - save_game: {name: "P83 class table", path: output/playthrough/xeen/promotions/checkpoints/83_cauldron_table.oysav}
