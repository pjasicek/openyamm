# Xeen promotion playthrough 97, the class table (README "What is checked" 5): D3: Astra's The guilds' word (Q-D14, T2-LATER), after 95.
# Written by class_table.py (do not edit by hand): per row of Xeen.Promotions, round 1 gives the members the
# row's "from" classes and classes it must leave alone (a logged test setup through SetPlayerClass), picks the
# promote and asserts every class; round 2 has nobody eligible and the promote is not offered. The party's own
# classes are put back at the end.
#   python3 tests/playthrough/xeen/promotions/run.py 97
id: xeen.promotions.97_astra_table
title: "Xeen promotions 97: the class table, D3"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/95_wizard_quarter.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d3.odm, qbit_set: [113281]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end"}
  # The party's own classes, kept for the end (class ids in global variables; the names remembered for the check).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}

  # D-82 point 5: no member down before the rounds (each reads every member's class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 97 before the class table: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before the class table (D-82 5): ' .. table.concat(down, ' | ')) end"}

  # quarter: Rogue -> Spy. Astra (Q-D14, T2-LATER): "The guilds' word".
  # Round 1: Rogue Assassin Spy Thief -> Spy Assassin Spy Thief.
  - lua_event: {source: "if not SetPlayerClass(0, 'Rogue') then error('SetPlayerClass(0, Rogue)') end if not SetPlayerClass(1, 'Assassin') then error('SetPlayerClass(1, Assassin)') end if not SetPlayerClass(2, 'Spy') then error('SetPlayerClass(2, Spy)') end if not SetPlayerClass(3, 'Thief') then error('SetPlayerClass(3, Thief)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES quarter round 1 set: " .. c) if c ~= "Rogue Assassin Spy Thief" then error("expected Rogue Assassin Spy Thief, got " .. c) end'}
  - set_pose: {map: xeen_d3.odm, x: -12800, y: 20756, z: 1519, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - press_interact: {expect: {kind: event_target}}
  - advance_runtime: {seconds: 0.5}
  - assert: {dialog: {active: true, source_id: 5217, action_label_present: "The guilds' word"}}
  - select_topic: {match_label: "The guilds' word"}
  - assert: {dialog: {active: true, text_contains: "Then the word is Spy."}}
  - play_lua: {source: 'local c = classes() log("CLASSES quarter round 1 promoted: " .. c) if c ~= "Spy Assassin Spy Thief" then error("expected Spy Assassin Spy Thief, got " .. c) end'}
  # Nobody left: the promote is no longer offered.
  - assert: {dialog: {active: true, action_label_absent: "The guilds' word"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Round 2: Assassin Spy Thief Peasant, none of them eligible: the promote is not offered.
  - lua_event: {source: "if not SetPlayerClass(0, 'Assassin') then error('SetPlayerClass(0, Assassin)') end if not SetPlayerClass(1, 'Spy') then error('SetPlayerClass(1, Spy)') end if not SetPlayerClass(2, 'Thief') then error('SetPlayerClass(2, Thief)') end if not SetPlayerClass(3, 'Peasant') then error('SetPlayerClass(3, Peasant)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES quarter round 2 set: " .. c) if c ~= "Assassin Spy Thief Peasant" then error("expected Assassin Spy Thief Peasant, got " .. c) end'}
  - set_pose: {map: xeen_d3.odm, x: -12800, y: 20756, z: 1519, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - press_interact: {expect: {kind: event_target}}
  - advance_runtime: {seconds: 0.5}
  - assert: {dialog: {active: true, source_id: 5217, action_label_absent: "The guilds' word"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - play_lua: {source: 'local c = classes() log("CLASSES quarter round 2 kept: " .. c) if c ~= "Assassin Spy Thief Peasant" then error("expected Assassin Spy Thief Peasant, got " .. c) end'}

  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - save_game: {name: "P97 class table", path: output/playthrough/xeen/promotions/checkpoints/97_astra_table.oysav}
