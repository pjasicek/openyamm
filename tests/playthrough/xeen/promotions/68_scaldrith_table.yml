# Xeen promotion playthrough 68, the class table (README "What is checked" 5): XD-18: Scaldrith's Great Wyrm (Q-C25), after 67; the cave walked in and out.
# Written by class_table.py (do not edit by hand): per row of Xeen.Promotions, round 1 gives the members the
# row's "from" classes and classes it must leave alone (a logged test setup through SetPlayerClass), picks the
# promote and asserts every class; round 2 has nobody eligible and the promote is not offered. The party's own
# classes are put back at the end.
#   python3 tests/playthrough/xeen/promotions/run.py 68
id: xeen.promotions.68_scaldrith_table
title: "Xeen promotions 68: the class table, XD-18"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/67_dragon_tax.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_x7.odm, qbit_set: [112507]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end"}
  # The party's own classes, kept for the end (class ids in global variables; the names remembered for the check).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}

  - set_pose: {map: xeen_x7.odm, x: -3891, y: 16589, z: 2144, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 4000}
  - play_lua: {source: "click(40); wait(0.5)"}
  - advance_runtime: {seconds: 0.3, present_dialogs: true}
  # F16 (merge point 40): the standard entrance window.
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_xd18.blv}
  - play_lua: {source: "wait(2); for _ = 1, 3 do if not close() then break end end"}
  - walk_to: {x: 1984, y: -3560, z: 0, radius: 48, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  # D-82 point 5: no member down before the rounds (each reads every member's class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 68 before the class table: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before the class table (D-82 5): ' .. table.concat(down, ' | ')) end"}

  # dragon: Dragon -> GreatWyrm. Scaldrith (Q-C25): "Promotion".
  # Round 1: Dragon GreatWyrm Peasant Knight -> GreatWyrm GreatWyrm Peasant Knight.
  - lua_event: {source: "if not SetPlayerClass(0, 'Dragon') then error('SetPlayerClass(0, Dragon)') end if not SetPlayerClass(1, 'GreatWyrm') then error('SetPlayerClass(1, GreatWyrm)') end if not SetPlayerClass(2, 'Peasant') then error('SetPlayerClass(2, Peasant)') end if not SetPlayerClass(3, 'Knight') then error('SetPlayerClass(3, Knight)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES dragon round 1 set: " .. c) if c ~= "Dragon GreatWyrm Peasant Knight" then error("expected Dragon GreatWyrm Peasant Knight, got " .. c) end'}
  - play_lua: {source: "click(18); wait(0.8)"}
  - assert: {dialog: {active: true, source_id: 5702, action_label_present: "Promotion"}}
  - select_topic: {match_label: "Promotion"}
  - assert: {dialog: {active: true, text_contains: "Another dragon who reads? The office is becoming a library. Rise, Great Wyrm."}}
  - play_lua: {source: 'local c = classes() log("CLASSES dragon round 1 promoted: " .. c) if c ~= "GreatWyrm GreatWyrm Peasant Knight" then error("expected GreatWyrm GreatWyrm Peasant Knight, got " .. c) end'}
  # Nobody left: asked again, the line for a party with nobody to promote.
  - select_topic: {match_label: "Promotion"}
  - assert: {dialog: {active: true, text_contains: "Great Wyrms are made of dragons, and you have none with you."}}
  - play_lua: {source: 'local c = classes() log("CLASSES dragon round 1 again: " .. c) if c ~= "GreatWyrm GreatWyrm Peasant Knight" then error("expected GreatWyrm GreatWyrm Peasant Knight, got " .. c) end'}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Round 2: GreatWyrm Peasant Knight Sorcerer, none of them eligible: the promote is not offered.
  - lua_event: {source: "if not SetPlayerClass(0, 'GreatWyrm') then error('SetPlayerClass(0, GreatWyrm)') end if not SetPlayerClass(1, 'Peasant') then error('SetPlayerClass(1, Peasant)') end if not SetPlayerClass(2, 'Knight') then error('SetPlayerClass(2, Knight)') end if not SetPlayerClass(3, 'Sorcerer') then error('SetPlayerClass(3, Sorcerer)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES dragon round 2 set: " .. c) if c ~= "GreatWyrm Peasant Knight Sorcerer" then error("expected GreatWyrm Peasant Knight Sorcerer, got " .. c) end'}
  - play_lua: {source: "click(18); wait(0.8)"}
  - assert: {dialog: {active: true, source_id: 5702, action_label_present: "Promotion"}}
  - select_topic: {match_label: "Promotion"}
  - assert: {dialog: {active: true, text_contains: "Great Wyrms are made of dragons, and you have none with you."}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - play_lua: {source: 'local c = classes() log("CLASSES dragon round 2 kept: " .. c) if c ~= "GreatWyrm Peasant Knight Sorcerer" then error("expected GreatWyrm Peasant Knight Sorcerer, got " .. c) end'}

  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - walk_to: {x: 140, y: -3072, z: 0, radius: 64, clear_hostiles: 1500, timeout_seconds: 40, close_dialogs: true}
  - play_lua: {source: "click(11); wait(0.5)"}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_x7.odm}
  - save_game: {name: "P68 class table", path: output/playthrough/xeen/promotions/checkpoints/68_scaldrith_table.oysav}
