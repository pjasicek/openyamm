# Xeen promotion playthrough 62, the class table (README "What is checked" 5): X3: Du Monay's Nosferatu (Q-C7), after 61.
# Written by class_table.py (do not edit by hand): per row of Xeen.Promotions, round 1 gives the members the
# row's "from" classes and classes it must leave alone (a logged test setup through SetPlayerClass), picks the
# promote and asserts every class; round 2 has nobody eligible and the promote is not offered. The party's own
# classes are put back at the end.
#   python3 tests/playthrough/xeen/promotions/run.py 62
id: xeen.promotions.62_dumonay_table
title: "Xeen promotions 62: the class table, X3"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/61_nightshadow_count.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_x3.odm, qbit_set: [112143]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end"}
  # The party's own classes, kept for the end (class ids in global variables; the names remembered for the check).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}

  # D-82 point 5: no member down before the rounds (each reads every member's class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 62 before the class table: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before the class table (D-82 5): ' .. table.concat(down, ' | ')) end"}

  # vampire: Vampire -> Nosferatu. Du Monay (Q-C7): "Nosferatu".
  # Round 1: Vampire Nosferatu Peasant Knight -> Nosferatu Nosferatu Peasant Knight.
  - lua_event: {source: "if not SetPlayerClass(0, 'Vampire') then error('SetPlayerClass(0, Vampire)') end if not SetPlayerClass(1, 'Nosferatu') then error('SetPlayerClass(1, Nosferatu)') end if not SetPlayerClass(2, 'Peasant') then error('SetPlayerClass(2, Peasant)') end if not SetPlayerClass(3, 'Knight') then error('SetPlayerClass(3, Knight)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES vampire round 1 set: " .. c) if c ~= "Vampire Nosferatu Peasant Knight" then error("expected Vampire Nosferatu Peasant Knight, got " .. c) end'}
  - set_pose: {map: xeen_x3.odm, x: 19204, y: -1920, z: 960, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - press_interact: {expect: {kind: event_target}}
  - assert: {dialog: {active: true, source_id: 4205, action_label_present: "Nosferatu"}}
  - select_topic: {match_label: "Nosferatu"}
  - assert: {dialog: {active: true, text_contains: "Rise, Nosferatu."}}
  - play_lua: {source: 'local c = classes() log("CLASSES vampire round 1 promoted: " .. c) if c ~= "Nosferatu Nosferatu Peasant Knight" then error("expected Nosferatu Nosferatu Peasant Knight, got " .. c) end'}
  # Nobody left: the promote is no longer offered.
  - assert: {dialog: {active: true, action_label_absent: "Nosferatu"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Round 2: Nosferatu Peasant Knight Sorcerer, none of them eligible: the promote is not offered.
  - lua_event: {source: "if not SetPlayerClass(0, 'Nosferatu') then error('SetPlayerClass(0, Nosferatu)') end if not SetPlayerClass(1, 'Peasant') then error('SetPlayerClass(1, Peasant)') end if not SetPlayerClass(2, 'Knight') then error('SetPlayerClass(2, Knight)') end if not SetPlayerClass(3, 'Sorcerer') then error('SetPlayerClass(3, Sorcerer)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES vampire round 2 set: " .. c) if c ~= "Nosferatu Peasant Knight Sorcerer" then error("expected Nosferatu Peasant Knight Sorcerer, got " .. c) end'}
  - set_pose: {map: xeen_x3.odm, x: 19204, y: -1920, z: 960, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - press_interact: {expect: {kind: event_target}}
  - assert: {dialog: {active: true, source_id: 4205, action_label_absent: "Nosferatu"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - play_lua: {source: 'local c = classes() log("CLASSES vampire round 2 kept: " .. c) if c ~= "Nosferatu Peasant Knight Sorcerer" then error("expected Nosferatu Peasant Knight Sorcerer, got " .. c) end'}

  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - save_game: {name: "P62 class table", path: output/playthrough/xeen/promotions/checkpoints/62_dumonay_table.oysav}
