# Xeen promotion playthrough 55, block G (tier 2, Dark): Q-D19's inner circle, the Master Thief's promotion. From a
# copy of the main chain's 55 (D1 before Castle Kalindra; Q-D19 done: the gongs rung, the ledger read, Thaddeus paid;
# the Master Thief only greeted, the party has no Rogue or Warrior Mage). East off D1's edge to Sprite Forest; the
# Southern Tower's door (D2 event 20, the key kept); DD-06 walked again by main 55's route (the gong doors stay open:
# asserted) to the counting room. The Master Thief (actor 29): Inner circle with nobody of his trade: his refusal,
# inner_circle stays clear (README check 3). One member is given the Rogue class by a logged test setup (SetPlayerClass,
# as the class table): Inner circle again: inner_circle set, the Rogue an Assassin, the Crusader, Wizard and Ranger
# Lord kept, nothing paid; the topic is gone and his later topic New members (T2-LATER) is not offered with nobody
# eligible. The party's classes put back. The checkpoint is
# saved in the counting room (the table, 57, starts there and walks out).
# Quest logic: source/quests/q-d19.yml, t2-later.yml. Route: main 55 (tests/playthrough/xeen/55_southern_tower.yml).
#   python3 tests/playthrough/xeen/promotions/run.py 55
id: xeen.promotions.55_inner_circle
title: "Xeen promotions 55: the Master Thief's inner circle (Q-D19), a Rogue an Assassin"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/00_main_55.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d1.odm, qbit_set: [113381, 113386]}
  - assert: {qbit_clear: [113384, 113385]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end; if classes() ~= 'Cavalier Crusader Wizard RangerLord' then error('party: ' .. classes()) end"}
  # East off D1's edge into Sprite Forest; the Southern Tower's door (D2 event 20).
  - set_pose: {map: xeen_d1.odm, x: 21504, y: 2048, z: 1088, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 24064, y: 2048, z: 1088, z_tolerance: 600, radius: 128, timeout_seconds: 60, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  # D2's west edge: a Dark Sprite spawn about 4,900 inside it (D-82 point 7) Stones a member within a second or two
  # (the reload run, A3-promo session 6): fought on arrival, as a player would (D-82 3).
  - clear_hostiles: {radius: 6000}
  - assert: {map: xeen_d2.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - set_pose: {map: xeen_d2.odm, x: 15872, y: -7424, z: 1056, yaw: -1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - play_lua: {source: "click(20)"}
  # F16: the standard entrance window.
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_dd06.blv}
  - play_lua: {source: "wait(2); for _ = 1, 3 do if not close() then break end end"}
  # The tapestry hall, the kennel and its gate, the first gong's stair (open since main 55).
  - walk_to: {x: 512, y: 1300, z: 0, radius: 64, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 512, y: 700, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1000, y: 300, z: 0, radius: 48, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 1000, y: -320, z: 0, radius: 48, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 512, y: -800, z: 0, radius: 64, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 512, y: -1500, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - walk_to: {x: -768, y: -1300, z: 0, radius: 48, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "if door_state(9) ~= 'open' then open_door(24, 9) end"}
  - walk_to: {x: -768, y: -700, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1000, y: 300, z: 0, radius: 64, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1150, y: 250, z: 0, radius: 48, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "if door_state(4) ~= 'open' then error('stair door 1 shut again: ' .. door_state(4)) end"}
  # Up to the den; past the treasury to the second gong's stair (open).
  - walk_to: {x: -1150, y: 768, z: 0, radius: 48, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1640, y: 768, z: 0, radius: 64, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1760, y: 500, z: 0, radius: 64, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1760, y: -1700, z: 640, z_tolerance: 40, radius: 64, clear_hostiles: 1200, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: -900, y: -1792, z: 640, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 0, y: -1600, z: 640, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 440, y: -1600, z: 640, radius: 48, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "if door_state(10) ~= 'open' then open_door(33, 10) end"}
  - walk_to: {x: 900, y: -1600, z: 640, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 960, y: -1300, z: 640, radius: 64, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 900, y: -600, z: 640, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1150, y: -420, z: 640, radius: 48, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "if door_state(5) ~= 'open' then error('stair door 2 shut again: ' .. door_state(5)) end"}
  # Up to the practice floor, the practice hall and the third gong's stair (open).
  - walk_to: {x: 1150, y: -768, z: 640, radius: 48, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 1600, y: -768, z: 640, radius: 64, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 1760, y: -500, z: 640, radius: 64, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 1760, y: 1750, z: 1280, z_tolerance: 40, radius: 64, clear_hostiles: 1200, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 800, y: 1792, z: 1280, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1024, y: 900, z: 1280, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1024, y: -512, z: 1280, radius: 48, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "if door_state(12) ~= 'open' then open_door(44, 12) end"}
  - walk_to: {x: 300, y: -512, z: 1280, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 100, y: 640, z: 1280, radius: 64, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -800, y: 640, z: 1280, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1150, y: 420, z: 1280, radius: 48, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "if door_state(6) ~= 'open' then error('stair door 3 shut again: ' .. door_state(6)) end"}
  # Up to the top; the counting room.
  - walk_to: {x: -1150, y: 768, z: 1280, radius: 48, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1640, y: 768, z: 1280, radius: 64, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1760, y: 500, z: 1280, radius: 64, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1760, y: -1700, z: 1920, z_tolerance: 40, radius: 64, clear_hostiles: 1200, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: -900, y: -1792, z: 1920, radius: 64, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -896, y: -1400, z: 1920, radius: 64, clear_hostiles: 1200, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "if door_state(3) ~= 'open' then open_door(16, 3) end"}
  - walk_to: {x: -896, y: -880, z: 1920, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -256, y: -560, z: 1920, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -256, y: -200, z: 1920, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - assert: {actor_count: {monster_id: 11115, hostile: true, max: 0}}
  # The Master Thief (actor 29): nobody of his trade, his refusal.
  - interact_actor: {actor_index: 29}
  - advance_runtime: {seconds: 0.6, present_dialogs: true}
  - assert: {dialog: {active: true, source_id: 5109, action_label_present: "Promotion"}}
  - select_topic: {action_id: 44952, match_label: "Promotion"}
  - assert: {dialog: {active: true, text_contains: "Nobody in your party has the hands for my trade."}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; if qbit(113385) then error('inner_circle set with nobody promoted') end"}
  # The party's own classes, kept for the end; member 0 a Rogue (a logged test setup: the party has no Rogue).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}
  # D-82 point 5: no member down before the Master Thief's promotion (it reads every member's experience or class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 55 before the Master Thief\\'s promotion: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before the Master Thief\\'s promotion (D-82 5): ' .. table.concat(down, ' | ')) end"}
  - lua_event: {source: "if not SetPlayerClass(0, 'Rogue') then error('SetPlayerClass(0, Rogue)') end"}
  - play_lua: {source: "log('CLASSES test setup: ' .. classes()); if classes() ~= 'Rogue Crusader Wizard RangerLord' then error(classes()) end"}
  # Inner circle: the Rogue rises an Assassin; nothing paid (Thaddeus is the hand-in).
  - play_lua: {source: "remember('xp', experience(0)); remember('gold', gold())"}
  - interact_actor: {actor_index: 29}
  - advance_runtime: {seconds: 0.6, present_dialogs: true}
  - assert: {dialog: {active: true, source_id: 5109}}
  - select_topic: {action_id: 44952, match_label: "Promotion"}
  - assert: {dialog: {active: true, text_contains: "Join the inner circle. No paperwork. Well, a ledger."}}
  - play_lua: {source: "if classes() ~= 'Assassin Crusader Wizard RangerLord' then error('Q-D19 inner circle: ' .. classes()) end; if experience(0) ~= tonumber(recall('xp')) or gold() ~= tonumber(recall('gold')) then error('the inner circle paid') end; log('Q-D19 inner circle: ' .. classes())"}
  - assert: {qbit_set: [113385]}
  - assert: {dialog: {active: true, action_label_absent: "Promotion"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - save_game: {name: "P55 inner circle", path: output/playthrough/xeen/promotions/checkpoints/55_inner_circle.oysav}
