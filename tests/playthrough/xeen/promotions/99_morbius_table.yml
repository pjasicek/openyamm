# Xeen promotion playthrough 99, the class table (README "What is checked" 5): D6: Master Morbius's Sandro (Q-D23's later path, D-74 5), after 89.
# Written by class_table.py (do not edit by hand): per row of Xeen.Promotions, round 1 gives the members the
# row's "from" classes and classes it must leave alone (a logged test setup through SetPlayerClass), picks the
# promote and asserts every class; round 2 has nobody eligible and the promote is not offered. The party's own
# classes are put back at the end.
#   python3 tests/playthrough/xeen/promotions/run.py 99
id: xeen.promotions.99_morbius_table
title: "Xeen promotions 99: the class table, D6"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/89_sandros_heart.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d6.odm, qbit_set: [113462]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end"}
  # The party's own classes, kept for the end (class ids in global variables; the names remembered for the check).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}

  # D-82 point 5: no member down before the rounds (each reads every member's class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 99 before the class table: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before the class table (D-82 5): ' .. table.concat(down, ' | ')) end"}

  # sandro: Priest -> PriestDark, Wizard -> Lich, Necromancer -> Lich. Master Morbius (Q-D23 released, D-74 5): "Sandro".
  # Round 1: Priest Wizard Necromancer PriestLight -> PriestDark Lich Lich PriestLight.
  - lua_event: {source: "if not SetPlayerClass(0, 'Priest') then error('SetPlayerClass(0, Priest)') end if not SetPlayerClass(1, 'Wizard') then error('SetPlayerClass(1, Wizard)') end if not SetPlayerClass(2, 'Necromancer') then error('SetPlayerClass(2, Necromancer)') end if not SetPlayerClass(3, 'PriestLight') then error('SetPlayerClass(3, PriestLight)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES sandro round 1 set: " .. c) if c ~= "Priest Wizard Necromancer PriestLight" then error("expected Priest Wizard Necromancer PriestLight, got " .. c) end'}
  - set_pose: {map: xeen_d6.odm, x: 15156, y: -10496, z: 1664, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - press_interact: {expect: {kind: event_target}}
  - assert: {dialog: {active: true, source_id: 5506, action_label_present: "Sandro"}}
  - select_topic: {match_label: "Sandro"}
  - assert: {dialog: {active: true, text_contains: "A Priest, a Wizard or a Necromancer who wants to walk where he walked: sit."}}
  - play_lua: {source: 'local c = classes() log("CLASSES sandro round 1 promoted: " .. c) if c ~= "PriestDark Lich Lich PriestLight" then error("expected PriestDark Lich Lich PriestLight, got " .. c) end'}
  # Nobody left: asked again, the line for a party with nobody to promote.
  - select_topic: {match_label: "Sandro"}
  - assert: {dialog: {active: true, text_contains: "Sandro is at rest. The House has his notes"}}
  - play_lua: {source: 'local c = classes() log("CLASSES sandro round 1 again: " .. c) if c ~= "PriestDark Lich Lich PriestLight" then error("expected PriestDark Lich Lich PriestLight, got " .. c) end'}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Round 2: PriestLight ArchMage PriestDark Lich, none of them eligible: the promote is not offered.
  - lua_event: {source: "if not SetPlayerClass(0, 'PriestLight') then error('SetPlayerClass(0, PriestLight)') end if not SetPlayerClass(1, 'ArchMage') then error('SetPlayerClass(1, ArchMage)') end if not SetPlayerClass(2, 'PriestDark') then error('SetPlayerClass(2, PriestDark)') end if not SetPlayerClass(3, 'Lich') then error('SetPlayerClass(3, Lich)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES sandro round 2 set: " .. c) if c ~= "PriestLight ArchMage PriestDark Lich" then error("expected PriestLight ArchMage PriestDark Lich, got " .. c) end'}
  - set_pose: {map: xeen_d6.odm, x: 15156, y: -10496, z: 1664, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - press_interact: {expect: {kind: event_target}}
  - assert: {dialog: {active: true, source_id: 5506, action_label_present: "Sandro"}}
  - select_topic: {match_label: "Sandro"}
  - assert: {dialog: {active: true, text_contains: "Sandro is at rest. The House has his notes"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - play_lua: {source: 'local c = classes() log("CLASSES sandro round 2 kept: " .. c) if c ~= "PriestLight ArchMage PriestDark Lich" then error("expected PriestLight ArchMage PriestDark Lich, got " .. c) end'}

  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - save_game: {name: "P99 class table", path: output/playthrough/xeen/promotions/checkpoints/99_morbius_table.oysav}
