# Xeen promotion playthrough 03, the class table (README "What is checked" 5): X2: Barok's Promotion (T1-B) and Danulf's Patriarch (Q-C17), after segment 17.
# Written by class_table.py (do not edit by hand): per row of Xeen.Promotions, round 1 gives the members the
# row's "from" classes and classes it must leave alone (a logged test setup through SetPlayerClass), picks the
# promote and asserts every class; round 2 has nobody eligible and the promote is not offered. The party's own
# classes are put back at the end.
#   python3 tests/playthrough/xeen/promotions/run.py 03
id: xeen.promotions.03_barok_danulf_table
title: "Xeen promotions 03: the class table, X2"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/00_main_17.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_x2.odm, qbit_set: [110204]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end"}
  # The party's own classes, kept for the end (class ids in global variables; the names remembered for the check).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}

  # D-82 point 5: no member down before the rounds (each reads every member's class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 03 before the class table: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before the class table (D-82 5): ' .. table.concat(down, ' | ')) end"}

  # pendant: Sorcerer -> Wizard, Archer -> WarriorMage. Barok (T1-B): "Promotion".
  # Round 1: Sorcerer Archer Wizard WarriorMage -> Wizard WarriorMage Wizard WarriorMage.
  - lua_event: {source: "if not SetPlayerClass(0, 'Sorcerer') then error('SetPlayerClass(0, Sorcerer)') end if not SetPlayerClass(1, 'Archer') then error('SetPlayerClass(1, Archer)') end if not SetPlayerClass(2, 'Wizard') then error('SetPlayerClass(2, Wizard)') end if not SetPlayerClass(3, 'WarriorMage') then error('SetPlayerClass(3, WarriorMage)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES pendant round 1 set: " .. c) if c ~= "Sorcerer Archer Wizard WarriorMage" then error("expected Sorcerer Archer Wizard WarriorMage, got " .. c) end'}
  - execute_event: {id: 1}
  - assert: {dialog: {active: true, source_id: 4151, action_label_present: "Promotion"}}
  - select_topic: {match_label: "Promotion"}
  - assert: {dialog: {active: true, text_contains: "Sorcerers rise as Wizards"}}
  - play_lua: {source: 'local c = classes() log("CLASSES pendant round 1 promoted: " .. c) if c ~= "Wizard WarriorMage Wizard WarriorMage" then error("expected Wizard WarriorMage Wizard WarriorMage, got " .. c) end'}
  # Nobody left: the promote is no longer offered.
  - assert: {dialog: {active: true, action_label_absent: "Promotion"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Round 2: Wizard WarriorMage Peasant Knight, none of them eligible: the promote is not offered.
  - lua_event: {source: "if not SetPlayerClass(0, 'Wizard') then error('SetPlayerClass(0, Wizard)') end if not SetPlayerClass(1, 'WarriorMage') then error('SetPlayerClass(1, WarriorMage)') end if not SetPlayerClass(2, 'Peasant') then error('SetPlayerClass(2, Peasant)') end if not SetPlayerClass(3, 'Knight') then error('SetPlayerClass(3, Knight)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES pendant round 2 set: " .. c) if c ~= "Wizard WarriorMage Peasant Knight" then error("expected Wizard WarriorMage Peasant Knight, got " .. c) end'}
  - execute_event: {id: 1}
  - assert: {dialog: {active: true, source_id: 4151, action_label_absent: "Promotion"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - play_lua: {source: 'local c = classes() log("CLASSES pendant round 2 kept: " .. c) if c ~= "Wizard WarriorMage Peasant Knight" then error("expected Wizard WarriorMage Peasant Knight, got " .. c) end'}

  # elf: DarkElf -> Patriarch. Danulf the Faery King (Q-C17): "Patriarch".
  # Round 1: DarkElf Patriarch Peasant Knight -> Patriarch Patriarch Peasant Knight.
  - lua_event: {source: "if not SetPlayerClass(0, 'DarkElf') then error('SetPlayerClass(0, DarkElf)') end if not SetPlayerClass(1, 'Patriarch') then error('SetPlayerClass(1, Patriarch)') end if not SetPlayerClass(2, 'Peasant') then error('SetPlayerClass(2, Peasant)') end if not SetPlayerClass(3, 'Knight') then error('SetPlayerClass(3, Knight)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES elf round 1 set: " .. c) if c ~= "DarkElf Patriarch Peasant Knight" then error("expected DarkElf Patriarch Peasant Knight, got " .. c) end'}
  - set_pose: {map: xeen_x2.odm, x: -3277, y: -8909, z: 1044, yaw: -2.16, pitch: 0.0}
  - clear_hostiles: {radius: 3000}
  - interact_actor: {actor_index: 51}
  - assert: {dialog: {active: true, source_id: 4154, action_label_present: "Patriarch"}}
  - select_topic: {match_label: "Patriarch"}
  - assert: {dialog: {active: true, text_contains: "Rise, Patriarch."}}
  - play_lua: {source: 'local c = classes() log("CLASSES elf round 1 promoted: " .. c) if c ~= "Patriarch Patriarch Peasant Knight" then error("expected Patriarch Patriarch Peasant Knight, got " .. c) end'}
  # Nobody left: the promote is no longer offered.
  - assert: {dialog: {active: true, action_label_absent: "Patriarch"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Round 2: Patriarch Peasant Knight Sorcerer, none of them eligible: the promote is not offered.
  - lua_event: {source: "if not SetPlayerClass(0, 'Patriarch') then error('SetPlayerClass(0, Patriarch)') end if not SetPlayerClass(1, 'Peasant') then error('SetPlayerClass(1, Peasant)') end if not SetPlayerClass(2, 'Knight') then error('SetPlayerClass(2, Knight)') end if not SetPlayerClass(3, 'Sorcerer') then error('SetPlayerClass(3, Sorcerer)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES elf round 2 set: " .. c) if c ~= "Patriarch Peasant Knight Sorcerer" then error("expected Patriarch Peasant Knight Sorcerer, got " .. c) end'}
  - set_pose: {map: xeen_x2.odm, x: -3277, y: -8909, z: 1044, yaw: -2.16, pitch: 0.0}
  - clear_hostiles: {radius: 3000}
  - interact_actor: {actor_index: 51}
  - assert: {dialog: {active: true, source_id: 4154, action_label_absent: "Patriarch"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - play_lua: {source: 'local c = classes() log("CLASSES elf round 2 kept: " .. c) if c ~= "Patriarch Peasant Knight Sorcerer" then error("expected Patriarch Peasant Knight Sorcerer, got " .. c) end'}

  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - save_game: {name: "P03 class table", path: output/playthrough/xeen/promotions/checkpoints/03_barok_danulf_table.oysav}
