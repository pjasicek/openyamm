# Xeen promotion playthrough 53, the class table (README "What is checked" 5): D4: Leafpoint's Civilized ones (T2-LEAFPOINT), after 51.
# Written by class_table.py (do not edit by hand): per row of Xeen.Promotions, round 1 gives the members the
# row's "from" classes and classes it must leave alone (a logged test setup through SetPlayerClass), picks the
# promote and asserts every class; round 2 has nobody eligible and the promote is not offered. The party's own
# classes are put back at the end.
#   python3 tests/playthrough/xeen/promotions/run.py 53
id: xeen.promotions.53_leafpoint_table
title: "Xeen promotions 53: the class table, D4"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/51_leafpoint.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d4.odm, qbit_set: [114560]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end"}
  # The party's own classes, kept for the end (class ids in global variables; the names remembered for the check).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}

  # D-82 point 5: no member down before the rounds (each reads every member's class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 53 before the class table: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before the class table (D-82 5): ' .. table.concat(down, ' | ')) end"}

  # leafpoint: GreatDruid -> ArchDruid. Leafpoint (T2-LEAFPOINT): "Promotion".
  # Round 1: GreatDruid Warlock ArchDruid Druid -> ArchDruid Warlock ArchDruid Druid.
  - lua_event: {source: "if not SetPlayerClass(0, 'GreatDruid') then error('SetPlayerClass(0, GreatDruid)') end if not SetPlayerClass(1, 'Warlock') then error('SetPlayerClass(1, Warlock)') end if not SetPlayerClass(2, 'ArchDruid') then error('SetPlayerClass(2, ArchDruid)') end if not SetPlayerClass(3, 'Druid') then error('SetPlayerClass(3, Druid)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES leafpoint round 1 set: " .. c) if c ~= "GreatDruid Warlock ArchDruid Druid" then error("expected GreatDruid Warlock ArchDruid Druid, got " .. c) end'}
  - set_pose: {map: xeen_d4.odm, x: -11264, y: 819, z: 1504, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - interact_actor: {actor_index: 22}
  - assert: {dialog: {active: true, source_id: 5319, action_label_present: "Promotion"}}
  - select_topic: {match_label: "Promotion"}
  - assert: {dialog: {active: true, text_contains: "Another druid who listens to trees."}}
  - play_lua: {source: 'local c = classes() log("CLASSES leafpoint round 1 promoted: " .. c) if c ~= "ArchDruid Warlock ArchDruid Druid" then error("expected ArchDruid Warlock ArchDruid Druid, got " .. c) end'}
  # Nobody left: asked again, the line for a party with nobody to promote.
  - select_topic: {match_label: "Promotion"}
  - assert: {dialog: {active: true, text_contains: "The wind says Thickbark has grown a new ring"}}
  - play_lua: {source: 'local c = classes() log("CLASSES leafpoint round 1 again: " .. c) if c ~= "ArchDruid Warlock ArchDruid Druid" then error("expected ArchDruid Warlock ArchDruid Druid, got " .. c) end'}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Round 2: Warlock ArchDruid Druid Peasant, none of them eligible: the promote is not offered.
  - lua_event: {source: "if not SetPlayerClass(0, 'Warlock') then error('SetPlayerClass(0, Warlock)') end if not SetPlayerClass(1, 'ArchDruid') then error('SetPlayerClass(1, ArchDruid)') end if not SetPlayerClass(2, 'Druid') then error('SetPlayerClass(2, Druid)') end if not SetPlayerClass(3, 'Peasant') then error('SetPlayerClass(3, Peasant)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES leafpoint round 2 set: " .. c) if c ~= "Warlock ArchDruid Druid Peasant" then error("expected Warlock ArchDruid Druid Peasant, got " .. c) end'}
  - set_pose: {map: xeen_d4.odm, x: -11264, y: 819, z: 1504, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - interact_actor: {actor_index: 22}
  - assert: {dialog: {active: true, source_id: 5319, action_label_present: "Promotion"}}
  - select_topic: {match_label: "Promotion"}
  - assert: {dialog: {active: true, text_contains: "The wind says Thickbark has grown a new ring"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - play_lua: {source: 'local c = classes() log("CLASSES leafpoint round 2 kept: " .. c) if c ~= "Warlock ArchDruid Druid Peasant" then error("expected Warlock ArchDruid Druid Peasant, got " .. c) end'}

  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - save_game: {name: "P53 class table", path: output/playthrough/xeen/promotions/checkpoints/53_leafpoint_table.oysav}
