# Xeen promotion playthrough 66, the class table (README "What is checked" 5): DD-12: the horned throne again (Q-D25's later Minotaur), after 65.
# Written by class_table.py (do not edit by hand): per row of Xeen.Promotions, round 1 gives the members the
# row's "from" classes and classes it must leave alone (a logged test setup through SetPlayerClass), picks the
# promote and asserts every class; round 2 has nobody eligible and the promote is not offered. The party's own
# classes are put back at the end.
#   python3 tests/playthrough/xeen/promotions/run.py 66
id: xeen.promotions.66_horned_throne_table
title: "Xeen promotions 66: the class table, DD-12"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/65_horned_throne.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_dd12.blv, qbit_set: [113500]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end"}
  # The party's own classes, kept for the end (class ids in global variables; the names remembered for the check).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}

  # D-82 point 5: no member down before the rounds (each reads every member's class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 66 before the class table: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before the class table (D-82 5): ' .. table.concat(down, ' | ')) end"}

  # minotaur: Minotaur -> MinotaurLord. the horned throne (Q-D25's later Minotaur) (a map hook).
  # Round 1: Minotaur MinotaurLord Peasant Knight -> MinotaurLord MinotaurLord Peasant Knight.
  - lua_event: {source: "if not SetPlayerClass(0, 'Minotaur') then error('SetPlayerClass(0, Minotaur)') end if not SetPlayerClass(1, 'MinotaurLord') then error('SetPlayerClass(1, MinotaurLord)') end if not SetPlayerClass(2, 'Peasant') then error('SetPlayerClass(2, Peasant)') end if not SetPlayerClass(3, 'Knight') then error('SetPlayerClass(3, Knight)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES minotaur round 1 set: " .. c) if c ~= "Minotaur MinotaurLord Peasant Knight" then error("expected Minotaur MinotaurLord Peasant Knight, got " .. c) end'}
  - play_lua: {source: "click(90); wait(0.5)"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[The Minotaur sits, and rises a lord of the maze.]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: 'local c = classes() log("CLASSES minotaur round 1 promoted: " .. c) if c ~= "MinotaurLord MinotaurLord Peasant Knight" then error("expected MinotaurLord MinotaurLord Peasant Knight, got " .. c) end'}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Nobody left: used again, the line for a party with nobody to promote.
  - play_lua: {source: "click(90); wait(0.5)"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[anyone else who sits gets a sore back]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: 'local c = classes() log("CLASSES minotaur round 1 again: " .. c) if c ~= "MinotaurLord MinotaurLord Peasant Knight" then error("expected MinotaurLord MinotaurLord Peasant Knight, got " .. c) end'}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Round 2: MinotaurLord Peasant Knight Sorcerer, none of them eligible: nobody is promoted.
  - lua_event: {source: "if not SetPlayerClass(0, 'MinotaurLord') then error('SetPlayerClass(0, MinotaurLord)') end if not SetPlayerClass(1, 'Peasant') then error('SetPlayerClass(1, Peasant)') end if not SetPlayerClass(2, 'Knight') then error('SetPlayerClass(2, Knight)') end if not SetPlayerClass(3, 'Sorcerer') then error('SetPlayerClass(3, Sorcerer)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES minotaur round 2 set: " .. c) if c ~= "MinotaurLord Peasant Knight Sorcerer" then error("expected MinotaurLord Peasant Knight Sorcerer, got " .. c) end'}
  - play_lua: {source: "click(90); wait(0.5)"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[anyone else who sits gets a sore back]], 1, true) then error("status line: " .. s) end
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - play_lua: {source: 'local c = classes() log("CLASSES minotaur round 2 kept: " .. c) if c ~= "MinotaurLord Peasant Knight Sorcerer" then error("expected MinotaurLord Peasant Knight Sorcerer, got " .. c) end'}

  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - save_game: {name: "P66 class table", path: output/playthrough/xeen/promotions/checkpoints/66_horned_throne_table.oysav}
