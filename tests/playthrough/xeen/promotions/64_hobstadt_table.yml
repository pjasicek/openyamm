# Xeen promotion playthrough 64, the class table (README "What is checked" 5): DD-11C: Hobstadt's Sacrifice one (Q-D13's tribute, D-74 3), after 63; walked in and out.
# Written by class_table.py (do not edit by hand): per row of Xeen.Promotions, round 1 gives the members the
# row's "from" classes and classes it must leave alone (a logged test setup through SetPlayerClass), picks the
# promote and asserts every class; round 2 has nobody eligible and the promote is not offered. The party's own
# classes are put back at the end.
#   python3 tests/playthrough/xeen/promotions/run.py 64
id: xeen.promotions.64_hobstadt_table
title: "Xeen promotions 64: the class table, DD-11C"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/63_hobstadt_tribute.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d2.odm, qbit_set: [113262, 113266]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end"}
  # The party's own classes, kept for the end (class ids in global variables; the names remembered for the check).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}

  - set_pose: {map: xeen_d2.odm, x: 1536, y: -17408, z: 928, yaw: 0.0, pitch: 0.0}
  - clear_hostiles: {radius: 3000}
  - advance_runtime: {seconds: 0.5}
  - play_lua: {source: "click(34)"}
  # F16: the standard entrance window.
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_dd11c.blv}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end wait(0.3) end; wait(2); close()"}
  - walk_to: {x: 960, y: 0, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "wait(1); close()"}
  - walk_to: {x: 2300, y: 0, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 3000, y: 120, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # D-82 point 5: no member down before the rounds (each reads every member's class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 64 before the class table: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before the class table (D-82 5): ' .. table.concat(down, ' | ')) end"}

  # troll: Troll -> WarTroll. Hobstadt (Q-D13's tribute, D-74 3): "Sacrifice one".
  # Round 1: Troll WarTroll Peasant Knight -> WarTroll WarTroll Peasant Knight.
  - lua_event: {source: "if not SetPlayerClass(0, 'Troll') then error('SetPlayerClass(0, Troll)') end if not SetPlayerClass(1, 'WarTroll') then error('SetPlayerClass(1, WarTroll)') end if not SetPlayerClass(2, 'Peasant') then error('SetPlayerClass(2, Peasant)') end if not SetPlayerClass(3, 'Knight') then error('SetPlayerClass(3, Knight)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES troll round 1 set: " .. c) if c ~= "Troll WarTroll Peasant Knight" then error("expected Troll WarTroll Peasant Knight, got " .. c) end'}
  - interact_actor: {actor_index: 12}
  - advance_runtime: {seconds: 0.6, present_dialogs: true}
  - assert: {dialog: {active: true, source_id: 5110, action_label_present: "Sacrifice one"}}
  - select_topic: {match_label: "Sacrifice one"}
  - assert: {dialog: {active: true, text_contains: "Another troll? Hobstadt take him too."}}
  - play_lua: {source: 'local c = classes() log("CLASSES troll round 1 promoted: " .. c) if c ~= "WarTroll WarTroll Peasant Knight" then error("expected WarTroll WarTroll Peasant Knight, got " .. c) end'}
  # Nobody left: asked again, the line for a party with nobody to promote.
  - select_topic: {match_label: "Sacrifice one"}
  - assert: {dialog: {active: true, text_contains: "Hobstadt has his War Troll. Go where you like."}}
  - play_lua: {source: 'local c = classes() log("CLASSES troll round 1 again: " .. c) if c ~= "WarTroll WarTroll Peasant Knight" then error("expected WarTroll WarTroll Peasant Knight, got " .. c) end'}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Round 2: WarTroll Peasant Knight Sorcerer, none of them eligible: the promote is not offered.
  - lua_event: {source: "if not SetPlayerClass(0, 'WarTroll') then error('SetPlayerClass(0, WarTroll)') end if not SetPlayerClass(1, 'Peasant') then error('SetPlayerClass(1, Peasant)') end if not SetPlayerClass(2, 'Knight') then error('SetPlayerClass(2, Knight)') end if not SetPlayerClass(3, 'Sorcerer') then error('SetPlayerClass(3, Sorcerer)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES troll round 2 set: " .. c) if c ~= "WarTroll Peasant Knight Sorcerer" then error("expected WarTroll Peasant Knight Sorcerer, got " .. c) end'}
  - interact_actor: {actor_index: 12}
  - advance_runtime: {seconds: 0.6, present_dialogs: true}
  - assert: {dialog: {active: true, source_id: 5110, action_label_present: "Sacrifice one"}}
  - select_topic: {match_label: "Sacrifice one"}
  - assert: {dialog: {active: true, text_contains: "Hobstadt has his War Troll. Go where you like."}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - play_lua: {source: 'local c = classes() log("CLASSES troll round 2 kept: " .. c) if c ~= "WarTroll Peasant Knight Sorcerer" then error("expected WarTroll Peasant Knight Sorcerer, got " .. c) end'}

  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - walk_to: {x: 2300, y: 0, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 960, y: 0, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -300, y: 0, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1650, y: 0, z: 340, z_tolerance: 60, radius: 64, timeout_seconds: 40, close_dialogs: true}
  - play_lua: {source: "click(12); wait(0.5)"}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d2.odm}
  - save_game: {name: "P64 class table", path: output/playthrough/xeen/promotions/checkpoints/64_hobstadt_table.oysav}
