# Xeen promotion playthrough 27, the class table (README "What is checked" 5): XD-22: Shinobu's The clan (T2-CLAN), after 25; out of the cellar and the pagoda.
# Written by class_table.py (do not edit by hand): per row of Xeen.Promotions, round 1 gives the members the
# row's "from" classes and classes it must leave alone (a logged test setup through SetPlayerClass), picks the
# promote and asserts every class; round 2 has nobody eligible and the promote is not offered. The party's own
# classes are put back at the end.
#   python3 tests/playthrough/xeen/promotions/run.py 27
id: xeen.promotions.27_shinobu_table
title: "Xeen promotions 27: the class table, XD-22"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/25_clan_return.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_xd22.blv, qbit_set: [114540]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end"}
  # The party's own classes, kept for the end (class ids in global variables; the names remembered for the check).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}

  # D-82 point 5: no member down before the rounds (each reads every member's class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 27 before the class table: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before the class table (D-82 5): ' .. table.concat(down, ' | ')) end"}

  # clan: Initiate -> Ninja. Shinobu (T2-CLAN): "The clan".
  # Round 1: Initiate Master Ninja Monk -> Ninja Master Ninja Monk.
  - lua_event: {source: "if not SetPlayerClass(0, 'Initiate') then error('SetPlayerClass(0, Initiate)') end if not SetPlayerClass(1, 'Master') then error('SetPlayerClass(1, Master)') end if not SetPlayerClass(2, 'Ninja') then error('SetPlayerClass(2, Ninja)') end if not SetPlayerClass(3, 'Monk') then error('SetPlayerClass(3, Monk)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES clan round 1 set: " .. c) if c ~= "Initiate Master Ninja Monk" then error("expected Initiate Master Ninja Monk, got " .. c) end'}
  - interact_actor: {actor_index: 24}
  - advance_runtime: {seconds: 0.6, present_dialogs: true}
  - assert: {dialog: {active: true, action_label_present: "The clan"}}
  - select_topic: {match_label: "The clan"}
  - assert: {dialog: {active: true, text_contains: "Another one who walks quietly? Good."}}
  - play_lua: {source: 'local c = classes() log("CLASSES clan round 1 promoted: " .. c) if c ~= "Ninja Master Ninja Monk" then error("expected Ninja Master Ninja Monk, got " .. c) end'}
  # Nobody left: asked again, the line for a party with nobody to promote.
  - select_topic: {match_label: "The clan"}
  - assert: {dialog: {active: true, text_contains: "The old monk sweeps upstairs."}}
  - play_lua: {source: 'local c = classes() log("CLASSES clan round 1 again: " .. c) if c ~= "Ninja Master Ninja Monk" then error("expected Ninja Master Ninja Monk, got " .. c) end'}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Round 2: Master Ninja Monk Peasant, none of them eligible: the promote is not offered.
  - lua_event: {source: "if not SetPlayerClass(0, 'Master') then error('SetPlayerClass(0, Master)') end if not SetPlayerClass(1, 'Ninja') then error('SetPlayerClass(1, Ninja)') end if not SetPlayerClass(2, 'Monk') then error('SetPlayerClass(2, Monk)') end if not SetPlayerClass(3, 'Peasant') then error('SetPlayerClass(3, Peasant)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES clan round 2 set: " .. c) if c ~= "Master Ninja Monk Peasant" then error("expected Master Ninja Monk Peasant, got " .. c) end'}
  - interact_actor: {actor_index: 24}
  - advance_runtime: {seconds: 0.6, present_dialogs: true}
  - assert: {dialog: {active: true, action_label_present: "The clan"}}
  - select_topic: {match_label: "The clan"}
  - assert: {dialog: {active: true, text_contains: "The old monk sweeps upstairs."}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - play_lua: {source: 'local c = classes() log("CLASSES clan round 2 kept: " .. c) if c ~= "Master Ninja Monk Peasant" then error("expected Master Ninja Monk Peasant, got " .. c) end'}

  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - walk_to: {x: 0, y: -1700, z: -448, radius: 40, timeout_seconds: 30, close_dialogs: true}
  - climb: {ladder: cellar, timeout_seconds: 40}
  - walk_to: {x: 0, y: -1350, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 0, y: -880, z: 0, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 0, y: -600, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 0, y: -120, z: 0, radius: 48, timeout_seconds: 40, close_dialogs: true}
  - execute_event: {id: 21}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_x5.odm}
  - save_game: {name: "P27 class table", path: output/playthrough/xeen/promotions/checkpoints/27_shinobu_table.oysav}
