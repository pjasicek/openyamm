# Xeen promotion playthrough 31, block D (tier 2, Light): T2-A Dimitri's Test (DD-03 at stage 3), the chain party's
# Cavalier -> Champion (README check 2). From a copy of the main chain's 59 (D1 outside Ellinger's Tower; M24 done,
# M26's stage 3: the dungeon is back). Castle Kalindra's gate (D1 event 254, the party placed at it); the castle walked
# (segment 59's route) up the Cloud Stairs to the Captain's Quarters: Dimitri (The dungeon: started). Back down and
# through the throne room, the armory and the south wing to the dungeon stair (A8's playtest route,
# devdocs/xeen/briefs/dd03/L4/playtest.yml); down: the prisoner ledger (t2-a.cells), the cell block's door, the five
# liches (group 31) killed: t2-a.liches sets liches_slain (not before: merge point 31, the hidden liches of the main
# chain's stage-1 visit are not counted dead). Up again to Dimitri (The dungeon): done, 6,000 experience
# each, the Cavalier a Champion, the others kept; asked again, the quiet cells' line. Out by the gate (event 19).
# Quest logic: source/quests/t2-a.yml. Prep: prep/D_tier2_light_dark.md.
#   python3 tests/playthrough/xeen/promotions/run.py 31
id: xeen.promotions.31_dimitri_test
title: "Xeen promotions 31: Dimitri's Test (T2-A), the Cavalier a Champion"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/00_main_59.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d1.odm}
  - assert: {qbit_set: [111481, 111521]}
  - assert: {qbit_clear: [114520, 114521, 114522]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end; if classes() ~= 'Cavalier Crusader Wizard RangerLord' then error('party: ' .. classes()) end"}
  # Castle Kalindra (D1 event 254).
  - set_pose: {map: xeen_d1.odm, x: -9728, y: -3072, z: 1664, yaw: 0.0, pitch: 0.0}
  - clear_hostiles: {radius: 3000}
  - advance_runtime: {seconds: 0.5}
  - play_lua: {source: "click(254)"}
  # F16: the standard entrance window.
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_dd03.blv}
  - advance_runtime: {seconds: 4, present_dialogs: true}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - advance_runtime: {seconds: 3}
  - play_lua: {source: "if qbit(114521) then error('liches_slain set with the liches alive (merge point 31: hidden monsters are not counted dead)') end"}
  # The entrance hall, the throne room, the Cloud Stairs, the Captain's corridor (segment 59's route).
  - walk_to: {x: -700, y: 0, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 900, y: 0, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 64, y: 700, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 64, y: 1216, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: -1536, y: 1216, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: -1536, y: 1600, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: -1536, y: 3200, z: 640, z_tolerance: 60, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: -384, y: 3200, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 600, y: 3136, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 832, y: 3200, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  # The Captain's Quarters (house 4502, event 21): The dungeon (T2-A started).
  - play_lua: {source: "click(21); wait(0.8)"}
  - assert: {dialog: {active: true, source_id: 5004, action_label_present: "Quest"}}
  - select_topic: {action_id: 46003, match_label: "Quest"}
  - assert: {dialog: {active: true, text_contains: "Clear the cells, and I have a title for the knights among you"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - assert: {qbit_set: [114520]}
  # Down the Cloud Stairs, back through the throne room to the coat closet and the armory, the south wing.
  - walk_to: {x: 600, y: 3136, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: -384, y: 3200, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: -1536, y: 3200, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: -1536, y: 1600, z: 0, z_tolerance: 60, radius: 64, timeout_seconds: 30, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: -1536, y: 1216, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 64, y: 1216, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 64, y: 700, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 900, y: 0, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  # straight across the throne room (the planner routes round by the north wing and sticks at the room's north-east)
  - walk_to: {x: 2700, y: 640, z: 0, radius: 64, plan: false, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - play_lua: {source: "open_door(13, 7)"}
  - walk_to: {x: 3328, y: 640, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - walk_to: {x: 3900, y: 640, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - play_lua: {source: "open_door(9, 1)"}
  - walk_to: {x: 4352, y: -1216, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 3500}
  - walk_to: {x: 5376, y: -1216, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - play_lua: {source: "if door_state(9) ~= 'open' then error('the dungeon stair is ' .. door_state(9) .. ' at stage 3') end"}
  # The dungeon stair; the prisoner ledger (event 40, t2-a.cells).
  - walk_to: {x: 5376, y: -2000, z: -320, z_tolerance: 120, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 5376, y: -2900, z: -640, z_tolerance: 60, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - clear_hostiles: {radius: 1500}
  - walk_to: {x: 5600, y: -3328, z: -640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "click(40); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "Vexor the Black"}}
  - play_lua: {source: "close()"}
  # The cell block (event 12, door 6): the five liches.
  - walk_to: {x: 4900, y: -3264, z: -640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "open_door(12, 6)"}
  - walk_to: {x: 4300, y: -3264, z: -640, radius: 64, timeout_seconds: 20, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - advance_runtime: {seconds: 6, present_dialogs: true}
  - play_lua: {source: "close(); if not qbit(114521) then error('liches_slain not set') end"}
  # Back up the dungeon stair and through the castle to Dimitri.
  - walk_to: {x: 4900, y: -3264, z: -640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 5376, y: -2900, z: -640, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 5376, y: -2000, z: -320, z_tolerance: 120, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 5376, y: -1216, z: 0, z_tolerance: 60, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 4352, y: -1216, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 3900, y: 640, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 3328, y: 640, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 2700, y: 640, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 900, y: 0, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 64, y: 700, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 64, y: 1216, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1536, y: 1216, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1536, y: 1600, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1536, y: 3200, z: 640, z_tolerance: 60, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -384, y: 3200, z: 640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 600, y: 3136, z: 640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 832, y: 3200, z: 640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  # D-82 point 5: no member down before Dimitri's hand-in (it reads every member's experience or class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 31 before Dimitri\\'s hand-in: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before Dimitri\\'s hand-in (D-82 5): ' .. table.concat(down, ' | ')) end"}
  # Dimitri (The dungeon): done, 6,000 experience each, the Cavalier rises a Champion.
  - play_lua: {source: "for i = 0, 3 do remember('xp' .. i, experience(i)) end; click(21); wait(0.8)"}
  - assert: {dialog: {active: true, source_id: 5004}}
  - select_topic: {action_id: 46003, match_label: "Quest"}
  - assert: {dialog: {active: true, text_contains: "Rise, Champions of the Darkside"}}
  - play_lua:
      source: |
        for i = 0, 3 do
          local xp = experience(i) - tonumber(recall("xp" .. i))
          if xp ~= 6000 then error("member " .. i .. ": Dimitri paid " .. xp .. " experience, not 6000") end
        end
        if classes() ~= "Champion Crusader Wizard RangerLord" then error("T2-A: " .. classes()) end
        log("T2-A done: " .. classes() .. "; experience " .. experience(0))
  - assert: {qbit_set: [114522]}
  # Asked again: nobody left to promote, the quiet cells' line, nothing paid.
  - play_lua: {source: "remember('xp', experience(0))"}
  - select_topic: {action_id: 46003, match_label: "Quest"}
  - assert: {dialog: {active: true, text_contains: "The cells are quiet. The guard can sleep"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; if experience(0) ~= tonumber(recall('xp')) then error('paid twice') end; if classes() ~= 'Champion Crusader Wizard RangerLord' then error(classes()) end"}
  # Down and out by the gate (event 19).
  - walk_to: {x: 600, y: 3136, z: 640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -384, y: 3200, z: 640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1536, y: 3200, z: 640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1536, y: 1600, z: 0, z_tolerance: 60, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1536, y: 1216, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 64, y: 1216, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 64, y: 700, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -700, y: 0, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1900, y: 0, z: 0, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - execute_event: {id: 19}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d1.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - save_game: {name: "P31 Dimitri's Test", path: output/playthrough/xeen/promotions/checkpoints/31_dimitri_test.oysav}
