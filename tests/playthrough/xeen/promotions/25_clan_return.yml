# Xeen promotion playthrough 25, block C (tier 2, Dark): T2-CLAN The Clan's Return (XD-22's cellar), Initiate -> Ninja.
# From 21 (X5 at Kai Wu's Monastery; Q-C4 done: the clan master dead, the clan's survivors back in the pagoda's cellar
# under Shinobu). The pagoda's north door (X5 event 61) into XD-22; the entry hall, the shrine hall, the open hatch and
# down the cellar ladder (A7's playtest, devdocs/xeen/briefs/xd22/L4/playtest.yml). Shinobu (actor 24): The clan with
# nobody of the clan's way: her killers' line. One member is given the Initiate class by a logged test setup
# (SetPlayerClass, as the class table: the party has no Monk): The clan says not yet (the gate is the Queen's castle
# rising, m20.started, D-12.2). The gate is Act IV's main story on the Darkside (main 57, Megan's key) and this block
# starts on Cloudside, so m20.started is a logged CONVENTION prerequisite (D-75; proven by main 57). The clan: the
# Initiate rises a Ninja, 3,000 each, done; the others kept; asked again, the old monk's line, nothing paid. The party's
# classes put back; saved in the cellar (the table, 27, starts there and walks out).
# Quest logic: source/quests/t2-clan.yml.
#   python3 tests/playthrough/xeen/promotions/run.py 25
id: xeen.promotions.25_clan_return
title: "Xeen promotions 25: the Clan's Return (T2-CLAN), an Initiate a Ninja"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/21_kaiwu_pagoda.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_x5.odm, qbit_set: [112082]}
  - assert: {qbit_clear: [114540, 111400]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end; log('25 start: ' .. classes())"}
  # The pagoda's north door (X5 event 61).
  - set_pose: {map: xeen_x5.odm, x: 320, y: 9728, z: 992, yaw: -1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - press_interact: {expect: {kind: event_target}}
  # F16 (merge point 40): the standard entrance window.
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_xd22.blv}
  - play_lua: {source: "wait(3); for _ = 1, 3 do if not close() then break end end"}
  - assert: {actor_count: {monster_id: 11124, hostile: true, max: 0}}
  # The entry hall, the shrine hall's door, the hatch (open since the clan's return) and the cellar ladder.
  - walk_to: {x: 0, y: -600, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 0, y: -880, z: 0, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "if door_state(6) ~= 'open' then open_door(15, 6) end"}
  - walk_to: {x: 0, y: -1350, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 0, y: -1560, z: 0, radius: 48, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "if door_state(7) ~= 'open' then error('the hatch is not open at the done stage: ' .. door_state(7)) end"}
  - climb: {ladder: cellar, down: true, timeout_seconds: 40}
  - walk_to: {x: -380, y: -2000, z: -448, radius: 48, timeout_seconds: 30, close_dialogs: true}
  # Shinobu: nobody of the clan's way.
  - interact_actor: {actor_index: 24}
  - advance_runtime: {seconds: 0.6, present_dialogs: true}
  - assert: {dialog: {active: true, action_label_present: "The clan"}}
  - select_topic: {match_label: "The clan"}
  - assert: {dialog: {active: true, text_contains: "My father's killers"}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # The party's own classes, kept for the end; member 0 an Initiate (a logged test setup: the party has no Monk).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}
  # D-82 point 5: no member down before Shinobu's promotion (it reads every member's experience or class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 25 before Shinobu\\'s promotion: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before Shinobu\\'s promotion (D-82 5): ' .. table.concat(down, ' | ')) end"}
  - lua_event: {source: "if not SetPlayerClass(0, 'Initiate') then error('SetPlayerClass(0, Initiate)') end"}
  - play_lua: {source: "log('CLASSES test setup: ' .. classes()); remember('classes', classes()); for i = 0, 3 do remember('xp' .. i, experience(i)) end"}
  # Before the Queen's castle rises: not yet.
  - interact_actor: {actor_index: 24}
  - advance_runtime: {seconds: 0.6, present_dialogs: true}
  - select_topic: {match_label: "The clan"}
  - assert: {dialog: {active: true, text_contains: "Strong, yes. Ready, no."}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; if classes() ~= recall('classes') then error('promoted before m20: ' .. classes()) end; if qbit(114540) then error('done before m20') end"}
  # The Queen's castle rising (main 57, Darkside).
  - play_lua: {source: "log('CONVENTION prerequisite m20.started (111400): the Act IV main story on the Darkside; block C starts on Cloudside after Q-C4 (21); proven by tests/playthrough/xeen/57_lost_souls.yml')"}
  - console: {line: "qbit set 111400"}
  # The clan: the Initiate rises a Ninja; 3,000 each.
  - interact_actor: {actor_index: 24}
  - advance_runtime: {seconds: 0.6, present_dialogs: true}
  - select_topic: {match_label: "The clan"}
  - assert: {dialog: {active: true, text_contains: "Kneel, Initiates, and rise in the shadows."}}
  - play_lua:
      source: |
        for i = 0, 3 do
          local xp = experience(i) - tonumber(recall("xp" .. i))
          if xp ~= 3000 then error("member " .. i .. ": Shinobu paid " .. xp .. " experience, not 3000") end
        end
        local want = string.gsub(recall("classes"), "^Initiate", "Ninja")
        if classes() ~= want then error("T2-CLAN: " .. classes() .. ", expected " .. want) end
        log("T2-CLAN done: " .. classes())
  - assert: {qbit_set: [114540]}
  # Asked again: nobody left, the old monk's line, nothing paid.
  - play_lua: {source: "remember('xp', experience(0))"}
  - select_topic: {match_label: "The clan"}
  - assert: {dialog: {active: true, text_contains: "The old monk sweeps upstairs."}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; if experience(0) ~= tonumber(recall('xp')) then error('paid twice') end"}
  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - save_game: {name: "P25 the Clan's Return", path: output/playthrough/xeen/promotions/checkpoints/25_clan_return.oysav}
