# Xeen promotion playthrough 13, the class table (README "What is checked" 5): X4: Carlawna's Ordination and the Autumn Druid's The turning year (T1-C), after 11.
# Written by class_table.py (do not edit by hand): per row of Xeen.Promotions, round 1 gives the members the
# row's "from" classes and classes it must leave alone (a logged test setup through SetPlayerClass), picks the
# promote and asserts every class; round 2 has nobody eligible and the promote is not offered. The party's own
# classes are put back at the end.
#   python3 tests/playthrough/xeen/promotions/run.py 13
id: xeen.promotions.13_carlawna_autumn_table
title: "Xeen promotions 13: the class table, X4"
world: xeen
mode: faithful
tags: [xeen, playthrough, promotions]
steps:
  - load_game: {path: output/playthrough/xeen/promotions/checkpoints/11_carlawna_scarab.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_x4.odm, qbit_set: [112201]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end"}
  # The party's own classes, kept for the end (class ids in global variables; the names remembered for the check).
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do evt.SetGlobalVar('Playthrough.Class' .. i, GetPlayerClass(i)) end"}
  - play_lua: {source: 'remember("classes_start", classes()) log("CLASSES at start: " .. classes())'}

  # D-82 point 5: no member down before the rounds (each reads every member's class).
  - play_lua: {source: "local shown, down = {}, {}; for i = 0, 3 do local c = conditions(i); shown[#shown + 1] = '[' .. c .. ']'; for _, n in ipairs({'Dead', 'Eradicated', 'Petrified', 'Paralyzed', 'Unconscious'}) do if (' ' .. c .. ' '):find(' ' .. n .. ' ', 1, true) then down[#down + 1] = 'member ' .. i .. ' ' .. c; break end end end; log('PARTY 13 before the class table: ' .. table.concat(shown, ' ')); if #down > 0 then error('PARTY DOWN before the class table (D-82 5): ' .. table.concat(down, ' | ')) end"}

  # seasons: Druid -> GreatDruid, Cleric -> Priest. Carlawna (T1-C): "Ordination".
  # Round 1: Druid Cleric GreatDruid Priest -> GreatDruid Priest GreatDruid Priest.
  - lua_event: {source: "if not SetPlayerClass(0, 'Druid') then error('SetPlayerClass(0, Druid)') end if not SetPlayerClass(1, 'Cleric') then error('SetPlayerClass(1, Cleric)') end if not SetPlayerClass(2, 'GreatDruid') then error('SetPlayerClass(2, GreatDruid)') end if not SetPlayerClass(3, 'Priest') then error('SetPlayerClass(3, Priest)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES seasons round 1 set: " .. c) if c ~= "Druid Cleric GreatDruid Priest" then error("expected Druid Cleric GreatDruid Priest, got " .. c) end'}
  - set_pose: {map: xeen_x4.odm, x: -12210, y: 5154, z: 1376, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - press_interact: {expect: {kind: event_target}}
  - assert: {dialog: {active: true, source_id: 4303, action_label_present: "Ordination"}}
  - select_topic: {match_label: "Ordination"}
  - assert: {dialog: {active: true, text_contains: "hasn't been ordained? Kneel."}}
  - play_lua: {source: 'local c = classes() log("CLASSES seasons round 1 promoted: " .. c) if c ~= "GreatDruid Priest GreatDruid Priest" then error("expected GreatDruid Priest GreatDruid Priest, got " .. c) end'}
  # Nobody left: the promote is no longer offered.
  - assert: {dialog: {active: true, action_label_absent: "Ordination"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Round 2: GreatDruid Priest Peasant Knight, none of them eligible: the promote is not offered.
  - lua_event: {source: "if not SetPlayerClass(0, 'GreatDruid') then error('SetPlayerClass(0, GreatDruid)') end if not SetPlayerClass(1, 'Priest') then error('SetPlayerClass(1, Priest)') end if not SetPlayerClass(2, 'Peasant') then error('SetPlayerClass(2, Peasant)') end if not SetPlayerClass(3, 'Knight') then error('SetPlayerClass(3, Knight)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES seasons round 2 set: " .. c) if c ~= "GreatDruid Priest Peasant Knight" then error("expected GreatDruid Priest Peasant Knight, got " .. c) end'}
  - set_pose: {map: xeen_x4.odm, x: -12210, y: 5154, z: 1376, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - press_interact: {expect: {kind: event_target}}
  - assert: {dialog: {active: true, source_id: 4303, action_label_absent: "Ordination"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - play_lua: {source: 'local c = classes() log("CLASSES seasons round 2 kept: " .. c) if c ~= "GreatDruid Priest Peasant Knight" then error("expected GreatDruid Priest Peasant Knight, got " .. c) end'}

  # seasons: Druid -> GreatDruid, Cleric -> Priest. the Autumn Druid (T1-C): "The turning year".
  # Round 1: Druid Cleric GreatDruid Priest -> GreatDruid Priest GreatDruid Priest.
  - lua_event: {source: "if not SetPlayerClass(0, 'Druid') then error('SetPlayerClass(0, Druid)') end if not SetPlayerClass(1, 'Cleric') then error('SetPlayerClass(1, Cleric)') end if not SetPlayerClass(2, 'GreatDruid') then error('SetPlayerClass(2, GreatDruid)') end if not SetPlayerClass(3, 'Priest') then error('SetPlayerClass(3, Priest)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES seasons round 1 set: " .. c) if c ~= "Druid Cleric GreatDruid Priest" then error("expected Druid Cleric GreatDruid Priest, got " .. c) end'}
  - set_pose: {map: xeen_x4.odm, x: -19149, y: -3584, z: 1120, yaw: 0.0, pitch: 0.0}
  - clear_hostiles: {radius: 3000}
  - interact_actor: {actor_index: 35}
  - assert: {dialog: {active: true, source_id: 4321, action_label_present: "The turning year"}}
  - select_topic: {match_label: "The turning year"}
  - assert: {dialog: {active: true, text_contains: "Leaves fall so the tree can grow."}}
  - play_lua: {source: 'local c = classes() log("CLASSES seasons round 1 promoted: " .. c) if c ~= "GreatDruid Priest GreatDruid Priest" then error("expected GreatDruid Priest GreatDruid Priest, got " .. c) end'}
  # Nobody left: the promote is no longer offered.
  - assert: {dialog: {active: true, action_label_absent: "The turning year"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Round 2: GreatDruid Priest Peasant Knight, none of them eligible: the promote is not offered.
  - lua_event: {source: "if not SetPlayerClass(0, 'GreatDruid') then error('SetPlayerClass(0, GreatDruid)') end if not SetPlayerClass(1, 'Priest') then error('SetPlayerClass(1, Priest)') end if not SetPlayerClass(2, 'Peasant') then error('SetPlayerClass(2, Peasant)') end if not SetPlayerClass(3, 'Knight') then error('SetPlayerClass(3, Knight)') end"}
  - play_lua: {source: 'local c = classes() log("CLASSES seasons round 2 set: " .. c) if c ~= "GreatDruid Priest Peasant Knight" then error("expected GreatDruid Priest Peasant Knight, got " .. c) end'}
  - set_pose: {map: xeen_x4.odm, x: -19149, y: -3584, z: 1120, yaw: 0.0, pitch: 0.0}
  - clear_hostiles: {radius: 3000}
  - interact_actor: {actor_index: 35}
  - assert: {dialog: {active: true, source_id: 4321, action_label_absent: "The turning year"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - play_lua: {source: 'local c = classes() log("CLASSES seasons round 2 kept: " .. c) if c ~= "GreatDruid Priest Peasant Knight" then error("expected GreatDruid Priest Peasant Knight, got " .. c) end'}

  # The party's own classes back.
  - lua_event: {source: "for i = 0, evt.GetPartyMemberCount() - 1 do if not SetPlayerClass(i, evt.GetGlobalVar('Playthrough.Class' .. i, -1)) then error('restore ' .. i) end evt.SetGlobalVar('Playthrough.Class' .. i, 0) end"}
  - play_lua: {source: 'local c = classes() log("CLASSES restored: " .. c) if c ~= recall("classes_start") then error("expected " .. recall("classes_start") .. ", got " .. c) end'}
  - save_game: {name: "P13 class table", path: output/playthrough/xeen/promotions/checkpoints/13_carlawna_autumn_table.oysav}
