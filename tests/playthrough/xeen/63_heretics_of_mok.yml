# Xeen playthrough, segment 63: the Heretics of Mok (D4, D3, D2, D1, DD-05), Q-D6 for two more Energy Disks.
# From Lakeside's north shore south off D4's edge to Sandcaster (D3), west through Sprite Forest (D2) to Castleview
# Vale (D1). The Temple of Mok (house 4455): Dreyfus (Heretics, twice: started, the rope autonote). The heretics' rope on
# the Western Tower's north wall (D1 event 121): Yes, the rope's status line, DD-05's top floor. DD-05 walked: L4 the
# chapel's Cult Leader, the altar's key; the altar stair; L3 Pious spared (No); the west stair; L2 Humble spared (No);
# the east stair; L1 the alcoves' two Energy Disks; the front door from inside with the key (the sulky pop); out by it
# to D1. Dreyfus: Heretics (done: 9,000 experience each, 3,000 gold, the award; the Crusader becomes a Hero), The
# clerics. The disks for M26's stage 4: 2 before, 4 after (Q-D18 in segment 65 brings the fifth and sixth).
# Routes: segment 59 (the D4-D3-D2-D1 edges), tests/scenarios/xeen/side_quests/q-d6_heretics_of_mok.yml (Dreyfus, the
# rope, the DD-05 walk from dd05/L4/playtest.yml).
# Quest logic: source/quests/q-d6.yml.
#   python3 tests/playthrough/xeen/run.py 63
id: xeen.playthrough.63_heretics_of_mok
title: "Xeen playthrough 63: Dreyfus's heretics: the rope into the Western Tower of Mok, its key and its two disks"
world: xeen
mode: faithful
tags: [xeen, playthrough]
steps:
  - load_game: {path: output/playthrough/xeen/checkpoints/61_blackfang.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d4.odm}
  - assert: {qbit_set: [111503, 111543]}
  - assert: {qbit_clear: [113120, 113121, 113122, 113125, 113127, 111522]}
  - play_lua: {source: "log('63 start: ' .. classes() .. '; experience ' .. experience(0) .. '; gold ' .. gold() .. '; Energy Disks ' .. item_count(12334))"}
  # South off D4's edge (the road up from Sandcaster) to D3, west off D3's edge to D2, west off D2's edge to D1.
  - set_pose: {map: xeen_d4.odm, x: 12288, y: -20992, z: 2112, yaw: -1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 12288, y: -32563, z: 1632, z_tolerance: 900, radius: 128, timeout_seconds: 150, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d3.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - set_pose: {map: xeen_d3.odm, x: -30208, y: 10240, z: 1312, yaw: 3.1416, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: -32512, y: 10240, z: 1312, z_tolerance: 900, radius: 128, timeout_seconds: 90, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d2.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - set_pose: {map: xeen_d2.odm, x: -22016, y: 2048, z: 992, yaw: 3.1416, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: -24400, y: 2048, z: 992, z_tolerance: 600, radius: 128, timeout_seconds: 60, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d1.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # The Temple of Mok (house 4455): Dreyfus, Heretics (started, the rope autonote), and again.
  - set_pose: {map: xeen_d1.odm, x: 3092, y: 2048, z: 1152, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - press_interact: {expect: {kind: event_target}}
  - assert:
      dialog: {active: true, house_dialog: false, source_id: 4905}
  - select_topic: {action_id: 44301, match_label: "Quest"}
  - assert:
      dialog: {text_contains: "they still haul their bread up a rope on the north wall"}
  - select_topic: {action_id: 44301, match_label: "Quest"}
  - assert:
      dialog: {text_contains: "Your failure to breach the tower is not your fault"}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - assert: {qbit_set: [113120]}
  # The heretics' rope on the Western Tower's north wall (D1 event 121): Yes; the status line, then DD-05's top floor.
  - set_pose: {map: xeen_d1.odm, x: -16896, y: 16896, z: 1600, yaw: -1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - play_lua: {source: "status(); click(121); wait(0.5)"}
  # F16: the standard entrance window.
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_dd05.blv}
  - play_lua:
      source: |
        local seen = status()
        if not string.find(seen, "Hand over hand", 1, true) then error("the rope's status line: " .. seen) end
        if not qbit(113121) then error("rope_climbed 113121 not set") end
  - advance_runtime: {seconds: 2, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "THE WESTERN TOWER OF MOK"}}
  - play_lua: {source: "close(); wait(0.5)"}
  - assert: {party_position: {x: 1376, y: 1472, radius: 96, z_min: 1904, z_max: 1936}}
  # L4: the hoist room's door, the bone gallery, the chapel's double doors, the Cult Leader, the key on the altar.
  - walk_to: {x: 1120, y: 1376, z: 1920, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "open_door(27, 6)"}
  - walk_to: {x: 700, y: 1376, z: 1920, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: 480, y: 1216, z: 1920, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "open_door(23, 1)"}
  - walk_to: {x: 0, y: 1216, z: 1920, radius: 64, timeout_seconds: 30, clear_hostiles: 3500, close_dialogs: true}
  - clear_hostiles: {radius: 4000}
  - play_lua: {source: "wait(3); if not qbit(113123) then error('leader_slain not set after the Cult Leader died') end"}
  - walk_to: {x: -1216, y: 1216, z: 1920, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  # D-90 (c), DD-05 rebuilt 2026-11-22 (A8): the key lies on the altar as a ground item.
  - play_lua: {source: "if ground_items(12338) ~= 1 then error('the key is not on the altar') end"}
  # Up to the altar's foot: the Cult Leader's body lies by the door side and takes a use from further back.
  - walk_to: {x: -1380, y: 1216, z: 1920, radius: 40, timeout_seconds: 20, close_dialogs: true}
  - pick_up: {item_id: 12338}
  - play_lua: {source: "for _ = 1, 3 do if held() ~= 0 then stow() end end; if item_count(12338) ~= 1 then error('no key from the altar') end"}
  # Back through the gallery, the cells and the tapestry walk into the vestry; its door into the chapel; down the
  # altar stair.
  - walk_to: {x: 480, y: 1216, z: 1920, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 672, y: 200, z: 1920, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - walk_to: {x: 672, y: -500, z: 1920, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: 672, y: -416, z: 1920, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 200, y: -416, z: 1920, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -400, y: -300, z: 1920, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(53); wait(4); if door_state(12) ~= 'open' then error('the vestry panel: ' .. door_state(12)) end"}
  - walk_to: {x: -700, y: -384, z: 1920, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1088, y: -384, z: 1920, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1088, y: 520, z: 1920, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "open_door(33, 13)"}
  - walk_to: {x: -1088, y: 860, z: 1920, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1568, y: 800, z: 1920, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1568, y: 500, z: 1920, z_tolerance: 120, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1568, y: -560, z: 1280, z_tolerance: 120, radius: 64, timeout_seconds: 40, close_dialogs: true}
  # L3: the cloister; Pious begs, No (pious_spared, he is gone).
  - walk_to: {x: -1568, y: -960, z: 1280, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 4000}
  - walk_to: {x: 0, y: -1000, z: 1280, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - play_lua: {source: "open_door(31, 10)"}
  - walk_to: {x: 0, y: -1450, z: 1280, radius: 64, timeout_seconds: 20, close_dialogs: false, expect: dialog}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Slay him anyway?"}}
  - select_topic: {match_label: "No"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Thank you for sparing my life."}}
  - play_lua: {source: "close(); wait(0.5); if not qbit(113128) then error('pious_spared not set') end"}
  # The upper dormitory and the west stair.
  - walk_to: {x: 0, y: -1000, z: 1280, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 0, y: -300, z: 1280, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: 0, y: 500, z: 1280, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "open_door(25, 4)"}
  - walk_to: {x: 0, y: 900, z: 1280, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: -1184, y: 860, z: 1280, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -1184, y: 500, z: 1280, z_tolerance: 120, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1184, y: -560, z: 640, z_tolerance: 120, radius: 64, timeout_seconds: 40, close_dialogs: true}
  # L2: the landing, the refectory, the lower dormitory; Humble's cell on foot, No (humble_spared).
  - walk_to: {x: -1184, y: -900, z: 640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -400, y: -896, z: 640, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: -416, y: 500, z: 640, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - play_lua: {source: "open_door(32, 11)"}
  - walk_to: {x: -416, y: 900, z: 640, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: 300, y: 992, z: 640, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: 1024, y: 1150, z: 640, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "open_door(28, 7)"}
  - walk_to: {x: 1024, y: 1450, z: 640, radius: 64, timeout_seconds: 20, close_dialogs: false, expect: dialog}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Slay him anyway?"}}
  - select_topic: {match_label: "No"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Thank you for sparing my life."}}
  - play_lua: {source: "close(); wait(0.5); if not qbit(113124) then error('humble_spared not set') end"}
  # Down the east stair to L1: the alcoves' two Energy Disks.
  - walk_to: {x: 1024, y: 1150, z: 640, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 1568, y: 860, z: 640, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 1568, y: 500, z: 640, z_tolerance: 120, radius: 64, timeout_seconds: 20, close_dialogs: true}
  # L1's heretics come up the stair and are fought on it (a clear keeps to the party's storey since merge point 33,
  # so L2's clears no longer reach them).
  - walk_to: {x: 1568, y: -560, z: 0, z_tolerance: 120, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1568, y: -900, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: 1184, y: 0, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 600, y: 0, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: -700, y: 832, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "remember('disks', item_count(12334)); click(22); wait(0.5)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[Two of them, Energy Disks]], 1, true) then error("status line: " .. s) end
  - play_lua:
      source: |
        close()
        for _ = 1, 3 do if held() ~= 0 then stow() end end
        if item_count(12334) ~= recall("disks") + 2 then error("the alcoves gave " .. (item_count(12334) - recall("disks")) .. " disks") end
        if not qbit(113126) then error("alcove_disks not set") end
  # The door hall: the front door from inside with the key (the sulky pop), then out by it to D1.
  - walk_to: {x: 0, y: -300, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -300, y: -850, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 0, y: -1000, z: 0, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "open_door(30, 9)"}
  - walk_to: {x: 0, y: -1300, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: 0, y: -1600, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(35); wait(0.5)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "die with a small, sulky pop"}}
  - play_lua: {source: "close(); wait(0.3); if not qbit(113125) then error('tower_opened not set') end; click(35); wait(0.5)"}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d1.odm}
  - assert: {party_position: {x: -16896, y: 14848, radius: 128, z_min: 1541, z_max: 1761}}
  - play_lua: {source: "wait(1); for _ = 1, 3 do if not close() then break end end"}
  # Dreyfus: Heretics (done: 9,000 experience each, 3,000 gold, the award, Crusader -> Hero), The clerics.
  - set_pose: {map: xeen_d1.odm, x: 3092, y: 2048, z: 1152, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - play_lua: {source: "remember('gold', gold()); remember('xp', experience(0))"}
  - press_interact: {expect: {kind: event_target}}
  - assert:
      dialog: {active: true, house_dialog: false, source_id: 4905}
  - select_topic: {action_id: 44301, match_label: "Quest"}
  - assert:
      dialog: {text_contains: "Those of you who serve the light, Mok raises up"}
  - select_topic: {match_label: "The clerics"}
  - assert:
      dialog: {text_contains: "Humble and Pious came to me and begged forgiveness."}
  - press_action: {action: cancel_dialog}
  - play_lua:
      source: |
        for _ = 1, 3 do if not close() then break end end
        if gold() - recall("gold") ~= 3000 then error("Dreyfus paid " .. (gold() - recall("gold")) .. " gold") end
        if experience(0) - recall("xp") ~= 9000 then error("Dreyfus paid " .. (experience(0) - recall("xp")) .. " experience") end
        if classes() ~= "Cavalier Hero Wizard RangerLord" then error("the heretics' promotion: " .. classes()) end
        log("63 done: " .. classes() .. "; experience " .. experience(0) .. "; gold " .. gold() .. "; Energy Disks " .. item_count(12334))
  - assert: {qbit_set: [113120, 113121, 113123, 113124, 113125, 113126, 113127, 113128]}
  # The Temple of Mok (house 4455) on Castleview's square: Sprite Forest (D2), crossed on this segment's road, can leave
  # a member Petrified (its Gorgon and Medusa Sprites; A3 sessions 30-32); the temple heals whoever is down (D-82).
  - set_pose: {map: xeen_d1.odm, x: 3092, y: 2048, z: 1152, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - heal_at_temple: {house: 4455, min: 0}
  - save_game: {name: "63 Heretics of Mok", path: output/playthrough/xeen/checkpoints/63_heretics_of_mok.oysav}
