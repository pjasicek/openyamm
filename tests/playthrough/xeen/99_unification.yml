# Xeen playthrough, segment 99: the Clouds of the Ancients (P5), M42 and the ending.
# On P5 at the roof stair's head (entrance:fd03_roof, the Crown) after M41, with the Cube of Power (12365) and the
# Scepter of Temporal Distortion (12366) and the four Sleepers awake (111760-111763). The Pharaoh's note at the Crown
# (event 27, "Signed, The Dragon Pharaoh"); round the cloud road's ring by the Rest Stops, the turns and the
# observatory (the Crown to the south Rest Stop is not linked: the road goes the long way), over the causeway north to
# the shrine on its cloud (event 37, m42.shrine): the Cube and the Scepter taken, M42 done 111840 (the certificate's
# qbit), the award Made Xeen One World 417 to every member, 40,000 each; the unification cinematic; mid-fade Roland and
# Kalindra stand under the pavilion; its done event: the ceremony text once (m42.ceremony, 111841). Prince Roland "The
# wedding" and Queen Kalindra "One world" under the pavilion; the shrine after: its else line, nothing paid. The story
# chain's end: a new game to the ending.
# Routes: devdocs/xeen/briefs/p5/L4/plan.yml (the ring, link:road_1-7, link:causeway), playtest_ending_played.yml,
# tests/scenarios/xeen/hooks_p5.yml. Quest logic: source/quests/m42.yml.
#   python3 tests/playthrough/xeen/run.py 99
id: xeen.playthrough.99_unification
title: "Xeen playthrough 99: the cloud road to the shrine, the Cube and the Scepter, the wedding, the ending"
world: xeen
mode: faithful
tags: [xeen, playthrough]
steps:
  - load_game: {path: output/playthrough/xeen/checkpoints/98_darkstone_tower.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_p5.blv}
  - assert: {party_position: {x: 4608, y: -3968, radius: 256}}
  - assert: {qbit_set: [111760, 111761, 111762, 111763, 111781, 111801, 111820]}
  - assert: {qbit_clear: [111840, 111841]}
  - play_lua: {source: "log('99 start: ' .. classes() .. '; experience ' .. experience(0) .. '; gold ' .. gold()); for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end; if not (has_item(12365) and has_item(12366)) then error('the Cube (12365) and the Scepter (12366) are not both carried') end"}
  - assert: {actor_visible: {actor_index: 2, monster_id: 11920, hidden: true}}
  - assert: {actor_visible: {actor_index: 0, monster_id: 11921, hidden: true}}
  # The Pharaoh's note at the Crown (event 27).
  - play_lua: {source: "click(27); wait(0.5)"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Signed, The Dragon Pharaoh"}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Round the ring: the east Rest Stop, the north-east turn, the observatory, the north-west turn, the west Rest Stop,
  # the south-west turn, the south Rest Stop.
  - walk_to: {x: 3904, y: -2048, z: 0, z_tolerance: 700, radius: 192, timeout_seconds: 60, clear_hostiles: 3000, close_dialogs: true}
  - walk_to: {x: 3904, y: 0, z: 0, z_tolerance: 700, radius: 192, timeout_seconds: 60, clear_hostiles: 3000, close_dialogs: true}
  - walk_to: {x: 3776, y: 3776, z: 0, z_tolerance: 700, radius: 192, timeout_seconds: 60, clear_hostiles: 3000, close_dialogs: true}
  - walk_to: {x: 0, y: 4096, z: 0, z_tolerance: 700, radius: 192, timeout_seconds: 60, clear_hostiles: 3000, close_dialogs: true}
  - walk_to: {x: -3776, y: 3776, z: 0, z_tolerance: 700, radius: 192, timeout_seconds: 60, clear_hostiles: 3000, close_dialogs: true}
  - walk_to: {x: -3904, y: 0, z: 0, z_tolerance: 700, radius: 192, timeout_seconds: 60, clear_hostiles: 3000, close_dialogs: true}
  - walk_to: {x: -3776, y: -3776, z: 0, z_tolerance: 700, radius: 192, timeout_seconds: 60, clear_hostiles: 3000, close_dialogs: true}
  - walk_to: {x: 0, y: -3904, z: 0, z_tolerance: 700, radius: 192, timeout_seconds: 60, clear_hostiles: 3000, close_dialogs: true}
  # Over the causeway north to the shrine's cloud.
  - walk_to: {x: 0, y: -1600, z: 512, z_tolerance: 700, radius: 160, timeout_seconds: 60, clear_hostiles: 3000, close_dialogs: true}
  - walk_to: {x: 0, y: -900, z: 520, z_tolerance: 200, radius: 160, timeout_seconds: 30, close_dialogs: true}
  # The shrine (event 37, m42.shrine): the Cube and the Scepter, M42 done, the award, 40,000 each; the cinematic.
  - play_lua: {source: "for i = 0, 3 do remember('xp' .. i, experience(i)) end; click(37)"}
  - advance_runtime: {seconds: 0.5}
  - console: {line: "cinematic list", expect_contains: "playing unification"}
  - assert: {qbit_set: [111840]}
  - assert: {award_acquired: [{id: 417, member_index: 0}, {id: 417, member_index: 1}, {id: 417, member_index: 2}, {id: 417, member_index: 3}]}
  - play_lua: {source: "if has_item(12365) or has_item(12366) then error('the items were not taken') end; for i = 0, 3 do if experience(i) - recall('xp' .. i) ~= 40000 then error('member ' .. i .. ' got ' .. (experience(i) - recall('xp' .. i))) end end"}
  # The cinematic plays out; its done event shows the ceremony text once.
  - advance_runtime: {seconds: 36, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "reading the vows"}}
  - assert: {qbit_set: [111841]}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - advance_runtime: {seconds: 2, present_dialogs: true}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - console: {line: "cinematic list", expect_contains: "Cinematics: unification"}
  - assert: {actor_visible: {actor_index: 2, monster_id: 11920, hidden: false}}
  - assert: {actor_visible: {actor_index: 0, monster_id: 11921, hidden: false}}
  # Under the pavilion: Prince Roland (actor 2, npc 4405) and Queen Kalindra (actor 0, npc 5001).
  - walk_to: {x: -576, y: 900, z: 512, z_tolerance: 200, radius: 160, timeout_seconds: 40, close_dialogs: true}
  - interact_actor: {actor_index: 2}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, source_id: 4405}}
  - select_topic: {match_label: "The wedding"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Married on a cloud, by a dragon, with cake."}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - interact_actor: {actor_index: 0}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, source_id: 5001}}
  - select_topic: {match_label: "One world"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "One world, and one sun."}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # The shrine after: its else line, nothing paid.
  - walk_to: {x: 0, y: -900, z: 520, z_tolerance: 200, radius: 160, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "remember('xp', experience(0)); click(37); wait(0.5)"}
  - advance_runtime: {seconds: 0.5, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "somebody has left cake"}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; if experience(0) ~= recall('xp') then error('the shrine paid twice') end"}
  - assert: {qbit_set: [111840, 111841]}
  - play_lua: {source: "log('99 done (the ending, M42 done, 111840): ' .. classes() .. '; experience ' .. experience(0) .. '; gold ' .. gold())"}
  - save_game: {name: "99 Unification", path: output/playthrough/xeen/checkpoints/99_unification.oysav}
