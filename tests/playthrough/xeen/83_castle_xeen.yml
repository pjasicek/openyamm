  - press_action: {action: select_member, member_index: 0}
  - play_lua: {source: "local function gems() local n = 0; for _, id in ipairs({177, 178, 179, 180, 181, 182, 183, 184, 185, 186, 988, 989, 990, 991, 992, 993, 994, 995, 996, 997, 998, 2056, 2057, 2058, 2059, 2060, 2061, 2062, 2063, 2064, 2065}) do n = n + item_count(id) end; return n end; if not qbit(111682) then local g, m = gold(), gems(); click(6); wait(0.5); close(); for _ = 1, 3 do if held() ~= 0 then stow() end end; remember('paid_gold', g - gold()); remember('paid_gems', m - gems()); log('Speed game, member 0: doll ' .. tostring(has_item(12368)) .. ', paid ' .. (g - gold()) .. ' gold, ' .. (m - gems()) .. ' gems') end"}
  - press_action: {action: select_member, member_index: 1}
  - play_lua: {source: "local function gems() local n = 0; for _, id in ipairs({177, 178, 179, 180, 181, 182, 183, 184, 185, 186, 988, 989, 990, 991, 992, 993, 994, 995, 996, 997, 998, 2056, 2057, 2058, 2059, 2060, 2061, 2062, 2063, 2064, 2065}) do n = n + item_count(id) end; return n end; if not qbit(111682) then local g, m = gold(), gems(); click(6); wait(0.5); close(); for _ = 1, 3 do if held() ~= 0 then stow() end end; remember('paid_gold', g - gold()); remember('paid_gems', m - gems()); log('Speed game, member 1: doll ' .. tostring(has_item(12368)) .. ', paid ' .. (g - gold()) .. ' gold, ' .. (m - gems()) .. ' gems') end"}
  - press_action: {action: select_member, member_index: 2}
  - play_lua: {source: "local function gems() local n = 0; for _, id in ipairs({177, 178, 179, 180, 181, 182, 183, 184, 185, 186, 988, 989, 990, 991, 992, 993, 994, 995, 996, 997, 998, 2056, 2057, 2058, 2059, 2060, 2061, 2062, 2063, 2064, 2065}) do n = n + item_count(id) end; return n end; if not qbit(111682) then local g, m = gold(), gems(); click(6); wait(0.5); close(); for _ = 1, 3 do if held() ~= 0 then stow() end end; remember('paid_gold', g - gold()); remember('paid_gems', m - gems()); log('Speed game, member 2: doll ' .. tostring(has_item(12368)) .. ', paid ' .. (g - gold()) .. ' gold, ' .. (m - gems()) .. ' gems') end"}
  # D-68 (CONVENTION, PLAYBOOK §2): the chain does not play the optional stat sources, so when every member has
  # lost, only member 3 gets the shortfall to exactly 60 Speed, as a bonus until rest (the wells' AddValue),
  # and the gems only to the booth's fee; the base statistics stay. It switches itself off for a stronger party.
  - lua_event:
      source: |
        if not IsQBitSet(QBit(111682)) then
          local held = 0
          for i = 0, 3 do
            for _, itemId in ipairs({177, 178, 179, 180, 181, 182, 183, 184, 185, 186, 988, 989, 990, 991, 992, 993, 994, 995, 996, 997, 998, 2056, 2057, 2058, 2059, 2060, 2061, 2062, 2063, 2064, 2065}) do
              held = held + PlayerItemCount(i, itemId)
            end
          end
          evt.ForPlayer(3)
          local before = 0
          while before < 255 and IsAtLeast(ActualSpeed, before + 1) do before = before + 1 end
          if before < 60 then AddValue(SpeedBonus, 60 - before) end
          local after = held < 0 and 0 or held
          for _ = held + 1, after do AddValue(InventoryItem(183), 183) end
          evt.StatusText("CONVENTION stat-gate M34 Speed: member 3 " .. before .. " -> " .. math.max(before, 60) .. "; gems " .. held .. " -> " .. after)
