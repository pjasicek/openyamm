  - play_lua: {source: "click(141); wait(1); close()"}
  - assert: {map: xeen_x2.odm}
  - assert: {party_position: {x: -14848, y: 1792, radius: 200}}
  - walk_to: {x: -15731, y: 3014, z: 768, z_tolerance: 600, radius: 160, timeout_seconds: 90, clear_hostiles: 3000, close_dialogs: true}
  - set_pose: {map: xeen_x2.odm, x: -15731, y: 3014, z: 768, yaw: 3.1416, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - press_interact: {expect: {kind: event_target}}
  # F16: the standard entrance window.
