# Xeen playthrough, segment 83: Slick's carnival and Castle Xeen (X3, X2, XD-12, X9, XD-19, X4, XD-07), M34 and M35.
# On X3's Newcastle site with the Xeen Slayer Sword (12500). East off X3's edge to Rivercity (X2); Medin's boat to the
# island; Darzog's door (the Skeleton Key) into XD-12: the gate hall, the cloister, Darzog's disc up the Well (the bottom
# button, from the disc), the sky stair to the roof; the cloud stair's top step asks (Crodo is free) and Yes climbs to
# X9's stair clouds. X9 walked from the stair clouds over the
# brink and the unseen way ("Xeen--9N.") to Xeendom and the cloud plaza: the character sheets read; Slick's four booths
# with the member strongest in each game (Might 100 gold, Speed 1,000 gold, Endurance 5 gems, Accuracy 10 gems:
# m34.*_won and the dolls 12367-12370; before the shooting line Slick's free Sure-Eye Tonic, m34.tonic, two Accuracy
# Boosts, the Ranger Lord drinks one), a lost game tried by every member; when all four lose, D-68's CONVENTION: the
# booth's member gets only the shortfall to 60 as a bonus until rest, the gems only to the fee, logged; the prize stand
# (the Lord Xeen doll 12371, m34.done 111685, 10,000 each); up the Xeen road and the causeway to the gate (m34.gate) into XD-19's gatehall
# (m35.arrival). XD-19 walked along A7's critical path (devdocs/xeen/briefs/xd19/L4/playtest.yml): the cold vault's
# Water Generator, the gravel vault's Earth Generator, the south-east tower's Air Generator, the barrier hall (three
# down: the field stands), the south-west tower's Fire Generator (the field falls); the crown stair, the aviary (Xeen's
# Pet), the throne doors' plate (Lord Xeen sees the party); blows without the sword do nothing (m35.untouchable), the
# Slayer Sword kills him (m35.lord_xeen; the treasury opens); the mirror (protected); the throne: Take (m35.scepter: the
# Scepter 12366, the award, M35 done 111707, 35,000 each), the mirror's cinematic, out on X9's causeway. Off the castle
# cloud's west rim: the fall to X2's island (entrance:x9_fall). Medin's boat to the jetty, X2's north edge into Burlock
# Savannah (X4), Castle Burlock's gate into XD-07; King Burlock: Lord Xeen (m35.king_told 111708); out by the castle
# door onto X4. The statues, the offerings, the nests, the chests, the guard machines and the hoard are left alone.
# Quest logic: source/quests/m34.yml, m35.yml.
#   python3 tests/playthrough/xeen/run.py 83
id: xeen.playthrough.83_castle_xeen
title: "Xeen playthrough 83: up Darzog's cloud stair, Slick's carnival, Castle Xeen's generators, Lord Xeen slain"
world: xeen
mode: faithful
tags: [xeen, playthrough]
steps:
  - load_game: {path: output/playthrough/xeen/checkpoints/81_xeen_slayer_sword.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_x3.odm}
  - assert: {qbit_set: [110500, 110501, 111462]}
  - assert: {qbit_clear: [111680, 111681, 111682, 111683, 111684, 111685, 111700, 111706, 111707, 111708]}
  - play_lua: {source: "log('83 start: ' .. classes() .. '; experience ' .. experience(0) .. '; gold ' .. gold()); for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end; if item_count(12500) ~= 1 then error('no Xeen Slayer Sword (12500)') end; if not has_item(12100) then error('no Skeleton Key (12100)') end"}
  # The Camp Shrine beside Ebenezer's tent (X3 event 33, house 4102, as segment 25): Brother Tobit heals whoever the
  # road left Weak, Cursed or Paralyzed (a night's rest does not cure them; each member plays one of Slick's games).
