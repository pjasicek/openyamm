  # The cloud plaza: the party reads its character sheets (each member's Might, Speed, Endurance and Accuracy, as the
  # sheet shows them) and its gems, to choose who plays which of Slick's games.
  - lua_event:
      source: |
        local names = {"Might", "Speed", "Endurance", "Accuracy"}
        local gems = 0
        local sheet = ""
        for i = 0, 3 do
          evt.ForPlayer(i)
          sheet = sheet .. (i == 0 and "" or "; ") .. "member " .. i .. ":"
          for _, name in ipairs(names) do
            local value = 0
            while value < 255 and IsAtLeast(_G["Actual" .. name], value + 1) do value = value + 1 end
            sheet = sheet .. " " .. name .. " " .. value
          end
          for _, itemId in ipairs({177, 178, 179, 180, 181, 182, 183, 184, 185, 186, 988, 989, 990, 991, 992, 993, 994,
              995, 996, 997, 998, 2056, 2057, 2058, 2059, 2060, 2061, 2062, 2063, 2064, 2065}) do
            gems = gems + PlayerItemCount(i, itemId)
          end
        end
        evt.StatusText("sheets " .. sheet .. "; gems " .. gems)
  - play_lua: {source: "local sheets = status() or ''; remember('sheets', sheets); log('character sheets: ' .. sheets .. '; gold ' .. gold())"}
  # Slick's high-striker (event 5, 100 gold): the Cavalier swings first; a lost game is tried by every member in turn (the honest try).
  - walk_to: {x: -1024, y: 1280, z: 448, z_tolerance: 200, radius: 160, timeout_seconds: 90, clear_hostiles: 2500, close_dialogs: true}
  - press_action: {action: select_member, member_index: 0}
  - play_lua: {source: "local function gems() local n = 0; for _, id in ipairs({177, 178, 179, 180, 181, 182, 183, 184, 185, 186, 988, 989, 990, 991, 992, 993, 994, 995, 996, 997, 998, 2056, 2057, 2058, 2059, 2060, 2061, 2062, 2063, 2064, 2065}) do n = n + item_count(id) end; return n end; if not qbit(111681) then local g, m = gold(), gems(); click(5); wait(0.5); close(); for _ = 1, 3 do if held() ~= 0 then stow() end end; remember('paid_gold', g - gold()); remember('paid_gems', m - gems()); log('Might game, member 0: doll ' .. tostring(has_item(12367)) .. ', paid ' .. (g - gold()) .. ' gold, ' .. (m - gems()) .. ' gems') end"}
  - press_action: {action: select_member, member_index: 1}
  - play_lua: {source: "local function gems() local n = 0; for _, id in ipairs({177, 178, 179, 180, 181, 182, 183, 184, 185, 186, 988, 989, 990, 991, 992, 993, 994, 995, 996, 997, 998, 2056, 2057, 2058, 2059, 2060, 2061, 2062, 2063, 2064, 2065}) do n = n + item_count(id) end; return n end; if not qbit(111681) then local g, m = gold(), gems(); click(5); wait(0.5); close(); for _ = 1, 3 do if held() ~= 0 then stow() end end; remember('paid_gold', g - gold()); remember('paid_gems', m - gems()); log('Might game, member 1: doll ' .. tostring(has_item(12367)) .. ', paid ' .. (g - gold()) .. ' gold, ' .. (m - gems()) .. ' gems') end"}
  - press_action: {action: select_member, member_index: 2}
  - play_lua: {source: "local function gems() local n = 0; for _, id in ipairs({177, 178, 179, 180, 181, 182, 183, 184, 185, 186, 988, 989, 990, 991, 992, 993, 994, 995, 996, 997, 998, 2056, 2057, 2058, 2059, 2060, 2061, 2062, 2063, 2064, 2065}) do n = n + item_count(id) end; return n end; if not qbit(111681) then local g, m = gold(), gems(); click(5); wait(0.5); close(); for _ = 1, 3 do if held() ~= 0 then stow() end end; remember('paid_gold', g - gold()); remember('paid_gems', m - gems()); log('Might game, member 2: doll ' .. tostring(has_item(12367)) .. ', paid ' .. (g - gold()) .. ' gold, ' .. (m - gems()) .. ' gems') end"}
  - press_action: {action: select_member, member_index: 3}
  - play_lua: {source: "local function gems() local n = 0; for _, id in ipairs({177, 178, 179, 180, 181, 182, 183, 184, 185, 186, 988, 989, 990, 991, 992, 993, 994, 995, 996, 997, 998, 2056, 2057, 2058, 2059, 2060, 2061, 2062, 2063, 2064, 2065}) do n = n + item_count(id) end; return n end; if not qbit(111681) then local g, m = gold(), gems(); click(5); wait(0.5); close(); for _ = 1, 3 do if held() ~= 0 then stow() end end; remember('paid_gold', g - gold()); remember('paid_gems', m - gems()); log('Might game, member 3: doll ' .. tostring(has_item(12367)) .. ', paid ' .. (g - gold()) .. ' gold, ' .. (m - gems()) .. ' gems') end"}
  # D-68 (CONVENTION, PLAYBOOK §2): the chain does not play the optional stat sources, so when every member has
  # lost, only member 0 gets the shortfall to exactly 60 Might, as a bonus until rest (the wells' AddValue),
  # and the gems only to the booth's fee; the base statistics stay. It switches itself off for a stronger party.
  - lua_event:
      source: |
        if not IsQBitSet(QBit(111681)) then
          local held = 0
          for i = 0, 3 do
            for _, itemId in ipairs({177, 178, 179, 180, 181, 182, 183, 184, 185, 186, 988, 989, 990, 991, 992, 993, 994, 995, 996, 997, 998, 2056, 2057, 2058, 2059, 2060, 2061, 2062, 2063, 2064, 2065}) do
              held = held + PlayerItemCount(i, itemId)
            end
          end
          evt.ForPlayer(0)
          local before = 0
          while before < 255 and IsAtLeast(ActualMight, before + 1) do before = before + 1 end
          if before < 60 then AddValue(MightBonus, 60 - before) end
          local after = held < 0 and 0 or held
          for _ = held + 1, after do AddValue(InventoryItem(183), 183) end
          evt.StatusText("CONVENTION stat-gate M34 Might: member 0 " .. before .. " -> " .. math.max(before, 60) .. "; gems " .. held .. " -> " .. after)
        end
  - play_lua:
      source: |
        for _ = 1, 20 do wait(0.1); if held() ~= 0 then stow() end end
        local line = string.match(status() or "", "CONVENTION[^|]*")
        if line then log((string.gsub(line, "%s+$", ""))) elseif not qbit(111681) then error("the Might game is lost and no convention fired") end
  - press_action: {action: select_member, member_index: 0}
  - play_lua: {source: "local function gems() local n = 0; for _, id in ipairs({177, 178, 179, 180, 181, 182, 183, 184, 185, 186, 988, 989, 990, 991, 992, 993, 994, 995, 996, 997, 998, 2056, 2057, 2058, 2059, 2060, 2061, 2062, 2063, 2064, 2065}) do n = n + item_count(id) end; return n end; if not qbit(111681) then local g, m = gold(), gems(); click(5); wait(0.5); close(); for _ = 1, 3 do if held() ~= 0 then stow() end end; remember('paid_gold', g - gold()); remember('paid_gems', m - gems()); log('Might game, member 0 after the convention: doll ' .. tostring(has_item(12367)) .. ', paid ' .. (g - gold()) .. ' gold, ' .. (m - gems()) .. ' gems') end"}
  - assert: {qbit_set: [111681]}
  - play_lua: {source: "if not has_item(12367) then error('no might doll') end; if recall('paid_gold') ~= 100 or recall('paid_gems') ~= 0 then error('the winning Might game took ' .. recall('paid_gold') .. ' gold and ' .. recall('paid_gems') .. ' gems') end"}
