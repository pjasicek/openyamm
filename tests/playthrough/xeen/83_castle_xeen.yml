  - advance_runtime: {seconds: 0.5}
  - play_lua: {source: "log('before the shrine: ' .. conditions(0) .. ' | ' .. conditions(1) .. ' | ' .. conditions(2) .. ' | ' .. conditions(3))"}
  - heal_at_temple: {house: 4102, min: 0}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; for i = 0, 3 do if conditions(i) ~= '' then error('member ' .. i .. ' still ' .. conditions(i) .. ' after the shrine') end end"}
