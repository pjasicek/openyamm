        if not IsQBitSet(QBit(111683)) then
          local held = 0
          for i = 0, 3 do
            for _, itemId in ipairs({177, 178, 179, 180, 181, 182, 183, 184, 185, 186, 988, 989, 990, 991, 992, 993, 994, 995, 996, 997, 998, 2056, 2057, 2058, 2059, 2060, 2061, 2062, 2063, 2064, 2065}) do
              held = held + PlayerItemCount(i, itemId)
            end
          end
          evt.ForPlayer(1)
          local before = 0
          while before < 255 and IsAtLeast(ActualEndurance, before + 1) do before = before + 1 end
          if before < 60 then AddValue(EnduranceBonus, 60 - before) end
          local after = held < 5 and 5 or held
          for _ = held + 1, after do AddValue(InventoryItem(183), 183) end
          evt.StatusText("CONVENTION stat-gate M34 Endurance: member 1 " .. before .. " -> " .. math.max(before, 60) .. "; gems " .. held .. " -> " .. after)
