# Xeen playthrough, segment 77: Castle Alamar (D6, DD-17), M33 Castle Alamar done.
# On D6's crust outside Corak's pod with the Soul Box (Corak inside, 12364). Castle Alamar's gate on the mesa (D6 event
# 33, m33.castle_door: Yes) into DD-17's gatehall; the box hums (m33.arrival: inside 111660). DD-17 walked along A8's
# critical path (devdocs/xeen/briefs/dd17/L4/playtest.yml; rooms.yml for the doors between): L1, the works: the
# gatehall's and the Hall of Order's blast doors; west, the fire belt north to the Fire Head (Yes: its field drops),
# out by its maintenance door to the west return; the water belt to the Water Head, out the same way; east, the air
# belt and the Air Head, the earth belt and the Earth Head, out by the east return. Up the stair hall (the Hall of
# Order's second blast doors) to L2's south walk; round the dial floor: Earth, Air, Fire and Water Time behind their
# dropped fields, each turned to nine (Alamar's birth number) by what the dial reads; onto the lip, over the four slabs
# to the island; the gate: a wrong name, then Sheltem (gate_open 111661); the lift up to the deck; the first hatched
# plate drops the party to the chasm floor; out by the radial cut to the sump, its lever and door, the stair hall,
# back on the south walk; round to the lip again, over the slabs, the lift called down and ridden up; across the deck
# (clear of the plates) to the Hall of Vengeance ("Come to ME!"), the antechamber, Command Central; the dais plate:
# Yes (m33.sheltem: the box for the Cube of Power 12365, M33 done 111662, 35,000 each); the self-destruct cinematic
# shows Sheltem and Corak and leaves to D6's entrance:dd17_gate. Robot bay, strongroom, juice and chests left alone.
# Quest logic: source/quests/m33.yml.
#   python3 tests/playthrough/xeen/run.py 77
id: xeen.playthrough.77_castle_alamar
