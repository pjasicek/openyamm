# Xeen playthrough, segment 49: the Temple of Bark (D2, DD-09), Q-D10 on the polite route. Sprite Forest: Sharla in
# her treehouse (Sheewana: started; Certainly). The great tree's door with Nibbler's Bark key (Q-D9, segment 43); DD-09
# walked: the voice in the trunk, the root stair, the west and east root alcoves (a gem each, an Energy Disk each: M18),
# the pens' lever (the four prisoners: Nathan and Sky thank the party), the Chapel of Sap, the guardroom and the orcs'
# back stair to the cell row (Snog and Alicia), Shaalth's hall (Shaalth dies, his key opens the cage, Sheewana's Home:
# freed), his hoard, the Chapel of Ascension (the Book, the dials west 1, north 2, east 3, the lever, the Crystal Water:
# Disciple of Bark), the vault; back down the same way and out by the trunk door. Sharla: Sheewana (Q-D10 done, two
# Energy Disks, 1,000 gold, the Hunter becomes a Ranger Lord).
# Routes: devdocs/xeen/briefs/dd09/L4/playtest.yml, playtest_exit.yml; d2/L4/playtest.yml (Sharla's door, the tree).
# Quest logic: source/quests/q-d10.yml, q-d9.yml.
#   python3 tests/playthrough/xeen/run.py 49
id: xeen.playthrough.49_temple_of_bark
title: "Xeen playthrough 49: the Temple of Bark: Princess Sheewana, the root alcoves and the Disciples of Bark"
world: xeen
mode: faithful
tags: [xeen, playthrough]
steps:
  - load_game: {path: output/playthrough/xeen/checkpoints/47_ellingers_tower.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d1.odm}
  - assert: {qbit_set: [113181]}
  - assert: {qbit_clear: [113200, 113206, 113207]}
  - play_lua:
      source: |
        local n = 0
        for id = 177, 186 do n = n + item_count(id) end
        remember("disks", item_count(12334))
        log("49 start: " .. classes() .. "; gems " .. n .. "; Energy Disks " .. item_count(12334) .. "; gold " .. gold())
  # East along the road off D1's edge into Sprite Forest.
  - set_pose: {map: xeen_d1.odm, x: 21504, y: 2048, z: 1088, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 24064, y: 2048, z: 1088, z_tolerance: 600, radius: 128, timeout_seconds: 60, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d2.odm}
  - play_lua: {source: "close()"}
  # Sharla's Treehouse (4553, NPC 5101): Sheewana (started), then Certainly (the polite route).
  - set_pose: {map: xeen_d2.odm, x: -19300, y: -10839, z: 992, yaw: 2.2513, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - press_interact: {expect: {kind: event_target}}
  - assert:
      dialog: {active: true, source_id: 5101}
  - select_topic: {action_id: 44501, match_label: "Quest"}
  - assert:
      dialog: {text_contains: "The Orcs have kidnapped one of our sisters"}
  - select_topic: {match_label: "Certainly"}
  - assert:
      dialog: {text_contains: "Go to the Temple of Bark and free her!"}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - assert: {qbit_set: [113200, 113201]}
  # The great tree's round door (D2 event 13): Nibbler's Bark key opens it.
  - set_pose: {map: xeen_d2.odm, x: -11396, y: -6640, z: 992, yaw: -1.3746, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - press_interact: {expect: {kind: event_target}}
  # F16: the standard entrance window.
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_dd09.blv}
  - assert: {party_position: {x: 0, y: -1920, radius: 96, z_min: -8, z_max: 8}}
  - advance_runtime: {seconds: 3, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "THE TEMPLE OF BARK"}}
  - play_lua: {source: "close(); wait(0.5); if not qbit(117120) then error('arrived_once not set') end"}
  # The Hall of the Trunk (the voice), down the root stair to the root cellar.
  - walk_to: {x: 0, y: -1000, z: 0, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1000, y: -128, z: 0, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -3456, y: -128, z: -512, z_tolerance: 120, radius: 64, clear_hostiles: 2000, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -3900, y: -128, z: -512, radius: 64, timeout_seconds: 20, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  # The west root alcove: "Feed me! Give gem?" One gem, one Energy Disk.
  - walk_to: {x: -5300, y: 0, z: -512, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -6300, y: 0, z: -512, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "click(51); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "Feed me! Give gem?"}}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[The bark parts on an Energy Disc]], 1, true) then error("status line: " .. s) end
  - play_lua:
      source: |
        close()
        if held() ~= 0 then stow() end
        if item_count(12334) ~= recall("disks") + 1 then error("the west root: disks " .. item_count(12334)) end
        if not qbit(113210) then error("root_west not set") end
  # The east root alcove.
  - walk_to: {x: -5300, y: 0, z: -512, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -4480, y: 700, z: -512, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -4480, y: 1500, z: -512, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "click(50); wait(0.5)"}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - play_lua:
      source: |
        local s = tostring(status())
        if not string.find(s, [[The bark parts on an Energy Disc]], 1, true) then error("status line: " .. s) end
  - play_lua:
      source: |
        close()
        if held() ~= 0 then stow() end
        if item_count(12334) ~= recall("disks") + 2 then error("the east root: disks " .. item_count(12334)) end
        if not qbit(113211) then error("root_east not set") end
  # The pens: the lever opens the four cages; Nathan and Sky thank the party.
  - walk_to: {x: -4480, y: 700, z: -512, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -4544, y: -900, z: -512, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "open_door(28, 4)"}
  - walk_to: {x: -4544, y: -1700, z: -512, radius: 64, timeout_seconds: 20, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - walk_to: {x: -5250, y: -1920, z: -512, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -6100, y: -1920, z: -512, radius: 64, timeout_seconds: 20, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - play_lua:
      source: |
        status()
        click(43); wait(3)
        local seen = status()
        if not string.find(seen, "You hear a rumbling in the distance.", 1, true) then error("the pen lever said: " .. seen) end
        if not qbit(117121) then error("prisoners_freed not set") end
        remember("xp", experience(0))
        click(45); wait(1)
  - select_topic: {match_label: Thanks}
  - assert: {dialog: {text_contains: "Orcs can't jump"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "click(46); wait(1)"}
  - select_topic: {match_label: Thanks}
  - assert: {dialog: {text_contains: "seen the sun in days"}}
  - press_action: {action: cancel_dialog}
  - assert: {qbit_set: [113212, 113213]}
  # Back up to the hall; the guardroom and the orcs' back stair up to the cell row: Snog and Alicia.
  - walk_to: {x: -6272, y: -900, z: -512, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -6272, y: 0, z: -512, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -5300, y: 0, z: -512, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -3800, y: -128, z: -512, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1500, y: -128, z: 0, z_tolerance: 120, radius: 64, clear_hostiles: 2000, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: -700, y: 0, z: 0, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 0, y: 900, z: 0, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 0, y: 1700, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - walk_to: {x: 1100, y: 2112, z: 0, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "open_door(25, 1)"}
  - walk_to: {x: 1700, y: 2112, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 3000}
  - walk_to: {x: 3100, y: 2304, z: 0, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 5504, y: 2304, z: 640, z_tolerance: 120, radius: 64, clear_hostiles: 2000, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 5900, y: 2304, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 2000, close_dialogs: true}
  - clear_hostiles: {radius: 1800}
  # Snog and Alicia in the cell row thank the party too (the freed prisoners go only on the next entry, not on a load
  # inside the visit: A8, DD-09 session 6).
  - play_lua: {source: "close(); click(47); wait(1)"}
  - select_topic: {match_label: Thanks}
  - assert: {dialog: {text_contains: "refusing to do evil"}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "close(); click(44); wait(1)"}
  - select_topic: {match_label: Thanks}
  - assert: {dialog: {text_contains: "his tea is poisonous"}}
  - press_action: {action: cancel_dialog}
  - play_lua:
      source: |
        close()
        if not qbit(113214) or not qbit(113215) then error("Snog's and Alicia's thanks not recorded") end
        if experience(0) - recall("xp") < 2000 then error("the four prisoners' thanks paid " .. (experience(0) - recall("xp"))) end
  # Shaalth's hall: the cage refuses while he lives; his death; his key opens the cage; Sheewana goes home.
  - walk_to: {x: 6528, y: 1900, z: 640, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 6528, y: 1300, z: 640, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "click(11); wait(0.5)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "locked. The princess inside waves politely"}}
  - play_lua: {source: "close()"}
  - clear_hostiles: {radius: 4000}
  - advance_runtime: {seconds: 4}
  - assert: {qbit_set: [113204]}
  - play_lua: {source: "close(); click(11); wait(0.5)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Shaalth's key turns in the cage lock"}}
  - play_lua: {source: "close(); wait(4); if door_state(9) ~= 'open' then error('the cage did not open: ' .. door_state(9)) end; if not qbit(113205) then error('cage_opened not set') end; remember('xp', experience(0)); click(11); wait(1)"}
  - select_topic: {match_label: Home}
  - assert: {dialog: {text_contains: "Thank you for freeing me"}}
  - press_action: {action: cancel_dialog}
  - assert: {qbit_set: [113206]}
  - play_lua: {source: "close(); if experience(0) - recall('xp') ~= 6000 then error('Sheewana freed paid ' .. (experience(0) - recall('xp'))) end"}
  - advance_runtime: {seconds: 2}
  - play_lua: {source: "close(); loot_chest(15); close(); if held() ~= 0 then stow() end"}
  # The Chapel of Ascension: the Book, the dials (west 1, north 2, east 3), the lever, the Crystal Water; the vault.
  - walk_to: {x: 8500, y: 0, z: 640, radius: 64, clear_hostiles: 2000, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "open_door(29, 5)"}
  - walk_to: {x: 9100, y: 0, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 2500, close_dialogs: true}
  - clear_hostiles: {radius: 2500}
  - walk_to: {x: 10200, y: 0, z: 640, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "open_door(30, 6)"}
  - walk_to: {x: 10900, y: 0, z: 640, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "click(6); wait(0.5)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "drink of the Crystal Water"}}
  - play_lua: {source: "close(); click(22); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "Dial reads 1. Turn?"}}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 1}
  - play_lua: {source: "close(); click(21); wait(0.5)"}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 1}
  - play_lua: {source: "close(); click(21); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "Dial reads 2. Turn?"}}
  - answer_input: {text: "Yes"}
  - advance_runtime: {seconds: 1}
  - play_lua: {source: "close(); click(23); wait(0.5)"}
  - assert: {dialog: {active: true, text_contains: "Dial reads 1. Turn?"}}
  - answer_input: {text: "No"}
  - advance_runtime: {seconds: 1}
  - play_lua: {source: "close(); click(2); wait(0.5)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "the water runs clear"}}
  - play_lua: {source: "close(); click(18); wait(0.5)"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "You are hereby dubbed a Disciple of Bark!"}}
  - play_lua: {source: "close()"}
  - assert: {qbit_set: [113216]}
  - walk_to: {x: 12100, y: 0, z: 640, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "open_door(32, 8); wait(2); if door_state(8) ~= 'open' then error('the vault did not open: ' .. door_state(8)) end"}
  - walk_to: {x: 12750, y: 0, z: 640, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "loot_chest(17); close(); if held() ~= 0 then stow() end"}
  # Back the way the party came: the chapels, Shaalth's hall, the cell row, the back stair, the guardroom, the hall.
  - walk_to: {x: 10900, y: 0, z: 640, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 8500, y: 0, z: 640, radius: 64, clear_hostiles: 2000, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 6528, y: 1300, z: 640, radius: 64, clear_hostiles: 2000, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 6528, y: 1900, z: 640, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 5900, y: 2304, z: 640, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 5504, y: 2304, z: 640, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 3100, y: 2304, z: 0, z_tolerance: 120, radius: 64, clear_hostiles: 2000, timeout_seconds: 30, close_dialogs: true}
  - walk_to: {x: 1700, y: 2112, z: 0, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 1100, y: 2112, z: 0, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 0, y: 1700, z: 0, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 0, y: 900, z: 0, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 0, y: -1000, z: 0, radius: 64, clear_hostiles: 2000, timeout_seconds: 20, close_dialogs: true}
  # Out by the trunk door (event 33) onto D2's bark glade.
  - walk_to: {x: 0, y: -2150, z: 0, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "click(33); wait(0.5)"}
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d2.odm}
  - assert: {party_position: {x: -11264, y: -6656, radius: 160, z_min: 960, z_max: 1030}}
  - play_lua: {source: "wait(1); for _ = 1, 3 do if not close() then break end end"}
  # Sharla: Sheewana is home (Q-D10 done: two Energy Disks, 1,000 gold, Hunter -> Ranger Lord).
  - set_pose: {map: xeen_d2.odm, x: -19300, y: -10839, z: 992, yaw: 2.2513, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - play_lua: {source: "remember('gold', gold()); remember('disks2', item_count(12334))"}
  - press_interact: {expect: {kind: event_target}}
  # Sheewana lives here now too: the house lists both.
  - assert:
      dialog: {active: true, house_dialog: true}
  - select_topic: {action_id: 5101, match_label: "Sharla"}
  - select_topic: {action_id: 44501, match_label: "Quest"}
  - assert:
      dialog: {text_contains: "Walk it now as its lords"}
  - press_action: {action: cancel_dialog}
  - play_lua:
      source: |
        for _ = 1, 3 do if not close() then break end end
        for _ = 1, 3 do if held() ~= 0 then stow() end end
        if item_count(12334) ~= recall("disks2") + 2 then error("Sharla's disks: " .. item_count(12334)) end
        if gold() - recall("gold") ~= 1000 then error("Sharla paid " .. (gold() - recall("gold"))) end
        if not string.find(classes(), "RangerLord", 1, true) and not string.find(classes(), "Ranger Lord", 1, true) then
          error("the polite route did not promote the Hunter: " .. classes())
        end
        log("49 done: " .. classes() .. "; experience " .. experience(0) .. "; gold " .. gold() .. "; Energy Disks " .. item_count(12334))
  - assert: {qbit_set: [113200, 113201, 113204, 113205, 113206, 113207, 113210, 113211, 113216]}
  - save_game: {name: "49 The Temple of Bark", path: output/playthrough/xeen/checkpoints/49_temple_of_bark.oysav}
