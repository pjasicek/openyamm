# Xeen playthrough, segment 05: the Red Dwarf Mines (XD-02) for M3. From the timbered mine portal in X1's
# north-west hills (the party placed at it, PLAYBOOK §2) into the mines; walked: the haul drift to the Top Station,
# the trestle car over the chasm to the Turntable, the camp and the tally room (its guards, the brake key in the
# clan's strongbox), the low gallery to the Open Stope's rim, the spiral of ledges and ramps down to its floor, the
# Deep Line station (the brake key frees the chained cart) and the cart down the Deep Line into the Deep Mine (XD-03).
# Route: devdocs/xeen/briefs/xd02/L4/playtest.yml. Quest logic: source/quests/m3.yml.
#   python3 tests/playthrough/xeen/run.py 05
id: xeen.playthrough.05_red_dwarf_mines
title: "Xeen playthrough 05: through the Red Dwarf Mines to the Deep Line"
world: xeen
mode: faithful
tags: [xeen, playthrough]
steps:
  - load_game: {path: output/playthrough/xeen/checkpoints/03_joes_warehouse.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_x1.odm}
  - assert: {qbit_set: [111041, 111060]}
  # The mine portal at the end of the mine lane (X1 event 71).
  - set_pose: {map: xeen_x1.odm, x: -10240, y: 16249, z: 1184, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - press_interact: {expect: {kind: event_target}}
  # F16: the standard entrance window.
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_xd02.blv}
  - assert: {party_position: {x: 14376, y: 3392, radius: 96, z_min: -8, z_max: 8}}
  # Gunther's errand greets the party a moment after it enters (a one-shot timer's message window).
  - advance_runtime: {seconds: 3, present_dialogs: true}
  - assert:
      dialog: {text_contains: "Gunther"}
  - press_action: {action: cancel_dialog}
  # Down the haul drift to the Top Station.
  - walk_to: {x: 13000, y: 3392, z: 0, radius: 96, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 12736, y: 4400, z: -150, radius: 96, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 12400, y: 5000, z: -192, radius: 96, timeout_seconds: 60, clear_hostiles: 1200}
  # The trestle car: onto it from the loading platform, and the riders' lever takes it over the chasm.
  - walk_to: {x: 12300, y: 5184, z: -192, radius: 96, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 11800, y: 5184, z: -160, radius: 48, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 11470, y: 5184, z: -160, radius: 32, timeout_seconds: 60, clear_hostiles: 1200}
  - play_lua:
      source: |
        click(53); wait(12)
        if door_state(22) ~= "open" then error("the riders' lever at the station did not run the car: " .. door_state(22)) end
  - assert: {party_position: {x: 9890, y: 5184, radius: 200, z_min: -392, z_max: -372}}
  - walk_to: {x: 9200, y: 5184, z: -384, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  # The camp: across the mess hall, up the tally steps, the iron-banded door, the tally room's guards, and the brake
  # key in the clan's strongbox.
  - walk_to: {x: 8512, y: 6450, z: -384, radius: 96, timeout_seconds: 60, clear_hostiles: 900}
  - walk_to: {x: 7360, y: 7000, z: -384, radius: 96, timeout_seconds: 60, clear_hostiles: 500}
  - walk_to: {x: 7050, y: 7200, z: -384, radius: 64, timeout_seconds: 60, clear_hostiles: 400}
  - walk_to: {x: 6680, y: 7200, z: -288, radius: 48, timeout_seconds: 60, clear_hostiles: 200}
  - play_lua:
      source: |
        open_door(14, 13)
        if door_state(13) ~= "open" then error("the tally door did not open") end
  - clear_hostiles: {radius: 1500}
  - walk_to: {x: 5320, y: 7200, z: -288, radius: 64, timeout_seconds: 60, clear_hostiles: 900}
  - play_lua:
      source: |
        loot_chest(8)
        if not has_item(12011) then error("the strongbox did not hold the brake key") end
        log("the brake key from the clan's strongbox")
  # Back through the camp to the chapel's junction and by the low gallery to the Open Stope's rim.
  - walk_to: {x: 7050, y: 7200, z: -384, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 7360, y: 7000, z: -384, radius: 96, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 8512, y: 4320, z: -384, radius: 64, timeout_seconds: 60, clear_hostiles: 900}
  - walk_to: {x: 7400, y: 5184, z: -370, radius: 64, timeout_seconds: 60, clear_hostiles: 800}
  - walk_to: {x: 7900, y: 4650, z: -384, radius: 64, timeout_seconds: 60, clear_hostiles: 800}
  - walk_to: {x: 7400, y: 4070, z: -384, radius: 64, timeout_seconds: 60, clear_hostiles: 400}
  - walk_to: {x: 7560, y: 3460, z: -384, radius: 64, timeout_seconds: 60, clear_hostiles: 400}
  # Down the spiral of ledges and ramps to the stope's floor.
  - walk_to: {x: 7095, y: 3247, z: -384, radius: 64, timeout_seconds: 60, clear_hostiles: 500}
  - walk_to: {x: 7168, y: 2880, z: -464, radius: 64, timeout_seconds: 60, clear_hostiles: 800}
  - walk_to: {x: 7095, y: 2513, z: -544, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 6886, y: 2202, z: -624, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 6575, y: 1993, z: -704, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 6208, y: 1920, z: -784, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 5841, y: 1993, z: -864, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 5530, y: 2202, z: -944, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 5321, y: 2513, z: -1024, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 5248, y: 2880, z: -1088, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 5600, y: 3150, z: -1152, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  # The Deep Line station: the cart chained, the brake key frees it (m3.deep_line), and down the Deep Line.
  - walk_to: {x: 5600, y: 3650, z: -1152, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 5000, y: 4100, z: -1180, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 4300, y: 4600, z: -1216, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - walk_to: {x: 4250, y: 4780, z: -1216, radius: 48, timeout_seconds: 60, clear_hostiles: 1200}
  - play_lua:
      source: |
        status()
        click(47); wait(1)
        local seen = status()
        if not string.find(seen, "chained", 1, true) then error("the chained cart did not say so: " .. seen) end
        click(1); wait(3)
  - assert:
      dialog: {text_contains: "brake comes off"}
  - play_lua:
      source: |
        if not close() then error("the brake opened no message window") end
        wait(3)
        if door_state(17) ~= "open" then error("the brake key did not free the cart") end
        if not qbit(110021) then error("the brake did not set deep_line_unchained") end
  - walk_to: {x: 4250, y: 4560, z: -1216, radius: 64, timeout_seconds: 60, clear_hostiles: 1200}
  - play_lua: {source: "click(47)"}
  # F16: the standard entrance window (with the Deep Line's line from trans.txt).
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.0, follow_map_move: true}
  # In the Deep Mine (XD-03) at the foot of the Deep Line.
  - assert: {map: xeen_xd03.blv}
  - assert: {party_position: {x: 8192, y: 1088, radius: 128, z_min: 370, z_max: 400}}
  - assert: {qbit_set: [110021, 111060]}
  - save_game: {name: "05 Red Dwarf Mines", path: output/playthrough/xeen/checkpoints/05_red_dwarf_mines.oysav}
