# Xeen playthrough, segment 96: Halon's Widget (D6, D1, X1, X7, X4, XD-07, X6, X5), Q-C14 and King Burlock's brother.
# On D6 at the stair under Castle Alamar's ruin (entrance:fd01_stair) with Prince Roland free (M39 done, 111781), the
# Amulet of the Southern Sphinx (12372) and the Darkstone Tower key (111780). M40's Picard trades the Chime of Opening
# only for a widget, and Halon the Efficient (X5) pays one for magical lava from Mount Firestone (Q-C14), so the
# Widget comes first. Down D6's south road off the edge to D1; D1's travel pyramid outside Castleview to X1 by Vertigo;
# north off X1's edge to Mount Firestone (X7): the lake track and the causeway to the cooled-flow island, the glowing
# rock (a ground item since D-90 (c): the Ever-Hot Lava Rock 12314, picked up from the ground); west off X7's edge to Burlock Savannah (X4); Castle Burlock (XD-07): King Burlock, "My brother" (Roland is
# home, m39's topic); out to X4; west off X4's edge to the Desert of the Sphinx (X6), south off X6's edge to Winterkill
# Tundra (X5); Halon's Workshop (X5 event 43, house 4274): Water clock: the rock for the Widget (12315, Q-C14 done
# 112282, 12,000 each). Ends on X5 outside the workshop.
# Routes: segment 85 (the edges, D1's pyramid), 83 (Castle Burlock), devdocs/xeen/briefs/x7/L4/playtest.yml (the
# causeway), devdocs/xeen/briefs/x5/L4/playtest.yml (Halon's yard), tests/scenarios/xeen/side_quests/
# q-c14_lava_for_the_clock.yml. Quest logic: source/quests/q-c14.yml, m39.yml (King Burlock's topic).
#   python3 tests/playthrough/xeen/run.py 96
id: xeen.playthrough.96_lava_for_the_clock
title: "Xeen playthrough 96: the lava rock from Mount Firestone, King Burlock's brother, Halon's Widget"
world: xeen
mode: faithful
tags: [xeen, playthrough]
steps:
  - load_game: {path: output/playthrough/xeen/checkpoints/95_prince_roland.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d6.odm}
  - assert: {qbit_set: [111780, 111781]}
  - assert: {qbit_clear: [112280, 112282]}
  - play_lua: {source: "log('96 start: ' .. classes() .. '; experience ' .. experience(0) .. '; gold ' .. gold()); for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end; if not has_item(12372) then error('no Amulet of the Southern Sphinx (12372)') end"}
  # Down the mountain road off D6's south edge to Castleview Vale (as segment 85).
  - set_pose: {map: xeen_d6.odm, x: 0, y: -20480, z: 1888, yaw: -1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 0, y: -32512, z: 1500, z_tolerance: 1500, radius: 128, timeout_seconds: 200, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d1.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # D1's travel pyramid outside Castleview (event 109) to X1 by Vertigo.
  - set_pose: {map: xeen_d1.odm, x: -1024, y: 13312, z: 1248, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - play_lua: {source: "click(109); wait(0.5)"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_x1.odm}
  - assert: {party_position: {x: 8832, y: 9472, radius: 200}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # North off X1's edge to Mount Firestone (X7's south edge).
  - set_pose: {map: xeen_x1.odm, x: 2560, y: 22016, z: 1824, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 2560, y: 24064, z: 1824, z_tolerance: 1500, radius: 128, timeout_seconds: 60, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_x7.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # X7: the lake track and over the causeway to the cooled-flow island in the lava lake.
  - set_pose: {map: xeen_x7.odm, x: -5120, y: 5120, z: 1888, yaw: 3.1416, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: -9216, y: 4096, z: 1728, z_tolerance: 600, radius: 160, timeout_seconds: 60, clear_hostiles: 3000, close_dialogs: true}
  - walk_to: {x: -12288, y: 3840, z: 1680, z_tolerance: 600, radius: 160, timeout_seconds: 60, clear_hostiles: 3000, close_dialogs: true}
  - walk_to: {x: -14592, y: 4608, z: 1536, z_tolerance: 600, radius: 160, timeout_seconds: 60, clear_hostiles: 3000, close_dialogs: true}
  - walk_to: {x: -14592, y: 6656, z: 1504, z_tolerance: 600, radius: 160, timeout_seconds: 60, clear_hostiles: 3000, close_dialogs: true}
  - walk_to: {x: -14592, y: 8704, z: 1504, z_tolerance: 600, radius: 160, timeout_seconds: 60, clear_hostiles: 3000, close_dialogs: true}
  - walk_to: {x: -14541, y: 9933, z: 1568, z_tolerance: 600, radius: 160, timeout_seconds: 60, clear_hostiles: 3000, close_dialogs: true}
  # The Ever-Hot Lava Rock on the ground (D-90 (c), A5's X7 2026-11-22; cell 35, 44): walked to its north-west side.
  - walk_to: {x: -14991, y: 10383, z: 1568, z_tolerance: 600, radius: 160, timeout_seconds: 60, clear_hostiles: 3000, close_dialogs: true}
  - play_lua: {source: "clear_hostiles(3000); if ground_items(12314) ~= 1 then error('the lava rock is not on the ground') end"}
  - pick_up: {item_id: 12314, reach: 700}
  - play_lua:
      source: |
        for _ = 1, 3 do if not close() then break end end
        for _ = 1, 3 do if held() ~= 0 then stow() end; wait(0.2) end
        if item_count(12314) ~= 1 then error("the island gave " .. item_count(12314) .. " lava rocks") end
        if ground_items(12314) ~= 0 then error("the lava rock is still on the ground") end
  # Back over the causeway; west off X7's edge to Burlock Savannah (as segment 85).
  - walk_to: {x: -14592, y: 6656, z: 1504, z_tolerance: 600, radius: 160, timeout_seconds: 60, clear_hostiles: 3000, close_dialogs: true}
  - walk_to: {x: -14592, y: 4608, z: 1536, z_tolerance: 600, radius: 160, timeout_seconds: 60, clear_hostiles: 3000, close_dialogs: true}
  - set_pose: {map: xeen_x7.odm, x: -22016, y: -1024, z: 1408, yaw: 3.1416, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: -24064, y: -1024, z: 1408, z_tolerance: 1500, radius: 128, timeout_seconds: 60, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_x4.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Castle Burlock's lane and gate (X4 event 180 into XD-07's gatehouse; as segment 83).
  - set_pose: {map: xeen_x4.odm, x: -1024, y: 5120, z: 1312, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: -1024, y: 6707, z: 1750, z_tolerance: 600, radius: 160, timeout_seconds: 60, clear_hostiles: 3000, close_dialogs: true}
  - set_pose: {map: xeen_x4.odm, x: -1024, y: 6707, z: 1760, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - press_interact: {expect: {kind: event_target}}
  # F16: the standard entrance window.
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_xd07.blv}
  - advance_runtime: {seconds: 3, present_dialogs: true}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - walk_to: {x: 0, y: 700, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "if door_state(11) ~= 'open' then click(40); wait(8) end; if door_state(11) ~= 'open' then error('the portcullis did not open: ' .. door_state(11)) end"}
  # The throne room (house 4201): King Burlock, "My brother" (Roland is home: m39.done).
  - walk_to: {x: 0, y: 2304, z: 0, radius: 96, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 0, y: 3150, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "open_door(25, 13)"}
  - walk_to: {x: 0, y: 5300, z: 0, radius: 96, timeout_seconds: 40, close_dialogs: true}
  - play_lua: {source: "click(43); wait(1)"}
  # Prince Roland stands in the throne room beside his brother now (m39.roland's move to house 4201).
  - assert: {dialog: {active: true, source_id: 4201, action_label_present: "Prince Roland"}}
  - select_topic: {match_label: "King Burlock"}
  - assert: {dialog: {active: true, source_id: 4401}}
  - select_topic: {match_label: "My brother"}
  - assert: {dialog: {text_contains: "My brother is home. The real one, this time; he eats."}}
  - press_action: {action: cancel_dialog}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Back down the hall and out by the castle door onto X4's castle rise.
  - walk_to: {x: 0, y: 3300, z: 0, radius: 96, timeout_seconds: 40, close_dialogs: true}
  - walk_to: {x: 0, y: 700, z: 0, radius: 64, timeout_seconds: 60, close_dialogs: true}
  - walk_to: {x: 0, y: 300, z: 0, radius: 64, timeout_seconds: 30, close_dialogs: true}
  - play_lua: {source: "click(8); wait(0.5)"}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_x4.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # West off X4's edge to the Desert of the Sphinx (X6), south off X6's edge to Winterkill Tundra (X5).
  - set_pose: {map: xeen_x4.odm, x: -22528, y: 2048, z: 1184, yaw: 3.1416, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: -24064, y: 2048, z: 1184, z_tolerance: 1500, radius: 128, timeout_seconds: 60, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_x6.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - set_pose: {map: xeen_x6.odm, x: -7168, y: -22016, z: 1472, yaw: -1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: -7168, y: -24064, z: 1472, z_tolerance: 1500, radius: 128, timeout_seconds: 60, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_x5.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Halon's Workshop (X5 event 43, house 4274): the rock for the Widget.
  - set_pose: {map: xeen_x5.odm, x: 15194, y: 6964, z: 1344, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end; remember('xp', experience(0)); remember('xp3', experience(3)); click(43); wait(0.5)"}
  - assert: {dialog: {active: true, source_id: 4526}}
  - select_topic: {match_label: Water clock}
  - assert: {dialog: {text_contains: "Take this widget as payment."}}
  - press_action: {action: cancel_dialog}
  - play_lua:
      source: |
        for _ = 1, 3 do if not close() then break end end
        for _ = 1, 3 do if held() ~= 0 then stow() end; wait(0.2) end
        if not qbit(112282) then error("Q-C14 done 112282 not set") end
        if item_count(12314) ~= 0 then error("Halon left the lava rock") end
        if item_count(12315) ~= 1 then error("no Widget (12315)") end
        local xp, xp3 = experience(0) - recall("xp"), experience(3) - recall("xp3")
        if xp ~= 12000 or xp3 ~= 12000 then error("Halon paid " .. xp .. " / " .. xp3 .. " experience, not 12,000 each") end
  # Asked again, Halon only says his clock works.
  - play_lua: {source: "click(43); wait(0.5)"}
  - select_topic: {match_label: Water clock}
  - assert: {dialog: {text_contains: "It is wonderful to see my clock work year round."}}
  - press_action: {action: cancel_dialog}
  - play_lua:
      source: |
        for _ = 1, 3 do if not close() then break end end
        if not has_item(12372) then error("no Amulet of the Southern Sphinx (12372) at the end") end
        if not has_item(12315) then error("no Widget (12315) at the end") end
        log("96 done (Q-C14 done): " .. classes() .. "; experience " .. experience(0) .. "; gold " .. gold())
  - save_game: {name: "96 Halon's Widget", path: output/playthrough/xeen/checkpoints/96_lava_for_the_clock.oysav}
