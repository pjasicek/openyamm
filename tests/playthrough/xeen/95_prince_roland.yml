  - walk_to: {x: -28160, y: -14848, z: 768, z_tolerance: 600, radius: 192, timeout_seconds: 60, clear_hostiles: 3000, close_dialogs: true}
  # The west toll (Xeen.toll west): the Sky Bandits whistle and ask 10,000 gold; paid ("Here you go").
  - play_lua: {source: "remember('gold', gold())"}
  - walk_to: {x: -27451, y: -9454, z: 900, z_tolerance: 600, radius: 192, timeout_seconds: 60, expect: dialog, plan: false}
