# Xeen playthrough, segment 95: Prince Roland (D7, D1, D6, FD-01), M39 done.
# On the Skyroads (D7) by the Water Corner's Rest Stop (entrance:p4_return) after M38, with the Cube of Power (12365)
# and the Scepter (12366). North up the west road: the west toll (Xeen.toll west: the Sky Bandits' whistle, 10,000 gold,
# "Here you go"), to the Rope's Head; the Dark Grove rope down ("Descend to the Darkness Below?" Yes) to D1's great
# tree; up D1's north road off the edge into the Forbidden Zone (D6); the ruin of Castle Alamar on the mesa (M33 done):
# the stair under the broken gatehouse (D6 event 70, m39.depths_door: the Cube hums, the mark goes out; no question,
# D-72) down to FD-01's entrance:d6_stair. FD-01 walked along A8's path (devdocs/xeen/briefs/fd01/L4/playtest.yml):
# the statue's boast as the party comes near (m39.statue, once; then the status line), round the C to the lever hall:
# the west lever, then the east (m39.lever_west/east, each slab down; then "The lever won't budge."), the sealed
# passage, the workshop, the key vault: the box (the Key to the Dragon Tower 12376, q-f1.tower_key), the warden's chest
# (m39.darkstone_key 111780, its gold, then the cushion), the skull door with the Cube ("Access granted.", open after a
# reload), the lift down, the coffin: the field drops, the lid opens, Prince Roland (m39.roland: M39 done 111781, the
# Amulet of the Southern Sphinx 12372, the award Rescued Prince Roland 416, autonote 4138, 40,000 each; he goes home to
# court, house 4201), the empty coffin after a reload; the stasis, nook and assembly chests and the dark pyramid. Back
# by the lift, the sealed passage, the lever hall, the C and the first hall to the stair's top: the exit (event 15, the
# leave window, OK) to D6 at entrance:fd01_stair. Ends on D6.
# Routes: segment 93 (D7's south road), 87 (the rope), 85 (D1's north road), devdocs/xeen/briefs/d7/L4/plan.yml (the
# west road, room:west_toll, room:rope_head), devdocs/xeen/briefs/fd01/L4/playtest_in.yml, playtest.yml,
# playtest_exit.yml. Quest logic: source/quests/m39.yml, q-f1.yml, npcs/d7.yml (the tolls).
#   python3 tests/playthrough/xeen/run.py 95
id: xeen.playthrough.95_prince_roland
title: "Xeen playthrough 95: the rope down, the stair under Castle Alamar's ruin, the Alamar Depths, Prince Roland"
world: xeen
mode: faithful
tags: [xeen, playthrough]
steps:
