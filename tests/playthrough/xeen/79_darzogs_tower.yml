# Xeen playthrough, segment 79: Darzog's Tower (D6, D1, X1, X2, XD-12), M21 Darzog's Tower done.
# From Castle Alamar's gate on D6 back to Cloudside: down the mountain road off D6's south edge to Castleview Vale (D1);
# D1's travel pyramid by Castleview (the Pyramid Sigil, m7) to the knoll east of Vertigo (X1); west off X1's edge by the
# river road to Rivercity (X2); Medin's boat to the island; Darzog's door (the Skeleton Key, m13). No mirror is touched
# yet on either side (119001-119013 clear), so the mirrors cannot carry the party; the pyramid is the cross-side link.
# XD-12 walked along A8's critical path (devdocs/xeen/briefs/xd12/L4/playtest.yml, rooms.yml): the gate floor's
# cloister and the west stair hall to the works; the assembly hall's winch raises the works gate; the east stair hall to
# the library, the apprentice's note; the Chief Librarian slain, his cabinet's library key; round the west walk's
# trapdoor to the library stair door; up to Darzog's floor; Darzog's doors, the Baron among his clones (m21.darzog:
# darzog_slain 110500, the disc's grille opens); his journal names the portrait; the bedchamber, the portrait slides up
# on Crodo's cell (m21.crodo: crodo_freed 110501, 35,000 each, the vault word's autonote 4121); the sky stair to the
# roof; the cloud stair's top step opens the entrance window now that Crodo is free: No, the
# party stays on the roof (segment 83 climbs). Back down the sky stair, Darzog's disc down the Well, out by the tower door onto the
# island (X2). The books, the chests and the hoard are left alone. Quest logic: source/quests/m21.yml.
#   python3 tests/playthrough/xeen/run.py 79
id: xeen.playthrough.79_darzogs_tower
title: "Xeen playthrough 79: by the pyramid back to Cloudside; Darzog slain, Crodo freed, the cloud stair opens"
world: xeen
mode: faithful
tags: [xeen, playthrough]
steps:
  - load_game: {path: output/playthrough/xeen/checkpoints/77_castle_alamar.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d6.odm}
  - assert: {qbit_set: [111662, 110100, 111522, 110503]}
  - assert: {qbit_clear: [110500, 110501, 110502, 111440, 111441]}
  - play_lua: {source: "log('79 start: ' .. classes() .. '; experience ' .. experience(0) .. '; gold ' .. gold()); for _ = 1, 3 do if not close() then break end end; for _ = 1, 3 do if held() ~= 0 then stow() end end; if not has_item(12100) then error('no Skeleton Key (12100)') end"}
  # Down the mountain road off D6's south edge to Castleview Vale (as segment 61).
  - set_pose: {map: xeen_d6.odm, x: 0, y: -20480, z: 1888, yaw: -1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 0, y: -32512, z: 1500, z_tolerance: 1500, radius: 128, timeout_seconds: 200, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d1.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # D1's travel pyramid outside Castleview (event 109, Xeen.travelPyramid castleview: m7.sigil) to X1 by Vertigo.
  - set_pose: {map: xeen_d1.odm, x: -1024, y: 13312, z: 1248, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - play_lua: {source: "click(109); wait(0.5)"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_x1.odm}
  - assert: {party_position: {x: 8832, y: 9472, radius: 200}}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # West off X1's edge by the river road to Rivercity (X2).
  - set_pose: {map: xeen_x1.odm, x: -22016, y: 9216, z: 992, yaw: 3.1416, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: -23552, y: 9216, z: 928, z_tolerance: 600, radius: 128, timeout_seconds: 60, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_x2.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Medin's boat rows the party to the island (event 141, as segment 37).
  - set_pose: {map: xeen_x2.odm, x: -9779, y: 1272, z: 640, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - play_lua: {source: "click(141); wait(1); close()"}
  - assert: {map: xeen_x2.odm}
  - assert: {party_position: {x: -14848, y: 1792, radius: 200}}
  # Darzog's door on the island's east side: the Skeleton Key turns (m13.darzog_door).
  - walk_to: {x: -15731, y: 3014, z: 768, z_tolerance: 600, radius: 160, timeout_seconds: 90, clear_hostiles: 3000, close_dialogs: true}
  - set_pose: {map: xeen_x2.odm, x: -15731, y: 3014, z: 768, yaw: 3.1416, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - press_interact: {expect: {kind: event_target}}
  # F16: the standard entrance window.
  - assert: {dialog: {active: true, action_label_present: "OK"}}
  - select_topic: {match_label: "OK"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_xd12.blv}
  - play_lua: {source: "wait(3); for _ = 1, 3 do if not close() then break end end"}
  - assert: {party_position: {x: 2752, y: 0, radius: 96, z_min: -8, z_max: 8}}
  # The gate hall, the cloister round the Well's foot, the west stair hall up to the works (768).
  - walk_to: {x: 2200, y: 0, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1408, y: 0, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 1408, y: -1408, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1408, y: -1408, z: 0, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1408, y: -768, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -2112, y: -768, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -2816, y: -1600, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -2816, y: 1350, z: 768, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -2112, y: 1350, z: 768, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -2112, y: -768, z: 768, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: -1408, y: -768, z: 768, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  # The works: the assembly hall's winch raises the works gate.
  - walk_to: {x: -1408, y: -1408, z: 768, radius: 64, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 384, y: -1408, z: 768, radius: 64, timeout_seconds: 40, clear_hostiles: 1500, close_dialogs: true}
  - walk_to: {x: 384, y: -2300, z: 768, radius: 64, timeout_seconds: 30, clear_hostiles: 2200}
  - clear_hostiles: {radius: 2200}
  - walk_to: {x: -1560, y: -2784, z: 768, radius: 48, timeout_seconds: 30, clear_hostiles: 1500, close_dialogs: true}
  - play_lua:
      source: |
        if door_state(22) ~= "open" then
          click(54); wait(4)
        end
        if door_state(22) ~= "open" then error("the winch did not raise the works gate: " .. door_state(22)) end
  # Through the works gate to the east stair hall and up to the library (1536).
