# Xeen playthrough, segment 61: Ambrose's griffin and Castle Blackfang (D1, D6, D2, D3, DD-14, D4), M25 and M27's first
# visit. North off Castleview Vale's edge up the mountain road into the Forbidden Zone (D6): Ambrose at Griffin Pass
# (Who sent you?: Dimitri; the bridle). Back south and east to Sandcaster (D3): Natasha the Enchantress (The bridle,
# 5,000 gold: the enchanted bridle). Back to Griffin Pass: Ambrose (The griffin: M25 done; Fly to Blackfang). DD-14
# walked: the landing's window, the south-west tower and its stair, the sleeping hall, the Countess's rooms, the grand
# stair, the Count's hall, Count Blackfang and his guards (m27.blackfang), the dungeon
# stair, the question room, the cells, the Queen (The crown: queen_found, the safe's combination 3-31-62). Up the
# shaft's ladder, the cellar, the courtyard and its stair to the landing; Ambrose's griffin back out to D4's north
# shore below the castle (m27.fly_out, facing west). The crown waits for M26's stage 4 (segment 63 on).
# Routes: d6/L4/playtest.yml (Ambrose, Griffin Pass, the D1 road), d3/L4/playtest.yml (Natasha), segment 57 (the D1-D2-D3
# edges), dd14/L4/playtest.yml.
# Quest logic: source/quests/m25.yml, m27.yml.
#   python3 tests/playthrough/xeen/run.py 61
id: xeen.playthrough.61_blackfang
title: "Xeen playthrough 61: Ambrose's bridle, Natasha's charm; Castle Blackfang's Count and the Queen in her cell"
world: xeen
mode: faithful
tags: [xeen, playthrough]
steps:
  - load_game: {path: output/playthrough/xeen/checkpoints/59_dimitri.oysav}
  - setup_shortcut: {kind: immortal}
  - assert: {map: xeen_d1.odm}
  - assert: {qbit_set: [111481, 111500, 111521]}
  - assert: {qbit_clear: [111501, 111503, 111540, 111543]}
  - play_lua: {source: "log('61 start: ' .. classes() .. '; experience ' .. experience(0) .. '; gold ' .. gold())"}
  # North out of Castleview by the north gate and up D1's north road (x 64) off the edge into the Forbidden Zone.
  - set_pose: {map: xeen_d1.odm, x: -1024, y: 13312, z: 1248, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 64, y: 32512, z: 1500, z_tolerance: 1500, radius: 128, timeout_seconds: 200, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d6.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Ambrose at Griffin Pass (scene actor 44, npc 5512): Who sent you? (Dimitri): the bridle.
  - set_pose: {map: xeen_d6.odm, x: -1229, y: -16179, z: 2464, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - interact_actor: {actor_index: 44}
  - advance_runtime: {seconds: 0.5}
  - assert:
      dialog: {active: true, source_id: 5512}
  - select_topic: {action_id: 41252, match_label: "Quest"}
  - assert:
      dialog: {text_contains: "Natasha in Sandcaster could do it"}
  - press_action: {action: cancel_dialog}
  - play_lua:
      source: |
        for _ = 1, 3 do if not close() then break end end
        for _ = 1, 3 do if held() ~= 0 then stow() end end
        if not has_item(12346) then error("no bridle (12346)") end
  - assert: {qbit_set: [111501]}
  # Down the mountain road off D6's south edge to Castleview Vale, east to Sprite Forest and Sandcaster.
  - set_pose: {map: xeen_d6.odm, x: 0, y: -20480, z: 1888, yaw: -1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 0, y: -32512, z: 1500, z_tolerance: 1500, radius: 128, timeout_seconds: 200, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d1.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - set_pose: {map: xeen_d1.odm, x: 21504, y: 2048, z: 1088, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 24064, y: 2048, z: 1088, z_tolerance: 600, radius: 128, timeout_seconds: 60, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d2.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - set_pose: {map: xeen_d2.odm, x: 29696, y: 10240, z: 1408, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 32512, y: 10240, z: 1376, z_tolerance: 600, radius: 128, timeout_seconds: 60, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d3.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Natasha the Enchantress (house 4619, a residence of one): The bridle, 5,000 gold.
  - set_pose: {map: xeen_d3.odm, x: -14208, y: 18964, z: 1504, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - play_lua: {source: "remember('gold', gold())"}
  - press_interact: {expect: {kind: event_target}}
  - assert:
      dialog: {active: true, source_id: 5218}
  - select_topic: {action_id: 41251, match_label: "Quest"}
  - assert:
      dialog: {text_contains: "It hums when a griffin is near"}
  - press_action: {action: cancel_dialog}
  - play_lua:
      source: |
        for _ = 1, 3 do if not close() then break end end
        for _ = 1, 3 do if held() ~= 0 then stow() end end
        if not has_item(12347) or has_item(12346) then error("the bridle was not enchanted") end
        if recall("gold") - gold() ~= 5000 then error("Natasha charged " .. (recall("gold") - gold())) end
  - assert: {qbit_set: [111502]}
  # Back west (D3, D2) to Castleview Vale and north again to Griffin Pass.
  - set_pose: {map: xeen_d3.odm, x: -30208, y: 10240, z: 1312, yaw: 3.1416, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: -32512, y: 10240, z: 1312, z_tolerance: 900, radius: 128, timeout_seconds: 90, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d2.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  - set_pose: {map: xeen_d2.odm, x: -22016, y: 2048, z: 992, yaw: 3.1416, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: -24400, y: 2048, z: 992, z_tolerance: 600, radius: 128, timeout_seconds: 60, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d1.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # The Temple of Mok (house 4455) on Castleview's square, the first temple after Sprite Forest (D2), crossed twice on
  # this road, whose Gorgon and Medusa Sprites can leave a member Petrified (A3 sessions 30-32): it heals whoever is
  # down (D-82).
  - set_pose: {map: xeen_d1.odm, x: 3092, y: 2048, z: 1152, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - heal_at_temple: {house: 4455, min: 0}
  - set_pose: {map: xeen_d1.odm, x: -1024, y: 13312, z: 1248, yaw: 1.5708, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - walk_to: {x: 64, y: 32512, z: 1500, z_tolerance: 1500, radius: 128, timeout_seconds: 200, clear_hostiles: 3000, expect: dialog}
  - assert: {dialog: {active: true}}
  - select_topic: {match_label: OK}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d6.odm}
  - play_lua: {source: "for _ = 1, 3 do if not close() then break end end"}
  # Ambrose: The griffin (the enchanted bridle: M25 done, 5,000 experience, 4,000 gold); Fly to Blackfang.
  - set_pose: {map: xeen_d6.odm, x: -1229, y: -16179, z: 2464, yaw: 0.0, pitch: 0.0}
  - advance_runtime: {seconds: 0.5}
  - clear_hostiles: {radius: 3000}
  - play_lua: {source: "remember('xp', experience(0)); remember('gold', gold())"}
  - interact_actor: {actor_index: 44}
  - advance_runtime: {seconds: 0.5}
  - assert:
      dialog: {active: true, source_id: 5512}
  - select_topic: {action_id: 41253, match_label: "Quest"}
  - assert:
      dialog: {text_contains: "calm as a cart horse"}
  - play_lua:
      source: |
        if experience(0) - recall("xp") ~= 5000 then error("M25 paid " .. (experience(0) - recall("xp"))) end
        if gold() - recall("gold") ~= 4000 then error("the Queen's purse gave " .. (gold() - recall("gold"))) end
        if has_item(12347) then error("Ambrose did not take the enchanted bridle") end
  - assert: {qbit_set: [111503]}
  - select_topic: {match_label: "Fly to Blackfang"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_dd14.blv}
  - assert: {party_position: {x: 0, y: -1472, radius: 96, z_min: 1272, z_max: 1300, facing: 512, facing_within: 64}}
  # The landing: m27.landing's window on the first arrival.
  - advance_runtime: {seconds: 3, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "Castle Blackfang's battlements"}}
  - play_lua: {source: "close(); wait(0.5); if not qbit(117480) then error('dd14_arrived_once not set') end"}
  # The south-west tower's top storey (the diary and a purse); down its stair to the upper floor.
  - walk_to: {x: -1150, y: -1856, z: 1280, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1600, y: -1856, z: 1280, radius: 64, timeout_seconds: 20, clear_hostiles: 1200, close_dialogs: true}
  - clear_hostiles: {radius: 1200}
  - walk_to: {x: -1600, y: -1344, z: 1280, radius: 64, timeout_seconds: 20, close_dialogs: true}
  # The battlement north of the tower (sector 31): three Gargoyle Sentinels (11551, Paralyze), the farthest about 2,000
  # off. They swoop on the party at the diary's shelf, so they are fought here first (D-82).
  - clear_hostiles: {radius: 2200, height: 700}
  - walk_to: {x: -2250, y: -1344, z: 1280, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "click(62); wait(0.5); close()"}
  - walk_to: {x: -1600, y: -1344, z: 1280, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -1600, y: -2240, z: 1280, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: -2600, y: -2240, z: 640, z_tolerance: 120, radius: 64, timeout_seconds: 30, clear_hostiles: 1000, close_dialogs: true}
  - walk_to: {x: -2300, y: -1900, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - walk_to: {x: -1920, y: -1300, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  # The sleeping hall: a coffin's sleeper rises, then a find coffin.
  - walk_to: {x: -1920, y: -900, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - clear_hostiles: {radius: 900}
  - walk_to: {x: -2150, y: -832, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - play_lua: {source: "click(19); wait(0.5); close(); wait(1); clear_hostiles(900); click(20); wait(0.5); close()"}
  # The Countess's rooms (the door, the jewel box) and the keep's upper hall.
  - walk_to: {x: -1920, y: -120, z: 640, radius: 48, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - play_lua: {source: "open_door(35, 3)"}
  - walk_to: {x: -1920, y: 400, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - clear_hostiles: {radius: 1000}
  - walk_to: {x: -1600, y: 800, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - play_lua: {source: "click(50); wait(0.5); close()"}
  - walk_to: {x: -1920, y: 900, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - walk_to: {x: -1920, y: 1300, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - clear_hostiles: {radius: 1600}
  # Down the grand stair.
  - walk_to: {x: -400, y: 2240, z: 640, radius: 64, timeout_seconds: 30, clear_hostiles: 1000, close_dialogs: true}
  - walk_to: {x: 640, y: 2240, z: 640, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - walk_to: {x: 640, y: 1250, z: 0, z_tolerance: 120, radius: 64, timeout_seconds: 30, clear_hostiles: 1000, close_dialogs: true}
  - clear_hostiles: {radius: 1000}
  # The Count's hall: the double doors (event 39); the bar (event 4) lifts when the Count is dead.
  - walk_to: {x: 250, y: 1700, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - walk_to: {x: 250, y: 2300, z: 0, radius: 48, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "click(39); wait(3); if door_state(8) ~= 'open' or door_state(9) ~= 'open' then error('the hall doors did not open: ' .. door_state(8) .. ' ' .. door_state(9)) end"}
  - walk_to: {x: 300, y: 2750, z: 0, radius: 64, timeout_seconds: 20, close_dialogs: true}
  # Count Blackfang and his three Royal Vampires meet the party as it comes into the hall: his death (m27.blackfang)
  # lifts the bar. Since merge point 33 a clear keeps to the party's storey, so the keep's upper hall no longer kills
  # the vampires that barred the way, and the bar's refusal while he lives is A8's DD-14 playtest's check.
  # D-90: his death line is on the status line (logged; the walk may outlast it), the bit is the check. The walk
  # closes any message on the way (the --reload run met one west of the hall after a reload).
  - walk_to: {x: -1600, y: 2752, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1600, close_dialogs: true}
  - play_lua: {source: "log('Blackfang status: ' .. tostring(status()))"}
  - play_lua: {source: "close(); wait(2); if not qbit(111540) then error('blackfang_slain not set') end; for _ = 1, 20 do if door_state(1) == 'open' then break end; wait(0.5) end; if door_state(1) ~= 'open' then error('the bar did not lift: ' .. door_state(1)) end"}
  - walk_to: {x: -700, y: 2752, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  # The family crypt and its hoard.
  - walk_to: {x: -896, y: 3700, z: 0, radius: 48, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - play_lua: {source: "open_door(40, 11)"}
  - walk_to: {x: -896, y: 4150, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - play_lua: {source: "click(14); wait(0.5); close(); wait(1); clear_hostiles(800)"}
  - walk_to: {x: -448, y: 4100, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  # Down the dungeon stair: the question room, the cells, the Queen's cell (m27.queen_cell on entry; Queen Kalindra,
  # the placed actor 49, npc 5001, talks).
  - walk_to: {x: -896, y: 3700, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - walk_to: {x: -1000, y: 2752, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - walk_to: {x: -1600, y: 2752, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - walk_to: {x: -1600, y: 2900, z: 0, radius: 48, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - walk_to: {x: -1600, y: 3920, z: -640, z_tolerance: 120, radius: 64, timeout_seconds: 30, clear_hostiles: 1000, close_dialogs: true}
  - clear_hostiles: {radius: 1000}
  - walk_to: {x: -2112, y: 3800, z: -640, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - walk_to: {x: -2112, y: 2700, z: -640, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - play_lua: {source: "open_door(36, 4)"}
  - walk_to: {x: -2112, y: 2240, z: -640, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - walk_to: {x: -1920, y: 1600, z: -640, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - walk_to: {x: -1920, y: 1100, z: -640, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - clear_hostiles: {radius: 1200}
  - walk_to: {x: -1600, y: 0, z: -640, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - walk_to: {x: -1000, y: -192, z: -640, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - interact_actor: {actor_index: 49}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, source_id: 5001}}
  - select_topic: {action_id: 41351, match_label: "Quest"}
  - advance_runtime: {seconds: 1, present_dialogs: true}
  - assert: {dialog: {active: true, text_contains: "three, thirty-one, sixty-two"}}
  - play_lua: {source: "close(); wait(0.5); close(); if not qbit(111543) then error('queen_found not set') end"}
  # The way back up: the shaft's bolt, the ladder into the cellar, the kitchen, the courtyard and its stair's gate.
  - walk_to: {x: -1600, y: 0, z: -640, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - walk_to: {x: -1920, y: -100, z: -640, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - walk_to: {x: -1920, y: -560, z: -640, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - walk_to: {x: -1520, y: -640, z: -640, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - play_lua: {source: "click(49); wait(3); if door_state(17) ~= 'open' then error('the trapdoor did not open: ' .. door_state(17)) end"}
  - climb: {ladder: shaft, timeout_seconds: 40}
  - assert: {party_position: {x: -1904, y: -640, radius: 160, z_min: -8, z_max: 40}}
  - walk_to: {x: -1920, y: -480, z: 0, radius: 48, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - play_lua: {source: "open_door(34, 2)"}
  - walk_to: {x: -1920, y: 100, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - clear_hostiles: {radius: 1000}
  - walk_to: {x: -1600, y: 384, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - walk_to: {x: -1000, y: 384, z: 0, radius: 64, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - clear_hostiles: {radius: 2000}
  - walk_to: {x: 1220, y: -400, z: 0, radius: 64, timeout_seconds: 30, clear_hostiles: 1000, close_dialogs: true}
  - walk_to: {x: 1220, y: -832, z: 0, radius: 48, timeout_seconds: 20, clear_hostiles: 1000, close_dialogs: true}
  - walk_to: {x: -700, y: -832, z: 1280, z_tolerance: 120, radius: 64, timeout_seconds: 40, clear_hostiles: 1000, close_dialogs: true}
  # Back on the battlements (1280): the gargoyles of the east and north walks (sectors 11 and 19: Gargoyle Overlords
  # 11552, Stone, and Sentinels 11551, Paralyze), the farthest about 2,700 off, are fought before the walk to Ambrose.
  - clear_hostiles: {radius: 2800, height: 700}
  - walk_to: {x: -960, y: -880, z: 1280, radius: 64, timeout_seconds: 20, close_dialogs: true}
  - play_lua: {source: "click(63); wait(1); for _ = 1, 20 do if door_state(12) == 'open' then break end; wait(0.5) end; if door_state(12) ~= 'open' then error('the yard gate did not open: ' .. door_state(12)) end"}
  - walk_to: {x: -960, y: -1400, z: 1280, radius: 64, timeout_seconds: 20, close_dialogs: true}
  # Ambrose by his griffin on the landing (the placed actor 0, npc 5512): Fly us out ("Are you ready to leave this
  # awful place, friends?") calls m27.fly_out, which sets the party down on D4's north shore (entrance:dd14_griffin),
  # facing west. The perch (event 2) asks the same question; the talk is the way a player meets first.
  - walk_to: {x: 220, y: -1700, z: 1280, radius: 64, timeout_seconds: 20, clear_hostiles: 1500, clear_height: 700, close_dialogs: true}
  - interact_actor: {actor_index: 0}
  - advance_runtime: {seconds: 0.5}
  - assert: {dialog: {active: true, source_id: 5512}}
  - select_topic: {match_label: "Fly us out"}
  - advance_runtime: {seconds: 1.5, follow_map_move: true}
  - assert: {map: xeen_d4.odm}
  - assert: {party_position: {x: 6144, y: 5120, radius: 160, facing: 1024, facing_within: 64}}
  - play_lua:
      source: |
        local s = status()
        if not string.find(s, "skims the lake", 1, true) then log("ISSUE m27.fly_out's status line not seen on D4: " .. s) end
        wait(1); for _ = 1, 3 do if not close() then break end end
        log("61 done: " .. classes() .. "; experience " .. experience(0) .. "; gold " .. gold() .. "; Energy Disks " .. item_count(12334))
  - assert: {qbit_set: [111501, 111502, 111503, 111540, 111543, 117480]}
  - assert: {qbit_clear: [111542]}
  - save_game: {name: "61 Castle Blackfang", path: output/playthrough/xeen/checkpoints/61_blackfang.oysav}
