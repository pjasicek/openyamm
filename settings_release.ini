; OpenYAMM settings
; Volumes use the original-style 0..9 scale.

[assets]
root=

[audio]
sound_volume=3
music_volume=2
voice_volume=3

[controls]
turn_rate=smooth
control_scheme=modern
walksound=true
show_hits=true
always_run=true
flip_on_exit=false
mouse_sensitivity=100

[gameplay]
keyboard_interaction_depth=512
mouse_interaction_depth=512
combat_text=true
combat_actor_hp_bars=false
combat_target_panel=true
context_action_popup=false

[startup]
start_in_main_menu=true

[features]
bolster_monsters=true
outdoor_pathfinding=true
indoor_pathfinding=true
monster_projectile_visuals=fx_recipes
blaster_skill_scaling=scaling_damage
blaster_min_recovery=default

[logging]
indoor_visibility=false
indoor_pathfinding=false
fps_trace=true
performance_trace=false
hitch_trace=true
collision_trace=false
combat_trace=false
combat_trace_file=logs/combat_trace.log
combat_trace_append=true
hitch_threshold_ms=40

[input]
forward=W
backward=S
left=A
right=D
yell=Y
jump=X
combat=Return
cast_ready=Q
attack=MouseLeft
trigger=Space
cast=C
pass=B
char_cycle=Tab
quest=I
quick_ref=Z
rest=R
history=H
use=E
map_book=L
always_run_toggle=U
look_up=Page_Down
look_down=Delete
center_view=End
zoom_in=Add
zoom_out=Subtract
fly_up=J
fly_down=K
land=Home
double_speed=F2

[gamepad]
enabled=true
deadzone=0.25
look_sensitivity=1
invert_look_y=false
a=trigger
b=combat
x=use
y=cast
lb=cast_ready
rb=char_cycle
lt=jump
rt=attack
start=menu
back=quest
l3=always_run_toggle
r3=quick_ref
dpad_up=forward
dpad_down=backward
dpad_left=left
dpad_right=right

[video]
blood_splats=true
colored_lights=true
tinting=false
shadows=false
sprite_outline=false
texture_filtering=true
terrain_filtering=anisotropic
terrain_anisotropy=8x
bmodel_filtering=anisotropic
billboard_filtering=linear
ui_filtering=linear
text_filtering=nearest
minimap_filtering=linear
view_distance=default
wait_for_level_sprites=true
window_mode=windowed_fullscreen
resolution=1600x900
vsync=true
gameplay_ui_layout=widescreen

[video_quality]
texture=x1
terrain=x1
sky=x1
sprites=x1
decorations=x1
icons=x1
ui=x1
effects=x1
fonts=x1

[debug]
preseed_party=false
party_seed_roster_id=0
start_world=mm6
start_map_file=
override_start_position=true
start_x=0
start_y=0
start_z=0
start_flying=false
movement_speed_multiplier=1
immortal=false
unlimited_mana=false
new_game_god_lich=false
console=false
