name: Package builds

run-name: >-
  ${{ startsWith(github.ref, 'refs/tags/')
      && format('Release build for {0}', github.ref_name)
      || github.event_name == 'push'
      && format('Commit build for {0}', github.sha)
      || format('Nightly build for {0}', github.sha) }}

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+"
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Update the public nightly prerelease after all builds succeed
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: >-
    ${{ startsWith(github.ref, 'refs/tags/')
        && format('openyamm-release-{0}', github.ref_name)
        || github.event_name == 'push'
        && format('openyamm-commit-{0}', github.sha)
        || 'openyamm-nightly' }}
  # A replacement attempt for an unpublished tag supersedes its previous build.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name != 'push' }}

jobs:
  package_metadata:
    name: Resolve package metadata
    runs-on: ubuntu-24.04
    outputs:
      is_tag: ${{ steps.resolve.outputs.is_tag }}
      version: ${{ steps.resolve.outputs.version }}
      android_version_name: ${{ steps.resolve.outputs.android_version_name }}
      android_version_code: ${{ steps.resolve.outputs.android_version_code }}
      android_asset_name: ${{ steps.resolve.outputs.android_asset_name }}
      windows_asset_name: ${{ steps.resolve.outputs.windows_asset_name }}
      flatpak_asset_name: ${{ steps.resolve.outputs.flatpak_asset_name }}
      android_artifact_name: ${{ steps.resolve.outputs.android_artifact_name }}
      windows_artifact_name: ${{ steps.resolve.outputs.windows_artifact_name }}
      flatpak_artifact_name: ${{ steps.resolve.outputs.flatpak_artifact_name }}
      download_pattern: ${{ steps.resolve.outputs.download_pattern }}
      flatpak_branch: ${{ steps.resolve.outputs.flatpak_branch }}

    steps:
      - name: Validate release tag and resolve names
        id: resolve
        shell: bash
        run: |
          is_tag=false
          version=nightly
          android_version_name="nightly-$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          # One sequence for commits, nightlies and tags; published 1.0 used code 10000.
          android_version_code=$((10000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          flatpak_branch=nightly

          if (( GITHUB_RUN_NUMBER <= 0 || GITHUB_RUN_ATTEMPT <= 0 || GITHUB_RUN_ATTEMPT >= 100
                || android_version_code <= 10000 || android_version_code > 2100000000 )); then
            echo "::error::Invalid Android build sequence: $GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"

            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Release tags must use canonical X.Y versioning, for example 0.7."
              exit 1
            fi

            minor="${BASH_REMATCH[2]}"

            if (( minor > 99 )); then
              echo "::error::The minor version must be between 0 and 99."
              exit 1
            fi

            android_version_name="$version"

            if [[ "$version" == 0.0 ]]; then
              echo "::error::Release version must be greater than 0.0."
              exit 1
            fi

            is_tag=true
            flatpak_branch="$version"
          fi

          android_asset_name="OpenYAMM-$version-android-arm64.apk"
          windows_asset_name="OpenYAMM-$version-windows-x64.zip"
          flatpak_asset_name="OpenYAMM-$version-x86_64.flatpak"

          if [[ "$is_tag" == true ]]; then
            android_artifact_name="openyamm-release-$version-android-arm64"
            windows_artifact_name="$windows_asset_name"
            flatpak_artifact_name="openyamm-release-$version-flatpak-x86_64"
            download_pattern="openyamm-release-$version-*"
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            android_artifact_name="openyamm-$GITHUB_SHA-android-arm64"
            windows_artifact_name="openyamm-$GITHUB_SHA-windows-x64"
            flatpak_artifact_name="openyamm-$GITHUB_SHA-flatpak-x86_64"
            download_pattern=
          else
            android_artifact_name=openyamm-nightly-android-arm64
            windows_artifact_name="$windows_asset_name"
            flatpak_artifact_name=openyamm-nightly-flatpak-x86_64
            download_pattern='openyamm-nightly-*'
          fi

          {
            echo "is_tag=$is_tag"
            echo "version=$version"
            echo "android_version_name=$android_version_name"
            echo "android_version_code=$android_version_code"
            echo "android_asset_name=$android_asset_name"
            echo "windows_asset_name=$windows_asset_name"
            echo "flatpak_asset_name=$flatpak_asset_name"
            echo "android_artifact_name=$android_artifact_name"
            echo "windows_artifact_name=$windows_artifact_name"
            echo "flatpak_artifact_name=$flatpak_artifact_name"
            echo "download_pattern=$download_pattern"
            echo "flatpak_branch=$flatpak_branch"
          } >> "$GITHUB_OUTPUT"

  android:
    name: Android arm64 release
    needs: package_metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      OPENYAMM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.OPENYAMM_ANDROID_KEYSTORE_PASSWORD }}
      OPENYAMM_ANDROID_KEY_ALIAS: openyamm
      OPENYAMM_ANDROID_KEY_PASSWORD: ${{ secrets.OPENYAMM_ANDROID_KEYSTORE_PASSWORD }}
      OPENYAMM_ANDROID_VERSION_NAME: ${{ needs.package_metadata.outputs.android_version_name }}
      OPENYAMM_ANDROID_VERSION_CODE: ${{ needs.package_metadata.outputs.android_version_code }}

    steps:
      - name: Check out release sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /CMakeLists.txt
            /LICENSE
            /COPYRIGHT
            /settings.ini
            /cmake/
            /engine/
            /game/
            /android/
            /packaging/licenses/
            /tools/openyamm_shaderc_stubs.cpp
            /tools/cook_sprite_atlases_main.cpp
            /tools/SpriteAtlasEncode.cpp
            /tools/SpriteAtlasEncode.h
            /tools/cook_sprite_atlases.py
            /tools/package_runtime_assets.py
            /assets_cooked/android/sprites_new/
            /assets_dev/_legacy/sprites_original/
            /assets_dev/engine/
            /assets_dev/worlds/mm6/
            /assets_dev/worlds/mm7/
            /assets_dev/worlds/mm8/
            /assets_dev/worlds/mmmerge/

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/gradle.properties
            android/app/*.gradle

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgl1-mesa-dev libx11-dev libxext-dev

      - name: Restore Android signing key
        env:
          OPENYAMM_ANDROID_KEYSTORE_BASE64: ${{ secrets.OPENYAMM_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$OPENYAMM_ANDROID_KEYSTORE_BASE64" || -z "$OPENYAMM_ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Configure OPENYAMM_ANDROID_KEYSTORE_BASE64 and OPENYAMM_ANDROID_KEYSTORE_PASSWORD secrets."
            exit 1
          fi
          keystore="$RUNNER_TEMP/openyamm-package.jks"
          printf '%s' "$OPENYAMM_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -list \
            -keystore "$keystore" \
            -storepass "$OPENYAMM_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$OPENYAMM_ANDROID_KEY_ALIAS" \
            >/dev/null
          echo "OPENYAMM_ANDROID_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Configure host tools
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOPENYAMM_BUILD_DESKTOP_EXECUTABLE=OFF
          -DOPENYAMM_BUILD_TESTS=OFF
          -DOPENYAMM_BUILD_EDITOR=OFF
          -DOPENYAMM_BUILD_TOOLS=OFF
          -DSDL_ALSA=OFF
          -DSDL_JACK=OFF
          -DSDL_KMSDRM=OFF
          -DSDL_PIPEWIRE=OFF
          -DSDL_PULSEAUDIO=OFF
          -DSDL_SNDIO=OFF
          -DSDL_UNIX_CONSOLE_BUILD=ON
          -DSDL_WAYLAND=OFF
          -DSDL_X11=OFF

      - name: Build host shader compiler
        run: cmake --build build --target openyamm_shaderc --parallel 4

      - name: Build signed Android package
        run: android/build_release_apk.sh --repack-assets

      - name: Prepare Android artifact
        env:
          OUTPUT_NAME: ${{ needs.package_metadata.outputs.android_asset_name }}
        run: |
          output="$OUTPUT_NAME"
          source_apk="android/app-release.apk"
          test -s "$source_apk"
          mkdir -p dist
          cp "$source_apk" "dist/$output"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "dist/$output"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "dist/$output" > android-package-metadata.txt
          if ! grep -Fq "versionCode='$OPENYAMM_ANDROID_VERSION_CODE' versionName='$OPENYAMM_ANDROID_VERSION_NAME'" android-package-metadata.txt; then
            echo "::error::APK version does not match the resolved Android package metadata."
            exit 1
          fi
          unzip -Z1 "dist/$output" > android-package-contents.txt
          grep -Fxq "lib/arm64-v8a/libmain.so" android-package-contents.txt
          if grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/' android-package-contents.txt; then
            echo "::error::Android package contains an unexpected non-arm64 ABI."
            exit 1
          fi
          (cd dist && sha256sum "$output" > "$output.sha256")

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.package_metadata.outputs.android_artifact_name }}
          path: |
            dist/${{ needs.package_metadata.outputs.android_asset_name }}
            dist/${{ needs.package_metadata.outputs.android_asset_name }}.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  windows:
    name: Windows x64 release
    needs: package_metadata
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Preserve repository line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Check out release sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /CMakeLists.txt
            /LICENSE
            /COPYRIGHT
            /settings_release.ini
            /cmake/
            /engine/
            /game/
            /packaging/
            /tools/openyamm_shaderc_stubs.cpp
            /tools/cook_sprite_atlases_main.cpp
            /tools/SpriteAtlasEncode.cpp
            /tools/SpriteAtlasEncode.h
            /tools/cook_sprite_atlases.py
            /tools/package_runtime_assets.py
            /assets_dev/_legacy/sprites_original/
            /assets_dev/engine/
            /assets_dev/worlds/mm6/
            /assets_dev/worlds/mm7/
            /assets_dev/worlds/mm8/
            /assets_dev/worlds/mmmerge/

      - name: Install MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python

      - name: Configure release build
        run: >-
          cmake -S . -B build-nightly-windows -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOPENYAMM_BUILD_DESKTOP_EXECUTABLE=ON
          -DOPENYAMM_BUILD_TESTS=OFF
          -DOPENYAMM_BUILD_EDITOR=OFF
          -DOPENYAMM_BUILD_TOOLS=OFF

      - name: Build Windows package
        run: >-
          cmake --build build-nightly-windows
          --target openyamm_windows_release_zip
          --parallel 4

      - name: Prepare Windows artifact
        env:
          OUTPUT_NAME: ${{ needs.package_metadata.outputs.windows_asset_name }}
        run: |
          archive="build-nightly-windows/release/OpenYAMM-windows-Release.zip"
          output="$OUTPUT_NAME"
          test -s "$archive"
          cmake -E tar tf "$archive" > windows-package-contents.txt
          grep -Fxq "OpenYAMM/openyamm.exe" windows-package-contents.txt
          grep -Fxq "OpenYAMM/settings.ini" windows-package-contents.txt
          grep -Fxq "OpenYAMM/runtime/shaders/glsl/vs_outdoor_billboard_lit.bin" windows-package-contents.txt
          grep -Fxq "OpenYAMM/runtime/shaders/glsl/fs_sprite_atlas.bin" windows-package-contents.txt
          grep -Fxq "OpenYAMM/runtime/shaders/glsl/vs_model.bin" windows-package-contents.txt
          grep -Fxq "OpenYAMM/runtime/shaders/glsl/vs_model_shadow.bin" windows-package-contents.txt
          if grep -Eq '^OpenYAMM/runtime/shaders/dxbc(/|$)' windows-package-contents.txt; then
            echo "::error::Windows package contains unused DirectX shaders."
            exit 1
          fi
          grep -Fxq "OpenYAMM/assets/engine.zip" windows-package-contents.txt
          grep -Fxq "OpenYAMM/assets/worlds/mm6.zip" windows-package-contents.txt
          grep -Fxq "OpenYAMM/assets/worlds/mm7.zip" windows-package-contents.txt
          grep -Fxq "OpenYAMM/assets/worlds/mm8.zip" windows-package-contents.txt
          grep -Fxq "OpenYAMM/assets/worlds/mmmerge.zip" windows-package-contents.txt
          mkdir -p dist
          cp "$archive" "dist/$output"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.package_metadata.outputs.windows_artifact_name }}
          path: dist/${{ needs.package_metadata.outputs.windows_asset_name }}
          archive: false
          if-no-files-found: error
          retention-days: 1

  flatpak:
    name: Flatpak x86_64 release
    needs: package_metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Check out release sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /CMakeLists.txt
            /LICENSE
            /COPYRIGHT
            /settings_release.ini
            /cmake/
            /engine/
            /game/
            /packaging/
            /tools/openyamm_shaderc_stubs.cpp
            /tools/cook_sprite_atlases_main.cpp
            /tools/SpriteAtlasEncode.cpp
            /tools/SpriteAtlasEncode.h
            /tools/cook_sprite_atlases.py
            /tools/package_runtime_assets.py
            /assets_dev/_legacy/sprites_original/
            /assets_dev/engine/
            /assets_dev/worlds/mm6/
            /assets_dev/worlds/mm7/
            /assets_dev/worlds/mm8/
            /assets_dev/worlds/mmmerge/

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y elfutils flatpak flatpak-builder ostree \
            librsvg2-common libgl1-mesa-dev libx11-dev libxext-dev python3

      - name: Build Flatpak bundle
        env:
          BUNDLE_NAME: ${{ needs.package_metadata.outputs.flatpak_asset_name }}
          FLATPAK_BRANCH: ${{ needs.package_metadata.outputs.flatpak_branch }}
        run: |
          mkdir -p dist
          packaging/flatpak/build_flatpak.sh \
            --output-dir="$GITHUB_WORKSPACE/build-nightly-flatpak" \
            --bundle="$GITHUB_WORKSPACE/dist/$BUNDLE_NAME" \
            --branch="$FLATPAK_BRANCH" \
            --no-install \
            --add-flathub \
            --install-deps \
            --jobs=4

      - name: Prepare Flatpak artifact
        env:
          OUTPUT_NAME: ${{ needs.package_metadata.outputs.flatpak_asset_name }}
        run: |
          output="$OUTPUT_NAME"
          test -s "dist/$output"
          (cd dist && sha256sum "$output" > "$output.sha256")

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.package_metadata.outputs.flatpak_artifact_name }}
          path: |
            dist/${{ needs.package_metadata.outputs.flatpak_asset_name }}
            dist/${{ needs.package_metadata.outputs.flatpak_asset_name }}.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish nightly or tagged release
    if: >-
      startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'schedule'
      || inputs.publish_release == true
    needs:
      - package_metadata
      - android
      - windows
      - flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Check out Nextcloud uploader
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /packaging/upload_nextcloud.py
            /packaging/test_upload_nextcloud.py

      - name: Check Nextcloud uploader
        run: python3 packaging/test_upload_nextcloud.py

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: ${{ needs.package_metadata.outputs.download_pattern }}
          merge-multiple: true

      - name: Download Windows package without extracting it
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package_metadata.outputs.windows_artifact_name }}
          path: release-assets
          skip-decompress: true

      - name: Verify release assets
        env:
          ANDROID_ASSET: ${{ needs.package_metadata.outputs.android_asset_name }}
          WINDOWS_ASSET: ${{ needs.package_metadata.outputs.windows_asset_name }}
          FLATPAK_ASSET: ${{ needs.package_metadata.outputs.flatpak_asset_name }}
        run: |
          cd release-assets
          sha256sum "$WINDOWS_ASSET" > "$WINDOWS_ASSET.sha256"
          sha256sum -c "$ANDROID_ASSET.sha256"
          sha256sum -c "$WINDOWS_ASSET.sha256"
          sha256sum -c "$FLATPAK_ASSET.sha256"

      - name: Check tagged release is unpublished
        if: needs.package_metadata.outputs.is_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package_metadata.outputs.version }}
        run: |
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_VERSION already exists; tagged releases are not overwritten."
            exit 1
          fi

      - name: Upload complete packages to Nextcloud
        env:
          IS_TAG: ${{ needs.package_metadata.outputs.is_tag }}
          RELEASE_VERSION: ${{ needs.package_metadata.outputs.version }}
          OPENYAMM_NEXTCLOUD_URL: ${{ vars.OPENYAMM_NEXTCLOUD_URL || 'https://cloud.jasicek.net' }}
          OPENYAMM_NEXTCLOUD_FOLDER: ${{ vars.OPENYAMM_NEXTCLOUD_FOLDER || 'openyamm' }}
          OPENYAMM_NEXTCLOUD_PUBLIC_URL: ${{ vars.OPENYAMM_NEXTCLOUD_PUBLIC_URL }}
          OPENYAMM_NEXTCLOUD_USERNAME: ${{ secrets.OPENYAMM_NEXTCLOUD_USERNAME }}
          OPENYAMM_NEXTCLOUD_APP_PASSWORD: ${{ secrets.OPENYAMM_NEXTCLOUD_APP_PASSWORD }}
        run: |
          remote_path="nightly/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ "$IS_TAG" == true ]]; then
            remote_path="releases/$RELEASE_VERSION/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          python3 packaging/upload_nextcloud.py release-assets \
            --remote-path "$remote_path" \
            --links-file nextcloud-downloads.md
          cat nextcloud-downloads.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub release
        if: vars.OPENYAMM_NEXTCLOUD_PUBLIC_URL != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IS_TAG: ${{ needs.package_metadata.outputs.is_tag }}
          RELEASE_VERSION: ${{ needs.package_metadata.outputs.version }}
          ANDROID_ASSET: ${{ needs.package_metadata.outputs.android_asset_name }}
          WINDOWS_ASSET: ${{ needs.package_metadata.outputs.windows_asset_name }}
          FLATPAK_ASSET: ${{ needs.package_metadata.outputs.flatpak_asset_name }}
        run: |
          if [[ "$IS_TAG" == true ]]; then
            gh release create "$RELEASE_VERSION" release-assets/*.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "OpenYAMM $RELEASE_VERSION" \
              --notes-file nextcloud-downloads.md \
              --generate-notes
            exit 0
          fi

          short_sha="${GITHUB_SHA:0:12}"
          built_at="$(date -u '+%Y-%m-%d %H:%M UTC')"
          commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          printf '%s\n' \
            '# OpenYAMM nightly build' \
            '' \
            "Automated Windows, Flatpak, and Android packages from commit [$short_sha]($commit_url)." \
            "Built: $built_at" \
            '' \
            "- \`$WINDOWS_ASSET\` — unsigned Windows x64 release" \
            "- \`$FLATPAK_ASSET\` — x86_64 Flatpak bundle" \
            "- \`$ANDROID_ASSET\` — signed Android arm64 release" \
            '- Matching `.sha256` files verify each download' \
            '' \
            'Nightlies are development snapshots and may be unstable. Existing saves should be backed up.' \
            > nightly-release-notes.md
          printf '\n## Downloads\n\n' >> nightly-release-notes.md
          cat nextcloud-downloads.md >> nightly-release-notes.md

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" \
              -F force=true \
              >/dev/null
          else
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/nightly' \
              -f sha="$GITHUB_SHA" \
              >/dev/null
          fi

          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit nightly \
              --repo "$GITHUB_REPOSITORY" \
              --title 'OpenYAMM nightly' \
              --notes-file nightly-release-notes.md \
              --prerelease
          else
            gh release create nightly \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title 'OpenYAMM nightly' \
              --notes-file nightly-release-notes.md \
              --prerelease
          fi

          gh release upload nightly release-assets/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          # Remove the previous bundled downloads now that verified replacements are linked above.
          gh release view nightly --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' > previous-nightly-assets.txt
          for asset in "$ANDROID_ASSET" "$WINDOWS_ASSET" "$FLATPAK_ASSET"; do
            if grep -Fxq "$asset" previous-nightly-assets.txt; then
              gh release delete-asset nightly "$asset" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done

      - name: Remove previous Nextcloud nightlies
        if: needs.package_metadata.outputs.is_tag != 'true'
        env:
          OPENYAMM_NEXTCLOUD_URL: ${{ vars.OPENYAMM_NEXTCLOUD_URL || 'https://cloud.jasicek.net' }}
          OPENYAMM_NEXTCLOUD_FOLDER: ${{ vars.OPENYAMM_NEXTCLOUD_FOLDER || 'openyamm' }}
          OPENYAMM_NEXTCLOUD_USERNAME: ${{ secrets.OPENYAMM_NEXTCLOUD_USERNAME }}
          OPENYAMM_NEXTCLOUD_APP_PASSWORD: ${{ secrets.OPENYAMM_NEXTCLOUD_APP_PASSWORD }}
        run: |
