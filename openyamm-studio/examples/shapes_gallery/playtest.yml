        if door_state(30) ~= "closed" then error("the lever did not lower the lift: " .. door_state(30)) end
        click(46); wait(3)
        if door_state(32) ~= "closed" then error("the lever's arm did not rise again: " .. door_state(32)) end
        if door_state(30) ~= "open" then error("the lever did not raise the lift again: " .. door_state(30)) end
        click(45); wait(3)
        if door_state(31) ~= "open" then error("the button was not pushed in: " .. door_state(31)) end
        click(45); wait(3)
