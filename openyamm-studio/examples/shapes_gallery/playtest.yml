      source: |
        for _, door in ipairs({21, 22, 23, 24, 25, 26, 27, 28}) do
          if door_state(door) ~= "closed" then error("door " .. door .. " does not start shut") end
        end
  # Two leaves that fold against their jambs: the doorway is the cell's whole wall, 512 wide, and the next cell
  # stands 32 beside it. Shut, they stop a straight walk; folded, the walk goes through.
