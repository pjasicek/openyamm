  - assert: {party_position: {x: -2848, y: 1824, radius: 80, z_min: 188, z_max: 196}}
  # The sealed door: four quarters on two folding leaves.
  - walk_to: {x: -2368, y: 1500, z: 192, radius: 48, timeout_seconds: 60}
  - play_lua:
      source: |
        click(38); wait(3)
        if door_state(27) ~= "open" or door_state(28) ~= "open" then
          error("the sealed door did not open: " .. door_state(27) .. ", " .. door_state(28))
