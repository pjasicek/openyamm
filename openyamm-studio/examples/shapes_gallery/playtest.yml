        click(49); wait(3)
  - assert: {state_dump_map_var: {index: 17, value: 1}}
  - play_lua: {source: "click(49); wait(3)"}
  - assert: {state_dump_map_var: {index: 17, value: 0}}
  - play_lua:
      source: |
        click(50); wait(2)
