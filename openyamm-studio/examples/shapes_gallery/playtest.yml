      input: forward
      seconds: 3
      actor_collision: false
      actor_ai: false
      start: {map: studio02.blv, x: -2848, y: 1440, z: 192, yaw_degrees: 90, pitch: 0}
      expect_stop: {map: studio02.blv, x: -2848, y: 1640, z: 192, yaw_degrees: 90, pitch: 0}
      loose_tolerance: true
      tolerance_xy: 50
      tolerance_z: 8
