# The S3 acceptance walk through every new room shape: openyamm-studio/tests/run_shapes.sh builds, mounts and
# plays it. The heights asserted are the proof that the steps and the ramp are walked, not jumped or fallen.
id: studio.shapes_gallery.walk
title: The Shapes Gallery, through every shape
world: mm6
mode: faithful
steps:
  - new_game_flow:
      start_map: studio02.blv
  - assert: {map: studio02.blv}
  - setup_shortcut: {kind: immortal, value: true}
  # Events without a clicked object (map variables as ids.lock.yml numbers them: 0 the gate plate's once, 1
  # in_vault, 2 chimes, 3 in_pit, 4 on_pedestal, 5 vault_burned). The load event has run (7 gold on top of the
  # party's 10000); the vault's door starts shut.
  - assert: {gold: 10007}
  - play_lua:
      source: |
        if door_state(3) ~= "closed" then error("the vault door does not start shut") end
  # Into the trigger room (its own floor is a step source: in_vault 0) and onto the raised plate: its step
  # event opens the vault's door, once.
  - walk_to: {x: 400, y: 800, z: 0, radius: 64, timeout_seconds: 60}
  - walk_to: {x: 650, y: 800, z: 0, radius: 40, timeout_seconds: 60}
  - assert: {state_dump_map_var: {index: 0, value: 0}}
  - walk_to: {x: 800, y: 800, z: 4, radius: 40, timeout_seconds: 60}
  - assert: {party_position: {x: 800, y: 800, radius: 56, z_min: 2, z_max: 6}}
  - assert: {state_dump_map_var: {index: 0, value: 1}}
  - play_lua:
      source: |
        wait(3)
        if door_state(3) ~= "open" then error("the plate did not open the vault door: " .. door_state(3)) end
  # The flat plate runs its event each time the party comes onto it: on, off, on again counts two.
  - walk_to: {x: 672, y: 944, z: 0, radius: 30, timeout_seconds: 60}
  - assert: {state_dump_map_var: {index: 2, value: 1}}
  - walk_to: {x: 800, y: 944, z: 0, radius: 30, timeout_seconds: 60}
  - assert: {state_dump_map_var: {index: 2, value: 1}}
  - walk_to: {x: 672, y: 944, z: 0, radius: 30, timeout_seconds: 60}
  - assert: {state_dump_map_var: {index: 2, value: 2}}
  # A platform's top as a step source: the pedestal casts a fire bolt along the north wall.
  - assert: {state_dump_map_var: {index: 4, value: 0}}
  - walk_to: {x: 800, y: 656, z: 0, radius: 30, timeout_seconds: 60}
  - walk_to: {x: 928, y: 656, z: 16, radius: 30, timeout_seconds: 60}
  - assert: {party_position: {x: 928, y: 656, radius: 48, z_min: 12, z_max: 20}}
  - assert: {state_dump_map_var: {index: 4, value: 1}}
  # A sunken level as a step source and as lava: its event runs and standing in it burns (the party is mortal
  # for these seconds: an immortal party takes no damage). The timer has run all the while and done nothing: its
  # condition (in_vault) does not hold.
  - assert: {party_health: {full: true}}
  - setup_shortcut: {kind: immortal, value: false}
  - assert: {state_dump_map_var: {index: 3, value: 0}}
  - assert: {state_dump_map_var: {index: 5, value: 0}}
  - walk_to: {x: 928, y: 800, z: 0, radius: 30, timeout_seconds: 60}
  - walk_to: {x: 928, y: 944, z: -16, radius: 30, timeout_seconds: 60}
  - play_lua: {source: "wait(3)"}
  - assert: {party_position: {x: 928, y: 944, radius: 48, z_min: -20, z_max: -12}}
  - assert: {state_dump_map_var: {index: 3, value: 1}}
  - assert: {party_health: {full: false}}
  - setup_shortcut: {kind: immortal, value: true}
  # The vault's own floor sets in_vault; the timer reads it every two seconds and burns the party.
  - walk_to: {x: 928, y: 800, z: 0, radius: 30, timeout_seconds: 60}
  - assert: {state_dump_map_var: {index: 1, value: 0}}
  - walk_to: {x: 1200, y: 800, z: 0, radius: 48, timeout_seconds: 60}
  - assert: {state_dump_map_var: {index: 1, value: 1}}
  - play_lua: {source: "wait(5)"}
  - assert: {state_dump_map_var: {index: 5, value: 1}}
  # Back on the trigger room's floor the variable is cleared.
  - walk_to: {x: 900, y: 800, z: 0, radius: 40, timeout_seconds: 60}
  - assert: {state_dump_map_var: {index: 1, value: 0}}
  - walk_to: {x: 650, y: 800, z: 0, radius: 40, timeout_seconds: 60}
  - walk_to: {x: 400, y: 800, z: 0, radius: 64, timeout_seconds: 60}
  - walk_to: {x: 256, y: 256, z: 0, radius: 96, timeout_seconds: 60}
  # Round the L of the hall, past the pillar.
  - walk_to: {x: 256, y: 880, z: 0, radius: 96, timeout_seconds: 60}
  # The guard post west of the hall's north arm. A placed monster (a Goblin Lord, monster 273) stands at its post:
  # peaceful by the project's word (its kind is hostile; the build's own load event clears its group's Hostile
  # bit) and, being `immobile`, still there after a while.
  - walk_to: {x: -128, y: 864, z: 0, radius: 48, timeout_seconds: 60}
  - assert: {actor_count: {monster_id: 273, near: [-256, 928, 40], hostile: false, min: 1, max: 1}}
  - play_lua: {source: "wait(4)"}
  - assert: {actor_count: {monster_id: 273, near: [-256, 928, 40], hostile: false, min: 1, max: 1}}
  # (The only hostile monster of the map is the boss in the tunnel off the apse, a Goblin, monster 271.)
  - assert: {actor_count: {monster_id: 273, hostile: true, max: 0}}
  - assert: {actor_count: {hostile: true, max: 1}}
  # The key on the floor (item 2109) is picked up as a player picks it up.
  - pick_up: {item_id: 2109}
  - play_lua:
      source: |
        if not has_item(2109) then error("the key on the guard post's floor was not picked up") end
  # A platform that is clicked and does not move (event 24 adds to map variable 7), and a wall panel that is read
  # (event 23): the use key at each from in front of it.
  - assert: {state_dump_map_var: {index: 7, value: 0}}
  - interact_target:
      method: keyboard
      has_hit: true
      can_activate: true
      kind: event_target
      triggered_event: 24
      pose: {x: -150, y: 800, z: 0, map: studio02.blv, yaw: 3.14159, pitch: -0.6}
  - assert: {state_dump_map_var: {index: 7, value: 1}}
  - interact_target:
      method: keyboard
      has_hit: true
      can_activate: true
      kind: event_target
      triggered_event: 23
      pose: {x: -200, y: 864, z: 0, map: studio02.blv, yaw: 3.14159, pitch: -0.25}
  # A notice (a text titled as a sign) shows its text in a message window, as the shipped maps' signs do; the
  # player reads it and closes it.
  - assert:
      dialog: {text_contains: "The guard keeps the key."}
  - play_lua:
      source: |
        if not close() then error("the notice opened no message window") end
  # The rig south of the guard post. A lever on a post (a switch on a platform's side, event 29) parts a gate of
  # two halves: the upper (door 19) rises into the ceiling, the lower (door 20) sinks into the floor.
  - walk_to: {x: -192, y: 800, z: 0, radius: 40, timeout_seconds: 60}
  - walk_to: {x: -192, y: 650, z: 0, radius: 40, timeout_seconds: 60}
  - play_lua:
      source: |
        if door_state(19) ~= "closed" or door_state(20) ~= "closed" then error("the gate does not start shut") end
  - interact_target:
      method: keyboard
      has_hit: true
      can_activate: true
      kind: event_target
      triggered_event: 29
      pose: {x: -200, y: 670, z: 0, map: studio02.blv, yaw: -1.5708, pitch: -0.5}
  - play_lua:
      source: |
        wait(3)
        if door_state(19) ~= "open" or door_state(20) ~= "open" then
          error("the lever did not part the gate: " .. door_state(19) .. ", " .. door_state(20))
        end
  # A button in the south wall (a mover, door 17, clicked itself: event 26) is pushed 8 into the wall.
  - interact_target:
      method: keyboard
      has_hit: true
      can_activate: true
      kind: event_target
      triggered_event: 26
      pose: {x: -120, y: 520, z: 0, map: studio02.blv, yaw: -1.5708, pitch: -0.55}
  - play_lua:
      source: |
        wait(2)
        if door_state(17) ~= "open" then error("the wall button was not pushed in: " .. door_state(17)) end
  # Through the gate to the deck (door 18): the button on its side (a switch on a mover, event 28) sends it up
  # and down, and rides with it; so do the chest on it and its two posts.
  - walk_to: {x: -350, y: 568, z: 0, radius: 40, timeout_seconds: 60}
  - interact_target:
      method: keyboard
      has_hit: true
      can_activate: true
      kind: event_target
      triggered_event: 28
      pose: {x: -350, y: 568, z: 0, map: studio02.blv, yaw: 3.14159, pitch: -1.08}
  - play_lua:
      source: |
        wait(2)
        if door_state(18) ~= "open" then error("the deck did not rise: " .. door_state(18)) end
  # Raised by 40 the button is 40 higher: the use key finds it there.
  - interact_target:
      method: keyboard
      has_hit: true
      can_activate: true
      kind: event_target
      triggered_event: 28
      pose: {x: -350, y: 568, z: 0, map: studio02.blv, yaw: 3.14159, pitch: -0.95}
  - play_lua:
      source: |
        wait(2)
        if door_state(18) ~= "closed" then error("the deck did not come down: " .. door_state(18)) end
  # Onto the deck beside its chest, and up with it.
  - walk_to: {x: -462, y: 568, z: 16, radius: 24, timeout_seconds: 60}
  - assert: {party_position: {x: -462, y: 568, radius: 40, z_min: 12, z_max: 20}}
  - play_lua:
      source: |
        click(28); wait(2)
        if door_state(18) ~= "open" then error("the deck did not rise under the party: " .. door_state(18)) end
  - assert: {party_position: {x: -462, y: 568, radius: 40, z_min: 52, z_max: 60}}
  - play_lua: {source: "click(28); wait(2)"}
  - assert: {party_position: {x: -462, y: 568, radius: 40, z_min: 12, z_max: 20}}
  - walk_to: {x: -350, y: 568, z: 0, radius: 40, timeout_seconds: 60}
  - walk_to: {x: -192, y: 650, z: 0, radius: 40, timeout_seconds: 60}
  - walk_to: {x: -192, y: 800, z: 0, radius: 40, timeout_seconds: 60}
  - walk_to: {x: -128, y: 864, z: 0, radius: 48, timeout_seconds: 60}
  - walk_to: {x: 256, y: 880, z: 0, radius: 96, timeout_seconds: 60}
  - walk_to: {x: 256, y: 256, z: 0, radius: 96, timeout_seconds: 60}
  # West of the hall: up the ramp under its parallel ceiling into the loft under the lean-to ceiling.
  - walk_to: {x: 60, y: 256, z: 0, radius: 64, timeout_seconds: 60}
  - walk_to: {x: -320, y: 256, z: 96, radius: 48, timeout_seconds: 60}
  - assert: {party_position: {x: -320, y: 256, radius: 70, z_min: 70, z_max: 125}}
  - walk_to: {x: -700, y: 256, z: 192, radius: 48, timeout_seconds: 60}
  - assert: {party_position: {x: -700, y: 256, radius: 70, z_min: 188, z_max: 196}}
  # Round the hole and the stairwell to the rotunda under its leaning dome, and back.
  - walk_to: {x: -700, y: -40, z: 192, radius: 48, timeout_seconds: 60}
  - walk_to: {x: -1380, y: -40, z: 192, radius: 48, timeout_seconds: 60}
  - walk_to: {x: -1380, y: 256, z: 192, radius: 48, timeout_seconds: 60}
  - walk_to: {x: -1792, y: 256, z: 192, radius: 64, timeout_seconds: 60}
  - assert: {party_position: {x: -1792, y: 256, radius: 90, z_min: 188, z_max: 196}}
  - walk_to: {x: -1380, y: 256, z: 192, radius: 48, timeout_seconds: 60}
  - walk_to: {x: -1380, y: -40, z: 192, radius: 48, timeout_seconds: 60}
  # The upper of the two doorways in the atrium's north wall: through it at the loft's height, then off its edge
  # down to the atrium's floor.
  - walk_to: {x: -864, y: -40, z: 192, radius: 48, timeout_seconds: 60}
  - walk_to: {x: -864, y: -200, z: 192, radius: 40, timeout_seconds: 60}
  - assert: {party_position: {x: -864, y: -200, radius: 56, z_min: 188, z_max: 196}}
  - walk_to: {x: -864, y: -420, z: -64, radius: 64, timeout_seconds: 60}
  - play_lua: {source: "wait(1)"}
  - assert: {party_position: {x: -864, y: -420, radius: 90, z_min: -68, z_max: -60}}
  # Back through the lower doorway, straight under the upper one, into the undercroft.
  - walk_to: {x: -864, y: -224, z: -64, radius: 40, timeout_seconds: 60}
  - assert: {party_position: {x: -864, y: -224, radius: 56, z_min: -68, z_max: -60}}
  - walk_to: {x: -864, y: -96, z: -64, radius: 48, timeout_seconds: 60}
  # Up the stairwell: its ceiling is a hole in the loft's floor, and its top step ends one rise under that floor.
  - walk_to: {x: -1184, y: -96, z: -64, radius: 48, timeout_seconds: 60}
  - walk_to: {x: -1184, y: 352, z: 64, radius: 40, timeout_seconds: 60}
  - assert: {party_position: {x: -1184, y: 352, radius: 60, z_min: 60, z_max: 100}}
  - walk_to: {x: -1184, y: 640, z: 192, radius: 40, timeout_seconds: 60}
  - assert: {party_position: {x: -1184, y: 640, radius: 56, z_min: 188, z_max: 196}}
  # Into the hole in the loft's floor: a fall through the floor's thickness onto the undercroft's floor.
  - walk_to: {x: -864, y: 520, z: 192, radius: 40, timeout_seconds: 60}
  - assert: {party_position: {x: -864, y: 520, radius: 56, z_min: 188, z_max: 196}}
  - walk_to: {x: -864, y: 320, z: -64, radius: 48, timeout_seconds: 60}
  - play_lua: {source: "wait(1)"}
  - assert: {party_position: {x: -864, y: 320, radius: 96, z_min: -68, z_max: -60}}
  # Out by the stairwell again and back down the ramp to the hall.
  - walk_to: {x: -864, y: -96, z: -64, radius: 48, timeout_seconds: 60}
  - walk_to: {x: -1184, y: -96, z: -64, radius: 48, timeout_seconds: 60}
  - walk_to: {x: -1184, y: 640, z: 192, radius: 40, timeout_seconds: 60}
  - walk_to: {x: -700, y: 480, z: 192, radius: 48, timeout_seconds: 60}
  - walk_to: {x: -700, y: 256, z: 192, radius: 48, timeout_seconds: 60}
  - walk_to: {x: 60, y: 256, z: 0, radius: 64, timeout_seconds: 60}
  - walk_to: {x: 256, y: 256, z: 0, radius: 96, timeout_seconds: 60}
  # The split-level hall: in on the gallery, down the north flight to the sunken floor, across it, up the south
  # flight, and back the same way.
  - walk_to: {x: 512, y: 60, z: 0, radius: 64, timeout_seconds: 60}
  - walk_to: {x: 512, y: -200, z: 0, radius: 64, timeout_seconds: 60}
  - walk_to: {x: 512, y: -704, z: -128, radius: 64, timeout_seconds: 60}
  # The party runs down the steps faster than it falls: let it land.
  - play_lua: {source: "wait(1)"}
  - assert: {party_position: {x: 512, y: -704, radius: 90, z_min: -132, z_max: -124}}
  - walk_to: {x: 512, y: -1210, z: 0, radius: 64, timeout_seconds: 60}
  - assert: {party_position: {x: 512, y: -1210, radius: 90, z_min: -4, z_max: 4}}
  - walk_to: {x: 512, y: -704, z: -128, radius: 64, timeout_seconds: 60}
  - walk_to: {x: 512, y: -200, z: 0, radius: 64, timeout_seconds: 60}
  # East of the split-level hall: the panel room behind its door (door 4, event 12), whose leaf has a surface for
  # each side.
  - walk_to: {x: 940, y: -200, z: 0, radius: 48, timeout_seconds: 60}
  - walk_to: {x: 940, y: -1024, z: 0, radius: 48, timeout_seconds: 60}
  - play_lua:
      source: |
        if door_state(4) ~= "closed" then error("the panel room's door does not start shut") end
        click(12); wait(3)
        if door_state(4) ~= "open" then error("the panel room's door did not open: " .. door_state(4)) end
  - walk_to: {x: 1300, y: -1024, z: 0, radius: 64, timeout_seconds: 60}
  - assert: {party_position: {x: 1300, y: -1024, radius: 90, z_min: -4, z_max: 4}}
  # The tunnel that climbs round a bend (a path room with a slope): 0 at its first point, 104 where the bend
  # begins (384 of 949 units of path), 152 where it ends (565 of 949), 256 at its last point. The heights are
  # the proof that the party walks up the floor.
  - walk_to: {x: 1640, y: -1024, z: 0, radius: 40, timeout_seconds: 60}
  - walk_to: {x: 1984, y: -1024, z: 104, radius: 32, timeout_seconds: 60}
  - assert: {party_position: {x: 1984, y: -1024, radius: 48, z_min: 88, z_max: 120}}
  - walk_to: {x: 2112, y: -896, z: 152, radius: 32, timeout_seconds: 60}
  - assert: {party_position: {x: 2112, y: -896, radius: 48, z_min: 136, z_max: 168}}
  - walk_to: {x: 2112, y: -704, z: 204, radius: 32, timeout_seconds: 60}
  - assert: {party_position: {x: 2112, y: -704, radius: 48, z_min: 188, z_max: 220}}
  - walk_to: {x: 2112, y: -400, z: 256, radius: 48, timeout_seconds: 60}
  - assert: {party_position: {x: 2112, y: -400, radius: 64, z_min: 252, z_max: 260}}
  # Up the flight with wooden treads onto the block, and up the steps with wooden treads behind the doorway.
  - walk_to: {x: 2112, y: -200, z: 256, radius: 40, timeout_seconds: 60}
  - walk_to: {x: 2060, y: -64, z: 256, radius: 32, timeout_seconds: 60}
  - walk_to: {x: 2368, y: -64, z: 352, radius: 40, timeout_seconds: 60}
  - assert: {party_position: {x: 2368, y: -64, radius: 56, z_min: 348, z_max: 356}}
  - walk_to: {x: 2060, y: -64, z: 256, radius: 32, timeout_seconds: 60}
  - walk_to: {x: 2400, y: -224, z: 256, radius: 40, timeout_seconds: 60}
  - walk_to: {x: 2752, y: -224, z: 352, radius: 30, timeout_seconds: 60}
  - assert: {party_position: {x: 2752, y: -224, radius: 46, z_min: 316, z_max: 388}}
  - walk_to: {x: 2880, y: -224, z: 416, radius: 30, timeout_seconds: 60}
  - assert: {party_position: {x: 2880, y: -224, radius: 46, z_min: 412, z_max: 420}}
  # The tunnels east of the climbing tunnel's head. Through the six-sided mouth in the hall's wall into the tunnel
  # (a `path` room with a `section`), through the doorway in its level side into the nook and back, up its ramp
  # (a height at each path point), through the doorway in the climbing side (level on the floor at its higher
  # jamb, 336) into the side room, round the mitred bend, through the joint with the next tunnel (open over the
  # whole section) and out of its square end into the cell.
  - walk_to: {x: 2400, y: -224, z: 256, radius: 40, timeout_seconds: 60}
  - walk_to: {x: 2400, y: -416, z: 256, radius: 40, z_tolerance: 8, timeout_seconds: 60}
  - walk_to: {x: 2784, y: -700, z: 256, radius: 40, z_tolerance: 8, timeout_seconds: 60}
  - walk_to: {x: 3200, y: -768, z: 256, radius: 40, z_tolerance: 8, timeout_seconds: 60}
  - assert: {party_position: {x: 3200, y: -768, radius: 56, z_min: 252, z_max: 260}}
  - walk_to: {x: 3296, y: -1056, z: 256, radius: 40, z_tolerance: 8, timeout_seconds: 60}
  - assert: {party_position: {x: 3296, y: -1056, radius: 56, z_min: 252, z_max: 260}}
  - walk_to: {x: 3296, y: -768, z: 256, radius: 40, z_tolerance: 8, timeout_seconds: 60}
  - walk_to: {x: 3808, y: -768, z: 320, radius: 40, z_tolerance: 12, timeout_seconds: 60}
  - assert: {party_position: {x: 3808, y: -768, radius: 56, z_min: 308, z_max: 332}}
  - walk_to: {x: 3808, y: -480, z: 320, radius: 40, z_tolerance: 8, timeout_seconds: 60}
  - assert: {party_position: {x: 3808, y: -480, radius: 56, z_min: 316, z_max: 324}}
  - walk_to: {x: 3900, y: -768, z: 343, radius: 40, z_tolerance: 12, timeout_seconds: 60}
  - walk_to: {x: 4064, y: -768, z: 384, radius: 40, z_tolerance: 8, timeout_seconds: 60}
  - walk_to: {x: 4064, y: -1400, z: 384, radius: 40, z_tolerance: 8, timeout_seconds: 60}
  - assert: {party_position: {x: 4064, y: -1400, radius: 56, z_min: 380, z_max: 388}}
  # On the way the party crossed the plate that lies across the tunnel's floor (map variable 6, tunnel_pads).
  - assert: {state_dump_map_var: {index: 6, value: 1}}
  - walk_to: {x: 4064, y: -2080, z: 384, radius: 40, z_tolerance: 8, timeout_seconds: 60}
  # Into the tube with banks through its eight-sided mouth, and up its south bank: 110 from the middle the bank
  # stands 38 above the floor (it rises 74 over 90, which the party walks).
  - walk_to: {x: 4576, y: -2080, z: 384, radius: 40, z_tolerance: 8, timeout_seconds: 60}
  - assert: {party_position: {x: 4576, y: -2080, radius: 56, z_min: 380, z_max: 388}}
  - walk_to: {x: 4576, y: -2190, z: 422, radius: 30, z_tolerance: 14, timeout_seconds: 60}
  - assert: {party_position: {x: 4576, y: -2190, radius: 48, z_min: 408, z_max: 436}}
  # And back the same way to the head of the climbing tunnel.
  - walk_to: {x: 4064, y: -2080, z: 384, radius: 40, z_tolerance: 8, timeout_seconds: 60}
  - walk_to: {x: 4064, y: -768, z: 384, radius: 40, z_tolerance: 8, timeout_seconds: 60}
  - walk_to: {x: 3200, y: -768, z: 256, radius: 40, z_tolerance: 8, timeout_seconds: 60}
  - walk_to: {x: 2784, y: -700, z: 256, radius: 40, z_tolerance: 8, timeout_seconds: 60}
  - walk_to: {x: 2400, y: -416, z: 256, radius: 40, z_tolerance: 8, timeout_seconds: 60}
  # Back down the tunnel into the hall.
  - walk_to: {x: 2400, y: -224, z: 256, radius: 40, timeout_seconds: 60}
  - walk_to: {x: 2112, y: -400, z: 256, radius: 48, timeout_seconds: 60}
  - walk_to: {x: 2112, y: -896, z: 152, radius: 32, timeout_seconds: 60}
  - walk_to: {x: 1984, y: -1024, z: 104, radius: 32, timeout_seconds: 60}
  - walk_to: {x: 1640, y: -1024, z: 0, radius: 40, timeout_seconds: 60}
  - assert: {party_position: {x: 1640, y: -1024, radius: 56, z_min: -4, z_max: 28}}
  - walk_to: {x: 1300, y: -1024, z: 0, radius: 64, timeout_seconds: 60}
  - walk_to: {x: 940, y: -1024, z: 0, radius: 48, timeout_seconds: 60}
