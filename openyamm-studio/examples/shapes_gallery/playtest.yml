  - assert: {state_dump_map_var: {index: 9, value: 1}}
  # Into the tunnel whose section has one highest point, and back.
  - walk_to: {x: 2800, y: -1596, z: 416, radius: 30, z_tolerance: 8, timeout_seconds: 60}
