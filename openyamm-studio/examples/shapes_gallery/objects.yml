format: 0
start:
  room: room:hall
  at: [256, 256]
  facing: e
doors:
  - id: door:closet
    opening: open:gallery_closet
    kind: hinged
    hinge: left
    speed: 90
  - id: door:leaf_fold
    opening: open:leaf_hall_fold
    kind: slide_left
    leaves: 2
    fold: true
    pictures:
      - [{texture: hvdord, size: [256, 256]}, {texture: hvdord, size: [256, 256]}]
  - id: door:leaf_mirror
    opening: open:pair_leaf_hall
    kind: slide_up
    back_surface: {texture: swpnl, size: [128, 256]}
    pictures:
      - [{texture: swaled, size: [128, 256]}, {texture: swaled, size: [128, 256], mirror: true}]
  - id: door:leaf_part
    opening: open:leaf_hall_part
    kind: slide_right
    travel: 160
    surface: {texture: cvdor1, size: [128, 256]}
    tile: true
  - id: door:leaf_pass
    opening: open:leaf_hall_pass
    kind: slide_left
    leaves: 2
    split: across
    fold: true
    surface: {texture: hvdorc, size: [256, 256]}
  - id: door:leaf_seal
    opening: open:leaf_hall_seal
    kind: slide_left
    leaves: 2
    fold: true
    pictures:
      - [{texture: t1d1a, size: [256, 256]}, {texture: t1d1b, size: [256, 256]}]
      - [{texture: t1d1c, size: [256, 256]}, {texture: t1d1d, size: [256, 256]}]
  - id: door:pair
    opening: open:works_pair
    kind: slide_left
    leaves: 2
    surface: {texture: t1d2, size: [256, 256]}
    edge_surface: {texture: swr4dk, size: [64, 64]}
    notes: "Its leaves' free edges show swr4dk at their size (`edge_surface`), as Control Center's doors' edges do."
  - id: door:panels
    opening: open:nave_panels
    kind: slide_up
    surface: {texture: t1d2, size: [256, 256]}
    back_surface: {texture: bwooda1, size: [256, 256]}
  - id: door:side
    opening: open:works_side
    kind: slide_right
    notes: "Slides right, away from door:pair: both leaves of the pier between them would not fit in it (each goes 2 past its jamb, into the wall)."
  - id: door:sided
    opening: open:pass_sided
    surface: {texture: hvdorc, size: [256, 256]}
    notes: "A door with an event for each side of its leaf (wiring `side`): it opens from room:leaf_pass_cell only; from inside the cell it says that it will not budge."
  - id: door:split
    opening: open:works_split
    kind: slide_up
    leaves: 2
  - id: door:vault
    opening: open:trap_vault
    kind: slide_up
    secret: true
lifts:
  - id: lift:gallery
    room: room:gallery
    at: [1472, 1504]
    size: [160, 160]
    travel: 128
    speed: 64
  - id: lift:pod
    room: room:pod_bay
    at: [-2624, -448]
    size: [160, 160]
    travel: 264
    thickness: 16
    speed: 96
  - id: lift:ws_lift
    room: room:workshop
    at: [-5600, -880]
    size: [128, 128]
    travel: 128
    speed: 128
    state: up
    notes: "Starts raised: the monster over it stands on its top (328), not on the floor under it."
movers:
  - id: mover:bridge
    room: room:pit
    at: [-3392, 144]
    size: [510, 160]
    bottom: 160
    height: 32
    travel: [0, 256, 0]
    speed: 128
    top_surface: {texture: bwooda1, size: [256, 256]}
    kerbs:
      height: 24
      width: 16
    notes: "A bridge that slides sideways with its kerbs: at its start it lies along the south wall of the pit and joins nothing; at its end it lies between the two mouths. It stops 1 short of each wall: its ends in the walls' planes would lie over the next rooms' wall faces (those walls have no thickness) and flicker."
  - id: mover:gate_block
    room: room:gate_run
    at: [-2272, -608]
    size: [192, 64]
    height: 384
    travel: [0, 0, -386]
    speed: 160
    surface: {texture: t1d2, size: [256, 256]}
    notes: "A gate block from wall to wall and floor to ceiling: it sinks into the floor (its top ends 2 below it)."
  - id: mover:grow
    room: room:pit_west
    at: [-4192, 256]
    size: [64, 160]
    bottom: 160
    height: 32
    travel: [-448, 0, 0]
    speed: 128
    stretch: true
    top_surface: {texture: bwooda1, size: [256, 256]}
    kerbs:
      height: 24
      width: 16
    notes: "A bridge that grows: a stub at the east mouth whose west end face travels 448 to the far mouth."
  - id: mover:rig_button
