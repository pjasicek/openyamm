    at: [-120, 437]
    size: [32, 10]
    bottom: 96
    height: 32
    travel: [0, -8, 0]
    speed: 16
    surface: {texture: t1trima, size: [32, 32], scale: 2}
    notes: "A button that is pushed into its wall: at its end it stands 8 inside the south wall, where it is hidden."
  - id: mover:rig_deck
    room: room:rig
    at: [-496, 568]
    size: [128, 128]
    height: 16
    travel: [0, 0, 40]
    speed: 48
    top_surface: {texture: bwooda1, size: [256, 256]}
    parts:
      - {at: [-552, 512], size: [16, 16], height: 64}
      - {at: [-552, 624], size: [16, 16], height: 64}
    notes: "A deck that rises with what stands on it: two posts (parts of the mover), a chest and the button on its east side."
  - id: mover:rig_gate_high
    room: room:rig
    at: [-400, 568]
    size: [32, 272]
    bottom: 128
    height: 128
    travel: [0, 0, 130]
    speed: 64
    surface: {texture: t1d2, size: [256, 256]}
    notes: "The gate's upper half: it rises through the ceiling (256) and is hidden above it, its underside 2 over the ceiling's plane (in it the two would flicker)."
  - id: mover:rig_gate_low
    room: room:rig
    at: [-400, 568]
    size: [32, 272]
    height: 128
    travel: [0, 0, -130]
    speed: 64
    surface: {texture: t1d2, size: [256, 256]}
    notes: "The gate's lower half: it sinks into the floor."
  - id: mover:sink_plate
    room: room:gate_run
    at: [-2272, -448]
    size: [96, 96]
    height: 8
    travel: [0, 0, -10]
    speed: 16
    surface: {texture: t1trima, size: [32, 32], scale: 2}
    top_surface: {texture: d2ceil4, size: [256, 256]}
  - id: mover:tram
    room: room:gate_run
    at: [-2272, -832]
    size: [160, 160]
    bottom: -56
    height: 64
    travel: [0, -176, 128]
    speed: 64
    top_surface: {texture: bwooda1, size: [256, 256]}
    notes: "A block that travels sideways and up at once and carries the party: from the passage floor to the ledge of the room behind it."
  - id: mover:wall
